<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confessions &amp; Creeds · 5 Solas Quotes</title><meta name="description" content="Confessions &amp; Creeds — The Church"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231301"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../church.html">The Church</a> ›</p><h1>Confessions &amp; Creeds</h1><p class="sub">59 quotations from 15 authors</p><figure class="quote" id="q-2dfa75593b" data-kw="Author of sin Satan"><blockquote><p>Of the author of sin, we confess that our Lord God, though He is the creator and sustainer of all creatures, yet He is not the author of sin. It is rather the evil will, both in the Devil and in the godless human, that, when he does not obtain help from the Lord God, turns away from God, as Christ speaks in John 8, “When the Devil speaks a lie, he speaks of his own, for he is a liar and the father of lies” (v. 44).</p></blockquote><figcaption>— <a href="../../authors/bohemian-brethren.html">Bohemian Brethren</a>, <cite>The Bohemian Confession (1575/1609)</cite>, Art. 6</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“Of the author of sin, we confess that our Lord God, though He is the creator and sustainer of all creatures, yet He is not the author of sin. It is rather the evil will, both in the Devil and in the godless human, that, when he does not obtain help from the Lord God, turns away from God, as Christ speaks in John 8, “When the Devil speaks a lie, he speaks of his own, for he is a liar and the father of lies” (v. 44).”

— Bohemian Brethren, The Bohemian Confession (1575/1609), Art. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+the+author+of+sin%2C+we+confess+that+our+Lord+God%2C+though+He+is+the+creator+and+sustainer+of+all+creatures%2C+yet+He+is+not+the+author+of+sin.+It+is+rather+the+evil+will%2C+both+in+the+Devil+and+in+the+godless+human%2C+that%2C+when+he+does+not+obtain+help+from+the+Lord+God%2C+turns+away+from+God%2C+as+Christ+speaks+in+John+8%2C+%E2%80%9CWhen+the+Devil+speaks+a+lie%2C+he+speaks+of+his+own%2C+for+he+is+a+liar+and+the+father+of+lies%E2%80%9D+%28v.+44%29.%E2%80%9D%0A%0A%E2%80%94+Bohemian+Brethren%2C+The+Bohemian+Confession+%281575%2F1609%29%2C+Art.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2dfa75593b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2dfa75593b.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-e710bbc718" data-kw="Author of sin"><blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote><figcaption>— <a href="../../authors/benjamin-cox.html">Benjamin Cox</a>, <cite>An Appendix to a Confession of Faith (Baptist, 1646)</cite>, art. 3</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a></div><div class="actions"><button class="copy" data-copy="“Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).”

— Benjamin Cox, An Appendix to a Confession of Faith (Baptist, 1646), art. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+all+the+power+of+the+creature+to+act+is+from+the+Creator%2C+and+there+is+a+providence+of+God+always+extended+to+every+creature%2C+and+to+every+action+of+the+creature%3B+yet+we+judge+that+the+final+corruption+of+the+creature%2C+and+the+sinfulness+of+the+creature%E2%80%99s+action%2C+is+from+the+creature%2C+and+not+from+God%3B+and+that+it+is+a+great+sin+to+say+that+God+is+the+author+of+sin+%28Eccl.+7%3A29%3B+Hab.+1%3A13%3B+James+1%3A13%E2%80%9315%3A+1+Cor.+14%3A33%3B+1+John+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Cox%2C+An+Appendix+to+a+Confession+of+Faith+%28Baptist%2C+1646%29%2C+art.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe710bbc718.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e710bbc718.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin Hardening Justice Depravity"><blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>The Second Helvetic Confession (1566)</cite>, ch. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.”

— Heinrich Bullinger, The Second Helvetic Confession (1566), ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYes%2C+there+is+even+in+ourselves+sin+and+corruption+enough%2C+so+that+there+is+no+need+that+God+should+infuse+into+us+either+a+new+or+greater+measure+of+wickedness.+Therefore%2C+when+God+is+said+in+the+Scripture+to+harden+%28Ex.+7%3A13%29%2C+to+blind+%28John+12%3A40%29+and+to+deliver+us+up+into+a+reprobate+sense+%28Rom.+1%3A28%29%2C+it+is+to+be+understood+that+God+does+it+by+just+judgment%2C+as+a+just+judge+and+avenger.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession+%281566%29%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc71e2bebb7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c71e2bebb7.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall"><blockquote><p>And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote><figcaption>— <a href="../../authors/synod-of-debrecen.html">Synod of Debrecen</a>, <cite>Documents of the Synod of Debrecen (1567)</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).”

— Synod of Debrecen, Documents of the Synod of Debrecen (1567)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+just+as+he+that+wishes+to+punish+someone+by+fumigating+with+a+foul+smell%2C+sulfur+and+dung%2C+does+not+put+a+foul+smell+into+the+sulfur+and+dung+%28it+already+is+there%29%2C+so+God%2C+when+He+punishes+sins+through+the+devil+and+the+vessels+of+wrath+with+sins%2C+does+not+put+any+sin+into+them%2C+but+it+is+there+naturally+since+the+fall+in+the+devil+and+in+men+%28Eph.+4%3B+Rom.+1%29.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Debrecen%2C+Documents+of+the+Synod+of+Debrecen+%281567%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F215040d6fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/215040d6fd.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c93619138f" data-kw="Hardening Justice Satan"><blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 5.6</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.”

— Westminster Assembly, Westminster Confession of Faith, 5.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+those+wicked+and+ungodly+men+whom+God%2C+as+a+righteous+judge%2C+for+former+sins%2C+doth+blind+and+harden%3B+from+them+He+not+only+withholdeth+his+grace%2C+whereby+they+might+have+been+enlightened+in+their+understandings%2C+and+wrought+upon+in+their+hearts%3B+but+sometimes+also+withdraweth+the+gifts+which+they+had%2C+and+exposeth+them+to+such+objects+as+their+corruption+makes+occasions+of+sin%3B+and+withal%2C+gives+them+over+to+their+own+lusts%2C+the+temptations+of+the+world%2C+and+the+power+of+Satan.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+5.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc93619138f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c93619138f.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall"><blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 5.4</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a></div><div class="actions"><button class="copy" data-copy="“The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 5.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+almighty+power%2C+unsearchable+wisdom%2C+and+infinite+goodness+of+God%2C+so+far+manifest+themselves+in+His+providence%2C+that+His+determinate+counsel+extends+itself+even+to+the+first+fall%2C+and+all+other+sinful+actions+both+of+angels+and+men+%28Rom.+11%3A32%E2%80%9334%3B+2+Sam.+24%3A1%3B+1+Chron.+21%3A1%29%3B+and+that+not+by+a+bare+permission%2C+which+also+He+most+wisely+and+powerfully+bounds%2C+and+otherwise+orders+and+governs+%282+Kings+19%3A28%3B+Ps.+76%3A10%29%2C+in+a+manifold+dispensation+to+His+most+holy+ends+%28Gen.+50%3A20%3B+Isa.+10%3A6%E2%80%937%2C+12%29%3B+yet+so%2C+as+the+sinfulness+of+their+acts+proceeds+only+from+the+creatures%2C+and+not+from+God%2C+who%2C+being+most+holy+and+righteous%2C+neither+is+nor+can+be+the+author+or+approver+of+sin+%28Ps.+50%3A21%3B+1+John+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+5.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F86e8b1fd52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/86e8b1fd52.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-5636806dec" data-kw="Sovereignty Author of sin Satan"><blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote><figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 13</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/sovereignty.html">Sovereignty</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.”

— Guido de Brès, Belgic Confession, Art. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+believe+that+the+same+good+God%2C+after+He+had+created+all+things%2C+did+not+forsake+them+or+give+them+up+to+fortune+or+chance%2C+but+that+He+rules+and+governs+them+according+to+His+holy+will%2C+so+that+nothing+happens+in+this+world+without+His+appointment%3B+nevertheless%2C+God+neither+is+the+author+of+nor+can+be+charged+with+the+sins+which+are+committed.+For+His+power+and+goodness+are+so+great+and+incomprehensible+that+He+orders+and+executes+His+work+in+the+most+excellent+and+just+manner%2C+even+then+when+devils+and+wicked+men+act+unjustly.%E2%80%9D%0A%0A%E2%80%94+Guido+de+Br%C3%A8s%2C+Belgic+Confession%2C+Art.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5636806dec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5636806dec.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/belgic-confession" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin Satan"><blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote><figcaption>— <a href="../../authors/french-reformed-churches.html">French Reformed Churches</a>, <cite>The French Confession (1559)</cite>, Art. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.”

od/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“And this is the decree of reprobation, which by no means makes God the Author of sin (the very thought of which is blasphemy), but declares Him to be an awful, irreprehensible, and righteous Judge and Avenger thereof.”

cation.html">Mortification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).”

 hate all sin and take pleasure in all righteousness (Rom. 7:7–8).”

l">Contentment</a></div><div class="actions"><button class="copy" data-copy="“Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).”

n/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.”

rance</a></div><div class="actions"><button class="copy" data-copy="“This infallible assurance does not so belong to the essence of faith, but that a true believer may wait long, and struggle with many difficulties before he be partaker of it; yet being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of means, attain thereunto: and therefore it is the duty of every one to give all diligence to make his calling and election sure…”

t are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.”

— Particular Baptists, First London Baptist Confession (1644), Art. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+the+tender+of+the+gospel+to+the+conversion+of+sinners%2C+is+absolutely+free+%28John+3%3A14%E2%80%9315%3B+1%3A12%3B+Isa.+55%3A1%3B+John+7%3A37%29%2C+no+way+requiring%2C+as+absolutely+necessary%2C+any+qualifications%2C+preparations%2C+terrors+of+the+law%2C+or+preceding+ministry+of+the+law%2C+but+only+and+alone+the+naked+soul%2C+as+a+sinner+and+ungodly+to+receive+Christ+%281+Tim.+1%3A15%3B+Rom.+4%3A5%3B+5%3A8%29%2C+as+crucified%2C+dead%2C+and+buried%2C+and+risen+again%2C+being+made+a+prince+and+a+Savior+for+such+sinners%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+First+London+Baptist+Confession+%281644%29%2C+Art.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb228d71e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fb228d71e6.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-57754a76e9" data-kw=""><blockquote><p>Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace…</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Larger Catechism</cite>, Q. 80</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace…”

— Westminster Assembly, Westminster Larger Catechism, Q. 80">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSuch+as+truly+believe+in+Christ%2C+and+endeavour+to+walk+in+all+good+conscience+before+him+%281+John+2%3A3%29%2C+may%2C+without+extraordinary+revelation%2C+by+faith+grounded+upon+the+truth+of+God%E2%80%99s+promises%2C+and+by+the+Spirit+enabling+them+to+discern+in+themselves+those+graces+to+which+the+promises+of+life+are+made+%281+Cor.+2%3A12%3B+1+John+3%3A14%2C+18%E2%80%9319%2C+21%2C+24%3B+4%3A13%2C+16%3B+Heb.+6%3A11%E2%80%9312%29%2C+and+bearing+witness+with+their+spirits+that+they+are+the+children+of+God+%28Rom.+8%3A16%29%2C+be+infallibly+assured+that+they+are+in+the+estate+of+grace%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Larger+Catechism%2C+Q.+80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57754a76e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/57754a76e9.html">Permalink</a><a class="src" href="https://opc.org/lc.html" target="_blank" rel="noopener">Read it online · OPC</a></div></figure><figure class="quote" id="q-1ef2c0c632" data-kw=""><blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 12</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.”

lass="copy" data-copy="“Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate…”

ce</a></div><div class="actions"><button class="copy" data-copy="“Who teach: That there is in this life no fruit and no consciousness of the unchangeable election to glory, nor any certainty, except that which depends on a changeable and uncertain condition. For not only is it absurd to speak of an uncertain certainty, but also contrary to the experience of the saints, who by virtue of the consciousness of their election rejoice with the apostle and praise this favor of God (Eph. 1)…”

nal life. This promise, together with the command to repent and believe, ought to be declared and published to all nations, and to all persons promiscuously and without distinction, to whom God out of His good pleasure sends the gospel.”

— Synod of Dort, The Canons of Dort, Head 2, Art. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoreover%2C+the+promise+of+the+gospel+is+that+whosoever+believes+in+Christ+crucified+shall+not+perish%2C+but+have+eternal+life.+This+promise%2C+together+with+the+command+to+repent+and+believe%2C+ought+to+be+declared+and+published+to+all+nations%2C+and+to+all+persons+promiscuously+and+without+distinction%2C+to+whom+God+out+of+His+good+pleasure+sends+the+gospel.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+2%2C+Art.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef43ff0e01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ef43ff0e01.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-099f204dae" data-kw=""><blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Heads 3–4, Art. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a></div><div class="actions"><button class="copy" data-copy="“As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.”

— Synod of Dort, The Canons of Dort, Heads 3–4, Art. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+many+as+are+called+by+the+gospel+are+unfeignedly+called.+For+God+has+most+earnestly+and+truly+declared+in+His+Word+what+is+acceptable+to+Him%2C+namely%2C+that+those+who+are+called+should+come+unto+Him.+He+also+seriously+promises+rest+of+soul+and+eternal+life+to+all+who+come+to+Him+and+believe.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Heads+3%E2%80%934%2C+Art.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F099f204dae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/099f204dae.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-f56c205734" data-kw=""><blockquote><p>Of this preservation of the elect to salvation and of their perseverance in the faith, true believers themselves may and do obtain assurance according to the measure of their faith, whereby they surely believe that they are and ever will continue true and living members of the Church, and that they have the forgiveness of sins and life eternal.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 5, Art. 9</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a></div><div class="actions"><button class="copy" data-copy="“Of this preservation of the elect to salvation and of their perseverance in the faith, true believers themselves may and do obtain assurance according to the measure of their faith, whereby they surely believe that they are and ever will continue true and living members of the Church, and that they have the forgiveness of sins and life eternal.”

— Synod of Dort, The Canons of Dort, Head 5, Art. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+this+preservation+of+the+elect+to+salvation+and+of+their+perseverance+in+the+faith%2C+true+believers+themselves+may+and+do+obtain+assurance+according+to+the+measure+of+their+faith%2C+whereby+they+surely+believe+that+they+are+and+ever+will+continue+true+and+living+members+of+the+Church%2C+and+that+they+have+the+forgiveness+of+sins+and+life+eternal.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+5%2C+Art.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff56c205734.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f56c205734.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-7c73d67f29" data-kw=""><blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 5, Art. 10</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a></div><div class="actions"><button class="copy" data-copy="“This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.”

— Synod of Dort, The Canons of Dort, Head 5, Art. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+assurance%2C+however%2C+is+not+produced+by+any+peculiar+revelation+contrary+to+or+independent+of+the+Word+of+God%2C+but+springs+from+faith+in+God%E2%80%99s+promises%2C+which+He+has+most+abundantly+revealed+in+His+Word+for+our+comfort%3B+from+the+testimony+of+the+Holy+Spirit%2C+witnessing+with+our+spirit+that+we+are+children+and+heirs+of+God+%28Rom.+8%3A16%29%3B+and+lastly%2C+from+a+serious+and+holy+desire+to+preserve+a+good+conscience+and+to+perform+good+works.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+5%2C+Art.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c73d67f29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c73d67f29.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-094fd40078" data-kw=""><blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/polemics/arminianism.html">Arminianism</a><a class="tag" href="../../topics/salvation/assurance.html"> rent="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/church/nature-and-marks.html">Nature &amp; Marks</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a></div><div class="actions"><button class="copy" data-copy="“That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).”

"copy" data-copy="“We, therefore, condemn those who seek other than in Christ, whether they are chosen from all eternity, and what God has decreed of them before all beginning. For men must hear the gospel preached and believe it. If you believe and are in Christ, you may undoubtedly reckon that you are elected. For the Father has revealed unto us in Christ His eternal sentence of predestination…”

— Heinrich Bullinger, The Second Helvetic Confession (1566), ch. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+therefore%2C+condemn+those+who+seek+other+than+in+Christ%2C+whether+they+are+chosen+from+all+eternity%2C+and+what+God+has+decreed+of+them+before+all+beginning.+For+men+must+hear+the+gospel+preached+and+believe+it.+If+you+believe+and+are+in+Christ%2C+you+may+undoubtedly+reckon+that+you+are+elected.+For+the+Father+has+revealed+unto+us+in+Christ+His+eternal+sentence+of+predestination%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession+%281566%29%2C+ch.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa34880204e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a34880204e.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-b096402687" data-kw=""><blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful…</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>The Second Helvetic Confession (1566)</cite>, ch. 10</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful…”

d to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.”

g salvation through Christ.”

ics/scripture/scripture-vs-tradition.html">Scripture vs. Tradition</a></div><div class="actions"><button class="copy" data-copy="“We believe that the word, contained in these books, came from one God; of whom alone, and not of men, the authority thereof dependeth. … it is not lawful to oppose either antiquity, custom, multitude, man&#x27;s wisdom and judgment, or edicts, or any decrees, or councils, or visions, or miracles, unto this holy Scripture; but rather that all things ought to be examined and tried by the rule and square thereof.”

n</a></div><div class="actions"><button class="copy" data-copy="“therefore no other writings of men, although never so holy, no custom, no multitude, no antiquity, nor prescription of times, nor personal succession, nor any councils; and, to conclude, no decrees or ordinances of men, are to be matched or compared with these divine Scriptures, and this bare truth of God; for so much as God&#x27;s truth excelleth all things. For all men of their own nature are liars, and lighter than vanity itself”

ure vs. Tradition</a></div><div class="actions"><button class="copy" data-copy="“So far then as the Council proveth the determination and commandment that it giveth by the plain word of God, so soon do we reverence and embrace the same. But if men, under the name of a Council, pretend to forge unto us new articles of our faith, or to make constitutions repugnant to the word of God, then utterly we must refuse the same, as the doctrine of devils, which draweth our souls from the voice of our only God, to follow the doctrine and constitutions of men.”

— Scottish Reformers, The Scots Confession (1560), Art. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+far+then+as+the+Council+proveth+the+determination+and+commandment+that+it+giveth+by+the+plain+word+of+God%2C+so+soon+do+we+reverence+and+embrace+the+same.+But+if+men%2C+under+the+name+of+a+Council%2C+pretend+to+forge+unto+us+new+articles+of+our+faith%2C+or+to+make+constitutions+repugnant+to+the+word+of+God%2C+then+utterly+we+must+refuse+the+same%2C+as+the+doctrine+of+devils%2C+which+draweth+our+souls+from+the+voice+of+our+only+God%2C+to+follow+the+doctrine+and+constitutions+of+men.%E2%80%9D%0A%0A%E2%80%94+Scottish+Reformers%2C+The+Scots+Confession+%281560%29%2C+Art.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4caaa5bee8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4caaa5bee8.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-ac32f176d6" data-kw=""><blockquote><p>The Supreme Judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Spirit speaking in the Scripture.</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 1.10</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a><a class="tag" href="../../topics/scripture/scripture-vs-tradition.html">Scripture vs. Tradition</a></div><div class="actions"><button class="copy" data-copy="“The Supreme Judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of — Westminster Assembly, Westminster Confession of Faith, 1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Supreme+Judge%2C+by+which+all+controversies+of+religion+are+to+be+determined%2C+and+all+decrees+of+councils%2C+opinions+of+ancient+writers%2C+doctrines+of+men%2C+and+private+spirits%2C+are+to+be+examined%2C+and+in+whose+sentence+we+are+to+rest%2C+can+be+no+other+but+the+Holy+Spirit+speaking+in+the+Scripture.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac32f176d6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ac32f176d6.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-22b111434a" data-kw=""><blockquote><p>The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 1.1, 1.6</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 1.1, 1.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Holy+Scripture+is+the+only+sufficient%2C+certain+and+infallible+rule+of+all+saving+knowledge%2C+faith+and+obedience+%E2%80%A6+The+whole+counsel+of+God+concerning+all+things+necessary+for+his+own+glory%2C+man%E2%80%99s+salvation%2C+faith+and+life%2C+is+either+expressly+set+down+or+necessarily+contained+in+the+Holy+Scripture%3A+unto+which+nothing+at+any+time+is+to+be+added%2C+whether+by+new+revelation+of+the+Spirit%2C+or+traditions+of+men.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+1.1%2C+1.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22b111434a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/22b111434a.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-738aac8891" data-kw=""><blockquote><p>As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and Pastor</p></blockquote><figcaption>— <a href="../../authors/scottish-reformers.html">Scottish Reformers</a>, <cite>The Scots Confession (1560)</cite>, Art. 19</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and Pastor”

s ever accompanied with all other saving graces, and is no dead faith, but worketh by love.”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 11.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFaith+thus+receiving+and+resting+on+Christ+and+his+righteousness%2C+is+the+alone+instrument+of+justification%3B+yet+it+is+not+alone+in+the+person+justified%2C+but+is+ever+accompanied+with+all+other+saving+graces%2C+and+is+no+dead+faith%2C+but+worketh+by+love.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+11.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe9bc94792c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e9bc94792c.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-08031f199d" data-kw=""><blockquote><p>Why do you say that through faith alone you are righteous? Not because I please God by the worthiness of my faith. It is because only Christ’s satisfaction, righteousness, and holiness make me righteous before God, and because I can accept this righteousness and make it mine in no other way than through faith (1 Cor. 1:30–31; Rom. 10:10; 1 John 5:10–12).</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a>, <cite>Heidelberg Catechism</cite>, Q. 61</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a></div><div class="actions"><button class="copy" data-copy="“Why do you say that through faith alone you are righteous? Not because I please God by the worthiness of my faith. It is because only Christ’s satisfaction, righteousness, and holiness make me righteous before God, and because I can accept this righteousness and make it mine in no other way than through faith (1 Cor. 1:30–31; Rom. 10:10; 1 John 5:10–12).”

— Zacharias Ursinus &amp; Caspar Olevianus, Heidelberg Catechism, Q. 61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhy+do+you+say+that+through+faith+alone+you+are+righteous%3F+Not+because+I+please+God+by+the+worthiness+of+my+faith.+It+is+because+only+Christ%E2%80%99s+satisfaction%2C+righteousness%2C+and+holiness+make+me+righteous+before+God%2C+and+because+I+can+accept+this+righteousness+and+make+it+mine+in+no+other+way+than+through+faith+%281+Cor.+1%3A30%E2%80%9331%3B+Rom.+10%3A10%3B+1+John+5%3A10%E2%80%9312%29.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus+%26+Caspar+Olevianus%2C+Heidelberg+Catechism%2C+Q.+61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F08031f199d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/08031f199d.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-5444a34f69" data-kw=""><blockquote><p>So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote><figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 24</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/polemics/rome-merit.html">Rome: Merit</a><a class="tag" href="../../topics/christian-life/good-works.html">Obedience &amp; Good Works</a></div><div class="actions"><button class="copy" data-copy="“So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).”

— Guido de Brès, Belgic Confession, Art. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+then%2C+we+do+good+works%2C+but+not+for+merit%E2%80%94+for+what+would+we+merit%3F+Rather%2C+we+are+indebted+to+God+for+the+good+works+we+do%2C+and+not+God+to+us%2C+since+God+%E2%80%9Cis+at+work+in+%5Bus%5D%2C+enabling+%5Bus%5D+both+to+will+and+to+work+for+his+good+pleasure%E2%80%9D+%28Phil.+2%3A13%29.%E2%80%9D%0A%0A%E2%80%94+Guido+de+Br%C3%A8s%2C+Belgic+Confession%2C+Art.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5444a34f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5444a34f69.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/belgic-confession" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-86ce0050dd" data-kw=""><blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 11.3</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/work-of-christ/satisfaction.html">Satisfaction</a></div><div class="actions"><button class="copy" data-copy="“Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).”

rticular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 11.5</figcaption><div class="meta"><a class="tag here" href="../../topics/church/confessions.html" aria-current="page">Confessions &amp; Creeds</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a></div><div class="actions"><button class="copy" data-copy="“God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).”

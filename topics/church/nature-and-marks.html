— A. A. Hodge, Outlines of Theology, p. 99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+claim%2C+as+it+rests+upon+the+authority+of+the+Pope%2C+is+utterly+unscriptural%2C+because+the+Pope+is+not+known+to+Scripture.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+Outlines+of+Theology%2C+p.+99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc793e92df6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c793e92df6.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-e515d7fb38" data-kw=""><blockquote><p>Secondly, the pope is not infallible in doctrine or in practice. Some have been exceptionally ungodly, having been fornicators, occultists, heretics, and atheists; this has been confirmed by papal chroniclers. How can such individuals function as infallible judges in disputes that relate to doctrinal issues?</p></blockquote><figcaption>— <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a>, <cite>The Christian&#x27;s Reasonable Service</cite>, Vol. 1, p. 55</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome-papacy.html">Rome: The Papacy</a></div><div class="actions"><button class="copy" data-copy="“Secondly, the pope is not infallible in doctrine or in practice. Some have been exceptionally ungodly, having been fornicators, occultists, heretics, and atheists; this has been confirmed by papal chroniclers. How can such individuals function as infallible judges in disputes that relate to doctrinal issues?”

— Wilhelmus à Brakel, The Christian&#x27;s Reasonable Service, Vol. 1, p. 55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+the+pope+is+not+infallible+in+doctrine+or+in+practice.+Some+have+been+exceptionally+ungodly%2C+having+been+fornicators%2C+occultists%2C+heretics%2C+and+atheists%3B+this+has+been+confirmed+by+papal+chroniclers.+How+can+such+individuals+function+as+infallible+judges+in+disputes+that+relate+to+doctrinal+issues%3F%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%27s+Reasonable+Service%2C+Vol.+1%2C+p.+55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe515d7fb38.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e515d7fb38.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-45a2923674" data-kw=""><blockquote><p>The Romish doctrine is precisely the reverse. Romanists teach that the chaff is the wheat; that the chaff becomes wheat by external connection with the precious grain.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, on the Church, p. 168</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome.html">Rome (General)</a></div><div class="actions"><button class="copy" data-copy="“The Romish doctrine is precisely the reverse. Romanists teach that the chaff is the wheat; that the chaff becomes wheat by external connection with the precious grain.”

— Charles Hodge, Systematic Theology, on the Church, p. 168">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Romish+doctrine+is+precisely+the+reverse.+Romanists+teach+that+the+chaff+is+the+wheat%3B+that+the+chaff+becomes+wheat+by+external+connection+with+the+precious+grain.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+on+the+Church%2C+p.+168&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F45a2923674.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/45a2923674.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-7ebe514946" data-kw=""><blockquote><p>Whence I observe, That all those who will be saved, must depart and separate themselves from the faith and religion of this present Church of Rome.</p></blockquote><figcaption>— <a href="../../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, on Rev. 18:4, p. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome.html">Rome (General)</a></div><div class="actions"><button class="copy" data-copy="“Whence I observe, That all those who will be saved, must depart and separate themselves from the faith and religion of this present Church of Rome.”

— William Perkins, A Reformed Catholic, on Rev. 18:4, p. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhence+I+observe%2C+That+all+those+who+will+be+saved%2C+must+depart+and+separate+themselves+from+the+faith+and+religion+of+this+present+Church+of+Rome.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+on+Rev.+18%3A4%2C+p.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ebe514946.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7ebe514946.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" target="_blank" rel="noopener">Read it online · Internet Archive (1597 ed.)</a></div></figure><figure class="quote" id="q-24bf54aa64" data-kw=""><blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote><figcaption>— <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a>, <cite>Of the Papists&#x27; Damnable Faith</cite>, p. 8, Third Conclusion</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome.html">Rome (General)</a></div><div class="actions"><button class="copy" data-copy="“We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.”

— Gisbertus Voetius, Of the Papists&#x27; Damnable Faith, p. 8, Third Conclusion">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+deny+that+Papalism%2C+or+the+faith+of+the+Papists+according+to+the+Roman+formula+and+the+prescription+of+the+Council+of+Trent%2C+considered+abstractly+and+in+itself%2C+is+salutary+%28that+is%2C+that+it+is+meritorious+of+salvation%2C+or+a+cause%2C+or+a+means%2C+or+a+sine+qua+non+condition%2C+or+the+way+through+which+it+is+obtained%29%3B+but+on+the+contrary%2C+we+say+that+it+is+damnable.+For+considered+formally%2C+it+is+composed+of+mere+errors%2C+heresies%2C+idolatry%2C+and+superstitions.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Of+the+Papists%27+Damnable+Faith%2C+p.+8%2C+Third+Conclusion&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24bf54aa64.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/24bf54aa64.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-75fb9ddff4" data-kw=""><blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote><figcaption>— <a href="../../authors/martin-luther.html">Martin Luther</a>, <cite>Commentary on Galatians</cite>, p. 214</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome-papacy.html">Rome: The Papacy</a></div><div class="actions"><button class="copy" data-copy="“The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;”

— Martin Luther, Commentary on Galatians, p. 214">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle%27s+attack+upon+the+false+apostles+was+not+unjustified.+Neither+are+our+attacks+upon+the+papacy.+When+we+call+the+Pope+the+Antichrist+and+his+minions+an+evil+brood%2C+we+do+not+slander+them.+We+merely+judge+them+by+the+touchstone+of+God%27s+Word+recorded+in+the+first+chapter+of+this+Epistle%3A+%22Though+we%2C+or+an+angel+from+heaven%2C+preach+any+other+gospel+unto+you+than+that+which+we+have+preached+unto+you%2C+let+him+be+accursed.%22%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+p.+214&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75fb9ddff4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/75fb9ddff4.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-3d3581611a" data-kw=""><blockquote><p>Daniel and Paul foretold that Antichrist would sit in the temple of God, (Dan. 9: 27; 2 Thess. 2: 4;) we regard the Roman Pontiff as the leader and standard-bearer of that wicked and abominable kingdom.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.2.12</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome-papacy.html">Rome: The Papacy</a></div><div class="actions"><button class="copy" data-copy="“Daniel and Paul foretold that Antichrist would sit in the temple of God, (Dan. 9: 27; 2 Thess. 2: 4;) we regard the Roman Pontiff as the leader and standard-bearer of that wicked and abominable kingdom.”

— John Calvin, Institutes of the Christian Religion, 4.2.12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDaniel+and+Paul+foretold+that+Antichrist+would+sit+in+the+temple+of+God%2C+%28Dan.+9%3A+27%3B+2+Thess.+2%3A+4%3B%29+we+regard+the+Roman+Pontiff+as+the+leader+and+standard-bearer+of+that+wicked+and+abominable+kingdom.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.2.12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3d3581611a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3d3581611a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-dd5daca24a" data-kw=""><blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.7.24</figcaption><div class="meta"><a class="tag here" href="../../topics/church/nature-and-marks.html" aria-current="page">Nature &amp; Marks</a><a class="tag" href="../../topics/polemics/rome-papacy.html">Rome: The Papacy</a></div><div class="actions"><button class="copy" data-copy="“Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in on. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.”

m it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.”

ies of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.”

hs with such blasphemies as to affirm that the Lord Christ did as much manifest his divinity and power in such beasts as in his own person.”

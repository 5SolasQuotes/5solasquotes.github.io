<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Justification · 5 Solas Quotes</title><meta name="description" content="Justification — Salvation Applied"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231301"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../salvation.html">Salvation Applied</a> ›</p><h1>Justification</h1><p class="sub">12 quotations from 11 authors</p><figure class="quote" id="q-e399ae0de2" data-kw="Imputation Forgiveness"><blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.11</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.”

— John Calvin, Institutes of the Christian Religion, 3.3.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSin%2C+however%2C+though+it+ceases+to+reign%2C+ceases+not+to+dwell+in+them.+%E2%80%A6+We+admit+that+these+remains%2C+just+as+if+they+had+no+existence%2C+are+not+imputed%2C+but+we%2C+at+the+same+time%2C+contend+that+it+is+owing+to+the+mercy+of+God+that+the+saints+are+not+charged+with+the+guilt+which+would+otherwise+make+them+sinners+before+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe399ae0de2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e399ae0de2.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin Regeneration Imputation"><blockquote><p>Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.21</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.”

— Francis Turretin, Institutes of Elenctic Theology, 9.11.21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+by+regeneration+we+hold+that+the+guilt+and+pollution+of+original+sin+is+taken+away+as+to+dominion+%28because+it+is+neither+imputed+to+them+anymore+for+condemnation%2C+nor+does+it+reign+in+them%29%2C+yet+we+deny+that+it+is+absolutely+taken+away+as+to+existence+and+whatever+holds+the+relation+of+sin+in+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.11.21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd141cab0f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d141cab0f1.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9e4c276079" data-kw=""><blockquote><p>It is one thing that there should be no condemnation in the renewed; another that they are worthy of condemnation and of hatred. The former Paul states in Rom. 8:1 because actual guilt is removed by the grace of justification, but not the latter.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.23</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a></div><div class="actions"><button class="copy" data-copy="“It is one thing that there should be no condemnation in the renewed; another that they are worthy of condemnation and of hatred. The former Paul states in Rom. 8:1 because actual guilt is removed by the grace of justification, but not the latter.”

— Francis Turretin, Institutes of Elenctic Theology, 9.11.23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+one+thing+that+there+should+be+no+condemnation+in+the+renewed%3B+another+that+they+are+worthy+of+condemnation+and+of+hatred.+The+former+Paul+states+in+Rom.+8%3A1+because+actual+guilt+is+removed+by+the+grace+of+justification%2C+but+not+the+latter.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.11.23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e4c276079.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9e4c276079.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c4db61a2d0" data-kw="Imputation Forgiveness"><blockquote><p>That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+concupiscence+does+not+condemn+the+regenerate%2C+comes+to+pass+by+an+accident%2C+which+is+the+grace+of+God%2C+which+does+not+impute+it+to+the+faithful.+This%2C+however%2C+does+not+occur+in+this+way%2C+as+though+concupiscence+were+no+sin%3B+for+other+sins+in+like+manner+do+not+condemn+the+regenerate%2C+not+because+they+are+no+sins%2C+but+because+they+have+obtained+the+pardon+of+them+through+Christ.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4db61a2d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c4db61a2d0.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-c862a4f6cf" data-kw=""><blockquote><p>The commanding power of the law in positive precepts and prohibitions, which justified persons are subject unto, does make and constitute all their unconformities unto it to be no less truly and properly sins in their own nature, than they would be if their persons were obnoxious unto the curse of it.</p></blockquote><figcaption>— <a href="../../authors/john-owen.html">John Owen</a>, <cite>The Doctrine of Justification by Faith</cite>, ch. 5</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“The commanding power of the law in positive precepts and prohibitions, which justified persons are subject unto, does make and constitute all their unconformities unto it to be no less truly and properly sins in their own nature, than they would be if their persons were obnoxious unto the curse of it.”

— John Owen, The Doctrine of Justification by Faith, ch. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+commanding+power+of+the+law+in+positive+precepts+and+prohibitions%2C+which+justified+persons+are+subject+unto%2C+does+make+and+constitute+all+their+unconformities+unto+it+to+be+no+less+truly+and+properly+sins+in+their+own+nature%2C+than+they+would+be+if+their+persons+were+obnoxious+unto+the+curse+of+it.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Doctrine+of+Justification+by+Faith%2C+ch.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc862a4f6cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c862a4f6cf.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/just" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-14cd8c458c" data-kw="Imputation Forgiveness"><blockquote><p>Indeed it remains till death, and it is sin considered in itself, so long as it remains, but it is not imputed unto the person: and in that respect is as though it were not; it being pardoned.</p></blockquote><figcaption>— <a href="../../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, Of Original Sin</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“Indeed it remains till death, and it is sin considered in itself, so long as it remains, but it is not imputed unto the person: and in that respect is as though it were not; it being pardoned.”

— William Perkins, A Reformed Catholic, Of Original Sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIndeed+it+remains+till+death%2C+and+it+is+sin+considered+in+itself%2C+so+long+as+it+remains%2C+but+it+is+not+imputed+unto+the+person%3A+and+in+that+respect+is+as+though+it+were+not%3B+it+being+pardoned.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+Of+Original+Sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14cd8c458c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/14cd8c458c.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" target="_blank" rel="noopener">Read it online · Internet Archive (1597 ed.)</a></div></figure><figure class="quote" id="q-7a4fb6c806" data-kw="Forgiveness"><blockquote><p>We teach that the guilt of sin as to its legal being is entirely taken away, so that the obligation to punishment is removed, and the power obligating to condemnation; but sin remains as to its real being, and physical inherence.</p></blockquote><figcaption>— <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a>, <cite>Examination of Arminianism</cite>, ch. 6 (On Original Sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a></div><div class="actions"><button class="copy" data-copy="“We teach that the guilt of sin as to its legal being is entirely taken away, so that the obligation to punishment is removed, and the power obligating to condemnation; but sin remains as to its real being, and physical inherence.”

— Samuel Rutherford, Examination of Arminianism, ch. 6 (On Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+teach+that+the+guilt+of+sin+as+to+its+legal+being+is+entirely+taken+away%2C+so+that+the+obligation+to+punishment+is+removed%2C+and+the+power+obligating+to+condemnation%3B+but+sin+remains+as+to+its+real+being%2C+and+physical+inherence.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Examination+of+Arminianism%2C+ch.+6+%28On+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7a4fb6c806.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7a4fb6c806.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-97321aa156" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a></div><div class="actions"><button class="copy" data-copy="“This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).”

— Westminster Assembly, Westminster Confession of Faith, 6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+corruption+of+nature%2C+during+this+life%2C+doth+remain+in+those+that+are+regenerated+%281+John+1%3A8%2C+10%3B+Rom.+7%3A14%2C+17%E2%80%9318%2C+23%3B+James+3%3A2%3B+Prov.+20%3A9%3B+Eccl.+7%3A20%29%3B+and+although+it+be%2C+through+Christ%2C+pardoned+and+mortified%3B+yet+both+itself%2C+and+all+the+motions+thereof%2C+are+truly+and+properly+sin+%28Rom.+7%3A5%2C+7%E2%80%938%2C+25%3B+Gal.+5%3A17%29.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97321aa156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/97321aa156.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a></div><div class="actions"><button class="copy" data-copy="“The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+corruption+of+nature%2C+during+this+life%2C+does+remain+in+those+that+are+regenerated+%28Rom.+7%3A18%2C+23%3B+Eccl.+7%3A20%3B+1+John+1%3A8%29%3B+and+although+it+be+through+Christ+pardoned+and+mortified%2C+yet+both+itself%2C+and+the+first+motions+thereof%2C+are+truly+and+properly+sin+%28Rom.+7%3A23%E2%80%9325%3B+Gal.+5%3A17%29.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F429a546bdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/429a546bdb.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-76fc53ecbc" data-kw="Regeneration Sanctification"><blockquote><p>Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.</p></blockquote><figcaption>— <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>Spiritual Union and Communion</cite>, Introduction</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a></div><div class="actions"><button class="copy" data-copy="“Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.”

— Arthur W. Pink, Spiritual Union and Communion, Introduction">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUnion+with+Christ+is+the+foundation+of+all+spiritual+blessings%2C+so+that+if+there+had+been+no+connection+with+Him%2C+there+could+be+no+regeneration%2C+no+justification%2C+no+sanctification%2C+no+glorification.+It+is+so+in+the+natural+world%E2%80%94adumbrating+the+spiritual%3A+sever+one+of+the+members+from+my+physical+body%2C+and+it+is+dead%3B+only+by+its+union+with+my+person+does+it+partake+of+life.%E2%80%9D%0A%0A%E2%80%94+Arthur+W.+Pink%2C+Spiritual+Union+and+Communion%2C+Introduction&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76fc53ecbc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/76fc53ecbc.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9b16df32c0" data-kw="Imputation"><blockquote><p>When they demand, How can we be justified by the righteousness of another? Can I be rich with another man&#x27;s money, or preferred by another man&#x27;s honours? Our answer is, yes, if that other be my surety or husband. Indeed Peter can not be justified by the righteousness of Paul; but both may be justified by the righteousness of Christ imputed to them; they being members, jointly knit to one common Head. Principal and surety are one in obligations and constructions of law. Head and members are one body, branch and stock are one tree; and it is no strange thing to see a graff live by the sap of another stock, when once it is ingrafted into it.</p></blockquote><figcaption>— <a href="../../authors/john-flavel.html">John Flavel</a>, <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), reality of the union, 2nd proof</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“When they demand, How can we be justified by the righteousness of another? Can I be rich with another man&#x27;s money, or preferred by another man&#x27;s honours? Our answer is, yes, if that other be my surety or husband. Indeed Peter can not be justified by the righteousness of Paul; but both may be justified by the righteousness of Christ imputed to them; they being members, jointly knit to one common Head. Principal and surety are one in obligations and constructions of law. Head and members are one body, branch and stock are one tree; and it is no strange thing to see a graff live by the sap of another stock, when once it is ingrafted into it.”

— John Flavel, The Method of Grace, Sermon 2 (John 17:23), reality of the union, 2nd proof">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+they+demand%2C+How+can+we+be+justified+by+the+righteousness+of+another%3F+Can+I+be+rich+with+another+man%27s+money%2C+or+preferred+by+another+man%27s+honours%3F+Our+answer+is%2C+yes%2C+if+that+other+be+my+surety+or+husband.+Indeed+Peter+can+not+be+justified+by+the+righteousness+of+Paul%3B+but+both+may+be+justified+by+the+righteousness+of+Christ+imputed+to+them%3B+they+being+members%2C+jointly+knit+to+one+common+Head.+Principal+and+surety+are+one+in+obligations+and+constructions+of+law.+Head+and+members+are+one+body%2C+branch+and+stock+are+one+tree%3B+and+it+is+no+strange+thing+to+see+a+graff+live+by+the+sap+of+another+stock%2C+when+once+it+is+ingrafted+into+it.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+The+Method+of+Grace%2C+Sermon+2+%28John+17%3A23%29%2C+reality+of+the+union%2C+2nd+proof&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b16df32c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9b16df32c0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/flavel/grace" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-13755d1246" data-kw="Comfort Justice Assurance"><blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote><figcaption>— <a href="../../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon II (Song 5:1)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/justification.html" aria-current="page">Justification</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?”

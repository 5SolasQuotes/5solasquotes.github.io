t &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.”

ace Him”</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a></div><div class="actions"><button class="copy" data-copy="“On the part of the saints, it is their free, willing consent to receive, embrace, and submit to the Lord Jesus, as their husband, Lord, and Saviour—to abide with him, subject their souls to him, and to be ruled by him for ever.”

— John Bunyan, Come and Welcome to Jesus Christ, p. 153">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFaith+will+give+comfort+in+the+midst+of+fears%3B+but+unbelief+causeth+fears+in+the+midst+of+comfort.%E2%80%9D%0A%0A%E2%80%94+John+Bunyan%2C+Come+and+Welcome+to+Jesus+Christ%2C+p.+153&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdef08302f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/def08302f9.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-209fbb2df4" data-kw=""><blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote><figcaption>— <a href="../../authors/octavius-winslow.html">Octavius Winslow</a>, <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.”

— Octavius Winslow, Personal Declension and Revival of Religion in the Soul, p. 74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+doubt+the+love%2C+the+wisdom%2C+and+the+faithfulness+of+God%3B+to+doubt+the+perfection+of+the+work+of+Christ%3B+to+doubt+the+operation+of+the+Spirit+on+the+heart%2C+what+can+tend+more+to+the+weakening+and+decay+of+this+precious+and+costly+grace%3F+Every+time+the+soul+sinks+under+the+pressure+of+a+doubt+of+its+interest+in+Christ%2C+the+effect+must+be+a+weakening+of+the+soul%27s+view+of+the+glory%2C+perfection%2C+and+all-sufficiency+of+Christ%27s+work.+But+imperfectly+may+the+doubting+Christian+be+aware+what+dishonor+is+done+to+Jesus%2C+what+reflection+is+cast+upon+his+great+work%2C+by+every+unbelieving+fear+he+cherishes.%E2%80%9D%0A%0A%E2%80%94+Octavius+Winslow%2C+Personal+Declension+and+Revival+of+Religion+in+the+Soul%2C+p.+74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F209fbb2df4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/209fbb2df4.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a1ab80edcc" data-kw=""><blockquote><p>The Lord Jesus is very pitiful, and of tender mercy. He does not regard the quantity of faith, but the quality: He does not measure its degree, but its truth. He will not break any bruised reed, nor quench any smoking flax. He will never let it be said that any perished at the foot of the cross. &quot;Him that cometh unto Me,&quot; He says, &quot;I will in no wise cast out.&quot; (John 6:37.) Yes! Though a man&#x27;s faith be no bigger than a grain of mustard seed, if it only brings him to Christ, and enables him to touch the hem of His garment, he shall be saved,—saved as surely as the oldest saint in paradise,—saved as completely and eternally as Peter, or John, or Paul. There are degrees in our sanctification. In our justification there are none.</p></blockquote><figcaption>— <a href="../../authors/j-c-ryle.html">J. C. Ryle</a>, <cite>Holiness (ch. “Assurance”)</cite>, p. 171</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“The Lord Jesus is very pitiful, and of tender mercy. He does not regard the quantity of faith, but the quality: He does not measure its degree, but its truth. He will not break any bruised reed, nor quench any smoking flax. He will never let it be said that any perished at the foot of the cross. &quot;Him that cometh unto Me,&quot; He says, &quot;I will in no wise cast out.&quot; (John 6:37.) Yes! Though a man&#x27;s faith be no bigger than a grain of mustard seed, if it only brings him to Christ, and enables him to touch the hem of His garment, he shall be saved,—saved as surely as the oldest saint in paradise,—saved as completely and eternally as Peter, or John, or Paul. There are degrees in our sanctification. In our justification there are none.”

" data-copy="“It is not great faith, but true faith, that saves; and the salvation lies not in the faith, but in the Christ in whom faith trusts. Faith as a grain of mustard seed will bring salvation. It is not the measure of faith, but the sincerity of faith, which is the point to be considered.”

 cast out one who in lowliness and brokenness of heart, sought his compassionate grace.”

fying, these two, faith and Christ, have a mutual relation, and must always concur- faith as the action which apprehendeth, Christ as the object which is apprehended; so that neither the passion of Christ saveth without faith, nor doth faith help unless it be in Christ, its object.”

— Daniel Cawdray, A Puritan Golden Treasury, p. 104">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+the+act+of+healing+through+the+eyes+of+the+Israelites+and+the+brazen+serpent+went+together%3B+so%2C+in+the+act+of+justifying%2C+these+two%2C+faith+and+Christ%2C+have+a+mutual+relation%2C+and+must+always+concur-+faith+as+the+action+which+apprehendeth%2C+Christ+as+the+object+which+is+apprehended%3B+so+that+neither+the+passion+of+Christ+saveth+without+faith%2C+nor+doth+faith+help+unless+it+be+in+Christ%2C+its+object.%E2%80%9D%0A%0A%E2%80%94+Daniel+Cawdray%2C+A+Puritan+Golden+Treasury%2C+p.+104&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F040b5004ca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/040b5004ca.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9ea85d7a6b" data-kw=""><blockquote><p>[Christians] look away from themselves to Christ. They believe that God has loved them from eternity past. They believe that the payment of Christ on the cross for sins was for them. They find Christ irresistible, and following Him the greatest privilege of all. They have faith in Christ and what He has done for them. They trust Christ, looking outside of themselves to Him alone.</p></blockquote><figcaption>— <a href="../../authors/jim-elliff.html">Jim Elliff</a>, <cite>A Three-legged Stool: All Sides of God’s Salvation Process</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“[Christians] look away from themselves to Christ. They believe that God has loved them from eternity past. They believe that the payment of Christ on the cross for sins was for them. They find Christ irresistible, and following Him the greatest privilege of all. They have faith in Christ and what He has done for them. They trust Christ, looking outside of themselves to Him alone.”

— Jim Elliff, A Three-legged Stool: All Sides of God’s Salvation Process">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BChristians%5D+look+away+from+themselves+to+Christ.+They+believe+that+God+has+loved+them+from+eternity+past.+They+believe+that+the+payment+of+Christ+on+the+cross+for+sins+was+for+them.+They+find+Christ+irresistible%2C+and+following+Him+the+greatest+privilege+of+all.+They+have+faith+in+Christ+and+what+He+has+done+for+them.+They+trust+Christ%2C+looking+outside+of+themselves+to+Him+alone.%E2%80%9D%0A%0A%E2%80%94+Jim+Elliff%2C+A+Three-legged+Stool%3A+All+Sides+of+God%E2%80%99s+Salvation+Process&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9ea85d7a6b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9ea85d7a6b.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-2f9aeee0f2" data-kw=""><blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote><figcaption>— <a href="../../authors/john-gerstner.html">John Gerstner</a>, <cite>Theology for Everyman</cite>, ch. 6</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.”

— John Gerstner, Theology for Everyman, ch. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA.H.+Strong+uses+the+analogy+of+the+coupling.+The+coupling+joins+a+train+of+cars+to+a+locomotive.+The+coupling+has+no+power+in+itself.+It+cannot+move+a+single+car+an+inch.+All+the+power+is+in+the+locomotive.+But+the+coupling+is+the+link+by+which+the+power+of+the+locomotive+is+transmitted+to+the+cars.+Faith+has+no+power+in+itself%3B+it+is+not+a+ground+of+salvation%3B+it+is+not+a+good+work.+It+is+merely+that+by+which+all+the+goodness+and+grace+and+glory+of+Christ+comes+to+the+sinner.%E2%80%9D%0A%0A%E2%80%94+John+Gerstner%2C+Theology+for+Everyman%2C+ch.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f9aeee0f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2f9aeee0f2.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-813dbd0f21" data-kw=""><blockquote><p>But why is faith the means of justification? Simply because it is the action of union with Jesus Christ. Faith is our coming to Him, our trusting Him, our resting in Him. The moment we are united to Him, we are immediately endowed with all that He has secured for us. We are immediately justified before we have done a single good deed, because we are His and He is God’s. Just as a very poor woman is a very poor woman until the very moment that she marries a wealthy man. But at the moment that she becomes his wife, she becomes a wealthy woman. It is by means of her acceptance that she becomes a wealthy woman, but her acceptance does not make her a wealthy woman; it is her husband’s wealth that makes her so. So faith does not justify; Christ justifies. But faith is the act of union with Christ.</p></blockquote><figcaption>— <a href="../../authors/john-gerstner.html">John Gerstner</a>, <cite>Theology for Everyman</cite>, ch. 6</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“But why is faith the means of justification? Simply because it is the action of union with Jesus Christ. Faith is our coming to Him, our trusting Him, our resting in Him. The moment we are united to Him, we are immediately endowed with all that He has secured for us. We are immediately justified before we have done a single good deed, because we are His and He is God’s. Just as a very poor woman is a very poor woman until the very moment that she marries a wealthy man. But at the moment that she becomes his wife, she becomes a wealthy woman. It is by means of her acceptance that she becomes a wealthy woman, but her acceptance does not make her a wealthy woman; it is her husband’s wealth that makes her so. So faith does not justify; Christ justifies. But faith is the act of union with Christ.”

— John Gerstner, Theology for Everyman, ch. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+why+is+faith+the+means+of+justification%3F+Simply+because+it+is+the+action+of+union+with+Jesus+Christ.+Faith+is+our+coming+to+Him%2C+our+trusting+Him%2C+our+resting+in+Him.+The+moment+we+are+united+to+Him%2C+we+are+immediately+endowed+with+all+that+He+has+secured+for+us.+We+are+immediately+justified+before+we+have+done+a+single+good+deed%2C+because+we+are+His+and+He+is+God%E2%80%99s.+Just+as+a+very+poor+woman+is+a+very+poor+woman+until+the+very+moment+that+she+marries+a+wealthy+man.+But+at+the+moment+that+she+becomes+his+wife%2C+she+becomes+a+wealthy+woman.+It+is+by+means+of+her+acceptance+that+she+becomes+a+wealthy+woman%2C+but+her+acceptance+does+not+make+her+a+wealthy+woman%3B+it+is+her+husband%E2%80%99s+wealth+that+makes+her+so.+So+faith+does+not+justify%3B+Christ+justifies.+But+faith+is+the+act+of+union+with+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Gerstner%2C+Theology+for+Everyman%2C+ch.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F813dbd0f21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/813dbd0f21.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6d89d98014" data-kw=""><blockquote><p>It ought to be the primary goal of every Christian to put aside confidence in works and grow stronger in the belief that we are saved by faith alone. Through this faith the Christian should increase in knowledge not of works but of Christ Jesus and the benefits of his death and resurrection.</p></blockquote><figcaption>— <a href="../../authors/martin-luther.html">Martin Luther</a>, <cite>The Freedom of a Christian</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“It ought to be the primary goal of every Christian to put aside confidence in works and grow stronger in the belief that we are saved by faith alone. Through this faith the Christian should increase in knowledge not of works but of Christ Jesus and the benefits of his death and resurrection.”

— Martin Luther, The Freedom of a Christian">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+ought+to+be+the+primary+goal+of+every+Christian+to+put+aside+confidence+in+works+and+grow+stronger+in+the+belief+that+we+are+saved+by+faith+alone.+Through+this+faith+the+Christian+should+increase+in+knowledge+not+of+works+but+of+Christ+Jesus+and+the+benefits+of+his+death+and+resurrection.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Freedom+of+a+Christian&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d89d98014.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6d89d98014.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-1d55c97862" data-kw=""><blockquote><p>Faith is man’s response to God’s elective purpose. God’s choice of men is election; men’s choice of God is faith. In election God gives His promises, and by faith men receive them.</p></blockquote><figcaption>— <a href="../../authors/john-macarthur.html">John MacArthur</a>, <cite>Ephesians</cite>, p. 33</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a></div><div class="actions"><button class="copy" data-copy="“Faith is man’s response to God’s elective purpose. God’s choice of men is election; men’s choice of God is faith. In election God gives His promises, and by faith men receive them.”

— John MacArthur, Ephesians, p. 33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFaith+is+man%E2%80%99s+response+to+God%E2%80%99s+elective+purpose.+God%E2%80%99s+choice+of+men+is+election%3B+men%E2%80%99s+choice+of+God+is+faith.+In+election+God+gives+His+promises%2C+and+by+faith+men+receive+them.%E2%80%9D%0A%0A%E2%80%94+John+MacArthur%2C+Ephesians%2C+p.+33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d55c97862.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1d55c97862.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-7581bd9f56" data-kw=""><blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote><figcaption>— <a href="../../authors/david-platt.html">David Platt</a>, <cite>Follow Me</cite>, p. 60</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/faith.html" aria-current="page">Faith</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.”

 is of those who attribute the work of justification unto God, but place their righteousness partly in their faith, as their own work, and partly in the obedience of Christ; and make two actions of God in justifying. … All these three opinions do attribute man’s righteousness, either wholly or in part, to his own working. The first and last do join grace and merit together in justification. Which things are most contrary to the truth of God”

ce</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“…the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.”

 would have no need of the word, nor consequently of faith.”

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perseverance · 5 Solas Quotes</title><meta name="description" content="Perseverance — Salvation Applied"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../salvation.html">Salvation Applied</a> ›</p><h1>Perseverance</h1><p class="sub">12 quotations from 8 authors</p><figure class="quote" id="q-e1ff0babb0" data-kw="Mortification"><blockquote><p>The Apostle himself in Rom. 6 &amp; 7 shows quite openly that concupiscence is sin properly so called: for not only does he often call it sin, but not good, evil, to be held in hatred, fighting against the law of God, to be crucified, mortified, and destroyed, and rendering that man miserable in whom it resides.</p></blockquote><figcaption>— <a href="../../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, vol. 4, ch. 3 (Of Original Sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a></div><div class="actions"><button class="copy" data-copy="“The Apostle himself in Rom. 6 &amp; 7 shows quite openly that concupiscence is sin properly so called: for not only does he often call it sin, but not good, evil, to be held in hatred, fighting against the law of God, to be crucified, mortified, and destroyed, and rendering that man miserable in whom it resides.”

— William Ames, Bellarmine Disarmed, vol. 4, ch. 3 (Of Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle+himself+in+Rom.+6+%26+7+shows+quite+openly+that+concupiscence+is+sin+properly+so+called%3A+for+not+only+does+he+often+call+it+sin%2C+but+not+good%2C+evil%2C+to+be+held+in+hatred%2C+fighting+against+the+law+of+God%2C+to+be+crucified%2C+mortified%2C+and+destroyed%2C+and+rendering+that+man+miserable+in+whom+it+resides.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+vol.+4%2C+ch.+3+%28Of+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1ff0babb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e1ff0babb0.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6f347f3ddc" data-kw="Mortification"><blockquote><p>Moral corruption fighting against the law, for the crucifying and mortifying of which Christ himself died on the cross, if it be not properly sin, then Scripture has not explained to us what the property of any habitual sin is.</p></blockquote><figcaption>— <a href="../../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, vol. 4, ch. 3 (Of Original Sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a></div><div class="actions"><button class="copy" data-copy="“Moral corruption fighting against the law, for the crucifying and mortifying of which Christ himself died on the cross, if it be not properly sin, then Scripture has not explained to us what the property of any habitual sin is.”

— William Ames, Bellarmine Disarmed, vol. 4, ch. 3 (Of Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoral+corruption+fighting+against+the+law%2C+for+the+crucifying+and+mortifying+of+which+Christ+himself+died+on+the+cross%2C+if+it+be+not+properly+sin%2C+then+Scripture+has+not+explained+to+us+what+the+property+of+any+habitual+sin+is.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+vol.+4%2C+ch.+3+%28Of+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f347f3ddc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6f347f3ddc.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-e2292fd89c" data-kw="Mortification"><blockquote><p>Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote><figcaption>— <a href="../../authors/john-owen.html">John Owen</a>, <cite>Indwelling Sin in Believers</cite>, ch. 4</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a></div><div class="actions"><button class="copy" data-copy="“Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.”

— John Owen, Indwelling Sin in Believers, ch. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+spark+of+fire+is+fire%2C+and+will+burn%3B+so+is+every+thing+of+the+law+of+sin%2C+the+last%2C+the+least+of+it%2C+--+it+is+enmity%2C+it+will+poison%2C+it+will+burn.+%E2%80%A6+Mortification+abates+of+its+force%2C+but+doth+not+change+its+nature.+Grace+changeth+the+nature+of+man%2C+but+nothing+can+change+the+nature+of+sin.+Whatever+effect+be+wrought+upon+it%2C+there+is+no+effect+wrought+in+it%2C+but+that+it+is+enmity+still%2C+sin+still.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Indwelling+Sin+in+Believers%2C+ch.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2292fd89c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e2292fd89c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/indwellingsin" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-97321aa156" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).”

— Westminster Assembly, Westminster Confession of Faith, 6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+corruption+of+nature%2C+during+this+life%2C+doth+remain+in+those+that+are+regenerated+%281+John+1%3A8%2C+10%3B+Rom.+7%3A14%2C+17%E2%80%9318%2C+23%3B+James+3%3A2%3B+Prov.+20%3A9%3B+Eccl.+7%3A20%29%3B+and+although+it+be%2C+through+Christ%2C+pardoned+and+mortified%3B+yet+both+itself%2C+and+all+the+motions+thereof%2C+are+truly+and+properly+sin+%28Rom.+7%3A5%2C+7%E2%80%938%2C+25%3B+Gal.+5%3A17%29.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97321aa156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/97321aa156.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+corruption+of+nature%2C+during+this+life%2C+does+remain+in+those+that+are+regenerated+%28Rom.+7%3A18%2C+23%3B+Eccl.+7%3A20%3B+1+John+1%3A8%29%3B+and+although+it+be+through+Christ+pardoned+and+mortified%2C+yet+both+itself%2C+and+the+first+motions+thereof%2C+are+truly+and+properly+sin+%28Rom.+7%3A23%E2%80%9325%3B+Gal.+5%3A17%29.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F429a546bdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/429a546bdb.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-76fc53ecbc" data-kw="Regeneration Sanctification"><blockquote><p>Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.</p></blockquote><figcaption>— <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>Spiritual Union and Communion</cite>, Introduction</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a></div><div class="actions"><button class="copy" data-copy="“Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.”

— Arthur W. Pink, Spiritual Union and Communion, Introduction">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUnion+with+Christ+is+the+foundation+of+all+spiritual+blessings%2C+so+that+if+there+had+been+no+connection+with+Him%2C+there+could+be+no+regeneration%2C+no+justification%2C+no+sanctification%2C+no+glorification.+It+is+so+in+the+natural+world%E2%80%94adumbrating+the+spiritual%3A+sever+one+of+the+members+from+my+physical+body%2C+and+it+is+dead%3B+only+by+its+union+with+my+person+does+it+partake+of+life.%E2%80%9D%0A%0A%E2%80%94+Arthur+W.+Pink%2C+Spiritual+Union+and+Communion%2C+Introduction&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76fc53ecbc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/76fc53ecbc.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-4c5c60d442" data-kw="Sanctification Communion"><blockquote><p>The way to get holy endowments and qualifications necessary to frame and enable us for the immediate practice of the law, is to receive them out of the fullness of Christ, by fellowship with Him; and that we may have this fellowship, we must be in Christ, and have Christ Himself in us, by a mystical union with Him.</p></blockquote><figcaption>— <a href="../../authors/walter-marshall.html">Walter Marshall</a>, <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), the direction</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“The way to get holy endowments and qualifications necessary to frame and enable us for the immediate practice of the law, is to receive them out of the fullness of Christ, by fellowship with Him; and that we may have this fellowship, we must be in Christ, and have Christ Himself in us, by a mystical union with Him.”

— Walter Marshall, The Gospel Mystery of Sanctification, Direction III (ch. 3), the direction">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+way+to+get+holy+endowments+and+qualifications+necessary+to+frame+and+enable+us+for+the+immediate+practice+of+the+law%2C+is+to+receive+them+out+of+the+fullness+of+Christ%2C+by+fellowship+with+Him%3B+and+that+we+may+have+this+fellowship%2C+we+must+be+in+Christ%2C+and+have+Christ+Himself+in+us%2C+by+a+mystical+union+with+Him.%E2%80%9D%0A%0A%E2%80%94+Walter+Marshall%2C+The+Gospel+Mystery+of+Sanctification%2C+Direction+III+%28ch.+3%29%2C+the+direction&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c5c60d442.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4c5c60d442.html">Permalink</a><a class="src" href="https://archive.org/details/gospelmysteryof00mars" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-7eebdca10b" data-kw="Perseverance"><blockquote><p>It is an INDISSOLUBLE union. Once in Christ, ever in him. Having taken up his habitation in the heart, he never leaves. None can untie this happy knot.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (5)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a></div><div class="actions"><button class="copy" data-copy="“It is an INDISSOLUBLE union. Once in Christ, ever in him. Having taken up his habitation in the heart, he never leaves. None can untie this happy knot.”

— Thomas Boston, Human Nature in Its Fourfold State, State III, Head 2 “Mystical Union,” general observations (5)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+an+INDISSOLUBLE+union.+Once+in+Christ%2C+ever+in+him.+Having+taken+up+his+habitation+in+the+heart%2C+he+never+leaves.+None+can+untie+this+happy+knot.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Human+Nature+in+Its+Fourfold+State%2C+State+III%2C+Head+2+%E2%80%9CMystical+Union%2C%E2%80%9D+general+observations+%285%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7eebdca10b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7eebdca10b.html">Permalink</a><a class="src" href="https://archive.org/details/humannatureinits00bostuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-1e78844179" data-kw="Sanctification Original Sin"><blockquote><p>And, as our natural corruption was produced originally in the first Adam, and propagated from him to us, so our new nature and holiness is first produced in Christ, and derived from Him to us, or as it were propagated. So that we are not at all to work together with Christ, in making or producing that holy frame in us, but only to take it to ourselves, and use it in our holy practice, as made ready to our hands.</p></blockquote><figcaption>— <a href="../../authors/walter-marshall.html">Walter Marshall</a>, <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), “One great mystery”</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“And, as our natural corruption was produced originally in the first Adam, and propagated from him to us, so our new nature and holiness is first produced in Christ, and derived from Him to us, or as it were propagated. So that we are not at all to work together with Christ, in making or producing that holy frame in us, but only to take it to ourselves, and use it in our holy practice, as made ready to our hands.”

— Walter Marshall, The Gospel Mystery of Sanctification, Direction III (ch. 3), “One great mystery”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd%2C+as+our+natural+corruption+was+produced+originally+in+the+first+Adam%2C+and+propagated+from+him+to+us%2C+so+our+new+nature+and+holiness+is+first+produced+in+Christ%2C+and+derived+from+Him+to+us%2C+or+as+it+were+propagated.+So+that+we+are+not+at+all+to+work+together+with+Christ%2C+in+making+or+producing+that+holy+frame+in+us%2C+but+only+to+take+it+to+ourselves%2C+and+use+it+in+our+holy+practice%2C+as+made+ready+to+our+hands.%E2%80%9D%0A%0A%E2%80%94+Walter+Marshall%2C+The+Gospel+Mystery+of+Sanctification%2C+Direction+III+%28ch.+3%29%2C+%E2%80%9COne+great+mystery%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e78844179.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1e78844179.html">Permalink</a><a class="src" href="https://archive.org/details/gospelmysteryof00mars" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-acc274196c" data-kw="Sanctification Holy Spirit"><blockquote><p>True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” V. Benefits: Sanctification</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/trinity/holy-spirit.html">The Holy Spirit</a></div><div class="actions"><button class="copy" data-copy="“True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.”

rshall.html">Walter Marshall</a>, <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), proof 3</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/perseverance.html" aria-current="page">Perseverance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a></div><div class="actions"><button class="copy" data-copy="“The end of Christ&#x27;s incarnation, death and resurrection was to prepare and form a holy nature and frame for us in Himself, to be communicated to us by union and fellowship with Him; and not to enable us to produce in ourselves the first original of such a holy nature by our own endeavours.”

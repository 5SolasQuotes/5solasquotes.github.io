<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assurance · 5 Solas Quotes</title><meta name="description" content="Assurance — Salvation Applied"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231301"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../salvation.html">Salvation Applied</a> ›</p><h1>Assurance</h1><p class="sub">49 quotations from 27 authors</p><figure class="quote" id="q-a469aee8d1" data-kw="Faith"><blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a></div><div class="actions"><button class="copy" data-copy="“It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.”

ace Him”</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a></div><div class="actions"><button class="copy" data-copy="“On the part of the saints, it is their free, willing consent to receive, embrace, and submit to the Lord Jesus, as their husband, Lord, and Saviour—to abide with him, subject their souls to him, and to be ruled by him for ever.”

— John Owen, Communion with God, Part 2, ch. 3, “We Freely Embrace Him”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+the+part+of+the+saints%2C+it+is+their+free%2C+willing+consent+to+receive%2C+embrace%2C+and+submit+to+the+Lord+Jesus%2C+as+their+husband%2C+Lord%2C+and+Saviour%E2%80%94to+abide+with+him%2C+subject+their+souls+to+him%2C+and+to+be+ruled+by+him+for+ever.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Communion+with+God%2C+Part+2%2C+ch.+3%2C+%E2%80%9CWe+Freely+Embrace+Him%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0c02fe67f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a0c02fe67f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/communion" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-13755d1246" data-kw="Comfort Justice Assurance"><blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote><figcaption>— <a href="../../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon II (Song 5:1)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?”

rent="page">Assurance</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/trinity/holy-spirit.html">The Holy Spirit</a></div><div class="actions"><button class="copy" data-copy="“When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.”

lt of high animal spirits, or a sanguine temperament of body. It is a positive gift of the Holy Ghost, bestowed without reference to men&#x27;s bodily frames or constitutions, and a gift which every believer in Christ ought to aim at and seek after.”

— J. C. Ryle, Holiness (ch. “Assurance”), pp. 163–164">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssurance%2C+such+as+Paul+expresses+in+the+verses+which+head+this+paper%2C+is+not+a+mere+fancy+or+feeling.+It+is+not+the+result+of+high+animal+spirits%2C+or+a+sanguine+temperament+of+body.+It+is+a+positive+gift+of+the+Holy+Ghost%2C+bestowed+without+reference+to+men%27s+bodily+frames+or+constitutions%2C+and+a+gift+which+every+believer+in+Christ+ought+to+aim+at+and+seek+after.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Holiness+%28ch.+%E2%80%9CAssurance%E2%80%9D%29%2C+pp.+163%E2%80%93164&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf50f08eea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/af50f08eea.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-4454ca5b94" data-kw=""><blockquote><p>Christians, this you are always to remember, that though the enjoyment of assurance makes most for your consolation; yet the living purely upon Christ in the lack of assurance, makes most for his exaltation.</p></blockquote><figcaption>— <a href="../../authors/thomas-brooks.html">Thomas Brooks</a>, <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 50</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a></div><div class="actions"><button class="copy" data-copy="“Christians, this you are always to remember, that though the enjoyment of assurance makes most for your consolation; yet the living purely upon Christ in the lack of assurance, makes most for his exaltation.”

— Thomas Brooks, Heaven on Earth: A Treatise on Christian Assurance, p. 50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChristians%2C+this+you+are+always+to+remember%2C+that+though+the+enjoyment+of+assurance+makes+most+for+your+consolation%3B+yet+the+living+purely+upon+Christ+in+the+lack+of+assurance%2C+makes+most+for+his+exaltation.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+Heaven+on+Earth%3A+A+Treatise+on+Christian+Assurance%2C+p.+50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4454ca5b94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4454ca5b94.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a155569413" data-kw=""><blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote><figcaption>— <a href="../../authors/c-h-spurgeon.html">C. H. Spurgeon</a>, <cite>All of Grace</cite>, pp. 70–71</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a></div><div class="actions"><button class="copy" data-copy="“When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.”

— C. H. Spurgeon, All of Grace, pp. 70–71">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+are+sure+that+we+are+forgiven%2C+then+we+abhor+iniquity%3B+and+I+suppose+that+when+faith+grows+into+full+assurance%2C+so+that+we+are+certain+beyond+a+doubt+that+the+blood+of+Jesus+has+washed+us+whiter+than+snow%2C+it+is+then+that+repentance+reaches+to+its+greatest+height.+Repentance+grows+as+faith+grows.%E2%80%9D%0A%0A%E2%80%94+C.+H.+Spurgeon%2C+All+of+Grace%2C+pp.+70%E2%80%9371&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa155569413.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a155569413.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-048dbf2791" data-kw=""><blockquote><p>It is a glorious divine manifestation of God unto the soul, shedding abroad God&#x27;s love in the heart; it is a thing better felt than spoken of: it is no audible voice, but it is a ray of glory filling the soul with God, as He is life, light, love, and liberty.</p></blockquote><figcaption>— <a href="../../authors/william-guthrie.html">William Guthrie</a>, <cite>The Christian&#x27;s Great Interest</cite>, p. 83</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/person-of-christ/love-of-christ.html">Love of Christ</a></div><div class="actions"><button class="copy" data-copy="“It is a glorious divine manifestation of God unto the soul, shedding abroad God&#x27;s love in the heart; it is a thing better felt than spoken of: it is no audible voice, but it is a ray of glory filling the soul with God, as He is life, light, love, and liberty.”

— William Guthrie, The Christian&#x27;s Great Interest, p. 83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+glorious+divine+manifestation+of+God+unto+the+soul%2C+shedding+abroad+God%27s+love+in+the+heart%3B+it+is+a+thing+better+felt+than+spoken+of%3A+it+is+no+audible+voice%2C+but+it+is+a+ray+of+glory+filling+the+soul+with+God%2C+as+He+is+life%2C+light%2C+love%2C+and+liberty.%E2%80%9D%0A%0A%E2%80%94+William+Guthrie%2C+The+Christian%27s+Great+Interest%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F048dbf2791.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/048dbf2791.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-209fbb2df4" data-kw=""><blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote><figcaption>— <a href="../../authors/octavius-winslow.html">Octavius Winslow</a>, <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a></div><div class="actions"><button class="copy" data-copy="“To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.”

-current="page">Assurance</a></div><div class="actions"><button class="copy" data-copy="“Assurance is a jewel of that worth, a pearl of that price, that he who will have it must work, and sweat, and weep, and wait to obtain it. He must not only use diligence—but he must use all diligence; not only dig—but he must dig deep, before he can come to this golden mine. Assurance is that &quot;white stone,&quot; that &quot;new name,&quot; that hidden manna, which none can obtain but such as labor for it as for life. Assurance is such precious gold, that a man must win it before he can wear it.”

e>, p. 171</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a></div><div class="actions"><button class="copy" data-copy="“The Lord Jesus is very pitiful, and of tender mercy. He does not regard the quantity of faith, but the quality: He does not measure its degree, but its truth. He will not break any bruised reed, nor quench any smoking flax. He will never let it be said that any perished at the foot of the cross. &quot;Him that cometh unto Me,&quot; He says, &quot;I will in no wise cast out.&quot; (John 6:37.) Yes! Though a man&#x27;s faith be no bigger than a grain of mustard seed, if it only brings him to Christ, and enables him to touch the hem of His garment, he shall be saved,—saved as surely as the oldest saint in paradise,—saved as completely and eternally as Peter, or John, or Paul. There are degrees in our sanctification. In our justification there are none.”

" data-copy="“It is not great faith, but true faith, that saves; and the salvation lies not in the faith, but in the Christ in whom faith trusts. Faith as a grain of mustard seed will bring salvation. It is not the measure of faith, but the sincerity of faith, which is the point to be considered.”

— C. H. Spurgeon, All of Grace, p. 55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+not+great+faith%2C+but+true+faith%2C+that+saves%3B+and+the+salvation+lies+not+in+the+faith%2C+but+in+the+Christ+in+whom+faith+trusts.+Faith+as+a+grain+of+mustard+seed+will+bring+salvation.+It+is+not+the+measure+of+faith%2C+but+the+sincerity+of+faith%2C+which+is+the+point+to+be+considered.%E2%80%9D%0A%0A%E2%80%94+C.+H.+Spurgeon%2C+All+of+Grace%2C+p.+55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F763c635995.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/763c635995.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-32d1da2e3c" data-kw=""><blockquote><p>There is much spurious humility among many of the dear saints of God. It is thought by some, that to be always doubting one&#x27;s pardon and acceptance, is the evidence of a lowly spirit. It is, allow us to say, the mark of the very opposite of a lowly and humble mind. That is true humility that credits the testimony of God, — that believes because he has spoken it, — that rests in the blood, and righteousness, and all-sufficiency of Jesus, because he has declared that &quot;whoever believes in him shall be saved.&quot; This is genuine lowliness, — the blessed product of the Eternal Spirit.</p></blockquote><figcaption>— <a href="../../authors/octavius-winslow.html">Octavius Winslow</a>, <cite>Personal Declension and Revival of Religion in the Soul</cite>, pp. 74–75</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/christian-life/humility.html">Humility</a></div><div class="actions"><button class="copy" data-copy="“There is much spurious humility among many of the dear saints of God. It is thought by some, that to be always doubting one&#x27;s pardon and acceptance, is the evidence of a lowly spirit. It is, allow us to say, the mark of the very opposite of a lowly and humble mind. That is true humility that credits the testimony of God, — that believes because he has spoken it, — that rests in the blood, and righteousness, and all-sufficiency of Jesus, because he has declared that &quot;whoever believes in him shall be saved.&quot; This is genuine lowliness, — the blessed product of the Eternal Spirit.”

ination and glorification; and if we have this middle link fast, we are sure of the two other ends of the chain.”

— Thomas Watson, A Divine Cordial (All Things for Good), p. 88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCalling+is+made+%28Romans+8%3A30%29+the+middle+link+of+the+golden+chain+of+salvation.+It+is+placed+between+predestination+and+glorification%3B+and+if+we+have+this+middle+link+fast%2C+we+are+sure+of+the+two+other+ends+of+the+chain.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+A+Divine+Cordial+%28All+Things+for+Good%29%2C+p.+88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facc6479fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/acc6479fcb.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-f4da6d65e4" data-kw=""><blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote><figcaption>— <a href="../../authors/thomas-brooks.html">Thomas Brooks</a>, <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a></div><div class="actions"><button class="copy" data-copy="“Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.”

ions"><button class="copy" data-copy="“They were all eminently humble and lowly-minded men, if ever any were; and yet they all speak of their own state with an assured hope. Surely this should teach us that deep humility and strong assurance are perfectly compatible, and that there is not any necessary connection between spiritual confidence and pride.”

 cast out one who in lowliness and brokenness of heart, sought his compassionate grace.”

e payment of Christ on the cross for sins was for them. They find Christ irresistible, and following Him the greatest privilege of all. They have faith in Christ and what He has done for them. They trust Christ, looking outside of themselves to Him alone.”

ses us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.”

ttending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.”

 href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope, but an infallible assurance of faith, founded on the blood and righteousness of Christ revealed in the Gospel; and also upon the inward evidence of those graces of the Spirit unto which promises are made, and on the testimony of the Spirit of adoption, witnessing with our spirits that we are the children of God; and, as a fruit thereof, keeping the heart both humble and holy.”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 18.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+certainty+is+not+a+bare+conjectural+and+probable+persuasion+grounded+upon+a+fallible+hope%2C+but+an+infallible+assurance+of+faith%2C+founded+on+the+blood+and+righteousness+of+Christ+revealed+in+the+Gospel%3B+and+also+upon+the+inward+evidence+of+those+graces+of+the+Spirit+unto+which+promises+are+made%2C+and+on+the+testimony+of+the+Spirit+of+adoption%2C+witnessing+with+our+spirits+that+we+are+the+children+of+God%3B+and%2C+as+a+fruit+thereof%2C+keeping+the+heart+both+humble+and+holy.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+18.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F82e246423c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/82e246423c.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-11ff0d4a49" data-kw=""><blockquote><p>This infallible assurance does not so belong to the essence of faith, but that a true believer may wait long, and struggle with many difficulties before he be partaker of it; yet being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of means, attain thereunto: and therefore it is the duty of every one to give all diligence to make his calling and election sure…</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 18.3</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“This infallible assurance does not so belong to the essence of faith, but that a true believer may wait long, and struggle with many difficulties before he be partaker of it; yet being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of means, attain thereunto: and therefore it is the duty of every one to give all diligence to make his calling and election sure…”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 18.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+infallible+assurance+does+not+so+belong+to+the+essence+of+faith%2C+but+that+a+true+believer+may+wait+long%2C+and+struggle+with+many+difficulties+before+he+be+partaker+of+it%3B+yet+being+enabled+by+the+Spirit+to+know+the+things+which+are+freely+given+him+of+God%2C+he+may%2C+without+extraordinary+revelation%2C+in+the+right+use+of+means%2C+attain+thereunto%3A+and+therefore+it+is+the+duty+of+every+one+to+give+all+diligence+to+make+his+calling+and+election+sure%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+18.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F11ff0d4a49.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/11ff0d4a49.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-0b044c059b" data-kw=""><blockquote><p>…yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 18.4</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“…yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 18.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6yet+are+they+never+destitute+of+the+seed+of+God+and+life+of+faith%2C+that+love+of+Christ+and+the+brethren%2C+that+sincerity+of+heart+and+conscience+of+duty+out+of+which%2C+by+the+operation+of+the+Spirit%2C+this+assurance+may+in+due+time+be+revived%2C+and+by+the+which%2C+in+the+meantime%2C+they+are+preserved+from+utter+despair.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+18.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b044c059b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/0b044c059b.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-57754a76e9" data-kw=""><blockquote><p>Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace…</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Larger Catechism</cite>, Q. 80</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace…”

— Westminster Assembly, Westminster Larger Catechism, Q. 80">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSuch+as+truly+believe+in+Christ%2C+and+endeavour+to+walk+in+all+good+conscience+before+him+%281+John+2%3A3%29%2C+may%2C+without+extraordinary+revelation%2C+by+faith+grounded+upon+the+truth+of+God%E2%80%99s+promises%2C+and+by+the+Spirit+enabling+them+to+discern+in+themselves+those+graces+to+which+the+promises+of+life+are+made+%281+Cor.+2%3A12%3B+1+John+3%3A14%2C+18%E2%80%9319%2C+21%2C+24%3B+4%3A13%2C+16%3B+Heb.+6%3A11%E2%80%9312%29%2C+and+bearing+witness+with+their+spirits+that+they+are+the+children+of+God+%28Rom.+8%3A16%29%2C+be+infallibly+assured+that+they+are+in+the+estate+of+grace%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Larger+Catechism%2C+Q.+80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57754a76e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/57754a76e9.html">Permalink</a><a class="src" href="https://opc.org/lc.html" target="_blank" rel="noopener">Read it online · OPC</a></div></figure><figure class="quote" id="q-1ef2c0c632" data-kw=""><blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 12</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.”

— Synod of Dort, The Canons of Dort, Head 1, Art. 12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+elect+in+due+time%2C+though+in+various+degrees+and+in+different+measures%2C+attain+the+assurance+of+this+their+eternal+and+unchangeable+election%2C+not+by+inquisitively+prying+into+the+secret+and+deep+things+of+God%2C+but+by+observing+in+themselves+with+a+spiritual+joy+and+holy+pleasure+the+infallible+fruits+of+election+pointed+out+in+the+Word+of+God%E2%80%94such+as%2C+a+true+faith+in+Christ%2C+filial+fear%2C+a+godly+sorrow+for+sin%2C+a+hungering+and+thirsting+after+righteousness%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+1%2C+Art.+12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ef2c0c632.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1ef2c0c632.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-625f719715" data-kw=""><blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate…</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 16</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate…”

— Synod of Dort, The Canons of Dort, Head 1, Art. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+in+whom+a+living+faith+in+Christ%2C+an+assured+confidence+of+soul%2C+peace+of+conscience%2C+an+earnest+endeavor+after+filial+obedience%2C+a+glorying+in+God+through+Christ%2C+is+not+as+yet+strongly+felt%2C+and+who+nevertheless+make+use+of+the+means+which+God+has+appointed+for+working+these+graces+in+us%2C+ought+not+to+be+alarmed+at+the+mention+of+reprobation%2C+nor+to+rank+themselves+among+the+reprobate%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+1%2C+Art.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F625f719715.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/625f719715.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-1e5e22ed38" data-kw=""><blockquote><p>Who teach: That there is in this life no fruit and no consciousness of the unchangeable election to glory, nor any certainty, except that which depends on a changeable and uncertain condition. For not only is it absurd to speak of an uncertain certainty, but also contrary to the experience of the saints, who by virtue of the consciousness of their election rejoice with the apostle and praise this favor of God (Eph. 1)…</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Rejection of Errors, ¶7</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/polemics/arminianism.html">Arminianism</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“Who teach: That there is in this life no fruit and no consciousness of the unchangeable election to glory, nor any certainty, except that which depends on a changeable and uncertain condition. For not only is it absurd to speak of an uncertain certainty, but also contrary to the experience of the saints, who by virtue of the consciousness of their election rejoice with the apostle and praise this favor of God (Eph. 1)…”

— Synod of Dort, The Canons of Dort, Head 1, Rejection of Errors, ¶7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWho+teach%3A+That+there+is+in+this+life+no+fruit+and+no+consciousness+of+the+unchangeable+election+to+glory%2C+nor+any+certainty%2C+except+that+which+depends+on+a+changeable+and+uncertain+condition.+For+not+only+is+it+absurd+to+speak+of+an+uncertain+certainty%2C+but+also+contrary+to+the+experience+of+the+saints%2C+who+by+virtue+of+the+consciousness+of+their+election+rejoice+with+the+apostle+and+praise+this+favor+of+God+%28Eph.+1%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+1%2C+Rejection+of+Errors%2C+%C2%B67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e5e22ed38.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1e5e22ed38.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-f56c205734" data-kw=""><blockquote><p>Of this preservation of the elect to salvation and of their perseverance in the faith, true believers themselves may and do obtain assurance according to the measure of their faith, whereby they surely believe that they are and ever will continue true and living members of the Church, and that they have the forgiveness of sins and life eternal.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 5, Art. 9</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“Of this preservation of the elect to salvation and of their perseverance in the faith, true believers themselves may and do obtain assurance according to the measure of their faith, whereby they surely believe that they are and ever will continue true and living members of the Church, and that they have the forgiveness of sins and life eternal.”

— Synod of Dort, The Canons of Dort, Head 5, Art. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+this+preservation+of+the+elect+to+salvation+and+of+their+perseverance+in+the+faith%2C+true+believers+themselves+may+and+do+obtain+assurance+according+to+the+measure+of+their+faith%2C+whereby+they+surely+believe+that+they+are+and+ever+will+continue+true+and+living+members+of+the+Church%2C+and+that+they+have+the+forgiveness+of+sins+and+life+eternal.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+5%2C+Art.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff56c205734.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f56c205734.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-7c73d67f29" data-kw=""><blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 5, Art. 10</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.”

— Synod of Dort, The Canons of Dort, Head 5, Art. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+assurance%2C+however%2C+is+not+produced+by+any+peculiar+revelation+contrary+to+or+independent+of+the+Word+of+God%2C+but+springs+from+faith+in+God%E2%80%99s+promises%2C+which+He+has+most+abundantly+revealed+in+His+Word+for+our+comfort%3B+from+the+testimony+of+the+Holy+Spirit%2C+witnessing+with+our+spirit+that+we+are+children+and+heirs+of+God+%28Rom.+8%3A16%29%3B+and+lastly%2C+from+a+serious+and+holy+desire+to+preserve+a+good+conscience+and+to+perform+good+works.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+5%2C+Art.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c73d67f29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c73d67f29.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-094fd40078" data-kw=""><blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/polemics/arminianism.html">Arminianism</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.”

— Synod of Dort, The Canons of Dort, Head 5, Rejection of Errors, ¶5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWho+teach%3A+That+without+a+special+revelation+we+can+have+no+certainty+of+future+perseverance+in+this+life.+For+by+this+doctrine+the+sure+comfort+of+the+true+believers+is+taken+away+in+this+life%2C+and+the+doubts+of+the+papist+are+again+introduced+into+the+Church%2C+while+the+Holy+Scriptures+constantly+deduce+this+assurance%2C+not+from+a+special+and+extraordinary+revelation%2C+but+from+the+marks+proper+to+the+children+of+God+and+from+the+very+constant+promises+of+God.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+5%2C+Rejection+of+Errors%2C+%C2%B65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F094fd40078.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/094fd40078.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-cb098ede78" data-kw=""><blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits…</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a>, <cite>Heidelberg Catechism</cite>, Q. 21</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits…”

— Zacharias Ursinus &amp; Caspar Olevianus, Heidelberg Catechism, Q. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTrue+faith+is+not+only+a+sure+knowledge%2C+whereby+I+hold+for+truth+all+that+God+has+revealed+to+us+in+His+Word+%28James+1%3A6%29%2C+but+also+a+hearty+trust+%28Rom.+4%3A16%E2%80%9318%3B+Rom.+5%3A1%29%2C+which+the+Holy+Ghost+%282+Cor.+4%3A13%3B+Phil.+1%3A19%2C+29%29+works+in+me+by+the+Gospel+%28Rom.+1%3A16%3B+10%3A17%29%2C+that+not+only+to+others%2C+but+to+me+also%2C+forgiveness+of+sins%2C+everlasting+righteousness%2C+and+salvation+are+freely+given+by+God+%28Heb.+11%3A1%E2%80%932%3B+Rom.+1%3A17%29%2C+merely+of+grace%2C+only+for+the+sake+of+Christ%E2%80%99s+merits%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus+%26+Caspar+Olevianus%2C+Heidelberg+Catechism%2C+Q.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb098ede78.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/cb098ede78.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-05ca7b0d67" data-kw=""><blockquote><p>…relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote><figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 23</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“…relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.”

e chosen from all eternity, and what God has decreed of them before all beginning. For men must hear the gospel preached and believe it. If you believe and are in Christ, you may undoubtedly reckon that you are elected. For the Father has revealed unto us in Christ His eternal sentence of predestination…”

— Heinrich Bullinger, The Second Helvetic Confession (1566), ch. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+therefore%2C+condemn+those+who+seek+other+than+in+Christ%2C+whether+they+are+chosen+from+all+eternity%2C+and+what+God+has+decreed+of+them+before+all+beginning.+For+men+must+hear+the+gospel+preached+and+believe+it.+If+you+believe+and+are+in+Christ%2C+you+may+undoubtedly+reckon+that+you+are+elected.+For+the+Father+has+revealed+unto+us+in+Christ+His+eternal+sentence+of+predestination%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession+%281566%29%2C+ch.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa34880204e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a34880204e.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-b096402687" data-kw=""><blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful…</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>The Second Helvetic Confession (1566)</cite>, ch. 10</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful…”

d to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.”

onfessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God…”

s="tag here" href="../../topics/salvation/assurance.html" aria-current="page">Assurance</a><a class="tag" href="../../topics/salvation/faith.html">Faith</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a></div><div class="actions"><button class="copy" data-copy="“By justifying faith we understand, not only the common belief of the articles of the Christian religion, and a persuasion of the truth of God’s Word in general, but also a particular application of the gracious promises of the gospel to the comfort of our own souls, whereby we lay hold on Christ with all His benefits, having an earnest trust and confidence in God, that He will be merciful unto us for His only Son’s sake. So that a true believer may be certain, by the assurance of faith, of the forgiveness of his sins, and of his everlasting salvation by Christ.”

g salvation through Christ.”

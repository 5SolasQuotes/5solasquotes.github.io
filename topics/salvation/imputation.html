<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imputation · 5 Solas Quotes</title><meta name="description" content="Imputation — Salvation Applied"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231301"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../salvation.html">Salvation Applied</a> ›</p><h1>Imputation</h1><p class="sub">53 quotations from 27 authors</p><figure class="quote" id="q-e399ae0de2" data-kw="Imputation Forgiveness"><blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.11</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.”

— John Calvin, Institutes of the Christian Religion, 3.3.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSin%2C+however%2C+though+it+ceases+to+reign%2C+ceases+not+to+dwell+in+them.+%E2%80%A6+We+admit+that+these+remains%2C+just+as+if+they+had+no+existence%2C+are+not+imputed%2C+but+we%2C+at+the+same+time%2C+contend+that+it+is+owing+to+the+mercy+of+God+that+the+saints+are+not+charged+with+the+guilt+which+would+otherwise+make+them+sinners+before+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe399ae0de2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e399ae0de2.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin Regeneration Imputation"><blockquote><p>Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.21</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.”

— Francis Turretin, Institutes of Elenctic Theology, 9.11.21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+by+regeneration+we+hold+that+the+guilt+and+pollution+of+original+sin+is+taken+away+as+to+dominion+%28because+it+is+neither+imputed+to+them+anymore+for+condemnation%2C+nor+does+it+reign+in+them%29%2C+yet+we+deny+that+it+is+absolutely+taken+away+as+to+existence+and+whatever+holds+the+relation+of+sin+in+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.11.21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd141cab0f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d141cab0f1.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c4db61a2d0" data-kw="Imputation Forgiveness"><blockquote><p>That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+concupiscence+does+not+condemn+the+regenerate%2C+comes+to+pass+by+an+accident%2C+which+is+the+grace+of+God%2C+which+does+not+impute+it+to+the+faithful.+This%2C+however%2C+does+not+occur+in+this+way%2C+as+though+concupiscence+were+no+sin%3B+for+other+sins+in+like+manner+do+not+condemn+the+regenerate%2C+not+because+they+are+no+sins%2C+but+because+they+have+obtained+the+pardon+of+them+through+Christ.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4db61a2d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c4db61a2d0.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-14cd8c458c" data-kw="Imputation Forgiveness"><blockquote><p>Indeed it remains till death, and it is sin considered in itself, so long as it remains, but it is not imputed unto the person: and in that respect is as though it were not; it being pardoned.</p></blockquote><figcaption>— <a href="../../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, Of Original Sin</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Indeed it remains till death, and it is sin considered in itself, so long as it remains, but it is not imputed unto the person: and in that respect is as though it were not; it being pardoned.”

— William Perkins, A Reformed Catholic, Of Original Sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIndeed+it+remains+till+death%2C+and+it+is+sin+considered+in+itself%2C+so+long+as+it+remains%2C+but+it+is+not+imputed+unto+the+person%3A+and+in+that+respect+is+as+though+it+were+not%3B+it+being+pardoned.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+Of+Original+Sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14cd8c458c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/14cd8c458c.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" target="_blank" rel="noopener">Read it online · Internet Archive (1597 ed.)</a></div></figure><figure class="quote" id="q-9b16df32c0" data-kw="Imputation"><blockquote><p>When they demand, How can we be justified by the righteousness of another? Can I be rich with another man&#x27;s money, or preferred by another man&#x27;s honours? Our answer is, yes, if that other be my surety or husband. Indeed Peter can not be justified by the righteousness of Paul; but both may be justified by the righteousness of Christ imputed to them; they being members, jointly knit to one common Head. Principal and surety are one in obligations and constructions of law. Head and members are one body, branch and stock are one tree; and it is no strange thing to see a graff live by the sap of another stock, when once it is ingrafted into it.</p></blockquote><figcaption>— <a href="../../authors/john-flavel.html">John Flavel</a>, <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), reality of the union, 2nd proof</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“When they demand, How can we be justified by the righteousness of another? Can I be rich with another man&#x27;s money, or preferred by another man&#x27;s honours? Our answer is, yes, if that other be my surety or husband. Indeed Peter can not be justified by the righteousness of Paul; but both may be justified by the righteousness of Christ imputed to them; they being members, jointly knit to one common Head. Principal and surety are one in obligations and constructions of law. Head and members are one body, branch and stock are one tree; and it is no strange thing to see a graff live by the sap of another stock, when once it is ingrafted into it.”

— John Flavel, The Method of Grace, Sermon 2 (John 17:23), reality of the union, 2nd proof">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+they+demand%2C+How+can+we+be+justified+by+the+righteousness+of+another%3F+Can+I+be+rich+with+another+man%27s+money%2C+or+preferred+by+another+man%27s+honours%3F+Our+answer+is%2C+yes%2C+if+that+other+be+my+surety+or+husband.+Indeed+Peter+can+not+be+justified+by+the+righteousness+of+Paul%3B+but+both+may+be+justified+by+the+righteousness+of+Christ+imputed+to+them%3B+they+being+members%2C+jointly+knit+to+one+common+Head.+Principal+and+surety+are+one+in+obligations+and+constructions+of+law.+Head+and+members+are+one+body%2C+branch+and+stock+are+one+tree%3B+and+it+is+no+strange+thing+to+see+a+graff+live+by+the+sap+of+another+stock%2C+when+once+it+is+ingrafted+into+it.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+The+Method+of+Grace%2C+Sermon+2+%28John+17%3A23%29%2C+reality+of+the+union%2C+2nd+proof&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b16df32c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9b16df32c0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/flavel/grace" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-3c9d0a4c9c" data-kw=""><blockquote><p>Is man justified by the virtue and merit of faith, and other good works, formally by his own and inherent righteousness? Or only by the imputed righteousness of Christ, apprehended by faith? Neg. prior: Aff. posterior.</p></blockquote><figcaption>— <a href="../../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a>, <cite>Theological Disputation on the Errors of the Papists</cite>, p. 3, Loc. V, Thesis I</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Is man justified by the virtue and merit of faith, and other good works, formally by his own and inherent righteousness? Or only by the imputed righteousness of Christ, apprehended by faith? Neg. prior: Aff. posterior.”

— Johannes Hoornbeeck, Theological Disputation on the Errors of the Papists, p. 3, Loc. V, Thesis I">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs+man+justified+by+the+virtue+and+merit+of+faith%2C+and+other+good+works%2C+formally+by+his+own+and+inherent+righteousness%3F+Or+only+by+the+imputed+righteousness+of+Christ%2C+apprehended+by+faith%3F+Neg.+prior%3A+Aff.+posterior.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+Theological+Disputation+on+the+Errors+of+the+Papists%2C+p.+3%2C+Loc.+V%2C+Thesis+I&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c9d0a4c9c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3c9d0a4c9c.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9def8be007" data-kw=""><blockquote><p>To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.</p></blockquote><figcaption>— <a href="../../authors/jerry-bridges.html">Jerry Bridges</a>, <cite>Transforming Grace</cite>, p. 36</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.”

— Jerry Bridges, Transforming Grace, p. 36">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+be+justified+means+more+than+to+be+declared+%E2%80%9Cnot+guilty.%E2%80%9D+It+actually+means+to+be+declared+righteous+before+God.+It+means+God+has+imputed+or+charged+the+guilt+of+our+sin+to+His+Son%2C+Jesus+Christ%2C+and+has+imputed+or+credited+Christ%E2%80%99s+righteousness+to+us.%E2%80%9D%0A%0A%E2%80%94+Jerry+Bridges%2C+Transforming+Grace%2C+p.+36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9def8be007.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9def8be007.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-8bc0b3e7d4" data-kw=""><blockquote><p>It is entirely by the intervention of Christ’s righteousness that we obtain justification before God. This is equivalent to saying that man is not just in himself, but that the righteousness of Christ is communicated to him by imputation, while he is strictly deserving of punishment.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.23</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“It is entirely by the intervention of Christ’s righteousness that we obtain justification before God. This is equivalent to saying that man is not just in himself, but that the righteousness of Christ is communicated to him by imputation, while he is strictly deserving of punishment.”

— John Calvin, Institutes of the Christian Religion, 3.11.23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+entirely+by+the+intervention+of+Christ%E2%80%99s+righteousness+that+we+obtain+justification+before+God.+This+is+equivalent+to+saying+that+man+is+not+just+in+himself%2C+but+that+the+righteousness+of+Christ+is+communicated+to+him+by+imputation%2C+while+he+is+strictly+deserving+of+punishment.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bc0b3e7d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8bc0b3e7d4.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-f980f0e3eb" data-kw=""><blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.”

— Westminster Assembly, Westminster Confession of Faith, 11.1 (modern English)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+freely+justifies+the+persons+whom+he+effectually+calls.+He+does+this%2C+not+by+infusing+righteousness+into+them+but+by+pardoning+their+sins+and+by+accounting+them%2C+and+accepting+them+as+righteous.+This+He+does+for+Christ%E2%80%99s+sake+alone+and+not+for+anything+wrought+in+them+or+done+by+them.+The+righteousness+which+is+imputed+to+them%2C+that+is%2C+reckoned+to+their+account%2C+is+neither+their+faith+nor+the+act+of+believing+nor+any+obedience+to+the+gospel+which+they+have+rendered%2C+but+Christ%E2%80%99s+obedience+alone.+Christ%E2%80%99s+one+obedience+is+twofold+%E2%80%93+His+active+obedience+rendered+to+the+entire+divine+law%2C+and+His+passive+obedience+rendered+in+his+death.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+11.1+%28modern+English%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff980f0e3eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f980f0e3eb.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-1f4778137a" data-kw=""><blockquote><p>Justification is an act of God’s grace wherein He pardons all our sins and accepts us as righteous in His sight only for the righteousness of Christ imputed to us and received by faith alone.</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Shorter Catechism</cite>, Q. 33</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Justification is an act of God’s grace wherein He pardons all our sins and accepts us as righteous in His sight only for the righteousness of Christ imputed to us and received by faith alone.”

— Westminster Assembly, Westminster Shorter Catechism, Q. 33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+is+an+act+of+God%E2%80%99s+grace+wherein+He+pardons+all+our+sins+and+accepts+us+as+righteous+in+His+sight+only+for+the+righteousness+of+Christ+imputed+to+us+and+received+by+faith+alone.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Shorter+Catechism%2C+Q.+33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1f4778137a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1f4778137a.html">Permalink</a><a class="src" href="https://opc.org/sc.html" target="_blank" rel="noopener">Read it online · OPC</a></div></figure><figure class="quote" id="q-31ccf53a7e" data-kw=""><blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote><figcaption>— <a href="../../authors/john-gerstner.html">John Gerstner</a>, <cite>Theology for Everyman</cite>, ch. 6</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.””

— John Gerstner, Theology for Everyman, ch. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+has+a+positive+and+a+negative+element.+It+consists+at+once+in+the+removal+of+guilt+and+the+imputation%2C+or+granting%2C+of+righteousness.+It+rescues+the+sinner+as+a+brand+from+the+burning+and+at+the+same+time+gives+him+a+title+to+Heaven.+If+it+failed+to+do+either+of+these%2C+it+would+fail+to+do+anything.+For+man%2C+as+a+sinner+against+God%2C+must+have+that+enormous+guilt+somehow+removed.+But%2C+at+the+same+time%2C+if+he+had+the+guilt+removed%2C+he+would+still+be+devoid+of+positive+righteousness+and+with+no+title+to+Heaven+and+would+also+be+certain+to+fall+again+into+sin+and+condemnation.+If+Christ+only+cancelled+out+guilt%2C+He+would+merely+return+the+sinner+to+Adam%E2%80%99s+original+state+without+Adam%E2%80%99s+original+perfection+of+nature.+There+must+be+the+%E2%80%9Cdouble+cure.%E2%80%9D%E2%80%9D%0A%0A%E2%80%94+John+Gerstner%2C+Theology+for+Everyman%2C+ch.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31ccf53a7e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/31ccf53a7e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-1abfa1fa62" data-kw=""><blockquote><p>In Christianity, the moment we believe, God imputes Christ’s perfect performance to us as if it were our own, and adopts us into His family. In other words, God can say to us just as He once said to Christ, “You are my Son, whom I love; with you I am well pleased.”</p></blockquote><figcaption>— <a href="../../authors/tim-keller.html">Tim Keller</a>, <cite>The Freedom of Self-Forgetfulness</cite>, p. 40</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“In Christianity, the moment we believe, God imputes Christ’s perfect performance to us as if it were our own, and adopts us into His family. In other words, God can say to us just as He once said to Christ, “You are my Son, whom I love; with you I am well pleased.””

— Tim Keller, The Freedom of Self-Forgetfulness, p. 40">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Christianity%2C+the+moment+we+believe%2C+God+imputes+Christ%E2%80%99s+perfect+performance+to+us+as+if+it+were+our+own%2C+and+adopts+us+into+His+family.+In+other+words%2C+God+can+say+to+us+just+as+He+once+said+to+Christ%2C+%E2%80%9CYou+are+my+Son%2C+whom+I+love%3B+with+you+I+am+well+pleased.%E2%80%9D%E2%80%9D%0A%0A%E2%80%94+Tim+Keller%2C+The+Freedom+of+Self-Forgetfulness%2C+p.+40&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1abfa1fa62.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1abfa1fa62.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-f635f317d4" data-kw=""><blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote><figcaption>— <a href="../../authors/john-piper.html">John Piper</a>, <cite>This Momentary Marriage</cite>, p. 46</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).”

— John Piper, This Momentary Marriage, p. 46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+goes+beyond+forgiveness.+Not+only+are+we+forgiven+because+of+Christ%2C+but+God+also+declares+us+righteous+because+of+Christ.+God+requires+two+things+of+us%3A+punishment+for+our+sins+and+perfection+in+our+lives.+Our+sins+must+be+punished%2C+and+our+lives+must+be+righteous.+But+we+cannot+bear+our+own+punishment+%28Ps.+49%3A7-8%29%2C+and+we+cannot+provide+our+own+righteousness.+%E2%80%9CNone+is+righteous%3B+no%2C+not+one%E2%80%9D+%28Rom.+3%3A10%29.+Therefore%2C+God%2C+out+of+His+immeasurable+love+for+us%2C+provided+His+own+Son+to+do+both.+Christ+bears+our+punishment%2C+and+Christ+performs+our+righteousness.+And+when+we+receive+Christ+%28John+1%3A12%29%2C+all+of+His+punishment+and+all+of+His+righteousness+is+counted+as+ours+%28Rom.+4%3A4-6%3B+5%3A1%2C+19%3B+8%3A1%3B+10%3A4%3B+2+Cor.+5%3A21%3B+Phil.+3%3A8-9%29.%E2%80%9D%0A%0A%E2%80%94+John+Piper%2C+This+Momentary+Marriage%2C+p.+46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff635f317d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f635f317d4.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-eceb6fae86" data-kw=""><blockquote><p>For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.6</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.”

— John Calvin, Institutes of the Christian Religion, 3.11.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%2C+in+the+whole+of+this+discussion%2C+the+noun+righteousness+and+the+verb+to+justify%2C+are+extended+by+Osiander+to+two+parts%3B+to+be+justified+being+not+only+to+be+reconciled+to+God+by+a+free+pardon%2C+but+also+to+be+made+just%3B+and+righteousness+being+not+a+free+imputation%2C+but+the+holiness+and+integrity+which+the+divine+essence+dwelling+in+us+inspires.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feceb6fae86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/eceb6fae86.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-2292c0d676" data-kw=""><blockquote><p>In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.6</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.”

— John Calvin, Institutes of the Christian Religion, 3.11.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+confusion+of+a+twofold+grace%2C+which+Osiander+obtrudes+upon+us%2C+there+is+a+similar+absurdity.+Because+those+whom+God+freely+regards+as+righteous%2C+he+in+fact+renews+to+the+cultivation+of+righteousness%2C+Osiander+confounds+that+free+acceptance+with+this+gift+of+regeneration%2C+and+contends+that+they+are+one+and+the+same.+But+Scriptures+while+combining+both%2C+classes+them+separately%2C+that+it+may+the+better+display+the+manifold+grace+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2292c0d676.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2292c0d676.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-4e9b07758c" data-kw=""><blockquote><p>Osiander&#x27;s objection as to its being inconsistent with the nature of God, falls back upon himself; for though he clothes the saints with a twofold righteousness as with a coat of skins, he is, however, forced to admit, that without forgiveness no man is pleasing to God. If this be so, let him at least admit, that with reference to what is called the proportion of imputation, those are regarded as righteous who are not so in reality.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.11</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Osiander&#x27;s objection as to its being inconsistent with the — John Calvin, Institutes of the Christian Religion, 3.11.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COsiander%27s+objection+as+to+its+being+inconsistent+with+the+nature+of+God%2C+falls+back+upon+himself%3B+for+though+he+clothes+the+saints+with+a+twofold+righteousness+as+with+a+coat+of+skins%2C+he+is%2C+however%2C+forced+to+admit%2C+that+without+forgiveness+no+man+is+pleasing+to+God.+If+this+be+so%2C+let+him+at+least+admit%2C+that+with+reference+to+what+is+called+the+proportion+of+imputation%2C+those+are+regarded+as+righteous+who+are+not+so+in+reality.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e9b07758c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4e9b07758c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-7e72c3035e" data-kw=""><blockquote><p>In short, every one who, by the entanglement of a twofold righteousness, prevents miserable souls from resting entirely on the mere mercy of God, mocks Christ by putting on him a crown of plaited thorns.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.12</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“In short, every one who, by the entanglement of a twofold righteousness, prevents miserable souls from resting entirely on the mere mercy of God, mocks Christ by putting on him a crown of plaited thorns.”

— John Calvin, Institutes of the Christian Religion, 3.11.12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+short%2C+every+one+who%2C+by+the+entanglement+of+a+twofold+righteousness%2C+prevents+miserable+souls+from+resting+entirely+on+the+mere+mercy+of+God%2C+mocks+Christ+by+putting+on+him+a+crown+of+plaited+thorns.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e72c3035e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7e72c3035e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-16ec124bdb" data-kw=""><blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.”

— John Calvin, Acts of the Council of Trent with the Antidote, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+whole+dispute+is+as+to+The+Cause+of+Justification.+The+Fathers+of+Trent+pretend+that+it+is+twofold%2C+as+if+we+were+justified+partly+by+forgiveness+of+sins+and+partly+by+spiritual+regeneration%3B+or%2C+to+express+their+view+in+other+words%2C+as+if+our+righteousness+were+composed+partly+of+imputation%2C+partly+of+quality.+I+maintain+that+it+is+one%2C+and+simple%2C+and+is+wholly+included+in+the+gratuitous+acceptance+of+God.+I+besides+hold+that+it+is+without+us%2C+because+we+are+righteous+in+Christ+only.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Acts+of+the+Council+of+Trent+with+the+Antidote%2C+Antidote+to+the+Sixth+Session%2C+on+the+decree+%28ch.+7%2C+the+causes+of+justification%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16ec124bdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/16ec124bdb.html">Permalink</a><a class="src" href="https://www.uecf.net/books/acts-trent-4/chapter18.html" target="_blank" rel="noopener">Read it online · UECF (Calvin&#x27;s Tracts)</a></div></figure><figure class="quote" id="q-41a65a8c0f" data-kw=""><blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.”

— John Calvin, Acts of the Council of Trent with the Antidote, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+they+again+affirm+that+we+are+truly+righteous%2C+and+not+merely+counted+so.+I%2C+on+the+contrary%2C+while+I+admit+that+we+are+never+received+into+the+favor+of+God+without+being+at+the+same+time+regenerated+to+holiness+of+life%2C+contend+that+it+is+false+to+say+that+any+part+of+righteousness+%28justification%29+consists+in+quality%2C+or+in+the+habit+which+resides+in+us%2C+and+that+we+are+righteous+%28justified%29+only+by+gratuitous+acceptance.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Acts+of+the+Council+of+Trent+with+the+Antidote%2C+Antidote+to+the+Sixth+Session%2C+on+the+decree+%28ch.+7%2C+the+formal+cause%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41a65a8c0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/41a65a8c0f.html">Permalink</a><a class="src" href="https://www.uecf.net/books/acts-trent-4/chapter18.html" target="_blank" rel="noopener">Read it online · UECF (Calvin&#x27;s Tracts)</a></div></figure><figure class="quote" id="q-b7f7f8b773" data-kw=""><blockquote><p>They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 10</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.”

— John Calvin, Acts of the Council of Trent with the Antidote, Antidote to the Sixth Session, on Canon 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+formerly+asserted+in+their+decrees+that+the+righteousness+of+God+was+the+only+formal+cause+of+Justification%3B+now+they+anathematize+those+who+say+that+we+are+formally+righteous+by+the+obedience+of+Christ.+%E2%80%A6+if+any+one+were+to+teach+that+we+are+righteous+formally%2C+i.e.%2C+not+by+quality+but+by+imputation%2C+meaning+that+our+righteousness+is+in+relation+merely%2C+there+would+be+nothing+worthy+of+censure.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Acts+of+the+Council+of+Trent+with+the+Antidote%2C+Antidote+to+the+Sixth+Session%2C+on+Canon+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7f7f8b773.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b7f7f8b773.html">Permalink</a><a class="src" href="https://www.uecf.net/books/acts-trent-4/chapter19.html" target="_blank" rel="noopener">Read it online · UECF (Calvin&#x27;s Tracts)</a></div></figure><figure class="quote" id="q-b37d09fdd4" data-kw=""><blockquote><p>From this interpretation of Andrada I now finally understand what the Tridentine decree is after when it declares that justification consists of two parts, remission of sins and renewal, because they nevertheless say not long afterward that the sole formal cause of justification is the renewal, or love.</p></blockquote><figcaption>— <a href="../../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“From this interpretation of Andrada I now finally understand what the Tridentine decree is after when it declares that justification consists of two parts, remission of sins and renewal, because they nevertheless say not long afterward that the sole formal cause of justification is the renewal, or love.”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Topic on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+this+interpretation+of+Andrada+I+now+finally+understand+what+the+Tridentine+decree+is+after+when+it+declares+that+justification+consists+of+two+parts%2C+remission+of+sins+and+renewal%2C+because+they+nevertheless+say+not+long+afterward+that+the+sole+formal+cause+of+justification+is+the+renewal%2C+or+love.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+1%2C+Topic+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb37d09fdd4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b37d09fdd4.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a046484a06" data-kw=""><blockquote><p>And consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.</p></blockquote><figcaption>— <a href="../../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“And consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Topic on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+consequently+he+contends+that+justification+consists+of+two+parts%2C+namely%2C+reconciliation+and+the+other+new+virtues.+%E2%80%A6+Out+of+these+effects%2C+Andrada%2C+in+his+subtlety%2C+makes+the+cause+and+form+of+justification.+We%2C+indeed%2C+do+not+deny+these+and+other+effects+of+justification%2C+but+we+do+not+say+that+the+effects+are+the+causes.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+1%2C+Topic+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa046484a06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a046484a06.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a8d5e74bd6" data-kw=""><blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers</p></blockquote><figcaption>— <a href="../../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Topic on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+our+inherent+righteousness%2C+which+is+begun+in+the+renewal+through+the+Holy+Spirit%2C+is+not+such+on+account+of+the+adhering+imperfection+and+impurity+of+the+flesh.+Therefore+a+different+righteousness+is+necessary%2C+by+which%2C+when+it+enters+in+and+intercedes%2C+we+may+be+justified+before+God+to+life+eternal.+This+indeed+is+the+satisfaction+and+obedience%2C+that+is%2C+the+righteousness+of+Christ%2C+the+Mediator%2C+which+is+offered+through+the+ministry+of+the+Word+and+of+the+sacraments%2C+is+apprehended+by+faith%2C+and+is+imputed+by+God+to+the+believers%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+1%2C+Topic+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8d5e74bd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a8d5e74bd6.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6d5550648d" data-kw=""><blockquote><p>Thus, because they place the formal cause of their justification before God for life eternal in the qualities of inherent righteousness; … therefore those who want to be justified in this manner deserve to be always in doubt concerning their salvation.</p></blockquote><figcaption>— <a href="../../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“Thus, because they place the formal cause of their justification before God for life eternal in the qualities of inherent righteousness; … therefore those who want to be justified in this manner deserve to be always in doubt concerning their salvation.”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Topic on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%2C+because+they+place+the+formal+cause+of+their+justification+before+God+for+life+eternal+in+the+qualities+of+inherent+righteousness%3B+%E2%80%A6+therefore+those+who+want+to+be+justified+in+this+manner+deserve+to+be+always+in+doubt+concerning+their+salvation.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+1%2C+Topic+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d5550648d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6d5550648d.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-da668ac3be" data-kw=""><blockquote><p>The formal cause, they say, is the justice of God; not that justice, whereby he himself is just; but that which he communicateth unto us, whereby we truly both are counted just, and also are so indeed. By which words they understand the renewing of a man now regenerate, and his new forming by grace and the holy Ghost. The which things, that they are done in a man already justified, we deny not: but that justification consisteth therein, we cannot grant.</p></blockquote><figcaption>— <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a>, <cite>The Common Places</cite>, Part 3, ch. 4: Of Justification, § 46</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“The formal cause, they say, is the justice of God; not that justice, whereby he himself is just; but that which he communicateth unto us, whereby we truly both are counted just, and also are so indeed. By which words they understand the renewing of a man now regenerate, and his new forming by grace and the holy Ghost. The which things, that they are done in a man already justified, we deny not: but that justification consisteth therein, we cannot grant.”

— Peter Martyr Vermigli, The Common Places, Part 3, ch. 4: Of Justification, § 46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+formal+cause%2C+they+say%2C+is+the+justice+of+God%3B+not+that+justice%2C+whereby+he+himself+is+just%3B+but+that+which+he+communicateth+unto+us%2C+whereby+we+truly+both+are+counted+just%2C+and+also+are+so+indeed.+By+which+words+they+understand+the+renewing+of+a+man+now+regenerate%2C+and+his+new+forming+by+grace+and+the+holy+Ghost.+The+which+things%2C+that+they+are+done+in+a+man+already+justified%2C+we+deny+not%3A+but+that+justification+consisteth+therein%2C+we+cannot+grant.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+The+Common+Places%2C+Part+3%2C+ch.+4%3A+Of+Justification%2C+%C2%A7+46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda668ac3be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/da668ac3be.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-569d0412b6" data-kw=""><blockquote><p>And therefore we say, that in that righteousness and instauration, (whereby we are fashioned anew by God) cannot consist justification, because the same through our corruption is imperfect, so that we cannot stand therewith before the judgment seat of Christ.</p></blockquote><figcaption>— <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a>, <cite>The Common Places</cite>, Part 3, ch. 4: Of Justification, § 46</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“And therefore we say, that in that righteousness and instauration, (whereby we are fashioned anew by God) — Peter Martyr Vermigli, The Common Places, Part 3, ch. 4: Of Justification, § 46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+therefore+we+say%2C+that+in+that+righteousness+and+instauration%2C+%28whereby+we+are+fashioned+anew+by+God%29+cannot+consist+justification%2C+because+the+same+through+our+corruption+is+imperfect%2C+so+that+we+cannot+stand+therewith+before+the+judgment+seat+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+The+Common+Places%2C+Part+3%2C+ch.+4%3A+Of+Justification%2C+%C2%A7+46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F569d0412b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/569d0412b6.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-835360d60a" data-kw=""><blockquote><p>we attribute justification to neither faith otherwise than as an instrument, nor to good works otherwise than as witnesses of true faith. Instead, we attribute the righteousness of Christ alone as the material cause, and imputation as the formal cause.</p></blockquote><figcaption>— <a href="../../authors/theodore-beza.html">Theodore Beza</a>, <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s First Objection</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“we attribute justification to neither faith otherwise than as an instrument, nor to good works otherwise than as witnesses of true faith. Instead, we attribute the righteousness of Christ alone as the material cause, and imputation as the formal cause.”

— Theodore Beza, A Defense of Justification through the Righteousness of Christ Alone, reply to the Anonymous Man’s First Objection">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cwe+attribute+justification+to+neither+faith+otherwise+than+as+an+instrument%2C+nor+to+good+works+otherwise+than+as+witnesses+of+true+faith.+Instead%2C+we+attribute+the+righteousness+of+Christ+alone+as+the+material+cause%2C+and+imputation+as+the+formal+cause.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Defense+of+Justification+through+the+Righteousness+of+Christ+Alone%2C+reply+to+the+Anonymous+Man%E2%80%99s+First+Objection&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F835360d60a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/835360d60a.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-766cef99fd" data-kw=""><blockquote><p>In this way the formal cause of that remedy against these effects should belong to the same nature—that is, not something inhering in us but proceeding from a different direction and causing conditions opposed to the former conditions.</p></blockquote><figcaption>— <a href="../../authors/theodore-beza.html">Theodore Beza</a>, <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</figcaption><div class="meta"><a class="tag here" href="../../topics/salvation/imputation.html" aria-current="page">Imputation</a><a class="tag" href="../../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“In this way the formal cause of that remedy against these effects should belong to the same nature—that is, not something inhering in us but proceeding from a different direction and causing conditions opposed to the former conditions.”

n that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification”

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fall · 5 Solas Quotes</title><meta name="description" content="The Fall — The Fall &amp; Sin"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../fall-and-sin.html">The Fall &amp; Sin</a> ›</p><h1>The Fall</h1><p class="sub">20 quotations from 15 authors</p><figure class="quote" id="q-f9412b24db" data-kw="Original Sin The Fall Author of sin"><blockquote><p>We say, then, that man is corrupted by a natural viciousness, but not by one which proceeded from nature. In saying that it proceeded not from nature, we mean that it was rather an adventitious event which befell man, than a substantial property assigned to him from the beginning.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.1.11</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“We say, then, that man is corrupted by a natural viciousness, but not by one which proceeded from nature. In saying that it proceeded not from nature, we mean that it was rather an adventitious event which befell man, than a substantial property assigned to him from the beginning.”

— John Calvin, Institutes of the Christian Religion, 2.1.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+say%2C+then%2C+that+man+is+corrupted+by+a+natural+viciousness%2C+but+not+by+one+which+proceeded+from+nature.+In+saying+that+it+proceeded+not+from+nature%2C+we+mean+that+it+was+rather+an+adventitious+event+which+befell+man%2C+than+a+substantial+property+assigned+to+him+from+the+beginning.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.1.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9412b24db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f9412b24db.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-a4595f704a" data-kw="Original Sin Author of sin"><blockquote><p>Now although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.12.10</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“Now although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.”

— Francis Turretin, Institutes of Elenctic Theology, 9.12.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+souls+are+created+by+God+destitute+of+original+righteousness%2C+God+cannot+on+that+account+be+considered+the+author+of+sin.+It+is+one+thing+to+infuse+impurity%3B+another+not+to+give+the+purity+of+which+man+has+rendered+himself+unworthy+in+Adam.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.12.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4595f704a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a4595f704a.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice"><blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on original sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+this+is+certain%2C+that+God+doth+not+infuse+it.+Souls+receive+neither+purity+nor+impurity+from+him%2C+but+only+their+naked+essence%2C+and+the+natural+powers+and+properties+flowing+therefrom.+He+doth+not+infuse+any+impurity+into+men%3B+for+he+cannot+be+the+author+of+sin%2C+who+is+the+revenger+of+it.+%E2%80%A6+As+a+pure+and+holy+God%2C+he+cannot+infuse+any+impurity+into+the+souls+of+men%3B+and+as+a+just+and+righteous+God%2C+he+may+and+doth+withhold+from%2C+or+create+them+void+and+destitute+of%2C+that+holiness+and+righteousness+which+was+once+their+happiness+and+glory.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+original+sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac2cd3cfb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ac2cd3cfb9.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-7c2b4a999d" data-kw="Original Sin Depravity Author of sin"><blockquote><p>In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 4, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.”

— Jonathan Edwards, The Great Christian Doctrine of Original Sin Defended, pt. 4, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+order+to+account+for+a+sinful+corruption+of+nature%2C+yea%2C+a+total+native+depravity+of+the+heart+of+man%2C+there+is+not+the+least+need+of+supposing+any+evil+quality%2C+infused%2C+implanted%2C+or+wrought+into+the+nature+of+man%2C+by+any+positive+cause%2C+or+influence+whatsoever%2C+either+from+God%2C+or+the+creature%3B+or+of+supposing%2C+that+man+is+conceived+and+born+with+a+fountain+of+evil+in+his+heart%2C+such+as+is+any+thing+properly+positive.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+Great+Christian+Doctrine+of+Original+Sin+Defended%2C+pt.+4%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c2b4a999d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c2b4a999d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/works1" target="_blank" rel="noopener">Read it online · CCEL, Works vol. 1</a></div></figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice"><blockquote><p>But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, Vol. 2 (on original sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.”

— Charles Hodge, Systematic Theology, Vol. 2 (on original sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+He+is+not+the+author+of+the+evil+dispositions+with+which+that+nature+is+infected+at+birth.+The+doctrine+of+original+sin+attributes+no+efficiency+to+God+in+the+production+of+evil.+It+simply+supposes+that+He+judicially+abandons+our+apostate+race%2C+and+withholds+from+the+descendants+of+Adam+the+manifestations+of+his+favour+and+love%2C+which+are+the+life+of+the+soul.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+Vol.+2+%28on+original+sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3630fcaed0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3630fcaed0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology2" target="_blank" rel="noopener">Read it online · CCEL, vol. 2</a></div></figure><figure class="quote" id="q-d7537e3755" data-kw="Original Sin"><blockquote><p>Nor does original sin cease to be sin because it was committed by us neither voluntarily nor knowingly; for it is enough that τὸ ἄνομον [to anomon, the lawless thing] is in our nature</p></blockquote><figcaption>— <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, 1.10</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“Nor does original sin cease to be sin because it was committed by us neither voluntarily nor knowingly; for it is enough that τὸ ἄνομον [to anomon, the lawless thing] is in our nature”

— Johannes Wollebius, Compendium of Christian Theology, 1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+does+original+sin+cease+to+be+sin+because+it+was+committed+by+us+neither+voluntarily+nor+knowingly%3B+for+it+is+enough+that+%CF%84%E1%BD%B8+%E1%BC%84%CE%BD%CE%BF%CE%BC%CE%BF%CE%BD+%5Bto+anomon%2C+the+lawless+thing%5D+is+in+our+nature%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7537e3755.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d7537e3755.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity"><blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote><figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 15</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.”

— Guido de Brès, Belgic Confession, Art. 15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+believe+that+through+the+disobedience+of+Adam+original+sin+is+extended+to+all+mankind%3B+which+is+a+corruption+of+the+whole+nature+and+a+hereditary+disease%2C+%E2%80%A6+and+which+produces+in+man+all+sorts+of+sin%2C+being+in+him+as+a+root+thereof%2C+and%2C+therefore%2C+is+so+vile+and+abominable+in+the+sight+of+God+that+it+is+sufficient+to+condemn+all+mankind.+%E2%80%A6+Not+that+they+should+rest+securely+in+sin%2C+but+that+a+sense+of+this+corruption+should+make+believers+often+to+sigh%2C+desiring+to+be+delivered+from+this+body+of+death.%E2%80%9D%0A%0A%E2%80%94+Guido+de+Br%C3%A8s%2C+Belgic+Confession%2C+Art.+15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19ea18ba90.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/19ea18ba90.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/belgic-confession" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-6156ddcc2e" data-kw="Author of sin The Fall Original Sin"><blockquote><p>It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.1.10</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.”

— John Calvin, Institutes of the Christian Religion, 2.1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+true+that+nature+has+received+a+mortal+wound%2C+but+there+is+a+great+difference+between+a+wound+inflicted+from+without%2C+and+one+inherent+in+our+first+condition.+It+is+plain+that+this+wound+was+inflicted+by+sin%3B+and%2C+therefore%2C+we+have+no+ground+of+complaint+except+against+ourselves.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6156ddcc2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6156ddcc2e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin The Fall Permission"><blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote><figcaption>— <a href="../../authors/herman-witsius.html">Herman Witsius</a>, <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.”

— Herman Witsius, The Economy of the Covenants, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+make+God+the+author+of+sin+is+such+foul+blasphemy%2C+that+it+can+never+enter+any+Christian+man%E2%80%99s+mind+without+a+shudder.+It+is+indeed+true+that+God+had+made+man+mutably+good%2C+had+infallibly+foreseen+his+sin%2C+had+foreordained+the+permission+of+the+sin+and+given+man+no+doubt+sufficient+strength+to+shun+sin%2C+but+inoperable+without+His+influx%3B+that+meanwhile+He+had+inflowed+into+man%E2%80%99s+faculties+for+natural+actions+by+not+inflowing+into+the+moral+entity+of+such+actions.+%E2%80%A6+But+it+is+not+less+true%2C+that+God+neither+is+nor+could+in+any+way+become+the+author+of+sin.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants%2C+1.8.28+%28as+quoted+in+Heinrich+Heppe%2C+Reformed+Dogmatics%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F360e80a51b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/360e80a51b.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-561ca6a8d8" data-kw="Author of sin The Fall Satan Temptation"><blockquote><p>Not unto God; he is not the author of sin, nor tempts unto it; nor is he tempted by it: nor to Satan, only as an instrument, enticing and deceiving; but to themselves, to their own will, it was their own act and deed.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“Not unto God; he is not the author of sin, nor tempts unto it; nor is he tempted by it: nor to Satan, only as an instrument, enticing and deceiving; but to themselves, to their own will, it was their own act and deed.”

— John Gill, A Body of Doctrinal Divinity, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+unto+God%3B+he+is+not+the+author+of+sin%2C+nor+tempts+unto+it%3B+nor+is+he+tempted+by+it%3A+nor+to+Satan%2C+only+as+an+instrument%2C+enticing+and+deceiving%3B+but+to+themselves%2C+to+their+own+will%2C+it+was+their+own+act+and+deed.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+A+Body+of+Doctrinal+Divinity%2C+bk.+3%2C+ch.+8+%28Of+the+Sin+and+Fall+of+Our+First+Parents%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F561ca6a8d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/561ca6a8d8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/gill/doctrinal" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall"><blockquote><p>And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote><figcaption>— <a href="../../authors/synod-of-debrecen.html">Synod of Debrecen</a>, <cite>Documents of the Synod of Debrecen (1567)</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).”

— Synod of Debrecen, Documents of the Synod of Debrecen (1567)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+just+as+he+that+wishes+to+punish+someone+by+fumigating+with+a+foul+smell%2C+sulfur+and+dung%2C+does+not+put+a+foul+smell+into+the+sulfur+and+dung+%28it+already+is+there%29%2C+so+God%2C+when+He+punishes+sins+through+the+devil+and+the+vessels+of+wrath+with+sins%2C+does+not+put+any+sin+into+them%2C+but+it+is+there+naturally+since+the+fall+in+the+devil+and+in+men+%28Eph.+4%3B+Rom.+1%29.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Debrecen%2C+Documents+of+the+Synod+of+Debrecen+%281567%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F215040d6fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/215040d6fd.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-276fa7e7b7" data-kw="Hardening Original Sin Depravity"><blockquote><p>Thus God is said to harden men, not by positive hardening, or working anything in the creature, but by not working, not softening, leaving a man to the hardness of his own heart, whereby it is unavoidable, by the depravation of man’s nature, and the fury of his passions, but that he should be further hardened. … If you put fire near to wax or resin, both will melt; but when the fire is removed, they return to their natural quality of hardness and brittleness. The positive act of the fire is to melt and soften, and the softness of the rosin is to be ascribed to that, but the hardness is from the resin itself, wherein the fire hath no influence, but only a negative act by a removal of it; so when God hardens a man, he only leaves him to that stony heart which he derived from Adam, and brought with him into the world.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“Thus God is said to harden men, not by positive hardening, or working anything in the creature, but by not working, not softening, leaving a man to the hardness of his own heart, whereby it is unavoidable, by the depravation of man’s nature, and the fury of his passions, but that he should be further hardened. … If you put fire near to wax or resin, both will melt; but when the fire is removed, they return to their natural quality of hardness and brittleness. The positive act of the fire is to melt and soften, and the softness of the rosin is to be ascribed to that, but the hardness is from the resin itself, wherein the fire hath no influence, but only a negative act by a removal of it; so when God hardens a man, he only leaves him to that stony heart which he derived from Adam, and brought with him into the world.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Holiness of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+God+is+said+to+harden+men%2C+not+by+positive+hardening%2C+or+working+anything+in+the+creature%2C+but+by+not+working%2C+not+softening%2C+leaving+a+man+to+the+hardness+of+his+own+heart%2C+whereby+it+is+unavoidable%2C+by+the+depravation+of+man%E2%80%99s+nature%2C+and+the+fury+of+his+passions%2C+but+that+he+should+be+further+hardened.+%E2%80%A6+If+you+put+fire+near+to+wax+or+resin%2C+both+will+melt%3B+but+when+the+fire+is+removed%2C+they+return+to+their+natural+quality+of+hardness+and+brittleness.+The+positive+act+of+the+fire+is+to+melt+and+soften%2C+and+the+softness+of+the+rosin+is+to+be+ascribed+to+that%2C+but+the+hardness+is+from+the+resin+itself%2C+wherein+the+fire+hath+no+influence%2C+but+only+a+negative+act+by+a+removal+of+it%3B+so+when+God+hardens+a+man%2C+he+only+leaves+him+to+that+stony+heart+which+he+derived+from+Adam%2C+and+brought+with+him+into+the+world.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+The+Existence+and+Attributes+of+God%2C+Discourse+on+the+Holiness+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F276fa7e7b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/276fa7e7b7.html">Permalink</a><a class="src" href="https://archive.org/details/discoursesupone02char" target="_blank" rel="noopener">Read it online · Internet Archive, vol. 2</a></div></figure><figure class="quote" id="q-a923204566" data-kw="Permission Author of sin The Fall"><blockquote><p>God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Holiness of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+acted+nothing%2C+but+only+ceased+to+act%2C+and+therefore+could+not+be+the+efficient+cause+of+man%E2%80%99s+sin.+As+God+is+not+the+author+of+good+but+by+willing+and+effecting+it%2C+so+he+is+not+the+author+of+evil+but+by+willing+and+effecting+it.+But+he+doth+not+positively+will+evil%2C+nor+effect+it+by+any+efficacy+of+his+own.+Permission+is+no+action%2C+nor+the+cause+of+that+action+which+is+permitted%2C+but+the+will+of+that+person+who+is+permitted+to+do+such+an+action+is+the+cause.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+The+Existence+and+Attributes+of+God%2C+Discourse+on+the+Holiness+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa923204566.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a923204566.html">Permalink</a><a class="src" href="https://archive.org/details/discoursesupone02char" target="_blank" rel="noopener">Read it online · Internet Archive, vol. 2</a></div></figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall"><blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 5.4</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a></div><div class="actions"><button class="copy" data-copy="“The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 5.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+almighty+power%2C+unsearchable+wisdom%2C+and+infinite+goodness+of+God%2C+so+far+manifest+themselves+in+His+providence%2C+that+His+determinate+counsel+extends+itself+even+to+the+first+fall%2C+and+all+other+sinful+actions+both+of+angels+and+men+%28Rom.+11%3A32%E2%80%9334%3B+2+Sam.+24%3A1%3B+1+Chron.+21%3A1%29%3B+and+that+not+by+a+bare+permission%2C+which+also+He+most+wisely+and+powerfully+bounds%2C+and+otherwise+orders+and+governs+%282+Kings+19%3A28%3B+Ps.+76%3A10%29%2C+in+a+manifold+dispensation+to+His+most+holy+ends+%28Gen.+50%3A20%3B+Isa.+10%3A6%E2%80%937%2C+12%29%3B+yet+so%2C+as+the+sinfulness+of+their+acts+proceeds+only+from+the+creatures%2C+and+not+from+God%2C+who%2C+being+most+holy+and+righteous%2C+neither+is+nor+can+be+the+author+or+approver+of+sin+%28Ps.+50%3A21%3B+1+John+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+5.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F86e8b1fd52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/86e8b1fd52.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-e31e9ad7d3" data-kw="Original Sin"><blockquote><p>Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcupiscence%2C+although+it+is+without+doubt+born+in+us%2C+is+both+an+evil+and+sin%3B+for+we+are+not+to+judge+according+to+nature%2C+but+according+to+the+law+whether+a+thing+be+sin+or+not.+Whatever+is+opposed+to+the+law+is+sin%2C+whether+it+be+born+in+us%2C+or+not.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe31e9ad7d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e31e9ad7d3.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-b5e3099fd5" data-kw="Original Sin"><blockquote><p>This corruption of nature is here forbidden, for it is truly and properly sin, Rom. 6:12 and 7:17. It is the flesh that lusteth against the Spirit, Gal. 5:18; and if sin, it must be contrary to and forbidden by the law.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, The Tenth Commandment</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a></div><div class="actions"><button class="copy" data-copy="“This corruption of nature is here forbidden, for it is truly and properly sin, Rom. 6:12 and 7:17. It is the flesh that lusteth against the Spirit, Gal. 5:18; and if sin, it must be contrary to and forbidden by the law.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, The Tenth Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+corruption+of+nature+is+here+forbidden%2C+for+it+is+truly+and+properly+sin%2C+Rom.+6%3A12+and+7%3A17.+It+is+the+flesh+that+lusteth+against+the+Spirit%2C+Gal.+5%3A18%3B+and+if+sin%2C+it+must+be+contrary+to+and+forbidden+by+the+law.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+The+Tenth+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5e3099fd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b5e3099fd5.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin Regeneration Imputation"><blockquote><p>Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.21</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.”

— Francis Turretin, Institutes of Elenctic Theology, 9.11.21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+by+regeneration+we+hold+that+the+guilt+and+pollution+of+original+sin+is+taken+away+as+to+dominion+%28because+it+is+neither+imputed+to+them+anymore+for+condemnation%2C+nor+does+it+reign+in+them%29%2C+yet+we+deny+that+it+is+absolutely+taken+away+as+to+existence+and+whatever+holds+the+relation+of+sin+in+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.11.21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd141cab0f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d141cab0f1.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-97321aa156" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).”

— Westminster Assembly, Westminster Confession of Faith, 6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+corruption+of+nature%2C+during+this+life%2C+doth+remain+in+those+that+are+regenerated+%281+John+1%3A8%2C+10%3B+Rom.+7%3A14%2C+17%E2%80%9318%2C+23%3B+James+3%3A2%3B+Prov.+20%3A9%3B+Eccl.+7%3A20%29%3B+and+although+it+be%2C+through+Christ%2C+pardoned+and+mortified%3B+yet+both+itself%2C+and+all+the+motions+thereof%2C+are+truly+and+properly+sin+%28Rom.+7%3A5%2C+7%E2%80%938%2C+25%3B+Gal.+5%3A17%29.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97321aa156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/97321aa156.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/the-fall.html" aria-current="page">The Fall</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).”

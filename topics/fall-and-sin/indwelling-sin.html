ng Sin in Believers</cite>, ch. 4</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/christian-life/mortification.html">Mortification</a></div><div class="actions"><button class="copy" data-copy="“Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.”

— John Owen, Indwelling Sin in Believers, ch. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+spark+of+fire+is+fire%2C+and+will+burn%3B+so+is+every+thing+of+the+law+of+sin%2C+the+last%2C+the+least+of+it%2C+--+it+is+enmity%2C+it+will+poison%2C+it+will+burn.+%E2%80%A6+Mortification+abates+of+its+force%2C+but+doth+not+change+its+nature.+Grace+changeth+the+nature+of+man%2C+but+nothing+can+change+the+nature+of+sin.+Whatever+effect+be+wrought+upon+it%2C+there+is+no+effect+wrought+in+it%2C+but+that+it+is+enmity+still%2C+sin+still.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Indwelling+Sin+in+Believers%2C+ch.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2292fd89c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e2292fd89c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/indwellingsin" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-23a903ab3a" data-kw=""><blockquote><p>Accordingly, we hold that there is always sin in the saints until they are freed from their mortal frame, because depraved concupiscence resides in their flesh, and is at variance with rectitude.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.10</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a></div><div class="actions"><button class="copy" data-copy="“Accordingly, we hold that there is always sin in the saints until they are freed from their mortal frame, because depraved concupiscence resides in their flesh, and is at variance with rectitude.”

— John Calvin, Institutes of the Christian Religion, 3.3.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAccordingly%2C+we+hold+that+there+is+always+sin+in+the+saints+until+they+are+freed+from+their+mortal+frame%2C+because+depraved+concupiscence+resides+in+their+flesh%2C+and+is+at+variance+with+rectitude.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23a903ab3a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/23a903ab3a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-e399ae0de2" data-kw="Imputation Forgiveness"><blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.11</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.”

— John Calvin, Institutes of the Christian Religion, 3.3.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSin%2C+however%2C+though+it+ceases+to+reign%2C+ceases+not+to+dwell+in+them.+%E2%80%A6+We+admit+that+these+remains%2C+just+as+if+they+had+no+existence%2C+are+not+imputed%2C+but+we%2C+at+the+same+time%2C+contend+that+it+is+owing+to+the+mercy+of+God+that+the+saints+are+not+charged+with+the+guilt+which+would+otherwise+make+them+sinners+before+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe399ae0de2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e399ae0de2.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin Regeneration Imputation"><blockquote><p>Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.21</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.”

— Francis Turretin, Institutes of Elenctic Theology, 9.11.21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+by+regeneration+we+hold+that+the+guilt+and+pollution+of+original+sin+is+taken+away+as+to+dominion+%28because+it+is+neither+imputed+to+them+anymore+for+condemnation%2C+nor+does+it+reign+in+them%29%2C+yet+we+deny+that+it+is+absolutely+taken+away+as+to+existence+and+whatever+holds+the+relation+of+sin+in+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.11.21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd141cab0f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d141cab0f1.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9e4c276079" data-kw=""><blockquote><p>It is one thing that there should be no condemnation in the renewed; another that they are worthy of condemnation and of hatred. The former Paul states in Rom. 8:1 because actual guilt is removed by the grace of justification, but not the latter.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.23</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“It is one thing that there should be no condemnation in the renewed; another that they are worthy of condemnation and of hatred. The former Paul states in Rom. 8:1 because actual guilt is removed by the grace of justification, but not the latter.”

— Francis Turretin, Institutes of Elenctic Theology, 9.11.23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+one+thing+that+there+should+be+no+condemnation+in+the+renewed%3B+another+that+they+are+worthy+of+condemnation+and+of+hatred.+The+former+Paul+states+in+Rom.+8%3A1+because+actual+guilt+is+removed+by+the+grace+of+justification%2C+but+not+the+latter.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.11.23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e4c276079.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9e4c276079.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c4db61a2d0" data-kw="Imputation Forgiveness"><blockquote><p>That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+concupiscence+does+not+condemn+the+regenerate%2C+comes+to+pass+by+an+accident%2C+which+is+the+grace+of+God%2C+which+does+not+impute+it+to+the+faithful.+This%2C+however%2C+does+not+occur+in+this+way%2C+as+though+concupiscence+were+no+sin%3B+for+other+sins+in+like+manner+do+not+condemn+the+regenerate%2C+not+because+they+are+no+sins%2C+but+because+they+have+obtained+the+pardon+of+them+through+Christ.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4db61a2d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c4db61a2d0.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-c862a4f6cf" data-kw=""><blockquote><p>The commanding power of the law in positive precepts and prohibitions, which justified persons are subject unto, does make and constitute all their unconformities unto it to be no less truly and properly sins in their own nature, than they would be if their persons were obnoxious unto the curse of it.</p></blockquote><figcaption>— <a href="../../authors/john-owen.html">John Owen</a>, <cite>The Doctrine of Justification by Faith</cite>, ch. 5</figcaption><div class="meta"><a class="tag here" href="../../topics/fall-and-sin/indwelling-sin.html" aria-current="page">Indwelling Sin</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“The commanding power of the law in positive precepts and prohibitions, which justified persons are subject unto, does make and constitute all their unconformities unto it to be no less truly and properly sins in their own nature, than they would be if their persons were obnoxious unto the curse of it.”

l. 5. 17. … And therefore it is sin properly: such as the fruit is, such is the tree.”

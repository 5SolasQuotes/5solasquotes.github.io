<blockquote><p>Faith, therefore, without works, is dead. We are saved by faith. But salvation includes deliverance from sin. If, therefore, our faith does not deliver us from sin, it does not save us. Antinomianism involves a contradiction in terms.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith,” “Sanctification a Fruit of Faith”</figcaption>

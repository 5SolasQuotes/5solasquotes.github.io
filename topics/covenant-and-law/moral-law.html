— John Calvin, Institutes of the Christian Religion, 3.3.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe%2C+then%2C+who+admits+not+that+all+the+desires+of+the+flesh+are+sins%2C+and+that+that+disease+of+concupiscence%2C+which+they+call+a+stimulus%2C+is+a+fountain+of+sin%2C+must+of+necessity+deny+that+the+transgression+of+the+law+is+sin.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c7ba3e091.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6c7ba3e091.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-31ad792516" data-kw=""><blockquote><p>The Reformed on the contrary state that all concupiscence, which certainly inclines toward evil, is sin, insofar as (1) all such concupiscence is against the law (Rom. 7:7) and thus is lawlessness, in which sin fully consists (1 John 3:4).</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, 4.2.28</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“The Reformed on the contrary state that all concupiscence, which certainly inclines toward evil, is sin, insofar as (1) all such concupiscence is against the law (Rom. 7:7) and thus is lawlessness, in which sin fully consists (1 John 3:4).”

— William Ames, Bellarmine Disarmed, vol. 4, ch. 3 (Of Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhatever+differs+from+the+norm+of+the+law+is+sin%3A+but+concupiscence+in+the+regenerate+differs+from+the+norm+of+the+law.+Therefore.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+vol.+4%2C+ch.+3+%28Of+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0cb9cbf78.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f0cb9cbf78.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-e31e9ad7d3" data-kw="Original Sin"><blockquote><p>Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.”

n the heart. The laws of men take hold of actions; but the law of God goes further—it forbids not only sinful actions—but sinful desires.”

orce and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence.”

efore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.”

perly sins in their own nature, than they would be if their persons were obnoxious unto the curse of it.”

— Zacharias Ursinus &amp; Caspar Olevianus, Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+does+the+tenth+Commandment+require%3F+That+not+even+the+least+inclination+or+thought+against+any+commandment+of+God+ever+enter+our+heart%2C+but+that+with+our+whole+heart+we+continually+hate+all+sin+and+take+pleasure+in+all+righteousness+%28Rom.+7%3A7%E2%80%938%29.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus+%26+Caspar+Olevianus%2C+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23622b529a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/23622b529a.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-eb60913018" data-kw="Contentment"><blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote><figcaption>— <a href="../../authors/benjamin-keach.html">Benjamin Keach</a>, <cite>The Baptist Catechism</cite>, Q. 86</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/christian-life/contentment.html">Contentment</a></div><div class="actions"><button class="copy" data-copy="“Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).”

— Benjamin Keach, The Baptist Catechism, Q. 86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+86.+What+is+forbidden+in+the+tenth+commandment%3F+A.+The+tenth+commandment+forbids+all+discontentment+with+our+own+estate+%281+Kings+21%3A4%3B+Est.+5%3A13%3B+1+Cor.+10%3A10%29%2C+envying+or+grieving+at+the+good+of+our+neighbor+%28Gal.+5%3A26%3B+James+3%3A14%2C+16%29%2C+and+all+inordinate+motions+and+affections+to+anything+that+is+his+%28Rom.+7%3A7%E2%80%938%3B+13%3A9%3B+Deut.+5%3A21%29.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Keach%2C+The+Baptist+Catechism%2C+Q.+86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb60913018.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/eb60913018.html">Permalink</a><a class="src" href="https://founders.org/library/the-baptist-catechism/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-4c5c60d442" data-kw="Sanctification Communion"><blockquote><p>The way to get holy endowments and qualifications necessary to frame and enable us for the immediate practice of the law, is to receive them out of the fullness of Christ, by fellowship with Him; and that we may have this fellowship, we must be in Christ, and have Christ Himself in us, by a mystical union with Him.</p></blockquote><figcaption>— <a href="../../authors/walter-marshall.html">Walter Marshall</a>, <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), the direction</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a></div><div class="actions"><button class="copy" data-copy="“The way to get holy endowments and qualifications necessary to frame and enable us for the immediate practice of the law, is to receive them out of the fullness of Christ, by fellowship with Him; and that we may have this fellowship, we must be in Christ, and have Christ Himself in us, by a mystical union with Him.”

— Walter Marshall, The Gospel Mystery of Sanctification, Direction III (ch. 3), the direction">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+way+to+get+holy+endowments+and+qualifications+necessary+to+frame+and+enable+us+for+the+immediate+practice+of+the+law%2C+is+to+receive+them+out+of+the+fullness+of+Christ%2C+by+fellowship+with+Him%3B+and+that+we+may+have+this+fellowship%2C+we+must+be+in+Christ%2C+and+have+Christ+Himself+in+us%2C+by+a+mystical+union+with+Him.%E2%80%9D%0A%0A%E2%80%94+Walter+Marshall%2C+The+Gospel+Mystery+of+Sanctification%2C+Direction+III+%28ch.+3%29%2C+the+direction&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c5c60d442.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4c5c60d442.html">Permalink</a><a class="src" href="https://archive.org/details/gospelmysteryof00mars" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-99dfff926c" data-kw=""><blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.8.16</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.”

— John Calvin, Institutes of the Christian Religion, 2.8.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+in+forbidding+us+to+have+strange+gods%2C+he+means+that+we+are+not+to+transfer+to+another+what+belongs+to+him.+Even+though+there+are+innumerable+things+that+we+owe+to+God%2C+yet+they+may+be+conveniently+grouped+in+four+headings%3A+%281%29+adoration+%28to+which+is+added+as+an+appendix%2C+spiritual+obedience+of+the+conscience%29%2C+%282%29+trust%2C+%283%29+invocation%2C+%284%29+thanksgiving.%E2%80%A6+As+the+Lord+suffers+nothing+of+these+to+be+transferred+to+another%2C+so+he+commands+that+all+be+rendered+wholly+to+himself.%E2%80%A6+And+it+will+not+be+enough+to+abstain+from+a+strange+god.%E2%80%A6+If+we+are+content%2C+therefore%2C+with+one+God%2C+let+us+remember+what+was+said+before%3A+that+we+are+to+drive+away+all+invented+gods+and+are+not+to+rend+asunder+the+worship+that+the+one+God+claims+for+himself.+For+it+is+unlawful+to+take+away+even+a+particle+from+his+glory%3B+rather%2C+all+things+proper+to+him+must+remain+with+him.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.8.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F99dfff926c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/99dfff926c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-99848ae32d" data-kw=""><blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.8.16</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.”

— John Calvin, Institutes of the Christian Religion, 2.8.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+phrase+that+follows%2C+%E2%80%9Cbefore+my+face%2C%E2%80%9D+makes+the+offense+more+heinous+because+God+is+provoked+to+jealousy+as+often+as+we+substitute+our+own+inventions+in+place+of+him.+This+is+like+a+shameless+woman+who+brings+in+an+adulterer+before+her+husband%E2%80%99s+very+eyes+only+to+vex+his+mind+the+more.%E2%80%A6+Therefore%2C+when+God+by+his+present+power+and+grace+testified+that+he+kept+watch+over+the+people+whom+he+had+chosen%2C+he+warned+them%E2%80%94to+keep+them+even+more+from+the+crime+of+rebellion%E2%80%94that+they+could+introduce+no+new+gods+without+his+witnessing+and+observing+their+sacrilege.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.8.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F99848ae32d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/99848ae32d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-e635632681" data-kw=""><blockquote><p>Q. What does the LORD require in the first commandment? A. That for the sake of my very salvation I avoid and flee all idolatry, witchcraft, superstition, and prayer to saints or to other creatures. Further, that I rightly come to know the only true God, trust in him alone, submit to him with all humility and patience, expect all good from him only, and love, fear, and honour him with all my heart. In short, that I forsake all creatures rather than do the least thing against his will.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a>, <cite>Heidelberg Catechism</cite>, Q. 94</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“Q. What does the LORD require in the first commandment? A. That for the sake of my very salvation I avoid and flee all idolatry, witchcraft, superstition, and prayer to saints or to other creatures. Further, that I rightly come to know the only true God, trust in him alone, submit to him with all humility and patience, expect all good from him only, and love, fear, and honour him with all my heart. In short, that I forsake all creatures rather than do the least thing against his will.”

— Zacharias Ursinus &amp; Caspar Olevianus, Heidelberg Catechism, Q. 94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+What+does+the+LORD+require+in+the+first+commandment%3F+A.+That+for+the+sake+of+my+very+salvation+I+avoid+and+flee+all+idolatry%2C+witchcraft%2C+superstition%2C+and+prayer+to+saints+or+to+other+creatures.+Further%2C+that+I+rightly+come+to+know+the+only+true+God%2C+trust+in+him+alone%2C+submit+to+him+with+all+humility+and+patience%2C+expect+all+good+from+him+only%2C+and+love%2C+fear%2C+and+honour+him+with+all+my+heart.+In+short%2C+that+I+forsake+all+creatures+rather+than+do+the+least+thing+against+his+will.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus+%26+Caspar+Olevianus%2C+Heidelberg+Catechism%2C+Q.+94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe635632681.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e635632681.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-d66eae079b" data-kw=""><blockquote><p>Q. What is idolatry? A. Idolatry is having or inventing something in which to put our trust instead of, or in addition to, the only true God who has revealed himself in his Word.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a>, <cite>Heidelberg Catechism</cite>, Q. 95</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“Q. What is idolatry? A. Idolatry is having or inventing something in which to put our trust instead of, or in addition to, the only true God who has revealed himself in his Word.”

— Zacharias Ursinus &amp; Caspar Olevianus, Heidelberg Catechism, Q. 95">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+What+is+idolatry%3F+A.+Idolatry+is+having+or+inventing+something+in+which+to+put+our+trust+instead+of%2C+or+in+addition+to%2C+the+only+true+God+who+has+revealed+himself+in+his+Word.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus+%26+Caspar+Olevianus%2C+Heidelberg+Catechism%2C+Q.+95&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd66eae079b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d66eae079b.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-170e2c1298" data-kw=""><blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote><figcaption>— <a href="../../authors/martin-luther.html">Martin Luther</a>, <cite>The Large Catechism</cite>, First Commandment</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.”

— Martin Luther, The Large Catechism, First Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+does+it+mean+to+have+a+god%3F+or%2C+what+is+God%3F+Answer%3A+A+god+means+that+from+which+we+are+to+expect+all+good+and+to+which+we+are+to+take+refuge+in+all+distress%2C+so+that+to+have+a+God+is+nothing+else+than+to+trust+and+believe+Him+from+the+%5Bwhole%5D+heart%3B+as+I+have+often+said+that+the+confidence+and+faith+of+the+heart+alone+make+both+God+and+an+idol.+If+your+faith+and+trust+be+right%2C+then+is+your+god+also+true%3B+and%2C+on+the+other+hand%2C+if+your+trust+be+false+and+wrong%2C+then+you+have+not+the+true+God%3B+for+these+two+belong+together%2C+faith+and+God.+That+now%2C+I+say%2C+upon+which+you+set+your+heart+and+put+your+trust+is+properly+your+god.+Therefore+it+is+the+intent+of+this+commandment+to+require+true+faith+and+trust+of+the+heart+which+settles+upon+the+only+true+God%2C+and+clings+to+Him+alone.%E2%80%A6+Whatever+you+lack+of+good+things%2C+expect+it+of+Me%2C+and+look+to+Me+for+it%2C+and+whenever+you+suffer+misfortune+and+distress%2C+creep+and+cling+to+Me.+I%2C+yes%2C+I%2C+will+give+you+enough+and+help+you+out+of+every+need%3B+only+let+not+your+heart+cleave+to+or+rest+in+any+other.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Large+Catechism%2C+First+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F170e2c1298.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/170e2c1298.html">Permalink</a><a class="src" href="https://bookofconcord.org/large-catechism/ten-commandments/" target="_blank" rel="noopener">Read it online · Book of Concord</a></div></figure><figure class="quote" id="q-07640ab15d" data-kw=""><blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote><figcaption>— <a href="../../authors/martin-luther.html">Martin Luther</a>, <cite>The Large Catechism</cite>, First Commandment (Mammon and creature-trust)</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.”

— Martin Luther, The Large Catechism, First Commandment (Mammon and creature-trust)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+a+one+thinks+that+he+has+God+and+everything+in+abundance+when+he+has+money+and+possessions%3B+he+trusts+in+them+and+boasts+of+them+with+such+firmness+and+assurance+as+to+care+for+no+one.+Lo%2C+such+a+man+also+has+a+god%2C+Mammon+by+name%2C+i.e.%2C+money+and+possessions%2C+on+which+he+sets+all+his+heart%2C+and+which+is+also+the+most+common+idol+on+earth.%E2%80%A6+So%2C+too%2C+whoever+trusts+and+boasts+that+he+possesses+great+skill%2C+prudence%2C+power%2C+favor%2C+friendship%2C+and+honor+has+also+a+god%2C+but+not+this+true+and+only+God.%E2%80%A6+Therefore+I+repeat+that+the+chief+explanation+of+this+point+is+that+to+have+a+god+is+to+have+something+in+which+the+heart+entirely+trusts.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Large+Catechism%2C+First+Commandment+%28Mammon+and+creature-trust%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F07640ab15d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/07640ab15d.html">Permalink</a><a class="src" href="https://bookofconcord.org/large-catechism/ten-commandments/" target="_blank" rel="noopener">Read it online · Book of Concord</a></div></figure><figure class="quote" id="q-95b19d7f5b" data-kw=""><blockquote><p>The first commandment, then, is, Thou shalt have no other gods before me. …</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (Q. 94–95)</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“The first commandment, then, is, Thou shalt have no other gods before me. …”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, on the First Commandment (Q. 94–95)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+first+commandment%2C+then%2C+is%2C+Thou+shalt+have+no+other+gods+before+me.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+on+the+First+Commandment+%28Q.+94%E2%80%9395%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95b19d7f5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/95b19d7f5b.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-e4ce59d60d" data-kw=""><blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, on the First Commandment (creature-trust and forms of idolatry)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+confidence+reposed+in+creatures+%E2%80%A6+is+evidently+opposed+to+a+correct+knowledge+of+God%2C+since+he+who+places+his+trust+in+creatures+makes+for+himself+many+gods.+Hence+God+expressly+condemns+in+his+word+all+those+who+repose+their+confidence+either+in+men%2C+or+in+power+and+riches%2C+or+in+any+created+object.+Avarice%2C+or+covetousness%2C+is+included+in+this+vice%2C+and+condemned.%E2%80%A6+Idolatry+%E2%80%A6+There+are+two+forms+or+species+of+idolatry.+One+is%2C+when+another+beside+the+true+God+is+professedly+worshiped%2C+or%2C+when+that+is+worshiped+for+God+which+is+no+God.%E2%80%A6+The+other+form+of+idolatry+is+when+we+do+not+professedly+worship+another+God%2C+but+err+in+the+kind+of+worship+we+render+unto+him.%E2%80%A6+Those+who+worship+God+otherwise+than+he+will+be+worshipped%2C+imagine+another+God%2C+one+differently+affected+from+what+the+true+God+is%3B+and+in+this+way+they+do+not+worship+God%2C+but+a+figment+of+their+own+brain.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+on+the+First+Commandment+%28creature-trust+and+forms+of+idolatry%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4ce59d60d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e4ce59d60d.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-7d61bfb3e3" data-kw=""><blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote><figcaption>— <a href="../../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, First Commandment (trust as heart idolatry)</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.”

— Thomas Watson, The Ten Commandments, First Commandment (trust as heart idolatry)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+it+to+have+other+gods+besides+the+true+God%3F+I+fear+upon+search%2C+we+have+more+idolaters+among+us+than+we+are+aware+of.+%281%29+To+TRUST+in+anything+more+than+God%2C+is+to+make+it+a+god.+If+we+trust+in+our+RICHES%2C+we+make+riches+our+God.%E2%80%A6+Money+is+his+creator%2C+redeemer%2C+comforter%3A+his+creator%2C+for+if+he+has+money%2C+he+thinks+he+is+made%3B+his+redeemer%2C+for+if+he+is+in+danger%2C+he+trusts+to+his+money+to+redeem+him%3B+his+comforter%2C+for+if+he+is+sad%2C+money+is+the+golden+harp+to+drive+away+the+evil+spirit.+Thus+by+trusting+to+money%2C+we+make+it+a+god.%E2%80%A6+If+we+trust+in+THE+ARM+OF+FLESH%2C+we+make+it+a+god.%E2%80%A6+If+we+trust+in+our+WISDOM%2C+we+make+it+a+god.%E2%80%A6+If+we+trust+in+our+MORALITY%2C+we+make+it+a+god.%E2%80%A6+If+we+trust+to+our+DUTIES+to+save+us%2C+we+make+them+a+god.%E2%80%A6+Use+duty%E2%80%94but+do+not+trust+to+it%3B+for+then+you+make+it+a+god.%E2%80%A6+If+we+trust+in+our+GRACE%2C+we+make+a+god+of+it.+Grace+is+but+a+creature%3B+if+we+trust+to+it+we+make+it+an+idol.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+First+Commandment+%28trust+as+heart+idolatry%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7d61bfb3e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7d61bfb3e3.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-20d92c6b49" data-kw=""><blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote><figcaption>— <a href="../../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.”

— Thomas Watson, The Ten Commandments, First Commandment (love as heart idolatry)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%282%29+To+LOVE+anything+more+than+God%2C+is+to+make+it+a+god.+If+we+love+our+ESTATE+more+than+God%2C+we+make+it+a+god.%E2%80%A6+The+covetous+man+is+called+an+idolater.+Eph+5%3A5.+Why+so%3F+Because+he+loves+his+estate+more+than+God%2C+and+so+makes+it+his+god.+Though+he+does+not+bow+down+to+an+idol%2C+if+he+worships+the+engraved+image+in+his+coins%2C+he+is+an+idolater.+That+which+has+most+of+the+heart%2C+we+make+a+god+of.+If+we+love+our+PLEASURE+more+than+God%2C+we+make+a+god+of+it.%E2%80%A6+If+we+love+our+BELLY+more+than+God%2C+we+make+a+god+of+it.+%E2%80%9CWhose+god+is+their+belly.%E2%80%9D+Phil+3%3A19.%E2%80%A6+But+to+mind+nothing+but+the+indulging+of+the+appetite%2C+is+idolatry.%E2%80%A6+If+we+love+a+CHILD+more+than+God%2C+we+make+a+god+of+it.%E2%80%A6+This+is+to+make+an+idol+of+a+child%2C+and+to+set+it+in+God%E2%80%99s+place.+Thus+God+is+often+provoked+to+take+away+our+children.+If+we+love+the+jewel+more+than+him+who+gave+it%2C+God+will+take+away+the+jewel%2C+that+our+love+may+return+to+him+again.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+First+Commandment+%28love+as+heart+idolatry%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20d92c6b49.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/20d92c6b49.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-ffe939c855" data-kw=""><blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Larger Catechism</cite>, Q. 105</figcaption><div class="meta"><a class="tag here" href="../../topics/covenant-and-law/moral-law.html" aria-current="page">The Moral Law</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.”

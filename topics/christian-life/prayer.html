<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prayer · 5 Solas Quotes</title><meta name="description" content="Prayer — The Christian Life"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../christian-life.html">The Christian Life</a> ›</p><h1>Prayer</h1><p class="sub">9 quotations from 8 authors</p><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints"><blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ (1558)</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/christian-life/prayer.html" aria-current="page">Prayer</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-saints.html">Rome: Saints</a><a class="tag" href="../../topics/person-of-christ/mediator.html">The Mediator</a></div><div class="actions"><button class="copy" data-copy="“However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.”

 can she not furthermore be venerated as a mediator and intercessor between God and us with the honour of invocation? Answer: No, since no one should be invoked except God alone in Christ, our only Mediator, Saviour, and Intercessor”

oration, as Protestants say, due to God alone; of ascribing all the titles of Christ unto her, turning Lord in the Psalms in most places into Lady; praying to her, not only to entreat, yea, to command her Son to help and save them, but to save them herself, as she to whom her Son hath committed the administration of mercy, keeping that of justice to himself; with many other the like horrid blasphemies”

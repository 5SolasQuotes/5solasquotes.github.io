 href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a></div><div class="actions"><button class="copy" data-copy="“The Apostle himself in Rom. 6 &amp; 7 shows quite openly that concupiscence is sin properly so called: for not only does he often call it sin, but not good, evil, to be held in hatred, fighting against the law of God, to be crucified, mortified, and destroyed, and rendering that man miserable in whom it resides.”

— William Ames, Bellarmine Disarmed, vol. 4, ch. 3 (Of Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle+himself+in+Rom.+6+%26+7+shows+quite+openly+that+concupiscence+is+sin+properly+so+called%3A+for+not+only+does+he+often+call+it+sin%2C+but+not+good%2C+evil%2C+to+be+held+in+hatred%2C+fighting+against+the+law+of+God%2C+to+be+crucified%2C+mortified%2C+and+destroyed%2C+and+rendering+that+man+miserable+in+whom+it+resides.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+vol.+4%2C+ch.+3+%28Of+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1ff0babb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e1ff0babb0.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6f347f3ddc" data-kw="Mortification"><blockquote><p>Moral corruption fighting against the law, for the crucifying and mortifying of which Christ himself died on the cross, if it be not properly sin, then Scripture has not explained to us what the property of any habitual sin is.</p></blockquote><figcaption>— <a href="../../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, vol. 4, ch. 3 (Of Original Sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/christian-life/mortification.html" aria-current="page">Mortification</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“Moral corruption fighting against the law, for the crucifying and mortifying of which Christ himself died on the cross, if it be not properly sin, then Scripture has not explained to us what the property of any habitual sin is.”

— William Ames, Bellarmine Disarmed, vol. 4, ch. 3 (Of Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoral+corruption+fighting+against+the+law%2C+for+the+crucifying+and+mortifying+of+which+Christ+himself+died+on+the+cross%2C+if+it+be+not+properly+sin%2C+then+Scripture+has+not+explained+to+us+what+the+property+of+any+habitual+sin+is.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+vol.+4%2C+ch.+3+%28Of+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f347f3ddc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6f347f3ddc.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-e2292fd89c" data-kw="Mortification"><blockquote><p>Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote><figcaption>— <a href="../../authors/john-owen.html">John Owen</a>, <cite>Indwelling Sin in Believers</cite>, ch. 4</figcaption><div class="meta"><a class="tag here" href="../../topics/christian-life/mortification.html" aria-current="page">Mortification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a></div><div class="actions"><button class="copy" data-copy="“Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.”

— John Owen, Indwelling Sin in Believers, ch. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+spark+of+fire+is+fire%2C+and+will+burn%3B+so+is+every+thing+of+the+law+of+sin%2C+the+last%2C+the+least+of+it%2C+--+it+is+enmity%2C+it+will+poison%2C+it+will+burn.+%E2%80%A6+Mortification+abates+of+its+force%2C+but+doth+not+change+its+nature.+Grace+changeth+the+nature+of+man%2C+but+nothing+can+change+the+nature+of+sin.+Whatever+effect+be+wrought+upon+it%2C+there+is+no+effect+wrought+in+it%2C+but+that+it+is+enmity+still%2C+sin+still.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Indwelling+Sin+in+Believers%2C+ch.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2292fd89c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e2292fd89c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/indwellingsin" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-97321aa156" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/christian-life/mortification.html" aria-current="page">Mortification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/salvation/sanctification.html">Sanctification</a><a class="tag" href="../../topics/salvation/perseverance.html">Perseverance</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a></div><div class="actions"><button class="copy" data-copy="“This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).”

— Westminster Assembly, Westminster Confession of Faith, 6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+corruption+of+nature%2C+during+this+life%2C+doth+remain+in+those+that+are+regenerated+%281+John+1%3A8%2C+10%3B+Rom.+7%3A14%2C+17%E2%80%9318%2C+23%3B+James+3%3A2%3B+Prov.+20%3A9%3B+Eccl.+7%3A20%29%3B+and+although+it+be%2C+through+Christ%2C+pardoned+and+mortified%3B+yet+both+itself%2C+and+all+the+motions+thereof%2C+are+truly+and+properly+sin+%28Rom.+7%3A5%2C+7%E2%80%938%2C+25%3B+Gal.+5%3A17%29.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97321aa156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/97321aa156.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" target="_blank" rel="noopener">Read it online · PCA</a></div></figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness"><blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 6.5</figcaption><div class="meta"><a class="tag here" href="../../topics/christian-life/mortification.html" aria-current="page">Mortification</a><a class="tag" href="../../topics/fall-and-sin/indwelling-sin.html">Indwelling Sin</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a

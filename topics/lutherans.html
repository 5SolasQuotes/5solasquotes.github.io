<blockquote><p>For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.6</figcaption>

</figure><figure class="quote" id="q-2292c0d676" data-kw="">
<blockquote><p>In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.6</figcaption>

</figure><figure class="quote" id="q-4e9b07758c" data-kw="">
<blockquote><p>Osiander&#x27;s objection as to its being inconsistent with the nature of God, falls back upon himself; for though he clothes the saints with a twofold righteousness as with a coat of skins, he is, however, forced to admit, that without forgiveness no man is pleasing to God. If this be so, let him at least admit, that with reference to what is called the proportion of imputation, those are regarded as righteous who are not so in reality.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.11.11</figcaption>

<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sufficiency · 5 Solas Quotes</title><meta name="description" content="Sufficiency — Scripture"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231301"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../scripture.html">Scripture</a> ›</p><h1>Sufficiency</h1><p class="sub">22 quotations from 20 authors</p><figure class="quote" id="q-ca480713e5" data-kw=""><blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote><figcaption>— <a href="../../authors/william-s-plumer.html">William S. Plumer</a>, <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Special Kindness of Providence Towards Godly Men”</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.”

— William S. Plumer, Jehovah-Jireh: A Treatise on Providence, ch. “The Special Kindness of Providence Towards Godly Men”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProvidence+without+the+word+is+a+dark+enigma.+None+can+solve+it.+The+best+commentary+on+Providence+is+the+Bible.+The+best+commentary+on+the+Bible+is+Providence.+The+events+of+a+godly+man%27s+life+are+to+him+the+fulfillings+of+the+Scriptures.+In+a+thousand+ways+they+teach+him+the+true+sense+of+promises+and+threatenings%2C+predictions+and+narratives%2C+precepts+and+doctrines.+They+mightily+confirm+his+belief+of+the+truth.%E2%80%9D%0A%0A%E2%80%94+William+S.+Plumer%2C+Jehovah-Jireh%3A+A+Treatise+on+Providence%2C+ch.+%E2%80%9CThe+Special+Kindness+of+Providence+Towards+Godly+Men%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca480713e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ca480713e5.html">Permalink</a><a class="src" href="https://archive.org/details/jehovahjirehtrea00plum" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King"><blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote><figcaption>— <a href="../../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.”

e earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+God+disapproved+that+men+on+earth+constituted+a+King+for+themselves%2C+without+consulting+him%3A+what+will+he+say+of+the+worms+of+the+earth%2C+who+without+an+oracle+from+God%2C+constitute+a+Queen+of+heaven%2C+and+erect+for+her+a+throne+of+majesty%2C+without+asking+at+the+mouth+of+God%3F%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92dd6ed6d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/92dd6ed6d7.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints"><blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/christian-life/prayer.html">Prayer</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a><a class="tag" href="../../topics/polemics/rome-saints.html">Rome: Saints</a><a class="tag" href="../../topics/person-of-christ/mediator.html">The Mediator</a></div><div class="actions"><button class="copy" data-copy="“However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.”

— Heinrich Bullinger, Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ, 1558">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+we+cannot+in+any+way+acknowledge+or+accept+what+our+opponents+openly+say%2C+namely+that+Mary+is+to+be+invoked+as+a+mediator+between+God+and+humans%2C+or+that+she+is+our+patron+and+advocate.+We+do+not+believe+that+this+is+either+a+tradition+of+Holy+Scripture+or+a+command+from+God.+We+believe+that+God%2C+who+alone+grants+all+salvation+for+the+present+and+future%2C+is+the+one+to+be+invoked+alone.+We+believe+that+Christ+alone+%5Bsince+He+alone+is+true+God+and+true+man%5D+is+the+true+mediator+between+God+and+humans.+We+believe+that+He%2C+who+alone+can+satisfy+all+humans%2C+is+the+patron+and+advocate+with+the+Father.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Sermon+on+the+Blessed+Virgin+Mary%2C+the+Mother+of+Our+Lord+Jesus+Christ%2C+1558&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9ae95d3b37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9ae95d3b37.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator"><blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote><figcaption>— <a href="../../authors/theodore-beza.html">Theodore Beza</a>, <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a><a class="tag" href="../../topics/person-of-christ/mediator.html">The Mediator</a></div><div class="actions"><button class="copy" data-copy="“In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.”

— Theodore Beza, The Christian Faith, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+brief%2C+there+is+scarcely+one+title+given+to+Jesus+Christ%2C+nor+one+which+prophesies+of+Him%2C+which+they+do+not+attribute+to+her%2C+calling+her+Queen+of+Heaven%2C+Porter+of+Paradise%2C+their+life%2C+their+sweetness%2C+treasurer+of+grace%2C+the+refuge+and+advocate+of+sinners%E2%80%94thus+dishonoring+Him+and+also+making+the+poor+people+understand+that+they+honor+her+contrary+to+the+whole+Word+of+God+and+the+writings+of+the+most+ancient+teachers.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+1560%2C+Point+7%2C+%C2%A74%3A+The+Papists+Abolish+the+True+Intercession+of+Jesus+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb48112252c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b48112252c.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-d04c21ab00" data-kw="Grace"><blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote><figcaption>— <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.””

— Arthur W. Pink, Spiritual Union and Communion, Introduction (nature of the union, 1)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+supernatural%2C+being+altogether+beyond+the+powers+of+the+creature+to+effectuate.+It+is+wholly+of+the+wisdom%2C+grace%2C+and+power+of+God.+All+the+unions+we+have+in+the+natural+world+come+infinitely+short+of+this.+The+union+of+the+body+and+soul+in+man+puzzles+and+baffles+the+greatest+philosophers%2C+but+the+union+of+Christ+and+His+Church+is+a+far+greater+mystery%3A+that+persons+so+distant%2C+so+divided%2C+should+be+made+one%2C+is+a+profundity+which+no+finite+intelligence+can+fully+comprehend.+We+had+known+nothing+whatever+about+it+if+God+had+not+revealed+it+to+us+in+His+Word%2C+and+even+now+we+discern+it+%E2%80%9Cthrough+a+glass+darkly.%E2%80%9D%E2%80%9D%0A%0A%E2%80%94+Arthur+W.+Pink%2C+Spiritual+Union+and+Communion%2C+Introduction+%28nature+of+the+union%2C+1%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd04c21ab00.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d04c21ab00.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-8317e796d9" data-kw=""><blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote><figcaption>— <a href="../../authors/william-cunningham.html">William Cunningham</a>, <cite>The Romanist Theory of Development</cite>, p. 6</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../../topics/scripture/scripture-vs-tradition.html">Scripture vs. Tradition</a></div><div class="actions"><button class="copy" data-copy="“Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.”

— William Cunningham, The Romanist Theory of Development, p. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProtestants+have+always+been+accustomed+to+meet+these+views%2C+whether+put+forth+by+Roman+Catholics+or+Anglo-Catholics%2C+by+establishing+the+sufficiency+and+perfection+of+the+sacred+Scriptures+as+the+only+rule+of+faith%2C+and+by+proving+that+we+have+not+in+point+of+fact%2C+any+certain+means+of+knowing+accurately+what+was+declared+and+prescribed+by+the+apostles%2C+except+from+the+writings+of+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+The+Romanist+Theory+of+Development%2C+p.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8317e796d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8317e796d9.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-38e6700b84" data-kw=""><blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote><figcaption>— <a href="../../authors/william-whitaker.html">William Whitaker</a>, <cite>A Disputation on Holy Scripture</cite>, Question III, ch. 10</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.”

— William Whitaker, A Disputation on Holy Scripture, Question III, ch. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+it+is+to+be+held+undoubtingly%2C+as+we+shall+hereafter+prove+most+largely%2C+that+the+revealed+and+written+word+of+God+is+the+sole+rule+of+faith%2C+which+is+a+thing+prior+to+the+faith+of+the+church.+%E2%80%A6+If+he+feign+another+rule+of+faith+besides+the+written+word+of+God%2C+we+reject%2C+repudiate%2C+and+refuse+to+acknowledge+any+such%2C+and+reduce+the+whole+rule+of+the+catholic+faith+to+the+scripture+alone.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+III%2C+ch.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38e6700b84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/38e6700b84.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6c1d4a94c7" data-kw=""><blockquote><p>Let this then be a sure axiom - that there is no word of God to which place should be given in the Church save that which is contained, first, in the Law and the Prophets; and, secondly, in the writings of the Apostles, and that the only due method of teaching in the Church is according to the prescription and rule of his word.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.8.8</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“Let this then be a sure axiom - that there is no word of God to which place should be given in the Church save that which is contained, first, in the Law and the Prophets; and, secondly, in the writings of the Apostles, and that the only due method of teaching in the Church is according to the prescription and rule of his word.”

— John Calvin, Institutes of the Christian Religion, 4.8.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLet+this+then+be+a+sure+axiom+-+that+there+is+no+word+of+God+to+which+place+should+be+given+in+the+Church+save+that+which+is+contained%2C+first%2C+in+the+Law+and+the+Prophets%3B+and%2C+secondly%2C+in+the+writings+of+the+Apostles%2C+and+that+the+only+due+method+of+teaching+in+the+Church+is+according+to+the+prescription+and+rule+of+his+word.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.8.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c1d4a94c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6c1d4a94c7.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-3f70548235" data-kw=""><blockquote><p>if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.8.9</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.”

— John Calvin, Institutes of the Christian Religion, 4.8.9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cif+faith+depends+upon+the+word+of+God+alone%2C+if+it+regards+and+reclines+on+it+alone%2C+what+place+is+left+for+any+word+of+man%3F+%E2%80%A6+God+deprives+man+of+the+power+of+producing+any+new+doctrine%2C+in+order+that+he+alone+may+be+our+master+in+spiritual+teaching%2C+as+he+alone+is+true%2C+and+can+neither+lie+nor+deceive.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.8.9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f70548235.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3f70548235.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-7b5f26575e" data-kw=""><blockquote><p>In this we are even more justified, because the nature and requirements of a rule fit as exactly as possible with Scripture alone. First, the rule of living for God, without doubt, ought to be prescribed by God alone (Deut. 12:32; Matt. 15:9). For a rule cannot be prescribed by any other than by the one whom the rule concerns. Now, Scripture alone has been prescribed by God as the rule for us (2 Tim. 3:16; 2 Peter 1:21), and due to the sublimity of the matter it could not be revealed and prescribed by anyone but God.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, vol. 1: Prolegomena, Part 1, Book 1, ch. 2, §V</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“In this we are even more justified, because the nature and requirements of a rule fit as exactly as possible with Scripture alone. First, the rule of living for God, without doubt, ought to be prescribed by God alone (Deut. 12:32; Matt. 15:9). For a rule cannot be prescribed by any other than by the one whom the rule concerns. Now, Scripture alone has been prescribed by God as the rule for us (2 Tim. 3:16; 2 Peter 1:21), and due to the sublimity of the matter it could not be revealed and prescribed by anyone but God.”

— Petrus van Mastricht, Theoretical-Practical Theology, vol. 1: Prolegomena, Part 1, Book 1, ch. 2, §V">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+we+are+even+more+justified%2C+because+the+nature+and+requirements+of+a+rule+fit+as+exactly+as+possible+with+Scripture+alone.+First%2C+the+rule+of+living+for+God%2C+without+doubt%2C+ought+to+be+prescribed+by+God+alone+%28Deut.+12%3A32%3B+Matt.+15%3A9%29.+For+a+rule+cannot+be+prescribed+by+any+other+than+by+the+one+whom+the+rule+concerns.+Now%2C+Scripture+alone+has+been+prescribed+by+God+as+the+rule+for+us+%282+Tim.+3%3A16%3B+2+Peter+1%3A21%29%2C+and+due+to+the+sublimity+of+the+matter+it+could+not+be+revealed+and+prescribed+by+anyone+but+God.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+vol.+1%3A+Prolegomena%2C+Part+1%2C+Book+1%2C+ch.+2%2C+%C2%A7V&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b5f26575e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7b5f26575e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-1057e41071" data-kw=""><blockquote><p>All things which are necessary to salvation are contained in the Scriptures, and also all those things which are necessarily required to the instruction and edification of the Church. … Hence the Scripture is not a partial, but a perfect rule of Faith, and manners: neither is here any thing that is constantly and every where necessary to be observed in the Church of God, which depends either upon any tradition, or upon any authority whatsoever and is not contained in the Scriptures.</p></blockquote><figcaption>— <a href="../../authors/william-ames.html">William Ames</a>, <cite>The Marrow of Theology</cite>, Book I, ch. XXXIV, theses 15–16</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“All things which are necessary to salvation are contained in the Scriptures, and also all those things which are necessarily required to the instruction and edification of the Church. … Hence the Scripture is not a partial, but a perfect rule of Faith, and manners: neither is here any thing that is constantly and every where necessary to be observed in the Church of God, which depends either upon any tradition, or upon any authority whatsoever and is not contained in the Scriptures.”

— William Ames, The Marrow of Theology, Book I, ch. XXXIV, theses 15–16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+things+which+are+necessary+to+salvation+are+contained+in+the+Scriptures%2C+and+also+all+those+things+which+are+necessarily+required+to+the+instruction+and+edification+of+the+Church.+%E2%80%A6+Hence+the+Scripture+is+not+a+partial%2C+but+a+perfect+rule+of+Faith%2C+and+manners%3A+neither+is+here+any+thing+that+is+constantly+and+every+where+necessary+to+be+observed+in+the+Church+of+God%2C+which+depends+either+upon+any+tradition%2C+or+upon+any+authority+whatsoever+and+is+not+contained+in+the+Scriptures.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology%2C+Book+I%2C+ch.+XXXIV%2C+theses+15%E2%80%9316&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1057e41071.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1057e41071.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6165730314" data-kw=""><blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned</p></blockquote><figcaption>— <a href="../../authors/john-owen.html">John Owen</a>, <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned”

— John Owen, The Causes, Ways, and Means of Understanding the Mind of God, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEver+since+the+Scripture+was+written%2C+the+generality+of+the+church+was+obliged+to+attend+thereunto+alone%2C+as+their+only+rule+of+faith+and+obedience.+And+although+God+reserved+unto+himself+a+liberty+under+the+Old+Testament%2C+and+until+the+completing+of+all+the+books+of+the+New%2C+to+add+new+revelations+as+he+pleased%2C+yet+he+always+bound+up+the+faith+and+obedience+of+the+present+church+unto+what+he+had+already+revealed.+And+he+hath+now%2C+by+the+Spirit+of+his+Son%2C+put+an+end+unto+all+expectation+of+any+new%2C+of+any+other+revelations%2C+wherein+the+faith+or+obedience+of+the+church+should+be+concerned%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Causes%2C+Ways%2C+and+Means+of+Understanding+the+Mind+of+God%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6165730314.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6165730314.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-0a2dfef12d" data-kw=""><blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.”

— Charles Hodge, Systematic Theology, vol. 1, Introduction, ch. II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+has+been+assumed+that+Theology+has+to+do+with+the+facts+or+truths+of+the+Bible%3B+in+other+words%2C+that+the+Scriptures+of+the+Old+and+New+Testaments+are+the+only+infallible+rule+of+faith+and+practice.+This%2C+however%2C+is+not+a+conceded+point.+Some+claim+for+Reason+a+paramount%2C+or%2C+at+least+a+co%C3%B6rdinate+authority+in+matters+of+religion.+Others+assume+an+internal+supernatural+light+to+which+they+attribute+paramount%2C+or+co%C3%B6rdinate+authority.+Others+rely+on+the+authority+of+an+infallible+church.+With+Protestants%2C+the+Bible+is+the+only+infallible+source+of+knowledge+of+divine+things.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+1%2C+Introduction%2C+ch.+II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a2dfef12d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/0a2dfef12d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology1" target="_blank" rel="noopener">Read it online · CCEL, vol. 1</a></div></figure><figure class="quote" id="q-da71c1ee94" data-kw=""><blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote><figcaption>— <a href="../../authors/a-a-hodge.html">A. A. Hodge</a>, <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.”

— A. A. Hodge, A Commentary on the Confession of Faith, ch. 1, §§ 9–10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+the+Scriptures+are+the+supreme+%22judge%22+in+all+controversies+concerning+religion.+The+authority+of+the+Scriptures+as+the+ultimate+rule+of+faith+rests+alone+in+the+fact+that+they+are+the+Word+of+God.+Since+all+these+writings+are+one+revelation%2C+and+the+only+revelation+of+his+will+concerning+religion+given+by+God+to+men%2C+it+follows%3A+%E2%80%A6+That+they+are+complete+as+a+revelation+in+themselves%2C+and+are+not+to+be+supplemented+or+explained+by+light+drawn+from+any+other+source.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+A+Commentary+on+the+Confession+of+Faith%2C+ch.+1%2C+%C2%A7%C2%A7+9%E2%80%9310&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda71c1ee94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/da71c1ee94.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-57765b3c9f" data-kw=""><blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote><figcaption>— <a href="../../authors/samuel-e-waldron.html">Samuel E. Waldron</a>, <cite>A Modern Exposition of the 1689 Baptist Confession of Faith</cite>, ch. 1, p. 53</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.”

— Samuel E. Waldron, A Modern Exposition of the 1689 Baptist Confession of Faith, ch. 1, p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sufficiency+of+the+Bible+means+its+sole+sufficiency.+It+is+sufficient+to+achieve+the+purposes+of+redemptive+revelation+without+supplementation+by+new+revelations+%28claimed+by+some+Anabaptists+and+others%29+or+traditions+of+men+%28like+those+extra-biblical+traditions+claimed+by+the+Roman+Catholic+church%29.+It+is+this+and+no+other+view+of+the+sufficiency+of+the+Scriptures+which+must+now+be+demonstrated.%E2%80%9D%0A%0A%E2%80%94+Samuel+E.+Waldron%2C+A+Modern+Exposition+of+the+1689+Baptist+Confession+of+Faith%2C+ch.+1%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57765b3c9f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/57765b3c9f.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-3f153cbdb3" data-kw=""><blockquote><p>Sola Scriptura (&quot;by Scripture alone&quot;). The Holy Scriptures are our supreme and only rule of faith and life; they, not human tradition and reasoning, determine our faith and command our obedience. … Our minds are servants to receive the Word, not to judge it.</p></blockquote><figcaption>— <a href="../../authors/joel-r-beeke-paul-m-smalley.html">Joel R. Beeke &amp; Paul M. Smalley</a>, <cite>Reformed Systematic Theology</cite>, vol. 1, ch. 4</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/sufficiency.html" aria-current="page">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“Sola Scriptura (&quot;by Scripture alone&quot;). The Holy Scriptures are our supreme and only rule of faith and life; they, not human tradition and reasoning, determine our faith and command our obedience. … Our minds are servants to receive the Word, not to judge it.”

y for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.”

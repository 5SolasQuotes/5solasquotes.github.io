— William Whitaker, A Disputation on Holy Scripture, p. 602">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+do+the+papists+make+a+reasonable+demand%2C+when+they+would+have+us+submit+ourselves+to+his+judgment%2C+and+depend+upon+his+interpretation%2C+whom+we+accuse+as+a+false+interpreter+of+scripture%2C+yea%2C+whom+we+affirm+to+be+the+very+antichrist+himself%3F%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+p.+602&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F07abf794c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/07abf794c2.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-265ad77090" data-kw=""><blockquote><p>Our opinion is, that the supreme decision and authority in the interpretation of scripture should not be ascribed to the church, but to the scripture itself, and to the Holy Spirit, as well speaking plainly in the scriptures as also secretly confirming the same in our hearts.</p></blockquote><figcaption>— <a href="../../authors/william-whitaker.html">William Whitaker</a>, <cite>A Disputation on Holy Scripture</cite>, Question V, ch. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/interpretation.html" aria-current="page">Interpretation</a><a class="tag" href="../../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class="copy" data-copy="“Our opinion is, that the supreme decision and authority in the interpretation of scripture should not be ascribed to the church, but to the scripture itself, and to the Holy Spirit, as well speaking plainly in the scriptures as also secretly confirming the same in our hearts.”

ing of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.”

— Francis Turretin, Institutes of Elenctic Theology, vol. 1, Second Topic, Q. 20, §XI">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMan+cannot+be+the+infallible+interpreter+of+the+Scriptures+and+judge+of+controversies+because+he+is+liable+to+error.+Our+faith+cannot+be+placed+in+him%2C+but+upon+God+alone+from+whom+depends+the+sense+and+meaning+of+the+Scriptures+and+who+is+the+best+interpreter+of+his+own+words.+%E2%80%A6+If+the+rulers+of+the+church+are+influenced+by+the+Holy+Spirit%2C+they+do+not+cease+to+be+men+and+therefore+fallible.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+vol.+1%2C+Second+Topic%2C+Q.+20%2C+%C2%A7XI&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64ef925976.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/64ef925976.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a9307165a8" data-kw=""><blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/interpretation.html" aria-current="page">Interpretation</a><a class="tag" href="../../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a></div><div class="actions"><button class= ture teaches.”

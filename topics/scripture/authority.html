page">Authority</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a></div><div class="actions"><button class="copy" data-copy="“If God disapproved that men on earth constituted a King for themselves, without consulting him: what will he say of the worms of the earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+God+disapproved+that+men+on+earth+constituted+a+King+for+themselves%2C+without+consulting+him%3A+what+will+he+say+of+the+worms+of+the+earth%2C+who+without+an+oracle+from+God%2C+constitute+a+Queen+of+heaven%2C+and+erect+for+her+a+throne+of+majesty%2C+without+asking+at+the+mouth+of+God%3F%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92dd6ed6d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/92dd6ed6d7.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-ca480713e5" data-kw=""><blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote><figcaption>— <a href="../../authors/william-s-plumer.html">William S. Plumer</a>, <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Special Kindness of Providence Towards Godly Men”</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/authority.html" aria-current="page">Authority</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a></div><div class="actions"><button class="copy" data-copy="“Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.”

— William S. Plumer, Jehovah-Jireh: A Treatise on Providence, ch. “The Special Kindness of Providence Towards Godly Men”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProvidence+without+the+word+is+a+dark+enigma.+None+can+solve+it.+The+best+commentary+on+Providence+is+the+Bible.+The+best+commentary+on+the+Bible+is+Providence.+The+events+of+a+godly+man%27s+life+are+to+him+the+fulfillings+of+the+Scriptures.+In+a+thousand+ways+they+teach+him+the+true+sense+of+promises+and+threatenings%2C+predictions+and+narratives%2C+precepts+and+doctrines.+They+mightily+confirm+his+belief+of+the+truth.%E2%80%9D%0A%0A%E2%80%94+William+S.+Plumer%2C+Jehovah-Jireh%3A+A+Treatise+on+Providence%2C+ch.+%E2%80%9CThe+Special+Kindness+of+Providence+Towards+Godly+Men%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca480713e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ca480713e5.html">Permalink</a><a class="src" href="https://archive.org/details/jehovahjirehtrea00plum" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King"><blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote><figcaption>— <a href="../../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/authority.html" aria-current="page">Authority</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a></div><div class="actions"><button class="copy" data-copy="“We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+acknowledge+the+Blessed+virgin+to+be+the+most+excellent+member+of+this+spouse%3B+and+that%2C+in+this+sense%2C+she+reigns+with+Christ%2C+and+with+all+the+faithful.+But+that+Christ+administers+his+kingdom+through+her%2C+as+through+the+Queen+of+heaven%2C+or+that+he+has+constituted+her+to+have+Dominion+over+all+creatures+with+Royal+power%2C+since+this+is+not+proved+from+scripture%3B+but+is+only+fashioned+by+the+most+audacious+men%2C+she+will+never+receive+it%3B+%E2%80%A6+nor+can+we+defer+it+to+her.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa94e564bfc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a94e564bfc.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints"><blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ (1558)</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/authority.html" aria-current="page">Authority</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/christian-life/prayer.html">Prayer</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../../topics/polemics/rome-saints.html">Rome: Saints</a><a class="tag" href="../../topics/person-of-christ/mediator.html">The Mediator</a></div><div class="actions"><button class="copy" data-copy="“However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.”

— Heinrich Bullinger, Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ (1558)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+we+cannot+in+any+way+acknowledge+or+accept+what+our+opponents+openly+say%2C+namely+that+Mary+is+to+be+invoked+as+a+mediator+between+God+and+humans%2C+or+that+she+is+our+patron+and+advocate.+We+do+not+believe+that+this+is+either+a+tradition+of+Holy+Scripture+or+a+command+from+God.+We+believe+that+God%2C+who+alone+grants+all+salvation+for+the+present+and+future%2C+is+the+one+to+be+invoked+alone.+We+believe+that+Christ+alone+%5Bsince+He+alone+is+true+God+and+true+man%5D+is+the+true+mediator+between+God+and+humans.+We+believe+that+He%2C+who+alone+can+satisfy+all+humans%2C+is+the+patron+and+advocate+with+the+Father.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Sermon+on+the+Blessed+Virgin+Mary%2C+the+Mother+of+Our+Lord+Jesus+Christ+%281558%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9ae95d3b37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9ae95d3b37.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator"><blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote><figcaption>— <a href="../../authors/theodore-beza.html">Theodore Beza</a>, <cite>A Brief and Pithy Sum of Christian Faith (Confession, 1560)</cite>, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</figcaption><div class="meta"><a class="tag here" href="../../topics/scripture/authority.html" aria-current="page">Authority</a><a class="tag" href="../../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../../topics/person-of-christ/mediator.html">The Mediator</a></div><div class="actions"><button class="copy" data-copy="“In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.”

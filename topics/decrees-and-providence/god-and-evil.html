lass="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“Of the author of sin, we confess that our Lord God, though He is the creator and sustainer of all creatures, yet He is not the author of sin. It is rather the evil will, both in the Devil and in the godless human, that, when he does not obtain help from the Lord God, turns away from God, as Christ speaks in John 8, “When the Devil speaks a lie, he speaks of his own, for he is a liar and the father of lies” (v. 44).”

— Theodore Beza, The Christian Faith, ch. 3, art. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+besides+the+fact+that+God%2C+who+is+supremely+good%2C+can+make+nothing+except+what+is+good%2C+if+man+had+been+brought+forth+depraved+and+evil%2C+God+could+have+had+no+sufficiently+just+cause+for+punishing+that+wickedness+of+which+he+himself+would+have+been+the+creator+and+author.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+ch.+3%2C+art.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d67e727d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1d67e727d3.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6156ddcc2e" data-kw="Author of sin The Fall Original Sin"><blockquote><p>It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.1.10</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.”

— John Calvin, Institutes of the Christian Religion, 2.1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+true+that+nature+has+received+a+mortal+wound%2C+but+there+is+a+great+difference+between+a+wound+inflicted+from+without%2C+and+one+inherent+in+our+first+condition.+It+is+plain+that+this+wound+was+inflicted+by+sin%3B+and%2C+therefore%2C+we+have+no+ground+of+complaint+except+against+ourselves.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6156ddcc2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6156ddcc2e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-19caa75f31" data-kw="Author of sin"><blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.”

a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.”

— Herman Witsius, The Economy of the Covenants, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+make+God+the+author+of+sin+is+such+foul+blasphemy%2C+that+it+can+never+enter+any+Christian+man%E2%80%99s+mind+without+a+shudder.+It+is+indeed+true+that+God+had+made+man+mutably+good%2C+had+infallibly+foreseen+his+sin%2C+had+foreordained+the+permission+of+the+sin+and+given+man+no+doubt+sufficient+strength+to+shun+sin%2C+but+inoperable+without+His+influx%3B+that+meanwhile+He+had+inflowed+into+man%E2%80%99s+faculties+for+natural+actions+by+not+inflowing+into+the+moral+entity+of+such+actions.+%E2%80%A6+But+it+is+not+less+true%2C+that+God+neither+is+nor+could+in+any+way+become+the+author+of+sin.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants%2C+1.8.28+%28as+quoted+in+Heinrich+Heppe%2C+Reformed+Dogmatics%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F360e80a51b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/360e80a51b.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-934121b9c3" data-kw="Author of sin"><blockquote><p>In this sense, I utterly deny God to be the Author of Sin; rejecting such an imputation on the Most High, as what is infinitely to be abhorred; and deny any such thing to be the consequence of what I have laid down.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>Freedom of the Will</cite>, pt. 4, sec. 9</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“In this sense, I utterly deny God to be the Author of Sin; rejecting such an imputation on the Most High, as what is infinitely to be abhorred; and deny any such thing to be the consequence of what I have laid down.”

— Jonathan Edwards, Freedom of the Will, pt. 4, sec. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+sense%2C+I+utterly+deny+God+to+be+the+Author+of+Sin%3B+rejecting+such+an+imputation+on+the+Most+High%2C+as+what+is+infinitely+to+be+abhorred%3B+and+deny+any+such+thing+to+be+the+consequence+of+what+I+have+laid+down.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+Freedom+of+the+Will%2C+pt.+4%2C+sec.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F934121b9c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/934121b9c3.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/will" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-561ca6a8d8" data-kw="Author of sin The Fall Satan Temptation"><blockquote><p>Not unto God; he is not the author of sin, nor tempts unto it; nor is he tempted by it: nor to Satan, only as an instrument, enticing and deceiving; but to themselves, to their own will, it was their own act and deed.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“Not unto God; he is not the author of sin, nor tempts unto it; nor is he tempted by it: nor to Satan, only as an instrument, enticing and deceiving; but to themselves, to their own will, it was their own act and deed.”

— John Gill, A Body of Doctrinal Divinity, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+unto+God%3B+he+is+not+the+author+of+sin%2C+nor+tempts+unto+it%3B+nor+is+he+tempted+by+it%3A+nor+to+Satan%2C+only+as+an+instrument%2C+enticing+and+deceiving%3B+but+to+themselves%2C+to+their+own+will%2C+it+was+their+own+act+and+deed.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+A+Body+of+Doctrinal+Divinity%2C+bk.+3%2C+ch.+8+%28Of+the+Sin+and+Fall+of+Our+First+Parents%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F561ca6a8d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/561ca6a8d8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/gill/doctrinal" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-e710bbc718" data-kw="Author of sin"><blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote><figcaption>— <a href="../../authors/benjamin-cox.html">Benjamin Cox</a>, <cite>An Appendix to a Confession of Faith (Baptist, 1646)</cite>, art. 3</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a></div><div class="actions"><button class="copy" data-copy="“Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).”

— Benjamin Cox, An Appendix to a Confession of Faith (Baptist, 1646), art. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+all+the+power+of+the+creature+to+act+is+from+the+Creator%2C+and+there+is+a+providence+of+God+always+extended+to+every+creature%2C+and+to+every+action+of+the+creature%3B+yet+we+judge+that+the+final+corruption+of+the+creature%2C+and+the+sinfulness+of+the+creature%E2%80%99s+action%2C+is+from+the+creature%2C+and+not+from+God%3B+and+that+it+is+a+great+sin+to+say+that+God+is+the+author+of+sin+%28Eccl.+7%3A29%3B+Hab.+1%3A13%3B+James+1%3A13%E2%80%9315%3A+1+Cor.+14%3A33%3B+1+John+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Cox%2C+An+Appendix+to+a+Confession+of+Faith+%28Baptist%2C+1646%29%2C+art.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe710bbc718.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e710bbc718.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin Hardening Justice Depravity"><blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>The Second Helvetic Confession (1566)</cite>, ch. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.”

— Heinrich Bullinger, The Second Helvetic Confession (1566), ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYes%2C+there+is+even+in+ourselves+sin+and+corruption+enough%2C+so+that+there+is+no+need+that+God+should+infuse+into+us+either+a+new+or+greater+measure+of+wickedness.+Therefore%2C+when+God+is+said+in+the+Scripture+to+harden+%28Ex.+7%3A13%29%2C+to+blind+%28John+12%3A40%29+and+to+deliver+us+up+into+a+reprobate+sense+%28Rom.+1%3A28%29%2C+it+is+to+be+understood+that+God+does+it+by+just+judgment%2C+as+a+just+judge+and+avenger.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession+%281566%29%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc71e2bebb7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c71e2bebb7.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin"><blockquote><p>But although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote><figcaption>— <a href="../../authors/johannes-piscator.html">Johannes Piscator</a>, <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“But although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.”

— Johannes Piscator, Aphorisms of Christian Doctrine, Locus 6, aph. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+although+God+by+his+providence+governs+even+sins%2C+yet+he+is+not+the+cause+or+author+of+sin%3A+because+he+takes+no+delight+in+sin%2C+but+rather+abhors+it%3B+nor+does+he+himself+sin%2C+or+can+he+sin%3B+likewise+because+he+neither+commands+nor+persuades+sin%3B+nor+does+he+pour+malice+into+those+who+sin%2C+nor+compel+them+to+sin%3B+and+moreover+he+directs+all+things+to+a+good+end.%E2%80%9D%0A%0A%E2%80%94+Johannes+Piscator%2C+Aphorisms+of+Christian+Doctrine%2C+Locus+6%2C+aph.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4b8c25085e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4b8c25085e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-41d7db1dae" data-kw="Author of sin"><blockquote><p>God does not infuse malice into the wills of evil men, as He infuses goodness into the hearts of the godly.—In one and the same work of the godly what is a good and just action proper to God is to be distinguished from the defect and vice of the ungodly. The sin of the wicked is their own; their doing this or that by sinning is of God’s power,—and so in the same work God is ascertained to be righteous, man to be guilty.</p></blockquote><figcaption>— <a href="../../authors/william-bucanus.html">William Bucanus</a>, <cite>Institutions of the Christian Religion</cite>, 19.11 (as quoted in Heinrich Heppe, Reformed Dogmatics)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a></div><div class="actions"><button class="copy" data-copy="“God does not infuse malice into the wills of evil men, as He infuses goodness into the hearts of the godly.—In one and the same work of the godly what is a good and just action proper to God is to be distinguished from the defect and vice of the ungodly. The sin of the wicked is their own; their doing this or that by sinning is of God’s power,—and so in the same work God is ascertained to be righteous, man to be guilty.”

— William Bucanus, Institutions of the Christian Religion, 19.11 (as quoted in Heinrich Heppe, Reformed Dogmatics)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+does+not+infuse+malice+into+the+wills+of+evil+men%2C+as+He+infuses+goodness+into+the+hearts+of+the+godly.%E2%80%94In+one+and+the+same+work+of+the+godly+what+is+a+good+and+just+action+proper+to+God+is+to+be+distinguished+from+the+defect+and+vice+of+the+ungodly.+The+sin+of+the+wicked+is+their+own%3B+their+doing+this+or+that+by+sinning+is+of+God%E2%80%99s+power%2C%E2%80%94and+so+in+the+same+work+God+is+ascertained+to+be+righteous%2C+man+to+be+guilty.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+the+Christian+Religion%2C+19.11+%28as+quoted+in+Heinrich+Heppe%2C+Reformed+Dogmatics%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41d7db1dae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/41d7db1dae.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_institutions-of-christia_william-bucanus_1606" target="_blank" rel="noopener">Read it online · Internet Archive (1606 ed.)</a></div></figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall"><blockquote><p>And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote><figcaption>— <a href="../../authors/synod-of-debrecen.html">Synod of Debrecen</a>, <cite>Documents of the Synod of Debrecen (1567)</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).”

— Synod of Debrecen, Documents of the Synod of Debrecen (1567)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+just+as+he+that+wishes+to+punish+someone+by+fumigating+with+a+foul+smell%2C+sulfur+and+dung%2C+does+not+put+a+foul+smell+into+the+sulfur+and+dung+%28it+already+is+there%29%2C+so+God%2C+when+He+punishes+sins+through+the+devil+and+the+vessels+of+wrath+with+sins%2C+does+not+put+any+sin+into+them%2C+but+it+is+there+naturally+since+the+fall+in+the+devil+and+in+men+%28Eph.+4%3B+Rom.+1%29.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Debrecen%2C+Documents+of+the+Synod+of+Debrecen+%281567%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F215040d6fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/215040d6fd.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin Satan"><blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote><figcaption>— <a href="../../authors/french-reformed-churches.html">French Reformed Churches</a>, <cite>The French Confession (1559)</cite>, Art. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.”

— French Reformed Churches, The French Confession (1559), Art. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+we+deny+that+He+is+the+author+of+sin%2C+or+that+the+blame+of+things+done+amiss+can+be+laid+upon+Him%2C+seeing+His+will+is+the+sovereign+and+infallible+rule+of+all+righteousness+and+equity%3A+but+this+we+confess+that+He+has+those+admirable+means+as+whereby+He+makes+the+devils+and+the+ungodly%2C+as+His+instruments+to+serve+Him+and+to+turn+the+evil+which+they+do+and+whereof+they+are+guilty+into+good.%E2%80%9D%0A%0A%E2%80%94+French+Reformed+Churches%2C+The+French+Confession+%281559%29%2C+Art.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff36de3147a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f36de3147a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/schaff/creeds3" target="_blank" rel="noopener">Read it online · CCEL, Schaff&#x27;s Creeds of Christendom vol. 3</a></div></figure><figure class="quote" id="q-02b480aa14" data-kw="Author of sin Permission Free Will"><blockquote><p>God might, indeed, by his absolute power, prevent evil; but he will not wrong and despoil his own creature, man, whom he created righteous and holy. He acts with man in a manner that corresponds with the nature with which he has endowed him. Hence he proposes laws to which he attaches rewards and punishments—he commands us to embrace the good and shun the evil; and that we may do this, he both grants his grace, without which we can do nothing, and also encourages our diligence and labor. But if a man come short of doing what he ought, his sin and negligence are chargeable upon himself, and not upon God, although God had the power to prevent it, and yet did not.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 7</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“God might, indeed, by his absolute power, prevent evil; but he will not wrong and despoil his own creature, man, whom he created righteous and holy. He acts with man in a manner that corresponds with the nature with which he has endowed him. Hence he proposes laws to which he attaches rewards and punishments—he commands us to embrace the good and shun the evil; and that we may do this, he both grants his grace, without which we can do nothing, and also encourages our diligence and labor. But if a man come short of doing what he ought, his sin and negligence are chargeable upon himself, and not upon God, although God had the power to prevent it, and yet did not.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+might%2C+indeed%2C+by+his+absolute+power%2C+prevent+evil%3B+but+he+will+not+wrong+and+despoil+his+own+creature%2C+man%2C+whom+he+created+righteous+and+holy.+He+acts+with+man+in+a+manner+that+corresponds+with+the+nature+with+which+he+has+endowed+him.+Hence+he+proposes+laws+to+which+he+attaches+rewards+and+punishments%E2%80%94he+commands+us+to+embrace+the+good+and+shun+the+evil%3B+and+that+we+may+do+this%2C+he+both+grants+his+grace%2C+without+which+we+can+do+nothing%2C+and+also+encourages+our+diligence+and+labor.+But+if+a+man+come+short+of+doing+what+he+ought%2C+his+sin+and+negligence+are+chargeable+upon+himself%2C+and+not+upon+God%2C+although+God+had+the+power+to+prevent+it%2C+and+yet+did+not.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02b480aa14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/02b480aa14.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-f9412b24db" data-kw="Original Sin The Fall Author of sin"><blockquote><p>We say, then, that man is corrupted by a natural viciousness, but not by one which proceeded from nature. In saying that it proceeded not from nature, we mean that it was rather an adventitious event which befell man, than a substantial property assigned to him from the beginning.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.1.11</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“We say, then, that man is corrupted by a natural viciousness, but not by one which proceeded from nature. In saying that it proceeded not from nature, we mean that it was rather an adventitious event which befell man, than a substantial property assigned to him from the beginning.”

— John Calvin, Institutes of the Christian Religion, 2.1.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+say%2C+then%2C+that+man+is+corrupted+by+a+natural+viciousness%2C+but+not+by+one+which+proceeded+from+nature.+In+saying+that+it+proceeded+not+from+nature%2C+we+mean+that+it+was+rather+an+adventitious+event+which+befell+man%2C+than+a+substantial+property+assigned+to+him+from+the+beginning.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.1.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9412b24db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f9412b24db.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-12a63f8296" data-kw="Author of sin Depravity"><blockquote><p>First, the offering of occasions which can be procured only by the peculiar providence of God by the concourse of circumstances and the proposition of objects, fitted to move faculties constituted in this or that way (in which manner God does not infuse wickedness into the minds of men, but draws out into action the wickedness latent there).</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.7.15</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“First, the offering of occasions which can be procured only by the peculiar providence of God by the concourse of circumstances and the proposition of objects, fitted to move faculties constituted in this or that way (in which manner God does not infuse wickedness into the minds of men, but draws out into action the wickedness latent there).”

— Francis Turretin, Institutes of Elenctic Theology, 6.7.15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+the+offering+of+occasions+which+can+be+procured+only+by+the+peculiar+providence+of+God+by+the+concourse+of+circumstances+and+the+proposition+of+objects%2C+fitted+to+move+faculties+constituted+in+this+or+that+way+%28in+which+manner+God+does+not+infuse+wickedness+into+the+minds+of+men%2C+but+draws+out+into+action+the+wickedness+latent+there%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+6.7.15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F12a63f8296.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/12a63f8296.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-1db2bdaf10" data-kw="Author of sin Permission"><blockquote><p>The decree which is the cause of the futurition of sin is nevertheless neither its physical cause (by the infusion of evil) nor its ethical cause (by the approbation of it). So although sin necessarily follows the decree, it cannot be said to flow from the decree. The decree does not flow into the thing, nor is it effective of evil, but only permissive and directive.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 4.4.10</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“The decree which is the cause of the futurition of sin is nevertheless neither its physical cause (by the infusion of evil) nor its ethical cause (by the approbation of it). So although sin necessarily follows the decree, it cannot be said to flow from the decree. The decree does not flow into the thing, nor is it effective of evil, but only permissive and directive.”

— Francis Turretin, Institutes of Elenctic Theology, 4.4.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+decree+which+is+the+cause+of+the+futurition+of+sin+is+nevertheless+neither+its+physical+cause+%28by+the+infusion+of+evil%29+nor+its+ethical+cause+%28by+the+approbation+of+it%29.+So+although+sin+necessarily+follows+the+decree%2C+it+cannot+be+said+to+flow+from+the+decree.+The+decree+does+not+flow+into+the+thing%2C+nor+is+it+effective+of+evil%2C+but+only+permissive+and+directive.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+4.4.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1db2bdaf10.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1db2bdaf10.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a4595f704a" data-kw="Original Sin Author of sin"><blockquote><p>Now although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.12.10</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“Now although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.”

— Francis Turretin, Institutes of Elenctic Theology, 9.12.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+although+souls+are+created+by+God+destitute+of+original+righteousness%2C+God+cannot+on+that+account+be+considered+the+author+of+sin.+It+is+one+thing+to+infuse+impurity%3B+another+not+to+give+the+purity+of+which+man+has+rendered+himself+unworthy+in+Adam.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+9.12.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4595f704a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a4595f704a.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission"><blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.”

— Stephen Charnock, A Treatise on Divine Providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+doth+not+infuse+the+lust%2C+or+excite+it%2C+though+he+doth+present+the+object+about+which+the+lust+is+exercised.+God+delivered+up+Christ+to+the+Jews%2C+he+presented+him+to+them%2C+but+never+commanded+them+to+crucify+him%2C+nor+infused+that+malice+into+them%2C+nor+quickened+it%3B+but+he%2C+seeing+such+a+frame%2C+withdrew+his+restraining+grace%2C+and+left+them+to+the+conduct+of+their+own+vitiated+wills.+%E2%80%A6+God+created+the+grape%2C+and+filled+the+vine+with+a+sprightliness%2C+but+he+doth+never+infuse+a+drunken+frame+into+a+man%2C+or+excite+it.+%E2%80%A6+In+short%2C+though+it+be+by+God%27s+permission+that+we+can+do+evil%2C+yet+it+is+not+by+his+inspiration+that+we+will+to+do+evil%3B+that+is+wholly+from+ourselves.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Treatise+on+Divine+Providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffcfddb7a0b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fcfddb7a0b.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1641-1700_a-treatise-of-divine-pro_charnock-stephen_1680" target="_blank" rel="noopener">Read it online · Internet Archive (1680 ed.)</a></div></figure><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin"><blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a></div><div class="actions"><button class="copy" data-copy="“Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Holiness of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+the+natural+virtue+of+doing+a+sinful+action+be+from+God%2C+and+supported+by+him%2C+yet+this+doth+not+blemish+the+holiness+of+God.+While+God+concurs+with+them+in+the+act%2C+he+instills+no+evil+into+men.+%E2%80%A6+The+physical+goodness+of+the+action+depends+on+God%2C+the+moral+evil+on+the+creature.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+The+Existence+and+Attributes+of+God%2C+Discourse+on+the+Holiness+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d08e1330a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8d08e1330a.html">Permalink</a><a class="src" href="https://archive.org/details/discoursesupone02char" target="_blank" rel="noopener">Read it online · Internet Archive, vol. 2</a></div></figure><figure class="quote" id="q-7826d6ff7b" data-kw="Author of sin Temptation"><blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+understanding+this+point%2C+how+the+providence+of+God+reacheth+to+and+is+concerned+in+sinful+actions%2C+we+are+to+consider%2C+that+God+neither+puts+evil+into+the+hearts+of+men%2C+nor+stirs+them+up+to+it%3A+for%2C+says+the+apostle%2C+Jam.+1%3A13.+%27God+cannot+be+tempted+with+evil%3B+neither+tempteth+he+any+man.%27+And+therefore+he+is+not+the+author+of+sin.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7826d6ff7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7826d6ff7b.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice"><blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on original sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+this+is+certain%2C+that+God+doth+not+infuse+it.+Souls+receive+neither+purity+nor+impurity+from+him%2C+but+only+their+naked+essence%2C+and+the+natural+powers+and+properties+flowing+therefrom.+He+doth+not+infuse+any+impurity+into+men%3B+for+he+cannot+be+the+author+of+sin%2C+who+is+the+revenger+of+it.+%E2%80%A6+As+a+pure+and+holy+God%2C+he+cannot+infuse+any+impurity+into+the+souls+of+men%3B+and+as+a+just+and+righteous+God%2C+he+may+and+doth+withhold+from%2C+or+create+them+void+and+destitute+of%2C+that+holiness+and+righteousness+which+was+once+their+happiness+and+glory.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+original+sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac2cd3cfb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ac2cd3cfb9.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-7c2b4a999d" data-kw="Original Sin Depravity Author of sin"><blockquote><p>In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 4, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.”

— Jonathan Edwards, The Great Christian Doctrine of Original Sin Defended, pt. 4, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+order+to+account+for+a+sinful+corruption+of+nature%2C+yea%2C+a+total+native+depravity+of+the+heart+of+man%2C+there+is+not+the+least+need+of+supposing+any+evil+quality%2C+infused%2C+implanted%2C+or+wrought+into+the+nature+of+man%2C+by+any+positive+cause%2C+or+influence+whatsoever%2C+either+from+God%2C+or+the+creature%3B+or+of+supposing%2C+that+man+is+conceived+and+born+with+a+fountain+of+evil+in+his+heart%2C+such+as+is+any+thing+properly+positive.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+Great+Christian+Doctrine+of+Original+Sin+Defended%2C+pt.+4%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c2b4a999d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c2b4a999d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/works1" target="_blank" rel="noopener">Read it online · CCEL, Works vol. 1</a></div></figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice"><blockquote><p>But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, Vol. 2 (on original sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.”

— Charles Hodge, Systematic Theology, Vol. 2 (on original sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+He+is+not+the+author+of+the+evil+dispositions+with+which+that+nature+is+infected+at+birth.+The+doctrine+of+original+sin+attributes+no+efficiency+to+God+in+the+production+of+evil.+It+simply+supposes+that+He+judicially+abandons+our+apostate+race%2C+and+withholds+from+the+descendants+of+Adam+the+manifestations+of+his+favour+and+love%2C+which+are+the+life+of+the+soul.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+Vol.+2+%28on+original+sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3630fcaed0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3630fcaed0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology2" target="_blank" rel="noopener">Read it online · CCEL, vol. 2</a></div></figure><figure class="quote" id="q-52550c975a" data-kw="Hardening Author of sin"><blockquote><p>When God is here spoken of as hardening some of the children of men, it is not to be understood that God by any positive efficiency hardens any man&#x27;s heart. There is no positive act in God, as though he put forth any power to harden the heart. To suppose any such thing would be to make God the immediate author of sin. God is said to harden men in two ways: by withholding the powerful influences of his Spirit, without which their hearts will remain hardened, and grow harder and harder; in this sense he hardens them, as he leaves them to hardness. And again, by ordering those things in his providence which, through the abuse of their corruption, become the occasion of their hardening.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>God&#x27;s Sovereignty</cite>, sermon on Romans 9:18</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“When God is here spoken of as hardening some of the children of men, it is not to be understood that God by any positive efficiency hardens any man&#x27;s heart. There is no positive act in God, as though he put forth any power to harden the heart. To suppose any such thing would be to make God the immediate author of sin. God is said to harden men in two ways: by withholding the powerful influences of his Spirit, without which their hearts will remain hardened, and grow harder and harder; in this sense he hardens them, as he leaves them to hardness. And again, by ordering those things in his providence which, through the abuse of their corruption, become the occasion of their hardening.”

— Jonathan Edwards, God&#x27;s Sovereignty, sermon on Romans 9:18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+God+is+here+spoken+of+as+hardening+some+of+the+children+of+men%2C+it+is+not+to+be+understood+that+God+by+any+positive+efficiency+hardens+any+man%27s+heart.+There+is+no+positive+act+in+God%2C+as+though+he+put+forth+any+power+to+harden+the+heart.+To+suppose+any+such+thing+would+be+to+make+God+the+immediate+author+of+sin.+God+is+said+to+harden+men+in+two+ways%3A+by+withholding+the+powerful+influences+of+his+Spirit%2C+without+which+their+hearts+will+remain+hardened%2C+and+grow+harder+and+harder%3B+in+this+sense+he+hardens+them%2C+as+he+leaves+them+to+hardness.+And+again%2C+by+ordering+those+things+in+his+providence+which%2C+through+the+abuse+of+their+corruption%2C+become+the+occasion+of+their+hardening.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+God%27s+Sovereignty%2C+sermon+on+Romans+9%3A18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52550c975a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/52550c975a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/works2" target="_blank" rel="noopener">Read it online · CCEL, Works vol. 2</a></div></figure><figure class="quote" id="q-2c9dc6be06" data-kw="Hardening Depravity Author of sin Reprobation"><blockquote><p>God hardens some men&#x27;s hearts, as he did Pharaoh&#x27;s, and he wills to harden them, or he hardens them according to his decreeing will; &quot;Whom he will he hardens&quot;, (Romans 9:18) this he does not by any positive act, by infusing hardness and blindness into the hearts of men; which is contrary to his purity and holiness, and would make him the author of sin; but by leaving men to their natural blindness and hardness of heart; for the understanding is naturally darkened; and there is a natural blindness, hardness, and callousness of heart, through the corruption of nature, and which is increased by habits of sinning.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 2, ch. 3 (Of the Decrees of Rejection)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/reprobation.html">Reprobation</a></div><div class="actions"><button class="copy" data-copy="“God hardens some men&#x27;s hearts, as he did Pharaoh&#x27;s, and he wills to harden them, or he hardens them according to his decreeing will; &quot;Whom he will he hardens&quot;, (Romans 9:18) this he does not by any positive act, by infusing hardness and blindness into the hearts of men; which is contrary to his purity and holiness, and would make him the author of sin; but by leaving men to their natural blindness and hardness of heart; for the understanding is naturally darkened; and there is a natural blindness, hardness, and callousness of heart, through the corruption of nature, and which is increased by habits of sinning.”

— John Gill, A Body of Doctrinal Divinity, bk. 2, ch. 3 (Of the Decrees of Rejection)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+hardens+some+men%27s+hearts%2C+as+he+did+Pharaoh%27s%2C+and+he+wills+to+harden+them%2C+or+he+hardens+them+according+to+his+decreeing+will%3B+%22Whom+he+will+he+hardens%22%2C+%28Romans+9%3A18%29+this+he+does+not+by+any+positive+act%2C+by+infusing+hardness+and+blindness+into+the+hearts+of+men%3B+which+is+contrary+to+his+purity+and+holiness%2C+and+would+make+him+the+author+of+sin%3B+but+by+leaving+men+to+their+natural+blindness+and+hardness+of+heart%3B+for+the+understanding+is+naturally+darkened%3B+and+there+is+a+natural+blindness%2C+hardness%2C+and+callousness+of+heart%2C+through+the+corruption+of+nature%2C+and+which+is+increased+by+habits+of+sinning.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+A+Body+of+Doctrinal+Divinity%2C+bk.+2%2C+ch.+3+%28Of+the+Decrees+of+Rejection%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c9dc6be06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2c9dc6be06.html">Permalink</a><a class="src" href="https://ccel.org/ccel/gill/doctrinal" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin"><blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote><figcaption>— <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.”

— Johannes Wollebius, Compendium of Christian Theology, bk. 1, ch. 6 (providence), canon 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+two+things+are+to+be+considered+in+evil+actions%3A+the+action+itself%2C+and+the+%E1%BC%80%CE%BD%CE%BF%CE%BC%CE%AF%CE%B1+%5Banomia%2C+lawlessness%5D+of+the+action.+The+action+itself%2C+as+a+natural+motion%2C+takes+place+by+the+efficacious+working+of+God%3B+but+the+anomia+or+wickedness+takes+place+by+the+active+permission+of+God.+%E2%80%A6+for+as+in+a+horse+the+cause+of+the+motion+is+one+thing+and+the+cause+of+the+limping+another%2C+so+it+is+one+thing+to+be+the+cause+of+the+action+and+another+to+be+the+cause+of+the+wickedness+cleaving+to+it.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+bk.+1%2C+ch.+6+%28providence%29%2C+canon+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7df9615162.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7df9615162.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin"><blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.5.16</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a></div><div class="actions"><button class="copy" data-copy="“Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.”

— Francis Turretin, Institutes of Elenctic Theology, 6.5.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+premotion+of+God+is+extended+to+evil+actions%2C+it+does+not+on+that+account+make+God+guilty+of+the+fault+or+the+author+of+sin.+It+only+pertains+to+actions+inasmuch+as+they+are+material+and+entitative+%28entitative%29%2C+not+however+as+they+are+moral%2C+i.e.%2C+to+the+substance+of+the+act%2C+but+not+to+its+wickedness.+%E2%80%A6+The+magistrate+is+the+cause+of+the+death+inflicted+on+the+guilty+person+by+the+executioner%2C+but+is+not+the+cause+of+the+cruelty+exhibited+in+that+execution%3B+the+harp+player+is+the+cause+of+the+sound%2C+but+not+of+the+dissonance+arising+from+the+strings%3B+and+he+who+drives+a+lame+horse+is+the+cause+of+the+motion%2C+but+not+the+lameness.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+6.5.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F203bb6b5d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/203bb6b5d2.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will"><blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.6.8</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.”

— Francis Turretin, Institutes of Elenctic Theology, 6.6.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+evil+actions%2C+however%2C+he+so+concurs+as+neither+to+effect%2C+assist%2C+nor+approve+of+them%2C+but+to+permit+and+efficaciously+direct%3B+not+by+infusing+wickedness%2C+but+by+so+determining+rational+creatures+physically+to+the+substance+of+the+act+in+the+genus+of+being%2C+that+they+%28when+left+to+themselves+failing+from+the+law%29+move+and+determine+themselves+to+bad+actions+in+the+genus+of+morals%2C+performing+them+freely+and+voluntarily+%28hekousi%C5%8Ds%29.+Hence+the+guilt+rests+upon+them+alone.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+6.6.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbd64be838.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/dbd64be838.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin"><blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.”

— Petrus van Mastricht, Theoretical-Practical Theology, Vol. 3, bk. 3, ch. 10 (Providence), §18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+we+are+able+to+reconcile+them+easily+enough%2C+if+we+distinguish+within+sin+its+material+element%2C+namely%2C+the+habit+or+act+that+is+the+substrate+of+the+wickedness%2C+with+which%2C+inasmuch+as+it+is+physically+good%2C+God+is+not+able+not+to+concur+as+the+efficient+cause%2C+without+casting+aside+his+own+independence+%28Acts+17%3A28%3B+Rom.+11%3A36%29%2C+and+its+formal+element%2C+lawlessness+%281+John+3%3A4%29%2C+through+which+the+act+or+habit+is+sin%2C+whose+author+he+cannot+be%2C+because+the+one+set+above+all+law+cannot+transgress+the+law.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+Vol.+3%2C+bk.+3%2C+ch.+10+%28Providence%29%2C+%C2%A718&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19470c5e06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/19470c5e06.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-5f0eaba27e" data-kw="Author of sin"><blockquote><p>God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §32</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a></div><div class="actions"><button class="copy" data-copy="“God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.”

— Petrus van Mastricht, Theoretical-Practical Theology, Vol. 3, bk. 3, ch. 10 (Providence), §32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+by+his+influence+is+indeed+the+principal+cause+of+the+act+itself%2C+but+man+is+the+sole+cause+of+the+sin+itself%2C+which+is+in+that+act.+%E2%80%A6+Nor+can+even+one+theologian+be+shown+who+has+said+that+God+is+the+author+of+lawlessness%2C+or+of+sin+insofar+as+it+is+sin.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+Vol.+3%2C+bk.+3%2C+ch.+10+%28Providence%29%2C+%C2%A732&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f0eaba27e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5f0eaba27e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-7be12b839e" data-kw="Author of sin Justice"><blockquote><p>But we teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.</p></blockquote><figcaption>— <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a>, <cite>Examination of Arminianism</cite>, ch. 2, title 5 (On the Will of God)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“But we teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.”

— Samuel Rutherford, Examination of Arminianism, ch. 2, title 5 (On the Will of God)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+we+teach+that+the+action+of+God+and+of+men+sinning+is+the+same%2C+according+to+material+being%2C+but+not+according+to+moral+being.+%E2%80%A6+But+truly+the+action+of+God+and+of+men+is+not+the+same+according+to+moral+being%3B+because+God+acts+justly+from+all+four+causes%2C+while+he+punishes+the+Church+through+sinning+instruments%3B+but+the+action+of+the+instruments+is+morally+unjust+and+vicious.+%E2%80%A6+But+we+teach+that+God+is+not+the+cause+of+the+malice%2C+although+he+is+the+cause+of+the+act.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Examination+of+Arminianism%2C+ch.+2%2C+title+5+%28On+the+Will+of+God%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7be12b839e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7be12b839e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin"><blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote><figcaption>— <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a>, <cite>The Doctrine of Absolute Predestination (tr. Augustus Toplady)</cite>, on the omnipotence of God</fig

caption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a></div><div class="actions"><button class="copy" data-copy="“Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.”

— Jerome Zanchi, The Doctrine of Absolute Predestination (tr. Augustus Toplady), on the omnipotence of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+action%2C+as+such%2C+is+undoubtedly+good%2C+it+being+an+actual+exertion+of+those+operative+powers+given+us+by+God+for+that+very+end%3B+God+therefore+may+be+the+Author+of+all+actions+%28as+He+undoubtedly+is%29%2C+and+yet+not+be+the+Author+of+evil.+%E2%80%A6+Suppose+a+boy%2C+who+knows+not+how+to+write%2C+has+his+hand+guided+by+his+master+and+nevertheless+makes+false+letters%2C+quite+unlike+the+copy+set+him%2C+though+his+preceptor%2C+who+guides+his+hand%2C+is+the+cause+of+his+writing+at+all%2C+yet+his+own+ignorance+and+unskilfulness+are+the+cause+of+his+writing+so+badly.+Just+so%2C+God+is+the+supreme+Author+of+our+action%2C+abstractedly+taken%2C+but+our+own+vitiosity+is+the+cause+of+our+acting+amiss.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+The+Doctrine+of+Absolute+Predestination+%28tr.+Augustus+Toplady%29%2C+on+the+omnipotence+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b496daf9c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9b496daf9c.html">Permalink</a><a class="src" href="https://archive.org/details/doctrineofabsolu01zanc" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin Depravity"><blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.”

— Stephen Charnock, A Treatise on Divine Providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+power+of+action+is+from+God%2C+but+the+viciousness+of+that+action+from+our+own+nature.+As+when+a+clock+or+watch+hath+some+fault+in+any+of+the+wheels%2C+the+man+that+winds+it+up%2C+or+putting+his+hand+upon+the+wheels+moves+them%2C+he+is+the+cause+of+the+motion%2C+but+it+is+the+flaw+in+it%2C+or+deficiency+of+something%2C+is+the+cause+of+its+erroneous+motion.+%E2%80%A6+Our+motion+is+from+God%2C%E2%80%94Acts+17%3A28%2C+%27In+him+we+move%27%2C%E2%80%94but+not+the+disorder+of+that+motion.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Treatise+on+Divine+Providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4f7b0edf2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f4f7b0edf2.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1641-1700_a-treatise-of-divine-pro_charnock-stephen_1680" target="_blank" rel="noopener">Read it online · Internet Archive (1680 ed.)</a></div></figure><figure class="quote" id="q-858e5287fa" data-kw="Author of sin"><blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 27 (on providence)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+fallacy+of+the+accident+in+the+minor+proportion%3B+for+the+actions+of+the+wicked+are+sins%2C+not+%28per+se%29+in+themselves%2C+in+as+far+as+they+are+actions%3B+but+by+an+accident+on+account+of+the+want+of+righteousness%2C+and+of+the+perversity+of+the+will+of+the+ungodly%2C+who+do+not+observe+this+so+as+to+follow+in+the+action+the+will+of+God.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+27+%28on+providence%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F858e5287fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/858e5287fa.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin"><blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.”

— John Gill, A Body of Doctrinal Divinity, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+influences+of+divine+providence+concur+with+every+action%2C+be+it+what+it+may%2C+as+an+action%2C+since+all+live%2C+and+move%2C+and+have+their+being+in+God%3B+every+action%2C+as+an+action%2C+is+from+God%3B+but+the+obliquity%2C+irregularity%2C+and+sinfulness+of+the+action%2C+is+from+the+creature%3A+wherefore+God+is+not+the+author+of+any+sin.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+A+Body+of+Doctrinal+Divinity%2C+bk.+3%2C+ch.+8+%28Of+the+Sin+and+Fall+of+Our+First+Parents%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb4af681b72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b4af681b72.html">Permalink</a><a class="src" href="https://ccel.org/ccel/gill/doctrinal" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-f87d7ae16e" data-kw="Permission Author of sin"><blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+pravity+or+sin+that+is+in+actions%2C+as+God+decreed+the+futurition+of+sin%2C+or+permitted+it+to+take+place%2C+and+did+not+hinder+it%3B+so+all+the+sin+or+vitiosity+that+is+in+actions+proceeds+entirely+from+the+creature%2C+and+the+evil+lusts+and+passions+that+are+in+his+heart.+Thus+a+man%27s+taking+up+a+stone%2C+and+throwing+it%2C+is+a+natural+action%2C+which+the+providence+of+God+enables+him+to+perform%3B+but+his+throwing+it+at+another+man+with+an+intention+to+kill+him%2C+is+permitted+by+God%2C+otherwise+it+could+not+take+place.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff87d7ae16e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f87d7ae16e.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-8520e28d8b" data-kw="Author of sin Free Will"><blockquote><p>As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>Freedom of the Will</cite>, pt. 4, sec. 9</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.”

— Jonathan Edwards, Freedom of the Will, pt. 4, sec. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+there+is+a+vast+difference+between+the+sun+being+the+cause+of+the+lightsomeness+and+warmth+of+the+atmosphere%2C+and+the+brightness+of+gold+and+diamonds%2C+by+its+presence+and+positive+influence%3B+and+its+being+the+occasion+of+darkness+and+frost%2C+in+the+night%2C+by+its+motion%2C+whereby+it+descends+below+the+horizon.+The+motion+of+the+sun+is+the+occasion+of+the+latter+kind+of+events%3B+but+it+is+not+the+proper+cause%2C+efficient%2C+or+producer+of+them%3B+though+they+are+necessarily+consequent+on+that+motion%2C+under+such+circumstances%3A+no+more+is+any+action+of+the+Divine+Being+the+cause+of+the+evil+of+men%27s+Wills.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+Freedom+of+the+Will%2C+pt.+4%2C+sec.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8520e28d8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8520e28d8b.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/will" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin Free Will"><blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote><figcaption>— <a href="../../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, on the Cause of Sin, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.”

— William Ames, Bellarmine Disarmed, on the Cause of Sin, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+who+uses+as+an+instrument+a+man+freely+failing%2C+to+effect+what+is+good%2C+is+not+the+author+of+the+failure.+%E2%80%A6+The+wicked%2C+while+they+sin%2C+are+not+properly+instruments+of+God+moved%2C+that+is+to+say%2C+without+an+internal+principle+of+motion%2C+but+metaphorically%2C+moved+in+such+a+way+that+they+freely+move+themselves.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+on+the+Cause+of+Sin%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faee029b880.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/aee029b880.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission Author of sin"><blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote><figcaption>— <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.”

— Johannes Wollebius, Compendium of Christian Theology, bk. 1, ch. 6 (providence), canon 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+by+permitting+the+evil+action%2C+because+he+is+bound+by+no+law+to+hinder+sin.+Not+by+determining+it%3B+for+as+he+who+puts+out+a+fire+so+that+it+may+not+spread+further+is+not+the+cause+of+the+fire%2C+so+he+who+fixes+bounds+to+sin+is+not+the+cause+of+sin.+Not+by+directing+it+to+a+good+end%3B+for+as+it+is+the+highest+art+to+prepare+a+wholesome+medicine+from+venomous+animals%2C+so+it+is+glorious+for+God+to+draw+light+even+out+of+darkness%2C+and+something+good+out+of+evils.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+bk.+1%2C+ch.+6+%28providence%29%2C+canon+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbc72ee2b84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/bc72ee2b84.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a923204566" data-kw="Permission Author of sin The Fall"><blockquote><p>God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div><div class="actions"><button class="copy" data-copy="“God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Holiness of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+acted+nothing%2C+but+only+ceased+to+act%2C+and+therefore+could+not+be+the+efficient+cause+of+man%E2%80%99s+sin.+As+God+is+not+the+author+of+good+but+by+willing+and+effecting+it%2C+so+he+is+not+the+author+of+evil+but+by+willing+and+effecting+it.+But+he+doth+not+positively+will+evil%2C+nor+effect+it+by+any+efficacy+of+his+own.+Permission+is+no+action%2C+nor+the+cause+of+that+action+which+is+permitted%2C+but+the+will+of+that+person+who+is+permitted+to+do+such+an+action+is+the+cause.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+The+Existence+and+Attributes+of+God%2C+Discourse+on+the+Holiness+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa923204566.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a923204566.html">Permalink</a><a class="src" href="https://archive.org/details/discoursesupone02char" target="_blank" rel="noopener">Read it online · Internet Archive, vol. 2</a></div></figure><figure class="quote" id="q-19b30684ec" data-kw="Permission Author of sin"><blockquote><p>He wills it not by his effective will, but by his permissive will; and therefore cannot be chargeable with being the author of sin; since there is a wide difference between doing it himself, and doing it by others, or ordering it to be done, which only can make him the author of sin; and voluntarily permitting or suffering it to be done by others.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 1, ch. 11 (Of the Will of God)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“He wills it not by his effective will, but by his permissive will; and therefore cannot be chargeable with being the author of sin; since there is a wide difference between doing it himself, and doing it by others, or ordering it to be done, which only can make him the author of sin; and voluntarily permitting or suffering it to be done by others.”

— John Gill, A Body of Doctrinal Divinity, bk. 1, ch. 11 (Of the Will of God)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+wills+it+not+by+his+effective+will%2C+but+by+his+permissive+will%3B+and+therefore+cannot+be+chargeable+with+being+the+author+of+sin%3B+since+there+is+a+wide+difference+between+doing+it+himself%2C+and+doing+it+by+others%2C+or+ordering+it+to+be+done%2C+which+only+can+make+him+the+author+of+sin%3B+and+voluntarily+permitting+or+suffering+it+to+be+done+by+others.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+A+Body+of+Doctrinal+Divinity%2C+bk.+1%2C+ch.+11+%28Of+the+Will+of+God%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19b30684ec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/19b30684ec.html">Permalink</a><a class="src" href="https://ccel.org/ccel/gill/doctrinal" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall"><blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 5.4</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a></div><div class="actions"><button class="copy" data-copy="“The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 5.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+almighty+power%2C+unsearchable+wisdom%2C+and+infinite+goodness+of+God%2C+so+far+manifest+themselves+in+His+providence%2C+that+His+determinate+counsel+extends+itself+even+to+the+first+fall%2C+and+all+other+sinful+actions+both+of+angels+and+men+%28Rom.+11%3A32%E2%80%9334%3B+2+Sam.+24%3A1%3B+1+Chron.+21%3A1%29%3B+and+that+not+by+a+bare+permission%2C+which+also+He+most+wisely+and+powerfully+bounds%2C+and+otherwise+orders+and+governs+%282+Kings+19%3A28%3B+Ps.+76%3A10%29%2C+in+a+manifold+dispensation+to+His+most+holy+ends+%28Gen.+50%3A20%3B+Isa.+10%3A6%E2%80%937%2C+12%29%3B+yet+so%2C+as+the+sinfulness+of+their+acts+proceeds+only+from+the+creatures%2C+and+not+from+God%2C+who%2C+being+most+holy+and+righteous%2C+neither+is+nor+can+be+the+author+or+approver+of+sin+%28Ps.+50%3A21%3B+1+John+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+5.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F86e8b1fd52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/86e8b1fd52.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-5636806dec" data-kw="Sovereignty Author of sin Satan"><blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote><figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 13</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/sovereignty.html">Sovereignty</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.”

— Guido de Brès, Belgic Confession, Art. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+believe+that+the+same+good+God%2C+after+He+had+created+all+things%2C+did+not+forsake+them+or+give+them+up+to+fortune+or+chance%2C+but+that+He+rules+and+governs+them+according+to+His+holy+will%2C+so+that+nothing+happens+in+this+world+without+His+appointment%3B+nevertheless%2C+God+neither+is+the+author+of+nor+can+be+charged+with+the+sins+which+are+committed.+For+His+power+and+goodness+are+so+great+and+incomprehensible+that+He+orders+and+executes+His+work+in+the+most+excellent+and+just+manner%2C+even+then+when+devils+and+wicked+men+act+unjustly.%E2%80%9D%0A%0A%E2%80%94+Guido+de+Br%C3%A8s%2C+Belgic+Confession%2C+Art.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5636806dec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5636806dec.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/belgic-confession" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-9a59ff59bd" data-kw="Reprobation Author of sin Justice"><blockquote><p>And this is the decree of reprobation, which by no means makes God the Author of sin (the very thought of which is blasphemy), but declares Him to be an awful, irreprehensible, and righteous Judge and Avenger thereof.</p></blockquote><figcaption>— <a href="../../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 15</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/god-and-evil.html" aria-current="page">God &amp; Evil</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/reprobation.html">Reprobation</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“And this is the decree of reprobation, which by no means makes God the Author of sin (the very thought of which is blasphemy), but declares Him to be an awful, irreprehensible, and righteous Judge and Avenger thereof.”

— Synod of Dort, The Canons of Dort, Head 1, Art. 15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+this+is+the+decree+of+reprobation%2C+which+by+no+means+makes+God+the+Author+of+sin+%28the+very+thought+of+which+is+blasphemy%29%2C+but+declares+Him+to+be+an+awful%2C+irreprehensible%2C+and+righteous+Judge+and+Avenger+thereof.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+1%2C+Art.+15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a59ff59bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9a59ff59bd.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure></main><footer class="site"><div class="wrap"><p>5 Solas Quotes · 184 quotations · 15 topics · 54 authors</p><p class="small">Quotations are drawn from public-domain works and published translations, cited to their sources.</p></div></footer><script src="../../assets/site.js"></script></body></html>

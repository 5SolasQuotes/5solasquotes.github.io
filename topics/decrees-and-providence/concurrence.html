<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concurrence · 5 Solas Quotes</title><meta name="description" content="Concurrence — Decrees &amp; Providence"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231301"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../decrees-and-providence.html">Decrees &amp; Providence</a> ›</p><h1>Concurrence</h1><p class="sub">19 quotations from 15 authors</p><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin"><blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a></div><div class="actions"><button class="copy" data-copy="“Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Holiness of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+the+natural+virtue+of+doing+a+sinful+action+be+from+God%2C+and+supported+by+him%2C+yet+this+doth+not+blemish+the+holiness+of+God.+While+God+concurs+with+them+in+the+act%2C+he+instills+no+evil+into+men.+%E2%80%A6+The+physical+goodness+of+the+action+depends+on+God%2C+the+moral+evil+on+the+creature.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+The+Existence+and+Attributes+of+God%2C+Discourse+on+the+Holiness+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d08e1330a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8d08e1330a.html">Permalink</a><a class="src" href="https://archive.org/details/discoursesupone02char" target="_blank" rel="noopener">Read it online · Internet Archive, vol. 2</a></div></figure><figure class="quote" id="q-7826d6ff7b" data-kw="Author of sin Temptation"><blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+understanding+this+point%2C+how+the+providence+of+God+reacheth+to+and+is+concerned+in+sinful+actions%2C+we+are+to+consider%2C+that+God+neither+puts+evil+into+the+hearts+of+men%2C+nor+stirs+them+up+to+it%3A+for%2C+says+the+apostle%2C+Jam.+1%3A13.+%27God+cannot+be+tempted+with+evil%3B+neither+tempteth+he+any+man.%27+And+therefore+he+is+not+the+author+of+sin.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7826d6ff7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7826d6ff7b.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin"><blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote><figcaption>— <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.”

— Johannes Wollebius, Compendium of Christian Theology, bk. 1, ch. 6 (providence), canon 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+two+things+are+to+be+considered+in+evil+actions%3A+the+action+itself%2C+and+the+%E1%BC%80%CE%BD%CE%BF%CE%BC%CE%AF%CE%B1+%5Banomia%2C+lawlessness%5D+of+the+action.+The+action+itself%2C+as+a+natural+motion%2C+takes+place+by+the+efficacious+working+of+God%3B+but+the+anomia+or+wickedness+takes+place+by+the+active+permission+of+God.+%E2%80%A6+for+as+in+a+horse+the+cause+of+the+motion+is+one+thing+and+the+cause+of+the+limping+another%2C+so+it+is+one+thing+to+be+the+cause+of+the+action+and+another+to+be+the+cause+of+the+wickedness+cleaving+to+it.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+bk.+1%2C+ch.+6+%28providence%29%2C+canon+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7df9615162.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7df9615162.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin"><blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.5.16</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.”

— Francis Turretin, Institutes of Elenctic Theology, 6.5.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+premotion+of+God+is+extended+to+evil+actions%2C+it+does+not+on+that+account+make+God+guilty+of+the+fault+or+the+author+of+sin.+It+only+pertains+to+actions+inasmuch+as+they+are+material+and+entitative+%28entitative%29%2C+not+however+as+they+are+moral%2C+i.e.%2C+to+the+substance+of+the+act%2C+but+not+to+its+wickedness.+%E2%80%A6+The+magistrate+is+the+cause+of+the+death+inflicted+on+the+guilty+person+by+the+executioner%2C+but+is+not+the+cause+of+the+cruelty+exhibited+in+that+execution%3B+the+harp+player+is+the+cause+of+the+sound%2C+but+not+of+the+dissonance+arising+from+the+strings%3B+and+he+who+drives+a+lame+horse+is+the+cause+of+the+motion%2C+but+not+the+lameness.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+6.5.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F203bb6b5d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/203bb6b5d2.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will"><blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.6.8</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.”

— Francis Turretin, Institutes of Elenctic Theology, 6.6.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+evil+actions%2C+however%2C+he+so+concurs+as+neither+to+effect%2C+assist%2C+nor+approve+of+them%2C+but+to+permit+and+efficaciously+direct%3B+not+by+infusing+wickedness%2C+but+by+so+determining+rational+creatures+physically+to+the+substance+of+the+act+in+the+genus+of+being%2C+that+they+%28when+left+to+themselves+failing+from+the+law%29+move+and+determine+themselves+to+bad+actions+in+the+genus+of+morals%2C+performing+them+freely+and+voluntarily+%28hekousi%C5%8Ds%29.+Hence+the+guilt+rests+upon+them+alone.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+6.6.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbd64be838.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/dbd64be838.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin"><blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.”

— Petrus van Mastricht, Theoretical-Practical Theology, Vol. 3, bk. 3, ch. 10 (Providence), §18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+we+are+able+to+reconcile+them+easily+enough%2C+if+we+distinguish+within+sin+its+material+element%2C+namely%2C+the+habit+or+act+that+is+the+substrate+of+the+wickedness%2C+with+which%2C+inasmuch+as+it+is+physically+good%2C+God+is+not+able+not+to+concur+as+the+efficient+cause%2C+without+casting+aside+his+own+independence+%28Acts+17%3A28%3B+Rom.+11%3A36%29%2C+and+its+formal+element%2C+lawlessness+%281+John+3%3A4%29%2C+through+which+the+act+or+habit+is+sin%2C+whose+author+he+cannot+be%2C+because+the+one+set+above+all+law+cannot+transgress+the+law.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+Vol.+3%2C+bk.+3%2C+ch.+10+%28Providence%29%2C+%C2%A718&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19470c5e06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/19470c5e06.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-5f0eaba27e" data-kw="Author of sin"><blockquote><p>God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §32</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.”

— Petrus van Mastricht, Theoretical-Practical Theology, Vol. 3, bk. 3, ch. 10 (Providence), §32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+by+his+influence+is+indeed+the+principal+cause+of+the+act+itself%2C+but+man+is+the+sole+cause+of+the+sin+itself%2C+which+is+in+that+act.+%E2%80%A6+Nor+can+even+one+theologian+be+shown+who+has+said+that+God+is+the+author+of+lawlessness%2C+or+of+sin+insofar+as+it+is+sin.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+Vol.+3%2C+bk.+3%2C+ch.+10+%28Providence%29%2C+%C2%A732&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f0eaba27e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5f0eaba27e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-7be12b839e" data-kw="Author of sin Justice"><blockquote><p>But we teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.</p></blockquote><figcaption>— <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a>, <cite>Examination of Arminianism</cite>, ch. 2, title 5 (On the Will of God)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“But we teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.”

— Samuel Rutherford, Examination of Arminianism, ch. 2, title 5 (On the Will of God)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+we+teach+that+the+action+of+God+and+of+men+sinning+is+the+same%2C+according+to+material+being%2C+but+not+according+to+moral+being.+%E2%80%A6+But+truly+the+action+of+God+and+of+men+is+not+the+same+according+to+moral+being%3B+because+God+acts+justly+from+all+four+causes%2C+while+he+punishes+the+Church+through+sinning+instruments%3B+but+the+action+of+the+instruments+is+morally+unjust+and+vicious.+%E2%80%A6+But+we+teach+that+God+is+not+the+cause+of+the+malice%2C+although+he+is+the+cause+of+the+act.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Examination+of+Arminianism%2C+ch.+2%2C+title+5+%28On+the+Will+of+God%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7be12b839e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7be12b839e.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin"><blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote><figcaption>— <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a>, <cite>The Doctrine of Absolute Predestination (tr. Augustus Toplady)</cite>, on the omnipotence of God</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.”

— Jerome Zanchi, The Doctrine of Absolute Predestination (tr. Augustus Toplady), on the omnipotence of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+action%2C+as+such%2C+is+undoubtedly+good%2C+it+being+an+actual+exertion+of+those+operative+powers+given+us+by+God+for+that+very+end%3B+God+therefore+may+be+the+Author+of+all+actions+%28as+He+undoubtedly+is%29%2C+and+yet+not+be+the+Author+of+evil.+%E2%80%A6+Suppose+a+boy%2C+who+knows+not+how+to+write%2C+has+his+hand+guided+by+his+master+and+nevertheless+makes+false+letters%2C+quite+unlike+the+copy+set+him%2C+though+his+preceptor%2C+who+guides+his+hand%2C+is+the+cause+of+his+writing+at+all%2C+yet+his+own+ignorance+and+unskilfulness+are+the+cause+of+his+writing+so+badly.+Just+so%2C+God+is+the+supreme+Author+of+our+action%2C+abstractedly+taken%2C+but+our+own+vitiosity+is+the+cause+of+our+acting+amiss.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+The+Doctrine+of+Absolute+Predestination+%28tr.+Augustus+Toplady%29%2C+on+the+omnipotence+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b496daf9c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9b496daf9c.html">Permalink</a><a class="src" href="https://archive.org/details/doctrineofabsolu01zanc" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin Depravity"><blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div><div class="actions"><button class="copy" data-copy="“The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.”

— Stephen Charnock, A Treatise on Divine Providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+power+of+action+is+from+God%2C+but+the+viciousness+of+that+action+from+our+own+nature.+As+when+a+clock+or+watch+hath+some+fault+in+any+of+the+wheels%2C+the+man+that+winds+it+up%2C+or+putting+his+hand+upon+the+wheels+moves+them%2C+he+is+the+cause+of+the+motion%2C+but+it+is+the+flaw+in+it%2C+or+deficiency+of+something%2C+is+the+cause+of+its+erroneous+motion.+%E2%80%A6+Our+motion+is+from+God%2C%E2%80%94Acts+17%3A28%2C+%27In+him+we+move%27%2C%E2%80%94but+not+the+disorder+of+that+motion.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Treatise+on+Divine+Providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4f7b0edf2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f4f7b0edf2.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1641-1700_a-treatise-of-divine-pro_charnock-stephen_1680" target="_blank" rel="noopener">Read it online · Internet Archive (1680 ed.)</a></div></figure><figure class="quote" id="q-858e5287fa" data-kw="Author of sin"><blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote><figcaption>— <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 27 (on providence)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+fallacy+of+the+accident+in+the+minor+proportion%3B+for+the+actions+of+the+wicked+are+sins%2C+not+%28per+se%29+in+themselves%2C+in+as+far+as+they+are+actions%3B+but+by+an+accident+on+account+of+the+want+of+righteousness%2C+and+of+the+perversity+of+the+will+of+the+ungodly%2C+who+do+not+observe+this+so+as+to+follow+in+the+action+the+will+of+God.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+27+%28on+providence%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F858e5287fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/858e5287fa.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin"><blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote><figcaption>— <a href="../../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.”

— John Gill, A Body of Doctrinal Divinity, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+influences+of+divine+providence+concur+with+every+action%2C+be+it+what+it+may%2C+as+an+action%2C+since+all+live%2C+and+move%2C+and+have+their+being+in+God%3B+every+action%2C+as+an+action%2C+is+from+God%3B+but+the+obliquity%2C+irregularity%2C+and+sinfulness+of+the+action%2C+is+from+the+creature%3A+wherefore+God+is+not+the+author+of+any+sin.%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+A+Body+of+Doctrinal+Divinity%2C+bk.+3%2C+ch.+8+%28Of+the+Sin+and+Fall+of+Our+First+Parents%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb4af681b72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b4af681b72.html">Permalink</a><a class="src" href="https://ccel.org/ccel/gill/doctrinal" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-f87d7ae16e" data-kw="Permission Author of sin"><blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+pravity+or+sin+that+is+in+actions%2C+as+God+decreed+the+futurition+of+sin%2C+or+permitted+it+to+take+place%2C+and+did+not+hinder+it%3B+so+all+the+sin+or+vitiosity+that+is+in+actions+proceeds+entirely+from+the+creature%2C+and+the+evil+lusts+and+passions+that+are+in+his+heart.+Thus+a+man%27s+taking+up+a+stone%2C+and+throwing+it%2C+is+a+natural+action%2C+which+the+providence+of+God+enables+him+to+perform%3B+but+his+throwing+it+at+another+man+with+an+intention+to+kill+him%2C+is+permitted+by+God%2C+otherwise+it+could+not+take+place.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff87d7ae16e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f87d7ae16e.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-8520e28d8b" data-kw="Author of sin Free Will"><blockquote><p>As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>Freedom of the Will</cite>, pt. 4, sec. 9</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.”

— Jonathan Edwards, Freedom of the Will, pt. 4, sec. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+there+is+a+vast+difference+between+the+sun+being+the+cause+of+the+lightsomeness+and+warmth+of+the+atmosphere%2C+and+the+brightness+of+gold+and+diamonds%2C+by+its+presence+and+positive+influence%3B+and+its+being+the+occasion+of+darkness+and+frost%2C+in+the+night%2C+by+its+motion%2C+whereby+it+descends+below+the+horizon.+The+motion+of+the+sun+is+the+occasion+of+the+latter+kind+of+events%3B+but+it+is+not+the+proper+cause%2C+efficient%2C+or+producer+of+them%3B+though+they+are+necessarily+consequent+on+that+motion%2C+under+such+circumstances%3A+no+more+is+any+action+of+the+Divine+Being+the+cause+of+the+evil+of+men%27s+Wills.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+Freedom+of+the+Will%2C+pt.+4%2C+sec.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8520e28d8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8520e28d8b.html">Permalink</a><a class="src" href="https://ccel.org/ccel/edwards/will" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin Free Will"><blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote><figcaption>— <a href="../../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, on the Cause of Sin, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.”

— William Ames, Bellarmine Disarmed, on the Cause of Sin, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+who+uses+as+an+instrument+a+man+freely+failing%2C+to+effect+what+is+good%2C+is+not+the+author+of+the+failure.+%E2%80%A6+The+wicked%2C+while+they+sin%2C+are+not+properly+instruments+of+God+moved%2C+that+is+to+say%2C+without+an+internal+principle+of+motion%2C+but+metaphorically%2C+moved+in+such+a+way+that+they+freely+move+themselves.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+on+the+Cause+of+Sin%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faee029b880.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/aee029b880.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-7c4873cbdb" data-kw="Satan Justice"><blockquote><p>We thus see that there is no inconsistency in attributing the same act to God, to Satan, and to man, while, from the difference in the end and mode of action, the spotless righteousness of God shines forth at the same time that the iniquity of Satan and of man is manifested in all its deformity.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.4.2</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“We thus see that there is no inconsistency in attributing the same act to God, to Satan, and to man, while, from the difference in the end and mode of action, the spotless righteousness of God shines forth at the same time that the iniquity of Satan and of man is manifested in all its deformity.”

— John Calvin, Institutes of the Christian Religion, 2.4.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+thus+see+that+there+is+no+inconsistency+in+attributing+the+same+act+to+God%2C+to+Satan%2C+and+to+man%2C+while%2C+from+the+difference+in+the+end+and+mode+of+action%2C+the+spotless+righteousness+of+God+shines+forth+at+the+same+time+that+the+iniquity+of+Satan+and+of+man+is+manifested+in+all+its+deformity.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.4.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c4873cbdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c4873cbdb.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin The Fall Permission"><blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote><figcaption>— <a href="../../authors/herman-witsius.html">Herman Witsius</a>, <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</figcaption><div class="meta"><a class="tag here" href="../../topics/decrees-and-providence/concurrence.html" aria-current="page">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a></div><div class="actions"><button class="copy" data-copy="“To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.”

age">Concurrence</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).”

><button class="copy" data-copy="“God does not infuse malice into the wills of evil men, as He infuses goodness into the hearts of the godly.—In one and the same work of the godly what is a good and just action proper to God is to be distinguished from the defect and vice of the ungodly. The sin of the wicked is their own; their doing this or that by sinning is of God’s power,—and so in the same work God is ascertained to be righteous, man to be guilty.”

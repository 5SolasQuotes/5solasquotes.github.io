</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary Mediator Invocation of saints Idolatry">

<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption>— <a href="../../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, Second Commandment, p. 96</figcaption>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption>— <a href="../../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, p. 197</figcaption>

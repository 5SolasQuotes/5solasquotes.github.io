<blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote>
<figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.13</figcaption>

<blockquote><p>And in the first place I say that the deity which the Papists worship, under that highest and most glorious name of God, is imaginary and fictitious. For it is agreed among all that the true God is supremely and perfectly just and merciful. But neither is that justice perfect which rests in human satisfactions, nor is that mercy perfect which only supplies what is lacking to the merits of men. Let the Papists go, then, and boast that they worship the true God.</p></blockquote>

<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</figcaption>

</figure><figure class="quote" id="q-16ec124bdb" data-kw="">
<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</figcaption>

<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>

<blockquote><p>They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.</p></blockquote>
<figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 10</figcaption>

</figure><figure class="quote" id="q-5444a34f69" data-kw="">
<blockquote><p>So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 24</figcaption>

</figure><figure class="quote" id="q-76f840e0cf" data-kw="">
<blockquote><p>We cannot by our best works merit pardon of sin or eternal life at the hand of God, by reason of the great disproportion that is between them and the glory to come, and the infinite distance that is between us and God, whom by them we can neither profit nor satisfy for the debt of our former sins; but when we have done all we can, we have done but our duty, and are unprofitable servants (Rom. 3:20; Eph. 2:8–9; Rom. 4:6).</p></blockquote>
<figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 16.5</figcaption>

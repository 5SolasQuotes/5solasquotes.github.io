<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>

</figure><figure class="quote" id="q-bf384d238d" data-kw="">
<blockquote><p>There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.</p></blockquote>

</figure><figure class="quote" id="q-485a9633bd" data-kw="">
<blockquote><p>Do the sacraments of the New Testament work grace so physically that they effect and contain it ex opere operato, whether faith and devotion are present or not? Or are they rather efficacious signs and seals of grace? The former we deny; the latter we affirm against the Romanists.</p></blockquote>
<figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, Topic 19, Q. 8, §§ 1–6</figcaption>

</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption>— <a href="../../authors/a-a-hodge.html">A. A. Hodge</a>, <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</figcaption>

</figure><figure class="quote" id="q-0286a9a64d" data-kw="">
<blockquote><p>While the grace of God generally operates mediately, it is not inherent in the means as a divine deposit, but accompanies the use of these. This must be maintained in opposition to the Roman Catholics, the High Church Anglicans, and the Lutherans, who proceed on the assumption that the means of grace always operate in virtue of an inherent power, though their operation may be made ineffective by the condition or attitude of the recipient. Protestants, on the other hand, teach that the sacraments are not absolutely necessary unto salvation, but are obligatory in view of the divine precept.… That they are not absolutely necessary unto salvation, follows… from the fact that Scripture mentions only faith as the instrumental condition of salvation… and from the fact that the sacraments do not originate faith but presuppose it…</p></blockquote>
<figcaption>— <a href="../../authors/louis-berkhof.html">Louis Berkhof</a>, <cite>Systematic Theology</cite>, Means of Grace; Necessity of the Sacraments</figcaption>

</figure><figure class="quote" id="q-70fbe0dd05" data-kw="">
<blockquote><p>The schools of the Sophists have taught with remarkable agreement that the sacraments of the new law (those now used in the Christian church) justify and confer grace, provided we do not set up a barrier of mortal sin. How deadly and pestilential this notion is cannot be expressed — and the more so because for many centuries it has been a current claim in a good part of the world, to the great loss of the church. Of a certainty it is diabolical. For in promising a righteousness apart from faith, it hurls souls headlong to destruction… Hence, any man is deceived who thinks anything more is conferred upon him through the sacraments than what is offered by God’s Word and received by him in true faith. From this something else follows: assurance of salvation does not depend upon participation in the sacrament, as if justification consisted in it. For we know that justification is lodged in Christ alone, and that it is communicated to us no less by the preaching of the gospel than by the seal of the sacrament, and without the latter can stand unimpaired.</p></blockquote>
<figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.14.14</figcaption>

</figure><figure class="quote" id="q-42023b3dec" data-kw="">
<blockquote><p>It were a greater work to illustrate these great mysteries as they deserve, and I am unwilling to meddle with their obscene impurities, which are daily before the eyes and faces of all, that it may be understood that the mass, taken in the most choice form in which it can be exhibited, without any appendages, teems from head to foot with all kinds of impiety, blasphemy, idolatry, and sacrilege.</p></blockquote>

</figure><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</figcaption>

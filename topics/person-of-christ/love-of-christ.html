<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love of Christ · 5 Solas Quotes</title><meta name="description" content="Love of Christ — The Person of Christ"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../person-of-christ.html">The Person of Christ</a> ›</p><h1>Love of Christ</h1><p class="sub">3 quotations from 2 authors</p><figure class="quote" id="q-978f8c9d05" data-kw=""><blockquote><p>We are knit to him both by consanguinity and by affinity. The nearest affinity is marriage, and the nearest consanguinity is sister. So that there are all bonds to knit us to Christ. Whatsoever is strong in any bond, he knits us to him by it. Is there any love in an husband, a brother, a mother, a friend, in an head to the members? in anything in the world? Is there any love scattered in any relation, gather it all into one, and all that love, and a thousand times more than that, is in Christ in a more eminent manner.</p></blockquote><figcaption>— <a href="../../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon VI (Song 5:2, “My sister”)</figcaption><div class="meta"><a class="tag here" href="../../topics/person-of-christ/love-of-christ.html" aria-current="page">Love of Christ</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a></div><div class="actions"><button class="copy" data-copy="“We are knit to him both by consanguinity and by affinity. The nearest affinity is marriage, and the nearest consanguinity is sister. So that there are all bonds to knit us to Christ. Whatsoever is strong in any bond, he knits us to him by it. Is there any love in an husband, a brother, a mother, a friend, in an head to the members? in anything in the world? Is there any love scattered in any relation, gather it all into one, and all that love, and a thousand times more than that, is in Christ in a more eminent manner.”

— Richard Sibbes, Union with Christ (Bowels Opened), Sermon VI (Song 5:2, “My sister”)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+knit+to+him+both+by+consanguinity+and+by+affinity.+The+nearest+affinity+is+marriage%2C+and+the+nearest+consanguinity+is+sister.+So+that+there+are+all+bonds+to+knit+us+to+Christ.+Whatsoever+is+strong+in+any+bond%2C+he+knits+us+to+him+by+it.+Is+there+any+love+in+an+husband%2C+a+brother%2C+a+mother%2C+a+friend%2C+in+an+head+to+the+members%3F+in+anything+in+the+world%3F+Is+there+any+love+scattered+in+any+relation%2C+gather+it+all+into+one%2C+and+all+that+love%2C+and+a+thousand+times+more+than+that%2C+is+in+Christ+in+a+more+eminent+manner.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+Union+with+Christ+%28Bowels+Opened%29%2C+Sermon+VI+%28Song+5%3A2%2C+%E2%80%9CMy+sister%E2%80%9D%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F978f8c9d05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/978f8c9d05.html">Permalink</a><a class="src" href="https://archive.org/details/bowedi00sibb" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-ca4e6df0b2" data-kw="Communion"><blockquote><p>Christ gives himself to the soul, with all his excellencies, righteousness, preciousness, graces, and eminencies, to be its Saviour, head, and husband, for ever to dwell with it in this holy relation. He looks upon the souls of his saints, likes them well, counts them fair and beautiful, because he has made them so.</p></blockquote><figcaption>— <a href="../../authors/john-owen.html">John Owen</a>, <cite>Communion with God</cite>, Part 2, ch. 3, “He Gives Himself to Us”</figcaption><div class="meta"><a class="tag here" href="../../topics/person-of-christ/love-of-christ.html" aria-current="page">Love of Christ</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a></div><div class="actions"><button class="copy" data-copy="“Christ gives himself to the soul, with all his excellencies, righteousness, preciousness, graces, and eminencies, to be its Saviour, head, and husband, for ever to dwell with it in this holy relation. He looks upon the souls of his saints, likes them well, counts them fair and beautiful, because he has made them so.”

— John Owen, Communion with God, Part 2, ch. 3, “He Gives Himself to Us”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+gives+himself+to+the+soul%2C+with+all+his+excellencies%2C+righteousness%2C+preciousness%2C+graces%2C+and+eminencies%2C+to+be+its+Saviour%2C+head%2C+and+husband%2C+for+ever+to+dwell+with+it+in+this+holy+relation.+He+looks+upon+the+souls+of+his+saints%2C+likes+them+well%2C+counts+them+fair+and+beautiful%2C+because+he+has+made+them+so.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Communion+with+God%2C+Part+2%2C+ch.+3%2C+%E2%80%9CHe+Gives+Himself+to+Us%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca4e6df0b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ca4e6df0b2.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/communion" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-33e3a0f80d" data-kw="Communion"><blockquote><p>Christ hath never enough of the soul. He would have them more and more open to him. Our hearts are for Christ, who hath the heaven of heavens, and the soul of a believing Christian for himself to dwell in. He contents not himself to be in heaven alone, but he will have our hearts.</p></blockquote><figcaption>— <a href="../../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon V (Song 5:2)</figcaption><div class="meta"><a class="tag here" href="../../topics/person-of-christ/love-of-christ.html" aria-current="page">Love of Christ</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a></div><div class="actions"><button class="copy" data-copy="“Christ hath never enough of the soul. He would have them more and more open to him. Our hearts are for Christ, who hath the heaven of heavens, and the soul of a believing Christian for himself to dwell in. He contents not himself to be in heaven alone, but he will have our hearts.”

<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sovereignty · 5 Solas Quotes</title><meta name="description" content="Sovereignty — God"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231258"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../god.html">God</a> ›</p><h1>Sovereignty</h1><p class="sub">6 quotations from 5 authors</p><figure class="quote" id="q-8a099d7ada" data-kw="Sovereignty Free Will"><blockquote><p>God brings about every man&#x27;s lot, and all the parts of it. He sits at the helm of human affairs, and turns them about in whatever way he lists. &quot;Whatever the Lord pleased, that He did in heaven and in earth, in the seas and all deep places.&quot; There is not anything whatever befalls us without his overruling hand. The same providence that brought us out of the womb, brings us to, and fixes us in the condition and place allotted for us, by him who &quot;has determined the times and the bounds of our habitation.&quot; It overrules the smallest and most casual things about us, such as &quot;hairs of our head being all numbered;&quot; a &quot;lot cast into the lap.&quot; Yea, the free acts of our will, by which we choose for ourselves: for even &quot;the king&#x27;s heart is in the hand of the Lord, as rivers of water.&quot;</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>The Crook in the Lot</cite>, Doct. I, head II (the crook is of God&#x27;s making)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/sovereignty.html" aria-current="page">Sovereignty</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div><div class="actions"><button class="copy" data-copy="“God brings about every man&#x27;s lot, and all the parts of it. He sits at the helm of human affairs, and turns them about in whatever way he lists. &quot;Whatever the Lord pleased, that He did in heaven and in earth, in the seas and all deep places.&quot; There is not anything whatever befalls us without his overruling hand. The same providence that brought us out of the womb, brings us to, and fixes us in the condition and place allotted for us, by him who &quot;has determined the times and the bounds of our habitation.&quot; It overrules the smallest and most casual things about us, such as &quot;hairs of our head being all numbered;&quot; a &quot;lot cast into the lap.&quot; Yea, the free acts of our will, by which we choose for ourselves: for even &quot;the king&#x27;s heart is in the hand of the Lord, as rivers of water.&quot;”

— Thomas Boston, The Crook in the Lot, Doct. I, head II (the crook is of God&#x27;s making)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+brings+about+every+man%27s+lot%2C+and+all+the+parts+of+it.+He+sits+at+the+helm+of+human+affairs%2C+and+turns+them+about+in+whatever+way+he+lists.+%22Whatever+the+Lord+pleased%2C+that+He+did+in+heaven+and+in+earth%2C+in+the+seas+and+all+deep+places.%22+There+is+not+anything+whatever+befalls+us+without+his+overruling+hand.+The+same+providence+that+brought+us+out+of+the+womb%2C+brings+us+to%2C+and+fixes+us+in+the+condition+and+place+allotted+for+us%2C+by+him+who+%22has+determined+the+times+and+the+bounds+of+our+habitation.%22+It+overrules+the+smallest+and+most+casual+things+about+us%2C+such+as+%22hairs+of+our+head+being+all+numbered%3B%22+a+%22lot+cast+into+the+lap.%22+Yea%2C+the+free+acts+of+our+will%2C+by+which+we+choose+for+ourselves%3A+for+even+%22the+king%27s+heart+is+in+the+hand+of+the+Lord%2C+as+rivers+of+water.%22%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Crook+in+the+Lot%2C+Doct.+I%2C+head+II+%28the+crook+is+of+God%27s+making%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a099d7ada.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8a099d7ada.html">Permalink</a><a class="src" href="https://ccel.org/ccel/boston/crook" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-2ebb74f215" data-kw="Sovereignty"><blockquote><p>Nothing befalls you, good or evil, but there is a providence of the infinite eternal first Being in that thing; and therein is God&#x27;s infiniteness, that it reaches to the least things, to the least worm that is under your feet.</p></blockquote><figcaption>— <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a>, <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (universality of providence)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/sovereignty.html" aria-current="page">Sovereignty</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“Nothing befalls you, good or evil, but there is a providence of the infinite eternal first Being in that thing; and therein is God&#x27;s infiniteness, that it reaches to the least things, to the least worm that is under your feet.”

— Jeremiah Burroughs, The Rare Jewel of Christian Contentment, ch. 3, Lesson 9 (universality of providence)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNothing+befalls+you%2C+good+or+evil%2C+but+there+is+a+providence+of+the+infinite+eternal+first+Being+in+that+thing%3B+and+therein+is+God%27s+infiniteness%2C+that+it+reaches+to+the+least+things%2C+to+the+least+worm+that+is+under+your+feet.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+The+Rare+Jewel+of+Christian+Contentment%2C+ch.+3%2C+Lesson+9+%28universality+of+providence%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ebb74f215.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2ebb74f215.html">Permalink</a><a class="src" href="https://archive.org/details/rarejewelchrist00burrgoog" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-90b2694bf6" data-kw="Sovereignty Satan"><blockquote><p>The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.</p></blockquote><figcaption>— <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>The Sovereignty of God</cite>, ch. 3, “Sovereignty of God in Administration”</figcaption><div class="meta"><a class="tag here" href="../../topics/god/sovereignty.html" aria-current="page">Sovereignty</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.”

— Arthur W. Pink, The Sovereignty of God, ch. 3, “Sovereignty of God in Administration”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lord+God+omnipotent+reigneth.+His+government+is+exercised+over+inanimate+matter%2C+over+the+brute+beasts%2C+over+the+children+of+men%2C+over+angels+good+and+evil%2C+and+over+Satan+himself.+No+revolving+world%2C+no+shining+of+star%2C+no+storm%2C+no+creature+moves%2C+no+actions+of+men%2C+no+errands+of+angels%2C+no+deeds+of+Devil%E2%80%94nothing+in+all+the+vast+universe+can+come+to+pass+otherwise+than+God+has+eternally+purposed.+Here+is+a+foundation+of+faith.+Here+is+a+resting+place+for+the+intellect.+Here+is+an+anchor+for+the+soul%2C+both+sure+and+steadfast.+It+is+not+blind+fate%2C+unbridled+evil%2C+man+or+Devil%2C+but+the+Lord+Almighty+who+is+ruling+the+world%2C+ruling+it+according+to+His+own+good+pleasure+and+for+His+own+eternal+glory.%E2%80%9D%0A%0A%E2%80%94+Arthur+W.+Pink%2C+The+Sovereignty+of+God%2C+ch.+3%2C+%E2%80%9CSovereignty+of+God+in+Administration%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F90b2694bf6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/90b2694bf6.html">Permalink</a><a class="src" href="https://ccel.org/ccel/pink/sovereignty" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-9c2ff7740d" data-kw="Sovereignty Wisdom Comfort"><blockquote><p>But our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote><figcaption>— <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>The Sovereignty of God</cite>, ch. 12, “The Value of This Doctrine” (6. It supplies comfort in sorrow)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/sovereignty.html" aria-current="page">Sovereignty</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/wisdom.html">Wisdom</a></div><div class="actions"><button class="copy" data-copy="“But our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!”

— Arthur W. Pink, The Sovereignty of God, ch. 12, “The Value of This Doctrine” (6. It supplies comfort in sorrow)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+our+God+is+not+only+infinite+in+power.+He+is+infinite+in+wisdom+and+goodness+too.+And+herein+is+the+preciousness+of+this+truth.+God+wills+only+that+which+is+good+and+His+will+is+irreversible+and+irresistible%21+God+is+too+wise+to+err+and+too+loving+to+cause+His+child+a+needless+tear.+Therefore+if+God+be+perfect+wisdom+and+perfect+goodness+how+blessed+is+the+assurance+that+everything+is+in+His+hand+and+molded+by+His+will+according+to+His+eternal+purpose%21%E2%80%9D%0A%0A%E2%80%94+Arthur+W.+Pink%2C+The+Sovereignty+of+God%2C+ch.+12%2C+%E2%80%9CThe+Value+of+This+Doctrine%E2%80%9D+%286.+It+supplies+comfort+in+sorrow%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c2ff7740d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9c2ff7740d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/pink/sovereignty" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-5636806dec" data-kw="Sovereignty Author of sin Satan"><blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote><figcaption>— <a href="../../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 13</figcaption><div class="meta"><a class="tag here" href="../../topics/god/sovereignty.html" aria-current="page">Sovereignty</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div><div class="actions"><button class="copy" data-copy="“We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.”

— Guido de Brès, Belgic Confession, Art. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+believe+that+the+same+good+God%2C+after+He+had+created+all+things%2C+did+not+forsake+them+or+give+them+up+to+fortune+or+chance%2C+but+that+He+rules+and+governs+them+according+to+His+holy+will%2C+so+that+nothing+happens+in+this+world+without+His+appointment%3B+nevertheless%2C+God+neither+is+the+author+of+nor+can+be+charged+with+the+sins+which+are+committed.+For+His+power+and+goodness+are+so+great+and+incomprehensible+that+He+orders+and+executes+His+work+in+the+most+excellent+and+just+manner%2C+even+then+when+devils+and+wicked+men+act+unjustly.%E2%80%9D%0A%0A%E2%80%94+Guido+de+Br%C3%A8s%2C+Belgic+Confession%2C+Art.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5636806dec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5636806dec.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/belgic-confession" target="_blank" rel="noopener">Read it online · CRCNA</a></div></figure><figure class="quote" id="q-6f567a20fa" data-kw="Sovereignty"><blockquote><p>Here, speculative theologian, the discussion is not about the will of good pleasure, of which it is written, &#x27;Whatsoever the Lord pleased, that did he in heaven and in earth,&#x27; and that &#x27;no one can resist his will.&#x27; That is plain, because we see that not all men come to the knowledge of the truth. Rather, the discussion is about the will of sign, by which God sets before all men the precepts of salvation and the doctrine of the Gospel. It is charged against those who refuse to come to the knowledge of the truth and refuse to be saved, of which it is written, &#x27;How often would I have gathered thy children, and ye would not.&#x27;</p></blockquote><p class="mnote">Marginal note: “God wills all men to be saved by the will of sign, not by the will of good pleasure.”</p><figcaption>— <a href="../../authors/thomas-de-vio-cajetan.html">Thomas de Vio Cajetan</a>, <cite>In omnes D. Pauli et aliorum Apostolorum Epistolas Commentarii</cite>, on 1 Tim. 2:4 (Opera omnia, vol. 5, p. 295, col. 1)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/sovereignty.html" aria-current="page">Sovereignty</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a></div><div class="actions"><button class="copy" data-copy="“Here, speculative theologian, the discussion is not about the will of good pleasure, of which it is written, &#x27;Whatsoever the Lord pleased, that did he in heaven and in earth,&#x27; and that &#x27;no one can resist his will.&#x27; That is plain, because we see that not all men come to the knowledge of the truth. Rather, the discussion is about the will of sign, by which God sets before all men the precepts of salvation and the doctrine of the Gospel. It is charged against those who refuse to come to the knowledge of the truth and refuse to be saved, of which it is written, &#x27;How often would I have gathered thy children, and ye would not.&#x27;”

— Thomas de Vio Cajetan, In omnes D. Pauli et aliorum Apostolorum Epistolas Commentarii, on 1 Tim. 2:4 (Opera omnia, vol. 5, p. 295, col. 1)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere%2C+speculative+theologian%2C+the+discussion+is+not+about+the+will+of+good+pleasure%2C+of+which+it+is+written%2C+%27Whatsoever+the+Lord+pleased%2C+that+did+he+in+heaven+and+in+earth%2C%27+and+that+%27no+one+can+resist+his+will.%27+That+is+plain%2C+because+we+see+that+not+all+men+come+to+the+knowledge+of+the+truth.+Rather%2C+the+discussion+is+about+the+will+of+sign%2C+by+which+God+sets+before+all+men+the+precepts+of+salvation+and+the+doctrine+of+the+Gospel.+It+is+charged+against+those+who+refuse+to+come+to+the+knowledge+of+the+truth+and+refuse+to+be+saved%2C+of+which+it+is+written%2C+%27How+often+would+I+have+gathered+thy+children%2C+and+ye+would+not.%27%E2%80%9D%0A%0A%E2%80%94+Thomas+de+Vio+Cajetan%2C+In+omnes+D.+Pauli+et+aliorum+Apostolorum+Epistolas+Commentarii%2C+on+1+Tim.+2%3A4+%28Opera+omnia%2C+vol.+5%2C+p.+295%2C+col.+1%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f567a20fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6f567a20fa.html">Permalink</a><a class="src" href="https://archive.org/details/bub_gb_4K58QlDliSYC/page/n302/mode/1up" target="_blank" rel="noopener">Read it online · Internet Archive (1639 ed.)</a></div></figure></main><footer class="site"><div class="wrap"><p>5 Solas Quotes · 185 quotations · 15 topics · 55 authors</p><p class="small"><a href="../../links.html">Follow</a> · <a href="../../about.html">About</a></p><p class="small">Quotations are drawn from public-domain works and published translations, cited to their sources.</p></div></footer><script src="../../assets/site.js?v=202610231258"></script></body></html>

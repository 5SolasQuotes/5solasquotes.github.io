<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holiness · 5 Solas Quotes</title><meta name="description" content="Holiness — God"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../god.html">God</a> ›</p><h1>Holiness</h1><p class="sub">6 quotations from 5 authors</p><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin"><blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption><div class="meta"><a class="tag here" href="../../topics/god/holiness.html" aria-current="page">Holiness</a><a class="tag" href="../../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div><div class="actions"><button class="copy" data-copy="“Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Holiness of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+the+natural+virtue+of+doing+a+sinful+action+be+from+God%2C+and+supported+by+him%2C+yet+this+doth+not+blemish+the+holiness+of+God.+While+God+concurs+with+them+in+the+act%2C+he+instills+no+evil+into+men.+%E2%80%A6+The+physical+goodness+of+the+action+depends+on+God%2C+the+moral+evil+on+the+creature.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+The+Existence+and+Attributes+of+God%2C+Discourse+on+the+Holiness+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d08e1330a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8d08e1330a.html">Permalink</a><a class="src" href="https://archive.org/details/discoursesupone02char" target="_blank" rel="noopener">Read it online · Internet Archive, vol. 2</a></div></figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice"><blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</figcaption><div class="meta"><a class="tag here" href="../../topics/god/holiness.html" aria-current="page">Holiness</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/justice.html">Justice</a></div><div class="actions"><button class="copy" data-copy="“However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on original sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+this+is+certain%2C+that+God+doth+not+infuse+it.+Souls+receive+neither+purity+nor+impurity+from+him%2C+but+only+their+naked+essence%2C+and+the+natural+powers+and+properties+flowing+therefrom.+He+doth+not+infuse+any+impurity+into+men%3B+for+he+cannot+be+the+author+of+sin%2C+who+is+the+revenger+of+it.+%E2%80%A6+As+a+pure+and+holy+God%2C+he+cannot+infuse+any+impurity+into+the+souls+of+men%3B+and+as+a+just+and+righteous+God%2C+he+may+and+doth+withhold+from%2C+or+create+them+void+and+destitute+of%2C+that+holiness+and+righteousness+which+was+once+their+happiness+and+glory.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+original+sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac2cd3cfb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ac2cd3cfb9.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall"><blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote><figcaption>— <a href="../../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 5.4</figcaption><div class="meta"><a class="tag here" href="../../topics/god/holiness.html" aria-current="page">Holiness</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a></div><div class="actions"><button class="copy" data-copy="“The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).”

— Particular Baptists, Second London Baptist Confession of Faith (1689), 5.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+almighty+power%2C+unsearchable+wisdom%2C+and+infinite+goodness+of+God%2C+so+far+manifest+themselves+in+His+providence%2C+that+His+determinate+counsel+extends+itself+even+to+the+first+fall%2C+and+all+other+sinful+actions+both+of+angels+and+men+%28Rom.+11%3A32%E2%80%9334%3B+2+Sam.+24%3A1%3B+1+Chron.+21%3A1%29%3B+and+that+not+by+a+bare+permission%2C+which+also+He+most+wisely+and+powerfully+bounds%2C+and+otherwise+orders+and+governs+%282+Kings+19%3A28%3B+Ps.+76%3A10%29%2C+in+a+manifold+dispensation+to+His+most+holy+ends+%28Gen.+50%3A20%3B+Isa.+10%3A6%E2%80%937%2C+12%29%3B+yet+so%2C+as+the+sinfulness+of+their+acts+proceeds+only+from+the+creatures%2C+and+not+from+God%2C+who%2C+being+most+holy+and+righteous%2C+neither+is+nor+can+be+the+author+or+approver+of+sin+%28Ps.+50%3A21%3B+1+John+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith+%281689%29%2C+5.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F86e8b1fd52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/86e8b1fd52.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" target="_blank" rel="noopener">Read it online · Founders Ministries</a></div></figure><figure class="quote" id="q-56cfa7cd20" data-kw="Holiness"><blockquote><p>Since the precept about not coveting is general, it ought to be extended to all depraved and inordinate concupiscence, original and habitual as well as actual—whether this is determinate and voluntary or still indeterminate and only titillating. This is true in order that the perfect purity and holiness of the lawgiver may be noted (which will suffer not even the smallest taint of depraved concupiscence in man, but demands righteousness and holiness of every kind).</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 11.21.3</figcaption><div class="meta"><a class="tag here" href="../../topics/god/holiness.html" aria-current="page">Holiness</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“Since the precept about not coveting is general, it ought to be extended to all depraved and inordinate concupiscence, original and habitual as well as actual—whether this is determinate and voluntary or still indeterminate and only titillating. This is true in order that the perfect purity and holiness of the lawgiver may be noted (which will suffer not even the smallest taint of depraved concupiscence in man, but demands righteousness and holiness of every kind).”

— Francis Turretin, Institutes of Elenctic Theology, 11.21.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSince+the+precept+about+not+coveting+is+general%2C+it+ought+to+be+extended+to+all+depraved+and+inordinate+concupiscence%2C+original+and+habitual+as+well+as+actual%E2%80%94whether+this+is+determinate+and+voluntary+or+still+indeterminate+and+only+titillating.+This+is+true+in+order+that+the+perfect+purity+and+holiness+of+the+lawgiver+may+be+noted+%28which+will+suffer+not+even+the+smallest+taint+of+depraved+concupiscence+in+man%2C+but+demands+righteousness+and+holiness+of+every+kind%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+11.21.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56cfa7cd20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/56cfa7cd20.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-634fea95c0" data-kw="Holiness"><blockquote><p>Observe the holiness and perfection of God&#x27;s law, which forbids the first motions and risings of sin in the heart. The laws of men take hold of actions; but the law of God goes further—it forbids not only sinful actions—but sinful desires.</p></blockquote><figcaption>— <a href="../../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, The Tenth Commandment</figcaption><div class="meta"><a class="tag here" href="../../topics/god/holiness.html" aria-current="page">Holiness</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“Observe the holiness and perfection of God&#x27;s law, which forbids the first motions and risings of sin in the heart. The laws of men take hold of actions; but the law of God goes further—it forbids not only sinful actions—but sinful desires.”

— Thomas Watson, The Ten Commandments, The Tenth Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObserve+the+holiness+and+perfection+of+God%27s+law%2C+which+forbids+the+first+motions+and+risings+of+sin+in+the+heart.+The+laws+of+men+take+hold+of+actions%3B+but+the+law+of+God+goes+further%E2%80%94it+forbids+not+only+sinful+actions%E2%80%94but+sinful+desires.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+The+Tenth+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F634fea95c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/634fea95c0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-e97ffcf9d4" data-kw="Holiness"><blockquote><p>Such motions are not consistent with the holiness and purity which God demands from us and the required perfection of loving God with the whole heart and all the strength; therefore they cannot but be depraved and lawless (anomoi).</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 11.21.11</figcaption><div class="meta"><a class="tag here" href="../../topics/god/holiness.html" aria-current="page">Holiness</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“Such motions are not consistent with the holiness and purity which God demands from us and the required perfection of loving God with the whole heart and all the strength; therefore they cannot but be depraved and lawless (anomoi).”

— Francis Turretin, Institutes of Elenctic Theology, 11.21.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSuch+motions+are+not+consistent+with+the+holiness+and+purity+which+God+demands+from+us+and+the+required+perfection+of+loving+God+with+the+whole+heart+and+all+the+strength%3B+therefore+they+cannot+but+be+depraved+and+lawless+%28anomoi%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+11.21.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe97ffcf9d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e97ffcf9d4.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure></main><footer class="site"><div class="wrap"><p>5 Solas Quotes · 185 quotations · 15 topics · 55 authors</p><p class="small"><a href="../../links.html">Follow</a> · <a href="../../about.html">About</a></p><p class="small">Quotations are drawn from public-domain works and published translations, cited to their sources.</p></div></footer><script src="../../assets/site.js"></script></body></html>

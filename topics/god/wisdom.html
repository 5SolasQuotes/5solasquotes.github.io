<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisdom · 5 Solas Quotes</title><meta name="description" content="Wisdom — God"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../god.html">God</a> ›</p><h1>Wisdom</h1><p class="sub">7 quotations from 6 authors</p><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom"><blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/god/wisdom.html" aria-current="page">Wisdom</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.”

— Stephen Charnock, A Treatise on Divine Providence, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWho+can+trace+the+motions+of+God%27s+eyes+in+their+race%3F+%27He+makes+the+clouds+his+chariot%2C%27+Ps.+104%3A3%2C+in+his+motions+about+the+earth%2C+and+his+throne+is+in+the+dark.+He+walks+upon+the+wings+of+the+wind%2C+his+providential+speed+makes+it+too+quick+for+our+understanding.+His+ways+are+mysterious%2C+and+put+the+reason+and+wisdom+of+men+to+a+stand.+The+clearest-sighted+servants+of+God+do+not+see+the+bottom+of+his+works%2C+the+motion+of+God%27s+eyes+is+too+quick+for+ours.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Treatise+on+Divine+Providence%2C+Discourse+on+2+Chron.+16%3A9%2C+Doct.+1%2C+Prop.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8fb05937d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8fb05937d5.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1641-1700_a-treatise-of-divine-pro_charnock-stephen_1680" target="_blank" rel="noopener">Read it online · Internet Archive (1680 ed.)</a></div></figure><figure class="quote" id="q-70c5ed81b1" data-kw="Comfort Wisdom"><blockquote><p>Now what greater comfort is there than this, that there is one presides in the world who is so wise he cannot be mistaken, so faithful he cannot deceive, so pitiful he cannot neglect his people, and so powerful that he can make stones even to be turned into bread if he please!</p></blockquote><figcaption>— <a href="../../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Use of comfort</figcaption><div class="meta"><a class="tag here" href="../../topics/god/wisdom.html" aria-current="page">Wisdom</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“Now what greater comfort is there than this, that there is one presides in the world who is so wise he cannot be mistaken, so faithful he cannot deceive, so pitiful he cannot neglect his people, and so powerful that he can make stones even to be turned into bread if he please!”

— Stephen Charnock, A Treatise on Divine Providence, Discourse on 2 Chron. 16:9, Doct. 1, Use of comfort">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+what+greater+comfort+is+there+than+this%2C+that+there+is+one+presides+in+the+world+who+is+so+wise+he+cannot+be+mistaken%2C+so+faithful+he+cannot+deceive%2C+so+pitiful+he+cannot+neglect+his+people%2C+and+so+powerful+that+he+can+make+stones+even+to+be+turned+into+bread+if+he+please%21%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Treatise+on+Divine+Providence%2C+Discourse+on+2+Chron.+16%3A9%2C+Doct.+1%2C+Use+of+comfort&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70c5ed81b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/70c5ed81b1.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1641-1700_a-treatise-of-divine-pro_charnock-stephen_1680" target="_blank" rel="noopener">Read it online · Internet Archive (1680 ed.)</a></div></figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom"><blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote><figcaption>— <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a>, <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/wisdom.html" aria-current="page">Wisdom</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/christian-life/contentment.html">Contentment</a></div><div class="actions"><button class="copy" data-copy="“We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.”

— Jeremiah Burroughs, The Rare Jewel of Christian Contentment, ch. 3, Lesson 9 (variety and order of providence)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+indeed%2C+look+at+things+by+pieces%2C+we+look+at+one+detail+and+do+not+consider+the+relation+that+one+thing+has+to+another%2C+but+God+looks+at+all+things+at+once%2C+and+sees+the+relation+that+one+thing+has+to+another.+When+a+child+looks+at+a+clock%2C+it+looks+first+at+one+wheel%2C+and+then+at+another+wheel%3A+he+does+not+look+at+them+all+together+or+the+dependence+that+one+has+upon+another%3B+but+the+workman+has+his+eyes+on+them+all+together+and+sees+the+dependence+of+all%2C+one+upon+another%3A+so+it+is+in+God%27s+providence.+Now+notice+how+this+works+to+contentment%3A+when+a+certain+passage+of+providence+befalls+me%2C+that+is+one+wheel%2C+and+it+may+be+that+if+this+wheel+were+stopped%2C+a+thousand+other+things+might+come+to+be+stopped+by+this.+In+a+clock%2C+stop+but+one+wheel+and+you+stop+every+wheel%2C+because+they+are+dependant+upon+one+another.+So+when+God+has+ordered+a+thing+for+the+present+to+be+thus+and+thus%2C+how+do+you+know+how+many+things+depend+upon+this+thing%3F+God+may+have+some+work+to+do+twenty+years+hence+that+depends+on+this+passage+of+providence+that+falls+out+this+day+or+this+week.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+The+Rare+Jewel+of+Christian+Contentment%2C+ch.+3%2C+Lesson+9+%28variety+and+order+of+providence%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2494a6812.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f2494a6812.html">Permalink</a><a class="src" href="https://archive.org/details/rarejewelchrist00burrgoog" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom"><blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote><figcaption>— <a href="../../authors/horatius-bonar.html">Horatius Bonar</a>, <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</figcaption><div class="meta"><a class="tag here" href="../../topics/god/wisdom.html" aria-current="page">Wisdom</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.”

— Horatius Bonar, Night of Weeping, ch. IV, “The Family Discipline,”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+the+discipline+of+wisdom.+He+who+administers+it+is+the+%22God+only+wise.%22+What+deep+wisdom+then+must+there+be+in+all+His+dealings%21+He+knows+exactly+what+we+need+and+how+to+supply+it.+He+knows+what+evils+are+to+be+found+in+us%2C+and+how+these+may+be+best+removed.+His+training+is+no+random+work.+It+is+carried+on+with+exquisite+skill.+The+time+and+the+way+and+the+instrument+are+all+according+to+the+perfect+wisdom+of+God.+The+fittest+time+is+chosen%2C+just+the+very+moment+when+discipline+is+called+for%2C+and+when+it+would+be+most+profitable.+The+surest%2C+most+direct%2C+and+at+the+same+time+gentlest+method+is+devised.+The+instrument+which+will+be+surest+yet+safest%2C+most+effectual+yet+least+painful%2C+is+brought+into+operation.+For+all+is+wisdom+in+the+discipline+of+God.%E2%80%9D%0A%0A%E2%80%94+Horatius+Bonar%2C+Night+of+Weeping%2C+ch.+IV%2C+%E2%80%9CThe+Family+Discipline%2C%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F940c6385f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/940c6385f9.html">Permalink</a><a class="src" href="https://archive.org/details/nightofweepingor00bonaiala" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-5cdc07d4df" data-kw="Wisdom"><blockquote><p>It is a marked proof of the wisdom of God that he can so direct all the affairs of the universe as, without need of special action, to accomplish all the events he chooses. All providence, therefore, is general, because operated through general laws. It is also special, because every individual event comes to pass under God&#x27;s own inspection, and through his own will and work.</p></blockquote><figcaption>— <a href="../../authors/james-petigru-boyce.html">James Petigru Boyce</a>, <cite>Abstract of Systematic Theology</cite>, ch. XXI, “Providence,” §IV.1</figcaption><div class="meta"><a class="tag here" href="../../topics/god/wisdom.html" aria-current="page">Wisdom</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“It is a marked proof of the wisdom of God that he can so direct all the affairs of the universe as, without need of special action, to accomplish all the events he chooses. All providence, therefore, is general, because operated through general laws. It is also special, because every individual event comes to pass under God&#x27;s own inspection, and through his own will and work.”

— James Petigru Boyce, Abstract of Systematic Theology, ch. XXI, “Providence,” §IV.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+marked+proof+of+the+wisdom+of+God+that+he+can+so+direct+all+the+affairs+of+the+universe+as%2C+without+need+of+special+action%2C+to+accomplish+all+the+events+he+chooses.+All+providence%2C+therefore%2C+is+general%2C+because+operated+through+general+laws.+It+is+also+special%2C+because+every+individual+event+comes+to+pass+under+God%27s+own+inspection%2C+and+through+his+own+will+and+work.%E2%80%9D%0A%0A%E2%80%94+James+Petigru+Boyce%2C+Abstract+of+Systematic+Theology%2C+ch.+XXI%2C+%E2%80%9CProvidence%2C%E2%80%9D+%C2%A7IV.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5cdc07d4df.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5cdc07d4df.html">Permalink</a><a class="src" href="https://ccel.org/ccel/boyce/theology" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-9c2ff7740d" data-kw="Sovereignty Wisdom Comfort"><blockquote><p>But our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote><figcaption>— <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>The Sovereignty of God</cite>, ch. 12, “The Value of This Doctrine” (6. It supplies comfort in sorrow)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/wisdom.html" aria-current="page">Wisdom</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/sovereignty.html">Sovereignty</a></div><div class="actions"><button class="copy" data-copy="“But our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!”

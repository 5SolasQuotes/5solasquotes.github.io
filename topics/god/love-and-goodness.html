<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love &amp; Goodness · 5 Solas Quotes</title><meta name="description" content="Love &amp; Goodness — God"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css?v=202610231258"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><span class="themewrap"><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button><span class="themelbl" aria-hidden="true"></span></span></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../god.html">God</a> ›</p><h1>Love &amp; Goodness</h1><p class="sub">4 quotations from 4 authors</p><figure class="quote" id="q-a6a670da33" data-kw="Affliction Comfort Love"><blockquote><p>And what a comfort it is to believe this doctrine. If we are poor, or sick, or bereaved, or defamed, how delightful it is to know that it is the Lord, and not man; the Lord and not Satan; a friend and not an enemy; a most tender father and not a capricious master—who thus ordains. David was wise when he said, &quot;Let me fall into the hand of the Lord, and not into the hand of man.&quot; Luther said, &quot;Smite, Lord, for you love me.&quot; Every child of God may say as much.</p></blockquote><figcaption>— <a href="../../authors/william-s-plumer.html">William S. Plumer</a>, <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “Practical Remarks on the Nature of God’s Providence”</figcaption><div class="meta"><a class="tag here" href="../../topics/god/love-and-goodness.html" aria-current="page">Love &amp; Goodness</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“And what a comfort it is to believe this doctrine. If we are poor, or sick, or bereaved, or defamed, how delightful it is to know that it is the Lord, and not man; the Lord and not Satan; a friend and not an enemy; a most tender father and not a capricious master—who thus ordains. David was wise when he said, &quot;Let me fall into the hand of the Lord, and not into the hand of man.&quot; Luther said, &quot;Smite, Lord, for you love me.&quot; Every child of God may say as much.”

— William S. Plumer, Jehovah-Jireh: A Treatise on Providence, ch. “Practical Remarks on the Nature of God’s Providence”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+what+a+comfort+it+is+to+believe+this+doctrine.+If+we+are+poor%2C+or+sick%2C+or+bereaved%2C+or+defamed%2C+how+delightful+it+is+to+know+that+it+is+the+Lord%2C+and+not+man%3B+the+Lord+and+not+Satan%3B+a+friend+and+not+an+enemy%3B+a+most+tender+father+and+not+a+capricious+master%E2%80%94who+thus+ordains.+David+was+wise+when+he+said%2C+%22Let+me+fall+into+the+hand+of+the+Lord%2C+and+not+into+the+hand+of+man.%22+Luther+said%2C+%22Smite%2C+Lord%2C+for+you+love+me.%22+Every+child+of+God+may+say+as+much.%E2%80%9D%0A%0A%E2%80%94+William+S.+Plumer%2C+Jehovah-Jireh%3A+A+Treatise+on+Providence%2C+ch.+%E2%80%9CPractical+Remarks+on+the+Nature+of+God%E2%80%99s+Providence%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa6a670da33.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a6a670da33.html">Permalink</a><a class="src" href="https://archive.org/details/jehovahjirehtrea00plum" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love"><blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote><figcaption>— <a href="../../authors/horatius-bonar.html">Horatius Bonar</a>, <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</figcaption><div class="meta"><a class="tag here" href="../../topics/god/love-and-goodness.html" aria-current="page">Love &amp; Goodness</a><a class="tag" href="../../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.”

— Horatius Bonar, Night of Weeping, ch. XIV, “The Consolation,”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAffliction+is+the+expression+of+paternal+love.+It+is+from+the+deepest+recess+of+the+fountain+of+love+that+sorrow+flows+down+to+us.+And+love+cannot+wrong+us.+It+blesses%2C+but+cannot+curse.+Its+utterances+and+actions+are+all+of+peace+and+gladness.+It+wants+a+larger+vessel+into+which+to+empty+itself%2C+and+a+deeper+channel+through+which+to+flow.+That+is+all.+It+seeks+to+make+us+more+susceptible+of+kindness%2C+and+then+to+pour+that+kindness+in.+Yes%2C+love+is+the+true%2C+the+one+origin+of+the+sharpest+stroke+that+ever+fell+upon+a+bleeding+heart.+The+truth+is%2C+there+is+no+other+way+of+accounting+for+affliction+but+this.+Anger+will+not+account+for+it%2C+forgetfulness+will+not+account+for+it%2C+chance+will+not+account+for+it.+No.+It+is+simply+impossible+to+trace+it+to+any+cause+but+love.+Admit+this+as+its+spring%2C+and+all+is+harmonious%2C+comely%2C+perfect.+Deny+it%2C+and+all+is+confusion%2C+cruelty%2C+and+darkness.%E2%80%9D%0A%0A%E2%80%94+Horatius+Bonar%2C+Night+of+Weeping%2C+ch.+XIV%2C+%E2%80%9CThe+Consolation%2C%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fba0d123cd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ba0d123cd8.html">Permalink</a><a class="src" href="https://archive.org/details/nightofweepingor00bonaiala" target="_blank" rel="noopener">Read it online · Internet Archive</a></div></figure><figure class="quote" id="q-c27cdb4f4d" data-kw="Love"><blockquote><p>We are to measure God’s love not by His providence but by His promise.</p></blockquote><figcaption>— <a href="../../authors/john-j-murray.html">John J. Murray</a>, <cite>Behind a Frowning Providence</cite>, ch. 4, “Our Comfort in Dark Providences”</figcaption><div class="meta"><a class="tag here" href="../../topics/god/love-and-goodness.html" aria-current="page">Love &amp; Goodness</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div><div class="actions"><button class="copy" data-copy="“We are to measure God’s love not by His providence but by His promise.”

— John J. Murray, Behind a Frowning Providence, ch. 4, “Our Comfort in Dark Providences”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+to+measure+God%E2%80%99s+love+not+by+His+providence+but+by+His+promise.%E2%80%9D%0A%0A%E2%80%94+John+J.+Murray%2C+Behind+a+Frowning+Providence%2C+ch.+4%2C+%E2%80%9COur+Comfort+in+Dark+Providences%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc27cdb4f4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c27cdb4f4d.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6e0adc620a" data-kw="Love Wisdom Election"><blockquote><p>That the great God purposed and designed an union with himself of those whom in a special manner he had set himself to love; and that this union is the deepest and furthest design of his heart, of any he hath toward them, or the whole creation. The full demonstration of his manifold wisdom and power moved him to make a variety of persons, things, yea, of worlds; but then his goodness and his love moved him to reduce out of that variety an all out of every sort, as a pledge of his respect to all, unto an unity again, and that with himself; and this union is the top perfection of all his works, as that, John 17:23, ‘I in them, and they in me, that they may be made perfect in one.’ It is the perfection of the creature, whereof the unity of the three Persons is the pattern, and the perfection of God’s design.</p></blockquote><figcaption>— <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a>, <cite>An Exposition of the First Chapter of Ephesians (Works, vol. 1)</cite>, Sermon X (Eph. 1:10)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/love-and-goodness.html" aria-current="page">Love &amp; Goodness</a><a class="tag" href="../../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/god/wisdom.html">Wisdom</a></div><div class="actions"><button class="copy" data-copy="“That the great God purposed and designed an union with himself of those whom in a special manner he had set himself to love; and that this union is the deepest and furthest design of his heart, of any he hath toward them, or the whole creation. The full demonstration of his manifold wisdom and power moved him to make a variety of persons, things, yea, of worlds; but then his goodness and his love moved him to reduce out of that variety an all out of every sort, as a pledge of his respect to all, unto an unity again, and that with himself; and this union is the top perfection of all his works, as that, John 17:23, ‘I in them, and they in me, that they may be made perfect in one.’ It is the perfection of the creature, whereof the unity of the three Persons is the pattern, and the perfection of God’s design.”

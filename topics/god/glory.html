e vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.</p></blockquote><figcaption>— <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>A Dissertation Concerning the End for Which God Created the World</cite>, on Ex. 14:17 and Rom. 9:22–23</figcaption><div class="meta"><a class="tag here" href="../../topics/god/glory.html" aria-current="page">Glory</a><a class="tag" href="../../topics/decrees-and-providence/decree.html">The Decree</a></div><div class="actions"><button class="copy" data-copy="“The attaining of God&#x27;s glory was an end, which being ultimate and supreme, must in no case whatsoever give place. This is spoken of as the end of God&#x27;s executing judgments on his enemies in this world. … And this is spoken of as the end, both of the executions of wrath, and in the glorious exercises of mercy, in the misery and happiness of another world. Rom. 9:22–23, &quot;What if God, willing to show his wrath, and make his power known, endured with much long suffering, the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.”

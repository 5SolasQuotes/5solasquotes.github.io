<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Justice · 5 Solas Quotes</title><meta name="description" content="Justice — God"><script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site"><div class="wrap"><a class="brand" href="../../index.html"><img src="../../assets/logo-96.png" alt="" width="40" height="40"><span>5 Solas Quotes</span></a><nav><a href="../../topics/index.html">Topics</a><a href="../../topics/polemics.html">Polemics</a><a href="../../collections/index.html">Collections</a><a href="../../authors/index.html">Authors</a><a href="../../search.html">Search</a><a href="../../about.html">About</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light or dark theme"></button></nav></div></header><main class="wrap"><p class="crumbs"><a href="../index.html">Topics</a> › <a href="../god.html">God</a> ›</p><h1>Justice</h1><p class="sub">14 quotations from 14 authors</p><figure class="quote" id="q-1d67e727d3" data-kw="Author of sin Justice"><blockquote><p>For besides the fact that God, who is supremely good, can make nothing except what is good, if man had been brought forth depraved and evil, God could have had no sufficiently just cause for punishing that wickedness of which he himself would have been the creator and author.</p></blockquote><figcaption>— <a href="../../authors/theodore-beza.html">Theodore Beza</a>, <cite>The Christian Faith</cite>, ch. 3, art. 7</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“For besides the fact that God, who is supremely good, can make nothing except what is good, if man had been brought forth depraved and evil, God could have had no sufficiently just cause for punishing that wickedness of which he himself would have been the creator and author.”

— Theodore Beza, The Christian Faith, ch. 3, art. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+besides+the+fact+that+God%2C+who+is+supremely+good%2C+can+make+nothing+except+what+is+good%2C+if+man+had+been+brought+forth+depraved+and+evil%2C+God+could+have+had+no+sufficiently+just+cause+for+punishing+that+wickedness+of+which+he+himself+would+have+been+the+creator+and+author.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+ch.+3%2C+art.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d67e727d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1d67e727d3.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin Hardening Justice Depravity"><blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote><figcaption>— <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>The Second Helvetic Confession (1566)</cite>, ch. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a></div><div class="actions"><button class="copy" data-copy="“Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.”

— Heinrich Bullinger, The Second Helvetic Confession (1566), ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYes%2C+there+is+even+in+ourselves+sin+and+corruption+enough%2C+so+that+there+is+no+need+that+God+should+infuse+into+us+either+a+new+or+greater+measure+of+wickedness.+Therefore%2C+when+God+is+said+in+the+Scripture+to+harden+%28Ex.+7%3A13%29%2C+to+blind+%28John+12%3A40%29+and+to+deliver+us+up+into+a+reprobate+sense+%28Rom.+1%3A28%29%2C+it+is+to+be+understood+that+God+does+it+by+just+judgment%2C+as+a+just+judge+and+avenger.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession+%281566%29%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc71e2bebb7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c71e2bebb7.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice"><blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/god/holiness.html">Holiness</a></div><div class="actions"><button class="copy" data-copy="“However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on original sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+this+is+certain%2C+that+God+doth+not+infuse+it.+Souls+receive+neither+purity+nor+impurity+from+him%2C+but+only+their+naked+essence%2C+and+the+natural+powers+and+properties+flowing+therefrom.+He+doth+not+infuse+any+impurity+into+men%3B+for+he+cannot+be+the+author+of+sin%2C+who+is+the+revenger+of+it.+%E2%80%A6+As+a+pure+and+holy+God%2C+he+cannot+infuse+any+impurity+into+the+souls+of+men%3B+and+as+a+just+and+righteous+God%2C+he+may+and+doth+withhold+from%2C+or+create+them+void+and+destitute+of%2C+that+holiness+and+righteousness+which+was+once+their+happiness+and+glory.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+original+sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac2cd3cfb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ac2cd3cfb9.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall"><blockquote><p>And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote><figcaption>— <a href="../../authors/synod-of-debrecen.html">Synod of Debrecen</a>, <cite>Documents of the Synod of Debrecen (1567)</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a></div><div class="actions"><button class="copy" data-copy="“And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).”

— Synod of Debrecen, Documents of the Synod of Debrecen (1567)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+just+as+he+that+wishes+to+punish+someone+by+fumigating+with+a+foul+smell%2C+sulfur+and+dung%2C+does+not+put+a+foul+smell+into+the+sulfur+and+dung+%28it+already+is+there%29%2C+so+God%2C+when+He+punishes+sins+through+the+devil+and+the+vessels+of+wrath+with+sins%2C+does+not+put+any+sin+into+them%2C+but+it+is+there+naturally+since+the+fall+in+the+devil+and+in+men+%28Eph.+4%3B+Rom.+1%29.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Debrecen%2C+Documents+of+the+Synod+of+Debrecen+%281567%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F215040d6fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/215040d6fd.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice"><blockquote><p>But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, Vol. 2 (on original sin)</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a><a class="tag" href="../../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.”

— Charles Hodge, Systematic Theology, Vol. 2 (on original sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+He+is+not+the+author+of+the+evil+dispositions+with+which+that+nature+is+infected+at+birth.+The+doctrine+of+original+sin+attributes+no+efficiency+to+God+in+the+production+of+evil.+It+simply+supposes+that+He+judicially+abandons+our+apostate+race%2C+and+withholds+from+the+descendants+of+Adam+the+manifestations+of+his+favour+and+love%2C+which+are+the+life+of+the+soul.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+Vol.+2+%28on+original+sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3630fcaed0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3630fcaed0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology2" target="_blank" rel="noopener">Read it online · CCEL, vol. 2</a></div></figure><figure class="quote" id="q-14ba01d57f" data-kw="Hardening Justice"><blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote><figcaption>— <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §20</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.”

— Petrus van Mastricht, Theoretical-Practical Theology, Vol. 3, bk. 3, ch. 10 (Providence), §20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+certainly+does+not+in+either+case+effect+or+infuse+blindness+or+hardness+into+the+sinner+%28cf.+James+1%3A13%E2%80%9314%29%2C+yet+neither+does+he+only+not+take+away+blindness+and+hardness%2C+by+not+circumcising+the+heart+%28Jer.+6%3A10%2C+26%3B+Acts+7%3A51%29%2C+or+by+not+conferring+spiritual+light+to+the+mind%2C+or+softness+and+malleability+to+the+heart+%28Matt.+13%3A14%E2%80%9315%3B+Isa.+6%3A9%E2%80%9310%29%2C+but+in+addition%3A+%281%29+on+account+of+preceding+sins%2C+in+a+just+and+holy+way%2C+he+takes+away+or+diminishes+the+remnants+of+wisdom+and+moral+goodness+that+a+sinner+has%2C+and+also+augments+and+aggravates+his+original+blindness+and+hardness.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+Vol.+3%2C+bk.+3%2C+ch.+10+%28Providence%29%2C+%C2%A720&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14ba01d57f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/14ba01d57f.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-c93c333fae" data-kw="Hardening Satan Justice"><blockquote><p>God is said to blind and to harden men not only negatively (by not enlightening and softening) and privatively (by withdrawing his grace whatever it may have been after men have abused it) and permissively (by not hindering), but also positively. Not by bringing in blindness or hardness (which is natural to man), but both objectively by presenting external objects to them which although ordained to another direction by their own nature, yet he knows will be drawn in a different way by their vice; and judicially by smiting them internally with blindness (the light which they abused being taken away or extinguished); and by loosening the reins to their lusts and delivering them up and enslaving them to Satan.</p></blockquote><figcaption>— <a href="../../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.7.28</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“God is said to blind and to harden men not only negatively (by not enlightening and softening) and privatively (by withdrawing his grace whatever it may have been after men have abused it) and permissively (by not hindering), but also positively. Not by bringing in blindness or hardness (which is natural to man), but both objectively by presenting external objects to them which although ordained to another direction by their own nature, yet he knows will be drawn in a different way by their vice; and judicially by smiting them internally with blindness (the light which they abused being taken away or extinguished); and by loosening the reins to their lusts and delivering them up and enslaving them to Satan.”

— Francis Turretin, Institutes of Elenctic Theology, 6.7.28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+is+said+to+blind+and+to+harden+men+not+only+negatively+%28by+not+enlightening+and+softening%29+and+privatively+%28by+withdrawing+his+grace+whatever+it+may+have+been+after+men+have+abused+it%29+and+permissively+%28by+not+hindering%29%2C+but+also+positively.+Not+by+bringing+in+blindness+or+hardness+%28which+is+natural+to+man%29%2C+but+both+objectively+by+presenting+external+objects+to+them+which+although+ordained+to+another+direction+by+their+own+nature%2C+yet+he+knows+will+be+drawn+in+a+different+way+by+their+vice%3B+and+judicially+by+smiting+them+internally+with+blindness+%28the+light+which+they+abused+being+taken+away+or+extinguished%29%3B+and+by+loosening+the+reins+to+their+lusts+and+delivering+them+up+and+enslaving+them+to+Satan.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+6.7.28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc93c333fae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c93c333fae.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-400669531f" data-kw="Hardening Justice Reprobation"><blockquote><p>Thus, God is said to harden a wicked man because of his demerits when, being provoked by that man’s impiety, He takes occasion to withdraw granted grace and to do certain things through which He knows that this man will grow worse.</p></blockquote><figcaption>— <a href="../../authors/john-davenant.html">John Davenant</a>, <cite>On Predestination and Reprobation</cite>, ch. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../../topics/decrees-and-providence/reprobation.html">Reprobation</a></div><div class="actions"><button class="copy" data-copy="“Thus, God is said to harden a wicked man because of his demerits when, being provoked by that man’s impiety, He takes occasion to withdraw granted grace and to do certain things through which He knows that this man will grow worse.”

— John Davenant, On Predestination and Reprobation, ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%2C+God+is+said+to+harden+a+wicked+man+because+of+his+demerits+when%2C+being+provoked+by+that+man%E2%80%99s+impiety%2C+He+takes+occasion+to+withdraw+granted+grace+and+to+do+certain+things+through+which+He+knows+that+this+man+will+grow+worse.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+On+Predestination+and+Reprobation%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F400669531f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/400669531f.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-dda3160a8c" data-kw="Hardening Free Will Justice"><blockquote><p>For in those people God did not make the common sins but found them there, as we have noted before. And although God, in his just but to us hidden judgment, does abandon and harden them more and more (Romans 9:18), yet it is they who by their own free choice first become hardened (Romans 11:7) and abandon the benefits of general providence; they abuse God’s longsuffering, as Paul testifies in Romans 1:18, 26, and 28.</p></blockquote><figcaption>— <a href="../../authors/antonius-walaeus.html">Antonius Walaeus</a>, <cite>Synopsis of a Purer Theology (Leiden Synopsis)</cite>, Disp. 24, On Divine Predestination</figcaption><div class="meta"><a class="tag here" href="../../topics/god/justice.html" aria-current="page">Justice</a><a class="tag" href="../../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../../topics/ nd-attributes.html">Nature &amp; Attributes</a></div><div class="actions"><button class="copy" data-copy="“We thus see that there is no inconsistency in attributing the same act to God, to Satan, and to man, while, from the difference in the end and mode of action, the spotless righteousness of God shines forth at the same time that the iniquity of Satan and of man is manifested in all its deformity.”

ics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../../topics/salvation/assurance.html">Assurance</a></div><div class="actions"><button class="copy" data-copy="“Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?”

riest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/polemics/rome-images.html">Rome: Images &amp; Idolatry</a><a class="tag" href="../../topics/worship/idolatry.html">Idolatry</a></div><div class="actions"><button class="copy" data-copy="“Is there any Queen of heaven constituted by God? It is denied. That name was taken from the ancient idolaters, and applied to the virgin Mary by the new ones.”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2 (chapter argument)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs+there+any+Queen+of+heaven+constituted+by+God%3F+It+is+denied.+That+name+was+taken+from+the+ancient+idolaters%2C+and+applied+to+the+virgin+Mary+by+the+new+ones.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2+%28chapter+argument%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67e4cb9b86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/67e4cb9b86.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King"><blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote><figcaption>— <a href="../../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-mary.html" aria-current="page">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a></div><div class="actions"><button class="copy" data-copy="“We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+acknowledge+the+Blessed+virgin+to+be+the+most+excellent+member+of+this+spouse%3B+and+that%2C+in+this+sense%2C+she+reigns+with+Christ%2C+and+with+all+the+faithful.+But+that+Christ+administers+his+kingdom+through+her%2C+as+through+the+Queen+of+heaven%2C+or+that+he+has+constituted+her+to+have+Dominion+over+all+creatures+with+Royal+power%2C+since+this+is+not+proved+from+scripture%3B+but+is+only+fashioned+by+the+most+audacious+men%2C+she+will+never+receive+it%3B+%E2%80%A6+nor+can+we+defer+it+to+her.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa94e564bfc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a94e564bfc.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-9ac1204447" data-kw="Mary Queen of Heaven King"><blockquote><p>I hear again a Jesuit crying out, &quot;You, Mother of God, CAN DO ALL THINGS in heaven and on earth.&quot; But I believe Christ, saying, (Matt. 28:18.) &quot;All power is given to me in heaven and on earth.&quot; If he had said the same of his mother, we would have given faith to him: which we rightly withdraw from those who, without God&#x27;s authority, crown a Queen, not only for themselves, but to rule over all creatures.</p></blockquote><figcaption>— <a href="../../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-mary.html" aria-current="page">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a></div><div class="actions"><button class="copy" data-copy="“I hear again a Jesuit crying out, &quot;You, Mother of God, CAN DO ALL THINGS in heaven and on earth.&quot; But I believe Christ, saying, (Matt. 28:18.) &quot;All power is given to me in heaven and on earth.&quot; If he had said the same of his mother, we would have given faith to him: which we rightly withdraw from those who, without God&#x27;s authority, crown a Queen, not only for themselves, but to rule over all creatures.”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+hear+again+a+Jesuit+crying+out%2C+%22You%2C+Mother+of+God%2C+CAN+DO+ALL+THINGS+in+heaven+and+on+earth.%22+But+I+believe+Christ%2C+saying%2C+%28Matt.+28%3A18.%29+%22All+power+is+given+to+me+in+heaven+and+on+earth.%22+If+he+had+said+the+same+of+his+mother%2C+we+would+have+given+faith+to+him%3A+which+we+rightly+withdraw+from+those+who%2C+without+God%27s+authority%2C+crown+a+Queen%2C+not+only+for+themselves%2C+but+to+rule+over+all+creatures.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9ac1204447.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9ac1204447.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-92dd6ed6d7" data-kw="Mary Queen of Heaven"><blockquote><p>If God disapproved that men on earth constituted a King for themselves, without consulting him: what will he say of the worms of the earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?</p></blockquote><figcaption>— <a href="../../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-mary.html" aria-current="page">Rome: Mary</a><a class="tag" href="../../topics/scripture/authority.html">Authority</a><a class="tag" href="../../topics/scripture/sufficiency.html">Sufficiency</a></div><div class="actions"><button class="copy" data-copy="“If God disapproved that men on earth constituted a King for themselves, without consulting him: what will he say of the worms of the earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?”

— André Rivet, Apology for the Most Holy Virgin Mary, Bk. 2, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+God+disapproved+that+men+on+earth+constituted+a+King+for+themselves%2C+without+consulting+him%3A+what+will+he+say+of+the+worms+of+the+earth%2C+who+without+an+oracle+from+God%2C+constitute+a+Queen+of+heaven%2C+and+erect+for+her+a+throne+of+majesty%2C+without+asking+at+the+mouth+of+God%3F%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Apology+for+the+Most+Holy+Virgin+Mary%2C+Bk.+2%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92dd6ed6d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/92dd6ed6d7.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace"><blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-mary.html" aria-current="page">Rome: Mary</a><a class="tag" href="../../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../../topics/salvation/calling.html">Effectual Calling</a><a class="tag" href="../../topics/salvation/regeneration.html">Regeneration</a></div><div class="actions"><button class="copy" data-copy="“Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.”

— John Calvin, Commentary on a Harmony of the Evangelists, Luke 1:48-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+we+see+how+widely+the+Papists+differ+from+her%2C+who+idly+adorn+her+with+their+empty+devices%2C+and+reckon+almost+as+nothing+the+benefits+which+she+received+from+God.+They+heap+up+an+abundance+of+magnificent+and+very+presumptuous+titles%2C+such+as%2C+%22Queen+of+Heaven%2C+Star+of+Salvation%2C+Gate+of+Life%2C+Sweetness%2C+Hope%2C+and+Salvation.%22+Nay+more%2C+to+such+a+pitch+of+insolence+and+fury+have+they+been+hurried+by+Satan%2C+that+they+give+her+authority+over+Christ%3B+for+this+is+their+pretty+song%2C+%22Beseech+the+Father%2C+Order+the+Son.%22+None+of+these+modes+of+expression%2C+it+is+evident%2C+proceeded+from+the+Lord.+All+are+disclaimed+by+the+holy+virgin+in+a+single+word%2C+when+she+makes+her+whole+glory+to+consist+in+acts+of+the+divine+kindness.+If+it+was+her+duty+to+praise+the+name+of+God+alone%2C+who+had+done+to+her+wonderful+things%2C+no+room+is+left+for+the+pretended+titles%2C+which+come+from+another+quarter.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+a+Harmony+of+the+Evangelists%2C+Luke+1%3A48-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2cfa4393d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2cfa4393d8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom31" target="_blank" rel="noopener">Read it online · CCEL, vol. 1</a></div></figure><figure class="quote" id="q-61a2efa655" data-kw="Mary Queen of Heaven Mediator"><blockquote><p>Except for those honorary titles which belong to God the Lord and to our only Saviour, one may give her the highest and most glorious titles. … But that we do not name her a Goddess, a Mediator between God and men, an all-knowing and almighty Queen of Heaven, a Gate of the Heavenly Paradise, a Redeemer, a Reconciler of the human race, and more suchlike honorary titles which were raised by men, comes solely therefrom, that suchlike honorary titles are adverse to the honour of God and of Our Saviour.</p></blockquote><figcaption>— <a href="../../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a>, <cite>Short Instruction on the Holy Virgin Mary (1673)</cite>, Q. 29</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-mary.html" aria-current="page">Rome: Mary</a><a class="tag" href="../../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../../topics/person-of-christ/mediator.html">The Mediator</a></div><div class="actions"><button class="copy" data-copy="“Except for those honorary titles which belong to God the Lord and to our only Saviour, one may give her the highest and most glorious titles. … But that we do not name her a Goddess, a Mediator between God and men, an all-knowing and almighty Queen of Heaven, a Gate of the Heavenly Paradise, a Redeemer, a Reconciler of the human race, and more suchlike honorary titles which were raised by men, comes solely therefrom, that suchlike honorary titles are adverse to the honour of God and of Our Saviour.”

nd queen of heaven, (as the papists style her), but it speaketh her humility and readiness to give up herself to the Lord&#x27;s pleasure, her assent and consent unto God.”

— Matthew Poole, Annotations upon the Holy Bible, Luke 1:38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+phrase%2C+Behold+the+handmaid+of+the+Lord%2C+doth+not+speak+her+the+lady+and+queen+of+heaven%2C+%28as+the+papists+style+her%29%2C+but+it+speaketh+her+humility+and+readiness+to+give+up+herself+to+the+Lord%27s+pleasure%2C+her+assent+and+consent+unto+God.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Annotations+upon+the+Holy+Bible%2C+Luke+1%3A38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F972b5259c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/972b5259c7.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28annotations+upon+the+holy+bible%29+AND+creator%3A%28poole%29" target="_blank" rel="noopener">Read it online · Internet Archive (early editions)</a></div></figure><figure class="quote" id="q-e3bb62268e" data-kw="Mary Queen of Heaven"><blockquote><p>She was called the Queen of heaven, Queen of queens, said to be exalted above all principalities and powers; to be seated at the right hand of Christ, to share with Him in the universal and absolute power committed to his hands. All the blessings of salvation were sought at her hands, as well as protection from all enemies, and deliverance from all evils.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 3 (Mariolatry)</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-mary.html" aria-current="page">Rome: Mary</a></div><div class="actions"><button class="copy" data-copy="“She was called the Queen of heaven, Queen of queens, said to be exalted above all principalities and powers; to be seated at the right hand of Christ, to share with Him in the universal and absolute power committed to his hands. All the blessings of salvation were sought at her hands, as well as protection from all enemies, and deliverance from all evils.”

 mother in the Virgin Mary, they transfer to her what belongs exclusively to God. … For Mary has been constituted the Queen of Heaven, the Hope, the Life, and the Salvation of the world; and, in short, their fury and madness proceeded so far that they stripped Christ of his spoils, and left him almost naked.”

al Law</a></div><div class="actions"><button class="copy" data-copy="“As to the first, they deny that concupiscence or tinder is prohibited by the law of God because they do not consider it to be a sin. … But the orthodox think concupiscence is both properly sin and is prohibited by the law.”

— Francis Turretin, Institutes of Elenctic Theology, 11.21.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+who+can+believe+that+Paul+would+so+often+and+so+expressly+have+called+that+sin%2C+if+it+was+not+true+sin+and+properly+so+called%2C+but+only+because+it+flowed+from+sin+and+inclined+to+sin+%28as+the+Council+falsely+maintained%29%3F%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+11.21.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F01905efa84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/01905efa84.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-6c7ba3e091" data-kw=""><blockquote><p>He, then, who admits not that all the desires of the flesh are sins, and that that disease of concupiscence, which they call a stimulus, is a fountain of sin, must of necessity deny that the transgression of the law is sin.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.11</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“He, then, who admits not that all the desires of the flesh are sins, and that that disease of concupiscence, which they call a stimulus, is a fountain of sin, must of necessity deny that the transgression of the law is sin.”

— John Calvin, Institutes of the Christian Religion, 3.3.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe%2C+then%2C+who+admits+not+that+all+the+desires+of+the+flesh+are+sins%2C+and+that+that+disease+of+concupiscence%2C+which+they+call+a+stimulus%2C+is+a+fountain+of+sin%2C+must+of+necessity+deny+that+the+transgression+of+the+law+is+sin.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c7ba3e091.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6c7ba3e091.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-8cc42432c9" data-kw=""><blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote><figcaption>— <a href="../../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.13</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div><div class="actions"><button class="copy" data-copy="“Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.”

— John Calvin, Institutes of the Christian Religion, 3.3.13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+who+maintain+that+concupiscence+is+not+sin%2C+are+wont+to+found+on+the+passage+of+James%2C+%22Then%2C+when+lust+has+conceived%2C+it+bringeth+forth+sin%2C%22+%28James+1%3A15%29.+But+this+is+easily+refuted%3A+for+unless+we+understand+him+as+speaking+only+of+wicked+works+or+actual+sins%2C+even+a+wicked+inclination+will+not+be+accounted+sin.+But+from+his+calling+crimes+and+wicked+deeds+the+fruits+of+lust%2C+and+also+giving+them+the+name+of+sins%2C+it+does+not+follow+that+the+lust+itself+is+not+an+evil%2C+and+in+the+sight+of+God+deserving+of+condemnation.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cc42432c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8cc42432c9.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" target="_blank" rel="noopener">Read it online · CCEL</a></div></figure><figure class="quote" id="q-562d5070cb" data-kw=""><blockquote><p>Falsely, therefore, do the Papists remove it from the number of sins and reckon it among the works of God.</p></blockquote><figcaption>— <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, 1.10</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a></div><div class="actions"><button class="copy" data-copy="“Falsely, therefore, do the Papists remove it from the number of sins and reckon it among the works of God.”

— Johannes Wollebius, Compendium of Christian Theology, 1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFalsely%2C+therefore%2C+do+the+Papists+remove+it+from+the+number+of+sins+and+reckon+it+among+the+works+of+God.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F562d5070cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/562d5070cb.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-5bc9204dd7" data-kw=""><blockquote><p>Bellarmine says that this inordinate concupiscence is not properly sin. What then? Shall we say it is improperly called sin, even though in the very principles of nature it chains and restrains man like a ferocious beast? Is this credible? Let Bellarmine believe such absurdities—we do not.</p></blockquote><figcaption>— <a href="../../authors/john-davenant.html">John Davenant</a>, <cite>Determinationes</cite>, Q. 16</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a></div><div class="actions"><button class="copy" data-copy="“Bellarmine says that this inordinate concupiscence is not properly sin. What then? Shall we say it is improperly called sin, even though in the very principles of nature it chains and restrains man like a ferocious beast? Is this credible? Let Bellarmine believe such absurdities—we do not.”

— John Davenant, Determinationes, Q. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBellarmine+says+that+this+inordinate+concupiscence+is+not+properly+sin.+What+then%3F+Shall+we+say+it+is+improperly+called+sin%2C+even+though+in+the+very+principles+of+nature+it+chains+and+restrains+man+like+a+ferocious+beast%3F+Is+this+credible%3F+Let+Bellarmine+believe+such+absurdities%E2%80%94we+do+not.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Determinationes%2C+Q.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5bc9204dd7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5bc9204dd7.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-72b7111168" data-kw=""><blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote><figcaption>— <a href="../../authors/william-perkins.html">William Perkins</a>, <cite>An Advertisement to all Favorers of the Roman Religion</cite></figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.”

— William Perkins, An Advertisement to all Favorers of the Roman Religion">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFifth%2C+the+last+commandment+of+lust+forbids+the+first+motions+to+sin+that+are+before+consent.+%E2%80%A6+Again%2C+the+philosophers+knew+that+lust+with+consent+was+evil%2C+even+by+the+light+of+nature.+But+Paul%2C+a+learned+Pharisee%2C+and+therefore+more+than+a+philosopher%2C+knew+not+lust+to+be+sin+that+is+forbidden+in+this+commandment+%5BRom.+7%3A7%5D.+Lust+therefore+that+is+forbidden+here%2C+is+without+consent.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Advertisement+to+all+Favorers+of+the+Roman+Religion&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72b7111168.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/72b7111168.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" target="_blank" rel="noopener">Read it online · Internet Archive (appended to A Reformed Catholike, 1597)</a></div></figure><figure class="quote" id="q-240289f8c2" data-kw=""><blockquote><p>Lust in the bud; that is, the first risings of lust, even before the consent of the will to them; the first openings of particular lusts, sometimes not regarded nor noticed, and so neither approved nor disapproved; and sometimes checked in their very rising, Rom. 7:15. But however it be, they are sins here forbidden, though the Papists will not allow them to be so</p></blockquote><figcaption>— <a href="../../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, The Tenth Commandment</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“Lust in the bud; that is, the first risings of lust, even before the consent of the will to them; the first openings of particular lusts, sometimes not regarded nor noticed, and so neither approved nor disapproved; and sometimes checked in their very rising, Rom. 7:15. But however it be, they are sins here forbidden, though the Papists will not allow them to be so”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, The Tenth Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLust+in+the+bud%3B+that+is%2C+the+first+risings+of+lust%2C+even+before+the+consent+of+the+will+to+them%3B+the+first+openings+of+particular+lusts%2C+sometimes+not+regarded+nor+noticed%2C+and+so+neither+approved+nor+disapproved%3B+and+sometimes+checked+in+their+very+rising%2C+Rom.+7%3A15.+But+however+it+be%2C+they+are+sins+here+forbidden%2C+though+the+Papists+will+not+allow+them+to+be+so%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+The+Tenth+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F240289f8c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/240289f8c2.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" target="_blank" rel="noopener">Read it online · Internet Archive (multi-volume)</a></div></figure><figure class="quote" id="q-8f9e8de841" data-kw=""><blockquote><p>If that law demands perfect conformity to the image of God, then these impulses of evil are clearly sinful. … The Protestant doctrine which pronounces these impulsive acts to be of the nature of sin is confirmed by the consciousness of the believer. He recognizes as evil in their own nature the first risings of malice, envy, pride, or cupidity.</p></blockquote><figcaption>— <a href="../../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 2, pt. 2, ch. 8</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../../topics/covenant-and-law/moral-law.html">The Moral Law</a></div><div class="actions"><button class="copy" data-copy="“If that law demands perfect conformity to the image of God, then these impulses of evil are clearly sinful. … The Protestant doctrine which pronounces these impulsive acts to be of the nature of sin is confirmed by the consciousness of the believer. He recognizes as evil in their own nature the first risings of malice, envy, pride, or cupidity.”

— Charles Hodge, Systematic Theology, vol. 2, pt. 2, ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+that+law+demands+perfect+conformity+to+the+image+of+God%2C+then+these+impulses+of+evil+are+clearly+sinful.+%E2%80%A6+The+Protestant+doctrine+which+pronounces+these+impulsive+acts+to+be+of+the+nature+of+sin+is+confirmed+by+the+consciousness+of+the+believer.+He+recognizes+as+evil+in+their+own+nature+the+first+risings+of+malice%2C+envy%2C+pride%2C+or+cupidity.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+2%2C+pt.+2%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f9e8de841.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8f9e8de841.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology2" target="_blank" rel="noopener">Read it online · CCEL, vol. 2</a></div></figure><figure class="quote" id="q-376e0c9c24" data-kw=""><blockquote><p>These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it</p></blockquote><figcaption>— <a href="../../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a>, <cite>An Exposition of the Ten Commandments</cite>, The Tenth Commandment</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome.html" aria-current="page">Rome (General)</a><a class="tag" href="../../topics/fall-and-sin/concupiscence.html">Concupiscence</a></div><div class="actions"><button class="copy" data-copy="“These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it”

cy towards what is sinful, and the first or earliest motions of this tendency in the heart, though not deliberately consented to and followed out, is itself truly and properly sinful.”

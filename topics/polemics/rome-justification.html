Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.”

gcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-justification.html" aria-current="page">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.”

on</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.”

opy" data-copy="“From this interpretation of Andrada I now finally understand what the Tridentine decree is after when it declares that justification consists of two parts, remission of sins and renewal, because they nevertheless say not long afterward that the sole formal cause of justification is the renewal, or love.”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Topic on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+this+interpretation+of+Andrada+I+now+finally+understand+what+the+Tridentine+decree+is+after+when+it+declares+that+justification+consists+of+two+parts%2C+remission+of+sins+and+renewal%2C+because+they+nevertheless+say+not+long+afterward+that+the+sole+formal+cause+of+justification+is+the+renewal%2C+or+love.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+1%2C+Topic+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb37d09fdd4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b37d09fdd4.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a046484a06" data-kw=""><blockquote><p>And consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.</p></blockquote><figcaption>— <a href="../../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-justification.html" aria-current="page">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></div><div class="actions"><button class="copy" data-copy="“And consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Topic on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+consequently+he+contends+that+justification+consists+of+two+parts%2C+namely%2C+reconciliation+and+the+other+new+virtues.+%E2%80%A6+Out+of+these+effects%2C+Andrada%2C+in+his+subtlety%2C+makes+the+cause+and+form+of+justification.+We%2C+indeed%2C+do+not+deny+these+and+other+effects+of+justification%2C+but+we+do+not+say+that+the+effects+are+the+causes.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+1%2C+Topic+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa046484a06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a046484a06.html">Permalink</a><span class="src none">No free online copy linked</span></div></figure><figure class="quote" id="q-a8d5e74bd6" data-kw=""><blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers</p></blockquote><figcaption>— <a href="../../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption><div class="meta"><a class="tag here" href="../../topics/polemics/rome-justification.html" aria-current="page">Rome: Justification</a><a class="tag" href="../../topics/salvation/justification.html">Justification</a><a class="tag" href="../../topics/salvation/imputation.html">Imputation</a></di ce the formal cause of their justification before God for life eternal in the qualities of inherent righteousness; … therefore those who want to be justified in this manner deserve to be always in doubt concerning their salvation.”

teth unto us, whereby we truly both are counted just, and also are so indeed. By which words they understand the renewing of a man now regenerate, and his new forming by grace and the holy Ghost. The which things, that they are done in a man already justified, we deny not: but that justification consisteth therein, we cannot grant.”

n that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification”

e when that righteousness is sought outside ourselves.”

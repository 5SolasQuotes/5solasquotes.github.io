</figure><figure class="quote" id="q-4e8ed2d62a" data-kw="">
<blockquote><p>Things that are false will accomplish a great many useful things in the world. If I take a counterfeit coin and buy a dinner with it, the dinner is every bit as good as if the coin were a product of the mint. And what a very useful thing a dinner is! But just as I am on my way downtown to buy a dinner for a poor man, an expert tells me that my coin is a counterfeit. The miserable, heartless theorizer! While he is going into uninteresting, learned details about the primitive history of that coin, a poor man is dying for want of bread. So it is with faith. Faith is so very useful, they tell us, that we must not scrutinize its basis in truth. But, the great trouble is, such an avoidance of scrutiny itself involves the destruction of faith. For faith is essentially dogmatic. Despite all you can do, you cannot remove the element of intellectual assent from it. Faith is the opinion that some person will do something for you. If that person really will do that thing for you, then the faith is true. If he will not do it, then the faith is false. In the latter case, not all the benefits in the world will make the faith true. Though it has transformed the world from darkness to light, though it has produced thousands of glorious healthy lives, it remains a pathological phenomenon. It is false, and sooner or later it is sure to be found out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (1923), pp. 142-43</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-96cc71b43c" data-kw="">
<blockquote><p>Almost all our contentions and divisions are caused by the ignorance and injudiciousness of Christians, especially the most self-conceited. They are for the most as children, that yet need to be taught the very principles of the divine oracles, and to be fed with milk when they think themselves fit to be teachers of others, Heb. 5:11-12, and therefore [are] as children they are tossed to and fro and caried about with every wind of doctrine, Eph. 4:14. And when they have many years together been crying up an opinion and vilifying dissenters, at last they turn to some other opinion and confess that they did all this upon mistake. And was it not a pitiful life that they lived that while? and a pitiful zeal which did set them on? and a pitiful kind of worship which they thus offered to God? Alas to hear a man pray and preach up Antinomianism one year, and Arminianism the next, and Socinianism the next! To hear a man make Separation and Anabaptistry a great part of his business to men in preaching and to God in prayer for seven and seven years together; and at last confess that all this was his error and his sin (or if he confess it not, it is so much the worse). Is it not sad that ignorance and hasty rashness should so much injure the Church and men’s souls that so many well-meaning people should put evil for good and good for evil, darkness for light and light for darkness, Isa. 5:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>In several sorts of controversies and cases you must prefer several sorts of guides or judges: It is a grand pernicious error to think that the same men’s judgments must be most followed in every case. And it is of grand importance to know how to value and vary our guides, as the cases vary. And for the most part every man is more to be regarded in his own way of study and profession than wiser men in other matters of other studies and professions.</p></blockquote>

<blockquote><p>But because there is no hope that most should be judicious, there is no other remedy for such but this of Christ’s prescript which I have here set down: First, happy is he that chooses a judicious faithful guide and learns of him till his own understanding be better illuminated; and that escapes the conduct of ignorant, erroneous, self-seeking, proud, dividing teachers. Secondly, continue in the communion of the generality of agreeing Christians: The generality of the godly are more unlikely to be forsaken of Christ than a few odd self-conceited singular professors. This is the way of peace to yourselves and to the Church of Christ.</p></blockquote>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks:

1. It is more for controversies and speculations than for practical holiness.

2. It is selfish and kindled by an overvaluing their own conceits or ways.

3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church.

4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like.

5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

py+wishes+and+sitting+still%3F+I+am+sure+this+agrees+not+with+the+precepts+of+the+Spirit.+%E2%80%98Follow+peace+with+all+men%2C%E2%80%99+Heb.+12%3A14.+If+it+be+possible%2C+as+much+as+in+you+lies%2C+live+peaceably+with+all+men%2C+Rom.+12%3A18.+It%E2%80%99s+a+sorry+surgeon%2C+or+physician+that+will+think+it+enough+to+wish+well+to+their+patient%3A+the+House+of+God+will+be+neither+built%2C+nor+repaired+without+zeal+and+industry+and+patience+in+the+work.+If+men%E2%80%99s+hearts+were+set+upon+the+Church%E2%80%99s+peace%2C+and+they+did+but+feel+the+disjoiting+of+her+members%2C+the+breaking+of+her+bones%2C+and+the+smart+of+her+wounds%2C+as+sensibly+as+they+feel+the+like+in+their+own+bodies%3B+and+if+ministers+and+other+Christians+were+as+sensible+of+the+evil+of+divisions+as+they+are+of+drunkenness%2C+and+whoredom%2C+and+such+other+sins%2C+and+if+we+were+all+awakened+to+quench+the+flames+of+the+Church%2C+as+earnestly+as+we+would+do+the+fire+in+our+houses%2C+and+would+preach+for+peace+and+pray+for+peace%2C+and+plead+and+labor+and+suffer+for+peace%2C+then+some+good+might+be+done+on+it%2C+against+the+rage+and+multitude+of+dividers.+%E2%80%A6+8.+Another+hindrance+of+unity+and+peace+is+a+carnal+zeal+in+matters+of+religion%2C+which+is+frequently+mistaken+for+the+true+zeal+of+the+saints.+When+men+are+confident+that+their+opinions+are+the+truth%2C+and+overvalue+them+as+to+the+necessity+%28because+they+are+their+own%2C+though+they+observe+not+the+reason%29%2C+they+presently+think+they+must+be+hot+against+all+the+gainsayers+of+their+opinions%3B+and+herein+they+place+the+most%2C+or+at+least+too+much%2C+of+their+religion.+There%E2%80%99s+not+one+of+many+that+has+this+zeal+but+thinks+it+is+of+God+and+is+part+of+their+holiness%2C+when+as+it+is+often+from+the+Devil+and+the+flesh%2C+even+when+the+doctrine+is+true+which+they+contend+for.+You+may+know+it+from+true+zeal+by+these+following+marks%3A+1.+It+is+more+for+controversies+and+speculations+than+for+practical+holiness.+2.+It+is+selfish+and+kindled+by+an+overvaluing+their+own+conceits+or+ways.+3.+It+is+private+and+would+promote+a+lower+truth+to+the+loss+of+a+greater%2C+or+a+doubtful+point%2C+to+the+loss+of+undoubted+truth%3B+or+a+single+truth%2C+to+the+loss+or+hindrance+of+the+body+of+common+truth%3B+and+it+is+hotter+for+a+party+than+for+the+catholic+Church%2C+and+will+promote+the+interest+of+an+opinion+or+purity+to+the+wrong+of+the+common+interest+of+the+Church.+4.+It+is+blind+and+carries+men+to+sinful+means%2C+as+resisting+authority%2C+order+or+ordinances%2C+or+the+like.+5.+It+is+unmerciful+and+unpeaceable%2C+and+little+sensible+of+the+case+of+others+or+smart+of+the+divided+Church.+Many+are+calling+for+fire+from+Heaven+for+the+cause+of+Christ%2C+that+little+know+what+spirit+they+are+of%2C+Lk.+9%3A55.+O+how+true+is+this+of+many+that+think+they+excel+in+knowledge+or+zeal+and+are+but+defending+the+truth+against+erroneous+adversaries.+But+%E2%80%98who+is+the+wise+man+and+endued+with+knowledge+among+you%3F+let+him+show+out+of+a+good+conversation%2C+his+works+with+meekness+of+wisdom%3A+But+if+you+have+bitter+envying+and+strife+in+your+hearts%2C+glory+not%2C+and+lie+not+against+the+truth%3A+This+wisdom+descends+not+from+above%2C+but+is+earthly%2C+sensual%2C+devilish%3A+For+where+envying+and+strife+is%2C+there+is+confusion%2C+and+every+evil+work%3A+But+the+wisdom+that+is+from+above%2C+is+first+pure%2C+then+peaceable%2C+gentle%2C+and+easy+to+be+entreated%2C+full+of+mercy+and+good+fruits%2C+without+partiality%2C+without+hypocrisy%3B+And+the+fruit+of+righteousness+is+sown+in+peace+of+them+that+make+peace.%E2%80%99+Jam.+3%3A13+to+the+end.+But+of+this+I+have+formerly+spoken+at+large+in+many+sermons+on+these+words+of+James.+Dividing+zeal+is+a+grievous+distracter+of+the+Church%E2%80%99s+peace.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+True+Catholic%2C+%26+Catholic+Church+Described%2C+%E2%80%A6+%28London%3A+A.M.%2C+1660%29%2C+pp.+158-62+%26+184-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f64231e22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6f64231e22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-zeal/#:~:text=5.%20A%20peaceable%20spirit%20must%20have,grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace&amp;text=5.%20A%20peaceable%20spirit%20must%20have%20a%20high&amp;text=is%20a%20grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. He that mistakingly thinks any thing is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him.

6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes.

7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. …

18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct].

19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>

<blockquote><p>It is not enough for us to know that Jesus is great and good; it is not enough for us to know that He was instrumental in the creation of the world and that He is now seated on the throne of all being. These things are indeed necessary to faith, but they are not all that is necessary; if we are to trust Jesus, we must come to Him personally and individually with some need of the soul which He alone can relieve. That need of the soul from which Jesus alone can save is sin. But when I say “sin,” I do not mean merely the sins of the world or the sins of other people, but I mean your sin—your sin and mine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Faith?</cite>, (Grand Rapids: Eerdmans, 1946), 118–19.</span></figcaption>

</figure><figure class="quote" id="q-cf02910fc3" data-kw="">
<blockquote><p>We adults, who are imbued with the noxious doctrine of the papists, which we absorbed into our very bones and marrow, acquired an opinion of Christ altogether different from the one that Paul sets forth here. No matter how much we declared with our mouths that Christ had redeemed us from the tyranny and slavery of the Law, actually we felt in our hearts that He was a lawgiver, a tyrant, and a judge more fearful than Moses himself. Even today, in the great light of the truth, we cannot completely banish this wicked opinion from our minds. So stubbornly do things to which we have been accustomed since youth cling to us! You young people, who are still unspoiled and have never been infected by this wicked notion, have less difficulty in teaching purely about Christ than we adults have in banishing these blasphemous illusions about Him from our minds. Yet you have not altogether escaped the wiles of the devil. For even if you have not yet been imbued with this wicked idea of Christ as a lawgiver, you still have the same source of this idea in you, namely, the flesh, the reason, and the wickedness of our nature, which cannot think of Christ in any other way than as a lawgiver. Therefore you must contend with all your might, in order that you may learn to acknowledge and regard Christ as Paul portrays Him in this passage [Gal. 4:4-5]. But if, in addition to the wickedness of our nature, there come wicked teachers—of whom the world is full today, both the old and the new variety—they lend support to the wickedness of our nature; and the evil is doubled. For when wicked instruction is applied to a nature that is already corrupted in itself, it is impossible not to develop a false Christ. As I have said, reason invents him on its own; and then bad instruction makes him grow and impresses him on our minds so strongly that he cannot be eliminated without great labor and effort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 368–369.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“We adults, who are imbued with the noxious doctrine of the papists, which we absorbed into our very bones and marrow, acquired an opinion of Christ altogether different from the one that Paul sets forth here. No matter how much we declared with our mouths that Christ had redeemed us from the tyranny and slavery of the Law, actually we felt in our hearts that He was a lawgiver, a tyrant, and a judge more fearful than Moses himself. Even today, in the great light of the truth, we cannot completely banish this wicked opinion from our minds. So stubbornly do things to which we have been accustomed since youth cling to us! You young people, who are still unspoiled and have never been infected by this wicked notion, have less difficulty in teaching purely about Christ than we adults have in banishing these blasphemous illusions about Him from our minds. Yet you have not altogether escaped the wiles of the devil. For even if you have not yet been imbued with this wicked idea of Christ as a lawgiver, you still have the same source of this idea in you, namely, the flesh, the reason, and the wickedness of our nature, which cannot think of Christ in any other way than as a lawgiver. Therefore you must contend with all your might, in order that you may learn to acknowledge and regard Christ as Paul portrays Him in this passage [Gal. 4:4-5]. But if, in addition to the wickedness of our nature, there come wicked teachers—of whom the world is full today, both the old and the new variety—they lend support to the wickedness of our nature; and the evil is doubled. For when wicked instruction is applied to a nature that is already corrupted in itself, it is impossible not to develop a false Christ. As I have said, reason invents him on its own; and then bad instruction makes him grow and impresses him on our minds so strongly that he cannot be eliminated without great labor and effort.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 368–369.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+adults%2C+who+are+imbued+with+the+noxious+doctrine+of+the+papists%2C+which+we+absorbed+into+our+very+bones+and+marrow%2C+acquired+an+opinion+of+Christ+altogether+different+from+the+one+that+Paul+sets+forth+here.+No+matter+how+much+we+declared+with+our+mouths+that+Christ+had+redeemed+us+from+the+tyranny+and+slavery+of+the+Law%2C+actually+we+felt+in+our+hearts+that+He+was+a+lawgiver%2C+a+tyrant%2C+and+a+judge+more+fearful+than+Moses+himself.+Even+today%2C+in+the+great+light+of+the+truth%2C+we+cannot+completely+banish+this+wicked+opinion+from+our+minds.+So+stubbornly+do+things+to+which+we+have+been+accustomed+since+youth+cling+to+us%21+You+young+people%2C+who+are+still+unspoiled+and+have+never+been+infected+by+this+wicked+notion%2C+have+less+difficulty+in+teaching+purely+about+Christ+than+we+adults+have+in+banishing+these+blasphemous+illusions+about+Him+from+our+minds.+Yet+you+have+not+altogether+escaped+the+wiles+of+the+devil.+For+even+if+you+have+not+yet+been+imbued+with+this+wicked+idea+of+Christ+as+a+lawgiver%2C+you+still+have+the+same+source+of+this+idea+in+you%2C+namely%2C+the+flesh%2C+the+reason%2C+and+the+wickedness+of+our+nature%2C+which+cannot+think+of+Christ+in+any+other+way+than+as+a+lawgiver.+Therefore+you+must+contend+with+all+your+might%2C+in+order+that+you+may+learn+to+acknowledge+and+regard+Christ+as+Paul+portrays+Him+in+this+passage+%5BGal.+4%3A4-5%5D.+But+if%2C+in+addition+to+the+wickedness+of+our+nature%2C+there+come+wicked+teachers%E2%80%94of+whom+the+world+is+full+today%2C+both+the+old+and+the+new+variety%E2%80%94they+lend+support+to+the+wickedness+of+our+nature%3B+and+the+evil+is+doubled.+For+when+wicked+instruction+is+applied+to+a+nature+that+is+already+corrupted+in+itself%2C+it+is+impossible+not+to+develop+a+false+Christ.+As+I+have+said%2C+reason+invents+him+on+its+own%3B+and+then+bad+instruction+makes+him+grow+and+impresses+him+on+our+minds+so+strongly+that+he+cannot+be+eliminated+without+great+labor+and+effort.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+368%E2%80%93369.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcf02910fc3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/cf02910fc3.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/02/luther-we-must-strive-to-think-of-jesus-as-paul-does-not-as-rome-does/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Man is endowed with reason, and the human reason cannot rest satisfied with a mere collection of separate truths, but wants to see them in their mutual relationship, in order that it may have a clearer understanding of them… There seems to be a lurking fear that the more we systematize the truth, the farther we wander from the presentation of it that is found in the Word of God. But there is no danger of this, if the system is not based on the fundamental principles of some erring philosophy, but on the abiding principles of Scripture itself. God certainly sees the truth as a whole, and it is the duty of theologian to think the truths of God after Him. There should be a constant endeavor to see the truth as God sees it, even though it is perfectly evident that the ideal is beyond the grasp of man in his present condition.</p></blockquote>

<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>

<blockquote><p>Even pictures of Jesus can only hinder our understanding of God’s truth. For instance, no true picture of Jesus exists, so the ones artists do make merely reflect the artist’s own image of our Savior rather than what God has sovereignly revealed by his word. An image also cannot truly reflect the deity of Christ, only his humanity, which again serves only to limit our knowledge of Christ Jesus.</p></blockquote>

<blockquote><p>7. Q. If for the reasons given, then, the only way to eternal life is the crucified Jesus, truly God and truly human, does it not necessarily follow that all other religions or faiths, which present other ways and means to eternal life, are false? A. Only the Christian religion and faith is the true faith; all others are false. For only Christians recognize God as one true God, who is perfectly just and perfectly merciful and thus the true God. He is perfectly just in that He does not leave sin unpunished but punished each and every sin with unspeakable hellish torment in His Son on the wood of the cross, whereby not a half but a full and just payment for our sins was made. He is perfectly merciful in that He makes us pay absolutely nothing but out of sheer mercy gave us the Son for our payment, without any merit on our part, while we were yet sinners. By contrast, all other religions and faiths do not recognize God as perfectly just and merciful. Think once of the Jews, the Turks, or the Papists, who know by nature that God is just and will not leave sin unpunished. Yet, when their consciences bother them, they come and offer a gift upon the altar, hoping thereby to buy off God for sins that deserve eternal damnation. That is just like a thief or murderer who, in trying to buy off the judge with money or a gift, shows that he does not consider the judge to be just; otherwise he would not expect to be able to bribe him. Since, then, religions other than Christianity cannot bring to the judgment seat of God a full payment (which only Christ can do) but only a few trifling merits and tattered works, not even a thousandth the size of the sin they wish to pay with them, it is certain that these other religions do not regard God as perfectly just. By the same token, they do not regard him as perfectly merciful either, for they think that they have already made half the payment with their offerings and worship. But God is not half-just and half-merciful; He is completely so and wishes to be regarded and recognized as such. Therefore, all other religions, however many there are, in fact rob God of His perfect justice and mercy, because they worship not the true God but an idol that they themselves have conjured up and that is neither perfectly just nor perfectly merciful—in short, not the true God.

8. Q. Just as there is only one way to salvation, the crucified Christ, there is also only one doctrine of salvation that freely and graciously offers us Christ and all His benefits for our possession. What is this doctrine? A. The gospel. Because it contains promises of salvation, it is called the gospel of salvation, a word of salvation, and a power of God unto salvation (Rom. 1[:16]). Of course the law leads us by the hand, as it were, to this doctrine. For after we are convicted of our unrighteousness and smitten with the awareness of eternal death, the law teaches us not to seek salvation in ourselves but to accept by faith the salvation offered us outside of ourselves in the gospel. St. Paul speaks of this in Rom. 10[:4]: “The end of the law is Christ for righteousness to every believer.” Also, “The law was our tutor to bring us to Christ” (Gal. 3[:24]).</p></blockquote>

8. Q. Just as there is only one way to salvation, the crucified Christ, there is also only one doctrine of salvation that freely and graciously offers us Christ and all His benefits for our possession. What is this doctrine? A. The gospel. Because it contains promises of salvation, it is called the gospel of salvation, a word of salvation, and a power of God unto salvation (Rom. 1[:16]). Of course the law leads us by the hand, as it were, to this doctrine. For after we are convicted of our unrighteousness and smitten with the awareness of eternal death, the law teaches us not to seek salvation in ourselves but to accept by faith the salvation offered us outside of ourselves in the gospel. St. Paul speaks of this in Rom. 10[:4]: “The end of the law is Christ for righteousness to every believer.” Also, “The law was our tutor to bring us to Christ” (Gal. 3[:24]).”

tattered+works%2C+not+even+a+thousandth+the+size+of+the+sin+they+wish+to+pay+with+them%2C+it+is+certain+that+these+other+religions+do+not+regard+God+as+perfectly+just.+By+the+same+token%2C+they+do+not+regard+him+as+perfectly+merciful+either%2C+for+they+think+that+they+have+already+made+half+the+payment+with+their+offerings+and+worship.+But+God+is+not+half-just+and+half-merciful%3B+He+is+completely+so+and+wishes+to+be+regarded+and+recognized+as+such.+Therefore%2C+all+other+religions%2C+however+many+there+are%2C+in+fact+rob+God+of+His+perfect+justice+and+mercy%2C+because+they+worship+not+the+true+God+but+an+idol+that+they+themselves+have+conjured+up+and+that+is+neither+perfectly+just+nor+perfectly+merciful%E2%80%94in+short%2C+not+the+true+God.+8.+Q.+Just+as+there+is+only+one+way+to+salvation%2C+the+crucified+Christ%2C+there+is+also+only+one+doctrine+of+salvation+that+freely+and+graciously+offers+us+Christ+and+all+His+benefits+for+our+possession.+What+is+this+doctrine%3F+A.+The+gospel.+Because+it+contains+promises+of+salvation%2C+it+is+called+the+gospel+of+salvation%2C+a+word+of+salvation%2C+and+a+power+of+God+unto+salvation+%28Rom.+1%5B%3A16%5D%29.+Of+course+the+law+leads+us+by+the+hand%2C+as+it+were%2C+to+this+doctrine.+For+after+we+are+convicted+of+our+unrighteousness+and+smitten+with+the+awareness+of+eternal+death%2C+the+law+teaches+us+not+to+seek+salvation+in+ourselves+but+to+accept+by+faith+the+salvation+offered+us+outside+of+ourselves+in+the+gospel.+St.+Paul+speaks+of+this+in+Rom.+10%5B%3A4%5D%3A+%E2%80%9CThe+end+of+the+law+is+Christ+for+righteousness+to+every+believer.%E2%80%9D+Also%2C+%E2%80%9CThe+law+was+our+tutor+to+bring+us+to+Christ%E2%80%9D+%28Gal.+3%5B%3A24%5D%29.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+A+Firm+Foundation%3A+An+Aid+to+Interpreting+the+Heidelberg+Catechism%2C+trans.+Lyle+D.+Bierma%2C+Texts+and+Studies+in+Reformation+and+Post-Reformation+Thought+%28Carlisle%2C+United+Kingdom%3B+Grand+Rapids%2C+MI%3A+Paternoster+Press%3B+Baker+Books%2C+1 <blockquote><p>What is the duty of Christian men at such at time? What is the duty, in particular, of Christian officers in the Church? In the first place, they should encourage those who are engaging in the intellectual and spiritual struggle. They should not say, in the sense in which some laymen say it, that more time should be devoted to the propagation of Christianity, and less to the defence of Christianity. Certainly there should be propagation of Christianity. Believers should certainly not content themselves with warding off attacks, but should also unfold in an orderly and positive way the full riches of the gospel. But far more is usually meant by those who call for less defence and more propagation. What they really intend is the discouragement of the whole intellectual defence of the faith. And their words come as a blow in the face of those who are fighting the great battle. As a matter of fact, not less time, but more time, should be devoted to the defence of the gospel. Indeed, truth cannot be stated clearly at all without being set over against error. Thus a large part of the New Testament is polemic; the enunciation of evangelical truth was occasioned by the errors which had arisen in the churches. So it will always be, on account of the fundamental laws of the human mind. Moreover, the present crisis must be taken into account. There may have been a day when there could be propagation of Christianity without defence. But such a day at any rate is past. At the present time, when the opponents of the gospel are almost in control of our churches, the slightest avoidance of the defence of the gospel is just sheer unfaithfulness to the Lord. There have been previous great crises in the history of the Church, crises almost comparable to this. One appeared in the second century, when the very life of Christendom was threatened by the Gnostics. Another came in the Middle Ages when the gospel of God’s grace seemed forgotten. In such times of crisis, God has always saved the Church. But He has always saved it not by theological pacifists, but by sturdy contenders for the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (New York: Macmillan, 1923), p. 147</span></figcaption>

<blockquote><p>1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.</p></blockquote>

<blockquote><p>Now it is certain that in the Law there is prescribed to men a rule by which they ought to regulate their life, so as to obtain salvation in the sight of God. That the Law can do nothing else than condemn, and is therefore called the doctrine of death, and is said by Paul to increase transgressions, (Rom. 7:13,) arises not from any fault of its doctrine, but because it is impossible for us to perform what it enjoins. Therefore, though no man is justified by the Law, yet the Law itself contains the highest righteousness, because it does not falsely hold out salvation to its followers, if any one fully observed all that it commands. Nor ought we to look upon this as a strange manner of teaching, that God first demands the righteousness of works, and next offers a gratuitous righteousness without works; for it is necessary that men should be convinced of their righteous condemnation, that they may betake themselves to the mercy of God. Accordingly, Paul (Rom. 10:5, 6) compares both kinds of righteousness, in order to inform us that the reason why we are freely justified by God is, that we have no righteousness of our own. Now Christ in this reply accommodated himself to the lawyer, and attended to the nature of his question; for he had inquired not how salvation must be sought, but by what works it must be obtained.</p></blockquote>

— John Calvin, Commentary on a Harmony of the Evangelists, trans. William Pringle, (repr. Bellingham, WA: Logos Bible Software, 2010), 3.56–57.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+it+is+certain+that+in+the+Law+there+is+prescribed+to+men+a+rule+by+which+they+ought+to+regulate+their+life%2C+so+as+to+obtain+salvation+in+the+sight+of+God.+That+the+Law+can+do+nothing+else+than+condemn%2C+and+is+therefore+called+the+doctrine+of+death%2C+and+is+said+by+Paul+to+increase+transgressions%2C+%28Rom.+7%3A13%2C%29+arises+not+from+any+fault+of+its+doctrine%2C+but+because+it+is+impossible+for+us+to+perform+what+it+enjoins.+Therefore%2C+though+no+man+is+justified+by+the+Law%2C+yet+the+Law+itself+contains+the+highest+righteousness%2C+because+it+does+not+falsely+hold+out+salvation+to+its+followers%2C+if+any+one+fully+observed+all+that+it+commands.+Nor+ought+we+to+look+upon+this+as+a+strange+manner+of+teaching%2C+that+God+first+demands+the+righteousness+of+works%2C+and+next+offers+a+gratuitous+righteousness+without+works%3B+for+it+is+necessary+that+men+should+be+convinced+of+their+righteous+condemnation%2C+that+they+may+betake+themselves+to+the+mercy+of+God.+Accordingly%2C+Paul+%28Rom.+10%3A5%2C+6%29+compares+both+kinds+of+righteousness%2C+in+order+to+inform+us+that+the+reason+why+we+are+freely+justified+by+God+is%2C+that+we+have+no+righteousness+of+our+own.+Now+Christ+in+this+reply+accommodated+himself+to+the+lawyer%2C+and+attended+to+the+nature+of+his+question%3B+for+he+had+inquired+not+how+salvation+must+be+sought%2C+but+by+what+works+it+must+be+obtained.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+a+Harmony+of+the+Evangelists%2C+trans.+William+Pringle%2C+%28repr.+Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2010%29%2C+3.56%E2%80%9357.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c9407c4aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4c9407c4aa.html">Permalink</a>< </figure><figure class="quote" id="q-9b963fadac" data-kw="">
<blockquote><p>In the first place, it will be said, are we not failing to do justice to the true humanity of Jesus, which is affirmed by the creeds of the Church as well as by the modern theologians? When we say that Jesus could not illustrate Christian faith any more than God can be religious, are we not denying to Jesus that religious experience which is a necessary element in true humanity? Must not Jesus, if He be true man, have been more than the object of religious faith; must He not have had a religion of His own? The answer is not far to seek. Certainly Jesus had a religion of His own; His prayer was real prayer, His faith was real religious faith. His relation to His heavenly Father was not merely that of a child to a father; it was that of a man to his God. Certainly Jesus had a religion; without it His humanity would indeed have been but incomplete. Without doubt Jesus had a religion; the fact is of the utmost importance. But it is equally important to observe that religion which Jesus had was not Christianity. Christianity is a way of getting rid of sin, and Jesus was without sin. His religion was a religion of Paradise, not a religion of sinful humanity. It was a religion to which we may perhaps in some sort attain heaven, when the process of our purification is complete (though even then the memory of redemption will never leave us); but certainly it is not a religion with which we can begin. The religion of Jesus was a religion of untroubled sonship; Christianity is a religion of the attainment of sonship by the redeeming work of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism, New Edition</cite>, (Grand Rapids, MI; Cambridge, U.K.: William B. Eerdmans Publishing Company, 2009), 78–79.</span></figcaption>

<blockquote><p>Yet this is not the whole truth of the matter. We do assert that God, that is, the whole Godhead, is one person…. In other words, we are bound to maintain the identity of the attributes of God with the being of God in order to avoid the specter of brute fact.” …Over against all other beings, that is over against created beings, we must therefore hold that God’s being presents an absolute numerical identity. And even within the ontological Trinity we must maintain that God is numerically one. He is one person. We say that we believe in a personal God we do not merely mean that we believe in a God to whom the adjective “personality” may be attached. God is not an essence that has personality; He is absolute personality. Yet, within the being of the one person we are permitted and compelled by Scripture to make the distinction between a specific or generic type of being, and three personal subsistences.</p></blockquote>

<blockquote><p>And thus beauty, which is indeed God’s handiwork, but only a temporal, carnal, and lower kind of good, is not fitly loved in preference to God, the eternal, spiritual, and unchangeable good. When the miser prefers his gold to justice, it is through no fault of the gold, but of the man; and so with every created thing. For though it be good, it may be loved with an evil as well as with a good love: it is loved rightly when it is loved ordinately; evilly, when inordinately. It is this which some one has briefly said in these verses in praise of the Creator: “These are Thine, they are good, because Thou art good who didst create them. There is in them nothing of ours, unless the sin we commit when we forget the order of things, and instead of Thee love that which Thou hast made.” But if the Creator is truly loved, that is, if He Himself is loved and not another thing in His stead, He cannot be evilly loved; for love itself is to be ordinately loved, because we do well to love that which, when we love it, makes us live well and virtuously. So that it seems to me that it is a brief but true definition of virtue to say, it is the order of love; and on this account, in the Canticles, the bride of Christ, the city of God, sings, “Order love within me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop of Hippo. The City of God, XV.22</cite></span></figcaption>

<blockquote><p>Dr. Girardeau has defended the old usage of our church with a moral courage, loyalty to truth, clearness of reasoning and wealth of learning which should make every true Presbyterian proud of him, whether he adopts his conclusions or not. The framework of his arguments is this: it begins with that vital truth which no Presbyterian can discard without a square desertion of our principles. The man who contests this first premise had better set out at once for Rome: God is to be worshipped only in the ways appointed in his word. Every act of public cultus not positively enjoined by him is thereby forbidden. Christ and his apostles ordained the musical worship of the New Dispensation without any sort of musical instrument, enjoining only the singing with the voice of psalms, hymns, and spiritual songs. Hence such instruments are excluded from Christian worship. Such has been the creed of all churches, and in all ages, except of the Popish communion after it had reached the nadir of its corruption at the end of the thirteenth century, and of its prelatic imitators.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Girardeau on Musical Instruments</cite></span></figcaption>

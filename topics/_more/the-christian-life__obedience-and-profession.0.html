<blockquote><p>Though sin be forgiven, yet there may be the sense of God’s displeasure still; for, as though God doth forgive, there are many calamities and pressures upon the godly: so though Christ hath born the agonies that do belong unto sin, yet some scalding drops of them do fall upon the godly; not that the godly is by these to satisfy the justice of God, but that hereby we might feel the bitterness of sin, what wormwood and gall is in it, that so we may take heed for the future, and that we may by some proportion think on, and admire the great love of Christ to us, in undergoing such wrath.

Didst thou not judge the least of his anger falling upon thee more terrible, then all the pains and miseries that ever thou wast plunged into? And by this then, thou mayest stand amazed, and wondering at this infinite love of Christ to stand under this burden for thee. David is a pregnant instance for the truth of this. As when Saul was angry with Jonathan, and run a Javelin at him, he escaped, and that run into the wall; so the wrath of God, which was violently to fall upon thee, missed thee, and ran into Christ. But the sense of God’s displeasure for sin, may be retained in us two ways;

1. Servilely and slavishly whereby we run from the promise and Christ, and have secret grudgings and repinings against God: this is sinful for us to do.

2. There is a filial apprehending of God’s displeasure, though we are persuaded of the pardon; this is good and necessary, as we see in David, who made that Psalm of Repentance, Psal. 51. though he had his absolution from his sin. Tears in the soul by the former way, are like the water of the Sea, salt and brackish; but those in the latter are sweet, like the rain of the Clouds falling down on the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 22.</span></figcaption>

<blockquote><p>For the preaching of error is like the selling of poisoned pestied [sic] bread, that slays the eater of it, and infects with the breath every man that comes near hand; and albeit the Lord hath brought in wholesome food in his house, and lies held his table long covered, yet the malice of Satan, and the business of the Pope to recover his kingdom, and the dalliance of worldly men, lies set instruments on foot to trouble our Church again; and God, in his deep wisdom and justice, has suffered, the matter to go that far on, that we might see what a fearful sin it was to put the keys of the house of God in wrong hands, and what evil freicks [sic], errors in discipline would bring forth, and also that he might punish the unsanctified and proud wits of men that would take upon them to govern his Kirk, as also he would have these ministers in this land corrected for their negligence who are like the rest of the country, who thinks of arms whilst they are in peace. So have we done. In time of peace we were all secure, and dreamed not of straits, and studied for no more but to get any sermon in the week; yet blessed be our God, who has also many painful and faithful servants as will be sufficient to clear his truth of his Kirk against all that will say the contrary.</p></blockquote>

<blockquote><p>You are going to receive your king in communion. And when your king comes into your soul, it must be very tranquil and still. Your thoughts must be marked with the deepest peace. But you were treated most unjustly and you cannot bear to put aside your anger.

Why, then, do you do even greater wrong and more serious harm to yourself? Whatever your enemy may do to you, he will not treat you as badly as you treat yourself if you refuse to be reconciled to him and if you keep trampling underfoot the laws of God.

Did your foe outrage you? Tell me, is that why you outrage God? To refuse to be reconciled to the enemy who has caused you pain is not the act of a man who is taking revenge on his foe. It is the act of a man who is outraging God, who gave us these laws. Therefore, do not look back on the foe who is your fellow servant; do not look back on how deeply he has harmed you.

Rather, put God before your mind and the fear of him which you should feel. Force yourself to be reconciled to the enemy whose countless evil acts have caused you pain. Then, consider that the greater the violence you will endure in your own soul, the greater will be the honour you will enjoy from God, who gave these commandments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incomprehensible Nature of God</cite>, (c. 386-98), trans. Paul W. Harkins, The Fathers of the Church: A New Translation, Volume 72 (Washington D.C.: The Catholic University of America Press, 1982), 6.39-40, p. 183.</span></figcaption>

<blockquote><p>Something must be done, for the country North and South has gone mad in its craze for gold, and to gain its selfish end it is willing to sacrifice principle, the Negro, the Bible yea, God himself—I speak it with awe and reverence. But God is our refuge. That is if we honour and serve Him. Are we as a people doing it?

</figure><figure class="quote" id="q-0f2cdba7fc" data-kw="">
<blockquote><p>It is a noble temper to be afraid of sin. If a person pretends conscience for a particular opinion and practice, and in the mean time be a common drunkard, swearer, liar, blasphemer, unclean person, one that lives as it were without God in the World, making no conscience of reading the Scripture, praying, bringing up and governing his Family in the nurture and fear of the Lord, only pretends conscience as to baptizing of Children, keeping the Seventh day Sabbath; this man is an hypocrite, and dissembles with God and men for there is an uniformity in conscience, and it would certainly oblige him to avoid known and confessed sins, as much as what he doth fancy is a sin, and as much oblige him to all, as to any known duty.

But where I see a Christian walking close with God in the general of his conversation, and differing from me in this or that point, because he thinks he cannot without sin believe and practise what I do; I cannot but love and honour him, and be very far from their Religion who think it the best and most Gospel way to cudgel him into my Persuasion: A Gaol, or a Fire and Faggots never yet cured an erring Conscience. Such Brethren though overtaken with a fault are certainly (according to the Apostle’s counsel) to be restored in the spirit of meekness, and to be dealt with, (like rational Creatures) argued, and treated, and persuaded out of their mistakes, not cudgelled out of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-ad20e8b45f" data-kw="">
<blockquote><p>First then for the Grace it self, What is Zeal?

It is a holy Ardour kindled by the holy Spirit of God in the affections, improving a man to the utmost for God’s glory, and the Churches good; Zelus est intensus gradus purae affectionis: It is not so much any one affection, as the intended degree of all. Affections are the motions of the Will, as carried out to the prosecution of good, or avoiding of evil: They are, as the Philosopher speaks, exitus animae, the out-goings of the soul. What the Wheels are to the Cart, the Sinews to the Body, Wings to the Bird, the Wind to the Sails spread, such are the Affections to the Soule, implanted by God to carry it hither and thither as the objects do more or less affect. Man lies like a log, the soul moves not, but as the Affections stir.

For their order they are so placed in the soul, as that they are subservient one to another; the irascible to the concupiscible. When the desiring faculties flag, grow remiss by intervenient impediments, then comes in the irascible faculties, as removens impedimenta, as taking away the impediments; and is not this that which is properly called Anger? This made Luther to say, Ira suo loco est optimum Dei donum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/oliver-bowles.html">Oliver Bowles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers</cite>, (London: Samuel Gellibrand, 1643), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

— Oliver Bowles, Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers, (London: Samuel Gellibrand, 1643), pp 5-6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+then+for+the+Grace+it+self%2C+What+is+Zeal%3F%0A%0AIt+is+a+holy+Ardour+kindled+by+the+holy+Spirit+of+God+in+the+affections%2C+improving+a+man+to+the+utmost+for+God%E2%80%99s+glory%2C+and+the+Churches+good%3B+Zelus+est+intensus+gradus+purae+affectionis%3A+It+is+not+so+much+any+one+affection%2C+as+the+intended+degree+of+all.+Affections+are+the+motions+of+the+Will%2C+as+carried+out+to+the+prosecution+of+good%2C+or+avoiding+of+evil%3A+They+are%2C+as+the+Philosopher+speaks%2C+exitus+animae%2C+the+out-goings+of+the+soul.+What+the+Wheels+are+to+the+Cart%2C+the+Sinews+to+the+Body%2C+Wings+to+the+Bird%2C+the+Wind+to+the+Sails+spread%2C+such+are+the+Affections+to+the+Soule%2C+implanted+by+God+to+carry+it+hither+and+thither+as+the+objects+do+more+or+less+affect.+Man+lies+like+a+log%2C+the+soul+moves+not%2C+but+as+the+Affections+stir.%0A%0AFor+their+order+they+are+so+placed+in+the+soul%2C+as+that+they+are+subservient+one+to+another%3B+the+irascible+to+the+concupiscible.+When+the+desiring+faculties+flag%2C+grow+remiss+by+intervenient+impediments%2C+then+comes+in+the+irascible+faculties%2C+as+removens+impedimenta%2C+as+taking+away+the+impediments%3B+and+is+not+this+that+which+is+properly+called+Anger%3F+This+made+Luther+to+say%2C+Ira+suo+loco+est+optimum+Dei+donum.%E2%80%9D%0A%0A%E2%80%94+Oliver+Bowles%2C+Zeal+for+God%E2%80%99s+house+quickened%3A+or%2C+A+sermon+preached+before+the+assembly+of+Lords%2C+Commons%2C+and+Divines%2C+at+their+solemn+fast+July+7.+1643.+In+the+Abbey+Church+at+Westminster.+Expressing+the+eminency+of+zeal+requisite+in+church+reformers%2C+%28London%3A+Samuel+Gellibrand%2C+1643%29%2C+pp+5-6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fad20e8b45f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ad20e8b45f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/03/oliver-bowles-what-is-zeal/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Have due respect to every truth which God has revealed in his word. — Divine truths are one consistent whole; none of which can be spared without disfiguring the beauty and symmetry of the whole system, and injuring our own souls and the souls of others, by withholding from them a truth which they need for their spiritual improvement and comfort.

It is a great mistake to suppose one part of the Bible to be legal, and another evangelical, as if the divine oracles contradicted themselves, — far from it; they make one complete, united, and consistent system. Every truth beautifully fills its own place. Transpose it, and it becomes useless, yea, a pernicious error. Omit it, and a vacancy is left which nothing else can supply.

If divine truths seem to us to militate against each other, the fault is in the medium through which we view them; and because we view them through a false medium, they appear contradictions to us, but are not so in themselves. We, as sinners, want them all; they were intended for our relief as such: and united together as a complete whole, they are a suitable and adequate remedy for all our miseries.</p></blockquote>

<blockquote><p>Let zeal be accompanied with meekness, that you may be free from passion and prejudice; and let meekness be backed with zeal, that you may be free of lukewarmness and indifference. Let meekness be extended toward all persons, and zeal against all sins; and if you would not lose your ground, be positive against sin in the first proposal and motion thereof; you will not get it shifted by, and yourselves kept free though there may be an unwillingness unto it.</p></blockquote>

</figure><figure class="quote" id="q-827e45f8e4" data-kw="">
<blockquote><p>And yet (which is our great reproach) we are often in a deep sleep in the midst of our greatest Dangers, and are hardly well awake when God has wrought out our Deliverance: we sleep when our Enemies are awake to contrive our destruction; and are but in a Dream, when watchful Providence has brought Salvation; so was the Church Ps. 126.1. When the Lord turned again the Captivity of Zion, then were we like them that dream; and that because we are slow to believe there should be so much malice in men to plot the ruin of them that are innocent; or so much mercy in God to save them that are so guilty: And therefore our God awakens our dull and drowsy souls, to consider how faithfully he that keeps Israel doth neither slumber nor sleep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/vincent-alsop.html">Vincent Alsop</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God in the mount: A sermon upon the wonderful deliverance of His Majesty from assassination. The nation from invasion</cite>, (London: J. Barnes, 1696), p. 1.</span></figcaption>

</figure><figure class="quote" id="q-3d9cd7b409" data-kw="">
<blockquote><p>Moreover, youth is a season of inexperience; and this constitutes another source of danger. Every one knows that our most valuable knowledge is derived from experience; that it is far more accurate, more deep, more practical than any other. But of this the young, from the nature of the case, cannot, in a great degree, avail themselves; as it is the exclusive prerogative of riper years. They have had but little experience of their own hearts; but little opportunity of tracing out the sources of human conduct, of becoming acquainted with the evil principles which lurk within them — the treachery, perverseness, rebellion, which constitute the elements of man’s depraved nature.

They have had but limited experience of the world, and are very inadequate judges of its true character. They have ordinarily seen only its bright side; have not often been pierced by its ingratitude, or betrayed by its faithlessness, or stung by its neglect. Of its temptations, too, of the stratagems of the wicked, of the serpentine influence of worldly pleasures, they know comparatively little. How manifestly does this want of experience give the world which they are entering a powerful advantage over them.

With but a slight knowledge of themselves, they are liable to misjudge in respect to the circumstances in which they shall be safe, and to put character and happiness in jeopardy, from a wrong estimate of their strength to resist temptation. With but a slight knowledge of the world, they are in danger of trusting it where it intends to betray; and of being carried headlong by its influence into the vortex of pleasure and vice, while yet they have scarcely suspected that they were beyond the limits of virtue and safety. Many a youth has gone into the haunts of sin, and finally into the world of wo, because, at the commencement of his course, he did not suspect the danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-sprague.html">William Sprague</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Young People (3rd edn, New York: D. Appleton &amp; Co., 1835), pp 36-37.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-927239c2c7" data-kw="">
<blockquote><p>The third is the danger and mischief of force and violence; The taking away of the wicked from before the King, is a means to establish his Throne in Righteousness, because of the violence, and the force that a King is in danger of; when the wicked are about the Throne, his person is in danger to be mastered by their force, and power, and strength. 2 Sam. 3.38. See it in David. Malignants may be too hard for a King by force, and violence, as well as by flattery and Counsel. The King said to his servants, Know ye not that a Prince, and a great man is fallen in Israel? I this day am weak though anointed King, and these men the sons of Zerviah are too hard for me.

This was the case, Joab had killed Abner treacherously, David was King, Joab was the General of his Army and his kins-man, David was Uncle to Joab and his brother, they were his nephews; Joab had slain Abner basely, it was a murder, and a treacherous murder, and David was King and should have done justice, and he had protested it, yet these were too hard for him, not in point of seducing by flattery, or of evil Counsel, but by force and violence.

David could not make his party good against Joab, because he was Governor of the Army, and he was afraid that Joab might make more force then he, and so he mastered the King, and kept him from doing of justice, though he were a just King, and had vowed to do justice, and blood called upon him: Yet these sons of Zerviah (for there were three of them, but one was slain) these grand Cavaliers, when they had gotten the sword in their hand, though their pretence were to help David, yet afterward they over-mastered him, and would kill and slay, and David could not check them for it.</p></blockquote>

This was the case, Joab had killed Abner treacherously, David was King, Joab was the General of his Army and his kins-man, David was Uncle to Joab and his brother, they were his nephews; Joab had slain Abner basely, it was a murder, and a treacherous murder, and David was King and should have done justice, and he had protested it, yet these were too hard for him, not in point of seducing by flattery, or of evil Counsel, but by force and violence.

David could not make his party good against Joab, because he was Governor of the Army, and he was afraid that Joab might make more force then he, and so he mastered the King, and kept him from doing of justice, though he were a just King, and had vowed to do justice, and blood called upon him: Yet these sons of Zerviah (for there were three of them, but one was slain) these grand Cavaliers, when they had gotten the sword in their hand, though their pretence were to help David, yet afterward they over-mastered him, and would kill and slay, and David could not check them for it.”

<blockquote><p>A second rule is, that as the matter in which we are zealous, must be good in it self, so it must be known unto us to be of that quality. True zeal must begin where the word begins, and end where it ends: for otherwise it cannot be of faith, which is ever grounded on the word; and whatsoever is not of faith is sin. We must not therefore content our selves with an honest meaning, and hope that we have a good zeal towards God, when we have no warrant for our hope: but must so acquaint our selves with the Scriptures of God, that our zeal may be according to knowledge.

Which rule discovereth the corruptness of their zeal, whether close hypocrites, or weak Christians, who are led on merely by the examples of good men, whom they affect, much to like of, and earnestly to stand for such things, as they perceive them in their practise to observe, and to make conscience of: and if there be but a word spoken against any of the things that they have taken a liking of, they are marvellously stirred with indignation thereat, and grow passionate and vehement against the parties, though they have never so good a meaning in that which they speak:

Yet let them be urged to prove out of the word the necessity of those duties which they so earnestly press, they can say little or nothing to the purpose for them; and so grow many times either to dislike and forsake all if they be hypocrites, or at least to be discouraged, and to be at a stand, if they be weaklings in Christ Jesus. And whence proceed these inconveniences but from this, that they are zealous for things that in themselves, and unto others are good and holy, but not thoroughly discerned of them to be of that nature: the consideration whereof, should make us to sit sure in matters of godliness, not building upon the example of good men, but upon the truth of the good word of God, and then our foundation shall never fail us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.</span></figcaption>

<blockquote><p>A kind of seeming seriousness in the performance of duties, and in seeking of God, deceiveth many. They think because they are not conscious to their own dissembling, but they look upon themselves as earnest in what they do, that therefore all is well. Sayeth not Christ, that not every one that sayeth Lord, Lord, shall enter into the kingdom of God. Mat. 7: 21? that is, not every one that reneweth their suits, &amp; ingeminateth their desires, cry and cry over again, and as it were, will not give it over.

And yet they come short of their expectation: did not the foolish virgins seem earnest and serious, when they continued waiting with the rest, and at length, cried Lord, Lord open unto us; and yet they were kept at the door. Many consider not that there is a secret and close hypocrisy, that some may be under and not know it, as well as a gross hypocrisy, and dissimulation, which may be easily observed: Will not many seek to enter in, that shall not be able? Mat. 7: 13. Luk. 13. 24.</p></blockquote>

<blockquote><p>He that despaireth of the forgiveness of his sins, denieth GOD to be merciful, yea he denieth as much as lieth in him that GOD hath love, truth and power, in which three all my comfort consisteth, to wit, in the love of his adoption, in the truth of his promise, and in his power to perform. Let my foolish Cogitation then mutter what it listeth within me, saying, who art thou? or by what merit or worthiness doest thou hope to obtain such great glory? I comfortably will answer I know whom I have believed, and I am sure that in love he hath adopted mee to be his Child, that he is true in his promise, and powerful in performance. And these three so strengthen my heart, that no want of merit, no consideration of my own vileness, no greatness of the future blessedness can cast me down from the height of hope, wherein I am soundly rooted.</p></blockquote>

05/gervase-babington-on-the-sin-of-despairing-of-forgiveness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Look frequently to Jesus Christ, the Author and finisher of our Faith: The Divine Wisdom, to reform the World, assumed the Human Nature, and expressed in a Holy Conversation upon Earth, a living Copy of his Precepts, to direct us in the various parts of our Duty; and because the exercise of Humility, Self Denial, and the rest of the Suffering Graces, is so difficult to our frail and tender Nature; he ascended the Cross, and instructs us by Suffering to suffer with his Affections, leaving us his Example, as the best Lecture of our Duty; His Sufferings concern us not only in point of Merit but Conformity. We can never enjoy the benefit of his Passion, without following his Pattern. His example is the Rule of the highest Perfection, and we are under the greatest obligation to imitate and honour him who is our Sovereign and Saviour, to whom we owe our Redemption from everlasting Misery, and the Inheritance of Glory. ‘Tis the Apostle’s advice to the afflicted, to consider him that endured such contradiction of Sinners against himself, that ye be not wearied, and faint in your minds. This deduction is with greater force to make us humble and patient; If we consider,

First; the Infinite Dignity of his Person. He was the Eternal and Only Son of God, and descended from the Throne of his Majesty, divested himself of his Robes of insupportable Light, that concealed and manifested his Glory to the Angels, and was obedient to the Death of the Cross: what are the highest and best of Men to him? Were it not extremely unbecoming and undutiful for a Subject to refuse Obedience to a just Law, if the King that made the Law should voluntarily observe it, and reserve no other advantage to himself, but the honour of enacting it? Our Saviour did not stand upon the dignity and liberty of his Person being equal with God, and our King, but entirely complied with the Law, and shall we complain of its rigour?

Secondly; The Greatness of his Sufferings. They were incomparable as to their value, so in their degrees. He endured the equal extremities of Infamy and Torment, that are so contrary to the inclinations of Mankind. He was Crowned with a cruel Diadem of Thorns, Scourged, Spit upon, Derided, Crucified; Insensible Nature, as if capable of Understanding and Affection, was disordered in its whole frame at his Death. The Heavens sympathized, in Eclipses of the Sun, in the darkness of the Air at Midday, as Midnight; the Earth quak’t with deep Tremblings, and the Rocks were rent a sunder. And the Sufferings of his Soul from the incensed Justice of God were inconceivably great. What is the worst we suffer either immediately from God, or instrumentally from Men, to his bitter Passion? Our Sufferings are but superficial shadows of Misery, compared to his deep Sorrows.

Thirdly; His Sufferings were most undeserved: For he was the Holy One of God, his Conception without the least taint of Sin, his Life of strictest Purity, and complete Obedience to the Divine Law. We may read the process of our Sins, and understand their Guilt in his Passion. He was made Sin for us, (a Sacrifice to atone the Divine Displeasure) who knew no Sin: As David when Guilty of Adultery and Murder, was fired with disdain at the relation of an incompassionate Rich Man, killing the single Lamb of his poor Neighbour, and sparing his own numerous Flock; and when the Prophet unveiled the Parable, and surprised him with that piercing reproach, Thou art the Man! he presently by that Fiction in another, was convinced of his own true guilt, and was extremely afflicted in the sense of it: Thus we are apt to conceive indignation against the Murderers of our Saviour, the Apostate Apostle, the Malicious Priest, the Unrighteous Judge, the Bloody Soldiers. But Conscience (as a true Nathan) may charge us to have been in that wicked Conspiracy against the Lord of Glory, for our Sins Condemned and Crucified him.

And as our Sins were the impulsive cause of his Sufferings, so our good is the effect of them. He suffered the Death of the Cross, that his Blood might be our Ransom, his Ignominy the purchase of our Glory, his Torments the merit of our Blessedness, his Death the Seed of Immortal Life to us; but we suffer the just punishment of our own Sins.

Fourthly; His willing Obedience, Divine Patience, and invincible Constancy in Suffering for us. In his distress, the whole Army of Heaven were in readiness for his Protection and Rescue, upon the least signification of his Will; If I prayed to my Father, he would send me twelve Legions of Angels. Nay, he had the Springs and Keys of the Divine Power in his hands, and could by a Word have destroyed his Enemies; but he freely gave himself for us, and without resistance, without complaint took up his Cross. Now our Saviour, who had the fulness of the Spirit, communicates to us the first Fruits of it, Faith and Love, Humility and Patience, Peace and Joy to support us under Affliction.

Fifthly; Consider the excellent reward of his Sufferings. He was abased below Men, and is advanced above all the Angelical Orders, and is the Eternal Argument of their Praises; Never were Sufferings so grievous, never was Issue so glorious. For the Joy that was set before him, he endured the Cross, despised the shame, and is set down at the right hand of the Majesty on high. Now our Blessed Saviour hath promised, To him that overcomes, will I grant to sit with me in my Throne, even as I also overcame, and am set down with my Father in his Throne. Unfainting Perseverance in our Duty shall be rewarded with the Glory of our Redeemer. And is not the prospect and expectation of this sufficient to confirm our Minds, and make us patiently bear the greatest Afflictions?</p></blockquote>

<blockquote><p>The truth of God is perfectly harmonious, and is one complete whole. All the parts of it fit into one another, and are mutually dependent upon each other; and as this edifice, so reared by God, is complete and compact in all its parts, so the subtle influence of Satan is often applied to the undermining of one part of the building, in the knowledge that if he should succeed, he can scarcely fail to effect the destruction of all the rest.

We might illustrate this by showing how error, in what at first sight may appear an unimportant point, ruins the whole system, and essentially affects the whole doctrines of the gospel. It may seem, for instance, that the dispute regarding the precise nature of saving faith is a comparatively unimportant point, and one on which Christian men may afford to differ; and yet an error on this point might easily be shown to affect the doctrines of God’s sovereignty, of human depravity, the extent and nature of the atonement, and justification by faith alone.

We might show, for example, that those who make justification by faith to consist in the belief of the fact that they are pardoned—who maintain that a man must believe that Christ died personally for him as an individual—are compelled necessarily to adopt a mode of statement in regard to the bearing of Christ’s death upon all men indiscriminately, and particularly upon the lost, which strikes at the root of the doctrine of personal substitution altogether, and makes it difficult, if not impossible, to believe that Christ actually suffered in the very room and stead of guilty sinners themselves.</p></blockquote>

</figure><figure class="quote" id="q-a7ed5147d9" data-kw="">
<blockquote><p>While our hearts are warmed with prosperity, we think many times small sins can do no great harm; but herein we do wofully deceive ourselves. For besides that the least sin hath the nature of sin in it, as the least drop of poison is poison; and that in smaller sins there is the greater contempt of God, inasmuch as we stand out with God for a trifle, (as we count it,) and venture his displeasure for a little sensual satisfaction.

I say, besides these and many other considerations, which may render our small sins great provocations, this is one unspeakable mischief, that small sins intercept our communion with God, as much as great sins, and sometimes more. For whereas great sins by making deep wounds upon conscience, make the soul go bleeding to the throne of grace, and there to mourn and lament, and never to give God rest, till he gives rest to the soul, and by a fresh sprinkling of the blood of Christ, to recover peace and communion with God.

Smaller sins not impressing such horror upon the conscience, are swallowed in silence with less regret, and so do insensibly alienate and estrange the heart from Jesus Christ. The least hair casts its shadow; a barley-corn laid upon the sight of the eye will keep out the light of the sun, as well as a mountain. The eye of the soul must be kept very clear that will see God: “Blessed are the pure in heart, for they shall see God,” Matt. v. 8. Little sins, though they do not disturb reason so much as great sins, yet they defile conscience, and the conscience under defilement (unlamented) is shy of God, and God shy of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Correction, Instruction; or A Treatise of Afflictions</cite>, (1671; London: Religious Tract Society, 1836), pp 38-39.</span></figcaption>

</figure><figure class="quote" id="q-70d68321be" data-kw="">
<blockquote><p>There is a cause at work in this, which we are apt to overlook, we mean the correspondence between intensity of religion at home, and zeal for the extension of religion abroad. The nations of Europe were as remiss respecting the conversion of the heathen, as they were concerning the purifying power of the gospel at home, and the same cause accounted for both—the want of divine power.

The attention of the Christian world has been to some extent engaged with foreign missions, and these have in our own country grown up into national importance; and it is altogether a relevant proof of zeal for the one leading to care for the other, that during the last forty years, certain great questions of righteousness and morality have very strongly laid hold of the public mind.

The question of Colonial slavery, and other less prominent, but more decisive of principles, might be cited. And, guided by these indications of an operative principle, we are permitted, even on the score of appearances, to look forward to a condition of the world more in accordance with the delineations of prophecy picturing millennial glory.</p></blockquote>

/a></div>
</figure><figure class="quote" id="q-565d55bcc7" data-kw="">
<blockquote><p>FAITH, as it stands described and recommended in the Bible, is a firm and assured confidence in God, founded in the belief of the testimony he has given us in the history of the Bible; where we have his true character, instructed by sensible documents, his works and ways with men; particularly in the provision he has made, and the comprehensive promise and grant he hath given, of eternal life. This is rendered credible by the perfection, the faithfulness, and power, of the promiser; but especially by the pledge he has given of his wonderful grace and love to man in Jesus Christ, who is the foundation and surety of the promise.

This security is recommended, as a good ground of confidence, by the Spirit and power of God, and all the fullness of life being lodged in his hand; and as they appear to have been lodged there for this very purpose, that he might convey the promised blessing, spirit and life to us, this finishes the assurance. Hence it is obvious, that faith, or trust and confidence in God, must begin at Jesus Christ, the fare, and the only sure, foundation on which it can stand. And where faith in Christ is, there naturally and necessarily our faith and hope in God follow upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 170-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Whiggism is not circumscribed and confined to any one or two of the Religions now professed in the World, but diffuses it self among all. We have known Jews, Turks, nay, some Papists, (which I own to be a great Rarity) very great Lovers of the Constitution and Liberty; and were there rational Grounds to expect, that any Numbers of them could be so, I should be against using Severities and Distinctions upon Account of Religion.

For a Papist is not dangerous, nor ought to be ill used by any body, because he prays to Saints, believes Purgatory, or the real Presence in the Eucharist, and pays Divine Worship to an Image or Picture (which are the common Topics of our Writers of Controversy against the Papists;) but because Popery sets up a foreign Jurisdiction paramount to our Laws.

So that a real Papist can neither be a true Governor of a Protestant Country, nor a true Subject, and besides, is the most Priest-Ridden Creature in the World: and (when uppermost) can bear with no body that differs from him in Opinion; little considering, that whosoever is against Liberty of Mind, is, in effect, against Liberty of Body too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-molesworth.html">Robert Molesworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translator s Preface’ in François Hotman, Franco-Gallia: Or An Account of the Ancient Free State of France, and most other parts of Europe, before the loss of their Liberties</cite></span></figcaption>

h-on-the-political-danger-of-papists-to-a-protestant-nation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It is the worst of sins, because it keeps all sins: they are made sure and secure by hypocrisy. Indeed some vices are quarter-masters with it, and some Sovereigns over it: for the hypocrisy is but another sin … except to content some affected guest, we could never yield to this filthy Herodias. It is made a stalking horse for covetousness, under long prayers many a Pharisee devours the poor, houses, goods and all. It is a complexion for lust, who, were she not painted over with a religious shew, would appear as loathsome to the world, as she is indeed.

It is a sepulchre of rotten impostures, which would stink like a putrefied corpse, if hypocrisy were not their cover. It is a mask for treason, whose shop-full of poisons, pistols, daggers, gunpowder-trains, would easily be spied out, had hypocrisy left them bare-faced. Treachery under this vizard thrusts into Court-revels, nay, Court-counsels; and holds the torch to sports, nay the books to serious consultations; deviseth, adviseth, plots with those that provide best for the Common-wealth, Thus are all sins beholding to hypocrisy: she maintains them at her own proper costs and charges.

… It is the worst of sins, because it counterfeits all virtues: he that counterfeits the King’s coin, is liable to death, if hypocrisy find not death, and (mortem sine morte) death without death, for counterfeiting the king of heaven’s Seal manual of grace, it speeds better then it merits: vice is made virtues ape in an hypocrite’s practise. If he see Chusi run, this Ahimaaz will outrun him: he mends his pace, but not his path: the goodman goes slower, but will be at heaven before him: thus thriftiness in a Saint, is counterfeited by niggardliness in an hypocrite: be thou charitable, behold he is bountiful, but not except thou may behold him: his vainglorious pride shall emulate thy liberality: thou art good to the poor, he will be better to the rich: he follows the religious man a far of, as Peter did Christ, but when he comes to the cross, he will deny him. Thus hypocrisy can but put blood into your cheeks, (like the Aliptae) and better your colours; but you may be sick in your consciences, and almost dead at the heart, and (non est medicamen in hortis) there is no medicine in this drugster’s shop can cure you.

… An hypocrite is a kind of honest Atheist: for his own Good is his God: his heaven is upon earth, and that not the Peace of his conscience, or that kingdom of heaven, which may be in a soul living on earth, but the secure peace of a worldly estate: he stands in awe of no Judge, but man’s eye; that he observes with as great respect, as David did the eyes of God; if man takes notice, he cares not, yet laughs at him for that notice, and kills his soul by that laughter: so Pigmalion-like, he dotes on his own carved and painted peace: and perhaps dies Zeuxis death, who painting an old woman, and looking merrily on her, brake out into a laughter that killed him. if the world doth not praise his doings, he is ready to challenge it, as the Jews God, wherefore have we fasted, and thou seest it not? he crosseth Christ’s precept: the left hand must be privy to the right hands charity, he dares not trust God with a penny, except before a whole congregation of witnesses, lest perhaps, God should deny the receipt.</p></blockquote>

<blockquote><p>We are apt to think, that there is such a difference between our open sins and our religious exercises, that any defilement attaching to the latter must be so inconsiderable in itself, and so outweighed by the sacredness of the act performed, that no particular account need to be taken of these sins. God’s estimate is very different indeed. His eye sees the sins of our religious services in another light, as being no less heinous than other iniquities, and needing special forgiveness no less than they.

Not merely our open transgressions—our scarlet and crimson sins—need pardon, but our holy services, our good words and deeds, our prayers, our praises, our worship, our breaking of bread at the table of the Lord. In every one of these there is such an amount of sin cleaving to, and mingled with, every act, and feeling, and thought, and word, as to render them in themselves so miserably defective and defiled, as to be utterly unacceptable in the sight of the Holy One.

When seeking God, we need to have our way of seeking and our act of seeking forgiven. When praying for pardon, we need to have that prayer itself forgiven. Each petition bears witness against us. There is such imperfection, such coldness, such formality, such deadness, such wandering, such half-heartedness, such a want of every thing that constitutes prayer, that, were there not forgiveness for the sins of our holy things, we might as well cease to pray. When coming to Christ, we need forgiveness for our act of coming, for the impure motives which lead us to come, as well as for the defective way in which we come. All this is provided for. There is forgiveness not merely for the sins we bring to Christ, but for our way of bringing them. …

There is forgiveness, then, for the iniquities of our holy things forgiveness not only for our omissions of duty, but for our duties themselves; forgiveness, not only for our estrangement from God, but for our sins in returning to him; forgiveness, not only for our prayerlessness, but for our prayers; forgiveness, not only for our long rejection of Christ, but for our sins in coming to him; forgiveness, not only for our unbelief, but for our faith; forgiveness, not only for our past enmity, but for our present cold-hearted love; forgiveness, not only for the sins we bring to Christ, but for our way of bringing them; forgiveness, not only for the sins we carried to the altar of burnt-offering, and laid upon the bleeding sacrifice, but for our imperfect way of taking them, the impure motives that defiled our service, and also for the sins mingling with our worship when standing within the veil in that sanctuary, where the majesty of the Holy One has made its abode.</p></blockquote>

<blockquote><p>Be not sinfully discontented, for God can make the errors of the Church advantageous to truth. Thus the truths of God have come to be more beaten out and confirmed; as it is in Law, one man laying a false title to a piece of land, the true title hath by this means been the more searched into and ratified: some had never so studied to defend the truth by Scripture, if others had not endeavoured to overthrow it by Sophistry; all the mists and fogs of Error that have risen out of the bottomless pit, have made the glorious Sun of truth to shine so much the brighter.

Had not Arius and Sabellius broached their damnable Errors, the truth of those questions about the blessed Trinity had never been so discussed and defended by Athanasius, Augustine, and others; had not the Devil brought in so much of his princely darkness, the Champions for Truth had never run so fast to Scripture to light their Lamps. So that God who hath a wheel within a wheel, over-rules these things wisely, and turns them to the best. Truth is an heavenly plant that settles by shaking.

… God raiseth the price of his truth the more; the very shreds and filings of truth are venerable. When there is much counterfeit metal abroad, we prize the true Gold the more: the pure wine of Truth is never more precious then when unsound doctrines are broached and vented.

… Error makes us more thankful to God for the jewel of Truth. When you see another infected with the Plague, how thankful are you, that God hath freed you from the infection? when we see others have the Leprosy in the head, how thankful are we to God that he hath not given us over to believe a lie, and so be damned? It is a good use that may be made even of the Error of the times, when it makes us more humble and thankful, adoring the free grace of God who hath kept us from drinking of that deadly poison.</p></blockquote>

<blockquote><p>It has become almost an adage, that the Church has developed her theology mainly through conflict with error. This must be so from the nature of the case. Attention is not apt to be specially directed to what is undisputed, and our clearest judgments are derived from comparison. The contrast of truth and error, induced by the assertion of the latter, enhances our comprehension of both. The doctrine of the covenants constitutes no exception to this law.

It was not brought distinctly under investigation and formally developed until the period succeeding the Reformation. Luther grandly elucidated the cardinal doctrine of justification by faith alone. Justification he saw clearly. Imputation he perceived less distinctly; and he stopped short of the controlling principle of federal representation. Even Calvin, magnificently endowed as he was by his abilities and learning for a systematic treatment of revealed truth, although he produced a theological work distinguished for its comprehensive grasp of the doctrines of religion in their relation to each other, did not seem to have had his mind definitely turned to the federal scheme.

It was when Placæus [Joshua De La Place] broached his theory of the mediate imputation of Adam’s sin, that the attention of the Reformed Church was thoroughly aroused to the importance and scope of the federal theology. The theologians of the Dutch School, in their massive works, subjected it to a full, if not an exhaustive, consideration; and their example was followed by some of the most illustrious divines of England and Scotland.

And while Cunningham, Hodge, and our own Thornwell have trodden in their footsteps, and evinced in their discussions their sense of the importance of the federal system—a fact for which the present generation of Calvinists should be devoutly thankful—it is to be feared that indications are beginning to manifest themselves of a growing tendency towards a departure from this type of theology. Especially would it be for a lamentation should it disappear from the pulpit—the grand organ by which divine truth is brought into contact with the masses.

And as surely as the pulpit drifts away from it, will it more and more cast its instructions in the mould of a wretched legalism; or, losing the influence of this pervading genius of theological truth, and so lapsing from any thoroughgoing inculcation of doctrine, it will more and more neglect its heavenly call to be an instructor of Christ’s people, and sink its high didactic office into that of a vapid and sensational haranguer.</p></blockquote>

<blockquote><p>[A]nd so it is generally, that when the false Prophet doth arise among the People of God, it is because of God’s people that are the cause of it: and it is they that do set them up, and maintain them, and would have pillows laid under their elbows: and why is it so? why (my Brethren) even since it was that Eve did hearken to the voice of the Serpent: And also the children of God are much given to novelties; these are things that they never heard of before: and if they may have these and those things spoken which they never heard of before, this is all many care for, though they are such things as came not out of the mouth of God: yet because they are new things, and that please their humours, therefore they affect them: thus the Apostle Paul, one would think an Apostle good enough; yet there were many that were unsatisfied with him, as in the Epistle to the Galatians we read, &amp; bewitched with the false Teachers; these give us (say they) the Gospel in this and that way, &amp;c. however they did once look at the Apostle Paul as an Angel of God, even as Christ Jesus: but now the case was altered: and now Paul was no body: and come of him what would, he might starve for all them: they were carried away after those that vented their new things.</p></blockquote>

<blockquote><p>A sentiment that it matters not what a man believes, so that he is sincere, is as unscriptural as it is absurd. Sincerity of belief has no more effect in warding off evil in the spiritual, than in the natural kingdom.

If the teachings and persuasions of a reputed chemist should prevail on you “to believe” that arsenic is harmless, would it therefore be harmless? Could you mix it with your bread, and you or your children eat it without injury to health and life? Oh, no!

Neither will the sincerity of your belief save you from the consequence of error in religious faith. Right belief, truth, God’s truth, my brethren, is the only foundation on which you can safely rest your hopes. But true belief is not a mere act of the understanding, it involves exercises of the heart; the emotions are purified, and love pervades the soul.</p></blockquote>

</figure><figure class="quote" id="q-a1a8836515" data-kw="">
<blockquote><p>A third property of true zeal is, that it beginneth in our selves, and after proceedeth unto others: for never can that man be truly zealous to others, which never knew to be zealous to himself. Those are the most skilful Physicians and best able to deal with others, that have first wrought a cure upon their own souls. Therefore our Saviour’s advice is, Cast out the beam out of thine own eye first, and then shalt thou see perfectly to pull out the moat that is in thy brothers eye.

We must then first of all judge our selves, and cast the first stone at our selves, that so finding how ugly and noisome a thing sin is, and that by experience in our selves, we may be at defiance with it, wheresoever we find it, and neither flatter others in their evil courses, nor yet too rigorously and unmercifully rebuke them for the same. Those that have been pinched with sickness and are recovered, can by the smart which they have felt, pity others in the like case: even so they which have been stung with sin themselves, can more easily be moved to shew compassion towards poor sinners like themselves, because by the feeling of misery, men learn the practise of mercy, in that Christ suffered and was tempted, he is able to pity and to succour those that are tempted.

Against this rule doe all hypocrites offend, who will wade very deeply into other men’s souls, and very bloodily gore other men’s consciences, who yet never once purged their own unclean sinks at home, nor drew one drop of blood out of their own corrupt hearts. Such were the Pharisees, who pleased themselves much in judging and censuring our Saviour and his Disciples; but were so far from condemning themselves as faulty in any thing, that they justified themselves before God and men. Such also are the Brownists, which are ready to burst their bowels with crying out against disorders abroad, and yet never reform their own souls at home: for if they did, they would also reform their lives and their families.

But what kind of zeal these men’s is, wosull [sic] and late experience still crieth in our ears: for many of them being so zealous to others, but only through some secret love of the world, when they had that which they sought for, made known their hollow &amp; their rotten zeal, in that without grief of conscience, they could suddenly rush into a profound worldliness: and without all godly sorrow, could (after they had satisfied their greedy and fleshly zeal) not only more hardly sear up their own consciences, but also be so changed, that they could sow up their lips, and spare their words from speaking in like manner again to others, and so are neither zealous to themselves nor others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 87-89.</span></figcaption>

1a8836515.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/19/robert-cleaver-on-hypocritical-zeal-and-the-brownists/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I am afraid of a controversy on this subject [instrumental music], or of its issue, so far as the merits of the question are concerned. I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the Temple destroyed? Is the Temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the Temple or the Synagogue the model on which the Church of the New Testament is formed?

Does the Old Testament itself point to anything but “the fruit of the lips” as the peace-offering or thank-offering of Gospel times? Is there a trace in the New Testament of any other mode of praise? For my part, I am persuaded that if the Organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fulness,—against the substitution again, in our whole religion, of the formal for the spiritual, the symbolical for the real.

I do not judge others. The case is very different with those who never reached our measure of reformation from what it is with us. A Church which, stopping short in the process of its emancipation from a false system, retains certain of the usages of that false system, is in a very different position from a Church which, having advanced farther in the direction of purity and simplicity, voluntarily retrogrades and returns to these usages.

To the one they may be comparatively harmless, while to the other they may prove deeply hazardous. In the former instance, the continuance of them indicates no new leaning towards ritualism, no decline from what is more pure and spiritual. In the latter instance, the adoption of them may have a significancy, and may exert an influence, of a very serious character indeed. A landing-place which is tolerable for those who are going forward, may be the reverse of tolerable for those who are retreating.</p></blockquote>

<blockquote><p>Two great miscarriages moreover I was prone to fear the most would be guilty of, which I have especially consulted against. The first, of being swallowed up so much with a sense of their Suffering, as to be indisposed for all profitable Reflections; and therefore fain would I turn men’s eyes and thoughts from off this, to the sin that brought it; and have them only to consider the former, so much as to inform themselves more clearly of the evil of the latter.

Oh what Out-cries we may hear up and down, what doleful times these are! So many Thousands dead this Week, so many another! The Plague got to this Town, and then to that! All Trading, as well as Persons, dead and gone! But were People formerly thus affected, whilst we were bringing this upon our selves? Did they cry out then, Oh how many Thousand Oaths are sworn in a Week? And how many Lies told? How many Thousands Drunk, and how many commit Lewdness?

Had we had Weekly Bills of such Sins brought in, they would far have exceeded the largest Sums that ever yet the Mortality made. But alas! these with the most were light matters. Not half so many groans and tears for these, nor any such complaints of them; nor did the consideration of them make any sensible alteration amongst us. Now this I would fain obtain, to have those days thought as much worse than these; and those actions as much worse than these sufferings, as the Disease is worse than Physick; and a Child’s disobedience to his Parents, worse than his being Whipped: And he that should weep out of pity to the Child, when he sees it lashed; and yet could be content to hear him revile and abuse his father, I should think to be a person of more Fondness, than Discretion; and for him to be more concerned for the Child’s Smart, than the Parent’s Honour, argues him to have no true love for either.

And here by the way let me give a Caution, viz. That no man bewray so much folly as to argue, That because in mercy God may abate and remove his heavy Judgments, before many, or perhaps any of these sins I have mentioned are put away from amongst us; and because we may have our former health and plenty restored, whilst there is no such Reformation of disorders as I have exhorted to, that therefore our Sufferings were not intended to chastise us for those sins, nor to bring us to this Reformation.

If thou be an Atheist or Infidel that makest this Argument, who believest not there is a God, or that he concerns not himself with our Affairs, but that all things come by Nature or Chance, or I know not what, I shall then leave thee to receive satisfaction (if nothing sooner will give it) there, where all such as thou, by the feeling of Divine Vengeance, are at once convinced what the sin is which hath deserved it, and that there is a God who inflicts it; but if thou be a Christian, then I would wish thee well to examine the nature of the thing, (that I mean, which thou thinkest God hath not punished us for, because it is yet continued) and upon the issue of that examination, pass thy judgment. It’s much to be feared thou wilt see Drunkards, and hear Swearers, after the Plague may be ceased; and wilt thou think therefore that these, and the like Wickednesses, did not provoke God to afflict us?

But rather stay, if thou art in doubt, till the great reckoning day, till thou hast heard all men’s Accounts cast up, and those Actions which are then approved confidently pronounce no sins; but not all those that survive the heaviest Judgments here on earth, which may be sent to punish and reform those that were guilty of them; since hardened sinners may frustrate some ends of an Affliction, and all are not followed here, as Pharaoh was. No, I say, do not justify all such Actions, though thou shouldst hear them openly defended, and applauded, and those men punished that dare to oppose and contradict them, and that opposition made the only sin. This lower world is full of such mad mistakes and confusions, but all will shortly be set strait.</p></blockquote>

</figure><figure class="quote" id="q-77d9fbd74d" data-kw="">
<blockquote><p>This is the promise: The Spirit shall lead you into all truth. You are now searching into the deep things of God, which concern Religion; Live in the Spirit, and the Spirit shall bring all into your mind, and shew you the things of Jesus Christ. It behoves you to know the method of Satan; the stratagems and dark deeps of the Devil himself, in mysteries of State and Religion. Walk in the Spirit; he shall lead you into their chambers, as he did Ezekiel; and let you see what mischiefs they are there contriving in secret.

This is the promise: The Spirit of God and of glory shall rest on his servants, in their conflicts and sufferings. Sit still in all humble resignation of your selves, to the working of this Spirit; that he may rest on you: so shall he manage your counsels, finish your wars; and end all your sufferings with glory.

I shall conclude my Epistle with an humble Petition to your Honours: an hearty Prayer for you.

My humble Petition is, that You would ever remember to converse as Doves, among Doves; with this Dove; He is a tender Spirit, take heed of grieving this Spirit, where ever he dwells: For by him alone can your hopes be sealed to a day of full accomplishment.

My hearty Prayer is, that, as you sit debating in Parliament, the appearances of the Holy Ghost may be among you; as he was with the Apostles, sitting over them in the form of fiery tongues: that when you fight in the field, the Holy Ghost may be as a two-edged sword going forth from the mouth of the Lord Jesus into your enemy’s hearts: that you may never see upon the walls of your house, that hand-writing which made Belshazzer tremble; Your kingdom is divided; but in stead of this, that uniting and building Principle; Not by might, nor by power, but by my Spirit, saith the Lord. This is the fervent, constant prayer of

Your Honours humble servant in Christ, Peter Sterry.</p></blockquote>

<blockquote><p>Especially let us look unto this in matters betwixt God and us: let us not play the hypocrites with him, pretending a love unto the Church of God, and to the word of God, when there is no such matter; and drawing near unto him with our lips, when our hearts are far from him: for in so doing we shall offer great injury unto the Lord, and do more hurt at length then those that are professed Papists or Atheists:

[F]or such as flatter with their lips, and dissemble with a double heart in things that concern the holy religion of God, if any persecution come, will quite renounce their profession, and betray the cause of God, and grieve the servants of God, and harden the hearts, and open the blasphemous mouths of the enemies of God, and make many to fall by their revolting and backsliding. Therefore let every one that taketh upon him the profession of Christianity, be a true, &amp; not a feigned friend of the same; and bring a faithful, and not a guileful heart thereunto; that the Lord may witness for him, that he doth heartily and unfeignedly seek him.</p></blockquote>

<blockquote><p>What meaneth that joy that the faithful find in their hearts, accompanying the benefits that cometh from Him, but that the Lord giveth His benefits cheerfully? for if the LORD gave thee them not cheerfully, but in anger and wrath, and threw them to thee as to a reprobate, thou wouldest never have joy in the receiving of them. There is not such a thing, as a reprobate can have joy in the giver, or ever have his mouth open with true thanksgiving to the Lord to say once, I thank thee: Why? Because the Lord giveth him not His benefits in love, but in anger.</p></blockquote>

</figure><figure class="quote" id="q-996cdeb453" data-kw="">
<blockquote><p>He [the religious hypocrite] is one that is partial in his goodness; zealous in lesser things, and remiss in greater. As Luther complained of some in his time, and our Saviour in his time, which strain at a gnat, and swallow a Camel. He is one that sweats only in some part, but is cool in all the rest, which is a sign his zeal is distempered.

He is zealous against a Ceremony, a Relique or painted Glass, (not that I plead for these) but in the mean time lives in known sin; Lying, Cozening, Extortion, &amp;c. Just as the High Priests, It is not lawful, say they, to put the money into the Treasury, because it is the price of blood.

They speak like conscientious men. Oh do not defile the treasury! But let me ask the question, Why did they shed that blood it was innocent blood. They will not take the price of blood into the treasury, but they never scruple to take the guilt of blood into their souls. They were zealous for the Temple, but in the mean time murderers of the Son of God. And we have a parallel Scripture to this, Rom. 2. 22. Thou that abhorrest idols, dost thou commit sacrilege?

Who at the first blush would not have taken these for very holy, devout men; they were zealous against idolatry? But see a root of hypocrisy! They were partially good, they hated one sin, but not another; idolatry, but not sacrilege. Though it was an abominable sin, and there was an express Law of God against it, yet these seeming Zealots make no conscience of robbing God of his tithes.

And here as in a Scripture looking-glass, we may see our own faces; have we not many now adays seemingly zealous against Popery? if they see a Cross, though it be in a Coat of Arms, they are much offended, and are in a kind of convulsion: but in the mean time make no conscience of sacrilege, starving out the Ministry, they put out the fire on God’s Altar, shut the doors of his Temple; is not this visible hypocrisy?

There are some it may be will not be heard to swear, it will not stand with their Saintship, that were to call the devil father aloud, but they will defraud and defame, which is a sin they can never satisfy for; take away a man’s name, what amends can you make him? ’tis no better then murder; and if these be Saints, there are as good Saints in hell?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 39-41.</span></figcaption>

</figure><figure class="quote" id="q-935af0c149" data-kw="">
<blockquote><p>We may only advert farther on this head, to the wonder that the friends of truth and reformation should be so divided in sentiment and communion.

Considering that these are so feeble in point of numbers, and that the force of their public testimony depends so much on their united exertions, it is truly surprising that so little of a spirit of enlightened and scriptural union should exist among them; and that so generally they should be on the watch to increase their own little parties, by fishing in disturbed waters, and picking up treasures from the wreck of ruined establishments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Aspect of the Times. Delivered in May, 1834 in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>For as it is not enough for those who are chosen to say in excuse for themselves, “I did not summon myself to this office, nor could I avoid what I did not see beforehand;” so neither will it be a sufficient plea for those who ordain them to say that they did not know him who was ordained. The charge against them becomes greater on account of their ignorance of him whom they brought forward, and what seems to excuse them only serves to accuse them the more.

For how absurd a thing, is it not? that they who want to buy a slave, show him to the physician, and require sureties for the sale, and information about him from their neighbours, and after all this do not yet venture on his purchase without asking for some time for a trial of him; while they who are going to admit any one to so great an office as this, give their testimonial and their sanction loosely and carelessly, without further investigation, just because some one wishes it, or to court the favour, or to avoid the displeasure of some one else.

Who shall then successfully intercede for us in that day, when they who ought to defend us stand themselves in need of defenders? He who is going to ordain, therefore, ought to make diligent inquiry, and much more he who is to be ordained. For though they who ordain him share his punishment, for any sins which he may commit in his office, yet so far from escaping vengeance he will even pay a greater penalty than they — save only if they who chose him acted from some worldly motive contrary to what seemed justifiable to themselves.

For if they should be detected so doing, and knowing a man to be unworthy have brought him forward on some pretext or other, the amount of their punishment shall be equivalent to his, nay perhaps the punishment shall be even greater for them who appointed the unfit man. For he who gives authority to any one who is minded to destroy the Church, would be certainly to blame for the outrages which that person commits.

But if he is guilty of no such thing, and says that he has been misled by the opinions of others, even then he shall not altogether remain unpunished, but his punishment shall be a little lighter than his who has been ordained. What then? It is possible that they who elect may come to the election deceived by a false report. But he who is elected could not say, “I am ignorant of myself,” as others were of him.

As one who will receive therefore a sorer punishment than they who put him forward, so should he make his scrutiny of himself more careful than that which they make of him; and if they in ignorance drag him on, he ought to come forward and instruct them carefully about any matters whereby he may stop their being misled; and so having shown himself unworthy of trial may escape the burden of so high an office.</p></blockquote>

<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.</p></blockquote>

<blockquote><p>10. Her watchmen are blind. He now assigns the reason why the people must be destroyed. It is because they are governed by wicked princes and pastors; not that he wishes to throw the blame on them alone, and thinks that the people are innocent, but because this was the beginning of the evil. We are not exempted from blame, if we follow blind guides, but, on the contrary, are justly punished for our transgressions; for the Lord takes away good guides from those whom he intends to punish for their ingratitude.

By the word “Watchmen” he means not only the prophets, to whom was committed the office of teaching, but likewise judges, princes, and kings, who ought to have governed everything in a proper manner. He includes both kinds of government, that of princes, and that of the ministers of the word, whom the Lord has placed, as the two eyes in the body, to govern the Church. Consequently, if they are wicked or unfaithful, there cannot arise a more destructive plague to a commonwealth.

All are ignorant. First, he reproaches them with want of knowledge; for, as it is the chief excellence of a good shepherd to know his duty, that he may judge what is profitable and what is pernicious to the flock, and to watch laboriously, and to stand, as it were, on a watch­tower, that he may promote their safety in every respect, so nothing is more inconsistent with that office than ignorance and blindness. No man, therefore, will be a good shepherd, unless he understands the right method of governing the people. And hence we see what we ought to think of the idols of our time, who haughtily and insolently boast of the name of shepherds or pastors; for they are untaught and ignorant beasts.

All are dumb dogs. By calling them, secondly, “dumb dogs,” he charges them with slothfulness and indifference; for, since it is the duty of a good shepherd to be industrious and careful, when he calls them slothful and indifferent, he shows that they had nothing about them that ought to belong to a shepherd. Thus, when we are deprived of good shepherds, and when lazy or even savage beasts come in their room, let us acknowledge God’s wrath, and let us know that destruction is not far off; for the Prophet threatens and foretells the ruin of the people, when shepherds are “dumb.”

Hence also it follows, that God appoints them to discharge the office of “dogs,” that is, to keep watch, to drive away robbers and thieves, and not to permit them to enter into the fold. And if dogs are so faithful guardians and so warmly attached to their masters, that they continually watch for their safety, and do not cease to drive away, by barking, those from whom danger is apprehended, shepherds, when they give themselves up to sloth and drowsiness, ought to be ashamed of being surpassed by a brute beast.

11. And those dogs strong of appetite. The third vice which he remarks in wicked pastors is insatiable avarice. Though they are lazy in all that relates to good government, yet they have a strong and ravenous appetite for food. Some view the Prophet’s words as still more extensive, and as meaning that they rule tyrannically. Ezekiel expressly reproves them for this vice; for false prophets are commonly fierce, and act cruelly and barbarously towards the people of God. (Ezekiel 34:4) But if any person examine the matter carefully, he will perceive that the Prophet speaks of their insatiable avarice, which he afterwards describes by a variety of expressions. They look to their ways. That is, “They attend eagerly to their own affairs; every person consults his own advantage.” In short, he means that there is no man who does not wish to be preferred to others, as if every man had been born for himself.

Every one to his gain from his end. מקצהו (mikkatzehu) has received various expositions. Some render it, “In his end,” that is, “In his affairs;” as if the reading had been, בקצהו, (bekatzehu) But this does not agree with the Prophet’s meaning. Others render it, “From the end of his avarice.” I think that a more simple interpretation is, “From his end,” that is, “On his part;“ or as we commonly say, (Chacun en son endroict,) “Every one in his place.” Thus every one is bent on avarice, and draws and appropriates everything to himself, and consults his own advantage, without attending to the duties of his office.

Hence we learn, that no man can serve God who is given up to wicked desires; and he who shall labour to amass wealth, will not apply his mind to build up the Church of the Lord. No kind of blindness can be more dangerous than avarice; and so much the more ought it to be avoided by pastors, if they wish to be faithful servants of God. When we see the Prophet complaining of the bad pastors of his time, let us not be alarmed if we meet with the same thing in the present day, and let us not look upon it as an unusual occurrence that so few are earnestly employed in the work of the Lord.</p></blockquote>

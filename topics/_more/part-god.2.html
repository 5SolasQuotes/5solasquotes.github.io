<blockquote><p>The eternal Sonship of Christ, or that he is the Son of God by eternal generation, or that he was the Son of God before he was the son of Mary, even from all eternity, which is denied by the Socinians, and others akin to them, was known by the saints under the Old Testament; by David (Ps. 2:7, 12); by Solomon (Prov. 8:22, 30), by the prophet Micah, chapter 5, verse 2.

His Sonship was known by Daniel, from whom it is probable Nebuchadnezzar had it (Dan. 3:25), from which it appears he was, and was known to be, the Son of God before he was born of the virgin, or before his incarnation, and therefore not called so on that account. This truth is written as with a sun-beam in the New Testament …</p></blockquote>

</figure><figure class="quote" id="q-211b8ff5db" data-kw="">
<blockquote><p>If God is, he must needs have subsisted of all Eternity, without any beginning. For, who should have given him his being? He could not have created himself, nor be made out of nothing, without any cause, and no first, or Superior cause can challenge the Creation of him, for there is nothing before, or superior to God.

And if he hath existed from all Eternity, he is then infinite, in respect of his duration. And if he hath an infinite duration, his Power is also infinite; and if he is infinitely Powerful, this World, which (though very great) is notwithstanding finite, and is not so great, but that it can have been made, or created by him, or ruled and Governed by an infinite Power, such as his is.</p></blockquote>

<blockquote><p>Of the Trinity.

How many Persons be there in that one Essence of God?

Three, and those both in number, and in very deed distinguished, the Father, Son, and the holy Ghost: which have their subsisting in one divine essence: whereupon it comes to passe, that there be not many Gods, but one God, and the same eternal, infinite, and omnipotent, who is named Jehovah in the Scriptures: and is said to be most simple by reason of essence, and three by reason of Persons.

By what testimonies of Scripture do you prove the Trinity?

Genes. 1.1. God or Elohim created the heaven and the earth. In which place the verb being of the singular number doth signify the most simple essence of God: and the substantive Elohim being the plural number, doth note out the three Persons. Also in the creation of man, God as it were taking counsel with his eternal wisdom, that is, the Son and the holy Ghost, saith thus: vers. 26. Let vs make man after our image. Where he saith, Let us make, because of the number of the persons, and after our image, because of the unity of the essence. Gen. 19.24. The Lord rained from the Lord brimstone and fire upon Sodom and Gomorrah: in which place the person sending the rain, and the person from whom it was sent, (that is the Son) is distinguished from the Father.

Have you any more pregnant proofs out of the new Testament?

1. In the baptism of Christ, Math. 3.16. and Joh. 1.32. the voice of the Father is heard from heaven, This is my beloved Son: in the same place there stands the Son by the river Jordan, the holy Ghost descends in the form of a Dove and sits on Christ.

2. Again, in the transfiguration, there is the Son, and the voice of God the Father is heard from heaven, and Christ is shadowed with a cloud which doth signify the holy Ghost. And further Mat. 28.19. Baptize all nations in the name of the Father, of the Son, and of the holy Ghost: he saith not in names, but in the name, to shew the unity of the three Persons. 2. Cor. 13.13. The grace of our Lord Jesus Christ, and the love of God, and the communion of the holy Ghost be with you all.

Seeing the Scripture doth not use the name of the Trinity, doth the Church well to retain the same?

Yea, no doubt: for the thing it self is found in the Scriptures two manner of ways:

Now sith that the sense of it and the very thing it self is found in the Scriptures, the Church hath liberty to use such words as may familiarly express the thing it self. Moreover, we call the three Persons in God, the Trinity, not because the Scripture calls them so, but because the Scripture saith nothing against it. Yet this word three, whereof this word Trinity is derived, is expressly set down, 1. Joh. 5.7. There be three that bear witness, &amp;c. Whence we argue, that as from one comes Unity, so from three comes Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), pp 7-8.</span></figcaption>

</figure><figure class="quote" id="q-b5fa971209" data-kw="">
<blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>

<blockquote><p>Q. What is God?

A. He is a Spirit, having his being of himself.

Expos. 9. God is a spiritual, invisible, and immaterial substance. 1. Tim. 1. 17. Luk. 24. 39.

10. God is without beginning, Psal. 90. 2. and 93. 2. Esa. 43. 10. and 44. 6. and without cause, Apoc. 1. 8. Esa. 41. 4. and 43. 10. and 48. 12. and so he is without composition, infinite, Psa. 147. 5. &amp; 145. 3. Exod. 3. 14. eternal, Prov. 8. 22, 23. Rom. 16. 26. incomprehensible, Exod. 33. 22. 23. 1. Tim. 6. 16. 1. Kin. 8. 27. Esa. 66. 1. and unchangeable, Jam. 1. 17. Mal. 3. 6.

Q. How many Gods be there?

A. Only one God and three Persons, the Father, Son, and Holy Ghost.

Expos. 11. There can be but one Omnipotent, Dan. 4. 35. infinite, eternal, most perfect first cause, and director of all things; all things are referred to one first, Rom. 11. 35. Apocal. 1. 8. and 4. 11.

12. A person generally taken, is one entire substance, not common to many, endued with life and understanding, will, and power. A person in the Godhead, is the Godhead restrained, or distinguished by his personal property. Joh. 14. 16. and 15. 1. The whole divine nature being indivisible, 1. Cor. 8. 6. is common to all three persons, Father, Son, and Holy Ghost. Act. 4. 24. 2. Cor. 1. 3. Joh. 1. 1. Rom. 9. 5. Heb. 1. 8. Numb. 12. 6. 7. with Act. 1. 16. 1. Pet. 1. 11. Heb. 1. 1. Act. 4. 25. with 2. Pet. 1. 21. and therefore whatsoever doth absolutely agree to the divine nature, or is spoken of the divine nature by relation unto the creatures, that doth agree likewise to every person in Trinity. Joh. 1. 1. Prov. 8. 22. Apoc. 1. 8. Matth. 18. 20. Joh. 3. 13. Job 26. 13. and 33. 4. Joh. 14. 26. Luk. 1. 35. Every person in Trinity, is equal in glory and eternity. Joh. 10. 30. Joh. 17. 5. Phil. 2. 6. Eph. 1. 17. with Joh. 12. 41. and there is a most near communion and union between them, by which each one is in the rest, and with the rest. Joh. 14. 10. 11. Io. 1. 1. and every one doth possess, love, and glorify each other. Prov. 8. 22. 30. v. Joh. 17. 5. working the same things. Joh. 5. 19. But the Godhead considered with the personal property of begetting, is the Father, &amp;c.

Q. What is the property of the Father?

A. To be of himself, and to beget his Son.

Expos. 13. The divine nature doth neither beget, nor is begotten: but the Father doth beget his Son by an eternal and necessary communication of his essence, wholly and indivisibly to his Son, which yet he wholly retaineth in himself. Joh. 1. 1. Pro. 8. 22, 23.

Q. What is the property of the Son?

A. To be begotten of the Father.

Q. What is the property of the Holy Ghost?

A. To proceed from the Father, and the Son.</p></blockquote>

<blockquote><p>Reason itself also teaches us this; for whosoever has any thought and sense of deity, must acknowledge that only to be deity, than which nothing can be conceived better, more sublime, and more perfect; but of such a nature as this, there can be only one; for if such a being could have an equal, we could conceive of some more perfect Being, having none equal to himself, and possessing all the perfections of that other deity in himself alone, and having him dependent on himself.

Again, if there were more Gods than one, there would be more supreme Beings, than one, which is impossible; for if there were several supreme Beings, either one would be greater than the other, or they would be entirely equal; if the former, one of these would be the sole deity, namely, that which excelled the other; if the latter, neither of them would be supreme, because that only is supreme, which is greater than all other beings.</p></blockquote>

<blockquote><p>To all the three persons in the Trinity prayer is due. That it is so to the Father, nobody doubts. That it is due to Christ, the Son, appears from Stephen’s calling upon him in his last moments, and saying, “Lord Jesus, receive my spirit,” Acts vii. 59.

Even Christ the Mediator is to be worshipped, though his divine nature is the reason why he is worshipped, Heb. i. 6, “And let all the angels of God worship him.” The Holy Ghost also is to be worshipped, as appears from the apostolical benediction, 2 Cor. xiii. 14, “The communion of the Holy Ghost be with you all.”

In respect of the object of worship, people would do well to satisfy themselves, in their addresses to God, with the belief of the Trinity of persons in the Godhead, who are but one object of worship, and not think to comprehend God, but to make use of the names and titles he has taken to himself in the word. Beware of imaginations of God or the three persons, and of dividing the object of worship, as if praying to the Father, you did not also pray to the Son and the Holy Ghost.</p></blockquote>

<blockquote><p>By confused and involved expressions the heretics very frequently elude the truth and secure the ears of the unwary by the mere sound of common words, such as the titles Father and Son, which they do not truthfully utter to express a natural and genuine community of essence: for they are aware that God is called the Father of all creation, and remember that all the saints are named sons of God.

In like manner they declare that the relationship between the Father and the Son resembles that between the Father and the universe, so that the names Father and Son are rather titular than real. For the names are titular if the Persons have a distinct nature of a different essence, since no reality can be attached to the name of father unless it be based on the nature of his offspring. So the Father cannot be called Father of an alien substance unlike His own, for a perfect birth manifests no diversity between itself and the original substance.

Therefore we repudiate all the impious assertions that the Father is Father of a Son begotten of Himself and yet not of His own nature. We shall not call God Father for having a creature like Him in might and activity, but for begetting a nature of an essence not unlike or alien to Himself: for a natural birth does not admit of any dissimilarity with the Father’s nature.

Therefore those are anathema who assert that the Father is Father of a nature unlike Himself, so that something other than God is born of God, and who suppose that the essence of the Father degenerated in begetting the Son. For so far as in them lies they destroy the very birthless and changeless essence of the Father by daring to attribute to Him in the birth of His Only-begotten an alteration and degeneration of His natural essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 20 in Nicene and Post-Nicene Fathers 2, 9: 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

<blockquote><p>Here, then is another test of our Christian discipleship – a test, moreover, which I greatly fear many inwardly feel that they cannot at all abide. They inwardly respect real goodness; but to respect it is one thing, and so to love as to associate with it, and peculiarly to befriend and shelter it, is distinctly another.

And while I say not of now hearing me, that they are without natural affection. I yet would have you all to that you may utterly detest, and shun as would do the contagion of a pestilence, or of the grave, even all that is gracious; and that, should that persecution of which we at last been officially forewarned, be now to break forth upon us, it will be but in fulfilment of all our speculations upon human character, if we find the most active and relentless agents of it among those of our professing brethren, who have ever felt highest respect for real goodness, and yet have been farthest of all from ever liking it.</p></blockquote>

</figure><figure class="quote" id="q-c5ec5c7477" data-kw="">
<blockquote><p>The grand heresy, which might be said to have overspread the church for many centuries, was in substance this,—that the salvation of sinful men, in so far as they might need salvation, was to be ascribed, not to the one true God, the Father, the Son, and the Holy Ghost, but to men themselves and to what they could do, or to what could be done for them by their fellow-men and other creatures. This, more or less fully developed, was the great heresy which lay under the whole elaborate externalism of the mediaeval and Romish religion. Almost everything that is distinctive, either in the specific tenets and practices, or in the more general features and tendencies, of the full-blown popery with which the Reformers had to contend, might be traced back, more or less directly, to this great principle; while, on the other hand, almost all the particular features of the system tended to deepen and strengthen in men’s minds the comprehensive heresy in which they had their root and origin.

Calvin saw that the only effectual way of dealing with this great perversion of the way of salvation, — so well fitted to lead men to build upon a false foundation their hopes of heaven, — the only way to overturn it root and branch, to demolish at once the whole height of the superstructure and the whole depth of the foundation, — was to bring out fully and definitely the whole doctrine of Scripture concerning the place held in the salvation of sinners by the Father, by the Son, and by the Holy Ghost. He made it his great object to bring out and to embody the whole doctrine of Scripture upon these subjects, and accordingly Calvinism is just a full exposition and development of the sum and substance of what is represented in Scripture as done for the salvation of sinners by the three persons of the Godhead.

It represents the Father as arranging, in accordance with all the perfections of His nature and all the principles of His moral government, and at the same time, with due regard to the actual capacities and obligations of men, the whole provisions of the scheme of redemption, choosing some men to grace and glory, and sending His Son to seek and to save them. It represents the Son as assuming human nature, and suffering and dying as the Surety and Substitute of His chosen people, — of those whom the Father had given Him in covenant, — of an innumerable multitude out of every kindred and nation and tongue, — as bearing their sins in His own body, and bearing them away, — as doing and bearing everything necessary for securing their eternal salvation.

It represents the Holy Spirit as taking of the things of Christ and showing them to men’s souls, as taking up His abode in all whom Christ redeemed with His precious blood, effectually and infallibly determining them to faith and holiness; and thus applying the blessings of redemption to all for whom Christ purchased them, and finally preparing them fully for the inheritance of the saints.

These are in substance the views given us in Scripture of the way in which sinners of the human race are saved. They are views which, as experience fully proves, are most offensive to the natural tendencies and inclinations of men’s hearts; and plainly as they are taught in Scripture, there is a constant and powerful disposition, — especially when true religion is in a low or languishing condition, — to reject them or explain them away, and to substitute in their room notions which, more or less directly, exclude or contradict them. They certainly had been thoroughly excluded from the practical teaching, and from the whole plans and arrangements of the church, at the period of the Reformation; while it is true, on the other hand, — and it is this with which at present we have more immediately to do, — that these views, and these alone, overturn from the foundation the whole system of notions which then generally prevailed, and which so fearfully perverted the way of salvation.

We believe that it is impossible to bring out accurately, fully, and definitely, the sum and substance of what is taught in Scripture concerning the place which the Father, the Son, and the Holy Ghost hold in the salvation of sinners, without taking up Calvinistic ground, — without being in a manner necessitated to assert the fundamental principles of the Calvinistic system of theology. It is, we believe, impossible otherwise to do full justice, and to give full effect, to what Scripture teaches, concerning the sovereign supremacy of the Father in determining the everlasting destiny of His creatures, — concerning the death and righteousness of Christ, as of infinite worth and value, and as infallibly efficacious for securing all the great objects to which they are directed, — and concerning the agency of the Holy Spirit in certainly and infallibly uniting to Christ through faith all whom the Father had given to Him, and preserving them in safety unto His eternal kingdom.

Those who reject or put aside the peculiar doctrines of Calvinism can, we think, be shown to be practically, and by fair construction, withholding from God, the Father, the Son, and the Holy Ghost, more or less of the place and influence which the Scripture assigns to them in the salvation of sinners; and to be giving to men themselves, or at least to creatures, a share in effecting their salvation which the Scripture does not sanction. And when Calvinistic principles are rejected or thrown into the background, not only is something, more or less, of necessity taken from the Creator and assigned to the creature, but an opening is made, — an opportunity is left, — for carrying on this process of transferring to man what belongs to God to almost any extent, until the scriptural method of salvation is wholly set aside or overturned.</p></blockquote>

nd+arrangements+of+the+church%2C+at+the+period+of+the+Reformation%3B+while+it+is+true%2C+on+the+other+hand%2C+%E2%80%94+and+it+is+this+with+which+at+present+we+have+more+immediately+to+do%2C+%E2%80%94+that+these+views%2C+and+these+alone%2C+overturn+from+the+foundation+the+whole+system+of+notions+which+then+generally+prevailed%2C+and+which+so+fearfully+perverted+the+way+of+salvation.%0A%0AWe+believe+that+it+is+impossible+to+bring+out+accurately%2C+fully%2C+and+definitely%2C+the+sum+and+substance+of+what+is+taught+in+Scripture+concerning+the+place+which+the+Father%2C+the+Son%2C+and+the+Holy+Ghost+hold+in+the+salvation+of+sinners%2C+without+taking+up+Calvinistic+ground%2C+%E2%80%94+without+being+in+a+manner+necessitated+to+assert+the+fundamental+principles+of+the+Calvinistic+system+of+theology.+It+is%2C+we+believe%2C+impossible+otherwise+to+do+full+justice%2C+and+to+give+full+effect%2C+to+what+Scripture+teaches%2C+concerning+the+sovereign+supremacy+of+the+Father+in+determining+the+everlasting+destiny+of+His+creatures%2C+%E2%80%94+concerning+the+death+and+righteousness+of+Christ%2C+as+of+infinite+worth+and+value%2C+and+as+infallibly+efficacious+for+securing+all+the+great+objects+to+which+they+are+directed%2C+%E2%80%94+and+concerning+the+agency+of+the+Holy+Spirit+in+certainly+and+infallibly+uniting+to+Christ+through+faith+all+whom+the+Father+had+given+to+Him%2C+and+preserving+them+in+safety+unto+His+eternal+kingdom.%0A%0AThose+who+reject+or+put+aside+the+peculiar+doctrines+of+Calvinism+can%2C+we+think%2C+be+shown+to+be+practically%2C+and+by+fair+construction%2C+withholding+from+God%2C+the+Father%2C+the+Son%2C+and+the+Holy+Ghost%2C+more+or+less+of+the+place+and+influence+which+the+Scripture+assigns+to+them+in+the+salvation+of+sinners%3B+and+to+be+giving+to+men+themselves%2C+or+at+least+to+creatures%2C+a+share+in+effecting+their+salvation+which+the+Scripture+does+not+sanction.+And+when+Calvinistic+principles+are+rejected+or+thrown+into+the+background%2C+not+only+is+somethi <blockquote><p>To the first, we answer, That now nature being corrupted, it can be no good rule to try what is truth concerning God by it; it can hardly be denied, if nature be considered as in Adam at the beginning, but to him there was clearness in this mystery, there being express mention of the blessed Trinity in his creation, as the word, Let Us make man according to Our Image, doth import: which is not for nought mentioned then, more than formerly, especially, considering that excellent knowledge that Adam was furnished with, which was a part of the Image of that One God, who is Father, Son, and Spirit.

But, not to insist in this, we say, secondly, That if by nature, as it is now corrupted, what is tolerable or intolerable in the matters of Religion were to be tried, then were the whole Doctrine of the Gospel and Redemption through the Mediator, to be accounted no fundamental thing; and consequently, no Error, destroying it, were to be restrained, because nature hath not discovered that. That therefore must be an unsafe rule to walk by.

And indeed if a master of a family and father, who yet, as such, is (to say so) a servant of nature, is not by that exempted from the obligation of bringing up his children and servants in the knowledge of God according to the Gospel; but is notwithstanding to exercise his authority in the restraining of every thing contrary thereunto according to his station. Can it be thought, that a Magistrate, who must count for his Authority over a people, as a master must do for his, over a family, is less obliged thereunto? For, Christians are to be Christians in their stations, as in their personal carriage; and so to seek the promoving of the Gospel, and the restraining of what may mar it according to their station.

Thirdly, we answer, That even this may be drawn from the Moral Law of God; wherein not only the true God is alone to be worshipped, as in the first Command; but also accordingly as he hath prescribed and revealed in His Word, which is the sum of the second Command. Now, this being true, that the Lord hath thus revealed Himself to be worshipped according to the Gospel, it becomes no less necessary to Worship God in that manner, than to Worship Him, who is the true God; and so, is by the first Command, and according to the light of nature, Magistrates should restrain, and not suffer what is inconsistent with the worshipping of the One true and living God, so is he, by the second Command and that same light of nature, obliged to restrain all manner of Doctrine and Worship, that is inconsistent with what he hath revealed, according to the second.</p></blockquote>

<blockquote><p>IT is a great, as well as a true Observation, which I have read in a Learned Man; namely, That all the many various Attributes of God mentioned in the Scripture, are no other than his very Essence, and are ascribed to him to help us in our Conceptions and Understandings of Him, who are not able to apprehend what may be known of God, under any one Name or Notion, or by any one Act of the Intellect.

We read (you know) of his Power, his Wisdom, his Holiness, his Justice, his Goodness, his Faithfulness, his All-sufficiency, and the like, all which are not distinguished in him, either from himself, or from one another, but are all one and the same God revealed and manifested to us, under various notions, and that to help us the better to conceive and apprehend him, as also to perform our homage and worship to him; accordingly we may say, the Holiness of God, is God; the Wisdom of God, is God; the Power of God, is God; the Goodness of God, is God:

And to come to my Text, the Unchangeableness of God, is God; and indeed the unchangeableness of God, is God manifested and revealed under a sweet and blessed, as well as a glorious Notion to us, under such a Notion as conduces-much to the quickening and encouraging of our Faith and Love, our Comfort and Obedience in him, and to him; and so indeed the Text represents it, I am the Lord, I change not, therefore ye Sons of Jacob are not consumed: …</p></blockquote>

</figure><figure class="quote" id="q-af72e01c3d" data-kw="">
<blockquote><p>The operation of the Holy Spirit, although indescribable, is very remote from enthusiasm. In enthusiasm the objects which are impressed on the mind, do not come from without, but are inwardly suggested by the mind itself. But in the Spirit’s operations the object is always understood to make its approach from without, and to be derived from the word. Enthusiasm takes place by sudden motions, which go before reason itself, and often exclude it altogether; the operation of the Spirit draws along with it the cordial consent of the will. Once more, enthusiasm affects the mind, while the will often remains unchanged; and hence it is found even in the ungodly; whereas the operations of divine grace necessarily include a change of the heart.

Although we cannot explain the operation of grace, yet we may make a few remarks upon it. We believe, then, that this divine work exercises an immediate influence on the body and on the soul, in order that the passions may not pervert our reason and judgment. It also prevents such motions from being excited within the brain, as would excite evil thoughts in the mind. It calls off the mind from all those ideas and thoughts which would divert it from holiness.

It prevents those objects from fastening on the mind, which have a tendency to corrupt it. It induces such attention, during the reading or hearing of the word, as prevents the mind from forming a hasty or wrong judgment. It very often suggests and brings to remembrance the truths which we have heard or read. It fills the mind with great delight, either when we read the word, or are desirous of reducing it to practice. Lastly, it increases this sacred pleasure more and more, so as to overcome the pleasures of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 7.3, p. 342.</span></figcaption>

</figure><figure class="quote" id="q-2e48482c81" data-kw="">
<blockquote><p>Whatsoever, therefore, is spoken of God, is not God; but serves rather to help our weak understanding, to conceive in our reason, and to utter in our speech, the majesty of his divine nature, so far as he hath vouchsafed to reveal himself to us in his word.

1. All the attributes of God belong to every of the three Persons, as well as to the essence itself, with the limitation of a personal propriety. As the mercy of the Father is mercy begetting, the mercy of the Son is mercy begotten, the mercy of the Holy Ghost is mercy proceeding: and so of the rest.

2. The essential attributes of God differ not from his essence; because they are so in the essence, that they are the very essence itself. In God, therefore, there is nothing which is not either his essence or person.

3. The essential attributes of God differ not essentially or really one from another, because whatsoever is in God, is one most simple essence, and admits no division, but only in our reason and understanding, which being not able to know earthly things by one simple act, without the help of many distinct acts, must of necessity have the help of many distinct acts to know the incomprehensible God.

Therefore, to speak properly, there are not in God many attributes, but one only, which is nothing else but the Divine Essence itself, by what attribute soever you call it. But in respect of our reason, they are said to be so many different attributes; for our understanding conceives by the name of mercy, a thing different from that which is called justice. The essential attributes of God are not therefore really separate.

4. The essential attributes of God are not parts or qualities of the divine essence, nor accidents in the essence, nor a subject, but the very whole and entire essence of God; so that every such attribute is not aliud et aliud, another and another thing, but one and the same thing. There are therefore no quantities in God, by which he may be said to be so much and so much; nor qualities, by which he may be said to be such and such; but whatsoever God is, he is such and the same by his essence. By his essence he is wise, and therefore wisdom itself; by his essence he is good, and therefore goodness itself; by his essence he is merciful, and therefore mercy itself; by his essence he is just, and therefore justice itself, &amp;c.

In a word, God is great, without quantity; good, true, and just, without quality; merciful, without passion; an act, without motion; everywhere present, without sight; without time, the first and the last; the Lord of all creatures, from whom all receive themselves, and all the good they have, yet neither needeth nor receiveth he any increase of goodness or happiness from any other.

This is the plain description of God, so far as he hath revealed himself to us in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 23-24.</span></figcaption>

</figure><figure class="quote" id="q-eee053512b" data-kw="">
<blockquote><p>Nothing does more to encourage true godliness than constant and deep meditation on the goodness and free mercy of God. Those who make good use of the benefits they receive from other people are motivated by sincere gratitude, whereas neglect of such benefits is a sure sign of ingratitude. Likewise, those who remember all the care and trouble their parents went to on their behalf cannot be anything but devoted and attentive to them. So those for whom God has done so much ought to meditate constantly on the goodness he has given them so far and realize what a great debt they owe him.

But we shall never recognize the magnitude of God’s benefits unless we compare the dignity of being children of God, into which Christ Jesus has raised us and which he has given us in the freedom of the Spirit so that we can call on God with the sweetest name of Father, with that unhappy and deplorable state in which we were born. If everyone devoted as much time to thinking about this as they should, they would soon develop a wonderfully intense desire to live in a godly way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 186-87.</span></figcaption>

<blockquote><p>Q. 1. Is there but one God to whom these properties do belong?

A. One only, in respect of his essence and being, but one in three distinct persons, of Father, Son, and Holy Ghost. Deut. vi. 4; Matt. xix. 17; Eph. iv. 5, 6. Gen. i. 26; 1 John v. 7; Matt. xxviii. 19.

Q. 2. What mean you by person?

A. A distinct manner of subsistence or being, distinguished from the other persons by its own properties. John v. 17; Heb. i. 3.

Q. 3. What is the distinguishing property of the person of the Father?

A. To be of himself only the fountain of the Godhead. John v. 26, 27; Eph. i. 3.

Q. 4. What is the property of the Son?

A. To be begotten of his Father from eternity. Ps. ii. 7; John i. 14, iii. 16.

Q. 5. What of the Holy Ghost?

A. To proceed from the Father and the Son. John xiv. 17, xvi. 14, xv. 26, xx. 22.

Q. 6. Are these three one?

A. One every way, in nature, will, and essential properties, distinguished only in their personal manner of subsistence. John x. 30; Rom. iii. 30. John xv. 26; 1 John v. 7.

Q. 7. Can we conceive these things as they are in themselves?

A. Neither we nor yet the angels of heaven are at all able to dive into these secrets, as they are internally in God; but in respect of the outward dispensation of themselves to us by creation, redemption, and sanctification, a knowledge may be attained of these things, saving and heavenly. 1 Tim. vi. 16. Isa. vi. 2, 3. Col. i. 11–14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Short Catechisms: Wherein the Principles of the Doctrine of Christ are Unfolded and Explained</cite>, (1645) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 1: 472-73.</span></figcaption>

</figure><figure class="quote" id="q-aa8386c989" data-kw="">
<blockquote><p>What an adorable being is the Triune God! How gloriously mysterious in his being, attributes, operations, and personal acts! How little are we capable of knowing of this infinite Being. “None by searching can find out the Almighty to perfection.” Where the feelings of the heart are right, the incomprehensible nature of the divine existence causes no obstruction to genuine devotion.

Indeed, the soul of man is so constituted as to require an incomprehensible Being as the object of worship. Profound adoration is the very feeling which corresponds with this attribute.. Were it not so, the angels in heaven would be perplexed and unhappy; for the more is known of God, the more mysteries are perceived in the divine character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), pp 55-56.</span></figcaption>

<blockquote><p>In brief therefore, here it is said, that in the unity of the Godhead there be three Persons; that is, though there be but one living and true God, yet there are three Persons, who are that one living and true God. Though the true God be but one in substance, yet he is three in subsistence; and so three in subsistence, as still to be but one in substance. And these three Persons, every one of which is God, and yet all three but one God, are really related to one another: as they are termed in the scripture, one is a Father, the other a Son, the other an Holy Ghost.

The first is Father to the second; the second is Son to the first; the third is neither Father nor Son, but the issue or Spirit of both. The first was a Father from eternity, as well as God; the second was God from eternity, as well as a Son; the third was both Holy Ghost and God from eternity, as well as either of them. The Father is the first person in the Deity; not begotten, nor proceeding, but begetting: the Son the second person; not begetting nor proceeding, but begotten: the Holy Ghost the third; not begotten, nor begetting, but proceeding. The first is called the Father, because he begot the second; the second is called the Son, because he is begotten of the Father; the third is called the Holy Ghost, because breathed both from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

<blockquote><p>13 God gave being unto all things Therefore he is the first, chief and independent Being.

14 He is [a se], that is, He hath his Being from himself. Scal. He is … Being above all beings. Dionys. lib. 1 De Divinis nom. cap. 1.

15 He is the Essence of all essences the Creator of all creatures, the Life of all lives, the Cause of all causes.

16 He it is that giveth all unto all but receiveth not ought from any.

17 Above him, is nothing; without him, is nothing; beneath him, is nothing: Under him, is all; in him, is all with him, is all: From him, are all things by him, are all things; in him, are all things. Aug. De Spec. cap. 33.

18 Between the Essence of God and the essence of the creatures there is an infinite difference: God’s Essence is after a singular, peculiar, and supereminent manner.</p></blockquote>

</figure><figure class="quote" id="q-6178fb71dc" data-kw="">
<blockquote><p>Did we know what being and life are, we might possibly form some satisfying conception, though nothing that could deserve the name of an idea; and here we are taught to fix our last resource, by the name that God hath chosen for himself, and which distinguishes him from every other being, Jehovah, which is best rendered by, He that is,—the possessor and proprietor of being; and, consequently, of all measures and degrees of perfection.

The nearer we can raise our conceptions to this, which always implies life, and all its powers, the nearer will we approach to right conceptions of that incomprehensible being, who hath condescended to give an authentic history of his works and ways, by which he hath discovered himself to us in his true character, and the perfections which belong to him.

However we may be forced to apprehend the divine perfections separately, or in different views, they are all one in the divine essence. Perfect being is perfect forever; and perfect power cannot be conceived without absolute perfection subsisting in the most perfect manner.</p></blockquote>

<blockquote><p>God is said to be powerful, because he can do more then he will: he could of stones have raised children to Abraham, but he would not; and when our blessed Lord was apprehended, he tells Peter, that he could have obtained of his Father, more then twelve legions of Angels to help him, but he would not: He can do more then he will, but he will not do all that he can.

It meets with those that deny this to God: Plinius Secundus [Pliny the Elder] saith, God is not Almighty, because he cannot lie nor deceive: Ludovicus Vives [Juan Luis Vives] wonders at this, saying, I admire that a man so wise should cavil at God’s power; but Saint Augustine answers him well, and saith, therefore is God omnipotent, because he cannot he nor deceive, for these argue impotency.

Secondly, it confutes others, who say God is not so powerful as the Scripture makes him to be, because he cannot make a thing to be against its nature, as to bee, and not to be: to whom I answer, things which in their nature are simply impossible (with reverence be it spoken) God cannot do; but all other things, though impossible to created nature, God can do; therefore this vain objection doth not disparage God’s power.</p></blockquote>

</figure><figure class="quote" id="q-a01af3c2e7" data-kw="">
<blockquote><p>The promise embodied in these words [John 7:37-39] refers to the Holy Ghost, whose living waters could be imparted in only a stinted measure, under the Old Testament, seeing the Saviour was not yet glorified. Accordingly, it is observed by Dr [John] Owen, that those passages in the prophetic Scriptures which speak of the Spirit being “poured out,” always refer to New Testament times — the term “pouring out” indicating an exuberant abundance, such as could not be granted till the great sacrifice was offered. The increased measures of spiritual influence attest God’s acceptance of Christ’s expiation. A holy God granted straitened supplies under the legal system, to intimate that the great atonement was not offered; and then, after it was presented, to show it was embued with infinite intrinsic merit, his gifts and graces were showered down in unrestricted copiousness.

When it is said, “the Holy Ghost was not yet given,” this does not mean that his sanctifying influences were never diffused over the hearts of men. Christ uses similar phraseology, when, in his parting address to his disciples, he says (John xvi. 16, 17), “I will pray the Father, and he will give you another Comforter, even the spirit of truth,” &amp;c.: “but ye know him, for he dwelleth in you, and shall be in you.”

What he did when inspiring the prophets, and imparting gifts and graces in former times, was ascribed to Jehovah; but after Christ left the world, and he remained the only person of the Godhead, immediately working in the Church, all his operations were attributed to himself, as the Third Person of the glorious Trinity. He was to step forth with a kind of visible pomp, to manifest himself as the agent who was to apply to the Church what Christ had purchased; and we are, therefore, to expect from him such an effusion of living water, as will constitute an unequivocal evidence that Christ is now seated at God’s right hand.

The words of the text imply, not only the communication of the Spirit’s influence, as the sun’s beams animate the earth, though the residence is aloft in the firmament above our heads — they imply the inhabitation of the Divine agent himself — the Sun as well as the sunbeams must be introduced into the soul. The Spirit is the well, and his quickening and sanctifying operations, creating the virtues of the Christian character in us, are the waters bubbling up in us. No stock of grace in a saint has such elements of durability, as that it could be called a perennial spring. Our heavenly frames, on a Sabbath or Sacramental season would be succeeded by blighting worldliness, or utter decay, were it not that the Spirit, with his vital energy, abides in us — the fountain is ever flowing, because the Spirit is ever abiding in the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-cumming.html">Alexander Cumming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dispensation of the Spirit in Gospel Times. (Preached before the Free Synod of Perth, 15th October 1844, and published at their request.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

er-cumming-on-christs-death-and-the-spirits-outpouring/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f574b848fa" data-kw="">
<blockquote><p>God is essentially holy, and in this sense, none is holy but himself. Now essential holiness is all one with God himself. God’s essential holiness is God’s conformity to himself. Holiness in God is not a quality, but his essence. … Whatsoever is in God, is God. Holiness in angels and saints is but a quality, but in God it is his essence. The fallen angels keep their natures, though they have lost their holiness; for that holiness in them was a quality, and not their essence.

Look, as created holiness is the conformity of the reasonable creature to the rule, so the uncreated holiness of God is God’s conformity unto himself. God’s holiness and his nature are not two things, they are but one. God’s holiness is his nature, and God’s nature is his holiness. God is a pure act, and therefore, whatsoever is in God is God. It is God’s prerogative royal to be essentially holy. The most glorious creatures in heaven, and the choicest souls on earth, are only holy by participation: 1 Sam. ii. 2, ‘There is none holy as the Lord.’

God’s holiness is so essential and co-natural to him, that he can as soon cease to be, as cease to be holy. Holiness in God is a substance, but in angels and men it is only an accident, or a quality. The essence of the creature may remain when the holiness of the creature is lost, as you may see in Adam, and the fallen angels; but God’s essence and his holiness are always the same. His very nature is holy, and therefore it is that he is called ‘Jehovah,’ and ‘I am,’ because what he is really, that he is essentially, Exod. iii. 14.

Though men, for our information, do distinguish between the attributes of God and the nature of God, yet in him they are the same. Look, as the wisdom of God is the wise God, and the truth of God the true God, and the power of God the powerful God, and the justice of God the just God, and the mercy of God the merciful God, and the mightiness of God the mighty God, and the righteousness of God the righteous God, and the graciousness of God the gracious God, so the holiness of God is the holy God. God’s nature and his name are one and the same. God is essentially holy, and that is the top of all his glory.</p></blockquote>

— Thomas Brooks, The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 392-93.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+is+essentially+holy%2C+and+in+this+sense%2C+none+is+holy+but+himself.+Now+essential+holiness+is+all+one+with+God+himself.+God%E2%80%99s+essential+holiness+is+God%E2%80%99s+conformity+to+himself.+Holiness+in+God+is+not+a+quality%2C+but+his+essence.+%E2%80%A6+Whatsoever+is+in+God%2C+is+God.+Holiness+in+angels+and+saints+is+but+a+quality%2C+but+in+God+it+is+his+essence.+The+fallen+angels+keep+their+natures%2C+though+they+have+lost+their+holiness%3B+for+that+holiness+in+them+was+a+quality%2C+and+not+their+essence.%0A%0ALook%2C+as+created+holiness+is+the+conformity+of+the+reasonable+creature+to+the+rule%2C+so+the+uncreated+holiness+of+God+is+God%E2%80%99s+conformity+unto+himself.+God%E2%80%99s+holiness+and+his+nature+are+not+two+things%2C+they+are+but+one.+God%E2%80%99s+holiness+is+his+nature%2C+and+God%E2%80%99s+nature+is+his+holiness.+God+is+a+pure+act%2C+and+therefore%2C+whatsoever+is+in+God+is+God.+It+is+God%E2%80%99s+prerogative+royal+to+be+essentially+holy.+The+most+glorious+creatures+in+heaven%2C+and+the+choicest+souls+on+earth%2C+are+only+holy+by+participation%3A+1+Sam.+ii.+2%2C+%E2%80%98There+is+none+holy+as+the+Lord.%E2%80%99%0A%0AGod%E2%80%99s+holiness+is+so+essential+and+co-natural+to+him%2C+that+he+can+as+soon+cease+to+be%2C+as+cease+to+be+holy.+Holiness+in+God+is+a+substance%2C+but+in+angels+and+men+it+is+only+an+accident%2C+or+a+quality.+The+essence+of+the+creature+may+remain+when+the+holiness+of+the+creature+is+lost%2C+as+you+may+see+in+Adam%2C+and+the+fallen+angels%3B+but+God%E2%80%99s+essence+and+his+holiness+are+always+the+same.+His+very+nature+is+holy%2C+and+therefore+it+is+that+he+is+called+%E2%80%98Jehovah%2C%E2%80% </figure><figure class="quote" id="q-9162d78371" data-kw="">
<blockquote><p>Consider those men who are devoted to horse racing. They are named after the colours and the sides on which they have placed themselves. You know the names without my mentioning them. If it is thus that you have got the name of Christian, the mere title is a very small thing even though you pride yourself upon it. But if it is because you believe Him to be God, shew your faith by your works. If the Son is a creature, even now also you are worshipping the creature instead of the Creator. If the Holy Ghost is a creature, you are baptized in vain, and are only sound on two sides, or rather not even on them; but on one you are altogether in danger.

Imagine the Trinity to be a single pearl, alike on all sides and equally glistening. If any part of the pearl be injured; the whole beauty of the stone is gone. So when you dishonour the Son in order to honour the Father, He does not accept your honour. The Father doth not glory in the dishonour of the Son. If a wise Son maketh a glad Father, how much more doth the honour of the Son become that of the Father! And if you also accept this saying, My Son, glory not in the dishonour of thy Father, similarly the Father doth not glory in the Son’s dishonour. If you dishonour the Holy Ghost, the Son receiveth not your honour. For though He be not of the Father in the same way as the Son, yet He is of the same Father.

Either honour the whole or dishonour the whole, so as to have a consistent mind. I cannot accept your half piety. I would have you altogether pious, but in the way that I desire. Pardon my affection: I am grieved even for those who hate me. You were one of my members, even though you are now cut off: perhaps you will again become a member; and therefore I speak kindly. Thus much for the sake of the Eunuchs, that they may be chaste in respect of the Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 6-7 in Nicene and Post-Nicene Fathers 2, 7: 343.</span></figcaption>

</figure><figure class="quote" id="q-c49cf11a3d" data-kw="">
<blockquote><p>Without believing this mystery of the Trinity, we cannot be saved, and it is therefore utterly ungodly, damning, and atheistic to maintain with the Remonstrants that it is not absolutely necessary to believe that God is a triune God. If it is not necessary unto salvation to believe that God is a triune God, then it is also not necessary unto salvation to believe that there is a God.

For he who believes that God is who He is must acknowledge and embrace Him as He is, namely, one in essence and three in persons. Otherwise, such a person will deny the true God and believe an idol that is a fabrication of his own imagination—an idol that is a nonentity in this world.

Therefore, he who does not wholeheartedly believe and confess that God is a triune God has never seen nor known God. He is a public denier of God, because He fully denies the true triune God, and apart from Him, there is no God. He is one who is openly wicked and entirely estranged from God and His blessed communion, for we can have communion only with a God who is triune.

Our approach unto God the Father must take place in and through God the Son as the only way to the Father; and unto God the Son we must be brought and led by God the Holy Spirit. Therefore, he who does not wholeheartedly believe in a triune God is guilty of not accepting the testimony that God has given of Himself, but rather, he makes God to be a liar, denies Him, and neither can have communion with Him to all eternity nor enter into the kingdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 135.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

f+the+Heidelberg+Catechism%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%281838-44%3B+2+vols%2C+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2016%29%2C+1%3A+135.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc49cf11a3d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c49cf11a3d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/29/theodorus-vandergroe-belief-in-the-trinity-is-essential-to-salvation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5f98552738" data-kw="">
<blockquote><p>Next he comes to the Father, and he says, and God our Father. There then the two persons which are the two fountains of all grace that comes to man in the world. Mark here a double honour given to Christ. First he is joined with the Father as a fountain of all grace, and next he is first named: for he says, I pray the Lord Jesus: and then he says, and God our Father. He puts the Father in the second room, albeit in other places he puts God the father in the first room, as ye may find in all his salutations. Now what must follow on this? Even this, that Jesus Christ is very God, as he is very man, coessential of the same nature with God, coequal, of the same dignity and majesty with the Father, and coeternal with him; if this were not, he could not have given him such a style without blasphemy against God.

The old Heretics thought they got a great advantage of such places of the Scripture that placed the Father in the first room, to conclude that Jesus Christ was not only inferior, but far unequal to God the Father, and especially they gather it out of these words, I baptise thee in the name of the Father, and of the Son, &amp;c. Ergo, say they, the Son is inferior. But look here and ye will find that Christ is named in the first room.

That old doctor Chrysostom when he has reasoned against this fond opinion, at last he concludes. They are equal in eternity, dignity and in every thing, that is, or may be called truly God. Indeed the Father is the first person, but that makes not that the Father is above the Son; for there is equality in dignity and essence, and therefore he whiles puts the one before the other, and that not in respect of any supremacy, but to testify that Jesus Christ our Saviour and the Father is one, and equal in every respect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, p. 109.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

<blockquote><p>But God being a pure Spirit, without any mixture of body or matter, is never weary in his thoughts, purposes, and designs, neither doth he discourse after the manner of men, drawing a conclusion from the Premises, neither doth he think of one thing, and then of another, for there is not in him (I mean in his wisdom and intelligence, no more then in the Eternity of his duration) neither first nor second prius &amp; posterius, but all these thoughts, designs, counsels, and resolutions, are in him but one single and pure act, by which he sees, knows, understands, wills, and ordereth all things; his most pure, and perfect simplicity (which agreeth with so excellent and infinite a Nature) requireth that, and it implies a contradiction, that there should be in his Essence any variableness, or shadow of turning[.]

[W]e do conceive the Essence of God, his virtues, and properties, his wisdom, power, understanding, his will, that is to say, his Counsels, and designs, as by so many images, forms, and distinct conceptions, because that being corporeal, and finite, and he a Spirit, altogether infinite, we cannot see, nor comprehend what God is in himself, but we know well nevertheless, that Gods perfection, and simplicity doth not admit of so many things wholly different one from another; neither doth it imply that they be in his Essence formaliter (as the Schoolmen say) but eminenter, &amp; causaliter, as we hold that the Sun is not in his substance and Essence hot as the fire is, but only as he is the cause of heat every where.

It is then a very low thought of God, to imagine, that he labours in thinking, or designing any thing, or that he wearies himself in acting, and from thence, that he grows melancholy, and sad, and that this troubles his repose, and content, and in some manner abates from his felicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), pp 69-71.</span></figcaption>

</figure><figure class="quote" id="q-3bc4224d2d" data-kw="">
<blockquote><p>I hope I need not caution some in this assembly that they beware of imagining these various perfections of God, under the names of mercy, truth, righteousness and peace, as if they were really distinct and different things in God; or, as if they were really different parties, making a formal consultation, in order, to their agreement; For God is one, and cannot be divided; he is one infinite, eternal and unchangeable Being; there are not distinct and different things in his nature and essence, however his perfections be thus represented to our weak, finite capacities, which cannot understand the perfections of God but in several parts, as it were.

By mercy then, here, we are to understand God himself, as he is a merciful and a gracious God: By truth we are to understand the same God, as he is a true and faithful God: By righteousness we may understand his justice, or God himself, as he is a just and righteous God; and, by peace, the same God, as he is the God of peace, and a God reconciling the world to himself. So that the whole comes to this; it is the great and eternal God himself, consulting with himself, in a manner becoming his infinite and adorable perfections, how to glorify himself in all his glorious attributes in the way of saving sinners in and by Jesus Christ.</p></blockquote>

</figure><figure class="quote" id="q-2dafe2f33a" data-kw="">
<blockquote><p>After the unity of the Godhead asserted, here we have the nature of that one God described; and that by those properties, which the scriptures, that he hath revealed to us, and the reason that he hath implanted in us, attribute and ascribe unto him. Where by properties we are not to understand several faculties, habits, or qualities, as they are in us. For there is nothing in God, but what is God: the mercy of God is the same with the God of mercy; the power of God the same with the God of power; the love of God the same with the God of love; and the truth of God the same with the God of truth.

These properties of mercy, power, love, &amp;.c., as they are in us, they are accidents, and so really distinguished both from our souls, and from one another: but as they are in God, they are his nature and essence; and so neither distinguished from one another, nor from him in whom they are said to be. Distinguished from him or his essence they can- not be, for then he would be of himself imperfect; there being some property or perfection, which in his own nature he is not.

And again, if the properties of God should be really distinguished from himself, in themselves they would be either finite or infinite. Finite they could not all be; for infinitude itself is one of his properties, yea, and in our conception a property of all his other properties; so that his wisdom, power, justice, are all infinite, otherwise they would be imperfect: and therefore it is impossible all his properties, or indeed any of them, should be finite. And as they are not finite, so neither can they be infinite, if really distinguished from his essence: for then there would be something really distinguished from God infinite as well as God; and by consequence either God must not be infinite, and so not God; or else there must be two, yea, many infinites, which is as great an absurdity as the former.

And therefore we must needs acknowledge, that the properties of God are not really distinguished from the essence of God: but that the properties attributed to his essence are really the same with his essence to which they are attributed. So that his power, wisdom, goodness, truth, and the like, are all his essence, nature, or substance. And as they are not distinguished from his essence, so neither are they distinguished from one another; for then they must be really distinguished from his essence too, it being impossible that they should be all really and essentially distinct from one another, and yet be all but one and the self-same essence. And again, if they should be really distinguished from one another, then God would be compounded or made up of several distinct properties, and so not a simple, and therefore not a perfect God.

But by the properties therefore of God, we are to understand the several apprehensions that we have of him, according to the several manifestations that he maketh of himself to us. Which variety of discoveries of himself he maketh to us according to the variety of the objects which we apprehend him to act upon, and the variety of the circumstances that those objects may lie under. God in himself is a most simple and pure act, and therefore, as I have shewed, cannot have any thing in himself but himself, but what is that pure and simple act itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 13-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

— William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 13-15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAfter+the+unity+of+the+Godhead+asserted%2C+here+we+have+the+nature+of+that+one+God+described%3B+and+that+by+those+properties%2C+which+the+scriptures%2C+that+he+hath+revealed+to+us%2C+and+the+reason+that+he+hath+implanted+in+us%2C+attribute+and+ascribe+unto+him.+Where+by+properties+we+are+not+to+understand+several+faculties%2C+habits%2C+or+qualities%2C+as+they+are+in+us.+For+there+is+nothing+in+God%2C+but+what+is+God%3A+the+mercy+of+God+is+the+same+with+the+God+of+mercy%3B+the+power+of+God+the+same+with+the+God+of+power%3B+the+love+of+God+the+same+with+the+God+of+love%3B+and+the+truth+of+God+the+same+with+the+God+of+truth.%0A%0AThese+properties+of+mercy%2C+power%2C+love%2C+%26.c.%2C+as+they+are+in+us%2C+they+are+accidents%2C+and+so+really+distinguished+both+from+our+souls%2C+and+from+one+another%3A+but+as+they+are+in+God%2C+they+are+his+nature+and+essence%3B+and+so+neither+distinguished+from+one+another%2C+nor+from+him+in+whom+they+are+said+to+be.+Distinguished+from+him+or+his+essence+they+can-+not+be%2C+for+then+he+would+be+of+himself+imperfect%3B+there+being+some+property+or+perfection%2C+which+in+his+own+nature+he+is+not.%0A%0AAnd+again%2C+if+the+properties+of+God+should+be+really+distinguished+from+himself%2C+in+themselves+they+would+be+either+finite+or+infinite.+Finite+they+could+not+all+be%3B+for+infinitude+itself+is+one+of+his+properties%2C+yea%2C+and+in+our+conception+a+property+of+all+his+other+properties%3B+so+that+his+wisdom%2C+power%2C+justice%2C+are+all+infinite%2C+otherwise+they+would+be+imperfect%3A+and+therefore+it+is+impossible+all+his+properties%2C+or+indeed+any+of+them%2C+should+be+finite.+And+as+they+are+not+finite%2C+so+neither+can+they+be+infinite%2C+if+really+distinguished+from+his+essence%3A+for+then+there+would+be+something+really+distinguished+from+God+infinite+as+well+as+God%3B+and+by+consequence+either+God+must+not+be+infinite%2C+and+so+not+God%3B+or+else+there+must+be+two%2C+yea%2C+many+infinites%2C+which+is+as+great+an+absurdity+as+the+former.%0A%0AAnd+therefore+we+must+needs+acknowledge%2C+that+the+properties+of+God+are+not+really+distinguished+from+the+essence+of+God%3A+but+that+the+properties+attributed+to+his+essence+are+really+the+same+with+his+essence+to+which+they+are+attributed.+So+that+his+power%2C+wisdom%2C+goodness%2C+truth%2C+and+the+like%2C+are+all+his+essence%2C+nature%2C+or+substance.+And+as+they+are+not+distinguished+from+his+essence%2C+so+neither+are+they+distinguished+from+one+another%3B+for+then+they+must+be+really+distinguished+from+his+essence+too%2C+it+being+impossible+that+they+should+be+all+really+and+essentially+distinct+from+one+another%2C+and+yet+be+all+but+one+and+the+self-same+essence.+And+again%2C+if+they+should+be+really+distinguished+from+one+another%2C+then+God+would+be+compounded+or+made+up+of+several+distinct+properties%2C+and+so+not+a+simple%2C+and+therefore+not+a+perfect+God.%0A%0ABut+by+the+properties+therefore+of+God%2C+we+are+to+understand+the+several+apprehensions+that+we+have+of+him%2C+according+to+the+several+manifestations+that+he+maketh+of+himself+to+us.+Which+variety+of+discoveries+of+himself+he+maketh+to+us+according+to+the+variety+of+the+objects+which+we+apprehend+him+to+act+upon%2C+and+the+variety+of+the+circumstances+that+those+objects+may+lie+under.+God+in+himself+is+a+most+simple+and+pure+act%2C+and+therefore%2C+as+I+have+shewed%2C+cannot+have+any+thing+in+himself+but+himself%2C+but+what+is+that+pure+and+simple+act+itself.%E2%80%9D%0A%0A%E2%80%94+William+Beveridge%2C+Ecclesia+Anglicana+Ecclesia+Catholica%3B+or%2C+The+Doctri <blockquote><p>V. If any Doctrine be contumelious against God, this is, accusing him of folly, putting upon him human affections, &amp; falsely attributing to him wishes of no strength, and a desire of no force: as if they should bring in God speaking us: I do indeed earnestly desire to save you, but ye hinder, that I cannot do what I desire; I would if you would: therefore seeing by you I am frustrated of my intent, I will change my purpose of saving you, and my will being other wise bent, I have determined to destroy you for ever.

It is certainly plain, that this Antecedent will of God, is not a will; but a desire and wish, which God doth obtain only be entreaty, and as much as he may, by man’s good pleasure. Therefore Arminius doth oftentimes call this will, a desire and natural affection, and it is common to these sectaries to take those places, Psal. 81.14. Esa. 48.18. where God is brought in speaking, as one wishing and desiring, and disappointed of his wish, as if they were properly spoken, when these things are spoken by an Anthropopathy, and after the manner of men.</p></blockquote>

<blockquote><p>All the fulness of the Godhead.] That is, not some portion of the Divinity, which the Gentiles had an erroneous persuasion of concerning their false gods; neither excellent endowments of Divine grace and munificence only, which are common to angels, and prophets, and other holy men: but the Lογος itself—true and perfect God, with all his Divine attributes, namely, infinite wisdom, power, goodness, dwells in this human nature of Christ.

And the Apostle seems to allude to the ark of the covenant: for God promised that he would dwell there, hear them from thence, and be propitious to them: and, furthermore, the Apostle intimates, that the ark and the propitiatory, or mercy-seat, were types of Christ, and that the Deity dwelt in a much more excellent way in his human nature, than he did formerly in the tabernacle, concerning which it is written, Exod. xxix. 44, 45, I will sanctify the tabernacle of the testimony, and I will dwell among the children of Israel, &amp;.c.

As, therefore, the Jews, who had an appointed place whence God uttered his oracles, and made known his will, could not, without sin, enquire elsewhere about things pertaining to God; so we, who have the fulness of the Godhead dwelling in the body of Christ, cannot seek either the will of God or our salvation elsewhere, without the greatest folly and impiety.

Hence we learn,

1. As often as seducers endeavour to lead us away from the Gospel and from Christ, to their traditions and inventions, we must seriously reflect what kind of Saviour and Teacher Christ Jesus was; viz. one in whom dwelt all the fulness of the Godhead; and it is the height of madness to require new teachers after him.

2. Whoever, therefore, wanders out of Christ, or mixes any other thing with his doctrine as necessary to salvation, he accuses Christ of imperfection, and denies the fact that all the fulness of the Godhead dwelt in him.

3. This we observe in the Turks and Jews, who are not content with the Gospel doctrine, because they do not believe that all the fulness of the Godhead dwelt in him who proclaimed the Gospel. As to Papists, who, being fascinated with novel and marvellous error, acknowledge that all the fulness of the Godhead is in Christ, yet deny that all the fulness of salvation is contained in his doctrine, I know not what to say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 412-13.</span></figcaption>

</figure><figure class="quote" id="q-060c269f8a" data-kw="">
<blockquote><p>For some in their lack of understanding do bring down the Only-Begotten Word of God from His Supreme Excellence and lower Him from Equality with God the Father, affirming that He is not Consubstantial, nor liking to crown Him with an Identity Exact and of Nature: others going as it were along the same road with these and falling into the snare of death and pitfall of Hades turn aside the mystery of the Economy with flesh of the Only-Begotten and pursue a folly fraternal (so to speak) with the former.

For the one will be caught dragging down as it were (so far as in them lies) from the heights of His Godhead the Word sprung of God the Father ere yet Incarnate; the others have elected to make war with Him Incarnate, well-nigh finding fault (daring ones!) with His Pitying grace, maintaining forsooth that it counselled not well for that He underwent flesh and the measures of our emptiness, i. e. was made man and was seen on earth and conversed with men though God by Nature and co-seated with the Father. …

God-inspired Scripture therefore will cry out against the unlearning of them both, setting forth to us the truth and shewing that feeble and of none account is their speech, and establishing on the path of the Godhead them who are used to view with subtil and accurate eye of understanding the Mystery thereof.</p></blockquote>

— Cyril of Alexandria, That Christ is One by way of Dispute with Hermias, (c. 431), trans. P. E. Pusey in A Library of Fathers of the Holy Catholic Church, Anterior to the Division of the East and West, Translated by Members of the English Church. Volume 47 (Oxford: James Parker, 1881), pp 238-39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+some+in+their+lack+of+understanding+do+bring+down+the+Only-Begotten+Word+of+God+from+His+Supreme+Excellence+and+lower+Him+from+Equality+with+God+the+Father%2C+affirming+that+He+is+not+Consubstantial%2C+nor+liking+to+crown+Him+with+an+Identity+Exact+and+of+Nature%3A+others+going+as+it+were+along+the+same+road+with+these+and+falling+into+the+snare+of+death+and+pitfall+of+Hades+turn+aside+the+mystery+of+the+Economy+with+flesh+of+the+Only-Begotten+and+pursue+a+folly+fraternal+%28so+to+speak%29+with+the+former.%0A%0AFor+the+one+will+be+caught+dragging+down+as+it+were+%28so+far+as+in+them+lies%29+from+the+heights+of+His+Godhead+the+Word+sprung+of+God+the+Father+ere+yet+Incarnate%3B+the+others+have+elected+to+make+war+with+Him+Incarnate%2C+well-nigh+finding+fault+%28daring+ones%21%29+with+His+Pitying+grace%2C+maintaining+forsooth+that+it+counselled+not+well+for+that+He+underwent+flesh+and+the+measures+of+our+emptiness%2C+i.+e.+was+made+man+and+was+seen+on+earth+and+conversed+with+men+though+God+by+Nature+and+co-seated+with+the+Father.+%E2%80%A6%0A%0AGod-inspired+Scripture+therefore+will+cry+out+against+the+unlearning+of+them+both%2C+setting+forth+to+us+the+truth+and+shewing+that+feeble+and+of+none+account+is+their+speech%2C+and+establishing+on+the+path+of+the+Godhead+them+who+are+used+to+view+with+subtil+and+accurate+eye+of+understanding+the+Mystery+thereof.%E2%80%9D%0A%0A%E2%80%94+Cyril+of+Alexandria%2C+That+Christ+is+One+by+way+of+Dispute+with+Hermias%2C+%28c.+431%29%2C+trans.+P.+E.+Pusey+in+A+Library+of+Fathers+of+the+Holy+Catholic+Church%2C+Anterior+to+the+Division+of+the+East+and+West%2C+Transla <blockquote><p>The expression, “whom the Father hath sanctified,” [John 10:36] must mean, “whom the Father hath set apart, and appointed from all eternity in the covenant of grace, as a priest is sanctified and set apart for the service of the temple.” It cannot mean literally “made holy.” It implies eternal dedication and appointment to a certain office.

This is one of the places which teach the eternal generation of Christ. Long before He came into the world, “the Father” (not God, observe) had sanctified and appointed the Son. He did not become the Son when He entered the world: He was the Son from all eternity.

The expression, “sent into the world,” means that mission of Christ’s to be the Saviour, which took place when he became incarnate, and came among us in the form of a man. He was the Father’s “sent One,” the “Apostle” of our profession. (See Heb. iii. 1; John iii. 17; and 1 John iv. 14.) He that was so “sanctified” and “sent,” might well speak of Himself as the Son of God, and equal with God.</p></blockquote>

<blockquote><p>10 The doctrine concerning the Essence of God, is absolved in this question, What God is: to wit, Jehovah Elohim, One in Essence, three in Persons.

11 For God hath so manifested him self; that in the divine Essence being but one, and that undivided, there are three Persons, neither more nor less; to wit, the Father, the Son, and the Holy Ghost.

13 The Son is the second Person, not made, nor created, but begotten of the Father from all eternity.

14 Who in the fullness of time took upon him our human nature, in which and through which he paid the price of our redemption.

<blockquote><p>To take the measures of absolutely perfect happiness at the lowest, it is evident there must be absolutely perfect possession and enjoyment of complete and absolutely perfectly good; that the matter, the possession, and the enjoyment, must all be perfect, and absolutely so, to make out a happiness of this kind: the least remission or abatement in any of these, must produce a proportional diminution of happiness, and bring it down so much below perfection.

It scarcely needs any reflection to assure one, that the matter of this kind of happiness, or what raises and maintains the constant flow of pleasure, satisfaction, and delight, wherein the very nature of happiness lies, must be absolutely perfect in every view; and therefore must be such, as not only doth not admit, but most effectually excludes, every degree and every tendency toward evil, of what kind forever; such as shall furnish out, and actually maintain, in the highest degree, and with infallible certainty, complete finished pleasure, satisfaction, delight, and continue for ever to do so; and, at the same time, support the happy being in the possession and perfect exercise of all possible powers, equal, and always the fame, without decrease, intermission, or end; as nothing can be more evident, than that a failure, the least failure, in any of these, would make a flaw in the enjoyment.

That there must be at the same time an absolutely perfect possession of this fame perfect good, is as evident; and that cannot subsist without the absolute property of it, independent of, and altogether above the reach of, every other being: or, to use the Stoics phrase, The happy being must have it in himself; not in that precarious and loose manner they imagined their wise man possessed of virtue, but that it shall be as essential to, and inseparable from him, as his own being. In one word, himself must be the fund of his own happiness, and in the all-sufficient fullness of his own being, and the unbounded extent of his powers, it must lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Human Nature</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 8-9.</span></figcaption>

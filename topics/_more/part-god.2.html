</figure><figure class="quote" id="q-2a7fd9e9d1" data-kw="">
<blockquote><p>Now whereas there is no Nation so projectedly Savage, as to be aliens to the belief of existence of some Deity, which mankind ought to adore; no people, who do not essay by some kind of performances to express the sentiments of Devotion and Honour they bear towards him; it is difficult to imagine there should be any persons found of minds so immensely distant from the common conceptions of reason, as to be able resolvedly to deny it. And the reason of the difficulty is this that Notices which are so Universal, having a necessary foundation and firm root in Nature, it must needs be that such as stifle the same in themselves, have in the first place violated and defaced that.

Hence it is that I would not formally accuse them who maintain that the Deity does not intermeddle in the affairs of this lower World, and conceive we ought to venerate the same only upon the account of its excellence, although there is not to be attended from it either Punishment for Wickedness or Compensation for Virtue; to have absolutely banished the knowledge of it from amongst them, and to make profession of believing there is a God only to escape the infamous title of Atheist.

Cicero indeed reproaches Epicurus with this artifice, and raises the suspicion upon his Followers; which nevertheless shall not engage me to believe that the corruption of our Age could possibly afford birth to such monsters. But howsoever that particular be, certain it is beyond contradiction, that the Opinions of this Philosopher lead directly to Impiety; and that if they who have embraced them believe the existence of God, tis Nature which prevails in them, and which is never conquerable by all the attempts and outrages they employ to conquer and suppress her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise concerning religions, in refutation of the opinion which accounts all indifferent. Wherein is also evinced the necessity of a particular revelation, and the verity and preeminence of the Christian religion above the pagan, Mahometan, and Jewish rationally demonstrated</cite>, (London: Will. Nealand, 1660), Part 1.1, pp 2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

— Moses Amyraut, A treatise concerning religions, in refutation of the opinion which accounts all indifferent. Wherein is also evinced the necessity of a particular revelation, and the verity and preeminence of the Christian religion above the pagan, Mahometan, and Jewish rationally demonstrated, (London: Will. Nealand, 1660), Part 1.1, pp 2-3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+whereas+there+is+no+Nation+so+projectedly+Savage%2C+as+to+be+aliens+to+the+belief+of+existence+of+some+Deity%2C+which+mankind+ought+to+adore%3B+no+people%2C+who+do+not+essay+by+some+kind+of+performances+to+express+the+sentiments+of+Devotion+and+Honour+they+bear+towards+him%3B+it+is+difficult+to+imagine+there+should+be+any+persons+found+of+minds+so+immensely+distant+from+the+common+conceptions+of+reason%2C+as+to+be+able+resolvedly+to+deny+it.+And+the+reason+of+the+difficulty+is+this+that+Notices+which+are+so+Universal%2C+having+a+necessary+foundation+and+firm+root+in+Nature%2C+it+must+needs+be+that+such+as+stifle+the+same+in+themselves%2C+have+in+the+first+place+violated+and+defaced+that.%0A%0AHence+it+is+that+I+would+not+formally+accuse+them+who+maintain+that+the+Deity+does+not+intermeddle+in+the+affairs+of+this+lower+World%2C+and+conceive+we+ought+to+venerate+the+same+only+upon+the+account+of+its+excellence%2C+although+there+is+not+to+be+attended+from+it+either+Punishment+for+Wickedness+or+Compensation+for+Virtue%3B+to+have+absolutely+banished+the+knowledge+of+it+from+amongst+them%2C+and+to+make+profession+of+believing+there+is+a+God+only+to+escape+the+infamous+title+of+Atheist.%0A%0ACicero+indeed+reproaches+Epicurus+with+this+artifice%2C+and+raises+the+suspicion+upon+his+Followers%3B+which+nevertheless+shall+not+engage+me+to+believe+that+the+corruption+of+our+Age+could+possibly+afford+birth+to+such+monsters.+But+howsoever+that+particular+be%2C+certain+it+is+beyond+contradiction%2C+that+the+Opinions+of+this+Philosopher+lead+directly+to+Impiety%3 </figure><figure class="quote" id="q-8544c5a7ec" data-kw="">
<blockquote><p>For those are anathematized who say that there are three Gods: because according to God’s true nature His substance does not admit a number of applications of the title, except as it is given to individual men and angels in recognition of their merit, though the substance of their nature and that of God is different. In that sense there are consequently many gods. Furthermore in the nature of God, God is one, yet in such a way that the Son also is God, because in Him there is not a different nature: and since He is God of God, both must be God, and since there is no difference of kind between them there is no distinction in their essence.

A number of titular Gods is rejected; because there is no diversity in the quality of the divine nature. Since therefore he is anathema who says there are many Gods and he is anathema who denies that the Son is God; it is fully shewn that the fact that each has one and the same name arises from the real character of the similar substance in each: since in confessing the Unborn God the Father, and the Only-begotten God the Son, with no dissimilarity of essence between them, each is called God, yet God must be believed and be declared to be one. …

Yet to prevent the declaration of one God seeming to affirm that God is a solitary monad without offspring of His own, it immediately condemns the rash suggestion that because God is one, therefore God the Father is one and solitary, having in Himself the name of Father and of Son: since in the Father who begets and the Son who comes to birth one God must be declared to exist on account of the substance of their nature being similar in each.

The faith of the saints knows nothing of the Son being incapable of birth: because the nature of the Son only draws its existence from birth. But the nature of the birth is in Him so perfect that He who was born of the substance of God is born also of His purpose and will. For from His will and purpose, not from the process of a corporeal nature, springs the absolute perfection of the essence of God born from the essence of God.</p></blockquote>

</figure><figure class="quote" id="q-6e87035f18" data-kw="">
<blockquote><p>The power of God in its second meaning, δύναμις (dunamis) in Greek, and potentia in Latin, refers to the power and strength of God whereby He is able to execute and accomplish everything which is in agreement with His character and His truth—also to create whatever is conceivable and to do whatever He wishes to do. From stones He is able to raise up children unto Abraham (Matthew 3:9), that is, to create human beings from a lump of clay as He did in the beginning, and make such human beings partakers of both the faith and life of Abraham. God could even create thousands of worlds. In a word, God’s power is unlimited.

One could imagine the creation of many things which would be contrary to the nature and truth of God. One could speculate about imaginary things which bear no resemblance to a creature. To relate this to the omnipotence of God and to ask whether God would be able to perform such things, is to entertain thoughts about God which are void of reverence and godly fear. Whatever is contradictory to the nature and truth of God, as well as contrary to the essential nature of a creature, is no reflection upon the power of God. Far be it from us to attribute this to the omnipotent and holy God. “Far be it from God, that He should do wickedness; and from the Almighty, that He should commit iniquity” (Job 34:10).

God can neither deny Himself (2 Timothy 2:13), nor can He lie or deceive (Titus 1:2). “It was impossible for God to lie” (Hebrews 6:18). Even though God has eternally been capable of creating a world, it does not follow that the world could have existed eternally. “Yes” and “no” are at all times opposites and cannot be simultaneous realities. One and the same body, one and the same man, cannot be simultaneously present at many places which are far removed from each other. These and a thousand-fold more things do not appertain to omnipotence.

Nevertheless, we maintain that God by His omnipotence is able to accomplish whatever He will even beyond what He has willed, as well as whatever He would will. His arm is not shortened and therefore He is called the Almighty. “I am the Almighty God” (Genesis 17:1); “When the Almighty was yet with me” (Job 29:5); “… saith the Lord Almighty” (2 Corinthians 6:18).</p></blockquote>

<blockquote><p>The agent in, and chief author of, this great work of our redemption is the whole blessed Trinity; for all the works which outwardly are of the Deity are undivided and belong equally to each person, their distinct manner of subsistence and order being observed. It is true, there were sundry other instrumental causes in the oblation, or rather passion of Christ but the work cannot in any sense be ascribed unto them; — for in respect of God the Father, the issue of their endeavours was exceeding contrary to their own intentions, and in the close they did nothing but what the “hand and counsel of God had before determined should be done,” Acts iv. 28; and in respect of Christ they were no way able to accomplish what they aimed at, for he himself laid down his life, and none was able to take it from him, John x. 17, 18: so that they are to be excluded from this consideration.

In the several persons of the holy Trinity, the joint author of the whole work, the Scripture proposeth distinct and sundry acts or operations peculiarly assigned unto them; which, according to our weak manner of apprehension, we are to consider severally and apart; which also we shall do, beginning with them that are ascribed to the Father.

1. Two peculiar acts there are in this work of our redemption by the blood of Jesus, which may be and are properly assigned to the person of the Father:— First, The sending of his Son into the world for this employment. Secondly, A laying the punishment due to our sin upon him.

The Father loves the world, and sends his Son to die: He “sent his Son into the world that the world through him might be saved,” John iii. 16, 17. He “sending his Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh, that the righteousness of the law might be fulfilled in us,” Rom. viii. 3, 4. He “set him forth to be a propitiation through faith in his blood,” chap. iii. 25. For “when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons,” Gal. iv. 4, 5. So more than twenty times in the Gospel of John there is mention of this sending; and our Saviour describes himself by this periphrasis, “Him whom the Father hath sent,” John x. 36; and the Father by this, “He who sent me,” chap. v. 37.

So that this action of sending is appropriate to the Father, according to his promise that he would “send us a Saviour, a great one, to deliver us,” Isa. xix. 20; and to the profession of our Saviour, “I have not spoken in secret from the beginning; from the time that it was, there am I: and now the Lord God, and his Spirit, hath sent me,” Isa. xlviii. 16. Hence the Father himself is sometimes called our Saviour: 1 Tim. i. 1, “According to the commandment Θεοῦ σωτῆρος ἡμῶν,” — “of God our Saviour.” Some copies, indeed, read it, Θεοῦ καὶ σωτῆρος ἡμῶν, — “of God and our Saviour;” but the interposition of that particle καὶ arose, doubtless, from a misprision that Christ alone is called Saviour. But directly this is the same with that parallel place of Tit. i. 3, Κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν Θεοῦ, — “According to the commandment of God our Saviour,” where no interposition of that conjunctive particle can have place; the same title being also in other places ascribed to him, as Luke i. 47, “My spirit hath rejoiced in God my Saviour.” As also 1 Tim. iv. 10, “We trust in the living God, who is the Saviour of all men, specially of them that believe;” though in this last place it be not ascribed unto him with reference to his redeeming us by Christ, but his saving and preserving all by his providence.</p></blockquote>

In the several persons of the holy Trinity, the joint author of the whole work, the Scripture proposeth distinct and sundry acts or operations peculiarly assigned unto them; which, according to our weak manner of apprehension, we are to consider severally and apart; which also we shall do, beginning with them that are ascribed to the Father.

1. Two peculiar acts there are in this work of our redemption by the blood of Jesus, which may be and are properly assigned to the person of the Father:— First, The sending of his Son into the world for this employment. Secondly, A laying the punishment due to our sin upon him.

The Father loves the world, and sends his Son to die: He “sent his Son into the world that the world through him might be saved,” John iii. 16, 17. He “sending his Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh, that the righteousness of the law might be fulfilled in us,” Rom. viii. 3, 4. He “set him forth to be a propitiation through faith in his blood,” chap. iii. 25. For “when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons,” Gal. iv. 4, 5. So more than twenty times in the Gospel of John there is mention of this sending; and our Saviour describes himself by this periphrasis, “Him whom the Father hath sent,” John x. 36; and the Father by this, “He who sent me,” chap. v. 37.

So that this action of sending is appropriate to the Father, according to his promise that he would “send us a Saviour, a great one, to deliver us,” Isa. xix. 20; and to the profession of our Saviour, “I have not spoken in secret from the beginning; from the time that it was, there am I: and now the Lord God, and his Spirit, hath sent me,” Isa. xlviii. 16. Hence the Father himself is sometimes called our Saviour: 1 Tim. i. 1, “According to the commandment Θεοῦ σωτῆρος ἡμῶν,” — “of God our Saviour.” Some copies, indeed, read it, Θεοῦ καὶ σωτῆρος ἡμῶν, — “of God and our Saviour;” but the interposition of that particle καὶ arose, doubtless, from a misprision that Christ alone is called Saviour. But directly this is the same with that parallel place of Tit. i. 3, Κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν Θεοῦ, — “According to the commandment of God our Saviour,” where no interposition of that conjunctive particle can have place; the same title being also in other places ascribed to him, as Luke i. 47, “My spirit hath rejoiced in God my Saviour.” As also 1 Tim. iv. 10, “We trust in the living God, who is the Saviour of all men, specially of them that believe;” though in this last place it be not ascribed unto him with reference to his redeeming us by Christ, but his saving and preserving all by his providence.”

— John Owen, Salus Electorum, Sanguis Jesu: or, The Death of Death in the Death of Christ, (1647) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1967), 10: 163-64.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+agent+in%2C+and+chief+author+of%2C+this+great+work+of+our+redemption+is+the+whole+blessed+Trinity%3B+for+all+the+works+which+outwardly+are+of+the+Deity+are+undivided+and+belong+equally+to+each+person%2C+their+distinct+manner+of+subsistence+and+order+being+observed.+It+is+true%2C+there+were+sundry+other+instrumental+causes+in+the+oblation%2C+or+rather+passion+of+Christ+but+the+work+cannot+in+any+sense+be+ascribed+unto+them%3B+%E2%80%94+for+in+respect+of+God+the+Father%2C+the+issue+of+their+endeavours+was+exceeding+contrary+to+their+own+intentions%2C+and+in+the+close+they+did+nothing+but+what+the+%E2%80%9Chand+and+counsel+of+God+had+before+determined+should+be+done%2C%E2%80%9D+Acts+iv.+28%3B+and+in+respect+of+Christ+they+were+no+way+able+to+accomplish+what+they+aimed+at%2C+for+he+himself+laid+down+his+life%2C+and+none+was+able+to+take+it+from+him%2C+John+x.+17%2C+18%3A+so+that+they+are+to+be+excluded+from+this+consideration.%0A%0AIn+the+several+persons+of+the+holy+Trinity%2C+the+joint+author+of+the+whole+work%2C+the+Scripture+proposeth+distinct+and+sundry+acts+or+operations+peculiarly+assigned+unto+them%3B+which%2C+according+to+our+weak+manner+of+apprehension%2C+we+are+to+consider+severally+and+apart%3B+which+also+we+shall+do%2C+beginning+with+them+that+are+ascribed+to+the+Father.%0A%0A1.+Two+peculiar+acts+there+are+in+this+work+of+our+redemption+by+the+blood+of+Jesus%2C+which+may+be+and+are+properly+assigned+to+the+person+of+the+Father%3A%E2%80%94+First%2C+The+sending+of+his+Son+into+the+world+for+this+employment.+Secondly%2C+A+laying+the+punishment+due+to+our+sin+upon+him.%0A%0AThe+Father+loves+the+world%2C+and+sends+his+Son+to+die%3A+He+%E2%80%9Csent+his+Son+into+the+world+that+the+world+through+him+might+be+saved%2C%E2%80%9D+John+iii.+16%2C+17.+He+%E2%80%9Csending+his+Son+in+the+likeness+of+sinful+flesh%2C+and+for+sin%2C+condemned+sin+in+the+flesh%2C+that+the+righteousness+of+the+law+might+be+fulfilled+in+us%2C%E2%80%9D+Rom.+viii.+3%2C+4.+He+%E2%80%9Cset+him+forth+to+be+a+propitiation+through+faith+in+his+blood%2C%E2%80%9D+chap.+iii.+25.+For+%E2%80%9Cwhen+the+fulness+of+the+time+was+come%2C+God+sent+forth+his+Son%2C+made+of+a+woman%2C+made+under+the+law%2C+to+redeem+them+that+were+under+the+law%2C+that+we+might+receive+the+adoption+of+sons%2C%E2%80%9D+Gal.+iv.+4%2C+5.+So+more+than+twenty+times+in+the+Gospel+of+John+there+is+mention+of+this+sending%3B+and+our+Saviour+describes+himself+by+this+periphrasis%2C+%E2%80%9CHim+whom+the+Father+hath+sent%2C%E2%80%9D+John+x.+36%3B+and+the+Father+by+this%2C+%E2%80%9CHe+who+sent+me%2C%E2%80%9D+chap.+v.+37.%0A%0ASo+that+this+action+of+sending+is+appropriate+to+the+Father%2C+according+to+his+promise+that+he+would+%E2%80%9Csend+us+a+Saviour%2C+a+great+one%2C+to+deliver+us%2C%E2%80%9D+Isa.+xix.+20%3B+and+to+the+profession+of+our+Saviour%2C+%E2%80%9CI+have+not+spoken+in+secret+from+the+beginning%3B+from+the+time+that+it+was%2C+there+am+I%3A+and+now+the+Lord+God%2C+and+his+Spirit%2C+hath+sent+me%2C%E2%80%9D+Isa.+xlviii.+16.+Hence+the+Father+himself+is+sometimes+called+our+Saviour%3A+1+Tim.+i.+1%2C+%E2%80%9CAccording+to+the+commandment+%CE%98%CE%B5%CE%BF%E1%BF%A6+%CF%83%CF%89%CF%84%E1%BF%86%CF%81%CE%BF%CF%82+%E1%BC%A1%CE%BC%E1%BF%B6%CE%BD%2C%E2%80%9D+%E2%80%94+%E2%80%9Cof+God+our+Saviour.%E2%80%9D+Some+copies%2C+indeed%2C+read+it%2C+%CE%98%CE%B5%CE%BF%E1%BF%A6+%CE%BA%CE%B1%E1%BD%B6+%CF%83%CF%89%CF%84%E1%BF%86%CF%81%CE%BF%CF%82+%E1%BC%A1%CE%BC%E1%BF%B6%CE%BD%2C+%E2%80%94+%E2%80%9Cof+God+and+our+Saviour%3B%E2%80%9D+but+the+interposition+of+that+particle+%CE%BA%CE%B1%E1%BD%B6+arose%2C+doubtless%2C+from+a+misprision+that+Christ+alone+is+called+Saviour.+But+directly+this+is+the+same+with+that+parallel+place+of+Tit.+i.+3%2C+%CE%9A%CE%B1%CF%84%E2%80%99+%E1%BC%90%CF%80%CE%B9%CF%84%CE%B1%CE%B3%E1%BD%B4%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CF%83%CF%89%CF%84%E1%BF%86%CF%81%CE%BF%CF%82+%E1%BC%A1%CE%BC%E1%BF%B6%CE%BD+%CE%98%CE%B5%CE%BF%E1%BF%A6%2C+%E2%80%94+%E2%80%9CAccording+to+the+commandment+of+God+our+Saviour%2C%E2%80%9D+where+no+interposition+of+that+conjunctive+particle+can+have+place%3B+the+same+title+being+also+in+other+places+ascribed+to+him%2C+as+Luke+i.+47%2C+%E2%80%9CMy+spirit+hath+rejoiced+in+God+my+Saviour.%E2%80%9D+As+also+1+Tim.+iv.+10%2C+%E2%80%9CWe+trust+in+the+living+God%2C+who+is+the+Saviour+of+all+men%2C+specially+of+them+that+believe%3B%E2%80%9D+though+in+this+last+place+it+be+not+ascribed+unto+him+with+reference+to+his+redeeming+us+by+Christ%2C+but+his+saving+and+preserving+all+by+his+providence.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Salus+Electorum%2C+Sanguis+Jesu%3A+or%2C+The+Death+of+Death+in+the+Death+of+Christ%2C+%281647%29+in+William+H.+Goold+%28ed.%29%2C+The+Works+of+John+Owen+%2816+vols%2C+Edinburgh%3A+Banner+of+Truth%2C+1967%29%2C+10%3A+163-64.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f8b4b4d1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f8b4b4d1a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/03/john-owen-on-our-redemption-by-the-holy-trinity-and-the-fathers-sending-of-the-son/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Lord our God is but one God. In which Indivisible Unity notwithstanding, we adore the Father, as being altogether of himself;[1] we glorify that Consubstantial Word which is the Son; we bless and magnify that Co-essential Spirit eternally proceeding from both, which is the Holy Ghost. Seeing therefore the Father is of none, the Son is of the Father, and the Spirit is of both, they are by these their several Properties really distinguishable each from other. For the Substance of God, with this property to be of none, doth make the Person of the Father; the very self-same Substance in number with this property to be of the Father, maketh the Person of the Son; the same Substance having added unto it, the property of proceeding from the other two, maketh the Person of the Holy Ghost. So that in every Person, there is implied both the Substance of God, which is one; and also, that property which causeth the same Person really and truly to differ from the other two.

Every Person hath his own subsistence, which no other besides hath, although there be others besides that are of the same Substance. As no man but Peter can be the person which Peter is, yet Paul hath the self-same Nature which Peter hath. Again, Angels have every of them the Nature of pure and Invisible Spirits, but every Angel, is not that Angel which appeared in a Dream to Joseph. Now when God became Man, lest we should err in applying this to the Person of the Father, or of the Spirit, St. Peter’s confession unto Christ was, Thou art the Son of the Living God; and St. John’s Exposition thereof was made plain, That it is the Word which was made Flesh. The Father, and the Holy Ghost (saith Damascen [John of Damascus]) have no Communion with the Incarnation of the Word, otherwise then only by approbation and assent.

Notwithstanding, for as much as the Word and Deity are one Subject, we must beware we exclude not the Nature of God from Incarnation, and so make the Son of God incarnate, not to be very God. For undoubtedly, even the Nature of God it self, in the only Person of the Son, is incarnate, and hath taken to it self Flesh. Wherefore, Incarnation may neither be granted to any Person, but only One, nor yet denied to that Nature which is common unto all Three. Concerning the cause of which incomprehensible Mystery, for as much as it seemeth a thing unconsonant, That the World should honour any other as the Saviour, but him whom it honoureth as the Creator of the World, and in the Wisdom of God, it hath not been thought convenient to admit any way of saving man, but by man himself, though nothing should be spoken of the Love and Mercy of God towards Man; which this way are become such a Spectacle, as neither Men nor Angels can behold without a kind of Heavenly astonishment, we may hereby perceive there is cause sufficient, why Divine Nature should assume Human, that so God might be in Christ, reconciling to himself the World.

And if some cause be likewise required, why rather to this end and purpose the Son, then either the Father, or the Holy Ghost, should be made man, Could we which are born the children of wrath, be adopted the Sons of God, through Grace, any other then by the Natural Son of God, being Mediator between God and us? It became therefore him, by whom all things are to be the Way of Salvation to all, that the Institution and Restitution of the World might be both wrought by one hand. The World’s Salvation was without the Incarnation of the Son of God, a thing impossible; not simply impossible, but impossible, it being presupposed, That the Will of God, was no otherwise to have it saved, then by the Death of his own Son.

Wherefore taking to himself our Flesh, and by his Incarnation, making it his own Flesh, he had now of his own, although from us, what to offer unto God for us. And as Christ took Manhood, that by it he might be capable of death, whereunto he humbled himself; so because Manhood is the proper subject of compassion and feeling pity, which maketh the Sceptre of Christ’s Regency even in the Kingdom of Heaven be amiable; he which without our Nature could not on Earth suffer for the sins of the World, doth now also by means thereof, both make intercession to God for sinners, and exercise dominion over all men with a true, a natural, and a sensible touch of Mercy.</p></blockquote>

</figure><figure class="quote" id="q-ce1d6874c7" data-kw="">
<blockquote><p>We readily allow that there are mysteries in scripture which surpass our comprehension, and which we shall not perfectly understand even in heaven. At the same time, we maintain, that we have as much of these mysteries taught us, as is useful and necessary to be known. For instance, we do not comprehend the mysteries of the Incarnation and the Trinity — that is, how it can be, that there are three persons in one essence, and how God assumed human nature: but though the manner is unknown, the thing itself is plainly taught; which is all that is necessary to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.10, p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-6d892cd305" data-kw="">
<blockquote><p>We must know God as the Father of Christ; we must know him in that relation to Christ, without which knowledge we can have no right conceptions of the economy of redemption, because all proceeds from the Father through the Son. That which is the greatest stumbling-block in the text is that clause, ‘thee the only true God,’ whereby some would exclude the deity of Christ.

Christ prays to the Father, and acknowledgeth him the only true God; if the Father therefore, say some, be the only true God, then Christ is not God, and they tell us that Christ is Deus factus, Deus constitutus. But to say a made God, is as great nonsense as to say an uncreated creature. Both carry a contradiction in the terms. The Scripture doth frequently and plainly assert the deity of Christ: no creature can be equal with God. But Christ was ‘in the form of God,’ and ‘thought it no robbery to be equal with God,’ Philip, ii. 6.

He was equal to God in his deity, though inferior to God in his humanity; the form of God stooped to the form of a servant, but the form of a servant despoiled him of nothing essential to the form of God; he ceased not to be what he was before, when he became in the womb of the virgin what he was not before. ‘All things that the Father hath are mine,’ saith Christ, John xvi. 15; what is more the Father’s than his essence and deity? The essence, therefore, and deity of the Father is the essence and deity of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-1d94800242" data-kw="">
<blockquote><p>What we believe, reduces it self to two Heads: First, That the Persons of the Trinity are really distinct from one another: the Father is not the Son, and the Holy Spirit is neither the Father nor the Son. The other, That neither of these Persons is really distinguished from the Divine Essence which they possess:

That the Father is God, the Son God, and the Holy Ghost God; and what is more, That the Father, Son and Holy Ghost are but one God, possessing only one Divinity; so that the Divinity of the Father is the same with that of the Son; and that of the Father and the Son is not different from that of the Holy Ghost. …</p></blockquote>

</figure><figure class="quote" id="q-26568c59be" data-kw="">
<blockquote><p>For the first, Thy will, &amp;c. God’s will is only one, considered in it self, as God is one; yet for our understanding, it may be thus distinguished: It is either absolute, or revealed. God’s absolute will, is the will of his good pleasure, whereby according to his eternal counsel, he determines of all things, what shall be done, or what shall not be done, and in what manner. This absolute will extendeth over all creatures, and over all their actions: Ephes. 1. 11. We are predestinate according to the purpose of him that worketh all things after the counsel of his own will. Roman. 9. 19. Who hath resisted his will? Matth. 10. 26. Without this will of God, a sparrow cannot fall to the ground. And this absolute will of God is hidden from us, till God reveal it by the event.

God’s revealed will, is the sacred doctrine of God in his word, whereby he signifieth unto man, so far as concerns his happiness and salvation, what he ought to do, or what he ought not to do. This is not Gods absolute will, but rather an effect thereof concerning man, revealing unto him, not what he simply and absolutely willeth to be done, for that must needs be done; but what is pleasing or displeasing unto him, done by man, and what he will have man to do, or not to do, if he desire to come to life, and would not be condemned. And this revealed will comprehendeth both the Law and the Gospel, with all their commandments, prohibitions, threatenings, exhortations, promises, &amp; such like, whereto the Apostle hath relation, when he saith, Prove what is the good will of God, and acceptable, Rom. 12. 2.</p></blockquote>

God’s revealed will, is the sacred doctrine of God in his word, whereby he signifieth unto man, so far as concerns his happiness and salvation, what he ought to do, or what he ought not to do. This is not Gods absolute will, but rather an effect thereof concerning man, revealing unto him, not what he simply and absolutely willeth to be done, for that must needs be done; but what is pleasing or displeasing unto him, done by man, and what he will have man to do, or not to do, if he desire to come to life, and would not be condemned. And this revealed will comprehendeth both the Law and the Gospel, with all their commandments, prohibitions, threatenings, exhortations, promises, &amp; such like, whereto the Apostle hath relation, when he saith, Prove what is the good will of God, and acceptable, Rom. 12. 2.”

— William Perkins, A godly and learned exposition of Christ’s Sermon in the Mount, (Cambridge: University of Cambridge, 1608), p. 275.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+first%2C+Thy+will%2C+%26c.+God%E2%80%99s+will+is+only+one%2C+considered+in+it+self%2C+as+God+is+one%3B+yet+for+our+understanding%2C+it+may+be+thus+distinguished%3A+It+is+either+absolute%2C+or+revealed.+God%E2%80%99s+absolute+will%2C+is+the+will+of+his+good+pleasure%2C+whereby+according+to+his+eternal+counsel%2C+he+determines+of+all+things%2C+what+shall+be+done%2C+or+what+shall+not+be+done%2C+and+in+what+manner.+This+absolute+will+extendeth+over+all+creatures%2C+and+over+all+their+actions%3A+Ephes.+1.+11.+We+are+predestinate+according+to+the+purpose+of+him+that+worketh+all+things+after+the+counsel+of+his+own+will.+Roman.+9.+19.+Who+hath+resisted+his+will%3F+Matth.+10.+26.+Without+this+will+of+God%2C+a+sparrow+cannot+fall+to+the+ground.+And+this+absolute+will+of+God+is+hidden+from+us%2C+till+God+reveal+it+by+the+event.%0A%0AGod%E2%80%99s+revealed+will%2C+is+the+sacred+doctrine+of+God+in+his+word%2C+whereby+he+signifieth+unto+man%2C+so+far+as+concerns+his+happiness+and+salvation%2C+what+he+ought+to+do%2C+or+what+he+ought+not+to+do.+This+is+not+Gods+absolute+will%2C+but+rather+an+effect+thereof+concerning+man%2C+revealing+unto+him%2C+not+what+he+simply+and+absolutely+willeth+to+be+done%2C+for+that+must+needs+be+done%3B+but+what+is+pleasing+or+displeasing+unto+him%2C+done+by+man%2C+and+what+he+will+have+man+to+do%2C+or+not+to+do%2C+if+he+desire+to+come+to+life%2C+and+would+not+be+condemned.+And+this+revealed+will+comprehendeth+both+the+Law+and+the+Gospel%2C+with+all+their+commandments%2C+prohibitions%2C+threatenings%2C+exhortations%2C+promises%2C+%26+such+like%2C+whereto+the+Apostle+hath+relation%2C+when+he+saith%2C+Prove+what+is+the+good+will+of+God%2C+and+acceptable%2C+Rom.+12.+2.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+godly+and+learned+exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount%2C+%28Cambridge%3A+University+of+Cambridge%2C+1608%29%2C+p.+275.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26568c59be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26568c59be.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/07/william-perkins-on-distinctions-in-the-will-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It does not follow that a doctrine is untrue because it is incomprehensible. The Bible teaches the doctrine of the Trinity. The rationalist denies it. It is a contradiction, he says. But it is not a contradiction, for the human mind cannot believe a contradiction, and the doctrine of the trinity is a cardinal one in the Christian’s creed. Incomprehensible it undoubtedly is, but this is no argument against it, unless, indeed, the man who makes it is omniscient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-l-patton.html">Francis L. Patton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Christian Doctrine</cite>, (Philadelphia: The Westminster Press, 1901), p. 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-8a2877e5ef" data-kw="">
<blockquote><p>It is a pious saying that the Father is not limited by times: for the true meaning of the name of Father which He bore before time began surpasses comprehension. Although religion teaches us to ascribe to Him this name of Father through which comes the impassible origin of the Son, yet He is not bound in time, for the eternal and infinite God cannot be understood as having become a Father in time, and according to the teaching of the Gospel the Only-begotten God the Word is recognized even in the beginning rather to be with God than to be born. …

The essential likeness conformed to the Father’s essence in kind is also taught to be identical in time: lest He who is the image of God, who is the Word, who is God with God in the beginning, who is like the Father, by the insertion of times between Himself and the Father should not have in Himself in perfection that which is both image, and Word, and God. For if He be proclaimed to be younger in time, He has lost the truth of the image and likeness: for that is no longer likeness which is found to be dissimilar in time. For that very fact that God is Father prevents there being any time in which He was not Father: consequently there can be no time in the Son’s existence in which He was not Son. Wherefore we must neither call the Father older than the Son nor the Son younger than the Father: for the true meaning of neither name can exist without the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 24-25 in Nicene and Post-Nicene Fathers 2, 9: 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-3d64d40d2a" data-kw="">
<blockquote><p>As the Head of his Church, Christ is its source of spiritual influence. In him, for the use of his Church, the Spirit dwells in immeasurable degree. For the “Father giveth not the Spirit by measure unto his Son.” It has thus pleased the Father, that in him all fulness should dwell; and the conclusion is clear — Out of his fulness may we all receive, even grace upon grace. Oh, it was no scanty supply of the Spirit Christ ensured for his Church. There is no risk of soon draining this fountain dry. Believe it, it is inexhaustible. Hither may you repair, and drink of the water of life as largely as your finite capacities will admit of, and yet leave it undiminished.

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-l-r-foote.html">Alexander L. R. Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of the Lord not Straitened in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-22a319087b" data-kw="">
<blockquote><p>The essence of God, is the nature of God, whereby God is indeed, and doth subsist. And that essence is but one: and therefore God is but only one also. There are two parts of the knowledge of the essence of God, the first concerning the attributes of God, the second concerning the distinction of the persons. The attributes of God, are those titles, which are attributed to God, to declare his essence better unto us.

The attributes of God, are either simple, or compared. [1] The simple attributes of God are the essential properties of God, which do agree to him without comparison. Of these some have such a similitude of him, as is in the creatures by creation: some have not. Of the former kind are blessedness, immortality, understanding, prescience, memory, will, goodness, holiness, justice, clemency, long sufferance, patience, constancy, fortitude, truth, faithfulness, and the rest.

The goodness of God is that, by which he hath bene everlastingly contented with him self, not hauing need of any other thing. 1. Tim. 1.11. &amp; 6.15.

The understanding of God, is that by which he hath a perfect understanding of all things, &amp; this is sometimes called the wisdom of God.

The immortality of God, is that by which he never dieth. 1. Tim. 1.17. &amp; 6.16.

The prescience of God, is a most perfect foreknowledge of all things to come.

The memory of God, is that by which he doth most exactly remember all things. Psal. 25.6.7. Esa. 49.16.

The will of God, is that by which he willeth all things. Rom 9.15.22. Eph. 1.5.9.11. And that will is only one, &amp; most simple if we respect God him self, but so far as we respect men, to whom it is either revealed or hid, it is two fold: manifest or secret. The schoolmen do call the former of these, the will of the sign, the other the will of the good pleasure of God. The secret will also in due time appointed by God, is made open and manifest.

The will of God is most free, whereupon also it is called the free will of God. The free will of God, is that self same essence of God, understanding by it self all things immediately and most perfectly, &amp; that most freely, but yet unchangeably and necessarily, willing that which is good only, and abhorring that only which is evil, neither depending of another former beginning, but of it self only. And this alone may properly be called of his own power.

The goodness of God is that by which he is the author of all good things. And he doth exercise this, either generally towards all creatures, or else particularly towards his elect. The former is called beneficence, the later is called mercy. The beneficence of God, is that by which he giveth his gifts to all his creatures. Mat. 5.44.45. Act. 14.17. The mercy of God is that by which God doth good to his elect, although they deserve nothing of him but evil. Esa. 49.10.13. Eph. 2.3.4. Psal. 145.9.

The holiness of God is that by which he doth altogether abhor all impurity &amp; uncleanness Esa. 6.3. Reu. 4.8. Jerem. 3.12.

The justice of God, is that by which he dealeth justly in all things. Psal. 116.11. Rom. 3.4.

The clemency of God, is that by which he doth repress his anger, which is most just, that he might spare us. Exod. 34.5.

The long sufferance of God, is that whereby he doth a long time defer his anger, and punishment against sinners, that he might provoke them to repentance. Exod 34.5.

The patience of God is that by which he suffereth a long time patiently the sins of men, that he might lead them to repentance. Esa. 48.9

The constancy of God, is that by which he performeth most certainly that which he hath spoken. Exod. 34.5.

The fortitude of God, is that by which he is able to perform all things that he doth will. 1 Sam. 2.2. 2 Sam. 23.13. Esay. 28.2. &amp; 49.26. Jer. 50.34. Reuel. 18.8.

The truth of God is that by which he speaketh and doeth all things as they are indeed, he himself being most free from all lying. Rom. 3.4. Deut. 7.9.

The faithfulness of God is that by which he most faithfully performeth to his children that which he hath promised. Esay. 49.7. Exod. 34.6. Deut. 7.10.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The essence of God, is the nature of God, whereby God is indeed, and doth subsist. And that essence is but one: and therefore God is but only one also. There are two parts of the knowledge of the essence of God, the first concerning the attributes of God, the second concerning the distinction of the persons. The attributes of God, are those titles, which are attributed to God, to declare his essence better unto us.

The attributes of God, are either simple, or compared. [1] The simple attributes of God are the essential properties of God, which do agree to him without comparison. Of these some have such a similitude of him, as is in the creatures by creation: some have not. Of the former kind are blessedness, immortality, understanding, prescience, memory, will, goodness, holiness, justice, clemency, long sufferance, patience, constancy, fortitude, truth, faithfulness, and the rest.

The goodness of God is that, by which he hath bene everlastingly contented with him self, not hauing need of any other thing. 1. Tim. 1.11. &amp; 6.15.

The understanding of God, is that by which he hath a perfect understanding of all things, &amp; this is sometimes called the wisdom of God.

The immortality of God, is that by which he never dieth. 1. Tim. 1.17. &amp; 6.16.

The prescience of God, is a most perfect foreknowledge of all things to come.

The memory of God, is that by which he doth most exactly remember all things. Psal. 25.6.7. Esa. 49.16.

The will of God, is that by which he willeth all things. Rom 9.15.22. Eph. 1.5.9.11. And that will is only one, &amp; most simple if we respect God him self, but so far as we respect men, to whom it is either revealed or hid, it is two fold: manifest or secret. The schoolmen do call the former of these, the will of the sign, the other the will of the good pleasure of God. The secret will also in due time appointed by God, is made open and manifest.

The will of God is most free, whereupon also it is called the free will of God. The free will of God, is that self same essence of God, understanding by it self all things immediately and most perfectly, &amp; that most freely, but yet unchangeably and necessarily, willing that which is good only, and abhorring that only which is evil, neither depending of another former beginning, but of it self only. And this alone may properly be called of his own power.

The goodness of God is that by which he is the author of all good things. And he doth exercise this, either generally towards all creatures, or else particularly towards his elect. The former is called beneficence, the later is called mercy. The beneficence of God, is that by which he giveth his gifts to all his creatures. Mat. 5.44.45. Act. 14.17. The mercy of God is that by which God doth good to his elect, although they deserve nothing of him but evil. Esa. 49.10.13. Eph. 2.3.4. Psal. 145.9.

The holiness of God is that by which he doth altogether abhor all impurity &amp; uncleanness Esa. 6.3. Reu. 4.8. Jerem. 3.12.

The justice of God, is that by which he dealeth justly in all things. Psal. 116.11. Rom. 3.4.

The clemency of God, is that by which he doth repress his anger, which is most just, that he might spare us. Exod. 34.5.

The long sufferance of God, is that whereby he doth a long time defer his anger, and punishment against sinners, that he might provoke them to repentance. Exod 34.5.

The patience of God is that by which he suffereth a long time patiently the sins of men, that he might lead them to repentance. Esa. 48.9

The constancy of God, is that by which he performeth most certainly that which he hath spoken. Exod. 34.5.

The fortitude of God, is that by which he is able to perform all things that he doth will. 1 Sam. 2.2. 2 Sam. 23.13. Esay. 28.2. &amp; 49.26. Jer. 50.34. Reuel. 18.8.

The truth of God is that by which he speaketh and doeth all things as they are indeed, he himself being most free from all lying. Rom. 3.4. Deut. 7.9.

The faithfulness of God is that by which he most faithfully performeth to his children that which he hath promised. Esay. 49.7. Exod. 34.6. Deut. 7.10.”

— Amandus Polanus, The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal pointes whereof are contain, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 1-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+essence+of+God%2C+is+the+nature+of+God%2C+whereby+God+is+indeed%2C+and+doth+subsist.+And+that+essence+is+but+one%3A+and+therefore+God+is+but+only+one+also.+There+are+two+parts+of+the+knowledge+of+the+essence+of+God%2C+the+first+concerning+the+attributes+of+God%2C+the+second+concerning+the+distinction+of+the+persons.+The+attributes+of+God%2C+are+those+titles%2C+which+are+attributed+to+God%2C+to+declare+his+essence+better+unto+us.%0A%0AThe+attributes+of+God%2C+are+either+simple%2C+or+compared.+%5B1%5D+The+simple+attributes+of+God+are+the+essential+properties+of+God%2C+which+do+agree+to+him+without+comparison.+Of+these+some+have+such+a+similitude+of+him%2C+as+is+in+the+creatures+by+creation%3A+some+have+not.+Of+the+former+kind+are+blessedness%2C+immortality%2C+understanding%2C+prescience%2C+memory%2C+will%2C+goodness%2C+holiness%2C+justice%2C+clemency%2C+long+sufferance%2C+patience%2C+constancy%2C+fortitude%2C+truth%2C+faithfulness%2C+and+the+rest.%0A%0AThe+goodness+of+God+is+that%2C+by+which+he+hath+bene+everlastingly+contented+with+him+self%2C+not+hauing+need+of+any+other+thing.+1.+Tim.+1.11.+%26+6.15.%0A%0AThe+understanding+of+God%2C+is+that+by+which+he+hath+a+perfect+understanding+of+all+things%2C+%26+this+is+sometimes+called+the+wisdom+of+God.%0A%0AThe+immortality+of+God%2C+is+that+by+which+he+never+dieth.+1.+Tim.+1.17.+%26+6.16.%0A%0AThe+prescience+of+God%2C+is+a+most+perfect+foreknowledge+of+all+things+to+come.%0A%0AThe+memory+of+God%2C+is+that+by+which+he+doth+most+exactly+remember+all+things.+Psal.+25. <blockquote><p>Object. Perhaps the promises and threatnings of God, are his conditional decree, and depending upon the performance of the condition by the pleasure of man. Answ. But this cannot truly be said: For if it should be so, this decree would not be certain by the will of God, although the event was certainly foreseen by him: Also nothing can be imagined more absurd, than to appoint God to decree any thing with a condition is fulfilled.

</figure><figure class="quote" id="q-af5c7cc37e" data-kw="">
<blockquote><p>The carnal man, who does not know God due to his innate ignorance, and consequently has no understanding regarding the intimate and essential relationship between God’s holy and glorious attributes, separates these attributes one from the other. He subscribes to some of God’s attributes while rejecting others, and in so doing the carnal and natural man subscribes to a God of his own liking who conforms to his foolish imagination.

He subscribes to a God who is only gracious, compassionate, merciful, and longsuffering, but who is not at all holy, truthful, just, etc., and thereby he constructs a God according to his own liking and will. Of such a God, the carnal man has nothing or little to fear, for He is only merciful and gracious, and He very readily forgives sin. This gives a man all the latitude he desires, so that he can live and conduct himself according to the desires of his heart. Oh, wretched ignorance of God! How many a sinner, traversing upon this pathway, will perish eternally!

If, however, we desire to lend an ear to good teaching and instruction, the instructor will provide this for us, saying that God is indeed merciful, but also just. Both these attributes, justice and mercy, are inseparably united in God’s being, and may therefore in no wise be separated. If we separate them, we then deny who God is, and we fabricate a worthless idol. In the Holy Scriptures, God is never set before us in any way but as a God who is both just and merciful.

Nearly every page of the Bible teaches this. Listen only to one passage, Exodus 34:6–7, where God declares His glory: “The LORD, the LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation.”

We are not to think of God in any other way than the description Moses here gives of Him: He is abundant in grace, longsuffering, and mercy, but He is also a God who will by no means clear the guilty, but will always severely punish sin both temporally and eternally. Thus, God’s mercy cannot be in conflict with His holiness and justice, nor can it function in such a fashion that it would eradicate or in any way be detrimental to His holiness and justice. Rather, they must coexist in God in a most intimate manner.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The carnal man, who does not know God due to his innate ignorance, and consequently has no understanding regarding the intimate and essential relationship between God’s holy and glorious attributes, separates these attributes one from the other. He subscribes to some of God’s attributes while rejecting others, and in so doing the carnal and natural man subscribes to a God of his own liking who conforms to his foolish imagination.

He subscribes to a God who is only gracious, compassionate, merciful, and longsuffering, but who is not at all holy, truthful, just, etc., and thereby he constructs a God according to his own liking and will. Of such a God, the carnal man has nothing or little to fear, for He is only merciful and gracious, and He very readily forgives sin. This gives a man all the latitude he desires, so that he can live and conduct himself according to the desires of his heart. Oh, wretched ignorance of God! How many a sinner, traversing upon this pathway, will perish eternally!

If, however, we desire to lend an ear to good teaching and instruction, the instructor will provide this for us, saying that God is indeed merciful, but also just. Both these attributes, justice and mercy, are inseparably united in God’s being, and may therefore in no wise be separated. If we separate them, we then deny who God is, and we fabricate a worthless idol. In the Holy Scriptures, God is never set before us in any way but as a God who is both just and merciful.

Nearly every page of the Bible teaches this. Listen only to one passage, Exodus 34:6–7, where God declares His glory: “The LORD, the LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation.”

We are not to think of God in any other way than the description Moses here gives of Him: He is abundant in grace, longsuffering, and mercy, but He is also a God who will by no means clear the guilty, but will always severely punish sin both temporally and eternally. Thus, God’s mercy cannot be in conflict with His holiness and justice, nor can it function in such a fashion that it would eradicate or in any way be detrimental to His holiness and justice. Rather, they must coexist in God in a most intimate manner.”

<blockquote><p>Glorify thy Son. Glorify him in his death, by accepting it as the death of thy Son for the sins of the world; glorify him in his death, by manifesting at that time that I am thy Son. God did so by miraculous testimonies of his innocency in the time of his passion, by rending of the temple’s veil, obscurity of the sun, quaking of the earth, and the cleaving of the rocks, which made the centurion that guarded him pronounce him to be ‘truly the Son of God,’ Mat. xxvii. 54.

Glorify him in a resurrection; glorify thy Son in his deity, by a manifestation of it; glorify thy Son in his humanity, by conferring new endowments of honour and immortality upon it. He prays here for a manifestation of the glory of his deity, which had been obscured, for an addition of glory to his humanity, which had not been yet enjoyed, by a resurrection and exaltation of it to the right hand of the Father. He prays for a manifestation of his deity: ‘Glorify thy Son.’

He was the Son of God by eternal generation; it is the glory of his deity therefore which is here desired by him. Not the essential glory of the Deity, for that could not be interrupted; not any addition to it, for, being infinite, he was not capable of it, but a manifestation of it; not simply in itself, but in his humanity, which had been veiled by the flesh ever since he emptied himself into it. He prays to be glorified in that state wherein he prays, which was a state of union with the human nature. His essential glory could suffer no detriment, his manifestative did.

As the sins of men are said to dishonour God, not that they detract from the glory of his essence, which cannot suffer any diminution by the sins of men, but as they deny and obscure the manifestation of his glory; the sun suffers no loss of light in its body by the veil of a thick cloud, but the brightness of his beams is masked. As the Father was to be glorified by Christ, so was Christ to be glorified by the Father. Now, the Father could not be glorified by the Son in a way of addition, but manifestation, causing the glory of God to break out upon the world, which had so long been obscured by an universal idolatry. He glorified the Father by a manifestation of his name, ver. 4; and in like manner is glorified by the Father in the manifestation of his deity.

That Christ prays here for the glory of his deity as well as of his humanity is evident, because he prays as mediator and priest, desiring a mediatory glory; but he was mediator and priest according to his divine as well as human nature, and therefore desires that he might be known to the world, not only to be a just and innocent man, but the eternal Son of God, the Redeemer of the world, the expiator of sins, and in that work infinitely delightful to the Father.

Glorify thy Son. Glorify him as thy Son, that as thy Son he may glorify thee. The Son of God was in the world as a great light in a dark lantern, clouded and covered with clay, that though the candle burned, it did not appear, but through some crannies. He desires that this thick mist might be dispersed, that the glory of his divinity might shine forth in his humanity, as a candle through polished glass.

The glory of Christ was to be manifested to be the Son of God: John i. 14, ‘We beheld his glory, the glory as of the only begotten of the Father;’ a glory in his resurrection, his ascension, in the” mission of the Spirit, which declared him to be no other than the only Son of God; and so verse 22 of this chapter is to be understood, ‘The glory which thou gavest me I have given them.’ As it is my glory to be the Son of God, so I have given them this glory, to be the sons of God by adoption, ‘that they may be one, as we are one;’ in the same relation of sonship, though in a different manner.

His petition for this glory he urgeth by two arguments :

(1.) One in ver. 1, ‘That thy Son also may glorify thee.’ The glory of the Father was concerned in it, whose justice, wisdom, love (and all the attributes so signally manifested in redemption), had lain under as great a disguise without the glory of Christ, as the deity of the Son did under the veil of his flesh.

(2.) Another, taken from the happiness and salvation of the elect, ver. 2, ‘As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him.’ Unless the humanity had been glorified by a resurrection, there would have been no assurance that the debt had been satisfied, and no sure ground of faith; unless he had been exalted to the right hand of God as an advocate, there had been no security for our debts.

His resurrection was necessary to make men believers for what was passed, his exaltation was necessary to make them comfortable believers for the time to come; and unless his divine nature had been manifested in the mission of the Spirit, and the collation of miraculous gifts, there had been no foundation for the propagation of the doctrine of redemption, and so that glorious work had lain wrapped up from human view.

The other was necessary as a ground of faith, and this was necessary to the declaration of the doctrine of faith, and an incentive to the embracing of it. Since he was shortly to die, and be executed under the notion of a criminal, a blasphemer, and a wicked man, if he were not raised again, not one would believe in him as mediator, and so the glory of the Father, and the salvation of the elect, had sunk with the glory of the Son.</p></blockquote>

thou+gavest+me+I+have+given+them.%E2%80%99+As+it+is+my+glory+to+be+the+Son+of+God%2C+so+I+have+given+them+this+glory%2C+to+be+the+sons+of+God+by+adoption%2C+%E2%80%98that+they+may+be+one%2C+as+we+are+one%3B%E2%80%99+in+the+same+relation+of+sonship%2C+though+in+a+different+manner.%0A%0AHis+petition+for+this+glory+he+urgeth+by+two+arguments+%3A%0A%0A%281.%29+One+in+ver.+1%2C+%E2%80%98That+thy+Son+also+may+glorify+thee.%E2%80%99+The+glory+of+the+Father+was+concerned+in+it%2C+whose+justice%2C+wisdom%2C+love+%28and+all+the+attributes+so+signally+manifested+in+redemption%29%2C+had+lain+under+as+great+a+disguise+without+the+glory+of+Christ%2C+as+the+deity+of+the+Son+did+under+the+veil+of+his+flesh.%0A%0A%282.%29+Another%2C+taken+from+the+happiness+and+salvation+of+the+elect%2C+ver.+2%2C+%E2%80%98As+thou+hast+given+him+power+over+all+flesh%2C+that+he+should+give+eternal+life+to+as+many+as+thou+hast+given+him.%E2%80%99+Unless+the+humanity+had+been+glorified+by+a+resurrection%2C+there+would+have+been+no+assurance+that+the+debt+had+been+satisfied%2C+and+no+sure+ground+of+faith%3B+unless+he+had+been+exalted+to+the+right+hand+of+God+as+an+advocate%2C+there+had+been+no+security+for+our+debts.%0A%0AHis+resurrection+was+necessary+to+make+men+believers+for+what+was+passed%2C+his+exaltation+was+necessary+to+make+them+comfortable+believers+for+the+time+to+come%3B+and+unless+his+divine+nature+had+been+manifested+in+the+mission+of+the+Spirit%2C+and+the+collation+of+miraculous+gifts%2C+there+had+been+no+foundation+for+the+propagation+of+the+doctrine+of+redemption%2C+and+so+that+glorious+work+had+lain+wrapped+up+from+human+view.%0A%0AThe+other+was+necessary+as+a+ground+of+faith%2C+and+this+was+necessary+to+the+declaration+of+the+doctrine+of+faith%2C+and+an+incentive+to+the+embracing+of+it.+Since+he+was+shortly+to+die%2C+and+be+executed+under+the+notion+of+a+criminal%2C+a+blasphemer%2C+and+a+wicked+man%2C+if+he+were+not+raised+again%2C+not+one+would+believe+in+him+as+mediator%2C+and+so+the+glory+of+the+Father%2C+and+the+salvation+of+the+elect%2C+had+sunk+with+the+glory+of+the+Son.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+%2C+A+Discourse+on+the+Knowledge+of+God%2C+in+The+Complete+Works+of+Stephen+Charnock%2C+B.D.+%285+vols%2C+Edinburgh%3A+James+Nichol%2C+1865%29%2C+4%3A+4-6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddf8585ebc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddf8585ebc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/15/stephen-charnock-glorify-thy-son/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d3ac8d1b5e" data-kw="">
<blockquote><p>The Psalmist’s expression in the eyes of the Lord, are very pregnant to our purpose. Here is a description of eternity, proving that God seeth all things with one intuitive cast of his eye, and that although to us things are present, past and to come, yet to God all things are present, and although we are not able to reach this with our understanding, no more then a pigmy the Pyramids, yet we must rest more upon this Scripture assertion, then our own understanding, Quicquid de Deo dici (we may add cogitari) potest, eo ipso est indig∣num quia dici (cogitari) potest: and again dignè Deum aestimamus, dum inaestimabilm dicimus.

The Schoolmen dispute, whether those things which God did once know, he still knoweth, as for example, God once knew that Christ was to die, but now it is not true, that he is to die; and their resolution is, that we cannot properly say, God begins to know what he did, or ceaseth to know what he did, but rather that the thing it self beginneth to be known, or ceaseth to be known, so that the change is not in respect of God’s knowing, but the thing known, as when I see the Sun, and afterwards it is hid in the cloud, the change is not in my eye, but in the Sun; Hence they also resolve, that God knoweth all things simul together, that his knowledge is invariable, that it admitteth not of increase or decrease, that all things are present to him, and that as the Sun is always in actu lucendi, so God in actu intelligendi …</p></blockquote>

n+asserted+and+vindicated%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially+Antinomians+in+XXX+lectures+preached+at+Lawrence-Jury%2C+London%2C+%282nd+edn%2C+London%3A+Tho.+Underhill%2C+1651%29%2C+p.+92.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3ac8d1b5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3ac8d1b5e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/09/anthony-burgess-on-gods-eternal-knowledge/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4a318ea19f" data-kw="">
<blockquote><p>Turn unto me] Renounce all Idols and men’s Devices in my Worship; acknowledge me alone to be your God, and my Word to be your only Rule, with unfeigned Repentance for your former departures from me, and disobedience to my Word; be my people, and observe my Commandments: for, to cry to God for Corn, &amp;c. is not a turning to God, but to the Creature, Hos. 7.14. but it is to seek God for himself, when nothing will satisfy us besides God himself to be our God, Psal. 144.15.

[A]nd when we mourn, not so much for the loss, or want of these things, as for God’s displeasure for our sins that have incensed his wrath, and so seek God’s face, &amp; reconciliation with him in Christ, Psal. 4.6, 7. God doth not require this of them, as if it were in their power to do it, but to convince them that it is their duty, whereunto he would excite them by the Ministry of his Prophet, and would quicken and enable them by the efficacy of his Spirit accompanying the same.

And I will turn unto you] God’s turning to us is not like our turning to God: for, our turning to God supposeth a change in us, but God’s turning to us is without shadow of turning, Jam. 1.17. both in his Nature, Mal. 3.6. and in his Will, Isa. 46.10. but it is to be understood in respect of his Effects; that is to say, I will be reconciled to you, and shew it by suitable effects, as Micah 7.19. He will turn again, he will have compassion upon us.

Saith the Lord of Hosts] This Attribute shews his Absolute dominion over all Creatures in Heaven and Earth, whom he can dispose of by his command, to execute his vengeance upon those that disobey him: in this sense it is added to the Precept. And to be Instruments of dispensing the effects of his favour to those that turn unto him, and obey him; in this sense it is added to the Promise: In both it is suited with their condition, who had experience of the former, and upon their returning to him should find him ready to use his Hosts for their good.</p></blockquote>

<blockquote><p>[L]et us consider what the knowledge of God is; it is a most pure act by which he doth at one instant know himself in himself, and all things without himself, not only necessary, and contingent, but which shall never be, after a most perfect, exquisite, and infallible manner.

<blockquote><p>There is no composition in God, neither Physical, nor Logical, nor Metaphysical; because in him there is no priority nor posteriority, as in composition where the compositum is posterior to the parts compounding.

2. In composition there is act and possibility; but God is all act.

3. In composition the parts differ from the compositum; but in God there is no difference.

4. There is no composition in form; but God is a most simple form.

5. Whatsoever is compounded hath a cause of that composition; but in God there is no cause.</p></blockquote>

<blockquote><p>That Christ is Deus de Deo, God of God, is thus clearly proved out of Scripture; whosoever is God and the Son of God, must needs be God of God; but Christ is God and the Son of God, ergo &amp;c. But it hath been objected, if he be God of God, then he must have his essence communicated to him from the Father, and so be essentiatus a patre, essentiated, or natured from the Father: this will not follow, no more then that Socrates is essentiatus a Sophronisco, but only that he is genitus a patre, begotten of his Father, and so is recipiens essentiam, or habens essentiam communicatam a patre; which manner of speech is approved of by Beza, filius est a patre per ineffabilem totius essentiae communicationem ab aeterno: the Son is from the Father by an unspeakable communication of his whole essence from eternity: and Symlerus, non negamus silium haberea essentiam a Deo patre, sed essentiam genitam negamus: we do not deny that the Son hath his essence from God the Father, but we deny that the essence is begotten, and why should we boggle at this phrase, when our Lord himself acknowledgeth, Ioh. 5.26. omnia mihi data sunt a patre meo, &amp; pater dedit filio habere vitam in se, all things are given me of my Father?

Neither doth this any way contradict Calvin his autotheos, God of himself; which form of expression, though some protestants as well as papists have excepted against, yet I am of [William] Whitaker’s mind, in his answer to the 7th reason of Campian, that it is verissime &amp; sanstissime dictum, most truly and religiously spoken; nam si ex se Deus non est, omnino Deus non est: for if he be not God of himself, he is not God at all: let St Augustine be the umpire, and reconcile both, Christus ad se Deus, dicitur ad patrem filius; Christ may be considered two ways, either absolutely, and so he is Deus ex se, God of himself, as the Father is and the holy Spirit; or relatively, as filius, and so he is Deus de Deo, as he is the Son, so he is God of God: yea but these phrases may be taken in an ill sense, and so may all the Articles of the Creed, as you may see in the Parisian censure set out by the Jesuits; nay so may the whole Scripture, as St Peter teacheth us, which … the ignorant &amp; unstable pervert: what then, must we weed up all the flowers of Paradise, because heretics, like spiders, suck such juice out of them which they turn into poison?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), pp 17-18.</span></figcaption>

</figure><figure class="quote" id="q-f70e07d4bc" data-kw="">
<blockquote><p>If, then, the Holy Spirit is truly, and not in name only, called Divine both by Scripture and by our Fathers, what ground is left for those who oppose the glory of the Spirit? He is Divine, and absolutely good, and Omnipotent, and wise, and glorious, and eternal; He is everything of this kind that can be named to raise our thoughts to the grandeur of His being. The singleness of the subject of these properties testifies that He does not possess them in a measure only, as if we could imagine that He was one thing in His very substance, but became another by the presence of the aforesaid qualities.

That condition is peculiar to those beings who have been given a composite nature; whereas the Holy Spirit is single and simple in every respect equally. This is allowed by all; the man who denies it does not exist. If, then, there is but one simple and single definition of His being, the good which He possesses is not an acquired good; but, whatever He may be besides, He is Himself Goodness, and Wisdom, and Power, and Sanctification, and Righteousness, and Everlastingness, and Imperishability, and every name that is lofty, and elevating above other names.

What, then, is the state of mind that leads these men, who do not fear the fearful sentence passed upon the blasphemy against the Holy Ghost, to maintain that such a Being does not possess glory? For they clearly put that statement forward; that we ought not to believe that He should be glorified: though I know not for what reason they judge it to be expedient not to confess the true nature of that which is essentially glorious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-8cb37fc67c" data-kw="">
<blockquote><p>As Jesus Christ is a child in his human nature, he is born, begotten of the Holy Ghost, born of the Virgin Mary. He is as truly-born, as certainly a child, as any other man that ever lived upon the face of the earth. He is thus in his humanity a child born. But as Jesus Christ is God’s Son, he is not born; but given, begotten of his Father from before all worlds, begotten — not made, being of the same substance with the Father.

The doctrine of the eternal affiliation of Christ is to be received as an undoubted truth of our holy religion. But as to any explanation of it, no man should venture thereon, for it remaineth among the deep things of God — one of those solemn mysteries indeed, into which the angels dare not look, nor do they desire to pry into it — a mystery which we must not attempt to fathom, for it is utterly beyond the grasp of any finite being. As well might a gnat seek to drink in the ocean, as a finite creature to comprehend the Eternal God. A God whom we could understand would be no God. If we could grasp him he could not be infinite: if we could understand him, then were he not divine.</p></blockquote>

The doctrine of the eternal affiliation of Christ is to be received as an undoubted truth of our holy religion. But as to any explanation of it, no man should venture thereon, for it remaineth among the deep things of God — one of those solemn mysteries indeed, into which the angels dare not look, nor do they desire to pry into it — a mystery which we must not attempt to fathom, for it is utterly beyond the grasp of any finite being. As well might a gnat seek to drink in the ocean, as a finite creature to comprehend the Eternal God. A God whom we could understand would be no God. If we could grasp him he could not be infinite: if we could understand him, then were he not divine.”

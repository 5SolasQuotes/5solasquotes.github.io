<blockquote><p>TWENTY-FOURTH QUESTION

Is the mystery of the Trinity a fundamental article of faith? We affirm against the Socinians and Remonstrants [Arminians].

I. Before discussing the truth of the mystery of the Trinity, we must premise some things concerning its necessity, not only against the Socinians (who directly deny it to be an article of faith), but also on account of the Remonstrants (who, although seeming to profess their belief of it, still deny it a place among the fundamental articles, so that the ignorance of it does not bring salvation into peril … Thus they would secretly subvert the truth of Christian doctrines oftentimes begin by agitating the question concerning their importance and necessity so that men, lulled into the sleep of security, may the more easily suffer themselves to be robbed of the truth and refuse to contend for the faith once delivered to the saints. …

IV. The question does not concern the full and perfect comprehension of this mystery; nor does it concern an intuitive knowledge of it. The former belongs to the glorified saints alone; the latter belongs to the Trinity alone … Rather the question is only whether the knowledge and confession of the three divine persons is required for the catholic faith and necessary to all who would be saved. …

VI. Thus the question comes to this: whether the mystery of the Trinity is a fundamental article, necessary to the faith of all believers, so that not only the denial, but even the ignorance of it cannot consist with salvation. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.24.4, 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

VI. Thus the question comes to this: whether the mystery of the Trinity is a fundamental article, necessary to the faith of all believers, so that not only the denial, but even the ignorance of it cannot consist with salvation. …”

<blockquote><p>God is independent altogether, and self-sufficient. This is his royal prerogative, wherein he infinitely transcends all created perfection. “He is of himself, and for himself,” from no other, and for no other, “but of him, and for him are all things.” He is the fountain-head; you ought to follow the streams up to it, and then to rest: for you can go no further. …

As God’s being is independent, so that he cannot be expressed by any name, more suitable than such as he takes to himself, “I am that I am;” importing a boundless, ineffable, absolute and transcendent being, beside which, no creature deserves so much as to have the name of being, or to be made mention of in one day with his name, because his glorious light makes the poor derived shadow of light in other creatures to disappear, and to evanish out of the world of beings: so it is the glorious perfection of his nature, that he doth all things for himself, for his own name, Prov. Xvi. 4, and his glory is as dear to him, as himself. Isa. xlii. 8, “I am the Lord, that is my name, and therefore my glory will I give to no other …</p></blockquote>

<blockquote><p>The doctrine of divine simplicity has fallen on hard times in Reformed circles, which is largely owing to the lack of emphasis placed on this subject in the late 19th and early 20th centuries. One theologian who continued to hold the line on the subject was the Dutch-American theologian, Herman Hoeksema.

In accordance with the Thomistic-Reformed position on divine simplicity, he reminded us that the divine attributes were identical with the simple divine essence, and so identical with one another:

His virtues are … identical with that Essence, so are all His virtues one in Him. For even though we do not and cannot comprehend this simple divine Essence … this does not alter the fact that all God’s virtues are one in Him. Hence, His righteousness is His mercy, His holiness is His grace, His truth is His love. And therefore, this eternal Being, this independent, simple Essence that is called God is also the Immutable, in Whom there is no variableness, neither shadow of turning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, (Grand Rapids: Reformed Free Publishing Association, 1966), p. 36.</span></figcaption>

<blockquote><p>XIV. … The will of saving all men does not overthrow the decree of reprobation of passing by many because it is neither the decretive will, but only the preceptive and approving will; not the universal, which respects all and individuals, but only general, which is indiscriminately extended to any. So they can be called to the marriage by the preceptive will who nevertheless were excluded from eternity by the will of good pleasure. …

XVII. The passages which attribute a desire or wish to God do not immediately prove any ineffectual will in him, but things spoken after the manner of men must be understood in a manner becoming to God, unless we wish to adopt the deliriums of the Anthromorphites. …

XVIII. When God testifies that “he has no pleasure at all in the death of the sinner, but that he should return from his ways, and live” (Ezk. 18:23), this does not favour the inefficacious will or the feeble velleity of God because the word chpts (which occurs there) does not denote desire so much as delight and complacency. Thus God may be said not to delight in the punishment of the wicked inasmuch as it is the destruction of the creature, although he wills it as an exercise of his justice. So he is said to will the repentance of sinners approvingly and preceptively as a thing most pleasing to himself and expressed in his commands, although with respect to all of them he nills it decretively and effectively.</p></blockquote>

<blockquote><p>Francis Turretin held to the standard Reformed distinction between the secret and revealed will of God (it being a distinction in the one, simple will of God; cf. Institutes, third topic, fifteenth question). He rejected the distinction between the antecedent and consequent, or conditional and absolute will of God to which the Arminians and others subscribed. This view held that God had by an antecedent or conditional will purposed to save all men, but by consequent or absolute will decreed the salvation of believers and the damnation of unbelievers (see Institutes, 3.16.4).

Turretin responds to this heterodox position by arguing that it is dishonouring to God:

VI. This distinction is in many ways injurious to God: (1) because it attributes to him contrary wills (viz., that God wills the salvation of all and wills the salvation only of some); that from eternity he seriously willed the salvation of Judas and yet, at the same time in the same moment, knew that Judas never would believe; and that he did not will to give faith to Judas by which he might infallibly have been converted; yea, would permit him to remain in his unbelief and to perish. Who would dare to attribute such wills to a man of sound mind, as to say that he willed seriously and ardently what he knew never would happen, and indeed would not happen because he nilled to effect it, on whom alone the effect depends? …

VII. Second, this distinction cannot have place in God without ascribing to him not only folly and impotence (by making him intend seriously and desire with natural affection that which is not performed and cannot be performed through man because he himself does not will it); but also mutability because there can be no place for the consequent will until the antecedent is first rescinded. For how could God at the same time, by the same act of will, will to save all men and to damn the greater part of them? …

X. Fifth, it is repugnant to the gospel which constantly teaches that God wills to save not all simply, but only the elect and believers in Christ and that the means of salvation are not offered or conferred upon all, but only upon some. In fine, it overthrows the eternal election of God because it leaves it uncertain, founded not upon the good pleasure of God, but upon human will (than which nothing is more uncertain and changeable). It makes it such as that no execution can answer to it (i.e., makes it void and inefficacious).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.16.6-7, 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.16.6-7, 10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrancis+Turretin+held+to+the+standard+Reformed+distinction+between+the+secret+and+revealed+will+of+God+%28it+being+a+distinction+in+the+one%2C+simple+will+of+God%3B+cf.+Institutes%2C+third+topic%2C+fifteenth+question%29.+He+rejected+the+distinction+between+the+antecedent+and+consequent%2C+or+conditional+and+absolute+will+of+God+to+which+the+Arminians+and+others+subscribed.+This+view+held+that+God+had+by+an+antecedent+or+conditional+will+purposed+to+save+all+men%2C+but+by+consequent+or+absolute+will+decreed+the+salvation+of+believers+and+the+damnation+of+unbelievers+%28see+Institutes%2C+3.16.4%29.%0A%0ATurretin+responds+to+this+heterodox+position+by+arguing+that+it+is+dishonouring+to+God%3A%0A%0AVI.+This+distinction+is+in+many+ways+injurious+to+God%3A+%281%29+because+it+attributes+to+him+contrary+wills+%28viz.%2C+that+God+wills+the+salvation+of+all+and+wills+the+salvation+only+of+some%29%3B+that+from+eternity+he+seriously+willed+the+salvation+of+Judas+and+yet%2C+at+the+same+time+in+the+same+moment%2C+knew+that+Judas+never+would+believe%3B+and+that+he+did+not+will+to+give+faith+to+Judas+by+which+he+might+infallibly+have+been+converted%3B+yea%2C+would+permit+him+to+remain+in+his+unbelief+and+to+perish.+Who+would+dare+to+attribute+such+wills+to+a+man+of+sound+mind%2C+as+to+say+that+he+willed+seriously+and+ardently+what+he+knew+never+would+happen%2C+and+indeed+would+not+happen+because+he+nilled+to+effect+it%2C+on+whom+alone+the+effect+depends%3F+%E2%80%A6%0A%0AVII.+Second%2C+this+distinction+cannot+have+place+in+God+without+ascribing+to+him+not+only+folly+and+impotence+%28by+making+him+intend+seriously+and+desire+with+natural+affection+that+which+is+not+performed+and+cannot+be+performed+through+man+because+he+himself+does+not+will+it%29%3B+but+also+mutability+because+there+can+be+no+place+for+the+consequent+will+until+the+antecedent+is+first+rescinded.+For+how+could+God+at+the+same+time%2C+by+the+same+act+of+will%2C+will+to+save+all+men+and+to+damn+the+greater+part+of+them%3F+%E2%80%A6%0A%0AX.+Fifth%2C+it+is+repugnant+to+the+gospel+which+constantly+teaches+that+God+wills+to+save+not+all+simply%2C+but+only+the+elect+and+believers+in+Christ+and+that+the+means+of+salvation+are+not+offered+or+conferred+upon+all%2C+but+only+upon+some.+In+fine%2C+it+overthrows+the+eternal+election+of+God+because+it+leaves+it+uncertain%2C+founded+not+upon+the+good+pleasure+of+God%2C+but+upon+human+will+%28than+which+nothing+is+more+uncertain+and+changeable%29.+It+makes+it+such+as+that+no+execution+can+answer+to+it+%28i.e.%2C+makes+it+void+and+inefficacious%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+G.+M.+Giger%2C+ed.+J.+T.+Dennison+%281679%3B+3+vols%2C+Phillipsburg%2C+1992%29%2C+3.16.6-7%2C+10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff69960e634.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f69960e634.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/09/francis-turretin-on-the-error-of-contrary-wills-in-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cc5bb007b9" data-kw="">
<blockquote><p>It has become fashionable in modern evangelical and “Reformed” circles to deny the classic catholic and confessional Reformed doctrines of God’s impassibility and simplicity. The early church father, Irenaeus of Lyon reminds us that these doctrines were also denied by the early Gnostic heretics:

By their manner of speaking, they ascribe those things which apply to men to the Father of all, whom they also declare to be unknown to all; and they deny that He himself made the world, to guard against attributing want of power to Him; while, at the same time, they endow Him with human affections and passions.

But if they had known the Scriptures, and been taught by the truth, they would have known, beyond doubt, that God is not as men are; and that His thoughts are not like the thoughts of men. For the Father of all is at a vast distance from those affections and passions which operate among men. He is a simple, uncompounded Being, without diverse members, and altogether like, and equal to himself, since He is wholly understanding, and wholly spirit, and wholly thought, and wholly intelligence, and wholly reason, and wholly hearing, and wholly seeing, and wholly light, and the whole source of all that is good—even as the religious and pious are wont to speak concerning God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 2.13.3 in Ante-Nicene Fathers, 1: 374.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-6636989924" data-kw="">
<blockquote><p>The purpose of all the Catholic commentators I have been able to read on the divine books of both testaments, who have written before me on the trinity which God is, has been to teach that according to the scriptures Father and Son and Holy Spirit in the inseparable equality of one substance present a divine unity; and therefore there are not three gods but one God; although indeed the Father has begotten the Son, and therefore he who is the Father is not the Son; and the Son is begotten by the Father, and therefore he who is the Son is not the Father; and the Holy Spirit is neither the Father nor the Son, but only the Spirit of the Father and of the Son, himself coequal to the Father and the Son, and belonging to the threefold unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, trans. Edmund Hill, ed. J. E. Rotelle (420; New York: New City Press, 1991), 1.2.7, p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-5aa3ed0740" data-kw="">
<blockquote><p>Wherefore seeing that in the holy scriptures, in the Trinity the unity of the Deity is plainly and clearly taught, it is meet that we do simply rest therein, and not curiously to search nor lust after any further knowledge in this life, then it which God hath revealed. Wherefore Christian Emperors a thousand years past did very well enact the pain of death against such as should spread abroad any new doctrine as concerning this Article, as reproachful to Godward should teach the contrary. For God doubtless would not be seen of Moses, &amp; yet is seen in Christ Exo. 33 and 34. 2 Cor. 4. And moreover God hath in his Law decreed, that every one that hath sacrificed unto gods, besides the only God, should be slain, and as blasphemous towards God, should be taken out of the way [Exod. 22; Levit. 24].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common places of Christian religion</cite>, trans. John Stockwood (London, 1572), fols. 35-6.</span></figcaption>

<blockquote><p>Q. 2. Is this doctrine of the Trinity, then; a fundamental article, upon the belief of which our salvation depends?

A. Beyond all doubt it is: because without the knowledge and belief of the Trinity of persons, we would remain ignorant of the love of the Father, the merit of the Son, and the sanctifying influences of the Holy Ghost, in the purchase and application of redemption; without which there could be no salvation, John 17:3, – “This is life eternal, that they might know thee the only true God, and Jesus Christ whom thou hast sent.</p></blockquote>

</figure><figure class="quote" id="q-ab1380467f" data-kw="">
<blockquote><p>The English Divines in the Synod of Dort held, that God had a serious will of saving all men, but not an efficacious will of saving all: Thus differing from the Arminians on one side, and from some Protestant Authors on the other side; and their great instance of the possibility of a serious will and not efficacious, is this of God’s to Adam, seriously willing him to stand, and withal giving him ability to stand: yet it was not such an efficacious will, as de facto did make him stand …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 107.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“The English Divines in the Synod of Dort held, that God had a serious will of saving all men, but not an efficacious will of saving all: Thus differing from the Arminians on one side, and from some Protestant Authors on the other side; and their great instance of the possibility of a serious will and not efficacious, is this of God’s to Adam, seriously willing him to stand, and withal giving him ability to stand: yet it was not such an efficacious will, as de facto did make him stand …”

— Anthony Burgess, Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,, London (2nd edn, London, 1647), p. 107.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+English+Divines+in+the+Synod+of+Dort+held%2C+that+God+had+a+serious+will+of+saving+all+men%2C+but+not+an+efficacious+will+of+saving+all%3A+Thus+differing+from+the+Arminians+on+one+side%2C+and+from+some+Protestant+Authors+on+the+other+side%3B+and+their+great+instance+of+the+possibility+of+a+serious+will+and+not+efficacious%2C+is+this+of+God%E2%80%99s+to+Adam%2C+seriously+willing+him+to+stand%2C+and+withal+giving+him+ability+to+stand%3A+yet+it+was+not+such+an+efficacious+will%2C+as+de+facto+did+make+him+stand+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Vindiciae+Legis%3A+or%2C+a+vindication+of+the+moral+law+and+the+covenants%2C+from+the+errors+of+the+papists%2C+Arminians%2C+Socinians%2C+and+more+especially%2C+Antinomians.+In+XXX+lectures%2C+preached+at+Laurence-Jury%2C%2C+London+%282nd+edn%2C+London%2C+1647%29%2C+p.+107.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab1380467f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab1380467f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/10/06/anthony-burgess-on-the-english-divines-at-the-synod-of-dort-and-the-well-meant-offer-of-the-gospel/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2860e14caa" data-kw="">
<blockquote><p>[W]e cannot yield obedience, for conscience’ sake, to the present civil authority in North America. […]

1. The federal constitution, or instrument of national union, does not even recognize the existence of God, the King of Nations. In these civil deeds, though the immediate end may be the happiness of the commonwealth, yet the ultimate end, as well in this as in every other thing we do, should be the glory of God. Ought not men, in the formation of their deeds, to consider their responsibility to the moral governor, and their obligation to acknowledge his authority? Prov. 3:5: “In all thy ways acknowledge him, and he shall direct thy paths.” That a national deed, employed about the fundamental stipulations of magistracy as an ordinance of God, and the investiture of magistrates as his ministers, should nowhere recognize the existence of the Governor of the universe, is, to say nothing worse of it, truly lamentable. May it not be said of this nation as of Israel, Hos. 8:4: “They have set up kings, but not by me; they have made princes, and I knew it not?” Did not the framers of this instrument act, not only as if there had been no divine revelation for the supreme standard of their conduct; but also as if there had been no God? Did they not, in this, resemble the fool mentioned, Ps. 14:1, who “said in his heart, There is no God?” Every official act of the governor of a province must have some specific stamp of his dependence upon the authority which appointed him: and shall a nation act as if independent of the God of the universe, and expect to be guiltless?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 34-5.</span></figcaption>

<blockquote><p>When criticising the New Light party in the Reformed Presbyterian Synod of Ireland (John Paul et al), Thomas Houston noted that they had adopted the anti-covenanting position that the United States’ Constitution was not an atheistic and wicked document:

[…] Dr. Henry, who seemed to be the leader of the party, actually argued on the anti-covenanting principle, which has been assumed as fundamental by the American New Lights, – that the United States Government has claims to be regarded as a proper Christian Government, and to be recognised as the moral ordinance of God. Although Dr. Paul did not in direct terms put forward the principle, he expressed no dissent from the sentiments avowed by Dr. Henry, and he demurred against representing the United States Constitution as atheistical, as the committee in its Resolutions, and the American Reformed Church in its testimony had done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), p. 28.</span></figcaption>

</figure><figure class="quote" id="q-bc59f70763" data-kw="">
<blockquote><p>See hence the true spring of reformation in a church or land, and the true spring also of defection and backsliding. Why, when the Spirit of the Lord erects the kingdom of God within, especially in the hearts of magistrates or ministers, men of power and influence; then reformation work goes on apace, men then put to their hands heartily to the building up of Zion; every one then is ready to lend a lift to help up with the Head-stone of the corner. But when the kingdom of God is not within, men lose heart and hand to the work of the Lord, and fall a-work to daub with carnal wisdom and policy, which quite spoils and mars the building, instead of furthering it. What was it that made parliaments, and assemblies, and people of all ranks go so clean to work about the year 1638, and the year that followed it, to advance a work of reformation, and to engage themselves by solemn covenant to maintain it? And what makes the work go on so slowly now? Why, if folk, especially men of influence and power, had the kingdom of God within them, which, alas is much wanting now-a-days, otherwise there would not be so much daubing with untempered mortar as there is. O Sirs, if ever ye would see the Lord’s work thrive again in the land, pray that the foundation of the work by setting up his kingdom in the heart of kings, nobles, gentry, ministers, elders, and all ranks of people in the land; and then the hearts of the children will be turned to their fathers, and we may expect to see the church of Christ in this land, “looking forth as the morning, fair as the moon, clear as the sun, and terrible as an army with banners,” Cant. vi. 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fourth sermon on Luke 17:21 in The works of Ebenezer Erskine</cite></span></figcaption>

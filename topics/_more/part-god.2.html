<blockquote><p>Let our Souls pause and imagine what an Incomprehensible Spirit GOD is! What is his Name, and his Sons Name, if thou canst tell. HE is that He is, has Life in Himself, and in Him we live and move and have our Being. The Worlds of Spirits, and so the Corporeal Universe, are his Workmanship, continually sustained and governed by Him.

His active Essence therefore intimately pervades and penetrates the immeasurable Frame! GOD is Life, Light, Mind, Self-existence; Glory, Blessedness, Perfection; incomparable, inconceivable. To Whom can we liken Him, or what Likeness can we compare unto Him? Singularity and Onliness is his Glory. There is One God, and no other than He.

We should not have dared to say of God that He is a Spirit, or to have called Spirits his Image and Likeness, if He Himself had not so spoken to us of Himself. Yet is there no other Image whereby our Minds can represent Him to themselves, but from their own spiritual Nature, Powers, and Operations. This therefore must be the first thing in the Image of God of Angels and Men, Spirituality. In this Glass we see the first Shadow of God. Our Souls discern it by Reflection on themselves. We then look without, look abroad, and see thro’ the Eyes of the Body Images of Wisdom, Power and Goodness, in every thing Material and Visible.

We see the Work of some perfectly wise, good, Almighty Intelligence. — It is in and from it self, that the poor finite Spirit of Man, conscious to its own Understanding and Affections, and enlightened from the Spirit and Word of God, conceives and infers what a transcendent Being and Spirit God is; the Framer of the Universe, and the Former and Father of all Spirits. It is because we in our Souls bear some Image of God, that we can at all apprehend &amp; know that God is a Spirit. The Beasts have Eyes to see the Fields of Grass and Corn as much as we, but not having our Souls to discern the Eternal Power and Godhead from the Things that are made, their Spirits are not the Likeness of God as ours are.

And yet the spiritual Nature of Angels and Men is not to be compared with the Spirituality of God, or the Simplicity of his Essence. The grossest Matter that our Eyes behold is not so much below the Soul of Man, as that is below the Spirituality of the Divine Nature. Never the less in the Faculties of the Human Soul we plainly see some Resemblance of the Infinite Eternal Spirit, the Maker and Preserver of all Things, visible &amp; invisible. And this is the first and most obvious part of the Image of God upon us in our Creation, that we are Souls or Spirits. God who made us this Soul, herein has made us in his own Image, after his Likeness; for He is THE SPIRIT, and the Father of Spirits.

God is a Spirit in a Sense far superior to that wherein Angels are to be so called. He maketh his Angels Spirits. I doubt not but God is more invisible to them, and in Comparison of them, than they are to us and in Comparison of us. Created Spirits are compounded Beings if compared with their MAKER; they are made what they are, and He who made them can if he please annihilate and dissolve them again.

But there is an ineffable, inconceivable Simplicity of Essence in the Divine Nature, which infinitely distinguishes His Spirituality from that of all Creatures.— Angels and Souls are Spirits but they singly occupy a space, and pass from place to place, with an incredible Swiftness, like Rays of Light; but the Invisible God is an Immense Being filling Heaven and Earth, always present and the same in all Places. This is as far above Souls or Angels, as they are above Bodies.

It is a most just and glorious Account that God gave of Himself to Moses, I AM THAT I AM. He is what no One else is or can be; He is alone what He is; what all his Creatures can but poorly represent, and less can understand; even as the Shadow of a Man does but poorly represent him in his Life, Look, Thought and Speech. — God is singly the Spiritual BEING, and there is none like Him, none beside Him. As there is none Good but One which is God, so is there but One only Spirit in the Universe, who filleth all in all.

Thus the Lord our God is ONE LORD, and the Knowledge of HIM is too wonderful for us; it is high, and we cannot attain to it: yea how little do we know of our own Spirits, which are made for the Knowledge of Him? It is but as thro’ a Glass darkly that we see any thing of GOD. The Ideas of Infinite, Eternal, Unchangeable and Self existent are the Proof and Illustration of his Spirituality. We can only explain and confirm the One from the other. As what Man knoweth the Things of a Man, save the Spirit of Man that is in him? even so the things of God knoweth no Man, but the Spirit of God: Which Things we therefore speak, not in the Words which Man’s Wisdom teacheth, but which the Holy Ghost teacheth, comparing spiritual things with spiritual.</p></blockquote>

<blockquote><p>Therefore, when the instructor speaks here of man’s only comfort, it is abundantly clear that he has in mind only true believers, who, by the grace of the Holy Spirit, have received true self-knowledge as to the depth of their inability and misery. Such have become deeply troubled and sorrowful about this, and no longer are able to be at peace with themselves.

Instead, being truly lost, wretched, and poor in spirit, they have looked outside of themselves and taken refuge only to the free grace of God in Christ Jesus for their comfort and deliverance. So the instructor has in mind true believers who truly know themselves to be poor and wretched, and it is concerning them that he inquires into what their comfort consists in regard to such misery.

The instructor proceeds to describe this comfort in greater detail and formulates it as the only comfort in life and death. The essential characteristic of man’s true comfort consists in the fact that it is singular in nature. It is unique; that is, there is but one object in which this true comfort can be sought and found: the all-sufficient God and His blessed communion. This is the only and highest good, and apart from this good there is none other in which a wretched sinner could find this true and essential comfort for his poor soul. The soul has miseries, needs, and desires that are infinite in dimension, and everything apart from God is finite and deficient.

Nothing but God alone can provide the soul with true and essential satisfaction, comfort, and encouragement. There is but one comfort for a poor and believing sinner. Only one Object can yield true and essential comfort. All comfort that is sought for and found outside of this Object is extremely harmful and vain. With Asaph, the soul of a believing sinner must here say to her God, “Whom have I in heaven but thee? and there is none upon earth that I desire beside thee” (Ps. 73:25).</p></blockquote>

— Theodorus VanderGroe, The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+when+the+instructor+speaks+here+of+man%E2%80%99s+only+comfort%2C+it+is+abundantly+clear+that+he+has+in+mind+only+true+believers%2C+who%2C+by+the+grace+of+the+Holy+Spirit%2C+have+received+true+self-knowledge+as+to+the+depth+of+their+inability+and+misery.+Such+have+become+deeply+troubled+and+sorrowful+about+this%2C+and+no+longer+are+able+to+be+at+peace+with+themselves.%0A%0AInstead%2C+being+truly+lost%2C+wretched%2C+and+poor+in+spirit%2C+they+have+looked+outside+of+themselves+and+taken+refuge+only+to+the+free+grace+of+God+in+Christ+Jesus+for+their+comfort+and+deliverance.+So+the+instructor+has+in+mind+true+believers+who+truly+know+themselves+to+be+poor+and+wretched%2C+and+it+is+concerning+them+that+he+inquires+into+what+their+comfort+consists+in+regard+to+such+misery.%0A%0AThe+instructor+proceeds+to+describe+this+comfort+in+greater+detail+and+formulates+it+as+the+only+comfort+in+life+and+death.+The+essential+characteristic+of+man%E2%80%99s+true+comfort+consists+in+the+fact+that+it+is+singular+in+nature.+It+is+unique%3B+that+is%2C+there+is+but+one+object+in+which+this+true+comfort+can+be+sought+and+found%3A+the+all-sufficient+God+and+His+blessed+communion.+This+is+the+only+and+highest+good%2C+and+apart+from+this+good+there+is+none+other+in+which+a+wretched+sinner+could+find+this+true+and+essential+comfort+for+his+poor+soul.+The+soul+has+miseries%2C+needs%2C+and+desires+that+are+infinite+in+dimension%2C+and+everything+apart+from+God+is+finite+and+deficient.%0A%0ANothing+but+God+alone+can+provide+the+soul+with+true+and+essential+satisfaction%2C+comfort%2C+and+encouragement.+There+is+but+one+comfort+for+a+poor+and+believing+sinner.+Only+one+Object+can+yiel <blockquote><p>The Father, Son, and Spirit, (betwixt whom was the council of peace) work out their design in a perfect harmony and consent: as there was no jar in their council, so there can be none in the execution of it: those whom the Father, before all time, did chose; they, and they only, are the persons, whom the Son, when the fulness of time for the execution of that decree was come, died for, John xvii. 6. “I have manifested thy name unto the men, which thou gavest me out of the world; thine they were, and thou gavest them me;” and ver. 19. “For their sakes I sanctify myself;” i.e. consecrate, devote, or set myself apart for a sacrifice for them.

And those for whom Christ died, are the persons to whom the Spirit effectually applies the benefits and purchases of his blood: he comes in the name of the Father and Son. “But the world cannot receive him, for it neither sees, nor knows him,” John xiv. 17. “They that are not of Christ’s sheep, believe not,” John x. 26.</p></blockquote>

<blockquote><p>Now, in the cross of Christ, all the divine attributes are perfectly harmonized. Here it is, and only here, that “mercy and truth have met together, righteousness and peace have kissed each other.” By the cross, every attribute of the Deity is shown immaculate, and beaming with a splendour nowhere else to be seen.

The highest display of the glory of God ever made to the universe, was made by the cross of Christ. This glory is here seen, not only to be consistent with the salvation of penitent offenders, but to shine the brightest of all, in the very act of saving the chief of sinners— “Where sin abounded, grace did much more abound.</p></blockquote>

<blockquote><p>For God is considered two ways, as a Creator, and as a Saviour. It is the love of Him as a Saviour, that is shewed to thee in thy Redemption. And when was this love revealed? when JESUS CHRIST came into the world, and took upon Him our nature, then this love brake out toward man: He loved him from all Eternity, but it brake not out till then.

Mark then. It is the love of GOD that saveth, it is GOD’S bountifulness that saveth: our delivery behoved to proceed of a wonderful bountifulness in God, whereof the ground is love. If He had not loved thee, He would not have delivered thee. Then it is not a common love which He beareth towards us, but there is a special love in GOD to mankind: He loveth not these Heavens, these Stars, so well as He doeth men. No, He communicateth not the thousand part of those things that He communicateth to man, either to the Heavens, or to the Stars.

Then it is not the love of GOD the Creator that doeth this, and is the ground of this bountifulness, and of our life in Him: but it is a special kind of love. It is that love that proceedeth of GOD the Saviour. It is not the love of a Creator, but of a Father, not to the creature, but to the son. GOD loveth His son better than He doeth His creature, He loveth us as His sons.

If there were no further love of GOD, but as He is a Creator, thou durst never cry, Abba, Father: and except the Spirit spread abroad into our hearts that love which He beareth unto us, for all the world thou durst not appear before Him. The time is set down when He hath saved us, when His singular love appeared in the world, He saved us being manifested in the flesh.</p></blockquote>

<blockquote><p>IV. The essential proprieties in God do not in very deed differ from the essence.

For we acknowledge that in God for his singleness the essential proprieties do not in deed differ from the essence and therefore they without this cannot be communicated to any creature, and therefore no creature can be or can be said to be (for example sake) omnipotent simply, just, wise or such like. Even as our Lord Jesus speaking of one propriety, teacheth of them all saying: ‘None is good (simply) but God’.

V. That nothing is or can be made simply such as God is, unless the same might simply be God.

Wherefore, they which will affirm that any created substance ever could or can be made partaker of those divine proprieties whereby it should be such as God is, as simply omnipotent and such like, they must needs then confess that the same is or that it can be ὁμοούσιον, of the same substance with God, forasmuch as neither the Son himself is simply omnipotent, but as he is ὁμοούσιον, consubstantial with the Father, nor yet the Holy Spirit.

VI. A confirmation of the former opinion.

Whereupon we also understand, how it is that sith the Son is no less omnipotent then the Father and so likewise the Holy Ghost, yet we do not say that they are three almighties, but we confess with Athanasius and the whole church, that they are one only almighty, because indeed of them all there is but one and the self same substance. Therefore seeing no creature hath one and the self same essence with God, but a far other and diverse, and if the same by communication of the divine omnipotency could also be made omnipotent, then it must follow that there might be more almighties then one, which we believe can not without blasphemy be affirmed.

VII. Errors.

Wherefore we condemn and detest all heresies, which have risen against this first article of our faith or have sprong from hell and been condemned by the holie fathers in their lawful councils, as those of Cerinthus, Ebion, Valentinus, Marcion, Manichaeus, Arius, Eunomius, Sabellius, Praxea, Fotinus and such like as Servetus and Tritheitae, also the blasphemies of Jews and Turks [Muslims].

And lastly all heresies which have been invented by the devil, either against the unity of the divine essence or against the true Trinity of persons. Yea, and those therefore which deny either the Son to be true and everlasting God or the Holie ghost to be so, or which do confound these persons and say they bee one and the self same existence, which for divers respects is called by diverse names of Father, Son, and Holy Ghost.

We also condemn all those errors which do separate the essential proprieties of God from the divine essence, which it seemeth unto us that these men very unadvisedly do, which teach that those essential proprieties in very deed may be communicated or rather are already communicated to creatures without communication of the essence.</p></blockquote>

And lastly all heresies which have been invented by the devil, either against the unity of the divine essence or against the true Trinity of persons. Yea, and those therefore which deny either the Son to be true and everlasting God or the Holie ghost to be so, or which do confound these persons and say they bee one and the self same existence, which for divers respects is called by diverse names of Father, Son, and Holy Ghost.

We also condemn all those errors which do separate the essential proprieties of God from the divine essence, which it seemeth unto us that these men very unadvisedly do, which teach that those essential proprieties in very deed may be communicated or rather are already communicated to creatures without communication of the essence.”

— Jerome Zanchi, De religione christiana fides – Confession of Christian Religion, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.IV-VII, 1: 131-37.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+The+essential+proprieties+in+God+do+not+in+very+deed+differ+from+the+essence.%0A%0AFor+we+acknowledge+that+in+God+for+his+singleness+the+essential+proprieties+do+not+in+deed+differ+from+the+essence+and+therefore+they+without+this+cannot+be+communicated+to+any+creature%2C+and+therefore+no+creature+can+be+or+can+be+said+to+be+%28for+example+sake%29+omnipotent+simply%2C+just%2C+wise+or+such+like.+Even+as+our+Lord+Jesus+speaking+of+one+propriety%2C+teacheth+of+them+all+saying%3A+%E2%80%98None+is+good+%28simply%29+but+God%E2%80%99.%0A%0AV.+That+nothing+is+or+can+be+made+simply+such+as+God+is%2C+unless+the+same+might+simply+be+God.%0A%0AWherefore%2C+they+which+will+affirm+that+any+created+substance+ever+could+or+can+be+made+partaker+of+those+divine+proprieties+whereby+it+should+be+such+as+God+is%2C+as+simply+omnipotent+and+such+like%2C+they+must+needs+then+confess+that+the+same+is+or+that+it+can+be+%E1%BD%81%CE%BC%CE%BF%CE%BF%CF%8D%CF%83%CE%B9%CE%BF%CE%BD%2C+of+the+same+substance+with+God%2C+forasmuch+as+neither+the+Son+himself+is+simply+omnipotent%2C+but+as+he+is+%E1%BD%81%CE%BC%CE%BF%CE%BF%CF%8D%CF%83%CE%B9%CE%BF%CE%BD%2C+consubstantial+with+the+Father%2C+nor+yet+the+Holy+Spirit.%0A%0AVI.+A+confirmation+of+the+former+opinion.%0A%0AWhereupon+we+also+understand%2C+how+it+is+that+sith+the+Son+is+no+less+omnipotent+then+the+Father+and+so+likewise+the+Holy+Ghost%2C+yet+we+do+not+say+that+they+are+three+almighties%2C+but+we+confess+with+Athanasius+and+the+whole+church%2C+that+they+are+one+only+almighty%2C+because+indeed+of+them+all+there+is+but+one+and+the+self+same+substance.+Therefore+seeing+no+creature+hath+one+and+the+self+same+essence+with+God%2C+but+a+far+o nanter.wordpress.com/2020/02/15/girolamo-zanchi-the-triune-gods-properties-do-not-differ-from-his-essence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-38a08a75b7" data-kw="">
<blockquote><p>God, at the creation, beheld man, a goodly frame of his own rearing, adorned with his own image, beautified with his graces, embellished with holiness and righteousness, and furnished with a power to stand; and afterwards beheld him ungratefully rebelling against his sovereign, invading his rights, and contemning his goodness, forfeiting his own privileges, courting his ruin, and sinking into misery.

So blinded is his mind, as not to be able to find out a way for his own recovery; so perverse is his will, that instead of craving pardon of his judge, he flies from him, and when his flight would not advantage him, he stands upon his own defence, and extenuates his crime; thus adding one provocation to another, as if he had an ambition to harden the heart of God against him, and render himself irrecoverably miserable.

God so overlooks these, as in immense love and grace to settle a way for man’s recovery, without giving any dissatisfaction to his justice, so strongly engaged for the punishment of the offence. And rather than this notorious rebel and prodigious apostate should perish according to his merit, he would transfer the punishment (which he could not remit without a violation of his truth, and an injury to his righteousness) upon a person equal to himself, most beloved by him, his delight from eternity, and infinitely dearer to him than anything in heaven or earth. Herein was the emphasis of divine love to us, that ‘he sent his Son to be the propitiation for our sin,’ 1 John iv. 10.

It was love that he would restore man after the fall; there was no more necessity of doing this, than of creating the world. As it added nothing to the happiness of God, so the want of it had detracted nothing from it. There was no more absolute necessity of setting up man again after his breaking, than of a new repair of the world after the destructive deluge. But that he might wind up his love to the highest pitch, he would not only restore man, but rather than let him lie in his deserved misery, would punish his own bowels to secure man from it. It was purely his grace which was the cause that his Son ‘tasted death for every man,’ Heb. ii. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 496-97.</span></figcaption>

</figure><figure class="quote" id="q-6fe375315b" data-kw="">
<blockquote><p>It is, then, universally acknowledged that we must believe the Deity to be not only almighty, but just, and good, and wise, and everything else that suggests excellence. It follows, therefore, in the present dispensation of things, that it is not the case that some particular one of these Divine attributes freely displays itself in creation, while there is another that is not present there; for, speaking once for all, no one of those exalted terms, when disjoined from the rest, is by itself alone a virtue, nor is the good really good unless allied with what is just, and wise, and mighty (for what is unjust, or unwise, or powerless, is not good, neither is power, when disjoined from the principle of justice and of wisdom, to be considered in the light of virtue; such species of power is brutal and tyrannous; and so, as to the rest, if what is wise be carried beyond the limits of what is just, or if what is just be not contemplated along with might and goodness, cases of that sort one would more properly call vice; for how can what comes short of perfection be reckoned among things that are good?). If, then, it is fitting that all excellences should be combined in the views we have of God, let us see whether this Dispensation as regards man fails in any of those conceptions which we should entertain of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Catechism</cite>, (c. 385), 20 in Nicene and Post-Nicene Fathers 2, 5: 491.</span></figcaption>

ods-excellencies/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b49847345b" data-kw="">
<blockquote><p>Humility.—A measure of this grace is to be expected in every true Christian: but it can only appear in proportion to the knowledge they have of Christ and of their own hearts. It is a part of C’s [1] daily employment to look back upon the way by which the Lord has led him; and while he reviews the Ebenezers he has set up all along the road, he sees, in almost an equal number, the monuments of his own perverse returns, and how he has in a thousand instances rendered to the Lord evil for good. Comparing these things together, he can without affectation adopt the Apostle’s language, and style himself “less than the least of all saints, and of sinners the chief.”

A and B know that they ought to be humbled; but C is truly so, and feels the force of that text which I mentioned in my last; Ezek. xvi. 63. Again, as he knows most of himself, so he has seen most of the Lord. The apprehension of infinite Majesty combined with infinite Love, makes him shrink into the dust. From the exercise of this grace he derives two others, which are exceedingly ornamental, and principal branches of the mind which was in Christ.

The one is, submission to the will of God. The views he has of his own vileness, unworthiness, and ignorance, and of the Divine sovereignty, wisdom, and love, teach him to be content in every state, and to bear his appointed lot of suffering with resignation, according to the language of David in a time of affliction, “I was dumb, and opened not my mouth, because thou didst it.”

The other is, tenderness of spirit towards his fellow-Christians. He cannot but judge of their conduct according to the rule of the word. But his own heart, and the knowledge he has acquired of the snares of the world, and the subtilty of Satan, teach him to make all due allowances, and qualify him for admonishing and restoring, in the spirit of meekness, those who have been overtaken in a fault. Here A is usually blameable; the warmth of his zeal, not being duly corrected by a sense of his own imperfections, betrays him often into a censorious spirit. But C can bear with A likewise, because he has been so himself, and he will not expect green fruit to be ripe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter XII, Forty-One Letters on Religious Subjects</cite></span></figcaption>

<blockquote><p>If I cannot by this Attempt convince Atheists, (which perhaps is next to blanching an Ethiopian) yet I hope I shall do something towards preventing the Spreading of that pernicious Infection which they are the Authors of; I hope I shall effect something towards checking the Progress of that Hellish Ferment which works in the World at this day. It may be what I shall offer will be serviceable to bridle the Insolence of those bold Men, and to make them recoil and give back. It may be it will cripple and disable them, though they make a shift to be upon their Feet. Perhaps it may give them a Mortification, though they will not let us know so much.

Or, if my Hopes fail me as to this, yet I will not despair of Confirming, and Strengthening such who are really persuaded of the Doctrine here treated of. I may be helpful to establish these Persons in their Belief, though I cannot reclaim the Infidelity of others. But this is not the height of what I aim at; for, besides what I have already suggested, my Intention is that this Discourse should afford variety of matter to the Religious for their Devout Contemplations. I have set the Greater and Lesser World before them, and have so displayed the several parts of both, that they may everywhere discern the Eternal Godhead.

I have propounded those Visible and Remarkable Topicks whence pious Minds may infallibly deduce the Truth and Reality of Providence, and the adorable Excellency of the Power, Wisdom and Goodness of God, and his other Divine Perfections and Properties which respect Mankind. If I had not chiefly designed these Papers for such, I should not have so often alleged the Holy Scriptures: which with the other sort of Men are in no esteem, and are thought to have no Authority; no more than the Alcoran, or some Legendary Tale. But all those that have a true Sense of Religion on their Spirits, reverence and prize these Writings next to the Blessed Author of them; and they know that it is proper to prove a God out of his Own Book.

The Reader may observe that I frequently make use of Scripture in setting forth Natural things, those which appertain to the Heavens, Earth, Sea, &amp;c. and the Body of Man; because I would let the World see that this Holy Book is not only useful as to Divine and Spiritual Matters, but even in respect of all sorts of Humane Learning, which I have on another occasion amply proved. Having thus propounded the Designs of my Undertaking, (and if I be successful in any of them, I shall reckon it a great Happiness) I will enter upon the Work itself, by the Assistance of Him whose Existence and Providence I am now to demonstrate.</p></blockquote>

</figure><figure class="quote" id="q-d789e3df17" data-kw="">
<blockquote><p>If any should wrangle for the expressions that are used by Divines in this Mystery; we confess that many of the Schoolmen have exceeded, and have taken too much liberty in this wonderful Mystery; yet, it is the thing that we especially should be established into, and from Scripture that is clear, that there is but One God, and yet Three, who being denominated in the concrete, must imply three different real Relations, or Subsistences, or Persons: and this Essence being infinite and communicable, there is no warrant to bound it to the rules and properties of created beings, who are but finite; and in that respect also incommunicable:

And we conceive that the names here given (and elsewhere in Scripture) will amount clearly to the equivalent of Essence and Persons, which are most obviously made use of in this matter: for, what is that, I am Alpha and Omega, who was, is, and is to come, but that same, Exod. 3. I AM THAT I AM, which denoteth His Being or Essence, as that which is ever a Being: and Idols, being differenced from the true. God by this, that they are by Nature no gods, Gal. 4.8. it implies on the contrary, that by Nature He is God, and so God in respect of His Essence: and therefore that God may be essentially considered, and in that respect of His Essence.

Again, these expressions, that the one is called the Father, and the other the Son, and yet both One God, do clearly hold forth that there are real relations in that Godhead, subsisting in a distinct manner; and so there must be Persons, as Heb. 1. the Son, is called the express Image of the Father’s Person, which plainly says, that the Father, considered as distinguished from the Son, is a Person, and subsists; and that the Son, as distinguished from the Father, and as so lively and expressly representing His Person, must be a Person also, having this from the Father: and what is said of the Father and Son, must also be true of the holy Ghost, who is God equal with both, yet different from Them both, as They differ from each other, though not in respect of that same incommunicable property, yet he who proceedeth, must differ from those from whom he proceeds, as he who is begotten, must differ from him that begat him.

For Their operations, we may find here, that in some things They concur jointly, yet some way differently. Some things again are attributed to one, which cannot be to another, as their personal properties; the Son is begotten, and not the Father or the Spirit: therefore He is allanerly [only] the Son: the Father begets; and the Spirit proceeds. These are called Their personal properties, and Their works ad intra, or amongst, or in reference to Themselves: of this kind is the incarnation of the Son, which can neither be said of the Father, nor of the holy Ghost.

Again, in things ad extra, or that relate to the Creatures simply, whether in making, or governing of the World, They jointly concur: the Father createth all, so doth the Son and holy Ghost; the Son, from the Father, by the holy Ghost; the holy Ghost, from the Father and the Son, as those expressions of God, sending His Son, the Son’s sending the Spirit from the Father, &amp;c. do declare, Joh. 14.26. and 16.7. Gal. 4.6.</p></blockquote>

<blockquote><p>Quest. Here a question may be started, If there be such perfection in the knowledge of God, then he knows sin?

Resp. The Schools distinguish of a double knowledge in God. There is, 1. Scientia simplicis intelligentiae, a knowledge of pure intelligence, and thus he knows evil by a contrary good, as the light discovers the darkness. So we say, Rectum est index sui &amp; obliqui, The straight rule shews the crooked. 2. There is a knowledge of approbation. Thus God doth not know sin; for he hates it, he punisheth it. Christ was made sin, yet he knew no sin; he did know it so as to hate it, not so as to act or approve it.

I pass to the Reasons.

1. Reason. From his creation; God is the Father of lights, therefore must needs see. It is his own Argument, He that planted the ear, shall he not hear? he that formed the eye, shall he not see? He that makes a Watch, knows all the pins and wheels in it, and though these wheels move cross one to another, he knows the true and perfect motion of the Watch, and the spring that sets these wheels a going; He that formed the eye, shall he not see? Man may be compared to a spiritual Watch. The affections are the wheels; the heart is the spring; the motion of this Watch is false; the heart is deceitful; but God that made this watch knows the true motion of it (be it never so false) and the spring that sets the wheels a going. God knows us better then we know our selves: He is as Ezekiel’s wheels full of eyes, and as Augustin saith, he is totus oculus, all eye.

2. Reason. From his ubiquity. He is Omniscient, because Omnipresent, Ier. 23. 24. Do not I fill heaven and earth? He is no where included, and yet no where excluded; His circumference is every where: God hath an eye in Councils, in Armies, he makes an Heart anatomy; he sees what men’s designs are, and whither they are driving. If hatred wears the livery of Friendship, if Ambition comes masqued with humility, if Religion be made a stirrup to get into the saddle of preferment, God sees it; And though they dig into hell, thence shall my hand take them, Amos 9. 2. God can unlock hell; Plato saith of the King of Lydia, he had a Ring, when he turned the head of it to the palm of his hand, he could see every one, but himself walk invisible.

Thus God observes all our actings, but himself is not seen, as the Apostle argues, 1 Tim. 6. 16. Therefore the Schoolmen say well, Deus est in loco repletivè. Man may be circumscribed, the Angels may be defined, but God is in every place by way of repletion. His Centre is every where, and his eye is ever in his Centre.</p></blockquote>

<blockquote><p>Progressive evolution within the Divine nature, would imply a career for the Deity in which He was passing from less to more perfect stages of existence, and would bring Him within the realm of the relative and conditioned.

Latency is necessarily excluded from the Eternal One, by virtue of that absolute perfection and metaphysical self-completeness whereby his being is “without variableness or shadow of turning.” …

For the Deity, though self-complete and incapable of development himself, has yet made that which is potential and destined to an unfolding. He has created a universe that is full of latent powers and agencies.</p></blockquote>

<blockquote><p>As God is essentially holy, so God is unmixedly holy. The holiness of God is a pure holiness, it is an unmixed holiness: 1 John i. 5, ‘God is light, and in him is no darkness at all.’ There are no mixtures in God. God is a most clear, bright-shining light, yea, he is all light, and in him is no darkness at all. The moon, indeed, when it shines brightest, hath her dark spots and specks, but God is a light that shines gloriously without the least spot or speck. Now, look, as that darkness which hath not the least light attending it is the grossest, the thickest Egyptian darkness that can be, so that light that hath not the least cloud of darkness attending it must be the most clear, splendid light that possible can be; and such a light is the Holy One of Israel.

It is very observable, the apostle, to illustrate the perfect purity and sanctity of God, adds a negative to his affirmative, ‘In him is no darkness at all,’ that is, God is so pure, that not the least spot, the smallest speck, can cleave to him; he is so holy, that no iniquity can be found in him; there is no defect nor default in the nature of God. He is a God of truth, and without iniquity; just and right is he.

As Moses spake in that Deut. xxxii. 4, God is a pure, a most pure act, without the least potentiality, defectability, or mutability, and therefore in the highest sense he is light, and in him is no darkness at all. Surely there is no unrighteousness in God; no evil can dwell with him, or come near unto him. God stands at such a distance from iniquity, yea, he so abhors it, that he never did, nor never will, bestow a good look upon it: Hab. i. 13, ‘Thou art of purer eyes than to behold evil, and canst not look on iniquity.’

There are four things that God cannot do: 1. He cannot lie; 2. He cannot die; 3. He cannot deny himself; nor, 4. He cannot look with a favourable eye upon iniquity. God doth indeed look upon iniquity with a hateful eye, with an angry eye, with a revengeful eye, and with a vindictive eye, but he never did nor will look upon iniquity with an eye of delectation, or with an eye of approbation. Witness his hurling the fallen angels out of heaven, and his banishing of sinning Adam out of paradise. By all this you see that the holiness of God is a pure holiness, it is a holiness without mixture.

But now all the holiness that is in the best and choicest saints in the world is but a dreggy holiness, a mixed holiness, a weak and imperfect holiness; their unholiness is always more than their holiness. Ah, what a deal of pride is mixed with a little humility, and what a deal of unbelief is mixed with a little faith, and what a deal of passion is mixed with a little meekness, and what a deal of earthliness is mixed with a little heavenliness, and what a deal of carnalness is mixed with a little spiritualness, and what a deal of hardness is mixed with a little tenderness!

Oh, but now the holiness of God is a pure holiness, it is a holiness without mixture, there is not the least drop nor the least dreg of unholiness in God. It is true the gods of the heathen were such as had been impure, beastly, filthy men, and therefore several writers have taken a great deal of pains to convince heathens of their impiety and folly in worshipping such for gods, upon whom they fastened many horrid, ridiculous, lascivious, and impious actions, and therefore they conclude against them, that they are no gods.

It is most certain that the true God, that he that is the High and the Holy One, cannot be charged with any iniquity, no, nor with the least show or shadow of vanity. In God there is wisdom without folly, truth without falsehood, light without darkness, and holiness without sinfulness.</p></blockquote>

It is very observable, the apostle, to illustrate the perfect purity and sanctity of God, adds a negative to his affirmative, ‘In him is no darkness at all,’ that is, God is so pure, that not the least spot, the smallest speck, can cleave to him; he is so holy, that no iniquity can be found in him; there is no defect nor default in the nature of God. He is a God of truth, and without iniquity; just and right is he.

As Moses spake in that Deut. xxxii. 4, God is a pure, a most pure act, without the least potentiality, defectability, or mutability, and therefore in the highest sense he is light, and in him is no darkness at all. Surely there is no unrighteousness in God; no evil can dwell with him, or come near unto him. God stands at such a distance from iniquity, yea, he so abhors it, that he never did, nor never will, bestow a good look upon it: Hab. i. 13, ‘Thou art of purer eyes than to behold evil, and canst not look on iniquity.’

There are four things that God cannot do: 1. He cannot lie; 2. He cannot die; 3. He cannot deny himself; nor, 4. He cannot look with a favourable eye upon iniquity. God doth indeed look upon iniquity with a hateful eye, with an angry eye, with a revengeful eye, and with a vindictive eye, but he never did nor will look upon iniquity with an eye of delectation, or with an eye of approbation. Witness his hurling the fallen angels out of heaven, and his banishing of sinning Adam out of paradise. By all this you see that the holiness of God is a pure holiness, it is a holiness without mixture.

But now all the holiness that is in the best and choicest saints in the world is but a dreggy holiness, a mixed holiness, a weak and imperfect holiness; their unholiness is always more than their holiness. Ah, what a deal of pride is mixed with a little humility, and what a deal of unbelief is mixed with a little faith, and what a deal of passion is mixed with a little meekness, and what a deal of earthliness is mixed with a little heavenliness, and what a deal of carnalness is mixed with a little spiritualness, and what a deal of hardness is mixed with a little tenderness!

Oh, but now the holiness of God is a pure holiness, it is a holiness without mixture, there is not the least drop nor the least dreg of unholiness in God. It is true the gods of the heathen were such as had been impure, beastly, filthy men, and therefore several writers have taken a great deal of pains to convince heathens of their impiety and folly in worshipping such for gods, upon whom they fastened many horrid, ridiculous, lascivious, and impious actions, and therefore they conclude against them, that they are no gods.

It is most certain that the true God, that he that is the High and the Holy One, cannot be charged with any iniquity, no, nor with the least show or shadow of vanity. In God there is wisdom without folly, truth without falsehood, light without darkness, and holiness without sinfulness.”

— Thomas Brooks, The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 393-94.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+God+is+essentially+holy%2C+so+God+is+unmixedly+holy.+The+holiness+of+God+is+a+pure+holiness%2C+it+is+an+unmixed+holiness%3A+1+John+i.+5%2C+%E2%80%98God+is+light%2C+and+in+him+is+no+darkness+at+all.%E2%80%99+There+are+no+mixtures+in+God.+God+is+a+most+clear%2C+bright-shining+light%2C+yea%2C+he+is+all+light%2C+and+in+him+is+no+darkness+at+all.+The+moon%2C+indeed%2C+when+it+shines+brightest%2C+hath+her+dark+spots+and+specks%2C+but+God+is+a+light+that+shines+gloriously+without+the+least+spot+or+speck.+Now%2C+look%2C+as+that+darkness+which+hath+not+the+least+light+attending+it+is+the+grossest%2C+the+thickest+Egyptian+darkness+that+can+be%2C+so+that+light+that+hath+not+the+least+cloud+of+darkness+attending+it+must+be+the+most+clear%2C+splendid+light+that+possible+can+be%3B+and+such+a+light+is+the+Holy+One+of+Israel.%0A%0AIt+is+very+observable%2C+the+apostle%2C+to+illustrate+the+perfect+purity+and+sanctity+of+God%2C+adds+a+negative+to+his+affirmative%2C+%E2%80%98In+him+is+no+darkness+at+all%2C%E2%80%99+that+is%2C+God+is+so+pure%2C+that+not+the+least+spot%2C+the+smallest+speck%2C+can+cleave+to+him%3B+he+is+so+holy%2C+that+no+iniquity+can+be+found+in+him%3B+there+is+no+defect+nor+default+in+the+nature+of+God.+He+is+a+God+of+truth%2C+and+without+iniquity%3B+just+and+right+is+he.%0A%0AAs+Moses+spake+in+that+Deut.+xxxii.+4%2C+God+is+a+pure%2C+a+most+pure+act%2C+without+the+least+potentiality%2C+defectability%2C+or+mutability%2C+and+therefore+in+the+highest+sense+he+is+light%2C+and+in+him+is+no+darkness+at+all.+Surely+there+is+no+unrighteousness+in+God%3B+no+evil+can+dwell+with+him%2C+or+come+near+unto+him.+God+stands+at+such+a+distance+from+iniquity%2C+yea%2C+he+so+abhors+it%2C+that+he+never+did%2C+nor+never+will%2C+bestow+a+good+look+upon+it%3A+Hab.+i.+13%2C+%E2%80%98Thou+art+of+purer+eyes+than+to+behold+evil%2C+and+canst+not+look+on+iniquity.%E2%80%99%0A%0AThere+are+four+things+that+God+cannot+do%3A+1.+He+cannot+lie%3B+2.+He+cannot+die%3B+3.+He+cannot+deny+himself%3B+nor%2C+4.+He+cannot+look+with+a+favourable+eye+upon+iniquity.+God+doth+indeed+look+upon+iniquity+with+a+hateful+eye%2C+with+an+angry+eye%2C+with+a+revengeful+eye%2C+and+with+a+vindictive+eye%2C+but+he+never+did+nor+will+look+upon+iniquity+with+an+eye+of+delectation%2C+or+with+an+eye+of+approbation.+Witness+his+hurling+the+fallen+angels+out+of+heaven%2C+and+his+banishing+of+sinning+Adam+out+of+paradise.+By+all+this+you+see+that+the+holiness+of+God+is+a+pure+holiness%2C+it+is+a+holiness+without+mixture.%0A%0ABut+now+all+the+holiness+that+is+in+the+best+and+choicest+saints+in+the+world+is+but+a+dreggy+holiness%2C+a+mixed+holiness%2C+a+weak+and+imperfect+holiness%3B+their+unholiness+is+always+more+than+their+holiness.+Ah%2C+what+a+deal+of+pride+is+mixed+with+a+little+humility%2C+and+what+a+deal+of+unbelief+is+mixed+with+a+little+faith%2C+and+what+a+deal+of+passion+is+mixed+with+a+little+meekness%2C+and+what+a+deal+of+earthliness+is+mixed+with+a+little+heavenliness%2C+and+what+a+deal+of+carnalness+is+mixed+with+a+little+spiritualness%2C+and+what+a+deal+of+hardness+is+mixed+with+a+little+tenderness%21%0A%0AOh%2C+but+now+the+holiness+of+God+is+a+pure+holiness%2C+it+is+a+holiness+without+mixture%2C+there+is+not+the+least+drop+nor+the+least+dreg+of+unholiness+in+God.+It+is+true+the+gods+of+the+heathen+were+such+as+had+been+impure%2C+beastly%2C+filthy+men%2C+and+therefore+several+writers+have+taken+a+great+deal+of+pains+to+convince+heathens+of+their+impiety+and+folly+in+worshipping+such+for+gods%2C+upon+whom+they+fastened+many+horrid%2C+ridiculous%2C+lascivious%2C+and+impious+actions%2C+and+therefore+they+conclude+against+them%2C+that+they+are+no+gods.%0A%0AIt+is+most+certain+that+the+true+God%2C+that+he+that+is+the+High+and+the+Holy+One%2C+cannot+be+charged+with+any+iniquity%2C+no%2C+nor+with+the+least+show+or+shadow+of+vanity.+In+God+there+is+wisdom+without+folly%2C+truth+without+falsehood%2C+light+without+darkness%2C+and+holiness+without+sinfulness.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Crown+and+Glory+of+Christianity%3B+or+Holiness%2C+the+only+way+to+Happiness.+Discovered+in+LVIII+Sermons+from+Heb.+12.+14%2C+%281662%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grossart+%286+vols%2C+Edinburgh%3A+James+Nichol%2C+1861-67%29%2C+4%3A+393-94.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd051fac48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd051fac48.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/20/thomas-brooks-on-pure-actuality-and-gods-unmixed-holiness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2e92233f43" data-kw="">
<blockquote><p>The object of divine love is God. God is good, and good is amiable. God is all good: there is none good but one, that is God. God is essentially good, goodness in the abstract; he is infinitely excellent, he is all perfection. In this one attribute all the rest of the attributes of God are included, and this in each of them.

However the Scriptures, speaking to our capacities, describe God and his glorious attributes in several and distinct notions, yet in each one all are included; each one is infinite, and infinite perfection is essentially all perfection. God is originally good, the fountain and pattern of all that moral good which is in his creatures; he is bountiful and gracious, ready to do them good; and he is the felicitating end, or the final blessedness of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), p. 172.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-d4c0f223a0" data-kw="">
<blockquote><p>We understand these attributes to be one from God’s perspective, however, such that they can neither be divorced from the divine Being nor essentially and properly from each other as they exist in God, but are the simple, absolute Being of God Himself.

We, however, relate these attributes as distinct entities by themselves. Justice and mercy are one in God, but we differentiate between them in reference to the objects towards which they are manifested, and the effects of these manifestations. Our God is inimitable and incomprehensible in His perfection, and consequently is simple and indivisible.

In God there can be no differentiation between various matters, for whatever would be essentially distinct from God would render Him imperfect. Our limited comprehension must deal with each matter individually, however, and thus we assign distinct names to each attribute. Whatever we are capable of comprehending concerning God is according to truth and is consistent with His Being, but our finite understanding cannot penetrate its perfection and infinity</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-13a7af71bc" data-kw="">
<blockquote><p>Providence is a word which, in its proper signification, may seem to comprehend all the actions of God that outwardly are of him, that have any respect unto his creatures, all his works that are not ad intra, essentially belonging unto the Deity.

Now, because God “worketh all things according to his decree, or the counsel of his will,” Eph. i. 11, for whatsoever he doth now it pleased him from the beginning, Ps. cxv. 3; seeing, also, that known unto God are all his works from eternity; therefore, three things concerning his providence are considerable:—

1. His decree or purpose, whereby he hath disposed of all things in order, and appointed them for certain ends, which he hath fore-ordained. 2. His prescience, whereby he certainly fore-knoweth all things that shall come to pass. 3. His temporal operation, or working in time, — “My Father worketh hitherto,” John v. 17, — whereby he actually executeth all his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΘΕΟΜΑΧΙΑ ΑΥΤΕΞΟΥΣΙΑΣΤΙΚΗ</cite>, or, A display of Arminianism: being a discovery of the old Pelagian idol free-will, with the new goddess contingency (1643) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1967), 10: 31.</span></figcaption>

71bc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/27/john-owen-on-providence-and-the-ad-intra-ad-extra-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3e66d58afd" data-kw="">
<blockquote><p>God condescends to speak after the manner of men that we may understand him: and here we are not to think that God wants anything needful to him; he is God blessed for ever; or that he labours under any defect of power that he cannot accomplish what he would have, nor that he is capable of any uneasiness or desire of what he has not. To admit of any of those which commonly are found in men when they wish, were to blaspheme the Lord.</p></blockquote>

<blockquote><p>The redemption of sinners originated in the free and sovereign love of God, the Father, Son and Holy Spirit, whose love is one, though exerted variously, according to the order of their subsistence, in the voluntarily established economy of grace. The love of the Father has been justly called “the eternal disposing cause of redemption,” and to it accordingly is ascribed in Scripture the purpose of saving sinners, the selection of the objects of mercy, the appointment of the means, and the predestinating of the elect, in the Mediator, to the enjoyment of eternal life.

The love of the Son is the eternal spring of all that God did in the impetration of redemption; as the love of the Spirit is the spring of its application. And in the manifestation of the love of Christ we see also that of the Father and of the Spirit. While we are warranted to take a distinct view of divine love as displayed by each person of the adorable Trinity, we can thus view it as the love of one glorious being. We do not detract from the love of the Father and Spirit, when we say, “Unto him that loved us, and washed us from our sins in his own blood—be glory and dominion for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ in Sermons</cite></span></figcaption>

</figure><figure class="quote" id="q-0f616ed5d9" data-kw="">
<blockquote><p>There are three distinct Persons of the blessed Trinity, the Father, Son, and Spirit, who are the same one God: in the Name of these Three, is Baptism administrated; and from Them, Grace is wished and prayed for, 2 Cor, 13.14. For, 1. That there are Three, who are distinctly mentioned here, cannot be denied; that the first is the Father; and the third, Jesus Christ, really distinct from the Father, is clear: for, the Son, and not the Father, was incarnate: and therefore the like must be said of the seven Spirits, that they set forth the Holy Ghost personally, seeing it is He who in the like places useth to be joined in with the Father and the Son, as 2 Cor. 13.13. 1 Joh. 5.7, 8. and therefore it’s said in the seven Epistles, to be what the Spirit saith. These Seven Spirits therefore, is that one Spirit, and He a person that speaketh to the Churches.

Secondly, That each of these Three must be God, appears, 1. Because the last Two are both joined as equal with the Father, of whom there can be no question. 2. Because the Son, Jesus Christ, afterward hath the same Title attributed to Him, which is here given to the Father. 3. Because the same one suit, is prayed for from all of them; and, it being Grace and Peace, which only God can give, suppones [supposes] divine essential Attributes to be in those from whom they are wished: yea, They are named here, as joint Senders of this Epistle, and Authorizers of this Word; therefore is it so often afterward said, Let him that hath ears, hear what the Spirit saith: and there can no Authority but what is divine, be sufficient here. Hence also, Thus saith the Lord, and, thus saith the Holy Ghost, are frequently put for one another: each one therefore of these Three must be God. 3. It may appear from this also, that all these Three are One God, thus, This Revelation and Salutation cometh from one God, chap. 1. ver. 1. and 22. 18, 19. and yet this Revelation and Salutation cometh from the Father, Son, and Spirit: therefore They are that One God.

Again, If the Grace and Peace proceed from one Essence, which is common to all, then they are the same God essentially, though distinct Persons; but Grace and Peace looks to the same Godhead and Essence, though it be wished for from all, for the effect, Grace and Peace, is but one, it doth therefore suppose an unity in the fountain from which it comes, to wit, these Three Persons of the glorious Godhead, who are named distinctly, not to shew a different effect from the Father, which is not from the Son; but to shew the concurrence of these blessed Three in an united way for bringing forth of these; so that what cometh from the Father, cometh also from the Son and Spirit.

These essential Attributes, and that most simple and infinite Essence, being common to all the Three Persons, it rests therefore that they are Three distinct Persons, and yet of the same infinite Godhead. Neither will that which the Socinians and others oppose to this place, have weight. Say they, Christ is spoken of here, as dead; Therefore cannot be God. For, it’s one thing to speak of Him who was dead, another to say that it speaks of Him as such. He that died was God, but He died not as God: and therefore this can only prove, that Jesus Christ, as to His Person, is man; but by it, we can no more deny Him to be the second Person of the Godhead, than afterward when He is called the first and the last, by that, we can deny Him to be man. And that the Son, and the Holy Ghost, are equal with the Father, appeareth also in this, That they are both equally with Him, the object of divine Worship here, to wit, of Invocation and Prayer, which could not otherwise be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfille</cite>, (Edinburgh: Christopher Higgins, 1658), pp 5-6.</span></figcaption>

<blockquote><p>[Y]et lo when death comes to end our work, when she stretcheth out her arms to pull us into the port, when after so many dangerous passages, and loathsome lodgings she would conduct us to our true home and resting place: instead of rejoicing at the end of our labour, of taking comfort at the sight of our land, of singing at the approach of our happy mansion, we would fain (who would believe it?) retake our work in hand, we would again hoist sail to the wind, and willingly undertake our journey anew.

No more, then, remember we our pains, our shipwrecks and dangers are forgotten: we fear no more the travels nor the thieves. Contrariwise, we apprehend death as an extreme pain, we doubt it as a rock, we flee it as a thief. … We fear that we ought to hope for, and wish for that we ought to fear. We call life a continual death: and death the issue of a living death, and the entrance of a never dying life.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Y]et lo when death comes to end our work, when she stretcheth out her arms to pull us into the port, when after so many dangerous passages, and loathsome lodgings she would conduct us to our true home and resting place: instead of rejoicing at the end of our labour, of taking comfort at the sight of our land, of singing at the approach of our happy mansion, we would fain (who would believe it?) retake our work in hand, we would again hoist sail to the wind, and willingly undertake our journey anew.

No more, then, remember we our pains, our shipwrecks and dangers are forgotten: we fear no more the travels nor the thieves. Contrariwise, we apprehend death as an extreme pain, we doubt it as a rock, we flee it as a thief. … We fear that we ought to hope for, and wish for that we ought to fear. We call life a continual death: and death the issue of a living death, and the entrance of a never dying life.”

<blockquote><p>Forasmuch then as our turning away from God is our own act, and this is evil will; but our turning to God is not possible, except He rouses and helps us, and this is good will, — what have we that we have not received? But if we received, why do we glory as if we had not received? Therefore, as “he that glorieth must glory in the Lord,” it comes from His mercy, not their merit, that God wills to impart this to some, but from His truth that He wills not to impart it to others.

For to sinners punishment is justly due, because “the Lord God loveth mercy and truth,” and “mercy and truth are met together;” and “all the paths of the Lord are mercy and truth.” And who can tell the numberless instances in which Holy Scripture combines these two attributes? Sometimes, by a change in the terms, grace is put for mercy, as in the passage, “We beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.” Sometimes also judgment occurs instead of truth, as in the passage, “I will sing of mercy and judgment unto Thee, O Lord.</p></blockquote>

<blockquote><p>God is INCOMPREHENSIBLE in his excellency, purposes, and works. 1. We have but very imperfect knowledge of ourselves … How absurd then the hope to have comprehensive conceptions of the infinite excellencies of God! 2. God’s perfections are infinitely superior to those of creatures, even where there is some similarity between them.

3. In his self-existence, absolute eternity, omnipresence, of which we certainly know him to be possessed, and his being determined to act from himself, God is infinitely unlike to us, as well as infinitely transcends our comprehension. 4. No reason of ours can controvert, but God may have in his nature millions of excellencies or perfections which are not in the least marked in his works of creation or common providence.</p></blockquote>

</figure><figure class="quote" id="q-7540edc2ed" data-kw="">
<blockquote><p>The first Doubt is, What kind of act in God forgiveness of sin is? Whether it be an immanent act in-dwelling and abiding in God, or transient, working some real effect and change upon the creature.

Now in handling of this, I shall not trouble you with that perplex Question so much vexed by the Schoolmen, Whether a transient action be in the Agent, or in the Patient, but lay down some differences between an immanent action, and a transient action; only you must take notice that we are in mere darkness, and not able to comprehend how God is said to act or work.

For on the one side, we must not hold that there are any accidents in God; or that he can be a subject recipient of such, because of his most pure and simple Essence; so that whatsoever is in God is God. And yet on the other side, the Scripture doth represent God doing and working such mercies and judgements as seemeth good to him. …

Let us come to give the differences between an immanent action, and a transient, and then we may easily see, which of these two Justification or Remission of sin is.

The first and proper difference is this, An immanent action is that which abides in God, so that it works no real effect without: As when God doth merely know or understand a thing; but a transient action, is when a positive change is made thereby in a creature, as in Creation, &amp;c. So that we may conclude of all Gods actions, which do relate to believers, only predestination is an immanent act of God, and all the rest, Justification, Regeneration, Glorification, are transient acts: for Predestination though it be an act of God choosing such an one to happiness, yet it doth not work any real change or positive effect in a man, unless we understand it virtually, for it is the cause of all those transient actions that are wrought in time. Howsoever therefore Justification be called by some an immanent action, and so made to go before Faith and Repentance as if Faith were only a declaration and sign of pardon of sin from all eternity, yet that cannot be made good, as is to be shewed.

A second difference floweth from the other, An immanent action is from eternity, and the same with God’s essence, but a transient action is the same with the effect produced. Hence the Orthodox maintain, That God’s decrees are the same with his nature. Hence when we speak of God’s willing such a thing, it is no more then his divine Essence, with an habitude and respect to such objects; God’s Decrees are no more then God decreeing, God’s will no more then God willing: otherwise the simplicity of God’s nature will be overthrown, and those volitions of God will be created entities, and so must be created by other new volitions, and so in infinitum, as Spanheimius well argueth, only the later part seemeth not to be strong or sufficient, because when man willeth, he doth not will that by a new volition, and so in infinitum, and why then would such a thing follow in God?

Besides it’s no such absurdity in the actings of the soul, to hold a progress in infinitum, thus far, that it doth not determinately pitch or end at such an act. It is one thing to have things distinguished in God, and another thing for us to conceive distinctly of them. The former is false: The latter is true and necessary. But with transient actions it is otherwise, they being the same with the effects produced, are in time; And this is a perpetual mistake in the Antinomian, to confound Gods Decree and Purpose to justify, with Justification, God’s immanent action from all eternity, with that transient, which is done in time. Whereas if they should do thus in matters of Sanctification and Glorification, it would be absurd to every man’s experience, whereas indeed a man may as truly say, That his body is glorified from all eternity, as that his sins are forgiven from all eternity. And certainly Scripture speaks for one as well as the other, when it saith, Whom he hath justified, them he hath glorified.

By these two differences, you may see, That pardon of sin is a transient action, and so Justification also, partly, because it leaveth a positive, real effect upon a man justified; he that was in the state of hatred, is hereby in a state of love and friendship, he hath peace with God now, that once was at variance with him. Now when we say, There is a change made in a man by Justification, it is not meant of an inward, absolute and physical one, such as is in Sanctification, when of unholy we are made holy, but moral and relative; as when one is made a Magistrate, or husband and wife: partly, because this is done to us in time, whereas immanent actions were from all eternity, and therefore it would be absurd to pray for them, as it is ridiculous for a man to pray he may be predestinated or elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 164-65, 166-67.</span></figcaption>

A+for+Predestination+though+it+be+an+act+of+God+choosing+such+an+one+to+happiness%2C+yet+it+doth+not+work+any+real+change+or+positive+effect+in+a+man%2C+unless+we+understand+it+virtually%2C+for+it+is+the+cause+of+all+those+transient+actions+that+are+wrought+in+time.+Howsoever+therefore+Justification+be+called+by+some+an+immanent+action%2C+and+so+made+to+go+before+Faith+and+Repentance+as+if+Faith+were+only+a+declaration+and+sign+of+pardon+of+sin+from+all+eternity%2C+yet+that+cannot+be+made+good%2C+as+is+to+be+shewed.%0A%0AA+second+difference+floweth+from+the+other%2C+An+immanent+action+is+from+eternity%2C+and+the+same+with+God%E2%80%99s+essence%2C+but+a+transient+action+is+the+same+with+the+effect+produced.+Hence+the+Orthodox+maintain%2C+That+God%E2%80%99s+decrees+are+the+same+with+his+nature.+Hence+when+we+speak+of+God%E2%80%99s+willing+such+a+thing%2C+it+is+no+more+then+his+divine+Essence%2C+with+an+habitude+and+respect+to+such+objects%3B+God%E2%80%99s+Decrees+are+no+more+then+God+decreeing%2C+God%E2%80%99s+will+no+more+then+God+willing%3A+otherwise+the+simplicity+of+God%E2%80%99s+nature+will+be+overthrown%2C+and+those+volitions+of+God+will+be+created+entities%2C+and+so+must+be+created+by+other+new+volitions%2C+and+so+in+infinitum%2C+as+Spanheimius+well+argueth%2C+only+the+later+part+seemeth+not+to+be+strong+or+sufficient%2C+because+when+man+willeth%2C+he+doth+not+will+that+by+a+new+volition%2C+and+so+in+infinitum%2C+and+why+then+would+such+a+thing+follow+in+God%3F%0A%0ABesides+it%E2%80%99s+no+such+absurdity+in+the+actings+of+the+soul%2C+to+hold+a+progress+in+infinitum%2C+thus+far%2C+that+it+doth+not+determinately+pitch+or+end+at+such+an+act.+It+is+one+thing+to+have+things+distinguished+in+God%2C+and+another+thing+for+us+to+conceive+distinctly+of+them.+The+former+is+false%3A+The+latter+is+true+and+necessary.+But+with+transient+actions+it+is+otherwise%2C+they+being+the+same+with+the+effects+produced%2C+are+in+time%3B+And+this+is+a+perpetual+mistake+in+the+Antinomian%2C+to+confound+Gods+Decree+and+Purpose+to+justify%2C+with+Justification%2C+God%E2%80%99s+immanent+action+from+all+eternity%2C+with+that+transient%2C+which+is+done+in+time.+Whereas+if+they+should+do+thus+in+matters+of+Sanctification+and+Glorification%2C+it+would+be+absurd+to+every+man%E2%80%99s+experience%2C+whereas+indeed+a+man+may+as+truly+say%2C+That+his+body+is+glorified+from+all+eternity%2C+as+that+his+sins+are+forgiven+from+all+eternity.+And+certainly+Scripture+speaks+for+one+as+well+as+the+other%2C+when+it+saith%2C+Whom+he+hath+justified%2C+them+he+hath+glorified.%0A%0ABy+these+two+differences%2C+you+may+see%2C+That+pardon+of+sin+is+a+transient+action%2C+and+so+Justification+also%2C+partly%2C+because+it+leaveth+a+positive%2C+real+effect+upon+a+man+justified%3B+he+that+was+in+the+state+of+hatred%2C+is+hereby+in+a+state+of+love+and+friendship%2C+he+hath+peace+with+God+now%2C+that+once+was+at+variance+with+him.+Now+when+we+say%2C+There+is+a+change+made+in+a+man+by+Justification%2C+it+is+not+meant+of+an+inward%2C+absolute+and+physical+one%2C+such+as+is+in+Sanctification%2C+when+of+unholy+we+are+made+holy%2C+but+moral+and+relative%3B+as+when+one+is+made+a+Magistrate%2C+or+husband+and+wife%3A+partly%2C+because+this+is+done+to+us+in+time%2C+whereas+immanent+actions+were+from+all+eternity%2C+and+therefore+it+would+be+absurd+to+pray+for+them%2C+as+it+is+ridiculous+for+a+man+to+pray+he+may+be+predestinated+or+elected.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+true+doctrine+of+justification+asserted+and+vindicated%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially+Antinomians+in+XXX+lectures+preached+at+Lawrence-Jury%2C+London%2C+%282nd+edn%2C+London%3A+Tho.+Underhill%2C+1651%29%2C+pp+164-65%2C+166-67.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7540edc2ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7540edc2ed.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/30/anthony-burgess-on-the-distinction-between-immanent-and-transient-actions/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7d0ed34133" data-kw="">
<blockquote><p>They accuse us of profanity for entertaining lofty conceptions about the Holy Spirit. All that we, in following the teachings of the Fathers, confess as to the Spirit, they take in a sense of their own, and make it a handle against us, to denounce us for profanity. We, for instance, confess that the Holy Spirit is of the same rank as the Father and the Son, so that there is no difference between them in anything, to be thought or named, that devotion can ascribe to a Divine nature.

We confess that, save His being contemplated as with peculiar attributes in regard of Person, the Holy Spirit is indeed from God, and of the Christ, according to Scripture, but that, while not to be confounded with the Father in being never originated, nor with the Son in being the Only-begotten, and while to be regarded separately in certain distinctive properties, He has in all else, as I have just said, an exact identity with them.</p></blockquote>

<blockquote><p>For, from everlasting, nothing was extant to cause them of things possible to become future, but God himself: and in God himself, nothing can be imagined to be the cause hereof, but the will of God. This is the insoluble demonstration that cuts the throat of Scientia media, whereupon the Jesuits and Arminians, and all that oppose the absoluteness of God’s proceedings, do, and must rely; either wittingly or unwittingly, and whether they will or no; unless they will directly turn Atheists, and with Cicero deny that God fore-knows things that are to come.</p></blockquote>

</figure><figure class="quote" id="q-05a9db4dae" data-kw="">
<blockquote><p>A threefold love of God is commonly held; or rather there are three degrees of one and the same love. First, there is the love of benevolence by which God willed good to the creature from eternity; second, the love of beneficence by which he does good to the creature in time according to his good will; third, the love of complacency by which he delights himself in the creature on account of the rays of his image seen in them. The two former precede every act of the creature; the latter follows (not as an effect its cause, but as a consequent its antecedent).

By the love of benevolence, he loved us before we were; by the love of beneficence, he loves us as we are; and by the love of complacency, he loves us when we are (viz., renewed after his image). By the first he elects us; by the second, he redeems and sanctifies us; but by the third he gratuitously rewards us as holy and just. John 3:16 refers to the first; Ephesians 5:25 and Revelation 1:5 to the second; Isaiah 62:3 and Hebrews 11:6 to the third.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.20.5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-78a36d89b8" data-kw="">
<blockquote><p>You cannot therefore attribute to God the cause of any human fault. For of all human offences, the cause is pride. For the conviction and removal of this a great remedy comes from heaven. God in mercy humbles Himself, descends from above, and displays to man, lifted up by pride, pure and manifest grace in very manhood, which He took upon Himself out of vast love for those who partake of it.

For, not even did even this One, so conjoined to the Word of God that by that conjunction he became at once the one Son of God and the same One the one Son of man, act by the antecedent merits of His own will. It behoved Him, without doubt, to be one; had there been two, or three, or more, if this could have been done, it would not have come from the pure and simple gift of God, but from man’s free will and choice.</p></blockquote>

</figure><figure class="quote" id="q-33ba5f5288" data-kw="">
<blockquote><p>It is well cleared by the Schoolmen, That those relations which are attributed to God in time, as a Creator, Father, or Lord, are not because of any new thing in God, but in respect of the creatures; so that when the world is created, when a man is justified, we say, God who was not a Creator before, is a Creator, who was not a Father by grace, is now by grace; not because any new accident is in him, but because there is a new effect in the creatures. Thus, if a man once the child of wrath, be now a son of God’s love, the change is not in God, but in the creature.

For the better clearing of this, we are to take notice in the fourth place, That it is one thing, as Aquinas observeth, Mutare voluntatem, to change the Will; and another thing, Velle mutationem, to Will a change. By the same unchangeable Will, we may Will several changes in an Object. As the Physician without any change of his Will, may will his Patient to take one kind of Physick one day, and another the third: here he wills a change, but doth not change his Will. Thus God with the same Will, decreed to permit in time such an elect man to be in a state of sin, under the power of Satan, and afterwards to call him out of this condition, to justify his person; here indeed is a great change made in the man, but none at all in God.

There is no new act in God, which was not from all Eternity, though every effect of this love of God was not from Eternity, but in time. Hence when our Divines argue against Arminians, That if the Saints should apostatize, God’s love would be changeable, it is meant of God’s love of Election, which is an absolute purpose and efficacious will to bring such a man to glory: now although such a decree was free, and so might not have been; yet ex hypothesi, supposing God hath made this decree, it doth very truly follow, That if that Saint should not be brought to glory, God would be changeable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 192.</span></figcaption>

</figure><figure class="quote" id="q-6d5d649a64" data-kw="">
<blockquote><p>When God is said to desire something which does not occur, such as when He states, “O that there were such a heart in them, that they would fear Me, … that it might be well with them, and with their children for ever!” (Deuteronomy 5:29), or, “O that thou hadst hearkened to My commandments! then had thy peace been as a river” (Isaiah 48:18), He is speaking in the manner of men. Strictly speaking, such can never be said concerning the omniscient, omnipotent, immutable, and most perfect God. Rather, it indicates God‟s displeasure toward sin and how He delights in holiness. It indicates that sin is the reason why those blessings are withheld from them — blessings which they, according to His promise, would have received as a reward upon godliness.

The promises are made upon condition of obedience which is granted to the elect according to God‟s immutable purpose. When God says, “Have I any pleasure at all that the wicked should die? saith the Lord God: and not that He should return from His ways, and live?” (Ezekiel 18:23), this does not suggest that God‟s will is impotent. Rather, it indicates that God has no pleasure in the destruction of men, inasmuch as they are His creatures. He has pleasure in the exercise of righteousness and godliness, and in blessing the godly.</p></blockquote>

</figure><figure class="quote" id="q-79dba9fe2b" data-kw="">
<blockquote><p>There are three kinds of this love usually ascribed to God. The love of benevolence is that by which God is moved to will some good to his creature as a creature, without any regard to the excellence which may be in it. This kind of love is the same as his goodness, and by it God, from eternity, will good to the creature, even though unworthy, and deserving of hatred.

The love of beneficence is that by which God does good in time; this expression in time must be noted, so that this love may be distinguished from the love of benevolence, which is from eternity. The love of complacency is that by which God is inclined towards the creature that is just and holy. By the first kind of love, God elects us; by the second, he redeems and sanctifies us; by the third, he rewards us being holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 2.5, p. 85.</span></figcaption>

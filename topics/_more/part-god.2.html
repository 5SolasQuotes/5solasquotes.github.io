<blockquote><p>Grace and Peace, two words, which comprehend all good: Grace, is the fountain of Gods free love; and Peace, the effect of that free love: which being here put together, is love, vented in its precious effects. The Persons from whom, are Three, or, the Three Persons of the Trinity, 1. From the Father, which is, which was, and which is to come, that is, from God the Father, described from His eternal being, without all beginning or ending.

And this description of the Father, relates to that of Exod. 3.14. I AM THAT I AM, hath sent me unto you: and it is a name that God often taketh to Himself, The first and the last, the beginning and the ending: and the Title JEHOVAH taketh up these three; JE, the future time; HO, the time present; VAH, the time past. In a word, it’s the paraphrase of the word JEHOVAH: and this title is attributed to the Father, not secluding the Son and Holy Ghost; but the Father, being the fountain of the Godhead, when He is joined with the Son and Spirit, those things that are essential to God, are ordinarily attributed to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), p. 4.</span></figcaption>

<blockquote><p>What do you call Persons in the Godhead?

Ans. Such as having one Essence or being equally common, are distinguished (not divided) one from another by some incommunicable property.

How cometh it to pass that there should be this diversity of Persons in the Godhead?

Ans. Though the Essence or being of the Godhead be the same, and most simply as hath been declared; yet the manner of this being is not the same, and hence ariseth the distinction of persons, in that beside the being which is common to all, and the self-same in all, they have every one some especial property which cannot be common to the rest.

Which are these persons, and what are these personal Properties?

Ans. The first Person in order is the Father, who begetteth the Son. The second is, the Son begotten of the Father. The third is, the Holy-Ghost, proceeding from the Father and the Son.

Doth the Godhead of the Father beget the God-head of the Son?

Ans. No, but the Person of the Father begetteth the Person of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity</cite>, (London: Geo. Badger, 1645), pp 55-57.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-785861c5de" data-kw="">
<blockquote><p>Again they who labour under the frenzy of Sabellius and the craze of Arius, have both fallen from a sound faith for want of observing a middle course. The name of Christian is applied to both these heretics; but if any one examines their doctrines, he will find the one sect not much better than the Jews, and differing from them only in name, and the other very nearly holding the heresy of Paul of Samosata, and that both are very wide of the truth. Great, therefore, is the danger in such cases, and the way of orthodoxy is narrow and hemmed in by threatening crags on either side, and there is no little fear lest when intending to strike at one enemy we should be wounded by the other.

For if any one assert the unity of the Godhead, Sabellius straightway turns that expression to the advantage of his own mental vagary, and if he distinguish the Persons, and say that the Father is one, and the Son another, and the Holy Spirit a third, up gets Arius, ready to wrest that distinction of Persons into a difference of substance; so we must turn and flee both from the impious confounding of the Persons by the one, and the senseless division of the substance by the other, confessing, indeed, that the Godhead of the Father and of the Son and of the Holy Ghost, is all one, while we add thereunto a Trinity of Persons. For then we shall be able to fortify ourselves against the attacks of both heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Priesthood</cite>, (c. 381-85), 4.4 in Nicene and Post Nicene Fathers 1, 9: 66.</span></figcaption>

<blockquote><p>It is a work above the reach of men or angels to persuade a soul to come to Christ. There is nothing so difficult or perplexing to flesh and blood as to close with Christ. There is nothing that corrupt nature has such a reluctancy to and prejudice against as this. It requires the mighty power of God to bring folk to subjection to Him, and to bring down the strongholds of sin within them and every vain thought.</p></blockquote>

<blockquote><p>Worldly masters will not cast a way their faithful servants, but maintain them as they may, and thinkest thou that God will forsake his servants? Thinkest thou a mortal wretched man to be more loving to thee then the eternal God and merciful father that made thee, feedeth thee, and defendeth thee, when man cannot help thee? yea loveth the better then thou lovest thy self, and stayeth thee from running from him, when thou wouldest willingly seek thine own destruction wilfully.

Stand to him boldly, forsake him not cowardly. Polycarpus, an old man, when he should suffer martyrdom, was advised by some to have pity on his old age, and not so stiffly to stand out. Nay, saith he, I have served my Master Christ these 86. years, and he did me never harm, I will not forsake him now in my last days. Thus Nehemiah stoutly answering them, and boldly encouraging his fellows, goeth forward with the work, contemneth their mocking and false accusations, and falleth to his building again; so must all good builders of God’s house neither be afraid nor weary of scornful mockers, threatenings, accusations or violence, but manfully go forwards to the end, knowing that their God is stronger, wiser, and more willing to defend his people, then his enemies shall be to hurt them.</p></blockquote>

<blockquote><p>Some people take shelter in a notion of universal love. They say, ‘God loves everyone, and therefore everything will turn out all right in the end for me.’ But there’s a very solemn verse in the Bible, ‘Jacob have I loved, but Esau have I hated’ (Romans 9:13). I’m not saying that there’s anyone in the room of mercy who should come to the conclusion that God has hated them. Satan may be saying to some anxious soul, ‘There’s no hope for you because God has hated you.’ No one in the room of mercy, no one under the sound of the gospel, no one anxious about their soul, has any reason to come to that conclusion. And may God give grace to resist coming to that conclusion in a way that would prevent a person from seeking the Lord and seeking his mercy.

But what we can say is that you have no reason to believe the Lord has loved you until you’re found embraced in that love in the person of Christ. We cannot take it for granted. We cannot say God loves everyone. ‘I have loved thee’ is something very particular, something very personal, and we cannot rest until it becomes particular and personal to ourselves. The love of God is a very particular, distinguishing, personal thing toward a sinner, so that a person has to make sure they have a reason for believing it with regard to themselves.

And one other thing about this love of God toward the sinner — he says it’s everlasting. It had no beginning. With God, everlasting things have no beginning. God is the everlasting God. ‘From everlasting to everlasting, thou art God’ (Psalm 90: 2). There was no beginning to God. We can’t really grasp that. That’s something beyond our understanding— someone who has no beginning. We can understand in a measure something having no end — we know that that’s true of us. People try to blot out the idea of eternity, the idea of living beyond this world. But anyone who’s heard the gospel — and even anyone who hasn’t — when they listen to the underground noises in their own consciences and souls, they have this feeling — this fear, perhaps, this anxiety — that there’s no end. Yes, there was a beginning, but there’s no end. We can grasp that. But we can’t grasp the concept of ‘no beginning’.

And yet, God had no beginning. And God’s love ‘for thee’ — for the child of God, for the sinner saved by grace — had no beginning either. It wasn’t that there came a time in the experience of God when he began to love — no, God has loved eternally. Everlasting love. And that love is never withdrawn. It has never been removed from its objects. Even when he chastens them, even when he hides himself from them, even when they fear that the Lord has forgotten to be gracious and that he has shut up his tender mercies in his wrath — even then, this love is everlasting, it doesn’t change. It’s never withdrawn from its objects. And it has no end. It’ll never come to an end. Its consequences, its effects, will never come to an end. ‘I have loved thee with an everlasting love.’</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Some people take shelter in a notion of universal love. They say, ‘God loves everyone, and therefore everything will turn out all right in the end for me.’ But there’s a very solemn verse in the Bible, ‘Jacob have I loved, but Esau have I hated’ (Romans 9:13). I’m not saying that there’s anyone in the room of mercy who should come to the conclusion that God has hated them. Satan may be saying to some anxious soul, ‘There’s no hope for you because God has hated you.’ No one in the room of mercy, no one under the sound of the gospel, no one anxious about their soul, has any reason to come to that conclusion. And may God give grace to resist coming to that conclusion in a way that would prevent a person from seeking the Lord and seeking his mercy.

But what we can say is that you have no reason to believe the Lord has loved you until you’re found embraced in that love in the person of Christ. We cannot take it for granted. We cannot say God loves everyone. ‘I have loved thee’ is something very particular, something very personal, and we cannot rest until it becomes particular and personal to ourselves. The love of God is a very particular, distinguishing, personal thing toward a sinner, so that a person has to make sure they have a reason for believing it with regard to themselves.

<blockquote><p>I. The question whereby it is demanded whether God doth equally love all men, and so desire their Salvation, is an addition to the former question, and doth depend on it: For if remission of sins and Salvation are not purchased for all men by the death of Christ, it is plain that all men are not equally loved by God: wherefore these innovators do defend themselves in either question, by the same places of Scripture. …

II. Which before we demonstrate, the reader is to be admonished, that love in God is not an affection, nor passion, nor inclination of the mind, nor any desire; for God is not touched by these passions, as being impassible, and not subject to affections: But as God is said then to be angry or to hate, when he will punish or destroy; so love in God is a certain and sure will of doing good to the creature. Whence it cometh to pass, that he may rightly be said to be loved by God, to whom he hath given or hath decreed to give more and better good things.</p></blockquote>

<blockquote><p>Q. What ought you to believe concerning God, the chief object of divine knowledge?

A. That there is but one God. …

Q. What else do ye believe of God?

Q. What else doe ye believe of God?

A. That the God-head is distinguished into three persons; the Father, Son, and holy Ghost.</p></blockquote>

<blockquote><p>Whereas the will of God is most simple; therefore, 1. In him there are not either two, or more, or contrary Wills. There are in deed divers distinctions of his Will, as shall be seen in the Doctrine of God’s Decrees: but these distinctions are nominal, rather than real.

2. The primary object of God’s will, is God himself.

3. The will of God is most free.

4. Nothing is done against the Will of God.

5. The Will of God, according to its divers objects hath divers names, to wit, of holiness, goodness, love, grace, mercy, wrath, justice, and such like.</p></blockquote>

<blockquote><p>Everything passes from the condition of what has been towards the condition of becoming, only through the point of being. It is this being that has potentiality. But God has not “been” (in this creaturely sense); therefore He Is from all eternity, and because He will not “become”, He Is to all eternity (Exodus 3:14). Because of this reality, God is the Existence that is uncreated, unlimited, and unchangeable.</p></blockquote>

<blockquote><p>All that Christ does in this great affair as mediator, in any of his offices, either of prophet, priest, or king; either when he was in this world, in his human nature, or before or since; and not only what Christ the mediator has done, but also what the Father and the Holy Ghost, have done, as united or confederated in this design of redeeming sinful men; or, in one word, all that is wrought in execution of the eternal covenant of redemption; this is what I call the work of redemption in the doctrine; for it is all but one work, one design.

The various dispensations or works that belong to it, are but the several parts of one scheme. It is but one design that is formed to which all the offices of Christ do directly tend, and in which all the persons of the Trinity do conspire, and all the various dispensations that belong to it are united; and the several wheels are one machine, to answer one end, and produce one effect. …

Some things were done before the world was created, yea from all eternity. The persons of the Trinity were as it were confederated in a design and covenant of redemption; in which covenant the Father had appointed the Son, and the Son had undertaken the work; and all things to be accomplished in the work were stipulated and agreed. … God’s electing love, and the covenant of redemption, never had a beginning; so the fruits of this work, that shall be after the end of the world, never will have an end.</p></blockquote>

<blockquote><p>III. For the will of God is two fold, the one is his decree, the other is his commandment. The decree of God, belongeth to the providence of God, and the commandment of God, belongeth to his justice; By his decree, he doth appoint and dispose the events of things; by his commandment he doth govern our actions. By the former will, God doth appoint what he will have done; by the latter, what he would have us do. To the former all creatures obey, even the Devils themselves; to the latter only the faithful, and yet not that perfectly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 4.3, p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-43b8e22d5f" data-kw="">
<blockquote><p>These [Christians] I call by name (for they are not nameless like the stars which are numbered and have names), and they follow me, for I rear them up beside the waters of rest; and they follow every such shepherd, whose voice they love to hear, as you see; but a stranger they will not follow, but will flee from him, because they have a habit of distinguishing the voice of their own from that of strangers. They will flee from Valentinus with his division of one into two, refusing to believe that the Creator is other than the Good. They will flee from Depth and Silence, and the mythical Æons, that are verily worthy of Depth and Silence.

They will flee from Marcion’s god; compounded of elements and numbers; from Montanus’ evil and feminine spirit; from the matter and darkness of Manes; from Novatus’ boasting and wordy assumption of purity; from the analysis and confusion of Sabellius, and if I may use the expression, his absorption, contracting the Three into One, instead of defining the One in Three Personalities; from the difference of natures taught by Arius and his followers, and their new Judaism, confining the Godhead to the Unbegotten; from Photinus earthly Christ, who took his beginning from Mary.

But they worship the Father and the Son and the Holy Ghost, One Godhead; God the Father, God the Son and (do not be angry) God the Holy Ghost. One Nature in Three Personalities, intellectual, perfect, Self-existent, numerically separate, but not separate in Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Arians</cite>, (380), XVI in Nicene and Post-Nicene Fathers 2, 7: 333-34.</span></figcaption>

<blockquote><p>For in proportion as God is harder to trace out than man, so is the heavenly Generation harder to comprehend than your own. But if you assert that because you cannot comprehend it, therefore He cannot have been begotten, it will be time for you to strike out many existing things which you cannot comprehend; and first of all God Himself. … The Begetting of God must be honoured by silence. It is a great thing for you to learn that He was begotten. But the manner of His generation we will not admit that even Angels can conceive, much less you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Theological Orations</cite>, (379), 3.8 in Nicene and Post-Nicene Fathers 2, 7: 303.</span></figcaption>

<blockquote><p>This care over all things we call Providence, concerning which we must first inquire, whether it really exist, i.e. whether there is a Providence. Now this is proved by many arguments. The first is derived from the nature of God, as an all-perfect Being; for who would call that Being perfect, who should sit inactive at the helm of the universe, and give up every thing to the direction of the creatures? At least, who would not conceive of something more perfect than such a Being as this?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 3.8, pp 157-58.</span></figcaption>

</figure><figure class="quote" id="q-2eab557a18" data-kw="">
<blockquote><p>For if the wrath of God were a passion, one might well despair as being unable to quench the flame which he had kindled by so many evil doings; but since the Divine nature is passionless, even if He punishes, even if He takes vengeance, he does this not with wrath, but with tender care, and much loving-kindness; wherefore it behoves us to be of much good courage, and to trust in the power of repentance.

For even those who have sinned against Him He is not wont to visit with punishment for His own sake; for no harm can traverse that divine nature; but He acts with a view to our advantage, and to prevent our perverseness becoming worse by our making a practice of despising and neglecting Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exhortation to Theodore after his fall</cite>, (c. 400), 1.4 in Nicene and Post-Nicene Fathers 1, 9: 93.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“For if the wrath of God were a passion, one might well despair as being unable to quench the flame which he had kindled by so many evil doings; but since the Divine nature is passionless, even if He punishes, even if He takes vengeance, he does this not with wrath, but with tender care, and much loving-kindness; wherefore it behoves us to be of much good courage, and to trust in the power of repentance.

For even those who have sinned against Him He is not wont to visit with punishment for His own sake; for no harm can traverse that divine nature; but He acts with a view to our advantage, and to prevent our perverseness becoming worse by our making a practice of despising and neglecting Him.”

<blockquote><p>Quest. 4 WHAT is God?

A. God is a Spirit, infinite, eternal, and unchangeable in his being, wisdom, power, holiness, justice, goodness, and truth.

Q.1. Can the nature of God be defined, so as men may express properly and strictly what God is?

A. No; Job xi. 7. Canst thou by searching find out God? canst thou find out the Almighty unto perfection.

We do then conceive most rightly of God, when we acknowledge him to be inconceivable; and therefore, one being asked the question, what God is? answered rightly; If I fully knew that, I should be a God myself; for God only knows his own essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Assembly’s Catechism. With Practical Inferences from Each Question: As it was carried on in the Lord’s Days Exercises in</cite>, Dartmouth, in the first year of liberty, 1688 (1692) in The works of John Flavel (6 vols, London, 1820), 6: 145.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-de1035d158" data-kw="">
<blockquote><p>True it is that if we respect him in his human nature, his Father is greater than he; and he is his Father’s servant: yet in that he said, and most truly said, that God was his Father, the Jews did rightly infer from thence, that he thereby made himself equal with God; and the Lord of hosts himself hath proclaimed him to be the man that is his fellow. Being such a man therefore, and so highly borne; by the privilege of his birth-right, he might have claimed an exemption from the ordinary service whereunto all other men are tied: and by being the King’s Son, have freed himself from the payment of that tribute which was to be exacted at the hands of Strangers.

When the Father brought this his first-begotten into the world, he said; Let all the Angels of God worship him: and at the very instant wherein the Son advanced our nature into the highest pitch of dignity, by admitting it into the unity of his sacred person, that nature so assumed was worthy to be crowned with all glory and honour: and he in that nature might then have set himself down at the right hand of the throne of God; tied to no other subjection than now he is, or hereafter shall be, when after the end of this world he shall have delivered up the kingdom to God the Father. For then also, in regard of his assumed nature, he shall be subject unto him that put all other things under him.

Thus the Son of God, if he had minded only his own things, might at the very first have attained unto the joy that was set before him: but looking on the things of others, he chose rather to come by a tedious way, and wearisome journey unto it; not challenging the privilege of a Son, but taking upon him the form of a mean servant.

Whereupon in the days of his flesh, he did not serve as an honourable Commander in the Lords host, but as an ordinary soldier: he made himself of no reputation, for the time as it were emptying himself of his high state and dignity; he humbled himself, and became obedient until his death being content all his life long to be made under the Law: yea so far, that as he was sent in the likeness of sinful flesh, so he disdained not to subject himself unto that Law, which properly did concern sinful flesh.

And therefore howsoever Circumcision was by right applicable only unto such as were dead in their sins, and the uncircumcision of their flesh; yet he, in whom there was no body of the sins of the flesh to be put off, submitted himself notwithstanding thereunto: not only to testify his communion with the Fathers of the old Testament; but also by this means to tender unto his Father a bond, signed with his own blood, whereby he made himself in our behalf a debtor unto the whole Law. For I testify (saith the Apostle) to every man that is circumcised, that he is a debtor to the whole Law.

In like manner Baptism appertained properly unto such as were defiled, and had need to have their sins washed away: and therefore when all the land of Judea, and they of Jerusalem went out unto John, they were all baptized of him in the river Jordan, confessing their sins. Among the rest came our Saviour also: but the Baptist considering that he had need to be baptized by Christ, and Christ no need at all to be baptized by him, refused to give way unto that action; as altogether unbefitting the state of that immaculate Lamb of God, who was to take away the sin of the World. Yet did our Mediator submit himself to that ordinance of God also: not only to testify his communion with the Christians of the new Testament; but especially (which is the reason yielded by himself) because it became him thus to fulfil all righteousness.

And so having fulfilled all righteousness, whereunto the meanest man was tied, in the days of his pilgrimage (which was more than he needed to have undergone, if he had respected only himself:) the works which he performed were truly works of supererogation, which might be put upon the account of them whose debt he undertook to discharge; and being performed by the person of the Son of God, must in that respect not only be equivalent, but infinitely overvalue the obedience of Adam and all his posterity, although they had remained in their integrity, &amp; continued until this hour instantly serving God day &amp; night. And thus for our main and principal debt of Obedience, hath our Mediator given satisfaction unto the Justice of his Father; with good measure, pressed down, shaken together, &amp; running over.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immanuel, or, The Mystery of the Incarnation of the Son of God Unfolded</cite>, (Oxford: Leonard Lichfield, 1643), pp 26-30.</span></figcaption>

</figure><figure class="quote" id="q-c4af89eb80" data-kw="">
<blockquote><p>The Father’s appointing him to be a sacrifice, doth not impair his own willingness in undertaking. The Father is said to send him and deliver him, John iii. 84, Rom. viii. 32; not that the Son was over-persuaded, or came only out of obedience, without any inclination of his own. The Father being the root and fountain of the deity, all actions are originally ascribed to him, though common to all; so he is first in order of being, as he is first in order of working.

The Father is said to deliver him, because the first motion of redemption is supposed to arise from the will and motion of the Father; yet the love of Christ was the spring of all mediatory actions, and his taking our nature on him; and therefore he is no less said to give himself, than the Father is said to give him to us and for us. God is said to set him forth, Rom. iii. 25; yet he is said to come, Mat. xx. 28, not thrust out or forced to come. God lays our sins upon him, yet Christ is said to bear them.

His engagement was an act of choice, liberty, and affection. He could not be constrained by his Father to undertake it; his will was as free in consenting, as his Father was in proposing. The Spirit is said to be sent by the Father and the Son, to take of Christ’s and show it to us, to fit those for heaven that are given to Christ; yet his distributions are according to his own will: 1 Cor. xii. 11, ‘Dividing to every man according as he will.’

If you consider Christ as one God with the Father, there is but one and the same will in both. Will belongs to essence or nature; the essence of God being one, there are not in God divers wills, though the Godhead be in divers persons, because the power of willing is the nature, not a personal propriety.

The decree of redemption was joint in Father and Son. What Christ decreed as God, he executed as man; and what he willed from eternity, he began in time to will as man, Christ, as God, gave himself to death with the same will and’ by the same action as the Father gave him; but as man he gave himself by a will inspired by the Father.

Yet for our conception’s sake the Scripture represents things so as if they were distinct wills, which yet we must not imagine, any more than because the Scripture, in condescension to our weakness, represents God with eyes, and ears, and hands, we must conceive God to have a fleshly body like ours.</p></blockquote>

Yet for our conception’s sake the Scripture represents things so as if they were distinct wills, which yet we must not imagine, any more than because the Scripture, in condescension to our weakness, represents God with eyes, and ears, and hands, we must conceive God to have a fleshly body like ours.”

<blockquote><p>It’s a dream, that God loveth sinners with the same love every way, wherewith he loveth his own Son Christ. And why? Because God loveth us only for his own Son, and for nothing in us Ergo, Far more it must follow, it’s a far other, an higher, fountain love, wherewith the Father loveth his own eternal and consubstantial Son, the Mediator between God and man; and that derived love wherewith he loveth us sinners.

As the one is 1. Natural; the latter, free. 2. The love of the Father to the Son, as his consubstantial Son, and so far as it’s essentially included in his love to Jesus Christ Mediator, is not a love founded on grace and free-mercy, which might never have been in God; because essentially, the Father must love his Son Christ, as his Son; and being Mediator, he cannot for that renounce his natural love to him, which is the fundamental cause, why he loveth us for Christ his Son, as Mediator; but the love wherewith the Father loveth us for his Son Christ, is founded on free Grace and mercy; and might possibly never have been in God.

For, 1. as he could not but beget his Son, he could not but love him; nature, not election can have place in either: but it was his Free will to create a man, or not create him. 2. He cannot but love his Son Christ, but God might either have loved neither man nor Angel, so as to chuse them to Salvation, and he might have chosen other Men and Angels, then these whom he hath chosen; God hath no such freedom in loving his own Consubstantial Son.

2. It’s an untruth, that God loveth his chosen ones, as he doth love his Son; that is, with the same degree of love, wherewith he loves his Son; I think that not far from either gross ignorance, or blasphemy. It possibly may be the same love by proportion, with which the Father tendereth the Mediator, or Redeemer, and all his saved and ransomed ones; but in regard of willing good to the creature loved, he neither loveth his redeemed with the same love, wherewith he loveth his Son; except blasphemously we say, God hath as highly exalted all the redeemed, and given to them a name above every name, as he hath done to his own Son; nor doth he so love all his chosen ones, as he conferreth equal grace and glory upon all alike; as if one starre differed not from another star in glory, in the highest heavens.

Our own good works cannot make our Lord love us less or more, with the love of eternal election; but they may make God love us more with the love of complacency, and a sweeter manifestation of God in the fruits and gracious effects of his love. According to that, John 14.23. Jesus said, if a man love me, he will keep my words, and my Father will love him, and we will come unto him, and make our abode with him.</p></blockquote>

<blockquote><p>In the Divine Essence we are to consider two things: First, The diverse manner of being therein; secondly, The attributes thereof.

The diverse manner of being therein, are called Persons (Heb. i. 3.)

A person is a distinct subsistence of the whole Godhead (John i. 1; v. 31, 37; xiv. 16; Col. ii. 9; John xiv. 9.)

There are Three Divine Persons, the Father, the Son, and the Holy Ghost (Gen. i. 26; iii. 22; xi. 7; Exod. xx. 2; Hos. i. 4, 7; Isa. lxiii. 9, 10; Zech. iii. 2; Hag. ii. 5, 6; 1 John v. 7; Matt. iii. 16, 17; xxviii. 19; John xiv. 26; 2 Cor. xiii. 13.) These three persons are not three several substances, but three distinct subsistences; or three diverse manner of beings, of one and the same substance and divine essence. So that a person in the Godhead is an individual Understanding and incommunicable subsistence, living of itself, and not sustained by another.

In the unity of the Godhead there is a plurality which is not accidental (Gen. i. 26; iii. 22; xi. 7; Isa. vi. 8), for God is a most pure act, and admits no accidents; nor essential, for God is one essence only—but personal.

The persons in this one essence are but three. In this mystery there is alius et alius, another and another; but not aliud et aliud, another thing and another thing. The Divine Essence in itself is neither divided nor distinguished, but the three Persons in the Divine Essence are distinguished amongst themselves three manner of ways: 1. By their Names. 2. By their Order. 3. By their Actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 3-4.</span></figcaption>

<blockquote><p>The catholic church sees nothing clearer in the divine books than that God, just as surely as he is the one and only God, is also three in number, and that the Father, Son and Holy Spirit are not only one essence, but are one God, and one only, and that man, having become an enemy of God, and hated on account of his sins, could not return to his holy and worthy communion with God, except through the bloody death of the Son, and that this death can save no one who is not gifted and filled with the breath of the Holy Spirit. But this goddess Reason is in no way willing or able to swallow and stomach. The mystery of the Father, the Son, and the Holy Spirit, and the mystery that rests on it, that of redemption, of Christ, she mocks as stupidity – to her it is a perpetual stumbling-block.</p></blockquote>

<blockquote><p>I. That there is one only God, distinct in three persons.

As we are taught therefore by the holy scriptures, which are his own word, we believe that there is only one God, that is, one simple, indivisible, eternal, living and most perfect essence in three existences, or (as the church useth to speak) persons, namely subsisting of the eternal Father, the eternal Son, and the eternal Holy spirit, truly distinct among themselves, yet without all division; being both beginning and cause of all things.

II. That so every person by it self is true God, that yet there be not three Gods.

For so we do believe and have learned out of the holy scriptures that the Father by himself is true and perfect God, the Son by himself is God and the Holie spirit by himself is God. And yet that they are not many, but one only God almighty, of whom all things, by whom all things, and for whom all things are.

III. One person to be distinct from another in personal proprieties, but in essential they differ from every creature.

And because the holy scriptures do so speak of God, that they attribute unto him many proprieties, both essential and personal, and they teach that in the essential he differeth from all things created, but in the personal one person to be distinguished from another, we therefore doe so believe, that as to beget the Son is such a propriety of the Father as can agree neither with the Son nor the Holy spirit, and again to be begotten can agree to none but the Son, and so of the rest; so likewise to be most pure, eternal, immeasurable, present every where, simply knowing all things, simply almighty, simply good and such like are in such sort the very proprieties of God, that they can by no means be communicated to any creature, so as it should be good (for example sake) in that immeasurable goodness or omnipotent in the same omnipotency, that God is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.I-III, 1: 129, 131.</span></figcaption>

<blockquote><p>For it is not sufficient for us to know God as we can conceive of him in our own imagination: but we must know him as he hath revealed himself in his word. And it is not sufficient to salvation to believe in God confusedly, but we must believe in one God distinct into three persons, the Father, the Son, the Holy Ghost: yea and more then this, we must hold and believe that God the Father is our father, the Son our redeemer, the Holy Ghost our sanctifier and comforter.</p></blockquote>

<blockquote><p>Arminians may talk of the power of their own will, as they have a mind, to convert themselves; the Scriptures of truth inform us, that the power of a whole Trinity is employed in the work of a sinner’s conversion. The power of the Father is put forth in it, as Christ declares, John vi. 44, “No man can come to me, except the Father which hath sent me draw him.” The power of the eternal Son is exerted, John xii. 32, “And I, if I be lifted up from the earth, will draw all men unto me.”

The power of the Father and the Son is exerted by the Holy Ghost, the third Person of the Trinity. Hence, Tit. iii. 5, we are said to be “saved by the washing of regeneration, and the renewing of the Holy Ghost.” So that Arminians, who talk of the power of their own will to convert, believe, to repent, &amp;c., they invade the prerogative of a whole Trinity, and contradict the record or of him that runneth, but of God that sheweth mercy;” and that “it is God which worketh in us, both to will and to do, of his own good pleasure.” So that it is a divine power.</p></blockquote>

</figure><figure class="quote" id="q-b940e6d7ca" data-kw="">
<blockquote><p>The Lord’s decree is the first rise of all things that are, or have been, or are to come. This is the first original of them all, to which they must be reduced as their spring and fountain. All of you may understand that there are many things possible, which yet actually will never be. The Lord’s power and omnipotency is of a further extent than his decree and purpose. His power is natural and essential to his being; his decree is of choice, and voluntary. The Father could have sent a legion of angels to have delivered his Son; the Son could have asked them, but neither of them would do it, Matt. xxvi. 53. The Lord could have raised up children to Abraham out of stones, but he would not, Matt. iii. 9.

His power then comprehends within its reach all possible things which do not in their own nature and proper conception imply a contradiction; so that infinite worlds of creatures more perfect than this, – numbers of angels and men above these, – and creatures in glory surpassing them again, – are within the compass of the boundless power and omnipotency of God. But yet for all this it might have fallen out that nothing should actually and really have been, unless his majesty had of his own free will decreed what is, or hath been, or is to be. His will determines his power, and, as it were, puts it in the nearest capacity to act and exercise itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 159.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>We must know that the infinite majesty of heaven is not subject to those unquiet passions to which our weak and frail nature is vulnerable. He is not sometimes what He was not before. He is always in Himself the very same. His essence is unchangeable … In His most pure and blessed nature there is a perpetual calm and tranquillity.</p></blockquote>

<blockquote><p>All other things were by him [God] brought out of nothing, in consequence of a free act of his will by means of his infinite power; so that they may be justly called mere contingencies, and he is the only necessarily existent being. Nay, he is the only really existent being. … This is likewise implied in the exalted name Jehovah, which expresses his being, and that he has it from himself … This idea of a first and eternal being is again inseparably connected with an infinite degree of all possible perfection, together with immutability, and absolute perseverance therein. … In life manner, if we suppose God to be the first of all beings, we must, unavoidably, therefrom, conclude his unity …</p></blockquote>

</figure><figure class="quote" id="q-50a02e49bd" data-kw="">
<blockquote><p>These persons are so distinct in their peculiar subsistence that distinct actings and operations are ascribed unto them. And these actings are of two sorts:—1. Ad intra, which are those internal acts in one person whereof another person is the object. And these acts ad invicem, or intra, are natural and necessary, inseparable from the being and existence of God. So the Father knows the Son and loveth him, and the Son seeth, knoweth, and loveth the Father.

In these mutual actings, one person is the object of the knowledge and love of the other: John iii. 35, “The Father loveth the Son, and hath given all things into his hand.” Chap. v. 20, “The Father loveth the Son.” Matt. xl 27, “No man knoweth the Son, but the Father; neither knoweth any man the Father, save the Son.” John vi. 46, “None hath seen the Father, save he which is of God, he hath seen the Father.” This mutual knowledge and love of Father and Son is expressed at large, Prov. viii. 22-31; which place I have opened and vindicated elsewhere. And they are absolute, infinite, natural, and necessary unto the being and blessedness of God. So the Spirit is the mutual love of the Father and the Son, knowing them as he is known, and “searching the deep things of God.” And in these mutual, internal, eternal actings of themselves, consists much of the infinite blessedness of the holy God.

Again, 2. There are distinct actings of the several persons ad extra; which are voluntary, or effects of will and choice, and not natural or necessary. And these are of two sorts: — (1.) Such as respect one another; for there are external acts of one person towards another: but then the person that is the object of these actings is not considered absolutely as a divine person, but with respect unto some peculiar dispensation and condescension. So the Father gives, sends, commands the Son, as he had condescended to take our nature upon him, and to be the mediator between God and man. So the Father and the Son do send the Spirit, as he condescends in an especial manner to the office of being the sanctifier and comforter of the church. Now, these are free and voluntary acts, depending upon the sovereign will, counsel, and pleasure of God, and might not have been, without the least diminution of his eternal blessedness.

(2.) There are especial acts, ad extra, towards the creatures.1 This the whole Scripture testifieth unto, so that it is altogether needless to confirm it with particular instances. None who have learned the first principles of the doctrine of Christ, but can tell you what works are ascribed peculiarly to the Father, what to the Son, and what to the Holy Ghost. Besides, this will be manifested afterward in all the distinct actings of the Spirit; which is sufficient for our purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΠΝΕΥΜΑΤΟΛΟΓΙΑ or, A Discourse Concerning the Holy Spirit</cite>, (London, 1674) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), iii, 66-67.</span></figcaption>

<blockquote><p>Evolution, like its cousin atheism, is an idea so absurd that it should be dismissed as ludicrous by anyone with an ounce of common sense. Although B. B. Warfield has often been criticised for his compromise with unbelieving science, he did at least recognise the link between Darwinism and atheism:

The doctrine of Evolution, which was given scientific standing by Darwin’s Origin of the Species (1859), became almost at once the prime support and stay of the atheistic propaganda. In every department of thought “evolution” is supposed to account for everything, while itself needing no accounting for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Atheism (1908) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>

<blockquote><p>It gives the love of God the glory of its constancy and unchangeableness. This is another star of an eminent magnitude in the heaven of love. It is not a fading, a wavering, an altering thing, but abides for ever; God “rests in his love,” Zeph. iii. 17. It is a great thing, indeed, to apprehend that the great God should fix his love upon a poor creature, but add hereunto that he may love them one day and hate them the next, embrace them one hour and the next cast them into hell, one day rejoicing over them with joy, another rejoicing to destroy them; as it is dishonourable to God, and derogatory to all his divine excellencies and perfections, so, in particular, it clotheth his love with the most uncomely and undesirable garment that ever was put upon the affections of the meanest worm of the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Perseverance Explained and Confirmed</cite>, (Oxford, 1654) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), xi, 396.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>
<div class="actions"><button class="copy" data-copy="“It gives the love of God the glory of its constancy and unchangeableness. This is another star of an eminent magnitude in the heaven of love. It is not a fading, a wavering, an altering thing, but abides for ever; God “rests in his love,” Zeph. iii. 17. It is a great thing, indeed, to apprehend that the great God should fix his love upon a poor creature, but add hereunto that he may love them one day and hate them the next, embrace them one hour and the next cast them into hell, one day rejoicing over them with joy, another rejoicing to destroy them; as it is dishonourable to God, and derogatory to all his divine excellencies and perfections, so, in particular, it clotheth his love with the most uncomely and undesirable garment that ever was put upon the affections of the meanest worm of the earth.”

<blockquote><p>The belief which human minds share demonstrates that God, the source of all things, is good; for since nothing better than God can be imagined, who can doubt that if something has no better, it is good? Reason in fact establishes that God’s goodness is such as to demonstrate further that perfect good resides within him. Were this not the case, he could not be the source of all things, for there would be something more perfect good, and would be seen to take precedence ahead of him, since all perfect things clearly take precedence over things less complete. So to prevent the argument advancing into infinity, we must allow that the highest God is totally full of the highest and perfect good. Now we have established that the perfect good is true happiness, so true happiness must reside in the highest God.</p></blockquote>

<blockquote><p>That Christ loves some with a special, superabundant, and peculiar love; for Christ, when he suffered upon the cross, looked with a particular eye of his love upon all that should believe in him; as now in heaven he hath carried our names upon his breast. As the high priest had on his breast plate written the names of the twelve tribes in precious stones, Exodus xxviii. 21, 30; so Christ, our high priest, hath the names of all his children in his heart, to present them always to God by his intercession, so as when he now appears before God, the church with him appears before God in his heart.

The Father sees the church in the heart and breast of Christ. Now as this, I say, is true in heaven, so upon the cross the church was in the breast of Christ. There was but a certain number for whom Christ savingly laid down his life, John xvii. 9. Paul was in the breast of Christ when he shed his blood: ‘Who loved me, and gave himself for me.’ So that then Christ loves some with a peculiar, special, and superabundant love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salvation Applied</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), v, 387-88.</span></figcaption>

<blockquote><p>1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose. The proper actings of affections lie between these two; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. “He worketh all things after the counsel of his own will.” “Who hath known his mind? or who hath been his counsellor? Of him, and through him, and to him, are all things.”

2. They have their dependence on that wherewith he in whom they are is affected; that is, they owe their rise and continuance to something without him in whom they are. A man’s fear ariseth from that or them of whom he is afraid; by them it is occasioned, on them it depends. Whatever affects any man (that is, the stirring of a suitable affection), in all that frame of mind and soul, in all the volitions and commotions of will which so arise from thence, he depends on something without him. Yea, our being affected with something without lies at the bottom of most of our purposes and resolves. Is it thus with God, with him who is I AM? Exod. iii. 14. Is he independence upon any thing without him? Is it not a most eminent contradiction to speak of God in dependence on any other thing? Must not that thing either be God or be reduced to some other without and besides him, who is God, as the causes of all our affections are? ” God is in one mind, and who can turn him? what his soul desireth, that he doeth,” Job xxiii. 13.

3. Affections are necessarily accompanied with change and mutability; yea, he who is affected properly is really changed; yea, there is no more unworthy change or alteration than that which is accompanied with passion, as is the change that is wrought by the affections ascribed to God. A sedate, quiet, considerate alteration is far less inglorious and unworthy than that which is done in and with passion. Hitherto we have taken God upon his testimony, that he is the “Lord, and he changeth not,” Mai. iii. 6; that “with him there is neither change nor shadow of turning; “-—it seems, like the worms of the earth, he varieth every day.

4. Many of the affections here ascribed to God do eminently denote impotence; which, indeed, on this account, both by Socinians and Arminians, is directly ascribed to the Almighty. They make him affectionately and with commotion of will to desire many things in their own nature not impossible, which yet he cannot accomplish or bring about (of which I have elsewhere spoken); yea, it will appear that the most of the affections ascribed to God by Mr B[iddle]., taken in a proper sense, are such as are actually ineffectual, or commotions through disappointments, upon the account of impotency or defect of power.

Corel. To ascribe affections properly to God is to make him weak, imperfect, dependent, changeable, and impotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 109-10.</span></figcaption>

<blockquote><p>(2) To begin with the first work, we can consider the work of creation (a) either as it has become known to us from revelation that occurred by the Word of God, or (b) as it could become known from right reason’s use, if one has brought himself well and fittingly to contemplate this subject absent any help from revelation. If we consider the work of creation in the first way, we can easily discern the following.

First, the world was created by the Father, seeing that he, having been stirred forth out of his good will, undertook to donate existence to the world, existence it didn’t have before. Second, we note the world was framed by the Son, inasmuch as he’s the Father’s eternal Wisdom, whose council—like in leadership and administration—on the world to be framed was both wisely taken and fittingly ordered for execution. Finally, we discern the Holy Spirit was so skilled in his creation that the Spirit’s infinite force and power actually brought into effect the counsel arranged and administrated by Wisdom.

The Father’s work in that admirable, incomprehensible dispensation was such that it’s fitting we consider him as principium and first cause, the origin these things flow forth from. Solomon witnesses the Son’s work was what it was, when he called him “Wisdom” (Proverbs 8)—as it were, he who presided over the framing of all things. The apostle John witnessed likewise; obviously considering the beginning of Genesis so frequently reminds us God spoke so that this or that came to be, John termed the Son the λόγος, without whom absolutely nothing was made that’s said to be made.

Finally, it’s plainly the case the Holy Spirit’s work in creation was such because (a) he’s said to move about over the waters like birds who nest their eggs usually do and because (b) all the extraordinary, miraculous works and those in which some unusual, infinite power bares itself—all these the Scripture throughout attributes to the Spirit of God as their cause, by whose assistance God works all things.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“(2) To begin with the first work, we can consider the work of creation (a) either as it has become known to us from revelation that occurred by the Word of God, or (b) as it could become known from right reason’s use, if one has brought himself well and fittingly to contemplate this subject absent any help from revelation. If we consider the work of creation in the first way, we can easily discern the following.

First, the world was created by the Father, seeing that he, having been stirred forth out of his good will, undertook to donate existence to the world, existence it didn’t have before. Second, we note the world was framed by the Son, inasmuch as he’s the Father’s eternal Wisdom, whose council—like in leadership and administration—on the world to be framed was both wisely taken and fittingly ordered for execution. Finally, we discern the Holy Spirit was so skilled in his creation that the Spirit’s infinite force and power actually brought into effect the counsel arranged and administrated by Wisdom.

</figure><figure class="quote" id="q-7a17240b97" data-kw="">
<blockquote><p>For it is of the nature of the finite that there is absolutely no proportion between it and the infinite, neither is the former able to be equal to the latter. And so, while on the one hand the perfections cognizable in God are infinite in every way, but on the other hand the cognizing ability in every creature is finite; certainly those perfections will leave behind them by the greatest distance whatever cogitations of the creature, neither will they be understood fully and perfectly even by the comprehension of all creatures together. To such an extent God is truly Incomprehensible to every created mind.</p></blockquote>

</figure><figure class="quote" id="q-4ae38ff4af" data-kw="">
<blockquote><p>It runs as follows. The human mind possesses the idea of an absolutely perfect Being; that is, of a Being than whom a more perfect cannot be conceived. But such perfection as this implies necessary existence; and necessary existence implies actual existence; because if a thing must be, of course it is. …

For a contingent being who may or may not exist, is not the most perfect being conceivable; is not the absolutely perfect. In having, therefore, as the human mind unquestionably has, the idea of an absolutely perfect in distinction from a relatively perfect being, it has the idea of a being who exists of necessity … Necessity of being, therefore, belongs to perfection of being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 1: 224.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/existence-and-knowledge-of-god.html">Existence and Knowledge of God</a></span></div>

<blockquote><p>In general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that he is God. He that is not perfect in himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and hath no farther desire for supply. He who is blessed in himself is all-sufficient for himself. If God want or desire any thing for himself, he is neither perfect nor blessed. To ascribe, then, affections to God properly (such as before mentioned), is to deprive him of his perfection and blessedness.</p></blockquote>

<blockquote><p>The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.”

<blockquote><p>We usually consider the separation of the attributes as quite a bit different than the distinction of the persons themselves. Indeed, in the distinction of persons, no religious devotion causes us to do anything but form three concepts referred not to some three divines (because the word “divine” denotes the essence common to the three persons), but to three hypostases in that divine, each of which circumscribes and determines our thought.

But in the distinction of attributes, if when we happen to imagine various concepts, it’s the case that according to our mode of conceiving and considering we conceive of the divine properties hardly different than of some powers (and surely Peter calls them αρετας), like they should differ in their nature from the essence, close to like how we understand habits and qualities are different from the very substance of the soul.

But after we’ve grown in this so that we ponder in our hearts that whatever is in God is necessarily God himself (which is God’s absolutely simple nature, utterly devoid of any composition), then we both immediately retract all those concepts into one only, and advance from it such that he is defined by one object without any distinction.</p></blockquote>

<blockquote><p>But let us hear what reasons may be alleged to the Universality of redemption: I. Ezekiel 33. v. 11. As I live saith the Lord, I will not the death of the wicked: but, that the wicked return from his wicked way. Answ. The place is to be understood not simply but in respect; of the twain God rather wills the repentance of the sinner then his death. Again, he wills not death as it is the destruction of his creature; and so this place may be understood: yet nevertheless he wills the same as it is a means of manifestation of his justice: and therefore the prophet Esai saith, that God createth evil.

II. 1. Tim. 2. God would have all men to be saved and come to the acknowledgement of the truth. Ans. The place is meant not of the persons of all particular men, but of the orders and kinds of men. For in the first verse Paul exhorted Timothy that prayer should be made for all men: and in the second verse opening his own meaning, he addeth these words, for kings and all that be in authority: as though he should say, we must pray not only for private men and for the common people, but also for public persons, though they persecute the Gospel. But why? because in that very order God hath his elect which shall be saved. And on this manner Paul expounds himself elsewhere. There is neither Jew nor Grecian: there is neither bond nor free: there is neither male nor female: for ye are all one in Christ.

III. Rom. 11. v. 32. God hath shut up all in unbelief that he might have mercy on all. Ans. The word all, must be understood of all that are to be saved, both of Jews and Gentiles, as the article added to all importeth, and the meaning is, that God will save all whom he purposeth to save of his mercy, and not of their merit, because all are sinners as well Jews as Gentiles: thus Paul expounds himself, Galat. 3.22. The scripture hath concluded all under sin, that the promise by the faith of Jesus Christ should be given to them that believe. And if we should expound the word all, for every particular man, as some would have it, Paul must contradict himself, who said before that God would have mercy on whom he will have mercy, and whom he will he hardeneth, and in this very chapter his drift is to prove the rejection of the Jews, and the calling of the Gentiles.

IV. Joh. 3. 16. God so loved the world that he hath given his only begotten son, that whosoever believeth in him shall not perish but have everlasting life: and Joh. 6.51. I will give my flesh for the life of the world. Answ. By world, we must not understand every particular man in the world, but the Elect among the Jews and Gentiles: for in both these places Christ doth overthwart the conceit of the Jews, which thought that they alone were loved of God, and not the Gentiles. And how this word is to be understood in the new testament, Paul doeth fully declare. Rom. 11. v. 12. If (saith he) the fall of them, that is, the Jews, be the riches of the world, and the diminishing of them the riches of the Gentiles, &amp;c. and v. 15. If the casting away of them be the reconciling of the world, what shall the receiving be but life from the dead. Where by the world, he understands the body of the Gentiles in the last age of the world. And thus he fully declares his own meaning, when he saith to the Corinthians, God was in Christ reconciling the world unto himself.

V. Rom. 14. v. 15. Destroy not him with thy meat for whom Christ dyed. 2. Pet. 2.1. Denying the Lord that bought them, and bring upon themselves swift damnation. Therefore Christ died for them also which are condemned. Answ. The reason is not good. For in these and such like places the scripture speaks of men, not as they are indeed before God, but as they are in appearance and profession, and as they are in the acceptation with men. For so long as a man holds and embraces the Christian faith, so long in the judgement of charity we must esteem him to be one that is redeemed by Christ, though indeed he be not. And this is the meaning of Peter when he saith, that false prophets deny the Lord that bought them.

VI. In the preaching of the gospel grace is freely offered not only to the Elect, but to all men indifferently: and God in offering grace deludes no man: and therefore Christ’s death appertains and belongs to all men indifferently. Answer. The preaching of the Gospel is an ordinance of God appointed for the gathering together and the accomplishment of the number of the elect: and therefore in the ministerial of the word, grace and salvation is offered principally and directly to the elect; and only by consequent to them which are ordained to just damnation: because they are mingled with the elect in the same societies: and because the ministers of God, not knowing his secret counsel, in charity think all to be elect. And though God in offering grace do not confer it to all, yet is there no delusion. For the offering of grace doth not only serve for the conversion of a sinner, but also to be an occasion by men’s fault of blinding the mind and hardening the heart, and of taking away excuse in the day of judgement.

To conclude this point; Universal redemption of all men, we grant: the Scripture saith so: and there is an universality among the elect and believers: but universal Redemption of all and every man as well the damned as the elect and that effectually, wee renounce as having neither footing in the scripture, nor in the writings of any ancient and orthodox divine, for many hundred years after Christ, his words not depraved and mistaken.</p></blockquote>

and+mistaken.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Symbol+or+Creed+of+the+Apostles%2C+According+to+the+Tenor+of+Scripture%2C+in+The+Work+of+William+Perkins+%28Cambridge%3A+John+Legat%2C+1600%29%2C+pp+479-80.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c87f9d159.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c87f9d159.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/29/william-perkins-on-refuting-universal-redemption/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Anselm had said that we have an idea of a most perfect being than which none higher can be conceived. He would not have regarded such rejoinders about perfect islands in the sea or dollars in the pocket as relevant, inasmuch as neither of them can be included within the category of “most perfect of existences than which nothing greater can be conceived.” Furthermore, if anyone objected to Anselm that he could think of a most perfect being but that that did not guarantee the existence of such a being, Anselm had a ready reply.

If, he would say, you have an idea of a most perfect being which does not exist, it is not the most perfect being than which none higher can be conceived. The most perfect being which does exist is higher than the most perfect being which does not exist. Existence, after all, is greater than nonexistence. Therefore, a being which does exist is greater than one which does not exist. Consequently, the most perfect being than which none greater can be conceived must exist, because if it did not exist it would not be the being than which none greater can be conceived.</p></blockquote>

<blockquote><p>Therefore the Scripture calleth him the only begotten son of God, that he may put a necessary difference between Christ and all the faithful. For Christ is called, and indeed is the only everlasting son of the everlasting father, begotten of the substance of the father before all world’s: and therefore is every God in who[m] we ought to believe. Pro. 8. Joh. 1.

<blockquote><p>By the Godhead is meant the divine nature. A person in the Godhead, is the Godhead distinguished by personal properties. The Godhead is one only in number: But the persons in the Godhead are three; and they are the Father, the Son, and the Holy Ghost … Jesus Christ is the second of these persons, namely, the Son. And the Father is true God: the Son is true God: and the Holy Ghost is true God. Yet they are not three Gods, but one God …

Howbeit, the Godhead neither is, nor can be divided into parts: but each of the three persons hath the one whole indivisible Godhead. They are not then of a like substance only, but the very same in substance. But they are distinguished by their personal properties. And it is the personal property of the Father, to beget the Son … And it is the personal property of the Son, to be begotten of the Father … And it is the personal property of the Holy Ghost, to proceed from the Father and the Son … The Son and the Holy Ghost are not below the Father, but equal with him: They are all equally powerful and glorious. So the personal properties make no inequality among them; forasmuch as these properties are not temporary and accidental, but eternal and necessary, and could not but be: and every one of the three persons, is the eternal, the supreme, the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 15-16.</span></figcaption>

— Thomas Boston, A Brief Explication of the First Part of the Assembly’s Shorter Catechism, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 15-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+the+Godhead+is+meant+the+divine+nature.+A+person+in+the+Godhead%2C+is+the+Godhead+distinguished+by+personal+properties.+The+Godhead+is+one+only+in+number%3A+But+the+persons+in+the+Godhead+are+three%3B+and+they+are+the+Father%2C+the+Son%2C+and+the+Holy+Ghost+%E2%80%A6+Jesus+Christ+is+the+second+of+these+persons%2C+namely%2C+the+Son.+And+the+Father+is+true+God%3A+the+Son+is+true+God%3A+and+the+Holy+Ghost+is+true+God.+Yet+they+are+not+three+Gods%2C+but+one+God+%E2%80%A6%0A%0AHowbeit%2C+the+Godhead+neither+is%2C+nor+can+be+divided+into+parts%3A+but+each+of+the+three+persons+hath+the+one+whole+indivisible+Godhead.+They+are+not+then+of+a+like+substance+only%2C+but+the+very+same+in+substance.+But+they+are+distinguished+by+their+personal+properties.+And+it+is+the+personal+property+of+the+Father%2C+to+beget+the+Son+%E2%80%A6+And+it+is+the+personal+property+of+the+Son%2C+to+be+begotten+of+the+Father+%E2%80%A6+And+it+is+the+personal+property+of+the+Holy+Ghost%2C+to+proceed+from+the+Father+and+the+Son+%E2%80%A6+The+Son+and+the+Holy+Ghost+are+not+below+the+Father%2C+but+equal+with+him%3A+They+are+all+equally+powerful+and+glorious.+So+the+personal+properties+make+no+inequality+among+them%3B+forasmuch+as+these+properties+are+not+temporary+and+accidental%2C+but+eternal+and+necessary%2C+and+could+not+but+be%3A+and+every+one+of+the+three+persons%2C+is+the+eternal%2C+the+supreme%2C+the+most+high+God.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+A+Brief+Explication+of+the+First+Part+of+the+Assembly%E2%80%99s+Shorter+Catechism%2C+%281727%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+vii%2C+15-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3c4cc2eb6.html&amp;via=5Solas" ta </figure><figure class="quote" id="q-83ef30fcf6" data-kw="">
<blockquote><p>Now, the Son is able to be called the Word of God metonymically: whether by metonymy of the adjunct in place of the subject, because He is the principal argument/subject of the divine Word, both the prophetic Word formerly, and also the evangelical Word afterward under the New Testament; or by metonymy of the effect in the place of the cause, because God sets forth unto men His entire Word through the Son as the supreme and divine Prophet, not only under the New Testament, Hebrews 1:1, but also under the Old, 1 Peter 1:11.

Yet far more preferably by the name of the Λόγου/Logos/Word the person of the Son and His eternal subsistence is declared to us metaphorically, as we hold against the Socinians who deny it: for, α. this name is attributed to the Son, when mention is made, on the one side of Jehovah or the Father, on the other side of the Spirit, as of divine persons distinguished among themselves by these names; whence the middle name of the Word shall be of the same, rather than of a different, order.

β. This name is also substituted for the name of the Son, which is in Matthew 28:19, just as also John attributed to the incarnate Word the glory as of the Only Begotten of the Father, John 1:14, and he adds that God set forth to us, not the Word, but the Only Begotten Son of God, τὸν ὄντα εἰς τὸν κόλπον τοῦ πατρός, which is in the bosom of the Father, John 1:18. γ. This name is attributed to Christ, when there is regard, not to the Gospel, which was proclaimed after the Fall, but to the first Creation: whence also then it is evident that it is actually applicable to Him with respect to His eternal subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, §3, p. 56.</span></figcaption>

<blockquote><p>But that which abides always is certainly not changed, therefore if it suffers no change it is eternal. And so the Holy Spirit is eternal, but the creature is liable to fault, and therefore subject to change. But that which is subject to change cannot be eternal, and there cannot therefore be anything in common between the Spirit and the creature, because the Spirit is eternal, but every creature is temporal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit</cite>, (381), 3.11.80 in Nicene and Post-Nicene Fathers 2, 10: 106.</span></figcaption>

<blockquote><p>Our God is one, or rather He is Oneness itself, a unity which has nothing in itself but itself, not consisting of many things, as everything else does. In this essential Unity of God, a hypostatic Trinity subsists in a way that far exceeds the imagination of men. The external operations of God in time and history are such that, even though He is one, each hypostasis does something particular and appropriate.

For since they are Three and subsist in the essence of one Deity, it can truly be said that all things are from the Father, by the Son, and through the Holy Spirit. What the Son hears from the Father, and what the Spirit receives from the Father and the Son, we come to receive at the hands of the Spirit (John 16:13-15), and therefore He is the last and nearest to us in order, although in power He is equal to the Second and First.</p></blockquote>

<blockquote><p>1 John iv. 16, “God is love,” not only subjectively, infinitely loving; but objectively, wholly lovely. And so he is in the eyes of all who live to his praise. To them the Father is lovely, the Son lovely, the Holy Spirit lovely. Every attribute of God is lovely. The holiness and purity of his nature, the great eye-sore of carnal men, is most lovely to them: Exod. xv. 11, “Who is like unto thee, Lord, glorious in holiness, fearful in praises, doing wonders?” Psalm xxx. 4, “Sing unto the Lord, ye saints of his, and give thanks at the remembrance of his holiness.” His works are lovely. The creation of the world is a lovely work; the guiding of it by providence a lovely work; but the most lovely is the redemption of the world by the blood of Christ.</p></blockquote>

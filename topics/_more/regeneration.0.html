<blockquote><p>1. In respect of its first moment regeneration comes about in another way than in respect of its progression. Regarding the first moment of regeneration man is purely passive; regarding its progression man cooperates with God. … 13. In this life regeneration is by degrees: these degrees do not only concern regeneration by itself but also the subjects. Some people are more regenerate than others; hence older people are more regenerated than the young ones.</p></blockquote>

</figure><figure class="quote" id="q-9f7b734e4d" data-kw="">
<blockquote><p>But the truth is this, the Lord must let in an influence of some special motion and operation and leave some impression of spiritual power upon the will to enable it to act, not only to concur with the act thereof. God gives a man ability whereby he may will, does not 〈◊〉 with him by assistance and providence when He wills as one in whom we live and move. Of the first of these it’s true which many of the ancients speak, God works without us, many things in us, i.e. unto which we being in no causal ability at all, God gives us ability to do that which is pleasing and spiritual, to the obtaining whereof, we had no causal ability of our own; when the Lord Christ raised Lazarus now dead and smelling in the grave, He did not concur with the action and motion of his soul in rising out of the grave, but without any causal concurrence or help of Lazarus, He put a soul into his body, whereby He was enabled to stir and move. So it is with a soul dead in sins and tresspasses, when the mind and will have no ability for any spiritual act, not able to take off that deadness and indisposition that is there, the Lord without the will, without any causal concurrence of it, lets in ability into it for the work, and concurs with it in the work. So Paul expresses this manner of God’s work, 2 Cor. 4:6, He causes light to shine out of darkness; He gives light and being out of darkness, without the help of light, and then concurs with the light in the shining of it; God lets in an influence to the will, not only lends a concurrence to the work.</p></blockquote>

</figure><figure class="quote" id="q-5c962461c3" data-kw="">
<blockquote><p>Whereas this must be observed carefully and forever maintained as the everlasting Truth of God, that the Lord gives a power-spiritual to the work which it had not before He concurs with the act of that power when it is put forth; He gives him a being in the 〈◊〉[state?] of grace, before He leads out the act of that being. He first lets in an influence of a powerful impression upon the faculty of the will, before He concurs with the act 〈◊〉deed. He gives a heart of flesh, and then causes them to walk in his ways: As if one could put a principle of life and motion into another, and then draw forth the act of that power to the performance of the work…</p></blockquote>

<blockquote><p>Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients. 1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth. 2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. … 3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same. 4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London, 1647), pp. 464-65 &amp; 470-71</span></figcaption>

ts+and+saving+graces%2C+and+supernatural+qualities+created+in+us+by+the+Holy+Spirit+and+acted%2C+excited+and+moved+as+supernatural+and+heavenly+habits+to+act+with+the+vital+influence+of+our+understanding%2C+will+and+affections.+I+prove+the+former+part%3A+1.+Because+such+a+union+of+the+Person+of+the+Holy+Ghost+in+us%2C+believing%2C+loving%2C+joying%2C+praying+and+immediately+in+us%2C+were+that+blasphemous+deifying+and+Goding+of+the+saints%2C+so+as+believing%2C+loving%2C+praying+were+not+our+works%2C+but+the+immediate+acts+of+the+Holy+Ghost%2C+and+either+the+faint+manner+of+believing%2C+or+the+cold+slacked+loving%2C+and+praying+of+saints%2C+or+their+not+believing%2C+and+sinful+omission+of+the+acts+of+faith%2C+love%2C+praying%2C+rejoicing%2C+could+not+be+more+imputed+to+saints+as+their+sinful+defects+and+transgressions+%28but+must+be+laid+on+the+Holy+Ghost%E2%80%99s+score%29+than+we+can+impute+the+splitting+of+a+ship+to+the+ship+itself+and+not+to+the+negligent+and+willful+pilot+who+of+purpose+dashed+the+vessel+on+a+rock%3B+but+we+must+not+in+reason+blame+the+ship%2C+but+the+pilot%3B+for+the+loss+of+the+ship+is+the+only+and+proper+fault+of+the+man+that+stirred+the+ship%2C+and+the+ship+is+innocent+and+harmless+timber%3A+Now+what+sin+can+be+in+the+saints+in+these+supernatural+acts%2C+if+the+Holy+Ghost+immediately+in+his+own+Person+stir+the+helm%2C+and+only%2C+without+us%2C+act+these+in+us%3F+We+might+with+as+good+reason+say+the+shop+that+a+man+works+in+does+make+the+portrait%2C+which+is+a+great+untruth%2C+since+the+artificer+in+the+shop+does+it%E2%96%AA+as+say+that+the+saints+do+pray%2C+believe%2C+rejoice%2C+if+the+Holy+Ghost+immediately+do+all+these+in+them%2C+as+in+a+shop.+%E2%80%A6+3.+The+third+%5Berroneous%5D+way+is+that+free-will+is+said+to+believe%2C+repent%2C+love+God%2C+by+a+mere+extrinsical+denomination%2C+because+it+carries+that+grace+which+formally+and+only+does+perform+all+these+supernatural+actions%3B+so+grace+does+all+and+free-will+is+a+mere+patient+that+confers+no+vital+subordinate+and+active+influence+in+these+acts%3B+as+we+say%2C+the+apothecaries%E2%80%99+glass+heals+the+wound%2C+because+the+oil+in+the+glass+works+the+cure%2C+when+the+glass+does+actively+contribute+nothing+to+the+cure%3B+or+the+ass+makes+rich%2C+when+it+carries+the+gold+that+enriches+only%3B+this+sense+Antinomians+hold+forth+and+make+us+mere+patients+and+blocks+in+the+way+to+heaven%2C+and+this+sense+Jesuits%2C+especially+Martinez+de+Ripald%2C+falsely+charges+upon+Luther+and+Calvin%3B+and+the+Council+of+Trent%2C+inspired+with+the+same+lying+spirit%2C+says+the+same.+4.+The+fourth+%5Band+correct%5D+sense+is+that+grace+and+free-will+does+work+so+as+grace+is+the+principal%2C+first+inspiring+and+fountain+cause%3A+1.+It+being+a+new+supernatural+disposition+and+habit+in+the+soul%2C+Jn.+14%3A23%3B+1+Jn.+2%3A27%3B+3%3A9%3B+Jn.+4%3A14%3B+Isa.+44%3A3-4%3B+Eze.+36%3A26-27%3B+Dt.+30.6%3B+a+good+treasure+or+stock+of+grace%2C+Mt.+12%3A35%3B+Lk.+6%3A45.+And+also+actually+it+determines%2C+sweetly+inclines+and+stirs+the+will+to+these+acts%3B+yet+so+as+free-will+moves+actively%2C+freely%2C+and+confers+a+radical%2C+vital+and+subordinate+influence+and+is+not+a+mere+patient+in+all+these%2C+as+Antinomians+dream%2C+Ps.+119%3A32.+%E2%80%98I+will+run+the+way+of+thy+commandments%2C+when+thou+shall+enlarge+my+heart%2C%E2%80%99+Jn.+14%3A12%2C+%E2%80%98he+that+believeth+in+Me%2C+the+works+that+I+do%2C+he+shall+do%2C+and+greater+than+these%2C%E2%80%99+Mt.+12%3A50%2C+%E2%80%98He+that+does+the+will+of+my+heavenly+Father%2C+the+same+is+my+brother%2C%E2%80%99+etc.+1+Cor.+9%3A24%2C+%E2%80%98So+run+that+ye+may+obtain%2C%E2%80%99+Rev.+2%3A2%2C+%E2%80%98I+know+thy+works+and+thy+labour%2C%E2%80%99+1+Thess.+1%3A3%2C+%E2%80%98Remembering+without+ceasing+your+work+of+faith+and+labor+of+love%2C+and+patience+of+hope%3A%E2%80%99+1.+We+are+not+dead+in+supernatural+works%2C+and+mere+blocks%2C+Rom.+6%3A11%2C+%E2%80%98We+are+alive+unto+God+in+Jesus+Christ%2C%E2%80%99+Eph.+2%3A1%2C+%E2%80%98He+hath+quickened+us%2C%E2%80%99+Rev.+2%3A3%2C+%E2%80%98For+my+name%E2%80%99s+sake+thou+hast+laboured%2C+and+had+not+fainted%2C%E2%80%99+1+Cor.+15%3A58%2C+%E2%80%98Be+ye+steadfast%2C+unmoveable%2C+always+abundant+in+the+work+of+the+Lord.%E2%80%99+There+is+activity+in+the+Spirit+to+lust+against+the+flesh%2C+Gal.+5%3A17%3B+Rom.+7%3A15.+Nor+is+the+blessedness+of+the+saints+only+passive+in+receiving%3A+though+to+be+justified+and+receive+Christ%E2%80%99s+righteousness+be+the+fountain+blessedness%2C+Ps.+32%3A1%3B+Rom.+4%3A6-7%3B+Gal.+3%3A13.+But+the+Scripture+speaks+of+a+true+and+solid+blessedness+in+action%2C+Ps.+119%3A1%2C+%E2%80%98Blessed+are+the+undefiled+in+the+way%2C%E2%80%99+Isa.+56%3A2%2C+%E2%80%98Blessed+is+the+man+that+doth+this%2C%E2%80%99+Jm.+1%3A12%2C+%E2%80%98Blessed+is+the+man+that+endureth+temptation%2C%E2%80%99+Ps.+119%3A2%2C+%E2%80%98Blessed+are+they+that+keep+his+testimonies%2C%E2%80%99+Ps.+106%3A3%2C+%E2%80%98Blessed+are+they+that+keep+judgment%2C+Rev.+22%3A14%2C+%E2%80%98Blessed+are+they+that+do+his+commandments%2C+Mt.+5%2C+%E2%80%98Blessed+are+they+that+mourn%2C+that+hunger+and+thirst%3B%E2%80%98+Then+there+must+be+a+part+of+blessedness+in+sanctification%2C+as+in+justification%3B+though+the+one+be+the+cause%2C+the+other+the+effect.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65+%26+470-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec223b0914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec223b0914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Assertion%201%3A%20In%20the%20first%20moment,the%20cause%2C%20the%20other%20the%20effect&amp;text=Assertion%201%3A%20In%20the%20first%20moment%20of%20our&amp;text=one%20be%20the%20cause%2C%20the%20other%20the%20effect" rel="noopener" t <blockquote><p>Synonyms [of regeneration] more properly signifying are: … II. Conversion. This word sometimes denotes the act of God alone; sometimes the complete act of God and man; sometimes the formal act of man, so that it is of the same notion as the word penitence and repentance. The first signification looks to the act of first or preventing grace, and properly pertains here and makes a synonym of regeneration. In the Pelagian controversies concerning grace and free will, such conversion is wont to be called by theologians the first moment of conversion, where man conducts himself purely passively. The second signification looks to the act of God’s second grace, by which man, instructed and informed through preventing or first grace with a new habitual principle of spiritual life impressed by the omnipotent facility of God, is premoved and excited by God to perform acts and to actually elicit acts of spiritual life, or of repentance and faith, Jer. 31:18; Song 1:4. The third signification properly looks to the act of man. For man is the proper and formal principle of actual penitence or repentance, of conversion from his sin—not God, who is the effective principle. For He Himself does not do, so as to be that proper and particular cause (which, for example, is Peter repenting), that is, He does not grieve, does not repent, does not weep bitterly, does not die to sin, does not rise to new life; but He makes us to do, as Augustine speaks. We ourselves therefore do those things, but not of ourselves—as I remember reading that distinction in the homilies of Ardentius Pictaviensis [Ardent of Poitiers]. … II. Sometimes it [‘regeneration’] denotes: 1. The first impression of the new creature, or the change from non-being to spiritual being. 2. Its conservation, continuation, and augmentation. 3. Its instauration and renovation. 4. Its consummation and final perfection. … As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>

80%A6+II.+Sometimes+it+%5B%E2%80%98regeneration%E2%80%99%5D+denotes%3A+1.+The+first+impression+of+the+new+creature%2C+or+the+change+from+non-being+to+spiritual+being.+2.+Its+conservation%2C+continuation%2C+and+augmentation.+3.+Its+instauration+and+renovation.+4.+Its+consummation+and+final+perfection.+%E2%80%A6+As+for+regeneration+or+conversion+in+the+second+moment%2C+it+can+be+analogically+conceived+thus%3A+I.+The+one+generating+is+the+Holy+Spirit+through+second+grace+as+through+a+plastic+power.+II.+The+matter+of+generation+and+seed+is+the+new+creature+implanted+in+the+first+moment+of+regeneration%2C+from+which+those+acts+are+elicited.+III.+The+form+is+the+second+act+of+faith%2C+which+as+it+were+actuates+and+%CF%80%CE%BB%CE%B7%CF%81%CE%BF%E1%BF%96+%5Bpl%C4%93roi%2C+fills%2Ffulfills%5D+that+seed+of+regeneration.+IV.+Preparatory+dispositions+are+certain+acts+of+repentance+preceding+faith.+V.+Mixture+is+the+actual+union+of+faith+with+the+promises+of+the+Gospel%2C+Heb.+4%3A2.+VI.+Animation+of+the+fetus%2C+or+introduction+of+the+form%2C+is+when+by+actual+faith+Christ+is+applied+for+justification.+VII.+The+first+thing+emanating+from+the+form+now+introduced%2C+or+the+elicited+act%2C+is+the+reflexive+act+of+faith.+VIII.+To+which+follows+the+impetrated+act%3A+namely%2C+the+%E1%BC%90%CE%BD%CE%AD%CF%81%CE%B3%CE%B5%CE%B9%CE%B1+%5Benergeia%2C+energy%2Factivity%5D+of+charity.+IX.+The+process+and+succession+of+acts+which+dispose+to+the+production+of+the+first+actual+faith+nearly+holds+itself+as+that+of+the+human+fetus%2C+which%2C+although+the+rational+soul+infused+is+specific%2C+by+which+the+vegetative+and+sensitive+are+contained+%28in+the+same+way+as+the+binary+is+in+the+ternary+and+the+triangle+in+the+quadrangle%29%2C+yet+man+first+lives+the+life+of+a+plant%2C+then+of+an+animal%2C+then+of+a+man.+So+faith%2C+although+it+is+the+first+act+of+the+new+creature%2C+indeed+as+it+were+the+radical+principle+of+the+whole+new+creature%2C+yet+its+second+act%2C+at+least+the+complete+and+formed+or+sensible+one%2C+is+exercised+nearly+among+the+last.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1%2C+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+432-65+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f8de45373.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f8de45373.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Synonyms%20%5Bof%20regeneration%5D%20more%20properly%20signifying,is%20exercised%20nearly%20among%20the%20last&amp;text=Synonyms%20%5Bof%20regeneration%5D%20more%20properly%20signifying%20are&amp;text=sensible%20one%2C%20is%20exercised%20nearly%20among%20the%20last" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

<div class="actions"><button class="copy" data-copy="“V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+The+notion+of+regeneration+broadly+taken+is+distinguished+from+the+event+into+%E1%BC%80%CF%81%CE%B3%CF%8C%CE%BD+%5Bargon%2C+inactive%5D+and+%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%E1%BF%86+%5Benerg%C4%93%2C+active%5D.+The+former+is+of+infants+dying+before+the+use+of+reason.+The+latter+is+of+adults.+Which+again+is+distinguished+into+that+of+the+first+and+second+moment.+The+former+is+that+which+has+for+its+terminus+and+formal+effect+the+new+creature+in+the+first+act%2C+or+the+spiritual+man.+The+latter+is+that+which+has+for+its+terminus+and+formal+effect+the+second+acts+of+the+new+creature%2C+or+the+regenerate+man+actually+exercising+and+eliciting+the+motions+of+faith%2C+repentance%2C+etc.+The+cause+of+the+former+is+operating%2C+preventing%2C+or+first+grace%3B+of+the+latter%2C+cooperating%2C+second%2C+or+subsequent+grace.+The+former+impresses+new+habits+or+faculties%2C+namely%2C+by+informing+the+mind+and+will+with+them+and+rendering+them+fit%3B+the+latter+impresses+new+motions+or+acts%2C+namely%2C+by+applying+the+will+to+them+and+premoving+and+preceding+it+and+influencing+into+it%2C+and+thus+concurring+with+it+to+one+and+the+same+effect%2C+and+efficiently+influencing+into+the+same+effect%2C+that+is%2C+co-producing+it.+The+former+is+simply+instantaneous%3B+the+latter%2C+as+to+its+whole+complex%2C+successive.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2%2C+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F987794b041.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class=" <blockquote><p>(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/elias-grebenitz.html">Elias Grebenitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Treatise on Regeneration in Three Disputations</cite>, [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), Disputation 1, ‘On Regeneration in General’, p. 7 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt.</span></figcaption>

<blockquote><p>§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.</p></blockquote>

</figure><figure class="quote" id="q-9a1c37103a" data-kw="">
<blockquote><p>I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s</cite>, (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-bbc82a597e" data-kw="">
<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.”

— Thomas Cole, A Discourse of Regeneration, Faith &amp; Repentance, ... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2dly%2C+Regeneration+does+not+only+show+the+wide+difference+between+the+two+states%2C+the+regenerate+and+unregenerate%3B+but+it+comes+in+a+different+manner+upon+the+regenerate+themselves.+I+say+a+different+manner%3B+for+there+is+no+difference+in+the+nature+of+the+thing+itself%2C+that+is+the+same+in+substance%2C+essence%2C+and+principle+in+all+who+are+regenerate%3A+yet+there+are+some+circumstances+attending+regeneration+sometimes%2C+wherein+one+regenerate+person+may+greatly+differ+from+another%2C+even+in+the+first+moment+of+regeneration%2C+e.g.+some+may+be+regenerated+and+converted+into+higher+degrees+of+grace+in+the+first+moment+of+their+conversion%2C+than+some+others+%28though+as+truly+regenerate+as+they%29+may+attain+to+all+their+days%3B+all+in+regeneration+do+receive+one+and+the+same+spirit+of+grace%2C+but+not+in+the+same+measure.+Paul+was+converted+into+an+eminency+in+grace%3B+he+was+never+a+babe+in+Christ%2C+but+was+born+a+strong+man+in+Christ+the+very+first+moment+of+his+conversion.+God+had+present+use+of+Paul%3B+he+had+designed+him+for+eminent+service%2C+which+he+was+immediately+to+enter+upon%2C+and+therefore+God+furnishes+him+accordingly.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cole%2C+A+Discourse+of+Regeneration%2C+Faith+%26+Repentance%2C+...+%28London%3A+Cockerill%2C+1692%29%2C+Discourse+of+Regeneration%2C+ch.+4%2C+%E2%80%98Manner+of+Regeneration%E2%80%99%2C+p.+73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbbc82a597e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bbc82a597e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=2dly%2C%20Regeneration%20does%20not%20only%20show,and%20therefore%20God%20furnishes%20him%20accordingly&amp;text=2dly%2C%20Regeneration%20does%20not%20only%20show%20the%20wide&amp;text=enter%20upon%2C%20and%20therefore%20God%20furnishes%20him%20accordingly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e2f2ddb52d" data-kw="">
<blockquote><p>That we may attain unto a more clear understanding of the nature of this regeneration, so necessary to salvation: we must carefully observe with regard to the word, that both the Scriptures and also divines use it sometimes in a larger sense, to denote the whole operation of the Holy Ghost upon the souls of those who are to be saved, whereby they are brought into a state of grace, so that, besides the external call, it comprehends conversion, and even initial santification: in which sense practical divines lay down the marks, motives and means of regeneration. Sometimes the word regeneration is used in a more limited sense, as distinguished from the external call, from conversion and from sanctification: so that the external call signifies only the offer of redemption for our reception: Regeneration conveys that power into the soul, by which the person who is to be saved is enabled to receive the offer. Conversion puts forth the power received into actual exercise, so that the soul does actually receive the offered benefits. Sanctification brings forth the fruits of conversion, or of faith and repentance, in a carefulness to maintain good works, yet not so immediately but that a union with Christ and justification come between conversion and sanctification, at least in the order of nature, if not of time. It is in this stricted sense of the word we shall consider the doctrine of regeneration at present…</p></blockquote>

</figure><figure class="quote" id="q-68de1d857d" data-kw="">
<blockquote><p>Those places of Scripture which are alleged [Dt. 10:16; Jer. 4:4; Eze. 18:31; Rom. 12:2; Joel 2:13; Mt. 4:17] speak not of regeneration strictly so called, by which God infuses the first principle of life, but of conversion, wherein He brings forth the life already bestowed into actual exercise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 24, pp. 34-35</span></figcaption>

</figure><figure class="quote" id="q-d6bb455246" data-kw="">
<blockquote><p>In these commands God speaks to his Church, to his people who had long been his delight; therefore they must have been already regenerate; since, without regeneration no one can see or enter into the kingdom of God. Therefore by these commands God does not mean to bring about regeneration as it denotes the first infusion of the spiritual life, but the drawing forth of that life which is infused by regeneration into the second acts or consequent exercises (which is expressly mentioned in the passage, from whence the first of these commands is quoted) which is done in conversion, that follows upon regeneration, in which man, being drawn, runs after God; being turned, he actively converts and turns himself to God by the power of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 25, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-472d20d9b5" data-kw="">
<blockquote><p>But however it may be: Since among the Lutherans and the Reformed it is not a matter of controversy that: 1. After the Fall, man is intimately corrupt, dead in sins, and therefore utterly unfit to begin and to perfect any spiritual good. 2. Not only faith itself, but also the inclination and disposition to faith is a gratuitous gift of God. 3. Man, in the first moment of conversion, behaves purely passively, etc. From this it is clear that the Reformed and the Lutherans can be reconciled more easily than others concerning this matter. . ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin §XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. Ps. 119:18: God “reveals the eyes to consider the wondrous things of the Divine Law.” Lk. 24:45: he “opens the minds of men, that they may understand the Scriptures.” Acts 16:14: he “opens the heart, that they may attend to those things which are said by the ministers.” Eph. 1:17-18: he “gives the Spirit of Wisdom and of revelation, in the knowledge of Christ, the eyes of our heart being enlightened, that we may know what the hope is of our calling, and what are the riches of the glory of his inheritance in the saints.” Ps. 51:12 &amp; Eph. 2:10: He “creates a clean heart” in them, and “renews a right spirit” in their bowels. Eze. 36:26-27: he “gives a new heart and puts a new spirit in the midst of the converted: and takes away the stony heart out of their flesh, and gives them a heart of flesh, and puts his spirit in the midst of them, and causes them to walk in his commandments, and to keep his judgments, and do them.” Jn. 3:5 &amp; 1 Pet. 1:3: he regenerates from heaven. Jn. 6:44: he draws. Eph. 1:19-20: he “works on them according to the operation of the might of his power, which he wrought in Christ, raising him up from the dead.” Phil. 2:13: he works “both to will and to accomplish.” 2 Thess. 1:11: He “fulfills all the good pleasure of his goodness, and the work of faith in power” in them. Heb. 13:21: He “works in them that which is well pleasing in his sight through J.C.” Jer. 31:33: He “gives his law in their bowels, and will write it in their heart.” Whence Israel there sighs in vv. 18-19 “Convert thou me, and I shall be converted: for thou art the Lord my God. For after thou didst convert me, I did penance: and after thou didst show unto me, I struck my thigh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Treatise on Predestination, Election &amp; Reprobation of Men, for Promoting Ecclesiastical Concord 3rd</cite>, ed. tr. by AI by Nosferatu (Leiden, 1705), p. 163</span></figcaption>

<blockquote><p>If someone Reformed is asked on what his perseverance in the state of grace rests, then he will not answer, “On something in me, on the power and the capacity for withstanding of the new life that I possess,” but, “Solely on the preserving faithfulness of God.</p></blockquote>

</figure><figure class="quote" id="q-d64a16d261" data-kw="">
<blockquote><p>True, we speak of an old and a new man in the believer, and so we give expression to the fact that in the new life the whole man has in principle been changed, and that nevertheless the power of sin continues to dwell in all his faculties and members. But actually what it is is that there are two groups of interests, ideas, inclinations, and the like, which do battle against each other and of which neither the one nor the other has been able to gain the full control of any single human faculty. If the truth of God had completely taken over and conquered the consciousness of the believer, there would naturally be no room left for error and falsehood; and if the love of God had wholly filled the heart, there would be no room for hatred, envy, wrath and the like. But that, as every one knows from his experience, is not the case; and Scripture testifies that we cannot look forward to such a perfect condition in this life. The struggle will remain until the end because the faith, the hope, the love, and all the Christian virtues will never be perfected in this life and therefore room remains in our soul for unbelief, doubt, discouragement, fear, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Reasonable Faith: A Survey of Christian Doctrine</cite>, trans. Henry Zylstra (Grand Rapids, MI: Wm. B. Eerdmans Publishing Company, 2016), 476–477.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration.html">Regeneration</a></span></div>

delblog</a></div>
</figure><figure class="quote" id="q-6bae5fb453" data-kw="">
<blockquote><p>A True faith in God through Jesus Christ is the principal act of that spiritual life, which is begun in the elect by regeneration, as well as the fountain head, from whence, all those living works which follow after regeneration, proceed: the nature of this faith we are now about to explain. It is not any one single habit or act of the soul, nor ought it to be restrained to one faculty thereof only; but it is something made up of various acts, which, though not in a confused manner, may interfere one with the other, and in a kind of delightful fellowship and union, promote and help each other, and this constantly. It imports a change of the whole man, is the spring of the whole spiritual life; and lastly, it denotes a holy diligence and energy of the whole soul towards God in Christ, so that its full compass can scarcely be comprehended in a distinct manner under any one single idea. Let not any one wonder, that we include so many things under the name of one Christian virtue; for as a person speaking of life, designs to express by that word, something, that diffusing itself throughout the whole soul, and all its faculties, is communicated also to the body, and extends itself to all the actions of a living person; so, when we speak of faith, which is the fruitful fountain of the whole, spiritual life, we would have that understood to be signified, which pervades all the faculties, and is exactly calculated to unite them with Christ, and thus enliven, sanctify and make them blessed. We must observe by the way, that amongst those acts which we are about to describe, there is one in particular, in which we think the formal reason and essence of faith, so far as it unites us with Christ and justifies us, consists. And this is to be carefully observed in the business of justification, lest any one should look upon those acts of charity which in different ways are connected with the practice of faith, as the causes of justification. …First, That which faith comprehends, or at least supposes, is a knowledge of the things which are to be believed. This, in contradiction to the absurdity of the Papists, is very plain, I from the scriptures; which so speak of faith, as manifestly to give us to understand, that knowledge is included in the very idea, as well as the practice of faith, Isa. 53:11. John 17:3. compared with Hab. 2:4. John 6:69. 2 Tim. 1:3. II. From the very nature of faith, which, as it speaks of an assent given to a truth revealed by God, and that without any doubting, necessarily presupposes the knowledge of these two things, 1. That God has revealed something. 2. What that something is, which faith assents to as divinely revealed. For to say that a person assents to any truth, which he is ignorant of, and concerning which, he knows not whether there be any testimony extant which is worthy of credit, is absurd. …To this knowledge must be joined an assent, which is the second act of faith, by which a person receives and acknowledges as truths, the things he knows, receiving the testimony of God, and thus setting to his seal that God is true, John 3:33. This assent is most especially founded upon the infallible veracity of God, who beareth testimony of himself and of his Son, 1 John 5:9, 10. on which testimony revealed in the scriptures, and shedding forth all around the rays of its divinity, the faithful soul relies with no less safety, than if it had actually been present and an immediate party in those things that are revealed. For when the soul enlightened by the Spirit of God, perceives those divine truths, and seeth in them a certain divine excellency, and a most wife and indissoluble connection of the whole, it cannot but assent to a truth which forces itself upon it with so many arguments, and as securely admits, what it thus knows, for certainty, as if it had seen it with its own eyes, or handled it with its hands, or had been taken up into the third heaven, and heard it immediately from God. Let the lust of the flesh murmur, or let vain sophists argue what they may, though perhaps the soul may not be able to answer or solve all objections, it still persists in the acknowledgment of this truth, which it sees too clearly, and has heard too certainly, as it were, from the mouth of God, ever to suffer itself to be drawn away from it by any sophistry. I have not, saith the believing soul, followed cunningly devised fables in believing the power and coming of our Lord Jesus Christ, but, in the spirit, have I beheld his Majesty, and heard, as it were, his voice from heaven, 2 Pet. 1:16, 18. So that faith is accompanied with what is called substance and evidence, Heb. 11:1. full persuasion or plerophory, Rom. 4:21. Of the signification of which words, it may not be unuseful to consider a little. … It is true that love, strictly speaking, is distinguished from faith; but nevertheless the acts of each are so interwoven with one another, that we can never explain nor exercise faith without some acts of love interfering. This is an observation of some of the greatest divines before me, each of which cites that saying of St. Austin—What is it to believe in God? by believing to love. … What follows this hunger and thirst, is the receiving the Lord Christ for justification, for sanctification, and thus for complete salvation: and this is the fifth, and indeed the formal and chief act of faith, which is thus—the heavenly Father freely offers the Son, Christ the Lord freely offers Himself, with all his benefits, and fulness of salvation which resides in Him, to the sick and weary soul, saying, Is. 65:1. Behold me! behold me! and the soul now conscious of its own misery, considering the fulness of the salvation that is in Christ, with joy and hope, and eagerly desiring communion with Him, cannot help apprehending and receiving so great a good offered to it; and thus by accepting it, makes it its own: by this act Christ is made the peculiar property of the believing soul; so that whatever is Christ’s, and offered together with Christ, the believer claims to himself: and first, of all the righteousness of Christ, which is the foundation of salvation, and thus by apprehending Christ, is united to Him. The believer being thus united to Christ, is deemed and looked upon to have done and suffered, whatever things Christ, so far as He was a surety did and suffered in his stead. Thus it is easily to be understood in what manner we are justified by faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Christian Faith</cite>, trans. Martin Madan (London, 1761), (pages 1, 2, 3, 7, 15, 18).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

— Herman Witsius, A Treatise on Christian Faith, trans. Martin Madan (London, 1761), (pages 1, 2, 3, 7, 15, 18).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+True+faith+in+God+through+Jesus+Christ+is+the+principal+act+of+that+spiritual+life%2C+which+is+begun+in+the+elect+by+regeneration%2C+as+well+as+the+fountain+head%2C+from+whence%2C+all+those+living+works+which+follow+after+regeneration%2C+proceed%3A+the+nature+of+this+faith+we+are+now+about+to+explain.+It+is+not+any+one+single+habit+or+act+of+the+soul%2C+nor+ought+it+to+be+restrained+to+one+faculty+thereof+only%3B+but+it+is+something+made+up+of+various+acts%2C+which%2C+though+not+in+a+confused+manner%2C+may+interfere+one+with+the+other%2C+and+in+a+kind+of+delightful+fellowship+and+union%2C+promote+and+help+each+other%2C+and+this+constantly.+It+imports+a+change+of+the+whole+man%2C+is+the+spring+of+the+whole+spiritual+life%3B+and+lastly%2C+it+denotes+a+holy+diligence+and+energy+of+the+whole+soul+towards+God+in+Christ%2C+so+that+its+full+compass+can+scarcely+be+comprehended+in+a+distinct+manner+under+any+one+single+idea.+Let+not+any+one+wonder%2C+that+we+include+so+many+things+under+the+name+of+one+Christian+virtue%3B+for+as+a+person+speaking+of+life%2C+designs+to+express+by+that+word%2C+something%2C+that+diffusing+itself+throughout+the+whole+soul%2C+and+all+its+faculties%2C+is+communicated+also+to+the+body%2C+and+extends+itself+to+all+the+actions+of+a+living+person%3B+so%2C+when+we+speak+of+faith%2C+which+is+the+fruitful+fountain+of+the+whole%2C+spiritual+life%2C+we+would+have+that+understood+to+be+signified%2C+which+pervades+all+the+faculties%2C+and+is+exactly+calculated+to+unite+them+with+Christ%2C+and+thus+enliven%2C+sanctify+and+make+them+blessed.+We+must+observe+by+the+way%2C+that+amongst+those+acts+which+we+are+about+to+describe%2C+there+is+one+in+particular%2C+in+which+we+think+the+formal+reason+and+essence+of+faith%2C+so+far+as+it+unites+us+with+Christ+and+justifies+us%2C+consists.+And+this+is+to+be+carefully+observed+in+the+business+of+justification%2C+lest+any+one+should+look+upon+those+acts+of+charity+which+in+different+ways+are+connected+with+the+practice+of+faith%2C+as+the+causes+of+justification.+%E2%80%A6First%2C+That+which+faith+comprehends%2C+or+at+least+supposes%2C+is+a+knowledge+of+the+things+which+are+to+be+believed.+This%2C+in+contradiction+to+the+absurdity+of+the+Papists%2C+is+very+plain%2C+I+from+the+scriptures%3B+which+so+speak+of+faith%2C+as+manifestly+to+give+us+to+understand%2C+that+knowledge+is+included+in+the+very+idea%2C+as+well+as+the+practice+of+faith%2C+Isa.+53%3A11.+John+17%3A3.+compared+with+Hab.+2%3A4.+John+6%3A69.+2+Tim.+1%3A3.+II.+From+the+very+nature+of+faith%2C+which%2C+as+it+speaks+of+an+assent+given+to+a+truth+revealed+by+God%2C+and+that+without+any+doubting%2C+necessarily+presupposes+the+knowledge+of+these+two+things%2C+1.+That+God+has+revealed+something.+2.+What+that+something+is%2C+which+faith+assents+to+as+divinely+revealed.+For+to+say+that+a+person+assents+to+any+truth%2C+which+he+is+ignorant+of%2C+and+concerning+which%2C+he+knows+not+whether+there+be+any+testimony+extant+which+is+worthy+of+credit%2C+is+absurd.+%E2%80%A6To+this+knowledge+must+be+joined+an+assent%2C+which+is+the+second+act+of+faith%2C+by+which+a+person+receives+and+acknowledges+as+truths%2C+the+things+he+knows%2C+receiving+the+testimony+of+God%2C+and+thus+setting+to+his+seal+that+God+is+true%2C+John+3%3A33.+This+assent+is+most+especially+founded+upon+the+infallible+veracity+of+God%2C+who+beareth+testimony+of+himself+and+of+his+Son%2C+1+John+5%3A9%2C+10.+on+which+testimony+revealed+in+the+scriptures%2C+and+shedding+forth+all+around+the+rays+of+its+divinity%2C+the+faithful+soul+relies+with+no+less+safety%2C+than+if+it+had+actually+been+present+and+an+immediate+party+in+those+things+that+are+revealed.+For+when+the+soul+enlightened+by+the+Spirit+of+God%2C+perceives+those+divine+truths%2C+and+seeth+in+them+a+certain+divine+excellency%2C+and+a+most+wife+and+indissoluble+connection+of+the+whole%2C+it+cannot+but+assent+to+a+truth+which+forces+itself+upon+it+with+so+many+arguments%2C+and+as+securely+admits%2C+what+it+thus+knows%2C+for+certainty%2C+as+if+it+had+seen+it+with+its+own+eyes%2C+or+handled+it+with+its+hands%2C+or+had+been+taken+up+into+the+third+heaven%2C+and+heard+it+immediately+from+God.+Let+the+lust+of+the+flesh+murmur%2C+or+let+vain+sophists+argue+what+they+may%2C+though+perhaps+the+soul+may+not+be+able+to+answer+or+solve+all+objections%2C+it+still+persists+in+the+acknowledgment+of+this+truth%2C+which+it+sees+too+clearly%2C+and+has+heard+too+certainly%2C+as+it+were%2C+from+the+mouth+of+God%2C+ever+to+suffer+itself+to+be+drawn+away+from+it+by+any+sophistry.+I+have+not%2C+saith+the+believing+soul%2C+followed+cunningly+devised+fables+in+believing+the+power+and+coming+of+our+Lord+Jesus+Christ%2C+but%2C+in+the+spirit%2C+have+I+beheld+his+Majesty%2C+and+heard%2C+as+it+were%2C+his+voice+from+heaven%2C+2+Pet.+1%3A16%2C+18.+So+that+faith+is+accompanied+with+what+is+called+substance+and+evidence%2C+Heb.+11%3A1.+full+persuasion+or+plerophory%2C+Rom.+4%3A21.+Of+the+signification+of+which+words%2C+it+may+not+be+unuseful+to+consider+a+little.+%E2%80%A6+It+is+true+that+love%2C+strictly+speaking%2C+is+distinguished+from+faith%3B+but+nevertheless+the+acts+of+each+are+so+interwoven+with+one+another%2C+that+we+can+never+explain+nor+exercise+faith+without+some+acts+of+love+interfering.+This+is+an+observation+of+some+of+the+greatest+divines+before+me%2C+each+of+which+cites+that+saying+of+St.+Austin%E2%80%94What+is+it+to+believe+in+God%3F+by+believing+to+love.+%E2%80%A6+What+follows+this+hunger+and+thirst%2C+is+the+receiving+the+Lord+Christ+for+justification%2C+for+sanctification%2C+and+thus+for+complete+salvation%3A+and+this+is+the+fifth%2C+and+indeed+the+formal+and+chief+act+of+faith%2C+which+is+thus%E2%80%94the+heavenly+Father+freely+offers+the+Son%2C+Christ+the+Lord+freely+offers+Himself%2C+with+all+his+benefits%2C+and+fulness+of+salvation+which+resides+in+Him%2C+to+the+sick+and+weary+soul%2C+saying%2C+Is.+65%3A1.+Behold+me%21+behold+me%21+and+the+soul+now+conscious+of+its+own+misery%2C+considering+the+fulness+of+the+salvation+that+is+in+Christ%2C+with+joy+and+hope%2C+and+eagerly+desiring+communion+with+Him%2C+cannot+help+apprehending+and+receiving+so+great+a+good+offered+to+it%3B+and+thus+by+accepting+it%2C+makes+it+its+own%3A+by+this+act+Christ+is+made+the+peculiar+property+of+the+believing+soul%3B+so+that+whatever+is+Christ%E2%80%99s%2C+and+offered+together+with+Christ%2C+the+believer+claims+to+himself%3A+and+first%2C+of+all+the+righteousness+of+Christ%2C+which+is+the+foundation+of+salvation%2C+and+thus+by+apprehending+Christ%2C+is+united+to+Him.+The+believer+being+thus+united+to+Christ%2C+is+deemed+and+looked+upon+to+have+done+and+suffered%2C+whatever+things+Christ%2C+so+far+as+He+was+a+surety+did+and+suffered+in+his+stead.+Thus+it+is+easily+to+be+understood+in+what+manner+we+are+justified+by+faith+in+Christ.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+A+Treatise+on+Christian+Faith%2C+trans.+Martin+Madan+%28London%2C+1761%29%2C+%28pages+1%2C+2%2C+3%2C+7%2C+15%2C+18%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bae5fb453.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bae5fb453.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/06/witsius-on-aspects-of-true-faith/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>It is natural that those who have experienced the agitations which frequently attend upon conversion, and have felt the peace which flows from a hope of acceptance with God, to imagine that the conflict is over, the victory won, and the work of religion accomplished. This imagination is soon dissipated. Birth is not the whole of life; neither is conversion the whole of religion. A young mother may, in the fullness of her joy, forget for a moment that her vocation as a mother is but just begun; but when she looks upon her infant, so wonderful in its organization and instinct with an immortal spirit, the sight of its helplessness makes her feel how great a work she has still to do. An hour’s neglect might prove the ruin of her hopes. Thus the young Christian, although at first disposed to think that his work is finished, soon finds that the feeble principle of spiritual life needs to be watched and nourished with ceaseless care. If abandoned at its birth, it must perish as certainly and as speedily as an exposed infant.</p></blockquote>

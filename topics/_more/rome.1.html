<blockquote><p>The other things must be briefly dispatched; for otherwise we should never be able to get out of this forest. We shall merely mention a few of the alleged relics of saints who lived in the days of our Saviour, and then mention a few of those of the ancient martyrs and others. In this way my readers will be able to judge for themselves. Anna, mother of the Virgin Mary, has one of her bodies at Apte in Provence, and another in the church of Mary Insulan at Lyons. Besides, she has one of her hands at Treves, another at Turin, and a third in a town of Thuringia, which takes its name from it. I say nothing of the fragments which exist in more than a hundred places. Among others, I remember having myself, long ago, kissed a portion of it at Ursicampus, a monastery in the vicinity of Noyon, where it is held in great reverence. Lastly, another of her arms is in St Paul’s at Rome. Here, if it be possible, let some certainty be shown. We now come to Lazarus, and his sister the Magdalene. He, as far as I know, has only three bodies; one at Marseilles, another at Austum, a third at Avallon. Between these towns there was a great controversy, but after large sums were expended on both sides, they left the matter as it was, each continuing to maintain its claims. Magdalene being a female, it was necessary to make her inferior to her brother, and, therefore, she has only two bodies, one of which is at Vesoul, near Auxerre, and another, which is of greater renown, at San Maximin, a town of Provence, where also her head exists separately, together with what is called the Noli me tangere, which is a bit of wax, but is said to be the mark of a blow which our Saviour gave her in anger when she wished to touch him. I need not advert to the relics of her bones and hair, which are scattered over the world. Those who wish to know the certainty of all these things, should first inquire whether Lazarus, and his sisters Martha and Magdalene, ever came to France for the purpose of preaching the gospel. For if ancient history be read and examined with judgment, it will be seen that this is the most stupid of all fables, and has not the least shadow of plausibility. Yet the relics of Lazarus and Mary are the best authenticated relics of all. Be this as it may, was it not enough to pervert one body to idolatry, instead of proceeding, according to the common saying, to make three devils out of one? In like manner, they have given a place among their deities to him who pierced the side of our Lord when on the cross, and have called him Longinus, a puerile blunder certainly. This name in Greek signifies a spearman, but they have laid hold of it and converted it into the proper name of an individual. After thus naming him, they have given him two bodies, one of which is at Mantua, and the other at the church of Mary Insulan at Lyons. They have done the same with the Magians who came to worship Christ after his birth. And first they have fixed the number of them, maintaining that there were three only. The Gospel nowhere says how many there were, while some of the ancient doctors, for instance, the writer of an unfinished Commentary on Matthew, which is sometimes attributed to Chrysostom, affirms that there were fourteen. The Evangelist calls them Magians, that is, philosophers, but they have taken it upon them to give them royal dignity, though without kingdom or subjects. And lastly, they have given them names, calling the one Belthasar, the other Melchior, and the other Gaspar. However, if we may be permitted to interfere with their fables, it is most certain that these philosophers returned to the East. This the Scripture expressly declares; and there is no ground at all for any other belief than that they died there. Who was it that afterwards transferred them from those regions? Who knew them so well, that he could identify their bodies, for the purpose of being converted into relics? But I desist. It is foolish to engage in refuting such absurdities. All I say is, that the inhabitants of Cologne and of Milan should be left to litigate among themselves as to which of the two is to possess them. Both claim them, and it is impossible that both can be right. When once they bring their law-suit to a close, it will be time to see what should be done. Among ancient martyrs, Dionysius is particularly celebrated; for he is held to be a disciple of the Apostles, and the first evangelist of the French. On this account relics of him are preserved in many places, while his body exists entire in two places only, viz., St Denis and Ratisbon. Because the French claimed him exclusively to themselves, the people of Ratisbon raised an action against them at Rome about a hundred years ago, and the body was adjudged to them by a definitive sentence, while the Legate of France was personally present, and a very fine Bull to this effect was given to them. But should any person go to St Denis, which is in the neighbourhood of Paris, and deny that the body is there, he would be stoned. At the same time, should any one deny that it is at Ratisbon, he would be counted a heretic; for his denial would be rebellion against the Apostolic See. The prudent plan, therefore, will be not to meddle with their disputes. Let them tear out each other’s eyes if they will; the utmost they will gain will be to prove that the whole matter is a lie. The body of Stephen they have so dissected, that, though it is entire at Rome, in the church which bears his name, the head is at Arles, and bones are in more than two hundred places; while, as if to show their approval of those who put him to death, they have consecrated even the stones by which he was murdered. It will, perhaps, be asked how they could be identified, where they were found, and out of whose hands they were recovered? I give this short reply, that it is a foolish question. There could be no difficulty in finding them, wherever stones are found, and the carriage is not costly, as at Florence, at Arles, in the monastery of the Augustins, and at Vigeon, in Aquitaine. Any one who chooses to shut his eyes, and deprive himself of all understanding, will believe that they are the very stones that stoned Stephen; while he, again, who will give some little heed to the matter, will laugh. But assuredly the Carmelites of Poictiers, within the last fourteen years, possessed one to which they assigned the office of assisting women in labour, and easing their pains. The Dominicans, from whom one, destined like a pearl for the same purpose, had been stolen, had a mighty quarrel with them, and bawled out imposture; but the Carmelites, by fighting stoutly, came off victorious.</p></blockquote>

<blockquote><p>With regard to the Virgin Mary, as they give out that her body is not on the earth, they are of course prevented from pretending to have her bones; were it otherwise, I can well believe they would have given her a body of such a size as would suffice to fill a thousand sarcophaguses. What is denied with reference to the whole body, they have endeavoured to compensate by hair and milk. Some hairs are shown at Rome, in the church of Mary supra Minerva, at St Salvator’s in Spain, at Mascon, at Clugny, at Nocera, at Sanflor, at St James’s, and many other places. As to the milk, it cannot be necessary to enumerate all the places where it is shown. Indeed, the task would be endless, for there is no town, however small, no monastery or nunnery, however insignificant, which does not possess it, some in less, and others in greater quantities; not that they would have been ashamed to have it in hogsheads, but they thought the lie might be more plausible if they had only a small, quantity,—as much, for instance, as could be contained in a small gallipot or phial; for in this form it can be kept back from minute inspection. But had the breasts of the most Holy Virgin yielded a more copious supply than is given by a cow, or had she continued to nurse during her whole lifetime, she scarcely could have furnished the quantity which is exhibited. Again, I would fain know how that milk, which is at present almost everywhere exhibited, was collected, so as to be preserved until our time. We do not read of any person who had the curiosity to undertake the task. We read, indeed, that the shepherds worshipped Christ, and that the Magians presented gifts to him, but we nowhere read of her having given milk as a kind of return for their presents. Luke relates the prophecy which Simeon made to the Virgin; but he does not say that Simeon asked her to give him some milk. If the matter be only looked to, it will be unnecessary to offer any argument for the purpose of showing how utterly devoid of reason, and all appearance of probability, this wild dream is. It is strange how it never occurred to them to pare her nails, and get other things of that kind, when there was nothing else of the body they could get; but perhaps it was impossible for them to mind every thing. The other relics of the Virgin, which they boast of having, form part of her wardrobe and baggage. First, there is a shirt at Chartrain, which is a very celebrated object of idolatry, and there is another at Acqs in Germany. It is needless to ask where they found them; for it is most certain that the Apostles and other pious men were not so foolish as to occupy their minds with such frivolities. But let its form only be examined, and I will instantly succumb, if the imposture does not become visible even to the eye. At Acqs, where is one of the shirts we have mentioned, it is carried round in solemn state fastened to a pole, and is as long as a white surplice. Had the Virgin been of the race of the giants, I don’t believe she would have had so long a shirt. To give more importance to the exhibition, they, at the same time, produce shoes belonging to St Joseph, which would only fit a boy or a dwarf. There is an old proverb, “A liar should have a good memory.” That proverb has been little attended to here; for so short has been their memory, that they have forgotten to attend to the measure of the husband’s shoes and his wife’s shirt. Now, let them run about, and, with the greatest veneration, kiss their relics which have not the least semblance of being genuine. I know of only two gowns, one at Treves, in the church of St Maximin, and another at Lisia in Italy. I should like much to examine them, that it might be seen what kind of web they are made of, and whether it is such as the Jews of that period were wont to weave. I should like also that the two gowns were compared together, to ascertain whether there is any similarity between them. At Bonne there is a certain scarf. Some one will ask me if I think it is fictitious. I answer, that I have the same opinion of it that I have of the two girdles, the one of which is at Prague, and the other at St Iago of Montserrat, and also of the slipper which is at St James’s, and the shoe at Sanflor. But if there were no other objection, every person not absolutely sunk in ignorance is aware that the pious had no such custom as that of collecting shoes and sandals, in order to make relics of them, and that for 500 years after the Virgin’s decease not one of these things was ever heard of. What need, therefore, for farther discussion, as if the matter were at all doubtful? Nay, they have even thought proper to calumniate the most holy Virgin, by representing her as excessively careful about decking her person, and combing her hair; for they show two combs that belonged to her. One of them is in St Martin’s at Rome, the other in St John’s at Besançon. It is probable there are a great many more in other places. If this is not to hold up the holy Virgin to derision, I know not what derision is. Moreover, they have not forgotten her marriage-ring, which is to be seen at Perugia. Because it is now customary with us for the husband at marriage to present his bride with a ring, they have imagined, without making more inquiry about the matter, that it was customary also at that time. What they have adopted for this purpose is a beautiful ring of great value, never thinking of the great poverty in which the Virgin spent her life. Of her wardrobe, part is seen at Rome, in the church of Joannes Lateranensis, of St Barbara, of Mary supra Minerva, and part at Blois, and also at St Salvator’s in Spain; at least, they boast of having some fragments of them there. I have also heard other places mentioned, but they escape my memory. To detect the imposture, it were only necessary to inspect the texture of this clothing. They seem to have imagined it as easy for the Virgin to put herself in full dress, as it is for them to deck their idols, which they are ever and anon furnishing with new attire. It remains to speak of pictures—not pictures in general, but those which are specially celebrated for some singular quality. And, first, they pass off an imposture in the name of Luke, pretending that he painted four pictures of the Virgin, and that these are now at Rome. In the church of St Mary the Immaculate one of them is shown at the altar, where it is hung up, as they say, in devotion to her, together with the ring which Joseph gave her on her espousals. Another is shown at Rome also, in the church of Mary Nova, and is said to have been painted by Luke at Troas, and brought thither by an angel. Another is in the church of St Mary called Aracali, and is in the form of a cross. But at the church of St Augustine they give out that they have the most remarkable of all; for if they are to be credited, it is one which Luke carried constantly about with him, and even wished to be put into his coffin when he died. What blasphemy, I ask, to convert a holy evangelist of God into an impious idolator? And what pretence have they for holding that Luke was a painter? Paul calls him a physician, but on what grounds they assign to him skill in painting I have not the least idea. Even if it were true that he practised this art, it is not a whit more probable that he would have painted the Virgin than that he would have painted Jupiter or Venus, or any other idol. It certainly was not the practice at that period for Christians to have idols, nor was it introduced till long after, when the Church had been corrupted with superstition. Again, every comer of the globe is filled with pictures said to have been painted by Luke, as at Cambray, and many other places. And in what form? in such colours as one might be expected to employ in painting an abandoned woman. God hath so blinded them that they have shown no more consideration in this matter than the beasts that perish. However, it does not seem strange to me that they have attributed pictures of the Virgin to Luke, since they have practised similar imposition in the name of Jeremiah. Evidence of their impudence in this respect may be seen at Puteus, a town of Auvergne. Now, I should have thought it time for miserable men to open their eyes, and see through a matter so transparent. I say nothing of Joseph, though some are said to have his shoes, as at Treves, in the monastery of Simeon, and others to have his sandals, while to others are reserved his bones. The specimens already given should be a sufficient exposure of the absurdity. I must, however, add the case of the archangel Michael, and his attendance on the Virgin Mary. It will be thought I am in jest when I speak of the relics of an angel. Comedians and players have laughed at this, but monkish and priestly impostors have not, therefore, ceased to deceive the people in good earnest. For the inhabitants of Carcassone boast that they have relics belonging to him, as do also those of Tours, in their church of St Julian. In the great church of St Michael, which is frequented by crowds of pilgrims, they show his dagger, which looks very much like the one boys play with. They show also his shield, which in appearance exactly corresponds with the dagger, resembling the brass circles which are put upon horses’ harness. Assuredly there is no man and no old woman so dull as not to see how ridiculous those things are. But because the lies are covered with the veil of religion, the iniquity of thus deriding God and angels is not perceived. Some may here object the express declaration of Scripture, that Michael fought with the devil. True; but if the devil were to be vanquished, it behoved to be with a stronger and a sharper sword than that one. Are they so brutish as to imagine that the war which both angels and believers wage with devils is carnal, and carried on with daggers and sharp weapons? But it is just as I have observed before: mankind have richly deserved, by their brutish stupidity, to be so deceived, while with perverse eagerness they have gone about in all directions collecting idols and images, to which they might give worship, instead of giving it to the living God.</p></blockquote>

e+great+poverty+in+which+the+Virgin+spent+her+life.+Of+her+wardrobe%2C+part+is+seen+at+Rome%2C+in+the+church+of+Joannes+Lateranensis%2C+of+St+Barbara%2C+of+Mary+supra+Minerva%2C+and+part+at+Blois%2C+and+also+at+St+Salvator%E2%80%99s+in+Spain%3B+at+least%2C+they+boast+of+having+some+fragments+of+them+there.+I+have+also+heard+other+places+mentioned%2C+but+they+escape+my+memory.+To+detect+the+imposture%2C+it+were+only+necessary+to+inspect+the+texture+of+this+clothing.+They+seem+to+have+imagined+it+as+easy+for+the+Virgin+to+put+herself+in+full+dress%2C+as+it+is+for+them+to+deck+their+idols%2C+which+they+are+ever+and+anon+furnishing+with+new+attire.+It+remains+to+speak+of+pictures%E2%80%94not+pictures+in+general%2C+but+those+which+are+specially+celebrated+for+some+singular+quality.+And%2C+first%2C+they+pass+off+an+imposture+in+the+name+of+Luke%2C+pretending+that+he+painted+four+pictures+of+the+Virgin%2C+and+that+these+are+now+at+Rome.+In+the+church+of+St+Mary+the+Immaculate+one+of+them+is+shown+at+the+altar%2C+where+it+is+hung+up%2C+as+they+say%2C+in+devotion+to+her%2C+together+with+the+ring+which+Joseph+gave+her+on+her+espousals.+Another+is+shown+at+Rome+also%2C+in+the+church+of+Mary+Nova%2C+and+is+said+to+have+been+painted+by+Luke+at+Troas%2C+and+brought+thither+by+an+angel.+Another+is+in+the+church+of+St+Mary+called+Aracali%2C+and+is+in+the+form+of+a+cross.+But+at+the+church+of+St+Augustine+they+give+out+that+they+have+the+most+remarkable+of+all%3B+for+if+they+are+to+be+credited%2C+it+is+one+which+Luke+carried+constantly+about+with+him%2C+and+even+wished+to+be+put+into+his+coffin+when+he+died.+What+blasphemy%2C+I+ask%2C+to+convert+a+holy+evangelist+of+God+into+an+impious+idolator%3F+And+what+pretence+have+they+for+holding+that+Luke+was+a+painter%3F+Paul+calls+him+a+physician%2C+but+on+what+grounds+they+assign+to+him+skill+in+painting+I+have+not+the+least+idea.+Even+if+it+were+true+that+he+practised+this+art%2C+it+is+not+a+whit+more+probable+that+he+would+have+painted+the+Virgin+than+that+he+would+have+painted+Jupiter+or+Venus%2C+or+any+other+idol.+It+certainly+was+not+the+practice+at+that+period+for+Christians+to+have+idols%2C+nor+was+it+introduced+till+long+after%2C+when+the+Church+had+been+corrupted+with+superstition.+Again%2C+every+comer+of+the+globe+is+filled+with+pictures+said+to+have+been+painted+by+Luke%2C+as+at+Cambray%2C+and+many+other+places.+And+in+what+form%3F+in+such+colours+as+one+might+be+expected+to+employ+in+painting+an+abandoned+woman.+God+hath+so+blinded+them+that+they+have+shown+no+more+consideration+in+this+matter+than+the+beasts+that+perish.+However%2C+it+does+not+seem+strange+to+me+that+they+have+attributed+pictures+of+the+Virgin+to+Luke%2C+since+they+have+practised+similar+imposition+in+the+name+of+Jeremiah.+Evidence+of+their+impudence+in+this+respect+may+be+seen+at+Puteus%2C+a+town+of+Auvergne.+Now%2C+I+should+have+thought+it+time+for+miserable+men+to+open+their+eyes%2C+and+see+through+a+matter+so+transparent.+I+say+nothing+of+Joseph%2C+though+some+are+said+to+have+his+shoes%2C+as+at+Treves%2C+in+the+monastery+of+Simeon%2C+and+others+to+have+his+sandals%2C+while+to+others+are+reserved+his+bones.+The+specimens+already+given+should+be+a+sufficient+exposure+of+the+absurdity.+I+must%2C+however%2C+add+the+case+of+the+archangel+Michael%2C+and+his+attendance+on+the+Virgin+Mary.+It+will+be+thought+I+am+in+jest+when+I+speak+of+the+relics+of+an+angel.+Comedians+and+players+have+laughed+at+this%2C+but+monkish+and+priestly+impostors+have+not%2C+therefore%2C+ceased+to+deceive+the+people+in+good+earnest.+For+the+inhabitants+of+Carcassone+boast+that+they+have+relics+belonging+to+him%2C+as+do+also+those+of+Tours%2C+in+their+church+of+St+Julian.+In+the+great+church+of+St+Michael%2C+which+is+frequented+by+crowds+of+pilgrims%2C+they+show+his+dagger%2C+which+looks+very+much+like+the+one+boys+play+with.+They+show+also+his+shield%2C+which+in+appearance+exactly+corresponds+with+the+dagger%2C+resembling+the+brass+circles+which+are+put+upon+horses%E2%80%99+harness.+Assuredly+there+is+no+man+and+no+old+woman+so+dull+as+not+to+see+how+ridiculous+those+things+are.+But+because+the+lies+are+covered+with+the+veil+of+religion%2C+the+iniquity+of+thus+deriding+God+and+angels+is+not+perceived.+Some+may+here+object+the+express+declaration+of+Scripture%2C+that+Michael+fought+with+the+devil.+True%3B+but+if+the+devil+were+to+be+vanquished%2C+it+behoved+to+be+with+a+stronger+and+a+sharper+sword+than+that+one.+Are+they+so+brutish+as+to+imagine+that+the+war+which+both+angels+and+believers+wage+with+devils+is+carnal%2C+and+carried+on+with+daggers+and+sharp+weapons%3F+But+it+is+just+as+I+have+observed+before%3A+mankind+have+richly+deserved%2C+by+their+brutish+stupidity%2C+to+be+so+deceived%2C+while+with+perverse+eagerness+they+have+gone+about+in+all+directions+collecting+idols+and+images%2C+to+which+they+might+give+worship%2C+instead+of+giving+it+to+the+living+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+316%E2%80%93321&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e52676006.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e52676006.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-9/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>For to convince all men how little credit is due to the proofs which they adduce in support of their relics, it is to be observed, that the chief and most authentic of those which are seen at Rome are said to have been brought thither by Titus and Vespasian. This fiction is hot a whit more ingenious than if it were said that the Grand Turk went to Jerusalem in order that he might bring the cross of Christ to Constantinople. Vespasian, before he became Emperor, subdued and laid waste a part of Judea. Afterwards, when he had obtained the empire, his son Titus, whom he had left in command, took Jerusalem. Now, both of them were heathens, and cared no more for Christ than if he had never been born. In the same way, we may judge whether, in alleging that Godfrey of Boulogne, or King Louis, brought these relics, they have not lied with equal effrontery as when they said it was Vespasian. Besides, let it be considered what kind of judgment was displayed by that king to whom they give the name of St Louis, and by others like him. They had, no doubt, a semblance of religion, and a zeal, such as it was, for the propagation of the Christian name. But if the droppings of goats had been shown them, and they been told at the same time that they were the Virgin Mary’s beads, they would have worshipped them at once, without ever debating the matter, and would have sent ships to transport them to any place where they were to be set up and honoured. It cannot be denied they wasted both their resources and their bodily strength, and also spent a goodly part of their revenues in bringing back a heap of indescribable trifles and toys, by which the minds of men were so fascinated as to regard them as most valuable jewels. To give a clearer illustration of the fact, I may observe, that throughout the whole of Greece, Asia Minor, and Mauritania, and the whole of those countries which go under the name of the Indies, all the antique relics which our idolaters imagine that they possess here are there exhibited with the greatest confidence. How are we to decide between these two parties? Our people say that the relics were brought away from those places. The Christians who are living there affirm that they still possess them, and deride our foolish boasting. How can the dispute be decided without investigation—investigation, however, which cannot, and never will, be made? The only remedy is to despise both, and leave the matter as it is, in statu quo. The last class of relics belonging to Christ are those which relate to events subsequent to his resurrection; e. g. the piece of broiled fish which Peter offered to him when he appeared on the sea-shore. It must have been wondrously well salted if it has kept for such a long series of ages! But, jesting apart, is it supposable that the apostles made relics of what they had actually prepared for dinner? Whoever does not perceive that the whole matter is an open mockery of God, I must leave as unworthy of being farther addressed on the subject. Then we have the miraculous blood which has flowed from many of the hosts at mass; as at Paris, in the church of John Arenarius, and also in that of John the Angel; as also at Dijon, and many other places. And, in order to enlarge the heap, they have added the impious knife with which the host was stabbed at Paris by a certain Jew. This knife the Parisians regard with greater veneration than the host itself. When Doctor à Quercus, who held the cure of St John Arenarius, found that the donations made to this host stood in his way, (his gains being diminished in proportion to what the knife received,) he indignantly exclaimed, that they were worse than the Jews, inasmuch as they were worshipping a knife which had been the instrument of violating the sacred body of Christ. I have adduced this instance, because the exclamation would equally apply to the spear, the nails, and the crown of thorns; all who adore them being, in the opinion of Master à Quercus, more impious than the Jews by whom Christ was crucified. In like manner are shown the prints of his feet in a place where he is said to have appeared to several individuals after his ascension, as at Rome, in the church of St Lawrence, at the spot where he is said to have appeared to Peter, and foretold him that he was to suffer at Rome. Another of these foot-marks is to be seen at Poictiers, in the church of Arabegend, another at Soissons, and another at Arles. I deny not that Christ could have left the mark of his foot upon a stone. I only deny the allegation of his having actually done so. In the absence of all proper proof, I maintain that the whole ought to be regarded as a mere fable. But the most admirable specimen of this description of relics is the impression of his hips, which is seen at Rheims, on a stone behind the altar, and is said to have been left at the time when our Saviour turned mason, in order that he might build the vestibule of that church. The blasphemy is so execrable, that I am almost ashamed to mention it. To proceed, let us now attend to what is said of images, I mean not those which are usually made by painters, sculptors, and artists—(the number of these is infinite;)—but of those which possess some special claim to respect, and are regarded as singular and precious, as being of the nature of relics. Of these there are two kinds; for some have been miraculously formed, as that which is shown at Rome, in the portico of the church of St Mary. There is another also in the church of Joannes Lateranensis; and another, in which there is a picture of our Lord, said to have been taken at the time when he was twelve years old. There is also another at Lucca, which they say was painted by angels, and is called “The Holy Countenance.” These follies are so absurd, that I would lose my pains, and feel I was absurdly wasting my time, were I to dwell upon them. It is sufficient, therefore, merely to have noticed them in passing; for everybody knows that painting is not at all an office which belongs to angels, and that the means by which our Lord wished to make himself known, and imprinted on our memory, was very different from lifeless images. Eusebius relates, in his Ecclesiastical History, that our Saviour sent his picture, painted to the life, to King Abgarus; and this is somewhat more certain than a fiction taken from the Chronicles of Milan. But though the fact were so, how came they to obtain it from King Abgarus? It is said to be at Rome; but Eusebius says not that it was in existence up to his day. He only speaks by hearsay, as of a thing which had occurred long before. Is it to be believed, that it was brought to light six or seven hundred years after; and, quitting Persia, travelled as far as Rome? Pictures of the cross have been fabricated in the same way as those of our Saviour’s person. It is given out at Brescia, that they have the very cross that appeared to Constantine. I will not dispute the matter with them; I only send them to the Cortonians, who firmly maintain that they possess it. Let them litigate the matter between themselves, and then let the one who gains his plea come forward, and we will give him his answer. Indeed, it is not difficult to find an answer that will convict them all of folly. For when some writers say that a cross appeared to Constantine, they mean not a material cross, but the figure of a cross which was exhibited to him by a visible representation in the sky. Therefore, although the fact were true, it is clear that they have fallen into a very stupid blunder, and reared up their imposture without giving it the shadow of a foundation. But there is a second species of images which are regarded as relics, in consequence of certain services which they have performed. To this class of images belong crucifixes, on which the beard grows; for instance, one at Burgos in Spain, another in the church of St Salvator, and another in that of Aurengia. Were I to dwell upon this for the purpose of demonstrating what folly, or rather brutish stupidity, it is to believe such a thing, I should make myself ridiculous. The whole matter is so absurd in itself, that it cannot be at all necessary to spend time in refuting it, and yet the wretched populace are so dull, that the great majority of them think it just as certain as the gospel. With these, also, I class those crucifixes which have spoken, and of which there is a great multitude. But let us content ourselves with one, by way of example, viz., the one which is at St Denis in France. It spoke, they say, when it testified that the Church was dedicated. Leaving others to consider how far the importance of the matter called for such utterance, I only ask how an image of the cross could have been in the Church at that time, when, according to the custom used at dedications, all the images are removed from the Church? How did it manage to steal away and conceal itself, so as not to be removed with the rest? We see how easy a matter they must suppose it is to deceive the world, since they care not how much they contradict themselves, but deem it enough to belch forth their lies with open mouth, giving themselves no concern about any objections that might be urged. Lastly, we have got tears also; one, for instance, at Vindon, another at Treves, in the church of St Maximin, another at Orleans, in the church of Peter Puellare, besides many which are unknown to me. Some of these are said to be natural tears, as the one at St Maximin; for, according to their chronicle, our Lord let it fall when he was washing the disciples’ feet. Others are miraculous, as if it were to be believed that crucifixes of wood had so much feeling in them that they could shed tears. But we must pardon them this fault; they were ashamed to think that their images could do less than had been done by those of the heathen. The heathen pretended that their idols occasionally wept, and these crucifixes, therefore, must receive the same right, and be put on an equal footing!</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For to convince all men how little credit is due to the proofs which they adduce in support of their relics, it is to be observed, that the chief and most authentic of those which are seen at Rome are said to have been brought thither by Titus and Vespasian. This fiction is hot a whit more ingenious than if it were said that the Grand Turk went to Jerusalem in order that he might bring the cross of Christ to Constantinople. Vespasian, before he became Emperor, subdued and laid waste a part of Judea. Afterwards, when he had obtained the empire, his son Titus, whom he had left in command, took Jerusalem. Now, both of them were heathens, and cared no more for Christ than if he had never been born. In the same way, we may judge whether, in alleging that Godfrey of Boulogne, or King Louis, brought these relics, they have not lied with equal effrontery as when they said it was Vespasian. Besides, let it be considered what kind of judgment was displayed by that king to whom they give the name of St Louis, and by others like him. They had, no doubt, a semblance of religion, and a zeal, such as it was, for the propagation of the Christian name. But if the droppings of goats had been shown them, and they been told at the same time that they were the Virgin Mary’s beads, they would have worshipped them at once, without ever debating the matter, and would have sent ships to transport them to any place where they were to be set up and honoured. It cannot be denied they wasted both their resources and their bodily strength, and also spent a goodly part of their revenues in bringing back a heap of indescribable trifles and toys, by which the minds of men were so fascinated as to regard them as most valuable jewels. To give a clearer illustration of the fact, I may observe, that throughout the whole of Greece, Asia Minor, and Mauritania, and the whole of those countries which go under the name of the Indies, all the antique relics which our idolaters imagine that they possess here are there exhibited with the greatest confidence. How are we to decide between these two parties? Our people say that the relics were brought away from those places. The Christians who are living there affirm that they still possess them, and deride our foolish boasting. How can the dispute be decided without investigation—investigation, however, which cannot, and never will, be made? The only remedy is to despise both, and leave the matter as it is, in statu quo. The last class of relics belonging to Christ are those which relate to events subsequent to his resurrection; e. g. the piece of broiled fish which Peter offered to him when he appeared on the sea-shore. It must have been wondrously well salted if it has kept for such a long series of ages! But, jesting apart, is it supposable that the apostles made relics of what they had actually prepared for dinner? Whoever does not perceive that the whole matter is an open mockery of God, I must leave as unworthy of being farther addressed on the subject. Then we have the miraculous blood which has flowed from many of the hosts at mass; as at Paris, in the church of John Arenarius, and also in that of John the Angel; as also at Dijon, and many other places. And, in order to enlarge the heap, they have added the impious knife with which the host was stabbed at Paris by a certain Jew. This knife the Parisians regard with greater veneration than the host itself. When Doctor à Quercus, who held the cure of St John Arenarius, found that the donations made to this host stood in his way, (his gains being diminished in proportion to what the knife received,) he indignantly exclaimed, that they were worse than the Jews, inasmuch as they were worshipping a knife which had been the instrument of violating the sacred body of Christ. I have adduced this instance, because the exclamation would equally apply to the spear, the nails, and the crown of thorns; all who adore them being, in the opinion of Master à Quercus, more impious than the Jews by whom Christ was crucified. In like manner are shown the prints of his feet in a place where he is said to have appeared to several individuals after his ascension, as at Rome, in the church of St Lawrence, at the spot where he is said to have appeared to Peter, and foretold him that he was to suffer at Rome. Another of these foot-marks is to be seen at Poictiers, in the church of Arabegend, another at Soissons, and another at Arles. I deny not that Christ could have left the mark of his foot upon a stone. I only deny the allegation of his having actually done so. In the absence of all proper proof, I maintain that the whole ought to be regarded as a mere fable. But the most admirable specimen of this description of relics is the impression of his hips, which is seen at Rheims, on a stone behind the altar, and is said to have been left at the time when our Saviour turned mason, in order that he might build the vestibule of that church. The blasphemy is so execrable, that I am almost ashamed to mention it. To proceed, let us now attend to what is said of images, I mean not those which are usually made by painters, sculptors, and artists—(the number of these is infinite;)—but of those which possess some special claim to respect, and are regarded as singular and precious, as being of the nature of relics. Of these there are two kinds; for some have been miraculously formed, as that which is shown at Rome, in the portico of the church of St Mary. There is another also in the church of Joannes Lateranensis; and another, in which there is a picture of our Lord, said to have been taken at the time when he was twelve years old. There is also another at Lucca, which they say was painted by angels, and is called “The Holy Countenance.” These follies are so absurd, that I would lose my pains, and feel I was absurdly wasting my time, were I to dwell upon them. It is sufficient, therefore, merely to have noticed them in passing; for everybody knows that painting is not at all an office which belongs to angels, and that the means by which our Lord wished to make himself known, and imprinted on our memory, was very different from lifeless images. Eusebius relates, in his Ecclesiastical History, that our Saviour sent his picture, painted to the life, to King Abgarus; and this is somewhat more certain than a fiction taken from the Chronicles of Milan. But though the fact were so, how came they to obtain it from King Abgarus? It is said to be at Rome; but Eusebius says not that it was in existence up to his day. He only speaks by hearsay, as of a thing which had occurred long before. Is it to be believed, that it was brought to light six or seven hundred years after; and, quitting Persia, travelled as far as Rome? Pictures of the cross have been fabricated in the same way as those of our Saviour’s person. It is given out at Brescia, that they have the very cross that appeared to Constantine. I will not dispute the matter with them; I only send them to the Cortonians, who firmly maintain that they possess it. Let them litigate the matter between themselves, and then let the one who gains his plea come forward, and we will give him his answer. Indeed, it is not difficult to find an answer that will convict them all of folly. For when some writers say that a cross appeared to Constantine, they mean not a material cross, but the figure of a cross which was exhibited to him by a visible representation in the sky. Therefore, although the fact were true, it is clear that they have fallen into a very stupid blunder, and reared up their imposture without giving it the shadow of a foundation. But there is a second species of images which are regarded as relics, in consequence of certain services which they have performed. To this class of images belong crucifixes, on which the beard grows; for instance, one at Burgos in Spain, another in the church of St Salvator, and another in that of Aurengia. Were I to dwell upon this for the purpose of demonstrating what folly, or rather brutish stupidity, it is to believe such a thing, I should make myself ridiculous. The whole matter is so absurd in itself, that it cannot be at all necessary to spend time in refuting it, and yet the wretched populace are so dull, that the great majority of them think it just as certain as the gospel. With these, also, I class those crucifixes which have spoken, and of which there is a great multitude. But let us content ourselves with one, by way of example, viz., the one which is at St Denis in France. It spoke, they say, when it testified that the Church was dedicated. Leaving others to consider how far the importance of the matter called for such utterance, I only ask how an image of the cross could have been in the Church at that time, when, according to the custom used at dedications, all the images are removed from the Church? How did it manage to steal away and conceal itself, so as not to be removed with the rest? We see how easy a matter they must suppose it is to deceive the world, since they care not how much they contradict themselves, but deem it enough to belch forth their lies with open mouth, giving themselves no concern about any objections that might be urged. Lastly, we have got tears also; one, for instance, at Vindon, another at Treves, in the church of St Maximin, another at Orleans, in the church of Peter Puellare, besides many which are unknown to me. Some of these are said to be natural tears, as the one at St Maximin; for, according to their chronicle, our Lord let it fall when he was washing the disciples’ feet. Others are miraculous, as if it were to be believed that crucifixes of wood had so much feeling in them that they could shed tears. But we must pardon them this fault; they were ashamed to think that their images could do less than had been done by those of the heathen. The heathen pretended that their idols occasionally wept, and these crucifixes, therefore, must receive the same right, and be put on an equal footing!”

— John Calvin, An Admonition Showing the Advantages Which Christendom Might Derive From an Inventory of Relics, Vol. 1 | Edinburgh: Calvin Translation Society, 1844, pp. 312–16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+to+convince+all+men+how+little+credit+is+due+to+the+proofs+which+they+adduce+in+support+of+their+relics%2C+it+is+to+be+observed%2C+that+the+chief+and+most+authentic+of+those+which+are+seen+at+Rome+are+said+to+have+been+brought+thither+by+Titus+and+Vespasian.+This+fiction+is+hot+a+whit+more+ingenious+than+if+it+were+said+that+the+Grand+Turk+went+to+Jerusalem+in+order+that+he+might+bring+the+cross+of+Christ+to+Constantinople.+Vespasian%2C+before+he+became+Emperor%2C+subdued+and+laid+waste+a+part+of+Judea.+Afterwards%2C+when+he+had+obtained+the+empire%2C+his+son+Titus%2C+whom+he+had+left+in+command%2C+took+Jerusalem.+Now%2C+both+of+them+were+heathens%2C+and+cared+no+more+for+Christ+than+if+he+had+never+been+born.+In+the+same+way%2C+we+may+judge+whether%2C+in+alleging+that+Godfrey+of+Boulogne%2C+or+King+Louis%2C+brought+these+relics%2C+they+have+not+lied+with+equal+effrontery+as+when+they+said+it+was+Vespasian.+Besides%2C+let+it+be+considered+what+kind+of+judgment+was+displayed+by+that+king+to+whom+they+give+the+name+of+St+Louis%2C+and+by+others+like+him.+They+had%2C+no+doubt%2C+a+semblance+of+religion%2C+and+a+zeal%2C+such+as+it+was%2C+for+the+propagation+of+the+Christian+name.+But+if+the+droppings+of+goats+had+been+shown+them%2C+and+they+been+told+at+the+same+time+that+they+were+the+Virgin+Mary%E2%80%99s+beads%2C+they+would+have+worshipped+them+at+once%2C+without+ever+debating+the+matter%2C+and+would+have+sent+ships+to+transport+them+to+any+place+where+they+were+to+be+set+up+and+honoured.+It+cannot+be+denied+they+wasted+both+their+resources+and+their+bodily+strength%2C+and+also+spent+a+goodly+part+of+their+revenues+in+bringing+back+a+heap+of+indescribable+trifles+and+toys%2C+by+which+the+minds+of+men+were+so+fascinated+as+to+regard+them+as+most+valuable+jewels.+To+give+a+clearer+illustration+of+the+fact%2C+I+may+observe%2C+that+throughout+the+whole+of+Greece%2C+Asia+Minor%2C+and+Mauritania%2C+and+the+whole+of+those+countries+which+go+under+the+name+of+the+Indies%2C+all+the+antique+relics+which+our+idolaters+imagine+that+they+possess+here+are+there+exhibited+with+the+greatest+confidence.+How+are+we+to+decide+between+these+two+parties%3F+Our+people+say+that+the+relics+were+brought+away+from+those+places.+The+Christians+who+are+living+there+affirm+that+they+still+possess+them%2C+and+deride+our+foolish+boasting.+How+can+the+dispute+be+decided+without+investigation%E2%80%94investigation%2C+however%2C+which+cannot%2C+and+never+will%2C+be+made%3F+The+only+remedy+is+to+despise+both%2C+and+leave+the+matter+as+it+is%2C+in+statu+quo.+The+last+class+of+relics+belonging+to+Christ+are+those+which+relate+to+events+subsequent+to+his+resurrection%3B+e.+g.+the+piece+of+broiled+fish+which+Peter+offered+to+him+when+he+appeared+on+the+sea-shore.+It+must+have+been+wondrously+well+salted+if+it+has+kept+for+such+a+long+series+of+ages%21+But%2C+jesting+apart%2C+is+it+supposable+that+the+apostles+made+relics+of+what+they+had+actually+prepared+for+dinner%3F+Whoever+does+not+perceive+that+the+whole+matter+is+an+open+mockery+of+God%2C+I+must+leave+as+unworthy+of+being+farther+addressed+on+the+subject.+Then+we+have+the+miraculous+blood+which+has+flowed+from+many+of+the+hosts+at+mass%3B+as+at+Paris%2C+in+the+church+of+John+Arenarius%2C+and+also+in+that+of+John+the+Angel%3B+as+also+at+Dijon%2C+and+many+other+places.+And%2C+in+order+to+enlarge+the+heap%2C+they+have+added+the+impious+knife+with+which+the+host+was+stabbed+at+Paris+by+a+certain+Jew.+This+knife+the+Parisians+regard+with+greater+veneration+than+the+host+itself.+When+Doctor+%C3%A0+Quercus%2C+who+held+the+cure+of+St+John+Arenarius%2C+found+that+the+donations+made+to+this+host+stood+in+his+way%2C+%28his+gains+being+diminished+in+proportion+to+what+the+knife+received%2C%29+he+indignantly+exclaimed%2C+that+they+were+worse+than+the+Jews%2C+inasmuch+as+they+were+worshipping+a+knife+which+had+been+the+instrument+of+violating+the+sacred+body+of+Christ.+I+have+adduced+this+instance%2C+because+the+exclamation+would+equally+apply+to+the+spear%2C+the+nails%2C+and+the+crown+of+thorns%3B+all+who+adore+them+being%2C+in+the+opinion+of+Master+%C3%A0+Quercus%2C+more+impious+than+the+Jews+by+whom+Christ+was+crucified.+In+like+manner+are+shown+the+prints+of+his+feet+in+a+place+where+he+is+said+to+have+appeared+to+several+individuals+after+his+ascension%2C+as+at+Rome%2C+in+the+church+of+St+Lawrence%2C+at+the+spot+where+he+is+said+to+have+appeared+to+Peter%2C+and+foretold+him+that+he+was+to+suffer+at+Rome.+Another+of+these+foot-marks+is+to+be+seen+at+Poictiers%2C+in+the+church+of+Arabegend%2C+another+at+Soissons%2C+and+another+at+Arles.+I+deny+not+that+Christ+could+have+left+the+mark+of+his+foot+upon+a+stone.+I+only+deny+the+allegation+of+his+having+actually+done+so.+In+the+absence+of+all+proper+proof%2C+I+maintain+that+the+whole+ought+to+be+regarded+as+a+mere+fable.+But+the+most+admirable+specimen+of+this+description+of+relics+is+the+impression+of+his+hips%2C+which+is+seen+at+Rheims%2C+on+a+stone+behind+the+altar%2C+and+is+said+to+have+been+left+at+the+time+when+our+Saviour+turned+mason%2C+in+order+that+he+might+build+the+vestibule+of+that+church.+The+blasphemy+is+so+execrable%2C+that+I+am+almost+ashamed+to+mention+it.+To+proceed%2C+let+us+now+attend+to+what+is+said+of+images%2C+I+mean+not+those+which+are+usually+made+by+painters%2C+sculptors%2C+and+artists%E2%80%94%28the+number+of+these+is+infinite%3B%29%E2%80%94but+of+those+which+possess+some+special+claim+to+respect%2C+and+are+regarded+as+singular+and+precious%2C+as+being+of+the+nature+of+relics.+Of+these+there+are+two+kinds%3B+for+some+have+been+miraculously+formed%2C+as+that+which+is+shown+at+Rome%2C+in+the+portico+of+the+church+of+St+Mary.+There+is+another+also+in+the+church+of+Joannes+Lateranensis%3B+and+another%2C+in+which+there+is+a+picture+of+our+Lord%2C+said+to+have+been+taken+at+the+time+when+he+was+twelve+years+old.+There+is+also+another+at+Lucca%2C+which+they+say+was+painted+by+angels%2C+and+is+called+%E2%80%9CThe+Holy+Countenance.%E2%80%9D+These+follies+are+so+absurd%2C+that+I+would+lose+my+pains%2C+and+feel+I+was+absurdly+wasting+my+time%2C+were+I+to+dwell+upon+them.+It+is+sufficient%2C+therefore%2C+merely+to+have+noticed+them+in+passing%3B+for+everybody+knows+that+painting+is+not+at+all+an+office+which+belongs+to+angels%2C+and+that+the+means+by+which+our+Lord+wished+to+make+himself+known%2C+and+imprinted+on+our+memory%2C+was+very+different+from+lifeless+images.+Eusebius+relates%2C+in+his+Ecclesiastical+History%2C+that+our+Saviour+sent+his+picture%2C+painted+to+the+life%2C+to+King+Abgarus%3B+and+this+is+somewhat+more+certain+than+a+fiction+taken+from+the+Chronicles+of+Milan.+But+though+the+fact+were+so%2C+how+came+they+to+obtain+it+from+King+Abgarus%3F+It+is+said+to+be+at+Rome%3B+but+Eusebius+says+not+that+it+was+in+existence+up+to+his+day.+He+only+speaks+by+hearsay%2C+as+of+a+thing+which+had+occurred+long+before.+Is+it+to+be+believed%2C+that+it+was+brought+to+light+six+or+seven+hundred+years+after%3B+and%2C+quitting+Persia%2C+travelled+as+far+as+Rome%3F+Pictures+of+the+cross+have+been+fabricated+in+the+same+way+as+those+of+our+Saviour%E2%80%99s+person.+It+is+given+out+at+Brescia%2C+that+they+have+the+very+cross+that+appeared+to+Constantine.+I+will+not+dispute+the+matter+with+them%3B+I+only+send+them+to+the+Cortonians%2C+who+firmly+maintain+that+they+possess+it.+Let+them+litigate+the+matter+between+themselves%2C+and+then+let+the+one+who+gains+his+plea+come+forward%2C+and+we+will+give+him+his+answer.+Indeed%2C+it+is+not+difficult+to+find+an+answer+that+will+convict+them+all+of+folly.+For+when+some+writers+say+that+a+cross+appeared+to+Constantine%2C+they+mean+not+a+material+cross%2C+but+the+figure+of+a+cross+which+was+exhibited+to+him+by+a+visible+representation+in+the+sky.+Therefore%2C+although+the+fact+were+true%2C+it+is+clear+that+they+have+fallen+into+a+very+stupid+blunder%2C+and+reared+up+their+imposture+without+giving+it+the+shadow+of+a+foundation.+But+there+is+a+second+species+of+images+which+are+regarded+as+relics%2C+in+consequence+of+certain+services+which+they+have+performed.+To+this+class+of+images+belong+crucifixes%2C+on+which+the+beard+grows%3B+for+instance%2C+one+at+Burgos+in+Spain%2C+another+in+the+church+of+St+Salvator%2C+and+another+in+that+of+Aurengia.+Were+I+to+dwell+upon+this+for+the+purpose+of+demonstrating+what+folly%2C+or+rather+brutish+stupidity%2C+it+is+to+believe+such+a+thing%2C+I+should+make+myself+ridiculous.+The+whole+matter+is+so+absurd+in+itself%2C+that+it+cannot+be+at+all+necessary+to+spend+time+in+refuting+it%2C+and+yet+the+wretched+populace+are+so+dull%2C+that+the+great+majority+of+them+think+it+just+as+certain+as+the+gospel.+With+these%2C+also%2C+I+class+those+crucifixes+which+have+spoken%2C+and+of+which+there+is+a+great+multitude.+But+let+us+content+ourselves+with+one%2C+by+way+of+example%2C+viz.%2C+the+one+which+is+at+St+Denis+in+France.+It+spoke%2C+they+say%2C+when+it+testified+that+the+Church+was+dedicated.+Leaving+others+to+consider+how+far+the+importance+of+the+matter+called+for+such+utterance%2C+I+only+ask+how+an+image+of+the+cross+could+have+been+in+the+Church+at+that+time%2C+when%2C+according+to+the+custom+used+at+dedications%2C+all+the+images+are+removed+from+the+Church%3F+How+did+it+manage+to+steal+away+and+conceal+itself%2C+so+as+not+to+be+removed+with+the+rest%3F+We+see+how+easy+a+matter+they+must+suppose+it+is+to+deceive+the+world%2C+since+they+care+not+how+much+they+contradict+themselves%2C+but+deem+it+enough+to+belch+forth+their+lies+with+open+mouth%2C+giving+themselves+no+concern+about+any+objections+that+might+be+urged.+Lastly%2C+we+have+got+tears+also%3B+one%2C+for+instance%2C+at+Vindon%2C+another+at+Treves%2C+in+the+church+of+St+Maximin%2C+another+at+Orleans%2C+in+the+church+of+Peter+Puellare%2C+besides+many+which+are+unknown+to+me.+Some+of+these+are+said+to+be+natural+tears%2C+as+the+one+at+St+Maximin%3B+for%2C+according+to+their+chronicle%2C+our+Lord+let+it+fall+when+he+was+washing+the+disciples%E2%80%99+feet.+Others+are+miraculous%2C+as+if+it+were+to+be+believed+that+crucifixes+of+wood+had+so+much+feeling+in+them+that+they+could+shed+tears.+But+we+must+pardon+them+this+fault%3B+they+were+ashamed+to+think+that+their+images+could+do+less+than+had+been+done+by+those+of+the+heathen.+The+heathen+pretended+that+their+idols+occasionally+wept%2C+and+these+crucifixes%2C+therefore%2C+must+receive+the+same+right%2C+and+be+put+on+an+equal+footing%21%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+312%E2%80%9316&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F611521ed8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/611521ed8f.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-8/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>[T]he bishop of Rome is Peter’s successor, not in teaching but in denying Christ.</p></blockquote>

</figure><figure class="quote" id="q-6535fb12f8" data-kw="">
<blockquote><p>XI. Mary is rightly called the Mother of God (theotokos) in the concrete and specifically because she brought forth him who is also God, but not in the abstract and reduplicatively as God. Although this is not expressly stated in the Scriptures, still it is sufficiently intimated when she is called the mother of the Lord (Lk. 1:43) and the mother of Immanuel. If the blessed virgin brought nothing to the person of the Logos (Logou) absolutely considered, still she can be said to have brought something to the person of the incarnate Logos (Logou) economically considered, inasmuch as she gave the human nature which he took into the unity of person. XII. The title Mother of God given to the virgin was perverted by superstitious men into an occasion of idolatry, as Paul Sarpi observes. “Because the impiety of Nestorius divided Christ, constituting two sons and denying that he, who was born of the virgin Mary, is God; the church, in order to implant the catholic truth in the minds of believers, decided that the words, Mary, the Mother of God (Maria theotokos), should be more frequently inculcated in the churches of the East as well as of the West. This, instituted indeed solely for the honor of Christ, by degrees began to be shared with the mother and at length was referred entirely to her alone” (History of the Council of Trent 2 [1620], p. 181). Although, I say, this most gross error either arose from or was increased by this occasion, it derogates nothing from the truth because the abuse and error of the papists ought not to take away the lawful use of this name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 13.7.11–12 (p. 320).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>VIII. Fifth, the injustice of the demand appears also clearly in this—that they treacherously corrupt the writings of the fathers and endeavor to destroy whatever of candor remains and extinguish all memory of antiquity as far as they are able (most base men). They wish to turn against us the arms of truth which they themselves have tempered with, overlaid and expunged because we cannot bring them forward. They, who persecuted the pious with flames and the sword, now make sport of them, evidently as the Jews who, smiting Christ with rods, said, “prophesy who struck you.” Thus they wish us to prophesy and to give a reason for a previous time. IX. Sixth, if our opponents wish us to answer the proposed question, they are also bound to answer us—where was their church in the time of Christ and the apostles, in which nothing concerning either transubstantiation, the sacrifice of the Mass, the invocation of saints and the worship of images, purgatory, indulgences, the pope and his authority, and the other errors theoretical and practical prevailed as yet among believers? Let them show us where then was that magnificent apparatus of temples and ceremonies which has corrupted Christianity completely and converted divine worship into a show. Where was the papacy in the first six centuries of purer (or at least of less impure) Christianity? For although various errors began gradually to creep into the church, still it is certain that far more numerous and grievous errors were introduced in the following ages or received strength: The worship of images, transubstantiation, communion under one species, the infallibility and monarchy of the pope, the use of a foreign language in the sacred service, etc. let them show where the church was in the 10th century (which Baronius calls the “iron” age), in which there were more than 50 Popes succeeding each other, not so much apostolical (apostolici), as “apostatical” (apostatici) And “apostactical” (apostactici) (according to Genebrard).</p></blockquote>

<blockquote><p>1. When, however, they are confuted from the Scriptures, they turn round and accuse these same Scriptures, as if they were not correct, nor of authority, and [assert] that they are ambiguous, and that the truth cannot be extracted from them by those who are ignorant of tradition. For [they allege] that the truth was not delivered by means of written documents, but viva voce: wherefore also Paul declared, “But we speak wisdom among those that are perfect, but not the wisdom of this world.” And this wisdom each one of them alleges to be the fiction of his own inventing, forsooth; so that, according to their idea, the truth properly resides at one time in Valentinus, at another in Marcion, at another in Cerinthus, then afterwards in Basilides, or has even been indifferently in any other opponent, who could speak nothing pertaining to salvation. For every one of these men, being altogether of a perverse disposition, depraving the system of truth, is not ashamed to preach himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/irenaeus.html">Irenaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 3.2.1</span></figcaption>

<blockquote><p>14. Still there was nothing with the Fathers less intended than to establish that kind of perfection which was afterwards fabricated by cowled monks, in order to rear up a species of double Christianity. For as yet the sacreligious dogma was not broached which compares the profession of monasticism to baptism, nay, plainly asserts that it is the form of a second baptism. Who can doubt that the Fathers with their whole hearts abhorred such blasphemy? Then what need is there to demonstrate, by words, that the last quality which Augustine mentions as belonging to the ancient monks—viz. that they in all things accommodated themselves to charity—is most alien from this new profession? The thing itself declares that all who retire into monasteries withdraw from the Church. For how? Do they not separate themselves from the legitimate society of the faithful, by acquiring for themselves a special ministry and private administration of the sacraments? What is meant by destroying the communion of the Church if this is not? And to follow out the comparison with which I began, and at once close the point, what resemblance have they in this respect to the ancient monks? These, though they dwelt separately from others, had not a separate Church; they partook of the sacraments with others, they attended public meetings, and were then a part of the people. But what have those men done in erecting a private altar for themselves but broken the bond of unity? For they have excommunicated themselves from the whole body of the Church, and contemned the ordinary ministry by which the Lord has been pleased that peace and charity should be preserved among his followers. Wherefore I hold that as many monasteries as there are in the present day, so many conventicles are there of schismatics, who have disturbed ecclesiastical order, and been cut off from the legitimate society of the faithful. And that there might be no doubt as to their separation, they have given themselves the various names of factions. They have not been ashamed to glory in that which Paul so execrates, that he is unable to express his detestation too strongly. Unless, indeed, we suppose that Christ was not divided by the Corinthians, when one teacher set himself above another (1 Corinthians 1:12, 13; 3:4); and that now no injury is done to Christ when, instead of Christians, we hear some called Benedictines, others Franciscans, others Dominicans, and so called, that while they affect to be distinguished from the common body of Christians, they proudly substitute these names for a religious profession.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“14. Still there was nothing with the Fathers less intended than to establish that kind of perfection which was afterwards fabricated by cowled monks, in order to rear up a species of double Christianity. For as yet the sacreligious dogma was not broached which compares the profession of monasticism to baptism, nay, plainly asserts that it is the form of a second baptism. Who can doubt that the Fathers with their whole hearts abhorred such blasphemy? Then what need is there to demonstrate, by words, that the last quality which Augustine mentions as belonging to the ancient monks—viz. that they in all things accommodated themselves to charity—is most alien from this new profession? The thing itself declares that all who retire into monasteries withdraw from the Church. For how? Do they not separate themselves from the legitimate society of the faithful, by acquiring for themselves a special ministry and private administration of the sacraments? What is meant by destroying the communion of the Church if this is not? And to follow out the comparison with which I began, and at once close the point, what resemblance have they in this respect to the ancient monks? These, though they dwelt separately from others, had not a separate Church; they partook of the sacraments with others, they attended public meetings, and were then a part of the people. But what have those men done in erecting a private altar for themselves but broken the bond of unity? For they have excommunicated themselves from the whole body of the Church, and contemned the ordinary ministry by which the Lord has been pleased that peace and charity should be preserved among his followers. Wherefore I hold that as many monasteries as there are in the present day, so many conventicles are there of schismatics, who have disturbed ecclesiastical order, and been cut off from the legitimate society of the faithful. And that there might be no doubt as to their separation, they have given themselves the various names of factions. They have not been ashamed to glory in that which Paul so execrates, that he is unable to express his detestation too strongly. Unless, indeed, we suppose that Christ was not divided by the Corinthians, when one teacher set himself above another (1 Corinthians 1:12, 13; 3:4); and that now no injury is done to Christ when, instead of Christians, we hear some called Benedictines, others Franciscans, others Dominicans, and so called, that while they affect to be distinguished from the common body of Christians, they proudly substitute these names for a religious profession.”

— John Calvin, Institutes of the Christian Religion, 4.13.14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C14.+Still+there+was+nothing+with+the+Fathers+less+intended+than+to+establish+that+kind+of+perfection+which+was+afterwards+fabricated+by+cowled+monks%2C+in+order+to+rear+up+a+species+of+double+Christianity.+For+as+yet+the+sacreligious+dogma+was+not+broached+which+compares+the+profession+of+monasticism+to+baptism%2C+nay%2C+plainly+asserts+that+it+is+the+form+of+a+second+baptism.+Who+can+doubt+that+the+Fathers+with+their+whole+hearts+abhorred+such+blasphemy%3F+Then+what+need+is+there+to+demonstrate%2C+by+words%2C+that+the+last+quality+which+Augustine+mentions+as+belonging+to+the+ancient+monks%E2%80%94viz.+that+they+in+all+things+accommodated+themselves+to+charity%E2%80%94is+most+alien+from+this+new+profession%3F+The+thing+itself+declares+that+all+who+retire+into+monasteries+withdraw+from+the+Church.+For+how%3F+Do+they+not+separate+themselves+from+the+legitimate+society+of+the+faithful%2C+by+acquiring+for+themselves+a+special+ministry+and+private+administration+of+the+sacraments%3F+What+is+meant+by+destroying+the+communion+of+the+Church+if+this+is+not%3F+And+to+follow+out+the+comparison+with+which+I+began%2C+and+at+once+close+the+point%2C+what+resemblance+have+they+in+this+respect+to+the+ancient+monks%3F+These%2C+though+they+dwelt+separately+from+others%2C+had+not+a+separate+Church%3B+they+partook+of+the+sacraments+with+others%2C+they+attended+public+meetings%2C+and+were+then+a+part+of+the+people.+But+what+have+those+men+done+in+erecting+a+private+altar+for+themselves+but+broken+the+bond+of+unity%3F+For+they+have+excommunicated+themselves+from+the+whole+body+of+the+Church%2C+and+contemned+the+ordinary+ministry+by+which+the+Lord+has+been+pleased+that+peace+and+charity+should+be+preserved+among+his+followers.+Wherefore+I+hold+that+as+many+monasteries+as+there+are+in+the+present+day%2C+so+many+conventicles+are+there+of+schismatics%2C+who <blockquote><p>Now very many persons see the base tricks, deceits, thefts, and greediness with which the indulgence traffickers have heretofore mocked and beguiled us, and yet they do not see the very fountain of the impiety itself. As a consequence, it behooves us to indicate not only the nature of indulgences but also what in general they would be, wiped clean of all spots. The merits of Christ and the holy apostles and martyrs our opponents call the “treasury of the church.” They pretend that the prime custody of this storehouse, as I have already hinted, has been entrusted to the Bishop of Rome, who controls the dispensing of these very great benefits, so that he can both distribute them by himself and delegate to others the management of their distribution. Consequently, plenary indulgences, as well as indulgences for certain years, stem from the pope; indulgences for a hundred days, from the cardinals; and of forty days, from the bishops! Now these, to describe them rightly, are a profanation of the blood of Christ, a Satanic mockery, to lead the Christian people away from God’s grace, away from the life that is in Christ, and turn them aside from the true way of salvation. For how could the blood of Christ be more foully profaned than when they deny that it is sufficient for the forgiveness of sins, for reconciliation, for satisfaction—unless the lack of it, as of something dried up and exhausted, be otherwise supplied and filled? “To Christ, the Law and all the Prophets bear witness,” says Peter, that “through him we are to receive forgiveness of sins.” [Acts 10:43 p.] Indulgences bestow forgiveness of sins through Peter, Paul, and the martyrs. “The blood of Christ cleanses us from sin,” says John [1 John 1:7 p.]. Indulgences make the blood of martyrs the cleansing of sins. “Christ,” says Paul, “who knew no sin, was made sin for us” (that is, satisfaction of sin) “so that we might be made the righteousness of God in him” [2 Corinthians 5:21 p., cf. Vg.]. Indulgences lodge satisfaction of sins in the blood of martyrs. Paul proclaimed and testified to the Corinthians that Christ alone was crucified and died for them [cf. 1 Corinthians 1:13]. Indulgences declare: “Paul and others died for us.” Elsewhere Paul says, “Christ acquired the church with his own blood.” [Acts 20:28 p.] Indulgences establish another purchase price in the blood of martyrs. “By a single offering Christ has perfected for all time those who are sanctified.” [Hebrews 10:14.] Indulgences proclaim: Sanctification, otherwise insufficient, is perfected by the martyrs. John says that “all the saints have washed their robes… in the blood of the Lamb.” [Revelation 7:14.] Indulgences teach that they wash their robes in the blood of the saints.</p></blockquote>

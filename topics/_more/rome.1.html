</figure><figure class="quote" id="q-0a2bd3d9c6" data-kw="">
<blockquote><p>He took unto him his wife, that is, he took her unto his house (for betrothed virgins used to abide at their own friends’ houses till the consummation of the marriage) and owned her as his wife, yet not fully using her as such, for the text saith he knew her not (a modest phrase used from the beginning of the world, as appears from Gen 4:1, to express the conjugal act) till she had brought forth her firstborn Son. Some make a great stir in determining whether he knew her afterwards, yea or no. Some of the ancients were stiff in their opinion that he did not, so are the popish writers, and many protestant interpreters. Mr. Calvin I think determines best, that none will move such a question, but such as are unwarrantably curious; nor contend for either part, but such as are unreasonably quarrelsome. For as, on the one side, none can conclude that she had more children from the word till, further than they can conclude, from Ps 110:1, that Christ shall not for ever sit at his Father’s right hand (the word until being a particle only exclusive of a preceding time, not affirming the thing in future time), nor doth the term firstborn conclude any born afterward; so, on the other side, there are no cogent arguments to prove that Mary had no more children by Joseph. We read of the brother of our Lord, Gal 1:19, and of his mother and his brethren, Matt 12:47; and though it be true brethren may signify kinsmen, according to the Hebrew dialect, yet that it doth so in these texts cannot be proved. The Holy Ghost had made use of the virgin for the production of the Messias; why after this her womb should be shut up, and Joseph take her home to be his wife, and not use her as such I cannot tell, nor yet what reproach it could be to Mary or to our Savior, marriage being God’s ordinance, and the undefiled bed honorable: and those who think our Savior would have been dishonoured in any others lying in the same bed after him, seem to forget how much he humbled himself in lying in that bed first, and then in a stable and a manger. We know he knew her not till Christ was born, whether he did afterward or no we are willingly ignorant because God hath not told us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 1, vv. 24-25</span></figcaption>

</figure><figure class="quote" id="q-ac5e5d5d16" data-kw="">
<blockquote><p>But are there no far off truths at all to be tolerated? Do not learned men give diverse and contrary expositions of one and the same text of Scripture? And has not the Church suffered errors and erroneous opinions in godly, learned men in all ages, even in Tertullian, Augustine and others? and have not implored the sword of the magistrate against them, though all errors printed and preached hurt the souls of others more or less. [Rutherford’s] Answer: … 2. For diverse expositions of one and the same text, as that, ‘we look for new heavens and new earth,’ when neither of the expositions so far as is revealed to the godly and learned, who in this life do but know and prophesy in part, do neither hurt the foundation, nor cross any clear truth that is non-fundamental: we think the opinions of both may be tolerated, even though the one of them be in itself an error, and that upon the ground that Church and magistrates both are to tolerate, not to punish these infirmities, against both Tables, that are the necessary results of sin-original, common to all men as men bearing about with them a body of sin. And the like I say of other the like opinions about matters of religion, and especially matters of fact [whether it ocurred or not], as the virginity of Mary for all her life.</p></blockquote>

<blockquote><p>There are also traditions pretended of things which are not necessary, such as are the Fast of Lent, godfathers and godmothers in baptism… and the perpetual virginity of the Virgin Mary. Now that these are not divine traditions nor apostolical appears by the destitution of their proper proof. They are ecclesiastical traditions and of several ages, and some of them of very great antiquity… they neither are of the necessity of faith, or the essential duty of Christian religion: and therefore as a Christian can go to heaven without the observation of them in certain circumstances, so is the Scripture a perfect Canon without giving rules concerning them at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 2, bk. 4, ch. 1. Taylor was a prominent Anglican cleric and writer. He was Latitudinarian and Arminian, though he had some puritan tendencies., p. 488</span></figcaption>

<blockquote><p>[According to Hickman’s opponent, Mary] had not set one step forward toward the consummation of her marriage so much as in thought, and possibly had set herself back from it by a vow of chastity and holy celibate… and of the burden [pregnancy] which she bare not hindering her… That she had no pain in the production, for to her alone did not the punishment of Eve extend, that in sorrow she should bring forth… so He came also into the world without doing violence to the virginal and pure body of his mother. He [the opponent] contents not himself to assert the perpetual virginity of Mary, which is not denied by any Protestant, but [he] will abuse Scripture to prove it; viz. that of Eze. 44:2…</p></blockquote>

— Qualified Acceptance of, Other citations (work not named), On John Calvin | J. A. Ross MacKenzie (a Protestant), in ed. Stacpoole, Alberic, Mary’s Place in Christian Dialogue (Wilton, Connecticut: Morehouse-Barlow, 1983), pp. 35-36">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCalvin%2C+like+Luther+and+Zwingli%2C+taught+the+perpetual+virginity+of+Mary.+The+early+Reformers+even+applied%2C+though+with+some+reticence%2C+the+title+Theotokos+%5BGod-bearer%5D+to+Mary%E2%80%A6+Calvin+called+on+his+followers+to+venerate+and+praise+her+as+the+teacher+who+instructs+them+in+her+Son%E2%80%99s+commands.%E2%80%9D%0A%0A%E2%80%94+Qualified+Acceptance+of%2C+On+John+Calvin+%7C+J.+A.+Ross+MacKenzie+%28a+Protestant%29%2C+in+ed.+Stacpoole%2C+Alberic%2C+Mary%E2%80%99s+Place+in+Christian+Dialogue+%28Wilton%2C+Connecticut%3A+Morehouse-Barlow%2C+1983%29%2C+pp.+35-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F98b0196328.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/98b0196328.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=Calvin%2C%20like%20Luther%20and%20Zwingli%2C%20taught,instructs%20them%20in%20her%20Son%E2%80%99s%20commands&amp;text=Calvin%2C%20like%20Luther%20and%20Zwingli%2C%20taught%20the%20perpetual&amp;text=teacher%20who%20instructs%20them%20in%20her%20Son%E2%80%99s%20commands" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e9df0142ce" data-kw="">
<blockquote><p>There have been certain strange folk who have wished to suggest from this passage [Mt. 1:24-25] that the Virgin Mary had other children than the Son of God, and that Joseph had then dwelt with her later; but what folly this is! for the gospel writer did not wish to record what happened afterwards; he simply wished to make clear Joseph’s obedience [to the angel in Mt. 1:24] and to show also that Joseph had been well and truly assured that it was God who had sent His angel to Mary. He had therefore never dwelt with her nor had he shared her company. There we see that he had never known her person for he was separated from his wife. He could marry another all the more because he could not enjoy the woman to whom he was betrothed; but he rather desired to forfeit his rights and abstain from marriage [for the time?], being yet always married: he preferred, I say, to remain thus in the service of God rather than to consider what he might still feel that he could come to. He had forsaken everything in order that he might subject himself fully to the will of God. And besides this, our Lord Jesus Christ is called the first-born. This is not because there was a second or a third, but because the gospel writer is paying regard to the precedence. Scripture speaks thus of naming the first-born whether or no there was any question of the second. Thus we see the intention of the Holy Spirit. This is why to lend ourselves to foolish subtleties would be to abuse Holy Scripture, which is, as St. Paul says, “to be used for our edification.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 22 on Matthew 1:22-25</cite>, (1562), from Corpus Reformatorum, vol. 46, pp. 259-272 (not currently on the net) as given in Max Thurian (a Protestant), Mary: Mother of All Christians, trans. Nevill B. Cryer (New York: Herder &amp; Herder, 1963), pp. 39-40. The French and this English excerpt, along with another larger translation of the French, has been provided by the Roman apologist Dave Armstrong, ‘John Calvin: Sermon 22 on Matthew 1:22-25 (Mary’s Perpetual Virginity)’.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>‘And knew her not’; This passage afforded the pretext for great disturbances, which were introduced into the Church, at a former period, by Helvidius. The inference he drew from it was, that Mary remained a virgin no longer than till her first birth, and that afterwards she had other children by her husband. Jerome, on the other hand, earnestly and copiously defended Mary’s perpetual virginity. Let us rest satisfied with this, that no just and well-grounded inference can be drawn from these words of the Evangelist, as to what took place after the birth of Christ. He is called first-born; but it is for the sole purpose of informing us that he was born of a virgin. It is said that Joseph knew her not till she had brought forth her first-born son: but this is limited to that very time. What took place afterwards, the historian does not inform us. Such is well known to have been the practice of the inspired writers. Certainly, no man will ever raise a question on this subject, except from curiosity; and no man will obstinately keep up the argument, except from an extreme fondness for disputation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 1:25</span></figcaption>

</figure><figure class="quote" id="q-8f7a236548" data-kw="">
<blockquote><p>This thing [that the Word of God is the object of faith] our [papist] adversaries can by no means abide; for they contend that there be certain things (I know not what) to be believed, which are not contained in the holy Scriptures. But we say that faith is an assent that is given to the holy Scripture and unto those things which are necessarily and evidently concluded of it. Among other things, they are wont to object unto us the perpetual virginity of the mother of Christ, which they say must be believed although it be not mentioned in the holy Scriptures…. 3. As touching the first, it is sufficient for us that we are taught by the holy Scriptures (Mt. 1 &amp; Lk. 1) that Christ was conceived and born of a virgin. And above that, to affirm that the blessed Virgin was joined with man in fellowship of the flesh, it were rash and presumptuous; for seeing there is nothing spoken thereof in the holy Scriptures, nor yet is the same likely; why (in God’s name) should we either believe it or affirm it? And contrariwise, that she abode perpetually a virgin; forsomuch as the holy Scriptures do not by express words avouch the same, it is not to be admitted among those things which must of necessity be believed such as are the things expressly contained in the holy Scriptures. Jerome against Helvidius wrote of this matter; for he was worthily to be condemned because he did rashly affirm that she was not perpetually a virgin. And Augustine very well admonishes us that when we come to such places where the sense of the Scripture cannot certainly be gathered, we should not rashly set our opinion on the one part or the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (d. 1562; 1583), Pt. 3, ch. 3, ‘Of Faith &amp; the Certainty Thereof’, section 7, p. 62. While Vermigli’s agnosticism on the question appears to be strong, nonetheless he uses language that appears to default to belief in perpetual virginity.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>Last of all, which you make the greatest matter, the perpetual virginity of the mother of Christ after his birth, although for my part I do believe it, and wish all men so to do, yet dare I affirm that it is not damnable not to believe it except it can be proved that the Scripture has taught it. But you object against me first the condemnation of Helvidius testified by Sozomenus. Whereto I answer that he was justly condemned, not because he believed not, but because he did obstinately deny it, and troubled the peace of the church about an unnecessary question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Sincere &amp; True Translations of the Holy Scriptures into the English Tongue</cite>, ... (London, 1583), A Brief Confutation of Sundry Cavils…, p. 53</span></figcaption>

</figure><figure class="quote" id="q-9b699ede97" data-kw="">
<blockquote><p>In the ninth place, he [Bellarmine] frames this objection: It is necessary to believe that Mary continued a virgin always. But this is not certain from the scriptures: therefore [according to Bellarmine], some necessary things are known from some other source besides the Scripture… I answer: As to the perpetual virginity of Mary, it is no business of mine to meddle with that dispute. I content myself with saying that the fathers who managed the controversy with Helvidius, adduced not only some obscure traditions, which no one would rank very high, but made use also of testimonies from Scripture. So Proclus Cyzicenus alleges a passage from Ezekiel about the gate which should be closed [Eze. 44:2]. So Ambrose (Sermon 4 and 5). So also Ambrose (Epistle 31 and 79) proves the same from John, where Christ commends his mother to John’s care; which He would not have done if she had a family of children. Epiphanius prosecutes this argument still more copiously against the Antidico-Marianites. Jerome contends against Helvidius with many passages of Scripture; and in like manner other fathers. Therefore, if these fathers determined aright, this opinion is not absolutely without scriptural authority. Now, as to the Jesuit’s assertion that it is an article of faith to believe the perpetual virginity of the blessed Mary, I say that Basil thought otherwise: for, in his Homily on Christ’s nativity, he says that we should not curiously dispute upon this subject, but that it is enough to know that she had no children before Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, … (d. 1595; Cambridge: Parker Society, 1849), pp. 538-9</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-a298cb1788" data-kw="">
<blockquote><p>Master Perkins says nothing of the necessity of believing. That point of the virgin Mary’s perpetual virginity, we hold to be true, but we dare not lay a burden upon any man’s conscience where the Scripture is silent. St. Austin’s judgment, though he were a singular light of the Church, is not of weight enough to determine, without all warrant of scripture, what is heresy and what is not… Besides, Austin thus delivers the matter concerning the Helvidians’ heresy. The Helvidians (says he) so gainsaid the virginity of Mary that they confidently affirm [that] she had other children after Christ by her husband Joseph. So that it may well be Austin counted them heretics especially for avouching that peremptorily which they could no way make good by Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of Mr</cite>, [William] Perkins’ book, called A Reformed Catholic, against the Cavils of a Popish Writer... (London, 1606), The 7th Point, ‘Of Traditions’. Wotton (c. 1561 – 1626) was an English clergyman and controversialist, of puritan views., pp. 401-2</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-efb82983ca" data-kw="">
<blockquote><p>The fourth heresy in Austin is the Basilidians [after Basil the Great], who held no such opinion of the virgin Mary [as to her perpetual virginity]. Indeed there were other heretics, the six in number who denied her virginity after our Savior’s birth, falsely, as we verily persuade ourselves; but this is no matter necessary to salvation, though it be an heresy to hold that as a matter of faith which has no warrant from the Scripture, but rather the contrary.</p></blockquote>

</figure><figure class="quote" id="q-77a05bc9a3" data-kw="">
<blockquote><p>Fifthly, we do not with Helvidius oppugne the perpetual virginity of the blessed Virgin, nor in all respects equal marriage with virginity; nor was he to be condemned, if in regard of merit of eternal life, he equaled marriage with virginity.</p></blockquote>

<blockquote><p>[Signification] 2. Infinite, without end or ceasing, where there is no time following. 2 Sam. 6:23, ‘Michal had no child until her death;’ that is, she never had any. Mt. 28:20, ‘I am with you always, until the end of the world;’ that is, forever. Ps. 110:1 &amp; 123:2. In which [second] of these two significations [the first was ‘unto a certain and appointed time’, Gen. 49:10; Rom. 11:25], we should understand, that in Mt. 1, verse last, ‘Until she had brought forth her first begotten son.’ As it is doubtful among divines: so is it not needful for us to know, being no article of our faith, nor any branch of the Moral Law; yet it is commonly received (as I take it) that Mary was a virgin before the birth, in the birth and ever after the birth; but not by the vow of perpetual virginity, whereof there is no ground in all Scripture.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Signification] 2. Infinite, without end or ceasing, where there is no time following. 2 Sam. 6:23, ‘Michal had no child until her death;’ that is, she never had any. Mt. 28:20, ‘I am with you always, until the end of the world;’ that is, forever. Ps. 110:1 &amp; 123:2. In which [second] of these two significations [the first was ‘unto a certain and appointed time’, Gen. 49:10; Rom. 11:25], we should understand, that in Mt. 1, verse last, ‘Until she had brought forth her first begotten son.’ As it is doubtful among divines: so is it not needful for us to know, being no article of our faith, nor any branch of the Moral Law; yet it is commonly received (as I take it) that Mary was a virgin before the birth, in the birth and ever after the birth; but not by the vow of perpetual virginity, whereof there is no ground in all Scripture.”

d it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8eccf00dfb" data-kw="">
<blockquote><p>The only clear instance they [Romanists] seem to give is touching the perpetual virginity of Mary, which they say cannot be proved by scripture, and yet is necessary to be believed. But they should know, that this is no point of Christian faith. That she was a virgin before, in and after the birth of Christ, we are bound to believe as an article of our faith, and so much is delivered in Scripture and in the Apostles Creed: but that she continued so ever after, is a seemly truth, delivered unto us by the Church of God, fitting the sanctity of the blessed Virgin and the honor due to so sanctified a vessel of Christ’s incarnation, as her body was: and so is de pietate [of piety], but not de necessitate fidei [of the necessity of faith], as the [Medieval] Schoolmen use[d] to speak. Neither was Helvidius condemned of heresy for the denial hereof, but because pertinaciously he urged the denial of it upon misconstruction of scripture, as if the denial of it had been a matter of faith. Touching this allegation of our adversaries concerning Mary’s perpetual virginity, we must know, that howsoever they pretend to hold it only by tradition, yet the Fathers that defend it against Helvidius, endeavor to prove it by the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-field.html">Richard Field</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Church, Five Books… (Oxford, 1628), bk. 4, ch. 20, ‘Of the supposed imperfection of Scriptures, and the supply of Traditions’, p. 376. Field (1561-1616) was the next major Anglican apologist after Richard Hooker, and was no friend of the puritans.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>We also acknowledge it most fitting that she remained in perpetual virginity, untouched by man, not only before giving birth, but also after giving birth, until the end of her life; and that this was disposed by the special providence of God, that she should indeed be given in true marriage to a man, but one who, endowed by God with the gift of continence, after he understood, by the warning of an angel, that she had conceived the Holy One of God from the Holy Spirit, as he was pious and just, never attempted anything against that vessel of the Holy Spirit.</p></blockquote>

<blockquote><p>Objection 1. Yet our [Romanist] adversaries quarrel against this most rich and plentiful treasure of the holy Scriptures, alleging that we receive many things by tradition which are not in Scriptures, and yet we believe them; as Mary’s perpetual virginity and the baptism of infants? We make not Mary’s perpetual virginity any matter of religion, but a likely opinion so far as it can be maintained; that it were an unseemly and unfitting thing for a sinful man to use to the act of generation the vessel which was chosen and consecrated by the holy Ghost to so high an use as was the bringing forth of the Savior of the world; it has warrant from the apostle’s charge, Phil. 4:8, of doing whatsoever is honest, whatsoever is of good report, whatsoever is praise-worthy, etc.</p></blockquote>

<blockquote><p>[It is claimed by Jesuits that] There are some points of faith not contained in the Scripture, neither in the Old nor New Testament; therefore it is not perfect… [such as] In the New Testament, the perpetual virginity of Mary the mother of Christ. Answer: …yet would it not thence follow which the Jesuits pretend, that some necessary point of Christianity wanted the ground of holy Scripture, it being sufficient for us to know, that she was a virgin when our Savior Christ was born of her, as the prophets did foretell. Yet (as [Daniel] Chamier said well [in his immensely popular work against Romanism, in Latin, Panstratiae Catholicae, vol. 2, bk. 4, ch. 3, ‘Of Christ’s Nativity’, pp. 110-114]) we believe that she continued a virgin all her lifetime, for in those things (said he) which are not properly de fide [of faith], we hold the authority of the Church is great, if it contradict not Scripture or produce no other absurdity. Vide [see Andrew] Rivet, Apologiam pro Virgine Maria [A Defense of the Virgin Mary], bk. 1, ch. 15 [pp. 107-118]. Helvidius would gather from those words, Mt. 1:25, ‘until’, and ‘first-born’, that Mary after had children by her husband: The word ‘till’ does not import so much. See Gen. 8:7 and 28:15, 1 Sam. 15:35; Sam. 6:23; Mt. 28:20. He is called the first-born in Scripture which first opens the womb, whether others follow or no.</p></blockquote>

<blockquote><p>Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.</p></blockquote>

<blockquote><p>XXI. …whether she always remained a virgin afterwards. This is not expressly declared in Scripture, but is yet piously believed with human faith from the consent of the ancient church. Thus it is probable that the womb in which our Savior received the auspices of life (whence he entered into this world, as from a temple) was so consecrated and sanctified by so great a guest that she always remained untouched by man; nor did Joseph ever cohabit with her. XXII. Hence Helvidius and the Antidicomarianites (so-called because they were opponents of [antidikoi] Mary) are deservedly rebuked by the fathers for denying that Mary was always a virgin (aei Parthenon). They held that she cohabited with Joseph after delivery; yea, also bore children from him. As Augustine remarks, they rely on the shallowest arguments, i.e., because Christ is called the ‘firstborn’ of Mary (cf. De Haeresibus 56, 84 [PL 42.40, 46]). For as Jerome well remarks, she was so called because no one was begotten before him, not because there was another after him. Hence among lawyers: ‘He is the first whom no one precedes; he is last, whom no one follows.’ The Hebrews were accustomed to call the firstborn also only begotten; Israel is called ‘the first-born of God’ (Ex 4:22), although the only people chosen of God. Thus ‘the firstborn’ is said to be ‘holy unto God’ (Ex 13:2), who first opened the womb , whether others followed or not. Otherwise the firstborn would not have to be redeemed until after another offspring had been procreated (the law shows this to be false because it commands it to be redeemed a month after birth, Num. 18:16). XXIII. (2) Not more solidly have they been able to elicit this from the fact that in the New Testament certain ones are called ‘the brothers of Christ.’ It is common in Scripture not only for one’s own and full brothers by nature to be designated by this name, but also blood relatives and cousins (as Abraham and Lot, Jacob and Laban). Thus James and Joses, Simon and Judas are called brothers of Christ (Mt. 13:55) by a relation of blood. For Mary (who is called their mother by Matthew and Mark) is called by John the sister of the Lord’s mother. However what is said in Jn. 7:5 that ‘neither did his brethren believe him’ must be understood of more remote blood relations. XXIV. (3) Nor is it derived better from this-that Joseph is said ‘not to have known Mary till she had brought forth her firstborn son’ (Mt. 1:25). The particles ‘till” and ‘even unto’ are often referred only to the past, not to the future (i.e., they so connote the preceding time, concerning which there might be a doubt or which it was of the highest importance to know, as not to have a reference to the future-cf. Gen. 28:15; Ps. 122:2; 110:1; Mt. 28:20, etc.). Thus is shown what was done by Joseph before the nativity of Christ (to wit, that he abstained form her); but it does not imply that he lived with her in any other way postpartum. When therefore she is said to have been found with child ‘before they came together’ (prin e synelthein autous), preceding copulation is denied, but not subsequent affirmed. XXV. Although copulation had not take place in that marriage, it did not cease to be true and ratified (although unconsummated) for not intercourse, but consent makes marriage. Therefore it was perfect as to form (to wit, undivided conjunction of life and unviolated faith, but not as to end (to wit, the procreation of children, although it was not deficient as to the raising of the offspring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13th Topic, ‘The Person &amp; State of Christ’, 11th Question, ‘The Conception &amp; Nativity of Christ’, sections 21-25</span></figcaption>

Jacob and Laban). Thus James and Joses, Simon and Judas are called brothers of Christ (Mt. 13:55) by a relation of blood. For Mary (who is called their mother by Matthew and Mark) is called by John the sister of the Lord’s mother. However what is said in Jn. 7:5 that ‘neither did his brethren believe him’ must be understood of more remote blood relations. XXIV. (3) Nor is it derived better from this-that Joseph is said ‘not to have known Mary till she had brought forth her firstborn son’ (Mt. 1:25). The particles ‘till” and ‘even unto’ are often referred only to the past, not to the future (i.e., they so connote the preceding time, concerning which there might be a doubt or which it was of the highest importance to know, as not to have a reference to the future-cf. Gen. 28:15; Ps. 122:2; 110:1; Mt. 28:20, etc.). Thus is shown what was done by Joseph before the nativity of Christ (to wit, that he abstained form her); but it does not imply that he lived with her in any other way postpartum. When therefore she is said to have been found with child ‘before they came together’ (prin e synelthein autous), preceding copulation is denied, but not subsequent affirmed. XXV. Although copulation had not take place in that marriage, it did not cease to be true and ratified (although unconsummated) for not intercourse, but consent makes marriage. Therefore it was perfect as to form (to wit, undivided conjunction of life and unviolated faith, but not as to end (to wit, the procreation of children, although it was not deficient as to the raising of the offspring).”

edeemed+a+month+after+birth%2C+Num.+18%3A16%29.+XXIII.+%282%29+Not+more+solidly+have+they+been+able+to+elicit+this+from+the+fact+that+in+the+New+Testament+certain+ones+are+called+%E2%80%98the+brothers+of+Christ.%E2%80%99+It+is+common+in+Scripture+not+only+for+one%E2%80%99s+own+and+full+brothers+by+nature+to+be+designated+by+this+name%2C+but+also+blood+relatives+and+cousins+%28as+Abraham+and+Lot%2C+Jacob+and+Laban%29.+Thus+James+and+Joses%2C+Simon+and+Judas+are+called+brothers+of+Christ+%28Mt.+13%3A55%29+by+a+relation+of+blood.+For+Mary+%28who+is+called+their+mother+by+Matthew+and+Mark%29+is+called+by+John+the+sister+of+the+Lord%E2%80%99s+mother.+However+what+is+said+in+Jn.+7%3A5+that+%E2%80%98neither+did+his+brethren+believe+him%E2%80%99+must+be+understood+of+more+remote+blood+relations.+XXIV.+%283%29+Nor+is+it+derived+better+from+this-that+Joseph+is+said+%E2%80%98not+to+have+known+Mary+till+she+had+brought+forth+her+firstborn+son%E2%80%99+%28Mt.+1%3A25%29.+The+particles+%E2%80%98till%E2%80%9D+and+%E2%80%98even+unto%E2%80%99+are+often+referred+only+to+the+past%2C+not+to+the+future+%28i.e.%2C+they+so+connote+the+preceding+time%2C+concerning+which+there+might+be+a+doubt+or+which+it+was+of+the+highest+importance+to+know%2C+as+not+to+have+a+reference+to+the+future-cf.+Gen.+28%3A15%3B+Ps.+122%3A2%3B+110%3A1%3B+Mt.+28%3A20%2C+etc.%29.+Thus+is+shown+what+was+done+by+Joseph+before+the+nativity+of+Christ+%28to+wit%2C+that+he+abstained+form+her%29%3B+but+it+does+not+imply+that+he+lived+with+her+in+any+other+way+postpartum.+When+therefore+she+is+said+to+have+been+found+with+child+%E2%80%98before+they+came+together%E2%80%99+%28prin+e+synelthein+autous%29%2C+preceding+copulation+is+denied%2C+but+not+subsequent+affirmed.+XXV.+Although+copulation+had+not+take+place+in+that+marriage%2C+it+did+not+cease+to+be+true+and+ratified+%28although+unconsummated%29+for+not+intercourse%2C+but+consent+makes+marriage.+Therefore+it+was+perfect+as+to+form+%28to+wit%2C+undivided+conjunction+of+life+and+unviolated+faith%2C+but+not+as+to+end+%28to+wit%2C+the+procreation+of+children%2C+although+it+was+not+deficient+as+to+the+raising+of+the+offspring%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+13th+Topic%2C+%E2%80%98The+Person+%26+State+of+Christ%E2%80%99%2C+11th+Question%2C+%E2%80%98The+Conception+%26+Nativity+of+Christ%E2%80%99%2C+sections+21-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9fc9aa14f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9fc9aa14f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=whether%20she%20always%20remained%20a%20virgin,to%20the%20raising%20of%20the%20offspring&amp;text=whether%20she%20always%20remained%20a%20virgin%20afterwards.%20This&amp;text=deficient%20as%20to%20the%20raising%20of%20the%20offspring" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>When the ancients not a few and the monks in their train explain Mary’s words as though she had intimated the taking of a resolve or vow of eternal virginity whether on her own or her parents’ part, according to the story, or rather dream from the ivory gate, which Gregory of Nyssa related under the title of A certain apocryphal Tale, they are quite mistaken, because if bound by a vow whether of her own or of others she would not have promised marriage to Joseph. At the time she was a virgin but betrothed to Joseph, Mt. 1:18, with whom it is suggested in the same passage that she proposed to cohabit. Moreover God wished the most holy virgin to be betrothed, lest either the son as spurious, not being admissible to the congregation, Dt. 23:3 (no bastard, unto the tenth generation) might be hindered in the administration of his office; or lest according to the law, Lev. 20:10 (adulterer or adultress put to death) a capital charge might be brought against Mary, as an adultress. Those who adduce from Epiphanius that the virgin was ἐπίκληρος, we have shown earlier to be destitute of reason. Also the Church believes that she was always a virgin. Faith in Jesus bids us believe that both before and in parturition she was a virgin. Also that after an untainted parturition she retained the bloom of her virginity is a pious belief of the Church, although it makes no difference to faith in Christ.</p></blockquote>

<blockquote><p>8. Question: Since she was ordained by God to be the mother of our Savior, and was thus to remain a pure virgin, why then must she be married to Joseph according to God’s providence? Answer: So that she would have in him a carer and a guardian, who would partly shield her pregnant body from evil suspicion and the strictness of the Mosaic law, and partly protect her and her future son’s holy persons from all violence and inconvenience, and would be helpful to them with advice and deed. … 15th Question: Was the holy Virgin before, during &amp; after the birth, &amp; herewith an ever-pure virgin? Answer: That she was before and during the birth a pure virgin Holy Writ testifies clearly (Isa. 7:14 &amp; Mt. 1:23). Thus, we also do not doubt that after the birth and herewith she was an ever-pure virgin, partly because Holy Writ, if it had been otherwise, would not have concealed such; partly since otherwise the Lord Christ at the cross would not have entrusted her to John, if she had borne other more children. 16th Question: But why is the Lord Christ called (Mt. 1:25) the firstborn son of Mary; and why are the brothers of Christ mentioned (Mk. 6:3)? Answer: He is called the firstborn son of Mary the Lord not because others were after Him, but because no other was born before Him. And those who are named brothers of Christ were not his biological brothers, but according to the manner of speaking common in God’s Word, they were his closest friends and relatives.</p></blockquote>

<blockquote><p>He turns, in September 1522, to a lyrical defense of the perpetual virginity of the mother of Christ… To deny that Mary remained ‘inviolata’ before, during and after the birth of her Son, was to doubt the omnipotence of God… and it was right and profitable [according to Zwingli] to repeat the angelic greeting – not prayer – ‘Hail Mary’… God esteemed Mary above all creatures, including the saints and angels – it was her purity, innocence and invincible faith that mankind must follow. Prayer, however, must be… to God alone… . p. 395 ‘Fidei expositio,’ [An Exposition of the Faith, 1536] the last pamphlet from his pen [d. 1531]… There is a special insistence upon the perpetual virginity of Mary….</p></blockquote>

<blockquote><p>As Zwingli’s successor, Heinrich Bullinger (1504-1575) consolidated the reform of Zurich. Nevertheless, he is more positively disposed toward Marian doctrine and piety. His ‘Sermon on Mary,’ after defending Mary’s perpetual virginity… This is not to say that the sermon is a wholesale endorsement of Marian developments to the sixteenth century, for it also regards the immaculate conception and the bodily assumption as open questions… Bullinger also inveighs against her invocation and rejects the understanding of Mary as mistress of the church.</p></blockquote>

<blockquote><p>But that even our Scriptures… use metaphorical and symbolic words and discourse is clearly apparent from these things… How is it that Mary herself calls Joseph the father of Jesus (Luke 2:48)? What pious person would not profess that all these things are said improperly? Or, having been taught by Scripture, do we not firmly believe that the Lord Jesus was by no means conceived by the seed of Joseph (which certain heretics, being of unsound mind with the Jews, have dared to proclaim) but that He was conceived of the Holy Spirit (Luke 1:35), and that His blessed mother had never known a man but remained a virgin and untouched forever?</p></blockquote>

</figure><figure class="quote" id="q-10069342eb" data-kw="">
<blockquote><p>They [Romanists] say moreover that the perpetual virginity of our Lady is to be believed of necessity as Cyprian, Chrysostom, Jerome, Ambrose, Austen and all other speaking thereof say. But this is not found in the Scripture: ergo [therefore] there is something to be believed that is not written in the Scripture. The minor, that is to say that this is not written in the Scripture is false. For first, none of the old authors that rehearse traditions of the apostles-unwritten make mention of the perpetual virginity of our Lady to be one of them: but they rehearse only diverse ceremonies or bodily gestures… which (as I have manifestly declared) are not necessary to salvation… Moreover all the said authors prove her perpetual virginity by this text of Scripture: Ezekiel 44, ‘This door shall be still shut and not opened for any man to go through it: but only for the Lord God of Israel, yea He shall go through it, else shall it be shut still.’ For if these and such other fathers had not judged her perpetual virginity to have been written in the Scriptures: they would never have judged it to have been a thing to be believed under pain of damnation. Saint Jerome also calls Helvidius a rash and an ungodly man: because that he taught that our Lady had other children by Joseph after Christ’s birth, which doctrine he could not prove by the Scriptures of God. In like manner we call all them that preach any doctrine in the Church without the authority of God’s Word both ungodly, rash and wicked members of Antichrist.</p></blockquote>

<blockquote><p>…we considered each chapter by itself, and left nothing unexplored, and diligently examined everything respecting God, the sacred laws and rights of the Church, and it is impossible to express the exceeding delight we derived from that work, when we clearly perceived that in your little book was most faithfully, holily, piously, and indeed divinely explained, and that briefly whatever we have been constantly teaching these eight years, and still by the grace of God, continued to teach, in our Churches, in the schools, and in the pulpit. We are therefore altogether compelled, as well by our consciences, as from a sense of duty, to undertake its patronage, and not only to express our approval, but also our exceeding commendation of every chapter and every sentence.</p></blockquote>

<blockquote><p>CHRIST IS TRUE MAN, HAVING REAL FLESH. We also believe and teach that the eternal Son of the eternal God was made the Son of man, from the seed of Abraham and David, not from the coitus [union] of a man, as the Ebionites [a sect from the Early Church] said, but was most chastely conceived by the Holy Spirit and born of the ever virgin Mary, as the evangelical history carefully explains to us (Matt., ch. 1). And Paul says: “he took not on him the nature of angels, but of the seed of Abraham.” Also the apostle John says that whoever does not believe that Jesus Christ has come in the flesh, is not of God. Therefore, the flesh of Christ was neither imaginary nor brought from heaven, as Valentinus and Marcion wrongly imagined.</p></blockquote>

</figure><figure class="quote" id="q-f261cc281e" data-kw="">
<blockquote><p>As Mary conceived a virgin, so it may be well thought that she continued a virgin to the end, though we make it no article of our faith. When Christ was upon the cross, he commended his mother to the custody of John; which probably argues that she had no child to whose care and keeping she might be commended. And though Christ be called her firstborn, yet does it not follow that she had any child after him: for as that is called last after which there is none, so that is called the first before which there was none. And as for Joseph, when he was espoused to Mary, he was a man of eighty years old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge, 1595), p. 171</span></figcaption>

</figure><figure class="quote" id="q-21283dd83a" data-kw="">
<blockquote><p>The nativity of Christ, is that whereby Mary, a virgin, did after the course of nature and the custom of women [contra in partu], bring forth Christ, that Word of the Father and the Son of David: so that those are much deceived which are of opinion that Christ, after a miraculous manner, came into the world, the womb of the Virgin being shut. Lk. 2:23, ‘Every man-child which first opens the womb, shall be called holy to the Lord.’ The which place of scripture is applied to Mary and our Savior Christ. Hence is it that the Virgin Mary is said Theotokos [God-bearer] to bring forth God, albeit she is not any way mother of the Godhead. For Christ as He is God, is without mother, and as man, without father. It is convenient to be thought that Mary continued a virgin until her dying day, albeit we make not this opinion any article of our belief: I. Christ being now to depart the world, committed his mother to the tuition and custody of his disciple John, which it is like He would not have done, if she had had any children, by whom, as custom was, she might have been provided for, Jn. 19:26. II. It is likely that she who was with child by the Holy Ghost, would not after[ward] know any man. III. It is agreed of by the Church in all ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, … (Cambridge, 1600), ch. 18, ‘Of Christ’s Nativity &amp; Office’, pp. 27-28</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-abe8210703" data-kw="">
<blockquote><p>In that James is called our Lord’s brother [in Gal. 1:19] three things may be demanded: One, which James this was? Answer: It was James the son of Alpheus: for he lived 14 years after this, Gal. 2:9, whereas James the son of Zebedeus lived not so long, because he was put to death by Herod. The second thing is, how James should be the Lord’s brother? Answer: In scripture, children of the same womb, are brethren: men of the same blood are brethren; as Abram and Lot, Gen. 13:8. Men of the same country are brethren, thus Saul’s countrymen are called his brethren, 1 Chron. 12:2. And James is called our Lord’s brother, not because he was of the same womb, but because he was of the same blood or kindred: for Elie had two daughters, Mary, espoused to Joseph, and Mary Cleophas, who afterward was married to Alpheus, of whom came James here mentioned. James therefore was the cousin-german [first-cousin] of Christ. Therefore Helvideus failed when he went about to infringe the perpetual virginity of the virgin Mary out of this place, as if she had more sons beside Christ. The third thing is, what benefit James had by being the Lord’s brother? Answer: He is here called the Lord’s brother only, for distinction’s sake in respect of the other James the son of Zebedeus…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians</cite>, … (Cambridge, 1604), ch. 1, pp. 61-2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In that James is called our Lord’s brother [in Gal. 1:19] three things may be demanded: One, which James this was? Answer: It was James the son of Alpheus: for he lived 14 years after this, Gal. 2:9, whereas James the son of Zebedeus lived not so long, because he was put to death by Herod. The second thing is, how James should be the Lord’s brother? Answer: In scripture, children of the same womb, are brethren: men of the same blood are brethren; as Abram and Lot, Gen. 13:8. Men of the same country are brethren, thus Saul’s countrymen are called his brethren, 1 Chron. 12:2. And James is called our Lord’s brother, not because he was of the same womb, but because he was of the same blood or kindred: for Elie had two daughters, Mary, espoused to Joseph, and Mary Cleophas, who afterward was married to Alpheus, of whom came James here mentioned. James therefore was the cousin-german [first-cousin] of Christ. Therefore Helvideus failed when he went about to infringe the perpetual virginity of the virgin Mary out of this place, as if she had more sons beside Christ. The third thing is, what benefit James had by being the Lord’s brother? Answer: He is here called the Lord’s brother only, for distinction’s sake in respect of the other James the son of Zebedeus…”

— William Perkins, A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians, … (Cambridge, 1604), ch. 1, pp. 61-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+that+James+is+called+our+Lord%E2%80%99s+brother+%5Bin+Gal.+1%3A19%5D+three+things+may+be+demanded%3A+One%2C+which+James+this+was%3F+Answer%3A+It+was+James+the+son+of+Alpheus%3A+for+he+lived+14+years+after+this%2C+Gal.+2%3A9%2C+whereas+James+the+son+of+Zebedeus+lived+not+so+long%2C+because+he+was+put+to+death+by+Herod.+The+second+thing+is%2C+how+James+should+be+the+Lord%E2%80%99s+brother%3F+Answer%3A+In+scripture%2C+children+of+the+same+womb%2C+are+brethren%3A+men+of+the+same+blood+are+brethren%3B+as+Abram+and+Lot%2C+Gen.+13%3A8.+Men+of+the+same+country+are+brethren%2C+thus+Saul%E2%80%99s+countrymen+are+called+his+brethren%2C+1+Chron.+12%3A2.+And+James+is+called+our+Lord%E2%80%99s+brother%2C+not+because+he+was+of+the+same+womb%2C+but+because+he+was+of+the+same+blood+or+kindred%3A+for+Elie+had+two+daughters%2C+Mary%2C+espoused+to+Joseph%2C+and+Mary+Cleophas%2C+who+afterward+was+married+to+Alpheus%2C+of+whom+came+James+here+mentioned.+James+therefore+was+the+cousin-german+%5Bfirst-cousin%5D+of+Christ.+Therefore+Helvideus+failed+when+he+went+about+to+infringe+the+perpetual+virginity+of+the+virgin+Mary+out+of+this+place%2C+as+if+she+had+more+sons+beside+Christ.+The+third+thing+is%2C+what+benefit+James+had+by+being+the+Lord%E2%80%99s+brother%3F+Answer%3A+He+is+here+called+the+Lord%E2%80%99s+brother+only%2C+for+distinction%E2%80%99s+sake+in+respect+of+the+other+James+the+son+of+Zebedeus%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Commentary+or+Exposition%2C+upon+the+Five+First+Chapters+of+the+Epistle+to+the+Galatians%E2%80%A6+%28Cambridge%2C+1604%29%2C+ch.+1%2C+pp.+61-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fabe8210703.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/abe8210703.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=In%20that%20James%20is%20called%20our,other%20James%20the%20son%20of%20Zebedeus&amp;text=In%20that%20James%20is%20called%20our%20Lord%E2%80%99s%20brother&amp;text=of%20the%20other%20James%20the%20son%20of%20Zebedeus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Scripture tells us how man comes four ways into the world… 4. Of a woman without a man, and so was Christ born. Of the Virgin Mary.] Where the mother of Christ is described by her Name, ‘Mary’; surename, ‘Virgin’. The new Jesuits and old Friers have many wonderful extravagant conceits of this name: let it suffice that it is added in the Gospel and Creed to show that Christ came of the lineage of David: and that therefore He was the true Messias, as God had promised and prophesied by the mouths of all his holy servants. Virgin] A perpetual Virgin: Before, In, After Christ’s birth. Before his birth, against 1. Jews, 2. Gentiles, 3. Cerinthians. Unto the first [the Jews] we say with Cyril: Pariet Aaronis virga sine semine, et non pariet virgo sine semine? aut vtrum[que] negate aut vtrum[que] concedite. Against the second [the gentiles], we have: Ficta: Qui enim e Iouis cerebro Mineruam, et ex eiusdem femore Bacchum, falso prognatum esse fabulamini: quomodo ex vtero virginali Christum nasci dicitis impossibile? Facta: Quoniam animalia multas sine commistione generantur. And Plutarch in the life of Numa spake like an angel: Incredibilo non est, ut spiritus Dei cum muliere coeat, ei[que] sobolis quaedam principia ingoneret. 3. The Cerinthians, Ebionites, and Carpocratian heretics held that Christ was the natural son of Joseph: et verus, et merus homo [both true and merely man]. Contrary to text, Mt. 1:25; Lk. 3:23. See the Gospel, Dom. l, post Epiphan. In his birth, against: Jovinian, Durandus. Unto these that of Isa. 7 is opposed, ‘Ecce 〈…〉, &amp; pariet filium.’ The which words are to be construed: ‘in censu composito, non diuiso: scilicet integra perman•e•• et conceptura, et paritura: nam quale signum vel prodigium esset ut quae fuit virgo conciperet, et corrupta pareret?’ ‘Hic si ratio quaeritur, non erit mirabile. Si poscitur exemplum, non erit singulare. Demus Deum aliquid posse, quod nos fateamur inuestigare non posse.’ ‘Fides adsit, et nulla quaestio remanebit.’ See the Gospel of the purification. After his birth against the Old Helvidians, [and] New Antidicomarianites: holding it a point of zeal to disgrace this holy Virgin: whereas it is our duty rather highly to reverence her, as being the Mother of our Lord; a prophetess on earth, a saint in heaven, (as the Fathers usually) the window of heaven, through which it pleased the light of the world to illuminate such as sit in darkness and in the shadow of death. Of such estimation in the Church, that whereas the first General Council was assembled against Arius, to maintain the honor of the Son, and so by consequence of the Father: The second against Macedonius, to maintain the honor of the Holy Ghost: The third was assembled against Nestorius, to maintain the dignity of the blessed Virgin. And therefore let not us give her too little, though the Papists have given her too much. See Gospel on the Annunciation.</p></blockquote>

0tells%20us%20how%20man%20comes%20four&amp;text=her%20too%20much.%20See%20Gospel%20on%20the%20Annunciation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VII. We believe also that Mary continued a virgin after her childbirth: For her marriage with Joseph did not consist in the generation of children, but in her education and holy conjunction of life with him. VIII. Although Christ had no other brothers born after Him, yet He is rightly called Mary’s first begotten Son. In Scripture Christ is called the ‘firstborn’ four manner of ways… 4. In respect of his nativity of the Virgin, Lk. 2:7. Now He is not only called firstborn, whom other brothers do follow; but he also who is born before others, although he be indeed the only begotten, or he whom other brothers do not follow; whence such a one, even before he had any brothers, was consecrated to God, as if he had been the firstborn, Num. 18:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, … (d. 1629; London, 1660), pp. 128-9</span></figcaption>

</figure><figure class="quote" id="q-81ce495dfe" data-kw="">
<blockquote><p>Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects: 1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11. 2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews</cite>, … (London, 1655), §. 67. ‘Of Christ the first-begotten’, p. 49</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects: 1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11. 2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.”

<blockquote><p>The fifth and last proposition is this, that although Jesus of Nazareth naturally descended only from Mary, yet he derives not his title to the crown and kingdom of the Jews originally by the line of Mary (for as much as she sprang from the Line of Rhesa the younger Son of Zorobabel), but received that from Joseph, who was of the elder line by Abiud; which line of Abiud failing in Joseph, as having no issue, the right of Inheritance devolved upon one of the younger line, viz. upon Mary, and consequently upon Jesus her son and legal heir. From whence there rises this unanswerable argument, both against the opinion of those who affirm Joseph to have had other Children by a former wife; as also against that old heresy of Helvidius, who, against the general and constant sense of the Church, denied the perpetual virginity of Mary, affirming that Joseph had other children by her after the Birth of Jesus. [Frederic] Spanheimius [Sr., 1600-1649] in his Dubia Evangelica, concludes against the opinion of Helvidius (which I much marvel at) merely upon the account of decency and congruity, as judging it more suitable and agreeable to that honorable esteem we ought to have of our Blessed Savior’s mother, to hold that after his birth she remained a perpetual virgin. But I add, that to assert so, seems not only decent, but of as absolute necessity, as that Jesus Christ the Messiah was to be of right king of the Jews. For had Joseph had any children either by Mary, or any other wife, they as coming from the elder line of Abiud by Joseph their father, must have claimed the inheritance of the kingdom in his right, and not Jesus the Son of Mary, who descended from a younger line, and so could not legally inherit, but upon default of issue from Joseph the only remaining heir of the elder. For this was the law of Moses, which in this case would have barred Jesus from a title to the kingdom of the Jews. But we know Jesus came to fulfill the Law in every part and tittle of it; and therefore would never have owned himself king of the Jews, contrary to the express injunctions and tenor of it. For though it must be confessed that the Gospel makes mention of the brothers and sisters of Jesus, yet it is known to be most usual in the Jewish language to call any collateral kindred, as cousins and cousin-germans [first cousins] by that name. And antiquity reports the Virgin Mary to have had two sisters, the children of which might very well be called the brethren of Jesus. So that from hence there can be no necessity of granting that Jesus had any brother or sister either by his mother Mary, or his reputed and legal father Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-south.html">Robert South</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twelve Sermons upon Several Subjects &amp; Occasions. The Third Volume</cite>, … (London, 1698), Sermon on Rev. 22:16, Proposition 5, pp. 339-41. South was a reformed Anglican.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>Scripture does not say or indicate that she later lost her virginity… … The form of expression used by Matthew is the common idiom, as if I were to say, “Pharaoh believed not Moses, until he was drowned in the Red Sea.” Here it does not follow that Pharaoh believed later, after he had drowned; on the contrary, it means that he never did believe. Similarly when Matthew [1:25] says that Joseph did not know Mary carnally until she had brought forth her son, it does not follow that he knew her subsequently; on the contrary, it means that he never did know her. Again, the Red Sea overwhelmed Pharaoh before he got across. Here too it does not follow that Pharaoh got across later, after the Red Sea had overwhelmed him, but rather that he did not get across at all. In like manner, when Matthew [1:18] says, “She was found to be with child before they came together,” it does not follow that Mary subsequently lay with Joseph, but rather that she did not lie with him. Elsewhere in Scripture the same manner of speech is employed. Psalm 110[:1] reads, “God says to my Lord: ‘Sit at my right hand, till I make your enemies your footstool.’ ” Here it does not follow that Christ does not continue to sit there after his enemies are placed beneath his feet. Again, in Genesis 28[:15], “I will not leave you until I have done all that of which I have spoken to you.” Here God did not leave him after the fulfillment had taken place. Again, in Isaiah 42[:4], “He shall not be sad, nor troublesome, till he has established justice in the earth.” There are many more similar expressions, so that this babble of Helvidius is without justification; in addition, he has neither noticed nor paid any attention to either Scripture or the common idiom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Jesus Christ was Born a Jew</cite>, (1523) in LW 45.206, 212-213</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955), 22:23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-d8b5db9ae0" data-kw="">
<blockquote><p>Now the question may occupy us how Christ could have brothers, since He was the only Son of Mary, and the Virgin Mary bore no children besides Him. Some say that Joseph had been married before his marriage to Mary, and that the children of this first wife were later called Christ’s brothers… Any children born to Joseph by other wives would have been half brothers of Christ. This is the explanation offered by some. But I am inclined to agree with those who declare that “brothers” really means “cousins” here, for Holy Writ and the Jews always call cousins brothers. Be that as it may, it matters little. It neither adds to nor detracts from faith. It is immaterial whether these men were Christ’s cousins or His brothers begotten by Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in LW, 22:214-215</span></figcaption>

</figure><figure class="quote" id="q-e12a8af594" data-kw="">
<blockquote><p>For this reason, too, Scripture does not quibble or speak about the virginity of Mary after the birth of Christ, a matter about which the hypocrites are greatly concerned, as if it were something of the utmost importance on which our whole salvation depended. Actually, we should be satisfied simply to hold that she remained a virgin after the birth of Christ because Scripture does not state or indicate that she later lost her virginity. We certainly need not be so terribly afraid that someone will demonstrate, out of his own head apart from Scripture, that she did not remain a virgin. But the Scripture stops with this, that she was a virgin before and at the birth of Christ; for up to this point God had need of her virginity in order to give us the promised blessed seed without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, LW, 45:205-206</span></figcaption>

</figure><figure class="quote" id="q-74ab6f9bac" data-kw="">
<blockquote><p>The conjecture which some have drawn from these words [‘How shall this be, seeing I know not a man?’], that she had formed a vow of perpetual virginity, is unfounded and altogether absurd. She would, in that case, have committed treachery by allowing herself to be united to a husband, and would have poured contempt on the holy covenant of marriage; which could not have been done without mockery of God. Although the Papists have exercised barbarous tyranny on this subject, yet they have never proceeded so far as to allow the wife to form a vow of continence at her own pleasure. Besides, it is an idle and unfounded supposition that a monastic life existed among the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Luke</cite>, ch. 1, v. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-7432244373" data-kw="">
<blockquote><p>But whereas some feign that she asked this because she had vowed her virginity unto God; this needs no long confutation, specially seeing we are by the history itself taught that she was betrothed to a man: neither was there at that time any such custom to vow virginity unto God. But let us return to our purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (d. 1562; 1583), Pt. 3, ch. 3, ‘Of Faith &amp; the Certainty Thereof’, section 7, p. 62</span></figcaption>

<blockquote><p>Doctrine 3. Christ was born of Mary, remaining still a virgin after He was born. This is gathered from the scope of the words [Mt. 1:20], the question being about this, whether Mary were a virgin or no; and the words of the angel were to assure him that she was. Reason. 1. Is that this might be a singular and miraculous sign to the whole house of Israel, and this is it that is pointed at, in Isa. 7:14. Reason 2. That the prophesies going before of this thing might be fulfilled. Reason 3. That God’s omnipotency in this so divine a mystery, and principal a work of God, might be evidently shown. Now it was not difficult to the power of God that a son should be born of a virgin. For seeing all second causes act by their virtue which they received from God, it is not to be doubted, but that God can produce all these effects without this or that cause cooperating, which otherways use to exist by them. Yet not onely the power of God appeared in that work, but also his wisdom, to which it was most agreeable, that so singular a substance of human nature, should in as singular a manner be brought to pass, that differed from all others. For in three manners all men were made before: 1. Without the concurrence of either man or woman, as in the creation of Adam. 2. Without the concurrence of woman, as in the production of Eve. 3. By the concurrence of man and woman, as in all ordinary generation afterwards. And this only is the proper and peculiar one of Christ, by and of a woman, without concurrence of a man. Reason 4. That it might easily appear how the contagion of sin might be removed from the human nature of Christ. [The] Use, is of confirmation, for strengthening of our faith about the person of Christ; to wit, that He was both the Messiah of old promised, and the promised seed of the woman in that peculiar manner, as that promise seems to have intended; to wit, the Son of Man; that is, of a woman descending of Adam and other men in ordinary way, but made mother of a son not vulgarly or after the common manner, but miraculously and without the company of a man begotten, and born; so that from his first conception all things were in him supernatural; about which our minds being busied, ought always to be lifted up to supernatural contemplations, laying aside carnal and worldly thoughts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures</cite>, … (London: Mabb, 1659), 14th Lord’s Day, pp. 100-101</span></figcaption>

</figure><figure class="quote" id="q-62f633d5e4" data-kw="">
<blockquote><p>From the very beginning of the Reformation there have been various attempts for a composition of the differences between the church of Rome and those who were departed from it. Councils of princes, conventions of divines, imperial edicts, sedate consultations of learned men, have all been made use of unto this end; and all in vain. And it was for a while the judgment of most wise men, that the council of Trent had rendered all reconciliations, so much as by a pretence of any condescension on the part of Rome, utterly impossible; for it hath bound itself and all the world that will own its authority, under solemn curses, not to make any change or alteration in the present state of the papal church, though the salvation of all men living should depend thereon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief and Impartial Account of the Nature of the Protestant Religion in The Works of John Owen</cite>, ed. William H. Goold, vol. 14 (Edinburgh: T&amp;T Clark, n.d.), 545–46.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a></span></div>

</figure><figure class="quote" id="q-14f5c6fd75" data-kw="">
<blockquote><p>Therefore we are fighting today, not against the obvious wickedness and vice of the papacy but against its fictitious saints, who think that they lead an angelic life when they observe not only the commandments of God but also the counsels of Christ and works that are not required or works of supererogation. We say that this is a waste of time and effort, unless they have grasped that “one thing” which Christ says is the only thing “needful” and, like Mary, have chosen the good portion, which cannot be taken away from them (Luke 10:42). That is what Bernard did. He was a man so pious, holy, and chaste that I think he deserves to be put ahead of all other monks. Once, when he was gravely ill and despaired of his life, he did not place his trust in the celibacy that he had observed so chastely, or in the good works and acts of piety that he had performed in such quantity; but he put all these far from sight and took hold of the blessing of Christ by faith, saying: “I have lived damnably. But Thou, O Lord Jesus Christ, hast a double right to the kingdom of heaven: first, because Thou art the Son of God; secondly, because Thou hast won it by Thy passion and death. The first Thou dost keep for Thyself by Thy birthright; the latter Thou dost grant to me by the right, not of works but of grace.” He did not set his monkery or his angelic life against the wrath and judgment of God but took hold of the one thing that is needful and thus was saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 459–460.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome.html">Rome</a></span></div>

</figure><figure class="quote" id="q-e4a400e150" data-kw="">
<blockquote><p>Ever since God revealed himself Father to us, we must prove our ungratefulness to him if we did not in turn show ourselves his sons. Ever since Christ cleansed us with the washing of his blood, and imparted this cleansing through baptism, it would be unfitting to befoul ourselves with new pollutions. Ever since he engrafted us into his body, we must take especial care not to disfigure ourselves, who are his members, with any spot or blemish. Ever since Christ himself, who is our Head, ascended into heaven, it behooves us, having laid aside love of earthly things, wholeheartedly to aspire heavenward. Ever since the Holy Spirit dedicated us as temples to God, we must take care that God’s glory shine through us, and must not commit anything to defile ourselves with the filthiness of sin. Ever since both our souls and bodies were destined for heavenly incorruption and an unfading crown, we ought to strive manfully to keep them pure and uncorrupted until the Day of the Lord. These, I say, are the most auspicious foundations upon which to establish one’s life. One would look in vain for the like of these among the philosophers, who, in their commendation of virtue, never rise above the natural dignity of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, [Battles Edition], III.vi.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome.html">Rome</a></span></div>

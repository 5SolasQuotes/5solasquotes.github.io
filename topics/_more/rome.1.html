</figure><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2010</span></figcaption>

</figure><figure class="quote" id="q-fb00224ded" data-kw="">
<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>

</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, I-II, q. 114, a. 6</span></figcaption>

</figure><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>

<blockquote><p>If any one saith, that the just ought not, for their good works done in God, to expect and hope for an eternal recompense from God, through His mercy and the merit of Jesus Christ, if so be that they persevere to the end in well doing and in keeping the divine commandments; let him be anathema.</p></blockquote>

</figure><figure class="quote" id="q-08406211a8" data-kw="">
<blockquote><p>There cannot be a doubt, that every thing in our works which deserves praise is owing to divine grace, and that there is not a particle of it which we can properly ascribe to ourselves. If we truly and seriously acknowledge this, not only confidence, but every idea of merit vanishes. I say we do not, like the Sophists share the praise of works between God and man, but we keep it entire and unimpaired for the Lord.</p></blockquote>

</figure><figure class="quote" id="q-75edd178d9" data-kw="">
<blockquote><p>So much the more detestable is the invention of the Sophists, who have had the effrontery to forge a kind of merit, which professes to be founded on a just claim. The word merit, taken by itself, was sufficiently profane and inconsistent with the standard of piety; but to intoxicate men with diabolical pride, as if they could merit any thing by a just claim, is far worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 17:7-10</span></figcaption>

</figure><figure class="quote" id="q-b8e4f9d6ce" data-kw="">
<blockquote><p>What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?</p></blockquote>

<blockquote><p>This mode of expression, they tell us, is employed, because God bestows the first grace. It is really foolish to imagine that they can succeed in this way, since Paul excludes man and his utmost ability, -- not only from the commencement, but throughout, -- from the whole work of obtaining salvation.</p></blockquote>

</figure><figure class="quote" id="q-f8f5a33276" data-kw="">
<blockquote><p>But there is still greater ground for contradicting, when they are not ashamed to affirm that nothing is to prevent believers from satisfying the Law, at least in a degree proportioned to the present state, and meriting eternal life. … With the same confidence do they talk of a heaven for hire, while they themselves meanwhile continue engrossed with the present hire, after which they are always gaping.</p></blockquote>

<blockquote><p>That God visits the good works of the godly with reward, and to former adds new and ampler grace, we deny not. But whosoever asserts that works have the effect of increasing justification, understands neither what is the meaning of justification nor its cause. That we are regarded as righteous when we are accepted by God, has already been proved. From this acceptance, too, works derive whatever grace they had.</p></blockquote>

<blockquote><p>Were a man in a wilderness where are a multitude of cross paths, all pretending to lead unto an inhabited City, whither he must go or perish; if he see men not only contending some for one way, some for another, but killing and destroying one another, about the preference of the several ways they esteem best and safest; he deserves to wander and perish, if he refuse a guide that is tendered unto him with sufficient evidence of his truth and faithfulness.</p></blockquote>

<blockquote><p>A List of the Seven Periods of the Roman Church: I. The history of the Roman Church, in more pure doctrine and government, even from the beginning of that Church to the time of Constantine the Great, or until about the year 314. II. The history of the same in relatively retaining more pure doctrine, as far as principal matters, yet in government, aspiring for domination, from Constantine the Great, or the year 314, up to [Flavius?] Phocas and Boniface III, or 607. III. The history of the same in attaining, more or less, despotism in spiritual matters, Phocas permitting, and relatively degenerating in doctrine and rites, from Boniface III up to Gregory VII, or 1073. IV. The history of the same striving for despotism even in temporal things, and turning worse with time in doctrine and rites, from Gregory VII, or around 1073 up to Boniface VIII, or 1294. V. The history of the same attaining to a greater degree of despotism in temporal things, even unto an Imperial-Papacy, and the same shamefully driving harder an overthrow of all pure doctrine, from Boniface VIII, or 1294, to Leo X, or 1517. VI. The history of the same through the Reformation, or the separation of the faithful, suffering a most heavy injury in their despotism in spiritual and temporal things, from Leo X, or 1517, up to the end of the Council of Trent, or 1563. VII. The history of the same being hardened in error through the decrees of a false faith and Tridentine anathemas, while continually fighting the true Church of Christ through deceit and force, from the end of the Council of Trent, or 1563, up to our time [late-1600’s].</p></blockquote>

<blockquote><p>Where was your Religion before Luther? To this the answer will be very short and easy… I say then, that our religion, as to the rules and principles of it, was before Luther, where it has been ever since, in the Scriptures: And as to the profession of it, it has been owned and maintained by the faithful in all ages, namely, such as have been kept by the power of God through faith unto salvation, against whom the gates of hell and Rome have not been able to prevail. The Protestant Religion we contend for is nothing else but Christianity uncorrupted, which was in its greatest purity before ever the Pope was heard of in the World. And Popery, that we oppose, is Christianity adulterated, or rather paganism Christianized, which was in the cradle when the mystery of iniquity began to work, and grew up to be the Man of Sin, when Popes had gulled the world into so much slavery as to endure their trampling upon princes. And this truth, as it appears in great measure from the Fathers and historians of the Church, and from all antiquity, that has had the good fortune to escape the Expurgatory Index [of Romanism]; so it is more especially, and most evidently manifest from the Scriptures…</p></blockquote>

<blockquote><p>11. Forasmuch as that religious adoration given by the Church of Rome to their pretended consecrated Host, has in its public service, and whenever it is carried in procession unto the sick for its sole foundation, this false supposition, that it is by the priest’s consecration properly made the self-same body which was taken out of the womb of the blessed Virgin by the Eternal Son of God, and united unto his Divine Person, unto which belongs, both before and since his incarnation, the empire of glory and religious worship, most strictly and properly so called, and not unto his humanity separated from it: That the Church of Rome neither renders to, nor requires for its consecrated host any other adoration than that of latria; and the professors of our religion are in this point of another faith, believing this host after consecration to be that very self-same insensible and inanimate matter which it was before, and cannot, if they will follow the dictates of their own consciences, and the prime fundamental verities of Christianity, ascribe divine adoration unto a thing which by nature is not God, nor transfer the glory of the Eternal God from Him unto the basest of creatures. This synod therefore does adjure all of them, by that profession they make of serving the Lord in purity and sincerity, and by that irreparable prejudice they do the truth by their rash and inconsiderate oppugning of it; and to their own consciences, which are shamefully betrayed by them; and to their countrymen of the Romish Communion, whom they confirm in their superstitions; and to the weaker Christians among ourselves, whom by such a vile example, utterly unbecoming that worthy Name that is called upbri them, they learn to prevaricate in religion, that they would once again return unto themselves, and mourn bitterly in the Presence of the Great God, and of our Savior Jesus Christ, for that by this sin of theirs they have profaned his glory. And the Synod ordains, that when as the host shall be carried in procession, or to the sick by those of the Romish Church, every one do withdraw himself from the sight of it, that so no scandal may be given unto their neighbors. And whereas some, who do not step out of the way, do feed themselves with this frivolous imagination, that they may tarry and see it, though they do not, as those of the Romish Church, let out their thoughts to a religious adoration of the host; yet if their bodily presence be voluntary at it, it is a kind of approbation of it. And whereas some, out of a sordid, servile spirit, do comply with the received custom in taking off their hats when as the host passes by, which, say they, is not for its sake, or any reverence to it, but only out of respect and honor to the curate or vicar who carries it, or of the persons which accompany it; this is sinful, because they do not conform themselves to their intention whom they pretend to gratify; and they yield only a civil salutation, where the Romish Church ordains religious worship to be paid and performed, bestowing it on another object besides that proposed by her; which acts of theirs are directly contrary to the received maxims of civility among all men, in that they honor, though not as the Church of Rome professes to do, the Lord of Glory, but in his Presence, and to his contempt, a priest, who says he is called to serve Him, and this in that very proper act of worship, yielded by him as he pretends unto his God. Besides, this is contrary to all Christian sincerity, which requires our actious to be true copies and transcripts of our hearts, and not fallacious feignings of that which is not only not in our intentions, but is formally contrary to them, which is a most mischievous trick and abuse put upon those who see and converse with them. Yea lastly, this is contrary to those glorious patterns and examples of the primitive and ancient Christians, who being in no wise able to brook such disguises, did repute and esteem them most sacrilegious impieties, and would rather expose themselves to many deaths, than to swerve from the least tittle of that fidelity and allegiance they had sworn unto God in their baptism. Wherefore this synod ordains that such offenders be strictly and carefully admonished not to persist in this their hypocrisy; for with whatsoever glosses and fine pretexts they may color it over, it is an open mockage and scorn both of God and Man, a grievous scandal unto their brethren, and a mortal wound unto their own consciences. And in case they shall obstinately abide in their impious resolution, then all consistories are enjoined to pursue and prosecute them with all Church-censures, as being persons utterly unworthy of communion with the saints of God. And that none may pretend ignorance of this act, let it be read and notified publicly in all places and congregations where it may be judged needful.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“11. Forasmuch as that religious adoration given by the Church of Rome to their pretended consecrated Host, has in its public service, and whenever it is carried in procession unto the sick for its sole foundation, this false supposition, that it is by the priest’s consecration properly made the self-same body which was taken out of the womb of the blessed Virgin by the Eternal Son of God, and united unto his Divine Person, unto which belongs, both before and since his incarnation, the empire of glory and religious worship, most strictly and properly so called, and not unto his humanity separated from it: That the Church of Rome neither renders to, nor requires for its consecrated host any other adoration than that of latria; and the professors of our religion are in this point of another faith, believing this host after consecration to be that very self-same insensible and inanimate matter which it was before, and cannot, if they will follow the dictates of their own consciences, and the prime fundamental verities of Christianity, ascribe divine adoration unto a thing which by nature is not God, nor transfer the glory of the Eternal God from Him unto the basest of creatures. This synod therefore does adjure all of them, by that profession they make of serving the Lord in purity and sincerity, and by that irreparable prejudice they do the truth by their rash and inconsiderate oppugning of it; and to their own consciences, which are shamefully betrayed by them; and to their countrymen of the Romish Communion, whom they confirm in their superstitions; and to the weaker Christians among ourselves, whom by such a vile example, utterly unbecoming that worthy Name that is called upbri them, they learn to prevaricate in religion, that they would once again return unto themselves, and mourn bitterly in the Presence of the Great God, and of our Savior Jesus Christ, for that by this sin of theirs they have profaned his glory. And the Synod ordains, that when as the host shall be carried in procession, or to the sick by those of the Romish Church, every one do withdraw himself from the sight of it, that so no scandal may be given unto their neighbors. And whereas some, who do not step out of the way, do feed themselves with this frivolous imagination, that they may tarry and see it, though they do not, as those of the Romish Church, let out their thoughts to a religious adoration of the host; yet if their bodily presence be voluntary at it, it is a kind of approbation of it. And whereas some, out of a sordid, servile spirit, do comply with the received custom in taking off their hats when as the host passes by, which, say they, is not for its sake, or any reverence to it, but only out of respect and honor to the curate or vicar who carries it, or of the persons which accompany it; this is sinful, because they do not conform themselves to their intention whom they pretend to gratify; and they yield only a civil salutation, where the Romish Church ordains religious worship to be paid and performed, bestowing it on another object besides that proposed by her; which acts of theirs are directly contrary to the received maxims of civility among all men, in that they honor, though not as the Church of Rome professes to do, the Lord of Glory, but in his Presence, and to his contempt, a priest, who says he is called to serve Him, and this in that very proper act of worship, yielded by him as he pretends unto his God. Besides, this is contrary to all Christian sincerity, which requires our actious to be true copies and transcripts of our hearts, and not fallacious feignings of that which is not only not in our intentions, but is formally contrary to them, which is a most mischievous trick and abuse put upon those who see and converse with them. Yea lastly, this is contrary to those glorious patterns and examples of the primitive and ancient Christians, who being in no wise able to brook such disguises, did repute and esteem them most sacrilegious impieties, and would rather expose themselves to many deaths, than to swerve from the least tittle of that fidelity and allegiance they had sworn unto God in their baptism. Wherefore this synod ordains that such offenders be strictly and carefully admonished not to persist in this their hypocrisy; for with whatsoever glosses and fine pretexts they may color it over, it is an open mockage and scorn both of God and Man, a grievous scandal unto their brethren, and a mortal wound unto their own consciences. And in case they shall obstinately abide in their impious resolution, then all consistories are enjoined to pursue and prosecute them with all Church-censures, as being persons utterly unworthy of communion with the saints of God. And that none may pretend ignorance of this act, let it be read and notified publicly in all places and congregations where it may be judged needful.”

<blockquote><p>XX. The subject ‘to which’ it [original sin] happens are all men who are brought forth into the light by the common law of birth. And therefore, Christ alone was immune from this sin; and the Virgin Mary was subject to this evil, because she was propagated from Adam naturally. Then, since Holy Scripture convicts all of sin (1 Kn. 8:46; Eccl. 7:21; Rom. 11:32; Gal. 3:22, etc.), who can press forward and give exceptions to the general propositions of the Word of God, besides the Word itself? But it excepts only Jesus.</p></blockquote>

<blockquote><p>This monkish and hermetic life is first of all contrary to the nature of man when the same was uncorrupt, for whom it was not judged good to be alone, but contrariwise thought convenient that he should have one of the same nature to keep him company, not only in marriage for creations’ sake, but for other helpful and comfortable society. Now therefore that he is fallen from that sufficiency whereby he was passingly more able to live by himself than now he is, it is evident to uphold himself in any commendable estate agreeing with his creation, it is needful that he lean upon the company of his like. Wherefore Solomon says: ‘Two are better than one, for that they have a good reward of their labor: For if the one fall the other may raise up his fellow: but woe to him that is alone, for if he fall, there is no second to lift him up. Likewise if two sleep together, they get warmth, but how should one alone come to any thread that is not soon broken.’ (Eccl. 4:9, etc.) The philosophers, which saw as far as the natural eye was able to pierce, esteemed a man naturally companionable, and him that naturally without constraint of banishment and such like severed himself from the society of men, they deemed either to be a god or else esteemed to be a wild beast; they would have said a devil if they had as much knowledge of him as of God. Secondly, as this solitary life is an enemy to mankind, so is it to the communion of saints in the Church of God: for if they have any singular gifts that take their flight into the wilderness, the sentence of our savior Christ pulls their wings: That no man lights a candle to put it under a bushel, but rather sets it in the candlestick of some society, where it may give light to all that are round about (Mt. 5:15): whether also is referred that such personages are called the salt of others, which has need to approach and be applied to that flesh which it must season and deliver from putrefaction. And if he be void of such gifts, or have not in any great measure, then also is it meet that he should join himself to their company, by whom he may have supply of his wants, that by daily conversation with the wise he may learn wisdom? And if neither any man should have need of him, nor he need of any, yet the desire of being in the congregation of God’s people, to see the beauty of the house of God, in the participation of the Word and sacraments would call him, would so inflame him as to cause him to speed himself as fast from the forsaken wilderness to the place of the assembly of God’s people, as the hart pursued of the dogs, makes footmanship to the soil. (Prov. 13:20, Ps. 42 &amp; 43). For David, being many years a hermit according to your description, that is, one that lived in erema, or wilderness, did notwithstanding the Lord’s calling into that place, feel the horror of the wilderness, through desire he had to go with the rest of the people unto the house of God (Ps. 84). If therefore it be a pleasant paradise unto you which was unto him a horrible and desolate waste: if you voluntarily fly from that which he did so thirstily pursue, and if you greedily seek thither from whence he so desirously departed, it is easy for all men to see that your hermits and monks are of another spirit than David was. But the example of the primitive church conducted by the hands of the apostles is very pregnant against these wild asses whose habitations are in the wilderness: for Luke bears witness that as many as believed were together in one place (Acts 2:44), and that they communicated not only in spiritual things, but nourished love by society in their bodily repasts [meals]. Whereupon it may be easily perceived that as amongst birds they are the uncleanest and most hateful that covet the desolate places, so amongst men they are most to be detested that forsake the mutual society of their brethren. Against this, and for foundation of hermits and monks, is alleged: First, that John was in the wilderness. Whereunto our men answering that it was no such wilderness but that there were towns in it, are charged with shameless perverting of the place. Howbeit take that away which you have falsely surmised of us, that we expound a wilderness which is full of towns, and the shame of your ignorance will return upon yourselves. For if you had not been inured or unready in the Word, you should have known out of the prophet, who wills the wilderness with their cities to lift up their voice. Those places which in comparison of others [are] more peopled are called wildernesses, are not so naked of their inhabitants, but that they may have diverse towns and villages planted in them. Hereupon the self-same quarter of the wilderness of Jordan where John was, there was the town of Bethabara builded upon the bank of the river. Here therefore it is manifest that the entrance into his ministry was not in such a wilderness as the Jesuits imagine, but in a plain inhabited of men. The reason whereof is that, as the first captivity and stroke of God’s judgment began about those parts of Jordan, so to them also first should be offered the saving health, which was able to comfort them over all their desolations. There are two other places, and but two (as far as I remember) famous by John’s ministry, and those are: 1. The waters of Salem. 2. The waters of Enon, which are so called of the two towns Salem and Enon, set upon the brink of those waters. So that John’s whole ministry, so far as may appear, was executed in habitable places, where the cause assigned by the Holy Ghost why John haunted those places is to be observed, namely: for the abundance of waters that were there fit for his ministry in the holy sacrament of baptism, whereby it is evident that John came not to those places for that they were not so much peopled as others, but rather for seeking the commodity of water. Now therefore, if it be enough to make a hermit or a monk to remain in such a wilderness as John did, I can direct you to fitter fathers and founders of your kind of hermits. You have therefore Nabal the churl which dwelt in the wilderness of Maon; you have also the Ziphims, which dwelt in the wilderness of Zyph, that would have betrayed David into the hands of Saul: these are more like birds of your feather. Or if these you like not, you have the heathen men which are called Iaponici, who live after the same sort that your monks do, and in like laws. Now for the closing up of John’s ministry, it appears to have been in the court of Herod, whether a man would think that it should be hard for you to prove that he repaired to the end that he might live in a wilderness. And if it were granted you which you would have, yet considering that whatsoever was done here was to fulfill the prophecy of Isaiah, and by calling of the Lord, it can give no warrant unto you which undertake this of your own head, without commandment or instruction out of the Word. The same reason is there of his authority in diet and apparel, which is frankly confessed on our part to have been after a base and homely sort: howbeit such it was notwithstanding as the country (for abundance of camels and plenty of locusts and wild honey which was there) did afford. For this special diet and apparel, whereby Saint John, declining from a more liberal entertainment, which has priestly estate did yield him, conformed himself to the baser and poorer sort of people, was not a fancy of his own, but that wherein he had the light of the Word to go before him: 1. First, that he might more lively represent the ministry of Elijah, whereunto he was diversely like, especially in the restoring of the true worship of God. 2. Secondly, by commandment which being expressed in his drink, was wisely both of John, and of his parents, by proportion and convenience, translated unto his meat and clothing: considering that it would have been as an old piece in a new garment, if his drink being by God’s prescription thin and common, his meat and apparel should have been exquisite and picked. Further, seeing that John’s ministry has no succession, neither in respect of his calling which was immediately from God, nor of his office, which was to prepare the way for the former coming of our savior Christ, it is manifest that the office being at an end, the things that were annexed unto it cannot continue. After this, Chrysostom is brought for the confirmation of these orders, wherein occasion is given to note how their orders of hermits and monks crept first into the church. In time of persecution, good men were glad to make the wilderness, as it were, the cities of their refuge from the face of tyrants that pursued them. This the apostle to the Hebrews does plainly set forth, where diverse amongst sufferings for the truth, he adds that some wandered in the wilderness, in mountains, and hid themselves in dens and holes of the earth, clad in badgers’ and goats’ skins (Heb. 11:38), in which number it is apparent that Elijah, upon whom you would also father this profession, is contained. He adds that therefore they were in the wilderness, because the world (that dwelt in cities and villages) were not worthy of them. If therefore you now forsake the people by example of these hermits, it is evident that you condemn your popish towns and cities as profane and utterly unworthy of your company. And that which the epistle to the Hebrews witnesses of diverse times of the Law, the same do the ecclesiastical writers of diverse alike times under the Gospel, as appears by the example of Paulus of Thebes, supposed most commonly to be the prince of the monks and hermits, which took the wilderness only as a remedy in persecution raised against him. Further, the apostle in the said epistle, and St. John witnesses of the whole estate of the church, that it should be in this respect a hermit, wherefore the cause of this hermetic life, being through peace of the church taken away, the kind of life ought to have gone withal. But as the churches, by an unadvised imitation drew the interrogatories ministered in the primitive church, to those which were of years to profess their faith in baptism, unto young children: even so with like unadvisedness, the state of the hermits, which properly agreed unto the persecuting times, was translated unto the peaceable times of the church. It was no marvel therefore, although Chrysostom and others did fall sometimes into the commendation of the monkish and hermetic life. But their hermits and monks are so unlike the pope’s creatures, that it is a marvel that they would fetch meat at the father’s hands to nourish this cattle with, of whom they could not well be ignorant but that they should receive more stripes than their meat is worth. 1. For first, they were not within any degree of church ministry, whereby they were, by so much the freer to live unto themselves. 2. Secondly, they were not as caged as yours as, but it was left free unto them, whether they would repair to the company of other monks or not. 3. Thirdly, they were bound to wash the guests’ feet. 4. Fourthly, there was permitted unto them care of wives, of family, and private possession, so that the same were moderate and not against the care of the soul: contrary to your laws, which thrust upon them the vow of wilful poverty. 5. Fifthly, their diet throughout was very sparing, whereas your monks feed so fat, that their fatness and great bellies are grown into a proverb. 6. Sixthly, the ancient monks got their living with the labor of their hands, whereof also they were bound to give an account unto their father; yours are idle bellies, which live off the labors of others only. 7. Seventhly, they were not too notorious by singular weed, or kind of apparel, least men passing by should stand gazing upon them, or point them out with the finger? Yours are. Hither also is to be referred that they had no rasure [shaving] command, only it was provided that they should have their hair long, as women have, where yours are crown shaven. Likewise, in the virgins at that time, it was sharply reproved if they did cut off their hair, whereas you commend it highly, as a virtue in your nuns that they clip their hair. 8. Eighthly, many of the monks in the elder times remaining monks, retained their wives, which to you is an abomination, who thrust upon them the vow of continual continency. Last of all, these were obedient unto their bishop or pastor, as well as other of the body of the church: yours are exempted from his obedience. So that in vowing obedience of your own invention, you disavow the obedience which the Lord has commanded unto you. Now touching your testimonies, Chrysostom has not that John [the Baptist] was Prince of the Hermits, as you would untruly insinuate: but of the monks, without mention of the hermits. Which also, if they have no manner of ground out of the Evangelist, have we not cause to be offended with Chrysostom? And we would think the Jesuits themselves should not be altogether pleased with him; saying that they like well that the truth be always spoken against, so that it be by a friend of the truth, under whom they may cover their deadly hate against it. Otherwise how will they digest that he says, The soul of the monks is without grief or passion and their bodies be as Adam’s before the fall. Jerome, speaking of anchorites and monks, reckons up the opinions of others, how some esteem Elijah the author of them: other some John Baptist; which opinions Jerome does apparently nip in the head, affirming Elijah more than a monk, and John a prophet from his birth: and therefore none that made choice of any special vocation. But that the most part, one Paulus of Thebes, the prince of that sect: where it is to be observed that this monkish and hermetic birth is so obscure that the father of it is unknown. Secondly, the nearest guess that can be had of the parentage of it, leaves it altogether in the filth of man’s invention. Last of all, that all our monks and hermits and bastard and degenerate children from their father Paulus of Thebes, the likelist prince of their profession, whom Jerome affirms to have taken the wilderness, not of his voluntary will, but persecuted even of his nearest friends. Touching Isidorus, if all speak truth that are learned: he (for his time wherein he lived) should be worthy of credit. He flourished about Pope Gregory’s days the great, when this kind of cattle was not dainty. And therefore if the stream of common error carried him to the liking and praising of such a seat, there is no learning nor wisdom in the world (without a special grace from God) which was able to resist such a forcible drift. Howbeit Isidorus was not so wedded to the monks as the Jesuits, who of six kinds of monks rejects three as very bad: where there is not with the Jesuits no order of monks which are not sacred; who, wheresoever they do but find the name of a monk, by and by they think that it is ground good enough to plant monkery upon. In Bernard, your purveyor has deceived you, for we find no such treatise as you give the title of. In a sermon of John’s nativity, he greatly commends him: but with no mark either of monk or hermit. Neither has he any other thing that makes for your purpose.</p></blockquote>

hat they should have their hair long, as women have, where yours are crown shaven. Likewise, in the virgins at that time, it was sharply reproved if they did cut off their hair, whereas you commend it highly, as a virtue in your nuns that they clip their hair. 8. Eighthly, many of the monks in the elder times remaining monks, retained their wives, which to you is an abomination, who thrust upon them the vow of continual continency. Last of all, these were obedient unto their bishop or pastor, as well as other of the body of the church: yours are exempted from his obedience. So that in vowing obedience of your own invention, you disavow the obedience which the Lord has commanded unto you. Now touching your testimonies, Chrysostom has not that John [the Baptist] was Prince of the Hermits, as you would untruly insinuate: but of the monks, without mention of the hermits. Which also, if they have no manner of ground out of the Evangelist, have we not cause to be offended with Chrysostom? And we would think the Jesuits themselves should not be altogether pleased with him; saying that they like well that the truth be always spoken against, so that it be by a friend of the truth, under whom they may cover their deadly hate against it. Otherwise how will they digest that he says, The soul of the monks is without grief or passion and their bodies be as Adam’s before the fall. Jerome, speaking of anchorites and monks, reckons up the opinions of others, how some esteem Elijah the author of them: other some John Baptist; which opinions Jerome does apparently nip in the head, affirming Elijah more than a monk, and John a prophet from his birth: and therefore none that made choice of any special vocation. But that the most part, one Paulus of Thebes, the prince of that sect: where it is to be observed that this monkish and hermetic birth is so obscure that the father of it is unknown. Secondly, the nearest guess that can be had of the parentage of it, leaves it altogether in the filth of man’s invention. Last of all, that all our monks and hermits and bastard and degenerate children from their father Paulus of Thebes, the likelist prince of their profession, whom Jerome affirms to have taken the wilderness, not of his voluntary will, but persecuted even of his nearest friends. Touching Isidorus, if all speak truth that are learned: he (for his time wherein he lived) should be worthy of credit. He flourished about Pope Gregory’s days the great, when this kind of cattle was not dainty. And therefore if the stream of common error carried him to the liking and praising of such a seat, there is no learning nor wisdom in the world (without a special grace from God) which was able to resist such a forcible drift. Howbeit Isidorus was not so wedded to the monks as the Jesuits, who of six kinds of monks rejects three as very bad: where there is not with the Jesuits no order of monks which are not sacred; who, wheresoever they do but find the name of a monk, by and by they think that it is ground good enough to plant monkery upon. In Bernard, your purveyor has deceived you, for we find no such treatise as you give the title of. In a sermon of John’s nativity, he greatly commends him: but with no mark either of monk or hermit. Neither has he any other thing that makes for your purpose.”

— Thomas Cartwright, Confutation of the Rhemists’ Notes, Glosses &amp; Annotations on the New Testament, … (d. 1603; [Leiden] 1618), on Mt. 3:1, pp. 9-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+monkish+and+hermetic+life+is+first+of+all+contrary+to+the+nature+of+man+when+the+same+was+uncorrupt%2C+for+whom+it+was+not+judged+good+to+be+alone%2C+but+contrariwise+thought+convenient+that+he+should+have+one+of+the+same+nature+to+keep+him+company%2C+not+only+in+marriage+for+creations%E2%80%99+sake%2C+but+for+other+helpful+and+comfortable+society.+Now+therefore+that+he+is+fallen+from+that+sufficiency+whereby+he+was+passingly+more+able+to+live+by+himself+than+now+he+is%2C+it+is+evident+to+uphold+himself+in+any+commendable+estate+agreeing+with+his+creation%2C+it+is+needful+that+he+lean+upon+the+company+of+his+like.+Wherefore+Solomon+says%3A+%E2%80%98Two+are+better+than+one%2C+for+that+they+have+a+good+reward+of+their+labor%3A+For+if+the+one+fall+the+other+may+raise+up+his+fellow%3A+but+woe+to+him+that+is+alone%2C+for+if+he+fall%2C+there+is+no+second+to+lift+him+up.+Likewise+if+two+sleep+together%2C+they+get+warmth%2C+but+how+should+one+alone+come+to+any+thread+that+is+not+soon+broken.%E2%80%99+%28Eccl.+4%3A9%2C+etc.%29+The+philosophers%2C+which+saw+as+far+as+the+natural+eye+was+able+to+pierce%2C+esteemed+a+man+naturally+companionable%2C+and+him+that+naturally+without+constraint+of+banishment+and+such+like+severed+himself+from+the+society+of+men%2C+they+deemed+either+to+be+a+god+or+else+esteemed+to+be+a+wild+beast%3B+they+would+have+said+a+devil+if+they+had+as+much+knowledge+of+him+as+of+God.+Secondly%2C+as+this+solitary+life+is+an+enemy+to+mankind%2C+so+is+it+to+the+communion+of+saints+in+the+Church+of+God%3A+for+if+they+have+any+singular+gifts+that+take+their+flight+into+the+wilderness%2C+the+sentence+of+our+savior+Christ+pulls+their+wings%3A+That+no+man+lights+a+candle+to+put+it+under+a+bushel%2C+but+rather+sets+it+in+the+candlestick+of+some+society%2C+where+it+may+give+light+to+all+that+are+round+about+%28Mt.+5%3A15%29%3A+whether+also+is+referred+that+such+personages+are+called+the+salt+of+others%2C+which+has+need+to+approach+and+be+applied+to+that+flesh+which+it+must+season+and+deliver+from+putrefaction.+And+if+he+be+void+of+such+gifts%2C+or+have+not+in+any+great+measure%2C+then+also+is+it+meet+that+he+should+join+himself+to+their+company%2C+by+whom+he+may+have+supply+of+his+wants%2C+that+by+daily+conversation+with+the+wise+he+may+learn+wisdom%3F+And+if+neither+any+man+should+have+need+of+him%2C+nor+he+need+of+any%2C+yet+the+desire+of+being+in+the+congregation+of+God%E2%80%99s+people%2C+to+see+the+beauty+of+the+house+of+God%2C+in+the+participation+of+the+Word+and+sacraments+would+call+him%2C+would+so+inflame+him+as+to+cause+him+to+speed+himself+as+fast+from+the+forsaken+wilderness+to+the+place+of+the+assembly+of+God%E2%80%99s+people%2C+as+the+hart+pursued+of+the+dogs%2C+makes+footmanship+to+the+soil.+%28Prov.+13%3A20%2C+Ps.+42+%26+43%29.+For+David%2C+being+many+years+a+hermit+according+to+your+description%2C+that+is%2C+one+that+lived+in+erema%2C+or+wilderness%2C+did+notwithstanding+the+Lord%E2%80%99s+calling+into+that+place%2C+feel+the+horror+of+the+wilderness%2C+through+desire+he+had+to+go+with+the+rest+of+the+people+unto+the+house+of+God+%28Ps.+84%29.+If+therefore+it+be+a+pleasant+paradise+unto+you+which+was+unto+him+a+horrible+and+desolate+waste%3A+if+you+voluntarily+fly+from+that+which+he+did+so+thirstily+pursue%2C+and+if+you+greedily+seek+thither+from+whence+he+so+desirously+departed%2C+it+is+easy+for+all+men+to+see+that+your+hermits+and+monks+are+of+another+spirit+than+David+was.+But+the+example+of+the+primitive+church+conducted+by+the+hands+of+the+apostles+is+very+pregnant+against+these+wild+asses+whose+habitations+are+in+the+wilderness%3A+for+Luke+bears+witness+that+as+many+as+believed+were+together+in+one+place+%28Acts+2%3A44%29%2C+and+that+they+communicated+not+only+in+spiritual+things%2C+but+nourished+love+by+society+in+their+bodily+repasts+%5Bmeals%5D.+Whereupon+it+may+be+easily+perceived+that+as+amongst+birds+they+are+the+uncleanest+and+most+hateful+that+covet+the+desolate+places%2C+so+amongst+men+they+are+most+to+be+detested+that+forsake+the+mutual+society+of+their+brethren.+Against+this%2C+and+for+foundation+of+hermits+and+monks%2C+is+alleged%3A+First%2C+that+John+was+in+the+wilderness.+Whereunto+our+men+answering+that+it+was+no+such+wilderness+but+that+there+were+towns+in+it%2C+are+charged+with+shameless+perverting+of+the+place.+Howbeit+take+that+away+which+you+have+falsely+surmised+of+us%2C+that+we+expound+a+wilderness+which+is+full+of+towns%2C+and+the+shame+of+your+ignorance+will+return+upon+yourselves.+For+if+you+had+not+been+inured+or+unready+in+the+Word%2C+you+should+have+known+out+of+the+prophet%2C+who+wills+the+wilderness+with+their+cities+to+lift+up+their+voice.+Those+places+which+in+comparison+of+others+%5Bare%5D+more+peopled+are+called+wildernesses%2C+are+not+so+naked+of+their+inhabitants%2C+but+that+they+may+have+diverse+towns+and+villages+planted+in+them.+Hereupon+the+self-same+quarter+of+the+wilderness+of+Jordan+where+John+was%2C+there+was+the+town+of+Bethabara+builded+upon+the+bank+of+the+river.+Here+therefore+it+is+manifest+that+the+entrance+into+his+ministry+was+not+in+such+a+wilderness+as+the+Jesuits+imagine%2C+but+in+a+plain+inhabited+of+men.+The+reason+whereof+is+that%2C+as+the+first+captivity+and+stroke+of+God%E2%80%99s+judgment+began+about+those+parts+of+Jordan%2C+so+to+them+also+first+should+be+offered+the+saving+health%2C+which+was+able+to+comfort+them+over+all+their+desolations.+There+are+two+other+places%2C+and+but+two+%28as+far+as+I+remember%29+famous+by+John%E2%80%99s+ministry%2C+and+those+are%3A+1.+The+waters+of+Salem.+2.+The+waters+of+Enon%2C+which+are+so+called+of+the+two+towns+Salem+and+Enon%2C+set+upon+the+brink+of+those+waters.+So+that+John%E2%80%99s+whole+ministry%2C+so+far+as+may+appear%2C+was+executed+in+habitable+places%2C+where+the+cause+assigned+by+the+Holy+Ghost+why+John+haunted+those+places+is+to+be+observed%2C+namely%3A+for+the+abundance+of+waters+that+were+there+fit+for+his+ministry+in+the+holy+sacrament+of+baptism%2C+whereby+it+is+evident+that+John+came+not+to+those+places+for+that+they+were+not+so+much+peopled+as+others%2C+but+rather+for+seeking+the+commodity+of+water.+Now+therefore%2C+if+it+be+enough+to+make+a+hermit+or+a+monk+to+remain+in+such+a+wilderness+as+John+did%2C+I+can+direct+you+to+fitter+fathers+and+founders+of+your+kind+of+hermits.+You+have+therefore+Nabal+the+churl+which+dwelt+in+the+wilderness+of+Maon%3B+you+have+also+the+Ziphims%2C+which+dwelt+in+the+wilderness+of+Zyph%2C+that+would+have+betrayed+David+into+the+hands+of+Saul%3A+these+are+more+like+birds+of+your+feather.+Or+if+these+you+like+not%2C+you+have+the+heathen+men+which+are+called+Iaponici%2C+who+live+after+the+same+sort+that+your+monks+do%2C+and+in+like+laws.+Now+for+the+closing+up+of+John%E2%80%99s+ministry%2C+it+appears+to+have+been+in+the+court+of+Herod%2C+whether+a+man+would+think+that+it+should+be+hard+for+you+to+prove+that+he+repaired+to+the+end+that+he+might+live+in+a+wilderness.+And+if+it+were+granted+you+which+you+would+have%2C+yet+considering+that+whatsoever+was+done+here+was+to+fulfill+the+prophecy+of+Isaiah%2C+and+by+calling+of+the+Lord%2C+it+can+give+no+warrant+unto+you+which+undertake+this+of+your+own+head%2C+without+commandment+or+instruction+out+of+the+Word.+The+same+reason+is+there+of+his+authority+in+diet+and+apparel%2C+which+is+frankly+confessed+on+our+part+to+have+been+after+a+base+and+homely+sort%3A+howbeit+such+it+was+notwithstanding+as+the+country+%28for+abundance+of+camels+and+plenty+of+locusts+and+wild+honey+which+was+there%29+did+afford.+For+this+special+diet+and+apparel%2C+whereby+Saint+John%2C+declining+from+a+more+liberal+entertainment%2C+which+has+priestly+estate+did+yield+him%2C+conformed+himself+to+the+baser+and+poorer+sort+of+people%2C+was+not+a+fancy+of+his+own%2C+but+that+wherein+he+had+the+light+of+the+Word+to+go+before+him%3A+1.+First%2C+that+he+might+more+lively+represent+the+ministry+of+Elijah%2C+whereunto+he+was+diversely+like%2C+especially+in+the+restoring+of+the+true+worship+of+God.+2.+Secondly%2C+by+commandment+which+being+expressed+in+his+drink%2C+was+wisely+both+of+John%2C+and+of+his+parents%2C+by+proportion+and+convenience%2C+translated+unto+his+meat+and+clothing%3A+considering+that+it+would+have+been+as+an+old+piece+in+a+new+garment%2C+if+his+drink+being+by+God%E2%80%99s+prescription+thin+and+common%2C+his+meat+and+apparel+should+have+been+exquisite+and+picked.+Further%2C+seeing+that+John%E2%80%99s+ministry+has+no+succession%2C+neither+in+respect+of+his+calling+which+was+immediately+from+God%2C+nor+of+his+office%2C+which+was+to+prepare+the+way+for+the+former+coming+of+our+savior+Christ%2C+it+is+manifest+that+the+office+being+at+an+end%2C+the+things+that+were+annexed+unto+it+cannot+continue.+After+this%2C+Chrysostom+is+brought+for+the+confirmation+of+these+orders%2C+wherein+occasion+is+given+to+note+how+their+orders+of+hermits+and+monks+crept+first+into+the+church.+In+time+of+persecution%2C+good+men+were+glad+to+make+the+wilderness%2C+as+it+were%2C+the+cities+of+their+refuge+from+the+face+of+tyrants+that+pursued+them.+This+the+apostle+to+the+Hebrews+does+plainly+set+forth%2C+where+diverse+amongst+sufferings+for+the+truth%2C+he+adds+that+some+wandered+in+the+wilderness%2C+in+mountains%2C+and+hid+themselves+in+dens+and+holes+of+the+earth%2C+clad+in+badgers%E2%80%99+and+goats%E2%80%99+skins+%28Heb.+11%3A38%29%2C+in+which+number+it+is+apparent+that+Elijah%2C+upon+whom+you+would+also+father+this+profession%2C+is+contained.+He+adds+that+therefore+they+were+in+the+wilderness%2C+because+the+world+%28that+dwelt+in+cities+and+villages%29+were+not+worthy+of+them.+If+therefore+you+now+forsake+the+people+by+example+of+these+hermits%2C+it+is+evident+that+you+condemn+your+popish+towns+and+cities+as+profane+and+utterly+unworthy+of+your+company.+And+that+which+the+epistle+to+the+Hebrews+witnesses+of+diverse+times+of+the+Law%2C+the+same+do+the+ecclesiastical+writers+of+diverse+alike+times+under+the+Gospel%2C+as+appears+by+the+example+of+Paulus+of+Thebes%2C+supposed+most+commonly+to+be+the+prince+of+the+monks+and+hermits%2C+which+took+the+wilderness+only+as+a+remedy+in+persecution+raised+against+him.+Further%2C+the+apostle+in+the+said+epistle%2C+and+St.+John+witnesses+of+the+whole+estate+of+the+church%2C+that+it+should+be+in+this+respect+a+hermit%2C+wherefore+the+cause+of+this+hermetic+life%2C+being+through+peace+of+the+church+taken+away%2C+the+kind+of+life+ought+to+have+gone+withal.+But+as+the+churches%2C+by+an+unadvised+imitation+drew+the+interrogatories+ministered+in+the+primitive+church%2C+to+those+which+were+of+years+to+profess+their+faith+in+baptism%2C+unto+young+children%3A+even+so+with+like+unadvisedness%2C+the+state+of+the+hermits%2C+which+properly+agreed+unto+the+persecuting+times%2C+was+translated+unto+the+peaceable+times+of+the+church.+It+was+no+marvel+therefore%2C+although+Chrysostom+and+others+did+fall+sometimes+into+the+commendation+of+the+monkish+and+hermetic+life.+But+their+hermits+and+monks+are+so+unlike+the+pope%E2%80%99s+creatures%2C+that+it+is+a+marvel+that+they+would+fetch+meat+at+the+father%E2%80%99s+hands+to+nourish+this+cattle+with%2C+of+whom+they+could+not+well+be+ignorant+but+that+they+should+receive+more+stripes+than+their+meat+is+worth.+1.+For+first%2C+they+were+not+within+any+degree+of+church+ministry%2C+whereby+they+were%2C+by+so+much+the+freer+to+live+unto+themselves.+2.+Secondly%2C+they+were+not+as+caged+as+yours+as%2C+but+it+was+left+free+unto+them%2C+whether+they+would+repair+to+the+company+of+other+monks+or+not.+3.+Thirdly%2C+they+were+bound+to+wash+the+guests%E2%80%99+feet.+4.+Fourthly%2C+there+was+permitted+unto+them+care+of+wives%2C+of+family%2C+and+private+possession%2C+so+that+the+same+were+moderate+and+not+against+the+care+of+the+soul%3A+contrary+to+your+laws%2C+which+thrust+upon+them+the+vow+of+wilful+poverty.+5.+Fifthly%2C+their+diet+throughout+was+very+sparing%2C+whereas+your+monks+feed+so+fat%2C+that+their+fatness+and+great+bellies+are+grown+into+a+proverb.+6.+Sixthly%2C+the+ancient+monks+got+their+living+with+the+labor+of+their+hands%2C+whereof+also+they+were+bound+to+give+an+account+unto+their+father%3B+yours+are+idle+bellies%2C+which+live+off+the+labors+of+others+only.+7.+Seventhly%2C+they+were+not+too+notorious+by+singular+weed%2C+or+kind+of+apparel%2C+least+men+passing+by+should+stand+gazing+upon+them%2C+or+point+them+out+with+the+finger%3F+Yours+are.+Hither+also+is+to+be+referred+that+they+had+no+rasure+%5Bshaving%5D+command%2C+only+it+was+provided+that+they+should+have+their+hair+long%2C+as+women+have%2C+where+yours+are+crown+shaven.+Likewise%2C+in+the+virgins+at+that+time%2C+it+was+sharply+reproved+if+they+did+cut+off+their+hair%2C+whereas+you+commend+it+highly%2C+as+a+virtue+in+your+nuns+that+they+clip+their+hair.+8.+Eighthly%2C+many+of+the+monks+in+the+elder+times+remaining+monks%2C+retained+their+wives%2C+which+to+you+is+an+abomination%2C+who+thrust+upon+them+the+vow+of+continual+continency.+Last+of+all%2C+these+were+obedient+unto+their+bishop+or+pastor%2C+as+well+as+other+of+the+body+of+the+church%3A+yours+are+exempted+from+his+obedience.+So+that+in+vowing+obedience+of+your+own+invention%2C+you+disavow+the+obedience+which+the+Lord+has+commanded+unto+you.+Now+touching+your+testimonies%2C+Chrysostom+has+not+that+John+%5Bthe+Baptist%5D+was+Prince+of+the+Hermits%2C+as+you+would+untruly+insinuate%3A+but+of+the+monks%2C+without+mention+of+the+hermits.+Which+also%2C+if+they+have+no+manner+of+ground+out+of+the+Evangelist%2C+have+we+not+cause+to+be+offended+with+Chrysostom%3F+And+we+would+think+the+Jesuits+themselves+should+not+be+altogether+pleased+with+him%3B+saying+that+they+like+well+that+the+truth+be+always+spoken+against%2C+so+that+it+be+by+a+friend+of+the+truth%2C+under+whom+they+may+cover+their+deadly+hate+against+it.+Otherwise+how+will+they+digest+that+he+says%2C+The+soul+of+the+monks+is+without+grief+or+passion+and+their+bodies+be+as+Adam%E2%80%99s+before+the+fall.+Jerome%2C+speaking+of+anchorites+and+monks%2C+reckons+up+the+opinions+of+others%2C+how+some+esteem+Elijah+the+author+of+them%3A+other+some+John+Baptist%3B+which+opinions+Jerome+does+apparently+nip+in+the+head%2C+affirming+Elijah+more+than+a+monk%2C+and+John+a+prophet+from+his+birth%3A+and+therefore+none+that+made+choice+of+any+special+vocation.+But+that+the+most+part%2C+one+Paulus+of+Thebes%2C+the+prince+of+that+sect%3A+where+it+is+to+be+observed+that+this+monkish+and+hermetic+birth+is+so+obscure+that+the+father+of+it+is+unknown.+Secondly%2C+the+nearest+guess+that+can+be+had+of+the+parentage+of+it%2C+leaves+it+altogether+in+the+filth+of+man%E2%80%99s+invention.+Last+of+all%2C+that+all+our+monks+and+hermits+and+bastard+and+degenerate+children+from+their+father+Paulus+of+Thebes%2C+the+likelist+prince+of+their+profession%2C+whom+Jerome+affirms+to+have+taken+the+wilderness%2C+not+of+his+voluntary+will%2C+but+persecuted+even+of+his+nearest+friends.+Touching+Isidorus%2C+if+all+speak+truth+that+are+learned%3A+he+%28for+his+time+wherein+he+lived%29+should+be+worthy+of+credit.+He+flourished+about+Pope+Gregory%E2%80%99s+days+the+great%2C+when+this+kind+of+cattle+was+not+dainty.+And+therefore+if+the+stream+of+common+error+carried+him+to+the+liking+and+praising+of+such+a+seat%2C+there+is+no+learning+nor+wisdom+in+the+world+%28without+a+special+grace+from+God%29+which+was+able+to+resist+such+a+forcible+drift.+Howbeit+Isidorus+was+not+so+wedded+to+the+monks+as+the+Jesuits%2C+who+of+six+kinds+of+monks+rejects+three+as+very+bad%3A+where+there+is+not+with+the+Jesuits+no+order+of+monks+which+are+not+sacred%3B+who%2C+wheresoever+they+do+but+find+the+name+of+a+monk%2C+by+and+by+they+think+that+it+is+ground+good+enough+to+plant+monkery+upon.+In+Bernard%2C+your+purveyor+has+deceived+you%2C+for+we+find+no+such+treatise+as+you+give+the+title+of.+In+a+sermon+of+John%E2%80%99s+nativity%2C+he+greatly+commends+him%3A+but+with+no+mark+either+of+monk+or+hermit.+Neither+has+he+any+other+thing+that+makes+for+your+purpose.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+Confutation+of+the+Rhemists%E2%80%99+Notes%2C+Glosses+%26+Annotations+on+the+New+Testament%E2%80%A6+%28d.+1603%3B+%5BLeiden%5D+1618%29%2C+on+Mt.+3%3A1%2C+pp.+9-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a739707c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0a739707c2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monasticism/#:~:text=This%20monkish%20and%20hermetic%20life%20is,thing%20that%20makes%20for%20your%20purpose&amp;text=This%20monkish%20and%20hermetic%20life%20is%20first%20of&amp;text=any%20other%20thing%20that%20makes%20for%20your%20purpose" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Position 3. The monkish conceit of the excellency of a contemplative life separated from all obligation to duties of the Second Table, above the practical life, has been the first seed of wicked Familism: the authors of both these books called Theologia Germanica and The Bright Star being professed Papists, though Mr. Randall extol both as pieces of rare price and doctrines suiting only for the perfect… Position 4. There is a twofold fulness of loveliness in Christ; one attainable in this life, the other reserved for the life to come. The full and highest pitch of the drawing loveliness of Christ, I think excludes all ordinances, Scripture, sacraments, and means we now use. Because old monks and late Familists make no heaven but in this life only (as if a monks’ coul were the very crown of eternal glory) and say the Resurrection is past; as their fathers Hymeneus and Phyletus said, and doubt of the immortality of the soul; therefore they, that they may be true to their own principles, must say that there be a number of perfect men that are above and higher than Law, duties, ordinances, teaching of men, ministry, because these are for the unperfect and unregenerate (and the monks and Familists are not such, but do already enjoy God in a fruition of glory). But the Scripture says that means, ordinances, are ever in use in this life and only excluded from the life to come, 1 Cor. 13:8.</p></blockquote>

<blockquote><p>§X. And since before the Eucharist, priests are accustomed to hear confession, we add this. We admit public confession of sins: 1. Made by the whole Church to God. 2. Of particular parts of the whole Church (2 Cor. 2:6). And private: 1. Made to God. 2. To those whom we have injured. 3. By the troubled and doubting conscience to any believer who can console us. §XI. But we disapprove of confessions: 1. Being forced, 2. Of all sins, 3. Including secret sins. 4. Only to the ears of the priest. 5. For obtaining from the priest remission of sins. Controversy – Is it necessary for someone seeking remission of sins to tell his secret sins to a priest? We deny against the Papists. Arguments: 1. Christ remits the sins of the one who believes, including those not recounted in detail (Mt. 9:2), “and as the Father sent him, so He sends us” and wants us to do the same (Jn. 20:21). 2. Saints who confessed their sins only to God obtained remission (Ps. 32:5, Lk. 18:13-14). 3. No one has to reveal his own wickedness (Jude v. 13). 4. God alone, not priests, can remit and wipe away sins (Lk. 5:21). 5. This is pure tyranny over consciences. Objections: 1. Then, for what purpose was the power of remitting sins given (Jn. 20:23, 2 Cor. 5:19)? Reply: This is nothing else than proclaiming remission of sins in the name of God to the penitent. 2. “Many confessed their sins” (Acts 19:18). Reply: Those who had lived profanely before conversion and performed magic confessed publicly not to a priest in the ear that they had lived wickedly. 3. Confess your sins one to another (Jas. 5:16). Reply: Then why not the priests to the people? This refers to someone who is afflicted on account of sins. We are warned concerning these sins that we should not deny them. 4. If we confess our sins, He will remit them (1 Jn. 1:9). Reply: If we confess to God, God remits.</p></blockquote>

<blockquote><p>The sum of the whole discussion amounts to this: [1] that celibacy is better than marriage, because it has more liberty, so that persons can serve God with greater freedom; but at the same time, that [2] no necessity ought to be imposed, so as to make it unlawful for individuals to marry, if they think proper; and farther, that [3] marriage itself is a remedy appointed by God for our infirmity, which all ought to use that are not endowed with the gift of continency. Every person of sound judgment will join with me in acknowledging and confessing, that the whole of Paul’s doctrine on this point is comprehended in these three articles.</p></blockquote>

<blockquote><p>In this behalf no law can be prescribed, neither can we judge one of another, but every man should be a sufficient witness to himself, because in himself he feels the infirmities and pricks of the flesh. And albeit there appear never so many stops and lets in marriage, yet this must all understand to whom God has not given the gift of chastity (and so by that means not able to withstand the pricks of the flesh), that this commandment is by the Lord laid upon their shoulders as a burden to bear, which if it be not performed (seeing that God has appointed this as a remedy against sin), they commit grievous iniquity, and by that their dealing heap unto themselves wrath against the day of the Lord.</p></blockquote>

</figure><figure class="quote" id="q-e88490c0b8" data-kw="">
<blockquote><p>When one asked him concerning marriage, whether it were good to marry; seeing sometimes, when concupiscence pricked him, he was moved to it, and some other time when he felt no such thing, he thought he might abstain from it: He answered, many come hastily into that calling, not vying the means of trying their estate thoroughly before; as namely, whether they by prayer, fasting, and avoiding all occasions of concupiscence, have the gift of chastity or no? Many use some of the means, and not all: many use all the means, but a small time: therefore it is good to use first the means, not part of them, but all of them: not for a while, but long. If so be that all these things will not prevail, attend upon the Lord’s ordinance, and wait when the Lord shall give just occasion of using that estate, to his glory and our comfort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite></span></figcaption>

</figure><figure class="quote" id="q-68d523f386" data-kw="">
<blockquote><p>What then? shall the single life have no prerogative? Yes questionless, if it conduce more to piety, then marriage; but if it fail in this point it’s much inferior to marriage. Now it always fails of that in them who have not the gift of it. There are some (says our Savior) which make themselves eunuchs for the kingdom of heaven; but all men cannot receive this saying, save they to whom it is given. Which is clearly expounded unto us by St. Paul, telling us that he could wish indeed, that all had the gift of continence as well as he, but that every man hath his proper gift, one in one kind, another in another. To him then, who has received this gift after the same manner as St. Paul had received it, his single life doubtless will be far more advantageous than marriage, because that to him who is thus qualified, virginity is a help for piety, marriage would be but an incumbrance. But to him who has not received that gift in that manner, his single life would be but a snare and a trap: for by reason of his single life he would burn, and the apostle tells us that it is better to marry than to burn. As then marriage serves but for an hindrance and disturbance to him, who has the gift that St. Paul had, to wit, the gift of continence: so the single life serves but for an encumbrance and temptation, the danger of which is unavoidable, and deadly, to him who has not received the gift of containing himself. We worthily esteem of the single life of those whom God calls to it, but we say that no man is called unto it, who is forced to burn in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed</cite>, … trans. William Pinke (Oxford: Edward Forrest, 1626), pp 168-69</span></figcaption>

</figure><figure class="quote" id="q-3addbfe7cd" data-kw="">
<blockquote><p>V. 7. ‘I would that all men were even as I my self.’ The apostle does not simply wish that all men and women led a single life; for so the Church of God could not be propagated, nor [would] the divine benediction upon the married [be] fulfilled: but that all had the gift of continency, and were as free from worldly cares, and fleshly entanglings, as he. And this gift of continencie may stand with holy matrimony; as we read of Malchus and many others in the Ecclesiastical stories, who though they were married, yet having the gift of continency fulfilled the apostle’s precepts, verses 29 &amp; 32, having wives as if they had them not, and caring for the things of the Lord.</p></blockquote>

<blockquote><p>For wot you why? it may be every man’s case: and do they love virginity? I am sure the Rechabites did honor marriage, and propagated a good generation to the world: They knew that the gift of perpetual continence is not a grace of common course: and extraordinary dispensations are not presumptuously to be arrogated to the use of every regenerate Christian, no nor for the command of any prophet. Why should St. Paul leave Trophimus sick at Miletum? Why was bishop Timothy’s stomach weak? Paul could not help it. Grace allotted for extraordinary operations is not every man’s portion; nor always at hand for them who at some seasons have a taste of it: and such is the rose of the garland, the gift of chastity.</p></blockquote>

<blockquote><p>But the Romish clergy, together with the infinite orders of religious votaries, are not few but many, and those chosen promiscuously without any respect had whether they be endowed with that gift or no: therefore, being unable to contain, and forbidden to use the lawful remedy ordained by God, they must of necessity fall into lawless and inordinate lusts: Besides, seeing that every man that will, be he never so defamed for incontinency, and so by experience known to be void of that same excellent gift, may become a votary, and on the contrary (our Savior says) every man cannot receive this, what hope can there be of chastity among these men? Is the gift of chastity indeed so common, that every man may have it that will? Is it so ordinary, that it is communicated to thousands of priests, monks, friars, and nuns? yea, to innumerable of that order in all places? why then, what meant Cassander, a learned divine of their own, to say, that the world was come to that pass, that a man could scarce find one of an hundred that kept himself free from incontinency?</p></blockquote>

</figure><figure class="quote" id="q-3e7b99112f" data-kw="">
<blockquote><p>Scholars have often depicted English Protestant Marriage Doctrine as nearly monolithic in its praise of marriage over celibacy as well as the liberty of all Christians to marry, but the literature actually reveals considerable tension. There was a heightened emphasis on celibacy as an inherently superior state among the spiritual sects and even among conforming churchmen who advocated the vita angelica [angelic life]. However, even though most English Protestants quickly rejected such claims, they still had to square their vigorous support of marriage with the expediency that celibacy afforded for serving God and promoting one’s spiritual welfare. The pragmatic advantages of celibacy could not simply be dismissed since they had clear scriptural support. Furthermore, despite rejecting the bifurcation of Scripture into universal commands and evangelical counsels, English Protestants struggled to develop a new moral system that answered whether Christians were obligated to forsake their liberty to marry if celibacy was more expedient. Both Jesus and Paul had counseled Christians to remain single if they were able. English Protestants navigated around Scripture’s commendation of celibacy by limiting its application to those with the gift of chastity and periods of persecution. They also asserted that Scripture merely counseled or advised celibacy, rather than commanding it. Yet both solutions depended on tenuous assumptions. The first assumption was hermeneutical and depended on the conviction that Scripture’s teaching on marriage in Genesis 1-2 was normative while Paul’s was an exception for certain occasions. The second assumption was that Christians were not obligated to choose the state of life in which they could best devote themselves to God. If either of the two assumptions were challenged, as they already had been with Whately, and especially Ames, then the decision to marry or remain single would be approached much differently; it would no longer concern the Christian’s liberty to choose what was “good” but the Christian’s obligation to choose what was “best.” As it so happened, Baxter explicitly claimed to have been influenced by both Whately and Ames.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy PhD diss</cite>, (Southern Baptist Theological Seminary, 2018) 445 pp., p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/the-church.html">Rome: The Church</a></span></div>

<blockquote><p>…Chapter 5 argued that Baxter’s treatment of clerical celibacy in the Christian Directory was a product of the three principles that he believed were vital to the Christian life. A life of godliness depended on maintaining a heartfelt love for God, continually meditating on the future life, and ordering one’s life to prioritize doing the greatest good. All intimate relationships, whether familial or bosom friends, posed a common potential threat to his three principles for Christian living. Intimate relationships frequently led one to the sin of disproportionately concentrating affections and time on a select few; this imbalance hindered Christians’ affections for God, focus on the future life, and devotion to doing the greatest good. Therefore, while the godly life was not impossible in marriage, celibacy usually proved to be the most advantageous state of life for Christians and especially pastors. Since Christians were obliged to choose the most profitable state of life, they should only marry if they had a very definite call from God that wedlock would hold more benefits than hindrances to their spiritual welfare and capacity to serve God. The necessity of choosing the most expedient state of life applied even more to pastors, since the hindrances of marriage would be even more detrimental to them in light of the requirements of their sacred calling. Chapter 6 concluded that Baxter’s decision to marry did not signify a capitulation of his argument for clerical celibacy but rather testified to its continuance. Furthermore, in choosing to marry Margaret, Baxter acted consistently with his teaching on what should motivate Christians to marry. Baxter’s account of his wife’s early life described her spiritual transformation from a worldly maiden into one of his most pious and devoted parisioners. Margaret’s affection for Baxter grew out of the influential role he had played in her life as a dear friend, father figure, and pastor of her soul. Baxter’s appreciation of her stemmed from the support, encouragement, and counsel she gave him during his failed attempts to achieve a moderate church settlement after the Restoration. This period was one of the lowest points in Baxter’s life, and Margaret proved to be a great help to his distressed soul. Nevertheless, he remained firmly committed to clerical celibacy and only decided to marry once he had been silenced and ejected from the Kidderminster with no hope of ever having a parish ministry again. Baxter still considered himself a minister of the gospel. However, he would never have a specific pastoral charge that would require him, according to his specific pastoral model, to personally oversee the spiritual state of every parishioner. Since his argument for clerical celibacy no longer applied to his situation, he now felt at liberty to marry and called to marry Margaret. Chapter 7 argued that the problems Baxter experienced in adjusting to married life help explain his continued support for clerical celibacy, despite the great benefit Margaret was to him. Though without a parish ministry, he still devoted himself to serving the universal church and training pastors, primarily through his writings. He persisted in his dedication to redeeming the time by prioritizing matters of necessity, especially choosing his public duties to the church over his private duties to Margaret. When time was scarce, which often proved true because of his chronic illness, his sense of pastoral urgency compelled him to put his ministerial responsibilities before Margaret. Hence, he experienced the same agonizing conflict of loyalties between ministry and marriage that he had always warned pastors to avoid. The benefits afforded by a godly wife, even one as extraordinary as Margaret, seemed to fail to make up for the loss of time and singular devotion which marriage inevitably compromised. Moreover, Baxter viewed Margaret’s exceptional godliness and helpfulness as an exception to what he had always believed men could usually expect from wives. Though scholars have puzzled over why he continued to argue for clerical celibacy, the answer lies in the fact that Baxter was still Baxter, a man driven by a single-minded focus on his public ministry. This study of Baxter’s argument for clerical celibacy has… shown that English Protestants were less monolithic in their praise of marriage over celibacy than previously thought. Celibacy actually experienced a revival of interest among English Protestants during the course of the seventeenth century, and not just among radical sects but also some members of the Church of England. Furthermore, there was considerable disagreement over whether Christians were obligated to remain single, if they could remain chaste, since Paul had said that celibacy was better than marriage. While most stressed that marriage was a lawful and honorable state for all people, a significant minority believed that Christians should only marry once they discovered they lacked the gift of chastity… Second, nearly all scholars have failed to realize that Baxter’s argument for clerical celibacy was key to fulfilling the rigorous ministerial expectations he proscribed in The Reformed Pastor. Baxter presented a model that expected pastors to personally catechize, admonish, and discipline each one of their hundreds or perhaps thousands of parisioners. The ideal pastor was not only defined by his assiduous labor to care for the soul of each parishioner, but also by the fact that he had been freed to do so by foregoing marriage for the sake of the sacred ministry. Only celibacy allowed for the maximal implementation of Baxter’s pastoral model for church reform. …Experience was an influential teacher to Baxter, and he often exhorted all Christians to imitate what he found to be successful in his own life and ministry. His argument for clerical celibacy provided a prime example, for he was simply commending the practice that had been crucial to his pastoral triumph at Kidderminster. Fourth, the uniqueness of Baxter’s argument for clerical celibacy forces one to reexamine the nature of the Christian Directory in terms of the book’s purpose and overarching principles. Scholars have presented the Christian Directory as a summa of the very best of Puritan practical divinity, but such a depiction is difficult to square with Baxter’s argument for clerical celibacy. The conundrum is resolved by understanding that the book was a record of Baxter’s pastoral instruction and practice at Kidderminster, which he intended to help represent his model of ministry for young and inexperienced ministers. He was presenting to them his own convictions about clerical marriage and hoping that many pastors would heed his advice and avoid marrying unless God clearly called them to it…</p></blockquote>

e practice that had been crucial to his pastoral triumph at Kidderminster. Fourth, the uniqueness of Baxter’s argument for clerical celibacy forces one to reexamine the nature of the Christian Directory in terms of the book’s purpose and overarching principles. Scholars have presented the Christian Directory as a summa of the very best of Puritan practical divinity, but such a depiction is difficult to square with Baxter’s argument for clerical celibacy. The conundrum is resolved by understanding that the book was a record of Baxter’s pastoral instruction and practice at Kidderminster, which he intended to help represent his model of ministry for young and inexperienced ministers. He was presenting to them his own convictions about clerical marriage and hoping that many pastors would heed his advice and avoid marrying unless God clearly called them to it…”

<blockquote><p>Baxter (1615–1691) was… [an] English Puritan of the seventeenth century. He is well known for his ministerial manual “The Reformed Pastor”, in which he expressed the unusual conviction that parish ministers were better off unmarried. And yet, Baxter seemed to contradict himself by marrying one of his parishioners, Margaret Charlton. Though Baxter claimed to be happily married, he continued to champion celibacy for the rest of his life. This book explores Baxter’s argument for clerical celibacy by placing it in the context of his life and the turbulent events of seventeenth-century England. His viewpoint was shaped by several factors, including the Puritan literature he read, the context of his parish ministry, his burdensome model of soul care, and the formative life experiences shaping his theology and perspective. These factors not only explain why Baxter became the only Puritan to champion clerical celibacy but also why he continued to do so even after marrying.</p></blockquote>

</figure><figure class="quote" id="q-a4f0a417ed" data-kw="">
<blockquote><p>It may seem absurd to say that he ‘is in heaven’ while he still lives on earth. If it is answered that this is true about his divine nature, then this expression would mean something else—-namely, that while he was man he was ‘in heaven.’ I could point out that no place is mentioned here and that only Christ is distinguished from everybody else as far as his state is concerned, since he is the heir of the kingdom of God, from which the whole human race is banished. However, as very frequently happens, because of the unity of the person of Christ, what correctly applies to one of his natures is applied to another of his natures, and so we need seek no other solution. So Christ, who ‘is in heaven,’ has clothed himself in our flesh, so that by stretching out his brotherly hand to us he may raise us to heaven with himself.</p></blockquote>

<blockquote><p>Through an examination of the history of the doctrine and its constituent features the present article advocates the reclamation of the doctrine as a necessary component for a contemporary theology of the atonement… The extra Calvinisticum is then adopted to refute contemporary theologies of a suffering God.</p></blockquote>

</figure><figure class="quote" id="q-d8fcc4f03a" data-kw="">
<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>

<blockquote><p>XV. The Arminians do cover themselves against this shower of arguments, with that their distinction of the antecedent and consequent will of God. They say that God does love some men more than other by his consequent will, that is, by that will which is after the faith and repentance of man: For God does love them most, whom he forsees will believe, and by their own free will, are to use grace well. But by his primary and antecedent will, God does alike love all men, and does equally desire the salvation of all; and therefore he doth give to all men sufficient grace for faith, and so for salvation. And the cause why the Gospel is not preached to all, they say, is not the will of God, but either the negligence of Christians, or the indignity and unworthiness of the people, or else the sins of their ancestors, who have rejected grace, being offered. XVI. Certainly this is a deadly speech, and is directly contrary, not only to the Scripture, but also to itself. For while they bring reasons, why God does not offer his Gospel to all, unawares they yield to our party; for they lay down the causes, why God does not equally love all: But the question is not, why God loves some men more than others, but whether God does love all men equally; therefore they entangle themselves. And how absurd that distinction is of the will of God into antecedent and consequent, how contumelious against God, in that sense in which it is taken by the sectaries, we have taught at large, Chap. 5. XVII. Moreover, they teach, that God is often disappointed of his antecedent will, and that the love of God to us is then mutable, if he love us with his consequent will, that is, by his will which is after our love and faith, and our own will. It is a wicked thing to desire, that the immutability of the love of God towards us, should be after our love, and should depend on our will; for the love of God cannot be certain, if it be grounded on the love wherewith we first love him. That therefore the love of God to us might be certain and immutable, it must needs go before our love, as Saint John teaches, 1. Epist. 4. 19. You love him, because he loved you first.</p></blockquote>

<blockquote><p>29. He who shall eat unworthily, eateth judgment to himself. He had previously pointed out in express terms the heinousness of the crime, when he said that those who should eat unworthily would be guilty of the body and blood of the Lord. Now he alarms them, by denouncing punishment; for there are many that are not affected with the sin itself, unless they are struck down by the judgment of God. This, then, he does, when he declares that this food, otherwise health-giving, will turn out to their destruction, and will be converted into poison to those that eat unworthily. He adds the reason—because they distinguish not the Lord’s body, that is, as a sacred thing from a profane. “They handle the sacred body of Christ with unwashen hands, (Mark 7:2,) nay more, as if it were a thing of nought, they consider not how great is the value of it. They will therefore pay the penalty of so dreadful a profanation.” Let my readers keep in mind what I stated a little ago, that the body is presented to them, though their unworthiness deprives them of a participation in it. For this cause, etc. After having treated in a general way of unworthy eating, and of the kind of punishment that awaits those who pollute this sacrament, he now instructs the Corinthians as to the chastisement which they were at that time enduring. It is not known whether a pestilence was raging there at that time, or whether they were labouring under other kinds of disease. However it may have been as to this, we infer from Paul’s words, that the Lord had sent some scourge upon them for their correction. Nor does Paul merely conjecture, that it is on that account that they are punished, but he affirms it as a thing that was perfectly well known by him. He says, then, that many lay sick—that many were kept long in a languishing condition, and that many had died, in consequence of that abuse of the Supper, because they had offended God. By this he intimates, that by diseases and other chastisements from God, we are admonished to think of our sins; for God does not afflict us without good reason, for he takes no pleasure in our afflictions. The subject is a copious and ample one; but let it suffice to advert to it here in a single word. If in Paul’s times an ordinary abuse of the Supper could kindle the wrath of God against the Corinthians, so that he punished them thus severely, what ought we to think as to the state of matters at the present day? We see, throughout the whole extent of Popery, not merely horrid profanations of the Supper, but even a sacrilegious abomination set up in its room. In the first place, it is prostituted to filthy lucre (1 Tim. 3:8) and merchandise. Secondly, it is maimed, by taking away the use of the cup. Thirdly, it is changed into another aspect, by its having become customary for one to partake of his own feast separately, participation being done away. Fourthly, there is there no explanation of the meaning of the sacrament, but a mumbling that would accord better with a magical incantation, or the detestable sacrifices of the Gentiles, than with our Lord’s institution. Fifthly, there is an endless number of ceremonies, abounding partly with trifles, partly with superstition, and consequently manifest pollutions. Sixthly, there is the diabolical invention of sacrifice, which contains an impious blasphemy against the death of Christ. Seventhly, it is fitted to intoxicate miserable men with carnal confidence, while they present it to God as if it were an expiation, and think that by this charm they drive off everything hurtful, and that without faith and repentance. Nay more, while they trust that they are armed against the devil and death, and are fortified against God by a sure defence, they venture to sin with much more freedom, and become more obstinate. Eighthly, an idol is there adored in the room of Christ. In short, it is filled with all kinds of abomination. Nay even among ourselves, who have the pure administration of the Supper restored to us, in virtue of a return, as it were, from captivity, how much irreverence! How much hypocrisy on the part of many! What a disgraceful mixture, while, without any discrimination, wicked and openly abandoned persons intrude themselves, such as no man of character and decency would admit to common intercourse! And yet after all, we wonder how it comes that there are so many wars, so many pestilences, so many failures of the crop, so many disasters and calamities—as if the cause were not manifest! And assuredly, we must not expect a termination to our calamities, until we have removed the occasion of them, by correcting our faults.</p></blockquote>

tance.+Nay+more%2C+while+they+trust+that+they+are+armed+against+the+devil+and+death%2C+and+are+fortified+against+God+by+a+sure+defence%2C+they+venture+to+sin+with+much+more+freedom%2C+and+become+more+obstinate.+Eighthly%2C+an+idol+is+there+adored+in+the+room+of+Christ.+In+short%2C+it+is+filled+with+all+kinds+of+abomination.+Nay+even+among+ourselves%2C+who+have+the+pure+administration+of+the+Supper+restored+to+us%2C+in+virtue+of+a+return%2C+as+it+were%2C+from+captivity%2C+how+much+irreverence%21+How+much+hypocrisy+on+the+part+of+many%21+What+a+disgraceful+mixture%2C+while%2C+without+any+discrimination%2C+wicked+and+openly+abandoned+persons+intrude+themselves%2C+such+as+no+man+of+character+and+decency+would+admit+to+common+intercourse%21+And+yet+after+all%2C+we+wonder+how+it+comes+that+there+are+so+many+wars%2C+so+many+pestilences%2C+so+many+failures+of+the+crop%2C+so+many+disasters+and+calamities%E2%80%94as+if+the+cause+were+not+manifest%21+And+assuredly%2C+we+must+not+expect+a+termination+to+our+calamities%2C+until+we+have+removed+the+occasion+of+them%2C+by+correcting+our+faults.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+1+%26+2+Corinthians%2C+vol.+1+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2010%29%2C+388%E2%80%9392.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1551048a61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1551048a61.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/07/calvin-on-the-danger-of-abusing-the-lords-table/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>It is the perfection of a perfect being that he does not, yea, that he cannot change. God is a perfect being. It is His perfection that He is true, essentially and immutably true. He can as soon cease to be, as cease to be true. His truth is the golden thread which unites all his perfections; it is the glory and perfection of all, that all are based upon and held together in perfect and eternal harmony by truth.

“It is impossible for God to lie;” “He cannot deny himself,” are among the strongest asseverations which the Holy Ghost has made of his veracity. To deviate the shadow of a shade from his word, from his oath, — from his promise, from his covenant, — would be to undeify himself. Now as God cannot cease to be, — that being an impossibility, — it is equally impossible that he should deny himself.

Consider, too, what the converse of this proposition would be in its consequences to the child of God. How disastrous to all the blessed and glorious hopes of the believer! For, what repose could the soul find in his love, what confidence in his power, if truth, the basis and the security of all, were wanting? What a cloud would overshadow every perfection of his being, and how soon would he cease to be what he is so beautifully declared to be, “a God of truth, and without iniquity; just and right is he!” — Deut. xxxii . 4 .</p></blockquote>

<blockquote><p>I do not now enter upon the question whether the civil magistrate, as such, is equally bound with the Church to contemplate in his actings the glory of God, and to strive to promote the spiritual interests of the community. This is a question which will fall to be discussed afterwards, and which at the present stage of the argument we can afford to postpone. It is enough for our present purpose to assert—and it would be difficult directly to contradict the averment—that there is a large class of duties as between man and man, and not as between man and God, which it is the joint province and end both of the Church and the state to promote.

The first Table of the moral law comprehends an order of duties which it is the main and direct object of the Church to inculcate and advance among men, and which Voluntaries will not admit to appertain in any sense to the civil magistrate. But setting aside these, there are the duties of the second Table of the moral law, which no one can pretend to deny are the concern of the state as much as of the Church.

The life of man, as entrusted to the keeping of his fellow-men, or exposed to their violence; the ordinance of marriage, with its rights and privileges both civil and sacred; the property of man, with the laws that regulate its possession, and declare the guilt of encroachment upon it; the duty and solemnity of an oath, which forms the cement of civilised society, and without which it could not cohere as a society at all; the obligation of honesty and justice between man and man, and the peace and contentment of each with his lot and outward estate: these are matters which are equally the concernment of the civil magistrate and of the Christian Church, and fall equally in one shape or other within the province of both.

Whatever peculiar and more immediate objects may fall directly under the contemplation of the Church and state respectively, there can be no doubt that there are certain ends—indirectly, it may be, as regards the one or the other—that are common to both, and after the attainment of which it is the duty of both alike to strive.

There is common ground here where the Church and state may meet, where, in fact, they must meet, unless they would abdicate their functions and deny their responsibility. There is such a community of duty and interest between the Church and state in regard to these matters, that they must act in concert, either more or less openly avowed, if they act at all; and we see the foundation laid in the fact of their having such ends in common for a friendly alliance and co-operation between the two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 114-15.</span></figcaption>

<blockquote><p>[T]here be those that will not come to the Sacrament of the Lord’s Supper, (I speak what I know) because they say it is a sacred thing; and if they come there, they must enter into a solemn Covenant with God, which they know they cannot keep, and therefore they forbear to come:

I commend the reverent esteem which these people have of that sacred Institution; but I cannot but mourn for this, that they are afraid to tie themselves to God: Doth David desire and beg of God, To knit his heart unto him, Psal. 86.11. And doth Saint James say, Draw near unto God, and he will draw near unto you, and do these fear being tied too close to God? Again, I cannot but mourn to see the Devil transformed into an Angel of light in this matter; I confess a man that comes to God’s Table ought seriously to bethink himself what he goes about; but yet let me advise you, not to run into one sin, under a pretence of avoiding another: for what knowest thou, but if thou come prepared, that in thy receiving those sacred mysteries, God may give thee strength to do all that thou promisest.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[T]here be those that will not come to the Sacrament of the Lord’s Supper, (I speak what I know) because they say it is a sacred thing; and if they come there, they must enter into a solemn Covenant with God, which they know they cannot keep, and therefore they forbear to come:

I commend the reverent esteem which these people have of that sacred Institution; but I cannot but mourn for this, that they are afraid to tie themselves to God: Doth David desire and beg of God, To knit his heart unto him, Psal. 86.11. And doth Saint James say, Draw near unto God, and he will draw near unto you, and do these fear being tied too close to God? Again, I cannot but mourn to see the Devil transformed into an Angel of light in this matter; I confess a man that comes to God’s Table ought seriously to bethink himself what he goes about; but yet let me advise you, not to run into one sin, under a pretence of avoiding another: for what knowest thou, but if thou come prepared, that in thy receiving those sacred mysteries, God may give thee strength to do all that thou promisest.”

<blockquote><p>Those things, and Persons which Heathen Kings, Magistrates, Nations and Idolaters themselves, by the very light of nature, thought fit to punish with corporal and capital punishments; all Christian Kings, Magistrates, Nations, ought much more to censure in this kind.

But Heathen Kings, Magistrates, Nations, and Idolaters themselves, by the very light of nature, have thought fit to punish with corporal and capital punishments, such as adored not those Idol-gods which they worshipped and reputed for the true; and such as they deemed Idolaters, Apostates, Heretics, Schismatics, Blasphemers, and open Rebels against God.

Therefore Christian Kings, Magistrates, Nations under the Gospel, ought much more to do it.

The Major is evident by its own light, and ratified by ROM. 2. 14, 15. The Minor I shall make good by Scripture testimonies. I shall begin with King Artaxerxes his Commission to Ezra, c: 7. 15; 26. And thou Ezra after the wisdom of thy God, that is in thine hand, set Magistrates and Judges which may judge all the people which are beyond the river; all such as know the Law of thy God: And whosoever WILL NOT DO THE LAW OF THY GOD, and the law of the King, let judgement be executed speedily upon him, WHETHER IT BE TO DEATH, OR TO BANISHMENT, OR TO CONFISCATION OF GOODS, OR TO IMPRISONMENT.

Shall a mere Heathen King be so zealous as to enjoin the Judges and Magistrates under him, to inflict these corporal and capital censures upon such as will not do the Law of God; in which number all Idolaters, Apostates, Heretics, Blasphemers, &amp;c. are included; and shall not Christian Princes, Magistrates, Judges much more exceed him in their zeal and justice against such transgressors of Gods Law?

But that Decree of Nebuchadnezzar against blasphemers of God, is more emphatical, and pathetical: DAN. 3. 28, 29. Then Nebuchadnezzar spake and said, blessed be the Lord God of Shadrach, Mesach, and Abednego, who hath sent his Angel and delivered his servants that trusted in him &amp;c. Therefore I make a Decree, that every people, nation, and language WHICH SPEAK ANY ERROR (or any thing amiss) AGAINST THE GOD of Shadrach, Meshach, and Abednego, SHALL BE CUT IN PIECES, and THEIR HOUSES SHALL BE MADE A DUNGHILL, because there is no God that can deliver after this sort.

If this Pagan King out of his transcendent zeal, upon the sight but of one miracle, was stirred up without any debates or delay, to make such a severe decree as this, against all those of every people, nation, and language that did speak any Error or Blasphemy against the true God, whom these three worthies then, and we now worship: shall not this decree of his rise up in Judgement against all those Christian Princes, Parliaments, Magistrates, Judges under the Gospel, who profess themselves the worshippers, servants, children of this true God; and yet shall refuse, or neglect to make such strict and severe Decrees against such Heretics and Blasphemers, who maliciously belch out most execrable blasphemies, and Errors against God himself, and openly maintain them in discourse and writing?

[B]ut especially against those who pretend and stile themselves the ONLY SAINTS and SERVANTS OF GOD (how truly let this one act alone declare) who professedly plead, preach, and write against the Corporal and Capital Punishment of such damnable Heretics, Blasphemers, and the enacting of any severe Laws against them by the Parliament and civil Magistrates, when as this Pagan King by his Decree commanded such, to be instantly cut in pieces and their houses to be made a dunghill, without any pity or pardon? Were Pagan Nebuchadnezzar now alive amongst us, he would new heat his Fiery Furnace to warm the kay-cold frozen zeal of such heatless New-Lights, and zeal-less Saints as these; or shame them into an emulation of his zeal against such Heretics and Blasphemers. …

For as the very light of Nature instructs all Nations that there is a God, and instigates them to elect and adore some Deity or other as their God and Saviour:

So it farther instructs them, that that Deity they adore, and that Religion they embrace is no ways to be openly blasphemed, reviled, oppugned, contemned, under pain of the most severe capital punishments, because such offences against the supremest Majesty of God transcend any Treason against an earthly Sovereign: whence most Laws and Nations have made them capital, and by the light of Nature in all ages punished such whom they esteemed Atheists, Heretics, Blasphemers of their gods, or oppugners of their established Religion, with no less then capital Punishments and the severest Censures, as is evident by these Scripture instances, and sundry other. …

Whence I conclude, that what Pagan Kings, Magistrates, Nations have usually punished with corporal, or capital punishments, and restrained by Civil Laws in all ages out of the light of Nature; that Christian Kings, Magistrates, and Nations under the Gospel may lawfully punish in like sort, even by the principles of Nature too, had they no other Divine Law to warrant them, as they have: ‘Tis true, most of these erred in the object, in deeming that Heresy, Schism, Blasphemy, Error, which was not; not in the punishment, had the object been such as they really deemed it, and such as we here dispute of.</p></blockquote>

<blockquote><p>Amongst all the attempts of distinguishing the Acts of God’s Will in reference unto Christ, and Sinners, whatever I considered, I never found any more slight Atheological, and discrepant from the Truth, then this of Grotius.

To measure the Almighty by the Standard of a man, and to frame in the mind a mutable Idol, instead of the Eternal, Unchangeable God, is a Thing that the fleshly Reasonings of dark understandings are prone unto. Feigns the Lord in one Instant Angry, afterwards promising to cease to be so, then in another instant laying down his Anger, and taking up a contrary affection, and you seem to me, to do no less.

What it may be esteemed in Law, which was that Author’s faculty, I know not: but suppose in Divinity, that (notwithstanding the manifold Attempts of some …) the ascribing unto the most holy, things alien, and opposite unto his glorious nature, is by common consent, accounted no less then blasphemy: whither this be here don, or no, may easily appear. I hope then without the offence of any, I may be allowed to call those Dictates of Grotius to the Rule, and Measure of Truth.

1 Before the fore-sight of the Death of Christ (saith he) God is angry with Sinners, but not wholly averse from all ways of laying aside that Anger.

Answ. 1 That God should be conceived angry after the manner of men, or with any such kind of Passion, is gross Anthropomorphism; as bad, if not worse, then the assigning of him a bodily shape. The Anger of God is a pure Act of his Will, whereby he will effects and inflict the Effects of Anger. Now what is before the fore-sight of the Death of Christ, is certainly from Eternity. God’s Anger must respect either the purpose of God, or the Effects of it. The latter it cannot be, for they are undoubtedly all temporal. It must be then his purpose from Eternity to inflict punishment, that is the Effect of Anger.

This then is the First thing in the business of Redemption assigned by Grotius, unto the Lord. viz. He purposed from Eternity, to inflict punishment on Sinners: and on what sinners? even those, for whom he gives Christ to die, and afterwards receives into favour, as he expresseth himself. Behold here a Mystery of Vorstian Theology: God changing his eternal purposes. This Arminius at first could not down withal, inferring from hence, That the Will of God differed not from his Essence, that every act thereof, is, 1 Most Simple: 2 Infinite: 3 Eternal: 4 Immutable: 5 Holy. Reason itself would fain speak in this Cause, but that the Scriptures do so abound, many places are noted in the Margin. Ja. 1. 17. 2 Tim. 2. 19. Ps. 33. 9, 10, 11. Acts. 15. 18. &amp;c. may be added. A mutable god, is of the dunghill.</p></blockquote>

le-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5ae056fcaf" data-kw="">
<blockquote><p>I hope no length of time, or change of circumstances, shall cause you to forget those solemn views of eternity, and impressions of your misery as a sinner, and those beginnings of the knowledge of the glory and love of Christ, which so deeply engaged your thoughts while with us. These gifts and callings of God, being according to the counsel of his eternal love, are without repentance on his part.

And though we, in ourselves, are unstable as water, and would soon mar the work, and cast away the charters of our eternal inheritance, he is the Rock, he changeth not, and will not suffer us essentially to change; but will bring judgment unto victory—bringing light out of our wretched darkness, order out of our confusion, and establishment and fresh displays of his power and love out of our faintings and backslidings.</p></blockquote>

</figure><figure class="quote" id="q-cb4c5f438f" data-kw="">
<blockquote><p>It hath been always believed among Christians, and that upon infallible grounds, as I shall show hereafter, that all the decrees of God, as they are internal, so they are eternal, acts of his will; and therefore unchangeable and irrevocable. Mutable decrees and occasional resolutions are most contrary to the pure nature of Almighty God.

Such principles as these, evident and clear by their own light, were never questioned by any before the Arminians began ἀκίνητα κινεῖν, and to profess themselves to delight in opposing common notions of reason concerning God and his essence, that they might exalt themselves into his throne. To ascribe the least mutability to the divine essence, with which all the attributes and internal free acts of God are one and the same, was ever accounted ὑπερβολὴ ἀφεότητος, “transcendent atheism,” in the highest degree.</p></blockquote>

</figure><figure class="quote" id="q-461853bbb1" data-kw="">
<blockquote><p>Thanks, be to God, we have a clean other opinion of the Eucharist. We hold it (as it is indeed) a very holy Sacrament of the body and blood of our Lord, to be one of the most precious instruments of his grace, which being lawfully and rightly celebrated, communicateth to us all the treasures of heaven, the flesh and blood of Christ, the pardon of our sins, the peace of our consciences, the sanctification of our souls, and the right to a blessed immortality.

Far be it from us to give it the profane and infamous name of an idol. We will not say, that it is simply and only bread: and if any of us do chance to speak so, in saying that ’tis bread, he means in regard of the substance of the thing, not in regard of its virtue or dignity; in regard of which we believe that it is quite another thing from bread.</p></blockquote>

</figure><figure class="quote" id="q-0e203154b2" data-kw="">
<blockquote><p>The substance of the body and blood of Christ, is not in the bread and wine of the sacrament; his exalted body is no more to be broken and sliced in pieces; nor doth it consist with his state of glory, to have his substantial body shrouded under such mean elements. But the bread and wine are memorials and pledges of his body and blood, instituted by him as signs to signify him; therefore he that receives them without a due respect to Christ, and handles them unworthily, despising those things which are signified by them, is a contemner of the Son of God, since he hath no value for that which is a mark of his authority and his love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Unworthy Receiving of the Lord’s Supper</cite>, (c. 1682) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), iv, 475.</span></figcaption>

</figure><figure class="quote" id="q-d01ed4a283" data-kw="">
<blockquote><p>It is inquired whether the judicial laws of Moses should still endure or thrive, and therefore whether the Christian magistrate should be bound to such laws today no less than before, and may render judgment according to them with certainty, or, in other words, whether he should enforce their precepts as much as the Israelite magistrate was formerly obliged to do.

I respond to this inquiry with a distinction: the magistrate is obliged to those judicial laws which teach concerning matters which are immutable and universally applicable to all nations, but not to those which teach concerning matters which are mutable and peculiar to the Jewish or Israelite nations for the times when those governments remained in existence.

Things common to all nations (that is, which befall all) and are immutable with respect to their own nature and merits are moral offences, that is, against the Decalogue, such as murder, adultery, theft, seduction from the true God, blasphemy, and smiting of parents.

Those laws which are mutable and which were peculiar to the Jews for that time are things such as the emancipation of Hebrew slaves in the seventh year, Levirate marriage, releasing of debts in the appointed year, marriage with a woman from one’s own tribe, and if there were any other of the same sort. Likewise, these include ceremonial offences such as touching a dead body, touching a woman suffering her menstrual cycle, and others of the same sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Judicial Laws of Moses</cite>, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-7256bb65f0" data-kw="">
<blockquote><p>Besides, that which possesses all perfection, cannot be changed. If God changed, he would do so either for the better, or for the worse, or for something equal. Now he cannot change for the better, because he is the best: neither for the worse, for then he would not possess all perfections, for he would not have that by which he could preserve himself from becoming worse; nor can he receive any additional perfections equal to what he has already, otherwise he would not possess all.

Therefore, there is no changeableness in God; neither in his essence, his eternity, his understanding, nor his will; not in his essence, for being the first, he cannot be superseded by any prior being; being all-powerful, he cannot be injured by any; being most simple, he can be corrupted by none; being immense, he cannot be increased or lessened; being eternal, he cannot fail.

There is no change in his eternity, for where there is no succession, there is no mutation; neither in his understanding, for the knowledge of God is all-perfect; nor in his will, for the will of God is all-wise, to which nothing unforeseen can happen, so as to compel him to change his intentions for the better. Again, nothing can prevent and resist his will; he does, indeed, will the various changes of things, but his will itself remains unchangeable. This immutability of God is the foundation of our faith and hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 2.8, pp 99-100.</span></figcaption>

<blockquote><p>The intoxication of the spirit of the mind by the venom of error, is as much contrary to the divine nature and will, is as much hateful to the Spirit of light and truth, and as evidently damnable, as the corruption of the will, and inferior affections, or any member of the body with whatsoever vice, or more bodily transgression. […] Whence it necessarily follows, that it is more, at least no less unlawful for a Christian state to give any liberty or toleration to error, than to set up in every city and parish of their dominions, bordellos for uncleanness [houses of prostitution], stages for plays [1], and lists for duels. That a liberty for errors is no less hateful to God, no less hurtful to men, than a freedom without any punishment, without any discouragement, for all men, when and wheresoever they pleased, to kill, to steal, to rob, to commit adultery, or to do any of these mischiefs, which are most repugnant to the civil law, and destructive of human society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament </cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The intoxication of the spirit of the mind by the venom of error, is as much contrary to the divine nature and will, is as much hateful to the Spirit of light and truth, and as evidently damnable, as the corruption of the will, and inferior affections, or any member of the body with whatsoever vice, or more bodily transgression. […] Whence it necessarily follows, that it is more, at least no less unlawful for a Christian state to give any liberty or toleration to error, than to set up in every city and parish of their dominions, bordellos for uncleanness [houses of prostitution], stages for plays [1], and lists for duels. That a liberty for errors is no less hateful to God, no less hurtful to men, than a freedom without any punishment, without any discouragement, for all men, when and wheresoever they pleased, to kill, to steal, to rob, to commit adultery, or to do any of these mischiefs, which are most repugnant to the civil law, and destructive of human society.”

— Robert Baillie, Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+intoxication+of+the+spirit+of+the+mind+by+the+venom+of+error%2C+is+as+much+contrary+to+the+divine+nature+and+will%2C+is+as+much+hateful+to+the+Spirit+of+light+and+truth%2C+and+as+evidently+damnable%2C+as+the+corruption+of+the+will%2C+and+inferior+affections%2C+or+any+member+of+the+body+with+whatsoever+vice%2C+or+more+bodily+transgression.+%5B%E2%80%A6%5D+Whence+it+necessarily+follows%2C+that+it+is+more%2C+at+least+no+less+unlawful+for+a+Christian+state+to+give+any+liberty+or+toleration+to+error%2C+than+to+set+up+in+every+city+and+parish+of+their+dominions%2C+bordellos+for+uncleanness+%5Bhouses+of+prostitution%5D%2C+stages+for+plays+%5B1%5D%2C+and+lists+for+duels.+That+a+liberty+for+errors+is+no+less+hateful+to+God%2C+no+less+hurtful+to+men%2C+than+a+freedom+without+any+punishment%2C+without+any+discouragement%2C+for+all+men%2C+when+and+wheresoever+they+pleased%2C+to+kill%2C+to+steal%2C+to+rob%2C+to+commit+adultery%2C+or+to+do+any+of+these+mischiefs%2C+which+are+most+repugnant+to+the+civil+law%2C+and+destructive+of+human+society.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Errors+%26+induration+are+the+great+sins+%26+the+great+judgments+of+the+time.+Preached+in+a+sermon+before+the+Right+Honourable+House+of+Peers%2C+in+the+Abbey-Church+at+Westminster%2C+July+30%2C+1645%2C+the+day+of+the+Monthly+Fast+in+Chris+Coldwell+%28ed.%29%2C+Sermons+preached+before+the+English+Houses+of+Parliament+&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8928f9c8e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8928f9c8e3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/01/robert-baillie-error-can-no-more-be-tolerated-than-gross-sins-against-the-second-table/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Now in all these commands, as their subject matter consists of things forbidden in the ten Commandments, as blasphemy, Apostasy, Witchcraft, Profanation of the Sabbath, etc. So that the commands for punishing such (for the substance of them), are moral too of common reason and equity, given to all Nations, and for all ages […]

For the first, let the Reader lay together these particulars I. that tis evident some of these commands, as against offering their children to Molech, as against dealing and contracting with a familiar Spirit deserve punishing among Christians and under the Gospel now, as well as under the Law, and if these, why not the other of Blasphemy, Idolatry, false prophecy, &amp;c? These latter are of moral things as well as the other; the first and these are delivered both by Moses in the same books, time, propounded after the same tenor and way, upon the same grounds and reasons […]

But if it be said those commands against offering their seed to Molech and of witches, are therefore punished by the magistrate, because they offend against lives and estates of mankind, in killing the children, in cattle being killed, and men’s bodies being hurt by witches and wizards, which is not the other of Apostasy, Blasphemy, &amp;c. I reply, tis to be observed that in all those places where the commands are given by God to the Magistrate about these, there’s not one jot or tittle expressed about offending against the second Table in life or goods, but all the reason formally declared, is, because against God immediately, and the commands of the first Table […]

Secondly, these commands to the Magistrate concerning Idolaters, Blasphemers, &amp;c. were not for the punishing of Israelites, the Jewish people only, but of all strangers in their Land, both of Proselytes that dwelt among them, and of others that only travelled through, or were there a while upon trading or such like occasions as these Scriptures show [he cites Lev. 20:2; 24:16] […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The casting down of the last stronghold of Satan: a treatise against toleration and pretended liberty of conscience</cite>, (London, 1647), pp 46-9.</span></figcaption>

<blockquote><p>For since false teachers and heretics in regard of the spiritualness of their sin are the worst of evil doers, and such as work abomination in the Israel of God, and there is no particular laws in the New Testament for bodily coercing of Sorcerers, Adulterers, Thieves, Traitors, false witnesses, who but speak lies against the good name of their neighbour, not against the name of God, nor against Sodomites, defilers of their bodies with beasts, perjured persons, Covenant breakers, liars &amp;.c. What reason in nature can there be to punish the one, and not the other? for it may with as good colour of reason be said, that all the Laws in the old Testament, for drawing of the sword against Sodomites, Adulterers and such like, were typical and temporary, and are done away now in Christ, for Christ will have these converted in as spiritual a way by the only power of the word of God as the other and no where in any express law in the New Testament doth God command to use the bloody sword against them, more than against blasphemers.</p></blockquote>

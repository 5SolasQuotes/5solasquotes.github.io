0%5Bbeautiful%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-537a2f92f2" data-kw="">
<blockquote><p>This essay applies classical aesthetics to the contract doctrine of offer and acceptance. It argues that contract law can be understood, analyzed, and improved using three criteria of beauty: proportion, integrity, and clarity. Based on these criteria, this essay (1) argues that the traditional doctrine of offer and acceptance is beautiful, (2) argues that UCC [Uniform Commercial Code] §2-207 is ugly and fails to improve upon offer and acceptance, and (3) suggests improvements for UCC §2-207.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/kenneth-k-ching.html">Kenneth K. Ching</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beauty &amp; Ugliness in Offer &amp; Acceptance’ in 60 Wayne Law Review 469 (2014) 24 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-32262f0348" data-kw="">
<blockquote><p>What we call beautiful in objects, to speak in the mathematical style, seems to be in a compound ratio of uniformity and variety; so that where the uniformity of bodies is equal, the beauty is as the variety; and where the variety is equal, the beauty is as the uniformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-hutcheson.html">Francis Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original of our Ideas of Beauty &amp; Virtue… 4th ed. (1724; London, 1738) 325 pp. ToC</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“What we call beautiful in objects, to speak in the mathematical style, seems to be in a compound ratio of uniformity and variety; so that where the uniformity of bodies is equal, the beauty is as the variety; and where the variety is equal, the beauty is as the uniformity.”

— Francis Hutcheson, An Inquiry into the Original of our Ideas of Beauty &amp; Virtue… 4th ed. (1724; London, 1738) 325 pp. ToC, p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+we+call+beautiful+in+objects%2C+to+speak+in+the+mathematical+style%2C+seems+to+be+in+a+compound+ratio+of+uniformity+and+variety%3B+so+that+where+the+uniformity+of+bodies+is+equal%2C+the+beauty+is+as+the+variety%3B+and+where+the+variety+is+equal%2C+the+beauty+is+as+the+uniformity.%E2%80%9D%0A%0A%E2%80%94+Francis+Hutcheson%2C+An+Inquiry+into+the+Original+of+our+Ideas+of+Beauty+%26+Virtue%E2%80%A6+4th+ed.+%281724%3B+London%2C+1738%29+325+pp.+ToC%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32262f0348.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32262f0348.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-beauty/#:~:text=What%20we%20call%20beautiful%20in%20objects%2C,the%20beauty%20is%20as%20the%20uniformity." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8b651ea6cb" data-kw="">
<blockquote><p>We discern beauty in concrete objects and abstract ideas, in works of nature and works of art, in things, animals and people, in objects, qualities and actions. As the list expands to take in just about every ontological category (there are beautiful propositions as well as beautiful worlds, beautiful proofs as well as beautiful snails, even beautiful diseases and beautiful deaths), it becomes obvious that we are not describing a property like shape, size or colour, uncontroversially present to all who can find their way around the physical world. For one thing: how could there be a single property exhibited by so many disparate types of thing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre (Oxford University Press, 2011) 180 pp. ToC</cite>, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“We discern beauty in concrete objects and abstract ideas, in works of nature and works of art, in things, animals and people, in objects, qualities and actions. As the list expands to take in just about every ontological category (there are beautiful propositions as well as beautiful worlds, beautiful proofs as well as beautiful snails, even beautiful diseases and beautiful deaths), it becomes obvious that we are not describing a property like shape, size or colour, uncontroversially present to all who can find their way around the physical world. For one thing: how could there be a single property exhibited by so many disparate types of thing?”

</figure><figure class="quote" id="q-39f5b803b8" data-kw="">
<blockquote><p>But in none of its normal uses is ‘beautiful’ a metaphor, even if, like many a metaphor, it ranges over indefinitely many categories of object. So why do we call things beautiful? What point are we making, and what state of mind does our judgement express? There is an appealing idea about beauty which goes back to Plato and Plotinus, and which became incorporated by various routes into Christian theological thinking. According to this idea beauty is an ultimate value—something that we pursue for its own sake, and for the pursuit of which no further reason need be given. Beauty should therefore be compared to truth and goodness, one member of a trio of ultimate values which justify our rational inclinations. Why believe p? Because it is true. Why want x? Because it is good. Why look at y? Because it is beautiful. In some way, philosophers have argued, those answers are on a par: each brings a state of mind into the ambit of reason, by connecting it to something that it is in our nature, as rational beings, to pursue.</p></blockquote>

<blockquote><p>Species or beauty has a likeness to the property of the Son. For beauty includes three conditions, integrity or perfection, since those things which are impaired are by the very fact ugly; due proportion or harmony; and lastly, brightness or clarity, whence things are called beautiful which have a bright color.</p></blockquote>

</figure><figure class="quote" id="q-b88afc4031" data-kw="">
<blockquote><p>The beautiful is the same as the good, and they differ in aspect only. For since good is what all seek, the notion of good is that which calms the desire; while the notion of the beautiful is that which calms the desire, by being seen or known. Consequently those senses chiefly regard the beautiful, which are the most cognitive, viz., sight and hearing, as ministering to reason; for we speak of beautiful sights and beautiful sounds. But in reference to the other objects of the other senses, we do not use the expression beautiful, for we do not speak of beautiful tastes, and beautiful odors. Thus it is evident that beauty adds to goodness a relation to the cognitive faculty: so that good means that which simply pleases the appetite; while the beautiful is something pleasant to apprehend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 of pt. 2, q. 27, art. 1, reply to obj. 3</cite></span></figcaption>

</figure><figure class="quote" id="q-c7993e6b31" data-kw="">
<blockquote><p>Beauty and goodness in a thing are identical fundamentally; for they are based upon the same thing, namely, the form; and consequently goodness is praised as beauty. But they differ logically, for goodness properly relates to the appetite (goodness being what all things desire); and therefore it has the aspect of an end (the appetite being a kind of movement towards a thing). On the other hand, beauty relates to the cognitive faculty; for beautiful things are those which please when seen. Hence beauty consists in due proportion; for the senses delight in things duly proportioned, as in what is after their own kind—because even sense is a sort of reason, just as is every cognitive faculty. Now since knowledge is by assimilation, and similarity relates to form, beauty properly belongs to the nature of a formal cause.</p></blockquote>

</figure><figure class="quote" id="q-b7b05140f9" data-kw="">
<blockquote><p>And one thing is surely right in Kant’s argument, which is that the experience of beauty, like the judgement in which it issues, is the prerogative of rational beings. Only creatures like us—with language, self-consciousness, practical reason, and moral judgement—can look on the world in this alert and disinterested way, so as to seize on the presented object and take pleasure in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre (Oxford University Press, 2011)</cite>, pp. 27-28</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And one thing is surely right in Kant’s argument, which is that the experience of beauty, like the judgement in which it issues, is the prerogative of rational beings. Only creatures like us—with language, self-consciousness, practical reason, and moral judgement—can look on the world in this alert and disinterested way, so as to seize on the presented object and take pleasure in it.”

<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“Being, insofar as it is knowable, is true. Being, insofar as it is desirable, is good. And Being, insofar as it is pleasurable, is beauty.”

— Norman Geisler, God &amp; Creation, p. 239">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBeing%2C+insofar+as+it+is+knowable%2C+is+true.+Being%2C+insofar+as+it+is+desirable%2C+is+good.+And+Being%2C+insofar+as+it+is+pleasurable%2C+is+beauty.%E2%80%9D%0A%0A%E2%80%94+Norman+Geisler%2C+God+%26+Creation%2C+p.+239&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F86031e873b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/86031e873b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-beauty/#:~:text=Being%2C%20insofar%20as%20it%20is%20knowable%2C,as%20it%20is%20pleasurable%2C%20is%20beauty." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-66ee2edf9a" data-kw="">
<blockquote><p>Aquinas’s own view of the matter is worth noting, however, since it touches on a deep difficulty in the philosophy of beauty. Aquinas regarded truth, goodness and unity as ‘transcendentals’—features of reality possessed by all things, since they are aspects of being, ways in which the supreme gift of being is made manifest to the understanding. His views on beauty are more implied than stated; nevertheless he wrote as though beauty too is such a transcendental (which is one way of explaining the point already made, that beauty belongs to every category). He also thought that beauty and goodness are, in the end, identical, being separate ways in which a single positive reality is rationally apprehended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre (Oxford University Press, 2011)</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-ba1a071221" data-kw="">
<blockquote><p>The third consolation which Moses here describes is gladness at beauty bestowed — ‘Let the beauty of the Lord our God be upon us.’ Sorrow mars the countenance and clothes the body with sackcloth; but if the Lord will come to us and adorn us with his beauty, then the stains of mourning will speedily disappear. Brethren, what a beauty is this which the Lord giveth— ‘the beauty of the Lord our God!’ This comeliness is the beauty of his grace; for our covenant God is the God of all grace. If the Lord makes us to know that we are his our faces shine. If He fills us with his life and love, then brightness flashes from the eyes, and there is a grace about every movement. This ‘beauty’ means holiness; for holiness is the beauty of God. If the Holy Spirit works in you the beauty of holiness, you will rise superior to your afflictions. If this church shall be made the holier by its bereavements, we shall gain much by our losses. This beauty of the Lord must surely mean his presence with us. As the sun beautifies all things, so does God’s presence. When we know that Jesus is with us, when we feel that he is our helper, when we bask in his love, when he abides with us in power, this is the beauty of the saints. If we have Christ in us, Christ with us, we can bear any amount of trouble. ‘I can do all things, or can bear All suffering if my Lord be there.’ This beauty gives to the believer an attractiveness in the eyes of men: they perceive that we have been with Jesus, and they behold our faces shining like the faces of angels. It is a great thing when a Christian is so happy, so holy, and so heavenly that he attracts others to Christ, and people seek his company because they perceive that he has been in the company of the blessed Lord. God give you this, and if you have it, dear friend, you may forget your sorrows: they are transfigured into joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Gladness for Sadness’ on Ps. 90:15-17 (Jan. 14, 1883) in Metropolitan Tabernacle Pulpit, vol. 29</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

is+company+because+they+perceive+that+he+has+been+in+the+company+of+the+blessed+Lord.+God+give+you+this%2C+and+if+you+have+it%2C+dear+friend%2C+you+may+forget+your+sorrows%3A+they+are+transfigured+into+joy.%E2%80%9D%0A%0A%E2%80%94+Charles+H.+Spurgeon%2C+%E2%80%98Gladness+for+Sadness%E2%80%99+on+Ps.+90%3A15-17+%28Jan.+14%2C+1883%29+in+Metropolitan+Tabernacle+Pulpit%2C+vol.+29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fba1a071221.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ba1a071221.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-beauty/#:~:text=The%20third%20consolation%20which%20Moses%20here,sorrows%3A%20they%20are%20transfigured%20into%20joy." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a0464e0f5f" data-kw="">
<blockquote><p>…an assumption, made explicit already in the Enneads of Plotinus [d. 270], that truth, beauty and goodness are attributes of the deity, ways in which the divine unity makes itself known to the human soul. That theological vision was edited for Christian use by St Thomas Aquinas, and embedded in the subtle and comprehensive reasoning for which that philosopher is justly famous.</p></blockquote>

</figure><figure class="quote" id="q-91b1f98b9f" data-kw="">
<blockquote><p>1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history. 2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end. 3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end. 4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-king.html">Jonathan King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How can I see the Beauty of God?: Interview with Jonathan King’ (2019) at Desiring God</cite></span></figcaption>

</figure><figure class="quote" id="q-3a1154a031" data-kw="">
<blockquote><p>Albeit we should most humbly subject ourselves to our governors, yet we may not submit our liberty to them, which God has graciously given us, because we are forbidden to be the servants of men (1 Cor. 7:23), or to be entangled with the yoke of bondage (Gal. 5:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies… (1637), pt. 1 | ch. 7, ‘That [Imposed] Festival Days take away our Liberty which God has given us, Proved: &amp; First out of the Law’, pp. 20-24</cite>, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“Albeit we should most humbly subject ourselves to our governors, yet we may not submit our liberty to them, which God has graciously given us, because we are forbidden to be the servants of men (1 Cor. 7:23), or to be entangled with the yoke of bondage (Gal. 5:1).”

— George Gillespie, English-Popish Ceremonies… (1637), pt. 1 | ch. 7, ‘That [Imposed] Festival Days take away our Liberty which God has given us, Proved: &amp; First out of the Law’, pp. 20-24, p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlbeit+we+should+most+humbly+subject+ourselves+to+our+governors%2C+yet+we+may+not+submit+our+liberty+to+them%2C+which+God+has+graciously+given+us%2C+because+we+are+forbidden+to+be+the+servants+of+men+%281+Cor.+7%3A23%29%2C+or+to+be+entangled+with+the+yoke+of+bondage+%28Gal.+5%3A1%29.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies%E2%80%A6+%281637%29%2C+pt.+1+%7C+ch.+7%2C+%E2%80%98That+%5BImposed%5D+Festival+Days+take+away+our+Liberty+which+God+has+given+us%2C+Proved%3A+%26+First+out+of+the+Law%E2%80%99%2C+pp.+20-24%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a1154a031.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a1154a031.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-christian-liberty/#:~:text=Albeit%20we%20should%20most%20humbly%20subject,the%20yoke%20of%20bondage%20%28Gal.%205%3A1%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-62c628366b" data-kw="">
<blockquote><p>Edward Bagshaw: ‘This we affirm: 1. Because we know not how else to preserve our Christian Liberty (which it is an indispensable duty to maintain) but by separating from those that would unduly take it from us.’ Richard Baxter: These universal terms not limited nor expounded are to be taken universally, and so here are two false doctrines: one that it is indispensable duty to maintain all our Christian liberty, and the other that we know not how else to maintain it. But if by this ‘liberty’, you mean but some sort of liberty, and not all, you should have distinguished, if you would not deceive. And if by ‘we know not’ you intend only a confession of your own ignorance, that would be no proof of the point in hand, because that may be true, which you know not. [On the term ‘Christian liberty’:] 1. There is a liberty called ‘Christian’, because it is essential to Christianity (as to be freed from the Covenant of Works and from the guilt and reign of sin, and from the power of Satan and the state of enmity against God, etc.). 2. There is a liberty called ‘Christian’, because it is procured and given us by Christ, though not essential to Christianity (as to eat of this meat or that, flesh or herbs, to be free from the observation of certain days, and customs, and ceremonies not sinful in themselves). 3. There is a liberty called ‘Christian’, because Christians have it in common with all other men, or with many (as to marry or not marry; to live in this country or that; to be free from oppression, injuries, slanders, persecution, when they can). [On the term ‘our’:] And we must distinguish of the word ‘our’, that is, we must show how far this liberty is ours indeed: 1. It is one thing to be ours necessarily, or as you say ‘indispensably’; [2.] and another thing to be ours when we can get it, keep it, or use it without a greater loss than it will compensate, or a greater hurt to others. [3.] It is one thing to be ours in fundamental right, to be used at fit times; [4.] and another thing to be ours to be always used. [Baxter’s propositions:] Proposition 1: The liberty which is essential to our Christianity or godliness is indispensably to be maintained and exercised (Isa. 61:1; Lk. 14:18; Gal. 5:12; 2 Pet. 2:19-21). Proposition 2: All degrees of the same liberty must be maintained, as well as the essentials (Acts 18:26; 2 Tim. 2:26); that is, we must labor to be as free as we can from all the degrees of sin and misery (2 Cor. 3:17): But we cannot here have what we would (Heb. 2:14-15). Proposition 3: There is a liberty to use certain things as statedly or ordinarily indifferent (Gal. 4:3, 9), which is none of ours (to use them) in several cases (Rom. 8:15), which take away the indifferency (Jn. 8:31, 36, as in case of scandal, or greater hurt to others or ourselves, Rom. 6:16, 18, 22, or of the restraint of just authority). Proposition 4. The same must be said of forbearing things indifferent. Proposition 5. Our liberty from persecution, oppression, injuries, slanders, must be patiently let go, as being none of ours when it cannot be kept by lawful means or without a greater hurt, Acts 22:28, etc. Proposition 6. But our liberty in either of these three last mentioned cases, ought not causelessly to be taken from us by others, nor must be causelessly cast away by ourselves; nor should we yield to false teachers who would deceive the churches by telling them [the churches] that they are under divine obligations when they are not and make them believe that things lawful are unlawful and things indifferent are necessary, Gal. 2:4-5; Col. 2:16, 18, 20-23; Acts 15; 1 Cor. 7:21-22. The third proposition is it that I am to prove. And Paul’s becoming all things to all men, to save some, a Jew to the Jews, his shaving his head, his circumcising Timothy, with the reasons of it, his resolution to forbear the eating of flesh rather than offend the weak and his persuading others to do the like do fully prove it. He maintains the Christian’s right of liberty against false teachers, but he maintains not the exercise of it when he had reason to let it go: For liberty is not necessity: 1 Cor. 9:1, ‘Am I not free?’ vv. 4-5, ‘Have we not power to eat and to drink? Have we not power to lead about a sister, a wife, as well as other apostles?’ v. 12. ‘If others be partakers of this power over you, are not we rather? Nevertheless we have not used this power, but suffered all things lest we should hinder the Gospel of Christ.’ v. 15, ‘But I have used none of these things’ v. 19, ‘For though I be free from all men, yet have I made myself servant to all, that I might gain the more: And unto the Jews I became a Jew, that I might gain the Jews; To them that are under the Law, as under the Law, that I might gain them that are under the Law: To them that are without the Law, as without Law, that I might gain them that are without Law. To the weak I became as weak, that I might gain the weak: I am made all things to all men, that I might by all means save some. And this I do for the Gospel’s sake’—See 1 Cor. 8:13. Rom. 14:21, ‘It is good neither to eat flesh, nor to drink wine, nor any thing whereby thy brother stumbleth, or is offended, or is made weak.’ Christ Himself says: Mt. 17:26, ‘Then are the children free: notwithstanding, lest we should offend, go thou, etc. and give them for Me and thee.’ 1 Pet. 2:16, ‘As free’ (that is, as such as by Christ are freed from true bondage, but not from order and subjection, and therefore) ‘not having or using liberty for a cloak of maliciousness, but as the servants of God.’ No man has liberty to be unruly or hurtful. Rom. 7:3, ‘If her husband be dead, she is free from that law,’ and yet may give away that freedom. Yea, of the very liberty from the Jewish Law, the apostle says, Gal. 5:13, ‘For ye have been called unto liberty’ (quasi dicat [as if he should say], therefore let not false teachers persuade you that you are bound to that which you are freed from) ‘only use not liberty for an occasion to the flesh, but by love serve one another;’ q.d. in the exercise of this liberty you must do or not do the things you are at liberty in, as may do most good according as the law of love requires and not as your own carnal interest and lust inclines you: for all the Law is fulfilled in one word, in this: [1.] ‘Thou shalt love thy neighbor as thyself.’ [2.] 1 Cor. 10:25, 28-31, ‘Whatsoever is sold in the shambles eat, asking no question for conscience sake—But if any man say unto you, ‘This is offered in sacrifice to idols,’ eat not for his sake that showed it, and for conscience sake’ (Thus our liberty is not to be exercised against love: for we have no liberty to hurt our brethren) v. 29, ‘Conscience I say, not thine own, but of the others:’ (Thus others by weakness, and consequently rulers by authority may restrain the exercise of our liberty) ‘For why is my liberty judged of another man’s conscience?’ That is, not that his conscience is the rule of my right or his judgment takes away my title to liberty, but his interest and the law of love do take away my right of using my liberty to another’s hurt. v. 30, ‘For if I by grace be a partaker’ (that is, lawfully according to my Christian liberty), ‘why am I evil spoken of for that for which I give thanks’ (that is, it is a fault in those that accuse me of sin, when I do that which is lawful in itself, abstracted from the consequents or scandal): ‘Whether therefore ye eat or drink’ (which are things indifferent as to the kind of food) ‘or whatsoever ye do’ (how lawful in itself soever) ‘do all to the glory of God’ (For the interest of the end must guide and restrain you in the use even of things in themselves indifferent: For no man has liberty to dishonor God, nor to hurt another, nor to disobey just power). I beseech you therefore while you promise men liberty, be not yourself, and make not them the servants of sin, 2 Pet. 2:19. And take notice that liberty must be distinguished as to right and as to use, and that the use must often be denied and not maintained. 2. Let us next see whether there be no way but separation in our case to preserve our liberty? Paul has here showed you another way: 1. By doctrinal defense to defend it against false teachers that would doctrinally bring us into bondage. To maintain against such, as you [Bagshaw] who add to God’s Laws, that we are not bound to do that which is not commanded [such as separation] or to forbear that which is not by God forbidden [such as partial, qualified conformity], though you say we are. 2. To use our liberty as it tends to God’s glory and man’s good, and disuse it when it crosses these (but not deny our right). This is the Scripture way of preserving it: and not to think that we have no way to preserve it but by doing hurt or crossing love by Church-divisions. 3. No falsehood is a just defense of our Christian liberty: but to say, that a true Church is no true Church, or true worship is no true worship, or that it is not lawful to communicate where it is lawful, is a falsehood. Therefore it is no just defense of our liberty.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“Edward Bagshaw: ‘This we affirm: 1. Because we know not how else to preserve our Christian Liberty (which it is an indispensable duty to maintain) but by separating from those that would unduly take it from us.’ Richard Baxter: These universal terms not limited nor expounded are to be taken universally, and so here are two false doctrines: one that it is indispensable duty to maintain all our Christian liberty, and the other that we know not how else to maintain it. But if by this ‘liberty’, you mean but some sort of liberty, and not all, you should have distinguished, if you would not deceive. And if by ‘we know not’ you intend only a confession of your own ignorance, that would be no proof of the point in hand, because that may be true, which you know not. [On the term ‘Christian liberty’:] 1. There is a liberty called ‘Christian’, because it is essential to Christianity (as to be freed from the Covenant of Works and from the guilt and reign of sin, and from the power of Satan and the state of enmity against God, etc.). 2. There is a liberty called ‘Christian’, because it is procured and given us by Christ, though not essential to Christianity (as to eat of this meat or that, flesh or herbs, to be free from the observation of certain days, and customs, and ceremonies not sinful in themselves). 3. There is a liberty called ‘Christian’, because Christians have it in common with all other men, or with many (as to marry or not marry; to live in this country or that; to be free from oppression, injuries, slanders, persecution, when they can). [On the term ‘our’:] And we must distinguish of the word ‘our’, that is, we must show how far this liberty is ours indeed: 1. It is one thing to be ours necessarily, or as you say ‘indispensably’; [2.] and another thing to be ours when we can get it, keep it, or use it without a greater loss than it will compensate, or a greater hurt to others. [3.] It is one thing to be ours in fundamental right, to be used at fit times; [4.] and another thing to be ours to be always used. [Baxter’s propositions:] Proposition 1: The liberty which is essential to our Christianity or godliness is indispensably to be maintained and exercised (Isa. 61:1; Lk. 14:18; Gal. 5:12; 2 Pet. 2:19-21). Proposition 2: All degrees of the same liberty must be maintained, as well as the essentials (Acts 18:26; 2 Tim. 2:26); that is, we must labor to be as free as we can from all the degrees of sin and misery (2 Cor. 3:17): But we cannot here have what we would (Heb. 2:14-15). Proposition 3: There is a liberty to use certain things as statedly or ordinarily indifferent (Gal. 4:3, 9), which is none of ours (to use them) in several cases (Rom. 8:15), which take away the indifferency (Jn. 8:31, 36, as in case of scandal, or greater hurt to others or ourselves, Rom. 6:16, 18, 22, or of the restraint of just authority). Proposition 4. The same must be said of forbearing things indifferent. Proposition 5. Our liberty from persecution, oppression, injuries, slanders, must be patiently let go, as being none of ours when it cannot be kept by lawful means or without a greater hurt, Acts 22:28, etc. Proposition 6. But our liberty in either of these three last mentioned cases, ought not causelessly to be taken from us by others, nor must be causelessly cast away by ourselves; nor should we yield to false teachers who would deceive the churches by telling them [the churches] that they are under divine obligations when they are not and make them believe that things lawful are unlawful and things indifferent are necessary, Gal. 2:4-5; Col. 2:16, 18, 20-23; Acts 15; 1 Cor. 7:21-22. The third proposition is it that I am to prove. And Paul’s becoming all things to all men, to save some, a Jew to the Jews, his shaving his head, his circumcising Timothy, with the reasons of it, his resolution to forbear the eating of flesh rather than offend the weak and his persuading others to do the like do fully prove it. He maintains the Christian’s right of liberty against false teachers, but he maintains not the exercise of it when he had reason to let it go: For liberty is not necessity: 1 Cor. 9:1, ‘Am I not free?’ vv. 4-5, ‘Have we not power to eat and to drink? Have we not power to lead about a sister, a wife, as well as other apostles?’ v. 12. ‘If others be partakers of this power over you, are not we rather? Nevertheless we have not used this power, but suffered all things lest we should hinder the Gospel of Christ.’ v. 15, ‘But I have used none of these things’ v. 19, ‘For though I be free from all men, yet have I made myself servant to all, that I might gain the more: And unto the Jews I became a Jew, that I might gain the Jews; To them that are under the Law, as under the Law, that I might gain them that are under the Law: To them that are without the Law, as without Law, that I might gain them that are without Law. To the weak I became as weak, that I might gain the weak: I am made all things to all men, that I might by all means save some. And this I do for the Gospel’s sake’—See 1 Cor. 8:13. Rom. 14:21, ‘It is good neither to eat flesh, nor to drink wine, nor any thing whereby thy brother stumbleth, or is offended, or is made weak.’ Christ Himself says: Mt. 17:26, ‘Then are the children free: notwithstanding, lest we should offend, go thou, etc. and give them for Me and thee.’ 1 Pet. 2:16, ‘As free’ (that is, as such as by Christ are freed from true bondage, but not from order and subjection, and therefore) ‘not having or using liberty for a cloak of maliciousness, but as the servants of God.’ No man has liberty to be unruly or hurtful. Rom. 7:3, ‘If her husband be dead, she is free from that law,’ and yet may give away that freedom. Yea, of the very liberty from the Jewish Law, the apostle says, Gal. 5:13, ‘For ye have been called unto liberty’ (quasi dicat [as if he should say], therefore let not false teachers persuade you that you are bound to that which you are freed from) ‘only use not liberty for an occasion to the flesh, but by love serve one another;’ q.d. in the exercise of this liberty you must do or not do the things you are at liberty in, as may do most good according as the law of love requires and not as your own carnal interest and lust inclines you: for all the Law is fulfilled in one word, in this: [1.] ‘Thou shalt love thy neighbor as thyself.’ [2.] 1 Cor. 10:25, 28-31, ‘Whatsoever is sold in the shambles eat, asking no question for conscience sake—But if any man say unto you, ‘This is offered in sacrifice to idols,’ eat not for his sake that showed it, and for conscience sake’ (Thus our liberty is not to be exercised against love: for we have no liberty to hurt our brethren) v. 29, ‘Conscience I say, not thine own, but of the others:’ (Thus others by weakness, and consequently rulers by authority may restrain the exercise of our liberty) ‘For why is my liberty judged of another man’s conscience?’ That is, not that his conscience is the rule of my right or his judgment takes away my title to liberty, but his interest and the law of love do take away my right of using my liberty to another’s hurt. v. 30, ‘For if I by grace be a partaker’ (that is, lawfully according to my Christian liberty), ‘why am I evil spoken of for that for which I give thanks’ (that is, it is a fault in those that accuse me of sin, when I do that which is lawful in itself, abstracted from the consequents or scandal): ‘Whether therefore ye eat or drink’ (which are things indifferent as to the kind of food) ‘or whatsoever ye do’ (how lawful in itself soever) ‘do all to the glory of God’ (For the interest of the end must guide and restrain you in the use even of things in themselves indifferent: For no man has liberty to dishonor God, nor to hurt another, nor to disobey just power). I beseech you therefore while you promise men liberty, be not yourself, and make not them the servants of sin, 2 Pet. 2:19. And take notice that liberty must be distinguished as to right and as to use, and that the use must often be denied and not maintained. 2. Let us next see whether there be no way but separation in our case to preserve our liberty? Paul has here showed you another way: 1. By doctrinal defense to defend it against false teachers that would doctrinally bring us into bondage. To maintain against such, as you [Bagshaw] who add to God’s Laws, that we are not bound to do that which is not commanded [such as separation] or to forbear that which is not by God forbidden [such as partial, qualified conformity], though you say we are. 2. To use our liberty as it tends to God’s glory and man’s good, and disuse it when it crosses these (but not deny our right). This is the Scripture way of preserving it: and not to think that we have no way to preserve it but by doing hurt or crossing love by Church-divisions. 3. No falsehood is a just defense of our Christian liberty: but to say, that a true Church is no true Church, or true worship is no true worship, or that it is not lawful to communicate where it is lawful, is a falsehood. Therefore it is no just defense of our liberty.”

— Richard Baxter, A Second Admonition to Mr. Edward Bagshaw… (London, 1671), sect. 43, pp. 107-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEdward+Bagshaw%3A+%E2%80%98This+we+affirm%3A+1.+Because+we+know+not+how+else+to+preserve+our+Christian+Liberty+%28which+it+is+an+indispensable+duty+to+maintain%29+but+by+separating+from+those+that+would+unduly+take+it+from+us.%E2%80%99+Richard+Baxter%3A+These+universal+terms+not+limited+nor+expounded+are+to+be+taken+universally%2C+and+so+here+are+two+false+doctrines%3A+one+that+it+is+indispensable+duty+to+maintain+all+our+Christian+liberty%2C+and+the+other+that+we+know+not+how+else+to+maintain+it.+But+if+by+this+%E2%80%98liberty%E2%80%99%2C+you+mean+but+some+sort+of+liberty%2C+and+not+all%2C+you+should+have+distinguished%2C+if+you+would+not+deceive.+And+if+by+%E2%80%98we+know+not%E2%80%99+you+intend+only+a+confession+of+your+own+ignorance%2C+that+would+be+no+proof+of+the+point+in+hand%2C+because+that+may+be+true%2C+which+you+know+not.+%5BOn+the+term+%E2%80%98Christian+liberty%E2%80%99%3A%5D+1.+There+is+a+liberty+called+%E2%80%98Christian%E2%80%99%2C+because+it+is+essential+to+Christianity+%28as+to+be+freed+from+the+Covenant+of+Works+and+from+the+guilt+and+reign+of+sin%2C+and+from+the+power+of+Satan+and+the+state+of+enmity+against+God%2C+etc.%29.+2.+There+is+a+liberty+called+%E2%80%98Christian%E2%80%99%2C+because+it+is+procured+and+given+us+by+Christ%2C+though+not+essential+to+Christianity+%28as+to+eat+of+this+meat+or+that%2C+flesh+or+herbs%2C+to+be+free+from+the+observation+of+certain+days%2C+and+customs%2C+and+ceremonies+not+sinful+in+themselves%29.+3.+There+is+a+liberty+called+%E2%80%98Christian%E2%80%99%2C+because+Christians+have+it+in+common+with+all+other+men%2C+or+with+many+%28as+to+marry+or+not+marry%3B+to+live+in+this+country+or+that%3B+to+be+free+from+oppression%2C+injuries%2C+slanders%2C+persecution%2C+when+they+can%29.+%5BOn+the+term+%E2%80%98our%E2%80%99%3A%5D+And+we+must+distinguish+of+the+word+%E2%80%98our%E2%80%99%2C+that+is%2C+we+must+show+how+far+this+liberty+is+ours+indeed%3A+1.+It+is+one+thing+to+be+ours+necessarily%2C+or+as+you+say+%E2%80%98indispensably%E2%80%99%3B+%5B2.%5D+and+another+thing+to+be+ours+when+we+can+get+it%2C+keep+it%2C+or+use+it+without+a+greater+loss+than+it+will+compensate%2C+or+a+greater+hurt+to+others.+%5B3.%5D+It+is+one+thing+to+be+ours+in+fundamental+right%2C+to+be+used+at+fit+times%3B+%5B4.%5D+and+another+thing+to+be+ours+to+be+always+used.+%5BBaxter%E2%80%99s+propositions%3A%5D+Proposition+1%3A+The+liberty+which+is+essential+to+our+Christianity+or+godliness+is+indispensably+to+be+maintained+and+exercised+%28Isa.+61%3A1%3B+Lk.+14%3A18%3B+Gal.+5%3A12%3B+2+Pet.+2%3A19-21%29.+Proposition+2%3A+All+degrees+of+the+same+liberty+must+be+maintained%2C+as+well+as+the+essentials+%28Acts+18%3A26%3B+2+Tim.+2%3A26%29%3B+that+is%2C+we+must+labor+to+be+as+free+as+we+can+from+all+the+degrees+of+sin+and+misery+%282+Cor.+3%3A17%29%3A+But+we+cannot+here+have+what+we+would+%28Heb.+2%3A14-15%29.+Proposition+3%3A+There+is+a+liberty+to+use+certain+things+as+statedly+or+ordinarily+indifferent+%28Gal.+4%3A3%2C+9%29%2C+which+is+none+of+ours+%28to+use+them%29+in+several+cases+%28Rom.+8%3A15%29%2C+which+take+away+the+indifferency+%28Jn.+8%3A31%2C+36%2C+as+in+case+of+scandal%2C+or+greater+hurt+to+others+or+ourselves%2C+Rom.+6%3A16%2C+18%2C+22%2C+or+of+the+restraint+of+just+authority%29.+Proposition+4.+The+same+must+be+said+of+forbearing+things+indifferent.+Proposition+5.+Our+liberty+from+persecution%2C+oppression%2C+injuries%2C+slanders%2C+must+be+patiently+let+go%2C+as+being+none+of+ours+when+it+cannot+be+kept+by+lawful+means+or+without+a+greater+hurt%2C+Acts+22%3A28%2C+etc.+Proposition+6.+But+our+liberty+in+either+of+these+three+last+mentioned+cases%2C+ought+not+causelessly+to+be+taken+from+us+by+others%2C+nor+must+be+causelessly+cast+away+by+ourselves%3B+nor+should+we+yield+to+false+teachers+who+would+deceive+the+churches+by+telling+them+%5Bthe+churches%5D+that+they+are+under+divine+obligations+when+they+are+not+and+make+them+believe+that+things+lawful+are+unlawful+and+things+indifferent+are+necessary%2C+Gal.+2%3A4-5%3B+Col.+2%3A16%2C+18%2C+20-23%3B+Acts+15%3B+1+Cor.+7%3A21-22.+The+third+proposition+is+it+that+I+am+to+prove.+And+Paul%E2%80%99s+becoming+all+things+to+all+men%2C+to+save+some%2C+a+Jew+to+the+Jews%2C+his+shaving+his+head%2C+his+circumcising+Timothy%2C+with+the+reasons+of+it%2C+his+resolution+to+forbear+the+eating+of+flesh+rather+than+offend+the+weak+and+his+persuading+others+to+do+the+like+do+fully+prove+it.+He+maintains+the+Christian%E2%80%99s+right+of+liberty+against+false+teachers%2C+but+he+maintains+not+the+exercise+of+it+when+he+had+reason+to+let+it+go%3A+For+liberty+is+not+necessity%3A+1+Cor.+9%3A1%2C+%E2%80%98Am+I+not+free%3F%E2%80%99+vv.+4-5%2C+%E2%80%98Have+we+not+power+to+eat+and+to+drink%3F+Have+we+not+power+to+lead+about+a+sister%2C+a+wife%2C+as+well+as+other+apostles%3F%E2%80%99+v.+12.+%E2%80%98If+others+be+partakers+of+this+power+over+you%2C+are+not+we+rather%3F+Nevertheless+we+have+not+used+this+power%2C+but+suffered+all+things+lest+we+should+hinder+the+Gospel+of+Christ.%E2%80%99+v.+15%2C+%E2%80%98But+I+have+used+none+of+these+things%E2%80%99+v.+19%2C+%E2%80%98For+though+I+be+free+from+all+men%2C+yet+have+I+made+myself+servant+to+all%2C+that+I+might+gain+the+more%3A+And+unto+the+Jews+I+became+a+Jew%2C+that+I+might+gain+the+Jews%3B+To+them+that+are+under+the+Law%2C+as+under+the+Law%2C+that+I+might+gain+them+that+are+under+the+Law%3A+To+them+that+are+without+the+Law%2C+as+without+Law%2C+that+I+might+gain+them+that+are+without+Law.+To+the+weak+I+became+as+weak%2C+that+I+might+gain+the+weak%3A+I+am+made+all+things+to+all+men%2C+that+I+might+by+all+means+save+some.+And+this+I+do+for+the+Gospel%E2%80%99s+sake%E2%80%99%E2%80%94See+1+Cor.+8%3A13.+Rom.+14%3A21%2C+%E2%80%98It+is+good+neither+to+eat+flesh%2C+nor+to+drink+wine%2C+nor+any+thing+whereby+thy+brother+stumbleth%2C+or+is+offended%2C+or+is+made+weak.%E2%80%99+Christ+Himself+says%3A+Mt.+17%3A26%2C+%E2%80%98Then+are+the+children+free%3A+notwithstanding%2C+lest+we+should+offend%2C+go+thou%2C+etc.+and+give+them+for+Me+and+thee.%E2%80%99+1+Pet.+2%3A16%2C+%E2%80%98As+free%E2%80%99+%28that+is%2C+as+such+as+by+Christ+are+freed+from+true+bondage%2C+but+not+from+order+and+subjection%2C+and+therefore%29+%E2%80%98not+having+or+using+liberty+for+a+cloak+of+maliciousness%2C+but+as+the+servants+of+God.%E2%80%99+No+man+has+liberty+to+be+unruly+or+hurtful.+Rom.+7%3A3%2C+%E2%80%98If+her+husband+be+dead%2C+she+is+free+from+that+law%2C%E2%80%99+and+yet+may+give+away+that+freedom.+Yea%2C+of+the+very+liberty+from+the+Jewish+Law%2C+the+apostle+says%2C+Gal.+5%3A13%2C+%E2%80%98For+ye+have+been+called+unto+liberty%E2%80%99+%28quasi+dicat+%5Bas+if+he+should+say%5D%2C+therefore+let+not+false+teachers+persuade+you+that+you+are+bound+to+that+which+you+are+freed+from%29+%E2%80%98only+use+not+liberty+for+an+occasion+to+the+flesh%2C+but+by+love+serve+one+another%3B%E2%80%99+q.d.+in+the+exercise+of+this+liberty+you+must+do+or+not+do+the+things+you+are+at+liberty+in%2C+as+may+do+most+good+according+as+the+law+of+love+requires+and+not+as+your+own+carnal+interest+and+lust+inclines+you%3A+for+all+the+Law+is+fulfilled+in+one+word%2C+in+this%3A+%5B1.%5D+%E2%80%98Thou+shalt+love+thy+neighbor+as+thyself.%E2%80%99+%5B2.%5D+1+Cor.+10%3A25%2C+28-31%2C+%E2%80%98Whatsoever+is+sold+in+the+shambles+eat%2C+asking+no+question+for+conscience+sake%E2%80%94But+if+any+man+say+unto+you%2C+%E2%80%98This+is+offered+in+sacrifice+to+idols%2C%E2%80%99+eat+not+for+his+sake+that+showed+it%2C+and+for+conscience+sake%E2%80%99+%28Thus+our+liberty+is+not+to+be+exercised+against+love%3A+for+we+have+no+liberty+to+hurt+our+brethren%29+v.+29%2C+%E2%80%98Conscience+I+say%2C+not+thine+own%2C+but+of+the+others%3A%E2%80%99+%28Thus+others+by+weakness%2C+and+consequently+rulers+by+authority+may+restrain+the+exercise+of+our+liberty%29+%E2%80%98For+why+is+my+liberty+judged+of+another+man%E2%80%99s+conscience%3F%E2%80%99+That+is%2C+not+that+his+conscience+is+the+rule+of+my+right+or+his+judgment+takes+away+my+title+to+liberty%2C+but+his+interest+and+the+law+of+love+do+take+away+my+right+of+using+my+liberty+to+another%E2%80%99s+hurt.+v.+30%2C+%E2%80%98For+if+I+by+grace+be+a+partaker%E2%80%99+%28that+is%2C+lawfully+according+to+my+Christian+liberty%29%2C+%E2%80%98why+am+I+evil+spoken+of+for+that+for+which+I+give+thanks%E2%80%99+%28that+is%2C+it+is+a+fault+in+those+that+accuse+me+of+sin%2C+when+I+do+that+which+is+lawful+in+itself%2C+abstracted+from+the+consequents+or+scandal%29%3A+%E2%80%98Whether+therefore+ye+eat+or+drink%E2%80%99+%28which+are+things+indifferent+as+to+the+kind+of+food%29+%E2%80%98or+whatsoever+ye+do%E2%80%99+%28how+lawful+in+itself+soever%29+%E2%80%98do+all+to+the+glory+of+God%E2%80%99+%28For+the+interest+of+the+end+must+guide+and+restrain+you+in+the+use+even+of+things+in+themselves+indifferent%3A+For+no+man+has+liberty+to+dishonor+God%2C+nor+to+hurt+another%2C+nor+to+disobey+just+power%29.+I+beseech+you+therefore+while+you+promise+men+liberty%2C+be+not+yourself%2C+and+make+not+them+the+servants+of+sin%2C+2+Pet.+2%3A19.+And+take+notice+that+liberty+must+be+distinguished+as+to+right+and+as+to+use%2C+and+that+the+use+must+often+be+denied+and+not+maintained.+2.+Let+us+next+see+whether+there+be+no+way+but+separation+in+our+case+to+preserve+our+liberty%3F+Paul+has+here+showed+you+another+way%3A+1.+By+doctrinal+defense+to+defend+it+against+false+teachers+that+would+doctrinally+bring+us+into+bondage.+To+maintain+against+such%2C+as+you+%5BBagshaw%5D+who+add+to+God%E2%80%99s+Laws%2C+that+we+are+not+bound+to+do+that+which+is+not+commanded+%5Bsuch+as+separation%5D+or+to+forbear+that+which+is+not+by+God+forbidden+%5Bsuch+as+partial%2C+qualified+conformity%5D%2C+though+you+say+we+are.+2.+To+use+our+liberty+as+it+tends+to+God%E2%80%99s+glory+and+man%E2%80%99s+good%2C+and+disuse+it+when+it+crosses+these+%28but+not+deny+our+right%29.+This+is+the+Scripture+way+of+preserving+it%3A+and+not+to+think+that+we+have+no+way+to+preserve+it+but+by+doing+hurt+or+crossing+love+by+Church-divisions.+3.+No+falsehood+is+a+just+defense+of+our+Christian+liberty%3A+but+to+say%2C+that+a+true+Church+is+no+true+Church%2C+or+true+worship+is+no+true+worship%2C+or+that+it+is+not+lawful+to+communicate+where+it+is+lawful%2C+is+a+falsehood.+Therefore+it+is+no+just+defense+of+our+liberty.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Second+Admonition+to+Mr.+Edward+Bagshaw%E2%80%A6+%28London%2C+1671%29%2C+sect.+43%2C+pp.+107-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62c628366b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62c628366b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-christian-liberty/#:~:text=Edward%20Bagshaw%3A%20%E2%80%98This%20we%20affirm%3A%201.,no%20just%20defense%20of%20our%20liberty." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.</p></blockquote>

<blockquote><p>First in general; It is demanded how a man should and ought to forgive an injury? Answer: In forgiveness there be four things: The first is forgiveness of revenge, that is of requiting evil for evil, either by thought word or deed. This must always be practiced. For vengeance is not ours, but the Lord’s, and great reason then that we should ever-more forgive in regard of revenge and hatred. This the apostle teaches, when he says, 1 Cor. 13:5, Love is not provoked, it never thinks, much less speaks or does, evil. The second is forgiveness of private punishment; which is, when men return punishment for injuries done in way of requital; and this must always take place with us, because as vengeance itself, so also punishment in way of revenge is God’s alone. The third is, forgiveness of judgment, when we judge an injury done to be an injury. This judgment we are not bound to forgive unto men. For we may with good conscience judge a sin and a wrong to be as they are. And yet notwithstanding, if a man make satisfaction for the wrong done, then there ought to be forgiveness, even in regard of judgement. The fourth is forgiveness of satisfaction. This we are not alway[s] bound to remit, but we may with good conscience, alway[s] require satisfaction where hurt is done.</p></blockquote>

1107dad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51c1107dad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=First%20in%20general%3B%20It%20is%20demanded,require%20satisfaction%20where%20hurt%20is%20done." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-024bd578e7" data-kw="">
<blockquote><p>What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’</p></blockquote>

<blockquote><p>But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because: 1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ. 2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because: 1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ. 2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…”

— Samuel Rutherford, The Due Right of Presbyteries… (1642), pt. 1, ch. 1, section 1, p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+I+answer%2C+the+place+2+Cor.+2%3A10+is+controverted%2C+and+we+doubt+not%2C+but+%5Bthat+it+is%5D+of+that+same+nature+with+the+power+of+excommunicating%2C+1+Cor.+5%3A4.+But+for+private+forgiving%2C+it+is+not+the+Church-forgiving+here+meant%2C+because%3A+1.+The+private+forgiving+is+a+duty+of+charity+commanded+in+the+Law+of+Nature+to+all%2C+even+out%5Bside%5D+of+%5Ba%5D+Church-state%2C+and+obliges+the+excommunicate%5Bd%5D%2C+who%2C+though+they+be+cast+out+of+the+Church%2C+are+not+exempted+from+the+Law+that+binds+all%2C+Mt.+6%3A12%2C14-15%3B+Mt.+5%3A44-45%2C+but+the+Church-forgiving+is+an+act+of+obedience+to+a+positive+Church-Law+of+Christ.+2.+Private+Christians+are+to+forgive+their+enemies+whether+they+repent+or+not%2C+even+as+Christ+forgave+those+who+crucified+Him%2C+Col.+3%3A13%3B+Lk.+23%3A34%3B+and+when+the+party+repents+not%2C+this+forgiveness+is+not+ratified+in+Heaven%2C+yet+are+we+obliged+to+forgive+and+to+commit+vengeance+to+God%3B+But+the+authoritative+forgiving+is+a+thing+that+the+Church+is+not+obliged+unto%2C+absolutely%3B+nor+may+they%2C+or+can+they+forgive%2C+except+the+offender+repent%3A+and+if+they+see+that+he+repents+not%2C+they+cannot+lawfully+forgive%3B+but%2C+being+in+God%E2%80%99s+room%2C+must+take+vengeance+on+all+disobedience%2C+and+their+retaining+of+sin+and+forgiving+is+valid+in+Heaven%2C+because+they+are+in+God%E2%80%99s+place.+Now+any+forgiving+or+retaining+of+sin+but+these+two%2C+together+with+God%E2%80%99s+forgiving+and+retaining%2C+we+know+not.+But+Peter%E2%80%99s+forgiving+his+offending+brother+seventy+times+seven+times%2C+is+common+to+all+private+Christians%2C+even+out%5Bside%5D+of+%5Ba%5D+Church-state%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%281642%29%2C+pt.+1%2C+ch.+1%2C+section+1%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffbaca9017f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fbaca9017f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=But%20I%20answer%2C%20the%20place%202,Christians%2C%20even%20out%5Bside%5D%20of%20%5Ba%5D%20Church%2Dstate%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-52f6077798" data-kw="">
<blockquote><p>There is a twofold difference between God’s forgiveness of our sins and our forgiving of others. First, we may and ought in some cases to forgive others freely, without any satisfaction at all, but God has bound Himself to another way… Again secondly, we may and ought to forgive others though they do not repent and ask pardon of us; but God has declared his will [regarding his forgiving of others] otherwise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated… (London, 1651), Lecture 14</cite>, p. 112</span></figcaption>

</figure><figure class="quote" id="q-4aab833104" data-kw="">
<blockquote><p>Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, 2nd pt. of 2nd pt., question 158, ‘Anger’, article 2, ‘Whether anger is a sin’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to go to God: or an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer (London, 1626), §148. ‘Of a full forgiving one another,’</cite>, pp. 186-87</span></figcaption>

</figure><figure class="quote" id="q-93c6663cc1" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.”

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4. 4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>

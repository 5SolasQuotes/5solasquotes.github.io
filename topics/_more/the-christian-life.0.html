<blockquote><p>1st Distinction. There be odds betwixt a free willing people executing the sentence of the Church, and mere executioners and lictors [those who execute judicial sentences]. 2nd Distinction. There is a doubting of conscience-speculative, through ignorance of some circumstance of the fact; and a doubt of conscience practical through ignorance of something, which one is obliged to know, and so there is also a speculative and a practical certainty of a thing. 3rd Distinction. There is one certainty required in questione juris, in ‘a question of law’, and another in questione facti, in ‘question of fact’. 4th Distinction. There is, and may be an ignorance-invincible which a man cannot help, in a question of fact; but Papists and schoolmen err who maintain an invincible ignorance in questione juris, in ‘a question of law’, and in this they lay imperfection on God’s Word. 5th Distinction. There is a moral diligence given for knowledge of a thing which suffices to make the ignorance excusable, and there is a moral diligence not sufficient. 6th Distinction. There is a sentence manifestly unjust as the condemning of Christ by witnesses belying one another, and a sentence doubtsomely false. … 3rd Conclusion. There is not required the like certainty of conscience-practical in a question of fact, that is required in a question of law: 1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word. 2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’ 3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin. All soldiers in war and lictors, and these who execute the sentence of excommunication, are to know what are the just causes of war and what crimes by God’s Law deserve death and what not, as what homicide, sorcery, parricide, incest and the like sins deserve by God’s Law, and what not: because every one is obliged to know morally what concerns his conscience, that he be not guilty before God; the executioner who beheaded John Baptist sinned, because he was obliged to know this [much]: a prophet who rebukes incest in a king ought not to be put to death; therefore [the conclusion follows]; it was unlawful for the men of Judah to come and make war with Jeroboam and the ten tribes because God forbade that war, 1 Kings 12:23-24. 4th Conclusion. It is not enough that some say: if the question be negatively-just, then soldiers and executioners and people may execute the sentence; that is, if they see no unlawfulness in the fact, I mean unlawfulness in materia juris, in ‘a matter of law’. Hence some say subjects and common soldiers not admitted to the secrets of the council of war may fight lawfully when there is this negative-justice in the war; but foreign soldiers who are conduced [brought in], may not do so, for the [Scriptural] law says he is not free of a fault who intermeddles with matters which belong not to him, to the hurt of others; so teaches Suarez, D. Bannes and Dr. Duvallius; Yet the command of the prince can remove no doubt of conscience; also that the cause of the war in the matter of law, so far as it is agreeable to God’s Word, is not manifest to executioners, is there culpable ignorance no less than the ignorance of a sentence manifestly unjust; Ergo [Therefore], the practice of these who execute a sentence negatively-only-just, is not lawful. I prove the antecedent: [1.] because the practical ignorance of what we do which is not warranted by God’s Word, is always culpable, whether the cause be clear or dark: for no obscurity of God’s Law does excuse our ignorant practice when the Word of God can sufficiently resolve us. 2. It is not enough that our moral actions in their lawfulness be just-negatively; because actions moral which are beside the Word of God (praeter dei verbum) to us, who hold God’s Word [to be] perfect in faith and manners, are also, contra dei verbum, against the Word of God, and so unlawful. 3. Because actions-moral, having no warrant but the sole will and commandment of superiors, are undertaken upon the sole faith that what superiors command, if it seem not to us unjust, though it be in itself unjust, may lawfully be done. Now we condemn this in schoolmen and Popish causuists, that the commandment of superiors (as says Gregory de Valent., Bannes, Suarez, Silvester, Navarre) may take away and remove all doubting of conscience and make the action lawful. Whereas Navarre, Corduba, Sylvester [and] Adrian hold that an action done without a due practical-certainty is unlawful. If he should diligently (says Suarez) search for the truth, and cannot find it, yet the doubter may practice, so he practically persuade himself, he does it out of a good mind; and whereas the Jesuit says that it is his negligence in not seeking the truth, he answers, his negligence which is by past cannot have influence in his present action, to make it unlawful, because it is past and gone. But I answer: it is physically past, but it is morally present to infect the action, as habitual ignorance makes the acts of unbelief morally worse or ill. And to these we may add that he who does with such a doubt: 1. He sins, because he does not in faith; 2. He exposes himself to the hazard of sinning and of joining with an unjust sentence. 3. It is the corrupt doctrine of Papists, who muzzle up the people in ignorance and discharge them to read God’s Word, and so maintain (because of the obscurity and imperfection of God’s Word, which is not able to determine all questions) that there is an ignorance of many lawful duties which is invincible and to be excused as no ways sinful and which vitiates not our moral actions; so Thomas, Bonaventura, Richard, Gabriele, Occam, Antoninus, Adrianus, Almaine, Suarez, though Occam and Almain may be expounded favorably. 5th Conclusion. Soldiers, lictors, servants [and] people under the eldership are not mere instruments moved only by superiors, as schoolmen say: 1. Because they are moral agents and are no less to obey in faith than superiors are to command in faith, and they are to obey their superiors only in the Lord. 2. They are to give all diligence that they be not accessory to unjust sentences, lest they partake of other men’s sins. What Aquinas, Greg. de Valent. and And. Duvallius says against this, is not to be stood upon. 6th Conclusion. But in questione facti, in matters of fact, there is not required that certainty of conscience. But that we may more clearly understand the conclusion, a question of fact is taken three ways: 1. For a fact expressly set down in God’s Word, as that Moses led the people through the wilderness, that Cain slew his brother Abel, these are questions de facto [in fact], not questiones facti [questions of fact], and must be believed as Almaine and Occam say well, with that same certainty by which we believe God’s Word. 2. A question of fact is [sometimes] taken for a question [which is actually mixed]: the subject whereof is a matter of fact, but the attribute is a matter of law: as if Christ, in saying He was the Son of God, did blaspheme; if the Lord’s priests, in giving David showbread, did commit treason against King Saul; there is some question there made circa factum, about the fact, but it is formally a question of law. For these questions may be cleared by God’s Word, and the ignorance of any questions which may be cleared by God’s Word is vincible [able to be overcome] and culpable, for the law says [that,] ‘The ignorance of these things which we are obliged to know is culpable’, and excuses not. But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no [1 Cor. 5], whether Titus committed murder or no; and in this there is sometimes invincible ignorance when all diligence morally-possible is given, to come to the knowledge of the fact. Now we know here [that] the question of law must be proved by the law; all are obliged in conscience to know what sins deserve death and excommunication. But whether this man John, Anna, Marie has committed such sins, is a question of fact and cannot be proved by the law or the Word of God, for the Law is not anent singulars or particulars; this is proved by sense and the testimony of witnesses, and therefore the certainty-practical of conscience here is human and fallible, not divine and infallible. Now, though soldiers, lictors or people join to the execution of a sentence, and have their doubtings anent the fidelity of the witnesses, yet when all diligence morally possible is given to try the matter, they may well be said to do in faith, though they have not certainty of faith concerning the fact, because there cannot be certainty of divine faith in facts; men’s confession, sense [and] the testimony of witnesses cannot breed divine faith: yea here the judge himself may condemn the innocent, and yet the sentence of the judge may be most just because the witnesses are liars, and the judge gives out that sentence in faith, because God’s Word has commanded him to proceed secundum allegata &amp; probata [according to what is alleged and proved]: he must give sentence under two or three witnesses. Yea, though the judge saw with his eyes the guilty commit the fact, yet he cannot by God’s Law condemn him, but upon the testimony of witnesses. For the wise Lord sees what confusion and tyranny should follow if one might be both index, actor and testis, the judge, the accuser, and the witness. And when the judge gives out a sentence to absolve the guilty and condemn the innocent, his sentence is judicially and formally just, and materially and by accident, and contrary to his intention only, unjust; If the judge in that case should say (as Master Weemes observes well) [that] ‘such a proposition is true, when he knows it to be false, and being posed and urged in conscience, is this an innocent man or no?’ If he should answer and say [that] he is not, [or] should he then answer contrary to his knowledge? But as a judge he must answer: he is not innocent, because witnesses, being with all possible diligence examined, have condemned him; and it is no inconvenience here to say that the judge has one conscience as a man and another contrary conscience as a judge in the question of fact; for God has tied his conscience as a judge to the fidelity of witnesses, known not to be false. I desire the reader to see anent this more in Bonaventura, Richardus, Occam, Antoninus, Adrian and our countryman John Weems [Exposition of the Laws of Moses (1632), vol. 2, ch. 17, ‘Whether a Judge is Bound to Give Sentence According to Things Proved &amp; Alleged, or According to his Own Private Knowledge’, pp. 66-70] and Henricus. Now because souldiers, lictors and people are not judges, if they know the fact in law deserves such and such punishments, where the sentence is not manifestly false and unjust, but in the matter of law just, though erroneous in the matter of fact, all possible diligence being used by the judges, they are to execute that sentence upon the testimony of the judges, though they be not personally present at the proceedings of the judges and eldership, which may be proved many ways: 1. By the confession of our [congregationalist] brethren, if any of the congregation be absent by sickness, childbirth-pain, trading over sea, imprisonment, the congregation does justly put away from amongst them the incestuous Corinthian, and they who are absent are to repute the party excommunicate[d], as a heathen; as their own practice is at censures in the weekday, the largest half of the congregation is absent, yet the absent upon the testimony of the Church hold valid what is done by the Church. 2. Other sister-Churches, who ought not [necessarily] to be present at Church-censures, as our [congregationalist] Brethren teach, are to repute the excommunicate[d] cast out by a sister Church-independent (as they say) as a heathen, because being bound in Heaven: here, is he not bound in a Church-visible, one mile distant from the Church excommunicating? Yet this is no tyranny of conscience. 3. Women are to execute the sentence and to eschew the company of the party excommunicated, yet are they not to be present as judges to usurp authority over the men. This [John] Robinson grants. 4. This should evert all judicatories of peace and war, so many thousands, Acts 2, could not be present at every act of censure and that daily, nor are acts of discipline necessarily tied to the Lord’s Day. They are (I grant) acts of divine worship, but the whole multitude of women and children are deprived of the liberty that God has given them for six days to the works of their calling, if they must be personally present at all the acts of discipline, to cognosce of all scandals, and to here and receive testimonies against elders under two or three witnesses, which is the office of Timothy, this way the overseeing of the manners of the people, which also our Brethren lay upon the whole people, takes up the great part of the pastor’s office and the whole office of ruling elders. And if we lay upon the people the work and all the acts of the office, how can we not lay upon them the office itself? 5. All Israel, gathered to war from Dan to Beersheba, could not, by virtue of duty and obligation, be present personally at the determination of lawful war: Nay, if they were all present as judges, as Mr. Ainsworth would have them, there [would] be no governors and feeders in Israel, but all the governed are feeders, and so no magistrate and ruler, as Anabaptists teach here: 1. It were not lawful for one to be king over more people than he could in his own personal presence judge, contrary to God’s Word, that teaches us to obey these who are sent by the supreme magistrate, as we obey the king, 1 Pet. 2:13-14. Therefore, these who are sent by him are lawful judges, and yet the king judges by them and in them. 2. This error is founded upon a worse error, to wit, that the supreme magistrate had no power of life and death in Israel without consent of the people, but certainly there are as specious and plausible reasons, if not more specious, for the peoples’ government in all civil matters than there can be for their Church-power of judging in the Church-matters and [the] government thereof. Yet there is no ground for it. 1. Because the rulers only could not be charged to execute judgement in the morning, to deliver the oppressed, to execute judgement for the fatherless and the widow; nor can there be a promise made to establish the king’s throne for obeying that commandment, as God’s Word teaches, if the people have as great, yea, greater power in judging than the rulers have by this our Brethren’s argument. They say all the believers at Corinth, 1 Cor. 5, could not be commanded to cast out the incestuous person, nor could they all be taxed for omitting that duty, if they had not power to excommunicate. 2. Neither can the Spirit of God complaint that the judges builded Zion with blood, and the heads of the house of Jacob and princes of the house of Israel did abhor judgement and pervert equity, as the prophets say, nor could they be condemned as roaring lions and ravening wolves, as the prophet says: for the judge might well be faultless when the poor were crushed in the gate and judgment turned into gall and wormwood, because they cannot help the matter: the people are the greatest part in carrying matters in judgment. 2. We see David’s practice in condemning the Amalakite out of his own confession, not asking the people’s consent, and in condemning to death Baanah and Rehab, for killing Ishbosheth. Solomon gave sentence against Adonijah, Joab [and] Shimei without consent of the people; David pardoned Shimei contrary to the counsel of Zerviah’s sons. 3. If from the people’s witnessing and hearing of judgment in the gate we conclude [that] the people were judges with the rulers, there was never a time when there was no king in Israel and no judge to put evil doers to shame, but every man did what seemed good in his own eyes, contrary to Scripture because all are a generation of kings and princes no less than the ruler himself, as Anabaptists teach. By the doctrine of our brethren, I deny not but he that gathered sticks on the Sabbath was brought, Num. 15:33, to Moses and to Aaron and to all the congregation, but the congregation signifies not the common multitude. For [verse] 35, Moses received the sentence from God and pronounced it, and the congregation stoned him to death; and Num. 27:1, The daughters of Zelophehad stood before Moses, Eleazar and before the princes as judges, and before all the congregation as witnesses, not as judges: but vv. 6-7, Moses gave out the judicial sentence from the Lord’s mouth. And 1 Kings 21:12, Naboth stood in presence of the people to be judged, but the nobles and princes were his judges, because, v. 8, Jezabel wrote to the nobles and princes that v. 10, they should carry out Naboth and stone him, to wit, judicially, and v. 11, the nobles and princes did as Jezabel had sent unto them. And Jeremiah, ch. 26, pleaded his cause before the princes and people, for v. 10, the princes [text in Hebrew] set down (judicially) in the entry of the new gate of the Lord’s House: nothing can be gathered from the place to prove that the people judged, but because Jeremiah spake to the princes and the people, who, verse 24, were in a fury and rage against Jeremiah, if Ahikam had not saved him from their violence.</p></blockquote>

consciences we are persuaded is lawful, and are to know what is sin and what is no sin. All soldiers in war and lictors, and these who execute the sentence of excommunication, are to know what are the just causes of war and what crimes by God’s Law deserve death and what not, as what homicide, sorcery, parricide, incest and the like sins deserve by God’s Law, and what not: because every one is obliged to know morally what concerns his conscience, that he be not guilty before God; the executioner who beheaded John Baptist sinned, because he was obliged to know this [much]: a prophet who rebukes incest in a king ought not to be put to death; therefore [the conclusion follows]; it was unlawful for the men of Judah to come and make war with Jeroboam and the ten tribes because God forbade that war, 1 Kings 12:23-24. 4th Conclusion. It is not enough that some say: if the question be negatively-just, then soldiers and executioners and people may execute the sentence; that is, if they see no unlawfulness in the fact, I mean unlawfulness in materia juris, in ‘a matter of law’. Hence some say subjects and common soldiers not admitted to the secrets of the council of war may fight lawfully when there is this negative-justice in the war; but foreign soldiers who are conduced [brought in], may not do so, for the [Scriptural] law says he is not free of a fault who intermeddles with matters which belong not to him, to the hurt of others; so teaches Suarez, D. Bannes and Dr. Duvallius; Yet the command of the prince can remove no doubt of conscience; also that the cause of the war in the matter of law, so far as it is agreeable to God’s Word, is not manifest to executioners, is there culpable ignorance no less than the ignorance of a sentence manifestly unjust; Ergo [Therefore], the practice of these who execute a sentence negatively-only-just, is not lawful. I prove the antecedent: [1.] because the practical ignorance of what we do which is not warranted by God’s Word, is always culpable, whether the cause be clear or dark: for no obscurity of God’s Law does excuse our ignorant practice when the Word of God can sufficiently resolve us. 2. It is not enough that our moral actions in their lawfulness be just-negatively; because actions moral which are beside the Word of God (praeter dei verbum) to us, who hold God’s Word [to be] perfect in faith and manners, are also, contra dei verbum, against the Word of God, and so unlawful. 3. Because actions-moral, having no warrant but the sole will and commandment of superiors, are undertaken upon the sole faith that what superiors command, if it seem not to us unjust, though it be in itself unjust, may lawfully be done. Now we condemn this in schoolmen and Popish causuists, that the commandment of superiors (as says Gregory de Valent., Bannes, Suarez, Silvester, Navarre) may take away and remove all doubting of conscience and make the action lawful. Whereas Navarre, Corduba, Sylvester [and] Adrian hold that an action done without a due practical-certainty is unlawful. If he should diligently (says Suarez) search for the truth, and cannot find it, yet the doubter may practice, so he practically persuade himself, he does it out of a good mind; and whereas the Jesuit says that it is his negligence in not seeking the truth, he answers, his negligence which is by past cannot have influence in his present action, to make it unlawful, because it is past and gone. But I answer: it is physically past, but it is morally present to infect the action, as habitual ignorance makes the acts of unbelief morally worse or ill. And to these we may add that he who does with such a doubt: 1. He sins, because he does not in faith; 2. He exposes himself to the hazard of sinning and of joining with an unjust sentence. 3. It is the corrupt doctrine of Papists, who muzzle up the people in ignorance and discharge them to read God’s Word, and so maintain (because of the obscurity and imperfection of God’s Word, which is not able to determine all questions) that there is an ignorance of many lawful duties which is invincible and to be excused as no ways sinful and which vitiates not our moral actions; so Thomas, Bonaventura, Richard, Gabriele, Occam, Antoninus, Adrianus, Almaine, Suarez, though Occam and Almain may be expounded favorably. 5th Conclusion. Soldiers, lictors, servants [and] people under the eldership are not mere instruments moved only by superiors, as schoolmen say: 1. Because they are moral agents and are no less to obey in faith than superiors are to command in faith, and they are to obey their superiors only in the Lord. 2. They are to give all diligence that they be not accessory to unjust sentences, lest they partake of other men’s sins. What Aquinas, Greg. de Valent. and And. Duvallius says against this, is not to be stood upon. 6th Conclusion. But in questione facti, in matters of fact, there is not required that certainty of conscience. But that we may more clearly understand the conclusion, a question of fact is taken three ways: 1. For a fact expressly set down in God’s Word, as that Moses led the people through the wilderness, that Cain slew his brother Abel, these are questions de facto [in fact], not questiones facti [questions of fact], and must be believed as Almaine and Occam say well, with that same certainty by which we believe God’s Word. 2. A question of fact is [sometimes] taken for a question [which is actually mixed]: the subject whereof is a matter of fact, but the attribute is a matter of law: as if Christ, in saying He was the Son of God, did blaspheme; if the Lord’s priests, in giving David showbread, did commit treason against King Saul; there is some question there made circa factum, about the fact, but it is formally a question of law. For these questions may be cleared by God’s Word, and the ignorance of any questions which may be cleared by God’s Word is vincible [able to be overcome] and culpable, for the law says [that,] ‘The ignorance of these things which we are obliged to know is culpable’, and excuses not. But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no [1 Cor. 5], whether Titus committed murder or no; and in this there is sometimes invincible ignorance when all diligence morally-possible is given, to come to the knowledge of the fact. Now we know here [that] the question of law must be proved by the law; all are obliged in conscience to know what sins deserve death and excommunication. But whether this man John, Anna, Marie has committed such sins, is a question of fact and cannot be proved by the law or the Word of God, for the Law is not anent singulars or particulars; this is proved by sense and the testimony of witnesses, and therefore the certainty-practical of conscience here is human and fallible, not divine and infallible. Now, though soldiers, lictors or people join to the execution of a sentence, and have their doubtings anent the fidelity of the witnesses, yet when all diligence morally possible is given to try the matter, they may well be said to do in faith, though they have not certainty of faith concerning the fact, because there cannot be certainty of divine faith in facts; men’s confession, sense [and] the testimony of witnesses cannot breed divine faith: yea here the judge himself may condemn the innocent, and yet the sentence of the judge may be most just because the witnesses are liars, and the judge gives out that sentence in faith, because God’s Word has commanded him to proceed secundum allegata &amp; probata [according to what is alleged and proved]: he must give sentence under two or three witnesses. Yea, though the judge saw with his eyes the guilty commit the fact, yet he cannot by God’s Law condemn him, but upon the testimony of witnesses. For the wise Lord sees what confusion and tyranny should follow if one might be both index, actor and testis, the judge, the accuser, and the witness. And when the judge gives out a sentence to absolve the guilty and condemn the innocent, his sentence is judicially and formally just, and materially and by accident, and contrary to his intention only, unjust; If the judge in that case should say (as Master Weemes observes well) [that] ‘such a proposition is true, when he knows it to be false, and being posed and urged in conscience, is this an innocent man or no?’ If he should answer and say [that] he is not, [or] should he then answer contrary to his knowledge? But as a judge he must answer: he is not innocent, because witnesses, being with all possible diligence examined, have condemned him; and it is no inconvenience here to say that the judge has one conscience as a man and another contrary conscience as a judge in the question of fact; for God has tied his conscience as a judge to the fidelity of witnesses, known not to be false. I desire the reader to see anent this more in Bonaventura, Richardus, Occam, Antoninus, Adrian and our countryman John Weems [Exposition of the Laws of Moses (1632), vol. 2, ch. 17, ‘Whether a Judge is Bound to Give Sentence According to Things Proved &amp; Alleged, or According to his Own Private Knowledge’, pp. 66-70] and Henricus. Now because souldiers, lictors and people are not judges, if they know the fact in law deserves such and such punishments, where the sentence is not manifestly false and unjust, but in the matter of law just, though erroneous in the matter of fact, all possible diligence being used by the judges, they are to execute that sentence upon the testimony of the judges, though they be not personally present at the proceedings of the judges and eldership, which may be proved many ways: 1. By the confession of our [congregationalist] brethren, if any of the congregation be absent by sickness, childbirth-pain, trading over sea, imprisonment, the congregation does justly put away from amongst them the incestuous Corinthian, and they who are absent are to repute the party excommunicate[d], as a heathen; as their own practice is at censures in the weekday, the largest half of the congregation is absent, yet the absent upon the testimony of the Church hold valid what is done by the Church. 2. Other sister-Churches, who ought not [necessarily] to be present at Church-censures, as our [congregationalist] Brethren teach, are to repute the excommunicate[d] cast out by a sister Church-independent (as they say) as a heathen, because being bound in Heaven: here, is he not bound in a Church-visible, one mile distant from the Church excommunicating? Yet this is no tyranny of conscience. 3. Women are to execute the sentence and to eschew the company of the party excommunicated, yet are they not to be present as judges to usurp authority over the men. This [John] Robinson grants. 4. This should evert all judicatories of peace and war, so many thousands, Acts 2, could not be present at every act of censure and that daily, nor are acts of discipline necessarily tied to the Lord’s Day. They are (I grant) acts of divine worship, but the whole multitude of women and children are deprived of the liberty that God has given them for six days to the works of their calling, if they must be personally present at all the acts of discipline, to cognosce of all scandals, and to here and receive testimonies against elders under two or three witnesses, which is the office of Timothy, this way the overseeing of the manners of the people, which also our Brethren lay upon the whole people, takes up the great part of the pastor’s office and the whole office of ruling elders. And if we lay upon the people the work and all the acts of the office, how can we not lay upon them the office itself? 5. All Israel, gathered to war from Dan to Beersheba, could not, by virtue of duty and obligation, be present personally at the determination of lawful war: Nay, if they were all present as judges, as Mr. Ainsworth would have them, there [would] be no governors and feeders in Israel, but all the governed are feeders, and so no magistrate and ruler, as Anabaptists teach here: 1. It were not lawful for one to be king over more people than he could in his own personal presence judge, contrary to God’s Word, that teaches us to obey these who are sent by the supreme magistrate, as we obey the king, 1 Pet. 2:13-14. Therefore, these who are sent by him are lawful judges, and yet the king judges by them and in them. 2. This error is founded upon a worse error, to wit, that the supreme magistrate had no power of life and death in Israel without consent of the people, but certainly there are as specious and plausible reasons, if not more specious, for the peoples’ government in all civil matters than there can be for their Church-power of judging in the Church-matters and [the] government thereof. Yet there is no ground for it. 1. Because the rulers only could not be charged to execute judgement in the morning, to deliver the oppressed, to execute judgement for the fatherless and the widow; nor can there be a promise made to establish the king’s throne for obeying that commandment, as God’s Word teaches, if the people have as great, yea, greater power in judging than the rulers have by this our Brethren’s argument. They say all the believers at Corinth, 1 Cor. 5, could not be commanded to cast out the incestuous person, nor could they all be taxed for omitting that duty, if they had not power to excommunicate. 2. Neither can the Spirit of God complaint that the judges builded Zion with blood, and the heads of the house of Jacob and princes of the house of Israel did abhor judgement and pervert equity, as the prophets say, nor could they be condemned as roaring lions and ravening wolves, as the prophet says: for the judge might well be faultless when the poor were crushed in the gate and judgment turned into gall and wormwood, because they cannot help the matter: the people are the greatest part in carrying matters in judgment. 2. We see David’s practice in condemning the Amalakite out of his own confession, not asking the people’s consent, and in condemning to death Baanah and Rehab, for killing Ishbosheth. Solomon gave sentence against Adonijah, Joab [and] Shimei without consent of the people; David pardoned Shimei contrary to the counsel of Zerviah’s sons. 3. If from the people’s witnessing and hearing of judgment in the gate we conclude [that] the people were judges with the rulers, there was never a time when there was no king in Israel and no judge to put evil doers to shame, but every man did what seemed good in his own eyes, contrary to Scripture because all are a generation of kings and princes no less than the ruler himself, as Anabaptists teach. By the doctrine of our brethren, I deny not but he that gathered sticks on the Sabbath was brought, Num. 15:33, to Moses and to Aaron and to all the congregation, but the congregation signifies not the common multitude. For [verse] 35, Moses received the sentence from God and pronounced it, and the congregation stoned him to death; and Num. 27:1, The daughters of Zelophehad stood before Moses, Eleazar and before the princes as judges, and before all the congregation as witnesses, not as judges: but vv. 6-7, Moses gave out the judicial sentence from the Lord’s mouth. And 1 Kings 21:12, Naboth stood in presence of the people to be judged, but the nobles and princes were his judges, because, v. 8, Jezabel wrote to the nobles and princes that v. 10, they should carry out Naboth and stone him, to wit, judicially, and v. 11, the nobles and princes did as Jezabel had sent unto them. And Jeremiah, ch. 26, pleaded his cause before the princes and people, for v. 10, the princes [text in Hebrew] set down (judicially) in the entry of the new gate of the Lord’s House: nothing can be gathered from the place to prove that the people judged, but because Jeremiah spake to the princes and the people, who, verse 24, were in a fury and rage against Jeremiah, if Ahikam had not saved him from their violence.”

— Samuel Rutherford, The Due Right of Presbyteries... (1644), Ch. 3, Section 3, Question 4, ‘Whether or No is there a Necessity of the Personal Presence of the Whole Church in All the Acts of Church-Censures?’, pp. 41-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st+Distinction.+There+be+odds+betwixt+a+free+willing+people+executing+the+sentence+of+the+Church%2C+and+mere+executioners+and+lictors+%5Bthose+who+execute+judicial+sentences%5D.+2nd+Distinction.+There+is+a+doubting+of+conscience-speculative%2C+through+ignorance+of+some+circumstance+of+the+fact%3B+and+a+doubt+of+conscience+practical+through+ignorance+of+something%2C+which+one+is+obliged+to+know%2C+and+so+there+is+also+a+speculative+and+a+practical+certainty+of+a+thing.+3rd+Distinction.+There+is+one+certainty+required+in+questione+juris%2C+in+%E2%80%98a+question+of+law%E2%80%99%2C+and+another+in+questione+facti%2C+in+%E2%80%98question+of+fact%E2%80%99.+4th+Distinction.+There+is%2C+and+may+be+an+ignorance-invincible+which+a+man+cannot+help%2C+in+a+question+of+fact%3B+but+Papists+and+schoolmen+err+who+maintain+an+invincible+ignorance+in+questione+juris%2C+in+%E2%80%98a+question+of+law%E2%80%99%2C+and+in+this+they+lay+imperfection+on+God%E2%80%99s+Word.+5th+Distinction.+There+is+a+moral+diligence+given+for+knowledge+of+a+thing+which+suffices+to+make+the+ignorance+excusable%2C+and+there+is+a+moral+diligence+not+sufficient.+6th+Distinction.+There+is+a+sentence+manifestly+unjust+as+the+condemning+of+Christ+by+witnesses+belying+one+another%2C+and+a+sentence+doubtsomely+false.+%E2%80%A6+3rd+Conclusion.+There+is+not+required+the+like+certainty+of+conscience-practical+in+a+question+of+fact%2C+that+is+required+in+a+question+of+law%3A+1.+Because+in+a+question+of+law+all+ignorance+is+moral+and+culpably+evil+to+any+who+undertakes+actions+upon+conscience+of+obedience+to+others%3B+for+to+all+within+the+visible+Church+the+Word+of+God+is+exactly+perfect+for+faith+and+manners%2C+and+everyone+is+obliged+to+know+all+conclusions+of+law+that+are+determinable+by+God%E2%80%99s+Word.+2.+Every+one+in+his+actions+is+to+do+out+of+a+plerophory%2C+and+a+full+persuasion%2C+of+heart%2C+that+what+he+does+pleases+God%2C+Rom.+14%3A14%2C+%E2%80%98I+know+and+am+persuaded+by+the+Lord+Jesus+that+nothing+is+unclean+of+itself.%E2%80%99+3.+We+are+to+do+nothing+but+what+is+lawful+and+what+in+our+consciences+we+are+persuaded+is+lawful%2C+and+are+to+know+what+is+sin+and+what+is+no+sin.+All+soldiers+in+war+and+lictors%2C+and+these+who+execute+the+sentence+of+excommunication%2C+are+to+know+what+are+the+just+causes+of+war+and+what+crimes+by+God%E2%80%99s+Law+deserve+death+and+what+not%2C+as+what+homicide%2C+sorcery%2C+parricide%2C+incest+and+the+like+sins+deserve+by+God%E2%80%99s+Law%2C+and+what+not%3A+because+every+one+is+obliged+to+know+morally+what+concerns+his+conscience%2C+that+he+be+not+guilty+before+God%3B+the+executioner+who+beheaded+John+Baptist+sinned%2C+because+he+was+obliged+to+know+this+%5Bmuch%5D%3A+a+prophet+who+rebukes+incest+in+a+king+ought+not+to+be+put+to+death%3B+therefore+%5Bthe+conclusion+follows%5D%3B+it+was+unlawful+for+the+men+of+Judah+to+come+and+make+war+with+Jeroboam+and+the+ten+tribes+because+God+forbade+that+war%2C+1+Kings+12%3A23-24.+4th+Conclusion.+It+is+not+enough+that+some+say%3A+if+the+question+be+negatively-just%2C+then+soldiers+and+executioners+and+people+may+execute+the+sentence%3B+that+is%2C+if+they+see+no+unlawfulness+in+the+fact%2C+I+mean+unlawfulness+in+materia+juris%2C+in+%E2%80%98a+matter+of+law%E2%80%99.+Hence+some+say+subjects+and+common+soldiers+not+admitted+to+the+secrets+of+the+council+of+war+may+fight+lawfully+when+there+is+this+negative-justice+in+the+war%3B+but+foreign+soldiers+who+are+conduced+%5Bbrought+in%5D%2C+may+not+do+so%2C+for+the+%5BScriptural%5D+law+says+he+is+not+free+of+a+fault+who+intermeddles+with+matters+which+belong+not+to+him%2C+to+the+hurt+of+others%3B+so+teaches+Suarez%2C+D.+Bannes+and+Dr.+Duvallius%3B+Yet+the+command+of+the+prince+can+remove+no+doubt+of+conscience%3B+also+that+the+cause+of+the+war+in+the+matter+of+law%2C+so+far+as+it+is+agreeable+to+God%E2%80%99s+Word%2C+is+not+manifest+to+executioners%2C+is+there+culpable+ignorance+no+less+than+the+ignorance+of+a+sentence+manifestly+unjust%3B+Ergo+%5BTherefore%5D%2C+the+practice+of+these+who+execute+a+sentence+negatively-only-just%2C+is+not+lawful.+I+prove+the+antecedent%3A+%5B1.%5D+because+the+practical+ignorance+of+what+we+do+which+is+not+warranted+by+God%E2%80%99s+Word%2C+is+always+culpable%2C+whether+the+cause+be+clear+or+dark%3A+for+no+obscurity+of+God%E2%80%99s+Law+does+excuse+our+ignorant+practice+when+the+Word+of+God+can+sufficiently+resolve+us.+2.+It+is+not+enough+that+our+moral+actions+in+their+lawfulness+be+just-negatively%3B+because+actions+moral+which+are+beside+the+Word+of+God+%28praeter+dei+verbum%29+to+us%2C+who+hold+God%E2%80%99s+Word+%5Bto+be%5D+perfect+in+faith+and+manners%2C+are+also%2C+contra+dei+verbum%2C+against+the+Word+of+God%2C+and+so+unlawful.+3.+Because+actions-moral%2C+having+no+warrant+but+the+sole+will+and+commandment+of+superiors%2C+are+undertaken+upon+the+sole+faith+that+what+superiors+command%2C+if+it+seem+not+to+us+unjust%2C+though+it+be+in+itself+unjust%2C+may+lawfully+be+done.+Now+we+condemn+this+in+schoolmen+and+Popish+causuists%2C+that+the+commandment+of+superiors+%28as+says+Gregory+de+Valent.%2C+Bannes%2C+Suarez%2C+Silvester%2C+Navarre%29+may+take+away+and+remove+all+doubting+of+conscience+and+make+the+action+lawful.+Whereas+Navarre%2C+Corduba%2C+Sylvester+%5Band%5D+Adrian+hold+that+an+action+done+without+a+due+practical-certainty+is+unlawful.+If+he+should+diligently+%28says+Suarez%29+search+for+the+truth%2C+and+cannot+find+it%2C+yet+the+doubter+may+practice%2C+so+he+practically+persuade+himself%2C+he+does+it+out+of+a+good+mind%3B+and+whereas+the+Jesuit+says+that+it+is+his+negligence+in+not+seeking+the+truth%2C+he+answers%2C+his+negligence+which+is+by+past+cannot+have+influence+in+his+present+action%2C+to+make+it+unlawful%2C+because+it+is+past+and+gone.+But+I+answer%3A+it+is+physically+past%2C+but+it+is+morally+present+to+infect+the+action%2C+as+habitual+ignorance+makes+the+acts+of+unbelief+morally+worse+or+ill.+And+to+these+we+may+add+that+he+who+does+with+such+a+doubt%3A+1.+He+sins%2C+because+he+does+not+in+faith%3B+2.+He+exposes+himself+to+the+hazard+of+sinning+and+of+joining+with+an+unjust+sentence.+3.+It+is+the+corrupt+doctrine+of+Papists%2C+who+muzzle+up+the+people+in+ignorance+and+discharge+them+to+read+God%E2%80%99s+Word%2C+and+so+maintain+%28because+of+the+obscurity+and+imperfection+of+God%E2%80%99s+Word%2C+which+is+not+able+to+determine+all+questions%29+that+there+is+an+ignorance+of+many+lawful+duties+which+is+invincible+and+to+be+excused+as+no+ways+sinful+and+which+vitiates+not+our+moral+actions%3B+so+Thomas%2C+Bonaventura%2C+Richard%2C+Gabriele%2C+Occam%2C+Antoninus%2C+Adrianus%2C+Almaine%2C+Suarez%2C+though+Occam+and+Almain+may+be+expounded+favorably.+5th+Conclusion.+Soldiers%2C+lictors%2C+servants+%5Band%5D+people+under+the+eldership+are+not+mere+instruments+moved+only+by+superiors%2C+as+schoolmen+say%3A+1.+Because+they+are+moral+agents+and+are+no+less+to+obey+in+faith+than+superiors+are+to+command+in+faith%2C+and+they+are+to+obey+their+superiors+only+in+the+Lord.+2.+They+are+to+give+all+diligence+that+they+be+not+accessory+to+unjust+sentences%2C+lest+they+partake+of+other+men%E2%80%99s+sins.+What+Aquinas%2C+Greg.+de+Valent.+and+And.+Duvallius+says+against+this%2C+is+not+to+be+stood+upon.+6th+Conclusion.+But+in+questione+facti%2C+in+matters+of+fact%2C+there+is+not+required+that+certainty+of+conscience.+But+that+we+may+more+clearly+understand+the+conclusion%2C+a+question+of+fact+is+taken+three+ways%3A+1.+For+a+fact+expressly+set+down+in+God%E2%80%99s+Word%2C+as+that+Moses+led+the+people+through+the+wilderness%2C+that+Cain+slew+his+brother+Abel%2C+these+are+questions+de+facto+%5Bin+fact%5D%2C+not+questiones+facti+%5Bquestions+of+fact%5D%2C+and+must+be+believed+as+Almaine+and+Occam+say+well%2C+with+that+same+certainty+by+which+we+believe+God%E2%80%99s+Word.+2.+A+question+of+fact+is+%5Bsometimes%5D+taken+for+a+question+%5Bwhich+is+actually+mixed%5D%3A+the+subject+whereof+is+a+matter+of+fact%2C+but+the+attribute+is+a+matter+of+law%3A+as+if+Christ%2C+in+saying+He+was+the+Son+of+God%2C+did+blaspheme%3B+if+the+Lord%E2%80%99s+priests%2C+in+giving+David+showbread%2C+did+commit+treason+against+King+Saul%3B+there+is+some+question+there+made+circa+factum%2C+about+the+fact%2C+but+it+is+formally+a+question+of+law.+For+these+questions+may+be+cleared+by+God%E2%80%99s+Word%2C+and+the+ignorance+of+any+questions+which+may+be+cleared+by+God%E2%80%99s+Word+is+vincible+%5Bable+to+be+overcome%5D+and+culpable%2C+for+the+law+says+%5Bthat%2C%5D+%E2%80%98The+ignorance+of+these+things+which+we+are+obliged+to+know+is+culpable%E2%80%99%2C+and+excuses+not.+But+thirdly%2C+a+question+of+fact+is+properly+a+question+whether+this+Corinthian+committed+incest+or+no+%5B1+Cor.+5%5D%2C+whether+Titus+committed+murder+or+no%3B+and+in+this+there+is+sometimes+invincible+ignorance+when+all+diligence+morally-possible+is+given%2C+to+come+to+the+knowledge+of+the+fact.+Now+we+know+here+%5Bthat%5D+the+question+of+law+must+be+proved+by+the+law%3B+all+are+obliged+in+conscience+to+know+what+sins+deserve+death+and+excommunication.+But+whether+this+man+John%2C+Anna%2C+Marie+has+committed+such+sins%2C+is+a+question+of+fact+and+cannot+be+proved+by+the+law+or+the+Word+of+God%2C+for+the+Law+is+not+anent+singulars+or+particulars%3B+this+is+proved+by+sense+and+the+testimony+of+witnesses%2C+and+therefore+the+certainty-practical+of+conscience+here+is+human+and+fallible%2C+not+divine+and+infallible.+Now%2C+though+soldiers%2C+lictors+or+people+join+to+the+execution+of+a+sentence%2C+and+have+their+doubtings+anent+the+fidelity+of+the+witnesses%2C+yet+when+all+diligence+morally+possible+is+given+to+try+the+matter%2C+they+may+well+be+said+to+do+in+faith%2C+though+they+have+not+certainty+of+faith+concerning+the+fact%2C+because+there+cannot+be+certainty+of+divine+faith+in+facts%3B+men%E2%80%99s+confession%2C+sense+%5Band%5D+the+testimony+of+witnesses+cannot+breed+divine+faith%3A+yea+here+the+judge+himself+may+condemn+the+innocent%2C+and+yet+the+sentence+of+the+judge+may+be+most+just+because+the+witnesses+are+liars%2C+and+the+judge+gives+out+that+sentence+in+faith%2C+because+God%E2%80%99s+Word+has+commanded+him+to+proceed+secundum+allegata+%26+probata+%5Baccording+to+what+is+alleged+and+proved%5D%3A+he+must+give+sentence+under+two+or+three+witnesses.+Yea%2C+though+the+judge+saw+with+his+eyes+the+guilty+commit+the+fact%2C+yet+he+cannot+by+God%E2%80%99s+Law+condemn+him%2C+but+upon+the+testimony+of+witnesses.+For+the+wise+Lord+sees+what+confusion+and+tyranny+should+follow+if+one+might+be+both+index%2C+actor+and+testis%2C+the+judge%2C+the+accuser%2C+and+the+witness.+And+when+the+judge+gives+out+a+sentence+to+absolve+the+guilty+and+condemn+the+innocent%2C+his+sentence+is+judicially+and+formally+just%2C+and+materially+and+by+accident%2C+and+contrary+to+his+intention+only%2C+unjust%3B+If+the+judge+in+that+case+should+say+%28as+Master+Weemes+observes+well%29+%5Bthat%5D+%E2%80%98such+a+proposition+is+true%2C+when+he+knows+it+to+be+false%2C+and+being+posed+and+urged+in+conscience%2C+is+this+an+innocent+man+or+no%3F%E2%80%99+If+he+should+answer+and+say+%5Bthat%5D+he+is+not%2C+%5Bor%5D+should+he+then+answer+contrary+to+his+knowledge%3F+But+as+a+judge+he+must+answer%3A+he+is+not+innocent%2C+because+witnesses%2C+being+with+all+possible+diligence+examined%2C+have+condemned+him%3B+and+it+is+no+inconvenience+here+to+say+that+the+judge+has+one+conscience+as+a+man+and+another+contrary+conscience+as+a+judge+in+the+question+of+fact%3B+for+God+has+tied+his+conscience+as+a+judge+to+the+fidelity+of+witnesses%2C+known+not+to+be+false.+I+desire+the+reader+to+see+anent+this+more+in+Bonaventura%2C+Richardus%2C+Occam%2C+Antoninus%2C+Adrian+and+our+countryman+John+Weems+%5BExposition+of+the+Laws+of+Moses+%281632%29%2C+vol.+2%2C+ch.+17%2C+%E2%80%98Whether+a+Judge+is+Bound+to+Give+Sentence+According+to+Things+Proved+%26+Alleged%2C+or+According+to+his+Own+Private+Knowledge%E2%80%99%2C+pp.+66-70%5D+and+Henricus.+Now+because+souldiers%2C+lictors+and+people+are+not+judges%2C+if+they+know+the+fact+in+law+deserves+such+and+such+punishments%2C+where+the+sentence+is+not+manifestly+false+and+unjust%2C+but+in+the+matter+of+law+just%2C+though+erroneous+in+the+matter+of+fact%2C+all+possible+diligence+being+used+by+the+judges%2C+they+are+to+execute+that+sentence+upon+the+testimony+of+the+judges%2C+though+they+be+not+personally+present+at+the+proceedings+of+the+judges+and+eldership%2C+which+may+be+proved+many+ways%3A+1.+By+the+confession+of+our+%5Bcongregationalist%5D+brethren%2C+if+any+of+the+congregation+be+absent+by+sickness%2C+childbirth-pain%2C+trading+over+sea%2C+imprisonment%2C+the+congregation+does+justly+put+away+from+amongst+them+the+incestuous+Corinthian%2C+and+they+who+are+absent+are+to+repute+the+party+excommunicate%5Bd%5D%2C+as+a+heathen%3B+as+their+own+practice+is+at+censures+in+the+weekday%2C+the+largest+half+of+the+congregation+is+absent%2C+yet+the+absent+upon+the+testimony+of+the+Church+hold+valid+what+is+done+by+the+Church.+2.+Other+sister-Churches%2C+who+ought+not+%5Bnecessarily%5D+to+be+present+at+Church-censures%2C+as+our+%5Bcongregationalist%5D+Brethren+teach%2C+are+to+repute+the+excommunicate%5Bd%5D+cast+out+by+a+sister+Church-independent+%28as+they+say%29+as+a+heathen%2C+because+being+bound+in+Heaven%3A+here%2C+is+he+not+bound+in+a+Church-visible%2C+one+mile+distant+from+the+Church+excommunicating%3F+Yet+this+is+no+tyranny+of+conscience.+3.+Women+are+to+execute+the+sentence+and+to+eschew+the+company+of+the+party+excommunicated%2C+yet+are+they+not+to+be+present+as+judges+to+usurp+authority+over+the+men.+This+%5BJohn%5D+Robinson+grants.+4.+This+should+evert+all+judicatories+of+peace+and+war%2C+so+many+thousands%2C+Acts+2%2C+could+not+be+present+at+every+act+of+censure+and+that+daily%2C+nor+are+acts+of+discipline+necessarily+tied+to+the+Lord%E2%80%99s+Day.+They+are+%28I+grant%29+acts+of+divine+worship%2C+but+the+whole+multitude+of+women+and+children+are+deprived+of+the+liberty+that+God+has+given+them+for+six+days+to+the+works+of+their+calling%2C+if+they+must+be+personally+present+at+all+the+acts+of+discipline%2C+to+cognosce+of+all+scandals%2C+and+to+here+and+receive+testimonies+against+elders+under+two+or+three+witnesses%2C+which+is+the+office+of+Timothy%2C+this+way+the+overseeing+of+the+manners+of+the+people%2C+which+also+our+Brethren+lay+upon+the+whole+people%2C+takes+up+the+great+part+of+the+pastor%E2%80%99s+office+and+the+whole+office+of+ruling+elders.+And+if+we+lay+upon+the+people+the+work+and+all+the+acts+of+the+office%2C+how+can+we+not+lay+upon+them+the+office+itself%3F+5.+All+Israel%2C+gathered+to+war+from+Dan+to+Beersheba%2C+could+not%2C+by+virtue+of+duty+and+obligation%2C+be+present+personally+at+the+determination+of+lawful+war%3A+Nay%2C+if+they+were+all+present+as+judges%2C+as+Mr.+Ainsworth+would+have+them%2C+there+%5Bwould%5D+be+no+governors+and+feeders+in+Israel%2C+but+all+the+governed+are+feeders%2C+and+so+no+magistrate+and+ruler%2C+as+Anabaptists+teach+here%3A+1.+It+were+not+lawful+for+one+to+be+king+over+more+people+than+he+could+in+his+own+personal+presence+judge%2C+contrary+to+God%E2%80%99s+Word%2C+that+teaches+us+to+obey+these+who+are+sent+by+the+supreme+magistrate%2C+as+we+obey+the+king%2C+1+Pet.+2%3A13-14.+Therefore%2C+these+who+are+sent+by+him+are+lawful+judges%2C+and+yet+the+king+judges+by+them+and+in+them.+2.+This+error+is+founded+upon+a+worse+error%2C+to+wit%2C+that+the+supreme+magistrate+had+no+power+of+life+and+death+in+Israel+without+consent+of+the+people%2C+but+certainly+there+are+as+specious+and+plausible+reasons%2C+if+not+more+specious%2C+for+the+peoples%E2%80%99+government+in+all+civil+matters+than+there+can+be+for+their+Church-power+of+judging+in+the+Church-matters+and+%5Bthe%5D+government+thereof.+Yet+there+is+no+ground+for+it.+1.+Because+the+rulers+only+could+not+be+charged+to+execute+judgement+in+the+morning%2C+to+deliver+the+oppressed%2C+to+execute+judgement+for+the+fatherless+and+the+widow%3B+nor+can+there+be+a+promise+made+to+establish+the+king%E2%80%99s+throne+for+obeying+that+commandment%2C+as+God%E2%80%99s+Word+teaches%2C+if+the+people+have+as+great%2C+yea%2C+greater+power+in+judging+than+the+rulers+have+by+this+our+Brethren%E2%80%99s+argument.+They+say+all+the+believers+at+Corinth%2C+1+Cor.+5%2C+could+not+be+commanded+to+cast+out+the+incestuous+person%2C+nor+could+they+all+be+taxed+for+omitting+that+duty%2C+if+they+had+not+power+to+excommunicate.+2.+Neither+can+the+Spirit+of+God+complaint+that+the+judges+builded+Zion+with+blood%2C+and+the+heads+of+the+house+of+Jacob+and+princes+of+the+house+of+Israel+did+abhor+judgement+and+pervert+equity%2C+as+the+prophets+say%2C+nor+could+they+be+condemned+as+roaring+lions+and+ravening+wolves%2C+as+the+prophet+says%3A+for+the+judge+might+well+be+faultless+when+the+poor+were+crushed+in+the+gate+and+judgment+turned+into+gall+and+wormwood%2C+because+they+cannot+help+the+matter%3A+the+people+are+the+greatest+part+in+carrying+matters+in+judgment.+2.+We+see+David%E2%80%99s+practice+in+condemning+the+Amalakite+out+of+his+own+confession%2C+not+asking+the+people%E2%80%99s+consent%2C+and+in+condemning+to+death+Baanah+and+Rehab%2C+for+killing+Ishbosheth.+Solomon+gave+sentence+against+Adonijah%2C+Joab+%5Band%5D+Shimei+without+consent+of+the+people%3B+David+pardoned+Shimei+contrary+to+the+counsel+of+Zerviah%E2%80%99s+sons.+3.+If+from+the+people%E2%80%99s+witnessing+and+hearing+of+judgment+in+the+gate+we+conclude+%5Bthat%5D+the+people+were+judges+with+the+rulers%2C+there+was+never+a+time+when+there+was+no+king+in+Israel+and+no+judge+to+put+evil+doers+to+shame%2C+but+every+man+did+what+seemed+good+in+his+own+eyes%2C+contrary+to+Scripture+because+all+are+a+generation+of+kings+and+princes+no+less+than+the+ruler+himself%2C+as+Anabaptists+teach.+By+the+doctrine+of+our+brethren%2C+I+deny+not+but+he+that+gathered+sticks+on+the+Sabbath+was+brought%2C+Num.+15%3A33%2C+to+Moses+and+to+Aaron+and+to+all+the+congregation%2C+but+the+congregation+signifies+not+the+common+multitude.+For+%5Bverse%5D+35%2C+Moses+received+the+sentence+from+God+and+pronounced+it%2C+and+the+congregation+stoned+him+to+death%3B+and+Num.+27%3A1%2C+The+daughters+of+Zelophehad+stood+before+Moses%2C+Eleazar+and+before+the+princes+as+judges%2C+and+before+all+the+congregation+as+witnesses%2C+not+as+judges%3A+but+vv.+6-7%2C+Moses+gave+out+the+judicial+sentence+from+the+Lord%E2%80%99s+mouth.+And+1+Kings+21%3A12%2C+Naboth+stood+in+presence+of+the+people+to+be+judged%2C+but+the+nobles+and+princes+were+his+judges%2C+because%2C+v.+8%2C+Jezabel+wrote+to+the+nobles+and+princes+that+v.+10%2C+they+should+carry+out+Naboth+and+stone+him%2C+to+wit%2C+judicially%2C+and+v.+11%2C+the+nobles+and+princes+did+as+Jezabel+had+sent+unto+them.+And+Jeremiah%2C+ch.+26%2C+pleaded+his+cause+before+the+princes+and+people%2C+for+v.+10%2C+the+princes+%5Btext+in+Hebrew%5D+set+down+%28judicially%29+in+the+entry+of+the+new+gate+of+the+Lord%E2%80%99s+House%3A+nothing+can+be+gathered+from+the+place+to+prove+that+the+people+judged%2C+but+because+Jeremiah+spake+to+the+princes+and+the+people%2C+who%2C+verse+24%2C+were+in+a+fury+and+rage+against+Jeremiah%2C+if+Ahikam+had+not+saved+him+from+their+violence.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%281644%29%2C+Ch.+3%2C+Section+3%2C+Question+4%2C+%E2%80%98Whether+or+No+is+there+a+Necessity+of+the+Personal+Presence+of+the+Whole+Church+in+All+the+Acts+of+Church-Censures%3F%E2%80%99%2C+pp.+41-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe20a76224e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e20a76224e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=1st%20Distinction.%20There%20be%20odds%20betwixt,not%20saved%20him%20from%20their%20violence." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Of the premises ye may gather some definition of faith, as namely that ‘love is a holy endeavor for the preservation of that which is beloved, whether God or man, with an earnest desire to be united unto it.’ For love is that bond, as the apostle speaks, whereby the members of the body are knit together. And it serves also in some sort and place to unite us unto God and Christ, notwithstanding that the communion of Christ, the head of his body the Church, be principally to be ascribed unto faith.</p></blockquote>

<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>

<blockquote><p>All men are to be loved alike. But since you cannot do good to all men, you must therefore especially do good to those to whom you are more nearly joined by lot as it were — by opportunity either of time, place, or any other thing whatsoever.</p></blockquote>

<blockquote><p>2. And secondly, as we must do no evil to any, so there is a necessity of doing good to all men, as far as we may; and because it is impossible to have 〈◊〉 motum, a particular affection to love every particular man, to rejoice at his good or to have a care of him, our nature and estate being finite, and not sufficient for it: therefore for our actions we are only enjoined to these towards all: 1. First, the duty of prayer, even for our enemies, this is like to the sunbeams, that radius charitatis, which we send to heaven for all men. And this is imposed upon every man, and to be performed for every man. 2. The second action is, to be done in a case of necessity, and is that which is intimated in the parable in the Gospel, of the man that fell among thieves; even the succour we owe to every man in necessity, which is 〈◊〉, that rather than we should fail in this case to help him, we are adimere 〈◊〉 multa non necessaria, take from our own all that is not necessary, to relieve his necessity; which is expressed by the wise man, ‘If thine enemy hunger, give him bread; and if he thirst, give him water to drink.’ If we do not, we make a breach of the First Table, according to that of St. John: 〈◊〉 has this world’s good, and see his brother has need, and 〈◊〉 up his bowels of compassion from him, how dwells the love of God in him?’ Now by the world’s good is meant sufficiency, or abundance with superfluity, and his need not without extremity. The secound Councel of Arelat. sets down, Quae quis salvo statu 〈◊◊〉, pro superfluis haberi debent concurrente fratris necessitate: those things which a man may bestow, saving his estate or condition of life, are to be accounted as things superfluous, if his brother’s necessity be present. And under this is comprehended also the charitable performing of the works of our vocation for the good of all that are in necessity. As the lawyer is not to deny his counsel to any one that shall ask it: nor the physician his help to any that shall require it in case of necessity. And a further injunction then prayer and parting with our superfluity is commanded by the conjunction copulative in the three first verses of the Gospel: where a man is charged, if his cloak be taken from him, to part with his coat too; and if he be struck on the one cheek, to offer the other: which is nothing, but: 1. The habitual patience of the mind, whereby a man should be ready to part with such things and bear such injuries if the glory of God require it, otherwise he is not bound. And 2. rather to suffer more wrong than to seek revenge or return evil for evil. 2. The second thing proposed is the object of this love, which is our neighbor. Of which word ‘neighbor’ in our Savior’s time there was a strict acception, it was reduced to a narrow room. For the Pharisees counted none neighbors but their friends, and those of their own country and kindred, and so they expounded the Law, Thou 〈◊〉 thy neighbour, by restraing it to such: but our Savior makes the word to be of a larger extent, and forces the lawyer to confess that it extends to enemies, even to Samaritans, which were such deadly enemies to the Jews that they would not 〈◊〉 Christ, because his face was towards 〈◊〉; for every one from whom we may receive mercy, or to whom too we may shew mercy are neighbors, and so our Savior proves that the Samaritan was a neighbor to him that fell among thieves, because he shewed him mercy, though otherwise he were an enemy to the Jews, and of another nation, for as Saint Augustine says, he is proximus, a neighbour, Qui est proximo 〈◊〉, that is near to another in works of mercy, and therefore it is not cognatio 〈◊◊〉, kindred or cohabitation, but mercy that 〈◊〉 a man to be a neighbor, and seeing every man, even an enemy, may be an object of mercy, therefore every man, even an enemy is a neighbor. And it is not Christ’s exposition only, but the Law says the very same, in the case of a stray ox or ass. If thy brothers ox or ass go astray, etc. which brother in another place is said to be even an enemy, for there is in the same Law, 〈◊〉 23. 4, 5. where it is said, ‘If thy enemy’s ox or ass go astray, etc.’ He that is the object of our love is expressed in Scripture by three words, which are distinguished in the Hebrew, as well as in the Latin: 1. Amicus, a friend or fellow. 2. Proximus, a neighbour. 3. Frater, a brother; which is used by St. John constantly in his first Epistle. In all which are motives and grounds of love. For: 1. In brethren there is identitas naturae, etc. identity of nature, which makes all creatures love one another; one beast delighting in another of the same kind, and little children delighting in their image in the glass, show this. 2. Now as this similitude is a 〈◊〉 of love, so is identitas originis, identity of beginning; therefore it is a natural thing, for brethren born to love one another, because they have the same original; and nothing so unnatural, as one brother not to love another. 2. Between Friends, love is the cause of love, for it will be mutual and reciprocal. 〈◊〉 amoris magnes, love is a loadstone to love. Our Savior knew this well, and therefore in the commandment of love He expresses it is thus, ‘That ye love one another;’ it must be amor mutuus, mutual love. Another ground of love among friends is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell, and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship, and causes love in men that never saw one another before. 3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors. 4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us. These then are the reasons of God’s using those words, and the reasons also of our love. … 2. We must know, that in proximitate, neighborhood, there are degrees of nearness, whereby one is nearer than another. In which respect that affection which causes us to remember some before others in our prayers is not from any corruption of our nature, because omission of duty to one is a greater sin than to another; for the duty to a father is greater than to a stranger. But as in natural things there is major 〈◊〉, a stronger motion, where there is major 〈◊〉, a stronger inclination; so where there is a greater duty owing, there God will have a greater affection. Because the earth is to come 〈◊〉 to the center than the water, therefore it has majorem gravitatem, a greater degree of 〈◊〉, to draw it thither; and so where the greater actions or duties are required, there greater affections or a greater measure of love, which is a weight pressing to the 〈◊〉, is necessary: not only charitas, but also ordo charitatis cadit sub 〈◊〉, as the 〈◊〉 determine. As therefore the affection of love is required, so our love must be ordered, as the Schools speak. The demonstration stands thus: If wheresoever there is principium, a beginning; there whatsoever is 〈◊〉 principio, 〈◊〉 to it, is 〈◊〉 first, and so consequently there is an order, and so every thing, as it is 〈◊〉 or 〈◊〉 off, must first or latter be intended. Now there are two causes or principles of love; God and ourselves, and therefore the nearer any are to these principles (as some men are nearer to ourselves, as fathers, mothers, etc. so are nearer to God by grace) the more they are to be loved. Let us see then this order in our charity, that it may be ordinata charitas, charity well ordered. To which purpose it must stand thus: 1. God. 2. Our own souls. 3. Our brother’s soul. 4. Our bodies. 5 The body of our neighbor or brother. 1. God is to be loved especially, and in the first place, because He is that chiefest good, by the communication whereof we are all made good. So says St. Augustine, 〈◊〉 vera et summa vita, in quo, a quo, et per quem, bona sunt omnia, 〈◊〉 bona sunt, ‘God is the true and chief life; in, from and by whom are all good things. And as another, Cum 〈◊〉 Deum 〈◊〉 in ipso 〈◊〉, by loving God we find all things: God is the universal nature, to whom all things give place. He must have the first place in our love; as in policy the public good is preferred before all private respects: and therefore a good citizen will be content to lose his own goods, thereby to redeem peace to the public. We see in nature that heavy things will move upwards, contrary to their own particular nature, propter salutem universi, for the good of the universe, as that ne detur 〈◊〉: so in religion, God and our love to Him, 〈◊〉 dilectionis in 〈◊〉, does overcome and drown all other loves to ourselves, or any other particular object; as we see it did in St. Paul, who out of his love to God (that he might be glorified in the salvation of the Jews) 〈◊〉 to be separated from Christ, if it had been possible [Rom. 9:4], and not incompatible with his love to God which was as a motion against a particular nature, for the good of the general or universe. 2. The next is ourselves, and ourselves before our brethren. The reason is because in the one there is an unity, in the other, at the most is but a union: and major 〈◊〉 habenda est unitatis, quam 〈◊〉, there is a greater regard to be had of the 〈◊〉, than of the latter. And again, seeing it is not lawful for any to commit a sin to prevent his brother 〈◊〉 sinning, nay not to save the whole world, it shows plainly, we are to prefer the love of ourselves before our brother, and in ourselves our own souls before our brother’s soul. Now in the case between the health or good of our own body and of our brother’s soul, it thus stands: There can come no participation of the glory of God to our bodies, nisi per redundantiam, as it were by an overflowing, when the soul being full communicates it to the body. But the soul of our brother is capable of divine glory, and the universal good, immediately by itself, and therefore ought to be preferred before the body of any which participates only per redundantiam, by the overflowing of the soul, and so at the second hand as it were; besides one soul is worth all bodily creatures in the world: a man therefore may endanger his body, for the saving his brother’s soul. 3. Then in the next place we are to seek the good of our neighbor’s body: and of neighbors: 1. 〈◊〉 est omnibus, we are generally to love, and succour all that need, any whomsoever, if they be in extrema necessitate, in extreme necessity. 2. And in the next place, of those that be in need, maxime 〈◊〉, especially we are to do good to them that are of the household of faith, as the apostle directs, that are of the same religion with us, we are to relieve such before others, if we cannot relieve both, believers before infidels. 3. And thirdly, among the faithful, to them that are of our own country, before the children of strangers. 4. Fourthly among those of our own country, 〈◊〉, to our own, to those that have some relation to us, for he that regards not his own, says the apostle, is worse than an 〈◊〉. 5. Fiftly, of our own, to them that are of our own house or kindred. 6. Sixthly, in the house, to the wife on 〈◊〉, rather than to father, mother or children; for a man must leave father and mother, and cleave to his wife; and that the husband ought to be preferred before children appears by 〈◊〉speech to 〈◊〉, ‘Am not I better to thee than many sons? And therefore the children are not to lay up for the 〈◊〉, but the fathers for the children, as the apostle says, yet everyone should have respect both upwards and downwards. Now for strangers, or those that are not nostri, ours, either they be rich or poor, of which the poor are rather to be regarded than the rich; and for the rich, they are either such as we have received benefits from, or to whom we have done good; and because 〈◊〉 est 〈◊〉 et maximum 〈◊◊〉, the work is the chief 〈◊〉 of the 〈◊〉 of anything, and bestowing of good is, 〈◊◊〉, 〈◊◊〉 which makes 〈◊〉 virtue 〈◊◊〉 visible; and in that respect it is, that a man is apt to love his own work or his own creature, as we say; yet we ought to prefer him of whom we have received benefits before him on whom we have bestowed any, because a benefactor is more like a 〈◊〉 to us than the other like a son. T〈◊〉 2. 2. q. 26. a. 12, Ex. Arist. 9. Eth. But if (as Saint 〈◊〉 〈◊〉 it) there are two persons, who in all respects are equal, and we have something that would help either of them, and that it cannot be divided. What is then to be done? There being nothing in the one why I should pleasure him more than the other, quid 〈◊〉 sorte eligerim, nothing, but to choose one by lot. The same may be the case of every man that is to do good to another, who in 〈◊〉 all are of finite nature, and therefore are not able to do good to all or to satisfy all, therefore when we are joined in the like relation to us, or the degree of 〈◊〉 or propinquity, if we must help both, there remains nothing but 〈◊〉, to 〈◊〉 it by 〈◊〉. Further we are to know that in love there is a double respect: 1. Of the object or party loved. 2. of the subject, or party that loves. 1. 〈◊〉 dilecti, in 〈◊〉 of the 〈◊〉 loved, we are to respect 〈◊◊〉, and to love him more in whom the more excellent gifts of grace appear, so as to take more complacency in him, and to wish him the more excellent good, as the greater degree of glory; because the more excellent anything is, the nearer it comes to God, and if he be better, we ought to wish him better. Thus spiritual conjunction or nearness is to be preferred, 〈◊〉 objecti, in respect of the object. 2. Ratione 〈◊〉, 〈◊〉 of the 〈◊〉 loving, and here natural and 〈◊〉 propinquity or conjunction may be preferred before spiritual, as founded in nature, and therefore more firm and immutable: and hence it is that in temporal things, a man may prefer one that is nearer by nature, before one that is only conjoined with us by grace. Thus if a man have money or estate to give; he is not bound to bestow it upon the best man in the world, but may prefer one that’s nearer in nature, though not so excellent in grace. And thus far de ordine 〈◊〉, of the order of our love. The third general proposed is the 〈◊〉 of this love, 〈◊◊〉. ‘As thyself’. This is sicut te, ‘as thyself’; not 〈◊〉 te, as 〈◊〉 as thyself, it signifies a respect, but not a quantity. The Hebrew 〈 Hebrew 〉 signifies not 〈◊〉 but 〈◊〉, as Job 12:3, for as we said before, every man ought to have a greater regard to his own soul than to his brothers. Now this 〈◊〉 or manner of love must appear in four things: 1. the end. 2. the means. 3. the manner. 4. the order. 1. The first in 〈◊〉 te 〈◊〉, is in respect of the end, for which thou lovest thyself, or for the same cause, And thou lovest thyself, because thou lovest God, and so consequently, all 〈◊◊〉 Dei, that are Gods; because thou thyself art aliquid Dei, ‘something of God’; therefore thou lovest thyself, and so consequently thou must love thy neighbour propter 〈◊〉 for God; and 〈◊〉 for this cause thou lovest thy brother, thou 〈◊〉 him as thyself, in respect of the end. So also and in this 〈◊〉 thou must love thy brother. 2. The second is the 〈◊〉, the applying this love to that end. And that is, that inasmuch as I love myself, I wish myself good, and that not in my 〈◊〉 but best part, which is my reasonable soul: and therefore I wish more especially the chiefest good of it, 〈◊〉 bonum 〈◊◊〉, which is, eternal blessedness and this is it which I must look to in my brother. If I love him as myself, I must love him ad 〈◊◊〉 partis, for the good of his better part, and that is the good of the inward man (of which the apostle speaks), whereas the most love only the outward man; now the chiefest good of the inward man consists in 〈◊〉 Dei in the sight and fruition of God. But because none can come to this except the impediments be removed, which is sin; Saint Augustine 〈◊〉, 〈◊◊〉 diligit proximum hoc cum 〈◊〉 debet 〈◊〉, 〈◊◊〉 ipse 〈◊〉 toto corde 〈◊◊〉, 〈◊〉 that truly 〈◊〉 his 〈◊〉, must work upon him so, 〈◊〉 he also love God with all his heart. Take care to remove his sins, and as for a man’s self, 〈◊〉 his will do 〈◊◊◊〉, 〈◊〉 him to some sin, non 〈◊◊〉, be must 〈◊◊〉, because it would hinder 〈◊◊〉 the 〈◊〉 good, so ought he to love his neghbour, as not to consent to the evil will of his neighbor in any bad action, because that would hinder his chief good. The Scripture speaks of things not always as they are, but as they ought to be, and so requiring us to love others as ourselves, it is not meant of ourself love, 〈◊〉 it is corrupt, but as we ought to love ourselves specimen naturae capiendum ex optima natura, a pattern in nature must be taken from nature pure and 〈◊〉 in its integrity; so that a man ought not to love his neighbor as he does himself, but as he should love himself. For saint Augustine says, when I love myself, either I love myself because I am or should be blessed: the very same rule we should observe in our brother: I must love him, aut quia est 〈◊〉 ut sit, either because he is, or because he should be good. Which I cannot do unless I win him ab impedimentis, from the impediments, and set him in via in 〈◊〉 right way: for as saint Augustine says, Non 〈◊〉 proximum tanquam seipsum si non ad id 〈◊〉 ad quod ipse tendis, adducis. Thou lovest not thy neighbor as thyself, if thou 〈◊〉 him not to that good, to which thou thyself tends. And he says in another place, 〈◊〉 est regula 〈◊〉, it is the only rule of love, ut 〈◊〉 sibi 〈◊〉 bona pervenire, et illi velit, that he would have the same good come to his neighbor, that he wishes to himself. 3. The third is the manner. In loving anything that is good there are two motives: First, either it is for the sole and alone good of him that loves it, or Secondly, for the good of the thing itself, that is loved he that loves anything, not for itself, but for himself, does not love it as himself, this is not diligere 〈◊〉 seipsum, but propter seipsum; this is not, ut faciat bonum, sed ut potiatur quis bono, not to seek his good whom we love, but to make use of what good is in him for ourselves, as men love their instruments, merely for the use they have of them and not otherwise; thus a man loves his shooing horn, to make use of it, to serve his turn in the morning, and casts it away all the day after: but our love to our neighbor should be gratuitus, without hope of recompence, and that he that we love may have the sole good by it. Otherwise if we love him not as ourselves, for no man loves himself, ut se potiatur, that he may make use of himself, as he loves meat, drink, etc. and therefore must he love his neighbor, not to make use of him for his own ends, but propter seipsum, for himself, seeking and desiring his good. 4. The last is the order. It is sicut teipsum, not sicut 〈◊〉, as ourselves, not as we love God; we must beware of loving Him so, for we must love ourselves infra Deum, in a pitch below God; and by consequence we must love our neighbour infra Deum, after God. Therefore we must not 〈◊〉 the will of any man, be he of never so great excellency, before the will of God. God’s will must not give place to ours. God is not so unwise as to bring in the Second Table to overthrow the first, but his scope in it was, that it should be a table to direct and help us in performing the duties of the first. 1. So that if our love to our neighbor, in the first place be for God alone, then it is Sancta dilectio. 2. If it be to bring him to that end we aim at our 〈◊〉, then it is amor justus, a just love. 3. If it be merely for our neighbors, without respect to ourselves then it is verus amor, true love. 4. and lastly if we prefer the love of God in the first place then it is ordinata dilectio, well ordered love. Now God in both these tables proceeds further than earthly princes; he takes order for the regulating of the heart and soul even for restraint of concupisence that there be no entertainment of sin within us and that we conceive no delight in it. And this is the internal obedience of the Second Table, to entertain no concupiscence prejudicial to our neighbour, and it is the sum or substance of the Tenth Commandment, which God has placed last, not first that those two, the First Commandment and the Last, the one concerning the inward worship of God, the other the inward love and duty to our neighbor, might be the bounds of his law.</p></blockquote>

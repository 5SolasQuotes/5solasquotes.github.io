<figure class="quote" id="q-e8a82d4739" data-kw="">
<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland (1641)</cite>, p. 53</span></figcaption>

</figure><figure class="quote" id="q-eae6011327" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it… If he cannot destroy faith by open infidelity, he will try to make men believe too much, by making the objects of their own belief and calling that a particular faith, and altering God’s Word and casting away the reasons and evidences of faith, to show the strength and nobleness of their faith, which needs no such helps as these; till by over-doing they have raised their edifice in the air and rejected their foundations, and put out their eyes in honor of the sun, and of their physician, lest either of them should be accused as insufficient.</p></blockquote>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Miscellany Questions, ch. 12, ‘Whether a Sound Heart and an Unsound Head can Consist Together? and Vice Versa; or, Whether Truth and Holiness be not Insepararable Companions?’ in Works, vol. 2</cite></span></figcaption>

</figure><figure class="quote" id="q-f1d8bc290b" data-kw="">
<blockquote><p>Therefore, although the Romanists in their hypothesis [about Transubstantiation] do not intend to worship the bread, but Christ (whom they believe to be there in place of the bread), they are not on that account the less to be considered as really adoring the bread. This false hypothesis and erroneous intention arises from an induced and voluntary ignorance, which so far from being worthy of excuse only increases the guilt. It is not occupied with a thing not revealed and which they are not bound to know, but about a thing which it is their duty to know and which is with sufficient clearness revealed to us in the word. Thus it can readily be perceived unless we are readily blind. Nor can the crime be lessened from its seeming to be only a theoretical error of the intellect. A theoretical error necessarily draws after it a practical sin; otherwise every idolatry (even the most gross) would deserve an excuse because it arises always from a theoretical error of the intellect. For no one would worship an idol, who did not believe it to be God, unless he imagined him to be present.</p></blockquote>

<blockquote><p>Question: What is a right and straight intention in serving God? Assertion 1. When the deliberation of a bended will concurs with the intention, it’s right; as when there is a heart-conclusion for God, Ps. 39:1, ‘I said I will take heed to my ways, that I offend not with my tongue.’ Ps. 31:14, ‘But I trusted in the Lord: I said, Thou art my God.’ Ps. 102:24, ‘I said, O my God, take me not away in the midst of my days.’ This was an intended prayer, Ps. 119:57, ‘I have said that I would keep thy words.’ Assertion 2. The saints are not so perfect in their intentions as God is their only end: 1. Because a piece of ourself is mixed with our end; there is some crook in our straightest line; an angle in our perfectest circle: when we run most swiftly, because of the indwelling of corruption we halt a little. 2. Self-denial is not perfect in this life. Assertion 3. It’s good when God is so preconceived in the intention, as the principal actions and motions both have being and denomination from their predominant element. Honey is honey, though not pure from wax. A believer is not a simple element, nor all grace and all sincerity. Now in bodies carried with a predominant element, the predominant is affirmed, the subordinate denied. 1 Cor. 15:10, ‘Yet not I, but the grace of God with me.’ 2 Cor. 4:5, ‘For we preach not ourselves, but Christ Jesus the Lord, and ourselves your servants for Christ’s sake.’ Where Christ is the predominant element, He is of weight to sway the whole soul in its motion. And it’s right-down sincerity (whatever Crispe [an Antinomian], with Papists say on the contrary) though it require some grains of allowance to make it pass. Assertion 4. Where self is the predominant, the intention is bastard and adulterate. Jehu says, ‘Come see my zeal for the Lord;’ but he only says it. He could have said, ‘Come see my zeal for myself.’ In the Jews’ zeal, Rom. 10:1, there’s a pound of self-righteousness for one-half grain of Christ and of free-grace; therefore it’s not the right zeal of God. Assertion 5. There be two characters of an intended end, which are also here: 1. All that the agent does, he refers to his end; for his end is his God. The wretch does all in reference to gold: that is his end; and Joab did all for court and honor; for the chief end is the man’s master and uses a lordship over him. Christ is so mighty through God that He darkens the scribes’ and pharisees’ light, because their end lies in the fat womb of the world and it is gain and glory; all they do is to make Christ out of the way. So when the believer sails all winds, rolls every stone, presses all means for Christ as his end and his weight, then stirs he to the right port. Christ’s love has a dominion over lord-will: One adamant will cut another; the sinner is a rock, Christ’s love an adamant. Christ’s love setting on the will’s intention burns the soul to the bone. Mary Magdalen cannot sleep (and its a ticklesome game where the heart is at the stake) and Christ she must have; apostles, angels, Christ Himself shall hear of it ere she want [lack] Him. And the rougher and harder the means be, when undertaken for Christ, Christ must be a stronger and more love-working end. When torment and burning quick [alive] are chosen for Christ, it’s like He is the end; for love overcomes a rough and dangerous journey: A sweet and desirable home is above a dirty and thorny way. Christ’s love is stronger than Hell. Our affections often take fire from difficulties, as absence of the Beloved kindles a new fire; stolen bread, because stolen, is sweeter, and not our nature only; but longing after Christ, nititur in vetitum, ‘inclines to that which is forbidden.’ What if Christ be longed for and loved more when absent than present? 2. The other character is that when the end is obtained, all operation for or about the means ceases, and the soul has a complacency in the fruition of the end. When the wretch’s chests are full, he has a heart-quietness in gold; Lk. 12, ‘Soul, take thine ease;’ but if the soul have an aching and a disquieting motion after gold is obtained, it is not because gold was not his end, but because he has not obtained it in such a large measure as he would, or because it’s but a sick and lame end and cannot satiate, but rather sharpen soul-thirst after such corruptible things. When Christ is obtained, the soul has sweet peace; He that drinks of the water of life thirsts no more, appetitu desiderii, ‘as longing with anxiety’ for this, as we do for earthly things which we want [lack]; though he have appetitum complacentiae, ‘a desire of complacency’ and a sweet self-quietness that his heritage pleases him well and his lines are fallen in pleasant parts, and rests on his portion and would not change it with ten thousand worlds. Men by this, who are fishing and hunting after some other thing than Christ, may know what is their end: when Christ and reformation come to their doors, they will have neither but cast out their lines for another prey: Men now fish and angle for gain in lieu of godliness.</p></blockquote>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

<blockquote><p>Who can then blame us to shun a danger, and fearing the worst, to resist evil beginnings? to give no place to the Devil, to crush the viper while it is in the shell, to abstain from all appearance of evil, 1 Thess. 5:22, and to take the little ones of Babylon, whiles they are young, and dash their heads against the stones? It skils not, that many will judge us too precise for doing so. What? do they think this preciseness any other than that which the Law of God requires, even observing of the commandement of God without adding to it or diminishing from it, and keeping the straight path, without declining to the right hand or the left? or do they think us more precise than Mordecai, who would do no reverence to Haman, because he was an Amalekite, and so not to be countenanced nor honoured by an Israelite? Are we more precise than Daniel, who would not close his window when he was praying, no not for the king’s edict, knowing, that because he had used to do so aforetime, his doing otherwise had been both a denying of his former profession and an ensnaring of himself by yielding in small things to yield in greater, and after an inch to take an elle? Are we more precise than the apostle Paul who gave no place to the adversaries of Christian liberty, no not for an hour? Are we more precise than David, who would not do so much as take up the names of idols into his lips, lest from speaking of them he should be led to a liking of them: or may not the sad and doleful examples of so many and so great abuses and corruptions which have crept into the Church from so small and scarcely observable originals, make us loathe at our hearts to admit a change in the policy and discipline of a well constitute[d] Church, and rightly ordered before the change, and especially in such things as are not at all necessary? O! from how small beginnings did the mystery of iniquity advance it’s progression? How little motes have accresced to mountains? Wherefore simplicitatem Christi nos oportet coler•…, à qua ubi primum •…xtulit pedem vanitas, vanitatem sequitur superstitio, superstitionem error, errorem presumptio, presumptionem impietas Idololatrica. We have cause to fear that if, with Israel, we come to the sacrifices of idols, and eat of idolothyts, and bow down or use any of superstitious and idolotrous rites, thereafter we be made to join ourselves to these idols, and so the fierce anger of the Lord be kindled against us, as it was against them.</p></blockquote>

<blockquote><p>But is not brotherly forbearance, Christian indulgence, a debt we owe to brethren, saints and the truly godly in errors, and mind infirmities, which by a natural emanation or resultance get the fore-start of freewill? To which I shall speak in these few considerations: 1. It is much to be desired with the prayers and suits of the children of God that where there are two opinions, there may be one heart, that the Father of Spirits would unite the hearts of all the children of one Father and the heirs of one house. … 3. We cannot think but all saints in this side of glory carry to heaven with them errors, mistakes and prophesying in part, and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lilies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciporation of the debt of compassionate forbearance of the infirmities one of another must have place. 4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a saint looking awry and walking not with a straight foot according to the truth of the gospel, which way, if heeded in sincerity, should breed more union of hearts and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ‘To the godly &amp; impartial Reader’</cite></span></figcaption>

</figure><figure class="quote" id="q-03bbd0999e" data-kw="">
<blockquote><p>They [laypersons] are to edify, exhort, rebuke and comfort one another (Heb. 3:13; Lev. 19:17; 1 Thess. 5:11-12; Col. 3:16; Heb. 10:23; Mal. 3:16; Zech. 8:21), and this they may do, not one to one only, as some say, but one to many: 1. So the Scripture says, Prov. 10:21, ‘The lips of the righteous feed many;’ Eph. 4:29, they are to speak words ministering grace to the hearers. So says Calvin (Commentary, Hos. 2:2), Bullinger (in Col. 4:6), Beza (Ibid.), Davenant (in Col. 3:16), Whittaker (of the Authority of Scripture, vol. 2, bk. 3, ch. 14), Pareus (in Hos. 2:2), Zanchius, Musculus (in Isa. 2:2), Gualther (hom.[ily?] 17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conclusion 2, pp. 257-9 in A Peaceable &amp; Temperate Plea… (1642)</cite>, p. 257</span></figcaption>

<blockquote><p>Article 13, Private Worship Our Assembly [the Church of Scotland] also commands godly conference at all occasional meetings (Act at Edinburgh Assembly, 1641), or as God’s providence shall dispose, as the word of God commands, Heb. 3:13; 1 Thess. 5:11,12; Lev. 19:17; Zech. 8:21; Mal. 3:16; Col. 3:16, providing none invade the pastor’s office to preach the word who are not called thereunto by God and his Church, Heb. 5:4,5; Rom. 10:14-15; 1 Cor. 12:28,29, and by that same warrant the grieved in conscience is to confess his sins, which troubles and presses down his soul, to either an experienced Christian or pastor, as James 5:16, but this confession is free to the grieved party, I mean free from being canonically commanded in our assemblies, and far from sacramental confession, or auricular [audible] confession to a priest.</p></blockquote>

<blockquote><p>6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another; 4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office. 5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>

</figure><figure class="quote" id="q-96bb039134" data-kw="">
<blockquote><p>Is there no means to edify, exhort, and comfort, but prophesying? and that prophesying-public in the Church and pastoral? that is denied, what say you of private and domestic exhorting, praying, praising, reading, and Christian conference, Col. 3:16; Mal. 3:16; Zech. 8:21, are not they singular means of edifying?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea for Paul’s Presbytery in Scotland | The Due Right of Presbyteries (1644), Ch. 5, sections 1-2 in Part 2 | pp. 298-9 Rutherford is arguing against the argument of a congregationalist.</cite></span></figcaption>

</figure><figure class="quote" id="q-293726fbc1" data-kw="">
<blockquote><p>The Church did formerly of late confer with Christ, and refused to open to Him when He was knocking and showering down influences of grace [in the Song of Solomon]; now she is glad to confer: 1. With the smiting watchmen [Church officers], where she found little of Christ. 2. Next with private Christians in assemblies. This is a mean of the Lords showering down of influences in the public and domestic, or less public meetings of his saints; for ordinances of all sorts that are appointed of Christ, they drop down savory and seasonable dews. The Lord writes in his book the savory conferences of such as fear the Lord’s name, Mal. 3:16; and three things follow: 1. The Lord owns such as are his. 2. His forbearance though there be faults in their service. 3. His making known to his the difference betwixt such as serve God, and such as serve Him not: and Zech. 8, the inhabitants of one city encourage the inhabitants of another; and the fruits of it is: 1. Praying. 2. Owning the saints. And they take hold of the skirt of a Jew; and both say Christians meeting for prayer and conference want not God, who rains down impressions of grace upon them as his people, especially when they warm one another; as many coals in one heap make a great fire. Nor is the acting of the Spirit tied only to the public ministry; the saints take to their houses clusters of wine-grapes, which they feed upon at home. Let the saints meet, and by conference and prayer draw down new influences of the Spirit, Jude 20; Isa. 2:1-3; Jer. 50:4-5; Col. 3:16; Heb. 3:13 &amp; 10:24; 1 Thess. 5:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea for Paul’s Presbytery in Scotland | Influences of the Life of Grace (1659), ch. 11</cite>, pp. 307-8</span></figcaption>

</figure><figure class="quote" id="q-d291359af6" data-kw="">
<blockquote><p>Secondly, Professed saints ought to perform such other spiritual services as tend to their mutual edification. They are enjoined to “follow after the things wherewith one may edify another.” – Rom. 14:19. Among the “services which tend to mutual edification,” may be mentioned mutual prayer; spiritual conference; admonishing, exhorting, and provoking one another to love and good works; comforting the feeble-minded, supporting the weak, visiting and encouraging the afflicted. – Mal. 3:16; Col. 3:16; 1 Thess. 5:11,14; Heb. 10:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Westminster Confession of Faith</cite>, p. 328, on WCF 26.1-2</span></figcaption>

</figure><figure class="quote" id="q-cc2047aed6" data-kw="">
<blockquote><p>First, it will be expedient that all the ministers, for conserving purity and concord of doctrine among themselves, meet together one certain day each week, for discussion of the Scriptures; and none are to be exempt from this without legitimate excuse. If anyone be negligent, let him be admonished. As for those who preach in the villages, throughout the Seigneury [feudal lordship], they are to be exhorted to come as often as they are able. For the rest, if they default an entire month, it is to be held to be very great negligence, unless it is a case of illness or other legitimate hindrance. If there appear difference of doctrine, let the ministers come together to discuss the matter. Afterwards, if need be, let them call the elders to assist in com posing the contention.</p></blockquote>

</figure><figure class="quote" id="q-59fe7daeaa" data-kw="">
<blockquote><p>It is permitted to the expectants [students for the ministry], having entered before upon the public exercise or prophesy [the elders’ conference], to sit by the ministers and elders in the meeting of the presbytery and to give their judgement of the doctrine, but they have no voice when matters of doctrine or discipline are debated. And in the handling of some matters which are thought fit to be concealed and kept secret till they be by common consent published, they are to be removed.</p></blockquote>

</figure><figure class="quote" id="q-54ccc1651c" data-kw="">
<blockquote><p>…The ministers and elders (who are commissioners), together with the expectants [students for the ministry] and others who are pleased to be present, meeting in the place and at the day and hour appointed (which is accustomed to be one half hour after nine o’clock in the forenoon, whereof warning is given by the sound of a bell, so that all the affairs of that day, unless there be somewhat extraordinary to hold them longer, may be exped [expedited?] against mid-day), do begin with prayer and proceed to the textual interpretation of Scripture (which is done by the ministers, each one in his own place by course, or by the expectants, whose names are set forth in a table or written in the register of the presbytery for that end). After the first speaker, some other who follows in order and is also appointed by the presbytery the day before, speaks in the second place, collects some doctrines (one or more upon the text expounded) and shows the use thereof. The second speaker, having ended about eleven o’clock, the exercise is closed with thanksgiving by him who spoke first. The matter of each day’s exercise is some portion of that particular book of the Old or New Testament agreed upon in the presbytery. Once every month some common place or controversy is handled unto which the exercise gives place for that day. The ground is read in Scripture, the state of the question propounded, the arguments for the truth pressed and vindicated from the sophistication of the adversaries. But the arguments contra [the adversaries] are left to be proposed in the presbyterial meeting by such ministers as are called by the moderator to dispute upon the propositions or theses exhibited by the contraversar and propugned [assailed] by him, before the day of the next meeting, the moderator being praeses [president] of the disputation. That the presbytery may go through all the controversies, they have also a table wherein they are all digested in order, so that each minister or expectant knows a month before what is next to be treated. The exercise (or common head of controversy) being ended in public, the people depart and the ministers and elders (with others who are permitted to be present) go to the private place of their meeting, where (all being set in order and the moderator having begun with prayer) the doctrine that was delivered in public is examined and each one of the presbytery and expectants either approves, or (in charity and soberness of spirit) propounds his doubt against any point spoken of. Which being done, the speakers for that day are called upon (they being apart at this time) and their interpretation and doctrine is approved and they are encouraged. Or (if there be cause), they are in a brotherly manner admonished and the doctrine censured (for this they call the censure of the doctrine). The matters before mentioned are the subject of the presbyterial jurisdiction, are propounded, modestly debated, and either concluded or taken to further deliberation, or remitted to the synod. And so the meeting is concluded with prayer.</p></blockquote>

<blockquote><p>Remember to read over these resolutions once a week.” – Edwards . 1800’s Green, Ashbel – ‘Questions &amp; Counsel for Young Converts’ 5 pp. 13 questions &amp; 6 counsels, appended to John Willison, The Young Communicant’s Companion, pp. 68-72 . . Books 1500’s Hyperius, Andreas – The True Trial &amp; Examination of a Man’s own self, wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise-breach at baptism, by ordinary transgression apparently proved, his lamentable estate through sin discovered, his wilfull obstinacy by daily disorder displayed, and lastly how by earnest repentance, and faith in Christ Jesus, he is from all the same clearely pardoned, forgiven, released and reconciled (London: John Windet, 1587) 189 pp. ToC . 1600’s Bolton, Robert – A Threefold Treatise containing the Saints’ Sure &amp; Perpetual Guide: Self-Enriching Examination, Soul-Fatting Fasting: or Meditations concerning the Word, the Sacrament of the Lords Supper &amp; Fasting (London: Purslow, 1634) 252 pp. ToC Index Wettenhall, Edward – Enter into thy Closet, or a Method &amp; Order for Private Devotion: a treatise endeavoring a plain discovery of the most spiritual and edifying course of reading, meditation and prayer; and so of self-examination, humiliation, mortification and such most necessary Christian duties, by which we sue out the pardon of our sins from Heaven and maintain an holy converse with God (London: Martyn, 1666) 312 pp. ToC Wettenhall (1636–1713) was an English bishop of the Church of Ireland. He was for submitting to the Glorious Revolution (1689), against the opposition of Jacobites, and was a moderate on concessions to Christian dissenters. In his will he affirms the church of England and Ireland to be “the purest church in the world”, though “there are divers points which might be altered for the better” in “articles, liturgy, and discipline, but especially in the conditions of clerical communion.</p></blockquote>

<blockquote><p>The mentioning of these two duties meeting together at one time in our practise does not intend that they do both of them bind the conscience at the same instant, but they are called duties as they are considered apart; being both works are commanded of God in two several commandments: Which two works being duties considered apart, do sometimes offer themselves to our practise at one instant; As to hear a sermon at the church on the Sabbsth, and to tend a sick person ready to die at home at the same time, both are duties being considered apart, but meeting together, and offering themselves to our practise at one time, there is indeed but one duty, because both cannot be performed in one instant; In which case the greater work is the duty, the lesser binds not for that present…</p></blockquote>

</figure><figure class="quote" id="q-eaa8ad3c22" data-kw="">
<blockquote><p>It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’</cite>, p. 211</span></figcaption>

</figure><figure class="quote" id="q-96abc30f3e" data-kw="">
<blockquote><p>Assertion 2: All the goods of the subjects belong not to the king. I presuppose that the division of goods does not necessarily flow from the law of nature [which is more fundamental than the positive laws of society and kings], for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]. But supposing man’s sin, though the light of the sun and air be common to all, and religious places [such as buildings for public worship] be proper to none [as they were provided in his day out of the public funds, by and for all], yet it is morally impossible that there should not be a distinction of meum et tuum, ‘mine and thine’; and the Decalogue forbidding theft, and coveting the wife of another man (yet is she the wife of Peter, not of Thomas, by free election, not by an act of nature’s law) does evidence to us, that the division of things is so far forth (men now being in the state of sin) of the law of nature, that it has evident ground in the law of nations [which is more specific and positive, being built upon the law of nature, but less fundamental than it]; and thus far natural, that the heat that I have from my own coat and cloak, and the nourishment from my own meat are physically incommunicable to any. But I hasten to prove the proposition: If I have leave to permit that, in time of necessity [which is more fundamental than positive, societal laws], all things are common by God’s law [as at Creation], [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning: 1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth. 2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence. 3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner. 4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex, question 16</cite>, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“Assertion 2: All the goods of the subjects belong not to the king. I presuppose that the division of goods does not necessarily flow from the law of nature [which is more fundamental than the positive laws of society and kings], for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]. But supposing man’s sin, though the light of the sun and air be common to all, and religious places [such as buildings for public worship] be proper to none [as they were provided in his day out of the public funds, by and for all], yet it is morally impossible that there should not be a distinction of meum et tuum, ‘mine and thine’; and the Decalogue forbidding theft, and coveting the wife of another man (yet is she the wife of Peter, not of Thomas, by free election, not by an act of nature’s law) does evidence to us, that the division of things is so far forth (men now being in the state of sin) of the law of nature, that it has evident ground in the law of nations [which is more specific and positive, being built upon the law of nature, but less fundamental than it]; and thus far natural, that the heat that I have from my own coat and cloak, and the nourishment from my own meat are physically incommunicable to any. But I hasten to prove the proposition: If I have leave to permit that, in time of necessity [which is more fundamental than positive, societal laws], all things are common by God’s law [as at Creation], [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning: 1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth. 2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence. 3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner. 4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…”

— Samuel Rutherford, Lex Rex, question 16, p. 67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssertion+2%3A+All+the+goods+of+the+subjects+belong+not+to+the+king.+I+presuppose+that+the+division+of+goods+does+not+necessarily+flow+from+the+law+of+nature+%5Bwhich+is+more+fundamental+than+the+positive+laws+of+society+and+kings%5D%2C+for+God+made+man%2C+before+the+Fall%2C+lord+of+the+creatures+indefinitely+%5BGen.+1%3A26-30%5D%3B+but+what+goods+be+Peter%E2%80%99s%2C+and+not+Paul%E2%80%99s%2C+we+know+not+%5Bfrom+nature%E2%80%99s+law%5D.+But+supposing+man%E2%80%99s+sin%2C+though+the+light+of+the+sun+and+air+be+common+to+all%2C+and+religious+places+%5Bsuch+as+buildings+for+public+worship%5D+be+proper+to+none+%5Bas+they+were+provided+in+his+day+out+of+the+public+funds%2C+by+and+for+all%5D%2C+yet+it+is+morally+impossible+that+there+should+not+be+a+distinction+of+meum+et+tuum%2C+%E2%80%98mine+and+thine%E2%80%99%3B+and+the+Decalogue+forbidding+theft%2C+and+coveting+the+wife+of+another+man+%28yet+is+she+the+wife+of+Peter%2C+not+of+Thomas%2C+by+free+election%2C+not+by+an+act+of+nature%E2%80%99s+law%29+does+evidence+to+us%2C+that+the+division+of+things+is+so+far+forth+%28men+now+being+in+the+state+of+sin%29+of+the+law+of+nature%2C+that+it+has+evident+ground+in+the+law+of+nations+%5Bwhich+is+more+specific+and+positive%2C+being+built+upon+the+law+of+nature%2C+but+less+fundamental+than+it%5D%3B+and+thus+far+natural%2C+that+the+heat+that+I+have+from+my+own+coat+and+cloak%2C+and+the+nourishment+from+my+own+meat+are+physically+incommunicable+to+any.+But+I+hasten+to+prove+the+proposition%3A+If+I+have+leave+to+permit+that%2C+in+time+of+necessity+%5Bwhich+is+more+fundamental+than+positive%2C+societal+laws%5D%2C+all+things+are+common+by+God%E2%80%99s+law+%5Bas+at+Creation%5D%2C+%5Bthen%5D+a+man+travelling+might+eat+grapes+in+his+neighbor%E2%80%99s+vineyard%2C+though+he+was+not+licensed+to+carry+any+%5Ba%5Dway.+I+doubt+if+David%2C+wanting+%5Blacking%5D+money%2C+was+necessitated+to+pay+money+for+the+showbread%2C+or+for+Goliath%E2%80%99s+sword%2C+supposing+these+to+be+the+very+goods+of+private+men+and+ordinarily+to+be+bought+and+sold.+Nature%E2%80%99s+law+in+extremity%2C+for+self-preservation%2C+has+rather+a+prerogative+royal+above+all+laws+of+nations+and+all+civil+laws+than+any+moral+king.+In+this+meaning%3A+1.+Any+one+man+is+obliged+to+give+all+he+has+for+the+good+of+the+commonwealth%2C+and+so+far+the+good+of+the+king%2C+inasfar+as+he+is+head+and+father+of+the+commonwealth.+2.+All+things+are+the+king%E2%80%99s%2C+in+regard+of+his+public+power+to+defend+all+men+and+their+goods+from+unjust+violence.+3.+All+are+the+king%E2%80%99s%2C+in+regard+of+his+act+of+conservation+of+goods%2C+for+the+use+of+the+just+owner.+4.+All+are+the+king%E2%80%99s+in+regard+of+a+legal+limitation%2C+in+case+of+a+damage+offered+to+the+commonwealth.+Justice+requires+confiscation+of+goods+for+a+fault%3B+but+confiscated+goods+are+to+help+the+interested+commonwealth%2C+and+the+king%2C+not+as+a+man+%28to+bestow+them+on+his+children%29+but+as+a+king.+To+this+we+may+refer+these+called+bona+caduca+et+inventa+%5Bgoods+fallen+and+found%5D%2C+things+lost+by+shipwreck+or+any+other+providences%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+question+16%2C+p.+67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96abc30f3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96abc30f3e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-libertarianism/#:~:text=Assertion%202%3A%20All%20the%20goods%20of,by%20shipwreck%20or%20any%20other%20providences%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>IV. (3) We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord or proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom He governs as ruler and legislator; to whom belong legislation, judgment and execution…)… … XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist). … XXXII. …(3) Nor assuredly can the Egyptians [at the Exodus, with reference to them giving their belongings to the Israelites] themselves be considered the lawful owners in the court of heaven with God, but only usurpers (as also other wicked men, although in the forum of earth and with men they are esteemed such)… XXXIII. Although it was not lawful to move a sickle into a neighbor’s standing corn, still the liberty was formerly lawfully granted to a passing traveller, either to pluck ears of corn from the field or grapes from a vineyard for the sake of satisfying hunger (Dt. 23:24,25). This was done not by dispensing with the law of theft, but by its true interpretation for it was a work of necessity, permitted by the supreme Lord for the purpose of binding men more closely in the bonds of love. If these acts have any indecency in themselves, they cease to be such when the divine command (or instinct or vocation) intervenes, imposing such a necessity or conceding liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 4, 18, 32-33, pp. 8, 12 &amp; 18</cite></span></figcaption>

</figure><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>

<blockquote><p>4. They [civil magistrates] may and ought to destroy such books as they [spiritual seducers] use to spread for the infecting of others, and inhibit and stop printing of them, or actual selling, spreading or transporting of them, as they may stop carrying of suspected or forbidden goods. 6. They may and ought to restrain and censure all blasphemous and irreverent expressions and speeches against the majesty of God and His ordinances, and all calumnies and bitterness against faithful ministers or professors that adhere to truth: for, these are moral sins; and blasphemy, calumny, and such like, are no more to be passed over without censure in such, than in others who are not professedly tainted with error: And the pretext of following light and conscience, cannot make these sins tolerable, more than the Nicolaitans [Rev. 2] pretending the same for their committing adultery and other filthiness: And this is not to punish men’s opinions, or force their consciences, but to punish their vices, even such as have been hateful unto and punished by, many natural and heathen men.</p></blockquote>

<blockquote><p>Mr. [Thomas] Hooker [an Independent]: ‘They [Christian persons] may, as Christians, maintain private communion one with another; and as they be Churches, use that Christian privilege to further their own good, and promote the work by counsel: for what I do qua ethicus, qua oeconomicus, qua Christianus [as an ethical person, as a domestic person, as a Christian] in private, appertains not to the Magistrate, except it entrench upon his policy.’ [Rutherford’s] Answer: 1. Mr. Hooker makes all that Christians do as Christians and as Churches, that is, gathering of Churches, hearing, partaking of seals and censures, to be private actings not belonging to the Magistrate. Strange it is that the convening of the ten thousand subjects in the same place (as our [congregationalist] Brethren say) belongs nothing to the Magistrate; [yet] sure it sides with peace or war. And yet Mr. Hooker saith, ‘The Magistrate may compel men to attend the mind of Christ, and solemnly to humble themselves by fasting and prayer.’ See how these two consist. … Mr. Hooker: ‘Commission and just permission are all one: A Ruler permits a Finder to set up a school, he needs no commission.’ Answer: If fencing be useful, the Ruler must give him positive protection, as others that do well; else if one kill him when he teaches his scholars, the Ruler ought not to revenge that murder, though most treacherously committed, and say he promised to the Fencer only permission; and yet it’s worse to say [that] the Christian Ruler owes to assemblies, pastors, schools only permission. Paul saith, he owes praise, Rom. 13:3, which, with good ground, famous interpreters expound to be countenancing, favor, protection, reward, stipends. And if the Christian magistrate do but permit assemblies to convene, as a very episcopal man, D. Bilson said, permissio est à magistratu, commissio à Christo [‘Permission is from the magistrate, a commission from Christ’]: What more influence (if permission and commission be all one) hath the godly magistrate in the public worship of God, and assemblies of the Church, than heathen magistrates, Ahasuerus, the Kings of Chaldea, who permitted the people of God to worship the true God, Esth. 4:16-17; Dan. 6:7-8, or the Church of Rome have, who by public order establish stews [whore-houses] and permit fornication? See Emmanuel Sa, who says, bishops and priests are by law permitted to have whores.</p></blockquote>

</figure><figure class="quote" id="q-6f6fce6380" data-kw="">
<blockquote><p>…and some Christian commonwealths, he [Barclay] means his own synagogue of Rome, spiritual Sodom, a cage of unclean birds, suffers harlots by law; and the whores pay so many thousands yearly to the Pope, and are free of all punishment by law, to eschew [avoid or lessen] homicides, adulteries of Romish priests, and other greater sins; therefore [it would conclude] God has given power to a king to play the tyrant without any fear of punishment to be inflicted by man. But if this be a good argument, the magistrate to whom God has committed the sword to take vengeance on evil doers (Rom. 13:3-6), such as are perjured persons, professed whores and harlots, has a lawful power from God to connive at sins and gross scandals in the commonwealth, as they dream that the king has power given from God to exercise all acts of tyranny without any resistance. But: 1. This was a grievous sin in Eli, that he being a father and a judge, punished not his sons for their uncleanness, and his house, in God’s heavy displeasure, was cut off from the priesthood therefore. Then God has given no such power to the judge. 2. The contrary duty is lying on the judge to execute judgment for the oppressed (Job 29:12-17; Jer. 22:15-16) and perverting of judgment, and conniving at the heinous sins of the wicked, is condemned (Num. 5:31-32; 1 Sam. 15:23; 1 Kings 29:42-43; Isa. 1:17; 10:1; 5:23); and therefore God has given no power to a judge to permit wicked men to commit grievous crimes without any punishment. As for the [Mosaic] law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says; and the prophet says (Mal. 2) that the Lord hates putting away; but that God has given any such permissive power to the king, that he may do what he pleases, and cannot be resisted, this is in question.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“…and some Christian commonwealths, he [Barclay] means his own synagogue of Rome, spiritual Sodom, a cage of unclean birds, suffers harlots by law; and the whores pay so many thousands yearly to the Pope, and are free of all punishment by law, to eschew [avoid or lessen] homicides, adulteries of Romish priests, and other greater sins; therefore [it would conclude] God has given power to a king to play the tyrant without any fear of punishment to be inflicted by man. But if this be a good argument, the magistrate to whom God has committed the sword to take vengeance on evil doers (Rom. 13:3-6), such as are perjured persons, professed whores and harlots, has a lawful power from God to connive at sins and gross scandals in the commonwealth, as they dream that the king has power given from God to exercise all acts of tyranny without any resistance. But: 1. This was a grievous sin in Eli, that he being a father and a judge, punished not his sons for their uncleanness, and his house, in God’s heavy displeasure, was cut off from the priesthood therefore. Then God has given no such power to the judge. 2. The contrary duty is lying on the judge to execute judgment for the oppressed (Job 29:12-17; Jer. 22:15-16) and perverting of judgment, and conniving at the heinous sins of the wicked, is condemned (Num. 5:31-32; 1 Sam. 15:23; 1 Kings 29:42-43; Isa. 1:17; 10:1; 5:23); and therefore God has given no power to a judge to permit wicked men to commit grievous crimes without any punishment. As for the [Mosaic] law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says; and the prophet says (Mal. 2) that the Lord hates putting away; but that God has given any such permissive power to the king, that he may do what he pleases, and cannot be resisted, this is in question.”

— Samuel Rutherford, Lex Rex… (1644; Edinburgh: Ogle, 1843), question 18, p. 76 lt col mid-bot">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6and+some+Christian+commonwealths%2C+he+%5BBarclay%5D+means+his+own+synagogue+of+Rome%2C+spiritual+Sodom%2C+a+cage+of+unclean+birds%2C+suffers+harlots+by+law%3B+and+the+whores+pay+so+many+thousands+yearly+to+the+Pope%2C+and+are+free+of+all+punishment+by+law%2C+to+eschew+%5Bavoid+or+lessen%5D+homicides%2C+adulteries+of+Romish+priests%2C+and+other+greater+sins%3B+therefore+%5Bit+would+conclude%5D+God+has+given+power+to+a+king+to+play+the+tyrant+without+any+fear+of+punishment+to+be+inflicted+by+man.+But+if+this+be+a+good+argument%2C+the+magistrate+to+whom+God+has+committed+the+sword+to+take+vengeance+on+evil+doers+%28Rom.+13%3A3-6%29%2C+such+as+are+perjured+persons%2C+professed+whores+and+harlots%2C+has+a+lawful+power+from+God+to+connive+at+sins+and+gross+scandals+in+the+commonwealth%2C+as+they+dream+that+the+king+has+power+given+from+God+to+exercise+all+acts+of+tyranny+without+any+resistance.+But%3A+1.+This+was+a+grievous+sin+in+Eli%2C+that+he+being+a+father+and+a+judge%2C+punished+not+his+sons+for+their+uncleanness%2C+and+his+house%2C+in+God%E2%80%99s+heavy+displeasure%2C+was+cut+off+from+the+priesthood+therefore.+Then+God+has+given+no+such+power+to+the+judge.+2.+The+contrary+duty+is+lying+on+the+judge+to+execute+judgment+for+the+oppressed+%28Job+29%3A12-17%3B+Jer.+22%3A15-16%29+and+perverting+of+judgment%2C+and+conniving+at+the+heinous+sins+of+the+wicked%2C+is+condemned+%28Num.+5%3A31-32%3B+1+Sam.+15%3A23%3B+1+Kings+29%3A42-43%3B+Isa.+1%3A17%3B+10%3A1%3B+5%3A23%29%3B+and+therefore+God+has+given+no+power+to+a+judge+to+permit+wicked+men+to+commit+grievous+crimes+without+any+punishment.+As+for+the+%5BMosaic%5D+law+of+divorce%2C+it+was+indeed+a+permissive+law%2C+whereby+the+husband+might+give+the+wife+a+bill+of+divorce+and+be+free+of+punishment+before+men%2C+but+not+free+of+sin+and+guiltiness+ <blockquote><p>Lastly, they say, ‘Rome cannot be the whore [in Rev. 17], because (forsooth) of her holiness,’ and what is that? There are so many abbacies, mortifications, holy Churchmen, relics and temples of saints, many masses and such like there, etc. All which serve not to prove this conclusion, that she is so. And it is not unobserveable that immediately after this answer, Cornelius à Lapide, professor at Rome, does justify the toleration of stews and brothel-houses in it, as a thing tending to prevent much sin and becoming a well-ordered commonwealth; And when this is mentioned by them as a piece of Rome’s holiness, we may the more easily judge of the rest.</p></blockquote>

</figure><figure class="quote" id="q-592351cc17" data-kw="">
<blockquote><p>So on the other hand Pope Hildebrand‘s [d. 1085] violent decrees and edicts against married priests’ wives and masses introduced all manner of uncleanness, whoredom, adultery and sodomy itself amongst unmarried Popes, prelates, cardinals, clergymen, votaries of the Roman Church; yea and avowed toleration, patronage of whoredom, public stews, whores in Rome itself, together with an annual tribute to Popes and their officers both from whores and priests. Hence Johannis Andreat, Johannis de Aton and other canononists in their Gloss on Otho•s Constitutions, are not ashamed to publish: Videtur quod crimen Meretricii sub dissimulatione transire debet Ecciesia; Nam et Mareschallus Papae de facto exigit Tributum a Meretricibus, et hoc forte, ad ma•o malum ev•tandum non est culpandum. These public harlots, constituted Popes themselves before Hildebrand’s time, and in most ages since priests’ wives prohibited, they have been highly courted like princes and ladies even in Rome itself at noon-day, as well as in the night by disguised cardinals and clergymen; as Paul the 3rd, his own Cardinals thus informed him: In hac etiam urbe Meretrices, ut Matronae, incedunt per urbem, seu Mula vehuntur; quas affectantur de media die Nobiles, familiares Cardinalium, praesertim noctu: nulla in urbe videmus hanc corruptionem praeterquam in hac omnium exemplari: Habitant etiam insignes aedes; Yea Peter Martyr [Vermigli] adds: Vehuntur per publicum habitu Principum; Sedent in equis gradiariis, etc. Habent secum Torquatos &amp; Larvatos Comites, interdum etiam Cardinalium, praesertim noctu, &amp; ancilarum sumptuosissimam gregem. Nunc, O Deus bone, quomodo Romae coercentur Meretrices? Yea, to prevent the emperors and other kings punishing and reformation of these abuses, they exempted all clergymen from their tribunals, and the accusations of laymen, decreeing, that no cardinal should be convicted, condemned of adultery, whoredom, etc. but by 72 witnesses, no cardinal priest but by 64, no cardinal deacon or bishop but by 24, nor subdeacon or cardinal of inferior degree, nor bishop but by 7 witnesses at least. And those would be more than impudent, who durst commit whoredom, adultery, or sodomy in the open view of so many priests or clergymen; or yet of laymen, though disabled to accuse them by their canons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Chronological History &amp; Full Display of Popes’ Intollerable Usurpations upon the ancient just rights, liberties, of the kings, kingdoms, clergy, nobility, commons of England &amp; Ireland (1666), bk. 1, ch. 5</cite>, p. 289</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

2C+interdum+etiam+Cardinalium%2C+praesertim+noctu%2C+%26+ancilarum+sumptuosissimam+gregem.+Nunc%2C+O+Deus+bone%2C+quomodo+Romae+coercentur+Meretrices%3F+Yea%2C+to+prevent+the+emperors+and+other+kings+punishing+and+reformation+of+these+abuses%2C+they+exempted+all+clergymen+from+their+tribunals%2C+and+the+accusations+of+laymen%2C+decreeing%2C+that+no+cardinal+should+be+convicted%2C+condemned+of+adultery%2C+whoredom%2C+etc.+but+by+72+witnesses%2C+no+cardinal+priest+but+by+64%2C+no+cardinal+deacon+or+bishop+but+by+24%2C+nor+subdeacon+or+cardinal+of+inferior+degree%2C+nor+bishop+but+by+7+witnesses+at+least.+And+those+would+be+more+than+impudent%2C+who+durst+commit+whoredom%2C+adultery%2C+or+sodomy+in+the+open+view+of+so+many+priests+or+clergymen%3B+or+yet+of+laymen%2C+though+disabled+to+accuse+them+by+their+canons.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+An+Exact+Chronological+History+%26+Full+Display+of+Popes%E2%80%99+Intollerable+Usurpations+upon+the+ancient+just+rights%2C+liberties%2C+of+the+kings%2C+kingdoms%2C+clergy%2C+nobility%2C+commons+of+England+%26+Ireland+%281666%29%2C+bk.+1%2C+ch.+5%2C+p.+289&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F592351cc17.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/592351cc17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-libertarianism/#:~:text=So%20on%20the%20other%20hand%20Pope,to%20accuse%20them%20by%20their%20canons." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. They may and ought to restrain idle and vagabound travelling of such suspected persons [spiritual seducers], without representing of their necessary businesse to some, appointed for that effect, in which case their doing hurt by such a voyage, might be prevented, and they have a pass.</p></blockquote>

<blockquote><p>It is not unlawful of itself to sell poison, or give a knife to another, or to bid another to do it [sell the goods]; but if it were foreseen that they will be used to poison or kill the buyer, it is unlawful; and I think the [civil] Law would make him believe it that were guilty. It is not of itself unlawful to light a candle, or set fire on a straw; but if it may be foreknown that by another’s negligence or willfulness [that] it is like[ly] to set fire on the city, or give fire to a train or store of gun-powder that is under the Parliament House, when the King and Parliament are there, I crave the Bishop’s [his opponent’s] pardon for believing that it were sinful to do it, or command it;</p></blockquote>

</figure><figure class="quote" id="q-5b1aa6c82d" data-kw="">
<blockquote><p>Mather enumerates and condemns all forms of commercial dishonesty and business corruption—including the kidnapping of Africans into slavery. He also gives us a sense of the accommodations of the old theocracy (20 years after the Glorious Revolution and 18 years after the witchcraft crisis) with the new horizons of the eighteenth century, telling the Assembly: ‘In two or three too memorable days of temptation that have been upon us, there have been errors committed. You are always ready to declare unto all the world that you disapprove those errors. You are willing to inform all mankind with your declaration that no man may be persecuted because he is conscientiously not of the same religious opinions with those that are uppermost. And that persons are not to be judged confederates with evil spirits merely because the evil spirits do make possessed people cry out upon them.’ Finally, and as expected, he applies the lesson to the place of America in the grand drama of redemption, holding out the hope that the churches of New England will play the leading role…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England (Boston, 1710) UNL on Rev.</cite>, 21:21</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics… If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them.</p></blockquote>

<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>

<blockquote><p>The Magistrate hinders ignorance and losing ships by tempests not by professing and teaching sciences and arts in academies in his own person, nor by steering ships, and guiding them himself to their ports, for so [then] a magistrate as a magistrate should be a schoolmaster, a professor of arts and sciences in the universities, and a pilot or shipmaster, which were a confounding of all callings; but by procuring that there should be universities and professors of arts and sciences, and by providing honorable stipends and wages for them, and procuring that in the commonwealth there should be sailers who are skilled in shipping: and so does the magistrate by his office take care that the Word, sacraments and discipline, be dispensed.</p></blockquote>

<blockquote><p>Of those who have never been brought to feel their unholy and guilty hearts… Such persons, from motives of this world, may be regular in their manners and in a visible attendance on many religious institutions. They are friends to every thing in religion but the experimental and evangelical part of it in the heart.—Having never seen their own unholy, guilty want of a supreme love of God, they depend for eternal safety, on their visible regularity and the general mercy of God through a Saviour.</p></blockquote>

<blockquote><p>Many appear to have an apprehension, that religion is something designed only for the benefit of another world. That if we can have it at the time of death, the whole which religion can give will be attained. Such an idea arises from an utter experimental ignorance what religion is. True religion is the most perfect blessedness of rational beings, in every possible state of existence ; in this world, at death and through eternity. By the present comforts of religion, a pious mind obtains the highest conviction, that it is impossible there should be a state of perfect blessedness, without a holy temper and practice.</p></blockquote>

<blockquote><p>Calvin and Beza employed various measures in order to send the preachers they trained into France in a way that would ensure their safety and minimize the likelihood of detection and capture. They sent them into France under assumed names, carrying false identities, forged papers, clandestine meetings. They took obscure mountain passages in order to avoid the authorities along the border.</p></blockquote>

</figure><figure class="quote" id="q-85d2bcd06d" data-kw="">
<blockquote><p>One finds Calvin (for instance) declaiming, in his lectures, that they [French kings] are “gross and stupid.” They “think they are exempt from the law.” They are self-indulgent, “inhuman tyrants,” and “madmen.” They “despise everything divine” and wish to be worshipped in God’s place. They “rage against the church.” “We know that wherever there is cunning in the world, it reigns especially in the palaces of princes.”… Thus, the depiction of obsequious deference and obedience on the part of Geneva towards France was, in reality, a façade.</p></blockquote>

</figure><figure class="quote" id="q-5cb0ccd1ba" data-kw="">
<blockquote><p>…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.</p></blockquote>

med Books Online</a></div>
</figure><figure class="quote" id="q-e182afc1a3" data-kw="">
<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>

<blockquote><p>1. Tell them that you love them, aren’t ashamed of them, and that this is something that you have had to overcome. Tell them they can do the same. 2. Tell them that porn is bad for them spiritually, physically, and relationally. And then explain how. 3. Tell them that you are going to set up ‘speed bumps’ to help them when they’re tempted but it comes down to their desire to live with integrity. Those speed bumps are: a. Filters (on devices &amp; internet protocol) b. Screens only in shared spaces c. Weekly check-ups: ‘Have you looked at porn of any form this week?’ 4. Ask them to identify the a) the times that are most tempted and b) the things that seem to trigger the desire to look at porn. 5. Show them ways to deal with stress that are productive: bible reading, prayer, running, pushups, developing a skill, etc. 6. Remind them again that you love them, porn makes you weak, and living a lie is hell. Let them know that you won’t look down on them if they stumble and they need to let you know so you can conquer together.</p></blockquote>

<blockquote><p>I answer that, Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>

<blockquote><p>‘Beauty’ (as Augustine defines it) ‘is a proportionable congruity and fit agreement of all the parts of the body, joined with a certain sweetness of color and countenance,’ the which in its own nature is good, as being a gift of God…&#x27;</p></blockquote>

<blockquote><p>…beauty, because this is also a judgment of things that can arouse the desiring faculty to attraction or aversion. Beauty has its own value alongside truth and goodness.</p></blockquote>

</figure><figure class="quote" id="q-69f6a5ed1e" data-kw="">
<blockquote><p>But people evaluate things also according to the standard of beauty and ugliness… But the beautiful is nevertheless essentially distinct from the pleasant. People do not argue about what is pleasant. One person finds this food and that drink enjoyable, but another does not. People are comfortable with this and do not argue about these differences. However, in connection with what is beautiful, people tend not to be satisfied with the notion that something attracts one person but not another; people attempt to account for beauty to themselves and others and attempt, as it were, to demonstrate why something is attractive. People proceed from the notion that what is genuinely beautiful should be attractive to everyone, given sufficient enlightenment and education.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921)</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-2383628944" data-kw="">
<blockquote><p>We do observe beautiful things through our senses, but the property by which they are beautiful is not perceivable through the senses. Animals have perceptions and representations of beautiful things, but they do not know the beautiful. They know only the useful and the pleasant. For that reason, the perception and recognition of the beautiful, also in sensory things, belongs to the higher faculty of knowing, to reason… Beauty is something that the beholding of which delights a person. Something is good insofar as it, when it is recognized by us, is desirable to our will. But beauty is what stimulates not our desire in a narrow sense, but our pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921)</cite>, p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-7520e35a4a" data-kw="">
<blockquote><p>What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921)</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-b1565ce346" data-kw="">
<blockquote><p>But touching an erring conscience, the question is not whether an erroneous conscience does so tie that we must do nothing on the contrary, nor is the question whether the nearest, actually obliging rule, be conscience; the Arminians tell us [that] though the Word of God, of itself, and by itself, have power to oblige, yet it actually obliges no man except it be understood, and so is believed to be understood, after we use all possible diligence and prudence, for no man is obliged to follow the true sense of the Word against his conscience, though it be erroneous; But we think the Word of God is both the farest and nearest, and the only obliging rule, and that the ditement [judgment] of the conscience does neither bind potentially nor actually, but is a mere [in Greek], a messenger and an official relater of the will and mind to God to us, and all the obliging power is from the Word; [???] the messenger of a king and judge is not the obliging [???] that ties the subject, or the herald’s promulgation of the Law, is no obliging rule; for [the] promulgation of heralds is common both to just and to unjust laws, and certainly unjust laws from a just prince lay no band on the conscience or on the man, far less can the promulgation, as the promulgation, lay any bands on the conscience; the word of a messenger and herald is at the best but a condition, or the approximation of the obliging power to us, but all the obliging power is from the king and the judge. It is most false then, that these Libertines say that the Word does not actually oblige except it be understood, for the understanding, information and indictment of conscience does not add any actual obligation to the Word that it had not before, it only is a reporter, to carry both the Word and the actual obligation to the man; the herald promulgating the law adds no obligation, actual or potential, to the law that it had not before, only it makes an union in distance, and near application and conjunction between the actually obliging law and the understanding knowledge of the person or subject, who is obliged to keep the law; though it be true the fire cannot actually burn but as timber is cast to it, yet the fire has from its own nature both potential and actual burning, not from the act of casting the timber in the fire; Nor is this a concludent reason, ‘no man is obliged [to] follow how the true sense of the Word against his conscience, though erroneous, ergo [therefore] the erroneous conscience does oblige, or ergo, actual obligation to obedience is not from the Word, but from the conscience;’ no more than this is a good consequence: no man is obliged to obey the Law in itself, just contrary to the promulgation of an erring and mistaking herald, ergo, the mistaking herald’s promulgation gives to the Law actual obligation over the subject; for it only follows [that] we are not to do contrary to the actual indictment of an erroneous conscience, but not obliged to follow the erroneous conscience; Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.</p></blockquote>

<blockquote><p>We all know the intention of the end goes in the intention before the action, but not as an essential cause to make an evil action good, or [to] make an indifferent action necessary and honest: A good intention does make a good action good and better, but that a good intention (as idolators are full of good intentions) can never so season the means, as… that it can make evil to be good. Vasquez condemns the Fathers of ignorance, because they said, Propositum bonum excusat malum opus [A proposed good excuses a bad work]: so Cassianus said [that] it was lawful to lie for a good end, and Chrysostom and Ambrose said the same, as Vasquez says: see Aquinas for this.</p></blockquote>

<blockquote><p>2. The first [way in which a man may be guilty of scandal] is, when a man does something before another man, which is in itself evil, unlawful and sinful, in which case, neither the intention of him that does it, nor the event, as to him that sees it done, is of any consideration; For it matters not whether the doer had an intention to draw the other into sin thereby, or not: neither does it matter whether the other were thereby induced to commit sin or not: the matter or substance of the action being evil, and done before others, is sufficient to render the doer guilty of having given scandal, though he had neither any intention himself so to do, nor were any person actually scandalized thereby; because whatsoever is in itself, and in its own nature evil, is also of itself and in its own nature scandalous and of evil example. Thus did Hophni and Phineas, the sons of Eli, give scandal by their wretched profaneness and greediness about the sacrifices of the Lord, and their vile and shameless abusing the women, 1 Sam. 2:17,22. And so did David also give great scandal in the matter of Uriah, 2 Sam. 12:14. Here the rule is, Do nothing that is evil, for fear of giving scandal.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. The first [way in which a man may be guilty of scandal] is, when a man does something before another man, which is in itself evil, unlawful and sinful, in which case, neither the intention of him that does it, nor the event, as to him that sees it done, is of any consideration; For it matters not whether the doer had an intention to draw the other into sin thereby, or not: neither does it matter whether the other were thereby induced to commit sin or not: the matter or substance of the action being evil, and done before others, is sufficient to render the doer guilty of having given scandal, though he had neither any intention himself so to do, nor were any person actually scandalized thereby; because whatsoever is in itself, and in its own nature evil, is also of itself and in its own nature scandalous and of evil example. Thus did Hophni and Phineas, the sons of Eli, give scandal by their wretched profaneness and greediness about the sacrifices of the Lord, and their vile and shameless abusing the women, 1 Sam. 2:17,22. And so did David also give great scandal in the matter of Uriah, 2 Sam. 12:14. Here the rule is, Do nothing that is evil, for fear of giving scandal.”

— Robert Sanderson, pp. 76-77 of Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined (London, 1678)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+first+%5Bway+in+which+a+man+may+be+guilty+of+scandal%5D+is%2C+when+a+man+does+something+before+another+man%2C+which+is+in+itself+evil%2C+unlawful+and+sinful%2C+in+which+case%2C+neither+the+intention+of+him+that+does+it%2C+nor+the+event%2C+as+to+him+that+sees+it+done%2C+is+of+any+consideration%3B+For+it+matters+not+whether+the+doer+had+an+intention+to+draw+the+other+into+sin+thereby%2C+or+not%3A+neither+does+it+matter+whether+the+other+were+thereby+induced+to+commit+sin+or+not%3A+the+matter+or+substance+of+the+action+being+evil%2C+and+done+before+others%2C+is+sufficient+to+render+the+doer+guilty+of+having+given+scandal%2C+though+he+had+neither+any+intention+himself+so+to+do%2C+nor+were+any+person+actually+scandalized+thereby%3B+because+whatsoever+is+in+itself%2C+and+in+its+own+nature+evil%2C+is+also+of+itself+and+in+its+own+nature+scandalous+and+of+evil+example.+Thus+did+Hophni+and+Phineas%2C+the+sons+of+Eli%2C+give+scandal+by+their+wretched+profaneness+and+greediness+about+the+sacrifices+of+the+Lord%2C+and+their+vile+and+shameless+abusing+the+women%2C+1+Sam.+2%3A17%2C22.+And+so+did+David+also+give+great+scandal+in+the+matter+of+Uriah%2C+2+Sam.+12%3A14.+Here+the+rule+is%2C+Do+nothing+that+is+evil%2C+for+fear+of+giving+scandal.%E2%80%9D%0A%0A%E2%80%94+Robert+Sanderson%2C+pp.+76-77+of+Case+4%2C+%E2%80%98of+Scandal%E2%80%99+in+Nine+Cases+of+Conscience+Occasionally+Determined+%28London%2C+1678%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefa69713e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efa69713e4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-conscience/#:~:text=2.%20The%20first%20%5Bway%20in%20which,evil%2C%20for%20fear%20of%20giving%20scandal." rel="noopener" targe <blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>

</figure><figure class="quote" id="q-11ff15aa1d" data-kw="">
<blockquote><p>Question 2. What are those things which make an action to become not voluntary. 4th Answer. Nothing at all but either absolute violence of constraint, or chance which could not be foreseen or prevented. And for such things as are done through absolute violence or mere chance, they have neither the nature of obedience or sin. As if one should be forced to offer incense or bow the knee before an idol, or should merely by chance kill another, Deut. 19:5-10. Question 3. What are we to think of those actions which are done through ignorance? 5th Answer. First, that ignorance which is in some sort a cause of the action (so that if a man knew what he did, he would not do it), if it be involuntary, both in itself and in its cause, that is, not affected nor procured, nor tolerated, does make the action merely casual and involuntary, and so excuses from sin. 6. Secondly, ignorance of the Law does never wholly excuse, because all men are bound to know the Will of God: but yet it does somewhat lessen the fault if it be not affected, 1 Tim. 1:13; John 4:41; Acts 3:17. But if it be affected, it is of itself a sin and so does not diminish, but rather increase the guilt of other sins, 2 Pet. 3:5. 7. Thirdly, an ignorance of the fact, if a man has used such diligence as he ought, does excuse him, because by such an ignorance the fact is made casual. So Jacob being deceived lay with Leah, whom he took to be Rachel, Gen. 29. But if due diligence have not been used, ignorance of the fact does not altogether excuse, although it do somewhat lessen the fault. And this seems to have been the case of Abimelech, Gen. 20:5. Question 4. What are we to judge of those actions which are done through fear? 8th Answer. First, fear does not simply make an action involuntary: but does, considering the circumstances of time and place, etc., impel a man to will this or that. As appears in that known instance of the merchant, who is induced through fear of death to throw away his merchandise into the sea. Fear therefore does never wholly excuse from sin: yea more, fear itself is oft a sin forbidden, and a cause too of most grievous sins, Mt. 10:26; Phil. 1:28; 1 Pet. 3:14; Apoc. 21:8. Although therefore, a great fear or terror, such as is wont sometimes to trouble even a man of good courage before men, be accounted for a good excuse, and is of force to make contracts done through fear void, yet before God such an excuse will not be taken. 9. Secondly, yet that sin which is committed through some strong terror, is not so grievous (if other things be alike) as that which is committed of the voluntary inclination of the will without any such fear of danger, because in fear the temptation is stronger: and such a fall, if repentance follow, does proceed not so much from malice, as from infirmity and perturbation. And this was Peter’s case when he denied Christ.</p></blockquote>

— William Ames, Conscience with the Power &amp; Cases Thereof (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, p. 92-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion+2.+What+are+those+things+which+make+an+action+to+become+not+voluntary.+4th+Answer.+Nothing+at+all+but+either+absolute+violence+of+constraint%2C+or+chance+which+could+not+be+foreseen+or+prevented.+And+for+such+things+as+are+done+through+absolute+violence+or+mere+chance%2C+they+have+neither+the+nature+of+obedience+or+sin.+As+if+one+should+be+forced+to+offer+incense+or+bow+the+knee+before+an+idol%2C+or+should+merely+by+chance+kill+another%2C+Deut.+19%3A5-10.+Question+3.+What+are+we+to+think+of+those+actions+which+are+done+through+ignorance%3F+5th+Answer.+First%2C+that+ignorance+which+is+in+some+sort+a+cause+of+the+action+%28so+that+if+a+man+knew+what+he+did%2C+he+would+not+do+it%29%2C+if+it+be+involuntary%2C+both+in+itself+and+in+its+cause%2C+that+is%2C+not+affected+nor+procured%2C+nor+tolerated%2C+does+make+the+action+merely+casual+and+involuntary%2C+and+so+excuses+from+sin.+6.+Secondly%2C+ignorance+of+the+Law+does+never+wholly+excuse%2C+because+all+men+are+bound+to+know+the+Will+of+God%3A+but+yet+it+does+somewhat+lessen+the+fault+if+it+be+not+affected%2C+1+Tim.+1%3A13%3B+John+4%3A41%3B+Acts+3%3A17.+But+if+it+be+affected%2C+it+is+of+itself+a+sin+and+so+does+not+diminish%2C+but+rather+increase+the+guilt+of+other+sins%2C+2+Pet.+3%3A5.+7.+Thirdly%2C+an+ignorance+of+the+fact%2C+if+a+man+has+used+such+diligence+as+he+ought%2C+does+excuse+him%2C+because+by+such+an+ignorance+the+fact+is+made+casual.+So+Jacob+being+deceived+lay+with+Leah%2C+whom+he+took+to+be+Rachel%2C+Gen.+29.+But+if+due+diligence+have+not+been+used%2C+ignorance+of+the+fact+does+not+altogether+excuse%2C+although+it+do+somewhat+lessen+the+fault.+And+this+seems+to+have+been+the+case+of+Abimelech%2C+Gen.+20%3A5.+Question+4.+What+are+we+to+judge+of+those+actions+which+are+done+through+fear%3F+8th+Answer.+First%2C+fear+does+not+simply+make+an+action+involuntary%3A+but+does%2C+considering+the+circumstances+of+time+and+place%2C+etc.%2C+impel+a+man+to+will+this+or+that.+As+appears+in+that+known+instance+of+the+merchant%2C+who+is+induced+through+fear+of+death+to+throw+away+his+merchandise+into+the+sea.+Fear+therefore+does+never+wholly+excuse+from+sin%3A+yea+more%2C+fear+itself+is+oft+a+sin+forbidden%2C+and+a+cause+too+of+most+grievous+sins%2C+Mt.+10%3A26%3B+Phil.+1%3A28%3B+1+Pet.+3%3A14%3B+Apoc.+21%3A8.+Although+therefore%2C+a+great+fear+or+terror%2C+such+as+is+wont+sometimes+to+trouble+even+a+man+of+good+courage+before+men%2C+be+accounted+for+a+good+excuse%2C+and+is+of+force+to+make+contracts+done+through+fear+void%2C+yet+before+God+such+an+excuse+will+not+be+taken.+9.+Secondly%2C+yet+that+sin+which+is+committed+through+some+strong+terror%2C+is+not+so+grievous+%28if+other+things+be+alike%29+as+that+which+is+committed+of+the+voluntary+inclination+of+the+will+without+any+such+fear+of+danger%2C+because+in+fear+the+temptation+is+stronger%3A+and+such+a+fall%2C+if+repentance+follow%2C+does+proceed+not+so+much+from+malice%2C+as+from+infirmity+and+perturbation.+And+this+was+Peter%E2%80%99s+case+when+he+denied+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Conscience+with+the+Power+%26+Cases+Thereof+%281639%29%2C+bk.+3%2C+ch.+19%2C+%E2%80%98Of+a+Voluntary+Act%E2%80%99%2C+p.+92-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F11ff15aa1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/11ff15aa1d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-conscience/#:~:text=Question%202.%20What%20are%20those%20things,Peter%E2%80%99s%20case%20when%20he%20denied%20Christ." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>

<blockquote><p>There are then a great number of truths, both of faith and of morality, which seem contradictory, and which all hold good together in a wonderful system. The source of all heresies is the exclusion of some of these truths, and the source of all the objections which the heretics make against us is the ignorance of some of our truths. And it generally happens that, unable to conceive the connection of two opposite truths, and believing that the admission of one involves the exclusion of the other, they adhere to the one, exclude the other, and think of us as opposed to them. Now exclusion is the cause of their heresy; and ignorance that we hold the other truth causes their objections.</p></blockquote>

<blockquote><p>There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute is not to contend. We strive as we are carnal, we dispute as we are men, we war from our lusts, we dispute from diversity of starlight and daylight. Weakness is not wickedness, a roving of wit must not be deemed a rebellion of will, a broken engine may part with a dead child and yet be a mother of many healthy children. And while our reverend and dear Brethren, fleeing the coast of Egypt and Babylon’s wicked borders, aim to shore upon truth, wind may deceive good sailors; natural land-motions (as when heavy bodies move downward toward their own (clay country) are upon a straight line. But sea-motions of sailing are not by right lines, but rather by sea-circles. We often argue and dispute as we sail. Where grace and weight of Scripture make motion, we walk in a right line toward God. But where opinion, a messenger only sent to spy the Land of lies and truth, usurps to conduct us, what marvel then we go about truth rather than lodge with truth. And Christ his Kingdom, scepter, glory, Babylon’s fall, be the material object of opinions, on both sides; and yet the Word of God has a right lith [joint], that cannot suffer division. In God’s matters there be not as in grammar the positive and comparative degrees: there are not here truth, and more true, and most true. Truth is in an indivisible line, which has no latitude and cannot admit of splitting. And therefore we may make use of the Philosopher’s word, amicus Socrates, amicus Plato, sed magis amica veritas [Socrates a friend, Plato a friend, but most of all, truth is a friend]. Though Peter and Paul be our beloved friends, yet the truth is a dearer friend: The sons of Babylon make outcries of divisions and diversity of religions amongst us, but every opinion is not a new religion. … But I leave off, and beg from the Reader candor and ingenuous and fair dealing; from Formalists, men in the way to Babylon, I may wish this, I cannot hope it. Farewell.</p></blockquote>

<blockquote><p>Truth is the daughter of time, was the saying of old, and our daily experience gives in evidence and proof hereof, to every man’s ordinary observation. Only as in other births, so here, the barrenness and fruitfulness of several ages, depend merely upon God’s good pleasure; who opens and shuts the womb of truth from bearing, as He sees fit, according to the counsel of his own will. Not that there is any change in the truth, but the alteration grows, according to men’s apprehensions, to whom it is more or less discovered, according to God’s most just judgment and their own deservings. Sometimes God makes an eclipse of the truth at midday, that so He might express his wrath from Heaven against the unthankfulness, prophaness and atheism of a malignant world. … Sometimes when men entertain the truth in profession, but not in the love of it and that endeared affection that is due thereunto, the Lord gives men up to the activity of error, as the apostle speaks, because they did not love that the trutb should be truth, they embraced falsehood instead of truth, that so they might be deluded and damned… He that will estrange his affection [to others] because of the difference of apprehension in things difficult, he must be a stranger to himself one time or other. If men would be tender and careful to keep off offensive expressions, they might keep some distance in opinion, in some things, without hazard to truth or love. But when men set up their sheaves (though it be but in a dream, as Joseph’s was) and fall out with every one that will not fall down and adore them, they will bring much trouble into the world, but little advantage to the truth or peace. Again, the Reader must know for his direction in this inquiry, my aim only was, and is, to lay down, and that briefly, the grounds of our practice, according to that measure of light I have received, and to give answer to such reasons which might seem to weaken the evidence thereof: declining purposely, for the present, the examination of such answers which are made to the arguments alledged by some of our reverend Brethren touching the same subject: because I would neither prejudice nor prevent their proper defense, which I do suppose in the fittest season they will so present unto the world as shall be fully satisfactory to such as love and desire the knowledge of the truth. The sum is, we doubt not what we practise, but it’s beyond all doubt that all men are liars and we are in the number of those poor feeble men; either we do, or may err, though we do not know it; what we have learned we do profess and yet profess still to live that we may learn. And therefore the errand upon which this present discourse is sent, is summarily to show these two things unto the world: 1. That there must be more said (than yet it has been my happiness to see) before the principles we profess will be shaken, and consequently it cannot be expected, that we should be unsetled in our practice. 2. That I might occasion men eminently gifted to make further search, and to dig deeper, that if there be any vein of reason which lies yet lower, it might be brought to light, and we profess and promise, not only a ready ear to hear it, but a heart willing to welcome it. It’s the perfection of a man, amidst these many weaknesses we are surrounded withal, by many changes to come to perfection. It’s the honour and conquest of a man truly wise to be conquered by the truth: and he has attained the greatest liberty that suffers himself to be led captive thereby. … In the handling of all these particulars, so full of difficulty and obscurity, I am not such a stranger at home, but that I am easily sensible of the weight of the matter and mine own weakness: and therefore I can professe in a word of truth that against mine own inclination and affection I was haled by importunity to this so hard a task, to kindle my rush candle, to join with the light of others, at least to occasion them to set up their lamps. Now He that is the way, the truth, and the life, pave out all the ways of his people and make their paths plain before them: Lead us all into that truth which will lead us unto eternall life: bring us once unto that impotency and impossibility that we can do nothing against the truth, but for it, that so our congregations may not only be styled as Ezekiel’s temple, but be really what was prophesied the Churches should be in these last days, Jehovah Shammah [the Lord is There]. In the arms of his everlasting mercy I leave thee…</p></blockquote>

</figure><figure class="quote" id="q-4e8ed2d62a" data-kw="">
<blockquote><p>Things that are false will accomplish a great many useful things in the world. If I take a counterfeit coin and buy a dinner with it, the dinner is every bit as good as if the coin were a product of the mint. And what a very useful thing a dinner is! But just as I am on my way downtown to buy a dinner for a poor man, an expert tells me that my coin is a counterfeit. The miserable, heartless theorizer! While he is going into uninteresting, learned details about the primitive history of that coin, a poor man is dying for want of bread. So it is with faith. Faith is so very useful, they tell us, that we must not scrutinize its basis in truth. But, the great trouble is, such an avoidance of scrutiny itself involves the destruction of faith. For faith is essentially dogmatic. Despite all you can do, you cannot remove the element of intellectual assent from it. Faith is the opinion that some person will do something for you. If that person really will do that thing for you, then the faith is true. If he will not do it, then the faith is false. In the latter case, not all the benefits in the world will make the faith true. Though it has transformed the world from darkness to light, though it has produced thousands of glorious healthy lives, it remains a pathological phenomenon. It is false, and sooner or later it is sure to be found out.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Things that are false will accomplish a great many useful things in the world. If I take a counterfeit coin and buy a dinner with it, the dinner is every bit as good as if the coin were a product of the mint. And what a very useful thing a dinner is! But just as I am on my way downtown to buy a dinner for a poor man, an expert tells me that my coin is a counterfeit. The miserable, heartless theorizer! While he is going into uninteresting, learned details about the primitive history of that coin, a poor man is dying for want of bread. So it is with faith. Faith is so very useful, they tell us, that we must not scrutinize its basis in truth. But, the great trouble is, such an avoidance of scrutiny itself involves the destruction of faith. For faith is essentially dogmatic. Despite all you can do, you cannot remove the element of intellectual assent from it. Faith is the opinion that some person will do something for you. If that person really will do that thing for you, then the faith is true. If he will not do it, then the faith is false. In the latter case, not all the benefits in the world will make the faith true. Though it has transformed the world from darkness to light, though it has produced thousands of glorious healthy lives, it remains a pathological phenomenon. It is false, and sooner or later it is sure to be found out.”

</figure><figure class="quote" id="q-96cc71b43c" data-kw="">
<blockquote><p>Almost all our contentions and divisions are caused by the ignorance and injudiciousness of Christians, especially the most self-conceited. They are for the most as children, that yet need to be taught the very principles of the divine oracles, and to be fed with milk when they think themselves fit to be teachers of others, Heb. 5:11-12, and therefore [are] as children they are tossed to and fro and caried about with every wind of doctrine, Eph. 4:14. And when they have many years together been crying up an opinion and vilifying dissenters, at last they turn to some other opinion and confess that they did all this upon mistake. And was it not a pitiful life that they lived that while? and a pitiful zeal which did set them on? and a pitiful kind of worship which they thus offered to God? Alas to hear a man pray and preach up Antinomianism one year, and Arminianism the next, and Socinianism the next! To hear a man make Separation and Anabaptistry a great part of his business to men in preaching and to God in prayer for seven and seven years together; and at last confess that all this was his error and his sin (or if he confess it not, it is so much the worse). Is it not sad that ignorance and hasty rashness should so much injure the Church and men’s souls that so many well-meaning people should put evil for good and good for evil, darkness for light and light for darkness, Isa. 5:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’</cite>, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

+40%2C+%E2%80%98Labour+for+a+sound+judgment+to+know+good+from+evil%2C+lest+you+trouble+yourselves+and+others+by+mistakes%3A+And+till+you+grow+so+judicious%2C+forsake+not+the+guidance+of+a+judicious+teacher%2C+nor+the+company+of+the+agreeing+generality+of+the+Godly%E2%80%99%2C+pp.+212-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96cc71b43c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96cc71b43c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=Almost%20all%20our%20contentions%20and%20divisions,and%20light%20for%20darkness%2C%20Isa.%205%3A20." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c7f3133b49" data-kw="">
<blockquote><p>In several sorts of controversies and cases you must prefer several sorts of guides or judges: It is a grand pernicious error to think that the same men’s judgments must be most followed in every case. And it is of grand importance to know how to value and vary our guides, as the cases vary. And for the most part every man is more to be regarded in his own way of study and profession than wiser men in other matters of other studies and professions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 42, ‘Your belief of the necessary articles of faith, must be made your own, and not taken merely upon the authority of any: And in all points of belief or practice which are of necessity to salvation, you must ever keep company with the universal Church: for it were not the Church if it erred in these: And in matters of peace and concord the greater part must be your guide; In matters of human obedience, your governors must be your guides: And in matters of high and difficult speculation, the judgment of one man of extraordinary understanding and clearness is to be preferred before both the rulers and the major vote’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 216-18</cite>, p. 216</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-2e809cbdf1" data-kw="">
<blockquote><p>But because there is no hope that most should be judicious, there is no other remedy for such but this of Christ’s prescript which I have here set down: First, happy is he that chooses a judicious faithful guide and learns of him till his own understanding be better illuminated; and that escapes the conduct of ignorant, erroneous, self-seeking, proud, dividing teachers. Secondly, continue in the communion of the generality of agreeing Christians: The generality of the godly are more unlikely to be forsaken of Christ than a few odd self-conceited singular professors. This is the way of peace to yourselves and to the Church of Christ.</p></blockquote>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks: 1. It is more for controversies and speculations than for practical holiness. 2. It is selfish and kindled by an overvaluing their own conceits or ways. 3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church. 4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like. 5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

<blockquote><p>5. He that mistakingly thinks any thing is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him. 6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes. 7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. … 18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct]. 19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“5. He that mistakingly thinks any thing is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him. 6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes. 7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. … 18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct]. 19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.”

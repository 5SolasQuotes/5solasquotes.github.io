<blockquote><p>(1) All covenanted with God are to be baptized. But the children too are included in the covenant of grace, 1 Cor. 7:14 (the unbelieving husband is sanctified in the wife, and the unbelieving wife is sanctified in the brother: else were your children unclean; but now are they holy). The universal command to baptize all those covenanted with God includes the particular command regarding the baptism of children who are within the covenant. What belongs equally to all is not to be restricted to the adult pert of the seed;–and (2) even under the old covenant children were circumcised.</p></blockquote>

<blockquote><p>Unless they are to be esteemed as members of the Church, they ought not to be baptized. For Baptism is, in its own nature, the seal of an ingrafting already made into Christ, and, consequently, into His Church.</p></blockquote>

</figure><figure class="quote" id="q-a35366c560" data-kw="">
<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures</cite>, … (London, 1659), The 26-27th Lord’s Days, p. 180</span></figcaption>

<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant.</p></blockquote>

</figure><figure class="quote" id="q-9372f182a4" data-kw="">
<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error: a Commentary on the Westminster Confession of Faith</cite>, (Edinburgh, 1684), ch. 28, ‘Of Baptism’, Question 3, pp. 179-180</span></figcaption>

</figure><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’</cite>, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth, p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-3087bd07b3" data-kw="">
<blockquote><p>The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos</cite>, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.”

— Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformation+was+united+in+seeking+the+essence+of+the+church+in+the+invisible%2C+in+union+with+Christ%2C+and+not+in+an+external%2C+visible+bond%2C+as+Rome+does%E2%80%A6+In+order+to+check+this+danger+%5Bof+losing+the+historical+progress+of+the+Church+through+individualism%5D+Luther+moved+a+long+way+back+to+Rome.+In+a+certain+sense+he+again+imprisoned+the+supernatural%2C+invisible+grace+which+maintained+the+church+within+something+external%E2%80%A6+Where+the+church+is+found+with+the+ministry+of+the+Word+and+sacraments%2C+it+is+self-sustaining.+God%2C+as+it+were%2C+has+let+go+of+the+grace+which+sustains+the+church+and+placed+it+in+the+means+of+grace.+The+Reformed+believer+cannot+be+satisfied+with+this+presentation.+Certainly+he+believes+in+the+continuity+of+the+church%2C+but+he+believes+in+it+and+therefore+does+not+need+to+support+it+by+instruments+of+salvation%2C+into+which+grace+is+poured.+For+him+that+continuity+is+assured+by+the+faithful+promise+of+God.+Hence%2C+in+back+of+Word+and+sacrament+he+places+the+covenant+as+the+strongest+expression+of+how+the+unbroken+work+of+grace+from+generation+to+generation+rests%2C+as+all+grace%2C+on+the+sovereign+pleasure+of+God.+The+church+does+not+abide+because+we+baptize+or+work+regeneration+by+baptism%3B+rather+because+God+establishes+his+covenant+from+generation+to+generation%2C+therefore+the+church+remains+and+we+baptize.+Since+it+is+God%E2%80%99s+covenant+an+not+man%E2%80%99s%2C+it+is+appropriate+for+the+Christian+to+recognize+this+goodness+of+God+in+quiet+gratitude+and+in+faith+and+to+be+strengthened+by+its+sealing.+Here+again+the+concept+of+the+covenant+requires+that+faith+will+react+freely+and+actively+to+this+pronouncement+of+God%E2%80%A6+It+is+evident+how+strongly+the+idea+of+the+covenant+makes+itself+felt+here%2C+and+how+it+elevates+itself+above+all+idolatrous+worship+of+the+sacraments.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99+in+Redemptive+History+%26+Biblical+Interpretation%3A+the+Shorter+Writings+of+Geerhardus+Vos%2C+pp.+261-2+in+Redemptive+History+and+Biblical+Interpretation%3A+The+Shorter+Writings+of+Geerhardus+Vos+ed.+Gaffin+%28P%26R%2C+1980%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3087bd07b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3087bd07b3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-because-they-are-in-the-covenant/#:~:text=The%20Reformation%20was%20united%20in%20seeking,all%20idolatrous%20worship%20of%20the%20sacraments&amp;text=The%20Reformation%20was%20united%20in%20seeking%20the%20essence&amp;text=itself%20above%20all%20idolatrous%20worship%20of%20the%20sacraments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>By Baptism… we are received solemnly into the visible Church; and Baptism is a seal of our entry into Christ’s visible Body, as swearing to the colors enters a soldier a member to the army; and, we teach not that Baptism constitutes the Church-visible simply, as the Church: its a seal of a visible profession.</p></blockquote>

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker, Book 1, ch. 21, ‘Whether Baptism gives formality, or makes a Member of a visible Church?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), pp. 115-122 | Hooker, a congregationalist, had misunderstood Rutherford, thinking that Rutherford had said that baptism was the formal principle that made someone a member of the visible Church. However, what Rutherford actually said, and what he defends here, distinguishing, is only that:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+Baptism%E2%80%A6+we+are+received+solemnly+into+the+visible+Church%3B+and+Baptism+is+a+seal+of+our+entry+into+Christ%E2%80%99s+visible+Body%2C+as+swearing+to+the+colors+enters+a+soldier+a+member+to+the+army%3B+and%2C+we+teach+not+that+Baptism+constitutes+the+Church-visible+simply%2C+as+the+Church%3A+its+a+seal+of+a+visible+profession.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker%2C+Book+1%2C+ch.+21%2C+%E2%80%98Whether+Baptism+gives+formality%2C+or+makes+a+Member+of+a+visible+Church%3F%E2%80%99+in+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker+%281658%29%2C+pp.+115-122+%7C+Hooker%2C+a+congregationalist%2C+had+misunderstood+Rutherford%2C+thinking+that+Rutherford+had+said+that+baptism+was+the+formal+principle+that+made+someone+a+member+of+the+visible+Church.+However%2C+what+Rutherford+actually+said%2C+and+what+he+defends+here%2C+distinguishing%2C+is+only+that%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcf024ff49e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/cf024ff49e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-be </figure><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6, pp. 139-140</span></figcaption>

</figure><figure class="quote" id="q-1b1779d358" data-kw="">
<blockquote><p>The children of unwilling Jews and Turks cannot be baptized, but if the parents consent, they can be admitted to baptism… [Their children] can be baptized, upheld, and instructed in the Church, if the parents consent, because it does no harm to them. Indeed, such parents, by consenting in this way, give some sign of their piety, even if they do not profess it publicly. Then, therefore, the Church is established as a mother of such children, and therefore can baptize them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6, pp. 139-140; p. 310</span></figcaption>

</figure><figure class="quote" id="q-576f4001d4" data-kw="">
<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, section 50, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-a8d35535aa" data-kw="">
<blockquote><p>The Word of God, Gen. 17:23, acknowledges that one may have a right to the first seal of the covenant, and that coram Deo, that has no saving grace. Ishmael was thirteen years old, verse 25, when he was circumcised, and therefore of age to answer for himself; yet Ishmael had no saving grace, neither was he within the covenant of Isaac–the covenant of absolute and certain salvation, from which he was excluded, verse 19. Yet Ishmael has a right to the first seal of the covenant coram Deo, as is most most evident from the immediate command of God, that he that was born in Abraham’s house, must needs be circumcised, verse 12, and accordingly Abraham understood it. He proceeds upon the command of God to circumcise Ishmael first of all. Now what is it that giveth one right to any ordinance but the command, or at least more evidently than the command of God Himself? And that right which we have from God’s command, is doubtless a right coram Deo, and in his sight.</p></blockquote>

<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>

<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>

</figure><figure class="quote" id="q-001aea63ff" data-kw="">
<blockquote><p>Baptism is a seal of the whole covenant of grace; but it is by way of initiation. Hence it belongs to all that are within the covenant or have the first entrance thereinto. And is there no danger of corruption by overstraining the subject of baptism? Certainly, it is a corruption to take from the rule, as well as add to it. Moses found danger in not applying the initiating seal, to such for whom it was appointed. Is there no danger of putting those out of the visible Church, whom our Lord would have kept in?… If we do not keep in the way of a converting, grace-giving covenant, and keep persons under those church dispensations, wherein grace is given, the Church will die of a lingering, though not violent, death. The Lord has not set up churches only that a few old Christians may keep one another warm while they live, and then carry away the Church into the cold grave with them when they die; no, but that they might with all care, and with all the obligations and advantages to that care that may be, nurse up still successively another generation of subjects to our Lord, that may stand up in his kingdom when they are gone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Works of Christ in America</cite>, vol. 2, p. 309</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b427a2928c" data-kw="">
<blockquote><p>They of the south [of Scotland, such as William Cunningham and others] maintain, that both the sacraments, being seals of the same covenant, and imposing the self-same obligations, ought to be administered on the same footing, the same kind and measure of profession and of qualification being required, on the part of applicants for either; that no adult should be admitted to the one, without being admitted also to the other; and that the Christian profession required of a parent, in order to the baptism of his child, cannot be complete, without his being a communicant. The result of these views being carried into practice in the Lowlands, or rather the result of their mode of reducing them to practice, is, that with rare exceptions, all the members of a congregation, above a certain age, go to the table of the Lord, and that any parent, who is a communicant, receives, as a matter of course, baptism for his child. The Ross-shire fathers [in the highlands of Northern Scotland] held, that though in general, the two sacraments were equally seals of the covenant of grace, they do in some respects differ, even as sealing ordinances; that baptism, being the door of admission into the visible Church, a larger exercise of charity is required in dealing with applicants for that sacrament, than is called for in administering the other, which implies a confirmation of those who were members before; that the lessons of baptism are more elementary than those of the sacrament of the Supper; that the connection of the child, and of both the parents, with an ordinary case of infant baptism, calls for peculiar tenderness on the part of church rulers; and that the rule of Scripture requires baptism to be given, on an uncontradicted profession of faith, while an accredited profession is required to justify the church, in granting admission to the table of the Lord. The result of carrying these views into practice is well known; the number of members in full communion is comparatively small, and parents who have never communicated, receive baptism for their children.</p></blockquote>

ion+of+faith%2C+while+an+accredited+profession+is+required+to+justify+the+church%2C+in+granting+admission+to+the+table+of+the+Lord.+The+result+of+carrying+these+views+into+practice+is+well+known%3B+the+number+of+members+in+full+communion+is+comparatively+small%2C+and+parents+who+have+never+communicated%2C+receive+baptism+for+their+children.%E2%80%9D%0A%0A%E2%80%94+John+Kennedy+of+Dingwall%2C+The+Days+of+the+Fathers+in+Ross-shire%2C+ch.+4%2C+pp.+132-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb427a2928c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b427a2928c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/the-baptism-of-the-children-of-adherents/#:~:text=They%20of%20the%20south%20%5Bof%20Scotland,communicated%2C%20receive%20baptism%20for%20their%20children&amp;text=They%20of%20the%20south%20%5Bof%20Scotland%2C%20such%20as&amp;text=have%20never%20communicated%2C%20receive%20baptism%20for%20their%20children" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>

<blockquote><p>…the children… provided always, that first they have the form of knowledge of Christian religion: to wit, the knowledge of God’s law and commandments; the use and office of the same; the chief articles of our belief; the right form to pray unto God, the number, use, and effect of the sacraments; the true knowledge of Christ Jesus, of his office and natures, and such other [points] as without the knowledge whereof, neither deserves [any] man to be named Christian, neither ought any to be admitted to the participation of the Lord’s Table. And therefore, these principles ought and must be learned in the youth.</p></blockquote>

</figure><figure class="quote" id="q-dae5e88ec1" data-kw="">
<blockquote><p>All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ninth Head, Concerning the Policy of the Church</cite></span></figcaption>

</figure><figure class="quote" id="q-31b20949f7" data-kw="">
<blockquote><p>The Reformed churches observe the same order in admitting to the Lord’s table, either the children of Christians, or strangers from other parts: they admit them not but with prayers and after due examination of their knowledge, and personal profession of the known truth. The Church of Scotland at the first reformation ordained that children should be examined for the first time at the ninth year of their age; for the second, at the twelfth, for the third at the fourteenth, and since has practiced continual examination in the catechetical doctrine with prayers reiterate, for their growth in knowledge and sanctification; and without sufficient trial they were not admitted to the Lord’s Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … (1619), p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-655a1793c9" data-kw="">
<blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’, pp. 720-1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</span></figcaption>

</figure><figure class="quote" id="q-3f9f3b0b84" data-kw="">
<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, 6th Question, ‘Is the Supper to be Granted to Infants, or to Children?’ [No] in Ecclesiastical Politics, vol. 1, book 2, tract 2, section 4, ch. 3, pp. 757-58 trans. Charles Johnson</span></figcaption>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (Edinburgh, 1770), bk. 2, Title 4, ‘Of the Lord’s Supper’, section 2, p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London, 1645), pp. 25 &amp; 27</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>First, their ecclesiasticall errors, such as peculiarly concern the doctrine or discipline of the Church are: First, that Christ took not flesh from the Virgin Mary, but that he passed through her as the sun beams do through glass, or rain through a spout. Secondly, that there is no original sin. Thirdly, that children ought not to be baptized. Fourthly, that such as have been baptized in their infancy ought to be re-baptized when they come to years of discretion. Fifthly, that lay-people may preach and administer the sacraments… Sixthly, that men have free will, not only in natural and moral, but also in spiritual actions. Seventhly, that absolution and the church-peace ought to be denied to such who are fallen into any grievous sin; yea, though they repent of it. Eighthly, that Luther’s doctrine is worse than the Pope’s. Secondly, their politicall errors, or in matter of state, are: First, that the people may depose their magistrates and chief rulers… Secondly, that a Christian with a good conscience may not take upon him, or bear the office of a magistrate, or keep any court of justice. Thirdly, that none may administer an oath to another. Fourthly, that no malefactors ought to be put to death. Thirdly, their economical errors [about the family] are: First, that no man has a propriety in his goods, but that all things ought to be held in common. Secondly, that it is lawful to have more wives than one at once. Thirdly, that a man may put away his wife if she differ from him in point of religion, and be not of their sect. … All the errors of the Anabaptists are of two sorts: First, such as they hold in common with other heretics. Secondly, such as are peculiar to their sect. First, concerning the common errors [not mentioned above]… First, with the Millenaries and their joint issue is, that Christ before the day of judgement shall come down from Heaven, and reign with the saints upon earth a thousand years; in which time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…</p></blockquote>

<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>

C+Classic+Reformed+Theology+%28Reformation+Heritage+Books%2C+2019%29%2C+179.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c0ff4ccae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5c0ff4ccae.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/heidegger-we-are-under-the-abrahamic-promises-therefore-we-act-like-abrahamic-christians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The Baptists, especially those of the time of the Reformation, do not hold the common doctrine on this subject. The Anabaptists not only spoke in very disparaging terms of the old economy and of the state of the Jews under that dispensation, but it was necessary to their peculiar system, that they should deny that the covenant made with Abraham included the covenant of grace. Baptists hold that infants cannot be church members, and that the sign of such membership cannot properly be administered to any who have not knowledge and faith. But it cannot be denied that infants were included in the covenant made with Abraham, and that they received circumcision, its appointed seal and sign. It is therefore essential to their theory that the Abrahamic covenant should be regarded as a merely national covenant entirely distinct from the covenant of grace. The Romanists assuming that saving grace is communicated through the sacraments, and seeing that the mass of the ancient Israelites, on many occasions at least, were rejected of God, notwithstanding their participation of the sacraments then ordained, were driven to assume a radical difference between the sacraments of the Old Testament and those of the New. The former only signified grace, the latter actually conveyed it. From this it follows that those living before the institution of the Christian sacraments were not actually saved. Their sins were not remitted, but pretermitted, passed over. At death they were not admitted into heaven, but passed into a place and state called the limbus patrum, where they remained in a negative condition until the coming of Christ, who after his death descended to hell, sheol, for their deliverance. In opposition to these different views the common doctrine of the Church has ever been, that the plan of salvation has been the same from the beginning. There is the same promise of deliverance from the evils of the apostasy, the same Redeemer, the same condition required for participation in the blessings of redemption, and the same complete salvation for all who embrace the offers of divine mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.367.</span></figcaption>

<blockquote><p>But, to insist still more stoutly upon this point, they add that baptism is a sacrament of repentance and of faith. Accordingly, since neither of these can come about in tender infancy, we must guard against admitting infants into the fellowship of baptism, lest its meaning be made empty and fleeting. But these darts are aimed more at God than at us. For it is very clear from many testimonies of Scripture that circumcision was also a sign of repentance [Jer. 4:4; 9:25; cf. Deut. 10:16; 30:6]. Then Paul calls it the seal of the righteousness of faith [Rom. 4:11]. Therefore, let a reason be required of God himself why he commanded it to be impressed on the bodies of infants. For since baptism and circumcision are in the same case, our opponents cannot give anything to one without conceding it to the other. If they have recourse to their usual way out, that the age of infancy then symbolized spiritual infants, their path is already blocked. We therefore say that, since God communicated circumcision to infants as a sacrament of repentance and of faith, it does not seem absurd if they are now made participants in baptism—unless men choose to rage openly at God’s institution. But as in all God’s acts, so in this very act also there shines enough wisdom and righteousness to repel the detractions of the impious. For although infants, at the very moment they were circumcised, did not comprehend with their understanding what that sign meant, they were truly circumcised to the mortification of their corrupt and defiled nature, a mortification that they would afterward practice in mature years. To sum up, this objection can be solved without difficulty: infants are baptized into future repentance and faith, and even though these have not yet been formed in them, the seed of both lies hidden within them by the secret working of the Spirit. With this answer everything gleaned from the meaning of baptism that they twist against us is once for all overthrown. Such is the label with which Paul marks it when he calls it the washing of regeneration and of renewal [Titus 3:5]. From this they reason that it is to be conferred only on persons capable of experiencing these things. But we are free to counter this by saying: neither was circumcision, which designated regeneration, to be conferred upon any but the regenerate. And thus a thing instituted by God will be condemned by us. Accordingly (as we have already suggested at various times), all the arguments that tend to shake circumcision are without force in assailing baptism. And they do not escape by saying that what rests upon God’s sure authority is established and fixed, even though there is no reason for it, but that such reverence is not due either infant baptism or other like things that are not commended to us by God’s express word; when once they are caught and held in this dilemma, they are held forever. God’s command concerning circumcision of infants was either lawful and not to be trifled with, or it was deserving of censure. If there was in it nothing incongruous or absurd, neither can anything absurd be found in the observance of infant baptism.</p></blockquote>

alink</a><a class="src" href="https://heidelblog.net/2024/09/calvin-versus-the-baptists/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-aa9fa3eea1" data-kw="">
<blockquote><p>And we must note these three degrees, that the promise was first made to the Jews, and then to their children, and last of all, that it is also to be imparted to the Gentiles. We know the reason why the Jews are preferred before other people; for they are, as it were, the first begotten in God’s family, yea, they were then separated from other people by a singular privilege. Therefore Peter observeth a good order, when he giveth the Jews the pre-eminence. Whereas he adjoineth their children unto them, it dependeth upon the words of the promise: I will be thy God, and the God of thy seed after thee, (Gen. 17:7,) where God doth reckon the children with the fathers in the grace of adoption. This place, therefore, doth abundantly refute the manifest error of the Anabaptists, which will not have infants, which are the children of the faithful, to be baptized, as if they were not members of the Church. They espy a starting hole in the allegorical sense, and they expound it thus, that by children are meant those which are spiritually begotten. But this gross impudency doth nothing help them. It is plain and evident that Peter spake thus because God did adopt one nation peculiarly. And circumcision did declare that the right of adoption was common even unto infants. Therefore, even as God made his covenant with Isaac, being as yet unborn, because he was the seed of Abraham, so Peter teacheth, that all the children of the Jews are contained in the same covenant, because this promise is always in force, I will be the God of your seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, trans. Henry Beveridge (repr. Bellingham, WA: Logos Bible Software, 2010), 1,122–23.</span></figcaption>

tps%3A%2F%2F5solasquotes.github.io%2Fquote%2Faa9fa3eea1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/aa9fa3eea1.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/03/calvin-on-acts-239-against-the-ana-baptists/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-674765a0e8" data-kw="">
<blockquote><p>But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield: Studies in Theology</cite>, vol. 9 (Bellingham, WA: Logos Bible Software, 2008), 408.</span></figcaption>

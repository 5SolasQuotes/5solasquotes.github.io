<blockquote><p>2. That the only moving and efficient cause of election and predestination unto life is the mere good pleasure and grace of God, not the consideration of any foreseen faith, perseverance, good works, good will, good endeavors, or any other quality or condition whatsoever in the persons elected.

<blockquote><p>In establishing the Covenant of Redemption, unlike in predestination, the elect are viewed as fallen sinners, from whom God’s justice requires perfect satisfaction. Since they cannot render this, it is required, in the Covenant of Redemption, of their representative Head, Christ Jesus.</p></blockquote>

</figure><figure class="quote" id="q-e733164a3e" data-kw="">
<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-woolsey.html">Andrew Woolsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unity &amp; Continuity in Covenantal Thought, pp. 531, 534</cite></span></figcaption>

</figure><figure class="quote" id="q-b5bcd79914" data-kw="">
<blockquote><p>…everyone who believes in the traditional doctrine of creation ex nihilo also makes a non-entity the object of the divine decree. The universe, just like the elect in Rutherford’s ordo decretorum [order of the decrees], is creandum et nondum creatum [to be created but is not created] when God first makes his decree.</p></blockquote>

</figure><figure class="quote" id="q-ed0cd0edfa" data-kw="">
<blockquote><p>Finally, the end [of God’s creating the world] is twofold: The first and highest is the glory of God, Prov. 16:4, Rom. 11:36, 1 Cor. 8:6, Col. 1:16; which consists in the manifestation of His goodness, wisdom, and power (both by God and by the intelligent creature of God). … Then the second, subordinate to the first and tending toward it, is twofold: The first is the utility of the creature, Ps. 104… The last is the eternal salvation of all the elect in heaven, Mt. 25:34 and 22:30, Rom. 9:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-26b513cea7" data-kw="">
<blockquote><p>Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Complete Tract on the Doctrine &amp; True Use of Predestination, out of the Lectures of Theodore Beza on Chapter 9 of the Epistle to the Romans</cite>, … adjoined are some places taken out of the book of Dr. Luther on the Bound Will Against Erasmus, from which appears that his judgment on Predestination was in everyway consonant with ours 2nd ed. ed. Raphael Eglin (Eustathius Vignon, 1583) 182, pp. no ToC Table</span></figcaption>

cea7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=alludes%20to%20the%20creation%20of%20Adam,purpose%2C%20after%20his%20workmanship%20is%20corrupted&amp;text=alludes%20to%20the%20creation%20of%20Adam%2C%20and%20rises&amp;text=a%20new%20purpose%2C%20after%20his%20workmanship%20is%20corrupted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It gives precedence to the person and work of Christ over election and the covenant, so that Christ is isolated from these contexts and cannot vicariously atone for his people, since there is no fellowship between him and us.</p></blockquote>

</figure><figure class="quote" id="q-41dcce4d62" data-kw="">
<blockquote><p>First, if we seek God’s fatherly mercy and kindly heart, we should turn our eyes to Christ, on whom alone God’s Spirit rests [cf. Matt. 3:17]. If we seek salvation, life, and the immortality of the Heavenly Kingdom, then there is no other to whom we may flee, seeing that he alone is the fountain of life, the anchor of salvation, and the heir of the Kingdom of Heaven. Now what is the purpose of election but that we, adopted as sons by our Heavenly Father, may obtain salvation and immortality by his favor? No matter how much you toss it about and mull it over, you will discover that its final bounds still extend no farther. Accordingly, those whom God has adopted as his sons are said to have been chosen not in themselves but in his Christ [Eph. 1:4]; for unless he could love them in him, he could not honor them with the inheritance of his Kingdom if they had not previously become partakers of him. But if we have been chosen in him, we shall not find assurance of our election in ourselves; and not even in God the Father, if we conceive him as severed from his Son. Christ, then, is the mirror wherein we must, and without self-deception may, contemplate our own election. For since it is into his body the Father has destined those to be engrafted whom he has willed from eternity to be his own, that he may hold as sons all whom he acknowledges to be among his members, we have a sufficiently clear and firm testimony that we have been inscribed in the book of life [cf. Rev. 21:27] if we are in communion with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Westminster Press, 1961), 3.24.5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election.html">Election</a></span></div>

</figure><figure class="quote" id="q-e3b58928de" data-kw="">
<blockquote><p>If Mr. Baxter go on with his intentions about a tract concerning universal redemption, perhaps we may have these things cleared; and yet, we must tell him beforehand, that if he draw forth nothing on that subject but what is done by Amyraldus, and like things to them, he will give little satisfaction to learned and stable men upon the issue of his undertaking. I shall not presume to take another man’s task out of his hand, especially one’s who is so every way able to go through with it; else I durst undertake to demonstrate that treatise of Amyraldus, mentioned by Mr. Baxter, to be full of weak and sophistical argumentations, absurd contradictions, vain strife of words, and, in sum, to be as birthless a tympanous endeavour as ever so learned a man was engaged in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 10 (Edinburgh: T&amp;T Clark, n.d.), 478–79.</span></figcaption>

<blockquote><p>Canon IV: Before the creation of the world, God decreed in Christ Jesus our Lord according to his eternal purpose (Eph 3:11), in which, from the mere good pleasure of his own will, without any prevision of the merit of works or of faith, to the praise of his glorious grace, to elect some out of the human race lying in the same mass of corruption and of common blood, and, therefore, corrupted by sin. He elected a certain and definite number to be led, in time, unto salvation in Christ, their Guarantor and sole Mediator. And on account of his merit, by the mighty power of the regenerating Holy Spirit, he decreed these elect to be effectually called, regenerated and gifted with faith and repentance. So, indeed, God, determining to illustrate his glory, decreed to create man perfect, in the first place, then permit him to fall, and finally pity some of the fallen, and therefore elect those, but leave the rest in the corrupt mass, and finally give them over to eternal destruction. Canon V: Christ himself is also included in the gracious decree of divine election, not as the meritorious cause, or foundation prior to election itself, but as being himself also elect (I Pet 2:4, 6). Indeed, he was foreknown before the foundation of the world, and accordingly, as the first requisite of the execution of the decree of election, chosen Mediator, and our first born Brother, whose precious merit God determined to use for the purpose of conferring, without detriment to his own justice, salvation upon us. For the Holy Scriptures not only declare that election was made according to the mere good pleasure of the divine counsel and will (Eph 1:5, 9; Matt 11:26), but was also made that the appointment and giving of Christ, our Mediator, was to proceed from the zealous love of God the Father toward the world of the elect. Canon VI: Wherefore, we can not agree with the opinion of those who teach: l) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete. For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is in finitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-h-heidegger-and-francis-turretin.html">J. H. Heidegger and Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, (1675)</span></figcaption>

<blockquote><p>Let us then draw near to Him with holiness of spirit, lifting up pure and undefiled hands unto Him, loving our gracious and merciful Father, who has made us partakers in the blessings of His elect. For thus it is written, “When the Most High divided the nations, when He scattered the sons of Adam, He fixed the bounds of the nations according to the number of the angels of God. His people Jacob became the portion of the Lord, and Israel the lot of His inheritance.” And in another place [the Scripture] saith, “Behold, the Lord taketh unto Himself a nation out of the midst of the nations, as a man takes the first-fruits of his threshing-floor; and from that nation shall come forth the Most Holy.</p></blockquote>

<blockquote><p>For the foreknowledge (as in the larger signification it is taken for his providence) is God’s eternal decree, by which he determined to make the world, and all that is therein, and to make his glory manifest unto reasonable creatures, namely, unto men and Angels, by the government of the things which he had made.

But predestination chiefly is referred and restrained unto mankind, which God by predestination hath divided into two kinds of men, so that of his own sole and undeserved grace he hath chosen some from eternity, whom he would make his heirs in Christ, and bring to everlasting salvation: and hath appointed other some unto everlasting punishment and destruction, to the which also he brings them by his just judgement from their own deserts. Then the Apostle proceedeth unto the subordinate causes of salvation, and sheweth by what means and degrees, the elect on the one side come to eternal life, and the reprobate on the other side are brought to eternal torments …

For God by his foreknowledge foresaw all things from before all beginnings. Nothing is exempt from this foreknowledge of God, but all things, and every one thing is contained and comprehended in that.</p></blockquote>

— Herman Renecher, The golden chain of salvation, trans. Peter Allibond (London: Thomas Man, 1604), p. 6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+foreknowledge+%28as+in+the+larger+signification+it+is+taken+for+his+providence%29+is+God%E2%80%99s+eternal+decree%2C+by+which+he+determined+to+make+the+world%2C+and+all+that+is+therein%2C+and+to+make+his+glory+manifest+unto+reasonable+creatures%2C+namely%2C+unto+men+and+Angels%2C+by+the+government+of+the+things+which+he+had+made.%0A%0ABut+predestination+chiefly+is+referred+and+restrained+unto+mankind%2C+which+God+by+predestination+hath+divided+into+two+kinds+of+men%2C+so+that+of+his+own+sole+and+undeserved+grace+he+hath+chosen+some+from+eternity%2C+whom+he+would+make+his+heirs+in+Christ%2C+and+bring+to+everlasting+salvation%3A+and+hath+appointed+other+some+unto+everlasting+punishment+and+destruction%2C+to+the+which+also+he+brings+them+by+his+just+judgement+from+their+own+deserts.+Then+the+Apostle+proceedeth+unto+the+subordinate+causes+of+salvation%2C+and+sheweth+by+what+means+and+degrees%2C+the+elect+on+the+one+side+come+to+eternal+life%2C+and+the+reprobate+on+the+other+side+are+brought+to+eternal+torments+%E2%80%A6%0A%0AFor+God+by+his+foreknowledge+foresaw+all+things+from+before+all+beginnings.+Nothing+is+exempt+from+this+foreknowledge+of+God%2C+but+all+things%2C+and+every+one+thing+is+contained+and+comprehended+in+that.%E2%80%9D%0A%0A%E2%80%94+Herman+Renecher%2C+The+golden+chain+of+salvation%2C+trans.+Peter+Allibond+%28London%3A+Thomas+Man%2C+1604%29%2C+p.+6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb32de3280c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b32de3280c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/06/22/herman-renecher-on-the-distinction-between-foreknowledge-and-predestination/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Lutherans distinguish between a proper and an improper, or catachrestic, use of the term election: they state that if election is taken catachrestically for the beneficent will and general love of God toward all, or for the negation of the reprobating decree, or for the decree of God to create all in Adam for eternal life and to renew all in Christ to eternal life, or for the offering, common to all, of the means of salvation, then, they say, We easily concede that election can be spoken of as universal, but in its meaning that is proper and conformed to the Scriptures, we deny (they say) that election is universal.

Then they also say that the counsel of God concerning the salvation of men can be regarded as in either his antecedent will or his consequent will; in the prior respect the counsel is universal; however, in the latter respect it is particular, on account of the foreseen final unbelief of certain persons. So then they construct a universal predestination upon this threefold fulcrum: (1) a universal will in God to save all, (2) a universal redemption through Christ, and (3) a universal calling; yet not all are saved through this universal predestination, because they do not will to believe. See Johann Gerhard, Loci Theologici (tome 2, ch. 10, concerning election and reprobation) and [Matthias] Hafenreffer, Loci Communes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.3.16.</span></figcaption>

</figure><figure class="quote" id="q-20c515fd58" data-kw="">
<blockquote><p>As to the true State of the Doctrine, it may be taken up in these two or three Propositions.

1. That as God, from everlasting, was pleased, in his own free Sovereignty, to decree and determine, to create this World; and to make Man in it a reasonable Creature, in his own Image, holy and upright, every Way fitted and empowered for that Duty which was due, from such a rational Creature, to the great God Creator, with full Ability to persevere and continue in that happy State of Integrity; and to enter into a Covenant of Life with him, wherein all the human Race were to be concerned and engaged; and Adam, their first Father, constituted their public Head and Representative; so that as he kept or broke the Covenant, they were to enjoy or lose the promised Blessings of it:

And as God infallibly foreknew the Fall and Transgression of Adam, as what he had decreed to permit, and so the Depravity and Ruin of his Posterity consequent thereupon, according to the Covenant; with all the actual Sins which every Individual should ever be guilty of; so he was likewise pleased, of his own mere Grace and free Favour, to decree and determine, to recover and save a Number, only known to himself, of that fallen wretched Race, thro’ the Meditation of his own Son’s Redeeming them, by answering the Precept and Penalty of the broken Law for them; and thro’ the Sanctification of his eternal Spirit, making them fit for and capable of glorifying and enjoying him forever.

2. That God’s determining and appointing to save any of fallen Mankind, or any in particular more than others, was not up on the Foresight of any Difference which he foresaw they would make among themselves, by the better Improvement of any common Helps and Advantages, as the Reason of it: But it was purely of his own sovereign, free, wise Pleasure, and distinguishing Grace.

3. That the rest of fallen Mankind, not thus chosen and ordained to eternal Life, he was pleased, of his sovereign, wise and righteous Pleasure, as a just King and Lawgiver, to determine to leave in their fallen State; and to punish them according to all the Sin and Disobedience, which they should be guilty of, and chargeable with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-blair.html">Samuel Blair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of predestination truly and fairly stated: confirmed from clear Scripture-evidence, and defended against all the material arguments and objections advanced against it</cite>, (Philadelphia PN: B. Franklin, 1742), pp 6-7.</span></figcaption>

</figure><figure class="quote" id="q-70e2ce4325" data-kw="">
<blockquote><p>First, whereas he troubleth himself with distinguishing the Supralapsarian and Sublapsarian Doctrine, calling them Supralapsarians who in ordering the eternal decrees of God concerning Election and Preterition or Reprobation place them before the consideration of the fall, and those Sublapsarians who place them after; this pains might well have been spared. For Priorities and Posteriorities in the eternal immanent decrees of God are but imaginations of man’s weak reason, and framed diversly (nay contrarily) as well by Schoolmen and Papists as by Protestants or those which are termed Calvinists; and finally they have little or no use in this controversy, as hath been formerly shewed.

Aquinas thought it no such matter of moment whether Predestination be considered before man’s fall and state of misery or after: Motus non accipit speciem à termino à quo, sed à termino ad quem. Nihil enim refert quantum ad rationem dealbationis, utrùm ille qui deal∣batur fuerit niger, aut pallidus, aut rubeus: &amp; similiter nihil refert ad rationem praedestinatio∣nis, utrùm aliquis praedestinetur in vitam aeter∣nam à statu miseriae vel non. [Motion does not take its form from the term to which it is, but from the term to which it is. For it has nothing to do with the reason of bleaching, whether he who is being whitened is black, or pale, or red: and likewise it has nothing to do with the reason of predestination, whether a person is predestined to eternal life from a state of misery or not.] And for Reprobation, he seemeth rather to incline to their opinion who place it in order of consideration before the fall in making it such a part of the Divine providence as permitteth some men deficere à fine [to fail at the end]. So that this Distinction of Supralapsarians and Sublapsarians hath served this Author to no other purpose but to the inculcating of the same objections again and again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise intitled God’s love to mankind</cite>, (Cambridge: Roger Daniel, 1641), pp 204-05.</span></figcaption>

<blockquote><p>Even so in administering the functions of the Church, if we seek for the original cause of the workman, by whose conduct, all inferior causes are induced to observe their due order and course: the same must be adjudged to proceed from the force and efficacy of the unmeasurable election of the heavenly workman only, who by wonderful dispensation, maketh choice where him liketh, and refuseth whom him lusteth, according to the testimony of the Scripture: I will take compassion on whom I will take compassion, and I will shew mercy to whom I will shew mercy. Whereunto accordeth Saint Paul speaking after the same manner: It is neither the willer, nor the runner, but God that taketh compassion.

Where fortune, and chance, may go play them perdie: no endeavours of man can avail, much less can men’s merits or deservings be of any force, neither can ought else bear palm here, but the only election of almighty God. The nature and property of which election, we may learn elsewhere out of the same Paul: The remnant (sayeth he) are saved through the election of grace, which grace cannot be said to be grace at all, if man’s merits have pre-eminence before it for that which is given according to the proportion of deservings, and not according to grace, seemeth in Augustine’s judgment, a reward rather of duty, then a free gift of promise. But a question may be moved here perhaps, whether the Gentiles were not engrafted for their faith’s sake? and whether the Jews were not supplanted from the true Olive for their unbelief? which interchanged dispensation, what else doeth it explain unto us, then a manifest demonstration as well of the meritorious desert, as well of faith, as of unbelief?

The answer hereunto, first as concerning the faith of the Gentiles, and the infidelity of the Jews. I confess indeed that these may seem to carry some show in the eyes, and judgment of some to be deemed the very original causes of the free acceptation of the Gentiles, and likewise of the repulse of the Jews. But for all this we here not yet, what were the causes of the faith of the one, and of the unbelief of the other. And therefore if we will enter into a deep and more especial enquiry after the principal causes of this action, truly we shall never find them elsewhere, then in the hidden and secret closet of God’s election.

For be it so admitted, that the Gentiles were for this cause engrafted into the true Olive tree, because they did believe, yet if question be moved, from whence their faith proceeded first, it may well be answered, not from any their merits truly, neither in respect of any their own worthiness more, then as the imps which do issue out of the natural wild Olive tree, can boast of any their excellency, wherefore they ought to be transplanted into the fatness of the true Olive tree.</p></blockquote>

</figure><figure class="quote" id="q-8242412ee1" data-kw="">
<blockquote><p>Christ was chosen before all worlds to be the head of the elect. He was predestinate and ordained by God. As we are ordained to salvation, so Christ is ordained to be the head of all that shall be saved. He was chosen eternally, and chosen in time. He was singled out to the work by God; and all others that are chosen are chosen in him. There had been no choosing of men but in him; for God saw us so defiled, lying in our filth, that he could not look upon us but in his Son. He chose him, and us in him.

Here is meant, not only choosing by eternal election to happiness, but a choosing to office. There is a choosing to grace and glory, and a choosing to office. Here, it is as well meant, a choosing to office, as to grace and glory. God, as he chose Christ to grace and glory, so he chose him to the office of Mediatorship. Christ did not choose himself; he was no usurper. No man calls himself to the office, as it is in Heb. v. 4; but Christ was called and appointed of God. He was willing, indeed, to the work, he took it voluntary upon him; but as Mediator, God chose him, God the Father and he joining together.

If we respect eternal salvation, or grace, or office, Christ was chosen in respect of his manhood; for, as it is well observed by divines, Christ is the head of all that are predestinate; and the human nature of Christ could not merit its choice, it could not merit its incarnation, it could not merit union with the Godhead, it was merely from grace. How could Christ’s manhood deserve anything of God before it was? Things must have a subsistence before they can work: our blessed Saviour is the pattern of all election, and his manhood could not merit to be knit to the second person; as how could it, being a creature? Therefore the knitting of the human nature of Christ to his divine, it is called the grace of union. The choosing of the human nature of Christ to be so gracious and glorious, it was of grace.</p></blockquote>

<blockquote><p>Q. What is the decree?

A. That whereby God hath from eternity set down with himself whatsoever shall come to pass.

Expos. 1. All things with their causes, effects, circumstances, and manner of being are decreed by God. Act. 2. 23. and 4. 27. 28. Eph. 1. 11. This decree is most wise, Rom. 11. 33. iust, Rom. 9. 13. 14. eternal, Eph. 1. 4. 5. 2. Thes. 2. 13. Act. 15. 18. 1. Cor. 2. 7. necessary, Psal. 33. 11. Pro. 19. 21. unchangeable, Heb. 6. 17. most free, Rom. 9. 18. and cause of all good, Jam. 1. 17. but not of any sin, 1. Jo. 1. 5. The special decree of God concerning Angels and men is called predestination. Rom. 8. 30. of the former little is spoken in holy Scripture, of the latter more is revealed, not unprofitable to be known.

It may be defined, the wise, free, just, eternal, and unchangeable sentence or decree of God. Eph. 1. 11. determining with himself, to create and govern man for his special glory, viz. the praise of his glorious mercy, or great justice, Rom. 9. 17. 18. Rom. 11. 36. Of this decree there be two parts: Election and Reprobation. 1. Thes. 5. 9. Jude. 4. v. Election is the decree of God, of his free love, grace, and mercy, choosing some men to faith, holiness, and eternal life, for the praise of his glorious mercy. 1. Thes. 1. 4. 2. Thes. 2. 13. Eph. 1. 4. 5. 6. Rom. 8. 29. 30. The cause which moved the Lord to elect them who are chosen, was none other but his mere good-will and pleasure. Luk. 12. 32. Rom. 11. 5. and 9. 11. 16. Eph. 1. 5. 2. Tim. 1. 9. The end, is the manifestation of the riches of his grace and mercy, Rom. 9. 23. Eph. 1. 2. The sending of Christ, faith, holiness, and eternal life are the effects of God’s love, by which he manifesteth the infinite riches of his grace. Jo. 3. 16. 1. Jo. 4. 10. Act. 13. 48. Tit. 1. 1. Col. 1. 12. Rom. 6. 23.

In the same order, God doth execute this decree in time, he did decree it in his eternal counsel. 1. Thes. 5. 9. 2. Thes. 2. 13. Reprobation is the wise, just, and absolute decree of God, ordaining to leave some men unto themselves, to suffer them to fall, and to inflict upon them eternal punishment, deserved by their sins, for the praise of his unspeakable and great justice. Rom. 9. 11. 13. 22. Jude. 4. v. Jer. 6. 30. The cause of this decree is the absolute will and good pleasure of God. Mat. 11. 26. Rom. 9. 13. man’s sin is the cause why God will punish, but no occasion why he did ordain to pass by, or to punish man, Rom. 9. 18. 20.

This decree is just, because God hath power over man, as the potter hath over his clay, to make one vessel to honour, and another unto dishonour. Rom. 9. 21. Jer. 18. 6. Matth. 20. 15. The end hereof is not the condemnation of the creature, but the manifestation of God’s justice. Rom. 9. 22. Sin is the effect of man’s free will, and condemnation is an effect of justice, inflicted upon man for sin and disobedience. Jo. 3. 18. and 12. 37. 38. 39. 40. 2. Thess. 2. 9. 10 but the decree of God which is good, is the cause of neither. Ps. 5. 4. A man in this life may be assured of this election. 2. Pet. 1. 10. 1. Thes. 1. 4. and eternal happiness. Matth. 24. 24. Jo. 10. 28. 29. Rom. 8. 33. 34. 2. Tim. 2. 19. but not of his reprobation, for he that is now profane, may be called hereafter. Matth. 20. 5. 6.</p></blockquote>

This decree is just, because God hath power over man, as the potter hath over his clay, to make one vessel to honour, and another unto dishonour. Rom. 9. 21. Jer. 18. 6. Matth. 20. 15. The end hereof is not the condemnation of the creature, but the manifestation of God’s justice. Rom. 9. 22. Sin is the effect of man’s free will, and condemnation is an effect of justice, inflicted upon man for sin and disobedience. Jo. 3. 18. and 12. 37. 38. 39. 40. 2. Thess. 2. 9. 10 but the decree of God which is good, is the cause of neither. Ps. 5. 4. A man in this life may be assured of this election. 2. Pet. 1. 10. 1. Thes. 1. 4. and eternal happiness. Matth. 24. 24. Jo. 10. 28. 29. Rom. 8. 33. 34. 2. Tim. 2. 19. but not of his reprobation, for he that is now profane, may be called hereafter. Matth. 20. 5. 6.”

</figure><figure class="quote" id="q-7d230d796b" data-kw="">
<blockquote><p>In all ages there have been persons who supposed that we ought not to preach upon the subject of predestination, or of eternal election to the people, that that great and impenetrable mystery ought not to be noticed in the public discourses of ministers, but rather that it should be treated as a fathomless abyss, on the edge of which we should pause, and content ourselves with merely gazing …

And why, let me ask, conceal or suppress the doctrine of predestination, – a doctrine which so clearly and manifestly glorifies God, – which attributes to him all the honour and all the praise of our salvation, – which keeps us humble, – which fills us with gratitude, – which inflames our love towards the author of our being, – which leads us with reverential homage to cast our crowns at his feet, and excites to the performance of good works as the necessary means of reaching that end to which predestination appoints us.</p></blockquote>

<blockquote><p>OBJECTION: By God’s predestination men are compelled to sin and driven to death by a sort of fatal necessity.

ANSWER: No Christian who is a Catholic denies God’s predestination. But fatalism many, even non-Christians, reject. Sin, indeed, leads to death, but God compels no one to sin. For He hath commanded no man to do wicked. And: Thou hatest, Lord, all the workers of iniquity; thou wilt destroy all that speak a lie. Accordingly, one who preaches fatalism under cover of predestination is no less worthy of disapproval than one who censures predestination on the plea of fatalism.

Fatalism as a theory is groundless and born from falsehood. But faith in predestination is based on many texts of Holy Scripture. And it is altogether wrong to attribute to predestination the evil deeds of men. Their propensity to evil does not come from God’s creation but from the sin of their first parent. And no one is freed from the punishment of this sin except by the grace of our Lord Jesus Christ, which was prepared and predestined in God’s eternal design before the creation of the world.</p></blockquote>

tion-is-not-fatalism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-bb12d423be" data-kw="">
<blockquote><p>Upon this ground of difference and distinction between man and man, we may well be admonished to beware of the error of some divines, who thus define of God’s will touching man’s estate; they say it is the first will of God, that every man in the world should be saved, if they would, and therefore (say they) he ministers unto them all helps both of nature and grace, whereby they may repent and believe if they will. And having laid down this his first will, he then (say they) foresees that some men will not believe, nor persevere in the faith: and hereupon it is (in their conceit) that he will not know some men for his own.

Again, foreseeing that others will believe and persevere in faith, them he knows and acknowledgeth to be his; dealing herein like unto a good father that hath many sons, who would have them all to do well, and to have each one a good portion; but yet seeing that some will not become frugal and obedient, he changeth his mind, and doth disinherit them: or like unto a good Prince, who would have all his subjects to do well; but seeing some to be rebels, he is of another mind, and willeth their death.

Answ. But this opinion is a mere invention of man’s brain; for whereas they say, that God by a second act of his will acknowledgeth some for his own, and not others, upon the foresight of their faith and unbelief, whereas by his first will he would have all men to be saved, it is not true; for the first will of God, is to know some, and not to know others: the ground whereof, is his good pleasure alone, and no foreseen works in them. And therefore it cannot be, that he should will all men to be saved equally, Cain as well as Abel, Judas as well as Peter. Again, their opinion confutes it self, for God foresees men’s faith and unbelief, because he hath decreed the same, and his decree depends upon his own will alone: and therefore unless we make the same thing in the same respect, both the cause and the effect, we cannot make foreseen works the ground of difference between man and man.

Then their comparisons are not fit: a father would have all his children to do well, and to enjoy his portion: true; and more then that, he would make all his children to do well, if it lay in his power; neither would he disinherit any, if it lay in his power to make them good: the change of his purpose in disinheriting his son, ariseth upon the impotency of his will, that cannot do that he would. And the same must be said of the will of Princes toward their subjects: but if their should be such a will in God to have all men saved, if he could save them; then undoubtedly all men should be saved, for who hath resisted his will? nay, whatsoever the Lord willeth, that doth he in heaven, in earth, and every where, Dan. 4. 32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 527-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election.html">Election</a></span></div>

<blockquote><p>Did God then before he made man, determine to save some, &amp; reject others?

Ans. Yes surely, before they had done either good or evil, God in his eternal counsel set some apart, upon whom he would in time shew the riches of his mercy, and determined to withhold the same from others, on whom he would shew the severity of his wrath.

What should move God to make this difference between Man and Man?

Ans. Only his own pleasure, whereby having purposed to create man for his own Glory, forasmuch as he was not bound to shew mercy unto any, and his Glory should appear as well in executing of justice, as in shewing mercy; It seemed good unto His Heavenly wisdom to chose out a certain number towards whom he would extend his undeserved mercy, leaving the rest to be spectacles of his justice.</p></blockquote>

<blockquote><p>Subservient to God’s election of some is each covenant. The covenant of works to humble them, not only upon the consideration of their sins, whereby they have merited eternal death; but especially upon consideration how their natural corruption is so far from being mastered and corrected by the Law, as that on the contrary it is irritated and exasperated so much the more.

Then the covenant of grace to comfort them, considering how the condition of life is adduced and tempered, being from exact and strict obedience changed into faith and repentance; but chiefly upon consideration that the word of this covenant is a word of power mastering their corruption, and enabling to perform faith, repentance, and Evangelical obedience in an acceptable manner unto the Lord.

Subservient to the purpose of reprobation may be the Law, only written in men’s hearts, which very obscurely, intimateth (if at all) any covenant made of everlasting life between God and man. Where the word is revealed, that in general comprehending both Law and Gospel, is subservient thereunto in the way of instruction and exhortation, and the like, thereby taking away all excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 262.</span></figcaption>

nants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d9caac3001" data-kw="">
<blockquote><p>For God, who made man, did himself prepare in his predestination, both the gift of illumination to believe, and the gift of perseverance to profit and persevere, and the gift of glorification to reign, tor such to whom he pleased to give it: who also doth not any otherways perform in deed than was ordained by his unchangeable will.

The truth of which predestination, whereby the apostle witnesseth we were predestinated in Christ before the foundation of the world, if any one refuse to receive with the belief of the heart, or to utter with the confession of the mouth, if, before the last day of this present life, he lay not aside the obstinacy of his impiety, whereby as a rebel he withstandeth the true and living God, it is manifest that he doth not belong to the number of those which God did before the foundation of the world freely choose in Christ, and predestinated unto the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Incarnatione et Gratia Christi</cite>, Quoted in William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 346.</span></figcaption>

blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d9caac3001.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/04/fulegentius-of-ruspe-on-predestination/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-327c36d75d" data-kw="">
<blockquote><p>Thesis 3. Many, being scrupulous, have erred with the term “predestination,” arguing it denotes election alone and is spoken just about good things—this despite the fact the Holy Spirit used the same term in speaking about evil things (Acts 4:23). This is because predestination of a thing is the determination of it to its end. But these people deny this is the sort of end that is the destruction of the reprobate (seeing that such is an evil thing) and further that the term “predestination” is applied wrongly to them. Answer. Though we concede it is indeed an evil thing with respect to those reprobate, still, with respect to God reprobating, which is their final destruction or end, he without doubt intends the declaration of his righteousness and power (Prov. 16:4; Rom. 9:17, 21–22). …

Thesis 8. The means tending to this end are effectual calling, justification, and sanctification, and the opposite for the reprobate: the privation of effectual grace, continuation in the state of condemnation, and just blinding and hardening, all which presuppose the Fall and condition of sin. We will deal with all this further in what follows.

Thesis 9. So, our adversaries charge us falsely that we establish predestination absolute in every way, because we say it is only absolute with respect to the impelling cause existing in man, or a cause differing from God’s good pleasure. This is because, if it were some impulsive cause that moved God toward this or that thing about to be done, thus God would be the cause who depends with respect to that cause by which he is moved. This is absurd. Furthermore, predestination is not absolutized from the end and means (as is clear in the preceding thoughts), because God, absolutely wise, wills nothing without an end. So he decreed to render sinners saved, so that he might manifest his grace in them with respect to his mercy, but to condemn the reprobate, so that he might manifest his glory in them under the concept of his justice. Nothing is without means. Thus, he decreed to save the faithful, but through and on account of Christ; and he decreed to condemn the reprobate, but on account of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Theological Disputation De Divina Hominum Praedestinatione</cite>, (1643), with Johannes Maccovius Presiding and Johannes Fridericus Herbst Responding’, trans. R. M. Hurd in Mid-America Journal of Theology, no. 30 (2019), pp 89, 90.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election.html">Election</a></span></div>

Thesis 8. The means tending to this end are effectual calling, justification, and sanctification, and the opposite for the reprobate: the privation of effectual grace, continuation in the state of condemnation, and just blinding and hardening, all which presuppose the Fall and condition of sin. We will deal with all this further in what follows.

respect+to+that+cause+by+which+he+is+moved.+This+is+absurd.+Furthermore%2C+predestination+is+not+absolutized+from+the+end+and+means+%28as+is+clear+in+the+preceding+thoughts%29%2C+because+God%2C+absolutely+wise%2C+wills+nothing+without+an+end.+So+he+decreed+to+render+sinners+saved%2C+so+that+he+might+manifest+his+grace+in+them+with+respect+to+his+mercy%2C+but+to+condemn+the+reprobate%2C+so+that+he+might+manifest+his+glory+in+them+under+the+concept+of+his+justice.+Nothing+is+without+means.+Thus%2C+he+decreed+to+save+the+faithful%2C+but+through+and+on+account+of+Christ%3B+and+he+decreed+to+condemn+the+reprobate%2C+but+on+account+of+sins.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+%E2%80%98The+Theological+Disputation+De+Divina+Hominum+Praedestinatione%2C+%281643%29%2C+with+Johannes+Maccovius+Presiding+and+Johannes+Fridericus+Herbst+Responding%E2%80%99%2C+trans.+R.+M.+Hurd+in+Mid-America+Journal+of+Theology%2C+no.+30+%282019%29%2C+pp+89%2C+90.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F327c36d75d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/327c36d75d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/25/johannes-maccovius-on-predestination-as-inclusive-of-reprobation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Vers. 4. According as he hath chosen us in him, before the foundation of the world, that we should be holy, and without blame before him in love.

Argum. 1. … God actually in time, freely bestows all these spiritual blessings upon us in Christ, even as before time he of his grace chose us in him, that at length we might obtain these benefits: Therefore we ought to bless him: All the words of this Argument also are proofs of his free and gracious election: For,

(1.) Our election was of God unto life, before others our companions, who were in the same condition, whom God leaving and passing by chose us: Therefore we are chosen out of grace.

(2.) He chose us in Christ, as in the head who was first chosen, as in the common Parent, root and fountain of the elect. After whom we in the consideration of dignity, and order, and in whom we, as his body, members, and off-spring, are afterwards chosen in the order of nature: Therefore our election is free, there being no cause of it in us, which is to be sought for in God alone.

(3.) He chose us before the foundation of the world, that is, from eternity, before the world was, much more before any works of ours were; He chose us before any matter of the created world was existent, much more before any matter of our works or workings could be existent: for he elected us in order of nature before he decreed that the world should be. For the decree of the creation of the world, was subservient as a means to bring to pass the already decreed salvation of the elect: Therefore he chose us of grace, and not for fore-seen works.

He chose us that we might be holy] (4.) He did not choose us because we were holy, or because he fore-saw that we would be holy, but he chose us without any consideration of any holiness at all in us, nay he chose us as not having holiness; to the end, that being chosen, we should be made holy, and should become unblameable in his sight, that is, that being consecrated to God, we should be by degrees truly and sincerely sanctified, and should at last be presented fully and perfectly holy in heaven: Yea further, that being unblameable without spot, without wrinkle, not only of sin, but also of all misery, we should at length appear together before him blessed and glorious: Therefore our election is not from faith fore-seen, or works fore-seen, but of mere grace, which as it is the cause of election, so of all holiness, and happiness, which follows election.

In love] Love or charity is merely free, in which as he hath chosen us, that we should be made holy and unblameable, so also that in that his love we should perfect this our happiness; which love God will then fully put forth, when he shall fully consummate our holiness and happiness. And so the charity or love of God is both the cause of election, and the completing or perfecting of those good things which follow election, and by consequence election is not only of grace, but is for the perfect possession of free happiness in the sight of God.

Vers. 5. Having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will.

Arg. 3. Thus God of his grace hath blessed us in time, so also of grace he hath predestinated us to the inheritance of Sons, which was to be obtained by Christ in his own person, according to the good pleasure of his will: Therefore we should celebrate his grace. The parts of this reason prove the same, that the whole reason it self doth.

Having predestinated us] (1.) As our election before time was free, so is our predestination also before ages unto life eternal, and to fit means, which should be effectual to bring us to that end: Therefore predestination is free, in that it doth not only assign the end and persons, but also appoints the means by which we must attain that end.

Unto the adoption of children] (2.) Here also the Apostle manifests the grace of God. We are predestinated, not because we are fore-seen as Sons, but that being not as yet Sons, we should by Grace attain the Adoption of Sons. Now the Adoption of Sons includes these four things. (1) An effectual Calling, or Faith to embrace the offered communion with Christ the only begotten Son. (2) A towardliness and good disposition of Sons, or the renovation of our nature, that we might love God as our Father. (3) The dignity and honour of Sons. (4) The Riches or Inheritance of Sons, even to the glorifying of our Bodies, Rom. 8.23. Therefore both our Predestination and Adoption is free, and not for any work of ours.

By Christ] (3) And this doth make much for the advancement of Grace: Wee are predestinated that wee may obtain the Adoption of Children by Jesus Christ, who is the first-begotten, and only-begotten Son, that by his merit and efficacy we might obtain all the fore-said degrees of Adoption: Therefore our predestination is from mere Grace.

To himself] (4) That Grace might appear, he shews the end of Adoption. God hath predestinated us that we should obtain the Adoption of Children by Christ to himself, or to his use, viz. to the honour of him that predestinateth, or of Christ by whom he communicates to us Grace, and the Glory of the Sons of God: Therefore our predestination is free, for otherwise honour would not accrue to God or Christ by our Adoption.

According to the good pleasure of his Will] (5) Here he excludes all causes besides God, and makes the Grace of God the only cause. For he predestinated us according to the good pleasure of his Will: Therefore only God’s Grace, only his Will, only his good pleasure is the cause of our predestination, and not any work of ours.</p></blockquote>

<blockquote><p>But we are bound to give thanks to God always for you, brethren beloved by the Lord, because God from the beginning chose you for salvation through sanctification by the Spirit and belief in the truth (2 Thessalonians 2:13)

(2.) That these things are not causes of election, but fruits of election, and means of execution of God’s decree about our salvation. Sanctification is not a cause, but a subordinate end or means: Eph. i. 4, ‘He hath chosen us to be holy;’ not because we are holy, but that we might be holy. So 1 Peter i. 2, ‘Elect according to the foreknowledge of God, through the sanctification of the Spirit unto obedience.’ Not elected for it, but through it. When God had all mankind in his prospect and view, he freely chose out some to be sanctified and saved.

We come to the possession of it through sanctification, that is, by it as a means. So for the other; faith is a fruit of election, not a foreseen cause: Acts ii. 47, ‘The Lord added to the church daily such as should be saved.’ None cometh to the church but those whom God draweth, and they are actually added to the church by a profession of faith; and such as should be saved were as many as were ordained to salvation Acts xiii. 48, ‘And as many as were ordained to eternal life believed.’ The whole city were met together to hear, but as many as were ordained to eternal life believed. It is not said, as many as believed were ordained to eternal life, but the contrary; faith is not the cause of election, but election is the cause of faith.</p></blockquote>

<blockquote><p>THESIS 1

Predestination is properly, according to the etymology of the word, a determination to an end, but in common usage, it is equivalent to the Greek word protagh and signifies the relation of the whole arrangement to the end, and thus we use it. …

THESIS 2

Predestination, therefore, is an act of the divine good-pleasure, by which God, from eternity, prepared the plenitude of His blessings, in Christ, for those, who should be heirs of salvation, to the praise of His glorious grace. …

THESIS 3

It is an act (for God is … simple energy) proceeding not from any external cause, but purely from Him who predestinates; otherwise it would not be, purely, predestination, preceding all things and causes. …

THESIS 4

Its cause is eujdokia good-pleasure, by which He was favourably disposed towards those, whom He pleased to adopt as sons, through Jesus Christ, according to the purpose of His election. …

THESIS 5

It is, therefore, God alone, who predestinates, the cause of His own predestination, and of that preparation which He proposed to Himself, according to that good pleasure of His will. …

THESIS 6

Therefore, this act is said to be from eternity, that is, before all things and causes, in things or of things, which He predestinated to exist.

THESIS 7

The material of predestination is twofold; divine things, and persons to be partakers of them. …

THESIS 8

The genus of the divine things, which are communicable through Predestination, is blessing, which the Apostle circumscribes within these modes; it is complete, not partial; spiritual, not carnal; “in heavenly places,” not natural, but surpassing all nature; finally, in Christ, that is, divine in its principle and foundation, that Christ may be the eternal head of the predestinate. …

THESIS 9

Of these blessings, the chief points are two, grace and glory; the former, acting on men in the present life, the latter to be consummated in them in the future life. …

THESIS 10

Human beings are creatures, in a condition of nature—which can effect nothing supernatural or divine—to be exalted above nature, and to be transferred to a participation of divine things by the supernatural energy of the Deity. …

THESIS 11

The form is adoption, as sons, through Jesus Christ, that is, that real relation and ordination, in which we are blessed of God, by the communication of “all spiritual blessings in heavenly places” in Christ. …

THESIS 12

The order of this form is placed in the preparation, of persons, by election, vocation, and “gathering together in Christ” (Ephes. i. 10); but of things, by a gracious beginning, progress, and glorious consummation of blessings, in a perfect union with Christ.

THESIS 13

The end is the praise of the glorious grace of God, by which He has freely made us acceptable unto Himself, in the Son of His love. …

THESIS 14

What is contrary to this predestination can not, with propriety, be expressed in a single term, since the relation of predestination is single, that of its contraries is various. For preterition is contrary to the preparation of grace, and reprobation or preparation of punishment is contrary to the preparation of glory. …

THESIS 15

Preterition is the act of the divine will, by which God, from eternity, determined to leave some of His creatures in their natural state, and not to communicate to them that supernatural grace, by which their nature might be preserved uncorrupt, or, having become corrupt, might be restored, to the declaration of the freedom of His own goodness. …

THESIS 16

This preterition is without blame: for God bestowed on man the perfection of human nature, He was not under obligation to bestow grace upon any one. It is grace; therefore, there is no obligation. …

THESIS 17

The preparation of punishment is the act of the divine pleasure, by which God, from eternity, determined, for the declaration of His own justice, to punish His creatures, who should not continue in their original state, but should depart from God, the author of their origin, by their own deed and depravity. …

THESIS 18

Therefore, in the predestinate, God does all things according to the good-pleasure of His own predestination. In those who are not predestinate, He uses preterition according to the pleasure of His will, and prepares punishment for His creatures who transgress against His order, and who must be reprobated, on account of their sins, from the necessity of His justice. …

THESIS 19

If reprobation is made the opposite of predestination, the statement is figurative, and synecdochical: wherefore, it either should not be made, because it is improper, dangerous, and liable to give offense, or it should be distinctly explained, as pious and learned men have done. …

THESIS 20

The presentation of this doctrine is especially necessary, if it is treated skilfully, soberly, and reverently, that is, that not any thing else be treated, not otherwise, not to another end than as the Holy Scriptures teach, both in explanation and in application, according to the advice of St. Paul: “not to think of himself more highly than he ought to think, but to think soberly.” Rom. xii. 3.</p></blockquote>

<blockquote><p>Closely connected with this excellence of the Confession of Faith is its astonishing precision of thought and language. The whole mental training of the eminent divines of that period led to this result. They were accustomed to cast every argument into the syllogistic form, and to adjust all its terms with the utmost care and accuracy. Every one who has studied the propositions of the Confession must have remarked their extreme precision; but, without peculiar attention, he may not perceive the astonishing care which these divines must have bestowed on this part of their great work. This may be best shown by an instance. Let us select one from chapter iii., “On God’s Eternal Decree,” sections 3 and 4: “By the decree of God, for the manifestation of his glory, some men and angels are predestinated unto everlasting life, and others foreordained to everlasting death. These angels and men thus predestinated and foreordained,” &amp;c.

The expressions to which we wish to draw the reader’s attention are the words predestinated and foreordained, A hasty or superficial reader might perceive no difference between these words. But, if so, why are they both used? for there is no instance or mere tautological repetition in the concise language of the Confession. But, further, let it be well remarked that the word “predestinated” is used only in connection with “everlasting life,” and the word “foreordained” with ” everlasting death.” And when the compound form of the proposition is assumed, both terms are used to represent each its respective member in the general affirmation. Why is this the case? Because the Westminster Divines did not understand the meaning of the terms predestination and foreordination to be identical, and therefore never used these words as synonymous.

By predestination they meant a positive decree determining to confer everlasting life; and this they regarded as the basis of the whole doctrines of free grace, arising from nothing in man, but having for its divine origin the character and sovereignty of God. By foreordination, on the other hand, they meant a decree of order, or arrangement, determining that the guilty should he condemned to everlasting death; and this they regarded as the basis of judicial procedure, according to which God “ordains men to dishonour and wrath for their sin,” and having respect to man’s own character and conduct.

Let it be further remarked, that while, according to this view, the term predestination could never with propriety be applied to the lost, the term foreordination might be applied to the saved, since they also are the subjects, in one sense, of judicial procedure. Accordingly there is no instance in the Confession of Faith where the term predestination is applied to the lost, though there are several instances where the term foreordination, or a kindred term, is applied to the saved. And let this also be marked, that the term reprobation, which is so liable to be misunderstood and applied in an offensive sense to the doctrine of predestination, is not even once used in the Confession of Faith and the Larger and Shorter Catechisms.

Later writers on that doctrine have indeed employed that word, as older writers had done, and had thereby furnished occasion to the opponents of the doctrine to misrepresent it; but the Westminster Divines cautiously avoided the use of an offensive term, carefully selected such words as were best fitted to convey their meaning, and in every instance used them with the most strict and definite precision. Many other examples might be given of the remarkable accuracy of thought and language which forms a distinguished characteristic of the Confession of Faith; but we must content ourselves with suggesting the line of investigation, leaving it to every reader to prosecute it for himself.</p></blockquote>

<blockquote><p>Of our present righteousness, notwithstanding sin remain in our mortal bodies, are we assured by the faithful witness of Jesus Christ, John the Apostle, saying, “If we confess our sins, faithful and just is God to remit and forgive our sins.” Mark the words of the apostle; if we confess our sins, God must forgive them, because be is faithful and just.

To confession of sins are these things requisite: first, we must acknowledge the sin; and it is to be noted that sometimes God’s very elect, albeit they have sinned most heinously, do not acknowledge sin, and therefore cannot at all times confess the same; for sin is not known until such time as the veil be taken from the conscience of the offender, that he may see and behold the filthiness of sin, what punishment by God’s just judgments is due for the same, and then (which is the second thing requisite to confession) begins the hatred of sin, and of ourselves for contemning of God and of his holy law, — whereof last springs that which we call hope of mercy, which is nothing else than you sob from a troubled heart, confounded and ashamed for sin, thirsting for remission and God’s free mercy, whereupon of necessity must follow this conclusion, God has remitted and freely forgiven the sin; and why? for “he is faithful and just,” saith the apostle.

Comfortable and marvellous reasons! First, God is faithful, therefore be must forgive sin. A comfortable consequent upon a most sure ground! for God’s fidelity can no more fail, than can himself. Then let this argument be gathered for our comfort; it pertaineth to the faithful to keep promise: but God is faithful, therefore he must keep promise. That God has promised remission of sins to such as be repentant, I need not now to quote the places. But let this summation of the promises be made:— God promises remission of sins to all that confess the same; but I confess my sins; for I see the filthiness thereof, and how justly God may condemn me for my iniquities. I sob and I lament that I cannot be quit and rid of sin. I desire to live a more perfect life. These are infallible signs, seals, and tokens that God has remitted the sin; for God is faithful that hath so promised, and can no more deceive than he can cease to be God.

But what reason is this — God is just, therefore he must forgive sin? A wondrous argument and reason, indeed! for the flesh and natural man can understand nothing but the contrary; for thus it must reason: — The justice of God is offended by my sins, so God must needs have a satisfaction and require a punishment. If we understand of whom God requires satisfaction, whether of us or of the hands of his only Son, and whose punishment is able to recompensate for our sins, then shall we have great cause to rejoice, remembering that God is a just God; for it pertaineth to the just man to stand content when he bath received his due. But God has received already, at the hands of his only Son, all that is due for our sins; and so cannot his justice require nor crave any more of us either satisfaction or recompensation for our sins.

Consider, mother, the sure pillars and foundation of our salvation to be God’s faithfulness and justice. He that is faithful has promised free remission to all penitent sinners, and He that is just has received already a full satisfaction for the sins of all those that embrace Christ Jesus as the only Saviour of the world. What remains, then, to us to be done? Nothing but to acknowledge our misery and wretchedness, which no flesh can do so unfeignedly as they that daily feel the weight of sin. And other cause have we none of despair, albeit the devil rage ever so cruelly, and albeit the flesh be ever so frail, daily and hourly lusting against God’s holy commandments, yea, striving against the same.

This is not the time of righteousness before our own eyes; we look for that which is promised — the kingdom everlasting, prepared for us from the beginning, whereof we are made heirs by God’s appointment, receiving legitimation thereto by Christ’s death, to whom we shall be gathered, when afterwards we shall never depart, — which to remember is my singular comfort, but thereof now I cannot write. My commendations to all to whom they are due. I commit you to the protection of the Omnipotent.</p></blockquote>

Consider, mother, the sure pillars and foundation of our salvation to be God’s faithfulness and justice. He that is faithful has promised free remission to all penitent sinners, and He that is just has received already a full satisfaction for the sins of all those that embrace Christ Jesus as the only Saviour of the world. What remains, then, to us to be done? Nothing but to acknowledge our misery and wretchedness, which no flesh can do so unfeignedly as they that daily feel the weight of sin. And other cause have we none of despair, albeit the devil rage ever so cruelly, and albeit the flesh be ever so frail, daily and hourly lusting against God’s holy commandments, yea, striving against the same.

This is not the time of righteousness before our own eyes; we look for that which is promised — the kingdom everlasting, prepared for us from the beginning, whereof we are made heirs by God’s appointment, receiving legitimation thereto by Christ’s death, to whom we shall be gathered, when afterwards we shall never depart, — which to remember is my singular comfort, but thereof now I cannot write. My commendations to all to whom they are due. I commit you to the protection of the Omnipotent.”

<blockquote><p>But they say that the “definition of predestination is opposed to the advantage of preaching,”—as if, indeed, it were opposed to the preaching of the apostle! Did not that teacher of the heathen so often, in faith and truth, both commend predestination, and not cease to preach the word of God?

Because he said, “It is God that worketh in you both to will and to do for His good pleasure,” did he not also exhort that we should both will and do what is pleasing to God? or because he said, “He who hath begun a good work in you shall carry it on even unto the day of Christ Jesus,” did he on that account cease to persuade men to begin and to persevere unto the end?

Doubtless, our Lord Himself commanded men to believe, and said, “Believe in God, believe also in me:” and yet His opinion is not therefore false, nor is His definition idle when He says, “No man cometh unto me”—that is, no man believeth in me—“except it has been given him of my Father.” Nor, again, because this definition is true, is the former precept vain. Why, therefore, do we think the definition of predestination useless to preaching, to precept, to exhortation, to rebuke,—all which things the divine Scripture repeats frequently,—seeing that the same Scripture commends this doctrine?</p></blockquote>

<blockquote><p>In body ye think I am no adulterer – let it be so; but the heart is infected with foul lusts, and will lust albeit I lament never so much. Externally I commit no idolatry; but my wicked heart loveth the self, and cannot be refrained from vain imaginations, yea, not from such as were the fountain of all idolatry.

I am no man-killer with my bands; but I help not my needy brother so liberally, as I may and ought. I steal not horse, money, nor clothes from my neighbour; but that small portion of worldly substance I bestow not so rightly as His holy law requireth.

I bear no false witness against my neighbour, in judgment or otherwise, before men; but I speak not the truth of God so boldly as it becometh his true messenger to do. And thus, in conclusion, there is no vice repugnant to God’s holy will, expressed in his law, wherewith my heart is not infected.</p></blockquote>

<blockquote><p>The following letter was written by the New England divine, John Cotton to James Ussher, the Archbishop of Armagh. Cotton had inclosed a manuscript on predestination for Ussher’s perusal, which has not survived (though it was critiqued by the moderator of the Westminster Assembly, William Twisse). In this letter, Cotton hints at agreeing with Ussher’s hypothetical universalism:

Right Reverend,

My beloved Neighbour-Minister Mr. Wood, acquainted me with your desire to hear from me, how I conceived of the way of God’s eternal Predestination, and the Execution of it: I should not have hearkned to him herein (tho I love him well) were it not for the deep Aﬀection and Reverence I bear to your Person and Gifts, which hath constrained me (together with his importunacy) to yield to the sending of this Discourse to you, which I was occasioned to write a year ago for the satisfaction of a Neighbour-Minister in Points of this nature.

The Questions and Answers in the beginning of the Book, I delivered and opened by way of Catechism long ago; which a Neighbour-Minister having afterwards gotten from some of my Hearers, he wrote those Doubts, which follow in the Book, the better to inform either himself or me: Whereupon as I could get any time in the midst of other continual Employments (too heavy for me) I wrote to him the Discourse following, the more fully to acquaint him with the grounds of my Judgment, as knowing well his suﬃciency to object fully, if he found himself unsatisﬁed in any Passage thereof. The Style (I confess) is unmet for you to read, as being plain and popular, and therefore too large, and withal empty of variety of reading, which store of other Occurrences in my Calling here, inforceth me too often to intermit.

Thus much let me humbly intreat at your Lordship’s hands, by the honour which you owe to Christ, and by the Love you bare to his poorest Servants, stick not (I beseech you) to advertise me freely of any such tenent herein, as you shall think less safe. I trust you shall ﬁnd me conscious of mine own Slenderness, and glad to receive such Light, as God shall be pleased to impart to me by you.

Yet this one thing more let me also add. Tho I yield some degree of Eﬃcacy in Christ’s Death unto all; yet I conceive it far short, both of Impetration and Application of that gracious Atonement, which is there by wrought to the Elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s Bread is not meet for Whelps; and full Souls will despise Honey-Combs.

I see John Baptist was sent to humble, before Christ to heal; and Christ himself preached Repentance, before Faith in the Promises, Mark 1. 15. Neither do I remember in the Gospel any Promise of Grace, pardoning Sin, nor any Commandment to believe Sin pardoned, but to the broken, the bruised, the poor, the weary, the thirsty, or the like. Faith in the Promises, before the Heart be changed from Stoniness to Brokenness, I fear is no better than the Temporary Faith, which is found in the stony Soil; Luke 8. 13.

But I cease your Lordship’s further Trouble. Now the Lord Jesus, who hath delighted in you to ﬁll your Heart with the Riches of his manifold precious Graces, be pleased to enlarge you to the Employment of them to his best advantage, guide all your Ways in his Faithfulness, and Wisdom, and sustain you with his Mercy and Power unto the end. So I humbly take leave, and rest;

Earnestly desirous to be directed by your Lordship, or conﬁrmed in the Truth,

John Cotton.

Boston, May 31. 1626.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to James Ussher, 31 May 1626 in Sargent Bush, Jr. (ed.), The Correspondence of John Cotton (Chapel Hill: University of North Carolina Press, 2001), 111-12.</cite></span></figcaption>

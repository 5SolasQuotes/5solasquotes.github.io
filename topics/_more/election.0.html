Yet this one thing more let me also add. Tho I yield some degree of Eﬃcacy in Christ’s Death unto all; yet I conceive it far short, both of Impetration and Application of that gracious Atonement, which is there by wrought to the Elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s Bread is not meet for Whelps; and full Souls will despise Honey-Combs.

I see John Baptist was sent to humble, before Christ to heal; and Christ himself preached Repentance, before Faith in the Promises, Mark 1. 15. Neither do I remember in the Gospel any Promise of Grace, pardoning Sin, nor any Commandment to believe Sin pardoned, but to the broken, the bruised, the poor, the weary, the thirsty, or the like. Faith in the Promises, before the Heart be changed from Stoniness to Brokenness, I fear is no better than the Temporary Faith, which is found in the stony Soil; Luke 8. 13.

But I cease your Lordship’s further Trouble. Now the Lord Jesus, who hath delighted in you to ﬁll your Heart with the Riches of his manifold precious Graces, be pleased to enlarge you to the Employment of them to his best advantage, guide all your Ways in his Faithfulness, and Wisdom, and sustain you with his Mercy and Power unto the end. So I humbly take leave, and rest;

Earnestly desirous to be directed by your Lordship, or conﬁrmed in the Truth,

John Cotton.

Boston, May 31. 1626.”

— John Cotton, Letter to James Ussher, 31 May 1626 in Sargent Bush, Jr. (ed.), The Correspondence of John Cotton (Chapel Hill: University of North Carolina Press, 2001), 111-12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+following+letter+was+written+by+the+New+England+divine%2C+John+Cotton+to+James+Ussher%2C+the+Archbishop+of+Armagh.+Cotton+had+inclosed+a+manuscript+on+predestination+for+Ussher%E2%80%99s+perusal%2C+which+has+not+survived+%28though+it+was+critiqued+by+the+moderator+of+the+Westminster+Assembly%2C+William+Twisse%29.+In+this+letter%2C+Cotton+hints+at+agreeing+with+Ussher%E2%80%99s+hypothetical+universalism%3A%0A%0ARight+Reverend%2C%0A%0AMy+beloved+Neighbour-Minister+Mr.+Wood%2C+acquainted+me+with+your+desire+to+hear+from+me%2C+how+I+conceived+of+the+way+of+God%E2%80%99s+eternal+Predestination%2C+and+the+Execution+of+it%3A+I+should+not+have+hearkned+to+him+herein+%28tho+I+love+him+well%29+were+it+not+for+the+deep+A%EF%AC%80ection+and+Reverence+I+bear+to+your+Person+and+Gifts%2C+which+hath+constrained+me+%28together+with+his+importunacy%29+to+yield+to+the+sending+of+this+Discourse+to+you%2C+which+I+was+occasioned+to+write+a+year+ago+for+the+satisfaction+of+a+Neighbour-Minister+in+Points+of+this+nature.%0A%0AThe+Questions+and+Answers+in+the+beginning+of+the+Book%2C+I+delivered+and+opened+by+way+of+Catechism+long+ago%3B+which+a+Neighbour-Minister+having+afterwards+gotten+from+some+of+my+Hearers%2C+he+wrote+those+Doubts%2C+which+follow+in+the+Book%2C+the+better+to+inform+either+himself+or+me%3A+Whereupon+as+I+could+get+any+time+in+the+midst+of+other+continual+Employments+%28too+heavy+for+me%29+I+wrote+to+him+the+Discourse+following%2C+the+more+fully+to+acquaint+him+with+the+grounds+of+my+Judgment%2C+as+knowing+well+his+su%EF%AC%83ciency+to+object+fully%2C+if+he+found+himself+unsatis%EF%AC%81ed+in+any+Passage+thereof.+The+Style+%28I+confess%29+is+unmet+for+you+to+read%2C+as+being+plain+and+popular%2C+and+therefore+too+large%2C+and+withal+empty+of+variety+of+reading%2C+which+store+of+other+Occurrences+in+my+Calling+here%2C+inforceth+me+too+often+to+intermit.%0A%0AThus+much+let+me+humbly+intreat+at+your+Lordship%E2%80%99s+hands%2C+by+the+honour+which+you+owe+to+Christ%2C+and+by+the+Love+you+bare+to+his+poorest+Servants%2C+stick+not+%28I+beseech+you%29+to+advertise+me+freely+of+any+such+tenent+herein%2C+as+you+shall+think+less+safe.+I+trust+you+shall+%EF%AC%81nd+me+conscious+of+mine+own+Slenderness%2C+and+glad+to+receive+such+Light%2C+as+God+shall+be+pleased+to+impart+to+me+by+you.%0A%0AYet+this+one+thing+more+let+me+also+add.+Tho+I+yield+some+degree+of+E%EF%AC%83cacy+in+Christ%E2%80%99s+Death+unto+all%3B+yet+I+conceive+it+far+short%2C+both+of+Impetration+and+Application+of+that+gracious+Atonement%2C+which+is+there+by+wrought+to+the+Elect+of+God%3B+whence+also+it+is+that+I+dare+not+preach+the+Gospel+indifferently+unto+all%2C+before+the+Law%3B+nor+the+worth+of+Christ%2C+before+the+need+of+Christ.+Children%E2%80%99s+Bread+is+not+meet+for+Whelps%3B+and+full+Souls+will+despise+Honey-Combs.%0A%0AI+see+John+Baptist+was+sent+to+humble%2C+before+Christ+to+heal%3B+and+Christ+himself+preached+Repentance%2C+before+Faith+in+the+Promises%2C+Mark+1.+15.+Neither+do+I+remember+in+the+Gospel+any+Promise+of+Grace%2C+pardoning+Sin%2C+nor+any+Commandment+to+believe+Sin+pardoned%2C+but+to+the+broken%2C+the+bruised%2C+the+poor%2C+the+weary%2C+the+thirsty%2C+or+the+like.+Faith+in+the+Promises%2C+before+the+Heart+be+changed+from+Stoniness+to+Brokenness%2C+I+fear+is+no+better+than+the+Temporary+Faith%2C+which+is+found+in+the+stony+Soil%3B+Luke+8.+13.%0A%0ABut+I+cease+your+Lordship%E2%80%99s+further+Trouble.+Now+the+Lord+Jesus%2C+who+hath+delighted+in+you+to+%EF%AC%81ll+your+Heart+with+the+Riches+of+his+manifold+precious+Graces%2C+be+pleased+to+enlarge+you+to+the+Employment+of+them+to+his+best+advantage%2C+guide+all+your+Ways+in+his+Faithfulness%2C+and+Wisdom%2C+and+sustain+you+with+his+Mercy+and+Power+unto+the </figure><figure class="quote" id="q-dec1e4f571" data-kw="">
<blockquote><p>For in election it belongs to the absolute right that God, according to his most free good pleasure, destines sinful and guilty men to salvation; and although all are equal, yet he elects this one instead of another, as in the case with Esau and Jacob …

In reprobation, the absolute right is beheld in this – that although all men are equal, yet he passes by this one instead of another, acting from his good pleasure (eudokia) alone; not as Judge, but as an autocrat (autokrator) and Lord who has the power to make a vessel unto honour and unto dishonour (Rom. 9:21; Mt. 11:26). But the ordinate is found in this – that he reprobates and condemns no one except on account of sin (Rom. 1:32).</p></blockquote>

</figure><figure class="quote" id="q-eb68425f54" data-kw="">
<blockquote><p>More then this (Brethren) ye see the Thessalonians are elected: yet he prays for them, Making mention (sayeth he) of you in our prayers. And for this same cause; knowing that ye are elected. Mark this. The election of God, that sure ground and foundation of life and salvation, prejudges not prayer. Therefore, say not, I am elected, my salvation cannot fail, saved must I be therefore, what needs me to pray myself, or cause any other pray for me? No, by the contrary, say, I am elected, therefore, I will pray: ye are the elect, therefore, I will pray for you: that is Paul’s reason.

For, as salvation, and life is predestinate and appointed by God, so are the means of salvation appointed by God, which thou must use, if ever thou wouldst attain to life, notwithstanding of thy election. And among all the rest of the means, Prayer is one: thou who art chosen to life, prayers is a mean to thee, to be used before thou come to life: Pray must thou, and others must pray for thee, or else, thou was never chosen to life.

There was never man chosen to life from all eternity; but the Lord appointed that he should use prayer; also God ordained that he should live in holiness, and work good works, which is an other mean must be used. Ephes. 2. 10. For, if prayer be not used, if he live not holy, if he live without love, without charity and good works, if he continue so to the end, he shall find that he was never chosen.</p></blockquote>

</figure><figure class="quote" id="q-5f9fe60667" data-kw="">
<blockquote><p>For it is tyrannous if any one man appoint or make ministers at his pleasure. Therefore, this is the (most) lawful way, that those be chosen by common voices who are to take upon them any public function in the Church. And the apostles prescribe what manner [of] persons ought to be chosen, to wit, men of tried honesty and credit, men endued with wisdom and other gifts of the Spirit.

And this is the mean between tyranny and confused liberty, that nothing be done without the consent and approbation of the people, yet so that the pastors moderate and govern (this action,) that their authority may be as a bridle to keep under the people, lest they pass their bounds too much.

In the mean season, this is worth the noting, that the apostles prescribe an order unto the faithful, lest they appoint any save those which are fit. For we do God no small injury if we take all that come to hand to govern his house. Therefore, we must use great circumspection that we choose none unto the holy function of the Church unless we have some trial of him first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 235.</span></figcaption>

d it online · Reformed Covenanter</a></div>

<blockquote><p>In election, believers were from all eternity given to Jesus Christ. As believers were chosen from all eternity, so Christ was from eternity chosen and appointed to be their redeemer, and he undertook the work of redeeming them. But there was a covenant about it between the Father and Son. Christ, as we have already observed, loved them. This is the account he gives of himself, how it was with him before the world, and one thing is that then he rejoiced in the habitable parts of God’s earth and his delights were with the sons of men [Proverbs 8:31].

And when he undertook for them, he knew what success he should have. God promised him a certain number, and he had their names, as it were, written in a book; and therefore the book of life is called the Lamb’s book; Revelation 21:27, “but they that are written in the Lamb’s book of life.” And he bears their names upon his heart, as the high priest of old did the names of the tribes of the children of Israel on his breastplate [Exodus 28:29].

Christ often calls the elect those that God had given him; John 17:2, “As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him”; and again, in John 17:9, “I pray not for the world, but for them which thou hast given me”; John 17:11, “Keep through thy name those whom thou hast given me.</p></blockquote>

</figure><figure class="quote" id="q-06f4f04b52" data-kw="">
<blockquote><p>The Church of England believeth, that Predestination unto life is the eternal purpose of God, whereby before the foundations of the world were laid, he constantly decreed by his counsel unto us unknown to deliver from the curse &amp; destruction them whom he chose in Christ out of mankind, &amp; (as vessels made unto honour) through Christ to bring them to eternal salvation. Whereupon they who are endowed with so excellent benefit of God, are called according to his purpose, and that by his spirit working in a fit time.

But you Mai. [Richard] Hoo[ker]. seem to vs, to affirm contrary, when you say: If any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according to that him self willeth: Our answer is, that such suits God accepteth, in that they are conformable to his general inclination, which is that all men might be saved: yet always he granteth them not, for so much as there is in God a more private occasioned will, which determineth the contrary. Here we beg your aide to make manifest unto us, how God eternally predestinateth by a constant decree, them whom he calleth and saveth (as our Church professeth) and yet hath, as you say, a general inclination that all men might be saved:

Whether he foresaw not something that occasioned his will otherwise; so that he elected not all, but only them whom he calleth and saveth, or that of his general inclination he elected all men, but some more privately occasioned him in time to alter his will, and to refuse them; or that some men gave God occasion that he saveth them, though he never decreed it before the foundations of the world. What meant the blessed Apostle where he sayeth: Whom he predestinated them also he called: and whom he called them also he justified. &amp;c.

Is this to be understood of a constant decree, as we say, or of an inclination? He sayeth: God worketh all things after the counsel of his own will. Is this to be understood, that upon occasion sometimes he either altereth his counsel, or decreeth something which he had not thought upon before. Saint James saith, that in God there is no variableness nor shadow of turning. Is not this more then a variableness or shadow of turning to incline one way, and upon occasion to decree another.

Do not these words of yours give some place unto chance and fortune: Do they not make GOD as a man not of an all-sufficient knowledge, wisdom, and counsel, but inclinable some one way, till by occasion he find a more better way. Where is that God you speak of in your first book, of whom and through whom and for whom are all things. And where is that law by which he worketh, which you there call aeternall, and therefore can have no shew or colour of mutability.

Have we not cause to fear that the witty schoolmen have seduced you, and by their conceited distinctions made you forget, That you are neither able nor worthy to open and look into the book of God’s law, by which he guideth the world. And yet you will say, There is in God an occasioned will. Good Mai. Hoo[ker]. help us here, and shew us how we may think, that you incline not to the error of popery touching works foreseen, and that you favour our church’s belief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 15-17.</span></figcaption>

<blockquote><p>But we teach that Faith, Works, and Perseverance are posterior to Election; that this is the cause, root, fountain, whence all grace in us does flow; that our Election hath no Antecedent cause, condition, or good quality on our part, but flows merely from God’s good pleasure, and mercy looking upon us, lying in our blood, corrupted with original sin, and in that case choosing us of his free mercy to be members of his Son, to whom he will give grace and glory, though others as good and nothing worse than we are permitted to lie still in the mass of corruption for the glory of his mercy to us and justice towards them, without any ground of gloriation to the one, or complaint to the other, as if any wrong were done them, when they are past by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scotch Antidote Against the English Infection of Arminianism</cite>, (London: Samuel Gellibrand, 1652), pp 24-26.</span></figcaption>

<blockquote><p>This election supposes that the persons chosen are found amongst others. The word “election” denotes this; it signifies a choosing out. The elect are found by cleansing grace amongst the rest of mankind. They were of the company from amongst whom they are chosen. They were found amongst them not only as they dwell amongst them—elect and reprobate are found mixed together, as tares and wheat—and not only as they are of the same human nature: they are descended of the same first parents and are in the same outward condition.

But they are found amongst them in the same sinfulness and in the same misery. They are alike partakers of original corruption. They are amongst them in the guilt of the first transgression. They are amongst them in being destitute of anything in them that is good. They are amongst them in enmity against God in serving Satan and being in bondage to him. They are amongst them in condemnation to eternal destruction. They are amongst them in being without righteousness. And they are amongst them every way, so that there is no distinction between them prior to the distinction that election makes. There is no respect wherein the elect are not amongst the common multitude of mankind. ‘Tis [that] they are chosen from amongst them, and election makes a distinction; 1 Corinthians 4:7, “Who maketh thee to differ?”; 1 Corinthians 6:11, “Such were some of you.” And therefore,

(2) Nothing foreseen, foreseen excellency or endeavours of the elected, is the motive that influences God to choose them; but election is only from his good pleasure. God’s election being the first thing that causes any distinction, it can be no distinction that is already the foresight of which is to [be] considered as prior, that it influences God to choose them.

It is not the seeing of any amiableness in these above the rest that causes God to choose them rather than the rest. God don’t choose men because they are excellent, but he makes them excellent because he has chosen them. ‘Tis not because God considers them as holy that he chooses them; he chooses them that they might be holy; Ephesians 1:4–5, “According as he hath chosen us in him before the foundation of the world, that we should be holy and without blame before him in love: having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will.”

God don’t choose them from any foresight of any respect they will have to him more than others. God don’t choose men and set his love upon them because they love him, for he hath first loved us; 1 John 4:10, “not that we loved him, but that he loved us”; and 1 John 4:19, “because he first loved us.”

‘Tis not from any foresight of good works, either any good works that men do before or after conversion. But, on the contrary, men do good works because God hath chosen them; John 15:16, “Ye have not chosen me, but I have chosen you, and ordained you, that you should go and bring forth much fruit, and that your fruit should remain.”

Nor did God choose men because he foresaw that they would believe and come to Christ. Faith is the fruit of election and not the cause of it; Acts 13:48, “As many as were ordained to eternal life believed.” ‘Tis because God hath chosen men that he calls them to Christ and causes them to come to him. To suppose that election is from the foresight of faith is to place calling before election, which is contrary to the order in which the Scriptures represents things; Romans 8:30, “Whom he did predestinate, them he also called.”

‘Tis not from the foresight of any, neither moral nor natural qualifications, or any circumstances, that God chooses men: not because he sees that some men are of a more amiable make, a better natural temper, or genius, not because he foresees that some men will have better abilities and will have more wisdom than others and so will be able to do more service for God than others that he chooses, or because he foresees that they will be great and rich and so under greater advantages to do service for him; 1 Corinthians 1:27–28, “God hath chosen the foolish things of this world to confound the wise; and God hath chosen the weak things of the world to confound the things which are mighty; and base things of the world, and things which are despised, hath God chosen, yea, and things which are not, to bring to naught things that are.”

Nor is it from any foresight of men’s endeavours after conversion, because he sees that some will do much more than others to obtain heaven, that he chooses. But God chooses them and therefore awakens them and stirs them up to strive for conversion; Romans 9:16, “not of him that willeth, but of God that showeth mercy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This election supposes that the persons chosen are found amongst others. The word “election” denotes this; it signifies a choosing out. The elect are found by cleansing grace amongst the rest of mankind. They were of the company from amongst whom they are chosen. They were found amongst them not only as they dwell amongst them—elect and reprobate are found mixed together, as tares and wheat—and not only as they are of the same human nature: they are descended of the same first parents and are in the same outward condition.

But they are found amongst them in the same sinfulness and in the same misery. They are alike partakers of original corruption. They are amongst them in the guilt of the first transgression. They are amongst them in being destitute of anything in them that is good. They are amongst them in enmity against God in serving Satan and being in bondage to him. They are amongst them in condemnation to eternal destruction. They are amongst them in being without righteousness. And they are amongst them every way, so that there is no distinction between them prior to the distinction that election makes. There is no respect wherein the elect are not amongst the common multitude of mankind. ‘Tis [that] they are chosen from amongst them, and election makes a distinction; 1 Corinthians 4:7, “Who maketh thee to differ?”; 1 Corinthians 6:11, “Such were some of you.” And therefore,

(2) Nothing foreseen, foreseen excellency or endeavours of the elected, is the motive that influences God to choose them; but election is only from his good pleasure. God’s election being the first thing that causes any distinction, it can be no distinction that is already the foresight of which is to [be] considered as prior, that it influences God to choose them.

It is not the seeing of any amiableness in these above the rest that causes God to choose them rather than the rest. God don’t choose men because they are excellent, but he makes them excellent because he has chosen them. ‘Tis not because God considers them as holy that he chooses them; he chooses them that they might be holy; Ephesians 1:4–5, “According as he hath chosen us in him before the foundation of the world, that we should be holy and without blame before him in love: having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will.”

God don’t choose them from any foresight of any respect they will have to him more than others. God don’t choose men and set his love upon them because they love him, for he hath first loved us; 1 John 4:10, “not that we loved him, but that he loved us”; and 1 John 4:19, “because he first loved us.”

‘Tis not from any foresight of good works, either any good works that men do before or after conversion. But, on the contrary, men do good works because God hath chosen them; John 15:16, “Ye have not chosen me, but I have chosen you, and ordained you, that you should go and bring forth much fruit, and that your fruit should remain.”

Nor did God choose men because he foresaw that they would believe and come to Christ. Faith is the fruit of election and not the cause of it; Acts 13:48, “As many as were ordained to eternal life believed.” ‘Tis because God hath chosen men that he calls them to Christ and causes them to come to him. To suppose that election is from the foresight of faith is to place calling before election, which is contrary to the order in which the Scriptures represents things; Romans 8:30, “Whom he did predestinate, them he also called.”

‘Tis not from the foresight of any, neither moral nor natural qualifications, or any circumstances, that God chooses men: not because he sees that some men are of a more amiable make, a better natural temper, or genius, not because he foresees that some men will have better abilities and will have more wisdom than others and so will be able to do more service for God than others that he chooses, or because he foresees that they will be great and rich and so under greater advantages to do service for him; 1 Corinthians 1:27–28, “God hath chosen the foolish things of this world to confound the wise; and God hath chosen the weak things of the world to confound the things which are mighty; and base things of the world, and things which are despised, hath God chosen, yea, and things which are not, to bring to naught things that are.”

Nor is it from any foresight of men’s endeavours after conversion, because he sees that some will do much more than others to obtain heaven, that he chooses. But God chooses them and therefore awakens them and stirs them up to strive for conversion; Romans 9:16, “not of him that willeth, but of God that showeth mercy.”

<blockquote><p>Q. What believe you concerning God’s particular decree of men?

A. That God from all eternity elected some to be saved in Christ, and left others to be damned for their sins.

Q. What is the principal end that God aimed at therein?

A. The Glory of his mercy and his justice.</p></blockquote>

<blockquote><p>Tried by the political Creed of Mary [Queen of Scots], it must be confessed that Knox entertained disloyal sentiments. Mary held by the principle — to sovereigns a convenient one — of “the right divine of kings to govern wrong.” Knox, on the contrary, held that “all power is founded in a compact expressed or understood, between the rulers and he ruled, and that no one has either divine or human right to govern, save in accordance with the will of the people and the law of God.” This is the amount of all that Knox advanced in his various interviews with Mary. These opinions may have sounded strange to one reared in a despotic court, they were before their time, we admit; but the world has since seen cause to ratify them, and states of no mean name have acted upon them.

They are the very sentiments which were embodied in the famous Declaration of Independence emitted by the states of Holland twenty years afterwards. They received a signal triumph when the British nation adopted them at the revolution of 1688; and they form at this day the basis of that glorious constitution under which it is our lot to live. Branded as treason, when first uttered beneath the regal roof of Holyrood; not a day now passes but we read these same sentiments in a hundred journals, we hear them proclaimed in senates, they are acted on by cabinets, and re-echoed from the throne itself. Let us not forget that the first openly to avow them on Scottish soil was Knox. …

Not to sovereigns, not to parliaments, not to nobles did he entrust the safety of the Reformation; he knew it must preserve itself. The broad practical sagacity in which he excelled, taught him the instrumentality by which alone this could be effected. He demanded, first, a constitutional government; and second, a national system of education. Some have talked, as if these two — constitutionalism and the schoolmaster — were ideas of modern times. On the contrary, they are as old as the days of Knox.

On Knox’s principles we should have had as liberal a government and as free a people in the fifteenth century as we have in the nineteenth. He anticipated by one hundred and fifty years the liberties of the Revolution of 1688. His scheme of education, as developed in the First Book of Discipline, was higher in its literary aims, more complete in its machinery, and more extensive as regarded population, than any that has yet been offered to the nation’s acceptance. That his ideas were not fully realized was no fault of his.

The first part of his scheme was deferred for a century and a half by the wretched despotism of the Court. The second was partially defeated by the grasping avarice of the nobles, joined to the apathy of the people, nevertheless, the institutions which Knox planted, though crippled from these causes, have kept their hold of the soil, and proved vast blessings to his country.

The constitutionalism and the Presbyterianism, of which he was the first public expounder in the British Isles, have become the special mission of Britain, and wherever liberty and religion are reviving, whether in the new countries of Canada and Australia, or in the old states of Europe, they are reviving, speaking generally, upon the Scottish type, Knox’s obstructions were temporary: his work is eternal: his country will yet fulfil the great task he set her: and in the completion of the work of Knox lies the completion of that of Luther and Calvin, — the completion, in fact, of the Reformation itself. And the one beneficent, and surpassingly grand object of the Reformation, was to fill the earth with pure churches and free nations.</p></blockquote>

h+alone+this+could+be+effected.+He+demanded%2C+first%2C+a+constitutional+government%3B+and+second%2C+a+national+system+of+education.+Some+have+talked%2C+as+if+these+two+%E2%80%94+constitutionalism+and+the+schoolmaster+%E2%80%94+were+ideas+of+modern+times.+On+the+contrary%2C+they+are+as+old+as+the+days+of+Knox.%0A%0AOn+Knox%E2%80%99s+principles+we+should+have+had+as+liberal+a+government+and+as+free+a+people+in+the+fifteenth+century+as+we+have+in+the+nineteenth.+He+anticipated+by+one+hundred+and+fifty+years+the+liberties+of+the+Revolution+of+1688.+His+scheme+of+education%2C+as+developed+in+the+First+Book+of+Discipline%2C+was+higher+in+its+literary+aims%2C+more+complete+in+its+machinery%2C+and+more+extensive+as+regarded+population%2C+than+any+that+has+yet+been+offered+to+the+nation%E2%80%99s+acceptance.+That+his+ideas+were+not+fully+realized+was+no+fault+of+his.%0A%0AThe+first+part+of+his+scheme+was+deferred+for+a+century+and+a+half+by+the+wretched+despotism+of+the+Court.+The+second+was+partially+defeated+by+the+grasping+avarice+of+the+nobles%2C+joined+to+the+apathy+of+the+people%2C+nevertheless%2C+the+institutions+which+Knox+planted%2C+though+crippled+from+these+causes%2C+have+kept+their+hold+of+the+soil%2C+and+proved+vast+blessings+to+his+country.%0A%0AThe+constitutionalism+and+the+Presbyterianism%2C+of+which+he+was+the+first+public+expounder+in+the+British+Isles%2C+have+become+the+special+mission+of+Britain%2C+and+wherever+liberty+and+religion+are+reviving%2C+whether+in+the+new+countries+of+Canada+and+Australia%2C+or+in+the+old+states+of+Europe%2C+they+are+reviving%2C+speaking+generally%2C+upon+the+Scottish+type%2C+Knox%E2%80%99s+obstructions+were+temporary%3A+his+work+is+eternal%3A+his+country+will+yet+fulfil+the+great+task+he+set+her%3A+and+in+the+completion+of+the+work+of+Knox+lies+the+completion+of+that+of+Luther+and+Calvin%2C+%E2%80%94+the+completion%2C+in+fact%2C+of+the+Reformation+itself.+And+the+one+beneficent%2C+and+surpassingly+grand+object+of+the+Reformat <blockquote><p>True Christians are elect according to the foreknowledge of God the Father; they are such whom God, according to the counsel of His own will, according to His own purpose and grace, chose from all eternity to be a holy and peculiar people to Himself, to glorify Him here on earth that they might be glorified by Him hereafter in heaven. And this election evidences itself in the sanctification of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Unseen Christ (1680; Ligonier PA: Soli Deo Gloria, 1993), p. 5.</cite></span></figcaption>

</figure><figure class="quote" id="q-53678b97e2" data-kw="">
<blockquote><p>Now concerning Mr. Cotton, it may be his reputation will seem to be touched in this; but let the indifferent Reader consider what I say in my observation. Both Austin [Augustine] and other great Divines have written freely and largely of Election, but very sparingly of Reprobation; the reason whereof I conceive to be this, There appears more seeming offensive harshness in the doctrine of Reprobation, then in the doctrine of Election. Secondly, I am persuaded, they manifestly perceived, that by stating the doctrine aright in the point of Election, the truth, by just analogy and proportion, did there-hence necessarily follow in the point of Reprobation, to all judicious Divines.

Now Mr. Cotton, as I have heard, is very sound and orthodox in the point of Election; and comes to this work with a gracious intent, to clear the doctrine of Predestination (and that in the special of Reprobation) from such harsh consequences as seem to be derived there-hence; which do very frequently break forth, as I have observed, when the order of God’s decrees is not stated aright: And by experience I have found the manifold odious imputations of strange harshness laid upon God’s proceedings, and represented by the Remonstrants in their Antisynodalia Dordracena, in number 10. as I remember; but they all vanish and come to nothing upon the right ordering of God’s decrees: wherein, if any Divine fail, it may be his failing is only in a point of Logic, provided that he be orthodox in the point of grace; but if he be corrupt in that, then the more corrupt his Logic is, the better it may serve his turn for the countenancing of his erroneous ways in matter of divinity.

Lastly, I have been given to understand by Mr. [Sidrach] Simson, one of the reverend Divines of the Assembly, that Mr. Cotton upon the receiving and perusing this treatise of mine, seemed to be moved therewith not a little; and that in such a way, as not to be provoked thereby, but rather to incline to the receiving of satisfaction! Mr. Cotton is a Divine whom I never saw; but so much I have heard of his piety and parts of learning, that his name shall ever be of reverend remembrance with me. Nevertheless, because this discourse of his, whereunto I address my answer, is in the hands of many, and some of them may be strengthened in their erroneous ways, by this writing of his; and I have heard, that certain Arminians have taken advantage, to justify them in their ways, from some passages in this very discourse of Mr. Cotton’s:

Others, though orthodox, may hereby be misled into error, in such sort, as to corrupt both themselves and their brethren into such opinions (too pleasing unto flesh and blood) as may shake the orthodox doctrine of God’s free grace, in the precious points of Election, Predestination, &amp; Regeneration. This danger I desire to prevent; and upon my knowledge, my labour and pains herein have been taken in very good part, by those who are the very good friends of Mr. Cotton; and some not his good friends only, but great and right well approved of by Mr. Cotton himself; they have deserved no less at his hands. The God of all grace, bring all his into an unity of faith, in the acknowledgement of his grace, which is the only sure way unto glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), epistle unto the reader.</span></figcaption>

hub.io%2Fquote%2F53678b97e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53678b97e2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/07/william-twisse-on-john-cotton-and-the-doctrine-of-reprobation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8822cc35a3" data-kw="">
<blockquote><p>We believe a, Predestination to Life, wherein God with [an] Everlasting Purpose, has decreed by His Counsel, to bring those whom He hath Chosen in Christ out of Mankind, unto Everlasting Salvation. We can Subscribe this Article, [The Seventeenth of the Church of England’s famous XXXIX,] because we find the Sacred Epistles to the Romans and Ephesians, Expressly asserting it. And when we have Subscribed it, we shall not then Deny it, then Decry it, then Oppose it; We should Look on it, as a very Scandalous Treachery to do so.

This Election of Some to Everlasting Life, which unavoidably implies a Rejection of Others, ’tis called, Rom. XI. 5. The Election of Grace. Oh! Sovereign Grace! Why has our God, Chosen us in Christ before the Foundation of the World, and Predestinated us unto the Adoption of Children! The Praise of the Glory of His Grace, is designed in it; is displayed in it. Why are Some Taken, to be Redeemed, Converted, Saved; when Others are not so! Tis, because, I will be gracious to whom I will be gracious, saith the Infinite GOD, who gives none Account of His Matters. Tis all from Unaccountable Grace. Tis, Even so, Father, because it pleases thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace defended. A censure on the ungodliness, by which the glorious grace of God, is too commonly abused. A sermon preached on the twenty fifth day of December, 1712. Containing some seasonable admonitions of piety. And concluded, with a brief dissertation on that case, whether the penitent thief on</cite>, (Boston: Samuel Gerrish, 1712), pp 4-5.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We believe a, Predestination to Life, wherein God with [an] Everlasting Purpose, has decreed by His Counsel, to bring those whom He hath Chosen in Christ out of Mankind, unto Everlasting Salvation. We can Subscribe this Article, [The Seventeenth of the Church of England’s famous XXXIX,] because we find the Sacred Epistles to the Romans and Ephesians, Expressly asserting it. And when we have Subscribed it, we shall not then Deny it, then Decry it, then Oppose it; We should Look on it, as a very Scandalous Treachery to do so.

This Election of Some to Everlasting Life, which unavoidably implies a Rejection of Others, ’tis called, Rom. XI. 5. The Election of Grace. Oh! Sovereign Grace! Why has our God, Chosen us in Christ before the Foundation of the World, and Predestinated us unto the Adoption of Children! The Praise of the Glory of His Grace, is designed in it; is displayed in it. Why are Some Taken, to be Redeemed, Converted, Saved; when Others are not so! Tis, because, I will be gracious to whom I will be gracious, saith the Infinite GOD, who gives none Account of His Matters. Tis all from Unaccountable Grace. Tis, Even so, Father, because it pleases thee.”

— Cotton Mather, Grace defended. A censure on the ungodliness, by which the glorious grace of God, is too commonly abused. A sermon preached on the twenty fifth day of December, 1712. Containing some seasonable admonitions of piety. And concluded, with a brief dissertation on that case, whether the penitent thief on, (Boston: Samuel Gerrish, 1712), pp 4-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+believe+a%2C+Predestination+to+Life%2C+wherein+God+with+%5Ban%5D+Everlasting+Purpose%2C+has+decreed+by+His+Counsel%2C+to+bring+those+whom+He+hath+Chosen+in+Christ+out+of+Mankind%2C+unto+Everlasting+Salvation.+We+can+Subscribe+this+Article%2C+%5BThe+Seventeenth+of+the+Church+of+England%E2%80%99s+famous+XXXIX%2C%5D+because+we+find+the+Sacred+Epistles+to+the+Romans+and+Ephesians%2C+Expressly+asserting+it.+And+when+we+have+Subscribed+it%2C+we+shall+not+then+Deny+it%2C+then+Decry+it%2C+then+Oppose+it%3B+We+should+Look+on+it%2C+as+a+very+Scandalous+Treachery+to+do+so.%0A%0AThis+Election+of+Some+to+Everlasting+Life%2C+which+unavoidably+implies+a+Rejection+of+Others%2C+%E2%80%99tis+called%2C+Rom.+XI.+5.+The+Election+of+Grace.+Oh%21+Sovereign+Grace%21+Why+has+our+God%2C+Chosen+us+in+Christ+before+the+Foundation+of+the+World%2C+and+Predestinated+us+unto+the+Adoption+of+Children%21+The+Praise+of+the+Glory+of+His+Grace%2C+is+designed+in+it%3B+is+displayed+in+it.+Why+are+Some+Taken%2C+to+be+Redeemed%2C+Converted%2C+Saved%3B+when+Others+are+not+so%21+Tis%2C+because%2C+I+will+be+gracious+to+whom+I+will+be+gracious%2C+saith+the+Infinite+GOD%2C+who+gives+none+Account+of+His+Matters.+Tis+all+from+Unaccountable+Grace.+Tis%2C+Even+so%2C+Father%2C+because+it+pleases+thee.%E2%80%9D%0A%0A%E2%80%94+Cotton+Mather%2C+Grace+defended.+A+censure+on+the+ungodliness%2C+by+which+the+glorious+grace+of+God%2C+is+too+commonly+abused.+A+sermon+preached+on+the+twenty+fifth+day+of+December%2C+1712.+Containing+some+seasonable+admonitions+of+piety.+And+concluded%2C+with+a+br <blockquote><p>GOD, whose judgments no man can comprehend, whose ways cannot be found out, and whose will ought to stop all men’s mouths, according to the determinate and unchangeable purpose of his will, by the virtue whereof all things are made, yea even those things which are evil and execrable (not in that they be wrought by his divine counsel, but forasmuch as they proceed of the prince of the air, and that spirit which works in the children of disobedience) has determined from before all beginning with himself, to create all things in their time, for his glory, and namely men: whom he has made after two sorts, clean contrary one to the other.

Whereof he makes the one sort (which it pleased him to choose by his secret will and purpose) partakers of his glory through his mercy, and these we call according to the word of God, the vessels of honour, the elect, the children of promise, and predestinate to salvation: and the others, whom likewise it pleased him to ordain to damnation (that he might show forth his wrath and power, to be glorified also in them) we do call the vessels of dishonour and wrath, the reprobate and cast off from all good works.</p></blockquote>

</figure><figure class="quote" id="q-c6dad495f3" data-kw="">
<blockquote><p>And what shall we say to this; that without this Doctrine, due honour cannot be given to God, nor our faith made stable? For by the Doctrine of Predestination, that immeasurable heap of the goodness and love of God towards us, by which he loved us and respected us, before the foundations of the world were laid, doth enter into our minds. Also whatsoever light or grace God doth measure to us, is acknowledged to be a river flowing from that eternal love. By this doctrine man’s merits do fall to the ground; and the imaginary faculty of free-will in things pertaining to salvation, doth vanish away. The confidence of our salvation will also stagger, unless it be upholden by the immutable decree of God, and not by man’s free-will.

This doctrine also is a great lightning of our sorrows, and mitigation of all bitterness: while we consider that all things, even those that are most grievous, turn to the good of them, who are called by the purpose of God. Neither is there any more forcible instigation to good works, than the acknowledgement of that eternal love, wherewith God, in Christ, hath loved us before all worlds. Finally, by this doctrine we are taught to search into our selves and to try our own consciences, to find in us, and to stir up the testimonies of our election; knowing that our own endeavour and care ought to further the election of God, and that by the way of hell, that is by impenitency and unbelief it is impossible to come to heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 2, p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election.html">Election</a></span></div>

C+The+Opening+of+the+Controversies+of+These+Times+%28Formerly+Handled+in+the+Low-Countries%29+Concerning+the+Doctrine+of+Providence%2C+of+Predestination%2C+of+the+Death+of+Christ%2C+of+Nature+and+Grace%2C+%26c%2C+%281619%3B+London%3A+Nathanael+Newbery%2C+1635%29%2C+2%2C+p.+4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6dad495f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6dad495f3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/31/pierre-du-moulin-on-the-practical-implications-of-gods-eternal-love-and-predestination/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a421e261ee" data-kw="">
<blockquote><p>Cyril Lukaris (1572-1638) has often been described as the Calvinist Patriarch of Constantinople. His Confession of 1629/31 sets out his agreement with the Reformed view of unconditional election:

Chapter III

We believe that the most good God to have, before the foundation of the world, predestined unto glory those whom He has chosen, without having in any wise regard to their works, and having no actuating cause for this election, except His good pleasure, the divine mercy. In like manner to have, before the world was, rejected those whom He has rejected; and of this rejection, if any one will look to the absolute power and authority of God, he will find the undoubted cause to be the divine will; and, if again any one will turn to the laws and rules of good order which the providence above uses in the governing of the world, he will perceive the cause to be His righteousness. For God is merciful and withal righteous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 156-57.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election.html">Election</a></span></div>

We believe that the most good God to have, before the foundation of the world, predestined unto glory those whom He has chosen, without having in any wise regard to their works, and having no actuating cause for this election, except His good pleasure, the divine mercy. In like manner to have, before the world was, rejected those whom He has rejected; and of this rejection, if any one will look to the absolute power and authority of God, he will find the undoubted cause to be the divine will; and, if again any one will turn to the laws and rules of good order which the providence above uses in the governing of the world, he will perceive the cause to be His righteousness. For God is merciful and withal righteous.”

<blockquote><p>There is no universal redemption, nor universal atonement. Jesus Christ died not for all and every individual person of mankind; but for the elect only. The contrary doctrine may consist with the opinion which holds the covenant of redemption, and the covenant of grace, to be two distinct covenants; the former made with Christ, and the latter with believers; the condition of the one undertaken and performed by him, the condition of the other undertaken and performed by us. Accordingly that opinion concerning the covenant, is readily embraced by Universalists of different denominations.

But that doctrine is utterly inconsistent with this account of the covenant, which doth at once overthrow universal redemption or atonement, together with the federal conditionality of our holiness and good works, in the covenant of grace. For if the covenant of grace was made with Christ as a representative, and the elect only were the party represented by him in it; then surely the conditions of the covenant, his doing and dying, were accomplished for them only; and he died for no other: as when one hath entered into a bond of suretyship, his payment of that bond can never be reckoned a payment of their debt, whose names were not in the bond, and whom he was not surety for.</p></blockquote>

<blockquote><p>[T]hat ye hate not with any carnal hatred these blind, cruel, and malicious tyrants; but that ye learn of Christ to pray for your persecutors, (Matt. 5), lamenting and bewailing, that the devil should so prevail against them, that headlong they should run, body and soul, to perpetual perdition. And note well, that I say, we may not hate them with a carnal hatred, that is to say, only because they trouble our bodies.

For there is a spiritual hatred which David calleth a perfect hatred (Psa. 139), which the Holy Ghost engendereth in the hearts of God’s elect, against the rebellious contemners of his holy stautes; and it is, when we more lament that God’s glory is suppressed, and that Christ’s flock is defrauded of their wholesome food, than that our bodies are persecuted. With this hatred was Jeremiah inflamed, when he prayed, ‘Let me see thy vengeance taken upon thine enemies, O Lord’ (Jer. 2; 17; 20). With this hatred may we hate tyrants, and earnestly may we pray for their destruction, be they kings or queens, princes or prelates.</p></blockquote>

<blockquote><p>[W]hen we hear of the promises of God made unto us in Christ, we must not content ourselves with a bare knowledge of them, but labour to believe them, and apply them to ourselves, to our souls and consciences; and so by faith make them our own. As it is said of Abraham, and in him of all the faithful, “The blessing of Abraham came on the Gentiles, through Jesus Christ, that we might receive the promise of the Spirit through faith” (Gal. 3:14).

Further observe, the Holy Ghost sets down that particular promise which God made to Abraham in his son Isaac, to whom it was said that in Isaac should his seed be called (Gen. 21:12, Rom. 9:7). In which places it is said, that in Isaac should his seed be called. The meaning whereof is plain and thus much in effect: Ishmael shall not be thy son and heir, but Isaac is the child which shall be your heir – he it is in whom I will accomplish the promises of life and salvation made to you.

From the words thus explained, first, we must observe Paul’s collection gathered from God’s dealing with those two persons (Rom. 9:7) – namely, that God before all worlds hath chosen some men to salvation in His eternal counsel, to manifest the glory of His grace and has refused and rejected others, leaving them unto themselves, to shew forth His justice upon them.

This doctrine is gathered out of this place, after this manner. Such as is God’s practice and dealing toward men in time. Such was His eternal counsel and decree (for as God before all time determined to deal with men, so in time He dealeth with them). Now God’s practice and dealing with Isaac and Ishmael is this: Ishmael is vouchsafed to be made partaker of temporal blessings; but yet he is cut off from the spiritual covenant of grace. And Isaac is the man that must receive the covenant, and by virtue thereof be made partaker of life everlasting. And so accordingly it is with others. God has decreed to choose some men to salvation, and these are admitted into the covenant. Others He has decreed to reject, and they are cut off from the covenant and from life everlasting.

These two persons, Isaac and Ishmael, are types of these two sorts of people whom God doth elect and reject. Isaac represents those that are chosen to salvation, who become the true members of God’s church; and Ishmael is a type of those who are rejected. Now in regard of this different dealing of God with mankind, choosing some and refusing others, we must all put in practice Saint Peter’s lesson with fear and trembling being very careful, and “giving all diligence to make our election sure” (2 Peter 1:10), for all be not elected to salvation, but some are rejected. All be not Isaacs, but some are Ishmaelites. If all were elected and chosen to salvation, then no man need to care for it; but seeing some are rejected, and never vouchsafed to come within the covenant indeed, therefore it standeth us greatly in hand to take the good counsel of the apostle and to give all diligence to make our election sure.

Secondly, whereas it is said, “Not in Ishmael, but in Isaac shall thy seed be called,” we may we may note the state of God’s church in this world in regard of the different sorts of men that live therein. For Abraham’s family was God’s church in those days, and therein were both Isaac and Ishmael – though both his children, yet far differing in estate before God. Ishmael indeed was born in the church, and there brought up, taught and circumcised; but yet he was without the Covenant in God’s sight.

Now Isaac was not only born and brought up in the church, and circumcised, but also received into the covenant, and herein differed far from Ishmael; for he is the son of Abraham in whom God will continue the covenant of grace unto life everlasting, to his posterity. And so it is with God’s church at this day. In it there be two sorts of men; one, which are baptised and brought up in the church, hear the Word and receive the sacraments, but yet are not saved because they have not the promise of the covenant effectually rooted in their hearts. The other sort are they which, being baptised in the church, hear the Word effectually and receive the Lord’s Supper worthily to their salvation, because God does establish His covenant in their hearts.

This difference is plain in Scripture, in the parables of the dragnet (Matthew 13), of the sower, and of the tares, as also by Christ’s behaviour at the last judgment (25:32), severing the sheep from the goats, both which live together in the church. And by Saint Paul, who speaking of those which are born and brought up in the church, saith that some are children of the flesh, and some children of the promise (Rom. 9:8).

This being so, that every one which lives in the church is not of the church – that is, is not a true member of the church and a true child of Abraham; it must make us all careful to use all holy means whereby we may be fully assured that the covenant of grace belongs unto us. For it is not enough for us to dwell in the church, to hear the Word, and to receive the sacraments (for so did Ishmael, and yet never was saved), unless therewithal we have the covenant of grace belonging to us, and the assurance thereof sealed in our consciences by God’s Holy Spirit.

Again, consider who spake these words: But in Isaac shall thy seed be called. We shall find (Gen. 21:12) that it was God Himself. “Let it not,” says God unto Abraham, “be grievous in thy sight for the child, and for the bondwoman; in all that Sarah shall say unto thee, hear her voice” – which was to “cast out the bondwoman and her son Ishmael. For (saith God) in Isaac shall thy seed be called.”

Here observe a notable practice of Abraham, as a good direction how we ought to judge of all those that live in the church, submitting themselves outwardly to the ministry and regimen thereof. Abraham here hath two sons, Isaac and Ishmael; he circumciseth them both, and instructs them both (for he “taught all his household” to know God, and to fear and obey Him [18:19]), he judgeth them both to be in one state in regards of God’s Covenant; though they were not; but that difference is made by God.

Abraham does not on his own head, and by his own will, put Ishmael out of the church, which was his family. But God bids him put him out, and then he put him out, and not before till such time he kept him in, and held him to be within the covenant, as well as Isaac was. Even so must we deal towards those that live in the church; secret judgment must be left to God; and, till God manifest the contrary, in the judgment of charity, we must hold them all elect.

This is the practice of Saint Paul in all his epistles. Writing to Corinth, he calls them “all sanctified” (1 Cor. 1:2); and to the Galatians (1:2), he calls them “all elect” – speaking so in the judgment of charity, although he knew that among them there were many profane and wicked men, and though he reprove many great errors and heinous sins amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 235-37.</span></figcaption>

— William Perkins, A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 235-37.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BW%5Dhen+we+hear+of+the+promises+of+God+made+unto+us+in+Christ%2C+we+must+not+content+ourselves+with+a+bare+knowledge+of+them%2C+but+labour+to+believe+them%2C+and+apply+them+to+ourselves%2C+to+our+souls+and+consciences%3B+and+so+by+faith+make+them+our+own.+As+it+is+said+of+Abraham%2C+and+in+him+of+all+the+faithful%2C+%E2%80%9CThe+blessing+of+Abraham+came+on+the+Gentiles%2C+through+Jesus+Christ%2C+that+we+might+receive+the+promise+of+the+Spirit+through+faith%E2%80%9D+%28Gal.+3%3A14%29.%0A%0AFurther+observe%2C+the+Holy+Ghost+sets+down+that+particular+promise+which+God+made+to+Abraham+in+his+son+Isaac%2C+to+whom+it+was+said+that+in+Isaac+should+his+seed+be+called+%28Gen.+21%3A12%2C+Rom.+9%3A7%29.+In+which+places+it+is+said%2C+that+in+Isaac+should+his+seed+be+called.+The+meaning+whereof+is+plain+and+thus+much+in+effect%3A+Ishmael+shall+not+be+thy+son+and+heir%2C+but+Isaac+is+the+child+which+shall+be+your+heir+%E2%80%93+he+it+is+in+whom+I+will+accomplish+the+promises+of+life+and+salvation+made+to+you.%0A%0AFrom+the+words+thus+explained%2C+first%2C+we+must+observe+Paul%E2%80%99s+collection+gathered+from+God%E2%80%99s+dealing+with+those+two+persons+%28Rom.+9%3A7%29+%E2%80%93+namely%2C+that+God+before+all+worlds+hath+chosen+some+men+to+salvation+in+His+eternal+counsel%2C+to+manifest+the+glory+of+His+grace+and+has+refused+and+rejected+others%2C+leaving+them+unto+themselves%2C+to+shew+forth+His+justice+upon+them.%0A%0AThis+doctrine+is+gathered+out+of+this+place%2C+after+this+manner.+Such+as+is+God%E2%80%99s+practice+and+dealing+toward+men+in+time.+Such+was+His+eternal+counsel+and+decree+%28for+as+God+before+all+time+determined+to+deal+with+men%2C+so+in+time+He+dealeth+with+them%29.+Now+God%E2%80%99s+practice+and+dealing+with+Isaac+and+Ishmael+is+this%3A+Ishmael+is+vouchsafed+to+be+made+partaker+of+temporal+blessings%3B+but+yet+he+is+cut+off+from+the+spiritual+covenant+of+grace.+And+Isaac+is+the+man+that+must+receive+the+covenant%2C+and+by+virtue+thereof+be+made+partaker+of+life+everlasting.+And+so+accordingly+it+is+with+others.+God+has+decreed+to+choose+some+men+to+salvation%2C+and+these+are+admitted+into+the+covenant.+Others+He+has+decreed+to+reject%2C+and+they+are+cut+off+from+the+covenant+and+from+life+everlasting.%0A%0AThese+two+persons%2C+Isaac+and+Ishmael%2C+are+types+of+these+two+sorts+of+people+whom+God+doth+elect+and+reject.+Isaac+represents+those+that+are+chosen+to+salvation%2C+who+become+the+true+members+of+God%E2%80%99s+church%3B+and+Ishmael+is+a+type+of+those+who+are+rejected.+Now+in+regard+of+this+different+dealing+of+God+with+mankind%2C+choosing+some+and+refusing+others%2C+we+must+all+put+in+practice+Saint+Peter%E2%80%99s+lesson+with+fear+and+trembling+being+very+careful%2C+and+%E2%80%9Cgiving+all+diligence+to+make+our+election+sure%E2%80%9D+%282+Peter+1%3A10%29%2C+for+all+be+not+elected+to+salvation%2C+but+some+are+rejected.+All+be+not+Isaacs%2C+but+some+are+Ishmaelites.+If+all+were+elected+and+chosen+to+salvation%2C+then+no+man+need+to+care+for+it%3B+but+seeing+some+are+rejected%2C+and+never+vouchsafed+to+come+within+the+covenant+indeed%2C+therefore+it+standeth+us+greatly+in+hand+to+take+the+good+counsel+of+the+apostle+and+to+give+all+diligence+to+make+our+election+sure.%0A%0ASecondly%2C+whereas+it+is+said%2C+%E2%80%9CNot+in+Ishmael%2C+but+in+Isaac+shall+thy+seed+be+called%2C%E2%80%9D+we+may+we+may+note+the+state+of+God%E2%80%99s+church+in+this+world+in+regard+of+the+different+sorts+of+men+that+live+therein.+For+Abraham%E2%80%99s+family+was+God%E2%80%99s+church+in+those+days%2C+and+therein+were+both+Isaac+and+Ishmael+%E2%80%93+though+both+his+children%2C+yet+far+differing+in+estate+before+God.+Ishmael+indeed+was+born+in+the+church%2C+and+there+brought+up%2C+taught+and+circumcised%3B+but+yet+he+was+without+the+Covenant+in+God%E2%80%99s+sight.%0A%0ANow+Isaac+was+not+only+born+and+brought+up+in+the+church%2C+and+circumcised%2C+but+also+received+into+the+covenant%2C+and+herein+differed+far+from+Ishmael%3B+for+he+is+the+son+of+Abraham+in+whom+God+will+continue+the+covenant+of+grace+unto+life+everlasting%2C+to+his+posterity.+And+so+it+is+with+God%E2%80%99s+church+at+this+day.+In+it+there+be+two+sorts+of+men%3B+one%2C+which+are+baptised+and+brought+up+in+the+church%2C+hear+the+Word+and+receive+the+sacraments%2C+but+yet+are+not+saved+because+they+have+not+the+promise+of+the+covenant+effectually+rooted+in+their+hearts.+The+other+sort+are+they+which%2C+being+baptised+in+the+church%2C+hear+the+Word+effectually+and+receive+the+Lord%E2%80%99s+Supper+worthily+to+their+salvation%2C+because+God+does+establish+His+covenant+in+their+hearts.%0A%0AThis+difference+is+plain+in+Scripture%2C+in+the+parables+of+the+dragnet+%28Matthew+13%29%2C+of+the+sower%2C+and+of+the+tares%2C+as+also+by+Christ%E2%80%99s+behaviour+at+the+last+judgment+%2825%3A32%29%2C+severing+the+sheep+from+the+goats%2C+both+which+live+together+in+the+church.+And+by+Saint+Paul%2C+who+speaking+of+those+which+are+born+and+brought+up+in+the+church%2C+saith+that+some+are+children+of+the+flesh%2C+and+some+children+of+the+promise+%28Rom.+9%3A8%29.%0A%0AThis+being+so%2C+that+every+one+which+lives+in+the+church+is+not+of+the+church+%E2%80%93+that+is%2C+is+not+a+true+member+of+the+church+and+a+true+child+of+Abraham%3B+it+must+make+us+all+careful+to+use+all+holy+means+whereby+we+may+be+fully+assured+that+the+covenant+of+grace+belongs+unto+us.+For+it+is+not+enough+for+us+to+dwell+in+the+church%2C+to+hear+the+Word%2C+and+to+receive+the+sacraments+%28for+so+did+Ishmael%2C+and+yet+never+was+saved%29%2C+unless+therewithal+we+have+the+covenant+of+grace+belonging+to+us%2C+and+the+assurance+thereof+sealed+in+our+consciences+by+God%E2%80%99s+Holy+Spirit.%0A%0AAgain%2C+consider+who+spake+these+words%3A+But+in+Isaac+shall+thy+seed+be+called.+We+shall+find+%28Gen.+21%3A12%29+that+it+was+God+Himself.+%E2%80%9CLet+it+not%2C%E2%80%9D+says+God+unto+Abraham%2C+%E2%80%9Cbe+grievous+in+thy+sight+for+the+child%2C+and+for+the+bondwoman%3B+in+all+that+Sarah+shall+say+unto+thee%2C+hear+her+voice%E2%80%9D+%E2%80%93+which+was+to+%E2%80%9Ccast+out+the+bondwoman+and+her+son+Ishmael.+For+%28saith+God%29+in+Isaac+shall+thy+seed+be+called.%E2%80%9D%0A%0AHere+observe+a+notable+practice+of+Abraham%2C+as+a+good+direction+how+we+ought+to+judge+of+all+those+that+live+in+the+church%2C+submitting+themselves+outwardly+to+the+ministry+and+regimen+thereof.+Abraham+here+hath+two+sons%2C+Isaac+and+Ishmael%3B+he+circumciseth+them+both%2C+and+instructs+them+both+%28for+he+%E2%80%9Ctaught+all+his+household%E2%80%9D+to+know+God%2C+and+to+fear+and+obey+Him+%5B18%3A19%5D%29%2C+he+judgeth+them+both+to+be+in+one+state+in+regards+of+God%E2%80%99s+Covenant%3B+though+they+were+not%3B+but+that+difference+is+made+by+God.%0A%0AAbraham+does+not+on+his+own+head%2C+and+by+his+own+will%2C+put+Ishmael+out+of+the+church%2C+which+was+his+family.+But+God+bids+him+put+him+out%2C+and+then+he+put+him+out%2C+and+not+before+till+such+time+he+kept+him+in%2C+and+held+him+to+be+within+the+covenant%2C+as+well+as+Isaac+was.+Even+so+must+we+deal+towards+those+that+live+in+the+church%3B+secret+judgment+must+be+left+to+God%3B+and%2C+till+God+manifest+the+contrary%2C+in+the+judgment+of+charity%2C+we+must+hold+them+all+elect.%0A%0AThis+is+the+practice+of+Saint+Paul+in+all+his+epistles.+Writing+to+Corinth%2C+he+calls+them+%E2%80%9Call+sanctified%E2%80%9D+%281+Cor.+1%3A2%29%3B+and+to+the+Galatians+%281%3A2%29%2C+he+calls+them+%E2%80%9Call+elect%E2%80%9D+%E2%80%93+speaking+so+in+the+judgment+of+charity%2C+although+he+knew+that+among+them+there+were+many+profane+and+wicked+men%2C+and+though+he+reprove+many+great+errors+and+heinous+sins+amongst+them.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Cloud+of+Faithful+Witnesses%2C+Leading+to+the+Heavenly+Canaan%3A+Or%2C+A+Commentary+upon+the+11th+Chapter+to+the+Hebrews%2C+%281609%29+in+The+Works+of+William+Perkins%3A+Volume+3%2C+eds+Randall+J.+Pederson+and+Ryan+M.+Hurd+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2017%29%2C+pp+235-37.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F73eb21e456.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/73eb21e456.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/25/william-perkins-on-the-covenant-election-and-the-visible-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cdb11597b3" data-kw="">
<blockquote><p>Nay, brethren, ye are ordained of God to rule and govern your own houses in God’s true fear, and according to his holy Word – within your own houses, I say, in some cases ye are bishops and kings; your wives, children, and family are your bishopric and charge; of you it shall be required how carefully and diligently ye have instructed them in God’s true knowledge; how ye have studied, in them to plant virtue, and to repress vice. And therefore I say, ye must make them partakers in reading, exhortation, and in making common prayers; which I would, in every house were used once a day at least. But above all things, dear brethren, study to practise in life that which the Lord commands, and then ye assured, that ye shall never hear nor read the same without fruit. And this much for the exercises within your houses.</p></blockquote>

</figure><figure class="quote" id="q-b324cf7a33" data-kw="">
<blockquote><p>For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life. (John 3:16)

That whosoever believeth on him may not perish. It is a remarkable commendation of faith, that it frees us from everlasting destruction. For he intended expressly to state that, though we appear to have been born to death, undoubted deliverance is offered to us by the faith of Christ; and, therefore, that we ought not to fear death, which otherwise hangs over us. And he has employed the universal term whosoever, both to invite all indiscriminately to partake of life, and to cut off every excuse from unbelievers. Such is also the import of the term World, which he formerly used; for though nothing will be found in the world that is worthy of the favour of God, yet he shows himself to be reconciled to the whole world, when he invites all men without exception to the faith of Christ, which is nothing else than an entrance into life.

Let us remember, on the other hand, that while life is promised universally to all who believe in Christ, still faith is not common to all. For Christ is made known and held out to the view of all, but the elect alone are they whose eyes God opens, that they may seek him by faith. Here, too, is displayed a wonderful effect of faith; for by it we receive Christ such as he is given to us by the Father — that is, as having freed us from the condemnation of eternal death, and made us heirs of eternal life, because, by the sacrifice of his death, he has atoned for our sins, that nothing may prevent God from acknowledging us as his sons. Since, therefore, faith embraces Christ, with the efficacy of his death and the fruit of his resurrection, we need not wonder if by it we obtain likewise the life of Christ.</p></blockquote>

</figure><figure class="quote" id="q-5de19dbffc" data-kw="">
<blockquote><p>How the Lord threatened plague after plague, and ever the last to be the sorest, till finally he will consume realms and nations if they repent not, read chapter 26 of Leviticus, which chapter oft I have willed you to mark, as yet I do unfeignedly. And think not that it appertaineth to the Jews only. No, brethren; the prophets are the interpreters of the law, and they make the plagues of God common to all offenders, the punishment ever beginning at the house-hold of God. […]

The prophets Isaiah, Jeremiah, Ezekiel, after they had proclaimed plagues to fall upon the people of Israel, and upon the house of Judah, prophesy particularly against certain nations and cities, nor only adjacent in circuit about Jerusalem, but also against such as were far distant; as against Moab, Ammon, Palestine, Egypt, Tyre, Damascus, and Babylon (Isa. 13; 15; 17; 18; 19; 20; 23; Jer. 59; 51; Ezek. 25; 26; 27). And in conclusion, general prophecies are spoken against all inobedient and sinful nations, as in chapter 24 of Isaiah plainly appeareth; as also, the Lord commanding Jeremiah to give the cup of his wrath to all nations, one after another; who should drink of the same, although they refused it of his hand (Jer. 25): that is, albeit they would not believe the voice of the prophet, yet should they not escape the plagues that he spoke: ‘For every nation like unto this, shall I punish, saith the Lord of Hosts’ (Jer. 5). With the same agreeth Amos, saying, ‘The eyes of the Lord are upon every sinful nation, to root it out of the earth’ (Amos 9). These, and many more places, evidently prove, that the plagues spoken of in the law of God, appertain to every rebellious people, be they Jew or be they Gentile, Christians in title, or Turks in profession. And the ground of the prophets was the same, which before I have rehearsed for my assurances that England shall be plagued; which is, God’s immutable and inviolable justice, that cannot spare in one realm and nation, those offences that most severely he hath punished in another: for so were he unequal, and to make differences, as touching execution of his just judgments betwixt person and person; which is most contrarious to the integrity of his justice.</p></blockquote>

<blockquote><p>[T]hose that have condemned me (the whole rabble of the papistical clergy) have declined from the true faith, have given ear to deceivable spirits and to doctrine of devils, are the stars fallen from the heaven to earth, are fountains without water, and finally are enemies to Christ Jesus, deniers of His virtue and horrible blasphemers of His death and passion.

And further, as that visible church had no crime whereof justly they could accuse either the Prophets either the Apostles, except their doctrine only, so have no such as seek my blood other crime to lay my charge except that I affirm, as always I offer to prove, that the religion which now is maintained by fire and sword is no less contrarious to the true religion taught and established by the Apostles than is darkness to light or the devil to God; and also that such as now do claim the title and name of the church are not more the elect spouse of Christ Jesus than was the synagogue of the Jews the true Church of God what time it crucified Christ Jesus, damned His doctrine and persecuted His Apostles.</p></blockquote>

<blockquote><p>In the following extract, John Knox explains that the civil magistrate is to rule according to scripture alone. Libertarian Theologians and the advocates of Two-Kingdoms establishmentarianism agree that the role of the state is determined by the word of God. They differ, however, when it comes to determining precisely what the role of the state is. Upon first reading, we might be tempted to think that Knox’s argument supports Libertarian Theology; for this reason, footnotes have been added to elucidate Knox’s meaning:

St Paul in few words declareth the end wherefore the sword is committed to the powers, saying, it is ‘to the punishment of the the wicked doers, and to the praise of such as do well’ (Rom. 13). Of which words it is evident, that the sword of God is not committed to the hand of man, to use as it pleaseth him; but only, to punish vice, maintain virtue,[1] that men may live in such society as before God is acceptable. And this is the very and only cause why God hath appointed powers in this earth. For such is the furious rage of man’s corrupt nature, that unless severe punishment were appointed, and put in execution upon malefactors, better it were that man should live among brute and wild beasts, than among men. But at present, I dare not enter into the description of this common-place, for so should I not satisfy the text, which by God’s grace I purpose to absolve [open up]. This only by the way I would, that such as are placed in authority, should consider, whether they reign and rule by God, so that God ruleth them; or, if they rule without, besides, and against God; of whom our prophet here doth complain.

If any lust to take trial of this point, it is not hard; for Moses in the election of judges, and of a king, describeth not only what persons shall be chosen to that honour, but doth also give to him that is elected and chosen, the rule, by the which he shall try himself whether God reign in him or not; saying, ‘When he shall sit upon the throne of his kingdom, he shall write to himself an exemplar of this law in a book, but the priests the Levites: it shall be with him, and he shall read therein all the days of his life, that he may learn to fear the Lord his God, and to keep all the words of this law, and these statutes, that he may do them; that his heart be not lifted up above his brethren, and that he turn not from the commandment, to the right hand, or to the left (Deut. 17). The same is repeated to Joshua, in his inauguration to the government of the people, by God himself, saying, ‘Let not the book of this law depart from thy mouth, but mediate in it day and night, that thou mayest keep and do all that which is written in it. For then shall thy way be prosperous, and thou shalt do prudently’ (Josh. 1).[2]

The first thing then that God craveth of him that is called to the honour of a king, is, the knowledge of his will revealed in his Word: the second, is an upright and willing mind to put in execution such things as God commandeth in his law, without declining either to the right hand or to the left.

Kings then have not absolute power to do in their regiment what pleaseth them; but their power is limited by God’s Word. So that if they strike where God commandeth not, they are but murderers; and if, they spare, where God commandeth to strike, they and their throne are criminal, and guilty of the wickedness that aboundeth upon the face of the earth for lack of punishment. Oh, if kings and princes would consider what account shall be craved of them, as well of their ignorance and misknowledge of God’s will, as for the neglecting of their office!</p></blockquote>

pon+the+face+of+the+earth+for+lack+of+punishment.+Oh%2C+if+kings+and+princes+would+consider+what+account+shall+be+craved+of+them%2C+as+well+of+their+ignorance+and+misknowledge+of+God%E2%80%99s+will%2C+as+for+the+neglecting+of+their+office%21%E2%80%9D%0A%0A%E2%80%94+John+Knox%2C+A+sermon+preached+by+John+Knox%2C+minister+of+Christ+Jesus%2C+in+the+church+of+Edinburgh%2C+upon+Sunday%2C+August+19%2C+1565%2C+for+the+which+he+has+forbidden+to+preach+for+a+season+in+R.+S.+Candlish+%28ed.%29%2C+Select+practical+writings+of+John+Knox&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5959a001fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5959a001fb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/06/06/john-knox-on-sola-scriptura-and-the-state/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cdc33fd05c" data-kw="">
<blockquote><p>But if ye contemn or refuse God, who thus lovingly offereth unto you salvation and life, ye shall neither escape plagues temporal, which shortly shall apprehend you, neither yet the torment prepared for the devil and for his angels, except by speedy repentance ye return to the Lord, whom you now refuse, if you refuse the messengers of his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Address to the Commonality of Scotland (1558) in R. S. Candlish (ed.), Select Practical Writings of John Knox</cite></span></figcaption>

</figure><figure class="quote" id="q-6408cc63c8" data-kw="">
<blockquote><p>For what is more blasphemous, then to affirm that such as believe in the Godhead of three distinct Persons, have no true God, but the illusion of Devils: That Christ Jesus is not the Eternal Son of the Eternal Father: That there is no distinction betwixt the Father and the Son but in imagination only: That Christ hath no participation of man’s nature, but that his flesh is from heaven; yea, that it is the flesh of the Godhead: That in stocks, stones, and all creatures, is the substantial Godhead?

If these, I say, be not blasphemies worthy of ten thousand deaths, especially being obstinately maintained against all wholesome admonition, let all those that fear God judge; yea, even you yourselves, how furious that ever ye be, judge in the matter, even as ye will answer before the throne of the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An answer to a great number of blasphemous cavilations written by an Anabaptist, and adversary to God’s eternal predestination</cite>, (1560) in The Works of John Knox, ed. David Laing (6 vols, Edinburgh, 1856), 5: 228.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-9aa9e0dab1" data-kw="">
<blockquote><p>But if the law of God be diligently searched, this doubt shall easily be resolved. For it will witness that no less ought the murderer, the blasphemer, and such other, to suffer the death, then that the meek and the fearer of God should be defended. And also, that such as maintain and defend the one, are no less criminal before God then those that oppress the others. […] Now to you justifiers of Servetus: Servetus was an abominable blasphemer against God; and you are justifiers of Servetus: therefore ye are blasphemers before God, like abominable as he was. […] Ye will not easily admit that Servetus be convicted of blasphemy; for if he be, ye must be compelled to confess (except that ye will refuse God) that the sentence of death executed against him was not cruelty; neither yet that the judges who justly pronounced that sentence were murderers nor persecutors; but that this death was the execution of God’s judgement, and they the true faithful servants of God, who, when no other remedy was found, did take away iniquity from amongst them. That God hath appointed death by his law, without mercy, to be executed upon the blasphemers, is evident by that which is written, Leviticus 24.</p></blockquote>

<figure class="quote" id="q-d0afab6277" data-kw="">
<blockquote><p>Christ took the seed of Abraham, he took it not of Angels

So that be became like to his brethren in all things

Sin only except, thus plainly Paul tells,

Where came he by this flesh, which amongst us he brings?

Had he feathers as well as flesh, and came down with wings?

Christ came to be a mediator, it was requisite that he

Should be partaker of the godhead, and of our humanity.

Christ preached the word, and sowed forth good seeds,

The Apostles travailed, and took great pains,

But Beelzebub bestirred him, and up came the weeds

Which shortly spring up in fantastical brains.

Such Devilish deceivers the Devil entertains.

Many entered in John’s time which would not confess:

That our Saviour Jesus Christ was come in the flesh.

It seemed most meet to God’s high providence

And also most necessary for our redemption,

That where the first man in our nature committed disobedience.

The second Man Christ should make satisfaction.

Repair and recompense in the same nature and parson

And pay the pain of sin this was not omitted

In the flesh of man wherein it was committed.</p></blockquote>

</figure><figure class="quote" id="q-7a71c420bb" data-kw="">
<blockquote><p>Matth. 26. 39. And he went a little further, and fell on his face, and prayed, saying, O my Father, if it be possible, let this Cup pass from me; Nevertheless, not as I will, but as thou wilt.

THE Words are our Saviour’s Prayer at his private Passion in the Garden. In Paradise was the first Scene of Man‘s Sin, and in a Garden the first Scene of Christ’s Sorrows.

He was now in the near view of his extreme Sufferings; the fatal hour approached when he was to die with all the concurrent circumstances of Shame and Cruelty. His Nature was Human and Holy, and therefore apprehensive of Misery and the Wrath of God. In this Exigency He fell on his Face, a posture of humble Reverence, and with earnestness prayed, saying, O my Father, an expression of his steadfast Trust in the Love of God: If it be possible, not with respect to his Absolute Power, for by that he could easily have preserved him; but with respect to his Sovereign Pleasure, and Eternal Decree: Let this Cup pass from me, that implies a complete Deliverance from the rage of the Powers of Darkness, and of the perverted World in conjunction with them. He suffered innocent Nature to act as Nature, for he submitted to our Infirmities, but without our Imperfections.

Nevertheless not as I will, but as thou wilt: His Petition was qualified with an Act of Submission; the desire of his Nature, that recoiled from such Sufferings, was overruled by the resignation of Grace. There was no repugnancy, but a subordination between the Sensitive Will and the rational Will, directed by his Mind, that foresaw the blessed effects of his Sufferings, the Glory of God, with the Salvation of lost Mankind. And that just horror, with the strong aversion of his Nature from such a terrible Death, renders his willingness more conspicuous and meritorious. As Man, the apprehension of it put him into an Agony; but as Mediator, by a firm resolution and clear choice he submitted to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour</cite>, (London: Brabazon Aylmer, 1684), pp 1-4.</span></figcaption>

</figure><figure class="quote" id="q-f6dd3ca899" data-kw="">
<blockquote><p>WHEN the Son of God became the Son of man, he so became the Son of man as still to remain the Son of God. He did not lay aside his Divine nature to assume the human; but he assumed the human nature into the Divine, not as it was corrupted by sin, but as it was at first created by God. For as it was corrupted by sin, it was corrupted with the worst of evils, and therefore, as such, both unworthy and uncapable of being united to God, the best of goods. Who therefore assuming the human nature into the unity of his Divine Person, assumed only what was worthy and capable of such assumption, to wit, the perfect nature of man as it was in its first creation, not as it was in its sinful corruption. And so he that was perfectly God as well as perfectly man, was a perfect man also as well as a perfect God.

Because it was the perfect nature of man which he assumed from his mother in time, as it was the perfect nature of God which he received of his Father from eternity. And therefore as he in the truth of the Divine nature was begotten like unto the Father in all things, his personal properties only excepted; so in the truth of the human nature he was made like unto us in all things, our sinful infirmities only excepted. He was in all things but sin like unto us; but in sin he was altogether unlike us. For we both in flesh and spirit are naturally full of sin, but he was clearly void of sin both in his flesh and spirit.

For he came to be a Lamb without spot, who by sacrifice of himself once made should take away the sins of the world: whereas had he been guilty of sin in himself, he could never have taken it away from us. … As God, he was infinitely contrary unto sin; and as man, he was perfectly void of it: yea he was therefore as man perfectly void of sin, because as God he was infinitely contrary to it; it being impossible that such things as are infinitely contrary to one another should be ever united together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 326-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-1246e039cc" data-kw="">
<blockquote><p>As certainly, then, as we are the descendants of the first man created in the image of God, and by transgression fallen from his primaeval condition of holiness, dignity, and happiness, and thus made liable to misery here and to everlasting destruction from the presence of the Lord and from the glory of his power hereafter, so assuredly we inherit a nature corrupted by the spiritual disease which, prevailing against him, brought him low, and incur the penalty of that doom to which he was adjudged by the sentence pronounced on the very spot which had been the scene of his rebellion. “As by one man sin entered into the world, and death by sin, so death hath passed upon all men, for that all have sinned.”

This doctrine has been often derided and loudly anathematised as unworthy of the belief of any but the slaves of a wretched superstition;—the rational thinker laughs to scorn such an absurdity. But if the Word of God were silent on the subject, instead of being as express on the point as language can be, the existence of moral evil is manifest in the experience of every man born of woman, and proclaimed by the accusings of conscience even before the individual who is the object of their attack has been savingly awakened to a sense of his guilt, and renewed in the spirit of his mind, and before he can joyfully declare that with him old things have passed away, and that all things are become new.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>Vers. 3. Blessed be the God and Father of our Lord Jesus Christ, who hath blessed us with all spiritual blessings in heavenly places in Christ.

After the Preface follows the Thanksgiving, containing a Proposition to be proved in the first part of this Chapter, which is this; That the Grace of God in Christ ought to be celebrated with an acknowledgement of God’s blessing towards us, in the whole business of the Salvation of Believers: For our blessing, as it hath relation to God, is nothing else but an acknowledgement that God is every way the Author of all blessing or Grace towards us.

In this Proposition he puts a difference between God the Father, and Jesus Christ the Mediator God-man, that the person and office of the Mediator might more manifestly appear. And he calls God the Father the God of Christ, (1) Because of that Grace, whereby the human nature of Christ was predestinated to the personal union with the Word, his Son. (2) Because of the Covenant of Redemption made between God and Christ the Mediator. And then he calls him the Father of Jesus Christ, (1) Because of the eternal Generation of the Son, by which the Father hath from all eternity communicated to him his whole infinite essence. (2) Because of the personal union of the assumed human Nature, by which the Son of man is made the Son of God. The chief Arguments to prove the aforesaid Proposition are Thirteen.

Hath blessed] Arg. 1. The God and Father of Christ hath blessed us believers, or hath graciously heapt upon us all spiritual and heavenly blessings in Christ. Therefore he is to be blessed, or his grace is to be celebrated by us: To this purpose, that the grace of God might appear and be celebrated, all the words of this Argument tend, every one whereof breathes our grace. For (1.) The giver of these benefits is called God, and the Father of Jesus Christ, and by consequence the God and Father of all us which are in Christ, and that from the Covenant made between the Father and Christ concerning us; and consequently our Father, who with a fatherly affection gives us all things.

Hath blessed] 2. The giving of these benefits is actively called the blessing of God, that is, the actual or effectual demonstration of God’s grace (according to his word) in deed towards us.

Hath blessed us] (3.) And here is grace. For we whom God blesseth, are by nature the sons of wrath, and liable to the curse of God, in whom there is nothing, nor can be any thing, which can deserve any good.

With all blessing] (4.) The nature and matter of the benefits themselves includes grace; for a blessing taken passively, is nothing else but a benefit, taking its rise from mere grace.

Spiritual blessings] (5) Here is grace also; For the benefits which are bestowed on us before others are spiritual, such as have reference to the eternal salvation of the spirit or soul, which do far exceed all measure of proportion to any earthly and temporal works, which we can perform in this body, and therefore they are of grace.

All blessing] (6.) This tends to grace too. Because every spiritual gift, which pertains to the salvation of souls, is bestowed upon us; of which gifts there is none, which flows not from the fountain of grace and blessing, and is freely given to us without any merit of ours, or respect to our works, whether they be knowledge of God, or acknowledgement of our sin, or repentance, or faith, or any effect of faith, or any good work, or intention of a good work: all this is freely given by him, who blesseth us with all spiritual blessing: Therefore they are of grace.

In heaven] Here is a beam of grace too, because these benefits, with which we, above others, are blessed, are heavenly, that is, they are such as take their original from heaven, are conversant in heaven, and shall be completed in heaven; nor do they any ways savour any thing of our flesh, but yet do season to us our condition on earth.

In Christ] Here the whole ocean of grace is opened for all these benefits are ours in Christ, who himself is ours, and all these are made ours in him, as in the root and fountain, as in our head and common parent, before they come to us, that so they may be derived on us by him: in whom as we are united together, we possess those things we have, and in whom we have right to those things which as yet we have not, and by whom we shall hereafter receive those things which remain; and as he hath obtained all things for us, so he keeps both them in himself for our use, and us that we may use and enjoy them. From all, and every one of which it follows, that all our spiritual benefits are free and gracious, or effects of mere grace, and therefore we ought to celebrate the grace of God as the fountain and cause of them.</p></blockquote>

venanter.wordpress.com/2020/12/10/david-dickson-on-gods-blessings-in-christ-the-mediator/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Christ was incarnate in the Womb of the Virgin, and thereby was personally united to our flesh; which is the highest advancement of the human nature, that can be conceived, Heb. 2.16. For verily he took not upon him the nature of Angels, but the seed of Abraham; Christ assumed man’s nature, being God from all Eternity; he took on him the one, to the other; and so made of those two natures, one person: by this we have a kind of Union with Jesus Christ, ver. 11. He which Sanctifieth, and they which are Sanctified, are both of one, i.e. of one God, say some; the Son of God, and Saints are all of one God the Father: others understand it of Adam; Christ as concerning the flesh, and all the sanctified, are of one common root and Father, though, by a different generation.

But [of one] here is to be referred principally to the nature, whereof both the sanctifier and sanctified are partakers, i.e. they are of the same blood and kindred, of the same mould &amp; constitution, of the same human nature. This is a near and an honourable Conjunction; for by this means Jesus Christ is become our Immanuel, God with us, bone of our bone, and flesh of our flesh: but yet this Conjunction is common to all, sanctified and unsanctified, prophane and holy; and verily it will be found an high aggravation of sin in the great day, that sinners should dare to profane and prostitute that nature to sinful purposes, which the Son of God hath sanctified by so wonderful an assumption of it into one and the same personality with the divine nature.</p></blockquote>

</figure><figure class="quote" id="q-0933ed15c9" data-kw="">
<blockquote><p>But because the speech which Paul useth seemeth to be somewhat hard, we must see in what sense he saith that God purchased the Church with his blood. For nothing is more absurd than to feign or imagine God to be mortal or to have a body. But in this speech he commendeth the unity of person in Christ; for because there be distinct natures in Christ, the Scripture cloth sometimes recite that apart by itself which is proper to either. But when it setteth God before us made manifest in the flesh, it doth not separate the human nature from the Godhead. Notwithstanding, because again two natures are so united in Christ, that they make one person, that is improperly translated sometimes unto the one, which doth truly and in deed belong to the other, as in this place Paul doth attribute blood to God; because the man Jesus Christ, who shed his blood for us, was also God.

This manner of speaking is called, of the old writers, communicatio idiomatum, because the property of the one nature is applied to the other. And I said that by this means is manifestly expressed one person of Christ, lest we imagine him to be double, which Nestorius did in times past attempt; and yet for all this we must not imagine a confusion of the two natures which Eutychus went about to bring in, or which the Spanish dog, Servetus, hath at this time invented, who maketh the Godhead of Christ nothing else but a form or image of the human nature, which he dreameth to have always shined in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 256-57.</span></figcaption>

</figure><figure class="quote" id="q-1f15f34314" data-kw="">
<blockquote><p>The eternal Father willed and proposed, that his eternal Son, for accomplishing his design of mercy towards sinners of mankind, should, in the fulness of time, assume their nature, and so become man. He from eternity saw, that “sacrifice and offering,” could not answer the exigence; that the debt was too great to be discharged so easily; and, that the redemption of souls was too precious, to be either purchased, or conferred, by a person of less than infinite dignity.

Therefore, having, in his infinite sovereignty, purposed, that the glory of his attribute of mercy, should, in the salvation of lost sinners of mankind, be illustriously displayed; he proposed, that the human nature should, in the fulness of time, be united to the Divine nature, in the person of the adorable Son. He willed and proposed, that the eternal Word should be made flesh; that he should take to himself, a true body, and a reasonable soul; not—as a person, distinct from his own Divine person, but—only as a nature, assumed unto a subsistence in his person.

To this gracious proposal, the only begotten Son, the second person of the eternal Trinity, having as yet, no nearer relation to man, than that of his Creator and sovereign Lord, did with infinite readiness consent. He said to his eternal Father, ‘Sacrifice and offering thou wouldst not, but a body hast thou prepared me:— Then said I, Lo, I come (in the volume of the book it is written of me) to do thy will, O God.” The eternal Word, consented to be made flesh, that all flesh might not perish. He agreed to become man, that he might be as really the Son of man, and one of the family of Adam; as he was already the Son of God, and one of the family of Heaven. This, in Him, was an instance of astonishing condescension.

By his consenting to assume, as well as by his act of assuming, the human nature, he made himself of no reputation. He assumed it, with all its sinless infirmities; in a state of servile subjection to the law as a covenant, under the meanest appearance, the heaviest load of imputed sin, and all the infinite weight of the curse of the law. The highest Monarch’s consenting, to lay aside his royal robes, to clothe himself with rags, and to become the most abject of the sons of men; is not once to be compared to this. Nay, the highest angel’s consenting to become a worm, is not once to be named, in comparison of the eternal Son, the equal of the Father, consenting to become man: for, while the distance, between the nature of angels, and that of worms of the dust, is but finite; the distance, between the nature of the only begotten of the Father, and that of man, is infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 63-64.</span></figcaption>

</figure><figure class="quote" id="q-61c54dd5b7" data-kw="">
<blockquote><p>At this point, some people ask how Paul can say that he did not receive his apostolic office from men or through man, when he also says that he got it from Christ. Does this mean that Christ is not a man? My answer is that questions of this kind are more speculative than necessary and that the people who ask them are trying to create a tempest in a teapot. Obviously, Paul knew that Christ was a man, and he even says that he was born of the seed of David and of the Jewish race. But he was also the eternal God. It was not as a man that he sent out his apostles but as the mediator of eternal salvation, in whose person God and man are conjoined.

The apostle refers to this elsewhere when he writes “God was in Christ” and also “In him the fullness of the Godhead dwells bodily.” Isaiah also calls him Emmanuel. So the speculations of such people do not impress us very much. More worthwhile are the observations of the ancients, who saw in Paul’s commission the mystery of the most holy and praiseworthy Trinity. Their argument was that when Paul says that he was not made an apostle by men or through man but then goes on to say that it was through Jesus Christ and God the Father, he is stating that Jesus Christ is God, coeternal and consubstantial with the Father. Paul was not sent by men or through man but by the Holy Spirit, which proves that the Holy Spirit is also God.

Someone will no doubt object that Christ was raised from the dead by the Father and must therefore have been inferior to him, but that does not follow. The works of the Father and the Son are the same, and whatever the Father does the Son does also. Just as the Father raises the dead and gives them life, so the Son also gives life to whomever he wills. Remember what Jesus said: “Destroy this temple and I will raise it up again in three days.” What logic compels us to say that Christ rose from the dead thanks to an outside power, when the apostles raised people from the dead in his name?

This takes us on to another subject, so suffice it to observe here how careful the ancients were in noting those passages where the eternal deity of Jesus Christ is asserted and proved. Let us exercise the same care today, when Satan is everywhere bringing back the ancient heresies by using poorly educated men to do so.</p></blockquote>

— Rudolf Gwalther, In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 11-12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+this+point%2C+some+people+ask+how+Paul+can+say+that+he+did+not+receive+his+apostolic+office+from+men+or+through+man%2C+when+he+also+says+that+he+got+it+from+Christ.+Does+this+mean+that+Christ+is+not+a+man%3F+My+answer+is+that+questions+of+this+kind+are+more+speculative+than+necessary+and+that+the+people+who+ask+them+are+trying+to+create+a+tempest+in+a+teapot.+Obviously%2C+Paul+knew+that+Christ+was+a+man%2C+and+he+even+says+that+he+was+born+of+the+seed+of+David+and+of+the+Jewish+race.+But+he+was+also+the+eternal+God.+It+was+not+as+a+man+that+he+sent+out+his+apostles+but+as+the+mediator+of+eternal+salvation%2C+in+whose+person+God+and+man+are+conjoined.%0A%0AThe+apostle+refers+to+this+elsewhere+when+he+writes+%E2%80%9CGod+was+in+Christ%E2%80%9D+and+also+%E2%80%9CIn+him+the+fullness+of+the+Godhead+dwells+bodily.%E2%80%9D+Isaiah+also+calls+him+Emmanuel.+So+the+speculations+of+such+people+do+not+impress+us+very+much.+More+worthwhile+are+the+observations+of+the+ancients%2C+who+saw+in+Paul%E2%80%99s+commission+the+mystery+of+the+most+holy+and+praiseworthy+Trinity.+Their+argument+was+that+when+Paul+says+that+he+was+not+made+an+apostle+by+men+or+through+man+but+then+goes+on+to+say+that+it+was+through+Jesus+Christ+and+God+the+Father%2C+he+is+stating+that+Jesus+Christ+is+God%2C+coeternal+and+consubstantial+with+the+Father.+Paul+was+not+sent+by+men+or+through+man+but+by+the+Holy+Spirit%2C+which+proves+that+the+Holy+Spirit+is+also+God.%0A%0ASomeone+will+no+doubt+object+that+Christ+was+raised+from+the+dead+by+the+Father+and+must+therefore+have+been+inferior+to+him%2C+but+that+does+not+follow.+The+works+of+the+Father+and+the+Son+are+th <blockquote><p>1. There is and ever was one only person of Christ. For there is but one only begotten Son of God and one and the same Christ.

2. This person, being from all eternity by the natural begetting of the Father, is proper unto the Word; but in time was made common to the human nature taken to it by virtue of the personal union. For in the Word the essence, which it hath common, yea, the very same with the Father and the Holy ghost is to be distinguished from the proper manner of subsisting, whereby it comes to pass that it is a certain hypostasis or person, distinct from the Father and the Holy ghost; and therefore is and is called the hypostasis or person proper to the Son or to the Word.

But this eternal hypostasis, proper by nature unto the Word, is by this union made common, as we said, with the divine nature and the human taken unto it; namely, that the Word doth no less subsist really in this human form then it doth in that divine form and in that respect is no less true and perfect man then true and perfect God; yet the natures, properties and actions remaining safe and distinct.

3. Therefore into the unity of that immeasurable, most pure and most perfect person was taken the human nature, that is that lump consisting of the reasonable soul and flesh of man, finite, compounded and needing many things.

But how? Not so as that (for example) it contained that infinite person within the bounds or limits of it own finite or determinate substance, or that it spread it self, as it were, stretched out into the largeness of it. And that, which we say of this property, the same is to be thought and believed of all the rest, because they all remain unchangeable and unmixed.

How then was the human nature taken? Surely it was so taken into unity of the same person, that yet it is not made the very person, but rather existeth in the person, is borne and sustained of the person and ever dependeth wholly upon the same. For this union of the natures according to the hypostasis, or uniting of the hypostasis, is made without alteration, confusion or division.</p></blockquote>

</figure><figure class="quote" id="q-1f1f00dd71" data-kw="">
<blockquote><p>In like manner, did the eternal Son of God assume, into the subsistence of his own infinite person, the whole nature of man, the body and the soul; by the virtue of which wonderful union, notwithstanding the properties of the divine nature remain absolutely intransient and incommunicable unto the human; yet are there shed, from that inexhaustible fountain, many high and glorious endowments, by which the humanity under this manner of subsistence is anointed, consecrated, sealed, and set apart for that work of incomprehensible love and power, the redemption of the world.</p></blockquote>

<blockquote><p>Where Christ sitteth on the right hand of God.] This is that other inducement or spur to seek and affect lofty or celestial things: Christ sitteth at the right hand of God; therefore it behoves us to seek and to affect the things that are above. First we shall explain the meaning of these words; and then shew the force of the argument, or the consequence of the reason.

In the first place, then, it must be borne in mind, that this is spoken of Christ properly and especially as to his human nature, in which he rose, and ascended, and sits at the right hand of the Father, as it is stated in the Apostles’ Creed: and although as to the Divine nature, we must believe that he sat at the right hand of the Father from all eternity, i.e. as Damascenus [John of Damascus], Lib. 4. cap. 2, has expounded it, that he had an equality of Divine Majesty with God the Father: By the right hand of the Father we mean the glory and honour of the Godhead; in which the Son of God existed, before the world began, as God, and of one substance with the Father, but became incarnate in these last days, and sitteth there bodily, his flesh being also glorified. Therefore, passing by this Exposition of Damascenus, which respects the Divine nature of Christ and his eternal Majesty, let us inquire what is intimated under the words to sit at the right hand of God, when they are applied to the human nature of Christ and its exaltation effected in time.

This is the sum; Since God hath no bodily right hand, by this sitting is signified, that Christ as man, having accomplished the work of our redemption, is not only endowed with immortality and perfect blessedness, but is raised to heaven, placed above all creatures, Lord, Governor, and Judge of the whole world, and especially constituted the most glorious and powerful King and Patron of the Church. Augustine, De fide et symbolo, Tom. 3, says, to sit, is to possess judicial power; but to be at the right hand of God, is to be in the highest blessedness; as to be at the left hand is to be in the deepest misery. But what it is for the man Christ to sit at the right hand of the Father, is best explained by the Apostle in Ephes. i. 20, 21, and 22. It comprises, then, the exaltation of the human nature to a state of the completest happiness and glory of which it could be capable, and likewise exaltation and authority over all other creatures.

The error of certain moderns is therefore to be avoided, who, from this sitting of Christ at the right hand of God, endeavour to infer, that Divine Majesty, ubiquity, and all the properties of Deity are really communicated to the human nature of Christ. But they are easily refuted;

1. Because, if the Divine attributes be really communicated to the human nature, the human nature is really God: for the Divine attributes are nothing else than the Divine essence. We therefore acknowledge that Christ incarnate has an equality of glory and majesty with God the Father: but we deny that the flesh of Christ, or the human nature, has, or can have this; because it is not consubstantial with God, although it is hypostatically united to God.

2. They are refuted from the circumstance of time. For (as they will have it) a real communication of attributes to the human nature arises from its hypostatic union with the Divine: but this sitting of the man Christ at the right hand of God, of which the Apostle speaks, followed his passion and resurrection. This we learn from the order of the articles in the Apostles’ Creed: He rose again; he ascended into heaven; he sat down, &amp;c. This Christ himself teaches us, Luke xxiv. 26, Ought not Christ to have suffered, and to enter into his glory? And the Apostle, Heb. i. 3, After that he had purged our sins, he sat down at the right hand of the Majesty on high.

3. As to the ubiquity of Christ’s body; that is manifestly refuted, not established in this place. For the Apostle says, that the minds of Christians ought to be directed heavenward, not set upon earthly things, for this reason, that Christ is exalted at the right hand of God in the heavens, now no more to dwell with us upon earth in his bodily presence, although as to the presence of the Divine Majesty he is ever with us. Thus in Ephes. i. 20, He set Christ at his own right hand. Where? In the heavens; and Heb. i. 3, in the highest places.

Although, therefore, the right hand of God is every where, if thereby we understand the Divine Majesty and power; because God is every where: yet Christ, as far as regards his body, or his human nature, is set at the right hand of God, not as regards his ubiquity, but his presence in heaven. And thus ye see briefly in what sense Christ is set at the right hand of God: His Divine nature, or the person of the Word, sits in the equality of Majesty and glory, and of all the Divine attributes; the human nature sits above all created things, but yet beneath God, viz. endued with majesty, and the greatest glory adapted to it, and of which it can be capable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 11-14.</span></figcaption>

sed+to+heaven%2C+placed+above+all+creatures%2C+Lord%2C+Governor%2C+and+Judge+of+the+whole+world%2C+and+especially+constituted+the+most+glorious+and+powerful+King+and+Patron+of+the+Church.+Augustine%2C+De+fide+et+symbolo%2C+Tom.+3%2C+says%2C+to+sit%2C+is+to+possess+judicial+power%3B+but+to+be+at+the+right+hand+of+God%2C+is+to+be+in+the+highest+blessedness%3B+as+to+be+at+the+left+hand+is+to+be+in+the+deepest+misery.+But+what+it+is+for+the+man+Christ+to+sit+at+the+right+hand+of+the+Father%2C+is+best+explained+by+the+Apostle+in+Ephes.+i.+20%2C+21%2C+and+22.+It+comprises%2C+then%2C+the+exaltation+of+the+human+nature+to+a+state+of+the+completest+happiness+and+glory+of+which+it+could+be+capable%2C+and+likewise+exaltation+and+authority+over+all+other+creatures.%0A%0AThe+error+of+certain+moderns+is+therefore+to+be+avoided%2C+who%2C+from+this+sitting+of+Christ+at+the+right+hand+of+God%2C+endeavour+to+infer%2C+that+Divine+Majesty%2C+ubiquity%2C+and+all+the+properties+of+Deity+are+really+communicated+to+the+human+nature+of+Christ.+But+they+are+easily+refuted%3B%0A%0A1.+Because%2C+if+the+Divine+attributes+be+really+communicated+to+the+human+nature%2C+the+human+nature+is+really+God%3A+for+the+Divine+attributes+are+nothing+else+than+the+Divine+essence.+We+therefore+acknowledge+that+Christ+incarnate+has+an+equality+of+glory+and+majesty+with+God+the+Father%3A+but+we+deny+that+the+flesh+of+Christ%2C+or+the+human+nature%2C+has%2C+or+can+have+this%3B+because+it+is+not+consubstantial+with+God%2C+although+it+is+hypostatically+united+to+God.%0A%0A2.+They+are+refuted+from+the+circumstance+of+time.+For+%28as+they+will+have+it%29+a+real+communication+of+attributes+to+the+human+nature+arises+from+its+hypostatic+union+with+the+Divine%3A+but+this+sitting+of+the+man+Christ+at+the+right+hand+of+God%2C+of+which+the+Apostle+speaks%2C+followed+his+passion+and+resurrection.+This+we+learn+from+the+order+of+the+articles+in+the+Apostles%E2%80%99+Creed%3A+He+rose+again%3B+he+ascended+into+heaven%3B+he+sat+down%2C+%26c.+This+Christ+himself+teaches+us%2C+Luke+xxiv.+26%2C+Ought+not+Christ+to+have+suffered%2C+and+to+enter+into+his+glory%3F+And+the+Apostle%2C+Heb.+i.+3%2C+After+that+he+had+purged+our+sins%2C+he+sat+down+at+the+right+hand+of+the+Majesty+on+high.%0A%0A3.+As+to+the+ubiquity+of+Christ%E2%80%99s+body%3B+that+is+manifestly+refuted%2C+not+established+in+this+place.+For+the+Apostle+says%2C+that+the+minds+of+Christians+ought+to+be+directed+heavenward%2C+not+set+upon+earthly+things%2C+for+this+reason%2C+that+Christ+is+exalted+at+the+right+hand+of+God+in+the+heavens%2C+now+no+more+to+dwell+with+us+upon+earth+in+his+bodily+presence%2C+although+as+to+the+presence+of+the+Divine+Majesty+he+is+ever+with+us.+Thus+in+Ephes.+i.+20%2C+He+set+Christ+at+his+own+right+hand.+Where%3F+In+the+heavens%3B+and+Heb.+i.+3%2C+in+the+highest+places.%0A%0AAlthough%2C+therefore%2C+the+right+hand+of+God+is+every+where%2C+if+thereby+we+understand+the+Divine+Majesty+and+power%3B+because+God+is+every+where%3A+yet+Christ%2C+as+far+as+regards+his+body%2C+or+his+human+nature%2C+is+set+at+the+right+hand+of+God%2C+not+as+regards+his+ubiquity%2C+but+his+presence+in+heaven.+And+thus+ye+see+briefly+in+what+sense+Christ+is+set+at+the+right+hand+of+God%3A+His+Divine+nature%2C+or+the+person+of+the+Word%2C+sits+in+the+equality+of+Majesty+and+glory%2C+and+of+all+the+Divine+attributes%3B+the+human+nature+sits+above+all+created+things%2C+but+yet+beneath+God%2C+viz.+endued+with+majesty%2C+and+the+greatest+glory+adapted+to+it%2C+and+of+which+it+can+be+capable.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1832%29%2C+2%3A+11-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47306e930b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47306e930b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/01/john-davenant-on-christs-exaltation-and-the-error-of-a-ubiquitous-human-nature/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Here observe what grace there is in Christ. The schools tell us, that in him there is a threefold grace. 1. The grace of union. The human nature of Christ, hath received the high grace or favour to be personally united to the second person of the godhead; by virtue of which union the fulness of the godhead is said to dwell in him bodily—bodily, that is, personally, or substantially, in opposition to the types and shadows of the Old Testament, in which God is said to dwell in a figure.

God was said to dwell in the tabernacle, in the ark of the covenant, in the temple; but in these he dwelt only as figures and shadows of the human nature of Christ. In Christ he dwells not in a figure, but personally and substantially. As Christ, Col. 2:17, is called the body, in opposition to the types of old, which were but the shadow; so bodily here denotes not a figurative, but a personal inhabitation. Christ is the body, not a shadow; and God dwells in him bodily, that is, substantially, and not in a shadow.

2. Habitual grace. All those moral perfections wherein stands the holiness of his nature: the love and fear of God; his humility, meekness, patience; in sum, Ins perfect conformity to the image and whole will of God. “Such a High-priest became us, who is holy, harmless, undefiled, separate from sinners.” Heb. 7:26.

3. The honour which is given to him to be Head of the church. Also observe how Christ is said to be full of grace. There is a twofold fullness of grace. In respect to grace itself: thus he is said to be full of grace, that hath all grace, and hath it in the greatest excellency and perfection. Also, in respect to the person that hath it; and thus a person is said to be full of grace, that hath as much grace as he is capable of. Christ is full of grace in both respects: the grace which is in him, is grace in the highest perfection of it, and in infinite fulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), pp 39-40.</span></figcaption>

</figure><figure class="quote" id="q-4cc857019a" data-kw="">
<blockquote><p>It is the love of a Divine Person in human nature. The body which was prepared for him was animated, not by his divine nature, but by a human soul, and in this body he was to make his love effectual by means of all the inward affections, as well as external actions which were peculiar and proper to it. His human nature was furnished immeasurably with all grace, and especially with love, pity, and compassion to fallen and lost men.

There was a universal love, or benevolence, exerted in doing good to all within his reach, and in loving and forgiving his enemies, which was the soul of his obedience, and the fulfilling of the law. But there was also in his human soul a peculiar love to those who were given him by the Father, which exerted itself in strong, fervent, and irrepressible desires for their salvation, and which urged him on, and gave him no rest, until he had completed it by “giving himself an offering and a sacrifice of a sweet-smelling savour to God.” “I have a baptism to be baptized with, and how am I straitened till it be accomplished.” “With desire have I desired to eat this passover with you before I suffer.”

So strong did the manifestations of this desire become as the hour of its consummation approached, that the disciples, and especially those that were with him in the garden, might have said, in the language of Naomi, “The man will not be in rest, until he have finished the thing this day.” Now, in meditating on the love of Christ, we are not to confine our thoughts to the eternal actings of his divine nature (for all the acts of his love, as God, must be eternal), but are to take into view also its temporal acting in the human nature.

In undertaking our cause from everlasting, and in becoming man, the love of the divine nature only was displayed; but subsequently to the incarnation there was a concurrence of the two natures in the expression of love, and though the acts of love in these two natures were infinitely distinct, yet, in virtue of the hypostatical union, they were acts of one and the same person. If the bodily actions of Christ were the acts of his divine person, surely his mental acts were so also; if the act of laying down his life, so also the cheerfulness and delight with which he made the sacrifice, from regard to his Father’s glory, and from love to sinners. “God purchased the Church with his own blood.</p></blockquote>

</figure><figure class="quote" id="q-928c8e93dd" data-kw="">
<blockquote><p>Hence, although these do not now require a grace more joyous for the present, they nevertheless need a more powerful grace; and what grace is more powerful than the only-begotten Son of God, equal to the Father and co-eternal, made man for them, and, without any sin of His own, either original or actual, crucified by men who were sinners? And although He rose again on the third day, never to die any more, He yet bore death for men and gave life to the dead, so that redeemed by His blood, having received so great and such a pledge, they could say, “If God be for us, who is against us? He who spared not His own Son, but delivered Him up for us all, how has He not with Him also given to us all things?”

God therefore took upon Him our nature—that is, the rational soul and flesh of the man Christ—by an undertaking singularly marvellous, or marvellously singular; so that with no preceding merits of His own righteousness He might in such wise be the Son of God from the beginning, in which He had begun to be man, that He, and the Word which is without beginning, might be one person. For there is no one blinded by such ignorance of this matter and the Faith as to dare to say that, although born of the Holy Spirit and the Virgin Mary the Son of man, yet of His own free will by righteous living and by doing good works, without sin, He deserved to be the Son of God; in opposition to the gospel, which says, “The Word was made flesh.” For where was this made flesh except in the Virginal womb, whence was the beginning of the man Christ?

And, moreover, when the Virgin asked how that should come to pass which was told her by the angel, the angel answered, “The Holy Ghost shall come over on to thee and the power of the Highest shall overshadow thee, therefore that holy thing that shall be born of thee shall be called the Son of God.” “Therefore,” he said; not because of works of which certainly of a yet unborn infant there are none; but “therefore,” because “the Holy Ghost shall come over on to thee, and the power of the Highest shall overshadow thee, that holy thing which shall be born of thee shall be called the Son of God.”

That nativity, absolutely gratuitous, conjoined, in the unity of the person, man to God, flesh to the Word! Good works followed that nativity; good works did not merit it. For it was in no wise to be feared that the human nature taken up by God the Word in that ineffable manner into a unity of person, would sin by free choice of will, since that taking up itself was such that the nature of man so taken up by God would admit into itself no movement of an evil will. Through this Mediator God makes known that He makes those whom He redeemed by His blood from evil, everlastingly good; and Him He in such wise assumed that He never would be evil, and, not being made out of evil, would always be good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Rebuke and Grace</cite>, (c. 427), 30 in Nicene and Post-Nicene Fathers 1, 5: 483-84.</span></figcaption>

<blockquote><p>This designation [God’s anointed] also connotes his being thoroughly fitted and furnished for his work, by an unmeasurable effusion of the Holy Ghost. “Grace was poured into his lips.” There is a twofold grace given unto Christ as Mediator, namely, (1.) The grace of personal union, when the human nature, consisting of a true body and a reasonable soul, is taken into the person of the eternal Son of God, which is the great mystery of godliness. (2.) There was a created habitual fulness of grace bestowed on him for the discharging of his mediatorial work, and for the use of his mystical body: he “received gifts for men, that out of his fulness, we might receive grace for grace.” Thus you see what is imported in Christ’s anointing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Lamp Ordained for God s Anointed. Being the Substance of Two Sermons. The First Preached at the Admission of the Rev. James Fisher, late Minister of the Gospel at Kinclaven, to be Minister of the Dissenting Associate Congregation in and about Glasgow, October 8, 1741; the other preached at Stirlin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-person-of-christ.html">The Person of Christ</a></span></div>

</figure><figure class="quote" id="q-db1d403020" data-kw="">
<blockquote><p>I confess there is a double glory of God, manifested in Christ: The one is the glory of his pure grace in conferring the greatest good and honour that the creature is capable of, as namely in the hypostatical union of the manhood of Christ to the second person in the Trinity.

Secondly the glory of God’s remunerative justice in the highest degree possible, both in respect of the reward, the greatest that possibly could be deserved (for that hypostatical union could not be deserved) and that is the glorification of the human nature of Christ, both in respect of his glory absolute, and of his glory relative, as by whom salvation is procured to others: as also in respect of the desert, the greatest I think that possibly could be, to wit, the humiliation of the Son of God to the death of the cross in way of obedience to his Father’s will.

There is also a glory of God that appears in Christ, not in several, as a sole means thereof, but in common with other means jointly concurring thereunto: and that is the glory of God in the way of mercy mixt with justice, in saving sinners for the obedience of Christ.</p></blockquote>

</figure><figure class="quote" id="q-5c94c56ae3" data-kw="">
<blockquote><p>For like as by one man sin hath entered into the world (as the Apostle saith to the Rom. cap. 5.) and by sin death, and so death hath passed upon all men, in as much as all have sinned: and as by the disobedience of one man many are made sinners: so by the obedience of one many are made righteous. Also, if by the sin of that one many are dead, much more the grace of God, and the gift through grace, which is of one man Jesus Christ, hath abounded towards many.

Wherefore Christ must be very man both in soul &amp; body, who by obedience even to death, and to the death of the cross, might satisfy the unchangeable righteousness of God, who would not punish that in Angels, because men had sinned, but in the very nature of man, therefore the son of God took not Angels, but the seed of Abraham, that is, the very nature of man of the seed of the Abraham. Heb. 2.</p></blockquote>

<blockquote><p>III. The law of the decalogue or ten commandments is a declaration of the law of nature and a picture of the image of God.

We also believe that this law is a declaration of the law of nature, which was written in the hearts of the first men perfectly, of others imperfectly and but in part, and therefore by this law is condemned whatsoever is not agreeable to that image of God, whereunto man was created, and is commanded whatsoever is agreeable to the same.

For God would shew by that law what man was in his first estate and what he was made in the second estate and what manner one he ought to be and further what he should afterwards be in the third estate in part, and what perfectly in the fourth by Christ. So that the law is nothing else but a true and lively picture of the image of God, to which man was created, whereby we are instructed what we were, what we are, what we ought to be and indeed what we shall be, if we trust in Christ.</p></blockquote>

<blockquote><p>Consider the doleful tragedy which he acted from first to last; meditate on his incarnation. For the Son of God to become the Son of man; for him that lived from all eternity to be born in time; for him that thundereth in the clouds to cry in the cradle; for him that created all things to become a creature, — is a greater suffering than if all the men and angels in this and the other world were crowded into an atom, or turned into nothing. This was the first and greatest step of his humiliation.

Consider the manner of his birth: he was born, not of some great princes, but of mean and indigent parents; not in a royal palace, but in a place where beggars and beasts are entertained — a stable; he was no sooner born but sought after to be butchered. He fled for his life in his very swaddling-clouts, and was an early martyr indeed.

When he grew up, though he was of ability to have swayed the sceptre of all the empires in the world, to have instructed the greatest potentates and counsellors in the mysteries of wisdom and knowledge; though to him Adam and Solomon, yea, and angels themselves, were fools, yet he lived privately with his supposed father many years, and suffered his deity to be hid, as light in a dark lantern, near thirty years, save that once it darted a little out, when at twelve years of age he disputed and confuted the great Rabbis of the Jews, Luke ii. 46.</p></blockquote>

<blockquote><p>The meaning of the words: which was conceived by the holy Ghost, born of the virgin Mary.

The meaning is, that the everlasting Son of God of the same substance with the Father, without any putting off, of his divine nature, without any conversion or commixtió, was made that which he first was not, to wit man, which the Scripture interpreteth.

He took the seed of Abraham, that is our flesh of the virgin Marie, and his very human soul, and that by the power of the holy Ghost, that he might be like unto his brethren in all things, sin only excepted, Joh. 1. And to the Hebr. 2. and the fourth: 1 Tim. 3. Rom. 1.</p></blockquote>

</figure><figure class="quote" id="q-96a3bc79fe" data-kw="">
<blockquote><p>He was above any obligation to that work he so freely undertook for us. When he made himself of no reputation, it was a work of his charity, not of necessity; and he was bound in no other bonds but those of his own love. Nor could he be overruled to anything against his own consent; for being ‘God equal with the Father,’ Philip. ii. 6, he was subject to no law, nor could be constrained to bend under the terms and penalties of it. Christ as the second person was not under a law any more than the Father; for he was ‘in the form of God,’ i. e. had the same essence with God.

Suppose he had been incarnate without entering into any bonds for us, though so far as he was man he was bound actively to obey the precepts of the law, yet not bound to endure the penalties of the law, unless he had been a transgressor of the precept: he was to have obeyed it as a creature, but not suffer the curse, unless he had been a guilty creature.

But he was not only made under the law, as an innocent creature, but ‘in the likeness of sinful flesh,’ Rom. viii. 8, as like as possible could be, sin only excepted; and therefore observed those ceremonial precepts which concerned creatures as sinful: as circumcision, though he had no lust in his human nature to be cut off, and baptism, though he had no stain to be washed away.

And indeed, as he was not, so he could not be a transgressor, being secured by his conception from any original taint, and by the hypostatical union from any actual spot. If he could possibly have been a transgressor, the salvation of the elect had been contingent. Being a creature, of the seed of the woman, he may be supposed to be under the condition of the covenant of nature; yet not violating that covenant, he could not justly die for himself.</p></blockquote>

</figure><figure class="quote" id="q-36a5af1684" data-kw="">
<blockquote><p>And here we must consider, that the Divine Nature did not assume an human Person, but the divine Person did assume an human Nature: and that of the three Divine Persons, it was neither the first nor the third that did assume this Nature; but it was the middle Person, who was to be the middle one, that must undertake this mediation betwixt God and us. which was otherwise also most requisite, as well for the better preservation of the integrity of the blessed Trinity in the Godhead, as for the higher advancement of Man-kind by means of that relation which the second Person the Mediator did bear unto his Father.

For if the fullness of the Godhead should have thus dwelt in any human person, there should then a fourth Person necessarily have been added unto the Godhead. And if any of the three Persons, beside the second, had been borne of a Woman; there should have been two Sons in the Trinity: whereas now the Son of God and the Son of the blessed Virgin, being but one Person, is consequently but one Son; and so no alteration at all made in the relations of the Persons of the Trinity.</p></blockquote>

</figure><figure class="quote" id="q-f8578f96f6" data-kw="">
<blockquote><p>Again; this Son of God is Jesus: “Jesus the Son of God.” Jesus is the name of a man: “She shall bring forth a son, and thou shalt call his name Jesus,” Matt. i. 21. And this our high priest also was to be. “Every high priest,” saith our apostle, “is ordained to offer gifts and sacrifices unto God.” And “therefore of necessity’’ he who would be our high priest “must have somewhat to offer,” and that somewhat of his own.

And what had the Son of God, absolutely considered, of his own to offer? His divine nature or person is not to be offered. All things necessarily required in the matter and form of an offering are eternally incompatible with the infinite excellencies of the divine nature. God cannot be a sacrifice, though he who is God was so to be.

Shall he, then, take an offering out of the works of the creation? Shall he take the blood of bulls and goats for this purpose, as did Aaron? The offering, indeed, of these things might represent the sacrifice that should take away sin, but take away sin itself it could not do. For what wisdom, righteousness, or equity, is in this, that whereas man had sinned, other brute creatures, that were none of his own (for whatever right he had to any creatures of God, belonging to his original dominion over them, after his sin he had none at all), should be accepted a sacrifice in his stead?

Besides, what proportion did the blood of bulls and goats bear to the justice of God, that satisfaction for sin should be made unto it thereby? Should, then, the Son of God have taken and appointed any one man to be a sacrifice for himself and others? Every man being a sinner, the sacrifice of any one would have been a provocation unto God. In the typical sacrifices, he would not admit of a lamb or a kid that had the least blemish in it to be offered unto him. And shall we suppose that he would allow of a real expiatory sacrifice by that which was leprous all over? It would have been so far from yielding “a sweet savour to God,” from being an atonement for all men, for any one man, for the man himself that should have been offered, that it would have been the highest provocation unto the eyes of his glory.

Wherefore the Son of God himself became “Jesus;” that is, he took human nature, “the seed of Abraham,” into union with himself, that he might have of his own to offer unto God. This by its oneness with our nature, the nature that had sinned, being itself not touched with sin, was meet to be offered for us; and by its union with his person was meet and able to make atonement with God for us; and so “God redeemed his church with his own blood,” Acts xx. 28. Thus our high priest is “Jesus, the Son of God.”’ And in these things consists his greatness, which the apostle proposeth for our encouragement unto steadfastness in profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 4: 414-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>For God, to become man, to hide his majesty for a while, not to be known to be God, and to hide so far in this nature as to die for us; what an almighty power was this, that could go so low and yet preserve himself God still! Yet this we see in this our blessed Saviour, the greatest majesty met with the greatest abasement that ever was, and all out of love to our poor souls. There was no stooping, no abasement that was ever so low as Christ was abased unto us, to want for a time even the comfort of the presence of his Father.</p></blockquote>

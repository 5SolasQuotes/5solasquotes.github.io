</figure><figure class="quote" id="q-8a6f60becd" data-kw="">
<blockquote><p>The divines who composed the Formula Consensus Helvetica (Johann Heinrich Heidegger, Francis Turretin, and Lucas Gernler) had much to say about the vital Reformed doctrine of the covenant of works. They even condemned the view, held by the likes of Thomas Goodwin and John Cameron, that the promised reward of the covenant of works was eternal earthly life as opposed to eternal heavenly life. They also held that the covenant of grace was only made with the elect in Christ:

Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favour and life, if indeed he acted in obedience to his will.

Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death.

Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.

Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with the whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12, 19) and “in Adam all die” (I Cor 15:21-22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty. …

Canon XXIII: There are two ways in which God, the just Judge, has promised justification: either by one’s own works or deeds in the law, or by the obedience or righteousness of another, even of Christ our Guarantor. [This justification] is imputed by grace to those who believe in the Gospel. The former is the method of justifying man because of perfection; but the latter, of justifying man who is a corrupt sinner. In accordance with these two ways of justification the Scripture establishes these two covenants: the Covenant of Works, entered into with Adam and with each one of his descendants in him, but made void by sin; and the Covenant of Grace, made with only the elect in Christ, the second Adam, eternal. [This covenant] cannot be broken while [the Covenant of Works] can be abrogated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 522-23, 528.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“The divines who composed the Formula Consensus Helvetica (Johann Heinrich Heidegger, Francis Turretin, and Lucas Gernler) had much to say about the vital Reformed doctrine of the covenant of works. They even condemned the view, held by the likes of Thomas Goodwin and John Cameron, that the promised reward of the covenant of works was eternal earthly life as opposed to eternal heavenly life. They also held that the covenant of grace was only made with the elect in Christ:

Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favour and life, if indeed he acted in obedience to his will.

Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death.

Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.

Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with the whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12, 19) and “in Adam all die” (I Cor 15:21-22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty. …

Canon XXIII: There are two ways in which God, the just Judge, has promised justification: either by one’s own works or deeds in the law, or by the obedience or righteousness of another, even of Christ our Guarantor. [This justification] is imputed by grace to those who believe in the Gospel. The former is the method of justifying man because of perfection; but the latter, of justifying man who is a corrupt sinner. In accordance with these two ways of justification the Scripture establishes these two covenants: the Covenant of Works, entered into with Adam and with each one of his descendants in him, but made void by sin; and the Covenant of Grace, made with only the elect in Christ, the second Adam, eternal. [This covenant] cannot be broken while [the Covenant of Works] can be abrogated.”

tion%3B+but+the+latter%2C+of+justifying+man+who+is+a+corrupt+sinner.+In+accordance+with+these+two+ways+of+justification+the+Scripture+establishes+these+two+covenants%3A+the+Covenant+of+Works%2C+entered+into+with+Adam+and+with+each+one+of+his+descendants+in+him%2C+but+made+void+by+sin%3B+and+the+Covenant+of+Grace%2C+made+with+only+the+elect+in+Christ%2C+the+second+Adam%2C+eternal.+%5BThis+covenant%5D+cannot+be+broken+while+%5Bthe+Covenant+of+Works%5D+can+be+abrogated.%E2%80%9D%0A%0A%E2%80%94+James+T.+Dennison+Jr.%2C+Reformed+Confessions+of+the+16th+and+17th+Centuries+in+English+Translation%2C+%28Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2014%29%2C+4%3A+522-23%2C+528.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a6f60becd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a6f60becd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/27/formula-consensus-helvetica-1675-on-the-covenant-of-works-and-the-covenant-of-grace-with-the-elect-alone/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8d00195735" data-kw="">
<blockquote><p>3. It is not impossible that one act should be so high and intense in its kind as to induce a habit into the subject, and so Adam’s nature be vitiated by it; and he begot a son in his own likeness. The devils upon one sin became obstinate in all the wickedness that their nature is capable of. (2.) This one act was a breach of covenant with God, upon the tenor and observation whereof depended the enjoyment of all that strength and rectitude with God wherewith, by the law of his creation, man was endued, (3.) All man’s covenant good, for that eternal end to which he was created, depended upon his conformity to God, his subjection to him, and dependence on him; all which, by that one sin, he wilfully cast away for himself and posterity (whose common, natural, and federal head he was), and righteously fell into that condition which we have described. (4.) The apostle is much of a different mind from our catechists, Rom. v. 15, 16, etc., as hath been declared.

4. What is credible concerning God and his goodness with these gentlemen I know not. To me, that is not only in itself credible which lie hath revealed concerning himself, but of necessity to be believed. That he gave man a law, threatening him, and all his posterity in him and with him, with eternal death upon the breach of it; that upon that sin he cast all mankind judicially out of covenant, imputing that sin unto them all unto the guilt of condemnation, seeing it is “his judgment that they who commit sin are worthy of death;” and that ” he is of purer eyes than to behold evil,” — is to us credible, yea, as was said, of necessity to be believed. But they will answer the proofs that are produced from Scripture in the asserting of this original sin.</p></blockquote>

</figure><figure class="quote" id="q-6201fcde4c" data-kw="">
<blockquote><p>It is therefore worthy of careful observation, that good works are required, as well of those who are under the legal contract, as of those who are living under the Gospel covenant; considering man however under different aspects, and in ways perfectly distinct. The Law, because it regards man as created by God in uprightness of nature, requires good works to be done in the strength of nature; but the Gospel, because it regards man as fallen, requires good works from the justified; but to be done, not by the strength of nature of free will, but from infused grace.

The Law, because it makes the desert of death and life depend upon the condition of works, inflicts death for any one sin, however light; and crowns with this reward of life him only who shall have rendered as obedience that is perfect in all its parts; but the Gospel, because it treats with the justified, who are delivered from death through faith in Christ, and graciously appointed to life, allows sinners an advocate, by whose intercession they obtain the constant remission of sins; and also promises a reward to the good works of the regenerate, although imperfect, because they are accepted of God the Father, in Christ the Mediator. In fine, the law rests the value and form of its covenant upon the condition of works, but the Gospel places the value and form of its covenant in the blood of the Mediator, apprehended by faith; but annexes the condition of works, as subserving this Evangelical covenant, not as comprising or constituting the covenant itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification, or The Disputatio De Justitia Habituali Et Actuali</cite>, trans. Josiah Allport (1631; 2 vols, London: Hamilton, Adams, and Co., 1844), 30.3, i, pp 288-89.</span></figcaption>

</figure><figure class="quote" id="q-990b52e06e" data-kw="">
<blockquote><p>The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death, if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, The Marrow of Modern Divinity</cite></span></figcaption>

<blockquote><p>4 Thesis

For in the absolute Covenant [of grace], there is nothing in the creature that doth impel God either to promise, or to perform what he hath promised, or to perform what he hath promised; But in that Covenant [of works] to which a restipulation is annexed, God doth fulfil what he hath promised, because the creature hath rendered what is required; And although God hath made such a Covenant, wherein he hath promised so great things, upon condition of man’s performance, yet all this proceeds from the antecedent love of God.</p></blockquote>

</figure><figure class="quote" id="q-67b307e1e3" data-kw="">
<blockquote><p>The condition of the covenant, the terms of that life, agreed to by the representative, is implied in that he was the last Adam, namely, to go through with what the first Adam had stuck in. Adam, in the covenant of works, stumbled in the course of his obedience, and fell; and by his fall was quite disabled to begin it anew: he thereby came under the penalty of that covenant also, but was utterly unable to discharge it.

So the last Adam comes in the room of the first, not as the first Adam stood in his integrity; for in that case there was no place for a second Adam; but as he lay a broken man under the first bargain. Arid coming in his room in this case, his business was to satisfy the demands of the first covenant, in behalf of his seed. These demands were now run up high, quite beyond what they were to innocent Adam: the penalty was become payable, as well as the principal sum. Wherefore the first covenant being ingrossed in the second, is declared broken; and the principal and penalty being summed up together, the clearing of the whole is laid upon the last or second Adam, as the condition of the second covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 384.</span></figcaption>

k">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-88d81145a3" data-kw="">
<blockquote><p>The special act of providence towards man newly created, was, God’s making a covenant of life and happiness with him. There are two covenants for life and happiness to man: and they are, the covenant of works, and the covenant of grace: Gal. iv. 24, “For these are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” The first covenant was the covenant of works. It was made in paradise, and before the fall. The parties contracting in it, were God and Adam: Gen. ii. 17, “But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof, thou shalt surely die.”

But Adam represented all mankind, as the parties contracted for: Gen. ii. 17, forecited. Compared with Rom. v. 12, “By one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned.” There was no mediator of this covenant; for as yet there was no breach, by sin, betwixt God and man. The condition of the covenant of works, was perfect obedience: Gal. iii. 12, “And the law is not of faith: but, The man that doth them, shall live in them.” And it was to be perfect, in respect of parts, degrees, and continuance: Gal. iii. 10, “For as many as are of the works of the law, are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them.” Matth. xxii. 37, “Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.” So the least failing in any part or degree of obedience, or for never so small a time, would have broken this covenant.

The law that was the rule of this obedience, was the law of the ten commands, and the law forbidding to eat of the tree of knowledge of good and evil: Gal. iii. 10, and Gen. ii. 17, forecited. That tree grew in paradise, Gen. ii. 9. There was no virtue in it to improve men in knowledge, as the devil falsely suggested, Gen. iii. 5, “For God doth know, that in the day ye eat thereof, then your eyes shall be opened: and ye shall be as gods, knowing good and evil.” Compared with John viii. 44, “Ye are of your father the devil, and the lusts of your father ye will do: he was a murderer from the beginning, and abode not in the truth, because there is no truth in him.” “When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it.” But that name was put upon this tree, to intimate, that by eating of it, man would know to his sad experience, the vast difference between good and ill: wherefore that tree with that name, was of use, to be a warning-piece to man to beware of evil. Now, Adam knew the law of the ten commands, as they were impressed on his heart in his creation: Rom. ii. 15, “Which shew the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the mean while accusing, or else excusing one another.” He knew the law of the forbidden tree by revelation, Gen. ii. 17, forecited. And he had sufficient ability for the perfect obedience required, Eccl. vii. 29, ” God made man upright.”

The promise of the covenant of works, was a promise of life: Gen. ii. 17, forecited. The life promised was twofold; namely, one to be afforded him, during the course of his probationary obedience, another to be afforded him at the perfecting of it. The life to have been afforded to man during the course of his probationary obedience, was natural life continued in vigour and comfort, and spiritual life continued in favour and fellowship with God, Gen. ii. 17, forecited. This was the reward of obedience in hand. The life to have been afforded him at the perfecting of his course, was eternal life in consummate happiness: Matth. xix. 16, 17, “And behold, one came and said unto him, Good master, what good thing shall I do that I may have eternal life? And he said unto him, If thou wilt enter into life, keep the commandments.” And this was the reward of obedience in hope.

Adam, if he had continued obedient, could have claimed that life upon his obedience; yet not in the way of proper merit; because his perfect obedience was no more than what was due from him by the law of his creation, before he entered into that covenant: Luke xvii. 9, 10, “Doth he thank that servant, because he did the things that were commanded him? I trow not. So likewise ye, when ye shall have done all those things which are commanded you, say, We are unprofitable servants: we have done that which was our duty to do.” The only way he could have claimed it, was by compact, namely, in virtue of the covenant-promise made to this work.

The penalty of the covenant of works was death, Gen. ii. 17, forecited. The death threatened was also twofold; namely, one accompanying sin at its first entrance, another following after as its full reward. The death accompanying sin at its first entrance, was temporal death, in the loss of the vigour and comfort of natural life; and spiritual death, in the loss of the image of God with his favour and fellowship. And Adam died this death, according to the threatening, that very day he sinned: Gen. iii. 7, 8, 9, 10, “And the eyes of them both were opened and they knew that they were naked: and they sewed fig-leaves together, and made themselves aprons. And they heard the voice of the Lord God walking in the garden in the cool of the day: and Adam and his wife hid themselves from the presence of the Lord God, amongst the trees of the garden. And the Lord God called unto Adam, and said unto him, Where art thou? And he said, I heard thy voice in the garden: and I was afraid, because I was naked; and I hid myself.”

The death following after, as the full reward of sin, was the natural death of the body with the sting in it, and eternal death in the consummate misery of soul and body for ever: 1 Cor. xv. 55,” death where is thy sting? grave, where is thy victory?” Matth. xxv. 41, “Then shall he say also unto them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels.” And this was comprehended in the express threatening of death to accompany sin; inasmuch as the one was a sure pledge of the other, natively issuing therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 24-26.</span></figcaption>

d+with+all+thy+mind.%E2%80%9D+So+the+least+failing+in+any+part+or+degree+of+obedience%2C+or+for+never+so+small+a+time%2C+would+have+broken+this+covenant.%0A%0AThe+law+that+was+the+rule+of+this+obedience%2C+was+the+law+of+the+ten+commands%2C+and+the+law+forbidding+to+eat+of+the+tree+of+knowledge+of+good+and+evil%3A+Gal.+iii.+10%2C+and+Gen.+ii.+17%2C+forecited.+That+tree+grew+in+paradise%2C+Gen.+ii.+9.+There+was+no+virtue+in+it+to+improve+men+in+knowledge%2C+as+the+devil+falsely+suggested%2C+Gen.+iii.+5%2C+%E2%80%9CFor+God+doth+know%2C+that+in+the+day+ye+eat+thereof%2C+then+your+eyes+shall+be+opened%3A+and+ye+shall+be+as+gods%2C+knowing+good+and+evil.%E2%80%9D+Compared+with+John+viii.+44%2C+%E2%80%9CYe+are+of+your+father+the+devil%2C+and+the+lusts+of+your+father+ye+will+do%3A+he+was+a+murderer+from+the+beginning%2C+and+abode+not+in+the+truth%2C+because+there+is+no+truth+in+him.%E2%80%9D+%E2%80%9CWhen+he+speaketh+a+lie%2C+he+speaketh+of+his+own%3A+for+he+is+a+liar%2C+and+the+father+of+it.%E2%80%9D+But+that+name+was+put+upon+this+tree%2C+to+intimate%2C+that+by+eating+of+it%2C+man+would+know+to+his+sad+experience%2C+the+vast+difference+between+good+and+ill%3A+wherefore+that+tree+with+that+name%2C+was+of+use%2C+to+be+a+warning-piece+to+man+to+beware+of+evil.+Now%2C+Adam+knew+the+law+of+the+ten+commands%2C+as+they+were+impressed+on+his+heart+in+his+creation%3A+Rom.+ii.+15%2C+%E2%80%9CWhich+shew+the+work+of+the+law+written+in+their+hearts%2C+their+conscience+also+bearing+witness%2C+and+their+thoughts+the+mean+while+accusing%2C+or+else+excusing+one+another.%E2%80%9D+He+knew+the+law+of+the+forbidden+tree+by+revelation%2C+Gen.+ii.+17%2C+forecited.+And+he+had+sufficient+ability+for+the+perfect+obedience+required%2C+Eccl.+vii.+29%2C+%E2%80%9D+God+made+man+upright.%E2%80%9D%0A%0AThe+promise+of+the+covenant+of+works%2C+was+a+promise+of+life%3A+Gen.+ii.+17%2C+forecited.+The+life+promised+was+twofold%3B+namely%2C+one+to+be+afforded+him%2C+during+the+course+of+his+probationary+obedience%2C+another+to+be+afforded+him+at+the+perfecting+of+it.+The+life+to+have+been+afforded+to+man+during+the+course+of+his+probationary+obedience%2C+was+natural+life+continued+in+vigour+and+comfort%2C+and+spiritual+life+continued+in+favour+and+fellowship+with+God%2C+Gen.+ii.+17%2C+forecited.+This+was+the+reward+of+obedience+in+hand.+The+life+to+have+been+afforded+him+at+the+perfecting+of+his+course%2C+was+eternal+life+in+consummate+happiness%3A+Matth.+xix.+16%2C+17%2C+%E2%80%9CAnd+behold%2C+one+came+and+said+unto+him%2C+Good+master%2C+what+good+thing+shall+I+do+that+I+may+have+eternal+life%3F+And+he+said+unto+him%2C+If+thou+wilt+enter+into+life%2C+keep+the+commandments.%E2%80%9D+And+this+was+the+reward+of+obedience+in+hope.%0A%0AAdam%2C+if+he+had+continued+obedient%2C+could+have+claimed+that+life+upon+his+obedience%3B+yet+not+in+the+way+of+proper+merit%3B+because+his+perfect+obedience+was+no+more+than+what+was+due+from+him+by+the+law+of+his+creation%2C+before+he+entered+into+that+covenant%3A+Luke+xvii.+9%2C+10%2C+%E2%80%9CDoth+he+thank+that+servant%2C+because+he+did+the+things+that+were+commanded+him%3F+I+trow+not.+So+likewise+ye%2C+when+ye+shall+have+done+all+those+things+which+are+commanded+you%2C+say%2C+We+are+unprofitable+servants%3A+we+have+done+that+which+was+our+duty+to+do.%E2%80%9D+The+only+way+he+could+have+claimed+it%2C+was+by+compact%2C+namely%2C+in+virtue+of+the+covenant-promise+made+to+this+work.%0A%0AThe+penalty+of+the+covenant+of+works+was+death%2C+Gen.+ii.+17%2C+forecited.+The+death+threatened+was+also+twofold%3B+namely%2C+one+accompanying+sin+at+its+first+entrance%2C+another+following+after+as+its+full+reward.+The+death+accompanying+sin+at+its+first+entrance%2C+was+temporal+death%2C+in+the+loss+of+the+vigour+and+comfort+of+natural+life%3B+and+spiritual+death%2C+in+the+loss+of+the+image+of+God+with+his+favour+and+fellowship.+And+Adam+died+this+death%2C+according+to+the+threatening%2C+that+very+day+he+sinned%3A+Gen.+iii.+7%2C+8%2C+9%2C+10%2C+%E2%80%9CAnd+the+eyes+of+them+both+were+opened+and+they+knew+that+they+were+naked%3A+and+they+sewed+fig-leaves+together%2C+and+made+themselves+aprons.+And+they+heard+the+voice+of+the+Lord+God+walking+in+the+garden+in+the+cool+of+the+day%3A+and+Adam+and+his+wife+hid+themselves+from+the+presence+of+the+Lord+God%2C+amongst+the+trees+of+the+garden.+And+the+Lord+God+called+unto+Adam%2C+and+said+unto+him%2C+Where+art+thou%3F+And+he+said%2C+I+heard+thy+voice+in+the+garden%3A+and+I+was+afraid%2C+because+I+was+naked%3B+and+I+hid+myself.%E2%80%9D%0A%0AThe+death+following+after%2C+as+the+full+reward+of+sin%2C+was+the+natural+death+of+the+body+with+the+sting+in+it%2C+and+eternal+death+in+the+consummate+misery+of+soul+and+body+for+ever%3A+1+Cor.+xv.+55%2C%E2%80%9D+death+where+is+thy+sting%3F+grave%2C+where+is+thy+victory%3F%E2%80%9D+Matth.+xxv.+41%2C+%E2%80%9CThen+shall+he+say+also+unto+them+on+the+left+hand%2C+Depart+from+me%2C+ye+cursed%2C+into+everlasting+fire%2C+prepared+for+the+devil+and+his+angels.%E2%80%9D+And+this+was+comprehended+in+the+express+threatening+of+death+to+accompany+sin%3B+inasmuch+as+the+one+was+a+sure+pledge+of+the+other%2C+natively+issuing+therein.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+A+Brief+Explication+of+the+First+Part+of+the+Assembly%E2%80%99s+Shorter+Catechism%2C+%281727%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+vii%2C+24-26.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88d81145a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88d81145a3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/11/14/thomas-boston-on-the-covenant-of-life/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In the natural path of everlasting life the first beginning is that ability of doing good, which God in the day of man’s creation endued him with; from hence obedience unto the will of his Creator, absolute righteousness and integrity in all his actions; and last of all the justice of God rewarding the worthiness of his deserts with the crown of eternal glory. Had Adam continued in his first estate, this had been the way of life unto him and all his posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Polity: Selections</cite>, ed. Arthur Pollard (Manchester: Fyfield Books, 1990), p. 79.</span></figcaption>

</figure><figure class="quote" id="q-000286e6e8" data-kw="">
<blockquote><p>Thus Christ assented, and from everlasting struck hands with God, to put upon him man’s person, and to take upon him his name, and to enter in his stead in obeying his Father, and to do all for man that he should require, and to yield in man’s flesh the price of the satisfaction of the just judgment of God, and, in the same flesh, to suffer the punishment that man had deserved; and this he undertook under the penalty that lay upon man to have undergone. And thus was justice satisfied, and mercy by the Lord Jesus Christ; and so God took Christ’s single bond; whence Christ is not only called the “surety of the covenant for us,” Heb. vii. 22, but the covenant itself, Isa. xlix. 8. And God laid all upon him, that he might be sure of satisfaction; protesting that he would not deal with us, nor so much as expect any payment from us; such was his grace.

And thus did our Lord Jesus Christ enter into the same covenant of works that Adam did to deliver believers from it: he was contented to be under all that commanding, revenging authority, which that covenant had over them, to free them from the penalty of it; and in that respect, Adam is said to be a type of Christ, as you have it, Rom. v, 14, “Who was the type of him that was to come.” To which purpose, the titles which the apostle gives these two, Christ and Adam, are exceeding observable: he calls Adam the “first man,” and Christ our Lord the “second man,” 1 Cor. xv. 47: speaking of them as if there never had been any more men in the world besides these two; thereby making them the head and root of all mankind, they having, as it were, the rest of the sons of men included in them.

The first man is called the “earthy man;” the second man, Christ, is called the ” Lord from heaven,” 1 Cor. xv. 47. The earthy man had all the sons of men born into the world included in him, and is so called, in conformity unto them, the “first man;” the second man, Christ, is called the “Lord from heaven,” who had all the elect included in him, who are said to be the “first-born,” and to have their “names written in heaven,” Heb. xii. 23, and therefore are oppositely called “heavenly men:” so that these two, in God’s account, stood for all the rest. And thus you see, that the Lord, willing to show mercy to the fallen creature, and withal to maintain the authority of his law, took such a course as might best manifest his clemency and severity. Christ entered into covenant, and became surety for man, and so became liable to man’s engagements: for he that answers as a surety must pay the same sum of money that the debtor oweth.

And thus have I endeavoured to show you, how we are to conceive of God’s eternal purpose in sending of Jesus Christ to help and deliver fallen mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 184-86.</span></figcaption>

<blockquote><p>[T]he Promise made unto Adam, and all Mankind in him, The Man that doth those things shall live, which by the Rule of Contraries implies the threatening and the Curse against all Transgressors. If she shall live who fulfils the Law, then by the contrary proportion he shall die who transgresseth it.

And this threatening we find expressly annexed to one particular Command of the Covenant of Works, Gen. 2. 17. In the day thou eatest thereof, that is, of the Tree of the Knowledge of Good and Evil, thou shalt surely die. And to the general Tenor of the whole, Gal. 3. 10. Cursed is every one who continueth not in all things which are written in the Book of the Law to do them.</p></blockquote>

<blockquote><p>Howbeit, the preface to the ten commandments deserves a particular notice, in the matter, of the Sinai transaction, Exod. xx. 2, “I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage.” Hence it is evident to me, that the covenant of grace was delivered to the Israelites on Mount Sinai. For the Son of God, the messenger of the covenant of grace, spoke these words to a select people, the natural seed of Abraham, typical of his whole spiritual seed. …

But that the covenant of works was also, for special ends, repeated and delivered to the Israelites on Mount Sinai, I cannot refuse, 1. Because of the apostle’s testimony, Gal. iv. 24, “These are the two covenants; the one from Mount Sinai, which gendereth to bondage.” For the children of this Sinai covenant the apostle here treats of, are excluded from the eternal inheritance, as Ishmael was from Canaan, the type of it, ver. 30, “Cast out the bond-woman and her son ; for the son of the bond-woman shall not be heir with the son of the free woman;” but this could never be said of the children of the covenant of grace under any dispensation, though both the law and covenant from Sinai itself, and its children, were even before the coming of Christ under a sentence of exclusion, to be execute on them respectively in due time.

2. The nature of the covenant of works is most expressly in the New Testament brought in, propounded, and explained, from the Mosaical dispensation. The commands of it from Exod. xx. by our blessed Saviour, Matth. xix. 17—19, “If thou wilt enter into life, keep the commandments. He saith unto him, Which? Jesus said, Thou shalt do no murder, thou shalt not commit adultery,” &amp;c. The promise of it, Rom. x. 5, “Moses describes the righteousness which is of the law, that the man which doth these things shall live by them.” The commands and promise of it together, see Luke x. 25—28. The terrible sanction of it, Gal. iii. 10, “For it is written, (viz. Deut. xxvii. 26,) Cursed is every one that continueth not in all things which are written in the book of the law to do them.”

3. To this may be added the opposition betwixt the law and grace so frequently inculcated in the New Testament, especially in Paul’s epistles. See one text for all, Gal. iii. 12, “And the law is not of faith, but the man that doeth them shall live in them.”

4. The law from Mount Sinai was a covenant, Gal. iv. 24, “These are the two covenants, the one from the Mount Sinai;” and such a covenant as had a semblance of disannuling the covenant of grace, Gal. iii. 17, “The covenant that was confirmed before of God in Christ, the law which was 430 years after, cannot disannul;” yea, such a one as did, in his own nature, bear a method of obtaining the inheritance, so far different from that of the promise, that it was inconsistent with it; “For if the inheritance be of the law, it is no more of promise,” Gal. iii. 18, wherefore the covenant of the law from Mount Sinai could not be the covenant of grace, unless one will make this last not only a covenant seeming to destroy itself, but really inconsistent; but it was the covenant of works, which indeed had such a semblance, and in its own nature did bear such a method as before noted; howbeit, as Ainsworth says, “The covenant of the law now given could not disannul the covenant of grace,” Gal. iii. 17. — Annot. on Exod. xix. I.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 196-97n. (The footnote is Boston’s.)</span></figcaption>

<blockquote><p>I. God made a double Covenant with man, the one of works, the other of Grace, that before, this after the fall.

II. The Covenant of works was confirmed by a double Sacrament, to wit, the Tree of Life, and the Tree of Knowledge of good and evil, both being planted in the midst of Paradise.

III. They had a double use. I. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the tree of life might ratify eternal happiness to those that should obey, but the Tree of knowledge should signifie to the disobedient the loss of the greatest happiness, and the possession of the greatest misery.

IV. Therefore the Tree of life was so called, not from any innate faculty it had to give life, but from a sacramental signification.

V. Likewise the Tree of Knowledge of good and evil, hath this denomination from signifying the chief good and evil, and from the event.

For in effect, and by experience, man found out how great that happiness and good was which he lost, and how great evil and misery he brought upon himself.</p></blockquote>

<blockquote><p>For the merits of Christ’s obedience to the covenant of works he hath freed his people from the guilt of their disobedience to that covenant of works he was made under the Law to redeem them that are under the Law, Gal. 4:4, 5. now the obedience of Christ to the covenant of works was two-fold; First, his active obedience to that covenant who did perform it without any spot of sin, he saith of his obedience to his Father, I do always those things that please him, John 8:29. he finished the work that his Father gave him to do, John 17:4. and saith his Father, this is my beloved son in whom I am well pleased, Mat. 3:15. thus hath the perfect obedience of Jesus Christ satisfied for all the disobedience of his people to the covenant of works.

Secondly, The other part of Christ’s obedience was passive, he suffered the penalty due unto us for our disobedience to that covenant, though he were a son, yet learned he obedience by the things which he suffered, and being made perfect he became the author of salvation to all them that obey him, Heb. 5:8,9; 2:10. it behoved Christ to suffer and to rise from the dead the third day, Luke 24:26, 46. Christ hath once suffered for sins, the Just for the unjust, that he might bring us to God, I Pet. 3:18. he that knew no sin, neither was guile found in his mouth, who when he suffered he threatened not, but committed himself to him that judgeth righteously, I Pet. 2:25. he alone trod the winepress of his Father’s wrath, and there was none with him, Isa. 63:3. he cried out the pains of hell gat hold of him, and he cried out, My God, my God, why hast thou forsaken me, now the dignity of his person being both God and Man in one Christ, his humanity suffering but a short time made his obedience so meritorious, to free us from that guilt and penalty that is due unto us for our breach of that covenant.</p></blockquote>

</figure><figure class="quote" id="q-2e02cb66de" data-kw="">
<blockquote><p>Others with my self hold that there is but two Covenants, the one a Covenant of Works, and the tree of life, was a Sacrament or sign and token of it, this was made with Adam before his fall and to all his posterity who come under it as soon as they take upon them his nature, for he did bear an Image for himself and all his posterity, so that if he had stood in his integrity he had conveyed his righteousness and holiness to all his posterity, and when he by sin defiled his nature, the whole race of mankind was polluted by him, and also he received a Covenant both for himself and all his posterity, and in case he had been faithful to it, all his posterity had stood with him, but he breaking that Covenant brought not only guilt upon himself but upon all his posterity with him, so that now there is none clean, no not one; how can he be clean that is born of a woman? Job 25:4. thus man’s nature is polluted.

And in regard of the Covenant, let every mouth be stopped, for all the world is become guilty before God, Rom. 3:29. for all have sinned and come short of the glory of God, Rom. 3:23. by one man sin entered into the world, and death by sin, and so death passed upon all men for that all have sinned, Rom. 5:12. so then all men by nature lie under the pollution and guilt of Adam’s sin, and liable to all the curses and penalties due unto them for breach of that Covenant.

But then there was a Covenant of grace which God the Father made with Jesus Christ from all eternity to save some of the posterity of Adam, and had not this Covenant been prepared ready against the fall of Adam to take place at the very moment of his fall, the Justice of God had immediately seized upon the whole Creation under Heaven, and consumed them to their first nothing, but then came Jesus Christ with the covenant in his hand saying, be gracious unto him, and deliver him from going down to the pit, I have found a ransom, Job 33:24. … the covenant of grace was made with Jesus Christ from all eternity, being a contract or plot of God the Father with God the Son from all eternity as mediator for the salvation of the Elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), pp 1-2.</span></figcaption>

<blockquote><p>I read, Gal. iii. 19, for what end God published the law 430 years after the promise was made to Abraham, and find it was added because of transgression, it was put to, not set up by itself alone as a distinct covenant, but added as an appendix to the covenant of grace; whence it is plain, that God added the Sinai law to the promise, with evangelical ends and purposes. […] The law was added because of transgression, that is, to restrain sin in the world, and to convince sinners under guilt, of the necessity of another righteousness than their own, even that of Christ, and for the same ends God added it to the promise. […]

It is plain to me, that in the publication of the law on Sinai, God did not in the least intend to give them so much as a direction how to obtain justification by their most punctual obedience to its precepts, that being to fallen man utterly impossible; and beside, had he promulgated the law to that end and purpose, he had not added it, but directly opposed it to the promise; which it is manifested he did not; Gal. iii. 21. “Is the law then against the promise of God? God forbid.” And verse 18 makes it appear, that had it been set up to that end and purpose, it had utterly disannulled the promise; for if the inheritance be of the law, it is no more by promise.

What then can be clearer, than that the law at Sinai was published with gracious gospel-ends and purposes, to lead men to Christ, which Adam’s covenant had no respect or reference to? And therefore it can never be a pure Adam’s covenant, as you falsely call it, neither is it capable of becoming a pure covenant of works to any man, but by his own fault, in rejecting the righteousness of Christ, and seeking justification by the works of the law, as the mistaken carnal Jews did, Rom. x. 3. and other legal justiciaries now do. And upon this account it is that Paul, who so highly praises the law in its subserviency to Christ, thunders so dreadfully against it, as it is thus set by ignorant mistaken souls in direct opposition to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Faederis: or, A Reply to Mr Philip Cary’s Solemn Call</cite>, in The Works of John Flavel (6 vols, Edinburgh, 1968), vi, 335-36.</span></figcaption>

%2C+but+by+his+own+fault%2C+in+rejecting+the+righteousness+of+Christ%2C+and+seeking+justification+by+the+works+of+the+law%2C+as+the+mistaken+carnal+Jews+did%2C+Rom.+x.+3.+and+other+legal+justiciaries+now+do.+And+upon+this+account+it+is+that+Paul%2C+who+so+highly+praises+the+law+in+its+subserviency+to+Christ%2C+thunders+so+dreadfully+against+it%2C+as+it+is+thus+set+by+ignorant+mistaken+souls+in+direct+opposition+to+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+Vindiciae+Legis+et+Faederis%3A+or%2C+A+Reply+to+Mr+Philip+Cary%E2%80%99s+Solemn+Call%2C+in+The+Works+of+John+Flavel+%286+vols%2C+Edinburgh%2C+1968%29%2C+vi%2C+335-36.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F726355ccc6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/726355ccc6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/05/02/john-flavel-on-the-mosaic-covenant-and-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In a day when the covenant of works is being attacked by Federal Visionists and others who, while generally orthodox, have allowed their biblicism to get the better of them, we can find encouragement in the words of John Paul:

The covenant of works is a doctrine which has stood the test of examination during a series of centuries: the friction of opposition has only tended to brighten its evidence: its advocates are daily increasing, and the myriads of those virulent pamphlets published against it, have, like Jonah’s gourd, “sprung up in a night and perished in a night.</p></blockquote>

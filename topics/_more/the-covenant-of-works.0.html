<blockquote><p>The first sort of persons who are slighters of this great salvation, are those persons who go about to establish their own righteousness, and will not submit to the righteousness of Christ; (in a word) it is that sort of persons who think they may win to heaven by a Covenant of Works, and will not take the Gospels way of travelling to heaven in the Covenant of Grace. And surely there is not a person here who hath not that cursed inclination to be as little obliged to Christ (for his salvation) as he can; we would go to heaven without the way, which is Christ. And (believe me) there are many in this Congregation who go thus about to establish their own righteousness. And I shall propose six sorts of persons who fall under this first rank.

The first sort are those who trust on their own civility, and think that will carry them to heaven; those are the persons who go about to establish their own righteousness. Say they, I defy the world to say any thing to me, I was overmore an honest man and I trust therefore that I shall go to heaven; but I say to thee, (O Atheist that thou art) thou shalt never win to heaven by those means, till thou come to Christ with this, All my righteousness is like filthy rags.

The second sort are those who build their confidence upon their denial of their good Works, but yet come never this length to make use of Jesus Christ.

The third sort are those who build their confidence upon their duties; they think they will come to heaven by their good prayers, by their reading, and by their fasting, (like unto that Pharisee, Luke 18. 11.) I thank God I am not like other men; for I fast twice in the week, I pay tithes of all that I possess: But I say unto thee, thy duties will never bring thee to heaven if Christ he not the end of all thy duties, nor can you perform a duty without him.

The fourth sort of Persons who fall under this first rank of slighters of the great salvation, are those who trust on their convictions; if they have once been convinced of their sin and miserable estate, they think there is no more to do, Christ will never reject them, so they sit down and build their hope upon those convictions.

The fifth sort of persons are those who build their confidence upon their resolutions; say they, oftentimes I have resolved to be a better man than I am, therefore I think (which is the fearful delusion of many) that God will accept the will for the deed; but it had been good for many such a word had not been in the Bible; or that their cursed eyes had never read it. But know this that though thou hadst as strong resolutions as Peter, or as good wishes as Balaam’s had, if thou never labour to bring them to practice, God shall say to thee, Depart from me, I know you not: Any of you who build upon your resolutions, you will build upon a sandy foundation, these being many times a goodness but like the morning dew,

And the sixth sort of persons who fall under this first rank of slighters of the great salvation (and wherein the evil is most subtle) are those who build their salvation upon their graces; these also go about to establish their own righteousness; but I say to such, Their graces cannot be the foundation of their hope, though they may be as evidences to strengthen their hope. Now are there none here who fall under this first rank of slighters of the great salvation? or are there none here who will confess that they have gone about to establish their own righteousness?

I say to thee who wilt confess, put a rope about thy neck, and come to Christ; for he is a merciful King: I say to thee, Come to Christ with this, All my righteousness is like filthy rags; and if thou wilt come with this in sincerity, he shall say, Bring forth the white robe and put upon him. If thou canst be brought to speak that in sincerity to Christ, there shall be no more betwixt Christ and thee, but Come and clothe him with the whole robe.</p></blockquote>

<blockquote><p>A Sacrament, is an outward sign, which God joineth to his covenant, which he hath made with men. And that is either of an eternal, or temporal covenant. A Sacrament of an eternal covenant, is a Sacrament, whereby God doth confirm the promise of eternal life. And that is either of the covenant of works, or of the covenant of grace.

The Sacrament of the covenant of works, is a Sacrament, which God gave our first parents in the state of their first integrity. And that was two fold, the tree of life, and the tree of the knowledge of good and evil. The tree of life was a Sacrament of the covenant of works, whereby that life was signified, which man should have lived, if he had stood in the obedience of God. Gene. 2.9.

The tree of the knowledge of good and evil, was a Sacrament by which was signified to man, in how good estate he was whilst he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2.17. &amp; 3.7.8.9.10.11.</p></blockquote>

800614bdde.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/800614bdde.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/30/amandus-polanus-on-the-sacraments-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-82915f59a4" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promiseth to men some good, &amp; requireth of them again, that they perform those things which he commandeth. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promiseth men eternal life. And that is two fold, the covenant of works, or the covenant of grace.

The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, &amp; also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2.17.

The repetition of the covenant of works is made by God, Exod. 19.5. Deut. 5.2. 1. King. 8.21. Heb. 8.9. and that chiefly for four causes.</p></blockquote>

enant-of-works-and-its-republication/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-bf77a45789" data-kw="">
<blockquote><p>To say that God carryeth all things by an absolute and unconditional decree of providence, viz. opposing absolute to all conditions presupposed in the creature, in my judgment is neither agreeing to the Doctrine of Scripture, nor of our Divines; who do both teach that as God in the fulness of time doth administer and dispense the way of his providence, so he decreed to dispense them in the same manner from eternity.

Now in dispensing the performance of the Covenant of works, the Lord punisheth and rewardeth the creature according to the condition of obedience or disobedience performed by it, as it is at large described, Levit. 26; Deut. 28. and therefore surely he decreed to carry such works of his providence upon the same conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 245.</span></figcaption>

</figure><figure class="quote" id="q-c9f03dff6b" data-kw="">
<blockquote><p>Thus also He made man with free will; and although ignorant of his future fall, yet therefore happy, because he thought it was in his own power both not to die and not to become miserable. And if he had willed by his own free will to continue in this state of uprightness and freedom from sin, assuredly without any experience of death and of unhappiness he would have received by the merit of that continuance the fulness of blessing with which the holy angels also are blessed; that is, the impossibility of falling any more, and the knowledge of this with absolute certainty. For even he himself could not be blessed although in Paradise, nay, he would not be there, where it would not become him to be miserable, if the foreknowledge of his fall had made him wretched with the dread of such a disaster.

But because he forsook God of his free will, he experienced the just judgment of God, that with his whole race, which being as yet all placed in him had sinned with him, he should be condemned. For as many of this race as are delivered by God’s grace are certainly delivered from the condemnation in which they are already held bound. Whence, even if none should be delivered, no one could justly blame the judgment of God. That, therefore, in comparison of those that perish few, but in their absolute number many, are delivered, is effected by grace, is effected freely: thanks must be given, because it is effected, so that no one may be lifted up as of his own deservings, but that every mouth may be stopped, and he that glorieth may glory in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Rebuke and Grace</cite>, (c. 427), 28 in Nicene and Post-Nicene Fathers 1, 5: 483.</span></figcaption>

</figure><figure class="quote" id="q-93553b2f79" data-kw="">
<blockquote><p>Now, the covenant of works being broken, the justice of Jehovah, required the execution of the curse of it; in order that a covenant of grace and peace, might be established. But, if the curse had been executed upon the sinners themselves, the fire of Divine wrath, should have burned eternally on them; and after all, such a sacrifice, could never have sent forth a savour, smelling so sweetly, as to be a savour of rest to vindicative justice; because they, were not only mere creatures, whose most exquisite torments, could never have amounted to a sufficient compensation, for the injury done to the honour of infinite Majesty; but were sinful creatures too, who would still, even under their eternal sufferings, have continued to sin. The Lord Jesus, therefore, being both “equal with God,” and “separate from sinners,” did in the covenant, consent to be, in the room of his elect seed, the sacrifice, upon whom the curse of the covenant of works, might be fully executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 104.</span></figcaption>

</figure><figure class="quote" id="q-9ab7020e99" data-kw="">
<blockquote><p>Christ is directly intended and pointed out by the law. If ye consider the whole administration of Moses, that is, the law and covenant of works, though it was preached after the fall, yet it was never preached alone without the gospel, and so consider the whole administration of God’s mind and ordinances, Christ is principally aimed at; for, I. The doctrine Moses delivered in mount Sinai contained a covenant of grace. If you look to the preface of the ten commandments, it is even the chief gospel-promise, and article of the covenant.

For, how could God come in terms with men after sin, but in terms of grace; and in no other terms can man stand before God, nor God be his God. And likewise, seeing the gospel was preached in paradise, and afterwards to Abraham, God could not be false in his promise made to Abraham, neither could the promulgation of the law that followed make that null which went before. Gal. iii. 17. What meant all the ceremonial law? It shadowed out Jesus Christ the only sacrifice and propitiation. And this is the sum of the gospel-salvation to penitents believing in Christ, and looking through the sacrifices unto him, and thus David’s righteousness was the imputation of righteousness, and not inherent holiness, Psal. xxxii. 1, 2; Rom. iv. 5.

But, 2. It uses to be a question, whether the law delivered upon mount Sinai was a covenant of works or not; some say that the law which was delivered upon mount Sinai was indeed a covenant of works, though they confess it was preached with the covenant of grace, and not delivered to them to stand by it, or of intention to get righteousness by it, but to be subservient to the covenant of grace. Others speak absolutely, that the law upon mount Sinai was a covenant of grace.

We conceive this is but a contention about words; the matter is clear in itself, (1.) That neither is now the gospel preached without the law, as ye may see in Christ’s sermon upon the mount, and his sermon to the young man, Matt. v. vi. vii.; Mark x. 17; nor yet was then the law preached without the gospel, as ye may see in Exod. xx.; the preface to the commandments, and the second commandment, contain much of the gospel in them, — Deut. xxx. 6, 7, &amp;c., compared with Rom. x. 6, &amp;c., where Paul notes both the righteousness of faith and of the works of the law.

(1.) Those who say the law on mount Sinai was a covenant of works, do not assert that God gave it to be a covenant of works, out of intention that men should seek salvation thereby; but they make it only a schoolmaster to lead us unto Christ and to discover our sinful condition: and those who say it was a covenant of grace, consider it in relation to God’s end of sending it, and as it takes in all the administration and doctrine of Moses.

So there needs be no difficulty here. The matter seems clear, that the covenant of works was preached by Moses, and so it was by Paul, Rom. x., Gal. iii.; and that neither Paul nor Moses preached the covenant of works, but as a broken covenant; not as such that men could stand unto, or be saved by. No man can preach the gospel, unless he preach the covenant of works, not because both concur to the justification of a sinner, but because the knowledge of a man’s own lost condition under the one presses him to flee to the other.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Christ is directly intended and pointed out by the law. If ye consider the whole administration of Moses, that is, the law and covenant of works, though it was preached after the fall, yet it was never preached alone without the gospel, and so consider the whole administration of God’s mind and ordinances, Christ is principally aimed at; for, I. The doctrine Moses delivered in mount Sinai contained a covenant of grace. If you look to the preface of the ten commandments, it is even the chief gospel-promise, and article of the covenant.

For, how could God come in terms with men after sin, but in terms of grace; and in no other terms can man stand before God, nor God be his God. And likewise, seeing the gospel was preached in paradise, and afterwards to Abraham, God could not be false in his promise made to Abraham, neither could the promulgation of the law that followed make that null which went before. Gal. iii. 17. What meant all the ceremonial law? It shadowed out Jesus Christ the only sacrifice and propitiation. And this is the sum of the gospel-salvation to penitents believing in Christ, and looking through the sacrifices unto him, and thus David’s righteousness was the imputation of righteousness, and not inherent holiness, Psal. xxxii. 1, 2; Rom. iv. 5.

But, 2. It uses to be a question, whether the law delivered upon mount Sinai was a covenant of works or not; some say that the law which was delivered upon mount Sinai was indeed a covenant of works, though they confess it was preached with the covenant of grace, and not delivered to them to stand by it, or of intention to get righteousness by it, but to be subservient to the covenant of grace. Others speak absolutely, that the law upon mount Sinai was a covenant of grace.

We conceive this is but a contention about words; the matter is clear in itself, (1.) That neither is now the gospel preached without the law, as ye may see in Christ’s sermon upon the mount, and his sermon to the young man, Matt. v. vi. vii.; Mark x. 17; nor yet was then the law preached without the gospel, as ye may see in Exod. xx.; the preface to the commandments, and the second commandment, contain much of the gospel in them, — Deut. xxx. 6, 7, &amp;c., compared with Rom. x. 6, &amp;c., where Paul notes both the righteousness of faith and of the works of the law.

(1.) Those who say the law on mount Sinai was a covenant of works, do not assert that God gave it to be a covenant of works, out of intention that men should seek salvation thereby; but they make it only a schoolmaster to lead us unto Christ and to discover our sinful condition: and those who say it was a covenant of grace, consider it in relation to God’s end of sending it, and as it takes in all the administration and doctrine of Moses.

</figure><figure class="quote" id="q-f1348000da" data-kw="">
<blockquote><p>Vers. 3. For I testify again to every man that is circumcised, that he is a debtor to do the whole Law.

Argum. 3. Is established by the same obtestation. The Covenant of Works being abrogated, and the Ceremonial Law now abolished, if any one returns to Circumcision, the Sacrament of initiation to this Legal Covenant, he by this means makes himself a debtor to the whole Law, and consequently obliges himself to the curse, unless he perfectly with his whole strength fulfil the Law, which is the condition of the Covenant of Works. The matter is clear.

Because, although Circumcision by the purpose of God to the faithful, expecting the Messias, until Christ, was a Sacrament of the Righteousness of Faith (as Abraham was circumcised) and although in the time of toleration till the clear manifestation of Christian Liberty to them that were born Jews, Circumcision was accounted amongst things indifferent (so Timothy born of a Jewish Mother is circumcised, and Titus is not) yet to all the Jews and Proselytes of the Gentiles seeking Righteousness by Works, or by the Law, Circumcision is made part of the Legal Righteousness, or of the Obedience of the Covenant of Works, yea, and the Sacrament of that Covenant.

And after this manner the false Apostles did urge Circumcision amongst the Galatians, to whom religious Circumcision was every way unlawful. No wonder then if he said Christ will not profit them, if they bee circumcised, because they that were circumcised, by that very fact did embrace the Covenant of Works.

Vers. 4. Christ is become of no effect unto you, whosoever of you are justified by the Law: yee are fallen from Grace.

Argum. 4. Confirming the former, whosoever of you return to Circumcision, and Legal Customs abolished, seeking Justification by the Law, yet by that same fact renounce Christ, and the Covenant of Grace, because the Covenant of Works, and the Covenant of Grace in Christ, do mutually exclude one another, neither can they consist. For if Justification is by Works, it is not by Grace, and on the contrary: Therefore ye must stand in your liberty, except you would be separated from Grace and Christ.</p></blockquote>

<blockquote><p>God graciously entered into a covenant with holy Adam, and with his posterity in him, to the effect, that if he obeyed the command not to eat of the forbidden fruit, he should receive as his reward indefectibility of holiness and blessedness.

This is proved by Gen. 2:17, “In the day thou eatest thereof thou shalt surely die;” which implies the converse, “If thou dost not eat thereof, thou shalt surely live.” The “life” here implied and promised is a good additional to what Adam already had; otherwise it would not be a reward.

Adam already had spiritual life, namely holiness and happiness; but it was mutable. The additional good, therefore, must have been immutable holiness and happiness. He was to have had spiritual life as indefectible. He was to have passed beyond all possibility of apostasy and misery.

The merit to be acquired under the covenant of works was pactional. Adam could claim the reward, in case he stood, only by virtue of the promise of God; not by virtue of the original relation of a creature to the creator. Upon the latter basis, he could claim nothing, as Christ teaches in Luke 17:10.</p></blockquote>

<blockquote><p>First Prop. If we had fulfilled the conditions of the first covenant, we should, by what we did, have obtained eternal life and blessedness.

Man was not made naturally immortal or incapable of death. Every creature is capable of death, and therefore we are told that God only hath immortality (1 Timothy 6:16). Indeed, man when he was first created had no seeds of corruption and death in his nature, no principle of decay that tended gradually to bring him again to the dust, but yet he was not incapable of dying. He was capable of both temporal and eternal death.

This matter therefore must be as God should dispose, whether he should die or live forever. God was not pleased absolutely to promise this to man when he first created him, but he gave him a trial for it. He promised implicitly that if he would approve himself perfectly obedient to Him, after a due time he should have eternal life and blessedness made sure to him.

Though his living forever as yet was not certain to him, yet God gave him a fair opportunity to have it made sure to him afterwards. It depended only on his own fidelity to his Creator. He had a fair opportunity after a while of being called to the tree of life, and so having everlasting life sealed to him, and be put out of all possibility of ever dying either eternally or temporally and, withal, of receiving a great addition of happiness.

Man in the state wherein he was created was in a very happy condition in paradise, as we have already shown. But doubtless, if he had stood, he would have been advanced to a much greater happiness. ‘Tis most reasonable to suppose that the blessedness he enjoyed even while in a state of trial shouldn’t be so great as after he had done his work and come to receive his reward. He now enjoyed life, but if he had stood he would have been called to the tree of life to eat of that, and his life should not only have been ascertained to him forever, but he would have advanced to a higher degree of life.

Eternal life was then, as it is now, the great promise of God. It was the promise of the covenant of works as well as the covenant of grace. And as eternal life don’t now, so it did not then, only denote a continuance of man’s life forever so that he should never die, but it denotes a most glorious and blessed life.

If Adam had stood, the tree of life would have been a tree of life to him these two ways, viz. as upon the eating of it after his trial he was to have a living forever ascertained to him, and was also to be exalted to a more glorious and blessed life.

His time of trial would not have lasted always. After a due time, if man had stood, he was to be confirmed then, and man would have [been] put beyond all possibility of falling. Not beyond a natural possibility—no creature ever was or ever will be naturally impeccable or naturally incapable of sinning—but God would have become engaged for his never sinning or dying, as we have all reason now to conclude that it is with the angels. They had a time of probation as well as man, as is evident because some of ’em fell. But the angels of light are now past their probation and are in a state of confirmed holiness and blessedness.

We have no account how long man was to have been tried before he was to be confirmed, and ’tis not probable that God revealed that to man. But if he proved obedient, after a due time he was to have eat of the tree of life.

The tree of life was a tree that God planted with the rest of the garden, that man might be the more assured of his reward in case of his obedience, and that this consideration might engage his spirit the more earnestly to seek that he might come to taste of it. ‘Tis probable that God told Adam of this tree to encourage his obedience. He might tell him in earnest that man had an opportunity of obtaining the fruit of this tree, and that eternal life and blessedness of which it was a seal, by what he himself did; an obtaining of this blessed reward was in his power.

It was in man’s own power perfectly to obey the law of God, which is not in our power now since the fall, as it was more in man’s power perfectly to obey the law and persevere in it then, than it is for fallen man to perform one act of sincere obedience. And that, upon two accounts, viz.

1. As he had no sin then that he was under the power and dominion of. We can’t obey now because we are dead in trespasses; Ephesians 2:1, “and you hath he quickened, who were dead in trespasses and sins.” We are stones; our hands are pinioned by strong lusts. But our first parents, they were free, not under any such bondage.

2. Adam had a sufficient assistance of God always present with him to have enabled him to have obeyed if he had used his natural abilities in endeavouring it, as he might do, though the assistance was not such as it would have been after he was confirmed to render it impossible for him to sin. Man might be deceived so that he should not be disposed to use his endeavours to persevere, but if he did use his endeavours, there was a sufficient assistance always with him to enable him to persevere. So that man had a very fair opportunity of obtaining eternal life and blessedness under the first covenant, and it was in his power to obtain it by what he did himself.</p></blockquote>

<blockquote><p>Let the question be asked, Why is the possession of all saving blessings connected with faith, and with faith alone? It is easy, at once, to dismiss all answers to this question which would imply that there is anything like a plea of merit, or a qualification of worthiness, in faith.

It is, doubtless, in itself an excellent grace, most honouring and acceptable to God and his beloved Son, as well as most becoming and ennobling to him who exercises it. It is, moreover, the source of all excellence, working by love, and assimilating its possessor to God himself; for, by “the exceeding great and precious promises” which faith receives, we “are made partakers of the divine nature.”

But to represent it as saving or justifying, on account of its own excellency or the virtue that goes out of it, is to build again the covenant of works — making the good quality of faith, or its good fruits, our real title to the divine favour and eternal life, instead of the perfect obedience which the law requires. In this view, the dispensation of grace, brought in through the mediation of Christ, consists simply in a relaxation of the terms of the old natural and original method of acceptance — not in the establishment of a method of acceptance entirely new.</p></blockquote>

<blockquote><p>The Father, according to his eternal covenant with the Son as last Adam, sent him, in order that he might bear their griefs, and carry their sorrows; and so might, at the infinite expense of his unparalleled anguish, agony, and death, purchase for them, the comfort which they, in the first Adam, had forfeited.

He sent his only, his dear Son, to endure the pains of eternal death for them, that they might enjoy, in union with Him, the comfort of eternal life; … The Father hath also exalted him, in the human nature, to universal dominion; on purpose that, he might dispense the comfort of salvation, to all who should believe in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh: J. Ogle, 1814), p. 48.</span></figcaption>

</figure><figure class="quote" id="q-79de0305f6" data-kw="">
<blockquote><p>There is much confusion nowadays as to whether or not the covenant of grace is conditional or unconditional. Much of this confusion stems from not carefully distinguishing how older writers were employing their terms. When earlier Reformed divines argued that faith was the condition of the covenant of grace, the word condition was being used in an improper sense. Faith was not a condition properly speaking, in the sense of being a moving or meritorious cause. The only moving or meritorious cause in the covenant of grace is the righteousness of Christ Strictly speaking, then, the covenant of grace is unconditional. Alexander Moncrieff reminds us that to argue that the covenant of grace is conditional in a proper sense introduces a new legalism, which turns the covenant of grace into a covenant of works:

We observe, that altho’ a Consent to take Christ our Lord, to be ruled and governed by him, and to observe and keep his Commandments, be not the Condition and Terms of the Covenant of Grace, as we have already shewn, by which Doctrine Legalists have subverted the Gospel of Christ, and turned the Covenant of Grace into a new Law, or new Form of a Covenant of Works; yet, upon the Back of our believing the Promise, and trusting on the Person of Christ, by which we are personally entered into the Covenant, there doth necessarily follow an absolute Consent to take Christ for our Husband, Head and Lord; a Consent to take Christ as our only Priest, to be saved by his Righteousness alone …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-5787317045" data-kw="">
<blockquote><p>While Augustine of Hippo did not use the exact phrase “covenant of works” in the below extract, he clearly believed in the substance of the doctrine. It is interesting that he makes the below statement in his polemics with the Pelagians, which gives the lie to the Shepherdite/Federal Visionist slander that the doctrine is Pelagian:

If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Julian</cite>, (c. 420), 1.6.24 in The Fathers of the Church: A New Translation, 35: 28-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-ad9b50d507" data-kw="">
<blockquote><p>Indeed the Lord by a special institution given to Adam, Gen. 2. 1. had for the times before Christ appointed that they should reckon from the creation, which was the cause of that special institution; but this is no part of the Commandment; and in that institution God did two things:

1. He appointed the period from whence the seventh [day] should be accounted, which else Adam according to the Law infused into him would have taken otherwise, for those ten were written in Adam’s heart, as is signified by the writing them in Tables of Stone, and calling them the Tables of the Covenant, for God did not make one Covenant with Israel another with Adam but one and the same with both. Indeed the Covenant made with Israel was put in the Ark, to shew Christ to be the end of the Law, but yet it was the same Covenant for matter, and so all the parts of it were written in Adam’s heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, p. 814.</span></figcaption>

</figure><figure class="quote" id="q-c409fa3a46" data-kw="">
<blockquote><p>The Gospel admits of Repentance after our Falls, and restores us again to the Favour of God upon our true Humiliation: but the Law as a Covenant of Works, left no room for Repentance, but required perfect Obedience without the least Failure; and in case of Non-performance, nothing was to be expected but the Execution of that Death it threatened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 23.</span></figcaption>

</figure><figure class="quote" id="q-ae749ac6db" data-kw="">
<blockquote><p>Besides, consider this, that the covenant [of grace] is made in Jesus Christ. There are two Adams, he made a covenant with both: with the first Adam, he made a covenant, as with the common root of all mankind; but Adam brake the covenant, and so did all his members. But there is a second Adam, and all that are saved, are members of him as truly as we are of the first Adam: and he kept the covenant, and therefore if he stand, they shall stand also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life Eternal or, A Treatise of the Knowledge of the Divine Essence and Attributes</cite>, (2nd edn, London: Nicholas Bourne, 1631), Part II, p. 87.</span></figcaption>

— John Preston, Life Eternal or, A Treatise of the Knowledge of the Divine Essence and Attributes, (2nd edn, London: Nicholas Bourne, 1631), Part II, p. 87.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBesides%2C+consider+this%2C+that+the+covenant+%5Bof+grace%5D+is+made+in+Jesus+Christ.+There+are+two+Adams%2C+he+made+a+covenant+with+both%3A+with+the+first+Adam%2C+he+made+a+covenant%2C+as+with+the+common+root+of+all+mankind%3B+but+Adam+brake+the+covenant%2C+and+so+did+all+his+members.+But+there+is+a+second+Adam%2C+and+all+that+are+saved%2C+are+members+of+him+as+truly+as+we+are+of+the+first+Adam%3A+and+he+kept+the+covenant%2C+and+therefore+if+he+stand%2C+they+shall+stand+also.%E2%80%9D%0A%0A%E2%80%94+John+Preston%2C+Life+Eternal+or%2C+A+Treatise+of+the+Knowledge+of+the+Divine+Essence+and+Attributes%2C+%282nd+edn%2C+London%3A+Nicholas+Bourne%2C+1631%29%2C+Part+II%2C+p.+87.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae749ac6db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae749ac6db.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/18/john-preston-on-the-two-covenants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d69720042c" data-kw="">
<blockquote><p>For when I saw that the Covenant of works did in justice reward according to works, as well with life upon condition of obedience, as with death in case of disobedience; I began to conceive, that as the purpose of election was suitable to the Covenant of grace; so suitable unto a Covenant of works, must be a purpose of retribution. For how shall God covenant to retribute or recompense with life or death according to works, if he have no purpose at all of such retribution?

How shall the Covenant of works promise life upon condition of obedience, if the purpose of reprobation have absolutely determined death upon all them within that Covenant, without all respect of good or evil, obedience or disobedience in any of them?

[T]he grace of redemption offering the death of Christ, and reaching forth some fruits thereof unto all, as the promising and offering sufficient help to bring them to the knowledge of God and means of grace: yea, and sometime bestowing on them the participation of some excellent and common graces, doth not make a third covenant, partly of grace, partly of works, but bindeth such so much the more to keep the Covenants of works, by how much the more helps and means God vouchsafeth them to keep it. It is not the helps of grace offered or given, that includeth men with in any part of the Covenant of grace, but the condition whereupon it is offered or given.

Secondly, if God offer grace and give, though never so small, even as a grain of Mustard-seed, and promise to uphold it freely for Christ his sake, and not according to our works, it is a Covenant of Grace. But if he offer and give never so many gracious helps, and means, and gifts, and uphold them according to the works of the creature; it is still a Covenant of works, as it was to the Angels that fell, and to Adam, though he gave to both of them the whole Image of God, and besides, heaven it self to the one, a Paradise to the other, it is but the same covenant of works which God made with the world of mankind after the fall, and with Adam before the fall: though Adam received greater means and helps to keep it, then his posterity had after the fall.</p></blockquote>

<blockquote><p>Vers. 4. Wherefore my Brethren, ye also are become dead to the Law by the Body of Christ, that ye should be married to another, even to him who is raised from the dead, that we should bring forth fruit unto God.

The Apodosis of the comparison, to this manner; So you that were espoused formerly to the Law by a Covenant of Works, Christ being dead for you, that he might satisfy the Law, Justice, and the Covenant of Works in our name, you are judicially dead to the Law, in the body of Christ (for the Law, or Covenant of Works hath slain Christ, and you in him) and by consequence you are delivered from the matrimonial Covenant of the Law; so that without the breach of Justice you may enter into a new Covenant of Grace, with Christ, being raised from the dead.

To this end he shews, that the purpose of marriage being disannulled, betwixt the Law of Works and us, not that we should live as we list, but being raised from a state of death, by the Resurrection of Christ, that we should be espoused to another Husband, viz. to him which is raised from the dead, i. e. to Christ, who rose from the dead, and hath raised us with himself to newness of life, and hath espoused us to himself, according to the Covenant of Grace, that being married unto Christ, we might bring forth fruits of obedience to the glory of God.</p></blockquote>

<blockquote><p>Vers. 19. Now we know that what things soever the Law saith, it saith to them that are under the Law; that every mouth may be stopped, and all the world may become guilty before God.

He prevents an Objection, lest any man should elude the force of the testimonies before recited, as if they belonged but to some few, and those certain impious men, who lived in the times of David or Isaias. Here he shews that the common disposition of mankind is taxed, which live under the Law, or the Covenant of Works, and not under grace; and hereupon these fore-cited sentences of the Law, are directed against all men, under the state of corrupt nature, chiefly the Jews; whereupon a threefold conclusion is inferred. First, from hence every mouth is stopped, lest any man should glory in himself, or excuse himself in the judgement of God. Another conclusion, Hence the whole world is made liable to condemnation, and obnoxious to punishment.</p></blockquote>

<blockquote><p>By the passover, the children of Israel were delivered from death only in one form and on one occasion; they were still exposed to its ravages and its alarms. The angel of death hovered around their camp, and fed on the carcasses which fell in the wilderness. His terror overtook them before they had gone far on their journey. “Because there were no graves in Egypt, hast thou taken us away to die in the wilderness!” was their fearful exclamation on finding themselves between the pursuing Egyptians and the Red Sea. And they were haunted by the fears of death during the whole period of their wanderings in the wilderness. “Behold we die,” cried they on one occasion, “we perish, we all perish.”

And at mount Sinai, “Let not God speak to us, lest we die.” Such was the nature of that dispensation, so far as it exhibited the covenant of works. Hence we read of “the covenant from the mount Sinai which gendereth to bondage,” in opposition to “Jerusalem which is above and is free.” Not that we are to suppose, with some, that the church was then under a covenant of works, or that believers were then under the spirit of bondage; but such was the character of the law as threatening death, such the spirit of those who sought life by it; and in its external revelation, in its ordinances of worship, and in the distance at which worshippers were kept, there were so many memorials that atonement was not yet actually made.

In this respect it was “the ministration of death and condemnation;” and it may be in allusion to the effects which it produced on the blinded children of Israel, who “could not look steadfastly to the end of that which is abolished,” that the apostle says in the words before us, that Christ hath “delivered them who through fear of death were all their lifetime subject to bondage.</p></blockquote>

<blockquote><p>While the covenant of works is not a prominent theme in Zacharias Ursinus’s Commentary on the Heidelberg Catechism, he does make at least one important reference to it in contrast to the covenant of grace. The idea that the covenant of works is a Westminsterian novelty has no credence in history. If it were a novel teaching of the Westminster Assembly, then why did prominent continental divines such as Francis Turretin and Herman Witsius also defend it? In the following extract, Ursinus contrasts the reward for obedience under the covenant of works with the rewards for the sincere, but imperfect obedience of believers in the covenant of grace:

Obj.4. The severity of divine justice does not render good according to works which are not perfectly good. But Christ in the final judgment will render to every one, and so to the saints also, according to their works. Therefore the works of the saints are so perfect that they will in themselves stand in the judgment of God.

Ans. There are here four terms; because the major must be understood of a legal reward of works, whilst the minor must be understood of a reward that is; evangelical; or to express it differently, we may say that the justice of God does not render good according to works which are imperfect, if he judges according to the covenant of perfect obedience to the law.

But Christ, in rewarding the works of the saints, will not judge according to the covenant of perfect works, but according to the covenant of faith, or of his own righteousness imputed and applied to them by faith; and yet he will judge them according to their works as according to the evidences of their faith, from which their works have proceeded, and which they, as the fruits of this faith, declare to be in them.</p></blockquote>

<blockquote><p>18. Q: Was this covenant of works renewed afterwards [after the Fall]?

A: It was continually renewed right from the creation and fall of man up until the advent of Christ: first, it was delivered by word of mouth; then, it was engraved by God’s own finger upon the tables of stone; afterwards, it was delivered and written by Moses; finally, it was repeated and written by the prophets, each in his own place and order, and so it is known [to us] from the Old Testament.

19. Q: In what manner and order was it renewed?

A: You have the order in Exodus 19 and 20. First, God says through Moses, “If you will observe my covenant (that is, my law), certainly you will be my own peculiar possession.” Then, the people said together, “Whatever Jehovah says we will do.” When Moses had reported the people’s counter obligation (restipulatione) to God, God promulgated his law — that is, the principal divisions of his covenant, which should be observed by the people — from Mount Sinai.

20. Q: But have you not just said that the law comes first, and the covenant follows after?

A: It is the same whether the words of the covenant (which words comprise the obligation and counter-obligation) precede the law — that is, the statement of the principal divisions of that condition which belongs to God’s covenant — or follow after it.

21. Q: To what end was the covenant of works renewed, after the fall of man, with the ancient Church and people, since, after the fall, the condition of good works proceeding from nature was impossible to man (Rom. 8:3)?

A: It was not repeated chiefly with the end that men should, by means of it, be justified and live, but to the end that men, convicted in their consciences and overwhelmed by that impossible condition of good works proceeding from nature, might flee to the covenant of grace (Deut. 10:16; Rom. 3:19; 7:7ff).

22. Q: So you mean that the covenant of works was renewed with the ancient people chiefly with the end that they should be prepared for the covenant of grace?

A: I do.

23. Q: But not all were prepared, neither did all flee to the covenant of grace?

A: True. But the elect were prepared. The reprobate, indeed, were reduced at length to desperation (Rom. 11:7).</p></blockquote>

<blockquote><p>Christ crucified, by satisfying the justice of God, brake the thunders of the law, and dissolved the frame of all its anathemas: ‘Being made a curse for us, he hath redeemed us from the curse of the law,’ Gal. iii. 13, i.e. from the sentence of the lawgiver, denounced in his law against the transgressors of it; so that ‘now there is no condemnation to them that are in Christ Jesus,’ Rom. viii. 1, because they are ‘dead to the law by the body of Christ,’ Rom. vii. 4. By the body of Christ as slain and raised again: for this ‘handwriting of ordinances, which was contrary to us, is taken out of the way by God, being nailed to his cross,’ Col. ii. 14.

He hath abolished the obligation of the moral law, as to any condemning power, it being the custom to cancel bonds anciently by piercing the writing with a nail. The ceremonial law was abolished in every regard, since the substance of it was come, and that which it tended to was accomplished; and so one understands ver. 15, ‘Having spoiled principalities and powers, he made a show of them openly,’ of the ceremonies of the law, called principalities and powers in regard of the divine authority whereby they were instituted. These he spoiled; the word ἀπεκδυσάμενος signifies unclothing, or unstripping; he unveiled them, and shewed them to be misty figures that were accomplished in his own person.

The flower falls when the fruit comes to appear; grace and truth came by Jesus Christ, grace to obey the precepts, and truth to take away the types. But it is also meant of the condemning power of the moral law, which was nulled by the death of Christ, who, upon his cross sealing another covenant, repealed the former. The settling a new covenant implies the dissolution of the old. That was nailed to his cross which was contrary to us, a law that was a charge against us, and by virtue whereof we were sued; and this was the law as sentencing us to death, which was pierced and torn by those nails, that did discover that debt and denounce the sentence, which cannot be meant so properly of the ceremonial as the moral law.

The ceremonial law of sacrifices was the gospel in shadows, and appointed for the relief of men, and as a ground whereon to exercise their faith till the appearance of the substance, and therefore cannot be said to be contrary to us, but an amicable discovery, that we are to have that relief in another which we wanted in ourselves; and that we were to be freed from the sentence of death by some grand sacrifice represented by those sacrifices of animals.

Besides, the apostle writes this as a cordial, issuing out of the blood of Christ to the Gentile Colossians, who never were under the obligations of the ceremonial law, that being appropriated to the Jews. The apostle brings it to back his assertion, that their trespasses were forgiven. This argument had been of no use to the Gentiles, who sinned not against the ceremonial law, but the moral law; and if one only had been cancelled, and not the other, the Jews themselves, whose offences were most against the moral law, had had little or no comfort in having the fewest of their sins forgiven.

Our Saviour died by the power and force of the moral law: that brought him to the cross for the fulfilling it in its penalty, as well as he had done in his life by his obedience; and he receiving the full execution of its sentence upon himself on the cross, as a substitute in our place, nulled that sentence as to any force upon those that believe in him. The plea against it is, that it hath already been executed, though not upon our persons, yet upon our surety; so that, being nailed to his cross, the virtue of his cross must cease before the killing power of the law can revive. This crucified Christ, who disarmed the law of its thunders, defaced the obligation of it as a covenant, and, as it were, ground the stones upon which it was writ to powder, is worth our exact knowledge and studious inquiry.</p></blockquote>

Our Saviour died by the power and force of the moral law: that brought him to the cross for the fulfilling it in its penalty, as well as he had done in his life by his obedience; and he receiving the full execution of its sentence upon himself on the cross, as a substitute in our place, nulled that sentence as to any force upon those that believe in him. The plea against it is, that it hath already been executed, though not upon our persons, yet upon our surety; so that, being nailed to his cross, the virtue of his cross must cease before the killing power of the law can revive. This crucified Christ, who disarmed the law of its thunders, defaced the obligation of it as a covenant, and, as it were, ground the stones upon which it was writ to powder, is worth our exact knowledge and studious inquiry.”

— Stephen Charnock, A Discourse of the Knowledge of Christ Crucified, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 499-500.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+crucified%2C+by+satisfying+the+justice+of+God%2C+brake+the+thunders+of+the+law%2C+and+dissolved+the+frame+of+all+its+anathemas%3A+%E2%80%98Being+made+a+curse+for+us%2C+he+hath+redeemed+us+from+the+curse+of+the+law%2C%E2%80%99+Gal.+iii.+13%2C+i.e.+from+the+sentence+of+the+lawgiver%2C+denounced+in+his+law+against+the+transgressors+of+it%3B+so+that+%E2%80%98now+there+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C%E2%80%99+Rom.+viii.+1%2C+because+they+are+%E2%80%98dead+to+the+law+by+the+body+of+Christ%2C%E2%80%99+Rom.+vii.+4.+By+the+body+of+Christ+as+slain+and+raised+again%3A+for+this+%E2%80%98handwriting+of+ordinances%2C+which+was+contrary+to+us%2C+is+taken+out+of+the+way+by+God%2C+being+nailed+to+his+cross%2C%E2%80%99+Col.+ii.+14.%0A%0AHe+hath+abolished+the+obligation+of+the+moral+law%2C+as+to+any+condemning+power%2C+it+being+the+custom+to+cancel+bonds+anciently+by+piercing+the+writing+with+a+nail.+The+ceremonial+law+was+abolished+in+every+regard%2C+since+the+substance+of+it+was+come%2C+and+that+which+it+tended+to+was+accomplished%3B+and+so+one+understands+ver.+15%2C+%E2%80%98Having+spoiled+principalities+and+powers%2C+he+made+a+show+of+them+openly%2C%E2%80%99+of+the+ceremonies+of+the+law%2C+called+principalities+and+powers+in+regard+of+the+divine+authority+whereby+they+were+instituted.+These+he+spoiled%3B+the+word+%E1%BC%80%CF%80%CE%B5%CE%BA%CE%B4%CF%85%CF%83%CE%AC%CE%BC%CE%B5%CE%BD%CE%BF%CF%82+signifies+unclothing%2C+or+unstripping%3B+he+unveiled+them%2C+and+shewed+them+to+be+misty+figures+that+were+accomplished+in+his+own+person.%0A%0AThe+flower+falls+when+the+fruit+comes+to+appear%3B+grace+and+truth+came+by+Jesus+Christ%2C+grace+to+obey+the+precepts%2C+and+truth+to+take+away+the+types.+But+it+is+also+meant+of+the+condemning+power+of+the+moral+law%2C+which+was+nulled+by+the+death+of+Christ%2C+who%2C+upon+his+cross+sealing+another+covenant%2C+repealed+the+former.+The+settling+a+new+covenant+implies+the+dissolution+of+the+old.+That+was+nailed+to+his+cross+which+was+contrary+to+us%2C+a+law+that+was+a+charge+against+us%2C+and+by+virtue+whereof+we+were+sued%3B+and+this+was+the+law+as+sentencing+us+to+death%2C+which+was+pierced+and+torn+by+those+nails%2C+that+did+discover+that+debt+and+denounce+the+sentence%2C+which+cannot+be+meant+so+properly+of+the+ceremonial+as+the+moral+law.%0A%0AThe+ceremonial+law+of+sacrifices+was+the+gospel+in+shadows%2C+and+appointed+for+the+relief+of+men%2C+and+as+a+ground+whereon+to+exercise+their+faith+till+the+appearance+of+the+substance%2C+and+therefore+cannot+be+said+to+be+contrary+to+us%2C+but+an+amicable+discovery%2C+that+we+are+to+have+that+relief+in+another+which+we+wanted+in+ourselves%3B+and+that+we+were+to+be+freed+from+the+sentence+of+death+by+some+grand+sacrifice+represented+by+those+sacrifices+of+animals.%0A%0ABesides%2C+the+apostle+writes+this+as+a+cordial%2C+issuing+out+of+the+blood+of+Christ+to+the+Gentile+Colossians%2C+who+never+were+under+the+obligations+of+the+ceremonial+law%2C+that+being+appropriated+to+the+Jews.+The+apostle+brings+it+to+back+his+assertion%2C+that+their+trespasses+were+forgiven.+This+argument+had+been+of+no+use+to+the+Gentiles%2C+who+sinned+not+against+the+ceremonial+law%2C+but+the+moral+law%3B+and+if+one+only+had+been+cancelled%2C+and+not+the+other%2C+the+Jews+themselves%2C+whose+offences+were+most+against+the+moral+law%2C+had+had+little+or+no+comfort+in+having+the+fewest+of+their+sins+forgiven.%0A%0AOur+Saviour+died+by+the+power+and+force+of+the+moral+law%3A+that+brought+him+to+the+cross+for+the+fulfilling+it+in+its+penalty%2C+as+well+as+he+had+done+in+his+life+by+his+obedience%3B+and+he+receiving+the+full+execution+of+its+sentence+upon+himself+on+the+cross%2C+as+a+substitute+in+our+place%2C+nulled+that+sentence+as+to+any+force+upon+those+that+believe+in+him.+The+plea+against+it+is%2C+that+it+hath+already+been+executed%2C+though+not+upon+our+persons%2C+yet+upon+our+surety%3B+so+that%2C+being+nailed+to+his+cross%2C+the+virtue+of+his+cross+must+cease+before+the+killing+power+of+the+law+can+revive.+This+crucified+Christ%2C+who+disarmed+the+law+of+its+thunders%2C+defaced+the+obligation+of+it+as+a+covenant%2C+and%2C+as+it+were%2C+ground+the+stones+upon+which+it+was+writ+to+powder%2C+is+worth+our+exact+knowledge+and+studious+inquiry.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Discourse+of+the+Knowledge+of+Christ+Crucified%2C+%281684%29+in+The+Complete+Works+of+Stephen+Charnock%2C+B.D.+%285+vols%2C+Edinburgh%3A+James+Nichol%2C+1865%29%2C+4%3A+499-500.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F445fbd9bcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/445fbd9bcb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/22/stephen-charnock-on-christ-abolishing-the-condemning-power-of-the-law-as-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cfc49c921c" data-kw="">
<blockquote><p>True it is, that if man had persisted in the state of his created integrity, he might, after an improper manner, be said to have merited the glory which he was after to enjoy, inasmuch as he was to obtain it in the virtue of those legal operations, unto which he was, by the abilities of his own nature, without the special influence of a supernatural infused grace, fitted and disposed; though even this was not from the dignity and value of our work, but from the indulgence of Almighty God, who would set no higher price on that glory, which he proposed unto man for the object of his desires, and reward of his works.

For if we go exactly unto the first rule of justice unqualified with clemency and bounty, it could not possibly be, that God should be bound to requite our labours with eternal bliss; there being so vast a disproportion between the fruition of God, an infinite good, and any the most excellent, yet still limited operation of the creature. For as water in its own nature riseth no farther than the spring whence it first issueth; so the endeavours of nature could never have raised man, without a mixture of God’s mercy, unto a higher degree of happiness, than should have been proportionable to the quality of his work.

But now having in Adam utterly disabled ourselves to pay that small price, at which God was pleased to rate our glory; all those who are restored thereunto again, must acknowledge both it, and Christ the purchaser of it, as a free gift of Almighty God, by them so far undeserved, as he was, before the promise, unknown and unexpected. …

Even Adam in innocency could not be without an assent and firm belief, that the faithful God would perform the promise of life, made and annexed unto the covenant of works. But this faith could not be the merit of life, but the fruit and effect of merit, or rather obedience anteceding; for his performance of the law (in the right whereof he had interest unto glory) preceding, there should immediately from thence have issued, by faith, a prepossession (as it were) and pre-apprehension of that glory, which, by virtue of that legal obedience, he should have had interest unto.</p></blockquote>

</figure><figure class="quote" id="q-09d701cb0b" data-kw="">
<blockquote><p>See hence the errors of those who imagine that it was a covenant of works which God entered into with Israel at Mount Sinai. Indeed, if the promise had followed after the commandments of the law; and if God had said, Keep these commandments, and, upon your so doing, I will be the Lord your God; in this, case it had been a pure covenant of works: whether perfect or sincere obedience had been the condition, it is all one; still the reward would have been in a way of pactional debt as in the first covenant.

But, as you heard the order of the covenant of works, or the connection betwixt the precept and promise, as it was laid in that covenant, it is now inverted: for now God first promises, in a way of sovereign grace, to be the Lord our God and Redeemer, which is the substance and sum of the new covenant; and having made such a grant of grace, to be received by faith, without, or before any works of obedience can be performed by us, be immediately subjoins the law of nature in ten words, showing us what is good, and what the Lord our God requires of us, not as a condition of his own gracious grant, but as a testimony of our love and gratitude to him, who promises, of his free and sovereign grace, to be the Lord our God.

So that, I say, it was God’s covenant of grace that was promulgated at Mount Sinai, and the law was added to it because of transgression, and graffed upon it as a rule of obedience. And whatever covenants or engagements to duty we read of, whether national or personal, still they went upon the foundation of grace laid in God’s covenant of grace; and in so far as Israel, or any else, go off from this foundation in their engagements to duty, in so far they pervert the design of the promise and law annexed to it, and turn back to a covenant of works.</p></blockquote>

<blockquote><p>The Testament given to the Christian Church is a better Testament. It is made by the Son of God, Immanuel, God with us, and ratified by his death, wherein an eternal inheritance is bequeathed unto us. Was there ever such a testament before?

2. The Covenant made between God and his Church in these later times, is a better Covenant. Give me here leave, because mention is made both of a Testament and a Covenant, to shew you the difference between them.

1. A Covenant is an agreement between two: a Testament is the declaration of the will of one.

2. The two between whom a Covenant passeth must be both living: a Testament receiveth force by the death of him that made it.

3. A Covenant is ratified by the mutual consent of both parties: a Testament, by the will only of him that made it.

4. A Covenant useth to be made upon conditions on both parts: a Testament is made upon the mere favour and grace of the testator.

Now the Covenant made with Christians is better then the two former Covenant: both called old, because they are both in such respects nulled.

The first was a Covenant of works made with man in his entire estate: which by his fall he made impossible for man to keep. But this Covenant giveth ability to keep it with much alacrity.

2. There was a Covenant indeed of grace made with the Church before Christ exhibited; but set out in such obscure promises and prophecies, and dark types and shadows, as it was needful in time to be abolished: but the new Covenant made with the Christian Church, is so clearly and plainly revealed, as it may well in that respect also be called better.

3. The Promises now made, are better Promises: most of the Promises before Christ exhibited were of temporal good things: I will not deny, but that spiritual and celestial good things were prefigured under them; but now spiritual and heavenly good things, are more expressly, perspicuously and plentifully promised to the Church.

4. The hope that now we have, is a better hope, Promises are the ground of hope. The better the promises, the better must hope needs be: and that in those respects wherein the Promises are better. Christians may more immediately, directly and steadily, hope for all spiritual and heavenly blessings, then they that lived before Christ could.

5. The sacrifice that now we have, is better then the former sacrifices. He that considereth the difference between the bodies of unreasonable creatures, &amp; the body of Christ the Son of God, cannot but know, that there is an infinite excellency in this sacrifice over and above those: If any thing under the Gospel may justly be styled, better, then the like under the Law, surely this sacrifice may most of all be styled better then those.

6. The blood of Christ, in regard of the cry of it, is styled better. It is said to speak better things then that of Abel: because Abel’s blood cried for vengeance; Christ’s, for pardon. Christ when he was upon the cross, where he shed his blood, thus cried, Father, forgive them. Yea further Christ’s blood is better then that blood which was shed on the Altars under the Law: For it is not possible that the blood of bulls and goats should take away sins: but the blood of Jesus Christ cleanseth us from all sin.</p></blockquote>

<blockquote><p>14. Q: Why is it called the covenant of works?

A: This name is taken from the condition of the covenant, which is one of works proceeding from a good and upright nature.

15. Q: When was this covenant established with man?

A: It was established from the first moment of man’s creation (Gen. 1:27ff; Gen. 2:15ff).

16. Q: In what manner and order was it established?

A: First, God engraved his law — that is, the principal divisions of his covenant’s condition — upon the heart of the man he had created; then God said, “Act and work according to the rule of my law (for it is written upon your heart), and you will live.” And man accepted the condition, and committed himself to keep it (Gen. 2:15ff).

17. Q: So you mean that the moral law was engraved upon man’s heart in creation, and that hence, the principal divisions of this covenant’s condition were known [to man] through nature itself?

A: I do. And there is evidence of this in that surviving knowledge of the law (notitia legis) which still, after the fall, remains in [man’s] corrupt nature (Rom. 1:19, 32; 2:14).</p></blockquote>

<blockquote><p>1. He from all eternity decreed the creation of man after his own image, and the making of the covenant of works with him, in time. All things brought forth in time, lay from eternity in the womb of God’s decree; in virtue whereof they have their being in time: for which cause the decree is said to bring forth, as a woman doth a child, Zeph. ii. 2. And the creation of angels and men, with the providence about them, made many lines in the volume of the sealed book of the decrees.

God self-sufficient needed neither man nor angel: but, for the manifestation of his own glory, he purposed from eternity to create them; and moreover, to enter into such a covenant with man, as one should therein represent the whole family; sovereign pleasure meanwhile taking another method with the angelic tribe: but withal purposing to give both the one and the other a sufficient ability to stand in their integrity, if they would. Thus, from eternity, the covenant of works, in all the parts and appurtenances thereof, was before the eternal mind; though being made with a mere man, it could not actually be entered into, till once man was created. But, “Known unto God are all his works from the beginning of the world,” Acts xv. 18.

2. He decreed also from eternity, to permit the first man, the representative of the whole family, to fall, and so to break the covenant, and involve himself, and all his posterity in ruins. It is evident from the spotless holiness of God, and the nature of the thing, that the divine permission was not the cause of man’s fall; and from the necessary dependence of the creature upon the Creator, that without it, he could not have fallen. But the sovereign Lord of the creatures, permitted the fall of man for his own holy ends, purposing to bring about good from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 386-87.</span></figcaption>

<blockquote><p>By the sanction of the law, we intend the promises and penalties wherewith by God the observation of it and obedience unto it was enforced. This the apostle hath respect unto in sundry places of this Epistle; the principal whereof are reported in the following dissertation. To represent this distinctly, we may observe that the law falls under a threefold consideration; — first, As it was a repetition and expression of the law of nature, and the covenant of works established thereon; secondly, As it had a new end and design put upon the administration of it, to direct the church unto the use and benefit of the promise given of old to Adam, and renewed unto Abraham four hundred and thirty years before; thirdly, As it was the instrument of the rule and government of the church and people of Israel with respect unto the covenant made with them in and about the land of Canaan. And in this threefold respect it had a threefold sanction: —

2. First, As considered absolutely, it was attended with promises of life and threatenings of death, both eternal. The original promise of life upon obedience and the curse on its transgression were inseparably annexed unto it, yea, were essential parts of it, as it contained the covenant between God and man. See Gen. ii. 17; Deut. xxvii. 26; Rom. vi.23, iv.4, x. 5, xi. 6; Lev. xviii. 5; Ezek. xx. 11; Gal. iii. 12, 13.

3. Now, in the administration of the law, the church was thus far brought under the obligation of these promises and threatenings of life and death eternal, so far interested in the one and made obnoxious unto the other, as that if they used not the law according to the new dispensation of it, wherein it was put into a subserviency unto the promise, as Gal. iii. 19—24, they were left to stand or fall according to the absolute tenor of that first covenant and its ratification; which, by reason of the entrance of sin, proved fatally ruinous unto all that cleaved unto it, Rom. viii. 3, 9:31.

4. Secondly, The law had, in this administration of it, a new end and design put upon it, and that in three things: — (1.) That it was made directive and instructive unto another end, and not merely perceptive, as at the beginning. The authoritative institutions that in it were superadded to the moral commands of the covenant of works, did all of them direct and teach the church to look for righteousness and salvation, the original ends of the first covenant, in another and by another way; as the apostle at large disputes in this Epistle, and declares positively, Gal. iii., throughout.

(2.) In that it had a dispensation added unto the commands of obedience, and interpretation, κατ επεικειαν, by condescension, given by God himself, as to the perfection of its observance and manner of its performance in reference unto this new end. It required not absolutely perfect obedience, but perfectness of heart, integrity, and uprightness, in them that obeyed. And unto the law thus considered the former promises and threatenings were annexed; for the neglect of this use of it left the transgressors obnoxious to the curse denounced in general against them that continued not in the whole law to do it. (3.) It had merciful relief provided against sin, for the supportment and consolation of sinners, as we shall see in the consideration of their sacrifices.

5. Thirdly, It may be considered as it was the instrument of the rule and government of the people and church of Israel, according to the tenor of the covenant made with them about the land of Canaan, and their living unto God therein. And in this respect it had four things in it:— (1.) That it represented unto the people the holiness of God, the effects whereof are implanted in the law according to its original constitution; whereupon in it they are often called to be holy, because the Lord and Lawgiver is holy. (2.) That it gave a representation of his grace and condescension, pardoning sin in the covenant of mercy, inasmuch as he allowed a compensation by sacrifices for so many transgressions, which in their own nature were forfeitures of their interest in that land. (3.) That it was a righteous rule of obedience unto that people as unto their especial covenant condition. (4.) That it fully represented the severity of God against willful transgressors of his covenant, as now renewed in order to the promise, seeing every such transgression was attended, in their administration of rule, with death without mercy.</p></blockquote>

<blockquote><p>Because God added thereunto a pledge and Sacrament in the Tree of Life, whereby he would have that Covenant of the Law, written in the heart, more clearly confirmed also outwardly; to wit, that he would by the observation of his Law, first perpetuate man’s life in this world unto the solemn justification of him; at his appointed time; and then advance him to a further and heavenly Felicity. And on the other side, he threatens Death unto him, in case he should depart from that Will and Law of God: all which had been done to no purpose, if man had been at first made by God himself, in any measure or manner sinful and perverse.</p></blockquote>

<blockquote><p>2. Q: How many fold is the covenant of God established with man? A: It is twofold: there is the covenant of nature or works, and the covenant of grace (Gal. 4:24).

3. Q: What is the covenant of nature or works? A: It is the covenant of God in which he promises man eternal life under the condition of good works—works proceeding from the virtues of [man’s] nature (vires naturae)—and man, moreover, accepts that condition of good works (Lev. 18:5; Rom. 10:5; Gal. 3:12).13

4. Q: Has no grave threat been added to the promise of this covenant? A: One has been added.

5. Q: In what form? A: Cursed is the one who will not persist in doing all things which have been written in the book of law, in order to do them (Gen. 2:17; Deut. 27:26; Gal. 3:10).

6. Q: What is the basis (fundamentum) of the covenant of works? A: A good, holy, and upright nature, of the kind which was in man at creation. For if God had not made man, in the beginning, according to his own image—that is, wise, holy, and just by nature—then he could not, surely, have established with man this covenant, which has for its condition holy, just, and perfect works proceeding from [man’s] nature (Gen. 1:26, 27; Eph. 4:24; Col. 3:9).

7. Q: What is promised in the covenant of works? A: A blessed life which should endure forever (Rom. 10:5; Gal. 3:12).

8. Q: What is the condition in the covenant of works? A: The condition is good works, which ought to proceed from that good, holy, and upright nature upon which the covenant of works itself was based.

9. Q: What things are excluded by this condition? A: By this condition, first, faith in Christ, and second, works proceeding from grace and regeneration, are excluded from the covenant of works (Rom. 11:6).

10. Q: Why are these things excluded? A: Because the virtues of [man’s] nature, and the works proceeding from those virtues, cannot coexist with the grace of Christ and works of grace.

11. Q: What are the principal divisions of this covenant’s condition? A: They are contained individually in the discrete commands of the Decalogue. Hence, the tables upon which the law was written were called “the tables of the covenant” (Ex. 19 and 20; 22:15; Heb. 9:4).

12. Q: Is this condition of works one of merit? A: Not at all. Rather, it is one as of duties which bear witness to [man’s] gratitude towards God the creator (Rom. 11:35; Luke 17:10).</p></blockquote>

</figure><figure class="quote" id="q-05ac45d599" data-kw="">
<blockquote><p>Since the creature must pattern his ways after his Creator’s, and since the Creator rested only after he had worked, it was a covenant of works which was proffered to Adam as the means by which to arrive at the consummation. In the sense that it was the door to the consummation, this original Covenant of Creation was eschatological.

That door, however, was never opened. It was not the Fall in itself that delayed the consummation. According to the conditions of the Covenant of Creation the prospective consummation was either/or. It was either eternal glory by covenantal confirmation or original righteousness or eternal perdition by covenant-breaking repudiation of it.

The Fall, therefore, might have been followed at once by a consummation of the curse of the covenant. The delay was due rather to the principle and purpose of divine compassion by which a new way of arriving at the consummation was introduced, the way of redemptive covenant with common grace as its historical corollary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/meredith-g-kline.html">Meredith G. Kline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Structure of Biblical Authority</cite>, (rev. edn, Grand Rapids MI: Eerdmans, 1975), p. 155.</span></figcaption>

<figure class="quote" id="q-8f11c9c572" data-kw="">
<blockquote><p>The Reformed assert that there absolutely is a covenant of works, because: (1) it is expressly mentioned in Hosea 6:7, וְהֵמָּה כְּאָדָם עָבְרוּ בְרִית שָׁם בָּגְדוּ בִי, “And they, like Adam, have transgressed the covenant; there they have dealt faithlessly with me” (cf. Job 31:33). There the best translators—the Vulgate, the Zurich Bible, Pagnino, Castellio, the Dutch translators, and others—render כאדם not appellatively, but properly, although, I confess, there are not lacking those who prefer to render it appellatively.

(2) The apostle in Galatians mentions two covenants (4:24), the first of which is from the works of the law (2:16), demanding the most exact obedience (3:10), by aid of which no one has ever achieved life (2:16; 3:11), under which we all were, until the covenant of faith (3:23), and are, as long as we exist as children of the flesh (3:22, 29), a covenant which only produces slavery (3:24 with Heb. 2:14–15). And this is the very covenant that we call the covenant of works; the latter covenant is from the faith of the gospel. If you should say that the apostle is not speaking about the covenant in paradise, but about the covenant at Sinai, it may easily be responded that the apostle is speaking about the covenant in paradise insofar as it has been repeated and renewed at Sinai with Israel in the Decalogue, which had the content of the covenant of works.

(3) Synonyms for the covenant of works are evident in the New Testament (Rom. 3:27 and Gal. 2:16). Moreover, what is the “law of works” if not the covenant of works? What is “law” simply speaking, insofar as it is opposed to grace? (Rom. 8:3) What, I say, if not a legal covenant? For we are said to be not under law, but under grace (Rom. 6:14–15; 4:16), and what is this, if not that we are not under a legal covenant? At the least these are to us entirely synonymous.

(4) We have already demonstrated in the exegetical part that all the essentials of the covenant of works are contained in its first promulgation (Gen. 2:17).

(5) We can hardly secure very many heads of the Christian religion sufficiently—such as the propagation of original corruption, the satisfaction of Christ, and his subjection to the divine law (Rom. 8:3–4; Gal. 3:13; 4:4–5)—when the covenant of works is denied.</p></blockquote>

</figure><figure class="quote" id="q-87c4c59af5" data-kw="">
<blockquote><p>Reprobation is a preterition or passing by, or a purpose not to have mercy upon some of the lost Sons of Adam, but to leave them to perish in their sins: Our Reformed Divines do warily distinguish of a two-fold Act in Reprobation; the first negative (namely) Propositum non miserendiseu pretereundi, a purpose not to have mercy on them: the other positive (namely) Propositum damnandi, &amp; ordinatio ad exitium, ut justam poenam, a purpose to execute wrath on Transgressors, because of their sins, his Justice so requiring: But these two Acts are not to be severed, forasmuch as those on whom he will not have mercy, he intends to punish for their sins: for to my apprehension there is no other decree of Reprobation, but this purpose of God, to execute that judiciary Sentence of death on all mankind, for breach of the first covenant of Obedience made with Adam, which Covenant, the wicked do proceed to break more and more by their daily sins, and so work out their own Damnation, by their hypocrisy, Disobedience, and wilful contempt of God’s Word.

That first Covenant stands still in force against all the world, All are under it; and God’s justice must be satisfied for all the disobedience of the Sons of Adam; yet with this gracious and blessed difference; God punisheth the sins of the Elect in the person of Christ, but the sins of others in their own persons; on the one sort he shows the severity of his Law and Justice; on the other, the rich mercy of the Gospel. This is the Grace of the Gospel so much magnified by the Apostle, not that the Law is made void by it: But whereas God might have required full payment and satisfaction in our own persons, he doth accept it in the person of Christ, and so we have a protection against the damnatory sentence of sin and the law; which seeing the unregenerate world, being out of Christ, have not, they must answer for themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ</cite>, (London: Richard Royston, 1655), p. 189.</span></figcaption>

</figure><figure class="quote" id="q-3b3bd8ec8c" data-kw="">
<blockquote><p>These covenants differ, in relation to the Parties contracting the covenant of works, the Parties were God, and the first Adam, representing all his natural posterity; but in the covenant of grace, the Parties were God the Father, and Christ the second Adam, representing all his spiritual seed. The first covenant, was made with a mere man, a fallible creature: the second, was established with God-man, “the Lord from heaven, who enangeth not.” The former, depended on a righteous creature: the latter, on a righteous, an almighty Redeemer.

The one, was made with man in his best state, and yet he kept it not: the other, was made with God-man, our blessed Immanuel, who neither could nor would, fail in fulfilling it. In that, the triune God, is to be considered as the supreme Lawgiver, and the fountain of uncreated goodness, delighting in communicating happiness to an upright creature: in this, he is to be viewed as infinitely merciful and gracious, rejoicing to give, in a manner suited to the glory of all his perfections, eternal life to an elect sinner believing in Jesus.

According to the covenant of works, God could deal with man, and man with God, immediately; but according to the covenant of grace, he cannot deal with man, nor man with him, but through a Mediator. With the blessed Mediator it was, that he dealt primarily, and immediately; and with man, only in and through Him.</p></blockquote>

<blockquote><p>It is in this manner that divine truths are most convincingly established and successfully defended, — when placed, that is, in their due order and in their right relations of subordination to each other: and an illustrious instance of this, such as that which we have now given, ought not to be without its due weight with us. For instance: Let the objection to the Atonement about punishing the innocent and allowing the transgressors to escape, be referred back upon the Covenant of Grace, precisely as Dr [William] Cunningham refers back upon the covenant of works the asserted incompatibility between inability and responsibility; and how easily is it rebutted.

Bring in, that is to say, the Scriptural doctrine which teaches us to regard Christ and the Church collectively in their relation to God, as virtually one and indivisible, so far as regards their legal standing and responsibilities; and the objection is not merely seen at once to be false, but to be irrelevant and inept. It requires no answer, in the light of the covenant oneness of Christ and His members: it simply disappears. We have before us “virtually the history of one and the same man,”—the Second Man, the last Adam. The death of Christ is then seen to be the real infliction of the originally threatened curse. No one considered as innocent suffers, and no one continuing guilty escapes. Righteousness and Peace are seen to kiss each other, and Justice goes before Him to set us in the way of His steps.</p></blockquote>

<blockquote><p>Had we been only adopted in Adam, we should have had no inheritance but that terrestrial paradise which was granted to him, that he might lead an agreeable and delicious life on earth. Had we been adopted in Moses, we could have aspired to no better inheritance than the land of Canaan, which he promised to those who kept his law, but being adopted in Christ, to be his joint heirs and his brethren, we must have an inheritance the very same as that which this well beloved Son himself possesses; the high heaven to which he has gone to live and reign in immortal glory, in the midst of angels.</p></blockquote>

</figure><figure class="quote" id="q-04b9a91cd6" data-kw="">
<blockquote><p>2. What was the objective of the Covenant of Works?

The ultimate objective was eternal life, that is, the highest glorifying and enjoying of God by man. Specifically, God constituted Adam as the representative or “federal head” of the human race, and ordained the Covenant of Works as a probation of the human race through Adam, its official representative.

Mankind was created in a state of real, but untested, righteousness and holiness. There was no evil in man’s nature at the time of his creation by God, but he did not then exist in the highest state possible for him, because it was still possible for him to commit sin and fall from his original righteousness and holiness. Therefore man must go through a period of probation, that is, his obedience to God must pass through a test. If Adam, humanity’s representative, had passed this test successfully, he would have then been confirmed in his holiness. It would have become impossible for him to sin. Then he and all his posterity would have received eternal life (the highest glorifying and enjoyment of God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Covenant of Grace in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-04045502f0" data-kw="">
<blockquote><p>First, It was obedience to God merely as Creator, no further; Adam in innocency he looked upon God as Creator of all things, as the First being of all, and so Adam tendered up his service to God merely as the Creator and First-being. That was his obedience. Secondly, The Law to Adam had promise only of natural things, of a natural life to be continued: We do not read of God’s promising Adam to live in Heaven if he had obeyed; but, Do this and live; that was the Tenor of the Covenant with him: that is, he should have continued in Paradise and so have lived a natural life, but yet continued eternally, God would have upheld that natural life of his, that’s all we read of that ever God promised to Adam if he had stood by virtue of that Covenant of the Law:

That’s the second thing considerable in him. so that his obedience was tendered up to God to that end, that he might obtain the continuance of a natural life here in this world, only in order unto that, for we find no more revealed. The first man Adam he was Natural, the second Spiritual, the first of the Earth earthly, the second, the Lord from Heaven. The Apostle. 1 Cor. 15. speaks of Adam in innocency as the common head of al man-kind, he was of the Earth earthly, and in way of distinction the second Adam was the Lord from Heaven; He brings all heavenly glory. Though Adam had stood, yet we never read of any heavenly glory that ever he or his posterity should have had; but the second Adam he is the Lord from Heaven that brings Heavenly glory with him. That’s the second thing considerable in the Law as a Covenant with Adam.

The third thing in the Law as a Covenant with Adam was this, That Adam under the Law he must have wrought by his own strength that he had received. God at first gave man strength for obedience, and he puts his stock into his own hand, and so he must have wrought and continued by the power of the strength that God did at first give him, he had not that fountain to go to for that continual supply of strength as we have, which you shall see presently.

Fourthly, Adam, he was in such a condition, as he was in hazard of his miscarrying for his eternal estate; He was indeed in a way of obedience to the Law that God gave him, but still so as he was in hazard of eternal miscarrying; this was the condition of Adam under the Law.</p></blockquote>

</figure><figure class="quote" id="q-c9c57b7ed7" data-kw="">
<blockquote><p>In the case of men and angels, God has been pleased to promise this transcendent benefit upon certain conditions; which conditional promise is called a covenant. There can be no doubt that this amazing gift of God’s personal love and life-giving society had been offered to angels, and at the beginning was offered to the first human pair, upon conditions. Some object that the conditional promise made to Adam in the garden is not explicitly called a covenant, and that it does not possess all the essential elements of a covenant, since it was a constitution sovereignly ordained by the Creator without consulting the will of the creature.

It is a sufficient answer to these objections, – (1) That although Adam’s will was not consulted, yet his will was unquestionably cordially consenting to this divine constitution and all the terms thereof, and hence the transaction did embrace all the elements of a covenant. (2) That instances of analogous transactions between God and men are expressly styled covenants in the Bible. If God’s transactions with Noah (Gen. 9:11,12) and with Abraham (Gen. 17:1-21) were covenants, then was his transaction with Adam in the garden a covenant.

The analysis of a covenant always gives the following elements: (a) Its parties. (b) Its promise. (c) Its conditions. (d) Its penalty. As to its parties, our Standards teach –

In the first covenant that concerned mankind God dealt with Adam as the representative of all his descendants. The parties, therefore, are God and Adam, the latter representing the human race. That Adam did so act as the representative of his descendants, in such a sense that they were equally interested with himself in all the merit or the demerit, the reward or the penalty, attaching to his action during the period of probation, has already been proved to be the doctrine both of our Standards and of Scripture. (Ch. 6., ss. 3, 4.) As to the further nature of this covenant, our Standards teach – The promise of it was life, the condition of it perfect obedience, and the penalty of it death. (L. Cat., q. 20; S. Cat., q. 12.)

This covenant is variously styled, from one or other of these several elements. Thus, it is called the “covenant of works,” because perfect obedience was its condition, and to distinguish it from the covenant of grace, which rests our salvation on a different basis altogether. It is also called the “covenant of life,” because life was promised on condition of the obedience. It is also called a “legal covenant,” because it demanded the literal fulfilment of the claims of the moral law as the condition of God’s favour. This covenant was also in its essence a covenant of grace, in that it graciously promised life in the society of God as the freely-granted reward of an obedience already unconditionally due. Nevertheless it was a covenant of works and of law with respect to its demands and conditions.

(1) That the promise of the covenant was life is proved – (a) From the nature of the penalty, which is recorded in terms. If disobedience was linked to death, obedience must have been linked to life. (b) It is taught expressly in many passages of Scripture. Paul says, Rom. 10:5, “Moses describes the righteousness which is of the law, That the man which does those things shall live by them.” (Matt. 19:16,17; Gal. 3:12; Lev. 18:5; Neh. 9:29.)

<blockquote><p>But the special and principal Covenant which is especially called the Old, and is distinguished from the New Covenant of the Gospel, is God’s making and renewing of the Covenant with Israel, partly by his own mouth, and partly by the ministry of Moses on Mount Horeb, which is mentioned Exod. 19. 20. For that Covenant is a mixt Covenant, partly of the Covenant of Works, which is the Old Covenant, partly of the Covenant of Grace, which was made after the fall.

First, God sent Moses to the people to ask whether they would obey the Lord’s voice, and keep all his Commandments, that they might thereby live and be blessed. They answered all together, and said, All that the Lord hath spoken we will do. Thereupon the Lord came down upon Mount Sinai, in fire and smoke and with terrible Thunders and Lightnings, and the sound of a Trumpet, and spake unto them the words of the Law immediately with his own mouth, promising life to them that kept it, and threatening death to the breakers thereof,

Now this was but a repeating, and renewing of the first Covenant of Works, to be performed by every man in his own person, for the obtaining of life. In this therefore there was no Mediator between God and the people.

The Reasons why the Lord thus began with Israel, and first renewed the Old Covenant, were divers.

The first, was their pride, presumption, and hardness of heart; they presumed that they could do all that the Lord would command them, and therefore he gave them his Law to shew them their duty; that they assaying to fulfil it, and finding their own insufficiency, might be humbled and brought down from vain confidence in their own Works.

Here the Lord did deal with them, as wise fathers deal with their foolish &amp; vain boasting sons, who do promise largely that they will do any thing which their fathers will command them, and that by their merits they will bind their fathers to love them, and to give them the inheritance. In such a case, a wise father will put such a boasting son to the trial, and will put him to a task which he knoweth that he is unable to go through; not because he believes, or hopes that his son can perform it (being through his own intemperance disabled) but for this end, to make him see his own folly and insufficiency. And so the Lord did deal with Israel.

Secondly, the Lord gave the Law, which is the rule of righteousness, and withal shewed the punishment due to the transgressors of it; that it might be as the rod of a Schoolmaster, to drive them to Christ, to learn the saving knowledge, and way of life in him, as the Apostle speaks, Gal. 3. and to make them out of fear renounce themselves, and seek mercy in him.

Thirdly, to teach them and us, that howsoever it is impossible for us to be saved by the Law, by reason of our sinful flesh, and our corruption which hath utterly disabled us, that we cannot obey it; yet the Law is still in force, and requires perfect righteousness; and without the righteousness of the Law fulfilled by Christ for us, we cannot be justified nor saved, according to that saying of the Apostle, Christ is the end of the Law for righteousness to every one that believeth, Rom. 10. 4. For these and such like reasons God gave the Law.

But when the people of Israel heard the Law, which was the Covenant of Works to be performed in their own persons, and that immediately from God himself, it is said that they were sore afraid, and being not able to abide the sight of God’s glory, nor the sound of his voice, they cried out, Why should we die? and hereupon they began to desire a Mediator, even Moses, saying, Go thou &amp; hear the Lord, &amp; speak thou to us, Exod. 20. 19. and Deut. 5. 25, 26, 27. This was some good beginning; the Law began to take effect, and to drive them towards a Mediator.

And therefore the Lord said, They have well spoken all that they have said, to wit, in desiring a Mediator; &amp; added withal, O that there were in them such an heart, that they would fear me, and keep my Commandments always: that it might be well with them and their children! Which words shew the Will and Mind of God, wishing after a sort their increase and continuance in this good mind and fear of him, and seeking to keep his Commandments, in, and by a Mediator. Whereupon he proceeds to deal with them by a Mediator, and to renew the Covenant with them, by appointing divers figures of Christ, as Sacrifices, Rites, Ceremonies, the Tabernacle, the Ark of the Covenant, and the Mercy Seat; in all which, as in Types, he did reveal Christ, though obscurely, unto them, and shewed that sin was to be expiated and purged away by his Death.

Afterward, also when they came into the land of Moab, he did renew the Covenant of Grace in more plain terms, than he did on Mount Horeb; insomuch that by reason of the greater plainness, it is called another Covenant, Deut. 29. 2. There he told them, that Christ should be their Rock, Deut. 32. 4. and that the Word, his Gospel, was among them.

Now because of the first part of this Covenant, to wit, the ten Commandments which God spake first, and after gave them written in two Tables, which are called by the name of Covenant, Deu. 4. 13. and 9. 9. and indeed are the sum of the Old Covenant which God made with men in the Creation;

This Covenant, which God made with Israel, is called the Old Covenant, and the Covenant of the Law, and is opposed to the Covenant of the Gospel, that is, to the Covenant, as it is now revealed in the writings of the Evangelists and Apostles, and plainly preached and published over all the world.

Thus much for the Old Covenant.</p></blockquote>

And therefore the Lord said, They have well spoken all that they have said, to wit, in desiring a Mediator; &amp; added withal, O that there were in them such an heart, that they would fear me, and keep my Commandments always: that it might be well with them and their children! Which words shew the Will and Mind of God, wishing after a sort their increase and continuance in this good mind and fear of him, and seeking to keep his Commandments, in, and by a Mediator. Whereupon he proceeds to deal with them by a Mediator, and to renew the Covenant with them, by appointing divers figures of Christ, as Sacrifices, Rites, Ceremonies, the Tabernacle, the Ark of the Covenant, and the Mercy Seat; in all which, as in Types, he did reveal Christ, though obscurely, unto them, and shewed that sin was to be expiated and purged away by his Death.

Afterward, also when they came into the land of Moab, he did renew the Covenant of Grace in more plain terms, than he did on Mount Horeb; insomuch that by reason of the greater plainness, it is called another Covenant, Deut. 29. 2. There he told them, that Christ should be their Rock, Deut. 32. 4. and that the Word, his Gospel, was among them.

Now because of the first part of this Covenant, to wit, the ten Commandments which God spake first, and after gave them written in two Tables, which are called by the name of Covenant, Deu. 4. 13. and 9. 9. and indeed are the sum of the Old Covenant which God made with men in the Creation;

This Covenant, which God made with Israel, is called the Old Covenant, and the Covenant of the Law, and is opposed to the Covenant of the Gospel, that is, to the Covenant, as it is now revealed in the writings of the Evangelists and Apostles, and plainly preached and published over all the world.

Thus much for the Old Covenant.”

— George Walker, The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference, (London: John Bartlet, 1641), pp 66-72.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+special+and+principal+Covenant+which+is+especially+called+the+Old%2C+and+is+distinguished+from+the+New+Covenant+of+the+Gospel%2C+is+God%E2%80%99s+making+and+renewing+of+the+Covenant+with+Israel%2C+partly+by+his+own+mouth%2C+and+partly+by+the+ministry+of+Moses+on+Mount+Horeb%2C+which+is+mentioned+Exod.+19.+20.+For+that+Covenant+is+a+mixt+Covenant%2C+partly+of+the+Covenant+of+Works%2C+which+is+the+Old+Covenant%2C+partly+of+the+Covenant+of+Grace%2C+which+was+made+after+the+fall.%0A%0AFirst%2C+God+sent+Moses+to+the+people+to+ask+whether+they+would+obey+the+Lord%E2%80%99s+voice%2C+and+keep+all+his+Commandments%2C+that+they+might+thereby+live+and+be+blessed.+They+answered+all+together%2C+and+said%2C+All+that+the+Lord+hath+spoken+we+will+do.+Thereupon+the+Lord+came+down+upon+Mount+Sinai%2C+in+fire+and+smoke+and+with+terrible+Thunders+and+Lightnings%2C+and+the+sound+of+a+Trumpet%2C+and+spake+unto+them+the+words+of+the+Law+immediately+with+his+own+mouth%2C+promising+life+to+them+that+kept+it%2C+and+threatening+death+to+the+breakers+thereof%2C%0A%0ANow+this+was+but+a+repeating%2C+and+renewing+of+the+first+Covenant+of+Works%2C+to+be+performed+by+every+man+in+his+own+person%2C+for+the+obtaining+of+life.+In+this+therefore+there+was+no+Mediator+between+God+and+the+people.%0A%0AThe+Reasons+why+the+Lord+thus+began+with+Israel%2C+and+first+renewed+the+Old+Covenant%2C+were+divers.%0A%0AThe+first%2C+was+their+pride%2C+presumption%2C+and+hardness+of+heart%3B+they+presumed+that+they+could+do+all+that+the+Lord+would+command+them%2C+and+therefore+he+gave+them+his+Law+to+shew+them+their+duty%3B+that+they+assaying+to+fulfil+it%2C+and+finding+their+own+insufficiency%2C+might+be+humbled+and+brought+down+from+vain+confidence+in+their+own+Works.%0A%0AHere+the+Lord+did+deal+with+them%2C+as+wise+fathers+deal+with+their+foolish+%26+vain+boasting+sons%2C+who+do+promise+largely+that+they+will+do+any+thing+which+their+fathers+will+command+them%2C+and+that+by+their+merits+they+will+bind+their+fathers+to+love+them%2C+and+to+give+them+the+inheritance.+In+such+a+case%2C+a+wise+father+will+put+such+a+boasting+son+to+the+trial%2C+and+will+put+him+to+a+task+which+he+knoweth+that+he+is+unable+to+go+through%3B+not+because+he+believes%2C+or+hopes+that+his+son+can+perform+it+%28being+through+his+own+intemperance+disabled%29+but+for+this+end%2C+to+make+him+see+his+own+folly+and+insufficiency.+And+so+the+Lord+did+deal+with+Israel.%0A%0ASecondly%2C+the+Lord+gave+the+Law%2C+which+is+the+rule+of+righteousness%2C+and+withal+shewed+the+punishment+due+to+the+transgressors+of+it%3B+that+it+might+be+as+the+rod+of+a+Schoolmaster%2C+to+drive+them+to+Christ%2C+to+learn+the+saving+knowledge%2C+and+way+of+life+in+him%2C+as+the+Apostle+speaks%2C+Gal.+3.+and+to+make+them+out+of+fear+renounce+themselves%2C+and+seek+mercy+in+him.%0A%0AThirdly%2C+to+teach+them+and+us%2C+that+howsoever+it+is+impossible+for+us+to+be+saved+by+the+Law%2C+by+reason+of+our+sinful+flesh%2C+and+our+corruption+which+hath+utterly+disabled+us%2C+that+we+cannot+obey+it%3B+yet+the+Law+is+still+in+force%2C+and+requires+perfect+righteousness%3B+and+without+the+righteousness+of+the+Law+fulfilled+by+Christ+for+us%2C+we+cannot+be+justified+nor+saved%2C+according+to+that+saying+of+the+Apostle%2C+Christ+is+the+end+of+the+Law+for+righteousness+to+every+one+that+believeth%2C+Rom.+10.+4.+For+these+and+such+like+reasons+God+gave+the+Law.%0A%0ABut+when+the+people+of+Israel+heard+the+Law%2C+which+was+the+Covenant+of+Works+to+be+performed+in+their+own+persons%2C+and+that+immediately+from+God+himself%2C+it+is+said+that+they+were+sore+afraid%2C+and+being+not+able+to+abide+the+sight+of+God%E2%80%99s+glory%2C+nor <blockquote><p>Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts x. 43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. …

Upon the whole we may see; that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we most cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all?

There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon.

And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this.</p></blockquote>

<blockquote><p>THE first distribution of the acts of Christ’s righteousness is with respect to the laws which Christ obeyed in that righteousness which he performed. But here it must be observed in general, that all the precepts which Christ obeyed may be reduced to one law and that is that which the Apostle calls the law of works. Rom. iii.27. Every command that Christ obeyed may be reduced to that great and everlasting law of God that is contained in the covenant of works, that eternal rule of right which God had established between himself and mankind. Christ came into the world to fulfil and answer the covenant of works; that is, the covenant that is to stand forever as a rule of judgment, and that is the covenant that we had broken, and that was the covenant that must be fulfilled.

This law of works indeed includes all the laws of God which ever have been given to mankind; for it is a general rule of the law of works, and indeed of the law of nature, That God is to be obeyed, and that he must be submitted to in whatever positive precept he is pleased to give us. It is a rule of the law of works, that men should obey their earthly parents: and it is certainly as much a rule of the same law, That we should obey our heavenly Father: and so the law of works requires obedience to all positive commands of God. It required Adam’s obedience to that positive command, Not to eat of the forbidden fruit; and it required obedience of the Jews to all the positive commands of their institution. When God commanded Jonah to arise and go to Nineveh, the law of works required him to obey: and so it required Christ’s obedience to all the positive commands which God gave him.

But more particularly, the commands of God which Christ obeyed, were of three kinds; they were either such as he was subject to merely as man, or such as he was subject to as he was a Jew, or such as he was subject to purely as Mediator.

1. He obeyed those commands which he was subject to merely as man: and they were the commands of the moral law, which was the same with that which was given at Mount Sinai, written in two tables of stone, which are obligatory on mankind of all nations and all ages of the world.

2. He obeyed all those laws he was subject to as he was a Jew. Thus he was subject to the ceremonial law, and was conformed to it. He was conformed to it in his being circumcised the eighth day; and he strictly obeyed it in going up to Jerusalem to the temple three times a-year; at least after he was come to the ago of twelve years, which seems to have been the age when the males began to go up to the temple. And so Christ constantly attended the service of the temple, and of the synagogues.

To this head of his obedience to the law that he was subject to as a Jew, may be reduced his submission to John’s baptism. For it was a special command to the Jews, to go forth to John the Baptist, and be baptized of him; and therefore Christ being a Jew, was sub|ject to this command: and therefore, when he came to be baptized of John, and John objected, that he had more need to come to him to be baptized of him, he gives this reason for it, That it was need|ful that he should do it, that he might fulfil all righteousness. See Matth. iii.13.14.15.

3. Another law that Christ was subject to, was the mediatorial law, which contained those commands of God to which he was subject, not merely as man, nor yet as a Jew, but which related purely to his mediatorial office. Such were the commands which the Father gave him, to teach such doctrines, to preach the gospel, to work such miracles, to call such disciples, to appoint such ordinances, and finally to lay down his life: for he did all these things in obedience to commands he had received of the Father, as he often tells us. And these commands he was not subject to merely as man; for they did not belong to other men: nor yet was he subject to them as a Jew; for they were no part of the Mosaic law; but they were commands that he had received of the Father, that purely respected the work he was to do in the world in his mediatorial office.

It is to be observed, that Christ’s righteousness, by which he merited heaven for himself, and all who believe in him, consists principally in his obedience to this mediatorial law: for in fulfilling this law consisted his chief work and business in the world. The history of the evangelists is chiefly taken up in giving an account of his obedience to this law: and this part of his obedience was that which was attended with the greatest difficulty of all; and therefore his obedience in it was most meritorious.

What Christ had to do in the world by virtue of his being Mediator, was infinitely more difficult than what he had to do merely as a man, or as a Jew. To his obedience to this mediatorial law belongs his going through his last sufferings, beginning with his agony in the garden, and ending with his resurrection.

<div class="actions"><button class="copy" data-copy="“THE first distribution of the acts of Christ’s righteousness is with respect to the laws which Christ obeyed in that righteousness which he performed. But here it must be observed in general, that all the precepts which Christ obeyed may be reduced to one law and that is that which the Apostle calls the law of works. Rom. iii.27. Every command that Christ obeyed may be reduced to that great and everlasting law of God that is contained in the covenant of works, that eternal rule of right which God had established between himself and mankind. Christ came into the world to fulfil and answer the covenant of works; that is, the covenant that is to stand forever as a rule of judgment, and that is the covenant that we had broken, and that was the covenant that must be fulfilled.

This law of works indeed includes all the laws of God which ever have been given to mankind; for it is a general rule of the law of works, and indeed of the law of nature, That God is to be obeyed, and that he must be submitted to in whatever positive precept he is pleased to give us. It is a rule of the law of works, that men should obey their earthly parents: and it is certainly as much a rule of the same law, That we should obey our heavenly Father: and so the law of works requires obedience to all positive commands of God. It required Adam’s obedience to that positive command, Not to eat of the forbidden fruit; and it required obedience of the Jews to all the positive commands of their institution. When God commanded Jonah to arise and go to Nineveh, the law of works required him to obey: and so it required Christ’s obedience to all the positive commands which God gave him.

But more particularly, the commands of God which Christ obeyed, were of three kinds; they were either such as he was subject to merely as man, or such as he was subject to as he was a Jew, or such as he was subject to purely as Mediator.

1. He obeyed those commands which he was subject to merely as man: and they were the commands of the moral law, which was the same with that which was given at Mount Sinai, written in two tables of stone, which are obligatory on mankind of all nations and all ages of the world.

2. He obeyed all those laws he was subject to as he was a Jew. Thus he was subject to the ceremonial law, and was conformed to it. He was conformed to it in his being circumcised the eighth day; and he strictly obeyed it in going up to Jerusalem to the temple three times a-year; at least after he was come to the ago of twelve years, which seems to have been the age when the males began to go up to the temple. And so Christ constantly attended the service of the temple, and of the synagogues.

To this head of his obedience to the law that he was subject to as a Jew, may be reduced his submission to John’s baptism. For it was a special command to the Jews, to go forth to John the Baptist, and be baptized of him; and therefore Christ being a Jew, was sub|ject to this command: and therefore, when he came to be baptized of John, and John objected, that he had more need to come to him to be baptized of him, he gives this reason for it, That it was need|ful that he should do it, that he might fulfil all righteousness. See Matth. iii.13.14.15.

3. Another law that Christ was subject to, was the mediatorial law, which contained those commands of God to which he was subject, not merely as man, nor yet as a Jew, but which related purely to his mediatorial office. Such were the commands which the Father gave him, to teach such doctrines, to preach the gospel, to work such miracles, to call such disciples, to appoint such ordinances, and finally to lay down his life: for he did all these things in obedience to commands he had received of the Father, as he often tells us. And these commands he was not subject to merely as man; for they did not belong to other men: nor yet was he subject to them as a Jew; for they were no part of the Mosaic law; but they were commands that he had received of the Father, that purely respected the work he was to do in the world in his mediatorial office.

<blockquote><p>PROPOSITION VI

The life promised in the Covenant of works, is a life of glory in heaven: the promise is life, Gal. 3.12. The man that doth them, shall live in them; some have thought that Adam should have had only the continuance of that blessedness which he was created in, if he had kept the Covenant: it is very true, that there is no mention in the Covenant of his going to heaven: but we have clear ground to conclude from Scripture, that if man had stood, he should have gone to heaven; according to this promise:

1. Because hell, where the devils are, is the reward of disobedience by the covenant of works, therefore heaven, where the holy angels are, is the reward of Obedience: it is meet the rewards should be proportionable: I know it is answered, that sin deserves evil at God’s hands, but holiness which is due unto God does not deserve any rewards; but this does not take off the force of the argument: for it is by the Law that sin merits as well as holiness: and hence wicked men are punished only for such sins as they commit in this life, 2 Cor. 5.10. and there is as much goodness in holiness, as evil in sin; and it is a meet thing that God should bestow as much good in a way of obedience, as he inflicts evil in a way of disobedience: besides the Law expresses the punishment of sin by death Rom. 6.23. The wages of sin is death: and the reward of obedience by life. Gal. 3 12. the man that doth them shall live by them: therefore it is a life directly opposite to that death, a life that contains as much good … it, as that death doth evil: those terms do mutually explain one the other.

2. Because Christ in fulfilling of the law for us, has purchased life for us in heaven: Christ has purchased heaven for us, Eph. 1.14. it is called a purchased possession, and he did it by performing the righteousness of the Law for us: it is by making of us righteous that we come to have a title unto eternal life, Rom 5.21. Grace reigns by righteousness unto eternal life by Jesus Christ our Lord.

3. Because Christ tells the young man in the Gospel (that enquired of him what good thing he should do that he might have eternal life) that if he would enter into life he should keep the Commandments, Mat. 19.16, 17. where we may mind, that the life enquired after by the young man, was a life in Heaven; and that Christ in this answer is leading of him to the covenant of works, upon a design to convince him of his inability to keep it.

4. Because the Apostle Paul, gives that as the reason, that men cannot be justified by the Law, because they are sinners, Rom. 8.3. &amp; 3.20. the Legalists that Paul disputes against expected eternal life in heaven by their works, yet in all his disputes with them he never tells them that the covenant of works does not promise any such thing: if he could have told them so, that would clearly have cut off all their hopes: but he still shows that they can’t have Salvation by the Law upon this account, because they can’t fulfil it; yea he plainly implies that the reward by the Law and Gospel are the same, but the way of obtaining it is different, Rom. 4.4. He that worketh has the reward by debt, he that worketh not hath it by grace.</p></blockquote>

<blockquote><p>For the understanding [of the forgiveness of sins] we must distinguish

[1.] of two covenants that God hath made with man

a. A covenant of works – made with our first parents in innocency wherein life was promised upon condition of perfect, personal and perpetual obedience. Do this and live, i.e. continue happy.

Now

i. when Adam was taken into this covenant he needed no pardon – for God made man upright (Eccles. 7:29). There was a perfect purity and rectitude in his nature, his understanding clear, his will complying, his affections regular, all in frame. He was created in God’s image. That in us which needs pardon is the devil’s image. He that is innocent needs not to be justified. That was a covenant of friendship, not a covenant of reconciliation which supposeth a quarrel. Therefore there needed no mediator. Adam in his innocent estate dealt with God immediately. There was no cloud to interpose or interrupt his communion – no fracas, no wrath, but all clear.

ii. in case of failure the covenant promised no pardon. That covenant left no room for repentance (Gen. 2:17, thou shalt surely die), and therefore when Adam had eaten forbidden fruit he fled from God, and hid himself (Gen. 3:8), in a sense of his guilt, having no encouragement to hope for pardon, like the malefactor while the hue and cry is in pursuit of him. And if God had not presently revealed a Saviour, the seed of the woman that should break the serpent’s head, Adam had sunk in despair. The law could not do it (Rom. 8:3).

b. A covenant of grace, and it is in and by this covenant that pardon and forgiveness is to be had, a better covenant established upon better promises, for the redemption of the transgressions that were under the first testament (Heb. 9:15). This is a plank thrown out after the shipwreck, as the valley of Achor for a door of hope (Hos. 2:15). This is a covenant of reconciliation, supposeth man fallen, and so guilty and obnoxious, and needing pardon. ‘Tis a remedial law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), pp 39-40.</span></figcaption>

</figure><figure class="quote" id="q-eeee457770" data-kw="">
<blockquote><p>Thus have I shown you the nature of the promise of the covenant of works, and the life therein made over conditionally to man. If we consider the life Adam could have expected from God, in a course of obedience, though there had been no covenant, we say, Adam performing obedience, according to the natural law written in his heart, would have had a prosperous life and being, while he had a being; this Adam might conclude from the good and bountiful nature of God. But still it would have been consistent with the nature of God, to have withdrawn his supporting hand from man, so as he might have ceased to be any more. And this would have been but taking away freely what ho gave freely, being under no obligation to continue it; for even Adam’s innocent works could not have properly merited at God’s hand, Rom. xi. 35, “Who hath first given to him, and it shall be recompensed unto him again?” They could have only merited improperly, by virtue of compact, not by the intrinsic worth of the thing. Here,

[1.] The continuation of life to Adam, even while he continued obedient, was entirely due to the covenant God was pleased to make with him. And here was grace even in the covenant of works, that God was pleased by promise to secure the continuance of man’s being, while he continued obedient.

[2.] The right that Adam could have pled to eternal life in heaven, by virtue of his obedience, was entirely founded on the covenant. If God had not revealed to him the promise of it, he could not have known that he should have had it, nor could he have demanded it. The natural law had no such promise. And here was more grace in the covenant of works. And therefore it is no wonder, that though men overturn the gospel-doctrine of free grace, yet they will not take with it. The Pharisees of old, Luke xviii. 11, and the Papists to this day, own free grace in their profession; and what wonder, since innocent Adam, pleading life upon his works, could not have denied but he was debtor to free grace? But here lies the matter; they pat in their own works, their repentance, holiness, and obedience, (turning faith into a work, that it may go in with the rest), between free grace and them, making themselves but debtors to it at second hand for life and salvation.

And if one shall tell sinners, Here you are to do or work nothing for life and salvation, but only receive the free grace gift of life and salvation from Christ by faith, and be debtors at first hand; though withal we tell them, that repentance, holiness, obedience, and good works, are the inseparable attendants of faith; they cry out, Error, Antinomianism, Licentious doctrine! Yet it is the doctrine of the gospel, Tit. iii. 5; Eph. ii. 8. And it is not the doctrine of the gospel, nor does the apostle say, “By grace ye are saved, through works;” for so would Adam have been saved according to the covenant of works, being debtor to free grace at the second hand, which the proud Pharisee was content to be. It is true, Adam’s obedience was perfect, ours is not; but buying is buying still, though one buy ten times below the worth, as well as when he buys at the full value.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Works, from the Sacred Records</cite>, (1772) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 206-07.</span></figcaption>

asquotes.github.io%2Fquote%2Feeee457770.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eeee457770.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/21/thomas-boston-on-merit-and-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Vers. 14. Blotting out the hand-writing of Ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his Cross.

Argum. 9. In which also he explains how Christ obtained remission of sins for us, viz. by taking away the hand-writing, in this sense. The Covenant of works is an hand-writing, established partly in threatnings, partly in appointed positive Ceremonials (excluding the Gentiles from the Church) was against us, and contrary to us. But Christ hath blotted out this hand-writing, taking it out of the way, and nailing it to his Cross: Therefore you must not look back to the legal Covenant or ceremonial appointments in them, to seek for any thing, neither must ye depart in the least from the death of Christ (by which ye are delivered from that hand-writing.)

He compares this Covenant of works, with its appurtenances, to an hand-writing, by which any one binds himself for the paying of a debt; for whosoever are convicted of sin by the light of nature, are also by the force of the Covenant of Works, obnoxious to wrath, and as often as we are convinced of sin, so often also by nature we confirm the punishment of sin, or the condition of the legal Covenant, by the judgement of our consciences against our selves, as by an hand-writing: The conscience of every one performs this much more, which hath received the written Law, and daily bears the punishment of the Law, for the breaking of it.

But chiefly all justiciaries are compelled to subscribe to this hand-writing, who acknowledge no righteousness besides inherent, or that which is by works: Of which number were those that Judaized, and observers of Ceremonies, who adhered to this Covenant, seeking Righteousness by works, and the appointed Ceremonies: For by how much they did endeavour by this means more manifestly to establish their own Righteousness, by so much the more openly they did derive the punishment of the Law broken, by the force of the Covenant, upon themselves: For no man enters a Covenant, but he also admits all the conditions of the Covenant.

The hand-writing is said to be in Ordinances, or rather subscribed to Ordinances, so far as they took upon them those commands, or Legal Ordinances, that they might be perfected in themselves, they did withal oblige themselves to bear the punishment of the breach of those commands.

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

As for example, when they offered Sacrifices, and did repeat them, they not only acknowledged themselves sinners against the Moral Law, but did also really confess that their frequent Sacrifices could not purge their consciences from sin, and so the hand-writing of the Covenant of works was always contrary to them: But Christ hath blotted out this hand-writing, and took it out of the way, nailing it to his Cross, insomuch as he for the sake of them that were his, hath paid for the redeemed the penalty due upon the hand-writing by the death of his Cross, and hath completed and abolished the positive Ordinances concerning those vanishing Ceremonies, by the real Sacrifice of his own body once offered.</p></blockquote>

<blockquote><p>We were debtors to the mandatory and minatory part of the law, arraigned at the instance of divine justice to pay the debt; Christ substitutes himself in our room, and comes under the law to pay the whole debt. It is true, the debt was personal, and justice had a demand upon the person that sinned by virtue of the covenant of works; but that covenant never excluded a surety, tho’ it provided none. The law promised life, upon our personal obedience; but, in case we fail, it revealed no surety to make out an obedience in our room.

There behoved indeed to be a secret reserve in the covenant of works, whereby the perfect obedience of another was not excluded: For, if the covenant of works had absolutely excluded a surety in our room, then the covenant of grace had been excluded, and our salvation had been impossible after our fall; but tho’ the covenant of works did not exclude a surety, yet that covenant did neither provide nor reveal a surety: This is done in the covenant of grace, which is Christ as surety fulfilling for us the covenant of works, in all the articles of it. Now, is truth and faithfulness at any loss here?

No, the truth of the promise &amp; threatening both of the law of works, is fulfilled. On the one hand, the promise of eternal life made to perfect obedience; which, tho’ we forfeited in our own person, yet we recover in the person of Christ; the promise of life upon the ground and condition of perfect obedience being fulfilled to us in him, who hath yielded that perfect obedience in our room: On the other hand, divine truth and faithfulness, in the threatening of the law, which was death, is glorified, in that it is fulfilled upon the surety; while we, who came under the sentence of death in the first Adam, undergo that death in the second.

Again, is righteousness and justice at any loss by this surety in our room? No, no; whether we look upon it as vindictive or retributive justice, vindictive justice is displayed in its utmost severity upon Christ; Awake, O sword, against my shepherd, and the man that is my fellow: And so the sword is drunk in his blood to infinite satisfaction. Retributive justice is gloriously displayed also, in the sinner’s being rewarded, justified, saved upon this ground.</p></blockquote>

<blockquote><p>Now also, God’s kindness is that he would want to summon the creature, who by default has been subordinated to him and owes him everything by natural obligation, to special communion with him by entering into a covenant, and would want to temper his completely absolute rule with that self-indulgence of love and mutual obligation.

The result was that the man, who had been made with a fixed means to the supreme blessedness, was firmly able to expect that blessedness, not only because of God’s sheer goodness and natural love for the creatures, in each manner promised to him, but certainly also because of the covenant, and thus on account of God’s truthfulness and faithfulness. Now also, this agreement of the covenant impels reward and certain great and abundant gift, which the man would have been able to hold out to God because of God’s law that he knew by nature.</p></blockquote>

<blockquote><p>§124. XII. Man, therefore, by the very fact that he was made according to God’s image, has been constituted as in a covenant with God. I call this covenant or pact a firm agreement in mutual obligation because God bound Adam by oath unto loving and seeking him as his God, that is being examined also in an ardent attachment to God together with obedience throughout the examination period, performed to God’s eternal glory in him who will be revealed in beatific life. And in turn he offered to Adam the assurance of what must be expected for standing in uprightness and rectitude, and for observing the law of examination, and from him, as his God, for striving after that revelation of God’s glory in himself, and the blessing in the multiplication of his posterity with God’s image. This is already clearly evident from what has been said.

§125. XIII. In this pact, heavenly life is considered as the reward that must be reckoned according to what is owed. This is usually called merit. But what the nature of this merit would be must be considered. It is not condign. Man is able to pay nothing to God, God accepts nothing from his hands, it is not profitable or beautiful according to man’s work. Man owes everything to God. See Luke 17:10. It, therefore, remains that merit is by the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Pentateuchum, Josuam, et Librum Judicum</cite>, (Amsterdam, 1669), p. 38. Quoted in Harrison Perkins, ‘Meritum ex Pacto in the Reformed Tradition: Covenantal Merit in Theological Polemics’, Mid-American Journal of Theology, 31 (2020), p. 71.</span></figcaption>

</figure><figure class="quote" id="q-264db93e88" data-kw="">
<blockquote><p>We find God making himself known to man (for it is about man we will keep ourselves confined) as a Lord Commander; and as he has made this creature, he will dispose of him as he sees good. He determines the place of his living; he determines his employment; he lays him under law, and gives him a just and righteous command. He made himself known to man as a threatener too: In the day that thou eatest thereof, thou shalt surely die.

Ay, but, say you, was there no promise in the first covenant? Truly the word does not say there was any: but if people will needs have it that there was a promise, it is not worthy the name of a promise, in regard of what we have in the New Testament. That promise laboured under woful disadvantages, that we are now relieved from.

1st, That promise was a promise of continuance in that happy state he was made in, but no promise of a better. There was no promise of eternal life to the first Adam, as far as we can find in the terms of it. There was no more spoken of, but a continuance in that state: and this is implied in the threatening, In the day that though eatest thereof, thou shalt die; which implies, Until the day thou eatest thereof thou shalt live. But we have a promise in the new covenant of a far better state than that we are in.

2dly, If there was any promise, it was a conditional one, a promise upon the condition of perfect obedience. There was no promise but Upon this condition, Do this, and live. Life was promised upon the condition of doing, but no promise of grace to enable a man to do it. But now we are brought under a promise, blessed be he that promiseth. Whatever is required to be done by the man that would have the blessing promised, grace to do that is promised by the promiser. Hath he required faith? He hath promised faith, and he works faith. Hath he required repentance? He promises, and gives it.

Our Lord is a Prince and a Saviour, to give repentance and remission of sins to the house of Israel. Are we required to by holy in all manner of conversation? Hath he not promised to sanctify and make us holy? Hath he not prayed for this, that we may be sanctified? I told you but just now, Christ’s prayer is as good as a promise. The best promises we have in the Bible are the promises made by the Father to the Son; and next to them, are those promises that we draw out of the Son’s prayer to the Father. So that, upon these accounts, whatever there was in the first covenant, it is not to be called a promise.

3dly, There was no mediator in the first covenant; and therefore it cannot be called a covenant of promise, like that we are now brought under. The mediator of a covenant is to see the terms kept on both parts, and to see the ground secure and safe, that the bargain may not go back on either side. This is our Lord’s undertaking, and his work. Now you see, that as soon as sin came in, grace comes in with a promise. God made himself known to Adam as his creator, commander, and threatener of just punishment to him for his disobedience.

As soon as he disobeyed, so soon is he convicted of guilt in his own conscience. As soon as ever he is arraigned before God, the womb of the promise is open; then the sluice of the promise was drawn up, and it Hath been flowing to this day. It began with a promise. Adam and Eve were to know God now under no other name, but the God that said, The seed of the woman shall bruise the serpent’s head. So it went on through all the Old Testament; that still went along by promise. The Christian’s God, I say, is a promising God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Profession of Our Faith, Recommended in Several Sermons (1718) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 3: 39-40.</cite></span></figcaption>

<blockquote><p>I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor [John] Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could over dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him.

But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof of this, consider, …

Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called ”the law,” being in its own nature a pactional law. …

It is expressly called a covenant in scripture, Gal. iv. 24, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before.

And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. vi. 7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job xxxi. 33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job xxxi. 33, “If I covered my transgressions, as Adam,” Psalm Ixxxii. 7, “But ye shall die like Adam.” Compare ver. 6, “I have said. Ye are gods; and all of you are children of the Most High;” compared with Luke iii. 38, “Adam, which was the son of God.” And also here, Hos. vi. 7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it. …

We find a law of works opposed to the law of faith, Rom. iii. 27, “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. vi. 14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first. …

There were sacramental signs and seals of this transaction in paradise. As it has pleased the Lord still to deal with man in the way of a covenant, so to append seals to these covenants. God’s covenant with Noah, that he would not destroy the earth again with water, had the rainbow as a sign of it to confirm it. Gen. ix. 12, 13. The covenant with Abraham had circumcision; that with the Israelites, circumcision and the passover; and the new covenant with the New Testament church, baptism and the Lord’s supper. So to the covenant of works God appended the two trees; the tree of life, Gen. iii. 22, ”And now lest he put forth his hand, and take also of the tree of life, and eat, and live for ever;” and the tree of the knowledge of good and evil, mentioned in the words of the text. When we find then confirming seals of this transaction, we must own it to be a covenant. …

Lastly, All mankind are by nature under the guilt of Adam’s first sin; Rom. v. 12, “As by one man sin entered into the world, and death by sin, and so death passed upon all men, for that all have sinned.” And they are under the curse of the law before they have committed actual sin: hence they are said to be “by nature children of wrath,” Eph. ii. 3, which they must needs owe to Adam’s sin, as imputed to them. This must be owing to a particular relation betwixt them and him; which must either be, that he is their natural head simply, from whence they derive their natural being; but then the sins of our immediate parents, and all other mediate ones too, behoved to be imputed rather than Adam’s, because our relation to them is nearer; or because he is our federal head also, representing us in the first covenant. And that is the truth, and evidences the covenant of works made with Adam to have been a proper covenant.</p></blockquote>

e+poor+impotent+sinners%2C+if+there+had+not+been+such+a+covenant+with+man+in+his+state+of+integrity%3F+Hos.+vi.+7%2C+%E2%80%9CBut+as+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+xxxi.+33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+xxxi.+33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+Ixxxii.+7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said.+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+iii.+38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+vi.+7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+%E2%80%A6%0A%0AWe+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+iii.+27%2C+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+vi.+14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.+%E2%80%A6%0A%0AThere+were+sacramental+signs+and+seals+of+this+transaction+in+paradise.+As+it+has+pleased+the+Lord+still+to+deal+with+man+in+the+way+of+a+covenant%2C+so+to+append+seals+to+these+covenants.+God%E2%80%99s+covenant+with+Noah%2C+that+he+would+not+destroy+the+earth+again+with+water%2C+had+the+rainbow+as+a+sign+of+it+to+confirm+it.+Gen.+ix.+12%2C+13.+The+covenant+with+Abraham+had+circumcision%3B+that+with+the+Israelites%2C+circumcision+and+the+passover%3B+and+the+new+covenant+with+the+New+Testament+church%2C+baptism+and+the+Lord%E2%80%99s+supper.+So+to+the+covenant+of+works+God+appended+the+two+trees%3B+the+tree+of+life%2C+Gen.+iii.+22%2C+%E2%80%9DAnd+now+lest+he+put+forth+his+hand%2C+and+take+also+of+the+tree+of+life%2C+and+eat%2C+and+live+for+ever%3B%E2%80%9D+and+the+tree+of+the+knowledge+of+good+and+evil%2C+mentioned+in+the+words+of+the+text.+When+we+find+then+confirming+seals+of+this+transaction%2C+we+must+own+it+to+be+a+covenant.+%E2%80%A6%0A%0ALastly%2C+All+mankind+are+by+nature+under+the+guilt+of+Adam%E2%80%99s+first+sin%3B+Rom.+v.+12%2C+%E2%80%9CAs+by+one+man+sin+entered+into+the+world%2C+and+death+by+sin%2C+and+so+death+passed+upon+all+men%2C+for+that+all+have+sinned.%E2%80%9D+And+they+are+under+the+curse+of+the+law+before+they+have+committed+actual+sin%3A+hence+they+are+said+to+be+%E2%80%9Cby+nature+children+of+wrath%2C%E2%80%9D+Eph.+ii.+3%2C+which+they+must+needs+owe+to+Adam%E2%80%99s+sin%2C+as+imputed+to+them.+This+must+be+owing+to+a+particular+relation+betwixt+them+and+him%3B+which+must+either+be%2C+that+he+is+their+natural+head+simply%2C+from+whence+they+derive+their+natural+being%3B+but+then+the+sins+of+our+immediate+parents%2C+and+all+other+mediate+ones+too%2C+behoved+to+be+imputed+rather+than+Adam%E2%80%99s%2C+because+our+relation+to+them+is+nearer%3B+or+because+he+is+our+federal+head+also%2C+representing+us+in+the+first+covenant.+And+that+is+the+truth%2C+and+evidences+the+covenant+of+works+made+with+Adam+to+have+been+a+proper+covenant.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+A+View+of+the+Covenant+of+Works%2C+from+the+Sacred+Records%2C+%281772%29+in+The+Whole+Works+of+the+Late+Reverend+Thomas+Boston+of+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11%3A+180-83.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F87c2b677cc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/87c2b677cc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/25/thomas-boston-a-refutation-of-the-arminian-denial-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>God deals with man by way of covenant. This hath been his manner with mankind ever since there was man on the face of the earth; when God had created the first man Adam, he entered into covenant with him, which was a covenant of friendship, and gave him faculties, and ability to perform perfect, personal, and perpetual obedience; but he violating that covenant, God again entered unto another covenant called a new covenant, or covenant of reconciliation, contracted betwixt an offended God, and fallen man; these are commonly distinguished into “the covenant of works, and the covenant of grace;” and it may be worth while in a few words, to explain the difference between them, and the rather because, as Luther saith, the whole scripture, and the knowledge of theology depend upon the right distinguishing of law and gospel; and he earnestly admonisheth ministers to study the difference between the two covenants. …

1. These two covenants differ [genere] in kind, the former covenant being a covenant of friendship, between persons at amity, the infinite Creator, and Adam his perfect creature, to manifest man’s dependence on God, and try his obedience; but now the case is altered, man is fallen, and hath offended his sovereign. This second covenant is intended to conciliate and establish a new made friendship between these parties at variance; this second covenant sets all at rights between an offended God, and offending man.

2. They differ [fundaniento] in the foundation of both; as to the former, though divine decrees did define it, yet there was not such a foundation laid for the first, as there was for the second covenant, for with respect to this covenant of grace or reconciliation, it was founded upon an antecedent covenant, which divines call a covenant of redemption, or a glorious transaction betwixt the Father and the Son, from all eternity, ordering what the Son should be and do on man’s behalf, in the human nature, and what assistance and recompense he should receive from the Father; there were mutual promises before the world began, Tit. i. 2. 2 Tim. i. 9, 10. The whole gospel covenant is a glorious transcript of this blessed original.

3. They differ [prinicipio] in the principle, or moving cause, for in the former God acts as a wise and righteous governor, who did consult and contrive a way to maintain his government, and keep man in an humble subjection. In this latter, free grace and mercy principally take place, free grace was the motive in God’s heart that engaged him to re-enter into this covenant. It is true, in the former there was grace conspicuous, when God condescended to deal so familiarly with his creature, and render himself so amiable, so amicable, and approachable by so mean a creature as man, so much his inferior, yea, and promise a reward to man’s obedience, this was kindness; but free grace abounded in the latter, for it is mercy to a creature in misery, the kindness and love [or philanthropy] of God our Saviour transcendently shone forth or appeared — and its influences are shed on us abundantly, or poured out richly on lost mankind. This covenant is nothing else but a compound of love and mercy.

4. They differ [efficiente] in the efficient cause, in the management of the transaction on man’s part; in the former covenant there were two parties, though not without great disparity. Man was at first furnished with faculties and ability to enter into, and keep the covenant made with him; but now fallen man is spiritually dead, and though still he retains his faculties, yet he hath lost the rectitude of them, and ability to perform his part of the conditions; it is true the parties are still two, formally considered, yet if we consider the efficacy which secures the due performance of the terms, all lies on God’s part; who works in us the conditions, which he requires of us, as faith, repentance, and new obedience. The agent is man, the efficient cause of that agency is God’s grace; as in natural things we live and move, from God’s providence; so in spiritual things our holy actions proceed from his gracious influence: as Augustin saith, there are many good things that God doth in man, that man doth not, but there is no holy action that man doth, but God doth enable him to do it.</p></blockquote>

ill+he+retains+his+faculties%2C+yet+he+hath+lost+the+rectitude+of+them%2C+and+ability+to+perform+his+part+of+the+conditions%3B+it+is+true+the+parties+are+still+two%2C+formally+considered%2C+yet+if+we+consider+the+efficacy+which+secures+the+due+performance+of+the+terms%2C+all+lies+on+God%E2%80%99s+part%3B+who+works+in+us+the+conditions%2C+which+he+requires+of+us%2C+as+faith%2C+repentance%2C+and+new+obedience.+The+agent+is+man%2C+the+efficient+cause+of+that+agency+is+God%E2%80%99s+grace%3B+as+in+natural+things+we+live+and+move%2C+from+God%E2%80%99s+providence%3B+so+in+spiritual+things+our+holy+actions+proceed+from+his+gracious+influence%3A+as+Augustin+saith%2C+there+are+many+good+things+that+God+doth+in+man%2C+that+man+doth+not%2C+but+there+is+no+holy+action+that+man+doth%2C+but+God+doth+enable+him+to+do+it.%E2%80%9D%0A%0A%E2%80%94+Oliver+Heywood%2C+Baptismal+Bonds+Renewed%2C+%281687%29+in+The+Whole+Works+of+the+Rev.+Oliver+Heywood%2C+B.A.+%285+vols%2C+Idle%3A+John+Vint%2C+1826%29%2C+4%3A+13-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1f8ec9b34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1f8ec9b34.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/08/oliver-heywood-on-the-two-covenants-contrasted-1/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

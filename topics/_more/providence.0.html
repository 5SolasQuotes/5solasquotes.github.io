<blockquote><p>Since, therefore, it is clear from what has been said that our will is effectively moved and determined by God as the first cause, the first mover, and therefore is preceded and predetermined by Him, it remains to be explained how this effective motion and determination, or rather divine pre-motion and predetermination, is consistent with the freedom of our will. For it does not seem that what is effectively moved and determined in one direction by a prior cause can be free to do otherwise.</p></blockquote>

</figure><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>

<blockquote><p>XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.</p></blockquote>

<blockquote><p>…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.</p></blockquote>

<blockquote><p>The disagreement is whether that subordination and dependence of secondary causes upon the first involves determination of the secondary cause by the first; and if it does, through what it is exercised. Father Suárez… and with him the Jesuit Fathers commonly, deny that the first cause determines the secondary cause in its free acts… They add that the first cause does nothing antecedently — neither in the secondary cause nor in its action in second act — but coacts simultaneously with the same concurrence, in such a way that from both causes simultaneously and concomitantly concurring, the action comes about; and therefore God cannot predefine or foresee what the created will is going to do before its foreseen determination. Hence they have recourse to conditional knowledge, by which God knows what the free secondary cause will do if placed in such or such circumstances; and according to what He sees it will do if thus placed, it determines what God wills to be for that time from that cause.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The disagreement is whether that subordination and dependence of secondary causes upon the first involves determination of the secondary cause by the first; and if it does, through what it is exercised. Father Suárez… and with him the Jesuit Fathers commonly, deny that the first cause determines the secondary cause in its free acts… They add that the first cause does nothing antecedently — neither in the secondary cause nor in its action in second act — but coacts simultaneously with the same concurrence, in such a way that from both causes simultaneously and concomitantly concurring, the action comes about; and therefore God cannot predefine or foresee what the created will is going to do before its foreseen determination. Hence they have recourse to conditional knowledge, by which God knows what the free secondary cause will do if placed in such or such circumstances; and according to what He sees it will do if thus placed, it determines what God wills to be for that time from that cause.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinism &amp; Suarez, pp. 373-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+disagreement+is+whether+that+subordination+and+dependence+of+secondary+causes+upon+the+first+involves+determination+of+the+secondary+cause+by+the+first%3B+and+if+it+does%2C+through+what+it+is+exercised.+Father+Su%C3%A1rez%E2%80%A6+and+with+him+the+Jesuit+Fathers+commonly%2C+deny+that+the+first+cause+determines+the+secondary+cause+in+its+free+acts%E2%80%A6+They+add+that+the+first+cause+does+nothing+antecedently+%E2%80%94+neither+in+the+secondary+cause+nor+in+its+action+in+second+act+%E2%80%94+but+coacts+simultaneously+with+the+same+concurrence%2C+in+such+a+way+that+from+both+causes+simultaneously+and+concomitantly+concurring%2C+the+action+comes+about%3B+and+therefore+God+cannot+predefine+or+foresee+what+the+created+will+is+going+to+do+before+its+foreseen+determination.+Hence+they+have+recourse+to+conditional+knowledge%2C+by+which+God+knows+what+the+free+secondary+cause+will+do+if+placed+in+such+or+such+circumstances%3B+and+according+to+what+He+sees+it+will+do+if+thus+placed%2C+it+determines+what+God+wills+to+be+for+that+time+from+that+cause.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Contra+Molinism+%26+Suarez%2C+pp.+373-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c0c5ffb8d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c0c5ffb8d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=The%20disagreement%20is%20whether%20that%20subordination,for%20that%20time%20from%20that%20cause&amp;text=The%20disagreement%20is%20whether%20that%20subordination%20and%20dependence&amp;text=to%20be%20for%20that%20time%20from%20that%20cause" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cbaf7db3bb" data-kw="">
<blockquote><p>In the contrary extreme are the Thomists, who, in their zeal to preserve the subordination and dependence of the secondary cause upon the first, posit a certain prior motion determining the secondary cause on God’s part — which is a complement of power in first act bringing with it second act antecedently. They teach this to be a physical quality, or something after the manner of a quality, which is the ground of applying and determining the secondary cause to a certain action, which in free causes could not otherwise be determined, since they are by their nature indifferent. And thus the efficacy of the divine decree is made consistent, the dependence of creatures upon it, and the infallible certainty of divine knowledge concerning future free acts… so Alvarez is the illustrious author of this position… and before him Medina… and Báñez… Conrad…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Position of Later Thomists, p. 375</span></figcaption>

</figure><figure class="quote" id="q-aac5bc0451" data-kw="">
<blockquote><p>For they [Suarezians] place it [the will] in every state always in a certain citadel of integral power, constituted in an equilibrium with full capacity for either side, deflected by no inclination — altogether its own master and arbiter, as it were giving laws to causes and circumstances as they present themselves, commanding them to comply with its nod and to await its direction. Yet the matter is very different. For our will in this state of fallen nature, in which it exists, has greatly weakened and declined from that first state of integrity and innocence, as the Second Council of Orange and the Council of Trent teach us. Moreover, it depends greatly upon the knowledge and presentation of objects and follows the intellect leading it, accommodating itself to it rather than the intellect to it. In addition, it is disturbed by concupiscence — both irascible and concupiscible — by which it is often displaced from its position and dislodged from its right station. It is marvelously and variously affected by movements and perturbations of the soul; sometimes it is pressed and driven by appetite, and sometimes enticed and drawn by pleasure it serves lust. On another side, it is shaken from the movement of appetite and terror, and in its own station it wavers and scarcely maintains its integral liberty. And again — how often is it seized by ignorance and blindness of the mind, and deviates from the straight path of reason? How often, burning with the heat of lust and without a bridle, does it run headlong and is immersed in the mire of pleasures, from which not without sorrow and groaning does it drag itself out defiled? Not rarely do inveterate habits so incline it that it resists them with difficulty. Even the domestic familiarity of custom makes it live with custom as if at home, and causes it to neglect new things, however excellent, as though foreign. Indeed, I have seen nothing more volatile than the will when it is free from affection, nothing more constant when occupied with affection. Nor is it so powerful and mistress of itself as is imagined; since in its first primary acts it is desired and wholly occupied, and suffers involuntarily the assaults of those acts and their concomitant effects. It is bent by counsels, warnings, prayers, threats, loves, terrors, simulations, flatteries, titillations, jests, laughter, applause — by these it is led and drawn, so that it seems to do nothing other than what those authors call the mistress — namely, to serve everyone. And yet even then, when it is affected in so many ways, shaken, changed, drawn, and bent, it preserves its liberty… The will, inclined toward lust, can enjoy a woman and be led by that pleasure and remain free. Will it not be able to remain free when inclined and premoved by God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Factors upon the Will, pp. 376-77</span></figcaption>

</figure><figure class="quote" id="q-42ea69f38c" data-kw="">
<blockquote><p>From that position it follows that the human will can do more than the divine, and can draw and temper it according to its own nod and pleasure. This is clear because whatever it wills, God fulfills: if it wills, the concurrence is present; if it does not will, it is absent. And God waits to see what it wills and does not act before its nod, nor operates contrary to its will… It elicits the act when it pleases and determines the divine concurrence according to its own judgment. Therefore the will does what the human will wills, not what the divine will wills. From which it follows that the will is mistress of the divine concurrences, which are ready — as those authors say — indifferently for the pleasure of the will… What is this but to drive God around in circles, as it were, and lead him about? Yet this is in no way permitted to God with respect to the creature, through which God is not allowed to act freely and to operate according to his own judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinists, p. 378</span></figcaption>

<blockquote><p>…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;”

</figure><figure class="quote" id="q-7097c0b5ee" data-kw="">
<blockquote><p>…it remains to consider what third, middle path he [Scotus] appears to have chosen. Namely, that God concurs with free secondary causes in such a way that He does not await their free consent before concurring… nor does He merely accompany them by offering concurrence if they wish to act… nor does He predetermine them to act by means of some prior quality or physical motion impressed antecedently upon the will… Rather, God determines them in such a way that through the very same act or concurrence which He provides with certainty and determination toward the free act — by virtue of the essential subordination and dependence which the secondary cause has with respect to the first — He determines them antecedently, yet contingently and freely. And this mode of determining is such that it is not contrary to created freedom; indeed, it is fitting and necessary, and through this determination the proper subordination and dependence of the creature upon the Creator is established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 396</span></figcaption>

</figure><figure class="quote" id="q-d361f92310" data-kw="">
<blockquote><p>Having examined the mind of Scotus, whom I expound and follow, I establish this: the principle determining the free and contingent secondary cause toward its free and contingent act is the first cause, concurring with it antecedently by a certain priority of nature toward the action and effect, in such a way that the divine action is prior in nature — not only by dignity and perfection, but also by causality. This I affirm to be wholly the mind of Scotus, and fitted to remove all the difficulties we have mentioned above… And since he fully knows its nature and mode of operating, he adapts and accommodates to it the concurrence which, although antecedent and leading, will move and lead the will freely and contingently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 407-8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“Having examined the mind of Scotus, whom I expound and follow, I establish this: the principle determining the free and contingent secondary cause toward its free and contingent act is the first cause, concurring with it antecedently by a certain priority of nature toward the action and effect, in such a way that the divine action is prior in nature — not only by dignity and perfection, but also by causality. This I affirm to be wholly the mind of Scotus, and fitted to remove all the difficulties we have mentioned above… And since he fully knows its nature and mode of operating, he adapts and accommodates to it the concurrence which, although antecedent and leading, will move and lead the will freely and contingently.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 407-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHaving+examined+the+mind+of+Scotus%2C+whom+I+expound+and+follow%2C+I+establish+this%3A+the+principle+determining+the+free+and+contingent+secondary+cause+toward+its+free+and+contingent+act+is+the+first+cause%2C+concurring+with+it+antecedently+by+a+certain+priority+of+nature+toward+the+action+and+effect%2C+in+such+a+way+that+the+divine+action+is+prior+in+nature+%E2%80%94+not+only+by+dignity+and+perfection%2C+but+also+by+causality.+This+I+affirm+to+be+wholly+the+mind+of+Scotus%2C+and+fitted+to+remove+all+the+difficulties+we+have+mentioned+above%E2%80%A6+And+since+he+fully+knows+its+nature+and+mode+of+operating%2C+he+adapts+and+accommodates+to+it+the+concurrence+which%2C+although+antecedent+and+leading%2C+will+move+and+lead+the+will+freely+and+contingently.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Macedo+%26+Scotus%E2%80%99s+View%2C+pp.+407-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd361f92310.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d361f92310.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=Having%20examined%20the%20mind%20of%20Scotus,lead%20the%20will%20freely%20and%20contingently&amp;text=Having%20examined%20the%20mind%20of%20Scotus%2C%20whom%20I&amp;text=move%20and%20lead%20the%20will%20freely%20and%20contingently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bc0effdd91" data-kw="">
<blockquote><p>And so that immediate and per se motion of the first cause upon the secondary cause is, so to speak, the secondary cause’s own and natural motion, absorbed into its very being and operation — so that in the common and accepted view, both causes operate through one single and individual action, and nothing is done by one that is not done by the other. Therefore it is not to be thought that the contingent and free mode of acting of the secondary cause is overturned or destroyed by the pure concurrence of the first cause antecedent in nature to the concurrence and determination of the secondary cause — since this is intimately absorbed into the very nature of the secondary cause itself. I speak plainly. To be determined by God is as much as to be determined by itself, since that determination pertains to the natural mode of operating of the secondary cause. This is urged and explained: because that antecedence of nature, since it is not a real priority, nor one of time, nor of a temporal instant, posits and imprints nothing antecedently in the secondary cause before it operates. Rather, it is a priority altogether conjoined with the action of the secondary cause, such that they exist simultaneously and operate in the same instant of time. The priority of nature is only on the side of the first cause, by reason of the subordination and dependence of the secondary cause upon the first — which all call consequential subsistence — so that just as the secondary cause depends upon the first in being, so also it depends upon it in operating. Thus it is true to say: the secondary cause operates because God operates, and not the converse…</p></blockquote>

</figure><figure class="quote" id="q-b0685fd0f6" data-kw="">
<blockquote><p>[Scotus:] ‘It is not against the nature of the will to be determined by a superior cause, because along with this it remains that it is a cause in its own order.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-466404936c" data-kw="">
<blockquote><p>It appears, therefore, what the mode is by which the first cause moves and determines the secondary cause, without necessity and with the freedom of the secondary cause entirely unimpaired — through that priority of nature of the concurrence as it is from God as first cause, subordinating to itself in the very operation the secondary cause, and retaining by priority of nature its dignity in causing.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-8d48e99a77" data-kw="">
<blockquote><p>For that determination of God toward concurring with the secondary cause does not arise from a necessity imposed immediately by the action of the secondary cause, but from the reason of providence, by which the universal first cause must concur with the particular secondary causes. And this is clear from the fact that he concurs in this way with all causes, even the necessary ones, for the common reason of providence. But in the mode of concurring, he exhibits necessary concurrence to natural and necessary causes, and contingent concurrence to contingent and free ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 411-12</span></figcaption>

</figure><figure class="quote" id="q-c4dca8c0f8" data-kw="">
<blockquote><p>Their common doctrine [i.e. “all scholastics of whatever school”] is that God determines secondary causes as to the individual, yet without thereby harming their freedom or contingency.</p></blockquote>

</figure><figure class="quote" id="q-ba2904b67e" data-kw="">
<blockquote><p>It is first established that God neither is nor can be the author of sin… With this truth asserted, the question is: whether and how God concurs with the free cause toward the act of sin?… the common sense of all is that God does not concur with the formal element of sin, whatever that is, but only with the material and the substrate of the formal… For even the heretics do not say that God formally determines toward formal malice; indeed, Calvin explicitly says at (bk. 1, Institutes, ch. 18) that God does not will the treachery.</p></blockquote>

<blockquote><p>From this it is clear that the reason for knowing a future sin of commission is the concurrence to be exhibited, and for a sin of omission the concurrence not exhibited — or the negation of concurrence. Yet it does not appear how God concurs toward that act of commission: whether antecedently or concomitantly. For Scotus says only that God knows that he will not cooperate — by which word a simultaneous concurrence is suggested, not a preceding one with any priority. And therefore the sinning will would not be predetermined in any antecedent manner by God.</p></blockquote>

</figure><figure class="quote" id="q-112da71237" data-kw="">
<blockquote><p>Indeed, from the different mode in which Scotus speaks here of God’s concurrence toward the act of sin, it entirely follows that this is an exception to that general rule [according to Macedo] — namely, that God both predefines from eternity and predetermines in time antecedently all good acts of the will; and only with respect to evil and sinful acts does he behave differently — that is, not by determining antecedently, but by awaiting the action of the deficient and sinning will. If we establish this by proving it, we establish the doctrine of Scotus on the subordination of causes, and we marvelously reconcile it with the doctrine of the Council of Trent — as we will demonstrate afterward — which teaches against Calvin and the other innovators that God concurs in a different mode with the good and meritorious act than with the evil and demeritorious one. [Yet the Reformed affirm this, ignoring the part about meriting.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed, p. 420</span></figcaption>

ng&amp;text=Indeed%2C%20from%20the%20different%20mode%20in%20which%20Scotus&amp;text=Reformed%20affirm%20this%2C%20ignoring%20the%20part%20about%20meriting" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0773bba88d" data-kw="">

</figure><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>

</div>
</figure><figure class="quote" id="q-b23442f769" data-kw="">
<blockquote><p>…in the opinion of Scotus… For since God, as we have said, concurs toward the substrate of the evil act without causing its defect or intending it, He concurs only with the material of the act, with formal malice entirely removed. This is clear. God does not concur with that act in time except insofar as He decreed and foresaw from eternity that he would concur. But He decreed and foresaw from an antecedent permission, which is not a positive intention concerning that sinful act. Therefore, also when He concurs in time, He does not exhibit concurrence toward the sinful act; but only, given that there is a positive entity in it, did He decree from eternity to concur and does He actually concur in time with it. And this pertains to the first cause in the physical genus, not the moral. Hence, since malice is something moral and wholly proper to the secondary cause, it falls back upon that cause as upon its moral cause — which God cannot be with respect to that evil act.</p></blockquote>

</figure><figure class="quote" id="q-963508f7c6" data-kw="">
<blockquote><p>…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…</p></blockquote>

</figure><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-397e0b69b0" data-kw="">
<blockquote><p>XXXIII. As for the Reformed theologians known as Remonstrants or Arminians in Belgium, they recognize no other divine concurrence with secondary causes than that general and indifferent one [such as described under Molinism above], which is determined by the concurrence of the secondary cause. This can be seen in Jacob Arminius, from whom all others derive their name. In his dispute against Perkins, he not only affirms that this divine concurrence is indifferent in itself but also that it contributes nothing to the will of the creature by which it might be inclined, helped, or strengthened to act. He asserts that the created will has God’s concurrence in its power, ready and available, before it acts (in Anti-Perkins, p. 733). Similar teachings are found in Grevinchovius against Amesius (sect. 32, p. 368) and Corvinus against Tilenus (ch. 9, p. 354).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, p. 344 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

ilenus%20%28ch.%209%2C%20p.%20354&amp;text=XXXIII.%20As%20for%20the%20Reformed%20theologians%20known%20as&amp;text=and%20Corvinus%20against%20Tilenus%20%28ch.%209%2C%20p.%20354" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-842e0d5fe6" data-kw="">
<blockquote><p>However the will depends on God, and whatever God works in it, it always retains the liberty which we said consists in immunity from the threefold necessity of coercion, determination by matter, and determination by sense.</p></blockquote>

</figure><figure class="quote" id="q-024d08910a" data-kw="">
<blockquote><p>In yet another example of philosophical debate, Reformed concerns over the doctrine of providence and divine foreknowledge of future contingents associated with the rejection of Molinism, brought Reformed orthodox writers into dialogue with Dominican opponents of Molinism and led to the adoption or adaptation on the part of many of the Reformed of the concept of divine concurrence understood as “physical premotion” (praemotio physica). William Twisse advocated the concept, Francis Turretin adapted it selectively, and Richard Baxter polemicized against it as a form of determinism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>Since every being, insofar as it is being, is good, it is plain that evil cannot be anything real or positive, nor can it exist in itself. For it is the lack of good in something good. Insofar as it is opposed to the good for oneself it is lack of due perfection, as blindness in a man or animal. Insofar as it is opposed to the good for another it is the lack of relative appetibility, namely with respect to a certain appetite, as unripe fruit, poisonous plants. Evil cannot have a material or formal cause, namely constitutive principles. If material cause is taken in the sense of the subject-in-which, good is this cause. Evil cannot exist in itself but in some good. But can it have a final cause? Physical evil can be intended as a means to some end and licitly so, provided the end is good or indifferent or proportionate to the evil. Moral evil can be intended only illicitly and only by a finite will. But no evil can be desired for its own sake or as an end save under the appearance of good. For evil as such has no appetibility in itself or because of itself. But every evil can be permitted, that is, not impeded either by God or by man, given what needs to be given. Evil does have an efficient cause but only indirectly, namely in the producing of some good when the production is, for some reason, imperfect or defective whether on the part of the efficient cause or on the part of the matter, or even when a good is badly done, for example blindness from [the accidental] destruction of an eye [while pursuing another good]. Some Corollaries about Evil Conclusion 30: Evil involves good, or evil exists in a good, for from what was said evil is privation of good in something good. Conclusion 31: Evil corrupts the good that it harms. Insofar as evil is a privation of goodness in a good, it corrupts the good. And when evil is measured according to the good of which it is the lack, the greater the good that is missed the greater the corresponding evil. Hence the phrase: ‘corruptio optimi pessima’ or ‘the best is worst when corrupted’.</p></blockquote>

</figure><figure class="quote" id="q-a0c131ba83" data-kw="">
<blockquote><p>As the term ‘good’ signifies perfect being, so the term ‘evil’ signifies nothing else than privation of perfect being. In its proper acceptation, privation is predicated of that which is fitted by its nature to be possessed, and to be possessed at a certain time and in a certain manner. Evidently, therefore, a thing is called evil if it lacks a perfection it ought to have.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendium of Theology</cite>, ch. 114, ‘The Meaning of Good &amp; Evil in Things’</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-e5551628ee" data-kw="">
<blockquote><p>11. In this universe, even what is called evil, when it is rightly ordered and kept in its place, commends the good more eminently, since good things yield greater pleasure and praise when compared to the bad things. For the Omnipotent God, whom even the heathen acknowledge as the Supreme Power over all, would not allow any evil in his works, unless in his omnipotence and goodness, as the Supreme Good, he is able to bring forth good out of evil. What, after all, is anything we call evil except the privation of good? In animal bodies, for instance, sickness and wounds are nothing but the privation of health. When a cure is effected, the evils which were present (i.e., the sickness and the wounds) do not retreat and go elsewhere. Rather, they simply do not exist any more. For such evil is not a substance; the wound or the disease is a defect of the bodily substance which, as a substance, is good. Evil, then, is an accident, i.e., a privation of that good which is called health. Thus, whatever defects there are in a soul are privations of a natural good. When a cure takes place, they are not transferred elsewhere but, since they are no longer present in the state of health, they no longer exist at all.¹ ¹ This section (Chs. III and IV) is the most explicit statement of a major motif which pervades the whole of Augustinian metaphysics. We see it in his earliest writings, Soliloquies, 1, 2, and De ordine, II, 7… The good is positive, constructive, essential; evil is privative, destructive, parasitic on the good. It has its origin, not in nature, but in the will. Cf. Confessions, Bk. VII, Chs. III, V, XII-XVI; On Continence, 14-16; On the Gospel of John, Tractate XCVIII, 7; City of God, XI, 17; XII, 7-9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Enchiridion, or Handbook on Faith, Hope &amp; Love</cite>, section 11 trans. Outler (1955)</span></figcaption>

</figure><figure class="quote" id="q-710f501986" data-kw="">
<blockquote><p>IX. Wherefore this [original] sin is not something positive, that is, a certain subsisting thing created by God, nor is it simply nothing, nor a simple and pure privation, as death is the privation of life, or darkness is the privation of light; but it is that which is at the same time a defect and a destruction of a positive thing, namely of the work and divine order by which all our powers and inclinations ought to have been ruled, and therefore a vicious habit exciting and begetting internal and external motions, which, straying from the law of God, are displeasing to God.</p></blockquote>

<blockquote><p>The Reformed certainly acknowledge that there is some substrate present under sin, namely a faculty or action in which inheres wickedness, although it is not a substance subsisting through itself; likewise they acknowledge that sin is not something negative; but they deny that it is something real, something substantial or positive; they affirm rather that it is something privative, which consists only in lawlessness, or the absence of moral uprightness in a capable subject. They do so because: (1) John in his first epistle (3:4) defines sin as precisely as possible, by only ἀνομία, lawlessness: ἡ ἁμαρτία ἐστὶν ἡ ἀνομία, “sin is lawlessness.</p></blockquote>

<blockquote><p>§38. The Form [of original sin] is the privation of original wisdom and justice (Ps. 143; Rom. 310, ff.), “There is none that understandeth, there is none that seeketh after God. They are all gone out of the way, they are together become unprofitable; there is none that doeth good, no, not one.” Verse 23, “For all have sinned, and come short of the glory of God;” add 1 Cor. 2:14; Eph. 4:18, with an adjoined proclivity to sensible and sensual things. Hence it is called the evil that dwells, inhabits and operates in us (Rom. 7:17, 20-21), and also the Flesh (Jn. 3, 6), the Old man (Eph. 4:22), the law of the members and the body of death (Rom. 7:18, 23-24). But those who here make mention of the positive, distinguish between the positive taken metaphysically or physically, and the positive taken ethically and logically. In the former sense, whatever is positive is being, and has the adjuncts and predicates of being. In the latter sense, the positive signifies the privation of a due habit inhering, but which infers an adjoined inclination to contrary habits, as a disease is not only the privation of health, the temper of the humors being removed and disturbed, but also brings in a vicious quality arisen from the badly disposed humors; and in the venereal plague and leprosy there is not only a privation of pure blood, but also its foul corruption. §39. Therefore, the Original Stain is not a substance, which [the Lutheran] Flacius asserted in the Disputation of Weimar with Victorinus Strigelius in A.D. 1561, which error he then repeated in his Writings. For: (1) Scripture distinguishes this stain from man himself, calling it in Rom. 7:17 “the evil that dwelleth in and adhereth” to us. But that which inhabits differs from its hospice, and that which adheres from that to which it adheres, for example, a garment from a man. (2) Every created substance is from God, and in that sense, good (Gen. 1:31; 1 Tim. 4:4). (3) because God creates man even after the fall, Job 10:8, “Thine hands have made me and fashioned me together round about;” also Ps. 139:14, which cannot be said of sin. (4) Because this error overturns the article of Faith concerning the Creation, concerning the Assumption of human Nature [by Christ], concerning Regeneration, Renovation, and Resurrection. §40. The effects are either moral or physical evils…</p></blockquote>

<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments [cf. 2 Sam. 24:10–17], the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called “burdens,” Acts 15 [v. 28]. And Moses may make an ordinance about the use of a bill of divorcement which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>

</figure><figure class="quote" id="q-51fb0d48d6" data-kw="">
<blockquote><p>But every man is tempted, when he is drawn away of his own lust, and enticed. Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death.’ John in 1 Jn. 2:12, 16, “The lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father, but is of the world.” Add. Gal. 5:17.

2. Actual sins, which flow from this impure font: Mt. 15:19, “For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies: These are the things which defile a man.” Jam. 1:15. To these [latter, phsycial evils,] pertain:

3. Punishments of every kind: calamities, diseases, and finally temporal and eternal death (Rom. 5:12, 14; 7:10-14; Eph. 2:3). Thomas in Summa, pt. 1 of 2, q. 85, art. 3, recounts four wounds of nature: ignorance, malice, concupiscence and infirmity, of which he constitutes the first in the intellect, the second in the will, the third in the concupiscible appetite, and the fourth in the irascible, which Bellarmine expounds diffusely and pathetically in On the Loss of Grace &amp; the State of Sin., bk. 6, ch. 9-12.</p></blockquote>

<blockquote><p>26. ‘Evil’ is an ambiguous term. It may stand for miserable evils or moral evils. One may morally choose to undergo and suffer certain miserable evils in necessity, other alternatives not being available, likely or reasonable. Electing to eat expired food rather than starve is not wrong. One ought never to do moral evil, though it be lesser in respect to another (1 Cor. 15:34; WLC 99.5).</p></blockquote>

<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>

<blockquote><p>God is the end of Himself, in all his ways, works and counsels; neither is there any end worthy of God, but God. Therefore all his works, as they begin in Him, so they end in Him, bringing some glory to Him.</p></blockquote>

</figure><figure class="quote" id="q-7d30634816" data-kw="">
<blockquote><p>O but the management of the kingdom of grace must be a great thing! and our Mediator must be well furnished for the managing of it! since the vast and extensive kingdom of Providence is put in his hand as a subordinate, there to be administered in a subserviency to the kingdom of grace, and to carry on the glorious purposes thereof. He sits enthroned in Zion; and as Zion’s King, his power reaches through the whole earth, the seas, heaven, and hell! All power is given him everywhere. His subjects in Zion are but few, but the whole world is rolled hither and thither for that little kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to his Correspondent in Edinburgh, 14 December 1724 in Memoirs (1731) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 12: 484.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“O but the management of the kingdom of grace must be a great thing! and our Mediator must be well furnished for the managing of it! since the vast and extensive kingdom of Providence is put in his hand as a subordinate, there to be administered in a subserviency to the kingdom of grace, and to carry on the glorious purposes thereof. He sits enthroned in Zion; and as Zion’s King, his power reaches through the whole earth, the seas, heaven, and hell! All power is given him everywhere. His subjects in Zion are but few, but the whole world is rolled hither and thither for that little kingdom.”

— Thomas Boston, Letter to his Correspondent in Edinburgh, 14 December 1724 in Memoirs (1731) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 12: 484.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CO+but+the+management+of+the+kingdom+of+grace+must+be+a+great+thing%21+and+our+Mediator+must+be+well+furnished+for+the+managing+of+it%21+since+the+vast+and+extensive+kingdom+of+Providence+is+put+in+his+hand+as+a+subordinate%2C+there+to+be+administered+in+a+subserviency+to+the+kingdom+of+grace%2C+and+to+carry+on+the+glorious+purposes+thereof.+He+sits+enthroned+in+Zion%3B+and+as+Zion%E2%80%99s+King%2C+his+power+reaches+through+the+whole+earth%2C+the+seas%2C+heaven%2C+and+hell%21+All+power+is+given+him+everywhere.+His+subjects+in+Zion+are+but+few%2C+but+the+whole+world+is+rolled+hither+and+thither+for+that+little+kingdom.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Letter+to+his+Correspondent+in+Edinburgh%2C+14+December+1724+in+Memoirs+%281731%29+in+The+Whole+Works+of+the+Late+Reverend+Thomas+Boston+of+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+12%3A+484.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7d30634816.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7d30634816.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/12/21/thomas-boston-on-the-kingdom-of-providence-in-the-hands-of-the-mediator/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Effectual Concurse of the first Cause with the second, is an external transient influence of God, upon the creature in time, exactly answering to the Decree of God before time: moving upon, co-working with, and assisting of the second cause to its operations. It is the clearer understood by considering on God’s part the Decree, which is an immanent and eternal act abiding in God; and his efficiency, which is an external and passing act put forth upon the creature in time.

For the better understanding of the Concurse, Co-operation, and Co-working of the first cause, so far as it concerneth man (which also is respectively applicable to other Subjects) there are considerable two acts in respect of God, viz. an immanent and transient act: and two acts in respect of the soul; viz. a first, and a second act. The immanent, and as it were indwelling Act in God, is his Decree: eternal, increated, and before time. The transient Act of God’s Efficiency, is a created, external, passing Act of the Spirit of God upon the soul in time touching man. The first act, is an active Principle, or inherent Habit in the soul. The operation is the second act, proceeding from that Habit.

The Concurse of the first cause, is unto the active principle in the second cause; as the first mover is unto the inferior Orbes: as an impulse, thrust, or put on, is unto a round body, of it self propense to rowl: as the Nurses lifting the child up the stairs, is unto the child inclined to go up; or as the leading power, put forth of him that goeth before, is to him that is inclined to follow after: as the Midwife is unto the deliverance of her that is in travail; as the wind is unto a vessel under sail, and ready upon the motion of the stream to launch forth: as light is to an open eye, yet in the dark.

The Necessity of the concurrence of the first cause with the second in the operations thereof, appears thus. All creatures depend upon God in respect of their Being, Conservation, and Operation: For in him we live, and move, and have our being, Acts 17.28. We have our being, there is our dependence in respect of our Creation; we live, there is our dependence in respect of our Conservation; we move, there is our dependence in respect of our Operation. Creatures depend no less upon God in respect of operations, then in respect of their beings; because the operations of things in both instants, viz. both of being and of operation, are equally beings of participation.

2. From the perfection of the first Cause; such is the nature of the first Cause being God, and the nature of the second cause being a creature, as that thence necessarily followeth the amplitude of Perfection in the first Cause, and a universal and subordinate dependence in the second cause in respect of its efficiency. In this regard Plato called the second causes the instruments of the first Cause; which though in some respect it holdeth not, because instruments (properly so called) have no proper efficiency; yet so far it is a truth, as that every creature universally dependeth more upon God, then any creature upon its fellow-creature.

3. It implieth a contradiction, that the creature should be able to act without dependency upon the Creator. 1. Because the agent being a creature is depending, therefore its power to act is depending; the power of acting holds proportion with the agent. 2. Because the action proceeding from this agent, is a being by participation: it is impossible for the creature to have other then a depending being.

4. As the conserving influence of God is unto the conservation of the creature, so is the assisting influence of God unto the operation of the creature: If God doth but merely cease his conserving influence, the creature ceaseth to be; if God ceaseth his assisting influence, the creature ceaseth to act. The insensible cessation of the influence of the first Cause, without any further violence, or hurt done, puts a period to the being, or stoppeth the operation of the second cause, respectively.</p></blockquote>

<blockquote><p>God does all things in all things (Eph. 1:23). For this reason, all things are said to be from him, through him, and to him (Rom. 11:36), and the Saviour says that the Father is working, and he is working (John 5:17).

Nor is anything more evident to all than this, because he is the first cause of all things, without whom there could not be any action in the world: for if the first cause does not act, then how would a second cause act? I need not add that it is undoubtedly more perfect to act than not to act, and for this reason it cannot but be suitable for the most perfect one.</p></blockquote>

<blockquote><p>Vers. 13. Let no man say when he is tempted, I am tempted of God: for God cannot be tempted with evil, neither tempteth he any man.

Admon. 2. Touching a right judgement of inward temptations, lest any one violate the sanctity of God, even in their thoughts, as if God solicited any one to sin, which is a familiar thing with the Sons of Adam, to cast the blame upon God, as the Author. There are eight Arguments of the Admonition or Dehortation, all which prove that temptations to evil are not to be ascribed to God.

For God] Argum. 1. God cannot be solicited or moved to sin: Therefore neither can he solicit any other to sin, and consequently temptation to sin is not to be ascribed to God.

Vers. 14. But every man is tempted, when he is drawn away of his own last, and enticed.

Argum. 2. Every man’s proper lust is the true cause of temptation: Therefore it is not to be ascribed to God. He proves the Antecedent, by unfolding the method of temptation to sin in its five degrees. For, first, Man is drawn by his depraved lust from the true good, that he may not rest quiet in it: Furthermore, he is enticed by a false appearance of good, to follow that which is evil.

Vers. 15. Then when lust hath conceived, it bringeth forth sin: and sin when it is finished, bringeth forth death.

Thirdly, He conceives in his will and heart the purpose of sinning actually. Fourthly, He actually sins. And fifthly, Sin committed, by its desert bringeth forth as it were, and procureth death. And so original wickedness bringeth forth actual sin, and by degrees carries it on to further increase.

Vers. 16. Do not err, my beloved Brethren.

Argum. 3. Ye will mistake, and hold a false and blasphemous opinion, if ye ascribe the cause of your impulse to sin unto God.

Vers. 17. Every good gift, and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.

Argum. 4. God is the fountain and author of all good, (which is in us, or that which is given to us, either in the state of nature or grace) and of good only; Because from him descends all good, and every gift which any ways conduces to our perfection: Therefore we must not say that God is the cause of evil or sin in us.

Of lights] Argum. 5. God is the Father of lights, knowledge, and understanding, holiness, and happiness: Therefore he is not the Father of darkness or sin.

With] God is immutable in his nature, without all variableness, either to worse or better: From all eternity always, so like himself in all things, that there is no foundation of changeableness of himself from himself, nor the least shadow of motion or turning in him: Therefore it is impossible that God should be the author of sin.

Vers. 18. Of his own will begat he us with the Word of Truth, that we should be a kind of first-fruits of his creatures.

Argum. 7. God moved by his will alone, hath regenerated and converted us by the Word of the Gospel, from the state of sin, to the image of his holiness: Therefore; &amp;c.

That we should be] Argum. 8. The end of our regeneration is intended by God, that we be holy, and wholly consecrated, (as the first-fruits under the Law) to his glory: Therefore we ought not to admit any blasphemous thoughts concerning him, as if we were moved by him to evil or sin.</p></blockquote>

Argum. 4. God is the fountain and author of all good, (which is in us, or that which is given to us, either in the state of nature or grace) and of good only; Because from him descends all good, and every gift which any ways conduces to our perfection: Therefore we must not say that God is the cause of evil or sin in us.

With] God is immutable in his nature, without all variableness, either to worse or better: From all eternity always, so like himself in all things, that there is no foundation of changeableness of himself from himself, nor the least shadow of motion or turning in him: Therefore it is impossible that God should be the author of sin.

Vers. 18. Of his own will begat he us with the Word of Truth, that we should be a kind of first-fruits of his creatures.

Argum. 7. God moved by his will alone, hath regenerated and converted us by the Word of the Gospel, from the state of sin, to the image of his holiness: Therefore; &amp;c.

th+actual+sin%2C+and+by+degrees+carries+it+on+to+further+increase.%0A%0AVers.+16.+Do+not+err%2C+my+beloved+Brethren.%0A%0AArgum.+3.+Ye+will+mistake%2C+and+hold+a+false+and+blasphemous+opinion%2C+if+ye+ascribe+the+cause+of+your+impulse+to+sin+unto+God.%0A%0AVers.+17.+Every+good+gift%2C+and+every+perfect+gift+is+from+above%2C+and+cometh+down+from+the+Father+of+lights%2C+with+whom+is+no+variableness%2C+neither+shadow+of+turning.%0A%0AArgum.+4.+God+is+the+fountain+and+author+of+all+good%2C+%28which+is+in+us%2C+or+that+which+is+given+to+us%2C+either+in+the+state+of+nature+or+grace%29+and+of+good+only%3B+Because+from+him+descends+all+good%2C+and+every+gift+which+any+ways+conduces+to+our+perfection%3A+Therefore+we+must+not+say+that+God+is+the+cause+of+evil+or+sin+in+us.%0A%0AOf+lights%5D+Argum.+5.+God+is+the+Father+of+lights%2C+knowledge%2C+and+understanding%2C+holiness%2C+and+happiness%3A+Therefore+he+is+not+the+Father+of+darkness+or+sin.%0A%0AWith%5D+God+is+immutable+in+his+nature%2C+without+all+variableness%2C+either+to+worse+or+better%3A+From+all+eternity+always%2C+so+like+himself+in+all+things%2C+that+there+is+no+foundation+of+changeableness+of+himself+from+himself%2C+nor+the+least+shadow+of+motion+or+turning+in+him%3A+Therefore+it+is+impossible+that+God+should+be+the+author+of+sin.%0A%0AVers.+18.+Of+his+own+will+begat+he+us+with+the+Word+of+Truth%2C+that+we+should+be+a+kind+of+first-fruits+of+his+creatures.%0A%0AArgum.+7.+God+moved+by+his+will+alone%2C+hath+regenerated+and+converted+us+by+the+Word+of+the+Gospel%2C+from+the+state+of+sin%2C+to+the+image+of+his+holiness%3A+Therefore%3B+%26c.%0A%0AThat+we+should+be%5D+Argum.+8.+The+end+of+our+regeneration+is+intended+by+God%2C+that+we+be+holy%2C+and+wholly+consecrated%2C+%28as+the+first-fruits+under+the+Law%29+to+his+glory%3A+Therefore+we+ought+not+to+admit+any+blasphemous+thoughts+concerning+him%2C+as+if+we+were+moved+by+him+to+evil+or+sin.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s <blockquote><p>Now, my young friends, I will tell you, if you are ever tempted for a moment, to give heed to those who would persuade you to renounce your belief in the Bible as a divine revelation, what you must be able to prove, before you can consistently venture on infidel ground. You must be able to show that the miracles of which the Bible contains a record, either were never performed, or if they were, that they do not prove its divine authority. If you take the former side of the alternative, and say that these miracles were never performed, you must still admit either that they were pretended to be performed, or they were not.

If they were pretended to be performed, as recorded in scripture, it behoves you to show how it was that so many competent witnesses, and among them the most malignant enemies, in circumstances the most favourable for detecting imposture, and for several years in succession, should actually have been deceived. If you say that they were not pretended to be performed, then you have to account for the fact that such a record of them as that which the Bible contains, should have been made, at the very time when the imposture — if it were one — was most open to detection; and that it should have been circulated first among the very persons who would have been most interested and most able to detect it; who yet never even pretended to call the facts in question.

If you say that the record of these miracles was not made during the age in which they were professedly performed, but that it was palmed upon some succeeding age, then you have to account for the fact that the whole mass of historical testimony fixes the date of this record to nearly the period in which they are alleged to have been performed; and you have this additional difficulty to solve; — how a record of facts, purporting to have occurred under the observation of the very people to whom the record was first given, could have been received by them as a true record, when, at the same time, no such facts had ever fallen within their knowledge.

But if you choose the latter side of the alternative, and say that these miracles were actually wrought, but still do not prove the Bible to be a divine revelation; — you have then to show either that the God of truth would give the stamp of his authority to falsehood, or else that these mighty works were performed by the aid of evil spirits; for that they transcended the limits of human power, admits of no question. The former of these suppositions — that Jehovah has lent his sanction to falsehood — you will not dare to admit, even in thought. If you admit the latter, and refer the miracles of the Bible to diabolical agency, then you have this great moral phenomenon to explain — how the enemy of all good came to be so heartily and earnestly engaged in the destruction of his own kingdom; for the manifest tendency of all the miracles of the Bible was to promote the cause of righteousness.</p></blockquote>

<blockquote><p>Observation, Watchful Providence has undertaken to preserve and keep safe his beloved Israel.

This important truth is notably set forth in 2 Chron. 16. 9. The eyes of the Lord run to and fro through the whole earth, to shew himself strong in the behalf of them whose heart is perfect towards him; wherein we cannot but note, 1. Divine Providence is represented as having eyes, when almighty power is most conspicuous in the deliverances of Israel, then all is ascribed to the hand, to the arm of God; but when discovering of infernal practices, when defeating of accursed machinations are most visible, then Providence is said to have eyes; altho omniscience is always attended with omnipotence, and infinite power guided by infinite wisdom.

Now Providence, is said to have eyes, 1. Because there’s nothing so deep, so secret, but he sees it. 2. Nothing so confused and disordered, but he directs and guides it. Thus we read Ezek. 10.12. The wheels were full of eyes round about; strange intricate turnings, motions there are of Providence, which we judge irregular, but still they are all guided by an unerring wisdom, which conducts them all to his own gracious ends. The affairs of this lower world, and especially of his Church, and all her concerns are superintended by infinite wisdom, and nothing left to the blind Idol Fortune, or Chance, the Deities of Heathens, and Paganizing Christians. …

These eyes of Providence run to and fro: for Providence is most nimble and active, runs swiftly hither and thither, as the exigencies of his Church and People invite, and call for them. And this is the sole privilege of Omnipresence, that it runs to all places without being in, or removing from any place; wherever God sees, there he is, his presence is equal to his Omniscience. 3. These eyes of Providence have the whole earth for their Province; not a Saint in the remotest parts of God’s earth, that is out of the reach of his care; nor a sinner in any place above the reach of his power.

Nothing is below his cognizance, nothing above his control. Prov. 15.3. The eyes of the Lord are in every place, beholding both the evil and the good. Persons and things, whether good or evil are all within the circle of Providence, even those which are neither Subjects nor Ministers of his Grace, shall be brought under the kingdom of his power. 4. That Providence has not only an eye to see, but a hand, an arm, to execute his purposes, whither in promises or threatenings: he is strong, and shews himself strong; makes it appear that when he will save; none shall be able to destroy; when he will destroy none shall be able to save.</p></blockquote>

aces+without+being+in%2C+or+removing+from+any+place%3B+wherever+God+sees%2C+there+he+is%2C+his+presence+is+equal+to+his+Omniscience.+3.+These+eyes+of+Providence+have+the+whole+earth+for+their+Province%3B+not+a+Saint+in+the+remotest+parts+of+God%E2%80%99s+earth%2C+that+is+out+of+the+reach+of+his+care%3B+nor+a+sinner+in+any+place+above+the+reach+of+his+power.%0A%0ANothing+is+below+his+cognizance%2C+nothing+above+his+control.+Prov.+15.3.+The+eyes+of+the+Lord+are+in+every+place%2C+beholding+both+the+evil+and+the+good.+Persons+and+things%2C+whether+good+or+evil+are+all+within+the+circle+of+Providence%2C+even+those+which+are+neither+Subjects+nor+Ministers+of+his+Grace%2C+shall+be+brought+under+the+kingdom+of+his+power.+4.+That+Providence+has+not+only+an+eye+to+see%2C+but+a+hand%2C+an+arm%2C+to+execute+his+purposes%2C+whither+in+promises+or+threatenings%3A+he+is+strong%2C+and+shews+himself+strong%3B+makes+it+appear+that+when+he+will+save%3B+none+shall+be+able+to+destroy%3B+when+he+will+destroy+none+shall+be+able+to+save.%E2%80%9D%0A%0A%E2%80%94+Vincent+Alsop%2C+God+in+the+mount%3A+A+sermon+upon+the+wonderful+deliverance+of+His+Majesty+from+assassination.+The+nation+from+invasion%2C+%28London%3A+J.+Barnes%2C+1696%29%2C+p.+3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F983207a00d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/983207a00d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/06/22/vincent-alsop-on-the-eyes-of-providence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Evodius: Please tell me whether God is not the author of evil.

Augustine: I shall tell you if you make it plain what kind of evil you are asking about. We usually speak of “evil” in two ways, namely when someone has (a) done evil; (b) suffered something evil.

Evodius: I want to know about both kinds.

Augustine: Well, if you know or believe that God is good (it is blasphemous to think otherwise), then He does not do evil. On the other hand, if we grant that God is just (denying it is irreligious), then He rewards the good; by the same token, He hands out punishments to evildoers, punishments that are doubtless evils to those who suffer them. Accordingly, if no one pays penalties unjustly – which we must believe since we believe that the world is governed by divine providence – then God is indeed the author of evils of type (b), though not in any way the author of evils of type (a).

Evodius: Then is there some other author of the evil we have found not to come from God?

Augustine: Of course! Evil could not occur without an author. But if you ask who the author is, no answer can be given, for there is not just a single author – rather, evil people are the authors of their evildoing. If you doubt this, pay attention to my earlier statement that evildoings are redressed by God’s justice. It would not be just to redress them unless they come about through the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Free Choice of the Will</cite>, (c. 387-95), ed. and trans. Peter King (Cambridge: Cambridge University Press, 2010), 1.1.1.1-3.</span></figcaption>

<blockquote><p>And if it is true that there are no miracles at all, and that nothing ever occurs or has occurred in the world apart from natural causes, then by this logic there is no more proof of the Christian religion in the miracles of Christ and the apostles than in the rising and the setting of the sun.

Indeed, these miracles were nothing but snares set for the gullible. This is to adore Mother Nature and to consign the Father God to oblivion. Indeed at bottom, if this is not a wicked attempt to confuse nature with God, it nonetheless thoughtlessly aids such attempts.</p></blockquote>

<blockquote><p>God’s knowledge doth infinitely differ from ours. We cannot see in the dark, nor can we see many things at once; but it is not so with him, … There is nothing so deep, but God will bring it above-board. Who will bring to light the hidden things of darkness. And he sees many things at once, nay, all are as if they were but one. … All things being represented to him in the pure Crystal, of his own Essence, are but as one individual thing.

Again [unto his eyes.] Eyes are ascribed to God not properly, but Metaphorically; Idols have eyes, yet they see not; God hath no eyes, yet he sees; the eye of God is put in Scripture for his Knowledge; all things are naked to his eye, that is, they are obvious to his Knowledge.</p></blockquote>

</figure><figure class="quote" id="q-8d53900611" data-kw="">
<blockquote><p>It is also a great comfort to have the faith of this Providence constantly impressed upon the mind, so as to have recourse to it in the midst of all confusions, whether public or private, and all calamities from without or from within; to be able to say, the great King, who is also my father, is the supreme ruler of all things, and with him all my interests are secure; to stand firm, with Moses, when no relief appears, and to look for the salvation of God from on high, and, finally, in every distress, when all hope of human assistance is swallowed up in despair, to have the remarkable saying of the Father of the faithful stamped upon the mind, and to silence all fears with these comfortable words, “God will provide.”

In a word, there is nothing that can so effectually conform the heart of man, and his inmost thoughts, and consequently the whole tenor of his life, to the most perfect rule of religion and piety, than a firm belief, and frequent meditation on this divine Providence, that superintends and governs the world. He, who is firmly persuaded, that an exalted God of infinite wisdom and purity is constantly present with him, and sees all that he thinks or acts, will, to be sure, have no occasion to over-awe his mind with the imaginary presence of a Lælius or a Cato.</p></blockquote>

</figure><figure class="quote" id="q-76f6f843ae" data-kw="">
<blockquote><p>Now we must not at all imagine that God knows things in the same manner as men, who understands the same thing sometimes imperfectly, at other times clearly, and who, from things known, proceed to things unknown. The divine knowledge is of such a nature, as not to admit of indistinctness of apprehension, or labour of investigation and recollection, or difficulty of application. God comprehends all things by one single and individual act of mind, surveys them, as it were, with a single glance, and sees them distinctly, certainly, and therefore perfectly.

Nevertheless the weakness of our conceptions obliges us to attribute to God a knowledge of two kinds; the one, by which he knows things that are possible, called by the schoolmen the knowledge of two kinds; the one, by which he knows things that are possible, called by the schoolmen the knowledge of natural and simple apprehensions, the other, by which he knows things that will take place, called by them the knowledge of liberty and vision. The first kind of knowledge is founded on the power of God, the second has for its foundation the decree of God, who knows future things, because he has decreed that they shall take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 2.4, p. 80.</span></figcaption>

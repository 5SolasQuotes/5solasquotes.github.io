<blockquote><p>Since, therefore, it is clear from what has been said that our will is effectively moved and determined by God as the first cause, the first mover, and therefore is preceded and predetermined by Him, it remains to be explained how this effective motion and determination, or rather divine pre-motion and predetermination, is consistent with the freedom of our will. For it does not seem that what is effectively moved and determined in one direction by a prior cause can be free to do otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXII. And these points are consistent with what is read in Estius in the above-cited passage, where he expounds the same doctrine and brings many confirmations to it. He concludes thus and objects to the freedom of human will:</cite></span></figcaption>

</figure><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>

a class="perma" href="../quote/ee4a4b51ea.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=Regarding%20the%20nature%20of%20free%20will%3B,its%20choice%20from%20no%20prior%20cause." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This prior motion or immediate influence on the cause is not necessary for the will to be able to act if it wishes; for it has that by its own power or through supernatural habits; but it is necessary only for it to act actually. Hence, from the fact that the will is not moved by God with that prior motion, it does not follow that it cannot will or act; but it only follows that it will not actually act.</p></blockquote>

<blockquote><p>XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.</p></blockquote>

<blockquote><p>…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.</p></blockquote>

<blockquote><p>The disagreement is whether that subordination and dependence of secondary causes upon the first involves determination of the secondary cause by the first; and if it does, through what it is exercised. Father Suárez… and with him the Jesuit Fathers commonly, deny that the first cause determines the secondary cause in its free acts… They add that the first cause does nothing antecedently — neither in the secondary cause nor in its action in second act — but coacts simultaneously with the same concurrence, in such a way that from both causes simultaneously and concomitantly concurring, the action comes about; and therefore God cannot predefine or foresee what the created will is going to do before its foreseen determination. Hence they have recourse to conditional knowledge, by which God knows what the free secondary cause will do if placed in such or such circumstances; and according to what He sees it will do if thus placed, it determines what God wills to be for that time from that cause.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The disagreement is whether that subordination and dependence of secondary causes upon the first involves determination of the secondary cause by the first; and if it does, through what it is exercised. Father Suárez… and with him the Jesuit Fathers commonly, deny that the first cause determines the secondary cause in its free acts… They add that the first cause does nothing antecedently — neither in the secondary cause nor in its action in second act — but coacts simultaneously with the same concurrence, in such a way that from both causes simultaneously and concomitantly concurring, the action comes about; and therefore God cannot predefine or foresee what the created will is going to do before its foreseen determination. Hence they have recourse to conditional knowledge, by which God knows what the free secondary cause will do if placed in such or such circumstances; and according to what He sees it will do if thus placed, it determines what God wills to be for that time from that cause.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinism &amp; Suarez, pp. 373-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+disagreement+is+whether+that+subordination+and+dependence+of+secondary+causes+upon+the+first+involves+determination+of+the+secondary+cause+by+the+first%3B+and+if+it+does%2C+through+what+it+is+exercised.+Father+Su%C3%A1rez%E2%80%A6+and+with+him+the+Jesuit+Fathers+commonly%2C+deny+that+the+first+cause+determines+the+secondary+cause+in+its+free+acts%E2%80%A6+They+add+that+the+first+cause+does+nothing+antecedently+%E2%80%94+neither+in+the+secondary+cause+nor+in+its+action+in+second+act+%E2%80%94+but+coacts+simultaneously+with+the+same+concurrence%2C+in+such+a+way+that+from+both+causes+simultaneously+and+concomitantly+concurring%2C+the+action+comes+about%3B+and+therefore+God+cannot+predefine+or+foresee+what+the+created+will+is+going+to+do+before+its+foreseen+determination.+Hence+they+have+recourse+to+conditional+knowledge%2C+by+which+God+knows+what+the+free+secondary+cause+will+do+if+placed+in+such+or+such+circumstances%3B+and+according+to+what+He+sees+it+will+do+if+thus+placed%2C+it+determines+what+God+wills+to+be+for+that+time+from+that+cause.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Contra+Molinism+%26+Suarez%2C+pp.+373-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c0c5ffb8d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c0c5ffb8d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=The%20disagreement%20is%20whether%20that%20subordination,for%20that%20time%20from%20that%20cause." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cbaf7db3bb" data-kw="">
<blockquote><p>In the contrary extreme are the Thomists, who, in their zeal to preserve the subordination and dependence of the secondary cause upon the first, posit a certain prior motion determining the secondary cause on God’s part — which is a complement of power in first act bringing with it second act antecedently. They teach this to be a physical quality, or something after the manner of a quality, which is the ground of applying and determining the secondary cause to a certain action, which in free causes could not otherwise be determined, since they are by their nature indifferent. And thus the efficacy of the divine decree is made consistent, the dependence of creatures upon it, and the infallible certainty of divine knowledge concerning future free acts… so Alvarez is the illustrious author of this position… and before him Medina… and Báñez… Conrad…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Position of Later Thomists</cite>, p. 375</span></figcaption>

</figure><figure class="quote" id="q-aac5bc0451" data-kw="">
<blockquote><p>For they [Suarezians] place it [the will] in every state always in a certain citadel of integral power, constituted in an equilibrium with full capacity for either side, deflected by no inclination — altogether its own master and arbiter, as it were giving laws to causes and circumstances as they present themselves, commanding them to comply with its nod and to await its direction. Yet the matter is very different. For our will in this state of fallen nature, in which it exists, has greatly weakened and declined from that first state of integrity and innocence, as the Second Council of Orange and the Council of Trent teach us. Moreover, it depends greatly upon the knowledge and presentation of objects and follows the intellect leading it, accommodating itself to it rather than the intellect to it. In addition, it is disturbed by concupiscence — both irascible and concupiscible — by which it is often displaced from its position and dislodged from its right station. It is marvelously and variously affected by movements and perturbations of the soul; sometimes it is pressed and driven by appetite, and sometimes enticed and drawn by pleasure it serves lust. On another side, it is shaken from the movement of appetite and terror, and in its own station it wavers and scarcely maintains its integral liberty. And again — how often is it seized by ignorance and blindness of the mind, and deviates from the straight path of reason? How often, burning with the heat of lust and without a bridle, does it run headlong and is immersed in the mire of pleasures, from which not without sorrow and groaning does it drag itself out defiled? Not rarely do inveterate habits so incline it that it resists them with difficulty. Even the domestic familiarity of custom makes it live with custom as if at home, and causes it to neglect new things, however excellent, as though foreign. Indeed, I have seen nothing more volatile than the will when it is free from affection, nothing more constant when occupied with affection. Nor is it so powerful and mistress of itself as is imagined; since in its first primary acts it is desired and wholly occupied, and suffers involuntarily the assaults of those acts and their concomitant effects. It is bent by counsels, warnings, prayers, threats, loves, terrors, simulations, flatteries, titillations, jests, laughter, applause — by these it is led and drawn, so that it seems to do nothing other than what those authors call the mistress — namely, to serve everyone. And yet even then, when it is affected in so many ways, shaken, changed, drawn, and bent, it preserves its liberty… The will, inclined toward lust, can enjoy a woman and be led by that pleasure and remain free. Will it not be able to remain free when inclined and premoved by God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Factors upon the Will</cite>, pp. 376-77</span></figcaption>

a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=For%20they%20%5BSuarezians%5D%20place%20it%20%5Bthe,when%20inclined%20and%20premoved%20by%20God%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-42ea69f38c" data-kw="">
<blockquote><p>From that position it follows that the human will can do more than the divine, and can draw and temper it according to its own nod and pleasure. This is clear because whatever it wills, God fulfills: if it wills, the concurrence is present; if it does not will, it is absent. And God waits to see what it wills and does not act before its nod, nor operates contrary to its will… It elicits the act when it pleases and determines the divine concurrence according to its own judgment. Therefore the will does what the human will wills, not what the divine will wills. From which it follows that the will is mistress of the divine concurrences, which are ready — as those authors say — indifferently for the pleasure of the will… What is this but to drive God around in circles, as it were, and lead him about? Yet this is in no way permitted to God with respect to the creature, through which God is not allowed to act freely and to operate according to his own judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinists</cite>, p. 378</span></figcaption>

<blockquote><p>…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;</p></blockquote>

<blockquote><p>Nevertheless, regarding the mode of concurring by determining, Scotus does not agree with the position of the Thomists positing a prior quality or positive influx in the secondary cause through which it is constituted in first act and proximately capable of operating. This is apparent from nearly all the cited places, where he excepts antecedent motion of the first cause from being done through an intermediate other created power — which exception establishes the rule of the impossibility of determining from a created cause.</p></blockquote>

</figure><figure class="quote" id="q-7097c0b5ee" data-kw="">
<blockquote><p>…it remains to consider what third, middle path he [Scotus] appears to have chosen. Namely, that God concurs with free secondary causes in such a way that He does not await their free consent before concurring… nor does He merely accompany them by offering concurrence if they wish to act… nor does He predetermine them to act by means of some prior quality or physical motion impressed antecedently upon the will… Rather, God determines them in such a way that through the very same act or concurrence which He provides with certainty and determination toward the free act — by virtue of the essential subordination and dependence which the secondary cause has with respect to the first — He determines them antecedently, yet contingently and freely. And this mode of determining is such that it is not contrary to created freedom; indeed, it is fitting and necessary, and through this determination the proper subordination and dependence of the creature upon the Creator is established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View</cite>, p. 396</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7097c0b5ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=%E2%80%A6it%20remains%20to%20consider%20what%20third%2C,creature%20upon%20the%20Creator%20is%20established." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d361f92310" data-kw="">
<blockquote><p>Having examined the mind of Scotus, whom I expound and follow, I establish this: the principle determining the free and contingent secondary cause toward its free and contingent act is the first cause, concurring with it antecedently by a certain priority of nature toward the action and effect, in such a way that the divine action is prior in nature — not only by dignity and perfection, but also by causality. This I affirm to be wholly the mind of Scotus, and fitted to remove all the difficulties we have mentioned above… And since he fully knows its nature and mode of operating, he adapts and accommodates to it the concurrence which, although antecedent and leading, will move and lead the will freely and contingently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View</cite>, pp. 407-8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

20freely%20and%20contingently." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bc0effdd91" data-kw="">
<blockquote><p>And so that immediate and per se motion of the first cause upon the secondary cause is, so to speak, the secondary cause’s own and natural motion, absorbed into its very being and operation — so that in the common and accepted view, both causes operate through one single and individual action, and nothing is done by one that is not done by the other. Therefore it is not to be thought that the contingent and free mode of acting of the secondary cause is overturned or destroyed by the pure concurrence of the first cause antecedent in nature to the concurrence and determination of the secondary cause — since this is intimately absorbed into the very nature of the secondary cause itself. I speak plainly. To be determined by God is as much as to be determined by itself, since that determination pertains to the natural mode of operating of the secondary cause. This is urged and explained: because that antecedence of nature, since it is not a real priority, nor one of time, nor of a temporal instant, posits and imprints nothing antecedently in the secondary cause before it operates. Rather, it is a priority altogether conjoined with the action of the secondary cause, such that they exist simultaneously and operate in the same instant of time. The priority of nature is only on the side of the first cause, by reason of the subordination and dependence of the secondary cause upon the first — which all call consequential subsistence — so that just as the secondary cause depends upon the first in being, so also it depends upon it in operating. Thus it is true to say: the secondary cause operates because God operates, and not the converse…</p></blockquote>

</figure><figure class="quote" id="q-466404936c" data-kw="">
<blockquote><p>It appears, therefore, what the mode is by which the first cause moves and determines the secondary cause, without necessity and with the freedom of the secondary cause entirely unimpaired — through that priority of nature of the concurrence as it is from God as first cause, subordinating to itself in the very operation the secondary cause, and retaining by priority of nature its dignity in causing.</p></blockquote>

</figure><figure class="quote" id="q-8d48e99a77" data-kw="">
<blockquote><p>For that determination of God toward concurring with the secondary cause does not arise from a necessity imposed immediately by the action of the secondary cause, but from the reason of providence, by which the universal first cause must concur with the particular secondary causes. And this is clear from the fact that he concurs in this way with all causes, even the necessary ones, for the common reason of providence. But in the mode of concurring, he exhibits necessary concurrence to natural and necessary causes, and contingent concurrence to contingent and free ones.</p></blockquote>

</figure><figure class="quote" id="q-529d2d116c" data-kw="">
<blockquote><p>From this it is clear that the reason for knowing a future sin of commission is the concurrence to be exhibited, and for a sin of omission the concurrence not exhibited — or the negation of concurrence. Yet it does not appear how God concurs toward that act of commission: whether antecedently or concomitantly. For Scotus says only that God knows that he will not cooperate — by which word a simultaneous concurrence is suggested, not a preceding one with any priority. And therefore the sinning will would not be predetermined in any antecedent manner by God.</p></blockquote>

</figure><figure class="quote" id="q-112da71237" data-kw="">
<blockquote><p>Indeed, from the different mode in which Scotus speaks here of God’s concurrence toward the act of sin, it entirely follows that this is an exception to that general rule [according to Macedo] — namely, that God both predefines from eternity and predetermines in time antecedently all good acts of the will; and only with respect to evil and sinful acts does he behave differently — that is, not by determining antecedently, but by awaiting the action of the deficient and sinning will. If we establish this by proving it, we establish the doctrine of Scotus on the subordination of causes, and we marvelously reconcile it with the doctrine of the Council of Trent — as we will demonstrate afterward — which teaches against Calvin and the other innovators that God concurs in a different mode with the good and meritorious act than with the evil and demeritorious one. [Yet the Reformed affirm this, ignoring the part about meriting.]</p></blockquote>

</figure><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed</cite>, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

e-secondary-causation-occasionalism/#:~:text=First%3A%20how%20God%20is%20not%20a,we%20have%20often%20taught%20with%20Scotus." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b23442f769" data-kw="">
<blockquote><p>…in the opinion of Scotus… For since God, as we have said, concurs toward the substrate of the evil act without causing its defect or intending it, He concurs only with the material of the act, with formal malice entirely removed. This is clear. God does not concur with that act in time except insofar as He decreed and foresaw from eternity that he would concur. But He decreed and foresaw from an antecedent permission, which is not a positive intention concerning that sinful act. Therefore, also when He concurs in time, He does not exhibit concurrence toward the sinful act; but only, given that there is a positive entity in it, did He decree from eternity to concur and does He actually concur in time with it. And this pertains to the first cause in the physical genus, not the moral. Hence, since malice is something moral and wholly proper to the secondary cause, it falls back upon that cause as upon its moral cause — which God cannot be with respect to that evil act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Detailed Answer</cite>, pp. 423-24</span></figcaption>

69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b23442f769.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=%E2%80%A6in%20the%20opinion%20of%20Scotus%E2%80%A6%20For,with%20respect%20to%20that%20evil%20act." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-963508f7c6" data-kw="">
<blockquote><p>…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…</p></blockquote>

<blockquote><p>[Thomas:] “Certain things are moved by God in such a way that they also move themselves — such as those that have free choice. And if they are in the proper disposition and due order for receiving the motion by which they are moved by God, good actions follow, which are totally reduced to God as their cause.</p></blockquote>

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Thomas’s Position">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BThomas%3A%5D+%E2%80%9CCertain+things+are+moved+by+God+in+such+a+way+that+they+also+move+themselves+%E2%80%94+such+as+those+that+have+free+choice.+And+if+they+are+in+the+proper+disposition+and+due+order+for+receiving+the+motion+by+which+they+are+moved+by+God%2C+good+actions+follow%2C+which+are+totally+reduced+to+God+as+their+cause.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Thomas%E2%80%99s+Position&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b286a6638.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b286a6638.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=%5BThomas%3A%5D%20%E2%80%9CCertain%20things%20are%20moved%20by,reduced%20to%20God%20as%20their%20cause." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

ty." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-397e0b69b0" data-kw="">
<blockquote><p>XXXIII. As for the Reformed theologians known as Remonstrants or Arminians in Belgium, they recognize no other divine concurrence with secondary causes than that general and indifferent one [such as described under Molinism above], which is determined by the concurrence of the secondary cause. This can be seen in Jacob Arminius, from whom all others derive their name. In his dispute against Perkins, he not only affirms that this divine concurrence is indifferent in itself but also that it contributes nothing to the will of the creature by which it might be inclined, helped, or strengthened to act. He asserts that the created will has God’s concurrence in its power, ready and available, before it acts (in Anti-Perkins, p. 733). Similar teachings are found in Grevinchovius against Amesius (sect. 32, p. 368) and Corvinus against Tilenus (ch. 9, p. 354).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, p. 344 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/concurrence.html">Concurrence</a></span></div>

20for%20the%20Reformed%20theologians,against%20Tilenus%20%28ch.%209%2C%20p.%20354%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-842e0d5fe6" data-kw="">
<blockquote><p>However the will depends on God, and whatever God works in it, it always retains the liberty which we said consists in immunity from the threefold necessity of coercion, determination by matter, and determination by sense.</p></blockquote>

<blockquote><p>In yet another example of philosophical debate, Reformed concerns over the doctrine of providence and divine foreknowledge of future contingents associated with the rejection of Molinism, brought Reformed orthodox writers into dialogue with Dominican opponents of Molinism and led to the adoption or adaptation on the part of many of the Reformed of the concept of divine concurrence understood as “physical premotion” (praemotio physica). William Twisse advocated the concept, Francis Turretin adapted it selectively, and Richard Baxter polemicized against it as a form of determinism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011)</cite>, p. 23</span></figcaption>

</figure><figure class="quote" id="q-164bb5a624" data-kw="">
<blockquote><p>Since every being, insofar as it is being, is good, it is plain that evil cannot be anything real or positive, nor can it exist in itself. For it is the lack of good in something good. Insofar as it is opposed to the good for oneself it is lack of due perfection, as blindness in a man or animal. Insofar as it is opposed to the good for another it is the lack of relative appetibility, namely with respect to a certain appetite, as unripe fruit, poisonous plants. Evil cannot have a material or formal cause, namely constitutive principles. If material cause is taken in the sense of the subject-in-which, good is this cause. Evil cannot exist in itself but in some good. But can it have a final cause? Physical evil can be intended as a means to some end and licitly so, provided the end is good or indifferent or proportionate to the evil. Moral evil can be intended only illicitly and only by a finite will. But no evil can be desired for its own sake or as an end save under the appearance of good. For evil as such has no appetibility in itself or because of itself. But every evil can be permitted, that is, not impeded either by God or by man, given what needs to be given. Evil does have an efficient cause but only indirectly, namely in the producing of some good when the production is, for some reason, imperfect or defective whether on the part of the efficient cause or on the part of the matter, or even when a good is badly done, for example blindness from [the accidental] destruction of an eye [while pursuing another good]. Some Corollaries about Evil Conclusion 30: Evil involves good, or evil exists in a good, for from what was said evil is privation of good in something good. Conclusion 31: Evil corrupts the good that it harms. Insofar as evil is a privation of goodness in a good, it corrupts the good. And when evil is measured according to the good of which it is the lack, the greater the good that is missed the greater the corresponding evil. Hence the phrase: ‘corruptio optimi pessima’ or ‘the best is worst when corrupted’.</p></blockquote>

<blockquote><p>As the term ‘good’ signifies perfect being, so the term ‘evil’ signifies nothing else than privation of perfect being. In its proper acceptation, privation is predicated of that which is fitted by its nature to be possessed, and to be possessed at a certain time and in a certain manner. Evidently, therefore, a thing is called evil if it lacks a perfection it ought to have.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendium of Theology, ch. 114, ‘The Meaning of Good &amp; Evil in Things’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-e5551628ee" data-kw="">
<blockquote><p>11. In this universe, even what is called evil, when it is rightly ordered and kept in its place, commends the good more eminently, since good things yield greater pleasure and praise when compared to the bad things. For the Omnipotent God, whom even the heathen acknowledge as the Supreme Power over all, would not allow any evil in his works, unless in his omnipotence and goodness, as the Supreme Good, he is able to bring forth good out of evil. What, after all, is anything we call evil except the privation of good? In animal bodies, for instance, sickness and wounds are nothing but the privation of health. When a cure is effected, the evils which were present (i.e., the sickness and the wounds) do not retreat and go elsewhere. Rather, they simply do not exist any more. For such evil is not a substance; the wound or the disease is a defect of the bodily substance which, as a substance, is good. Evil, then, is an accident, i.e., a privation of that good which is called health. Thus, whatever defects there are in a soul are privations of a natural good. When a cure takes place, they are not transferred elsewhere but, since they are no longer present in the state of health, they no longer exist at all.¹ ¹ This section (Chs. III and IV) is the most explicit statement of a major motif which pervades the whole of Augustinian metaphysics. We see it in his earliest writings, Soliloquies, 1, 2, and De ordine, II, 7… The good is positive, constructive, essential; evil is privative, destructive, parasitic on the good. It has its origin, not in nature, but in the will. Cf. Confessions, Bk. VII, Chs. III, V, XII-XVI; On Continence, 14-16; On the Gospel of John, Tractate XCVIII, 7; City of God, XI, 17; XII, 7-9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Enchiridion, or Handbook on Faith, Hope &amp; Love, section 11 trans. Outler (1955)</cite></span></figcaption>

<blockquote><p>IX. Wherefore this [original] sin is not something positive, that is, a certain subsisting thing created by God, nor is it simply nothing, nor a simple and pure privation, as death is the privation of life, or darkness is the privation of light; but it is that which is at the same time a defect and a destruction of a positive thing, namely of the work and divine order by which all our powers and inclinations ought to have been ruled, and therefore a vicious habit exciting and begetting internal and external motions, which, straying from the law of God, are displeasing to God.</p></blockquote>

<blockquote><p>The Reformed certainly acknowledge that there is some substrate present under sin, namely a faculty or action in which inheres wickedness, although it is not a substance subsisting through itself; likewise they acknowledge that sin is not something negative; but they deny that it is something real, something substantial or positive; they affirm rather that it is something privative, which consists only in lawlessness, or the absence of moral uprightness in a capable subject. They do so because: (1) John in his first epistle (3:4) defines sin as precisely as possible, by only ἀνομία, lawlessness: ἡ ἁμαρτία ἐστὶν ἡ ἀνομία, “sin is lawlessness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology, vol. 3, bk. 4, ch. 2 | section 21</cite>, p. 457</span></figcaption>

<blockquote><p>§38. The Form [of original sin] is the privation of original wisdom and justice (Ps. 143; Rom. 310, ff.), “There is none that understandeth, there is none that seeketh after God. They are all gone out of the way, they are together become unprofitable; there is none that doeth good, no, not one.” Verse 23, “For all have sinned, and come short of the glory of God;” add 1 Cor. 2:14; Eph. 4:18, with an adjoined proclivity to sensible and sensual things. Hence it is called the evil that dwells, inhabits and operates in us (Rom. 7:17, 20-21), and also the Flesh (Jn. 3, 6), the Old man (Eph. 4:22), the law of the members and the body of death (Rom. 7:18, 23-24). But those who here make mention of the positive, distinguish between the positive taken metaphysically or physically, and the positive taken ethically and logically. In the former sense, whatever is positive is being, and has the adjuncts and predicates of being. In the latter sense, the positive signifies the privation of a due habit inhering, but which infers an adjoined inclination to contrary habits, as a disease is not only the privation of health, the temper of the humors being removed and disturbed, but also brings in a vicious quality arisen from the badly disposed humors; and in the venereal plague and leprosy there is not only a privation of pure blood, but also its foul corruption. §39. Therefore, the Original Stain is not a substance, which [the Lutheran] Flacius asserted in the Disputation of Weimar with Victorinus Strigelius in A.D. 1561, which error he then repeated in his Writings. For: (1) Scripture distinguishes this stain from man himself, calling it in Rom. 7:17 “the evil that dwelleth in and adhereth” to us. But that which inhabits differs from its hospice, and that which adheres from that to which it adheres, for example, a garment from a man. (2) Every created substance is from God, and in that sense, good (Gen. 1:31; 1 Tim. 4:4). (3) because God creates man even after the fall, Job 10:8, “Thine hands have made me and fashioned me together round about;” also Ps. 139:14, which cannot be said of sin. (4) Because this error overturns the article of Faith concerning the Creation, concerning the Assumption of human Nature [by Christ], concerning Regeneration, Renovation, and Resurrection. §40. The effects are either moral or physical evils…</p></blockquote>

</figure><figure class="quote" id="q-9d7b8126b5" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments [cf. 2 Sam. 24:10–17], the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called “burdens,” Acts 15 [v. 28]. And Moses may make an ordinance about the use of a bill of divorcement which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>

</figure><figure class="quote" id="q-51fb0d48d6" data-kw="">
<blockquote><p>But every man is tempted, when he is drawn away of his own lust, and enticed. Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death.’ John in 1 Jn. 2:12, 16, “The lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father, but is of the world.” Add. Gal. 5:17. 2. Actual sins, which flow from this impure font: Mt. 15:19, “For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies: These are the things which defile a man.” Jam. 1:15. To these [latter, phsycial evils,] pertain: 3. Punishments of every kind: calamities, diseases, and finally temporal and eternal death (Rom. 5:12, 14; 7:10-14; Eph. 2:3). Thomas in Summa, pt. 1 of 2, q. 85, art. 3, recounts four wounds of nature: ignorance, malice, concupiscence and infirmity, of which he constitutes the first in the intellect, the second in the will, the third in the concupiscible appetite, and the fourth in the irascible, which Bellarmine expounds diffusely and pathetically in On the Loss of Grace &amp; the State of Sin., bk. 6, ch. 9-12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 14-15 Latin | “§40. The effects [of original sin] are either moral or physical evils. To the former is to be referred: | 1. Concupiscence, not that natural and innate faculty by which, for our ordinate conservation, we desire necessary things like food, drink, sleep, etc.—for this was instilled in man by God—but the pravitious concupiscence derived into posterity through the fall, otherwise called the concupiscence of the flesh (Eph. 2:3; 1 Jn. 2:16; Gen. 8:21), which by its inordinate movements irritates man to evils, and is the cause, fuel, and fodder of sin and of all vices and outrages, concerning which Paul says in Rom. 7:7, “I had not known lust, except the law had said, ‘Thou shalt not covet.&#x27;” James 1:14:</cite></span></figcaption>

<blockquote><p>26. ‘Evil’ is an ambiguous term. It may stand for miserable evils or moral evils. One may morally choose to undergo and suffer certain miserable evils in necessity, other alternatives not being available, likely or reasonable. Electing to eat expired food rather than starve is not wrong. One ought never to do moral evil, though it be lesser in respect to another (1 Cor. 15:34; WLC 99.5).</p></blockquote>

</figure><figure class="quote" id="q-47c06a0653" data-kw="">
<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 139</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXX. Indeed, when we say that faith alone justifies, we do not even mean by that merely the act of believing taken precisely, as it is opposed to acts of love and hope, and is distinguished from repentance, or penitence, as being the condition demanded by the new covenant, or Gospel, for us to obtain the remission of our sins and to be absolved from them because of Christ. For just as the hope of pardon and the love of God, as well as sorrow for sin and the purpose of leading a new life, and, in a word, all the acts necessary for true and sincere conversion, are also required, so they are necessary and altogether prerequisite so that anyone may be received into favor by God and may be regarded by Him as justified. Indeed, that living and operative faith which we affirm justifies alone includes and involves all these acts. XXXI. And just as Scripture frequently asserts that we obtain the remission of sins through faith, so, no less frequently and expressly, does it teach that repentance and the entire conversion of the sinner to God are conditions without which the remission of sins cannot be obtained from God, and which, no less than faith, are required beforehand for it, although it neither effects nor merits it. To this belongs Solomon’s saying, already cited before, “He who hides his sins will not prosper, but he who confesses and forsakes them will obtain mercy.” And what Christ says in Luke, “Unless you repent, you will all likewise perish.” Hence it is that Peter thus exhorts the Jews, “Repent and be baptized every one of you in the name of Jesus Christ for the remission of your sins,” Acts 2:38. And, “Repent, therefore, and turn again, that your sins may be blotted out,” Acts 3:19. … LII. From what has now been explained, it is clear that the doctors of both the Roman and Reformed Schools recognize by common consent: … 2. That only living faith justifies, while dead faith contributes nothing to justice and salvation. 3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice. 4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God. 5. That it is fitting and suitable to divine goodness and wisdom to remit sins and grant the grace of the Holy Spirit to a sinner who sincerely repents and flees to God’s mercy by faith, but not to the unbelieving and impenitent. 6. That the new justice which the Holy Spirit creates in the faithful consists not only of the habit of faith but also of other Christian virtues.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on How Faith Justifies, pp. 228-29, 234 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXX.+Indeed%2C+when+we+say+that+faith+alone+justifies%2C+we+do+not+even+mean+by+that+merely+the+act+of+believing+taken+precisely%2C+as+it+is+opposed+to+acts+of+love+and+hope%2C+and+is+distinguished+from+repentance%2C+or+penitence%2C+as+being+the+condition+demanded+by+the+new+covenant%2C+or+Gospel%2C+for+us+to+obtain+the+remission+of+our+sins+and+to+be+absolved+from+them+because+of+Christ.+For+just+as+the+hope+of+pardon+and+the+love+of+God%2C+as+well+as+sorrow+for+sin+and+the+purpose+of+leading+a+new+life%2C+and%2C+in+a+word%2C+all+the+acts+necessary+for+true+and+sincere+conversion%2C+are+also+required%2C+so+they+are+necessary+and+altogether+prerequisite+so+that+anyone+may+be+received+into+favor+by+God+and+may+be+regarded+by+Him+as+justified.+Indeed%2C+that+living+and+operative+faith+which+we+affirm+justifies+alone+includes+and+involves+all+these+acts.+XXXI.+And+just+as+Scripture+frequently+asserts+that+we+obtain+the+remission+of+sins+through+faith%2C+so%2C+no+less+frequently+and+expressly%2C+does+it+teach+that+repentance+and+the+entire+conversion+of+the+sinner+to+God+are+conditions+without+which+the+remission+of+sins+cannot+be+obtained+from+God%2C+and+which%2C+no+less+than+faith%2C+are+required+beforehand+for+it%2C+although+it+neither+effects+nor+merits+it.+To+this+belongs+Solomon%E2%80%99s+saying%2C+already+cited+before%2C+%E2%80%9CHe+who+hides+his+sins+will+not+prosper%2C+but+he+who+confesses+and+forsakes+them+will+obtain+mercy.%E2%80%9D+And+what+Christ+says+in+Luke%2C+%E2%80%9CUnless+you+repent%2C+you+will+all+likewise+perish.%E2%80%9D+Hence+it+is+that+Peter+thus+exhorts+the+Jews%2C+%E2%80%9CRepent+and+be+baptized+every+one+of+you+in+the+name+of+Jesus+Christ+for+the+remission+of+your+sins%2C%E2%80%9D+Acts+2%3A38.+And%2C+%E2%80%9CRepent%2C+therefore%2C+and+turn+again%2C+that+your+sins+may+be+blotted+out%2C%E2%80%9D+Acts+3%3A19.+%E2%80%A6+LII.+From+what+has+now+been+explained%2C+it+is+clear+that+the+doctors+of+both+the+Roman+and+Reformed+Schools+recognize+by+common+consent%3A+%E2%80%A6+2.+That+only+living+faith+justifies%2C+while+dead+faith+contributes+nothing+to+justice+and+salvation.+3.+That+not+only+the+act+of+believing+taken+precisely+but+many+other+acts+also%2C+which+concur+to+true+repentance+and+serious+conversion+to+God%2C+are+conditions+required+by+God+for+one+to+obtain+from+Him+the+remission+of+sins+and+the+infusion+of+new+and+habitual+justice.+4.+That+the+remission+of+sins+and+the+renewal+of+the+inner+man+are+purely+gratuitous+gifts+of+God%2C+which+are+not+due+out+of+justice+to+faith+or+any+works%2C+however+much+performed+by+the+grace+of+God.+5.+That+it+is+fitting+and+suitable+to+divine+goodness+and+wisdom+to+remit+sins+and+grant+the+grace+of+the+Holy+Spirit+to+a+sinner+who+sincerely+repents+and+flees+to+God%E2%80%99s+mercy+by+faith%2C+but+not+to+the+unbelieving+and+impenitent.+6.+That+the+new+justice+which+the+Holy+Spirit+creates+in+the+faithful+consists+not+only+of+the+habit+of+faith+but+also+of+other+Christian+virtues.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+How+Faith+Justifies%2C+pp.+228-29%2C+234+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F377645d263.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/377645d263.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=XXX.%20Indeed%2C%20when%20we%20say%20that,but%20also%20of%20other%20Christian%20virtues." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification, and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>

<blockquote><p>VI. (3) The question is not whether solitary faith (i.e. separated from the other virtues) justifies (which we grant could not easily be the case, since it is not even true and living faith); but whether it “alone” (sola) concurs to the act of justification (which we assert); as the eye alone sees, but not when torn out of the body. Thus the particle “alone” (sola) does not determine the subject, but the predicate (i.e., “faith only does not justify [sola fides non justificat], but “faith justifies alone” [fides justificat sola]). The coexistence of love in him who is justified is not denied; but its coefficiency or cooperation in justification is denied. (4) The question is not whether the faith “which justifies” (quae justificat) works by love (for otherwise it would not be living but dead); rather the question is rather faith “by which it justifies” (qua justificat) or in the act itself of justification, is to be considered under such a relation (schesei) (which we deny). … XIII. It is one thing for love and works to be required in the person who is justified (which we grant); another in the act itself or causality of justification (which we deny). If works are required as concomitants of faith, they are not on that account determined to be causes of justification with faith or to do the very thing which faith does in the matter. XIV. Although the whole force of justifying on the part of man is in faith as to the act of apprehension (so that other virtues contribute nothing to it with faith), it does not follow that faith can justify when they are absent as well as when they are present–yea, even wehn the opposite vices are present. It is one thing to justify without virtues (i.e., separated from them–which we deny); another for it to justify alone, but not separated from them. As it does not follow, the hand alone writes and the eye alone sees–therefore [it does this] as much when torn from the head and the other members as [it does when it is] in the body; the sole force of respiration is in the lungs–therefore the lungs can respire torn out from the liver and other viscera as well as when connected to them (which everyone sees to be absurd). Natural potencies are connected as to existence, but disjoined as to operation. Light and heat in the sun are most closely connected together, but still the light alone illuminates, the heat alone warms. Therefore, although the other virtues do not justify with faith, still faith cannot justify in their absences, much less the opposite vices being present. For faith cannot be true except in connection with the virtues (which if they do not contribute to justification, still contribute to the existence and life of faith, which the presence of vices would destroy). … XX. Although remission of sins is promised to repentance (because it ought to accompany faith and be in him who is justified as a certain condition requisite from him because God cannot pardon sin to an impenitent), it does not follow that it can be said to justify with faith because it contributes nothing (neither meritoriously, nor instrumentally) to the act of justification.</p></blockquote>

+with+faith%29%2C+it+does+not+follow+that+faith+can+justify+when+they+are+absent+as+well+as+when+they+are+present%E2%80%93yea%2C+even+wehn+the+opposite+vices+are+present.+It+is+one+thing+to+justify+without+virtues+%28i.e.%2C+separated+from+them%E2%80%93which+we+deny%29%3B+another+for+it+to+justify+alone%2C+but+not+separated+from+them.+As+it+does+not+follow%2C+the+hand+alone+writes+and+the+eye+alone+sees%E2%80%93therefore+%5Bit+does+this%5D+as+much+when+torn+from+the+head+and+the+other+members+as+%5Bit+does+when+it+is%5D+in+the+body%3B+the+sole+force+of+respiration+is+in+the+lungs%E2%80%93therefore+the+lungs+can+respire+torn+out+from+the+liver+and+other+viscera+as+well+as+when+connected+to+them+%28which+everyone+sees+to+be+absurd%29.+Natural+potencies+are+connected+as+to+existence%2C+but+disjoined+as+to+operation.+Light+and+heat+in+the+sun+are+most+closely+connected+together%2C+but+still+the+light+alone+illuminates%2C+the+heat+alone+warms.+Therefore%2C+although+the+other+virtues+do+not+justify+with+faith%2C+still+faith+cannot+justify+in+their+absences%2C+much+less+the+opposite+vices+being+present.+For+faith+cannot+be+true+except+in+connection+with+the+virtues+%28which+if+they+do+not+contribute+to+justification%2C+still+contribute+to+the+existence+and+life+of+faith%2C+which+the+presence+of+vices+would+destroy%29.+%E2%80%A6+XX.+Although+remission+of+sins+is+promised+to+repentance+%28because+it+ought+to+accompany+faith+and+be+in+him+who+is+justified+as+a+certain+condition+requisite+from+him+because+God+cannot+pardon+sin+to+an+impenitent%29%2C+it+does+not+follow+that+it+can+be+said+to+justify+with+faith+because+it+contributes+nothing+%28neither+meritoriously%2C+nor+instrumentally%29+to+the+act+of+justification.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+tr.+George+M.+Giger%2C+ed.+James+Dennison+Jr.+%281679%E2%80%931685%3B+P%26R%2C+1994%29%2C+vol.+2%2C+16th+Topic%2C+8.+%E2%80%98Does+faith+alone+justify%3F+We+affirm+against+the+Romanists.%E2%80%99%2C+pp.+677%2C+680-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3127da08d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3127da08d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=VI.%20%283%29%20The%20question%20is%20not,instrumentally%29%20to%20the%20act%20of%20justification." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>They did not hold that faith was the only thing which invariably accompanies justification, or even that it was the only thing required of men in order to their being justified; for they admitted that repentance was necessary to forgiveness, in accordance with the doctrine of our [Westminster] standards, that, ‘to escape the wrath and curse of God due to us for sin, God requireth of us repentance unto life,’ [WSC #85] as well as ‘faith in Jesus Christ.’</p></blockquote>

</figure><figure class="quote" id="q-941ab42d00" data-kw="">
<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp.</cite>, pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

<blockquote><p>Righteousness, in the fallen state, is twofold according to the demands of the law. Hence, Christ’s vicarious righteousness also needs to be twofold. He merits for us both deliverance from punishment and right to eternal life. None can be to Him alone for He is not liable to the first and [He is] entitled to the second due to the hypostatical union. Covenantally, however, he assumes the role of representative viator [wayfarer] in order to obtain the covenant promises for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/de-campos-junior-heber-carlos.html">de Campos, Junior, Heber Carlos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Piscator (1546-1625) and the Consequent Development of the Doctrine of the Imputation of Christ’s Active Obedience PhD diss. (Calvin Theological Seminary, 2009)</cite>, p. 294</span></figcaption>

<blockquote><p>Christ attained to this exaltation by his obedience, not as it were by merit, but as it were by the means or way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, ch. 19.6 of The Abridgment of Christian Divinity, 3rd ed. (London, 1660), pp. 158-159 Wolleb’s editor, Alexander Ross, in a footnote, offers the both/and view.</cite></span></figcaption>

</figure><figure class="quote" id="q-db6e52eb0d" data-kw="">
<blockquote><p>The question also arises, whether it was strictly speaking through his passion and death that Christ merited this glory for his human nature. And whereas we really do not wish to enter into a dispute with those who make this claim,† since Christ certainly did obtain it for us by the worthiness of what He merited, yet we are of the opinion that the opposite point of view, which is shared by many Reformed writers, rests upon arguments that are stronger. The chief one of these is that the glory was owed to Christ by the right of his hypostatic union, and as the Son’s, and as the Son’s rightful inheritance (Ps. 2:7-8; Heb. 1:2). And so, by the consensus of all theologians, that hypostatic union does not follow upon any merit, nor the things which necessarily and by God’s decree followed it–which is why the apostle Paul also uses the word [karisasthai] ‘to bestow as gift’ in this context (Phil. 2:9 [‘and given Him’]).</p></blockquote>

<blockquote><p>XV. The Fruits of the Obedience, Passion, Death and Resurrection of Christ And we believe that Christ by his perfect obedience deserved eternal life, not only for Himself but also for us: by his passion and death He satisfied for our sins in his flesh… and by his resurrection and ascension into heaven He obtained also for us both the resurrections, (as John speaketh, Rev. 20:5) the first and the latter: and that in our name He took unto Himself possession of the heavenly inheritance: and sitteth at the right hand of God (Eph. 1:20), that is, hath taken to Himself power over all things in heaven and in earth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 11, Section 15, pp. 70-71 of Confession of Christian Religion (Cambridge, 1599) This may be found in the Latin in his Works, vol. 8, cols. 502-503. Voet and others say that Zanchi makes reference to this same teaching in the Preface to this work (on p. 477 in the Latin), though we have been unable to locate that reference.</cite></span></figcaption>

</figure><figure class="quote" id="q-bac036e02d" data-kw="">
<blockquote><p>Christ complains, Isa. 49:4, “Then I said, I have laboured in vain, I have spent my strength for nought, and in vain”: there’s work. Shall He have nothing for his work? He adds, “Yet surely my judgement is with the Lord, and my work with my God.” v. 6. He receives an answer of a full reward for his work… And as One who laboured for us, so He craves his wages, though the Jews pay him unworthily. Zech. 11.12, “Then I said, if ye think good, give (Me) my price, and if not, forbear; pay Me, or pay Me not: Yet the Lord paid Him. Phil. 2:7, “He made Himself of no reputation, and took upon Him the form of a servant,–and became obedient to the death, the death of the cross.” Here is work: followeth his wages, call it merit, or what else, it’s a reward and the end of his suffering, which Christ both desired and intended, as the fruit of his labours. v. 9, dio [??], “Therefore God highly exalted Him, and gave Him a Name above every name”… Isa. 53:10, “When He shall make his soul an offering for sin (which was work hard enough) He shall see his seed (which was his soul’s desired wages) He shall prolong his days, the pleasure of the Lord shall prosper in hand: 11. He shall see of the travail of his soul, and be satisfied. 12. Therefore will I divide him (a portion) with the great, and he shall divide the spoil with the strong”: that is an ample reward. Follows his work, because “he hath poured out his soul unto death, and he was numbered with the transgressors, and bare the sins of many, and made intercession for the transgressors.” Hence, his care to finish the work of Him that sent Him, and to do his will, Jn. 4:34; Jn. 17:4; Jn. 8:29, and as the Father loved, so He rewarded the obedience of his Son, not by necessity of nature, but by a voluntary compact, but He loves his obedience, Jn. 10:17, “Therefore doth my Father love me, because I lay down my life, that I might take it again.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Part 2, ch. 6, Argument 10: ‘From the Work of Christ, and the wages, which a Covenant Calls for’ in The Covenant of Life Opened (Edinburgh, 1655), pp. 299-300 Rutherford is arguing that there is an eternal Covenant (of Redemption), because there is work as the condition, and a promise to that work.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Christ complains, Isa. 49:4, “Then I said, I have laboured in vain, I have spent my strength for nought, and in vain”: there’s work. Shall He have nothing for his work? He adds, “Yet surely my judgement is with the Lord, and my work with my God.” v. 6. He receives an answer of a full reward for his work… And as One who laboured for us, so He craves his wages, though the Jews pay him unworthily. Zech. 11.12, “Then I said, if ye think good, give (Me) my price, and if not, forbear; pay Me, or pay Me not: Yet the Lord paid Him. Phil. 2:7, “He made Himself of no reputation, and took upon Him the form of a servant,–and became obedient to the death, the death of the cross.” Here is work: followeth his wages, call it merit, or what else, it’s a reward and the end of his suffering, which Christ both desired and intended, as the fruit of his labours. v. 9, dio [??], “Therefore God highly exalted Him, and gave Him a Name above every name”… Isa. 53:10, “When He shall make his soul an offering for sin (which was work hard enough) He shall see his seed (which was his soul’s desired wages) He shall prolong his days, the pleasure of the Lord shall prosper in hand: 11. He shall see of the travail of his soul, and be satisfied. 12. Therefore will I divide him (a portion) with the great, and he shall divide the spoil with the strong”: that is an ample reward. Follows his work, because “he hath poured out his soul unto death, and he was numbered with the transgressors, and bare the sins of many, and made intercession for the transgressors.” Hence, his care to finish the work of Him that sent Him, and to do his will, Jn. 4:34; Jn. 17:4; Jn. 8:29, and as the Father loved, so He rewarded the obedience of his Son, not by necessity of nature, but by a voluntary compact, but He loves his obedience, Jn. 10:17, “Therefore doth my Father love me, because I lay down my life, that I might take it again.”…”

d.+Follows+his+work%2C+because+%E2%80%9Che+hath+poured+out+his+soul+unto+death%2C+and+he+was+numbered+with+the+transgressors%2C+and+bare+the+sins+of+many%2C+and+made+intercession+for+the+transgressors.%E2%80%9D+Hence%2C+his+care+to+finish+the+work+of+Him+that+sent+Him%2C+and+to+do+his+will%2C+Jn.+4%3A34%3B+Jn.+17%3A4%3B+Jn.+8%3A29%2C+and+as+the+Father+loved%2C+so+He+rewarded+the+obedience+of+his+Son%2C+not+by+necessity+of+nature%2C+but+by+a+voluntary+compact%2C+but+He+loves+his+obedience%2C+Jn.+10%3A17%2C+%E2%80%9CTherefore+doth+my+Father+love+me%2C+because+I+lay+down+my+life%2C+that+I+might+take+it+again.%E2%80%9D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Part+2%2C+ch.+6%2C+Argument+10%3A+%E2%80%98From+the+Work+of+Christ%2C+and+the+wages%2C+which+a+Covenant+Calls+for%E2%80%99+in+The+Covenant+of+Life+Opened+%28Edinburgh%2C+1655%29%2C+pp.+299-300+Rutherford+is+arguing+that+there+is+an+eternal+Covenant+%28of+Redemption%29%2C+because+there+is+work+as+the+condition%2C+and+a+promise+to+that+work.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbac036e02d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bac036e02d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/whether-christ-merited/#:~:text=Christ%20complains%2C%20Isa.%2049%3A4%2C%20%E2%80%9CThen%20I,that%20I%20might%20take%20it%20again.%E2%80%9D%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3e29601ba6" data-kw="">
<blockquote><p>And He suffered from the Father, as one whose demerits were infinite, by reason of our demerits that were laid upon Him. And yet it was especially by that act of his subjecting Himself to those sufferings, that He merited, and on the account of which chiefly He was accounted worthy of, the glory of his exaltation. Philippians 2:8–9, “He humbled Himself, and became obedient unto death; …wherefore God hath highly exalted Him.” And we see that ’tis on this account chiefly, that He is extolled as worthy by saints and angels in the context; “Worthy,” say they, “is the Lamb that was slain.…” This shows an admirable conjunction in him of infinite dignity, and infinite condescension and love to the infinitely unworthy.</p></blockquote>

<blockquote><p>43. What is the connection of the exaltation of the Mediator to His humiliation? The connection of legal consequence. Christ is Mediator not as a private person but as an official person, as Head of His members. Hence He must receive the fruits of His merits in Himself. And as He did not suffer for Himself, so too He was not glorified for Himself.</p></blockquote>

</figure><figure class="quote" id="q-77047bdab6" data-kw="">
<blockquote><p>…the Lutherans could not speak of any reward and exaltation for Christ. For according to them, the human nature of Christ shared in the divine attributes of omnipresence, omniscience, and omnipotence already from the moment of the incarnation. It therefore first received these attributes not as a reward for the mediatorial work done in the state of humiliation but already before hand, in virtue or its union with the divine nature, and also kept them throughout, be it that in his humiliation Christ did not make use of them, at least no public use. The exaltation was not a true and real exaltation, but only a matter of using, or publicly using, that which He already possessed from the beginning. It was not the outcome of an antecedent human development but merely a glorious manifestation of what He already was and possessed in secret.ª ª J. Gerhard, Loci theologici, ed. E. Preuss, 9 vols. (Berlin: G. Schlawitz, 1863-75), IV, 329; J. Quenstedt, Theologia, III, 324; D. Hollaz, Examen, 748; J.F. Buddeus, Inst. theol., 787.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 3.433</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the Lutherans could not speak of any reward and exaltation for Christ. For according to them, the human nature of Christ shared in the divine attributes of omnipresence, omniscience, and omnipotence already from the moment of the incarnation. It therefore first received these attributes not as a reward for the mediatorial work done in the state of humiliation but already before hand, in virtue or its union with the divine nature, and also kept them throughout, be it that in his humiliation Christ did not make use of them, at least no public use. The exaltation was not a true and real exaltation, but only a matter of using, or publicly using, that which He already possessed from the beginning. It was not the outcome of an antecedent human development but merely a glorious manifestation of what He already was and possessed in secret.ª ª J. Gerhard, Loci theologici, ed. E. Preuss, 9 vols. (Berlin: G. Schlawitz, 1863-75), IV, 329; J. Quenstedt, Theologia, III, 324; D. Hollaz, Examen, 748; J.F. Buddeus, Inst. theol., 787.”

— Herman Bavinck, Reformed Dogmatics, vol. 3.433">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Lutherans+could+not+speak+of+any+reward+and+exaltation+for+Christ.+For+according+to+them%2C+the+human+nature+of+Christ+shared+in+the+divine+attributes+of+omnipresence%2C+omniscience%2C+and+omnipotence+already+from+the+moment+of+the+incarnation.+It+therefore+first+received+these+attributes+not+as+a+reward+for+the+mediatorial+work+done+in+the+state+of+humiliation+but+already+before+hand%2C+in+virtue+or+its+union+with+the+divine+nature%2C+and+also+kept+them+throughout%2C+be+it+that+in+his+humiliation+Christ+did+not+make+use+of+them%2C+at+least+no+public+use.+The+exaltation+was+not+a+true+and+real+exaltation%2C+but+only+a+matter+of+using%2C+or+publicly+using%2C+that+which+He+already+possessed+from+the+beginning.+It+was+not+the+outcome+of+an+antecedent+human+development+but+merely+a+glorious+manifestation+of+what+He+already+was+and+possessed+in+secret.%C2%AA+%C2%AA+J.+Gerhard%2C+Loci+theologici%2C+ed.+E.+Preuss%2C+9+vols.+%28Berlin%3A+G.+Schlawitz%2C+1863-75%29%2C+IV%2C+329%3B+J.+Quenstedt%2C+Theologia%2C+III%2C+324%3B+D.+Hollaz%2C+Examen%2C+748%3B+J.F.+Buddeus%2C+Inst.+theol.%2C+787.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%2C+vol.+3.433&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F77047bdab6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/77047bdab6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/whether-christ-merited/#:~:text=%E2%80%A6the%20Lutherans%20could%20not%20speak%20of,748%3B%20J.F.%20Buddeus%2C%20Inst.%20theol.%2C%20787." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-652eea1381" data-kw="">
<blockquote><p>The eighth question is, whether Christ by his obedience merited anything for Himself. Here Quenstedt attacks Lombard, Thomas, Socinus, and others, That Christ merited only for us follows not only from the dignity of his Person, but from the communicatio idiomatum, whereby his human nature (except so far as our redemption required) lacked nothing. Besides, if He merited worship for Himself, how then could He have been worshipped in his earthly life? Moreover, as his merit and satisfaction are really one, if He merited for Himself, then He also satisfied for Himself. As to the name above every name, He had it already by right. Quenstedt repeats against the Romanists the argument of Calvin, that they confound the relation of antecedent and consequent with that of cause and effect. To the Socinian argument, that if Christ did not merit for Himself He could not merit for us, he replies that He could do this, just because He was not mere man, but God.</p></blockquote>

</figure><figure class="quote" id="q-81e5a4dbbd" data-kw="">
<blockquote><p>Calvin rules out this interpretation with sufficient clarity when he denies that Christ gained merit for Himself, and censured the Scholastics who taught that He did. Calvin’s censure would have been completely unwarranted if Christ could have merited reward for Himself in any way at all. He felt that it was enough to show that Christ could not merit reward for Himself as God for God, or as man for man. Calvin just takes it for granted that one nature could not merit reward for the other. And rightfully so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/faustus-socinus.html">Faustus Socinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in J.V. Fesko, ‘Socinus &amp; the Racovian Catechism on Justification’ being ch. 13 in Michael Parsons, Aspects of Reforming: Theology &amp; Practice in Sixteenth Century Europe (Paternoster, 2013)</cite></span></figcaption>

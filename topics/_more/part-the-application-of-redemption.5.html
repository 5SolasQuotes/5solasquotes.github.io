<figure class="quote" id="q-ced3bb21d5" data-kw="">
<blockquote><p>Q. But is justifying faith solitary without all attendants? A. No, justifying faith has two daughters that inseparably attend her. 1. Repentance: Here sinful man retracts and undoes his faults, acknowledges his transgressions, rents his heart weeps, smites upon his breast, and cries ‘What have I done?’ laments after the Lord and abhors himself in dust and ashes: He executes the Law upon himself; and since God excuses him from the punishment, he accuses himself of the guilt, and condemns himself to the shame of his sin; and hereby the sinner honors the equity of the threatening by his tears, acknowledging that his blood was due. 2. Newness of life: Here the sinner acknowledges perfect obedience to be still his duty, which honors the equity of God’s commandments. (Rom. 16:26)</p></blockquote>

</figure><figure class="quote" id="q-47764201aa" data-kw="">
<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.”

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’, pp. 119-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+As+soon+as+a+principle+of+new+life+is+infused+into+the+adult+person+by+the+Spirit+of+Grace%2C+immediately+spiritual+acting+of+every+kind+springs+up+from+that+principle%2C+actions+so+pervading+and+exciting+one+another%2C+and+so+mingled+in+their+exercise+that+they+can+scarcely+be+distinguished+in+practice%3B+and+as+difficult+is+it+to+determine+which+is+first+in+time%2C+which+last.+Surely+it+is+not+possible+but+that+the+soul%2C+quickened+by+the+Spirit%2C+should+in+that+supernatural+light+wherewith+it+is+illuminated%2C+both+see+itself+defiled+and+undone+with+innumerable+sins%2C+and+see+Christ+full+of+grace%2C+truth+and+salvation.+Such+a+view+cannot+but+cause+both%2C+that+with+shame+and+sorrow+it+be+displeased+with+itself%2C+and+with+ardent+desire+be+carried+out+unto+Christ.+Hence+arises+the+receiving+and+accepting+of+Christ%2C+that+it+may+be+delivered+from+the+fiithiness+and+guilt+of+its+sins.+Now+it+cannot+receive+Him+for+justification+except+at+the+same+time+it+receive+him+for+sanctification%3A+nor+receive+Him+as+a+Priest+to+expiate+sin%2C+unless+it+also+receive+him+as+a+King+to+whom+it+may+submit+in+order+to+obedience.+Hence+it+follows+that+that+act+of+faith+whereby+we+receive+Christ+for+righteousness+cannot+be+exercised+without+either+a+previous%2C+or+at+least+a+concomitant+repentance%2C+and+a+purpose+of+a+new+life.+If+therefore+faith+go+before+justification%2C+as+we+have+lately+asserted%3B+the+same+must+be+said+of+repentance%2C+springing+up+together+with+it+from+the+same+principle+of+spiritual+life.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Conciliatory+or+Irenical+Animadversions+on+the+Controversies+Agitated+in+Britain%3A+under+the+Unhappy+Names+of+Antinomians+%26+Neonomians+%281696%3B+Glasgow%2C+1807%29%2C+ch.+11%2C+%E2%80%98Whether+repentance+precedes+the+remission+of+sins%3F+%5BYes%5D%E2%80%99%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47764201aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47764201aa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=II.%20As%20soon%20as%20a%20principle,the%20same%20principle%20of%20spiritual%20life." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. By it a sinner, out of the sight and sense, not only of the danger, but also of the filthiness and odiousness of his sins, as contrary to the holy nature and righteous law of God, and upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins, as to turn from them all unto God,[c] purposing and endeavouring to walk with him in all the ways of his commandments.[d] [c] Ezek. 18:30,31. Ezek. 36:31. Isa. 30:22. Ps. 51:4. Jer. 31:18,19. Joel 2:12,13. Amos 5:15. Ps. 119:128. 2 Cor. 7:11. [d] Ps. 119:6,59,106. Luke 1:6. 2 Kings 23:25. III. Although repentance be not to be rested in, as any satisfaction for sin, or any cause of the pardon thereof,[e] which is the act of God’s free grace in Christ;[f] yet is it of such necessity to all sinners, that none may expect pardon without it.[g] [e] Ezek. 36:31,32. Ezek. 16:61-63. [f] Hos. 14:2,4. Rom. 3:24. Eph. 1:7. [g] Luke 13:3,5. Acts 17:30,31.</p></blockquote>

<blockquote><p>I will not stand in argument, whether faith be a part of repentance, or does by any other means depend upon it. It seems to me a notable point of folly to go about to tie matters of divinity to precepts of logic: for we learn not that of the Lord’s apostles.</p></blockquote>

</figure><figure class="quote" id="q-312f6b8e83" data-kw="">
<blockquote><p>Wherefore we are not to imagine that faith is infused either before or without other graces, or that the soul is not at the same time and as soon disposed to love and fear God as to believe in Him, or to humility, to patience, to charity, to repentance, as for faith. The seed of all these graces is sown at once; and for their habits they are coeval stems of one common root of inherent sanctity: though yet some of them shoot up faster and bear fruit sooner than other. Those that do so are the two principal graces of faith and repentance: the actions of both which seem to appear first in the regenerate: which of them show first, I will not now dispute; but certain it is that the regenerate soul works here most lively and stirring, and after the infusion of spirituall life the pulse beats strongest in those arteries. The reason whereof I take it is, the singular use of these two graces arising from the manner of our conversion: which being wrought by the sight of sin and misery on the one side, and the representation of grace and mercy on the other, of necessity draws the newly-regenerate soul by strong motions immediately to conceive sorrow for, and detestation of its sinful misery, and also to a vehement desiring and looking after the promise of grace, which may bring it deliverance from an estate so damnable. But in this point of the priority of one grace before another, we may not be too bold nor curious: for as the working of the Holy Ghost is secret and wonderful, in making us wild gourds partakers of the sap and sweetness of the true vine: so is it not possibly observable in all or the most, where, and in what branch this sap first buds forth into blossoms and fruit.</p></blockquote>

<blockquote><p>What word of Christ has Mr. [William] Prynne for extraordinary conversion of men by miracles without the Word? He must conceive with Arminians and Socinians that many are converted that never heard of that precious name of Jesus, without which there is no salvation, Acts 4:11, or of a faith in Christ, as Moses Amyraldus dreams, without the knowledge of Christ, and may write books De salute Ethnicorum [On the Salvation of Ethnics]… This may make us fancy somewhat of the salvation of Aristotle, Seneca, Cicero, Aristides, Scipio, Regulus, without the Law or Gospel, this way of extraordinarily saving men by miracles without the Gospel is the doctrine of Arminians and Socinians; so say the Arminians at the Synod of Dort, pp. 334-35: ‘Those whom God has deprived of the Gospel, He has not precisely rejected them from a communion of the benefits of the Gospel.’ Adolphus Venator (Adversus Dracenos, p. 84), says, ‘The heathen are saved without the Gospel, if they even but pray, Ens Entium miserere mei [‘Being of beings, have mercy on me’]. [Faustus] Socinus (Lectures on Theology, ch. 3), tells us of an inspired word that saves us, called verbum interius [‘an interior word’]. You may please schoolmen thus, such as Granadus (Contr. 8, de grat., tract 6, disp. 1, numb. 43) did Ruiz (De Predesti. se. 8. numb. 7), Alexander Alens. (8, p. q. 69, member 5, art. 3, De bonis Philosophis sic credo, etc.), Roa. (bk. 1, De Provident., quest. 7, n. 50), Vega (bk. 13 in Trident. ch. 12), Enriquez (tome 2, De ultimo fine, ch. 14, num. 6, quod bk. 8, quest. 5), Vasquez (1, par. disp. 97, and ch. 5), Soto (bk. 1, de nat. et grat., ch. 18, ad. 2), Francis Sonnius (in demonstrat. tract. 12. de consiliis ch. 8), Camerarius (bk. 1, de grat., ch. 8 and bk. 7, ch. 8), who do all of them send all the good philosophers and white morallists to heaven by miracles, inspirations, extraordinary works of providence and that without any rumour of Christ and the Gospel; famous Papists, to their own shame, yield that divine faith cannot be produced by miracles. Andradius says often they may be false. Maldonatus says that no necessary argument of faith can be drawn from miracles. Gregorius de Valen. says miracles give us no infallible certainty of doctrine. Bellarmine says, ‘Miracles cannot convince the mind.’ Durandus gives a sure reason why miracles cannot produce faith, ‘because’ (says he) ‘suppose it were known of itself that this miracle of the raising e.g. of Lazarus were true, yet it is not known by itself that it testifies that this is a true doctrine which he preaches who works the miracle.’ Mr. Prynne then has put the salvation of those who never heard the Gospel upon extraordinary pillars when he bottoms them on miracles without the Word, which are extraordinary rotten pillars.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London: 1646), ch. 23</cite>, p. 522</span></figcaption>

<blockquote><p>Howbeit, if I should be asked concerning the infants of Christians, which depart without this sacrament: mine answer should be, that we must have a good hope of them and stick fast to the Word of God; namely, to the covenant made with Abraham, wherein God promises Himself, not only that He would be a God unto him, but also unto his seed. Which promise, seeing it is not so general, as it comprehends all; therefore I dare not promise certain salvation particularly unto any that departs hence. For their be some children of the saints, which belong not unto predestination; such we read to be Esau, Ishmael, and others more, whose salvation is not hindered, in respect that they were not baptized. … I always except the children of the elect; for we doubt not to number them among the company of believers, though they as yet believed not by reason of their age: even as they which be born of infidels, are reckoned among the unbelievers, although of themselves they withstand not the faith. So as the children of the godly, departing without baptism, by reason of the covenant that God hath made with their parents, may be saved; if they appertain to the number of such as be predestinate. Also, I do except all others, if any there be, which by the secret council of God belong unto predestination.</p></blockquote>

</figure><figure class="quote" id="q-6052754b9d" data-kw="">
<blockquote><p>What is to be judged of the soul of a child so killed, having as yet not received the sacrament [of circumcision]? I answer that we, as touching his salvation or condemnation, can affirm nothing on either side. For if he pertained to the number of the elect so that he was predestinate to life, there is no cause but that he may be saved: forasmuch as grace is not bound unto sacraments. But if he were a vessel to that end made of God, to show forth in him His wrath, and so to be condemned, what can we complain on the severity of God, especially seeing we are all born the children of wrath and condemnation? Howbeit in my judgment we ought to hope well in him.</p></blockquote>

</figure><figure class="quote" id="q-7fe483e537" data-kw="">
<blockquote><p>For as our own salvation is, so verily is altogether the salvation of our children of the mere election and mercy of God, which oftentimes goes together with natural propagation. Weigh with thyself, that even they be elected of God which be also born of saints, as we saw it came to pass in Isaac… Not that it doth always so happen of necessity: because the promise is not general as touching all the seed, but of that only in which the election together consents. Otherwise the posterity of Ishmael and Esau were of Abraham. But because we ought not to be over-curious of searching out the secret providence and election of God, therefore we judge the children of the saints to be saints, so long as by reason of their age, shall not declare themselves strangers from Christ. We exclude them not from the Church, but embrace them as members thereof, hoping well, that as they be the seed of the saints according to the flesh, so also they be partakers of the divine election, &amp; that they have the Holy Ghost and grace of Christ: and for this cause we baptize them. Neither must they be heard [e.g. Anabaptists] which move a doubt of this matter and say: What if the minister be deceived; And what if for a very truth, the child be not the child of promise, of divine election and of mercy? Because the same cavil may also be as touching them that be of lawful age [who are baptized]. For we also know not whether they come feigned, or whether they believe truly: whether they be the children of predestination, or of perdition; whether they have the grace of Christ, or whether they be destitute thereof, and do falsely say that they believe… And so not all, so many as are baptized, are either saved or predestinated unto eternal life. Neither can we by any other means discern between the baptized who belong unto salvation, and who be not the sons of God, but that we daily judge of them by their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/common-places.html">Common Places</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 4 | Ch. 8, ‘Of baptism, baptizing of infants and the holiness of them’</cite>, p. 116</span></figcaption>

</figure><figure class="quote" id="q-1ea38796bf" data-kw="">
<blockquote><p>The Holy Spirit exercises his power in the elect alone… the other who are condemned and not elect, being left… The adoption is offered in circumcision, to all who are circumcised; but the elect alone receive it, whose eyes God has opened, that they may see and be saved. The rest, to whom God hath not vouchsafed this grace, are left to his righteous judgement, and yet God remains true. The same takes place in Baptism, which many thousand infants receive, who yet are never regenerated, but perish forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Colloquy of Mt. Belligart, which was held in 1586 (Tubingen, 1587), ‘On Baptism’, p. 479. The translation is from Kraut, p. 26; see there for a fuller account of the exchange with the Lutheran Jacob Andrea, who held otherwise.</cite></span></figcaption>

<blockquote><p>With regard indeed to infants born within the pale of the church and divinely elected (of which character I have said, we must not rashly conclude everyone to be) and dying before they attain to the use of reason, I have little difficulty in concluding on the basis of the divine promise that they are engrafted into Christ from their birth.</p></blockquote>

</figure><figure class="quote" id="q-726425ec64" data-kw="">
<blockquote><p>The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.</p></blockquote>

</figure><figure class="quote" id="q-9195acda16" data-kw="">
<blockquote><p>The power of Baptism has place in the elect alone. They only are baptized, not with water merely but with the Spirit also. Though all these things (enumerated previously) are affirmed of Baptism, and are truly attributed to it as the organ of the Holy Spirit, and all who are baptized are truly said to become and be such sacramentally; yet we believe that these things are fulfilled in fact, only in the elect. All are baptized with water, but the elect only, with the Spirit; all receive the sign, but the elect only are made partakers of the thing signified and offered through Baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 8, Of the Christian Religion, Ch. 15, ‘Of Baptism’, col. 516, section II as translated in Krauth</cite>, p. 31</span></figcaption>

</figure><figure class="quote" id="q-12ad4b5f9c" data-kw="">
<blockquote><p>Neither Zwingli, nor Calvin, nor any one of us, places, without distinction in heaven with the saints, all infants who die without baptism, whether unborn or in birth, or while they are carried to baptism, but they pronounce this, by the law of charity, of the infants alone of the Church, born in the Covenant if they be prevented by death, nevertheless, without interference with the election of God, which as of old in the family of Abraham and Isaac, so in after time often hath made, and doth make a discrimination which we are neither to search into nor to scoff at, but to adore (Rom. 9:11). This is the constant judgment of ourselves, and of our divines concerning this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in Krauth, Infant Baptism and Infant Salvation in the Calvinistic System… (Philadelphia: Lutheran Books Store, 1874), p. 20. Krauth gives as the reference: Pareus, Castigations in Bellarmine on the Loss of Grace (1613), Book 6, p. 871, though the page number does not exactly correspond to the Google Books edition (1613), though it appears to be close.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“Neither Zwingli, nor Calvin, nor any one of us, places, without distinction in heaven with the saints, all infants who die without baptism, whether unborn or in birth, or while they are carried to baptism, but they pronounce this, by the law of charity, of the infants alone of the Church, born in the Covenant if they be prevented by death, nevertheless, without interference with the election of God, which as of old in the family of Abraham and Isaac, so in after time often hath made, and doth make a discrimination which we are neither to search into nor to scoff at, but to adore (Rom. 9:11). This is the constant judgment of ourselves, and of our divines concerning this question.”

ivines%20concerning%20this%20question." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f5e223342f" data-kw="">
<blockquote><p>Neither does this hinder [baptism], because all that are born of faithful parents are not elected; for we are not to inquire into the secret judgments of God, but probably we may duly conjecture that all which are born of Christians are elected.</p></blockquote>

</figure><figure class="quote" id="q-c603154c54" data-kw="">
<blockquote><p>Are all these benefits received by baptism, equally by all those which receive the same? No, for they are not alike: for the ingrafting into Christ, and the benefits which follow it, are not bestowed upon the reprobate, although they be offered them when they are baptised. For God calleth and justifieth, regenerateth, and glorifieth effectually them whom He hath elected and predestinated to these things, Rom. 8:3, but the elect, as well infants, as they of years are equally incorporated into Christ, either in, or before baptism, and are endowed with the imputation of his righteousness, forgiveness of sins, and the right of eternal life, for they are all alike the sons of God, but regeneration is not wrought alike in all, nor are the gifts of the spirit, faith, hope, and charity, given alike unto all, or received alike of all, but according to the pleasure of God, as the parable of the talents teaches, and Eph. 4:7. To everyone is given grace according to the measure of the gifts of Christ: and we do see that the effects of regeneration are more and greater in some, and in other some fewer and lesser.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Are all these benefits received by baptism, equally by all those which receive the same? No, for they are not alike: for the ingrafting into Christ, and the benefits which follow it, are not bestowed upon the reprobate, although they be offered them when they are baptised. For God calleth and justifieth, regenerateth, and glorifieth effectually them whom He hath elected and predestinated to these things, Rom. 8:3, but the elect, as well infants, as they of years are equally incorporated into Christ, either in, or before baptism, and are endowed with the imputation of his righteousness, forgiveness of sins, and the right of eternal life, for they are all alike the sons of God, but regeneration is not wrought alike in all, nor are the gifts of the spirit, faith, hope, and charity, given alike unto all, or received alike of all, but according to the pleasure of God, as the parable of the talents teaches, and Eph. 4:7. To everyone is given grace according to the measure of the gifts of Christ: and we do see that the effects of regeneration are more and greater in some, and in other some fewer and lesser.”

="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Secondly it is not necessary that every one that is baptized should presently be regenerated or justified. But the sacrament of Baptism is a seal unto him of the righteousness of faith, which is the righteousness of Christ, either to be applied by the Holy Ghost, to the elect dying in their infancy, or to be apprehended also by faith in them, who living to years of discretion have grace to believe. §. 4. Thirdly we are to distinguish of the effects of baptism, and of the time thereof. For it is not the effect of baptism to begin, or to work faith, which in those of years, must go before baptism, neither can infants though baptized, whiles they want the use of reason, actually believe, but to seal to the baptized the righteousness of faith, and so to justify sacramentally, which effect is not to be restrained to the time when baptism is administered, but to be to the whole course of a man’s life, whensoever he shall believe and repent. As for the elect, which die before the use of reason; the sacrament of baptism is the seal and means of Christ’s righteousness to be applied to these by the holy Ghost. For as some have been sanctified from the womb, yea and some in the womb, so it is not to be doubted, but that those infants whom God in their infancy intendeth to glorify, He doth bestow upon them his spirit, which is the spirit of faith, 2 Cor. 4:13, and the spirit of regeneration, whereby He doth illuminate their minds, and sanctify their hearts and every way prepare and fit them for his own kingdom. Fourthly we are to distinguish between the judgment of charity, and the judgment of certainty. For although in the general we know, that not every one that is baptized is justified or shall be saved, yet when we come to speak of particulars, we are to judge of them that are baptized, that they are regenerated and justified, and that they shall be saved; until they shall discover themselves not to be such. And so our book of Common-Prayer speaketh of them, as the scriptures also teach us to speak of them that are baptized, that they are regenerated and engrafted into the body of Christ, though perhaps they be regenerated sacramento tenus [so far as by the sacrament], and engrafted only into the body of his visible church: But this judgement of charity is no matter of certainty, or of faith, but may be deceived. The like judgment of charity our church conceiveth concerning all those that die in the bosom of the church, and depart this life in the profession of the faith, so that not all are justified before God, or sanctified by saving grace, who to us, judging according to charity, seem to be such.</p></blockquote>

</figure><figure class="quote" id="q-43e9e219f9" data-kw="">
<blockquote><p>As for the cause of death and damnation willed by God, we maintain that God wills not the death of any man, or the condemnation of any man, but for sin. But I pray what think you of infants perishing in original sin?… Or had you rather shake hands with Arminius in this also, and profess that no man is damned for original sin only; but that all the children of Turks and Sarazens, and Jews and canibals that die in their infancy are saved and enjoy the joys of Heaven, as well as the children of the faithful?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity… (London: Thorp, 1631), sect. 2</cite>, ch. 15, pp. 549-50</span></figcaption>

</figure><figure class="quote" id="q-55aeaf294c" data-kw="">
<blockquote><p>And by the way I observe, you are apt to discourse of God’s infinite love towards them that perish amongst men, but of any such love towards them that perish amongst angels, not a word: yet it is as evident, that if any perish amongst angels, it is merely their own faults also: Nay, much more evident is this in the nation of angels than in the nation of men. For many thousand infants perish in original sin, for no personal original fault of their own, but for the transgression of Adam, and in that corruption which is naturally derived unto them from the loins of Adam, after that by his actual transgression he fell into the state of that corruption, which since from him is become hereditary unto us all. As for that miscarriage which makes all men obnoxious unto the wrath of God, and unto condemnation, we hold it impossible to be prevented. For original sin and Adam’s transgression is it, which you well know, cannot be prevented: Only God may have mercy on whom He will, even in despite of any actual miscarriage (which you dote upon as an only hinderer from grace) like as on the other side He hardens whom He will, in spite of all civil and moral good carriage found in the best of heathen men. This I speak according to the doctrine of Saint Paul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity… (London: Thorp, 1631), sect. 2</cite>, sect. 3, ch. 18, p. 641</span></figcaption>

%20the%20way%20I%20observe%2C,to%20the%20doctrine%20of%20Saint%20Paul%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c25adef0fc" data-kw="">
<blockquote><p>Meanwhile, we in no wise so connect the grace and mercy of God towards infants with the faith of believing parents as to infer any prejudice to the free and secret election of him who, both among infants and adult professors of the faith, knows who are his own and has sealed them with a seal known only to himself.</p></blockquote>

</figure><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>

<blockquote><p>Question: What are we to think of infants, and idiots? Answer: Such of them as belong to God’s election, he worketh in them for their justification, and sanctification after an extraordinary, secret, and wonderful manner, applying Christ to them, his righteousness, obedience, and virtue of his death, and resurrection by his holy Spirit, who all-sufficiently supplies unto them the defect of all inferior instruments, and means, and hereby purgeth them from the guilt, punishment, and corruption of their sins. Now in these there cannot actually be this conflict, because they have not the acts and operations of spiritual graces, but only the seeds of them: yet even in them, through spiritual regeneration, there may be some kind of conflict between the Spirit and the flesh, the seed of grace, and of corruption striving one against another. But this is meant of elect infants dying in their infancy.</p></blockquote>

<blockquote><p>10th Consideration: The present felicity into which all that die in Christ are presently admitted, should abundantly comfort Christians over the death of such as either carried a lively hope out of the world with them, or have left good grounds of such an hope behind them. Some there are that carried a lively hope to heaven with them, who could evidence to themselves and friends their interest in Christ and in the Covenant. Yea, though they had died in silence, yet their conversations would speak for them, and the tenor of their lives leave no ground of doubting touching their death: others dying in their infancy or youth, though they carried not such an actual hope with them, yet they have left good grounds of hope behind them. Parents now ponder these grounds; you have prayed for them, you have many times wrestled with the Lord on their behalf; you have taken hold of God’s Covenant for them, as well as for your selves, and dedicated them to the Lord, and they have not by any actions of theirs destroyed those grounds of your hope, but that you may with much probability conclude they are with God.</p></blockquote>

et="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Are all that are baptized, undoubtedly regenerated? No. Acts 8:13,23. … By what reasons are they [Romanists &amp; Lutherans] confuted? … (3) Because, infants that are predestinated unto life, though they die in their mother’s belly, yet they cannot perish (Mt. 18:14). (4) Because, some children before their Baptism, have been beloved of God, whose love is unchangeable (Rom. 9:11,13). Others have been regenerated by the Holy Ghost (Lk. 1:15): and some have also been comprehended within the Covenant of Grace (Acts 2:39). (5) Because, that Baptism, without faith, and the inward operation of the holy Spirit, hath no efficacy to Salvation (Mk. 16:16; 1 Pet. 3:21). … (7) Because, very many that are baptized within the visible Church, are damned (Mt. 7:13-14). … (9) Because, not all that are baptized are elected (Mt. 20:16)… (10) Because, the Holy Ghost, is a most Free Agent, and Worker: and therefore his operation (whence the efficacy of Baptism depends) whereby we are regenerated, is not tied to any one moment of time (Jn. 3:8).</p></blockquote>

<blockquote><p>8. [Baxter complains:] The [Anglican] rubric [post-1662] to which we [ministers] must declare our assent, approbation and consent [upon pain of defrocking], has this article of faith: ‘It is certain by God’s Word that children which are baptized, dying before they commit actual sin are undoubtedly saved.’ [1.] And the rubric at burial excepts all the unbaptized from Christian Burial, according to the office. … 12. There is no one Word of God cited in the rubric which tells us that it is certain by the Word of God. 13. Among Christian divines there are all these various opinions about the salvation of infants: 1. Some hold that the Covenant being to the faithful and their seed, and their children being holy, all the children of sincere Christians are certainly in a state of salvation, being by the parents intentionally dedicated to God, before or without baptism: And that baptism is but their solemn investiture in that state which was theirs by right before. 2. Others think that this right to salvation belongs to the children of all professed Christians godly and ungodly. 3. Others think that it belongs to all infants in the world. 4. Others think that it belongs only to sincere believers’ children that are baptized. 5. Others that it belongs to sound and unsound Christians’ baptized infants. 6. Others that it belongs to all baptized infants whose soever. 7. Others hold that it belongs also to the children of sincere adopters or proprieters. 8. Others that it belongs to such as even bad Christians adopt or own. 9. Others that they that have sincere godfathers, though not proprieters, are saved. 10. Others that even unsound or hypocritical Christian godfathers may suffice to their salvation. 11. Others that the ministers or the Church’s sincere (or professed) Faith is hereto sufficient. 12. And others think that only the elect are saved, of whom some are baptized and some unbaptized, but no man knows who they are. Out of all these opinions the Convocation has chosen one as an article of Faith of undoubted certainty by the Word of God. 13. The non-conformists know of no Word of God which ascertains salvation to any known determinate infants but the great Covenant of Grace, ‘I will be thy God, and the God of thy seed;’ which seed God uses as if they were parts of the parents, Ex. 34:6-7, and Second Commandment, and says to believers, ‘Else were your children unclean, but now, etc.’ [1 Cor. 7:14].</p></blockquote>

</figure><figure class="quote" id="q-ad50bae669" data-kw="">
<blockquote><p>Even in early times circumcision also conferred upon the circumcised among the non-elect a privilege above the non-circumcised. To them were entrusted the oracles of God, Rom. 3:1-2.–By a like reasoning there is a common grace and favor of God, which all baptized persons possess, even the non-elect, viz., initiation and ingrafting into the outward body of the Church, in virtue of which even though perishing they have a right to the name of huieis basileias [sons of the kingdom] and enjoy the outward privileges of God’s covenanted.–But this is the mere courtyard, shell and surface of baptism. … As for adults, outward baptism does not seal inward grace for all of them, but for those alone who bear in their hearts a faith the reverse of feigned and confess it in words. Nor yet for the children of believing parents one and all, but only for the elect is baptism the sign of regeneration and universal spiritual grace. Although it is right and godly in the case of individual children of the kind to have good hopes of the judgment in love, in the case of them all it is not so.</p></blockquote>

</figure><figure class="quote" id="q-2b86d55d86" data-kw="">
<blockquote><p>The faith demanded of parents in the formula of baptism is indefinite: this, to wit that godly persons’ infants are sanctified in Christ. And that faith is true, although there should be here and there an exception… That divine promise has a common truth, though God reserve to Himself, according to His own power and liberty, the exclusion of some infants. Faith… performs its office when it lays hold of the promise as it is given, and reverently leaves to God liberty of application. The believer is bound… to acquiesce in the promise given… and to trust in it, or, in the judgment of charity to hope well concerning this infant which is to be baptized— nay, to believe that this infant belongs to Christ, unless God, by a singular decision, wills its exclusion. The faith demanded of parents is not vain… though here and there one (of the infants) does not belong to the election… although there is not an internal baptizing of exactly all infants.</p></blockquote>

izing%20of%20exactly%20all%20infants." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bd927a7639" data-kw="">
<blockquote><p>And, in the first place, I assume as admitted by all orthodox writers upon the subject, although it is not safe to pry too curiously into the secrets of the divine counsels or to draw too confident conclusions concerning the lot of those dying in infancy, that a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant. For it would be altogether wrong to suppose that the promise made to Abraham (“I will be thy God, and the God of thy seed after thee”) has been either revoked or brought within narrower limits by the introduction of the better dispensation, especially seeing that Peter, on the glorious day of Pentecost, impressed upon his hearers that the promise of the Spirit of grace was given not to themselves only but also to their children; and that the Lord Jesus took up in his arms the children of covenanted parents, blessed them, and, in a word, declared that of such is the kingdom of heaven (which Scripture testimonies I do not feel myself called to dwell upon at present, as I have expounded them at length in another place). … Indeed, the height and depth of eternal predestination forbids us to pry into its hidden things with more than a lawful curiosity. Yet, judging soberly, there can be nothing to prevent us from conferring the sign and seal of the covenant upon those whom it is proper to acknowledge as the covenanted people of God; meanwhile the secret things of predestination have been left to God according to his freedom. … XIV. From all this we infer that there is no such thing signified and sealed, much less conferred, upon all covenanted infants in baptism as a kind of common justification, regeneration, and sanctification, which shall place them in a state of salvation prior to the use of reason and become insufficient for their salvation after they have grown up, nor any remission of original sin, whether revocable or irrevocable; but that the whole efficacy of baptism, insofar as it implies a state of salvation even conformably with that period of life, belongs exclusively to infants who are elected. Hence, among orthodox theologians disputing about the efficacy of baptism, the question is chiefly, if not solely: What benefits does it confer upon elect infants, who alone in the estimation of God have, strictly speaking, a right to it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Efficacy and Utility of Baptism in the case of Elect Infants whose Parents are under the Covenant’, p. 127, 130, 137 in MJT 17 (2006), originally an appendix in William Marshall, Popery in The Full Corn, the Ear, and the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian, and Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“And, in the first place, I assume as admitted by all orthodox writers upon the subject, although it is not safe to pry too curiously into the secrets of the divine counsels or to draw too confident conclusions concerning the lot of those dying in infancy, that a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant. For it would be altogether wrong to suppose that the promise made to Abraham (“I will be thy God, and the God of thy seed after thee”) has been either revoked or brought within narrower limits by the introduction of the better dispensation, especially seeing that Peter, on the glorious day of Pentecost, impressed upon his hearers that the promise of the Spirit of grace was given not to themselves only but also to their children; and that the Lord Jesus took up in his arms the children of covenanted parents, blessed them, and, in a word, declared that of such is the kingdom of heaven (which Scripture testimonies I do not feel myself called to dwell upon at present, as I have expounded them at length in another place). … Indeed, the height and depth of eternal predestination forbids us to pry into its hidden things with more than a lawful curiosity. Yet, judging soberly, there can be nothing to prevent us from conferring the sign and seal of the covenant upon those whom it is proper to acknowledge as the covenanted people of God; meanwhile the secret things of predestination have been left to God according to his freedom. … XIV. From all this we infer that there is no such thing signified and sealed, much less conferred, upon all covenanted infants in baptism as a kind of common justification, regeneration, and sanctification, which shall place them in a state of salvation prior to the use of reason and become insufficient for their salvation after they have grown up, nor any remission of original sin, whether revocable or irrevocable; but that the whole efficacy of baptism, insofar as it implies a state of salvation even conformably with that period of life, belongs exclusively to infants who are elected. Hence, among orthodox theologians disputing about the efficacy of baptism, the question is chiefly, if not solely: What benefits does it confer upon elect infants, who alone in the estimation of God have, strictly speaking, a right to it?”

— Herman Witsius, ‘On the Efficacy and Utility of Baptism in the case of Elect Infants whose Parents are under the Covenant’, p. 127, 130, 137 in MJT 17 (2006), originally an appendix in William Marshall, Popery in The Full Corn, the Ear, and the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian, and Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd%2C+in+the+first+place%2C+I+assume+as+admitted+by+all+orthodox+writers+upon+the+subject%2C+although+it+is+not+safe+to+pry+too+curiously+into+the+secrets+of+the+divine+counsels+or+to+draw+too+confident+conclusions+concerning+the+lot+of+those+dying+in+infancy%2C+that+a+distinguished+privilege+belongs+to+those+infants+whose+benefit+it+is+in+divine+providence+to+be+born+of+parents+whom+the+grace+of+the+Most+High+has+honored+with+the+saving+fellowship+of+his+covenant.+For+it+would+be+altogether+wrong+to+suppose+that+the+promise+made+to+Abraham+%28%E2%80%9CI+will+be+thy+God%2C+and+the+God+of+thy+seed+after+thee%E2%80%9D%29+has+been+either+revoked+or+brought+within+narrower+limits+by+the+introduction+of+the+better+dispensation%2C+especially+seeing+that+Peter%2C+on+the+glorious+day+of+Pentecost%2C+impressed+upon+his+hearers+that+the+promise+of+the+Spirit+of+grace+was+given+not+to+themselves+only+but+also+to+their+children%3B+and+that+the+Lord+Jesus+took+up+in+his+arms+the+children+of+covenanted+parents%2C+blessed+them%2C+and%2C+in+a+word%2C+declared+that+of+such+is+the+kingdom+of+heaven+%28which+Scripture+testimonies+I+do+not+feel+myself+called+to+dwell+upon+at+present%2C+as+I+have+expounded+them+at+length+in+another+place%29.+%E2%80%A6+Indeed%2C+the+height+and+depth+of+eternal+predestination+forbids+us+to+pry+into+its+hidden+things+with+more+than+a+lawful+curiosity.+Yet%2C+judging+soberly%2C+there+can+be+nothing+to+prevent+us+from+conferring+the+sign+and+seal+of+the+covenant+upon+those+whom+it+is+proper+to+acknowledge+as+the+covenanted+people+of+God%3B+meanwhile+the+secret+things+of+predestination+have+been+left+to+God+according+to+his+freedom.+%E2%80%A6+XIV.+From+all+this+we+infer+that+there+is+no+such+thing+signified+and+sealed%2C+much+less+conferred%2C+upon+all+covenanted+infants+in+baptism+as+a+kind+of+common+justification%2C+regeneration%2C+and+sanctification%2C+which+shall+place+them+in+a+state+of+salvation+prior+to+the+use+of+reason+and+become+insufficient+for+their+salvation+after+they+have+grown+up%2C+nor+any+remission+of+original+sin%2C+whether+revocable+or+irrevocable%3B+but+that+the+whole+efficacy+of+baptism%2C+insofar+as+it+implies+a+state+of+salvation+even+conformably+with+that+period+of+life%2C+belongs+exclusively+to+infants+who+are+elected.+Hence%2C+among+orthodox+theologians+disputing+about+the+efficacy+of+baptism%2C+the+question+is+chiefly%2C+if+not+solely%3A+What+benefits+does+it+confer+upon+elect+infants%2C+who+alone+in+the+estimation+of+God+have%2C+strictly+speaking%2C+a+right+to+it%3F%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+%E2%80%98On+the+Efficacy+and+Utility+of+Baptism+in+the+case+of+Elect+Infants+whose+Parents+are+under+the+Covenant%E2%80%99%2C+p.+127%2C+130%2C+137+in+MJT+17+%282006%29%2C+originally+an+appendix+in+William+Marshall%2C+Popery+in+The+Full+Corn%2C+the+Ear%2C+and+the+Blade%3B+or%2C+The+Doctrine+of+Baptism+in+the+Popish%2C+Episcopalian%2C+and+Congregational+Churches%3B+with+a+Defence+of+the+Calvinistic+or+Presbyterian+View+%28Edinburgh%3A+Paton+and+Ritchie%2C+1852%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd927a7639.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd927a7639.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvation-of-infants-in-without-the-church/#:~:text=And%2C%20in%20the%20first%20place%2C%20I,strictly%20speaking%2C%20a%20right%20to%20it%3F" rel="noopener" target="_blank">Read i <blockquote><p>Things commanded, in the unregenerate are sins, because although the actions and doings of those things are commanded, yet the person, from whom those actions proceed, pleases not God, neither is reconciled unto God. Further, that which the unregenerate do, they do it not to that end, whereunto they ought, that is, to the glory of God, neither is their action grounded of faith. For they know not whether or no they have God favorable to them, or whether that be pleasing unto Him which they do. But these conditions and circumstances are necessarily required to a good work: for it suffices not to do good works after a civil manner. Those civil works indeed are good, as they proceed from God: but as they are in unregenerate men, they are evil: even as it is sin, when a wicked man gives alms: because it proceeds not from the love of God and therefore not from faith, neither is referred unto God’s glory. But yet those things which men do being forbidden in the Law of God are of themselves and properly sins, because the nature or definition of sin doth properly agree unto them: which is, that they are done against the express commandment of God. And therefore in the Scripture things which are so done of men, are ever called evil, but never good. But those things which are commanded of God, when they are done by the unregenerate, or in hypocrisy, they are so discommended, as yet nevertheless they are counted and praised for good: and that not only in respect of God, who is the efficient of those things in men, in respect of whom all the actions of the wicked are just: but also in respect of the men themselves by whom they are done, so that they also are said to have done well, as 1 Kings 21, ‘Seest thou how Ahab is humbled before me? Because he submits himself before Me, I will not bring that evil in his days. And 2 Kn. 10, ‘The Lord said unto Jehu: Behold, because thou hast diligently executed that which was right in my eyes etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), Of Sin, 3. How many kinds of sin there are, 5. Sinful in itself or Not</cite>, pp. 94-95</span></figcaption>

<blockquote><p>19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special. 20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3. 21. Special help is called the particular grace that moves, strengthens, and advances unto action. 22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10. 23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters. 24. I call earthly matters those things which pertain only to earthly life. 25. And these are either natural or moral. 26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc. 27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc. 28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. … 38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God. 39. Much less is it able to choose and pursue political matters without the general help of God. 40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.</p></blockquote>

<blockquote><p>§V. As to liberty itself; there remained in the will of lapsed man: 1. Immunity from the necessity of coaction, or external violence, by reason of elicited acts. 2. Immunity from internal physical necessity. 3. The liberty of exercise or of contradiction, which is between willing or not willing; loving or not loving; acting or not acting. 4. The liberty of specification, by which the will, from two or more things or species which can be recalled to the sphere of doable things in the state of corruption, can choose one and neglect another. §VI. The objects which pertain to the sphere of doable things in the state of reigning corruption, before conversion, are all those things which are subject to the senses and to natural reason, and do not surpass human grasp. And they are: 1. Actions merely natural and animal, e.g., to eat, to drink, to be awake, to sleep, to be moved from a place, to rest. 2. The inventions or apprehensions of sciences and arts, concerning which see Calvin, Institutes, bk. 2, ch. 2, §14. 3. Civil and economic actions, such as to care for a family and the commonwealth, and in them to do or omit one’s duty. 4. Moral actions of the natural order, and those which pertain to common ethics, Rom. 2:14-15… Hence the virtues of the gentiles, produced by the general aid of God, as to their substance, are true moral virtues of the natural order, consisting of the same internal form, object, means and acts; although by reason of their mode, adjuncts, circumstances, and also their end, they often had notable defects, in respect of which Augustine calls them, by a broad signification, ‘sins’, although elsewhere he commends the virtues of the gentiles, as in Of the Spirit &amp; the Letter, ch. 27; Epistle 99 to Evodius; also Epistle 130; and the book, On the Grace of Christ, ch. 24. See Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 7, §5; D. Johann Fabricius, Systema Theologicum, locus 3, aphorism 2, p. 277. Nor does the passage Rom. 14:23 stand in the way, for there Paul by ‘faith’ does not understand saving faith, but the dictate of conscience, by which something is judged to be licit or illicit. §VII. But to this sphere in no way pertain spiritual actions, which cannot be elicited and performed except by the Spirit of God vivifying, illuminating, acting, operating, regenerating and sanctifying in certain degrees. In respect of these, we rightly teach that the natural powers of free will are not only bound, attenuated, impeded, wounded and broken, but plainly lost, destroyed, extinguished, and null, against the Pelagians, Semi-Pelagians, Socinians, Remonstrants, Mennonites; and in part also the Greeks, Synergists and Pontificists, of whom see Bellarmine, bk. 6 of On the Loss of Grace &amp; the State of Sin, ch. 16; Coster, Enchiridion, ch. 5, p. 190. §VIII. Against whom we assert that unregenerate man in the state of dominant corruption, or before his conversion, has from himself no natural powers, whether in the intellect or in the will, for… keep[ing] the precepts of God, and do[ing] good works, pleasing to God and saving for himself.</p></blockquote>

</figure><figure class="quote" id="q-8d1426d071" data-kw="">
<blockquote><p>And from our own [reformed] writers [on regeneration]: the treatise of William Whately on regeneration; the sermon of Obadiah Sedgwick on Rev. 3:1-3; Nicolas Byfield’s Principia Fidei [Principles of Faith], ch. 25; the various opuscula [small works] of Paul Baynes; Thomas Hooker on the humiliation of the soul, on the preparation of the soul for Christ, on the union of the soul with Christ, etc.; and writers on the practice of repentance: Perkins, Stock, Daniel Dyke, Arthur Dent… They are to be read, however, with this judgment: that one aim at the distinctions hitherto brought by us, and consider that the concepts of the practical writers—if not all, at least most—are to be referred to the second moment of regeneration and to actual conversion, whether first or renewed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

wed." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5d52bebcef" data-kw="">
<blockquote><p>In the work of our regeneration three graces be required: the preventing grace, the working grace and the co-working grace. The preventing grace is when God of his mercy sets and imprints in the mind a new light, in the will a new quality or inclination, in the heart new affections. The working grace is when God gives to the will the act of well-willing, namely the will to believe, the will to repent, the will to obey God in his Word. (Velle credere, velle resipiscere, velle obedire.) The co-working grace is when God gives the deed to the will, that is, the exercise and practice of faith and repentance. The first gives the power of doing good, the second the will, the third the deed: and all three together make the work of regeneration. (Augustine, Of Grace &amp; Free Will, ch. 17) Now the will of man in respect of operation does not concur with God’s preventing grace, but is merely patient as a subject to receive grace. For it is the proper work of God to set or imprint a new faculty or inclination in the will, and that without any action of the said will. Nevertheless the will being once renewed and prevented, concurs by his operation with the working and co-working grace of God. For the will being moved by grace, wills and does indeed that whereunto it is moved. And the will to obey God, or to perform any like duty, proceeds jointly from two causes. From grace: in that it moves and causes the will to will to believe. From the will of man: in that being prevented and moved by God, it wills to believe, or to do any like duty. And therefore the ancient saying has his truth, ‘He that made thee without thee, does not regenerate or save thee without thee’ (Augustine, Sermon 15, Of the Words of the Apostles), because our conversion is not without the motion and consent of will, as our creation was. And that we do not mistake in this point, the order that is between man’s will and God’s grace must here again be remembered. In respect of time they are both together, and concur in the very first moment of our regeneration: in respect of the order of nature, the will does not first begin that which is good, and then after borrow aid from grace: but grace prevents, renews, and moves the will, and then the will moved or changed wills to be converted and to be healed in the first instant of conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, pp. 116-21</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-672d41dcda" data-kw="">
<blockquote><p>This former doctrine is of great use. In that the new birth and regeneration of a sinner is not without the motion of his own will, we are taught that we must, if we desire our own salvation, use the good means and strive against our own corruptions and endeavour earnestly by asking, seeking, knocking. It will be said that faith, repentance and the rest, are all gifts of God. I answer, there is no virtue or gift of God in us, without our wills: and in every good act, God’s grace and man’s will concur: God’s grace as the principal cause: man’s will renewed as the instrument of God. And therefore in all good things industry and labour, and invocation on our parts is required. Secondly, this doctrine ministers true comfort to all true servants of God. For, if when they use the good means of salvation, the Word, prayer, sacraments, the will lie not dead but begin to oppose itself against unbelief and other corruptions, and withal do but so much as will to believe, will to repent, will to be turned to God, they have begun to turn unto God, and God has begun to regenerate them, so be it this will in them to do the good they ought to do be in good earnest unfeigned and they withal be careful to cherish this little grain till it come to a bigger quantity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, pp. 129-30</span></figcaption>

<blockquote><p>XXIV. In this [third state] it is asked: Whether in man’s first conversion to God our will cooperates actively with divine grace by its natural and inherent faculty, or whether in first conversion it behaves passively such that at the first moment of conversion it does not contribute at all, but allows the power of willing well to be infused into itself. The Papists assert the former; we, with Scripture, the latter. XXV. Eze. 11:19: ‘I will take away the heart of stone and give a heart of flesh.’ 1 Cor. 12:3: ‘No one can say Jesus is Lord except through the Holy Spirit.’ Ps. ‘Create in me a clean heart, O Lord, and renew a right spirit within me.’ Jn. 6:44: ‘No one can come to me unless the Father who sent me draws him.’ Phil. 2:13: ‘God is the one who works both to will and to accomplish.’ And these things concern that third [state]; the fourth follows. XXVI. In which those renewed and made children of God, moved by the Holy Spirit, act, namely freely cooperating with divine grace: for since the new man is gradually restored, that is, that image of God lost in Adam is gradually brought back, there is no doubt that they then freely will and meditate on actions conforming to divine Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on Free Will’ (Leiden: Patius, 1603), trans. AI Latin</cite></span></figcaption>

<blockquote><p>In the conversion of a man there is no concurrence of the powers of free arbitrium. But at the first moment of it man and his will act in a purely passive state. Here we are speaking of the first impulse and moment of conversion, or the first beginning of this movement, in which acknowledging his sins man turns to God. And this first beginning, we assert, does not depend on the natural strength of the will, but is the beginning of grace alone, according to the express testimonies of Scripture, Col. 2:13 (and you being dead through your trespasses and the uncircumcision of your flesh, you, I say, he did quicken together with him, having forgiven us all our tresspasses), where it is said that men are dead in sins… Yet at the very moment in which God effects in us the grace of conversion He also bends man’s will to desire and seek for that grace, and so in the progress of conversion the will co-operates with divine grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bartholomaus-keckermann.html">Bartholomäus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Heinrich Heppe, Reformed Dogmatics ed. Bizer, trans. Thomson (d. 1609; 1950; Wipf &amp; Stock, 2007), ch. 20, ‘Calling’, section 20</cite>, pp. 520-21</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

med Books Online</a></div>
</figure><figure class="quote" id="q-f25ff943b7" data-kw="">
<blockquote><p>…our conversion itself. Which is to be considered two ways: 1. In actu primo [in the first act], as it is the work of God’s Spirit on us, renewing our corrupt nature, healing all vitions, infusing all virtuous inclinations into each faculty; by which Habitual infused qualities they are disposed to all spiritual and holy actions. This is the work of God by his preventing grace. 2. In actu secundo [in the second act], as it is our work converting ourselves to God in all holy operations of faith, love, and godly obedience, which acts we do by the help of God’s subsequent and assisting grace. Of conversion in both senses we are to enquire, how far it may be resisted and hindered: touching the first, namely, our habitual conversion in the infusion of all gracious habits, this conclusion is to be defended: That in our first conversion or sanctification we are merely passive and cannot by any act of ours either work it ourselves or bind God’s working of it. This is apparent by the Scriptures, which testify unto us what our state is before conversion, what the work of God is in our conversion: namely that we are dead in sins, Eph. 2:1; Col. 2:13; Mt. 8:22; Eph. 5:14, that we are blind and very darkness in regard of spiritual knowledge, Rev. 3:18; Eph. 4:17, 5:8; Mt. 6:23; Lk. 4:18; Jn. 1:5; Acts 26:18; 1 Cor. 2:14, that our hearts are stony, destitute of all sense and motions of goodness, Eze. 36:26, 11:19. Again, that God’s work in our conversion is a raising from the dead, Eph. 2:5; Col. 2:12; Rev. 20:6; Jn. 5:21, 25, a restoring of sight to the blind, Lk. 4:18, a new generation and birth of a man, Jn. 1:13; 3:3, another creation of him, Eph. 2:10; Ps. 51:12; 2 Cor. 5:17; Gal. 6:15. The giving of a new heart of flesh and taking away of the old stony heart, Eze. 11:19. Out of which and many the like places we conclude that a man can do no more in the effecting or hindering of his first conversion than the matter can do in regard of the form, to receive or reject it, no more than Adam’s body could resist the entrance of the soul into it or Lazarus’s carcass and the dead bones in Ezekiel could refuse the spirit of life’s coming into them, no more than an infant can hinder its own conception and birth or the world the creation of itself, no more than the bodies of those sick persons whom Christ cured by his word could hinder the restitution of health when Christ commanded them to be whole, or the eyes of the blind could nill the restoring of their sight, or the air that is dark can refuse to be enlightened: in brief, a man’s heart can no more hinder the work of God’s grace in changing it out of stone into flesh than the body of Lot’s wife could resist the force of his power in turning it out of flesh into a pillar of salt. Against this doctrine of man’s passiveness in his first conversion our adversaries object many things, qualifying the rigor of those censures the Scriptures give touching our utter disability, eluding their force by many subtle shifts, all devised only to this purpose, that our conversion may not be thought to be altogether of grace but shared between the grace of God and some power of our own. To allege and answer every cavil were a business of more length than difficulty: unto them all in general I answer that he that takes a man’s judgment touching man’s abilities, he follows the sentence of a blind corrupt judge and that in his own cause. It is the Lord that judges us and it becomes us to submit to his censure, not to extol ourselves when he abases us, lest we be found liers like those hypocritical Laodiceans, boasting that we are rich and increased with goods and have need of nothing when in the mean God knows though we know not, how that we are wretched, and miserable, and poor, and blind, and naked, standing in need of all things. Wherefore let this truth always stand firm, that as no man can prepare himself by any strength of his own effectually to work his sanctification, either alone by himself or as a coworker with the Spirit of grace, so no man can hinder the work of God’s Spirit when he intends to bestow this first grace of sanctification upon a sinner. This of habitual conversion in the internal renovation of all the faculties, which cannot be resisted or hindered: in the next place we are to consider of conversion as it is our act, consisting in the operations and exercises of all gracious habits infused, as when we actually believe, repent and do other good works. This active conversion is nothing but the practice of sanctification, when being made holy and good, we do good and holy works, as a man after he is raised from death or restored to health performs the actions of a living, of a healthy man. For that similitude of St. Austin’s is certain, Non ideo currit rota, ut sit rotunda, etc. as a wheel runs not that it may be round, but because it is round; so the will believes not that it may be regenerate, but because it is regenerate. And therefore that is an error of the coursest bran when our adversaries make the act of believing to go before our sanctification: whereas nothing is more certain than this, that all holy actions whether of faith or any other grace come from that common root of holiness infused into our souls… …there is a double beginning or cause of every gracious action in a man regenerate: 1. The Spirit of God by his exciting and cooperating grace. 2. Man himself renewed and sanctified in all his faculties. The former is termedprincipium a quo[the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, p. 144</span></figcaption>

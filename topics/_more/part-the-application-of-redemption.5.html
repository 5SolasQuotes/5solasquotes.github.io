<div class="actions"><button class="copy" data-copy="“…our conversion itself. Which is to be considered two ways: 1. In actu primo [in the first act], as it is the work of God’s Spirit on us, renewing our corrupt nature, healing all vitions, infusing all virtuous inclinations into each faculty; by which Habitual infused qualities they are disposed to all spiritual and holy actions. This is the work of God by his preventing grace. 2. In actu secundo [in the second act], as it is our work converting ourselves to God in all holy operations of faith, love, and godly obedience, which acts we do by the help of God’s subsequent and assisting grace. Of conversion in both senses we are to enquire, how far it may be resisted and hindered: touching the first, namely, our habitual conversion in the infusion of all gracious habits, this conclusion is to be defended: That in our first conversion or sanctification we are merely passive and cannot by any act of ours either work it ourselves or bind God’s working of it. This is apparent by the Scriptures, which testify unto us what our state is before conversion, what the work of God is in our conversion: namely that we are dead in sins, Eph. 2:1; Col. 2:13; Mt. 8:22; Eph. 5:14, that we are blind and very darkness in regard of spiritual knowledge, Rev. 3:18; Eph. 4:17, 5:8; Mt. 6:23; Lk. 4:18; Jn. 1:5; Acts 26:18; 1 Cor. 2:14, that our hearts are stony, destitute of all sense and motions of goodness, Eze. 36:26, 11:19. Again, that God’s work in our conversion is a raising from the dead, Eph. 2:5; Col. 2:12; Rev. 20:6; Jn. 5:21, 25, a restoring of sight to the blind, Lk. 4:18, a new generation and birth of a man, Jn. 1:13; 3:3, another creation of him, Eph. 2:10; Ps. 51:12; 2 Cor. 5:17; Gal. 6:15. The giving of a new heart of flesh and taking away of the old stony heart, Eze. 11:19. Out of which and many the like places we conclude that a man can do no more in the effecting or hindering of his first conversion than the matter can do in regard of the form, to receive or reject it, no more than Adam’s body could resist the entrance of the soul into it or Lazarus’s carcass and the dead bones in Ezekiel could refuse the spirit of life’s coming into them, no more than an infant can hinder its own conception and birth or the world the creation of itself, no more than the bodies of those sick persons whom Christ cured by his word could hinder the restitution of health when Christ commanded them to be whole, or the eyes of the blind could nill the restoring of their sight, or the air that is dark can refuse to be enlightened: in brief, a man’s heart can no more hinder the work of God’s grace in changing it out of stone into flesh than the body of Lot’s wife could resist the force of his power in turning it out of flesh into a pillar of salt. Against this doctrine of man’s passiveness in his first conversion our adversaries object many things, qualifying the rigor of those censures the Scriptures give touching our utter disability, eluding their force by many subtle shifts, all devised only to this purpose, that our conversion may not be thought to be altogether of grace but shared between the grace of God and some power of our own. To allege and answer every cavil were a business of more length than difficulty: unto them all in general I answer that he that takes a man’s judgment touching man’s abilities, he follows the sentence of a blind corrupt judge and that in his own cause. It is the Lord that judges us and it becomes us to submit to his censure, not to extol ourselves when he abases us, lest we be found liers like those hypocritical Laodiceans, boasting that we are rich and increased with goods and have need of nothing when in the mean God knows though we know not, how that we are wretched, and miserable, and poor, and blind, and naked, standing in need of all things. Wherefore let this truth always stand firm, that as no man can prepare himself by any strength of his own effectually to work his sanctification, either alone by himself or as a coworker with the Spirit of grace, so no man can hinder the work of God’s Spirit when he intends to bestow this first grace of sanctification upon a sinner. This of habitual conversion in the internal renovation of all the faculties, which cannot be resisted or hindered: in the next place we are to consider of conversion as it is our act, consisting in the operations and exercises of all gracious habits infused, as when we actually believe, repent and do other good works. This active conversion is nothing but the practice of sanctification, when being made holy and good, we do good and holy works, as a man after he is raised from death or restored to health performs the actions of a living, of a healthy man. For that similitude of St. Austin’s is certain, Non ideo currit rota, ut sit rotunda, etc. as a wheel runs not that it may be round, but because it is round; so the will believes not that it may be regenerate, but because it is regenerate. And therefore that is an error of the coursest bran when our adversaries make the act of believing to go before our sanctification: whereas nothing is more certain than this, that all holy actions whether of faith or any other grace come from that common root of holiness infused into our souls… …there is a double beginning or cause of every gracious action in a man regenerate: 1. The Spirit of God by his exciting and cooperating grace. 2. Man himself renewed and sanctified in all his faculties. The former is termedprincipium a quo[the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’”

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), p. 144">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6our+conversion+itself.+Which+is+to+be+considered+two+ways%3A+1.+In+actu+primo+%5Bin+the+first+act%5D%2C+as+it+is+the+work+of+God%E2%80%99s+Spirit+on+us%2C+renewing+our+corrupt+nature%2C+healing+all+vitions%2C+infusing+all+virtuous+inclinations+into+each+faculty%3B+by+which+Habitual+infused+qualities+they+are+disposed+to+all+spiritual+and+holy+actions.+This+is+the+work+of+God+by+his+preventing+grace.+2.+In+actu+secundo+%5Bin+the+second+act%5D%2C+as+it+is+our+work+converting+ourselves+to+God+in+all+holy+operations+of+faith%2C+love%2C+and+godly+obedience%2C+which+acts+we+do+by+the+help+of+God%E2%80%99s+subsequent+and+assisting+grace.+Of+conversion+in+both+senses+we+are+to+enquire%2C+how+far+it+may+be+resisted+and+hindered%3A+touching+the+first%2C+namely%2C+our+habitual+conversion+in+the+infusion+of+all+gracious+habits%2C+this+conclusion+is+to+be+defended%3A+That+in+our+first+conversion+or+sanctification+we+are+merely+passive+and+cannot+by+any+act+of+ours+either+work+it+ourselves+or+bind+God%E2%80%99s+working+of+it.+This+is+apparent+by+the+Scriptures%2C+which+testify+unto+us+what+our+state+is+before+conversion%2C+what+the+work+of+God+is+in+our+conversion%3A+namely+that+we+are+dead+in+sins%2C+Eph.+2%3A1%3B+Col.+2%3A13%3B+Mt.+8%3A22%3B+Eph.+5%3A14%2C+that+we+are+blind+and+very+darkness+in+regard+of+spiritual+knowledge%2C+Rev.+3%3A18%3B+Eph.+4%3A17%2C+5%3A8%3B+Mt.+6%3A23%3B+Lk.+4%3A18%3B+Jn.+1%3A5%3B+Acts+26%3A18%3B+1+Cor.+2%3A14%2C+that+our+hearts+are+stony%2C+destitute+of+all+sense+and+motions+of+goodness%2C+Eze.+36%3A26%2C+11%3A19.+Again%2C+that+God%E2%80%99s+work+in+our+conversion+is+a+raising+from+the+dead%2C+Eph.+2%3A5%3B+Col.+2%3A12%3B+Rev.+20%3A6%3B+Jn.+5%3A21%2C+25%2C+a+restoring+of+sight+to+the+blind%2C+Lk.+4%3A18%2C+a+new+generation+and+birth+of+a+man%2C+Jn.+1%3A13%3B+3%3A3%2C+another+creation+of+him%2C+Eph.+2%3A10%3B+Ps.+51%3A12%3B+2+Cor.+5%3A17%3B+Gal.+6%3A15.+The+giving+of+a+new+heart+of+flesh+and+taking+away+of+the+old+stony+heart%2C+Eze.+11%3A19.+Out+of+which+and+many+the+like+places+we+conclude+that+a+man+can+do+no+more+in+the+effecting+or+hindering+of+his+first+conversion+than+the+matter+can+do+in+regard+of+the+form%2C+to+receive+or+reject+it%2C+no+more+than+Adam%E2%80%99s+body+could+resist+the+entrance+of+the+soul+into+it+or+Lazarus%E2%80%99s+carcass+and+the+dead+bones+in+Ezekiel+could+refuse+the+spirit+of+life%E2%80%99s+coming+into+them%2C+no+more+than+an+infant+can+hinder+its+own+conception+and+birth+or+the+world+the+creation+of+itself%2C+no+more+than+the+bodies+of+those+sick+persons+whom+Christ+cured+by+his+word+could+hinder+the+restitution+of+health+when+Christ+commanded+them+to+be+whole%2C+or+the+eyes+of+the+blind+could+nill+the+restoring+of+their+sight%2C+or+the+air+that+is+dark+can+refuse+to+be+enlightened%3A+in+brief%2C+a+man%E2%80%99s+heart+can+no+more+hinder+the+work+of+God%E2%80%99s+grace+in+changing+it+out+of+stone+into+flesh+than+the+body+of+Lot%E2%80%99s+wife+could+resist+the+force+of+his+power+in+turning+it+out+of+flesh+into+a+pillar+of+salt.+Against+this+doctrine+of+man%E2%80%99s+passiveness+in+his+first+conversion+our+adversaries+object+many+things%2C+qualifying+the+rigor+of+those+censures+the+Scriptures+give+touching+our+utter+disability%2C+eluding+their+force+by+many+subtle+shifts%2C+all+devised+only+to+this+purpose%2C+that+our+conversion+may+not+be+thought+to+be+altogether+of+grace+but+shared+between+the+grace+of+God+and+some+power+of+our+own.+To+allege+and+answer+every+cavil+were+a+business+of+more+length+than+difficulty%3A+unto+them+all+in+general+I+answer+that+he+that+takes+a+man%E2%80%99s+judgment+touching+man%E2%80%99s+abilities%2C+he+follows+the+sentence+of+a+blind+corrupt+judge+and+that+in+his+own+cause.+It+is+the+Lord+that+judges+us+and+it+becomes+us+to+submit+to+his+censure%2C+not+to+extol+ourselves+when+he+abases+us%2C+lest+we+be+found+liers+like+those+hypocritical+Laodiceans%2C+boasting+that+we+are+rich+and+increased+with+goods+and+have+need+of+nothing+when+in+the+mean+God+knows+though+we+know+not%2C+how+that+we+are+wretched%2C+and+miserable%2C+and+poor%2C+and+blind%2C+and+naked%2C+standing+in+need+of+all+things.+Wherefore+let+this+truth+always+stand+firm%2C+that+as+no+man+can+prepare+himself+by+any+strength+of+his+own+effectually+to+work+his+sanctification%2C+either+alone+by+himself+or+as+a+coworker+with+the+Spirit+of+grace%2C+so+no+man+can+hinder+the+work+of+God%E2%80%99s+Spirit+when+he+intends+to+bestow+this+first+grace+of+sanctification+upon+a+sinner.+This+of+habitual+conversion+in+the+internal+renovation+of+all+the+faculties%2C+which+cannot+be+resisted+or+hindered%3A+in+the+next+place+we+are+to+consider+of+conversion+as+it+is+our+act%2C+consisting+in+the+operations+and+exercises+of+all+gracious+habits+infused%2C+as+when+we+actually+believe%2C+repent+and+do+other+good+works.+This+active+conversion+is+nothing+but+the+practice+of+sanctification%2C+when+being+made+holy+and+good%2C+we+do+good+and+holy+works%2C+as+a+man+after+he+is+raised+from+death+or+restored+to+health+performs+the+actions+of+a+living%2C+of+a+healthy+man.+For+that+similitude+of+St.+Austin%E2%80%99s+is+certain%2C+Non+ideo+currit+rota%2C+ut+sit+rotunda%2C+etc.+as+a+wheel+runs+not+that+it+may+be+round%2C+but+because+it+is+round%3B+so+the+will+believes+not+that+it+may+be+regenerate%2C+but+because+it+is+regenerate.+And+therefore+that+is+an+error+of+the+coursest+bran+when+our+adversaries+make+the+act+of+believing+to+go+before+our+sanctification%3A+whereas+nothing+is+more+certain+than+this%2C+that+all+holy+actions+whether+of+faith+or+any+other+grace+come+from+that+common+root+of+holiness+infused+into+our+souls%E2%80%A6+%E2%80%A6there+is+a+double+beginning+or+cause+of+every+gracious+action+in+a+man+regenerate%3A+1.+The+Spirit+of+God+by+his+exciting+and+cooperating+grace.+2.+Man+himself+renewed+and+sanctified+in+all+his+faculties.+The+former+is+termedprincipium+a+quo%5Bthe+principle+from+which%5D%2C+the+latter+principium+quod+%5Bthe+principle+that%5D%3A+man+works%2C+but+he+must+be+moved+thereto+and+assisted+by+the+Spirit+of+Grace%3A+both+together+concur+to+the+producing+of+every+holy+action.+I+say+both+together%3A+for+although+man+in+his+first+conversion+was+merely+passive%2C+God%E2%80%99s+Spirit+working+all+without+man%E2%80%99s+help%3A+yet+man+in+performance+of+any+holy+act+is+not+merely+active%2C+able+to+do+all+of+himself+without+God%E2%80%99s+help.+No%2C+he+is+partly+passive%2C+partly+active%3A+passive+as+he+stands+in+need+of+God%E2%80%99s+grace+to+stir+up%2C+guide%2C+and+strengthen+the+endeavor+of+each+faculty+in+the+doing+of+good%3A+Active+in+as+much+as+being+thus+helped+by+grace%2C+himself+willingly+moves+himself+to+every+godly+work.+Now+by+reason+of+this+concurrence+of+man+with+God%2C+these+operations+of+grace+are+properly+called+man%E2%80%99s+work%2C+not+God%E2%80%99s+work+in+man.+So+that+when+a+regenerate+man+believes%2C+this+act+though+it+be+caused+by+Gods+Spirit%2C+yet+it+is+done+and+exercised+by+Man+voluntarily+moving+himself+in+that+action%2C+and+therefore+we+say+it+is+man+that+believes%2C+not+God%E2%80%99s+Spirit+that+believes%3A+as+if+the+act+of+believing+were+wrought+in+man%E2%80%99s+will+by+the+Spirit+of+God+in+the+same+sort+as+jugglers+work+strange+motions+in+their+puppets%2C+which+seem+to+do+wondrous+feats%2C+but+tis+an+unseen+hand+that%E2%80%99s+the+cause+of+all.+Such+gross+conceits+should+not+have+been+devised+by+ingenuous+minds+and+put+upon+so+plain+and+clear+doctrine+as+that+is+touching+the+concurrence+of+God%E2%80%99s+grace+with+our+strength+in+all+holy+actions+whatsoever.+The+point+is+easy+to+him+that+will+understand%3A+Every+good+desire+and+good+work+is+partly+from+man%2C+because+he+wills+it%3A+he+works+it%3B+but+principally+from+God%E2%80%99s+Spirit%2C+because+He+makes+man+to+will+and+to+work+it.+Without+which+cooperating+grace+man+by+habitual+inherent+grace+could+do+no+good+work+at+all%2C+according+to+that+of+Christ%2C+Jn.+15%3A5%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+of+the+apostle%2C+Phil.+1%3A6%2C+%E2%80%98He+that+hath+begun+the+good+work+will+also+perform+it%3B%E2%80%99+and+again%2C+Phil.+2%3A13%2C+%E2%80%98It+is+God+that+worketh+in+you+both+the+will+and+the+deed%2C+even+of+his+good+pleasure%3A%E2%80%99+and+again%2C+1+Cor.+15%3A10%2C+%E2%80%98I+have+labored+more+abundantly+than+they+all%2C+yet+not+I+but+the+grace+of+God+which+is+in+me.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+p.+144&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff25ff943b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f25ff943b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=%E2%80%A6our%20conversion%20itself.%20Which%20is%20to,of%20God%20which%20is%20in%20me.%E2%80%99" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2nd Objection: But there is no such thing as initial regeneration, distinct from actual, as here is supposed. Wherever the Spirit is infused to regenerate, He does, in the first instant, actually regenerate: therefore there being, by your own confession (say they) no actual regeneration in any infant ordinarily at his baptism, there is then no regeneration at all, this distinction of initial and actual regeneration being but a toy and a new device, without warrant from the Scripture. Answer. If this objection contain a truth without equivocation, I confess the position to be a toy indeed. But there may lie some ambiguity in the terms of ‘initial’ and ‘actual’, which being cleared, the objection may perhaps appear as weak as they declare themselves rash and uncharitable who took upon them to confute that distinction which they never understood, nor would ever vouchsafe so much as to hear explicated by myself, either in public or private. Touching the distinction of initial and actual regeneration, I have sufficiently declared before, in my second chapter, in what sense I use it. I will therefore forbear to repeat what there I have written. The reader may view it at his pleasure. If any man demand express Scriptures for the very terms, he will soon declare of what spirit he is. But if by sufficient consequence the distinction be not clearly deduced thence, he shall then have cause to complain. Let him view the foundation on which it is built, and afterwards tell me his mind if he remain unsatisfied. In the meantime I shall only add thus much: that by initial and actual regeneration, I do not mean to insinuate two several kinds of spiritual life, for which, I acknowledge, there is no footing in Scripture: but I understand only two distinct considerations in respect of the degrees of spiritual life in the same subject, which the places of Scripture before alleged in chapter 2 do sufficiently warrant. For, by ‘life’ in Scripture is sometimes meant the soul infused as the principle of life; sometimes the very actual being and enlivening of the subject by that soul, making it actually to produce the actions of life. Hence I distinguish life into initial and actual: not as if the Spirit were not actually communicated, or did not actually work, or actually begin, from the very first instant, to dispose and prepare the soul to future actual newness of life, by infusing some potential and seminal grace; but my meaning is that the Spirit does not at that time ordinarily so plenarily change and renew the whole man as to work in him either actual faith, hope, or love, etc., or so much as the habits of these or other particular graces for the present, as afterward He does. Something the Spirit does from his first entrance toward actual regeneration; therefore we call that first work initial, thereby understanding the first disposition to, or degree of, actual regeneration. But forasmuch as that first work does not (for ought we know) extend to a present actual change of the whole man in the same manner and degree that afterward is wrought in him at his effectual calling, therefore we call that latter work actual regeneration. This ought not to seem strange to any: for just so it is in the course of nature. So soon as the reasonable soul is infused, there is in some sense (not every way, in respect of degrees) a rational life. But how? The soul is there, and in that soul are included all the principles of reason: but the soul does not send forth those principles into action (unless in some insensible manner by little and little preparing the infant unto human actions) till afterward, when the senses begin to act.¹ Before that time, the rational life cannot wholly be denied to be in an infant, because the rational soul is actually in his body: yet forasmuch as the infant has not at that time the actual use of reason, for this cause we call the further perfection of his natural principles, by tract of time attained, when reason puts itself into act, actual rational life; and we term the same life, in respect of the first degree and principles thereof, which together with the reasonable soul in the first infusion thereof it received, initial life. ¹ “He (namely God) has therefore given to the human soul a mind, in which reason and understanding in an infant are, as it were, asleep—so that they seem almost not to exist—yet are to be awakened and exercised with the advance of age, by which the mind becomes capable of knowledge and instruction, and fit for the perception of truth and the love of good.” Augustine, City of God, bk. 22, ch. 24. To the same purpose also he writes, bk. 2, Of Sin, ch. 25 and elsewhere. This is no more, in substance, than what we have learned from St. Augustine, Calvin, Peter Martyr, Junius, Daneus, Dr. Whitaker, Zanchius and sundry others, whose judgments have been at large set down in this treatise in sundry places upon sundry occasions. And shall any man think it nothing in a magisterial humor to trample so many worthies under his feet at once, as if he were wiser than all others? If it be only the terms that displease him, because perhaps the same are not found in any of these authors, he shall but show himself a caviller to quarrel them, unless he can show that the terms are used to signify that which, in substance, these authors do not allow and teach. Briefly then, this objection is grounded upon a false information and supposition: for it supposes me to use the terms of initial and actual regeneration as intending thereby to teach that there be two distinct species or kinds of regeneration; whereas my meaning is only to speak of the same spiritual life in two distinct considerations, in respect of degrees. And so the objection fights with a shadow, and not with me. But it will be replied that in regeneration there be no degrees, but that it is performed and dispatched at an instant, as natural generation is. It is true, say they, that there be degrees in renovation, which notes a growth in sanctification in a man regenerated. But regeneration is never taken for any other than for the first act of the Spirit entering into a Christian and begetting him a new man in Christ, in the very first moment of his entrance. Therefore the distinction of actual and initial regeneration cannot be admitted in any sense. I answer that those two words, ‘regeneration’ and ‘renovation’, may perhaps by some be used, the one to signify the first infusion of grace making a man actually a new creature in all parts at once, and the other to note the continual growth of a Christian in grace infused; if men will beforehand give notice of their meaning, and for the more clear expression of themselves will say: when I speak of the first infusion of grace, I will use the word ‘regeneration’ to express it by; and when I speak of continual growth from one degree unto another, I will ever call that ‘renovation’. Men may, if they please, make use of words as they do of counters in casting of accounts, wherein, of the same set and value, some counters are made to stand for pounds, some for shillings, and some for pence. And yet, as those counters which stand for pence might as well have stood for pounds as those that do stand for pounds, if it had pleased him that set them to have so disposed them, so men may put words of the same value and native signification to signify diverse things, by a liberty justifiable enough in use of speech; and yet those words may without wrong be used by others to signify other things: always provided that when a man uses a word in a sense different either from the prime signification of it, or from the common acceptation of it, he give warning that wherever he uses such a word, he would be understood in such or such a sense, and not according to the etymology of it, nor according to the common use of it. And thus I grant that, if it please any divine to say that he will ever restrain regeneration to note the first infusion of grace, and by renovation signify a daily increase of grace, in all his speeches or writings, for want of fitter terms to express himself in, he may do it. But if any man shall say that the proper meaning of the word ‘regeneration’, and of that which the Scriptures call it, is the first infusion of the Spirit actually to make a man a new creature in all parts at once, so as in this there can be no degrees; and affirm that so the Scriptures do ever use that word; and also add that by ‘renovation’ the Scripture never means the same thing that it intends by ‘regeneration’, but that ‘renovation’ is ever put for another thing, to wit, for continual growth in grace once infused, I must crave leave to dissent from him and to deny his assertion. For neither is there any such difference in the proper signification of these words but that they may both signify one and the same thing; nor is the Scripture so nice as to observe such a difference between them as the objectors would persuade us. That in the proper signification there is nothing either why ‘regeneration’ should signify only the first infusion of grace, or rather this than the daily growth of it; nor why ‘renovation’ should not signify the first beginnings of the new creature as well as the growth of it, those that are skillful in the tongues will easily bear me witness; and I take them that make this nice distinction between these two words to be better skilled than to say that these words in their proper signification will justify this conceit. Therefore they must of necessity fly to the Scriptures and prove that there ‘regeneration’ is always so restrained as that it always signifies the first infusion of grace, and not that further work of the Spirit which admits of degrees and is ever expressed by ‘renovation’; or else their conceit will prove but a fancy too weak to ruin the distinction of initial and actual regeneration. But the Holy Ghost in the Scriptures does not observe this nicety of words: for sometimes we shall find ‘regeneration’ put for sanctification expressed by obedience unto Christ and his Gospel, or else for the beginning of glory, and not for the first infusion of grace only. So in Mt. 19:28, our Saviour thus gives answer to Peter demanding of him what they should have who had forsaken all to follow Him: ‘Verily I say unto you that ye which have followed me, in the regeneration, when the Son of man shall sit in the throne of his glory, ye also shall sit upon twelve thrones, etc.’ where the word ‘regeneration’ cannot be taken for the first infusion of grace only, because it notes such a thing as Christ’s disciples did actually exercise and express in receiving of his Gospel, or else, as Beza rather thinks, it signifies the very state of glory wherewith they shall be invested at the latter day; and the words ought to be read thus: ye that have followed Me (here making the comma), in the regeneration, when the Son of man shall sit in the throne of his glory, ye shall sit, etc.; that is, you that follow me now shall hereafter, when the elect, being perfectly sanctified, begin their kingdom of glory, namely at the latter day, when I shall come again in glory, then shall ye sit upon twelve thrones. And so did Saint Augustine long before expound that text. Therefore the word is not restrained only to signify the first infusion of the Spirit and of grace by the Spirit. Again, sometimes we shall find ‘regeneration’ and ‘renovation’ put one for another, the one to explicate the other: for so Zanchi says expressly in his commentary upon Ephesians 5. And he says the truth: for so the apostle uses them, Titus 3:5, ‘according to his mercy He saved us, by the laver of regeneration and renewing of the Holy Ghost;’ where the apostle uses those two words of ‘regeneration’ and ‘renovation’ not to signify two things, but the latter declares the meaning of the former, as Beza well observes. Wherefore I conclude that, forasmuch as the Holy Scripture does not restrain the word ‘regeneration’ to the first infusion of the Spirit, or of grace by the Spirit, wherein there be no degrees, but extends it further even to that further work of the Spirit wherein (as all grant) there be degrees, the distinction of regeneration into initial and actual still stands upright without battering by this second objection, that will admit of no degrees in that which the Scripture everywhere calls by the name of ‘regeneration’.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2nd Objection: But there is no such thing as initial regeneration, distinct from actual, as here is supposed. Wherever the Spirit is infused to regenerate, He does, in the first instant, actually regenerate: therefore there being, by your own confession (say they) no actual regeneration in any infant ordinarily at his baptism, there is then no regeneration at all, this distinction of initial and actual regeneration being but a toy and a new device, without warrant from the Scripture. Answer. If this objection contain a truth without equivocation, I confess the position to be a toy indeed. But there may lie some ambiguity in the terms of ‘initial’ and ‘actual’, which being cleared, the objection may perhaps appear as weak as they declare themselves rash and uncharitable who took upon them to confute that distinction which they never understood, nor would ever vouchsafe so much as to hear explicated by myself, either in public or private. Touching the distinction of initial and actual regeneration, I have sufficiently declared before, in my second chapter, in what sense I use it. I will therefore forbear to repeat what there I have written. The reader may view it at his pleasure. If any man demand express Scriptures for the very terms, he will soon declare of what spirit he is. But if by sufficient consequence the distinction be not clearly deduced thence, he shall then have cause to complain. Let him view the foundation on which it is built, and afterwards tell me his mind if he remain unsatisfied. In the meantime I shall only add thus much: that by initial and actual regeneration, I do not mean to insinuate two several kinds of spiritual life, for which, I acknowledge, there is no footing in Scripture: but I understand only two distinct considerations in respect of the degrees of spiritual life in the same subject, which the places of Scripture before alleged in chapter 2 do sufficiently warrant. For, by ‘life’ in Scripture is sometimes meant the soul infused as the principle of life; sometimes the very actual being and enlivening of the subject by that soul, making it actually to produce the actions of life. Hence I distinguish life into initial and actual: not as if the Spirit were not actually communicated, or did not actually work, or actually begin, from the very first instant, to dispose and prepare the soul to future actual newness of life, by infusing some potential and seminal grace; but my meaning is that the Spirit does not at that time ordinarily so plenarily change and renew the whole man as to work in him either actual faith, hope, or love, etc., or so much as the habits of these or other particular graces for the present, as afterward He does. Something the Spirit does from his first entrance toward actual regeneration; therefore we call that first work initial, thereby understanding the first disposition to, or degree of, actual regeneration. But forasmuch as that first work does not (for ought we know) extend to a present actual change of the whole man in the same manner and degree that afterward is wrought in him at his effectual calling, therefore we call that latter work actual regeneration. This ought not to seem strange to any: for just so it is in the course of nature. So soon as the reasonable soul is infused, there is in some sense (not every way, in respect of degrees) a rational life. But how? The soul is there, and in that soul are included all the principles of reason: but the soul does not send forth those principles into action (unless in some insensible manner by little and little preparing the infant unto human actions) till afterward, when the senses begin to act.¹ Before that time, the rational life cannot wholly be denied to be in an infant, because the rational soul is actually in his body: yet forasmuch as the infant has not at that time the actual use of reason, for this cause we call the further perfection of his natural principles, b e%2C+there+is+no+footing+in+Scripture%3A+but+I+understand+only+two+distinct+considerations+in+respect+of+the+degrees+of+spiritual+life+in+the+same+subject%2C+which+the+places+of+Scripture+before+alleged+in+chapter+2+do+sufficiently+warrant.+For%2C+by+%E2%80%98life%E2%80%99+in+Scripture+is+sometimes+meant+the+soul+infused+as+the+principle+of+life%3B+sometimes+the+very+actual+being+and+enlivening+of+the+subject+by+that+soul%2C+making+it+actually+to+produce+the+actions+of+life.+Hence+I+distinguish+life+into+initial+and+actual%3A+not+as+if+the+Spirit+were+not+actually+communicated%2C+or+did+not+actually+work%2C+or+actually+begin%2C+from+the+very+first+instant%2C+to+dispose+and+prepare+the+soul+to+future+actual+newness+of+life%2C+by+infusing+some+potential+and+seminal+grace%3B+but+my+meaning+is+that+the+Spirit+does+not+at+that+time+ordinarily+so+plenarily+change+and+renew+the+whole+man+as+to+work+in+him+either+actual+faith%2C+hope%2C+or+love%2C+etc.%2C+or+so+much+as+the+habits+of+these+or+other+particular+graces+for+the+present%2C+as+afterward+He+does.+Something+the+Spirit+does+from+his+first+entrance+toward+actual+regeneration%3B+therefore+we+call+that+first+work+initial%2C+thereby+understanding+the+first+disposition+to%2C+or+degree+of%2C+actual+regeneration.+But+forasmuch+as+that+first+work+does+not+%28for+ought+we+know%29+extend+to+a+present+actual+change+of+the+whole+man+in+the+same+manner+and+degree+that+afterward+is+wrought+in+him+at+his+effectual+calling%2C+therefore+we+call+that+latter+work+actual+regeneration.+This+ought+not+to+seem+strange+to+any%3A+for+just+so+it+is+in+the+course+of+nature.+So+soon+as+the+reasonable+soul+is+infused%2C+there+is+in+some+sense+%28not+every+way%2C+in+respect+of+degrees%29+a+rational+life.+But+how%3F+The+soul+is+there%2C+and+in+that+soul+are+included+all+the+principles+of+reason%3A+but+the+soul+does+not+send+forth+those+principles+into+action+%28unless+in+some+insensible+manner+by+little+and+little+preparing+the+infant+unto+human+actions%29+till+afterward%2C+when+the+senses+begin+to+act.%C2%B9+Before+that+time%2C+the+rational+life+cannot+wholly+be+denied+to+be+in+an+infant%2C+because+the+rational+soul+is+actually+in+his+body%3A+yet+forasmuch+as+the+infant+has+not+at+that+time+the+actual+use+of+reason%2C+for+this+cause+we+call+the+further+perfection+of+his+natural+principles%2C+by+tract+of+time+attained%2C+when+reason+puts+itself+into+act%2C+actual+rational+life%3B+and+we+term+the+same+life%2C+in+respect+of+the+first+degree+and+principles+thereof%2C+which+together+with+the+reasonable+soul+in+the+first+infusion+thereof+it+received%2C+initial+life.+%C2%B9+%E2%80%9CHe+%28namely+God%29+has+therefore+given+to+the+human+soul+a+mind%2C+in+which+reason+and+understanding+in+an+infant+are%2C+as+it+were%2C+asleep%E2%80%94so+that+they+seem+almost+not+to+exist%E2%80%94yet+are+to+be+awakened+and+exercised+with+the+advance+of+age%2C+by+which+the+mind+becomes+capable+of+knowledge+and+instruction%2C+and+fit+for+the+perception+of+truth+and+the+love+of+good.%E2%80%9D+Augustine%2C+City+of+God%2C+bk.+22%2C+ch.+24.+To+the+same+purpose+also+he+writes%2C+bk.+2%2C+Of+Sin%2C+ch.+25+and+elsewhere.+This+is+no+more%2C+in+substance%2C+than+what+we+have+learned+from+St.+Augustine%2C+Calvin%2C+Peter+Martyr%2C+Junius%2C+Daneus%2C+Dr.+Whitaker%2C+Zanchius+and+sundry+others%2C+whose+judgments+have+been+at+large+set+down+in+this+treatise+in+sundry+places+upon+sundry+occasions.+And+shall+any+man+think+it+nothing+in+a+magisterial+humor+to+trample+so+many+worthies+under+his+feet+at+once%2C+as+if+he+were+wiser+than+all+others%3F+If+it+be+only+the+terms+that+displease+him%2C+because+perhaps+the+same+are+not+found+in+any+of+these+authors%2C+he+shall+but+show+himself+a+caviller+to+quarrel+them%2C+unless+he+can+show+that+the+terms+are+used+to+signify+that+which%2C+in+substance%2C+these+authors+do+not+allow+and+teach.+Briefly+then%2C+this+objection+is+grounded+upon+a+false+information+and+supposition%3A+for+it+supposes+me+to+use+the+terms+of+initial+and+actual+regeneration+as+intending+thereby+to+teach+that+there+be+two+distinct+species+or+kinds+of+regeneration%3B+whereas+my+meaning+is+only+to+speak+of+the+same+spiritual+life+in+two+distinct+considerations%2C+in+respect+of+degrees.+And+so+the+objection+fights+with+a+shadow%2C+and+not+with+me.+But+it+will+be+replied+that+in+regeneration+there+be+no+degrees%2C+but+that+it+is+performed+and+dispatched+at+an+instant%2C+as+natural+generation+is.+It+is+true%2C+say+they%2C+that+there+be+degrees+in+renovation%2C+which+notes+a+growth+in+sanctification+in+a+man+regenerated.+But+regeneration+is+never+taken+for+any+other+than+for+the+first+act+of+the+Spirit+entering+into+a+Christian+and+begetting+him+a+new+man+in+Christ%2C+in+the+very+first+moment+of+his+entrance.+Therefore+the+distinction+of+actual+and+initial+regeneration+cannot+be+admitted+in+any+sense.+I+answer+that+those+two+words%2C+%E2%80%98regeneration%E2%80%99+and+%E2%80%98renovation%E2%80%99%2C+may+perhaps+by+some+be+used%2C+the+one+to+signify+the+first+infusion+of+grace+making+a+man+actually+a+new+creature+in+all+parts+at+once%2C+and+the+other+to+note+the+continual+growth+of+a+Christian+in+grace+infused%3B+if+men+will+beforehand+give+notice+of+their+meaning%2C+and+for+the+more+clear+expression+of+themselves+will+say%3A+when+I+speak+of+the+first+infusion+of+grace%2C+I+will+use+the+word+%E2%80%98regeneration%E2%80%99+to+express+it+by%3B+and+when+I+speak+of+continual+growth+from+one+degree+unto+another%2C+I+will+ever+call+that+%E2%80%98renovation%E2%80%99.+Men+may%2C+if+they+please%2C+make+use+of+words+as+they+do+of+counters+in+casting+of+accounts%2C+wherein%2C+of+the+same+set+and+value%2C+some+counters+are+made+to+stand+for+pounds%2C+some+for+shillings%2C+and+some+for+pence.+And+yet%2C+as+those+counters+which+stand+for+pence+might+as+well+have+stood+for+pounds+as+those+that+do+stand+for+pounds%2C+if+it+had+pleased+him+that+set+them+to+have+so+disposed+them%2C+so+men+may+put+words+of+the+same+value+and+native+signification+to+signify+diverse+things%2C+by+a+liberty+justifiable+enough+in+use+of+speech%3B+and+yet+those+words+may+without+wrong+be+used+by+others+to+signify+other+things%3A+always+provided+that+when+a+man+uses+a+word+in+a+sense+different+either+from+the+prime+signification+of+it%2C+or+from+the+common+acceptation+of+it%2C+he+give+warning+that+wherever+he+uses+such+a+word%2C+he+would+be+understood+in+such+or+such+a+sense%2C+and+not+according+to+the+etymology+of+it%2C+nor+according+to+the+common+use+of+it.+And+thus+I+grant+that%2C+if+it+please+any+divine+to+say+that+he+will+ever+restrain+regeneration+to+note+the+first+infusion+of+grace%2C+and+by+renovation+signify+a+daily+increase+of+grace%2C+in+all+his+speeches+or+writings%2C+for+want+of+fitter+terms+to+express+himself+in%2C+he+may+do+it.+But+if+any+man+shall+say+that+the+proper+meaning+of+the+word+%E2%80%98regeneration%E2%80%99%2C+and+of+that+which+the+Scriptures+call+it%2C+is+the+first+infusion+of+the+Spirit+actually+to+make+a+man+a+new+creature+in+all+parts+at+once%2C+so+as+in+this+there+can+be+no+degrees%3B+and+affirm+that+so+the+Scriptures+do+ever+use+that+word%3B+and+also+add+that+by+%E2%80%98renovation%E2%80%99+the+Scripture+never+means+the+same+thing+that+it+intends+by+%E2%80%98regeneration%E2%80%99%2C+but+that+%E2%80%98renovation%E2%80%99+is+ever+put+for+another+thing%2C+to+wit%2C+for+continual+growth+in+grace+once+infused%2C+I+must+crave+leave+to+dissent+from+him+and+to+deny+his+assertion.+For+neither+is+there+any+such+difference+in+the+proper+signification+of+these+words+but+that+they+may+both+signify+one+and+the+same+thing%3B+nor+is+the+Scripture+so+nice+as+to+observe+such+a+difference+between+them+as+the+objectors+would+persuade+us.+That+in+the+proper+signification+there+is+nothing+either+why+%E2%80%98regeneration%E2%80%99+should+signify+only+the+first+infusion+of+grace%2C+or+rather+this+than+the+daily+growth+of+it%3B+nor+why+%E2%80%98renovation%E2%80%99+should+not+signify+the+first+beginnings+of+the+new+creature+as+well+as+the+growth+of+it%2C+those+that+are+skillful+in+the+tongues+will+easily+bear+me+witness%3B+and+I+take+them+that+make+this+nice+distinction+between+these+two+words+to+be+better+skilled+than+to+say+that+these+words+in+their+proper+signification+will+justify+this+conceit.+Therefore+they+must+of+necessity+fly+to+the+Scriptures+and+prove+that+there+%E2%80%98regeneration%E2%80%99+is+always+so+restrained+as+that+it+always+signifies+the+first+infusion+of+grace%2C+and+not+that+further+work+of+the+Spirit+which+admits+of+degrees+and+is+ever+expressed+by+%E2%80%98renovation%E2%80%99%3B+or+else+their+conceit+will+prove+but+a+fancy+too+weak+to+ruin+the+distinction+of+initial+and+actual+regeneration.+But+the+Holy+Ghost+in+the+Scriptures+does+not+observe+this+nicety+of+words%3A+for+sometimes+we+shall+find+%E2%80%98regeneration%E2%80%99+put+for+sanctification+expressed+by+obedience+unto+Christ+and+his+Gospel%2C+or+else+for+the+beginning+of+glory%2C+and+not+for+the+first+infusion+of+grace+only.+So+in+Mt.+19%3A28%2C+our+Saviour+thus+gives+answer+to+Peter+demanding+of+him+what+they+should+have+who+had+forsaken+all+to+follow+Him%3A+%E2%80%98Verily+I+say+unto+you+that+ye+which+have+followed+me%2C+in+the+regeneration%2C+when+the+Son+of+man+shall+sit+in+the+throne+of+his+glory%2C+ye+also+shall+sit+upon+twelve+thrones%2C+etc.%E2%80%99+where+the+word+%E2%80%98regeneration%E2%80%99+cannot+be+taken+for+the+first+infusion+of+grace+only%2C+because+it+notes+such+a+thing+as+Christ%E2%80%99s+disciples+did+actually+exercise+and+express+in+receiving+of+his+Gospel%2C+or+else%2C+as+Beza+rather+thinks%2C+it+signifies+the+very+state+of+glory+wherewith+they+shall+be+invested+at+the+latter+day%3B+and+the+words+ought+to+be+read+thus%3A+ye+that+have+followed+Me+%28here+making+the+comma%29%2C+in+the+regeneration%2C+when+the+Son+of+man+shall+sit+in+the+throne+of+his+glory%2C+ye+shall+sit%2C+etc.%3B+that+is%2C+you+that+follow+me+now+shall+hereafter%2C+when+the+elect%2C+being+perfectly+sanctified%2C+begin+their+kingdom+of+glory%2C+namely+at+the+latter+day%2C+when+I+shall+come+again+in+glory%2C+then+shall+ye+sit+upon+twelve+thrones.+And+so+did+Saint+Augustine+long+before+expound+that+text.+Therefore+the+word+is+not+restrained+only+to+signify+the+first+infusion+of+the+Spirit+and+of+grace+by+the+Spirit.+Again%2C+sometimes+we+shall+find+%E2%80%98regeneration%E2%80%99+and+%E2%80%98renovation%E2%80%99+put+one+for+another%2C+the+one+to+explicate+the+other%3A+for+so+Zanchi+says+expressly+in+his+commentary+upon+Ephesians+5.+And+he+says+the+truth%3A+for+so+the+apostle+uses+them%2C+Titus+3%3A5%2C+%E2%80%98according+to+his+mercy+He+saved+us%2C+by+the+laver+of+regeneration+and+renewing+of+the+Holy+Ghost%3B%E2%80%99+where+the+apostle+uses+those+two+words+of+%E2%80%98regeneration%E2%80%99+and+%E2%80%98renovation%E2%80%99+not+to+signify+two+things%2C+but+the+latter+declares+the+meaning+of+the+former%2C+as+Beza+well+observes.+Wherefore+I+conclude+that%2C+forasmuch+as+the+Holy+Scripture+does+not+restrain+the+word+%E2%80%98regeneration%E2%80%99+to+the+first+infusion+of+the+Spirit%2C+or+of+grace+by+the+Spirit%2C+wherein+there+be+no+degrees%2C+but+extends+it+further+even+to+that+further+work+of+the+Spirit+wherein+%28as+all+grant%29+there+be+degrees%2C+the+distinction+of+regeneration+into+initial+and+actual+still+stands+upright+without+battering+by+this+second+objection%2C+that+will+admit+of+no+degrees+in+that+which+the+Scripture+everywhere+calls+by+the+name+of+%E2%80%98regeneration%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Cornelius+Burges%2C+Baptismal+Regeneration+of+Elect+Infants+Professed+by+the+Church+of+England...+%28Oxford%3A+Curteyn%2C+1629%29%2C+ch.+9%2C+p.+239-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e19e8942b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e19e8942b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=2nd%20Objection%3A%20But%20there%20is%20no,calls%20by%20the%20name%20of%20%E2%80%98regeneration%E2%80%99." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fourthly, does she lean upon God before she can come? must He work the first motion to make her willing, before she can believe in Him? Then how are those to be here reproved that would make man’s will to be the author of its first motions unto God. Pelagius was a great defender of it… Lastly, he would maintain (and the Arminians still from him) that grace did indeed help a good work, but it had its first motion from our wills, or at least might have; and the will had a negative voice, and might resist and cross grace which did not work irresistibly in the soul, to force the soul to Him. … Does God move the will attending Him in duties, first? Secondly, when the will is thus moved, does it then come? when it is drawn, does it run? Then this reproves the Enthusiasts of old, the Anabaptists, Antinomians, Seekers of our days, that hold, first, there is no need of duties.</p></blockquote>

<blockquote><p>But the truth is this, the Lord must let in an influence of some special motion and operation and leave some impression of spiritual power upon the will to enable it to act, not only to concur with the act thereof. God gives a man ability whereby he may will, does not 〈◊〉 with him by assistance and providence when He wills as one in whom we live and move. Of the first of these it’s true which many of the ancients speak, God works without us, many things in us, i.e. unto which we being in no causal ability at all, God gives us ability to do that which is pleasing and spiritual, to the obtaining whereof, we had no causal ability of our own; when the Lord Christ raised Lazarus now dead and smelling in the grave, He did not concur with the action and motion of his soul in rising out of the grave, but without any causal concurrence or help of Lazarus, He put a soul into his body, whereby He was enabled to stir and move. So it is with a soul dead in sins and tresspasses, when the mind and will have no ability for any spiritual act, not able to take off that deadness and indisposition that is there, the Lord without the will, without any causal concurrence of it, lets in ability into it for the work, and concurs with it in the work. So Paul expresses this manner of God’s work, 2 Cor. 4:6, He causes light to shine out of darkness; He gives light and being out of darkness, without the help of light, and then concurs with the light in the shining of it; God lets in an influence to the will, not only lends a concurrence to the work.</p></blockquote>

<blockquote><p>Whereas this must be observed carefully and forever maintained as the everlasting Truth of God, that the Lord gives a power-spiritual to the work which it had not before He concurs with the act of that power when it is put forth; He gives him a being in the 〈◊〉[state?] of grace, before He leads out the act of that being. He first lets in an influence of a powerful impression upon the faculty of the will, before He concurs with the act 〈◊〉deed. He gives a heart of flesh, and then causes them to walk in his ways: As if one could put a principle of life and motion into another, and then draw forth the act of that power to the performance of the work…</p></blockquote>

<blockquote><p>Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients. 1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth. 2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. … 3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same. 4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.</p></blockquote>

+and+saving+graces%2C+and+supernatural+qualities+created+in+us+by+the+Holy+Spirit+and+acted%2C+excited+and+moved+as+supernatural+and+heavenly+habits+to+act+with+the+vital+influence+of+our+understanding%2C+will+and+affections.+I+prove+the+former+part%3A+1.+Because+such+a+union+of+the+Person+of+the+Holy+Ghost+in+us%2C+believing%2C+loving%2C+joying%2C+praying+and+immediately+in+us%2C+were+that+blasphemous+deifying+and+Goding+of+the+saints%2C+so+as+believing%2C+loving%2C+praying+were+not+our+works%2C+but+the+immediate+acts+of+the+Holy+Ghost%2C+and+either+the+faint+manner+of+believing%2C+or+the+cold+slacked+loving%2C+and+praying+of+saints%2C+or+their+not+believing%2C+and+sinful+omission+of+the+acts+of+faith%2C+love%2C+praying%2C+rejoicing%2C+could+not+be+more+imputed+to+saints+as+their+sinful+defects+and+transgressions+%28but+must+be+laid+on+the+Holy+Ghost%E2%80%99s+score%29+than+we+can+impute+the+splitting+of+a+ship+to+the+ship+itself+and+not+to+the+negligent+and+willful+pilot+who+of+purpose+dashed+the+vessel+on+a+rock%3B+but+we+must+not+in+reason+blame+the+ship%2C+but+the+pilot%3B+for+the+loss+of+the+ship+is+the+only+and+proper+fault+of+the+man+that+stirred+the+ship%2C+and+the+ship+is+innocent+and+harmless+timber%3A+Now+what+sin+can+be+in+the+saints+in+these+supernatural+acts%2C+if+the+Holy+Ghost+immediately+in+his+own+Person+stir+the+helm%2C+and+only%2C+without+us%2C+act+these+in+us%3F+We+might+with+as+good+reason+say+the+shop+that+a+man+works+in+does+make+the+portrait%2C+which+is+a+great+untruth%2C+since+the+artificer+in+the+shop+does+it%E2%96%AA+as+say+that+the+saints+do+pray%2C+believe%2C+rejoice%2C+if+the+Holy+Ghost+immediately+do+all+these+in+them%2C+as+in+a+shop.+%E2%80%A6+3.+The+third+%5Berroneous%5D+way+is+that+free-will+is+said+to+believe%2C+repent%2C+love+God%2C+by+a+mere+extrinsical+denomination%2C+because+it+carries+that+grace+which+formally+and+only+does+perform+all+these+supernatural+actions%3B+so+grace+does+all+and+free-will+is+a+mere+patient+that+confers+no+vital+subordinate+and+active+influence+in+these+acts%3B+as+we+say%2C+the+apothecaries%E2%80%99+glass+heals+the+wound%2C+because+the+oil+in+the+glass+works+the+cure%2C+when+the+glass+does+actively+contribute+nothing+to+the+cure%3B+or+the+ass+makes+rich%2C+when+it+carries+the+gold+that+enriches+only%3B+this+sense+Antinomians+hold+forth+and+make+us+mere+patients+and+blocks+in+the+way+to+heaven%2C+and+this+sense+Jesuits%2C+especially+Martinez+de+Ripald%2C+falsely+charges+upon+Luther+and+Calvin%3B+and+the+Council+of+Trent%2C+inspired+with+the+same+lying+spirit%2C+says+the+same.+4.+The+fourth+%5Band+correct%5D+sense+is+that+grace+and+free-will+does+work+so+as+grace+is+the+principal%2C+first+inspiring+and+fountain+cause%3A+1.+It+being+a+new+supernatural+disposition+and+habit+in+the+soul%2C+Jn.+14%3A23%3B+1+Jn.+2%3A27%3B+3%3A9%3B+Jn.+4%3A14%3B+Isa.+44%3A3-4%3B+Eze.+36%3A26-27%3B+Dt.+30.6%3B+a+good+treasure+or+stock+of+grace%2C+Mt.+12%3A35%3B+Lk.+6%3A45.+And+also+actually+it+determines%2C+sweetly+inclines+and+stirs+the+will+to+these+acts%3B+yet+so+as+free-will+moves+actively%2C+freely%2C+and+confers+a+radical%2C+vital+and+subordinate+influence+and+is+not+a+mere+patient+in+all+these%2C+as+Antinomians+dream%2C+Ps.+119%3A32.+%E2%80%98I+will+run+the+way+of+thy+commandments%2C+when+thou+shall+enlarge+my+heart%2C%E2%80%99+Jn.+14%3A12%2C+%E2%80%98he+that+believeth+in+Me%2C+the+works+that+I+do%2C+he+shall+do%2C+and+greater+than+these%2C%E2%80%99+Mt.+12%3A50%2C+%E2%80%98He+that+does+the+will+of+my+heavenly+Father%2C+the+same+is+my+brother%2C%E2%80%99+etc.+1+Cor.+9%3A24%2C+%E2%80%98So+run+that+ye+may+obtain%2C%E2%80%99+Rev.+2%3A2%2C+%E2%80%98I+know+thy+works+and+thy+labour%2C%E2%80%99+1+Thess.+1%3A3%2C+%E2%80%98Remembering+without+ceasing+your+work+of+faith+and+labor+of+love%2C+and+patience+of+hope%3A%E2%80%99+1.+We+are+not+dead+in+supernatural+works%2C+and+mere+blocks%2C+Rom.+6%3A11%2C+%E2%80%98We+are+alive+unto+God+in+Jesus+Christ%2C%E2%80%99+Eph.+2%3A1%2C+%E2%80%98He+hath+quickened+us%2C%E2%80%99+Rev.+2%3A3%2C+%E2%80%98For+my+name%E2%80%99s+sake+thou+hast+laboured%2C+and+had+not+fainted%2C%E2%80%99+1+Cor.+15%3A58%2C+%E2%80%98Be+ye+steadfast%2C+unmoveable%2C+always+abundant+in+the+work+of+the+Lord.%E2%80%99+There+is+activity+in+the+Spirit+to+lust+against+the+flesh%2C+Gal.+5%3A17%3B+Rom.+7%3A15.+Nor+is+the+blessedness+of+the+saints+only+passive+in+receiving%3A+though+to+be+justified+and+receive+Christ%E2%80%99s+righteousness+be+the+fountain+blessedness%2C+Ps.+32%3A1%3B+Rom.+4%3A6-7%3B+Gal.+3%3A13.+But+the+Scripture+speaks+of+a+true+and+solid+blessedness+in+action%2C+Ps.+119%3A1%2C+%E2%80%98Blessed+are+the+undefiled+in+the+way%2C%E2%80%99+Isa.+56%3A2%2C+%E2%80%98Blessed+is+the+man+that+doth+this%2C%E2%80%99+Jm.+1%3A12%2C+%E2%80%98Blessed+is+the+man+that+endureth+temptation%2C%E2%80%99+Ps.+119%3A2%2C+%E2%80%98Blessed+are+they+that+keep+his+testimonies%2C%E2%80%99+Ps.+106%3A3%2C+%E2%80%98Blessed+are+they+that+keep+judgment%2C+Rev.+22%3A14%2C+%E2%80%98Blessed+are+they+that+do+his+commandments%2C+Mt.+5%2C+%E2%80%98Blessed+are+they+that+mourn%2C+that+hunger+and+thirst%3B%E2%80%98+Then+there+must+be+a+part+of+blessedness+in+sanctification%2C+as+in+justification%3B+though+the+one+be+the+cause%2C+the+other+the+effect.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65+%26+470-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec223b0914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec223b0914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Assertion%201%3A%20In%20the%20first%20moment,the%20cause%2C%20the%20other%20the%20effect." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Synonyms [of regeneration] more properly signifying are: … II. Conversion. This word sometimes denotes the act of God alone; sometimes the complete act of God and man; sometimes the formal act of man, so that it is of the same notion as the word penitence and repentance. The first signification looks to the act of first or preventing grace, and properly pertains here and makes a synonym of regeneration. In the Pelagian controversies concerning grace and free will, such conversion is wont to be called by theologians the first moment of conversion, where man conducts himself purely passively. The second signification looks to the act of God’s second grace, by which man, instructed and informed through preventing or first grace with a new habitual principle of spiritual life impressed by the omnipotent facility of God, is premoved and excited by God to perform acts and to actually elicit acts of spiritual life, or of repentance and faith, Jer. 31:18; Song 1:4. The third signification properly looks to the act of man. For man is the proper and formal principle of actual penitence or repentance, of conversion from his sin—not God, who is the effective principle. For He Himself does not do, so as to be that proper and particular cause (which, for example, is Peter repenting), that is, He does not grieve, does not repent, does not weep bitterly, does not die to sin, does not rise to new life; but He makes us to do, as Augustine speaks. We ourselves therefore do those things, but not of ourselves—as I remember reading that distinction in the homilies of Ardentius Pictaviensis [Ardent of Poitiers]. … II. Sometimes it [‘regeneration’] denotes: 1. The first impression of the new creature, or the change from non-being to spiritual being. 2. Its conservation, continuation, and augmentation. 3. Its instauration and renovation. 4. Its consummation and final perfection. … As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>

0%A6+II.+Sometimes+it+%5B%E2%80%98regeneration%E2%80%99%5D+denotes%3A+1.+The+first+impression+of+the+new+creature%2C+or+the+change+from+non-being+to+spiritual+being.+2.+Its+conservation%2C+continuation%2C+and+augmentation.+3.+Its+instauration+and+renovation.+4.+Its+consummation+and+final+perfection.+%E2%80%A6+As+for+regeneration+or+conversion+in+the+second+moment%2C+it+can+be+analogically+conceived+thus%3A+I.+The+one+generating+is+the+Holy+Spirit+through+second+grace+as+through+a+plastic+power.+II.+The+matter+of+generation+and+seed+is+the+new+creature+implanted+in+the+first+moment+of+regeneration%2C+from+which+those+acts+are+elicited.+III.+The+form+is+the+second+act+of+faith%2C+which+as+it+were+actuates+and+%CF%80%CE%BB%CE%B7%CF%81%CE%BF%E1%BF%96+%5Bpl%C4%93roi%2C+fills%2Ffulfills%5D+that+seed+of+regeneration.+IV.+Preparatory+dispositions+are+certain+acts+of+repentance+preceding+faith.+V.+Mixture+is+the+actual+union+of+faith+with+the+promises+of+the+Gospel%2C+Heb.+4%3A2.+VI.+Animation+of+the+fetus%2C+or+introduction+of+the+form%2C+is+when+by+actual+faith+Christ+is+applied+for+justification.+VII.+The+first+thing+emanating+from+the+form+now+introduced%2C+or+the+elicited+act%2C+is+the+reflexive+act+of+faith.+VIII.+To+which+follows+the+impetrated+act%3A+namely%2C+the+%E1%BC%90%CE%BD%CE%AD%CF%81%CE%B3%CE%B5%CE%B9%CE%B1+%5Benergeia%2C+energy%2Factivity%5D+of+charity.+IX.+The+process+and+succession+of+acts+which+dispose+to+the+production+of+the+first+actual+faith+nearly+holds+itself+as+that+of+the+human+fetus%2C+which%2C+although+the+rational+soul+infused+is+specific%2C+by+which+the+vegetative+and+sensitive+are+contained+%28in+the+same+way+as+the+binary+is+in+the+ternary+and+the+triangle+in+the+quadrangle%29%2C+yet+man+first+lives+the+life+of+a+plant%2C+then+of+an+animal%2C+then+of+a+man.+So+faith%2C+although+it+is+the+first+act+of+the+new+creature%2C+indeed+as+it+were+the+radical+principle+of+the+whole+new+creature%2C+yet+its+second+act%2C+at+least+the+complete+and+formed+or+sensible+one%2C+is+exercised+nearly+among+the+last.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+432-65+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f8de45373.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f8de45373.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Synonyms%20%5Bof%20regeneration%5D%20more%20properly%20signifying,is%20exercised%20nearly%20among%20the%20last." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.</p></blockquote>

<blockquote><p>(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.</p></blockquote>

0e68b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4e0e68b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=%283%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly%3A,grace.%20It%20is%20otherwise%20called%20conversion." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.</p></blockquote>

</figure><figure class="quote" id="q-9a1c37103a" data-kw="">
<blockquote><p>I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

lasquotes.github.io%2Fquote%2F9a1c37103a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a1c37103a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=I%20know%20no%20orthodox%20divine%20in,very%20proper%20notion%20of%20a%20condition." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bbc82a597e" data-kw="">
<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’</cite>, p. 73</span></figcaption>

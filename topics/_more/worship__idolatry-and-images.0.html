</figure><figure class="quote" id="q-0150883e5c" data-kw="">
<blockquote><p>…those who are not contented with His voice, but seek His visible form, substitute imaginations and phantoms in His place. But here arises a difficult question, for God made Himself known to the patriarchs in other ways besides by His voice alone; thus Abraham, Isaac and Jacob knew Him not only by hearing, but by sight. Moses himself saw Him in the midst of the burning bush; and He also manifested Himself to the prophets under visible figures…. And yet God was not forgetful of Himself when He thus presented Himself to the sight of His servants. Wherefore, this argument does not appear to be valid and good, that it is sinful to represent God in a visible image, because His voice was once heard without His being seen [Dt. 4:15-16]; when, on the other side, it is easy to object that visible forms have often been exhibited, wherein He testified His presence. The solution is twofold: first, that, although God may have invested Himself in certain forms for the purpose of manifesting Himself, this must be accounted as a peculiar circumstance, and not be taken as a general rule;</p></blockquote>

<blockquote><p>why does Moses in this place [Dt. 33:16] set Him in the bush? It is because God had there showed Himself unto Him… God considers how it is for our benefit to have some familiarity with Him: and thereupon He yields to our rudeness, and takes upon Him as it were a new shape, howbeit not which is contrary (as I said afore), but to the intent that we should not be scared, nor take occasion to shrink from Him. Now then, He allures us gently, and therewithal He stops to us and makes Himself as it were mean [lowly] unto us…. But we see how He showed Himself to the fathers of old-time under certain shapes. As for example when He talked with Jacob in Bethel, it was because Jacob needed such confirmation (Gen. 28:13)… …as if he should say, ‘…he appeared to me in the bush, and there I knew his majesty…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 196</cite>, pp. 1215-16</span></figcaption>

</figure><figure class="quote" id="q-e683d53964" data-kw="">
<blockquote><p>if any man go about to express God’s Majesty by any shape: he does Him wrong, and it is high treason to Him, because He is uncomprehensible in his glory… Now we see that the Papists have gone about to express God by shapes: therefore it follows that they have marred all religion. And whereas they allege that there were cherubins painted upon the vail of the Temple, and that two likewise did cover the ark: it serves to condemn them the more. When the Papists pretend that men may make any manner of image: What, say they? Has not God permitted it? No: but the imagery that was set there, served to put the Jews in mind that they ought to abstain from all counterfeiting of God, insomuch that it was a mean to confirm them the better, that it was not lawful for them to represent God’s Majesty, or to make any resemblance thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 23, the 5th upon Dt. 4</cite>, p. 138</span></figcaption>

</figure><figure class="quote" id="q-aed3423aa7" data-kw="">
<blockquote><p>It is true that the Lord occasionally manifested his presence by certain signs, so that He was said to be seen face to face; but all the signs He ever employed were in apt accordance with the scheme of doctrine, and, at the same time, gave plain intimation of his incomprehensible essence. For the cloud, and smoke, and flame, though they were symbols of heavenly glory (Dt. 4:11), curbed men’s minds as with a bridle, that they might not attempt to penetrate farther… The Holy Spirit appeared under the form of a dove, but as it instantly vanished, who does not see that in this symbol of a moment, the faithful were admonished to regard the Spirit as invisible, to be contented with his power and grace, and not call for any external figure? God sometimes appeared in the form of a man, but this was in anticipation of the future revelation in Christ, and, therefore, did not give the Jews the least pretext for setting up a symbol of Deity under the human form. The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3</cite>, pp. 122-23</span></figcaption>

e+eye%2C+but+from+every+human+sense%2C+and+curbing+presumption%3F%E2%80%A6+Moreover%2C+all+men+of+sound+judgment+acknowledge+that+the+cherubim+in+question+belonged+to+the+old+tutelage+of+the+law.+It+is+absurd%2C+therefore%2C+to+bring+them+forward+as+an+example+for+our+age.+For+that+period+of+puerility%2C+if+I+may+so+express+it%2C+to+which+such+rudiments+were+adapted%2C+has+passed+away.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+trans.+Henry+Beveridge+%281559%3B+Edinburgh%3A+Calvin+Translation+Society%2C+1845%29%2C+vol.+1%2C+bk.+1%2C+ch.+11%2C+section+3%2C+pp.+122-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faed3423aa7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/aed3423aa7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=It%20is%20true%20that%20the%20Lord,rudiments%20were%20adapted%2C%20has%20passed%20away&amp;text=It%20is%20true%20that%20the%20Lord%20occasionally%20manifested&amp;text=which%20such%20rudiments%20were%20adapted%2C%20has%20passed%20away" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>

<blockquote><p>It is true, likewise, that God directed his people under the Law to bend and bow themselves toward the ark and the temple, wherein the ark was, and the mountain whereon the temple was situate: partly lest that rude people should turn their worship another way, partly because of his promise to hear them when they should pray toward the temple or the ark; partly because of his singular manner of presence in the ark: He was said to dwell between the cherubims, the ark is called his ‘foot-stool,’ and sometime the ‘face of God,’ ‘the glory of the Lord.’ It is reason, where God is present after an extraordinary manner, as when He spake out of the bush and the cloud, that adoration be directed to the place of his extraordinary presence. The altars, the offerings and other holy things wanted [lacked] the like presence and the like promise. The ark and the cherubims upon the ark were not seen [being in the Holy of Holies]: and therefore could not be readily abused to idolatry.</p></blockquote>

<blockquote><p>When Moses beheld the bush burning with fire, and yet no whit consumed, he wondered at the sight, and said, ‘I will now turn aside and see this great sight, why the bush is not burnt.’ But when God thereupon called unto him out of the midst of the bush, and said, ‘Draw not night hither,’ and told him who He was; Moses trembled, hid his face, and durst not behold God. Yet although being thus warned, we dare not draw so nigh; what doth hinder but we may stand aloof off, and wonder at this great sight? ‘Our God is a consuming fire;’ (Heb. 12:29) says the apostle: and a question we find propounded in the prophet, ‘Who among us shall dwell with the devouring fire? Who among us shall dwell with the everlasting burnings?’… With what astonishment then may we behold our dust and ashes assumed into the undivided unity of God’s own person; and admitted dwell here, as an inmate under the same roof? And yet in the midst of those everlasting burning, the bush to remain unconsumed, and to continue fresh, and green for evermore. Yea, how should not we with Abraham rejoice to see this day, wherein not only our nature in the person of our Lord Jesus is found to dwell for ever in those everlasting burnings; but, in and by Him, our own persons also are brought so night thereunto, that God does set his sanctuary among us, and dwell with us; and (which is much more) makes us ourselves to be the house and habitation, wherein He is pleased to dwell by his Spirit…</p></blockquote>

02.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b69904f602.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=When%20Moses%20beheld%20the%20bush%20burning,pleased%20to%20dwell%20by%20his%20Spirit&amp;text=When%20Moses%20beheld%20the%20bush%20burning%20with%20fire&amp;text=He%20is%20pleased%20to%20dwell%20by%20his%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…God was immediately present in and with the ark, the temple, the holy mountain, the bush, the cloud and the fire which came from heaven, speaking and manifesting Himself to his people by his own immediate voice and miraculous extraordinary presence: So that worshipping before these things had the same reason which makes the 24 elders in heaven worship before the throne. For in these things God did immediately manifest his presence, as well as in heaven. Though there be a difference in the degrees of the immediate manifestation of his presence in earth and in heaven, yet magne et minus non variant speciem [greater and less do not vary the species]. Now God is present in the sacrament, not extraordinarily, but in the way of an ordinary dispensation, not immediately but mediately. [While pictures of the ark, temple and Mt. Sinai might be lawfully made, because those things only extraordinarily revealed God’s presence at extraordinary times, and apart from that they did not but only revealed God’s presence in an ordinary manner (as like the sacraments, which pictures may be made of), yet there were no times at which the burning bush and the pillar and cloud of fire did not extraordinarily reveal God’s presence.] Yet to no better purpose they [formalist opponents] tell us that when God spake Abraham fell on his face. And when the fire came down at Elijah’s prayer, the people fell on their faces. What is this to the purpose? And how shall kneeling in a mediate and ordinary worship [such as in receiving the Supper] be warranted by kneeling in the hearing of God’s own immediate voice, or in seeing the miraculous signs of his extraordinary presence?… Moreover it is objected out of Lev. 9:24; 2 Chron. 7:3; Mic. 6:6; 2 Chron. 29:28-30, that all the people fell on their faces before the legal sacrifices when the fire consumed the burnt-offering. Whereunto it may be answered that the fire which came from God and consumed the burnt offerings was one of the miraculous signs of God’s extraordinary and immediate presence… But if we will particularly consider all these places, we find in the first two, that beside the fire, the glory of the Lord did also appear in a more miraculous and extraordinary manner, Lev. 9:23, ‘The glory of the Lord appeared to all the people,’ 2 Chron. 7:1, 12, ‘The glory of the Lord filled the house.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, p. 69</span></figcaption>

<blockquote><p>The extraordinary presence of God was by his miraculous apparitions and discovering Himself by some miraculous token, vision, sign, or manifestation of his presence, as now here in this burning, and not consumed bush; here was a miraculous token of God’s presence. We shall and in the fifth of Joshua… I conceive, hence it is, the mountain in which Christ was transfigured is called, ‘the holy mountain,’ 2 Pet. 1:18… Why holy? Not as if it were holy at that time when the apostle writ that epistle, but it were manifest there was an extraordinary manifestation and sign of God’s presence, and so long as this extraordinary manifestation of God’s presence continued it was called ‘holy.’… And remember this place now, of God’s extraordinary miraculous manifestation of Himself in the bush was holy for that time, and no longer, wherein He did manifest Himself; for otherwise, in the time of the Law, it were unholy to offer up sacrifice there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Collection of Farewell Sermons preached by the Late London-Ministers… (London: 1662), Mr. Jenkin’s Afternoon Sermon</cite>, pp. 287-88</span></figcaption>

<blockquote><p>3. The apparition itself, it was a visible discovery; He was at this time seen by Moses, manifested to his eye in the daytime. 4. The form of this apparition, it was in a flame of fire… so God is called a consuming fire, but here is He seen in a fire not consuming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-hughes.html">George Hughes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of… Genesis, and of XXIII chap. of his second book, called Exodus… (d. 1667; 1672), on Ex. 3</cite>, p. 654</span></figcaption>

</figure><figure class="quote" id="q-2260bcf1bc" data-kw="">
<blockquote><p>God dwelt heretofore in his ark, inasmuch as He manifested his presence in it. But because the things which He set and made to be seen there were not [the] very nature, or the self-same perfections wherewith it is filled, but some simple effects of his power whereby the images of some of his perfections were in some sort delineated, it is evident that it cannot be truly said that the fulness of his Godhead dwelt there bodily [as in Col. 2:9]. Thus also manifested He Himself to Moses in the burning-bush, and afterwards to the apostles in cloven tongues as of fire, and before that the Holy Ghost appeared in the form of a dove. But besides that these manifestations being but transient, it cannot, upon them be affirmed that God ‘dwelt’ [as in Col. 2:9] in the bush or in the places where those other symbols appeared; besides this, I say, it is evident that the flame at the bush was not at all the divine nature, or any one of its perfections; and that neither the dove, nor the fiery tongues were any more the proper essence of the Holy Ghost or any one of his real and divine perfections, all these things being but forms created of God and consequently productions and works of his wherein He represented to his servants, as in a portrait or a rough-draught, some slight resemblance of what He is indeed. Whence it follows that though it might be said (which yet may not) of the places where these things appeared that the fulness of the Godhead dwelt in them, nevertheless it would be false to say that it dwelt in them bodily, it being clear that the things by reason whereof it should be said to have dwelt there, were not the body and the truth of his nature, but its shadow and symbol only… It remains then, we conclude, since the apostle here [in Col. 2:9] expressly asserts that all the fulness of the Godhead dwells bodily in Christ, that the divinity is in Him after a quite other manner than either in the symbols by which it is represented, or the creatures on which it sheds forth its grace and glory; that it so dwells in Jesus Christ as He has in Him, not some delineations and models by which it is figured forth, not those qualities and dispositions alone which it works by the presence of its grace in the most holy of its creatures, but its very self…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>49 Sermons upon the Whole Epistle… to the Colossians (d. 1670; London: White, 1672), pt. 2, 21st Sermon, on Col. 2:9</cite>, pp. 225-26</span></figcaption>

</figure><figure class="quote" id="q-00dece6c2a" data-kw="">
<blockquote><p>This fire was a type or declaration of the presence of God in the Person of the Son. For with respect unto the Father He is called an angel, the Angel of the Covenant; but absolutely in Himself, He was Jehovah, the God of Abraham, etc. And of his presence the fire was a proper representation. For in his nature He is as a consuming fire; and his present work was the delivery of the Church out of a fiery trial. This fire placed itself in a bush, where it burned, but the bush was not consumed: And although the continuance of the fire in the bush was but for a short season, a present appearance; yet thence was God said to dwell in the bush; the goodwill of Him that dwelt in the bush; Deut. 33:16. And this is so spoken because the being of the fire in the bush for a season was a type of Him in whom the fulness of the Godhead dwelt bodily, and that forever, Col. 2:9. Of Him who was made flesh and dwelt among us, Jn. 1:14. The eternal fire of the divine nature dwells in the bush of our frail nature, yet is not consumed thereby. God thus dwells in this bush, with all his goodwill towards sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses concerning the Glory of Christ… (d. 1683; London: Marshall, 1691), ch. 3</cite>, pp. 41-42</span></figcaption>

%20his%20goodwill%20towards%20sinners" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c2600adf74" data-kw="">
<blockquote><p>To make an image of God is to blaspheme Him. An infinite nature cannot be represented, but it must be an infinite disparagement to it. It may be asked, May not God be represented by such corporeal forms as sometimes He appeared in? Answer: In the burning bush and in the glory on Mount Sinai, God appeared not as in an image or representation of Himself, but as in symbols of his presence. Whether it were God or angels only that appeared to Abraham and Jacob in human shape, is controvertible; or it might be God the Son as a preludium to his incarnation. Besides, God did not take those human shapes as images or representations of Himself, but as signs of his presence.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“To make an image of God is to blaspheme Him. An infinite nature cannot be represented, but it must be an infinite disparagement to it. It may be asked, May not God be represented by such corporeal forms as sometimes He appeared in? Answer: In the burning bush and in the glory on Mount Sinai, God appeared not as in an image or representation of Himself, but as in symbols of his presence. Whether it were God or angels only that appeared to Abraham and Jacob in human shape, is controvertible; or it might be God the Son as a preludium to his incarnation. Besides, God did not take those human shapes as images or representations of Himself, but as signs of his presence.”

— John Corbet, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 16, pp. 202-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+make+an+image+of+God+is+to+blaspheme+Him.+An+infinite+nature+cannot+be+represented%2C+but+it+must+be+an+infinite+disparagement+to+it.+It+may+be+asked%2C+May+not+God+be+represented+by+such+corporeal+forms+as+sometimes+He+appeared+in%3F+Answer%3A+In+the+burning+bush+and+in+the+glory+on+Mount+Sinai%2C+God+appeared+not+as+in+an+image+or+representation+of+Himself%2C+but+as+in+symbols+of+his+presence.+Whether+it+were+God+or+angels+only+that+appeared+to+Abraham+and+Jacob+in+human+shape%2C+is+controvertible%3B+or+it+might+be+God+the+Son+as+a+preludium+to+his+incarnation.+Besides%2C+God+did+not+take+those+human+shapes+as+images+or+representations+of+Himself%2C+but+as+signs+of+his+presence.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%2C+2nd+Part+in+The+Remains+of%E2%80%A6+John+Corbet%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29+%7C+section+16%2C+pp.+202-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc2600adf74.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c2600adf74.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=To%20make%20an%20image%20of%20God,but%20as%20signs%20of%20his%20presence&amp;text=To%20make%20an%20image%20of%20God%20is%20to&amp;text=of%20Himself%2C%20but%20as%20signs%20of%20his%20presence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-da10e894b5" data-kw="">
<blockquote><p>To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18</cite>, p. 205</span></figcaption>

894b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/da10e894b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=To%20make%20such%20images%20and%20representations,the%20same%20as%20a%20bright%20medium&amp;text=To%20make%20such%20images%20and%20representations%20to%20be&amp;text=shining%20through%20the%20same%20as%20a%20bright%20medium" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-87b214b9b0" data-kw="">
<blockquote><p>The Sanctity of this blessed House [of the saints in Heaven]… Sanctity of place is relative and is founded either upon the manifestation of God’s special Presence, or consecration of it to his service. ‘Tis consistent with the Divine Immensity to be differently present in several places: as the soul is in another manner present in the head, where it performs its noblest operations, than in other parts of the body; and upon any special appearance of God, a place is sacred. Thus when Moses approached to see the flaming bush, he was enjoined, ‘Do not come near hither; pluck off thy shoes from off thy feet, the place where thou standest is holy ground.’ The visible testimony of the divine Presence sanctified the place, and the most humble outward reverence was due, a sign and effect of the internal respect that is owing to his most adorable Majesty. The sanctity of that place was an extraordinary relation and ceased upon the vanishing of the flame, the sign of God’s Presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Description of the Blessed Place &amp; State of the Saints Above… (London: J.D., 1687)</cite>, pp. 16-18</span></figcaption>

Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49f3ff8527" data-kw="">
<blockquote><p>Idolatry is not to picture any historical thing, but to worship or adore an image. This indeed they have not made who have sometimes in our Bibles conjoined pictured histories with the narratives… For instance, at Ex. 3:2-3 a picture of the bramble bush is certainly represented, in which Jehovah appeared, but there is no likeness or image of Jehovah, who appeared in the bramble bush. The bramble bush is indeed one thing, God appearing in the bramble bush another.</p></blockquote>

</figure><figure class="quote" id="q-a88169a2f4" data-kw="">
<blockquote><p>…external adoration is due two ways: 1. When we approach God in immediate acts of worship, as prayer, and praises. 2. When it pleases God in an extraordinary manner to appear in his glory; the due season then for external signs of inward homage and reverence is when we perform these immediate acts of worship in our assemblies, or if God shall please, to give glorious signs of his extraordinary presence, as he did to Moses when the Bush was burning but not consumed, or as the Lord appeared, after Solomon had made an end of praying, when the fire came down from Heaven and the glory of the Lord filled the house; then all the Children of Israel, beholding the fire and glory of the Lord, bowed themselves and worshipped; whensoever the Lord does thus appear, external adoration is due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men in the Worship of God, by William, Lord Bishop of Derry... (Edinburgh: Anderson, 1694), ch. 4, ‘Of Bodily Worship’, section 2, p. 96 Craghead (1633–1711) was a presbyterian minister, born in Scotland, who ministered in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

external%20adoration%20is%20due&amp;text=external%20adoration%20is%20due%20two%20ways%3A%201.%20When&amp;text=Lord%20does%20thus%20appear%2C%20external%20adoration%20is%20due" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a7c1e66dfa" data-kw="">
<blockquote><p>The papists and Lutherans do not have anything to argue for their images, except what we recently rejected in §IX, namely, that God quite often appeared in the Old Testament under certain forms, even human ones. The reply is easy: He never appeared for the purpose that He might be portrayed; indeed, that is what, throughout Scripture, he has forbidden as strictly as possible…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology. trans. Todd Rester &amp; Michael Spangler (RHB) | section 11</cite>, vol. 1, bk. 2, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-d779bccb41" data-kw="">
<blockquote><p>And indeed it [the Exodus] was the greatest typ of Christ’s redemption of any providential event whatsoever. This was by Jesus Christ, for it was wrought by Him who appeared to Moses to redeem that people. But that was Christ, as is evident, because He is called ‘the angel of the Lord,’ Ed. 3:2-3. The bush represented the human nature of Christ, who is called the ‘branch.’ This bush grew on mount Sinai or Horeb, a word that signifies a dry place, as the human nature of Christ was a root out of dry ground. The bush burning with fire, represented the sufferings of Christ, in the fire of God’s wrath. It burned, and was not consumed; so Christ, though He suffered extremely, yet perished not; but overcame at last, and rose from his sufferings. Because this great mystery of the incarnation and sufferings of Christ was here represented, therefore Moses says, ‘I will turn aside, and behold this great sight.’ A great sight he might well call it, when there was represented, ‘God manifest in the flesh,’ suffering a dreadful death, and rising from the dead.</p></blockquote>

</figure><figure class="quote" id="q-d25546976b" data-kw="">
<blockquote><p>The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.”

— Jonathan Edwards, The Works… ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653, vol. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+things+that+are+said+of+the+burning+bush%2C+do+wonderfully+agree+with+the+Old-Testament+representations+of+the+Messiah.+It+was+not+a+high+tree%2C+but+a+bush%3B+as+the+Messiah+is+called+the+low+tree%3B+Eze.+17%3A24%2C+and+elsewhere%2C+the+twig+and+the+tender+plant.+This+bush+was+a+root+out+of+dry+ground%3B+for+it+was+a+bush+that+grew+in+mount+Horeb%2C+which+was+so+called+for+the+remarkable+dryness+of+the+place.+The+word+signifies+%E2%80%98dryness%3B%E2%80%99+there+was+no+spring+about+the+mountain%2C+till+Moses+there+fetched+water+out+of+the+dry+rock.+It+was+in+a+thirsty+wilderness%2C+where+was+wont+to+be+no+rain%E2%80%A6+That+bush+was+the+growth+of+the+earth%2C+as+the+human+nature+of+Christ+in+the+Old+Testament+is+represented+to+be.+Yet+it+had+the+divine+nature+of+Christ+in+it%3B+for+this+angel+of+the+Lord+that+is+said+to+appear+in+the+bush%2C+has+been+proved+to+be+the+same+with+the+Messiah+from+the+Old+Testament%2C+in+my+discourse+on+the+prophecies+of+the+Messiah.+This+angel+is+said+to+%E2%80%98dwell%E2%80%99+in+this+bush%2C+Dt.+33%3A16%2C+the+more+to+represent+the+divine+nature+of+the+Messiah+dwelling+in+the+human+nature.+This+bush+burnt+with+fire%2C+agreeably+to+what+the+prophecies+speak+of+the+sufferings+of+Christ%3B+great+calamity+and+affliction+in+the+Old+Testament+are+often+called+fire.+This+was+especially+a+resemblance+of+the+wrath+of+God%2C+that+is+often+called+fire+in+the+Old+Testament%2C+and+which+the+prophecies+represent+the+Messiah+as+enduring%E2%80%A6+The+bush+was+preserved+from+being+consumed%2C+though+it+burnt+with+fire%2C+agreeably+to+the+prophecies+of+the+preservation+and+upholding+of+the+Messiah%2C+God%E2%80%99s+not+suffering+his+Holy+One+to+see+corruption%2C+etc.+The+bush+emerged+alive+and+frech+out+of+the+fire%2C+agreeably+to+the+prophecies+of+the+Messiah%E2%80%99s+resurrection+from+the+dead%2C+and+deliverance+from+all+his+sufferings.+The+angel+that+dwelt+out+of+that+bush%2C+who+was+the+Messiah%2C+comes+out+of+the+fire%2C+and+appears+in+the+bush%2C+and+delivered+alive+from+the+flames%2C+to+work+redemption+for+his+people.+See+Ex.+3%3A8.+So+the+prophecies+represent+the+Messiah+rising+from+the+dead%2C+and+exalted+out+of+his+state+of+humiliation%2C+to+work+salvation+for+his+people.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+Works%E2%80%A6+ed.+Edward+Hickman+%28London%3A+Ball%2C+1840%29+%7C+Types+of+the+Messiah%2C+p.+653%2C+vol.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd25546976b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d25546976b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=The%20things%20that%20are%20said%20of,to%20work%20salvation%20for%20his%20people&amp;text=The%20things%20that%20are%20said%20of%20the%20burning&amp;text=of%20humiliation%2C%20to%20work%20salvation%20for%20his%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The whole place shows it was God: but He is called an angel, that we might know that He which was seen, was not God the Father (for whose angel should the Father be) but the only begotten Son of God, which is the Angel of the great Counsel, which said to his holy apostles, ‘All things which I have heard of my Father, I have declared unto you.’ And even as He gave Him the name of an angel, not meaning thereby to note any other minister or messenger, but to show the Person of the only begotten Son: so again he sets forth both his nature and power, saying He said: ‘I AM THAT I AM,’ and ‘I the God of Abraham, the God of Isaac, the God of Jacob’…</p></blockquote>

<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>

</figure><figure class="quote" id="q-43153d271d" data-kw="">
<blockquote><p>The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/patricia-crone.html">Patricia Crone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 3, ‘Islam, Judeo Christianity &amp; Byzantine Iconoclasm’ in From Kavad to al-Ghazali: Religion, Law &amp; Political Thought in the Near East c. 600 – c. 1100 Pre (Ashgate, 2005), pp. 59-96</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>‘The honor rendered to the image passes to the prototype,’ to the model or original… This is the locus classicus of the defenders of the images in the Byzantine Iconoclastic Controversy… The sentence just cited is taken from St. Basil’s late fourth century anti-Arian treatise On the Holy Spirit, where it had served to illustrate the unifying image relation of the Son to the Father in the Divine Trinity, a relation first expressed by St. Paul when he said that Christ was the Image of God.</p></blockquote>

<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>

</figure><figure class="quote" id="q-f49c1f4576" data-kw="">
<blockquote><p>At their famous council of 754, the iconoclasts, as is well-known, did not denounce all representations of Christ but only those which attempted in one way or another to stimulate his outward form or appearance by means of painting or sculpture. In fact, they specifically endorsed what they called the image of Christ as set forth in the Eucharist… Many, however, seem not to be aware that the iconoclasts at the same time announced their approval of still another, and, from the ethical point of view, at least, more significant conception of an image, which described the virtues of the saints as living images and called for their imitation. This spiritual or ethical interpretation of the image is probably to be understood as a part of the iconoclastic campaign to purify Christian worship of what many took to be superstitious and idolatrous practices. Our knowledge of these iconoclastic efforts in the direction of reform, dating from the so-called First Iconoclastic period (726-787), we owe principally to the text of the oros, (Horos, or dogmatic definition) and anathemas pronounced by the iconoclastic Council of 754… Apart from a brief general introduction and conclusion, the florilegium of 754 consists of eight excerpts from the fathers, of which all but two deal with what I shall, for the sake of brevity, call the ethical theory of the image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers, vol. 8 (1954), pp. 153-60</cite>, p. 153</span></figcaption>

</figure><figure class="quote" id="q-0093c45483" data-kw="">
<blockquote><p>the eighth anathema of the Council of 754, which condemns anyone who would contemplate the incarnate Logos ‘through the medium of material colors, and does not worship him with the whole heart, with the eyes of the mind, as he sits in excelsis, more dazzling than the sun, at the right hand of God, on the throne of glory.’ The whole case in behalf of this type of image is summarized in the sixteenth anathema of the Council as follows: ‘If anyone ventures to set up profitless figures of all the saints in soul-less, speechless images made of material colors — for this is a vain invention and the discovery of diabolical craft — and does not, on the contrary, reproduce their virtues in himself as actually living images, with the aid of what has been recorded about them in books, in order to be stimulated to zeal like theirs, as our inspired fathers have said, let him be anathema.’</p></blockquote>

<div class="actions"><button class="copy" data-copy="“the eighth anathema of the Council of 754, which condemns anyone who would contemplate the incarnate Logos ‘through the medium of material colors, and does not worship him with the whole heart, with the eyes of the mind, as he sits in excelsis, more dazzling than the sun, at the right hand of God, on the throne of glory.’ The whole case in behalf of this type of image is summarized in the sixteenth anathema of the Council as follows: ‘If anyone ventures to set up profitless figures of all the saints in soul-less, speechless images made of material colors — for this is a vain invention and the discovery of diabolical craft — and does not, on the contrary, reproduce their virtues in himself as actually living images, with the aid of what has been recorded about them in books, in order to be stimulated to zeal like theirs, as our inspired fathers have said, let him be anathema.’”

<blockquote><p>…we must conclude that the florilegium of the Council of 815 does not advance beyond the iconoclastic theology of the earlier period… its authors made no original contributions, and merely re-used materials or repeated arguments current among the iconoclasts of 754. The most that can be said is that the iconoclasts of 815 added 12 (or 28) patristic references to the florilegium of 754, none of which, however, can be regarded as constituting an innovation or substantial addition to the iconoclastic armory.</p></blockquote>

</figure><figure class="quote" id="q-21f55b1030" data-kw="">
<blockquote><p>Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.</p></blockquote>

<blockquote><p>…as Zanchius evidences by sundry instances, idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it than God allows or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [just as God in part] (bk. 1. de viti. ext. cult. oppos. cols. 504-5).</p></blockquote>

</figure><figure class="quote" id="q-1dff4e8341" data-kw="">
<blockquote><p>Your long labor in setting down the faults to be found in our Liturgy is to small purpose. The Nonconformists do except against many things appointed in the Book, as inconvenient at least, and such as should be taken away or reformed, as the reading of Apocryphal books under the title of holy Scripture, specially such parts as be corrupt for matter: The cross and surplice as idolothites by participation and signs of mystical signification: The corruptions in the translations: and some things in the forms of burial, matrimony, thanksgiving for women after child-bed, etc. But these they condemn not as idolatry, nor as that which makes the worship itself false and idolatrous. It is one thing to say such a rite is inconvenient, superstitious, scandalous borrowed from the Papists, not warranted by the Word of God, in the use will-worship, if the word be taken largely; another that the worship itself is false and idolatrous.</p></blockquote>

</figure><figure class="quote" id="q-39f76ddc6f" data-kw="">
<blockquote><p>Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members…</p></blockquote>

</figure><figure class="quote" id="q-79dc11f4c8" data-kw="">
<blockquote><p>By this petulant carnal kind of zeal, I remember our divisions were here raised at the first: To deride the Common Prayer and deride them that used it was too common with some kind of religious people: And they excused it by Elijah’s example [1 Kn. 18:27], as if idolaters and the true worshippers of God that differ from us in a form or ceremony were all one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions (London: Symmons, 1670), pt. 1 | Direction 32</cite>, p. 188</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“By this petulant carnal kind of zeal, I remember our divisions were here raised at the first: To deride the Common Prayer and deride them that used it was too common with some kind of religious people: And they excused it by Elijah’s example [1 Kn. 18:27], as if idolaters and the true worshippers of God that differ from us in a form or ceremony were all one.”

— Richard Baxter, The Cure of Church Divisions (London: Symmons, 1670), pt. 1 | Direction 32, p. 188">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+this+petulant+carnal+kind+of+zeal%2C+I+remember+our+divisions+were+here+raised+at+the+first%3A+To+deride+the+Common+Prayer+and+deride+them+that+used+it+was+too+common+with+some+kind+of+religious+people%3A+And+they+excused+it+by+Elijah%E2%80%99s+example+%5B1+Kn.+18%3A27%5D%2C+as+if+idolaters+and+the+true+worshippers+of+God+that+differ+from+us+in+a+form+or+ceremony+were+all+one.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions+%28London%3A+Symmons%2C+1670%29%2C+pt.+1+%7C+Direction+32%2C+p.+188&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79dc11f4c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/79dc11f4c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=By%20this%20petulant%20carnal%20kind%20of,form%20or%20ceremony%20were%20all%20one&amp;text=By%20this%20petulant%20carnal%20kind%20of%20zeal%2C%20I&amp;text=in%20a%20form%20or%20ceremony%20were%20all%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fd793bc8c6" data-kw="">
<blockquote><p>And what pitiful arguments have they to prove this charge of idolatry: ‘False worship of the true God is idolatry as well as worshipping a false God: But such is the [Anglican] Liturgy: therefore—’ This is all that these rash preachers must trouble the Church and seduce men into a hating factious zeal with. But what mean these men by ‘false worship’? Do they mean worship contrary to God’s Word? That is, which is sinful? And do they mean all such sinful worship or some only? If they mean all such sinful worship, then these words of theirs are idolatry: for they are part of their preaching, which is part of God’s worship, in their own sense: And it is false doctrine and tends to men’s perdition. And so they and all false teachers should be idolaters. By this they would turn all sins in worship into one: It is all idolatry. Is not every confused prayer sinful which has unmeet expressions and disordered, and has wandering thoughts and dull affections? Is there any of these love-killers that dare say they pray without sin? And must we not separate from them then as idolaters? Yea and every man from himself; that is, he must give over praying because it’s all idolatry? But perhaps they will say: ‘This sin is but in the manner and not in the matter.’ Answer: Very good; it seems then that sin in the manner of worship is not idolatry… Will you find some words which you can call false in the matter? Suppose it were so? When an Antinomian, an Anabaptist, a Separatist or anyone that errs does drop some of his errors in his prayers (as I think none will deny that they use to do), must we needs believe that his prayer is idolatry therefore, as being false worship? And is it unlawful to join with such? Then we shall have more separation than you yet plead for or practice yourselves. No two men in the world must join together if all sinful worship, or worship false sometime in the very matter does necessitate a separation… … But what text of Scripture is it that ever told these men that all false worship is idolatry? what text do they name but such as if they did it on purpose to show their boldness in adding to God’s Word? The Second Commandment is the chief which they insist on. But whatever expositions they may forge, there is no such word, nor sense in the Commandment. We all hold that as the gross, direct idolatry is the worshipping of a false God, against the First Commandment; so to make any such false representation of the true God, by words or deeds, as makes Him like an idol, and contradicts his nature, and so to worship Him, this is also a secondary kind of idolatry: Because God is none such as they represent Him, and therefore it is not God indeed but an idol which they worship. And because God is not like to anything corporeal in heaven or earth, therefore he that makes an image of any thing in heaven or earth as like to God, or to represent Him, he makes an idol of God by blasphemy. ‘To what will you liken Me, that I should be like unto it, saith the Holy One?’ This is the idolatry forbidden in the Second Commandment: It is not all false worship, but one sort of false worship, which is idolatry: what else that Commandment forbids is neither called idolatry, nor can so be proved. It is an odious sound, to hear an ignorant, rash, self-conceited person, especially a preacher, to cry out, ‘Idolatry, Idolatry,’ against his brethren’s prayers to God because they have something in them to be amended, while perhaps his own prayers have so much false doctrine in them or false fire of carnal passions and uncharitableness, as makes it a much harder question whether it be lawful to join with such as he is, while he abhors so much to join with others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions (London: Symmons, 1670), pt. 1 | Direction 33</cite>, p. 190-93</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“And what pitiful arguments have they to prove this charge of idolatry: ‘False worship of the true God is idolatry as well as worshipping a false God: But such is the [Anglican] Liturgy: therefore—’ This is all that these rash preachers must trouble the Church and seduce men into a hating factious zeal with. But what mean these men by ‘false worship’? Do they mean worship contrary to God’s Word? That is, which is sinful? And do they mean all such sinful worship or some only? If they mean all such sinful worship, then these words of theirs are idolatry: for they are part of their preaching, which is part of God’s worship, in their own sense: And it is false doctrine and tends to men’s perdition. And so they and all false teachers should be idolaters. By this they would turn all sins in worship into one: It is all idolatry. Is not every confused prayer sinful which has unmeet expressions and disordered, and has wandering thoughts and dull affections? Is there any of these love-killers that dare say they pray without sin? And must we not separate from them then as idolaters? Yea and every man from himself; that is, he must give over praying because it’s all idolatry? But perhaps they will say: ‘This sin is but in the manner and not in the matter.’ Answer: Very good; it seems then that sin in the manner of worship is not idolatry… Will you find some words which you can call false in the matter? Suppose it were so? When an Antinomian, an Anabaptist, a Separatist or anyone that errs does drop some of his errors in his prayers (as I think none will deny that they use to do), must we needs believe that his prayer is idolatry therefore, as being false worship? And is it unlawful to join with such? Then we shall have more separation than you yet plead for or practice yourselves. No two men in the world must join together if all sinful worship, or worship false sometime in the very matter does necessitate a separation… … But what text of Scripture is it that ever told these men that all false worship is idolatry? what text do they name but such as if they did it on purpose to show their boldness in adding to God’s Word? The Second Commandment is the chief which they insist on. But whatever expositions they may forge, there is no such word, nor sense in the Commandment. We all hold that as the gross, direct idolatry is the worshipping of a false God, against the First Commandment; so to make any such false representation of the true God, by words or deeds, as makes Him like an idol, and contradicts his nature, and so to worship Him, this is also a secondary kind of idolatry: Because God is none such as they represent Him, and therefore it is not God indeed but an idol which they worship. And because God is not like to anything corporeal in heaven or earth, therefore he that makes an image of any thing in heaven or earth as like to God, or to represent Him, he makes an idol of God by blasphemy. ‘To what will you liken Me, that I should be like unto it, saith the Holy One?’ This is the idolatry forbidden in the Second Commandment: It is not all false worship, but one sort of false worship, which is idolatry: what else that Commandment forbids is neither called idolatry, nor can so be proved. It is an odious sound, to hear an ignorant, rash, self-conceited person, especially a preacher, to cry out, ‘Idolatry, Idolatry,’ against his brethren’s prayers to God because they have something in them to be amended, while perhaps his own prayers have so much false doctrine in them or false fire of carnal passions and uncharitableness, as makes it a much harder question whether it be lawful to join with such as he is, while he abhors so much to join with others.”

as+being+false+worship%3F+And+is+it+unlawful+to+join+with+such%3F+Then+we+shall+have+more+separation+than+you+yet+plead+for+or+practice+yourselves.+No+two+men+in+the+world+must+join+together+if+all+sinful+worship%2C+or+worship+false+sometime+in+the+very+matter+does+necessitate+a+separation%E2%80%A6+%E2%80%A6+But+what+text+of+Scripture+is+it+that+ever+told+these+men+that+all+false+worship+is+idolatry%3F+what+text+do+they+name+but+such+as+if+they+did+it+on+purpose+to+show+their+boldness+in+adding+to+God%E2%80%99s+Word%3F+The+Second+Commandment+is+the+chief+which+they+insist+on.+But+whatever+expositions+they+may+forge%2C+there+is+no+such+word%2C+nor+sense+in+the+Commandment.+We+all+hold+that+as+the+gross%2C+direct+idolatry+is+the+worshipping+of+a+false+God%2C+against+the+First+Commandment%3B+so+to+make+any+such+false+representation+of+the+true+God%2C+by+words+or+deeds%2C+as+makes+Him+like+an+idol%2C+and+contradicts+his+nature%2C+and+so+to+worship+Him%2C+this+is+also+a+secondary+kind+of+idolatry%3A+Because+God+is+none+such+as+they+represent+Him%2C+and+therefore+it+is+not+God+indeed+but+an+idol+which+they+worship.+And+because+God+is+not+like+to+anything+corporeal+in+heaven+or+earth%2C+therefore+he+that+makes+an+image+of+any+thing+in+heaven+or+earth+as+like+to+God%2C+or+to+represent+Him%2C+he+makes+an+idol+of+God+by+blasphemy.+%E2%80%98To+what+will+you+liken+Me%2C+that+I+should+be+like+unto+it%2C+saith+the+Holy+One%3F%E2%80%99+This+is+the+idolatry+forbidden+in+the+Second+Commandment%3A+It+is+not+all+false+worship%2C+but+one+sort+of+false+worship%2C+which+is+idolatry%3A+what+else+that+Commandment+forbids+is+neither+called+idolatry%2C+nor+can+so+be+proved.+It+is+an+odious+sound%2C+to+hear+an+ignorant%2C+rash%2C+self-conceited+person%2C+especially+a+preacher%2C+to+cry+out%2C+%E2%80%98Idolatry%2C+Idolatry%2C%E2%80%99+against+his+brethren%E2%80%99s+prayers+to+God+because+they+have+something+in+them+to+be+amended%2C+while+perhaps+his+own+prayers+have+so+much+false+doctrine+in+them+or+false+fire+of+carnal+passions+and+uncharitableness%2C+as+makes+it+a+much+harder+question+whether+it+be+lawful+to+join+with+such+as+he+is%2C+while+he+abhors+so+much+to+join+with+others.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions+%28London%3A+Symmons%2C+1670%29%2C+pt.+1+%7C+Direction+33%2C+p.+190-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd793bc8c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fd793bc8c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=And%20what%20pitiful%20arguments%20have%20they,so%20much%20to%20join%20with%20others&amp;text=And%20what%20pitiful%20arguments%20have%20they%20to%20prove&amp;text=he%20abhors%20so%20much%20to%20join%20with%20others" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9951a62db4" data-kw="">
<blockquote><p>But those inventions of men and customs of the nations, which the texts alleged mention, were such as were expressly forbidden, drew them to serve other gods and to forsake the Lord, not such as are usually by Seperatives [Separatists] called ‘inventions of men’, to wit human ceremonies, confessed out of the case of worship in themselves to be things indifferent, such as out of pretended prudence at least, or public authority are imposed for discipline, order or decency without giving any divine worship to a creature. Let all the texts alleged be viewed, and there is none of them that mentions the mingling such inventions of men, no not those which our Savior reprehends in the Pharisees, Mk. 7:3-4, 8 (which are far worse [than the Anglican ceremonies]) as the departing from God’s pure institutions… and therefore the threatnings and punishments in those places are grossly abused when they are applied to the imposing or use of such ceremonies or discipline as are (whether rightly or wrongly) retained in the Church of England.</p></blockquote>

a62db4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=But%20those%20inventions%20of%20men%20and,retained%20in%20the%20Church%20of%20England&amp;text=But%20those%20inventions%20of%20men%20and%20customs%20of&amp;text=or%20wrongly%29%20retained%20in%20the%20Church%20of%20England" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…’the way of worship not prescribed by God’ may be either when the worship is to another thing besides or with God, which alone proves idolatry… Or, ‘by another way’, is meant another ceremony or rite in which the worship of God is placed, such as was the Pharisees’ washing their hands, which may be will-worship, if to God only, but not idolatry; and so if he could prove our [Anglican] ministers guilty of this, yet should they not be proved idolaters any more than the Pharisees were, with which neither Christ nor his apostles do charge them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667) | Sect. 3. This Authors Argument as well proves himself an Idolater as the Conformist</cite>, Ch. 7; p. 216</span></figcaption>

</figure><figure class="quote" id="q-8757ce69f8" data-kw="">
<blockquote><p>…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry</cite>, Ch. 7; pp. 245-46</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.”

— John Tombes, Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry, Ch. 7; pp. 245-46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+office-power%2C+no%2C+not+though+it+were+from+idolaters%2C+for+idolatrous+purposes%2C+does+not+make+persons+actually+idolaters%2C+till+they+do+actually+exhibit+divine+worship+to+a+creature.+Suppose+a+person+be+ordained+a+priest+to+offer+sacrifice-propitiatory+for+the+quick+and+dead+in+the+mass%3B+yet+if+he+repent+thereof%2C+and+never+do+adore+the+breaden-god%2C+he+is+not+an+idolater%3A+Yea%2C+suppose+he+act+in+baptizing%2C+preaching%2C+marrying%2C+burying+according+to+the+rituals+of+the+Romanists%2C+by+virtue+of+his+ordination+as+a+priest%2C+or%2C+as+this+author+speaks%2C+his+office-power%2C+without+exhibiting+any+divine+worship+to+a+creature+%28which+in+some+of+these+may+be%29%2C+yet+is+he+not+thereby+an+idolater.+The+reason+whereof+is+manifest%2C+because+he+is+not+an+idolater+to+whom+the+definition+of+idolatry+agrees+not.+And+this+is+the+reason+why%2C+if+Jeroboam%E2%80%99s+priests%2C+though+consecrated+for+the+worship+of+idols%2C+did+not+worship+them%2C+they+were+not+to+be+accounted+idolaters%3A+Nor+are+those+that+act+by+virtue+of+authority+committed+to+them+in+matters+civil%2C+from+rebels+%5Bsuch+as+Oliver+Cromwell%5D%2C+equally+guilty+of+rebellion+as+those+from+whom+they+derive+that+their+authority%2C+unless+they+act+rebelliously%3B+if+they+act+for+the+restitution+of+their+prince%2C+the+public+peace%2C+they+are+accounted+good+subjects+%5Bas+many+did+under+Cromwell%5D%2C+and+not+rebels%2C+though+at+first+they+derived+their+authority+from+rebels.+Nor+does+the+worshipping+of+God+by+a+form+merely+of+humane+composition+make+idolaters%2C+though+it+have+been+abused+to+idolatry+with+the+rites+and+modes+of+idolaters%2C+unless+there+be+idolatry+in+the+form%2C+and+the+rites+and+modes+be+idolatrous+in+their+use%3A+because%2C+notwithstanding+this%2C+no+divine+worship+may+be+given+to+a+creature.+So%2C+though+the+form+of+baptism+in+the+Roman+Church+were+merely+of+human+composition%2C+used+with+crossings%2C+cream%2C+oil%2C+spittle%2C+if+these+rites+were+used%2C+though+by+them+abused+to+idolatry%2C+not+as+they+do%2C+so+as+to+give+divine+worship+to+a+creature%2C+the+users+in+this+manner%2C+however+guilty+of+will-worship+or+superstition%2C+yet+would+not+be+justly+chargeable+with+idolatry%3B+no%2C+not+though+they+should+in+some+sort+symbolize+with+idolaters%2C+that+is%2C+be+assimilated+to+them+or+in+some+sort+comply+with+them.%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+Theodulia%2C+or+a+Just+Defence+of+Hearing+the+Sermons+%26+other+teaching+of+the+present+Ministers+of+England%E2%80%A6+%28London%3A+E.+Cotes%2C+1667%29+%7C+Sect.+11.+Acting+in+the+holy+things+of+God%2C+by+an+Office-power+and+modes+of+Idolaters%2C+may+be+without+Idolatry%2C+Ch.+7%3B+pp.+245-46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8757ce69f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8757ce69f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=the%20office%2Dpower%2C%20no%2C%20not%20though%20it,in%20some%20sort%20comply%20with%20them&amp;text=the%20office%2Dpower%2C%20no%2C%20not%20though%20it%20were%20from&amp;text=them%20or%20in%20some%20sort%20comply%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f156f200bc" data-kw="">
<blockquote><p>I think all will-worship is not idolatry: Our Lord, who accused the Pharisees of will-worship, did not accuse them of idolatry… his accusing ministers of idolatry, for using a Service-book in the main right in respect of the worship, and a gesture [kneeling in receiving the Supper] avowed to be only to the true God, in a Church, holding in the main, the right Faith, under a prince that professes the same Faith and worship, and to be a defender of it. As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first [such as honor and decency], being almost if not quite forgotten by those that use them, and are become but as civil customs that have no state in [or condition of being] religious worship, experience shows that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it, but to exasperate rulers and make opposites more violent in their way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667) | Sect. 16. The Crimination of the Ministers, as Idolaters, is not excusable</cite>, Ch. 7; pp. 263-64</span></figcaption>

<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>

<blockquote><p>3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Conscience Resolved, in answer to a (pretended) perplexing question, etc. Wherein is evidently proved that the holy Scriptures (not the Pope) is the foundation whereupon the Church is built (London: 1652)</cite>, pp. 27-28</span></figcaption>

<blockquote><p>Touching civil society with them, two points are to be handled: [1.] What society may be used with them, and [2.] what not. For the first, we may use their society upon neccessity that cannot be avoided, unless we will utterly reject the fellowship of mankind. Paul, who forbids the Corinthians to company with a brother that is an idolator, for all this gives them liberrty to converse with the idolatrous of the world. (1 Cor. 5:10-11) This may seem strange but the reason is because the company of believers was then but small and the whole world beside was nothing but idolaters: and therefore it was impossible for believers to avoid their society unless they meant to go out of the world. And upon this necessity, Paul permits the Church in his days to use the fellowship of idolators; and for the very same cause he says, 1 Cor. 10:27, ‘If any of them that believe not bid you to a feast, go if ye will.’ Secondly, believers may lawfully join with idolaters in the society of concord. For by the general calling of Christianity they are bound to have peace with all men. Upon this ground may the Church make covenants of peace with idolators upon even and just conditions. Heb. 12:14, ‘Have peace towards all men, and holiness.’ Rom. 12:18, ‘Have peace with all men, if it be possible, and as much as in you lies.’ Thus Abraham made a league of peace with Aner and Eschol, king of the Amorites, and with Abimelech; and Isaac with Abimelech, and Jacob with Laban (Gen. 23-24): and Heber the Kenite with Jabin a foreign king (Judg. 4:17): and thelr examples have sufficient warrant. For that which we may do we may bind ourselves to do. Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. The second example is of leagues, in mutual aid and protection, which may not be contracted between believers and idolaters. Jehoshaphat for making this kind of league with Ahab is thus reproved, 2 Chron. 19:2. ‘Wouldest thou help the wicked, and love them that hate the Lord? Therefore for this things the wrath of the Lord is upon thee.’ Again, that which we may not do, we may not covenant to do; now we may not mutually give and take aid and protection of idolators. This tends to the dishonor of God, because it makes idolators boast that the people of God cannot stand without their aid. It is further an occasion of idolatry and this league often enfolds the people of God in the same plagues and judgment with idolators. It has been the decay both of Greece and Hungary that they have heretofore entered into leagues of amity with the Turks. lt may be objected that Abraham made this covenant of protection with the Amorites, Aner, Eschol, Mamre: and that thereupon they aided him in rescuing of Lot, and in the slaughter of the kings. I answer: First, it may be they were believers, embracing the faith Abraham: nothing can be showed to the contrary. Secondly, if they were infidels, the covenant that was between them was of peace only and they aided Abraham, not by request made by him, but by secret special motion of God. Thirdly, the fathers did sundry actions upon bad custom, which God by law afterward redressed: and their examples may not be followed in all things. Lastly, I suppose that Abraham joined with them as against a common adversary: and therefore the protection they ministered to Abraham was as necessary for themselves as for him and his people. Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.</p></blockquote>

29+%E2%80%98shall+be+my+people%2C+and+thy+God%2C+my+God.%E2%80%99+Sampson+likewise+married+a+woman+of+the+Philistines+%28Judg.+14%3A4%29%2C+but+that+was+by+divine+instinct+and+consequently+by+a+special+appointment+of+God.+Again+it+is+alleged+that+God+by+express+law+gave+leave+to+the+Israelites+to+marry+heathenish+women+taken+captives+in+war.+%28Dt.+21%3A10-11%29+Answer%3A+That+is+a+law+only+of+toleration%2C+without+approbation%2C+in+which+God%2C+for+the+hardness+of+their+hearts%2C+permits+the+evil%2C+which+cannot+by+policy+be+quite+taken+away.+And+this+appears+by+two+things%3A+First%2C+before+the+marriage%2C+the+woman+by+God%E2%80%99s+appointment+must+be+deformed%2C+by+cutting+off+her+hair%2C+by+the+growing+of+her+nails%2C+by+putting+off+the+garments+of+her+captivity%2C+and+by+mourning+for+her+father+and+mother+for+the+space+of+a+month%3A+and+the+end+of+this+was+to+cause+a+dislike+in+the+Israelites+of+their+intended+marriages%2C+or+to+signify+a+change+of+religion%2C+at+the+least+in+pretense%2C+in+the+parties+espoused.+The+second+example+is+of+leagues%2C+in+mutual+aid+and+protection%2C+which+may+not+be+contracted+between+believers+and+idolaters.+Jehoshaphat+for+making+this+kind+of+league+with+Ahab+is+thus+reproved%2C+2+Chron.+19%3A2.+%E2%80%98Wouldest+thou+help+the+wicked%2C+and+love+them+that+hate+the+Lord%3F+Therefore+for+this+things+the+wrath+of+the+Lord+is+upon+thee.%E2%80%99+Again%2C+that+which+we+may+not+do%2C+we+may+not+covenant+to+do%3B+now+we+may+not+mutually+give+and+take+aid+and+protection+of+idolators.+This+tends+to+the+dishonor+of+God%2C+because+it+makes+idolators+boast+that+the+people+of+God+cannot+stand+without+their+aid.+It+is+further+an+occasion+of+idolatry+and+this+league+often+enfolds+the+people+of+God+in+the+same+plagues+and+judgment+with+idolators.+It+has+been+the+decay+both+of+Greece+and+Hungary+that+they+have+heretofore+entered+into+leagues+of+amity+with+the+Turks.+lt+may+be+objected+that+Abraham+made+this+covenant+of+protection+with+the+Amorites%2C+Aner%2C+Eschol%2C+Mamre%3A+and+that+thereupon+they+aided+him+in+rescuing+of+Lot%2C+and+in+the+slaughter+of+the+kings.+I+answer%3A+First%2C+it+may+be+they+were+believers%2C+embracing+the+faith+Abraham%3A+nothing+can+be+showed+to+the+contrary.+Secondly%2C+if+they+were+infidels%2C+the+covenant+that+was+between+them+was+of+peace+only+and+they+aided+Abraham%2C+not+by+request+made+by+him%2C+but+by+secret+special+motion+of+God.+Thirdly%2C+the+fathers+did+sundry+actions+upon+bad+custom%2C+which+God+by+law+afterward+redressed%3A+and+their+examples+may+not+be+followed+in+all+things.+Lastly%2C+I+suppose+that+Abraham+joined+with+them+as+against+a+common+adversary%3A+and+therefore+the+protection+they+ministered+to+Abraham+was+as+necessary+for+themselves+as+for+him+and+his+people.+Here+one+exception+must+not+be+omitted.+Put+the+case+that+the+husband+is+an+idolator+and+is+content+to+dwell+with+his+believing+wife%3A+she+then+is+to+live+with+him%2C+not+only+in+the+society+of+peace%2C+but+also+in+the+society+of+amity+by+doing+all+duties+of+Iove+that+concern+a+wife%2C+so+far+as+may+stand+with+good+conscience.+For+the+precept+of+Paul%E2%80%99s%2C+that+marriage+and+marriage+duties+are+to+be+preserved+of+the+believing+party+with+an+infidel+%281+Cor.+7%3A13-14%29%2C+so+be+it+the+said+infidel+be+content.+It+may+be+al%21eged+that+thus+the+believer+exposes+himself+to+danger+of+idolatry.+I+answer%3A+Not+because+God+defends+them+that+call+upon+Him+who+thrust+not+themselves+into+danger%2C+but+bear+the+danger+and+calamity+into+which+they+are+fallen%2C+attending+upon+their+callings.+Again%2C+if+the+unbelieving+party+shall+solicit+the+other+and+use+all+means%2C+both+fair+and+foul%2C+to+draw+him+or+her+to+idolatry%2C+the+believing+party+in+this+case%2C+may+go+aside+for+a+time+and+omit+the+duty+of+marriage.+For+this+is+all+one+as+if+the+idolatrous+and+unbelieving+party+should+depart.+For+indeed%2C+that+party+is+said+to+depart+in+whom+the+cause+of+departing+is%2C+as+in+the+Church+he+is+a+schismatic+in+whom+the+cause+of+the+schism+is%2C+and+not+always+he+that+separates.+Secondly%2C+it+may+be+objected+that+a+Christian+may+not+become+the+member+of+a+harlot%2C+much+less+of+an+idolator%3B+considering+idolatry+is+a+great+sin.+I+answer%3A+The+reason+is+not+like.+For+the+fornicator+consents+to+the+fornication%3A+and+so+does+not+the+believing+party%2C+by+doing+duties+that+pertain+to+marriage%2C+consent+to+the+idolatry+of+the+unbelieving+party.+And+the+fornicator+willingly+joins+himself+with+an+harlot%3B+whereas+the+believing+party+desires+he+might+be+yoked+with+a+believer+and+not+with+an+infidel.+Lastly%2C+it+may+be+objected%3A+if+for+adultery%2C+divorce+may+be+made%2C+why+not+for+idolatry+which+is+spiritual+adultery%3F+I+answer%3A+That+not+any+sin+by+itself%2C+as+it+is+a+sin%2C+not+breaking+the+troth+and+bond+of+marriage%2C+is+the+proper+cause+of+a+divorce%3B+and+not+any+kind+of+idolatry%2C+but+the+sin+of+adultery+breakest+his+troth.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28d.+1602%3B+London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff52605aeb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f52605aeb2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=Touching%20civil%20society%20with%20them%2C%20two,sin%20of%20adultery%20breakest%20his%20troth&amp;text=Touching%20civil%20society%20with%20them%2C%20two%20points%20are&amp;text=but%20the%20sin%20of%20adultery%20breakest%20his%20troth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Here it may be demanded whether it be lawful for Christian men to go into the temples of idols. I answer: they may, if they have a calling so to do, and do not communicate with idolaters in their superstitions, or give any honor to idols: but on the contrary, do openly profess, either by word , or by their deeds, or both, that they abhor both the idols and their service. Thus was Elijah present with the priests of Baal. Thus were the three children present when the golden image was worshipped. Thus was the prophet of God present at the altar of Bethel, when Jeroboam stretched out his hand to offer incense to the idol. (1 Kings 13) Thus Paul was present in Athens, and in the places of idolatry, that he might behold their superstitions. (Acts 17; 27) The Protestant princes in the crowning of Maximilian at Frankfurt brought the Emperor to the Church and to the place whereas he was to sit: this done, they returned without doing any reverence at all, and thereby professed their mislike of popish idols, and their service. It may be objected that the prophet of the Lord prayed in the place where idolatry was exercised: because he prayed at the altar of Bethel, for the restoring of the King’s arm. (1 Kings 13:6) Answer: He did not amiss: For to the clean, all things indifferent are clean : and therefore the place, though polluted with idolatry of others , was clean to the clean prophet. And the Jews were commanded, when they were in the midst of idolatrous nations, to worship God towards the Temple at Jerusalem. (1 Kings 8:48; Dan. 6:10) And God heard his prayer, by miracle restoring the king’s arm: and therefore He approved it. And a prayer made in an idolatrous assembly is no approbation of idolatry, if there be an open profession of the mislike thereof: and the prayer be made upon some necessity, as this of the prophets was, that the king might be convinced of his impiety. It may be objected that the prophet, refusing to eat in the place (1 Kings 13:8), should also have refused to pray there. I answer: No, because God appointed abstinence from meat to be the sign of detestation of the idolatry committed in Bethel, and not abstinence from prayer. And this example of the prophet, does not warrant us to be present at idolatrous service, there to worship the true God, because he did not dissemble, but he openly professed the truth against idolaters. On the contrary, if men resolve not to profess their detestation of idolatrous worship, either by word of mouth, gesture, or some other way; but only desire upon curiosity, to see new fashions, and hereupon, enter into the temples of idols; I think they ought not to do it. For they themselves tempt God by so doing; they offend their weak brethren and draw them by their example to do the like. And lastly, by their presence they confirm the obstinate idolaters in their superstition. The like is to be said of them, that curiously without calling go out of the precincts of the Church into idolatrous countries for this end only to see and to be seen.</p></blockquote>

ed+it.+And+a+prayer+made+in+an+idolatrous+assembly+is+no+approbation+of+idolatry%2C+if+there+be+an+open+profession+of+the+mislike+thereof%3A+and+the+prayer+be+made+upon+some+necessity%2C+as+this+of+the+prophets+was%2C+that+the+king+might+be+convinced+of+his+impiety.+It+may+be+objected+that+the+prophet%2C+refusing+to+eat+in+the+place+%281+Kings+13%3A8%29%2C+should+also+have+refused+to+pray+there.+I+answer%3A+No%2C+because+God+appointed+abstinence+from+meat+to+be+the+sign+of+detestation+of+the+idolatry+committed+in+Bethel%2C+and+not+abstinence+from+prayer.+And+this+example+of+the+prophet%2C+does+not+warrant+us+to+be+present+at+idolatrous+service%2C+there+to+worship+the+true+God%2C+because+he+did+not+dissemble%2C+but+he+openly+professed+the+truth+against+idolaters.+On+the+contrary%2C+if+men+resolve+not+to+profess+their+detestation+of+idolatrous+worship%2C+either+by+word+of+mouth%2C+gesture%2C+or+some+other+way%3B+but+only+desire+upon+curiosity%2C+to+see+new+fashions%2C+and+hereupon%2C+enter+into+the+temples+of+idols%3B+I+think+they+ought+not+to+do+it.+For+they+themselves+tempt+God+by+so+doing%3B+they+offend+their+weak+brethren+and+draw+them+by+their+example+to+do+the+like.+And+lastly%2C+by+their+presence+they+confirm+the+obstinate+idolaters+in+their+superstition.+The+like+is+to+be+said+of+them%2C+that+curiously+without+calling+go+out+of+the+precincts+of+the+Church+into+idolatrous+countries+for+this+end+only+to+see+and+to+be+seen.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F801a501ae6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/801a501ae6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=Here%20it%20may%20be%20demanded%20whether,to% <blockquote><p>XI. But whatever may be said about this diversity of opinions in the Roman school, all its doctors agree on this, as has often been stated: 1. That some form of worship is to be given to images of Christ and the saints. 2. That this worship can rightly be signified by the term “adoration.</p></blockquote>

<blockquote><p>The typical reformed view and practice was that the material church buildings of Romanists, when cleansed, may be repurposed for good uses (1 Tim. 4:4–5). On the more exceptional cases where a Romanist building had been so notoriously idolatrous and scandalous, the scandal not removing with the removal of the idolatry, the reformed typically destroyed the building wholly, not allowing it to be further used. The Separatists, as seen here, were generally for destroying all the buildings that had been used by Romanists, not thinking it lawful to repurpose the material goods. See [also] ‘On Church Buildings &amp; Architecture’ (RBO)…</p></blockquote>

— Travis Fentiman, “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p. 295 fn. 727">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+typical+reformed+view+and+practice+was+that+the+material+church+buildings+of+Romanists%2C+when+cleansed%2C+may+be+repurposed+for+good+uses+%281+Tim.+4%3A4%E2%80%935%29.+On+the+more+exceptional+cases+where+a+Romanist+building+had+been+so+notoriously+idolatrous+and+scandalous%2C+the+scandal+not+removing+with+the+removal+of+the+idolatry%2C+the+reformed+typically+destroyed+the+building+wholly%2C+not+allowing+it+to+be+further+used.+The+Separatists%2C+as+seen+here%2C+were+generally+for+destroying+all+the+buildings+that+had+been+used+by+Romanists%2C+not+thinking+it+lawful+to+repurpose+the+material+goods.+See+%5Balso%5D+%E2%80%98On+Church+Buildings+%26+Architecture%E2%80%99+%28RBO%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+1644%3B+RBO%2C+2025%29%2C+p.+295+fn.+727&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44abecf5a8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/44abecf5a8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monuments-badges-of-idolatry/#:~:text=The%20typical%20reformed%20view%20and%20practice,On%20Church%20Buildings%20%26%20Architecture%E2%80%99%20%28RBO&amp;text=The%20typical%20reformed%20view%20and%20practice%20was%20that&amp;text=See%20%5Balso%5D%20%E2%80%98On%20Church%20Buildings%20%26%20Architecture%E2%80%99%20%28RBO" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4993fb7e8a" data-kw="">
<blockquote><p>With regard to “removing… monuments of idolatry,” establishment Anglicans had long affirmed and practiced this, interpreting the phrase as referring (only) to such Romanist monuments and not to the Anglican ceremonies, the latter being held to be not inherently unlawful.¹ ¹ So bishop Richard Cox (c. 1500–1581), who opposed John Knox at Frankfurt regarding the Anglican Liturgy, was a zealous and firm remover of Romanist monuments of superstition and idolatry: Wenig, “Reformation during the Episcopate of Richard Cox,” pp. 167 &amp; 170.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Larger Catechism: 2nd Commandment, Question 108” in A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</cite>, p. 73</span></figcaption>

— Travis Fentiman, “Editor’s Extended Introduction”, “Larger Catechism: 2nd Commandment, Question 108” in A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p. 73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWith+regard+to+%E2%80%9Cremoving%E2%80%A6+monuments+of+idolatry%2C%E2%80%9D+establishment+Anglicans+had+long+affirmed+and+practiced+this%2C+interpreting+the+phrase+as+referring+%28only%29+to+such+Romanist+monuments+and+not+to+the+Anglican+ceremonies%2C+the+latter+being+held+to+be+not+inherently+unlawful.%C2%B9+%C2%B9+So+bishop+Richard+Cox+%28c.+1500%E2%80%931581%29%2C+who+opposed+John+Knox+at+Frankfurt+regarding+the+Anglican+Liturgy%2C+was+a+zealous+and+firm+remover+of+Romanist+monuments+of+superstition+and+idolatry%3A+Wenig%2C+%E2%80%9CReformation+during+the+Episcopate+of+Richard+Cox%2C%E2%80%9D+pp.+167+%26+170.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D%2C+%E2%80%9CLarger+Catechism%3A+2nd+Commandment%2C+Question+108%E2%80%9D+in+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+1644%3B+RBO%2C+2025%29%2C+p.+73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4993fb7e8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4993fb7e8a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monuments-badges-of-idolatry/#:~:text=With%20regard%20to%20%E2%80%9Cremoving,Richard%20Cox%2C%E2%80%9D%20pp.%20167%20%26%20170&amp;text=With%20regard%20to%20%E2%80%9Cremoving&amp;text=Episcopate%20of%20Richard%20Cox%2C%E2%80%9D%20pp.%20167%20%26%20170" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90b837260d" data-kw="">
<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>

</figure><figure class="quote" id="q-fb19f9bc9a" data-kw="">
<blockquote><p>…they [Formalists] tell us that it is needless to abolish utterly things and rites which the Papists have abused to idolatry and superstition, and that it is enough to purge them from the abuse and to restore them again to their right use. Hence Saravia will not have pium crucis usum [a pious use of the cross] to be abolished cum abusu [when abused], but holds it enough that the abuse and superstition be taken away… Answer 1: Calvin (Resp. ad Versipel., p. 41.4) answering that which Cassander alleged out of an Italian writer, abusu non tolli bonum usum [by abuse is not taken away a good use], he admits it only to be true in things which are instituted by God Himself: not so in things ordained by men: for the very use of such things or rites as have no necessary use in God’s worship, and which men have devised only at their own pleasure, is taken away by idolatrous abuse. Pars tutior [a part more to be examined] here, is to put them wholly away; and there is by a great deal more danger in retaining than in removing them. 2. The [Scriptural] proofs which I have produced for the proposition about which now we debate [Isa. 30:22; Jude 23; Ex. 34:13; Dt. 7:25-26; Num. 33:52-53; Dt. 7:5; 12:2-3; Isa. 27:9] do not only infer that things and rites which have been notoriously abused to idolatry should be abolished in case they be not restored to a right use, but simply and absolutely that in any wise they are to be abolished. God commanded to say to the coverings and the ornaments of idols, ‘get you hence’ [Isa. 30:22]. It is not enough [that] they be purged from the abuse, but simpliciter [simply], they themselves must pack them and be gone. How did Jacob with the earrings of the idols, Elijah with Baal’s altar [1 Kings 18:30], Jehu with his vestments [2 Kings 10:22-28], Josiah with his houses [2 Kings 23:4-19], Manasseh with his altars [2 Chron. 33:15], Moses with the golden calf, Joshua with the temples of Canaan, Hezekiah with the brazen serpent? Did they retain the things themselves and only purge them from the abuse? Belike if these our Opposites had been their counsellors, they had advised them to be contented with such a moderation: yet we see they were better counselled when they destroyed utterly the things themselves: whereby we know that they were of the same mind with us and thought that things abused to Idolatry, if they have no necessary use, are far better away than aplace. Did Daniel refuse Bel’s meat because it was not restored to the right use? Nay, if that had been all, it might have been quickly helped, and the meat sanctified by the Word of God and prayer. Finally, were the Churches of Pergamos and Thyatira [Rev. 2:12-29] reproved because they did not restore things sacrificed to idols to their right use? or, were they not rather reproved for having anything at all adoe with the things themselves? … Though it be indifferent to choose this place or that place, etc., also to use these vessels or other vessels [for the Lord’s Supper], etc., yet the Dr. (I trust) will not deny that temples, houses of prayer, vessels and bells are of a necessary use (which exeems them from the touch of our present argument); whereas beside, that it is not necessary to kneel in the communion in this place more than in that place, neither to keep the feasts of Christ’s nativity, passion, etc. upon these days more than upon other days, etc.; the things themselves are not necessary in their kind and it is not necessary to keep any festival day, nor to kneel at all in the act of receiving the communion. There is also another respect which hinders temples, vessels, etc. from coming within the compass of this our argument: but neither does it agree to the controverted ceremonies. Temples, houses of prayer, vessels for the ministration of the sacraments and bells are not used by us in divine worship as things sacred or as holier than other houses, vessels and bells; but we use them only for natural necessity, partly for that common decency which has no less place in the actions of civil than of sacred assemblies: yea in some cases they may be applied to civil uses, as has been said. Whereas the controverted ceremonies are respected and used as sacred rites and as holier than any circumstance which is alike common to civil and sacred actions, neither are they used at all out of the case of worship. We see now a double respect wherefore our argument infers not the necessity of abolishing and destroying such temples, vessels and bells as have been abused to idolatry, viz. because it can neither be said that they are not things necessary, nor yet that they are things sacred. Nevertheless (to add this by the way), howbeit for those reasons the retaining and using of temples [church buildings] which have been polluted with idols be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2) also and Zanchius (in 4th Praec., col. 709) do plainly insinuate. Whereby I mean to defend (though not as in itself necessary, yet as expedient pro tunc [for the occasion], that which the reformators of the Church of Scotland did in casting down some of those churches which had been consecrated to Popish idols, and of a long time polluted with idolatrous worship. As on the one part the reformators (not without great probability) feared, that so long as these churches were not made even with the ground, the memory of that superstition whereunto they had been employed and accustomed should have been in them preserved and with some sort of respect recognized: so on the other part they saw it expedient to demolish them for strengthening the hands of such as adhered to the Reformation, for putting Papists out of all hope of the reentry of Popery and for hedging up the way with thorns that the idolatrously minded might not find their paths. … Secondly, our Opposites answer us that beside the purging of things and rites abused by idolators from their idolatrous pollution and the restoring of them to a right use, preaching and teaching against the superstition and abuse which has followed upon them is another means to avoid that harm which we fear to ensue upon the retaining of them. Answer: 1. …It is not enough with the scribes and Pharisees to teach out of Moses’s Chair what the people should do, but all occasions, yea appearances of evil, are to be taken out of their sight. Efficacius enim &amp; plus movent, quae in oculos quam quae in aures incidunt. Potuerat &amp; Hezekias populum monere, ne Serpentem adorarent, sed maluit confringere &amp; penitus è conspectu auferre, &amp; rectius fecit, says one well to this purpose. 2. Experience has taught to how little purpose such admonitions do serve. Calvin writing to the Lord Protector of England of some Popish ceremonies which did still remain in that Church after the Reformation of the same, desires that they may be abolished because of their former abuse in time of Popery. Quid enim (says he) illae Ceremoniae aliud fuerunt, quam totidem lenocinia quae miseras animas ad malum perducerent, etc. (Epist. &amp; Resp., p. 86) But because he saw that some might answer that which our Formalists answer now to us, and say it were enough to warn and teach men that they abuse not these ceremonies and that the abolishing of the ceremonies themselves were not necessary, therefore immediately he subjoins these words, Iam si decautione agitur, monebuntur homines scilicet, ne ad illas nunc impingant, etc. Quis tamen non videt obdurari ipsos nihilominus, nihil ut infaelici illa cautione obtineri possit. Whereupon he concludes that if such ceremonies were suffered to remain, this should be a mean to nourish a greater hardness and obfirmation in evil, and a vail drawn, so that the sincere doctrine which is propounded should not be admitted as it ought to be. In another epistle to Cranmer, Archbishop of Canterbury (Ibid., col. 136), he complains that external superstitions were so corrected in the Church of England, ut residui maneant innumeri surculi, qui assidue polluent. And what good then was done by their admonitions whereby they did in some sort snede [cut or section] the reviving twigs of old superstition, since forasmuch as they were not wholly eradicated, they did still shoot forth again. If a man should dig a pit by the wayside for some commodity of his own, and then admonish the travelers to take heed to themselves if they go that way in the darkness of the night, who would hold him excusable? How then shall they be excused who dig a most dangerous pit, which is like to ruin many souls, and yet will have us to think that they are blameless for that they warn men to beware of it? … Paybody… says that God did not absolutely condemn things abused to idolatry, and tells us of three conditions on which it was lawful to spare idolatrous appurtenances: …3. If they were without certain danger of ensnaring people into idolatry. Answer: …His third condition rests, and touching it I ask, what if those idolatrous appurtenances be not without apparent danger of ensnaring people into idolatry? Are we not commanded to abstain from all appearance of evil? Will he correct the apostle and teach us that we need not care for apparent, but for certain dangers? What more apparent danger of ensnaring people into idolatry than unnecessary ceremonies, which have been dedicated to and polluted with idols, and which being retained, do both admonish us to remember upon old idolatry, and move us to return to the same, as I have before made evident?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…they [Formalists] tell us that it is needless to abolish utterly things and rites which the Papists have abused to idolatry and superstition, and that it is enough to purge them from the abuse and to restore them again to their right use. Hence Saravia will not have pium crucis usum [a pious use of the cross] to be abolished cum abusu [when abused], but holds it enough that the abuse and superstition be taken away… Answer 1: Calvin (Resp. ad Versipel., p. 41.4) answering that which Cassander alleged out of an Italian writer, abusu non tolli bonum usum [by abuse is not taken away a good use], he admits it only to be true in things which are instituted by God Himself: not so in things ordained by men: for the very use of such things or rites as have no necessary use in God’s worship, and which men have devised only at their own pleasure, is taken away by idolatrous abuse. Pars tutior [a part more to be examined] here, is to put them wholly away; and there is by a great deal more danger in retaining than in removing them. 2. The [Scriptural] proofs which I have produced for the proposition about which now we debate [Isa. 30:22; Jude 23; Ex. 34:13; Dt. 7:25-26; Num. 33:52-53; Dt. 7:5; 12:2-3; Isa. 27:9] do not only infer that things and rites which have been notoriously abused to idolatry should be abolished in case they be not restored to a right use, but simply and absolutely that in any wise they are to be abolished. God commanded to say to the coverings and the ornaments of idols, ‘get you hence’ [Isa. 30:22]. It is not enough [that] they be purged from the abuse, but simpliciter [simply], they themselves must pack them and be gone. How did Jacob with the earrings of the idols, Elijah with Baal’s altar [1 Kings 18:30], Jehu with his vestments [2 Kings 10:22-28], Josiah with his houses [2 Kings 23:4-19], Manasseh with his altars [2 Chron. 33:15], Moses with the golden calf, Joshua with the temples of Canaan, Hezekiah with the brazen serpent? Did they retain the things themselves and only purge them from the abuse? Belike if these our Opposites had been their counsellors, they had advised them to be contented with such a moderation: yet we see they were better counselled when they destroyed utterly the things themselves: whereby we know that they were of the same mind with us and thought that things abused to Idolatry, if they have no necessary use, are far better away than aplace. Did Daniel refuse Bel’s meat because it was not restored to the right use? Nay, if that had been all, it might have been quickly helped, and the meat sanctified by the Word of God and prayer. Finally, were the Churches of Pergamos and Thyatira [Rev. 2:12-29] reproved because they did not restore things sacrificed to idols to their right use? or, were they not rather reproved for having anything at all adoe with the things themselves? … Though it be indifferent to choose this place or that place, etc., also to use these vessels or other vessels [for the Lord’s Supper], etc., yet the Dr. (I trust) will not deny that temples, houses of prayer, vessels and bells are of a necessary use (which exeems them from the touch of our present argument); whereas beside, that it is not necessary to kneel in the communion in this place more than in that place, neither to keep the feasts of Christ’s nativity, passion, etc. upon these days more than upon other days, etc.; the things themselves are not necessary in their kind and it is not necessary to keep any festival day, nor to kneel at all in the act of receiving the communion. There is also another respect which hinders temples, vessels, etc. from coming within the compass of this our argument: but neither does it agree to the controverted ceremonies. Temples, houses of prayer, vessels for the ministration of the sacraments and bells are not used by us in divine worship as things sacred or as holier than other houses, vessels and bells; but we use them only for natural necessity, partly for that common decency which has no less place in the actions of civil than of sacred assemblies: yea in some cases they may be applied to civil uses, as has been said. Whereas the controverted ceremonies are respected and used as sacred rites and as holier than any circumstance which is alike common to civil and sacred actions, neither are they used at all out of the case of worship. We see now a double respect wherefore our argument infers not the necessity of abolishing and destroying such temples, vessels and bells as have been abused to idolatry, viz. because it can neither be said that they are not things necessary, nor yet that they are things sacred. Nevertheless (to add this by the way), howbeit for those reasons the retaining and using of temples [church buildings] which have been polluted with idols be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2) also and Zanchius (in 4th Praec., col. 709) do plainly insinuate. Whereby I mean to defend (though not as in itself necessary, yet as expedient pro tunc [for the occasion], that which the reformators of the Church of Scotland did in casting down some of those churches which had been consecrated to Popish idols, and of a long time polluted with idolatrous worship. As on the one part the reformators (not without great probability) feared, that so long as these churches were not made even with the ground, the memory of that superstition whereunto they had been employed and accustomed should have been in them preserved and with some sort of respect recognized: so on the other part they saw it expedient to demolish them for strengthening the hands of such as adhered to the Reformation, for putting Papists out of all hope of the reentry of Popery and for hedging up the way with thorns that the idolatrously minded might not find their paths. … Secondly, our Opposites answer us that beside the purging of things and rites abused by idolators from their idolatrous pollution and the restoring of them to a right use, preaching and teaching against the superstition and abuse which has followed upon them is another means to avoid that harm which we fear to ensue upon the retaining of them. Answer: 1. …It is not enough with the scribes and Pharisees to teach out of Moses’s Chair what the people should do, but all occasions, yea appearances of evil, are to be taken out of their sight. Efficacius enim &amp; plus movent, quae in oculos quam quae in aures incidunt. Potuerat &amp; Hezekias populum monere, ne Serpentem adorarent, sed maluit confringere &amp; penitus è conspectu auferre, &amp; rectius fecit, says one well to this purpose. 2. Experience has taught to how little purpose such admonitions do serve. Calvin writing to the Lord Protector of England of some Popish ceremonies which did still remain in that Church after the Reformation of the same, desires that they may be abolished because of their former abuse in time of Popery. Quid enim (says he) illae Ceremoniae aliud fuerunt, quam totidem lenocinia quae miseras animas ad malum perducerent, etc. (Epist. &amp; Resp., p. 86) But because he saw that some might answer that which our Formalists answer now to us, and say it were enough to warn and teach men that they abuse not these ceremonies and that the abolishing of the ceremonies themselves were not necessary, therefore immediately he subjoins these words, Iam si decautione agitur, monebuntur homines scilicet, ne ad illas nunc impingant, etc. Quis tamen non videt obdurari ipsos nihilominus, nihil ut infaelici illa cautione obtineri possit. Whereupon he concludes that if such ceremonies were suffered to remain, this should be a mean to nourish a greater hardness and obfirmation in evil, and a vail drawn, so that the sincere doctrine which is propounded should not be admitted as it ought to be. In another epistle to Cranmer, Archbishop of Canterbury (Ibid., col. 136), he complains that external superstitions were so corrected in the Church of England, ut residui maneant innumeri surculi, qui assidue polluent. And what good then was done by their admonitions whereby they did in some sort snede [cut or section] the reviving twigs of old superstition, since forasmuch as they were not wholly eradicated, they did still shoot forth again. If a man should dig a pit by the wayside for some commodity of his own, and then admonish the travelers to take heed to themselves if they go that way in the darkness of the night, who would hold him excusable? How then shall they be excused who dig a most dangerous pit, which is like to ruin many souls, and yet will have us to think that they are blameless for that they warn men to beware of it? … Paybody… says that God did not absolutely condemn things abused to idolatry, and tells us of three conditions on which it was lawful to spare idolatrous appurtenances: …3. If they were without certain danger of ensnaring people into idolatry. Answer: …His third condition rests, and touching it I ask, what if those idolatrous appurtenances be not without apparent danger of ensnaring people into idolatry? Are we not commanded to abstain from all appearance of evil? Will he correct the apostle and teach us that we need not care for apparent, but for certain dangers? What more apparent danger of ensnaring people into idolatry than unnecessary ceremonies, which have been dedicated to and polluted with idols, and which being retained, do both admonish us to remember upon old idolatry, and move us to return to the same, as I have before made evident?”

— George Gillespie, English Popish Ceremonies (1637), pt. 3, ch. 2, pp. 21-23, 25-26, 30-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6they+%5BFormalists%5D+tell+us+that+it+is+needless+to+abolish+utterly+things+and+rites+which+the+Papists+have+abused+to+idolatry+and+superstition%2C+and+that+it+is+enough+to+purge+them+from+the+abuse+and+to+restore+them+again+to+their+right+use.+Hence+Saravia+will+not+have+pium+crucis+usum+%5Ba+pious+use+of+the+cross%5D+to+be+abolished+cum+abusu+%5Bwhen+abused%5D%2C+but+holds+it+enough+that+the+abuse+and+superstition+be+taken+away%E2%80%A6+Answer+1%3A+Calvin+%28Resp.+ad+Versipel.%2C+p.+41.4%29+answering+that+which+Cassander+alleged+out+of+an+Italian+writer%2C+abusu+non+tolli+bonum+usum+%5Bby+abuse+is+not+taken+away+a+good+use%5D%2C+he+admits+it+only+to+be+true+in+things+which+are+instituted+by+God+Himself%3A+not+so+in+things+ordained+by+men%3A+for+the+very+use+of+such+things+or+rites+as+have+no+necessary+use+in+God%E2%80%99s+worship%2C+and+which+men+have+devised+only+at+their+own+pleasure%2C+is+taken+away+by+idolatrous+abuse.+Pars+tutior+%5Ba+part+more+to+be+examined%5D+here%2C+is+to+put+them+wholly+away%3B+and+there+is+by+a+great+deal+more+danger+in+retaining+than+in+removing+them.+2.+The+%5BScriptural%5D+proofs+which+I+have+produced+for+the+proposition+about+which+now+we+debate+%5BIsa.+30%3A22%3B+Jude+23%3B+Ex.+34%3A13%3B+Dt.+7%3A25-26%3B+Num.+33%3A52-53%3B+Dt.+7%3A5%3B+12%3A2-3%3B+Isa.+27%3A9%5D+do+not+only+infer+that+things+and+rites+which+have+been+notoriously+abused+to+idolatry+should+be+abolished+in+case+they+be+not+restored+to+a+right+use%2C+but+simply+and+absolutely+that+in+any+wise+they+are+to+be+abolished.+God+commanded+to+say+to+the+coverings+and+the+ornaments+of+idols%2C+%E2%80%98get+you+hence%E2%80%99+%5BIsa.+30%3A22%5D.+It+is+not+enough+%5Bthat%5D+they+be+purged+from+the+abuse%2C+but+simpliciter+%5Bsimply%5D%2C+they+themselves+must+pack+them+and+be+gone.+How+did+Jacob+with+the+earrings+of+the+idols%2C+Elijah+with+Baal%E2%80%99s+altar+%5B1+Kings+18%3A30%5D%2C+Jehu+with+his+vestments+%5B2+Kings+10%3A22-28%5D%2C+Josiah+with+his+houses+%5B2+Kings+23%3A4-19%5D%2C+Manasseh+with+his+altars+%5B2+Chron.+33%3A15%5D%2C+Moses+with+the+golden+calf%2C+Joshua+with+the+temples+of+Canaan%2C+Hezekiah+with+the+brazen+serpent%3F+Did+they+retain+the+things+themselves+and+only+purge+them+from+the+abuse%3F+Belike+if+these+our+Opposites+had+been+their+counsellors%2C+they+had+advised+them+to+be+contented+with+such+a+moderation%3A+yet+we+see+they+were+better+counselled+when+they+destroyed+utterly+the+things+themselves%3A+whereby+we+know+that+they+were+of+the+same+mind+with+us+and+thought+that+things+abused+to+Idolatry%2C+if+they+have+no+necessary+use%2C+are+far+better+away+than+aplace.+Did+Daniel+refuse+Bel%E2%80%99s+meat+because+it+was+not+restored+to+the+right+use%3F+Nay%2C+if+that+had+been+all%2C+it+might+have+been+quickly+helped%2C+and+the+meat+sanctified+by+the+Word+of+God+and+prayer.+Finally%2C+were+the+Churches+of+Pergamos+and+Thyatira+%5BRev.+2%3A12-29%5D+reproved+because+they+did+not+restore+things+sacrificed+to+idols+to+their+right+use%3F+or%2C+were+they+not+rather+reproved+for+having+anything+at+all+adoe+with+the+things+themselves%3F+%E2%80%A6+Though+it+be+indifferent+to+choose+this+place+or+that+place%2C+etc.%2C+also+to+use+these+vessels+or+other+vessels+%5Bfor+the+Lord%E2%80%99s+Supper%5D%2C+etc.%2C+yet+the+Dr.+%28I+trust%29+will+not+deny+that+temples%2C+houses+of+prayer%2C+vessels+and+bells+are+of+a+necessary+use+%28which+exeems+them+from+the+touch+of+our+present+argument%29%3B+whereas+beside%2C+that+it+is+not+necessary+to+kneel+in+the+communion+in+this+place+more+than+in+that+place%2C+neither+to+keep+the+feasts+of+Christ%E2%80%99s+nativity%2C+passion%2C+etc.+upon+these+days+more+than+upon+other+days%2C+etc.%3B+the+things+themselves+are+not+necessary+in+their+kind+and+it+is+not+necessary+to+keep+any+festival+day%2C+nor+to+kneel+at+all+in+the+act+of+receiving+the+communion.+There+is+also+another+respect+which+hinders+temples%2C+vessels%2C+etc.+from+coming+within+the+compass+of+this+our+argument%3A+but+neither+does+it+agree+to+the+controverted+ceremonies.+Temples%2C+houses+of+prayer%2C+vessels+for+the+ministration+of+the+sacraments+and+bells+are+not+used+by+us+in+divine+worship+as+things+sacred+or+as+holier+than+other+houses%2C+vessels+and+bells%3B+but+we+use+them+only+for+natural+necessity%2C+partly+for+that+common+decency+which+has+no+less+place+in+the+actions+of+civil+than+of+sacred+assemblies%3A+yea+in+some+cases+they+may+be+applied+to+civil+uses%2C+as+has+been+said.+Whereas+the+controverted+ceremonies+are+respected+and+used+as+sacred+rites+and+as+holier+than+any+circumstance+which+is+alike+common+to+civil+and+sacred+actions%2C+neither+are+they+used+at+all+out+of+the+case+of+worship.+We+see+now+a+double+respect+wherefore+our+argument+infers+not+the+necessity+of+abolishing+and+destroying+such+temples%2C+vessels+and+bells+as+have+been+abused+to+idolatry%2C+viz.+because+it+can+neither+be+said+that+they+are+not+things+necessary%2C+nor+yet+that+they+are+things+sacred.+Nevertheless+%28to+add+this+by+the+way%29%2C+howbeit+for+those+reasons+the+retaining+and+using+of+temples+%5Bchurch+buildings%5D+which+have+been+polluted+with+idols+be+not+in+itself+unlawful%2C+yet+the+retaining+of+every+such+temple+is+not+ever+necessary%2C+but+sometimes+it+is+expedient+for+further+extirpation+of+superstition+to+demolish+and+destroy+some+such+temples+as+have+been+horribly+abused+to+idolatry%2C+as+Calvin+%28Commentary+on+Dt.+12%3A2%29+also+and+Zanchius+%28in+4th+Praec.%2C+col.+709%29+do+plainly+insinuate.+Whereby+I+mean+to+defend+%28though+not+as+in+itself+necessary%2C+yet+as+expedient+pro+tunc+%5Bfor+the+occasion%5D%2C+that+which+the+reformators+of+the+Church+of+Scotland+did+in+casting+down+some+of+those+churches+which+had+been+consecrated+to+Popish+idols%2C+and+of+a+long+time+polluted+with+idolatrous+worship.+As+on+the+one+part+the+reformators+%28not+without+great+probability%29+feared%2C+that+so+long+as+these+churches+were+not+made+even+with+the+ground%2C+the+memory+of+that+superstition+whereunto+they+had+been+employed+and+accustomed+should+have+been+in+them+preserved+and+with+some+sort+of+respect+recognized%3A+so+on+the+other+part+they+saw+it+expedient+to+demolish+them+for+strengthening+the+hands+of+such+as+adhered+to+the+Reformation%2C+for+putting+Papists+out+of+all+hope+of+the+reentry+of+Popery+and+for+hedging+up+the+way+with+thorns+that+the+idolatrously+minded+might+not+find+their+paths.+%E2%80%A6+Secondly%2C+our+Opposites+answer+us+that+beside+the+purging+of+things+and+rites+abused+by+idolators+from+their+idolatrous+pollution+and+the+restoring+of+them+to+a+right+use%2C+preaching+and+teaching+against+the+superstition+and+abuse+which+has+followed+upon+them+is+another+means+to+avoid+that+harm+which+we+fear+to+ensue+upon+the+retaining+of+them.+Answer%3A+1.+%E2%80%A6It+is+not+enough+with+the+scribes+and+Pharisees+to+teach+out+of+Moses%E2%80%99s+Chair+what+the+people+should+do%2C+but+all+occasions%2C+yea+appearances+of+evil%2C+are+to+be+taken+out+of+their+sight.+Efficacius+enim+%26+plus+movent%2C+quae+in+oculos+quam+quae+in+aures+incidunt.+Potuerat+%26+Hezekias+populum+monere%2C+ne+Serpentem+adorarent%2C+sed+maluit+confringere+%26+penitus+%C3%A8+conspectu+auferre%2C+%26+rectius+fecit%2C+says+one+well+to+this+purpose.+2.+Experience+has+taught+to+how+little+purpose+such+admonitions+do+serve.+Calvin+writing+to+the+Lord+Protector+of+England+of+some+Popish+ceremonies+which+did+still+remain+in+that+Church+after+the+Reformation+of+the+same%2C+desires+that+they+may+be+abolished+because+of+their+former+abuse+in+time+of+Popery.+Quid+enim+%28says+he%29+illae+Ceremoniae+aliud+fuerunt%2C+quam+totidem+lenocinia+quae+miseras+animas+ad+malum+perducerent%2C+etc.+%28Epist.+%26+Resp.%2C+p.+86%29+But+because+he+saw+that+some+might+answer+that+which+our+Formalists+answer+now+to+us%2C+and+say+it+were+enough+to+warn+and+teach+men+that+they+abuse+not+these+ceremonies+and+that+the+abolishing+of+the+ceremonies+themselves+were+not+necessary%2C+therefore+immediately+he+subjoins+these+words%2C+Iam+si+decautione+agitur%2C+monebuntur+homines+scilicet%2C+ne+ad+illas+nunc+impingant%2C+etc.+Quis+tamen+non+videt+obdurari+ipsos+nihilominus%2C+nihil+ut+infaelici+illa+cautione+obtineri+possit.+Whereupon+he+concludes+that+if+such+ceremonies+were+suffered+to+remain%2C+this+should+be+a+mean+to+nourish+a+greater+hardness+and+obfirmation+in+evil%2C+and+a+vail+drawn%2C+so+that+the+sincere+doctrine+which+is+propounded+should+not+be+admitted+as+it+ought+to+be.+In+another+epistle+to+Cranmer%2C+Archbishop+of+Canterbury+%28Ibid.%2C+col.+136%29%2C+he+complains+that+external+superstitions+were+so+corrected+in+the+Church+of+England%2C+ut+residui+maneant+innumeri+surculi%2C+qui+assidue+polluent.+And+what+good+then+was+done+by+their+admonitions+whereby+they+did+in+some+sort+snede+%5Bcut+or+section%5D+the+reviving+twigs+of+old+superstition%2C+since+forasmuch+as+they+were+not+wholly+eradicated%2C+they+did+still+shoot+forth+again.+If+a+man+should+dig+a+pit+by+the+wayside+for+some+commodity+of+his+own%2C+and+then+admonish+the+travelers+to+take+heed+to+themselves+if+they+go+that+way+in+the+darkness+of+the+night%2C+who+would+hold+him+excusable%3F+How+then+shall+they+be+excused+who+dig+a+most+dangerous+pit%2C+which+is+like+to+ruin+many+souls%2C+and+yet+will+have+us+to+think+that+they+are+blameless+for+that+they+warn+men+to+beware+of+it%3F+%E2%80%A6+Paybody%E2%80%A6+says+that+God+did+not+absolutely+condemn+things+abused+to+idolatry%2C+and+tells+us+of+three+conditions+on+which+it+was+lawful+to+spare+idolatrous+appurtenances%3A+%E2%80%A63.+If+they+were+without+certain+danger+of+ensnaring+people+into+idolatry.+Answer%3A+%E2%80%A6His+third+condition+rests%2C+and+touching+it+I+ask%2C+what+if+those+idolatrous+appurtenances+be+not+without+apparent+danger+of+ensnaring+people+into+idolatry%3F+Are+we+not+commanded+to+abstain+from+all+appearance+of+evil%3F+Will+he+correct+the+apostle+and+teach+us+that+we+need+not+care+for+apparent%2C+but+for+certain+dangers%3F+What+more+apparent+danger+of+ensnaring+people+into+idolatry+than+unnecessary+ceremonies%2C+which+have+been+dedicated+to+and+polluted+with+idols%2C+and+which+being+retained%2C+do+both+admonish+us+to+remember+upon+old+idolatry%2C+and+move+us+to+return+to+the+same%2C+as+I+have+before+made+evident%3F%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+3%2C+ch.+2%2C+pp.+21-23%2C+25-26%2C+30-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb19f9bc9a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fb19f9bc9a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monuments-badges-of-idolatry/#:~:text=they%20%5BFormalists%5D%20tell%20us%20that%20it,as%20I%20have%20before%20made%20evident&amp;text=they%20%5BFormalists%5D%20tell%20us%20that%20it%20is%20needless&amp;text=the%20same%2C%20as%20I%20have%20before%20made%20evident" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the worship service itself, it is by no means unlawful to use things, rites, and actions borrowed from the worshippers of idols and polluted with idolatry if, from the law of nature, they are either necessarily presupposed for worship, or if the causes and conditions of the same, without which worship would be impossible, demand them; which conditions are time and place of worship, a baptistry, cups, dishes, tables, the opening of the mouth, extending of the hand, going to the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla theologiae, 14.37 trans. Charles Johnson</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the worship service itself, it is by no means unlawful to use things, rites, and actions borrowed from the worshippers of idols and polluted with idolatry if, from the law of nature, they are either necessarily presupposed for worship, or if the causes and conditions of the same, without which worship would be impossible, demand them; which conditions are time and place of worship, a baptistry, cups, dishes, tables, the opening of the mouth, extending of the hand, going to the table.”

</figure><figure class="quote" id="q-8ba66c0ba7" data-kw="">
<blockquote><p>In the abolishing of the monuments of idolatry, they [Independents and congregationalists] agree so far with the Brownists [separatists], that they will not name the days of the week, the months of the year, the places of meeting after the ordinary manner; Yet they make no scruple to use the churches builded in the time of Popery, nor of bells [for calling to public worship, etc.], though invented by a Pope and baptized with all the Popish superstitions. How this does stand with their principles, I do not well know…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6</cite>, pp. 116-17</span></figcaption>

</figure><figure class="quote" id="q-1d68760fc2" data-kw="">
<blockquote><p>But especially take heed of that which is true superstition indeed, by which here I mean the making of any new parts of religion to ourselves and fathering them upon God, who never made them. Of this there are two sorts, positive and negative: When we falsely say, ‘This is a duty commanded by God,’ or when we falsely say, ‘This is a sin forbidden by God.’ Take heed of both. I do not speak here of doing or not doing the same things upon any other account (as human duties, or mere conveniences or the like), but as they are falsely pretended to be divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 58, ‘Take heed of Superstition, and observe well the circular course of zealous superstition…’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 278-95</cite>, p. 282</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-d1540f6e1e" data-kw="">
<blockquote><p>Fifthly, it is not superstition to do the same material thing which another does superstitiously; if we have not the same superstitious conceit of it as he has. If a Papist should anoint the sick as a sacrament, and a protestant do it as a medicine, the former is superstition and not the latter. And so in other things. Sixthly, whether that indifferent thing remain indifferent to our use which others use to superstition is a case which a judicious collation of circumstances must determine. His superstitious use does not make it simply a sin in any other who has none of his false conceits and ends (else some superstitious persons so abusing meat and drink and clothes and all things in the world might make all things become unlawful to us: or at least deprive us of all our liberty in things indifferent). Seventhly, if we avoid another’s superstition as to the form or intention which makes it superstition, and this as a sin, we do well: If we avoid the matter itself which he uses superstitiously, because it is by him made scandalous, we do our duty, when it is scandalous indeed, and no contrary greater accident maketh it our duty. But if we take it to be simply superstition or sin to do materially the same action which a superstitious person does, we are superstitious in avoiding his superstitious act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 58, ‘Take heed of Superstition, and observe well the circular course of zealous superstition…’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 278-95</cite>, pp. 285-86</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

s" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d1540f6e1e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-superstition/#:~:text=Fifthly%2C%20it%20is%20not%20superstition%20to,superstitious%20in%20avoiding%20his%20superstitious%20act&amp;text=Fifthly%2C%20it%20is%20not%20superstition%20to%20do%20the&amp;text=we%20are%20superstitious%20in%20avoiding%20his%20superstitious%20act" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c009570fd8" data-kw="">
<blockquote><p>There may be therefore two heads of superstition. §5. 1. Negative, when men abstain from some things under a notion of religion, or worship of God, which are not forbidden by God, but left free and indifferent: either not forbidden, or, if once they were, now [they are] antiquated, or outdated… And of this sort was that, Col. 2:21, ‘Touch not, taste not, handle not;’ which was superstitious negative will-worship. §6. 2. Positive, when men of their own hearts and heads set up ways of religion, to worship God by, which He never commanded; and this (as was said) may be committed against any of the four first Commandments… Now this positive superstition may be exemplified in many particulars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-cawdry.html">Daniel Cawdry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Diatribe triplex… (London: Wright, 1654), ‘Of Superstition,’</cite>, p. 6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There may be therefore two heads of superstition. §5. 1. Negative, when men abstain from some things under a notion of religion, or worship of God, which are not forbidden by God, but left free and indifferent: either not forbidden, or, if once they were, now [they are] antiquated, or outdated… And of this sort was that, Col. 2:21, ‘Touch not, taste not, handle not;’ which was superstitious negative will-worship. §6. 2. Positive, when men of their own hearts and heads set up ways of religion, to worship God by, which He never commanded; and this (as was said) may be committed against any of the four first Commandments… Now this positive superstition may be exemplified in many particulars…”

<blockquote><p>…as I will show in more detail, the Anglican formularies do indeed prohibit all icon veneration… His [Dr. Hoskin’s] most important point is the “distinction between worship and veneration.”… The Reformation position cannot be easily sidestepped by the use of distinctions which the Reformers themselves understood and rejected… The rest of this essay will highlight confessional statements from various Reformation churches, including the Anglicans and the Lutherans, to show that there is no place for the veneration of images… Indeed, the rejection of image veneration is a truly pan-Protestant position… Still, the historical record is clear. The Protestant confessions give no allowance for the veneration of icons.</p></blockquote>

<blockquote><p>…when I consider the proper end for which churches are erected, it appears to me more unbecoming their sacredness than I well can tell, to admit any other images than those living symbols which the Lord has consecrated by His own word: I mean Baptism and the Lord’s Supper, with the other ceremonies. By these our eyes ought to be more steadily fixed, and more vividly impressed, than to require the aid of any images which the wit of man may devise. Such, then, is the incomparable blessing of images—a blessing, the want [lack] of which, if we believe the Papists, cannot possibly be compensated!</p></blockquote>

<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>

</figure><figure class="quote" id="q-942af74721" data-kw="">
<blockquote><p>Though making of images simply be not unlawful and discharged by this [2nd] Commandment, yet thereby every representation of God (who is the object to be worshipped) and every image religiously made use of in worship is condemned (though civil and political images and statues, which are used as ornaments, or badges of honor, or remembrancers of some fact, etc. be not condemned)… …images (otherwise lawful) when abused to idolatry become unlawful, and are not to be suffered but orderly to be removed, we call that more than a civil or a common use, when religious worship or reverence is purposely intended to them, or there is, by some one occasion or other, danger lest they may be so abused; and of this sort (viz. dangerous ones) are: 1. Images in places of worship, but it is not idolatry to have dead men’s images on their tombs or monuments in churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments… (London, 1675), 1st Commandment, pp. 55 &amp; 57-58</cite></span></figcaption>

</figure><figure class="quote" id="q-e26adb4488" data-kw="">
<blockquote><p>Again if by this phrase he [the opponent] mean that a purposed observation of an outward act, with an aim and reference to such a thing, is of necessity required to make up a ceremony or a ceremonious action, in worship or otherwise, it is a miserable mistake: Instance thus: A carnal protestant presents himself amongst such as are at mass, he professes to his companions, before he goes in, and does in the purpose of his heart seriously loath the pix and idol there, yet when it’s lifted up, he bows as others do: Let any man in reason tell me, did he not use or abuse rather a divine ceremony in that bowing or no? If the Rejoinder say yes, as he must, unless he will speak against all reason and truth: I then reply upon his own grounds: That outward action which is not purposely referred, that is not a ceremony; but this action is not purposely observed with any aim to that end for the party intended no such thing, purposed no such matter, but did it as a thing of-course, as a man should bow his knee for exercise when he is alone. 2. Peter withdrawing himself from the gentiles at the coming of the Jews, he did not purposely this, with reference to any Judaical seperation, as judging any legal pollution in joining with the gentiles, or holiness in parting from them, and therfore he did not practice any Jewish ceremony, according to the Rejoinder’s conceit, but directly contrary to the text: there is no end of these absurdities.</p></blockquote>

</figure><figure class="quote" id="q-d14eeca9bd" data-kw="">
<blockquote><p>Now that a man who adores before the painted or graven image of Christ, though he profess that he intends his whole adoration to Christ, and that he places the image before him only to represent Christ, and to stir up his mind to worship Christ, does nevertheless commit idolatry, I trust none of our Opposites will deny.</p></blockquote>

</figure><figure class="quote" id="q-cf84acc948" data-kw="">
<blockquote><p>Our Opposites here tell us of two things necessary to the making up of idolatry, neither of which is found in their kneeling. First, they say except there be an intention in the worshipper to adore the creature which is before his eyes, his kneeling before it is no idolatry… Answer. …Nay then the three children should not have been idolaters if they had kneeled before Nebuchadnezzar’s image, intending their worship to God only, and not to the image. Our Opposites here take the Nicodemites by the hand. But what says Calvin? ‘Si isti boni sapientesque Sophistae, ibi tum fuissent, simplicitatem illorum trium servorum Dei irrisissent. Nam hujusmodi credo cos verbis objurgassent: miseri homines istud quidem*non est adorare, quum vos in rebus nullam fidem adhibetis: nulla est Idololatria nisi ubi est devotio, hoc est quaedam animi ad idola colenda venerandasque adjunctio atque applicatio, &amp;c.’ (De fugiend. idololat., homily 1) If Paybody had been in Calvin’s place he could not have called the [protestant] Nicodemites idolaters, forasmuch as they have no intention to worship the Popish images when they kneel and worship before them. Nay, the grossest idolaters that ever were, shall by this doctrine be no idolaters, and Paul shall be censured for teaching that the Gentiles did worship devils, since they did not intend to worship devils. ‘Idololatrae nec olim in Paganismo intendebant, nec hodie in Papatu intendunt, Daemonibus offerre. Quid tum? Apostolus contrarium pronuntiat, quicquid illi intendant,’ says Pareus (Com. in illum locum, sect. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.”

— Samuel Rutherford, Letters (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+the+religious+homage+done+to+an+image%2C+or+even+to+elements%2C+is+in+itself+an+external+act+of+idolatry%2C+insofar+as+the+act+is+concerned%2C+although+the+intention+of+such+homage+may+be+directed+to+God+the+Great+First+Cause%2C+%E2%80%94so+the+act+of+kneeling+to+a+piece+of+bread%2C+seeing+that%2C+according+to+the+ordinance%2C+the+whole+man%2C+internal+and+external%2C+ought+to+be+engaged+in+the+elementary+signs%2C+is+a+relative+act+of+worship+and+an+adoration+of+the+bread+itself.+The+reason+is%3A+an+intention+to+worship+a+material+object+is+not+of+the+essence+of+external+adoration%2C+as+appears+in+a+religious+act+of+homage.+Thus%2C+the+bending+of+the+knee+before+the+Babylonish+image+is+an+external+act+of+worship%2C+even+though+the+three+youths+had+no+intention+to+worship+any+but+the+true+God%3B+and+in+like+manner%2C+those+who%2C+from+fear+or+the+hope+of+reward+or+vain-glory%2C+bend+the+knee+to+Jeroboam%E2%80%99s+golden+calf+%28which+the+text+clearly+enough+proclaims+to+have+been+done+by+the+king+himself%2C+from+no+religious+motive+but+the+mere+desire+to+rule%29%2C+do+pay+ad-+oration+to+the+calf+by+the+external+act%2C+although%2C+no+doubt%2C+they+may+suppose+the+calf+a+mere+created+object+and+unworthy+of+honor%2C%E2%80%94because+the+act+of+homage%2C+whether+we+mean+it+or+not%2C+is%2C+from+the+ordinance+of+God+and+nature%2C+a+symbol+of+worship.+Therefore%2C+as+the+bread+%5Bin+the+Lord%E2%80%99s+Supper%5D+denotes+the+body+of+Christ+%28even+though+that+idea+be+not+present+to+the+mind%29%2C+so+in+like+manner%2C+kneeling%2C+when+used+as+a+religious+service%2C+is+the+external+adoration+of+that+bread%2C+in+presence+of+which+we+bow+as+before+the+delegated+representative+of+God%2C+be+our+intention+what+it+may.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Letters+%28Edinburgh%2C+1894%29%2C+pp.+193-94+Also+reprinted+by+Banner+of+Truth.+Rutherford+is+here+quoting+from+some+other+public+document%2C+possibly+from+the+Latin+of+David+Calderwood%E2%80%99s+Altar+of+Damascus%2C+p.+595.+%7C+Letter+91%2C+to+Robert+Gordon+of+Knockbrex&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8994f6114d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8994f6114d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/religious-images-in-worship/#:~:text=As%20the%20religious%20homage%20done%20to,be%20our%20intention%20what%20it%20may&amp;text=As%20the%20religious%20homage%20done%20to%20an%20image&amp;text=of%20God%2C%20be%20our%20intention%20what%20it%20may" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

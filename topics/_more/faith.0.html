</figure><figure class="quote" id="q-d559e12113" data-kw="">
<blockquote><p>1. We never intended these Propositions for the taking any sober man (of any of the parties whose union we endeavor) from his former principles; nor for the laying down of any middle way, in which the differing parties may accommodate, by any abatement on each or any side, of their former opinions. For we know that can be no way of general accord, without a long and full debate of all differences, with all persons or with all the leaders that can sway the rest. For if we should satisfy all that we confer with, and jointly agree upon some abatement of our opinions; we cannot expect that others should be ever the more altered or united that hear not our reasons: Or if all should hear them, yet men’s judgments will be variously wrought on, according to the degrees of their strength or weakness; or according to their former prejudice and apprehensions; and much according to the inclination of their wills, to reformation, holiness, unity and peace. We do therefore suppose in these Propositions that those whom we unite with, do still retain their differing judgments; And our business is but this: To improve those points wherein we are all agreed, for unanimous practice. Till we have opportunity to seek after an accomodation of opinions, or a conviction of each other, we resolve, by God’s help, to close in an amicable practice of so much as we do consent in… We are not such strangers to ourselves and mankind as not to know that we must unavoidably be of various opinions while we live here in imperfection, and differ in part while we know but in part. We suppose the apostle never expected that all the Corinthians should in all things have the same opinions, when he so importunately persuades them by the name of our Lord Jesus Christ, to speak the same thing, and that there be no divisions among them, but that they be perfectly joined together in the same mind, and in the same judgement, 1 Cor. 1:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-3c5bf74804" data-kw="">
<blockquote><p>And having first corrupted [Church] government from the primitive simplicity, and made princes their lictors [jailors and executioners] (as [Hugo] Grotius speaks in that excellent epistle newly translated by Mr. Barksdale), they next corrupt doctrine and worship consequently. For tyrants must have their wills in everything: and numerous and needless laws and canons must be made to show their power and fulfil their wills, that they may be lawgivers and a rule to all the world. And when they have made a seeming necessity of doing things unnecessary, then to plead the necessity which they have made, is the sum of all their arguments. And they that are against strict and precise adhering to the Scriptures, or observance of God’s own commands, are yet so strict for obedience to their proud imperious wills that they persuade themselves and others that without it there can be no order, no unity, no peace, but rebellion and confusion: And so they cry up obedience, obedience, that their idol wills may be bowed to by all without control; And when they are mere usurpers, and use no power given them by God, they yet get the advantage of making all odious that obey them not in the least and greatest matters, by the names of schism, unruliness or such like. O say the Papal usurpers, ‘The Church must be obeyed, or there will be no order: Disobedience in small matters is no small sin,’ when they have set up an idol-power against Christ; as if to disobey Him, whose laws they make void by their traditions and usurpations were a lesser fault. And when they have departed as far from the Christian simplicity in doctrine, government and worship, as their voluminous councils and decretals, and missals differ from the ancient simple Christianity, and have made as many snares and engines to divide and tear the Church of Christ as there are noxious (that I say not needless) laws, canons, and decrees imposed as necessary to peace and concord, then no men’s mouths are more opened against schism, when they have unavoidably caused it, yea are the greatest schismatics; And no men call so loud for unity and concord, as they that have first made it a thing impossible. … … 2. Have they not room enough to show their power, and work enough to do in seeing to the execution of Christ’s own universal laws and preserving mere order and decency in undetermined circumstances, that all may be done to edification? 3. Does not every needless oath and subscription by which they would tie men faster to themselves in controvertible cases, plainly tend to undermine themselves and keep up still a conscientious party against them? For while men have nothing to do but live quietly under a government, they will be glad of peace: But when they are put to subscribe, declare, covenant and swear that all this is good or lawful, or that they will never be against it, it sets men unavoidably on the deepest studies of the case, and so all the people are set on trying and judging of that, which else they would never have meddled with: For what honest man will say, swear or promise he knows not what? Even as some crafty rebels would undermine princes by drawing them to put the controverted parts of their prerogative into the subjects’ oaths, that so they may make all the people students and judges of the cause, and unavoidably make factions and dissenters, that else would have lived quietly if they might: so do the Papal clergy ruin themselves by such over-doing impositions. I remember Lampridius tells us that Alexander Severus (that great enemy of injustice) was so severe that he would have made a law to regulate men’s apparel: But Ulpian changed his mind by telling him that many laws cause divisions and make occasions of disobedience. They cry out, ‘There will be no order if ministers and people be left to their own discretion in such and such circumstantials;’ but do they dream of perfect concord on earth? and that men of such various interests, tempers, educations, converse and degrees of knowledge should not differ in a word or gesture? Our English rulers make no laws what gesture shall be used in singing Psalms, or in hearing sermons, and there is no division or great disorder in them: But if on pretence of nearer concord, they should tie all to one gesture, this or that, we should presently find it an engine of division. And O how many such engines have the Papal clergy made and used long! and to what purpose? To silence faithful ministers, to torment faithful Christians in the inquisitions, to brand the best men with the names of heretics and schismatics, to gratify all profaneness and malignity, to quench brotherly love, and to tear the Church into pieces; and no experience will make them wiser.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

<blockquote><p>Though this [Syro-Phoenician / Canaanite] woman had not been regularly educated by any teacher, yet her faith in Christ was not a notion adopted by her at random, but was formed out of the law and the prophets. It was therefore not less absurd than wicked in that dog, Servetus, to abuse this example for the purpose of proving that faith may exist without promises. I do not deny that, in this sense, there may sometimes be a sort of implicit faith, that is, a faith which is not accompanied by a full and distinct knowledge of sound doctrine; provided we also hold that faith always springs from the word of God, and takes its origin from true principles, and therefore is always found in connection with some light of knowledge.</p></blockquote>

<blockquote><p>Controversy I: Is there implicit faith? Orthodox Position: Implicit faith, that is, intricate and not explicit, exists in two ways: 1. Regarding knowledge, when the things necessary for salvation are not sufficiently understood distinctly, as seen in the disciples of Christ, who imagined a worldly kingdom. Similarly, today, in many of the elect, there is a multitude of ignorance forgiven because they know the foundation of salvation. 2. Regarding the apprehension of Christ and His benefits, when at the time of first conversion and temptation, faith wavers (Isaiah 42:3; Matthew 5:6). Here, the desire to believe is accompanied by infinite sighs, which God approves (Romans 8:26). Position of Bellarmine: Implicit faith is that in which one agrees with the Church and professes to believe what the Church and its pastors believe. The Church is the pillar of truth, and the pastors who agree with the Roman Pope cannot err. Censure: Knowledge is of the essence of faith (Isaiah 53:11; John 17:3). Furthermore, the Church is called the pillar of truth not by inspiring authority but by the ministry of preserving and witnessing. Finally, there is a fallacy of begging the question involved.</p></blockquote>

<blockquote><p>5th Distinction. The faith of fundamentals [of Christianity] is implicit three ways: 1. In respect of the degree of believing; 2. In respect of the object; 3. In respect of the subject, or our adherence to things believed. [1.] In respect of degrees, the faith is implicit and weak three ways, as Calvin may teach: 1. Because we are ignorant of some less-fundamentals; 2. Because we see in a mirror and imperfectly [1 Cor. 13]; 3. In respect of believing upon a false ground, as for [believing doctrine solely for] miracles [and not ultimately because it is God’s Word]. [2.] In respect of the object, the certainty is most sure, as sure as that God cannot lie. [3.] In respect of our adherence of understanding and affections: in this respect the knowledge of fundamentals must be certain: 1. By a negative certitude which excludes doubting, and so pastor and people must have a certitude of fundamentals, as Rom. 14:5; Col. 1:9; Heb. 5:12; but for a positive certitude, there is not that measure required in a teacher that is in a scholar, for all the body cannot be an eye, 1 Cor. 12:17, yet is a Christian certitude and fulness of persuasion required even of all Christians, Col. 2:2; Col. 3:16, highest and greatest in its kind, though many may be saved with less; yet a distinct knowledge of fundamentals in all is not necessary by a necessity of the means, necessitate medii, as Beza and Doctor Ames teach (Beza, vol. 1, opul., p. 141; Ames, De C•ust., bk. 4, ch. 2, q. 3). [3. continued] There is a faith of fundamentals implicit in respect of the will and affections, which Papists make a wide faith, as the Jesuit Becanus (2nd part, de V•tu•i. Theolog., ch. 2, q. 3) think[s] to believe these [are the] two fundamentals, 1. That there is a God; 2. That this God has a providence concerning men’s salvation, though other particulars be not known. Or implicit faith is, says Estius (bk. 3, d. 25, q. 2), when any is ready to believe what the Church shall teach; which faith (Suarez says, de Trip., disp. virt. Theolo., 13, section 8), though it include ignorance, yet keeps men from the danger of errors, because it does submit the mind to the nearest rule of teaching, to wit, to the Church; the knowledge of fundamentals in this sense does not save, but condemn. Thomas says better than he (22, q. 2, art. 5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, ch. 4, section 5, pp. 224-9</span></figcaption>

<blockquote><p>XX. Moreover, it is necessary that those things which pertain to the principal object of faith be believed distinctly; but the rest it is enough if they are believed confusedly. Those things are believed distinctly which faith apprehends separately and one by one. And this is the faith which is called explicit. Confusedly, those things which are not apprehended in particular, but only in some common principle in which they are contained: and this is the faith which they call implicit. For example, he who believes that the book of Judges is divinely inspired, yet has not read it nor heard anything recited about it: he indeed believes that the histories contained there are true, but implicitly and confusedly. But he who reads those histories and knows one by one the things narrated in that book about Samson and Gideon and the rest of the leaders of the Israelite people, he has explicit and distinct faith of them.</p></blockquote>

<blockquote><p>…He reigns by divine authority, because his reason for assuming the office of Mediator was, that descending from the bosom and incomprehensible glory of the Father, He might draw near to us. Wherefore there is the greater reason that we all should with one consent prepare to obey, and with the greatest alacrity yield implicit obedience to his will.</p></blockquote>

<blockquote><p>We are not our own; therefore, neither is our own reason or will to rule our acts and counsels… let us not make it our end to seek what may be agreeable to our carnal nature… we are God’s; let us therefore live and die to Him (Rom. 14:8); We are God’s; therefore, let his wisdom and will preside over all our actions. We are God’s; to Him, then, as the only legitimate end, let every part of our life be directed. O how great the proficiency of him, who taught that he is not his own, has withdrawn the dominion and government of himself from his own reason that he may give them to God. For as the surest source of destruction to men is to obey themselves, so the only haven of safety is to have no other will, no other wisdom, than to follow the Lord wherever He leads. Let this, then, be the first step, to abandon ourselves, and devote the whole energy of our minds to the service of God. By service, I mean not only that which consists in verbal obedience, but that by which the mind, divested of its own carnal feelings, implicitly obeys the call of the Spirit of God. This transformation (which Paul calls the renewing of the mind, Rom. 12:2; Eph. 4:23) though it is the first entrance to life, was unknown to all the philosophers. They give the government of man to reason alone, thinking that she alone is to be listened to; in short, they assign to her the sole direction of the conduct. But Christian philosophy bids her give place and yield complete submission to the Holy Spirit, so that the man himself no longer lives, but Christ lives and reigns in him (Gal. 2:20).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are not our own; therefore, neither is our own reason or will to rule our acts and counsels… let us not make it our end to seek what may be agreeable to our carnal nature… we are God’s; let us therefore live and die to Him (Rom. 14:8); We are God’s; therefore, let his wisdom and will preside over all our actions. We are God’s; to Him, then, as the only legitimate end, let every part of our life be directed. O how great the proficiency of him, who taught that he is not his own, has withdrawn the dominion and government of himself from his own reason that he may give them to God. For as the surest source of destruction to men is to obey themselves, so the only haven of safety is to have no other will, no other wisdom, than to follow the Lord wherever He leads. Let this, then, be the first step, to abandon ourselves, and devote the whole energy of our minds to the service of God. By service, I mean not only that which consists in verbal obedience, but that by which the mind, divested of its own carnal feelings, implicitly obeys the call of the Spirit of God. This transformation (which Paul calls the renewing of the mind, Rom. 12:2; Eph. 4:23) though it is the first entrance to life, was unknown to all the philosophers. They give the government of man to reason alone, thinking that she alone is to be listened to; in short, they assign to her the sole direction of the conduct. But Christian philosophy bids her give place and yield complete submission to the Holy Spirit, so that the man himself no longer lives, but Christ lives and reigns in him (Gal. 2:20).”

— John Calvin, Institutes of the Christian Religion, bk. 3, ch. 7, section 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+not+our+own%3B+therefore%2C+neither+is+our+own+reason+or+will+to+rule+our+acts+and+counsels%E2%80%A6+let+us+not+make+it+our+end+to+seek+what+may+be+agreeable+to+our+carnal+nature%E2%80%A6+we+are+God%E2%80%99s%3B+let+us+therefore+live+and+die+to+Him+%28Rom.+14%3A8%29%3B+We+are+God%E2%80%99s%3B+therefore%2C+let+his+wisdom+and+will+preside+over+all+our+actions.+We+are+God%E2%80%99s%3B+to+Him%2C+then%2C+as+the+only+legitimate+end%2C+let+every+part+of+our+life+be+directed.+O+how+great+the+proficiency+of+him%2C+who+taught+that+he+is+not+his+own%2C+has+withdrawn+the+dominion+and+government+of+himself+from+his+own+reason+that+he+may+give+them+to+God.+For+as+the+surest+source+of+destruction+to+men+is+to+obey+themselves%2C+so+the+only+haven+of+safety+is+to+have+no+other+will%2C+no+other+wisdom%2C+than+to+follow+the+Lord+wherever+He+leads.+Let+this%2C+then%2C+be+the+first+step%2C+to+abandon+ourselves%2C+and+devote+the+whole+energy+of+our+minds+to+the+service+of+God.+By+service%2C+I+mean+not+only+that+which+consists+in+verbal+obedience%2C+but+that+by+which+the+mind%2C+divested+of+its+own+carnal+feelings%2C+implicitly+obeys+the+call+of+the+Spirit+of+God.+This+transformation+%28which+Paul+calls+the+renewing+of+the+mind%2C+Rom.+12%3A2%3B+Eph.+4%3A23%29+though+it+is+the+first+entrance+to+life%2C+was+unknown+to+all+the+philosophers.+They+give+the+government+of+man+to+reason+alone%2C+thinking+that+she+alone+is+to+be+listened+to%3B+in+short%2C+they+assign+to+her+the+sole+direction+of+the+conduct.+But+Christian+philosophy+bids+her+give+place+and+yield+complete+submission+to+the+Holy+Spirit%2C+so+that+the+man+himself+no+longer+lives%2C+but+Christ+lives+and+reigns+in+him+%28Gal.+2%3A20%29.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes%2C+bk.+3%2C+ch.+7%2C+section+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff84e20c164.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f84e20c164.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=We%20are%20not%20our%20own%3B%20therefore,and%20reigns%20in%20him%20%28Gal.%202%3A20&amp;text=We%20are%20not%20our%20own%3B%20therefore%2C%20neither%20is&amp;text=Christ%20lives%20and%20reigns%20in%20him%20%28Gal.%202%3A20" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. Still, however, we see not how necessary that obedience is, unless we at the same time consider how prone our carnal nature is to shake off the yoke of God whenever it has been treated with some degree of gentleness and indulgence. It just happens to it, as with refractory horses, which, if kept idle for a few days at hack and manger, become ungovernable and no longer recognize the rider, whose command before they implicitly obeyed. And we invariably become what God complains of in the people of Israel — waxing gross and fat, we kick against Him who reared and nursed us (Deut. xxxii. 15). The kindness of God should allure us to ponder and love his goodness…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 3, ch. 8, section 5</span></figcaption>

</figure><figure class="quote" id="q-9bbfb27e69" data-kw="">
<blockquote><p>A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... (1637), pt. 3, ch. 6, pp. 104-6</span></figcaption>

<blockquote><p>There is a twofold judgment which discerns and judges of faith. The one absolute, whereby the Most High God, whose supreme Authority alone, binds us to believe whatsoever He propounds to be believed by us, has in his written Word pronounced, declared and established what He would have us to believe concerning Himself or his worship. The other [is] limited and subordinate…</p></blockquote>

<blockquote><p>When we kneel to kings, we signify by that gesture that we submit ourselves to higher powers, not simply (says Peter Martyr) but insofar as they command not things against the Word of the Lord. When we adore God, we adore Him as the Supreme Majesty, being ready to obey Him in what He shall command, without any exception…</p></blockquote>

</figure><figure class="quote" id="q-9b1e48f8bd" data-kw="">
<blockquote><p>This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 42</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.”

<blockquote><p>V. Human veracity, and therefore authority, is always fallible, and therefore cannot generate infallible faith. On the contrary, in divine things, as the truth and authority of God speaking, so faith had in Him is infallible. 1 Sam. 24:10, “And David said to Saul, ‘Why do you listen to the words of men who say …?&#x27;” And ch. 27:12, “So Achish believed David.” 1 Kings 10:7, “However I did not believe the words until I came …” Prov. 14:15, “The simple believes every word.” This, therefore, is faith–to believe someone’s words. When he is a man, it is human faith; but if God’s words are adhered to, it is divine faith. 1 John 5:9, “If we receive the witness of men, the witness of God is greater” – that is, that we may receive the testimony which God has given about his Son. There men are believed by human faith; here God, by divine faith. John 4:41-42, “And many more believed because of His own word,” that is, Christ’s. “Then they said to the woman, ‘Now we believe, not because of what you said, for we ourselves have heard Him and we know that this is indeed the Christ, the Savior of the world.&#x27;</p></blockquote>

<blockquote><p>7. Let reason be brought in captivity to the obedience of Christ, 2 Cor. 10:5. That which made the Antitrinitarians and Socinians fall away from the belief of the Trinity of persons in the Godhead, and of the union of the two natures of God and man in the person of Christ, was because their reason could not comprehend these articles: which is the ground of their opinion professed by themselves. When I speak of captivating reason, I do not mean implicit faith: the eyes of my understanding must be so far opened by the Holy Ghost, that I may know such an article is held forth in Scripture to be believed, and therefore I do believe that it is, though my reason cannot comprehend how it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 11, ‘Of Stability &amp; Firmness in the Truth’, p. 140</span></figcaption>

<blockquote><p>II. The question is not whether faith… is a full and perfect knowledge of mysteries, both as to the reason (to dioti) and the fact (to hoti), so that we ought to believe nothing which we do not clearly and distinctly perceive. For as most gospel mysteries in the greatest degree escape the grasp of the reason, they can never be clearly and distinctly perceived by us as to the wherefore (to dioti) or the how (to pos) or their nature and mode, but only as to the fact because they are truly thus revealed.</p></blockquote>

<blockquote><p>And now I shall leave to be considered by wise men these vast differences betwixt the Papists’ implicit faith and the case of our [presbyterian] Churches governed by elderships: 1. The Church assents not to that which the consistory of elders decrees or does, except it be agreeing to the Word of God, as the Reasoner [Independent writer] himself says: but there is no such limitation in the Papists’ implicit faith. 2. The consistory [local session] of elders does not press anything upon the Church imperiously, or by naked will and authority, without any reason, as the Church of Rome does with those from whom she requires implicit faith. 3. The Papists know not what those things be which they believe by implicit faith: so that such a faith is rightly called mera articulorum fidei ignorantia, a mere ignorance of the articles of faith: but the decrees of our elderships whereunto our Churches do consent are made known unto them. 4. Our Churches are, by the judgement of Christian discretion, to examine all things propounded unto them, even the decrees of the elders, whereas Papists may not examine what the Church propounds or commands. 5. Papists, by their implicit faith, believe whatsoever the Church believes because they think the Church cannot err, but our Churches conceive not only their particular elderships, but ecumenical councils, to be subject to error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (Edinburgh, 1641), Postscript, pp. 16-18</span></figcaption>

<blockquote><p>…his [Christ’s] servants, who stood firm in their opposition to Prelacy… but if they will have patience to hear me to ‘Amen’ [at the end], I may possibly convince them of a truth they, are not willing to hear; for I not only grant that they have forgotten their Master’s directions, inhibiting them to to lift up themselves above their brethren… they must have leave to put out mine and other men’s eyes besides (which we are not willing to give them; though if any man would gratify his Grace [the king], and their Lordships [the prelates], he must part with these in the first place; for an implicit faith is the basis and foundation of their Kingdom of darkness, without which it would fall about their ears and but overwhelm them in the rubbish… before this come so much as under debate, almost with indifferent men, whether God be angry at their way? His very giving of them up to persecute his people &amp; servants, says nothing, if it say not this, that whatever be their outward prosperity, he has classed them with Pharaoh, in pouring out his plagues upon their heart…</p></blockquote>

<blockquote><p>Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience.</p></blockquote>

<blockquote><p>…turbulent spirits do not love to examine things by rule, to call things to account, but follow their own fiery humor and set upon their own will with violence: but godliness takes off men from this ruggedness and turbulency of spirit and makes them gentle and peaceable: let them be never so active, never so forward, never so zealous in any thing, yet if you will call them to examine things by rule, they will meekly and patiently hear you; yea, a child shall lead them, Isa. 11:6. And yet further; turbulent they are not, for none [are] more obedient to authority than they; none see that majesty of God in authority as they do; none obey authority out of conscience so as they do. If the will of men in authority, rather than authority, shall require anything that the authority of Heaven forbids, that they do not; because they cannot obey, for conscience sake: And so sacred do they account authority, that they would have no obedience performed to it, but obedience for conscience sake. Blind obedience the Church of God has long ago exploded as too servile for Christian spirits: this were more servile than selling men’s bodies in the market for slaves, which Christianity abhors. It were too uncharitable a conceit of Christian magistrates, to think that they should require of, or expect from any other obedience than in, and for the Lord; and in this obedience, those who are godly, are so forward…</p></blockquote>

<blockquote><p>But, 2. All the power and authority of synods we conceive to be ministerial, not lordly, limited, regulated by the only Word of God in the Scripture, and in matters circumstantial, of order and decency, as time, place, persons (observe I say not in mystical religions, ceremonies, called, but unjustly, ‘indifferent’, or the like) by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren and the glory of God; and a lawful synod we judge has power ministerial from Christ to pass constitutions [in Greek] ‘decrees’, Acts 16:4 (‘laws’ I do not call them, because Christ is the only Lawgiver, King, and head of his Church, his officers are only servants and heralds to hold forth his laws) and these constitutions [or creeds and confessions] condemning Arminianism, Socinianism, Familism, Antinomianism, etc…. and commanding in the Lord that they consent to the form of sound doctrine, rebuking all that subvert souls, and trouble the Churches, Acts 15:23-24, are to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will and mere authority of the heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, … (London, 1648), ‘A Brotherly and Free Epistle…’, no page numbers</span></figcaption>

</figure><figure class="quote" id="q-38002ef9b4" data-kw="">
<blockquote><p>2. Papists will have the magistrates so to defend the faith, as they have not power to judge [by way of jurisdiction in spiritual things], not [even] as Christians with the judgement of discretion, what is right or wrong, but they must, as blind servants, execute what Prelates decree, yea and see (non propriis (says Henry Blyssemius) sed alienis Episcoporum ac praelatorum suorum oculis videre) ‘not with their own eyes, but with the eyes of their Prelates,’ yea and the magistrate should not read the Scripture (say Papists and Nicanor’s brethren, the Jesuits), [which is] expressly contrary to God’s Word, Dt. 17:17, ‘He shall read in the book of the Law all the days of his life,’ Josh. 1:8, but only believe as the Church believes, and this is blind obedience that they require of princes; this faith or obedience we think abominable in all men, as [also] in princes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), pt. 2, Appendix, Objection: ‘David also prepared materials for the Temple…’, p. 449</span></figcaption>

arget="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-540fca7fa1" data-kw="">
<blockquote><p>…nor was it ever in our heart to teach that the Christian magistrate is with blind obedience to execute the decrees of the Church; for this poor argument, if it have any nerves, as it would cast upon us the doctrine of Papists and Jesuits to make the ways of Christ odious, it has as great strength against the preaching of the Gospel; for if Paul or any faithful pastor preach to the magistrates of Berea that Christ, whom the Jews crucified, is the only Redeemer and Saviour of the world, and that therefore they are, as nurse-fathers, to give liberty to the servants of God, to preach this doctrine and to hinder any to persecute such as shall preach this doctrine, yet by their civil authority, and ex officio [out of their office], they are not for that, with blind obedience to receive it and not to search the Scriptures to try whether that which is preached be agreeable to the Scriptures, nor to take it upon the bare authority of the preacher, but they are to search the Scriptures and obliged to believe the preached Gospel. But not as magistrates [are they] either to preach themselves, or to judge authoritatively by virtue of their office, whether the preacher’s doctrine be the Gospel of Christ or no[t]: so if a synod, by the Holy Ghost and the light of Scriptures, determine anything for discipline or censure, the magistrate, as he may as a Christian, try the word preached, so may he the same way try the decrees and determinations of the Church, and not take them upon blind trust and accordingly punish the contraveners [to the Church’s decrees] as a magistrate, and as he is the minister of God that bears his sword; but yet he can no more as a magistrate, and by his office, prescribe such ecclesiastic laws (as wee have [in] Acts 15:28; 16:4) unto the Churches of God, or as a magistrate and by his office judge them unlawful and forbid them, than he can preach the word, or say it seemed good to the Holy Ghost [Acts 15:28] and to me who bears the sword, to command that the Churches observe such and such laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached before the Right Honorable House of Lords, in the Abbey Church at Westminster, Wednesday the 25th day of June</cite>, 1645…’ (London, 1645), pp. 20-22</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“…nor was it ever in our heart to teach that the Christian magistrate is with blind obedience to execute the decrees of the Church; for this poor argument, if it have any nerves, as it would cast upon us the doctrine of Papists and Jesuits to make the ways of Christ odious, it has as great strength against the preaching of the Gospel; for if Paul or any faithful pastor preach to the magistrates of Berea that Christ, whom the Jews crucified, is the only Redeemer and Saviour of the world, and that therefore they are, as nurse-fathers, to give liberty to the servants of God, to preach this doctrine and to hinder any to persecute such as shall preach this doctrine, yet by their civil authority, and ex officio [out of their office], they are not for that, with blind obedience to receive it and not to search the Scriptures to try whether that which is preached be agreeable to the Scriptures, nor to take it upon the bare authority of the preacher, but they are to search the Scriptures and obliged to believe the preached Gospel. But not as magistrates [are they] either to preach themselves, or to judge authoritatively by virtue of their office, whether the preacher’s doctrine be the Gospel of Christ or no[t]: so if a synod, by the Holy Ghost and the light of Scriptures, determine anything for discipline or censure, the magistrate, as he may as a Christian, try the word preached, so may he the same way try the decrees and determinations of the Church, and not take them upon blind trust and accordingly punish the contraveners [to the Church’s decrees] as a magistrate, and as he is the minister of God that bears his sword; but yet he can no more as a magistrate, and by his office, prescribe such ecclesiastic laws (as wee have [in] Acts 15:28; 16:4) unto the Churches of God, or as a magistrate and by his office judge them unlawful and forbid them, than he can preach the word, or say it seemed good to the Holy Ghost [Acts 15:2 </figure><figure class="quote" id="q-1dd146195a" data-kw="">
<blockquote><p>Sententia pastoris ligat te, pro tua salute, etiam si injusta fuerit.“ Envy cannot ascribe this to us; Calvin, Beza, yea, all our writers condemn blind obedience as brutish. … But that the magistrate is not obliged to execute the decrees of the Church without further examination, whether they be right or wrong, as Papists teach that the magistrate is to execute the decrees of their Popish councils with blind obedience and submit his faith to them, because he is a layman and may not dare to examine whether the Church does err or not, is clear: 1. Because if in hearing the Word all should follow the example of the men of Berea, not relying on the testimony of Paul or any preacher, try whether that which concerns their conscience and faith be agreeable to the Scriptures or no, and accordingly receive or reject; so in all things of discipline, the Magistrate is to try by the Word whether he ought to add his sanction to these decrees which the Church gives out for edification and whether he should draw the sword against such a one as a heretic and a perverter of souls: But the former is true: the magistrate’s practice in adding his civil sanction and in punishing heretics concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’ 2. The magistrate and all men have a command to try all things; Ergo, to try the decrees of the Church and to retain what is good, 1 Thess. 5:21, to try the spirits even of the Church, in their decrees, 1 Jn. 3:1. 3. We behooved to lay down this Popish ground, that 1. The Church cannot err in their decrees. 2. It’s against Scripture and reason that magistrates, and by the like reason, all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err, [and have] refused the ceremonies, are to consult with their own conscience whether this be not to make us appear disloyal and odious to magistracy in that which we never thought, far less to teach and profess it to the world. 4. Their chief reason is: The magistrate by our doctrine, by his office, is obliged: 1. To follow the judgment of the Church, and in that he is a servant or enslaved: Qui enim judicia aliorum sequi tenetur, is non regit, sed regitur, adeoque servus est, &amp; mancipium brutum eorum, quorum judicium sequi obligatur, and the magistrate (say they), as such, is neither to judge nor try what the Church decrees, but as a burrio, or hangman, [is] to execute that which the Church has decreed. But 1. I put it in form and retort it thus: They are servants and slaves who are obliged not to despise, but to hear and obey and so to follow the judgement of the prophets, the faithful pastors of Christ, preaching the Word of God soundly and orthodoxly. But not only magistrates, but all within the visible Church are obliged not to despise, but to hear and obey and so to follow the judgment of the prophets, the faithful pastors of Christ preaching the Word of God soundly and orthodoxly; Ergo, magistrates and all within the visible Church are slaves and servants. But the conclusion is absurd; Ergo, some of the premises [are absurd]; but the assumption is the Word of God: Judah was carried captive because they would not hear the prophets rising early in the morning and speaking to them. Also in the New Testament, this is true to the second coming of Christ: ‘He that heareth you, heareth me, he that despiseth you, despiseth me.’ And this, he that will not obey the servant of the supreme magistrate in that wherein he is a servant and holds forth the lawful commands of the supreme magistrate, he will not obey the supreme magistrate. The major proposition is the adversaries’; the assumption is express Scripture; let them see then to the conclusion. 2. When the adversary shall answer this argument with equal strength made against preaching and hearing the Word, they will answer their own argument made against Church-government. 3. This argument is made against synods-Popish, that cannot err, as our protestant divines object; and therefore the adversary is Popish here, not we. Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it. The other part is, they are servants and slaves who are to follow the judgement of the Church and councils with a reserve and a condition and limitation, insofar as they agree with the Word; now the major [premise] is false. 2. He that is obliged to follow the judgement of another does not rule, but is ruled; true, in that in which he follows the judgment of another. The magistrate, insofar as in matters of religion that concern his conscience, faith and practice, he follows pastors; he is not a ruler formally to those whose judgement he is obliged to follow. But in civil matters he may be, and is, a ruler to those same; for we answer to Papists who by this same argument would prove that Church-men are not subject to the magistrate, nor to civil laws: He that is a sheep is not to rule and command his shepherd; but the magistrate is a sheep and a member of the Church, and pastors and doctors are shepherds. We answer, in diverse considerations a magistrate as a magistrate in civil things, is not ruled by pastors and doctors, but he is to rule them: But a magistrate as a member of the Church, as a Christian in things that concern his conscience, is a sheep and to be ruled, [and he is] not a ruler to pastors and doctors, and so here; and therefore, non concluditur quod est [that is not concluded]…</p></blockquote>

ch+in+their+decrees.%E2%80%99+2.+The+magistrate+and+all+men+have+a+command+to+try+all+things%3B+Ergo%2C+to+try+the+decrees+of+the+Church+and+to+retain+what+is+good%2C+1+Thess.+5%3A21%2C+to+try+the+spirits+even+of+the+Church%2C+in+their+decrees%2C+1+Jn.+3%3A1.+3.+We+behooved+to+lay+down+this+Popish+ground%2C+that+1.+The+Church+cannot+err+in+their+decrees.+2.+It%E2%80%99s+against+Scripture+and+reason+that+magistrates%2C+and+by+the+like+reason%2C+all+others%2C+should+obey+the+decrees+of+the+Church+with+a+blind+faith%2C+without+inquiring+in+the+warrants+and+grounds+of+their+decrees%2C+which+is+as+good+Popery+as+magistrates+and+all+men+are+to+believe+as+the+Church+believes+with+an+implicit+faith%3B+so+ignorance+shall+be+the+mother+of+devotion%3B+Whoever+impute%5Bs%5D+this+to+us%2C+who+have+suffered+for+non-conformity%2C+and+upon+this+ground%2C+that+synods+can+err%2C+%5Band+have%5D+refused+the+ceremonies%2C+are+to+consult+with+their+own+conscience+whether+this+be+not+to+make+us+appear+disloyal+and+odious+to+magistracy+in+that+which+we+never+thought%2C+far+less+to+teach+and+profess+it+to+the+world.+4.+Their+chief+reason+is%3A+The+magistrate+by+our+doctrine%2C+by+his+office%2C+is+obliged%3A+1.+To+follow+the+judgment+of+the+Church%2C+and+in+that+he+is+a+servant+or+enslaved%3A+Qui+enim+judicia+aliorum+sequi+tenetur%2C+is+non+regit%2C+sed+regitur%2C+adeoque+servus+est%2C+%26+mancipium+brutum+eorum%2C+quorum+judicium+sequi+obligatur%2C+and+the+magistrate+%28say+they%29%2C+as+such%2C+is+neither+to+judge+nor+try+what+the+Church+decrees%2C+but+as+a+burrio%2C+or+hangman%2C+%5Bis%5D+to+execute+that+which+the+Church+has+decreed.+But+1.+I+put+it+in+form+and+retort+it+thus%3A+They+are+servants+and+slaves+who+are+obliged+not+to+despise%2C+but+to+hear+and+obey+and+so+to+follow+the+judgement+of+the+prophets%2C+the+faithful+pastors+of+Christ%2C+preaching+the+Word+of+God+soundly+and+orthodoxly.+But+not+only+magistrates%2C+but+all+within+the+visible+Church+are+obliged+not+to+despise%2C+but+to+hear+and+obey+and+so+to+follow+the+judgment+of+the+prophets%2C+the+faithful+pastors+of+Christ+preaching+the+Word+of+God+soundly+and+orthodoxly%3B+Ergo%2C+magistrates+and+all+within+the+visible+Church+are+slaves+and+servants.+But+the+conclusion+is+absurd%3B+Ergo%2C+some+of+the+premises+%5Bare+absurd%5D%3B+but+the+assumption+is+the+Word+of+God%3A+Judah+was+carried+captive+because+they+would+not+hear+the+prophets+rising+early+in+the+morning+and+speaking+to+them.+Also+in+the+New+Testament%2C+this+is+true+to+the+second+coming+of+Christ%3A+%E2%80%98He+that+heareth+you%2C+heareth+me%2C+he+that+despiseth+you%2C+despiseth+me.%E2%80%99+And+this%2C+he+that+will+not+obey+the+servant+of+the+supreme+magistrate+in+that+wherein+he+is+a+servant+and+holds+forth+the+lawful+commands+of+the+supreme+magistrate%2C+he+will+not+obey+the+supreme+magistrate.+The+major+proposition+is+the+adversaries%E2%80%99%3B+the+assumption+is+express+Scripture%3B+let+them+see+then+to+the+conclusion.+2.+When+the+adversary+shall+answer+this+argument+with+equal+strength+made+against+preaching+and+hearing+the+Word%2C+they+will+answer+their+own+argument+made+against+Church-government.+3.+This+argument+is+made+against+synods-Popish%2C+that+cannot+err%2C+as+our+protestant+divines+object%3B+and+therefore+the+adversary+is+Popish+here%2C+not+we.+Thus+they+are+servants+and+slaves+who+are+obliged+to+follow+the+judgment+of+councils+absolutely%2C+without+limitation%3B+and+because+they+say+it%2C+whether+they+warrant+their+decrees+by+the+Word+of+God+or+not%2C+that+is+a+true+major+proposition%3A+But+now+the+assumption+is+most+false%2C+for+neither+magistrates+nor+any+other+are+to+follow+the+judgment+of+the+Church+absolutely%2C+without+limitation%2C+and+because+they+say+it.+The+other+part+is%2C+they+are+servants+and+slaves+who+are+to+follow+the+judgement+of+the+Church+and+councils+with+a+reserve+and+a+condition+and+limitation%2C+insofar+as+they+agree+with+the+Word%3B+now+the+major+%5Bpremise%5D+is+false.+2.+He+that+is+obliged+to+follow+the+judgement+of+another+does+not+rule%2C+but+is+ruled%3B+true%2C+in+that+in+which+he+follows+the+judgment+of+another.+The+magistrate%2C+insofar+as+in+matters+of+religion+that+concern+his+conscience%2C+faith+and+practice%2C+he+follows+pastors%3B+he+is+not+a+ruler+formally+to+those+whose+judgement+he+is+obliged+to+follow.+But+in+civil+matters+he+may+be%2C+and+is%2C+a+ruler+to+those+same%3B+for+we+answer+to+Papists+who+by+this+same+argument+would+prove+that+Church-men+are+not+subject+to+the+magistrate%2C+nor+to+civil+laws%3A+He+that+is+a+sheep+is+not+to+rule+and+command+his+shepherd%3B+but+the+magistrate+is+a+sheep+and+a+member+of+the+Church%2C+and+pastors+and+doctors+are+shepherds.+We+answer%2C+in+diverse+considerations+a+magistrate+as+a+magistrate+in+civil+things%2C+is+not+ruled+by+pastors+and+doctors%2C+but+he+is+to+rule+them%3A+But+a+magistrate+as+a+member+of+the+Church%2C+as+a+Christian+in+things+that+concern+his+conscience%2C+is+a+sheep+and+to+be+ruled%2C+%5Band+he+is%5D+not+a+ruler+to+pastors+and+doctors%2C+and+so+here%3B+and+therefore%2C+non+concluditur+quod+est+%5Bthat+is+not+concluded%5D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+pp.+595-9+%7C+Ibid.%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1dd146195a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1dd146195a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=Sententia%20pastoris%20ligat%20te%2C%20pro%20tua,quod%20est%20%5Bthat%20is%20not%20concluded&amp;text=Sententia%20pastoris%20ligat%20te%2C%20pro%20tua%20salute%2C%20etiam&amp;text=non%20concluditur%20quod%20est%20%5Bthat%20is%20not%20concluded" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4bc6601082" data-kw="">
<blockquote><p>But magistrates as magistrates hold forth in their law-abstinence from those same sins of adultery, incest, murder… 2. Not under the pain of eternal wrath and condemnation, before the Judge of [the] quick and [the] dead: Magistrates as magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if magistrates do persuade the equity of abstinence from adultery, incest, murder in their statutes or acts of parliament from the Word of God, from the sixth and seventh command[ments] of the Decalogue, from the Judgment and eternal punishment that follows these sins, they so persuade not as magistrates [from their office per se], but as divines and as godly and Christian men; Yet my sense is not that the magistrate can lawfully command obedience in matters of religion not understood or known by the subjects: that were to exact blind obedience; but my meaning is that the magistrate as the magistrate holds not forth his commandments to teach and inform the conscience, as pastors do, but he presupposes that his mandates are known to be agreeable to the Word of God, and proposes them to the subjects to be obeyed.</p></blockquote>

<blockquote><p>Objection 4. The causes of war (says Mr. Simmons, sect. 4, p. 9) should not be made known to the subjects, who are to look more to the lawful call to war from the prince than to the cause of the war. [Rutherford’s] Answer: [1.] The parliament and all the judges and nobles are subjects to Royalists, if they should make war and shed blood upon blind obedience to the king, not inquiring either in causes of law or fact; they must resign their consciences to the king. 2. The king cannot make unlawful war to be lawful by any authority-royal, except he could raze out the Sixth Commandment [of the Decalogue]: therefore subjects must look more to the causes of war than to the authority of the king; and this were a fair way to make parliaments of both kingdoms [England and Scotland] set up Popery by the sword, and root out the Reformed religion upon the king’s authority [as was being done at the time of Rutherford writing], as the lawful call to war, not looking to the causes of war.</p></blockquote>

<blockquote><p>Now Faith.” Faith in the word of God is specially of three sorts: historical, miraculous, [and] justifying or saving faith. First, historical faith is not only a knowledge of the word, but an assent of the heart to the truth of it. And this faith is general not only to all men, good and bad, but even to the devils themselves: “Thou believest there is one God, thou doest well: the devils also believe it, and tremble” (James 2:19), Now he that will believe out of the Scripture there is one God, he will believe historically anything in the Scriptures. Second, miraculous, or the faith of miracles, which is an inward persuasion of the heart wrought by some special instinct of the Holy Ghost in some man, whereby he is truly persuaded that God will use him as His instrument for the working of some miracles. This is also general, both to elect and reprobate. Judas had it with the rest of the apostles. Thirdly, (commonly called justifying) faith, which is a special persuasion wrought by the Holy Ghost in the heart of the those that are effectually called concerning their reconciliation and salvation by Christ. Of these three sorts sof faith, the third is principally meant in this place….</p></blockquote>

ns-on-faith-in-hebrews-11/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-052e7bef5b" data-kw="">
<blockquote><p>We certainly admit that so long as we dwell as strangers in the world there is such a thing as implicit faith; not only because many things are as yet hidden from us, but because surrounded by many clouds of errors we do not comprehend everything. The height of wisdom for the most perfect is to go forward and, quietly and humbly, to strive still further. Therefore Paul exhorts believers that, if some disagree with others in any matter, they should wait for revelation [Phil. 3:15]. Experience obviously teaches that until we put off the flesh we attain less than we should like. And in our daily reading of Scripture we come upon many obscure passages that convict us of ignorance. With this bridle God keeps us within bounds, assigning to each his “measure of faith” [Rom. 12:3] so that even the best teacher may be ready to learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 3.2.4.</span></figcaption>

</figure><figure class="quote" id="q-07fd5129bb" data-kw="">
<blockquote><p>Therefore, as regards the primary points or articles of faith, man is bound to believe them, just as he is bound to have faith; but as to other points of faith, man is not bound to believe them explicitly, but only implicitly, or to be ready to believe them, in so far as he is prepared to believe whatever is contained in the Divine Scriptures. Then alone is he bound to believe such things explicitly, when it is clear to him that they are contained in the doctrine of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica, pt. 3, a Treatise on the Incarnation</cite>, 2a2ae 2.5, resp. dic.</span></figcaption>

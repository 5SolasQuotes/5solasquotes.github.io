<blockquote><p>Object. § I. But here mark a plot of spiritual treason. Satan, joining with our corruption, setteth the wit on work to persuade the soul that this inward rebellion is not so bad, because it is natural to us, as a condition of nature rising out of the first principles in our creation, and was curbed in by the bridle of original righteousness, which they would have accessory and supernatural, and therefore allege that concupiscence is less odious and more excusable in us, and so no great danger in yielding and betraying our souls unto it, and by that means persuading us that that which is our deadliest enemy hath no harm in it, nor meaneth any to us.

Ans. This rebellion of lusts against the understanding is not natural, as our nature came out of God’s hands at the first, Gen. i. 27; for this, being evil and the cause of evil, could not come from God, who is good and the cause of all good, and nothing but good, who, upon the creation of all things, pronounced them good, and, after the creation of man, pronounced of all things that they were very good, ver. 31. Now, that which is ill and very ill cannot be seated at the same time in that which is good and very good. God created man at the first right; he of himself ‘sought out many inventions,’ Eccles. vii. 29.

As God beautified the heaven with stars, and decked the earth with variety of plants, and herbs, and flowers, so he adorned man, his prime creature hero below, with all those endowments that were fit for a happy condition; and original righteousness was fit and due to an original and happy condition. Therefore, as the angels were created with all angelical perfections, and as our bodies were created in an absolute temper of all the humours, so the soul was created in that sweet harmony wherein there was no discord, as an instrument in tune, fit to be moved to any duty; as a clean, neat glass, the soul represented God’s image and holiness.

§.II. Therefore it is so far, that concupiscence should be natural, that the contrary to it, namely, righteousness, wherein Adam was created, was natural to him; though it were planted in man’s nature by God, and so in regard of the cause of it, was supernatural; yet because it was agreeable to that happy condition, without which he could not subsist, in that respect it was natural, and should have been derived, if he had stood, together with his nature, to his posterity. As heat in the air, though it hath its first impression from the heat of the sun, yet is natural, because it agreeth to the nature of that element; and though man be compounded of a spiritual and earthly substance, yet it is natural that the baser earthly part should be subject to the superior, because where there is different degrees of worthiness, it is fit there should be a subordination of the meaner to that which is in order higher.

The body naturally desires food and bodily contentments, yet in a man endued with reason, this desire is governed so as it becomes not inordinate. A beast sins not in its appetite, because it hath no power above to order it. A man that lives in a solitary place, far remote from company, may take his liberty to live as it pleaseth him; but if he comes to live under the government of some well-ordered city, then he is bound to submit to the laws and customs of that city, under penalty upon any breach of order; so the risings of the soul, howsoever in other creatures they are not blameable, having no commander in themselves, above them, yet in man they are to be ordered by reason and judgment.

Therefore it cannot be, that concupiscence should be natural, in regard of the state of creation. It was Adam’s sin; which had many sins in the womb of it, that brought this disorder upon the soul. Adam’s person first corrupted our nature, and nature being corrupted, corrupts our persons, and our persons being corrupted, increase the corruption of our nature, by custom of sinning, which is another nature in us. As a stream, the farther it runs from the spring head, the more it enlargeth its channel, by the running of lesser rivers into it, until it empties itself into the sea; so corruption, till it be overpowered by grace, swelleth bigger and bigger, so that though this disorder was not natural, in regard of the first creation, yet since the fall it has become natural, even as we call that which is common to the whole kind, and propagated from parents to their children, to be natural; so that it is both natural and against nature, natural now, but against nature in its first perfection.

And because corruption is natural to us, therefore, 1, We delight in it; whence it comes to pass, that our souls are carried along in an easy current, to the committing of any sin without opposition. 2. Because it is natural, therefore it is unwearied and restless, as light bodies are not wearied in their motion upwards, nor heavy bodies in their motion downwards, nor a stream in its running to the sea, because it is natural: hence it is that the ‘old man,’ Eph. iv. 22, is never tired in the ‘works of the flesh,’ Gal. v. 19, nor never drawn dry.

When men cannot act sin, yet they will love sin, and act it over again by pleasing thoughts of it, and by sinful speculations suck out the delight of sin; and are grieved, not for their sin, but because they want strength and opportunity to commit it; if sin would not leave them, they would never leave sin. This corruption of our nature is not wrought in us by reason and persuasions, for then it might be satisfied with reasons, but it is in us by way of a natural inclination, as iron is carried to the loadstone; and till our natures be altered, no reason will long prevail, but our sinful disposition, as a stream stopped for a little while, will break out with greater violence.

3. Being natural, it needs no help, as the earth needs no tillage to bring forth weeds. When our corrupt nature is carried contrary to that which is good, it is carried of itself, as when Satan lies or murders, it comes from his own cursed nature; and though Satan joineth with our corrupt nature, yet the proneness to sin, and the consent unto it, is of ourselves.</p></blockquote>

<blockquote><p>Q. What are the degrees of Concupiscence forbidden here?

A. The first is, wandering and evil thoughts, though we never like of them: for even the very rising of such thoughts in our minds, argueth our corruption of nature: for were it not for that inborn corruption, such thoughts could not once enter into our souls, further then they were offered unto us by some outward tentation of the devil, or of the world, as it was unto our Saviour Christ.

And although in the incorrupt state of man, he might dutifully have thought of the transgression of the Commandment, with a perfect hatred of it; yet the same should not have been (as now it is) suddenly rising in the mind, without thinking or meditation of the naughtiness and hatefulness thereof; where now these thoughts rise suddenly, and the hatred and detestation cometh after, and is not in such perfection as then it should have been. Whereas the Lord our God hath the eyes of his glory so pure, that he will not allow of the least corruption in the temple of our hearts, where he seateth himself.</p></blockquote>

</figure><figure class="quote" id="q-51a322c931" data-kw="">
<blockquote><p>If he should say in respect of these commandments, “I wish to keep them, but am mastered by my concupiscence,” then the Scripture responds to his free will, as I have already said: “Be not overcome of evil, but overcome evil with good.” In order, however, that this victory may be gained, grace renders its help; and were not this help given, then the law would be nothing but the strength of sin. For concupiscence is increased and receives greater energies from the prohibition of the law, unless the spirit of grace helps.

This explains the statement of the great Teacher of the Gentiles, when he says, “The sting of death is sin, and the strength of sin is the law.” See, then, I pray you, whence originates this confession of weakness, when a man says, “I desire to keep what the law commands, but am overcome by the strength of my concupiscence.”

And when his will is addressed, and it is said, “Be not overcome of evil,” of what avail is anything but the succour of God’s grace to the accomplishment of the precept? This the apostle himself afterwards stated; for after saying “The strength of sin is the law,” he immediately subjoined, “But thanks be to God, who giveth us the victory, through our Lord Jesus Christ.” It follows, then, that the victory in which sin is vanquished is nothing else than the gift of God, who in this contest helps free will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Grace and Free Will</cite>, (c. 427), 8 in Nicene and Post-Nicene Fathers 1, 5: 447.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-6586ea429d" data-kw="">
<blockquote><p>The predicate; “They have crucified the flesh, with the affections and lusts.” By flesh we are here to understand carnal concupiscence, the workings and motions of corrupt nature; and by the affections we are to understand, not the natural, but the inordinate affections; for Christ does not abolish and destroy, but correct and regulate the affections of those that are in him:

And by crucifying the flesh, we are not to understand the total extinction or perfect subduing of corrupt nature, but only the deposing of corruption from its regency and dominion in the soul; its dominion is taken away, though its life be prolonged for a season; but yet, as death surely, though slowly, follows crucifixion, (the life of crucified persons gradually departing frown them, with their blood) it is just so in the mortification of sin; and therefore what the apostle in this place calls crucifying, he calls in Rom. 8:13. mortifying. “If ye, through the Spirit, do mortify,” … if ye put to death the deeds of the body:

But he chuses, in this place, to call it crucifying, to show not only the conformity there is betwixt the death of Christ and the death of sin, in respect of shame, pain, and lingering slowness; but to denote also the principal means and instruments of mortification, viz. the death, or cross of Jesus Christ, in the virtue whereof believers do mortify the corruptions of their flesh; the great arguments and persuasives to mortification being drawn from the sufferings of Christ for sin. In a word, he does not say, They that believe Christ was crucified for sin, are Christ’s; but they, and they only, are his, who feel as well as profess the power and efficacy of the sufferings of Christ, in the mortification and subduing of their lusts and sinful affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 369.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-a58364034a" data-kw="">
<blockquote><p>1. A Christian man ought to aim even at that perfection which he understands he cannot attain in this life. For no sinner hath ever been able to mortify and restrain all the first motions of inordinate concupiscence; yet all are bound to attempt it: for that Divine mandate stands immoveable, Thou shalt not covet. Concerning which, Augustine, Epist. 200, ad Asellicum, truly said, The law, in declaring thou shah not covet, has laid down not the power which we have in this particular, but the object at which we should advance progressively.

2. Those first motions of inordinate desires are sins, though the mind does not assent to them. [Cardinal Robert] Bellarmin, therefore, is wrong, who concludes, in De stat. pecc. 5. 7, that that rebellious motion of concupiscence has the nature, not of guilt, but of punishment. Why does the Apostle call it evil? Why does he say it is to be mortified? He is not wont to speak thus about punishments; which he teaches us are to be borne patiently, not to be mortified or resisted. Let the Jesuit hear Paul, who in Rom. vii. not once, but often, terms inordinate concupiscence sin, even in the regenerate who consent to the law, and oppose these motions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

-first-motions-of-concupiscence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0f7add6483" data-kw="">
<blockquote><p>Evan. Yea, indeed, it is impossible for any mere man in the time of this life to keep it perfectly; yea, though he be a regenerate man; for the law requireth of man that he “love the Lord with all his heart, soul, and might;” and there is not the holiest man that lives, but he is flesh as well as spirit in all parts and faculties of his soul, and therefore cannot love the Lord perfectly.

Yea, and the law forbiddeth all habitual concupiscence, not only saying, “Thou shalt not consent to lust,” but, “Thou shalt not lust:” it doth not only command the binding of lust, but forbids also the being of lust: and who in this case can say, My heart is clean?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 181.</span></figcaption>

Yea, and the law forbiddeth all habitual concupiscence, not only saying, “Thou shalt not consent to lust,” but, “Thou shalt not lust:” it doth not only command the binding of lust, but forbids also the being of lust: and who in this case can say, My heart is clean?”

</figure><figure class="quote" id="q-9a61ae153e" data-kw="">
<blockquote><p>The heart of the Christian often for the moment spontaneously lusts for evil when the conscience promptly condemns and the will forbids and restrains and diverts the attention.

Although the man does not consent to the sin that is present in him, nevertheless the Christian feels that such movements of concupiscence are unholy, and worthy of condemnation, and he not only resists them but condemns and loathes himself because of them, and seeks to be purged Irom them at once by the atoning blood, and the sanctifying spirit of Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), pp 318-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-5c136847bf" data-kw="">
<blockquote><p>VI. That our very concupiscence and corruption of nature is a sin.

But if by God’s law be condemned whatsoever offence is repugnant to that first image of God, that is, to justice, holiness, and righteousness, wherein man was created, we hold that in man not only his actions committed with consent of his will against the law of God, but even the motions also of lust, yea, the concupiscence it self and the whole corruption of his nature is sin and by the law of God condemned, because it is repugnant to that uprightness and justice wherein man was created and wherein he ought and might have kept himself, if he would.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), X.VI, 1: 193.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-75ec95597a" data-kw="">
<blockquote><p>For this law, the origin of death, passed on from the first pair to their posterity, as is seen in the labour with which all men toil in the earth, and the travail of women in the pains of childbirth. For these sufferings they merited by the sentence of God, when they were convicted of sin; and we see them fulfilled not only in them, but also in their descendants, in some more, in others less, but nevertheless in all.

Whereas, however, the primaeval righteousness of the first human beings consisted in obeying God, and not having in their members the law of their own concupiscence against the law of their mind; now, since their sin, in our sinful flesh which is born of them, it is obtained by those who obey God, as a great acquisition, that they do not obey the desires of this evil concupiscence, but crucify in themselves the flesh with its affections and lusts, in order that they may be Jesus Christ’s, who on His cross symbolized this, and who gave them power through His grace to become the sons of God.

For it is not to all men, but to as many as have received Him, that He has given to be born again to God of the Spirit, after they were born to the world by the flesh. Of these indeed it is written: “But as many as received Him, to them gave He power to become the sons of God; which were born, not of the flesh, nor of blood, nor of the will of man, nor of the will of the flesh, but of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.37 in Nicene and Post-Nicene Fathers 1, 5: 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/75ec95597a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/03/augustine-of-hippo-on-grace-delivering-us-from-evil-concupiscence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>II. It [original corruption] is called also Concupiscence. …

III. Therefore the Papists do erroneously exempt it from being a sin, reckoning it among the works of God.

By the name of Concupiscence is understood, either that natural faculty of desire which was in man, even before his fall, or that corruption which naturally adheres to it, as it is in it, in the first act, and as it inclines man only to evil.</p></blockquote>

<figure class="quote" id="q-0a498e6e94" data-kw="">
<blockquote><p>It avails not, indeed, a little to increase our confidence, that we are united to the Son of God by a bond so close, that we can find in our nature that holiness of which we are in want; for he not only as God sanctifies us, but there is also the power of sanctifying in his human nature; not that it has it from itself, but that God had poured upon it a perfect fulness of holiness, so that from it we may all draw. And to this point this sentence refers, “For their sakes I sanctify myself.” (John 17:19.) If, then, we are sinful and unclean, we have not to go far to seek a remedy; for it is offered to us in our own flesh. If any one prefers to regard as intended here that spiritual unity which the godly have with the Son of God, and which differs much from that which men commonly have among themselves, I offer no objection, though I am disposed to follow what is more commonly received, as it is not inconsistent with reason</p></blockquote>

</figure><figure class="quote" id="q-ce5e3f750a" data-kw="">
<blockquote><p>1. What is meant by saying that the union of the elect with Christ “is the work of God’s grace”? This means that union with Christ is a gift of God, which is accomplished by the almighty work of his Holy Spirit; it is not something that we can achieve or do for ourselves.

2. What is meant by saying that we are “spiritually and mystically” joined to Christ? This expression guards against the idea that we are literally joined to Christ as if he were an earthly person. The church is the body of Christ, and Christians are the members of Christ, but only in a spiritual sense, not in a physical or material sense of the word.

3. Why does the catechism add the words “yet really and inseparably”? Because spiritual relationships, while mysterious and invisible, are yet true and real. We naturally tend to regard that which we cannot see or understand as imaginary or unreal. Our spiritual union with Christ is both invisible and mysterious, but that does not mean that it is unreal. Spiritual things, in their own sphere, are just as real as material things. Moreover, our union with Christ is also unbreakable and permanent. The person who is once truly joined to Christ will always be joined to Christ; therefore the catechism adds the word inseparably.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 144-45.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/union-with-christ.html">Union with Christ</a></span></div>

<blockquote><p>All other unions are dissoluble: a man may be plucked from his dwelling-house and lands, or they from him, though he have never so good a title to them; may be removed from his dearest friends, the husband from the wife, if not by other accidents in their lifetime, yet sure by death, the great dissolver of all those unions, and of that straitest one, of the soul with the body; but it can do nothing against this union [with Christ], but, on the contrary, perfects it.</p></blockquote>

</figure><figure class="quote" id="q-9d8bce4778" data-kw="">
<blockquote><p>The exaltation of the assumed nature to the highest and unspeakable dignity, is that honour, which the person of the son of God hath communicated to the nature assumed, so that he hath exalted it above all Angels &amp; men, whom he surpasseth, and excelleth by most far and unspeakable degrees. Heb. 14. Mat. 28.18. John. 17.2. Phil. 2.9. Ephes. 1.20.22.

That exaltation consisteth chiefly in these three points.

1. In the personal union with the word: because the human nature is assumed into the unity of the person of Gods son: so that it is the proper flesh of the eternal son of God, Heb. 2.16.

2. In the gifts, because it hath the fullness of all the gifts of the holy spirit, which can be in a creature, that is to say, it hath not only some gifts, as the rest of the Saints, who have them according to measure: but all gifts, not only in number, but even in the most excellent degree. John. 3.34. Those gifts given to the humanity of Christ, are created qualities: because his humanity is created. That truly is adorned with most excellent, and incomprehensible gifts, but such as do not overthrow and destroy the same.

3. In the fellowship of the office, both of the mediator between God and the believers, and also of the head of the Church, and of the Judge of the whole world. Mat. 28.18. Phil. 2.9. Ephesians. 1.20.22, Psal. 110.1.1. Timot. 2.5. 1. John. 2.12. Heb. 7.25.26.27. and 8.1. and 9.24.</p></blockquote>

</figure><figure class="quote" id="q-9a61c93ea0" data-kw="">
<blockquote><p>The Son must not be forgot here, because all grace is given in him by the Father; in such sort, that if any man will seek grace without Christ, he shall never get it. Therefore he who would have grace, let him seek it at God, through Christ: that he may receive it of that fullness that is in the Son. The Jew that will seek to the Father without the Son, shall never see grace.

Whom to is this grace and peace wished? to the Church at Thessalonica. Wherefore? Mark this ground. Because this Church is ingraft in the Father and in the Son by faith. Then first I see here: there is no grace, but from the Father and the son: and therefore there no wishing of grace to man or woman, but from the Father and the son, who are the fountain of all grace. Again I see grace, mercy and peace pertains to none, but to so many as are in this happy conjunction with the Father and the Son. Art thou in the Father? Art thou in the son, ingraft in him by a lively faith? Then grace pertains to thee: mercy and peace pertains to thee.

Art thou out of him, and not ingraft in him by faith? Let men wish welfare and peace to thee as they will, no grace, mercy nor peace pertains to thee. By grace &amp; peace is understood whatsoever blessings of God that follows on that conjunction and union that is with God the Father, and the Son Jesus Christ; As for example: Remission of sins, Justification before the Tribunal of God, Regeneration &amp; cleansing of this foul nature, peace, joy in the holy Ghost, &amp; life everlasting: all flows from this conjunction: and therefore it must follow, that to him who is out of this conjunction with the Father and the Son, there is no remission of sins: if thou be not united to the Father and the Son by faith; no salvation, no regeneration, no life everlasting, no peace for thee: all thy peace is false peace, and thou shalt curse the time that ever thou had that peace.

Then it must follow that this form of salutation, pertains not to the Jew this day, who is out of this conjunction, neither I, nor no man can say to the Jew this day, Peace and grace to thee from God the Father and from Christ Jesus his Son: neither pertains it to the Turk or Pagan, who are out of this union with God and Christ by faith. More then this, it will not be the name of any thing that will do the turn: there are many that takes upon them the name of a christian, &amp; so will seem to be in the union with the Father and the Son, that in heart have no conjunction with them: But I say to thee, it will not be the outward conjunction with them, in the name of a Christian, it will not be the wishing of good days and good evening that will do thee good, except thou find thy hart bound up in that blessed union with the Father and the Son Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), pp 4-5.</span></figcaption>

— Robert Rollock, Lectures upon the first and second Epistles of Paul to the Thessalonians, (Edinburgh: Robert Charteris, 1606), pp 4-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Son+must+not+be+forgot+here%2C+because+all+grace+is+given+in+him+by+the+Father%3B+in+such+sort%2C+that+if+any+man+will+seek+grace+without+Christ%2C+he+shall+never+get+it.+Therefore+he+who+would+have+grace%2C+let+him+seek+it+at+God%2C+through+Christ%3A+that+he+may+receive+it+of+that+fullness+that+is+in+the+Son.+The+Jew+that+will+seek+to+the+Father+without+the+Son%2C+shall+never+see+grace.%0A%0AWhom+to+is+this+grace+and+peace+wished%3F+to+the+Church+at+Thessalonica.+Wherefore%3F+Mark+this+ground.+Because+this+Church+is+ingraft+in+the+Father+and+in+the+Son+by+faith.+Then+first+I+see+here%3A+there+is+no+grace%2C+but+from+the+Father+and+the+son%3A+and+therefore+there+no+wishing+of+grace+to+man+or+woman%2C+but+from+the+Father+and+the+son%2C+who+are+the+fountain+of+all+grace.+Again+I+see+grace%2C+mercy+and+peace+pertains+to+none%2C+but+to+so+many+as+are+in+this+happy+conjunction+with+the+Father+and+the+Son.+Art+thou+in+the+Father%3F+Art+thou+in+the+son%2C+ingraft+in+him+by+a+lively+faith%3F+Then+grace+pertains+to+thee%3A+mercy+and+peace+pertains+to+thee.%0A%0AArt+thou+out+of+him%2C+and+not+ingraft+in+him+by+faith%3F+Let+men+wish+welfare+and+peace+to+thee+as+they+will%2C+no+grace%2C+mercy+nor+peace+pertains+to+thee.+By+grace+%26+peace+is+understood+whatsoever+blessings+of+God+that+follows+on+that+conjunction+and+union+that+is+with+God+the+Father%2C+and+the+Son+Jesus+Christ%3B+As+for+example%3A+Remission+of+sins%2C+Justification+before+the+Tribunal+of+God%2C+Regeneration+%26+cleansing+of+this+foul+nature%2C+peace%2C+joy+in+the+holy+Ghost%2C+%26+life+everlasting%3A+all+flows+from+this+conjunction%3A+and+therefore+it+must+follow%2C+that+to+him+who+is+out+of+this+conjunction+with+the+Father+and+the+Son%2C+there+is+no+remission+of+sins%3A+if+thou+be+not+united+to+the+Father+and+the+Son+by+faith%3B+no+salvation%2C+no+regeneration%2C+no+life+everlasting%2C+no+peace+for+thee%3A+all+thy+peace+is+false+peace%2C+and+thou+shalt+curse+the+time+that+ever+thou+had+that+peace.%0A%0AThen+it+must+follow+that+this+form+of+salutation%2C+pertains+not+to+the+Jew+this+day%2C+who+is+out+of+this+conjunction%2C+neither+I%2C+nor+no+man+can+say+to+the+Jew+this+day%2C+Peace+and+grace+to+thee+from+God+the+Father+and+from+Christ+Jesus+his+Son%3A+neither+pertains+it+to+the+Turk+or+Pagan%2C+who+are+out+of+this+union+with+God+and+Christ+by+faith.+More+then+this%2C+it+will+not+be+the+name+of+any+thing+that+will+do+the+turn%3A+there+are+many+that+takes+upon+them+the+name+of+a+christian%2C+%26+so+will+seem+to+be+in+the+union+with+the+Father+and+the+Son%2C+that+in+heart+have+no+conjunction+with+them%3A+But+I+say+to+thee%2C+it+will+not+be+the+outward+conjunction+with+them%2C+in+the+name+of+a+Christian%2C+it+will+not+be+the+wishing+of+good+days+and+good+evening+that+will+do+thee+good%2C+except+thou+find+thy+hart+bound+up+in+that+blessed+union+with+the+Father+and+the+Son+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Lectures+upon+the+first+and+second+Epistles+of+Paul+to+the+Thessalonians%2C+%28Edinburgh%3A+Robert+Charteris%2C+1606%29%2C+pp+4-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a61c93ea0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a61c93ea0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/07/robert-rollock-no-grace-outside-of-union-with-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The believer is united with the Son of God, the Eternal Son of the Father, by a tie as indissoluble as that which unites the Father to the Son. He has died, been buried, and is risen again with Jesus. Christ has borne the penalty of the broken law, he has drunk the cup of his Father’s anger to the very dregs, and is now exalted to the right hand of God. “Being raised from the dead”—to use the emphatic language of the sixth chapter of Romans— “he dieth no more; death hath no more dominion over him. For in that he died, he died unto sin once; but in that he liveth, he liveth unto God.”

All those things may be asserted of the meanest sinner, who is one with Christ by the indwelling of the Spirit, who proceeds from and dwells in Christ. This is obvious from the words which follow immediately the passage just cited: “Likewise reckon ye also yourselves to be dead indeed unto sin, but alive unto God through Jesus Christ our Lord.”

There is, therefore, no condemnation to them who are in Christ Jesus. When Christ can be degraded from his position at the right hand of the Majesty on high, when he can be made to abdicate his supremacy over principalities and powers, and might and dominion, and to become again a wanderer among sinful men, the object of their reproach, and finally the victim of their malignity; when the Father can forget his acceptance of the work of his own Son, an acceptance so solemnly proclaimed in raising him from the dead and giving him glory; then, and not before, can one who has been united with Christ become subject to the penalty of the law, and expiate that penalty in the everlasting pains of hell. “The gifts and calling of God are without repentance. He is not a man that he should lie, or the Son of man that he should repent. He who hath begun a good work in us will perform (or finish) it until the day of Jesus Christ.</p></blockquote>

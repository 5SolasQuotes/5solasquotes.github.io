</figure><figure class="quote" id="q-55464edf05" data-kw="">
<blockquote><p>A catechism is a brief doctrine, framed for youth and the ruder sort, containing in it the sum of the doctrine of the law and gospel, or of Christian religion… Catechumeni in the primitive Church, were those who learned the catechism: that is to say, such as were now of the Church, and were instructed in Christian doctrine… This catechising doctrine has ever been in the Church. For in the Old Testament God Himself in brief-wise delivered the doctrine of the Law and Gospel, the Decalogue and the promises, as when He says, ‘Walk before Me, and be thou perfect.’ Likewise, ‘In thy seed shall all nations of the earth be blessed.’ Now these things God would that Abraham and his posterity should teach their children, and their whole family: and therefore this doctrine was framed fit for the capacity of children, and the ruder sort… In the New Testament, in the apostles’ time, there was likewise a catechising doctrine: as the author of the epistle to the Hebrews reports [Heb. 6:1-2]: ‘Therefore, leaving the doctrine of the beginning of Christ, let us be led forward unto perfection, not laying again the foundation of repentance:’ that is the beginning of Christian doctrine, which comprehends repentance and faith. These first beginnings or principles of Christian doctrine are called in the same place the doctrine of baptisms, because they that were of some years before they came to Christ, were first instructed, before they were baptised. It is called also the doctrine of laying on of hands, because the catechism was required at their hands (that they should be able to answer in it) on whom hands were laid, that is to say, of the children of Christians, who were baptised in their infancy. The parts of these rudiments of Christian doctrine, which they call catechism, are the Law and the Gospel, or (as it is said in the place aforenamed unto the Hebrews) repentance and faith in Christ. Similarly the fathers also write brief sums of doctrine… Now it behoves that the youth be by and by instructed in this doctrine, and do know the foundation: 1. Because of the commandment of God, ‘Thou shalt tell them unto thy children.’… 3. Because we are to hold the foundation, upon which we may build…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Christian Religion… in his Lectures upon the Catechism... (d. 1583; Oxford: Barnes, 1587), 2 ‘How many things are necessary’, ‘Three parts of the study of divinity’</cite>, pp. 2-4</span></figcaption>

<blockquote><p>…We have the apostles for authors of our doctrine, says Tertullian (Prescription against Heresies). He says also, It lies not in man’s power to determine any thing (in matters of faith) of his own head. Quamuis sanctus sit aliquis post Apostolos, etc. Howsoever holy, or eloquent a man be, says Jerome in Psalm 86, yet coming after the apostles he deserves no authentical credit. The Lord declares in Scriptures. … The last foundation of Romish faith is the preaching of mass-priests and friars. Quomodo Christus eius(que) doctrina (says Stapleton): Christianae religionis fundamentum est, sic alii nunc a Christo missi, eorumque doctrina, praedicatio, determinatio, fundamenti apud me vim et locum habebunt. As Christ and his doctrine is the foundation of Christian religion: so others now sent of Christ, and their doctrine, preaching, and determination shall in my opinion have the force and place of a foundation, says he. (Praetat ante relect princip. doctrin.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-sutcliffe.html">Matthew Sutcliffe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Full &amp; Round Answer to N.D., alias Robert Parsons… the First [Book] contains a Defence of Queen Elizabeth’s most pious and happy government… (London: 1604), bk. 2, ch. 3</cite>, pp. 137-38</span></figcaption>

</figure><figure class="quote" id="q-5cac90fe7e" data-kw="">
<blockquote><p>What may we safely hold concerning the traditions of the Church? First, that besides the written Word of God there are profitable and necessary constitutions and ecclesiastical traditions, to wit, of those things which respect the outward decency and comeliness of the Church and service of God. Secondly, the efficient cause of all true traditions is the Holy Spirit, which directs the bishops and ministers assembled together in council or convocation for the determining of such orders and constitutions, according to the word of God [Acts 15:28]: and does also direct the Churches in the approving and receiving of such traditions. Thirdly, no tradition of the Church can constitute or ratify a doctrine contrary to the written word of God, neither any rite or ceremony: for both constitutions and doctrines ought to be agreeable (at least not contrary) to the written Word. And as all civil laws ought to have their beginning from the Law of nature, so all ecclesiastical traditions from the Word of God, Rom. 14:23; 1 Cor. 14:26, 40. Fourthly, although ecclesiastical traditions may be derived from the Word, yet they are not of equal authority with the Word. How may the true traditions of the Church be known or discerned from human and superstitious ordinances? By these four notes and marks, to wit: First, true traditions are founded upon the word, and consentaneous unto the Word, and deduced, derived and taken from the Word. Secondly, true traditions are profitable for the conserving and promoting both of piety and external and internal worship. Thirdly, true traditions make for the order, decorum and edification of the Church. And Fourthly, are not grievous and intolerable, as the traditions of the Pharisees were, and the Papists are, Mt. 23:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Questions, dogmatical observations and evangelical essays, upon the Gospel of… Matthew... (London: Cole, 1640), ch. 15</cite>, p. 156</span></figcaption>

</figure><figure class="quote" id="q-068e7925f0" data-kw="">
<blockquote><p>The language here employed [in the Scottish subscription formula in 1694 &amp; 1711] is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 1</cite>, p. 76</span></figcaption>

<blockquote><p>245. Therefore, the confessions of particular Churches and the decrees and canons of particular synods, and the catecheses of particular Churches and the liturgies or ecclesiastical agendas and similar formulas, their doctrines or declarations are not the immutable and universal norm of faith and truth, according to which it ought to be judged or pronounced what is to be believed and conceded, what is to be repudiated and condemned, what is true or false, orthodox or heretical. For it is not always necessary that what agrees with the confession of some particular Church, synodical decrees, catechesis, liturgy or ecclesiastical agenda, formula of doctrine or some other declaration, is true; nor is it always false what disagrees with it. Therefore, it should not be demanded that all Churches subscribe to the declaration and formula of one particular Church: but indeed those formulas do not even bind one Church or any private person to approve them and to contain themselves within them, except with this condition, insofar as they agree with divine Scripture and universal Symbols.</p></blockquote>

<blockquote><p>III. In our time in Germany, the Augsburg Confession [1530] is known to everyone as the first and oldest Protestant confession… since in the foundation and chief principles of the Christian religion it accords with the confessions publicly issued and approved by the other Protestant and Reformed churches beyond Germany, as indicated in the Harmony of Protestant Confessions. Therefore, next after the Word of God and the universal Apostolic, Nicene, Athanasian, Ephesian and Chalecedonian creeds, we hereby profess the aforesaid Augsburg Confession, understood in a legitimate and well-grounded sense so as it agrees and harmonizes with the true and infallible Word of God to which all must duly remain subject. In like manner, we hold the confessions of the other Protestant and Reformed churches as that which is not in opposition to the Word of God but derived from it and in accord with it…</p></blockquote>

<blockquote><p>…Valerand had disseminated his poison as far as this, whose ambition or temerity forced the French and English strangers at Frankfort to subscribe the [Lutheran] Confession of Augsburg [1530], with one exception however, respecting the word ‘substantially’. It was decreed that the German preachers should not hence forward give them any molestation until the leaders of both parties should come to some agreement.</p></blockquote>

</figure><figure class="quote" id="q-7c6a49f814" data-kw="">
<blockquote><p>6. I have perused over all the Articles or Decrees of the Synod of Dort, and unfeignedly honor them, as containing sound and moderate doctrine, and heartily lament that some late divines have to the great detriment of the Church and truth, forsaken the moderate way of that Synod, and laid the weight of the Anti-Arminian cause so much upon higher points not owned by them. And there is nothing that I have observed in it all that my judgment does contradict, if I be allowed these few expositions following: Where it is said, article 1, sect. 12, De hac aeterna electione, electi suo tempore variis licet gradibus, et dispari mensura, certiores redduntur, non arcana, etc. [“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, etc.”], I understand it as showing only what way the elect do attain assurance, who more or less do attain it, and not as affirming that all the elect do more or less attain a certainty of their election. For as I think that doctrine uncomfortable to many poor Christians, so I think it cannot he proved of all the elect. 2. In the 3rd Article, sect. 12, it’s plain by the annexed words that persuasionem moralem [“by moral suasion”] they mean external suasion, and do not determine whether the name of suasion be agreeable or not to the internal work of the Spirit, which for my part I am certain is beyond my reach to know and, I am confident, [is] beyond the reach of all men on earth, even those that most pretend to know it. But that this grace of the Spirit is necessary to sanctify both the understanding and will, and that it is an act of omnipotency, and infallibly effectual (commonly called ‘irresistible’) on all the elect, I am ready against all Pelagians to defend. 3. Where it is said, sect. 15, that, Qui illam non accipit, is aut haec spiritualia omnino non curat, et in suo sibi placet: aut securus se habere inaniter gloriatur, quod non habet [‘Whoever is not made partaker thereof, is either altogether regardless of these spiritual gifts and satisfied with his own condition, or is in no apprehension of danger and vainly boasts the possession of that which he has not’]: I understand it as spoken of the ordinary sort of graceless unregenerate men, and not of all; for I doubt not but it’s possible for a wicked man to know that he is wicked, and be afraid of Hell, yea, and to despair. I am loth to think desparation is a mark of grace, and that none are graceless but the secure and confident. 4. In the 5th Article, sections 9-10, where it is said that believers may be, and are certain of their perseverance, according to the measure of their faith, I understand that word, ‘are certain pro mensura fidei’: 1. As supposing the certainty of their sincerity; for a man must be certain that he has grace, before he can be certain to persevere in it. 2. As supposing a certain understanding of the truth of the doctrine that all true believers shall infallibly persevere: for none can be certain to persevere merely as a believer, that is not first certain that all believers shall persevere. 3. I suppose therefore that this is not spoken of all believers, but of some, for: 1. All are not certain that they are sincere. 2. All are not certain that the doctrine of infallible perseverance is true; for to conclude that all the Lutheran Churches that deny this, and all the Arminians and Anabaptists that deny it, and all the ancient fathers and Churches that denied it, besides Musculus and others of our own, were certainly graceless and unbelievers, were not only inconsistent with the faith and charity, but with the reason of a Christian; and [this is] no less than an inhumane charge. 5. Where it is said, sect. 11, that God per Spiritum Sanctum perseverantiae certudinem in iisdem rursus excitat [‘by the Holy Spirit again inspires them with the comfortable assurance of persevering’], I understand it as true of some, but not of all; for I dare not pronounce damnation on all that die unassured of their sincerity, much less on all that are unassured of perseverance. 6. To the 13th section, I doubt not but the meaning is that certainty of perseverance does not of itself, and of its own nature beget carelessness or negligence; and so I believe it’s true. Nay, I think that love and gratitude are ordained to be the master ruling graces in the Kingdom of Christ (under faith); and that fear is but to supply the defects of our yet-imperfect love. And therefore the more any man loves, the more he will obey: and the more he is assured of God’s love, the greater advantage he has to love Him again. But yet I doubt not, but the remnants of our corruption, by the strength of temptation, may make assurance an occasion, or accidental cause of negligence and actual sin: which I suppose this section does not deny. These are all the limiting expositions which I desire liberty to make use of, and with which I do, as is aforesaid, profess my consent to the Canons or Decrees of the Synod of Dort. And how far any of these are from favoring Arminianism, they that will see, need not to be ignorant. Yea, in the very article of perseverance, which some were pleased to quarrel with me about, I subscribe to the Synod: Yea, in the article of the extent of redemption, wherein I am most suspected and accused (and was fain to use a limiting exposition in my consent to our Assembly’s Confession of Faith) I do subscribe to the Synod of Dort, without any exception, limitation or exposition of any word as doubtful and obscure. I do also freely consent to the rejections, with the liberty of three or four the like explications, which I will not mention, lest I seem quarelsome, or be further tedious, because they are about smaller matters than those I have mentioned, and no way touching the quick of the controverted articles, and I am persuaded that my sense of them is the same with the Synod’s. And because it is, this Synod [was] purposely called against Arminianism, that is the best discovery what is to be accounted Arminian or Anti-Arminian doctrine, as I think, by consenting to it: I do clear myself from that calumny with all men of conscience and reason that know it, so I shall think that those who go as much on the other hand, and differ from the Synod one way, as much as the Arminians did the other way, remain censurable as well as they, till somebody shall convince me that there is but one extreme, in this case, and that a man may hold what he will without danger, so he be but sure it go far enough from Arminianism. A man that holds to the moderation of the Synod of Dort, need not say that Christ did not die or satisfy for all men, nor need he trouble himself with presumptuous determinations about many mysteries in the decrees of God, which many volumes are guilty of; Nor does he need to aver the necessity of immediate, physical, efficient predetermination by God (as the First Cause) of every second cause natural and free, as without which they cannot act: Nor need he say, that God so predetermines to the act which is sin, and not to the sinfulness of the act: Nor need he subscribe to all that Dr. [William] Twisse or Mr. [Samuel] Rutherford, or such like, have written on these points. Nay, as this Synod, so our own [Westminster] Assembly gave an example of modesty in these points, to them that will follow it, not only silencing many things which others make the pillars of Anti-Arminianism, but expressing that the will is endued by God with that natural liberty, that is neither forced, nor by any absolute necessity of nature determined to do good or evil, and therefore they never tell you that God as the First Cause must of natural necessity determine man’s will by physical, immediate premotion, before it can act either good or evil: But they reserve the honor of determining man’s will to special grace, renewing the will, and by almighty power determining it to that which is good, ch. 10, sect. 1 and ch. 9, sect. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baxter on the Canons of Dort | Richard Baxter’s Confession of his Faith… (London: R.W., 1655), ch. 2, sect. 6</cite>, pp. 23-26</span></figcaption>

<div class="actions"><button class="copy" data-copy="“6. I have perused over all the Articles or Decrees of the Synod of Dort, and unfeignedly honor them, as containing sound and moderate doctrine, and heartily lament that some late divines have to the great detriment of the Church and truth, forsaken the moderate way of that Synod, and laid the weight of the Anti-Arminian cause so much upon higher points not owned by them. And there is nothing that I have observed in it all that my judgment does contradict, if I be allowed these few expositions following: Where it is said, article 1, sect. 12, De hac aeterna electione, electi suo tempore variis licet gradibus, et dispari mensura, certiores redduntur, non arcana, etc. [“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, etc.”], I understand it as showing only what way the elect do attain assurance, who more or less do attain it, and not as affirming that all the elect do more or less attain a certainty of their election. For as I think that doctrine uncomfortable to many poor Christians, so I think it cannot he proved of all the elect. 2. In the 3rd Article, sect. 12, it’s plain by the annexed words that persuasionem moralem [“by moral suasion”] they mean external suasion, and do not determine whether the name of suasion be agreeable or not to the internal work of the Spirit, which for my part I am certain is beyond my reach to know and, I am confident, [is] beyond the reach of all men on earth, even those that most pretend to know it. But that this grace of the Spirit is necessary to sanctify both the understanding and will, and that it is an act of omnipotency, and infallibly effectual (commonly called ‘irresistible’) on all the elect, I am ready against all Pelagians to defend. 3. Where it is said, sect. 15, that, Qui illam non accipit, is aut haec spiritualia omnino non curat, et in suo sibi placet: aut securus se habere inaniter gloriatur, quod non habet [‘Whoever is not made partaker thereof, is either altogether regardless of these spiritual gifts and satisfied with his own condition, or is in no apprehension of danger and vainly boasts the possession of that which he has not’]: I understand it as spoken of the ordinary sort of graceless unregenerate men, and not of all; for I doubt not but it’s possible for a wicked man to know that he is wicked, and be afraid of Hell, yea, and to despair. I am loth to think desparation is a mark of grace, and that none are graceless but the secure and confident. 4. In the 5th Article, sections 9-10, where it is said that believers may be, and are certain of their perseverance, according to the measure of their faith, I understand that word, ‘are certain pro mensura fidei’: 1. As supposing the certainty of their sincerity; for a man must be certain that he has grace, before he can be certain to persevere in it. 2. As supposing a certain understanding of the truth of the doctrine that all true believers shall infallibly persevere: for none can be certain to persevere merely as a believer, that is not first certain that all believers shall persevere. 3. I suppose therefore that this is not spoken of all believers, but of some, for: 1. All are not certain that they are sincere. 2. All are not certain that the doctrine of infallible perseverance is true; for to conclude that all the Lutheran Churches that deny this, and all the Arminians and Anabaptists that deny it, and all the ancient fathers and Churches that denied it, besides Musculus and others of our own, were certainly graceless and unbelievers, were not only inconsistent with the faith and charity, but with the reason of a Christian; and [this is] no less than an inhumane charge. 5. Where it is said, sect. 11, that God per Spiritum Sanctum perseverantiae certudinem in iisdem rursus excitat [‘by the Holy Spirit again inspires them with the comfortable assurance of persevering’], I understand it as true of some, but not of all; for I dare not pronounce damnation on all that die unassured of their sincerity, much less on all that are unassured of perseverance. 6. To the 13th section, I doubt not but the meaning is that certainty of perseverance does not of itself, and of its own nature beget carelessness or negligence; and so I believe it’s true. Nay, I think that love and gratitude are ordained to be the master ruling graces in the Kingdom of Christ (under faith); and that fear is but to supply the defects of our yet-imperfect love. And therefore the more any man loves, the more he will obey: and the more he is assured of God’s love, the greater advantage he has to love Him again. But yet I doubt not, but the remnants of our corruption, by the strength of temptation, may make assurance an occasion, or accidental cause of negligence and actual sin: which I suppose this section does not deny. These are all the limiting expositions which I desire liberty to make use of, and with which I do, as is aforesaid, profess my consent to the Canons or Decrees of the Synod of Dort. And how far any of these are from favoring Arminianism, they that will see, need not to be ignorant. Yea, in the very article of perseverance, which some were pleased to quarrel with me about, I subscribe to the Synod: Yea, in the article of the extent of redemption, wherein I am most suspected and accused (and was fain to use a limiting exposition in my consent to our Assembly’s Confession of Faith) I do subscribe to the Synod of Dort, without any exception, limitation or exposition of any word as doubtful and obscure. I do also freely consent to the rejections, with the liberty of three or four the like explications, which I will not mention, lest I seem quarelsome, or be further tedious, because they are about smaller matters than those I have mentioned, and no way touching the quick of the controverted articles, and I am persuaded that my sense of them is the same with the Synod’s. And because it is, this Synod [was] purposely called against Arminianism, that is the best discovery what is to be accounted Arminian or Anti-Arminian doctrine, as I think, by consenting to it: I do clear myself from that calumny with all men of conscience and reason that know it, so I shall think that those who go as much on the other hand, and differ from the Synod one way, as much as the Arminians did the other way, remain censurable as well as they, till somebody shall convince me that there is but one extreme, in this case, and that a man may hold what he will without danger, so he be but sure it go far enough from Arminianism. A man that holds to the moderation of the Synod of Dort, need not say that Christ did not die or satisfy for all men, nor need he trouble himself with presumptuous determinations about many mysteries in the decrees of God, which many volumes are guilty of; Nor does he need to aver the necessity of immediate, physical, efficient predetermination by God (as the First Cause) of every second cause natural and free, as without which they cannot act: Nor need he say, that God so predetermines to the act which is sin, and not to the sinfulness of the act: Nor need he subscribe to all that Dr. [William] Twisse or Mr. [Samuel] Rutherford, or such like, have written on these points. Nay, as this Synod, so our own [Westminster] Assembly gave an example of modesty in these points, to them that will follow it, not only silencing many things which others make the pillars of Anti-Arminianism, but expressing that the will is endued by God with that natural liberty, that is neither forced, nor by any absolute necessity of nature determined to do good or evil, and therefore they never tell you that God as the First Cause must of natural necessity determine man’s will by physical, immediate premotion, before it can act either good or evil: But they reserve the honor of determining man’s will to special grace, renewing the will, and by almighty power determining it to that which is good, ch. 10, sect. 1 and ch. 9, sect. 1.”

— Netherlands, Baxter on the Canons of Dort | Richard Baxter’s Confession of his Faith… (London: R.W., 1655), ch. 2, sect. 6, pp. 23-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+I+have+perused+over+all+the+Articles+or+Decrees+of+the+Synod+of+Dort%2C+and+unfeignedly+honor+them%2C+as+containing+sound+and+moderate+doctrine%2C+and+heartily+lament+that+some+late+divines+have+to+the+great+detriment+of+the+Church+and+truth%2C+forsaken+the+moderate+way+of+that+Synod%2C+and+laid+the+weight+of+the+Anti-Arminian+cause+so+much+upon+higher+points+not+owned+by+them.+And+there+is+nothing+that+I+have+observed+in+it+all+that+my+judgment+does+contradict%2C+if+I+be+allowed+these+few+expositions+following%3A+Where+it+is+said%2C+article+1%2C+sect.+12%2C+De+hac+aeterna+electione%2C+electi+suo+tempore+variis+licet+gradibus%2C+et+dispari+mensura%2C+certiores+redduntur%2C+non+arcana%2C+etc.+%5B%E2%80%9CThe+elect+in+due+time%2C+though+in+various+degrees+and+in+different+measures%2C+attain+the+assurance+of+this+their+eternal+and+unchangeable+election%2C+etc.%E2%80%9D%5D%2C+I+understand+it+as+showing+only+what+way+the+elect+do+attain+assurance%2C+who+more+or+less+do+attain+it%2C+and+not+as+affirming+that+all+the+elect+do+more+or+less+attain+a+certainty+of+their+election.+For+as+I+think+that+doctrine+uncomfortable+to+many+poor+Christians%2C+so+I+think+it+cannot+he+proved+of+all+the+elect.+2.+In+the+3rd+Article%2C+sect.+12%2C+it%E2%80%99s+plain+by+the+annexed+words+that+persuasionem+moralem+%5B%E2%80%9Cby+moral+suasion%E2%80%9D%5D+they+mean+external+suasion%2C+and+do+not+determine+whether+the+name+of+suasion+be+agreeable+or+not+to+the+internal+work+of+the+Spirit%2C+which+for+my+part+I+am+certain+is+beyond+my+reach+to+know+and%2C+I+am+confident%2C+%5Bis%5D+beyond+the+reach+of+all+men+on+earth%2C+even+those+that+most+pretend+to+know+it.+But+that+this+grace+of+the+Spirit+is+necessary+to+sanctify+both+the+understanding+and+will%2C+and+that+it+is+an+act+of+omnipotency%2C+and+infallibly+effectual+%28commonly+called+%E2%80%98irresistible%E2%80%99%29+on+all+the+elect%2C+I+am+ready+against+all+Pelagians+to+defend.+3.+Where+it+is+said%2C+sect.+15%2C+that%2C+Qui+illam+non+accipit%2C+is+aut+haec+spiritualia+omnino+non+curat%2C+et+in+suo+sibi+placet%3A+aut+securus+se+habere+inaniter+gloriatur%2C+quod+non+habet+%5B%E2%80%98Whoever+is+not+made+partaker+thereof%2C+is+either+altogether+regardless+of+these+spiritual+gifts+and+satisfied+with+his+own+condition%2C+or+is+in+no+apprehension+of+danger+and+vainly+boasts+the+possession+of+that+which+he+has+not%E2%80%99%5D%3A+I+understand+it+as+spoken+of+the+ordinary+sort+of+graceless+unregenerate+men%2C+and+not+of+all%3B+for+I+doubt+not+but+it%E2%80%99s+possible+for+a+wicked+man+to+know+that+he+is+wicked%2C+and+be+afraid+of+Hell%2C+yea%2C+and+to+despair.+I+am+loth+to+think+desparation+is+a+mark+of+grace%2C+and+that+none+are+graceless+but+the+secure+and+confident.+4.+In+the+5th+Article%2C+sections+9-10%2C+where+it+is+said+that+believers+may+be%2C+and+are+certain+of+their+perseverance%2C+according+to+the+measure+of+their+faith%2C+I+understand+that+word%2C+%E2%80%98are+certain+pro+mensura+fidei%E2%80%99%3A+1.+As+supposing+the+certainty+of+their+sincerity%3B+for+a+man+must+be+certain+that+he+has+grace%2C+before+he+can+be+certain+to+persevere+in+it.+2.+As+supposing+a+certain+understanding+of+the+truth+of+the+doctrine+that+all+true+believers+shall+infallibly+persevere%3A+for+none+can+be+certain+to+persevere+merely+as+a+believer%2C+that+is+not+first+certain+that+all+believers+shall+persevere.+3.+I+suppose+therefore+that+this+is+not+spoken+of+all+believers%2C+but+of+some%2C+for%3A+1.+All+are+not+certain+that+they+are+sincere.+2.+All+are+not+certain+that+the+doctrine+of+infallible+perseverance+is+true%3B+for+to+conclude+that+all+the+Lutheran+Churches+that+deny+this%2C+and+all+the+Arminians+and+Anabaptists+that+deny+it%2C+and+all+the+ancient+fathers+and+Churches+that+denied+it%2C+besides+Musculus+and+others+of+our+own%2C+were+certainly+graceless+and+unbelievers%2C+were+not+only+inconsistent+with+the+faith+and+charity%2C+but+with+the+reason+of+a+Christian%3B+and+%5Bthis+is%5D+no+less+than+an+inhumane+charge.+5.+Where+it+is+said%2C+sect.+11%2C+that+God+per+Spiritum+Sanctum+perseverantiae+certudinem+in+iisdem+rursus+excitat+%5B%E2%80%98by+the+Holy+Spirit+again+inspires+them+with+the+comfortable+assurance+of+persevering%E2%80%99%5D%2C+I+understand+it+as+true+of+some%2C+but+not+of+all%3B+for+I+dare+not+pronounce+damnation+on+all+that+die+unassured+of+their+sincerity%2C+much+less+on+all+that+are+unassured+of+perseverance.+6.+To+the+13th+section%2C+I+doubt+not+but+the+meaning+is+that+certainty+of+perseverance+does+not+of+itself%2C+and+of+its+own+nature+beget+carelessness+or+negligence%3B+and+so+I+believe+it%E2%80%99s+true.+Nay%2C+I+think+that+love+and+gratitude+are+ordained+to+be+the+master+ruling+graces+in+the+Kingdom+of+Christ+%28under+faith%29%3B+and+that+fear+is+but+to+supply+the+defects+of+our+yet-imperfect+love.+And+therefore+the+more+any+man+loves%2C+the+more+he+will+obey%3A+and+the+more+he+is+assured+of+God%E2%80%99s+love%2C+the+greater+advantage+he+has+to+love+Him+again.+But+yet+I+doubt+not%2C+but+the+remnants+of+our+corruption%2C+by+the+strength+of+temptation%2C+may+make+assurance+an+occasion%2C+or+accidental+cause+of+negligence+and+actual+sin%3A+which+I+suppose+this+section+does+not+deny.+These+are+all+the+limiting+expositions+which+I+desire+liberty+to+make+use+of%2C+and+with+which+I+do%2C+as+is+aforesaid%2C+profess+my+consent+to+the+Canons+or+Decrees+of+the+Synod+of+Dort.+And+how+far+any+of+these+are+from+favoring+Arminianism%2C+they+that+will+see%2C+need+not+to+be+ignorant.+Yea%2C+in+the+very+article+of+perseverance%2C+which+some+were+pleased+to+quarrel+with+me+about%2C+I+subscribe+to+the+Synod%3A+Yea%2C+in+the+article+of+the+extent+of+redemption%2C+wherein+I+am+most+suspected+and+accused+%28and+was+fain+to+use+a+limiting+exposition+in+my+consent+to+our+Assembly%E2%80%99s+Confession+of+Faith%29+I+do+subscribe+to+the+Synod+of+Dort%2C+without+any+exception%2C+limitation+or+exposition+of+any+word+as+doubtful+and+obscure.+I+do+also+freely+consent+to+the+rejections%2C+with+the+liberty+of+three+or+four+the+like+explications%2C+which+I+will+not+mention%2C+lest+I+seem+quarelsome%2C+or+be+further+tedious%2C+because+they+are+about+smaller+matters+than+those+I+have+mentioned%2C+and+no+way+touching+the+quick+of+the+controverted+articles%2C+and+I+am+persuaded+that+my+sense+of+them+is+the+same+with+the+Synod%E2%80%99s.+And+because+it+is%2C+this+Synod+%5Bwas%5D+purposely+called+against+Arminianism%2C+that+is+the+best+discovery+what+is+to+be+accounted+Arminian+or+Anti-Arminian+doctrine%2C+as+I+think%2C+by+consenting+to+it%3A+I+do+clear+myself+from+that+calumny+with+all+men+of+conscience+and+reason+that+know+it%2C+so+I+shall+think+that+those+who+go+as+much+on+the+other+hand%2C+and+differ+from+the+Synod+one+way%2C+as+much+as+the+Arminians+did+the+other+way%2C+remain+censurable+as+well+as+they%2C+till+somebody+shall+convince+me+that+there+is+but+one+extreme%2C+in+this+case%2C+and+that+a+man+may+hold+what+he+will+without+danger%2C+so+he+be+but+sure+it+go+far+enough+from+Arminianism.+A+man+that+holds+to+the+moderation+of+the+Synod+of+Dort%2C+need+not+say+that+Christ+did+not+die+or+satisfy+for+all+men%2C+nor+need+he+trouble+himself+with+presumptuous+determinations+about+many+mysteries+in+the+decrees+of+God%2C+which+many+volumes+are+guilty+of%3B+Nor+does+he+need+to+aver+the+necessity+of+immediate%2C+physical%2C+efficient+predetermination+by+God+%28as+the+First+Cause%29+of+every+second+cause+natural+and+free%2C+as+without+which+they+cannot+act%3A+Nor+need+he+say%2C+that+God+so+predetermines+to+the+act+which+is+sin%2C+and+not+to+the+sinfulness+of+the+act%3A+Nor+need+he+subscribe+to+all+that+Dr.+%5BWilliam%5D+Twisse+or+Mr.+%5BSamuel%5D+Rutherford%2C+or+such+like%2C+have+written+on+these+points.+Nay%2C+as+this+Synod%2C+so+our+own+%5BWestminster%5D+Assembly+gave+an+example+of+modesty+in+these+points%2C+to+them+that+will+follow+it%2C+not+only+silencing+many+things+which+others+make+the+pillars+of+Anti-Arminianism%2C+but+expressing+that+the+will+is+endued+by+God+with+that+natural+liberty%2C+that+is+neither+forced%2C+nor+by+any+absolute+necessity+of+nature+determined+to+do+good+or+evil%2C+and+therefore+they+never+tell+you+that+God+as+the+First+Cause+must+of+natural+necessity+determine+man%E2%80%99s+will+by+physical%2C+immediate+premotion%2C+before+it+can+act+either+good+or+evil%3A+But+they+reserve+the+honor+of+determining+man%E2%80%99s+will+to+special+grace%2C+renewing+the+will%2C+and+by+almighty+power+determining+it+to+that+which+is+good%2C+ch.+10%2C+sect.+1+and+ch.+9%2C+sect.+1.%E2%80%9D%0A%0A%E2%80%94+Netherlands%2C+Baxter+on+the+Canons+of+Dort+%7C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+R.W.%2C+1655%29%2C+ch.+2%2C+sect.+6%2C+pp.+23-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c6a49f814.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c6a49f814.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=6.%20I%20have%20perused%20over%20all,1%20and%20ch.%209%2C%20sect.%201&amp;text=6.%20I%20have%20perused%20over%20all%20the%20Articles&amp;text=10%2C%20sect.%201%20and%20ch.%209%2C%20sect.%201" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>First, it is avowed by some that they have not subscribed simply, but with protestations and exceptions, though they be not recorded, which (say they) is not their fault… Others would justify themselves because (as they say) it is not affirmed by their subscription that all things in the Books of Common prayer and of ordaining bishops, priests, and deacons, be agreeable to the Word of God, but [it is] only said that those books contain nothing contrary to the Word of God… A third sort of subscribers would… that of two evils the less is to be chosen: And therefore some things are to be tolerated, rather than the Church should lose the benefit of their ministry… As is evident by these words of the preamble: That the Churches of the Queen’s Majesty’s dominions may be served with pastors of sound religion, Be it enacted, etc. Again, the statute requires subscriprion to the [39] Articles of Religion, and not to all, but such as only concern the confession of the true Christian faith, and the doctrine of the sacraments. Yea that the exception of some articles might be more manifest (and for no other cause) is this word ‘only’ inserted.</p></blockquote>

<blockquote><p>In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;</p></blockquote>

<blockquote><p>While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;</p></blockquote>

<blockquote><p>[An exception is] a dissent from, an objection to, or a mental reservation about any assertion contained in the [Westminster] Confession of Faith and Catechisms and is to be distinguished from an inconsequential objection to a proposition or from a quibble or from a reservation about terminology. However, such a distinction is to be made only by the judicatory, never by the individual. No officer or licentiate shall presume to have the right of making self-evaluation regarding this distinction. An exception to the confessional standards may be granted by a judicatory, for the sake of conscience, only if 1) it affects a peripheral and minor assertion in the standards, not a central and fundamental one, 2) it does not vacate the central teaching of any chapter in the Confession or overturn a complete answer to any question in the Catechisms, and 3) it does not undermine the system of truth in the Confession and Catechisms as a whole.</p></blockquote>

<blockquote><p>If the question, ‘What is the meaning of the words, ‘the system of doctrines taught in the Holy Scriptures,’ as they occur in the formula which makes a part of the ordination service?’ were submitted to any intelligent and impartial jury in the country–to twelve men of plain common sense, who had never head of the subterfuges and refinements of modern subscribers to creeds–I cannot doubt that they would be unanimous in their verdict without quitting their seats. They would naturally decide thus: ‘Since the primary object of subscribing an ecclesiastical creed is to express agreement in doctrinal belief; since the manifest design of the Confession of Faith of the Presbyterian Church is to maintain what is commonly called the Calvinistic system, in opposition to the Socinian, the Arian, the Pelagian, and the Arminian systems; since almost every point which distinguishes these several forms of error are specifically exposed, disproved and rejected, under one or another of its several articles; and since this has notoriously been the universal understanding, ever since that Confession was formed, we judge that no man who is not a sincere Calvinist, that is, who does not ex animo [from the heart; sincerely] receive all the distinguishing articles of the Calvinistic system, can honestly subscribe it. We do not suppose, indeed, that among those who subscribe that formulary, it is necessary, in order to a candid subscription, that there should be entire agreement as to ‘every jot and tittle’ in the mode of explaining every doctrine which the Confession contains. But we cannot resist the conclusion, as fair and honorable men, that unless a candidate for admission… sincerely believes all these [previously listed doctrines], and the essentially allied doctrines which have ever been considered as the distinguishing features of the Calvinistic system, and believes them in substance, as they are laid down in the Confession, our verdict is that he cannot honestly subscribe it.</p></blockquote>

<blockquote><p>Conservatives argued that the Synod of Philadelphia was correct in interpreting the 1729 Adopting Act in terms of the ‘afternoon minute’ and the strict reinterpretation of 1736. Receiving and adopting the ‘system’ [a term used in 1788] of the [Westminster] Confession meant embracing the whole confession without exception, once the originally scrupled articles on the civil magistrate had been amended in 1788. A larger group of Presbyterians, recalling the original intent of the morning minute of 1729, believed the ‘system’ referred to the Confession’s Calvinistic doctrines; this body advocated the distinction between doctrines ‘essential’ to the system and those that were not. This was the spirit of the old Synod of New York. And there was a third small party, which held that ‘system of doctrine’ [in 1788] referred to the fundamental doctrines shared in common with all Christian churches. This minority expression drew inspiration from the 1729 language ‘systems of Christian doctrine’ [in the early morning session of the Adopting Act 1729]. Some of the early pre-1729 discussions about subscription had advocated this opinion, but, it ultimately had been rejected [Fortson claims] in the compromise of 1729. Nonetheless, a few voices would continue to herald a loose view of subscription which favored mere assent to catholic Christianity as the ‘substance’ of Westminster doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43</cite>, p. 222</span></figcaption>

<blockquote><p>New School ministers, while often perceived as enemies of confessional subscription, were in fact strong advocates of the principles of 1729. The leaders of the New School asserted that throughout the nineteenth century, the majority of New School members had maintained a solid attachment to the Presbyterian creed. They allowed more theological diversity than their Old School counterparts, but there were confessional boundaries to that latitude which they openly acknowledged. New School Presbyterians were moderate Calvinists who loved the Reformed Tradition but were unwilling to allow the West minster Standards to become the only test of one’s orthodoxy. While viewing itself as generally conservative, the New School also promoted an openness to express traditional Reformed theology in fresh ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43</cite>, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-4447edc361" data-kw="">
<blockquote><p>The point of all this is to suggest that the [American] revisions [to the Westminster standards] were strategic, driven by necessity, not the result of some massive doctrinal shift. Indeed, the textual change itself suggests no such massive shift, only moderation according to the circumstances.</p></blockquote>

</figure><figure class="quote" id="q-eab22231a6" data-kw="">
<blockquote><p>The protesters [against mandated subscription] were led by Jonathan Dickinson (1688–1747)… Dickinson shows that he is well acquatined with the debates elsewhere [such as in Ireland]… Notably Dickinson sees it [presbyterianism] not as divinely mandated, but the best of many imperfect options. While acknowledging the usefulness of confessions…</p></blockquote>

</figure><figure class="quote" id="q-1b00e652a0" data-kw="">
<blockquote><p>The similarity [of the determination of the synod in the morning] to the Irish [Pacific] Act [1720] is apparent [which expressly allowed for exceptions], and in the context, especially given [Thomas] Craighead’s involvement, it is certain that it served as the source for the Committee’s proposal… in light of the actual overture by [John] Thomson, which stipulated the two needs [of subscription and adopting a confession], it makes more sense to see the morning session establishing the requirement and terms of subscription and the afternoon session as the formal adoption by the Synod [of the Westminster Confession]. In other words, the Synod’s adopting of the Confession is distinguished from the requirement for subscription and later debates in the American Church has been the result of not recognizing the distinction. The ‘preliminary’ or morning session is the only one to explicitly require subscription. Moreover, allowing presbyteries to judge scruples would be nonsense had the Synod intended to decide what scruples would be allowed in the afternoon session.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-scott-sealy.html">Charles Scott Sealy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), pp. 169-28 | ch. 5, ‘The Synod of Philadelphia &amp; the Adopting Act (1729)’</cite>, pp. 179-81</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>Even Non-Subscribers agreed that a confession was useful to express a Church’s belief and to serve as a summary statement of their understanding of the Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-44939741d7" data-kw="">
<blockquote><p>While it’s likely that Machen himself took no doctrinal exceptions to the Westminister Standards, it’s clear from his own words and leadership in the formation of the OPC that he believed officers should be granted exceptions to doctrines (not just wording) that do not strike at the fundamentals of the Presbyterian and Reformed system and that they should be allowed to teach these exceptions. We know this because of how he approached the question of premillennialism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/derek-radney.html">Derek Radney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘J. Gresham Machen on Confessional Subscription: Not a Fundamentalist in holding to the Westminster Standards’ (2023) Substack</cite></span></figcaption>

</figure><figure class="quote" id="q-4761b377cf" data-kw="">
<blockquote><p>The Book of Genesis seems to divide the work of creation into six successive steps or stages. It is certainly not necessary to think that the six days spoken of in the first chapter of the Bible are intended to be six days of twenty-four hours each. We may think of them rather as very long periods of time. But do they not at least mark six distinct acts or stages of creation, rather than merely six periods in which God molded by works of providence an already created world?… The real question at issue here is the question whether at the origin of the race of mankind there was or was not a supernatural act of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian View of Man (1937; Banner of Truth, 1965), p. 115 &amp; 117</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Book of Genesis seems to divide the work of creation into six successive steps or stages. It is certainly not necessary to think that the six days spoken of in the first chapter of the Bible are intended to be six days of twenty-four hours each. We may think of them rather as very long periods of time. But do they not at least mark six distinct acts or stages of creation, rather than merely six periods in which God molded by works of providence an already created world?… The real question at issue here is the question whether at the origin of the race of mankind there was or was not a supernatural act of God.”

<blockquote><p>…these questions were proponed to him that was to be elected. … Question. ‘Believe ye not, that the doctrine of the prophets and apostles, contained in the books of the New and Old Testament, is the only true and most absolute foundation of the universal church of Christ Jesus, in so much, that in the same Scripture are contained all things necessary to be believed for the salvation of mankind?’ Answer. ‘I verily believe the same; and do abhor and utterly refuse all doctrine alleged necessary to salvation, that is not expressedly contained in the same.’ Question. ‘Is not Christ Jesus, man of man according to the flesh, to wit, the son of David, the seed of Abraham, conceived of the Holy Ghost, born of the Virgin Mary his mother, the only Head and Mediator of his church?’ Answer. ‘He is, and without him there is neither salvation to man, nor life to angel.’ Question. ‘Is not the same Lord Jesus the only true God, the eternal Son of the eternal Father, in whom all that shall be saved were elected before the foundation of the world was laid?’ Answer. ‘I acknowledge and confess Him in the unity of his Godhead to be God above all things, blessed forever.’ Question. ‘Shall not they whom God, in his eternal counsel, has elected, be called to the knowledge of his Son, our Lord Jesus; and shall not they who of purpose are called, in this life, be justified; and where justification and free remission of sins is obtained in this life by free grace, shall not the glory of the Son of God follow in the general resurrection, when the Son of God shall appear in his glorious majesty?’ Answer. ‘This I acknowledge to be the doctrine of the apostles, and the most singular comfort of God’s children.’ Question. ‘Will ye not then contain yourself in all doctrine within the bounds of this foundation? Will ye not study to promove the same, as welll by your life as by your doctrine? Will ye not, according to the graces and utterance that God shall grant unto you, profess, instruct, and maintain the purity of the doctrine contained in the sacred Word of God; and to the uttermost of your power will ye not gainstand, and convince the gainsayers, and the teachers of men’s inventions?’ Answer. ‘That do I promise in the presence of God, and of his congregation, here assembled.&#x27;</p></blockquote>

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-932238d719" data-kw="">
<blockquote><p>Seing that we and our household have subscribed, and given this public confession of our faith, to the good example of our subjects, we command and charge all commissioners and ministers to crave the same confession of their parishoners, and proceed against the refusers [i.e. commissioners and ministers] according to our laws, and order of the Kirk; delivering their names and lawful process to the ministers of our house, with all haste and diligence, under the pain of fourty pound, to be taken from their stipends; that we, with advice of our counsel, may take order with such proud contemners of God and our laws. Subscribed with our hand, at Holyroodhouse, the second day of March, 1580 (now 1581), the 14th year of our reign.</p></blockquote>

<blockquote><p>We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…”

e+Searcher+of+all+hearts+to+witness%2C+that+our+minds+and+hearts+do+fully+agree+with+this+our+confession%2C+promise%2C+oath%2C+and+subscription%2C+so+that+we+are+not+moved+for+any+worldly+respect%2C+but+are+persuaded+only+in+our+consciences%2C+through+the+knowledge+and+love+of+God%E2%80%99s+true+religion%2C+printed+in+our+hearts+by+the+Holy+Spirit%2C+as+we+shall+answer+to+Him+in+the+day+when+the+secrets+of+all+hearts+shall+be+disclosed%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Civil+Record%2C+Calderwood%2C+The+History+of+the+Kirk+of+Scotland%2C+ed.+Thomas+Thomson+%28Edinburgh%3A+Wodrow+Society%2C+1843%29%2C+vol.+3%2C+pp.+501-5+%7C+The+tenor+of+the+Second+Confession+of+Faith+follows%3A%E2%80%94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7f66a60b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a7f66a60b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-scottish-church-history/#:~:text=We%2C%20all%20and%20every%20one%20of,of%20all%20hearts%20shall%20be%20disclosed&amp;text=We%2C%20all%20and%20every%20one%20of%20us%20underwritten&amp;text=the%20secrets%20of%20all%20hearts%20shall%20be%20disclosed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b3b7b5df6f" data-kw="">
<blockquote><p>The qualities in general requisite in all them, who should bear charge in the Kirk, consist in soundness of religion, and godliness of life, according as they are sufficiently set forth in the Word. … Ordination is the separation and sanctifying of the person appointed to God and his Kirk, after he be well tried and found qualified. … All thir [these], as they must be raised up by God, and by him made able for the work whereto they are called; so ought they know their message to be limited within God’s word, without the bounds of which they ought not to pass. … And generally thir [these] two things ought they all to respect: the glory of God, and edifying of his Kirk, in discharging their duties in their calling.</p></blockquote>

</figure><figure class="quote" id="q-67b306feaf" data-kw="">
<blockquote><p>The Estates of Parliament, presently convened by his Majesty’s special authority, considering the supplication of the General Assembly at Edinburgh, the 12th of August 1639, to his Majesty’s high Commissioner, and the Lords of his Majesty’s honourable Privy Council; and the act of council of the 30th of August 1639, containing the answer of the said supplication; and the act of the said General Assembly, ordaining, by their ecclesiastical constitution, the subscription of the Confession of Faith and Covenant mentioned in their supplication: and withal, having supplicated his Majesty to ratify and enjoin the same by his royal authority, under all civil pains, as tending to the glory of God, the preservation of religion, the King’s Majesty’s honour, and the perfect peace of this kirk and kingdom; do ratify and approve the said supplication, act of council, and act of Assembly; and, conform thereto, ordain and command the said Confession and Covenant to be subscribed by all his Majesty’s subjects of what rank and quality soever, under all civil pains; and ordain the said supplication, act of Council, and act of the Assembly, with the whole Confession and Covenant itself, to be insert and registrate in the acts and books of parliament; and also ordain the same to be presented at the entry of every parliament, and, before they proceed to any other act, that the same be publickly read, and sworn by the whole members of parliament claiming voice therein; otherwise the refusers to subscribe and swear the same shall have no place nor voice in parliament: And sicklike, ordain all judges, magistrates, or other officers, of whatsoever place, rank, or quality, and ministers at their entry, to swear and subscribe the same Covenant, whereof the tenor follows.</p></blockquote>

<blockquote><p>So are there none here admitted without the approbation and judgment of men according to the rules of the Word, and the received order of the Church. This outward calling of the Officers of the Church doth consist in Election and Ordination, after due trial and examination of their soundness in religion, and godliness of life… … The person thus known and nominated… is examined of his skill in the languages, Latin, Greek, and Hebrew, in his interpreting of Scripture, in the controversies of religion, in his gift of exhortation, in the holy and ecclesiastical history and chronology; And first of all, Of his life and manner of conversation… Being thus examined, and found qualified for that charge, he is sent to the vacant place… …And at the same time a public edict is served, that if any person or persons, have any thing to object against the literature, doctrine, or life of such a man, why he may not be a profitable minister of such a Parish, they shall appear… that their objections may be tried and discussed. … …the party… is called up and demanded concerning his willingness and desire to serve the Lord Jesus, for the good of that people; with other questions of that kind; and the people also are demanded, whether they will receive him for their pastor… Both having declared their readiness and mutual consent, the minister.. with so many of the ministers present, as may conveniently come near, lay their hands upon his head, and in the Name of Jesus do appoint him to be the pastor of that people… … This liberty of election is in part prejudged and hindered by patronages and presentations which are still in use there, not by the rules of their discipline, but by toleration of that which they cannot amend, in the mean time procuring, that in the case of presentations by patrons, the examination and trial by the presbytery, is still the same. The congregation, where he who is presented is to serve, is called, if they have ought to object against his doctrine or life, after they have heard him, or that their consent may be had. … The same course of election and admission for substance, and in form according to the nature of their office, is observed in the calling of other officers, as ruling elders, and deacons…</p></blockquote>

e%2C+not+by+the+rules+of+their+discipline%2C+but+by+toleration+of+that+which+they+cannot+amend%2C+in+the+mean+time+procuring%2C+that+in+the+case+of+presentations+by+patrons%2C+the+examination+and+trial+by+the+presbytery%2C+is+still+the+same.+The+congregation%2C+where+he+who+is+presented+is+to+serve%2C+is+called%2C+if+they+have+ought+to+object+against+his+doctrine+or+life%2C+after+they+have+heard+him%2C+or+that+their+consent+may+be+had.+%E2%80%A6+The+same+course+of+election+and+admission+for+substance%2C+and+in+form+according+to+the+nature+of+their+office%2C+is+observed+in+the+calling+of+other+officers%2C+as+ruling+elders%2C+and+deacons%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson%2C+The+Government+%26+Order+of+the+Church+of+Scotland+%28Edinburgh%3A+Bryson%2C+1641%29%2C+II.+Of+their+Calling&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F875d9e0582.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/875d9e0582.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-scottish-church-history/#:~:text=So%20are%20there%20none%20here%20admitted,officers%2C%20as%20ruling%20elders%2C%20and%20deacons&amp;text=So%20are%20there%20none%20here%20admitted%20without%20the&amp;text=of%20other%20officers%2C%20as%20ruling%20elders%2C%20and%20deacons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a547140f2" data-kw="">
<blockquote><p>2. The person [candidate for being the pastor] is tried by Timothy and Titus, and so by the presbytery, his ability, that he be able to teach others (2 Tim. 2:3), that he be apt to teach (1 Tim. 3:2; Tit. 1:9), else the Timothies of the Church lay hands suddenly on him, contrary to 1 Tim. 5:22. So the presbytery tries according to these canons with us, his skill in the languages: Latin, Hebrew, and Greek; his ability of preaching popular sermons, and interpreting Scripture, in controversies, in chronology, and the history of the Church, and he must be proved and tried by the people, by preaching sundry sermons to them (1 Tim. 3:10), and let these first be proved, and let them use the office, whatever officers they shall be, Pastors, Doctors, Elders or Deacons. … 3. …and another day set for his ordination, at which day the edict is called, all who have anything to object against his life and doctrine are thrice publicly at the church door invited to come and object. And this we think is [in Greek] ‘episkepein andra,’ (Acts 6:3) and ‘dokimazein andra,’ (1 Tim. 3:10) ‘to find out’ and ‘to try the man’. The day of ordination… the pastor calls him up before the congregation, and demands if he be willing to accept the charge, and he must testify his consent as Isaiah (Isa. 6:8; Jer. 6:7,8; Acts 9:20). Then the pastor asks the peoples’ consent, which they testify by their [in Greek] ‘keiro onia’, ‘the lifting up of their hands’ (as Acts 14:23), and the man must please the whole multitude (as Acts 6:5; 1:26). This being done, the pastor… with the Presbytery lays their hands on his head, and prays that God would bless him, as the apostles did (Acts 6:6). The apostles prayed and laid their hands on them (Acts 13:3). They prayed and laid their hands on them (1 Tim. 4:14; 1 Tim. 5:22), all being done, the eldership of the congregation give him the right hand of fellowship (as Gal. 2:9)… And this order in substance is kept in ordaining doctors, elders, and deacons.</p></blockquote>

</figure><figure class="quote" id="q-4f39da9927" data-kw="">
<blockquote><p>The Estates of Parliament, now presently convened in this second session of the second triennial parliament, by virtue of an act of the Committee of Estates, who had power and authority from the last parliament for convening the parliament, having seriously considered the Catechisms, viz. the Larger and Shorter ones, with the Confession of Faith, with three acts of approbation thereof by the Commissioners of the General Assembly, presented unto them by the Commissioners of the said General Assembly; do ratify and approve the said Catechisms, Confession of Faith, and Acts of Approbation of the same, produced as it is; and ordains them to be recorded, published, and practiced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/civil-parliament.html">Civil Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles I, Parliament 2, session 2, act 16, Act anenet the Catechisms, Confession of Faith, and Ratification thereof, at Edinburgh, Feb. 7, 1649</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

— Civil Parliament, Charles I, Parliament 2, session 2, act 16, Act anenet the Catechisms, Confession of Faith, and Ratification thereof, at Edinburgh, Feb. 7, 1649">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Estates+of+Parliament%2C+now+presently+convened+in+this+second+session+of+the+second+triennial+parliament%2C+by+virtue+of+an+act+of+the+Committee+of+Estates%2C+who+had+power+and+authority+from+the+last+parliament+for+convening+the+parliament%2C+having+seriously+considered+the+Catechisms%2C+viz.+the+Larger+and+Shorter+ones%2C+with+the+Confession+of+Faith%2C+with+three+acts+of+approbation+thereof+by+the+Commissioners+of+the+General+Assembly%2C+presented+unto+them+by+the+Commissioners+of+the+said+General+Assembly%3B+do+ratify+and+approve+the+said+Catechisms%2C+Confession+of+Faith%2C+and+Acts+of+Approbation+of+the+same%2C+produced+as+it+is%3B+and+ordains+them+to+be+recorded%2C+published%2C+and+practiced.%E2%80%9D%0A%0A%E2%80%94+Civil+Parliament%2C+Charles+I%2C+Parliament+2%2C+session+2%2C+act+16%2C+Act+anenet+the+Catechisms%2C+Confession+of+Faith%2C+and+Ratification+thereof%2C+at+Edinburgh%2C+Feb.+7%2C+1649&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f39da9927.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4f39da9927.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-scottish-church-history/#:~:text=The%20Estates%20of%20Parliament%2C%20now%20presently,to%20be%20recorded%2C%20published%2C%20and%20practiced&amp;text=The%20Estates%20of%20Parliament%2C%20now%20presently%20convened%20in&amp;text=ordains%20them%20to%20be%20recorded%2C%20published%2C%20and%20practiced" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a55fd695ed" data-kw="">
<blockquote><p>Our sovereign lord and lady the king and queen’s majesties and three estates of parliament, conceiving it to be their bound duty, after the great deliverance that God has lately wrought for this country and kingdom [in 1689], in the first place to settle and secure therein the true Protestant religion according to the truth of God’s word as it has of a long time been professed within this land. As also the government of Christ’s church within this nation agreeable to the word of God and most conducive to the advancement of true piety and godliness and the establishing of peace and tranquillity within this realm… Therefore their majesties, with advice and consent of the said three estates, do hereby revive, ratify and perpetually confirm all laws, statutes and acts of parliament made against popery and papists and for the maintenance and preservation of the true reformed Protestant religion and for the true church of Christ within this kingdom, in so far as they confirm the same, or are made in favour thereof. Likewise they, by this act, ratify and establish the Confession of Faith now read in their presence and voted and approved by them as the public and avowed confession of this church, containing the sum and substance of the doctrine of the reformed churches; which Confession of Faith is subjoined to this present act; as also, they do establish, ratify and confirm the presbyterian church government and discipline…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/civil-parliament.html">Civil Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Act of June 7, 1690, Act ratifying the Confession of Faith and settling presbyterian church government in The Records of the Parliaments of Scotland to 1707, eds. K.M. Brown et al. (St Andrews, 2007-2025) On the interpretation of this see Cooper, pp. 45-49 &amp; 50-51.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our sovereign lord and lady the king and queen’s majesties and three estates of parliament, conceiving it to be their bound duty, after the great deliverance that God has lately wrought for this country and kingdom [in 1689], in the first place to settle and secure therein the true Protestant religion according to the truth of God’s word as it has of a long time been professed within this land. As also the government of Christ’s church within this nation agreeable to the word of God and most conducive to the advancement of true piety and godliness and the establishing of peace and tranquillity within this realm… Therefore their majesties, with advice and consent of the said three estates, do hereby revive, ratify and perpetually confirm all laws, statutes and acts of parliament made against popery and papists and for the maintenance and preservation of the true reformed Protestant religion and for the true church of Christ within this kingdom, in so far as they confirm the same, or are made in favour thereof. Likewise they, by this act, ratify and establish the Confession of Faith now read in their presence and voted and approved by them as the public and avowed confession of this church, containing the sum and substance of the doctrine of the reformed churches; which Confession of Faith is subjoined to this present act; as also, they do establish, ratify and confirm the presbyterian church government and discipline…”

ing+presbyterian+church+government+in+The+Records+of+the+Parliaments+of+Scotland+to+1707%2C+eds.+K.M.+Brown+et+al.+%28St+Andrews%2C+2007-2025%29+On+the+interpretation+of+this+see+Cooper%2C+pp.+45-49+%26+50-51.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa55fd695ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a55fd695ed.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-scottish-church-history/#:~:text=Our%20sovereign%20lord%20and%20lady%20the,the%20presbyterian%20church%20government%20and%20discipline&amp;text=Our%20sovereign%20lord%20and%20lady%20the%20king%20and&amp;text=and%20confirm%20the%20presbyterian%20church%20government%20and%20discipline" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3caee1b681" data-kw="">
<blockquote><p>And do further statute and ordain, that no person be admitted, or continued for hereafter, to be a minister or preacher within this Church, unless that he… do also subscribe the Confession of faith, ratified in the foresaid 5th Act of the second Session of this Parliament, declaring the same to be the confession of his faith, and that he owns the doctrine therein contained to be the true doctrine which he will constantly adhere to: As likewise, that he owns and acknowledges Presbyterian Church government, as settled by the foresaid fifth act of the second session of this parliament, to be the only government of this Church, and that he will submit thereto, and concur therewith, and never endeavour, directly or indirectly, the prejudice or subversion thereof…</p></blockquote>

</figure><figure class="quote" id="q-134828ed61" data-kw="">
<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>

<blockquote><p>This presbytery consisting of more pastors is the first ruling and governing Church, having power of the keys in all points of discipline within themselves; They have intensively power of the keys in all points, and equal power, intensive [intensively] with greater synods and assemblies, because ordination of pastors by them, 1 Tim. 4:14, is as valid in the point of Church discipline as the decrees made in the great council convented at Jerusalem, Acts 15:21-22, etc. But provincial synods and national assemblies have greater power than the presbyteries extensive [extensively]; because they have power as a great body to exercise discipline that concerns the whole congregations of all the nation, which power is not in inferior elderships.</p></blockquote>

<blockquote><p>It is a radical [root] principle of our system ‘that a larger part of the Church, or a representation of it, should govern a smaller, or determine matters of controversy which arise therein.’… This is of the essence of Presbyterianism. It is involved in the declaration that the Church is to be governed not only by congregational and presbyterial, but also by synodical assemblies; and more expressly in the declaration that synods have authority ‘to redress whatever has been done by presbyteries contrary to order.&#x27;</p></blockquote>

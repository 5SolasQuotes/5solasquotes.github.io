<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>

<blockquote><p>13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.”

<blockquote><p>(2) We have found that God Himself expresses an ardent desire for the fulfilment of certain things which He has not decreed in his inscrutable counsel to come to pass. This means that there is a will to the realization of what He has not decretively willed, a pleasure towards that which He has not been pleased to decree. This is indeed mysterious, and why He has not brought to pass, in the exercise of his omnipotent power and grace, what is his ardent pleasure lies hid in the sovereign counsel of his will. We should not entertain, however, any prejudice against the notion that God desires or has pleasure in the accomplishment of what he does not decretively will. (3) Our Lord Himself in the exercise of his messianic prerogative provides us with an example of the foregoing as it applies to the matter of salvation. He says expressly [in Mt. 23:37] that He willed the bestowal of his saving and protecting grace upon those whom neither the Father nor he decreed thus to save and protect.</p></blockquote>

<blockquote><p>voluntas Dei, ‘the will of God’ … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. 1</span></figcaption>

<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. 1 | PRRD, vol. 3, p. 470</span></figcaption>

</figure><figure class="quote" id="q-221bfde8a3" data-kw="">
<blockquote><p>As for the divine commiseration of sinners, it shows that their death and damnation are not things primarily well-pleasing unto God: but it shows not that God must become an hypocrite and a dissembler if He have eternally decreed to permit them to incur death and damnation by their own default. For God’s mercy being actio sublevantis [an act of taking away] and not passio condolentis [a passion of suffering with], it ties Him not to do all He can for redeeming any man out of his misery; but his action is ordered and limited by his own free-will. It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, … (Cambridge, 1641), ‘Whether absolute reprobation oppugn the truth and sincerity of God’, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>4. This turning the grace of God into lasciviousness argues the grossest folly; it is a forsaking of our own mercy, a receiving the grace of God in vain. What is, if this be not to neglect great salvation; to be prodigal of blessedness; to ravel out and to wanton away the offers of Christ Himself? Who would not heartily chide himself that by toying, trifling, or unnecessary lingering in the way to the exchange, misses of a bargain by which he might have gained a thousand pounds?… 4. Grace turned into lasciviousness is the top of all ingratitude. What greater unkindness than to be evil because God is good?… To be lascivious because God is gracious is to fight against God with his own weapons, to wound God with that arm which He has cured (Hos. 7:15), to kill and crucify Him who has freed us from death: In a word, to make that a pillow for presumption which God appointed for an antidote against despair.</p></blockquote>

<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>

<blockquote><p>§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…</p></blockquote>

</figure><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>

<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>

</figure><figure class="quote" id="q-908f580768" data-kw="">
<blockquote><p>I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-creed.html">William Creed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>paragraphs 61-73</cite>, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), pp. 237-38</span></figcaption>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-88115f67b8" data-kw="">
<blockquote><p>XXV. Thirdly, it is asked how Christ could offer such prayers to God as openly appear to be repugnant to the divine counsel and will, and thus to the piety and obedience which he most constantly exhibited to the Father? For what? Was he not born and made mediator for this very reason, that he might drink this cup for our salvation? Did he not know that this was the decree of the Father, as he himself testified more than once, that he must suffer many things and be killed? Mt. 16:21. Indeed, when he was being seized by the soldiers, he rebukes Peter for resisting them: “Shall I not drink the cup which my Father hath given me?” How, therefore, is he contrary to himself and to the Father, by requesting with such effort that the cup be transferred from him? Here, indeed, there are many things that can be replied. 1st, We suppose, against the Monothelites, that there was a twofold will in Christ, just as there was a divine and a human nature; these were not indeed adverse and repugnant to one another, but were nevertheless diverse insofar as they were directed toward diverse objects. The divine [will] willed death because it had been so ordained by the Father for our redemption; the human, however, shuddered and prayed against it, because it viewed it as the destruction of nature and the most dire of all evils that could exist; yet the human will is not rightly said to have been repugnant to the divine, because it petitioned not absolutely, but conditionally; not with a deliberate and elective will, but rather with an inefficacious and natural velleity. Therefore, it is to be observed 2nd, that the will can be divided in many ways; for one is called efficacious, another inefficacious; that is called efficacious which is the principle of acting, and which moves and impels a man to execute those things which it wills and to remove, as much as it can, any impediments to operation; [Ineffectual] which is not brought into effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ</cite>, … (Geneva, 1666), 6th Disputation, which is the Fourth on the Truth of Christ’s Satisfaction, Asserted from his Agony and Desertion tr. AI by The Received Faith, sect. 25-29</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXV. Thirdly, it is asked how Christ could offer such prayers to God as openly appear to be repugnant to the divine counsel and will, and thus to the piety and obedience which he most constantly exhibited to the Father? For what? Was he not born and made mediator for this very reason, that he might drink this cup for our salvation? Did he not know that this was the decree of the Father, as he himself testified more than once, that he must suffer many things and be killed? Mt. 16:21. Indeed, when he was being seized by the soldiers, he rebukes Peter for resisting them: “Shall I not drink the cup which my Father hath given me?” How, therefore, is he contrary to himself and to the Father, by requesting with such effort that the cup be transferred from him? Here, indeed, there are many things that can be replied. 1st, We suppose, against the Monothelites, that there was a twofold will in Christ, just as there was a divine and a human nature; these were not indeed adverse and repugnant to one another, but were nevertheless diverse insofar as they were directed toward diverse objects. The divine [will] willed death because it had been so ordained by the Father for our redemption; the human, however, shuddered and prayed against it, because it viewed it as the destruction of nature and the most dire of all evils that could exist; yet the human will is not rightly said to have been repugnant to the divine, because it petitioned not absolutely, but conditionally; not with a deliberate and elective will, but rather with an inefficacious and natural velleity. Therefore, it is to be observed 2nd, that the will can be divided in many ways; for one is called efficacious, another inefficacious; that is called efficacious which is the principle of acting, and which moves and impels a man to execute those things which it wills and to remove, as much as it can, any impediments to operation; [Ineffectual] which is not brought into effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.”

— Francis Turretin, Disputations on the Satisfaction of Christ, … (Geneva, 1666), 6th Disputation, which is the Fourth on the Truth of Christ’s Satisfaction, Asserted from his Agony and Desertion tr. AI by The Received Faith, sect. 25-29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXV.+Thirdly%2C+it+is+asked+how+Christ+could+offer+such+prayers+to+God+as+openly+appear+to+be+repugnant+to+the+divine+counsel+and+will%2C+and+thus+to+the+piety+and+obedience+which+he+most+constantly+exhibited+to+the+Father%3F+For+what%3F+Was+he+not+born+and+made+mediator+for+this+very+reason%2C+that+he+might+drink+this+cup+for+our+salvation%3F+Did+he+not+know+that+this+was+the+decree+of+the+Father%2C+as+he+himself+testified+more+than+once%2C+that+he+must+suffer+many+things+and+be+killed%3F+Mt.+16%3A21.+Indeed%2C+when+he+was+being+seized+by+the+soldiers%2C+he+rebukes+Peter+for+resisting+them%3A+%E2%80%9CShall+I+not+drink+the+cup+which+my+Father+hath+given+me%3F%E2%80%9D+How%2C+therefore%2C+is+he+contrary+to+himself+and+to+the+Father%2C+by+requesting+with+such+effort+that+the+cup+be+transferred+from+him%3F+Here%2C+indeed%2C+there+are+many+things+that+can+be+replied.+1st%2C+We+suppose%2C+against+the+Monothelites%2C+that+there+was+a+twofold+will+in+Christ%2C+just+as+there+was+a+divine+and+a+human+nature%3B+these+were+not+indeed+adverse+and+repugnant+to+one+another%2C+but+were+nevertheless+diverse+insofar+as+they+were+directed+toward+diverse+objects.+The+divine+%5Bwill%5D+willed+death+because+it+had+been+so+ordained+by+the+Father+for+our+redemption%3B+the+human%2C+however%2C+shuddered+and+prayed+against+it%2C+because+it+viewed+it+as+the+destruction+of+nature+and+the+most+dire+of+all+evils+that+could+exist%3B+yet+the+human+will+is+not+rightly+said+to+have+been+repugnant+to+the+divine%2C+because+it+petitioned+not+absolutely%2C+but+conditionally%3B+not+with+a+deliberate+and+elective+will%2C+but+rather+with+an+inefficacious+and+natural+velleity.+Therefore%2C+it+is+to+be+observed+2nd%2C+that+the+will+can+be+divided+in+many+ways%3B+for+one+is+called+efficacious%2C+another+inefficacious%3B+that+is+called+efficacious+which+is+the+principle+of+acting%2C+and+which+moves+and+impels+a+man+to+execute+those+things+which+it+wills+and+to+remove%2C+as+much+as+it+can%2C+any+impediments+to+operation%3B+%5BIneffectual%5D+which+is+not+brought+into+effect%2C+whether+because+of+impediments+arriving+from+elsewhere%2C+or+because+it+is+a+simple+complacency+in+the+good%2C+or+displeasure+at+evil%2C+and+does+not+proceed+further+so+as+to+be+a+principle+of+operating%2C+nor+does+it+in+reality+impel+one+to+the+execution+of+the+thing%2C+which+deserves+to+be+called+velleity+rather+than+will.+Therefore%2C+when+Christ+is+said+to+have+willed+that+the+cup+might+pass%2C+this+ought+not+to+be+understood+of+an+efficacious+will+which+produced+in+Him+any+attempt+at+escaping+and+extricating+Himself+from+those+snares%3B+indeed%2C+we+see+Him+led+as+a+sheep+to+the+slaughter%2C+Isa.+LIII%3A8%2C+so+that+He+in+no+way+resisted%2C+nor+attempted+to+flee+from+death%2C+but+of+an+ineffectual+will+which+signifies+nothing+other+than+a+simple+displeasure+arising+from+a+natural+inclination+by+which+the+will+abhors+that+which+destroys+nature.+XXVI.+The+will+is+either+natural+and+indeliberate%2C+or+deliberate+and+elective.+The+former+is+called+will+by+way+of+nature%2C+the+latter+by+way+of+reason%2C+thus+Thomas%2C+pt.+3%2C+quest.+18%2C+art.+5.+Will+as+nature%2C+or+by+way+of+nature%2C+is+a+physical+faculty+having+a+natural+inclination+toward+the+preservation+of+the+whole+composite%2C+or+it+is+a+desire+for+advantage%3B+it+is+called+indeliberate+will+because+it+is+borne+toward+an+object+considered+absolutely+without+any+consideration+of+circumstances.+But+will+by+way+of+reason+is+a+rational+faculty+for+pursuing+the+general+good+of+the+whole+man+as+he+is+man%2C+or+for+following+the+dictate+of+the+practical+intellect+advising+what+is+right+and+just%3B+it+is+called+elective+will+because+it+is+a+desire+and+affection+for+justice+rather+than+for+one%E2%80%99s+own+utility%3B+it+is+also+called+deliberate+will+because+it+regards+an+object+clothed+in+all+its+circumstances%2C+and+this+will+is+referred+to+rational+cognition+as+to+its+cause%2C+because+it+follows+not+the+instinct+of+nature+but+the+dictate+of+reason.+The+will+of+nature+naturally+flees+those+things+which+are+contrary+to+nature%2C+such+as+death%2C+torments%2C+etc.+The+will+by+way+of+reason+can+be+borne+even+toward+those+things+which+are+adverse+to+nature%2C+provided+they+are+just+and+honorable+or+necessary%3B+thus%2C+for+example%2C+he+who+by+natural+will+flees+and+is+averse+to+a+bitter+potion%2C+nevertheless+receives+the+same+by+rational+will%2C+because+he+knows+there+is+no+other+way+of+recovering+health.+In+the+same+way%2C+martyrs+by+nature+cannot+but+shudder+at+death%2C+but+the+same+persons%2C+nevertheless%2C+approach+it+eagerly+out+of+reason+as+the+most+glorious+testimony+of+the+benevolence+of+God%2C+and+glory+in+it.+In+clearly+the+same+manner%2C+Christ+willed+and+did+not+will+death%2C+in+a+different+respect.+The+will+by+way+of+nature+did+not+will+it%2C+but+the+same+by+way+of+reason+willed+it%3B+it+did+not+will+it+insofar+as+natural+appetite+was+a+desire+that+He+might+live%2C+and+it+viewed+death+absolutely+and+in+itself+as+the+destruction+of+nature.+But+insofar+as+He+viewed+the+same+with+its+circumstances%2C+that+is%2C+as+decreed+by+God+and+necessary+for+the+salvation+of+the+elect%2C+He+was+borne+toward+it+with+a+most+propense+affection%2C+just+as+He+testified+elsewhere+that+this+was+His+food%2C+that+He+might+do+the+will+of+His+Father.+Jn.+IV%3A34%3B+XXVII%3A4.+Will+is+distinguished+into+simple+and+absolute%2C+and+hypothetical+or+conditional.+The+former+is+that+by+which+one+wills+something+absolutely+and+efficaciously%2C+so+that+he+leaves+nothing+undone+so+that+that+will+may+be+brought+into+effect.+The+latter+in+which+one+wills+something+under+a+condition%2C+and+which+is+contained+within+certain+limits.+Thus%2C+with+an+absolute+will%2C+the+faithful+seek+the+remission+of+their+sins%2C+and+whatever+things+are+necessary+for+their+salvation.+But+with+a+conditional+will%2C+they+seek+those+things+which+do+not+pertain+to+salvation+in+themselves%2C+nor%2C+whether+granted%2C+promote+it%2C+or%2C+if+denied%2C+remove+it%E2%80%94for+instance%2C+wealth%2C+health%2C+strength%2C+external+peace%E2%80%94in+the+seeking+of+which+they+must+always+add+that+condition%2C+expressly+or+implicitly%3A+%E2%80%9Cif+the+will+of+God+so+carries+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%2C+%E2%80%A6+%28Geneva%2C+1666%29%2C+6th+Disputation%2C+which+is+the+Fourth+on+the+Truth+of+Christ%E2%80%99s+Satisfaction%2C+Asserted+from+his+Agony+and+Desertion+tr.+AI+by+The+Received+Faith%2C+sect.+25-29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88115f67b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/88115f67b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=XXV.%20Thirdly%2C%20it%20is%20asked%20how,will%20of%20God%20so%20carries%20it&amp;text=XXV.%20Thirdly%2C%20it%20is%20asked%20how%20Christ%20could&amp;text=if%20the%20will%20of%20God%20so%20carries%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8d58f9f9b0" data-kw="">
<blockquote><p>XXXII. Finally, it is asked here how Christ can be said to have been heard in that prayer from fear, as the apostle testifies, Heb. V:7 [“Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;”], and elsewhere Christ professes that he is always heard by the Father, Jn. XI:42, when nevertheless death had necessarily to be undergone by him. That which Christ willed simply and absolutely, in that he never suffered a refusal; but that which he willed only under a condition, it is no wonder if he did not obtain it, since that was not so much a will as it was velleity, and that was not so much to be reckoned a rational desire, which ought always to hold the primary place, as a natural inclination and sensitive appetite, which never has the principal role in prayer. 2. Christ was heard from the fear of death, not indeed absolutely, as if He had been freed from the necessity of undergoing death, but in a certain respect, namely, insofar as God, who heard Him, so shook off that fear that He received death most steadfastly and submitted Himself wholly to the divine will, and was thus strengthened so that He laid aside all dread of death. For Christ feared two things above all:

1. Lest He should succumb, overwhelmed by the evils which He saw to be most grievous.

2. Lest He should be swallowed up by death, so that no exit from it would be open. But God heard Him, that is, freed Him from both those fears:

1. Because He so corroborated Him by the power of His Spirit in the midst of the struggle that He most steadfastly and invincibly sustained that most grievous contest.

2. Because He freed Him from death, having loosed the pains of hell by His glorious resurrection; and thus, most truly, in this respect He was heard—not, indeed, that He might not pay the penalty of death, but that He might not be swallowed up by it; not that He might not taste it, but that He might not perish in it; not in the subterfuge of punishments, but in the constant toleration of the same and in a strong and invincible liberation and victory.</p></blockquote>

<blockquote><p>As God may by metaphor be said to will what by His will, properly speaking, He wills not; so He may by metaphor be said to will what He does will, properly speaking. Hence there is nothing to prevent the same thing being the object of the will of good pleasure and of the will of expression [sign]. But operation is always the same as the will of good pleasure; while precept and counsel are not; both because the former regards the present, and the two latter the future; and because the former is of itself the effect of the will; the latter its effect as fulfilled by means of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 12, reply to obj. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As God may by metaphor be said to will what by His will, properly speaking, He wills not; so He may by metaphor be said to will what He does will, properly speaking. Hence there is nothing to prevent the same thing being the object of the will of good pleasure and of the will of expression [sign]. But operation is always the same as the will of good pleasure; while precept and counsel are not; both because the former regards the present, and the two latter the future; and because the former is of itself the effect of the will; the latter its effect as fulfilled by means of another.”

<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

<blockquote><p>XL. Holy obedience is to walk in a manner worthy of the Lord, to please Him in all respects, bearing fruit in every good work and increasing in the knowledge of God. XLI. This life is like a journey that we must walk, always mindful that we are here as travelers, far from the Lord, and striving toward our homeland. XLII. Those who walk in a manner worthy of the Lord are those who, throughout the course of their lives, follow the will and guidance of God, denying their own desires and the dictates of the flesh, as befits children of the heavenly Father and imitators of God.</p></blockquote>

<blockquote><p>II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally:

      1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20).

      2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment.

      3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis).

III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall:

      1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

      2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

      3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

      4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally:

      1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20).

      2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment.

      3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis).

III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall:

      1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

      2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

      3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

      4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’, tr. Onku with AI (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+This+punishment+%28this+disobedience+having+been+posited%29+the+divine+nature+first+of+all+requires%2C+for+God+is+a+consuming+fire+who+cannot+bear+sin+%28Deut+4%3A24%2C+Hab+1%3A13%29.+Yet+we+do+not+want+God+to+act+irrationally+%28just+as+elementary+fire%29%2C+but+most+rationally%2C+concomitantly+to+his+nature+but+not+antecedently%2C+for+he+is+a+rational+and+intelligent+fire+who%2C+although+he+can+transfer+the+burning+to+another+combustible+thing%2C+yet+cannot+suspend+it+totally%3A+1.+Because+God+hates+and+abhors+sin+to+the+utmost%2C+and+hatred+%28like+all+affections%29+belongs+to+God+according+to+its+effects%2C+and+signifies+in+him+1%29+opposition+to+the+hated+thing%2C+2%29+rejection+and+damnation+and+grave+punishment+of+the+one+who+perpetrates+that+hated+thing%2C+as+even+Vorstius+teaches+%28Notes+on+Disp.+10+on+God%2C+thesis+20%29.+2.+God+as+the+best+being%2C+by+necessity+of+nature+is+zealous+for+his+own+glory%2C+which+is+the+end+of+all+his+actions%2C+which+does+not+happen+unless+by+vindicating+the+contempt+of+himself+which+he+suffers+through+sin%2C+which+is+not+expiated+except+through+punishment.+3.+The+supreme+Lord+by+necessity+of+nature+requires+supreme+acknowledgment+of+himself%2C+which+is+denied+to+him+through+sin%2C+which+cannot+be+repaired+except+through+the+acknowledgment+of+the+despiser+by+which+he+may+experience+how+grave+and+sad+is+the+contempt+of+his+master.+And+these+things+are+so+true+that+even+in+civil+affairs%2C+neglect+of+his+majesty+cannot+consist+with+the+supreme+magistrate%3B+nor+therefore+through+this+is+God+rendered+impotent%2C+as+the+Socinian+Gitichius+deduces+from+this+%28Against+Lucius%2C+Argument+2%29.+For+he+cannot+deny+himself+%282+Tim+2%3A13%29+nor+his+glory.+Secondly%2C+the+truth+of+the+divine+threats%2C+by+which+the+highest+torments+await <blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>

<blockquote><p>The power of a univocal agent is wholly manifested in its effect. The generative power of man, for example, is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect: as, for example, the power of the sun does not wholly manifest itself in the production of an animal generated from putrefaction. Now it is clear that God is not a univocal agent. For nothing agrees with Him either in species or in genus, as was shown above (Q. 3, A. 5; Q. 4, A. 3). Whence it follows that His effect is always less than His power. It is not necessary, therefore, that the infinite power of God should be manifested so as to produce an infinite effect. Yet even if it were to produce no effect, the power of God would not be ineffectual; because a thing is ineffectual which is ordained towards an end to which it does not attain. But the power of God is not ordered toward its effect as towards an end; rather, it is the end of the effect produced by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 25, art. 2, reply to obj. 2</span></figcaption>

<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3f80f93133" data-kw="">
<blockquote><p>Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature, or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature. (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved, as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>

<blockquote><p>Question 13: Whether God wills Himself as the end, and creatures as means? Distinguished. Answer: As the ultimate end He always wills Himself, Prov. 16:4. Creatures, and their actions, He sometimes wills as means in respect of others, sometimes as ends; but those ends are always subordinated, in respect of God, who is the universal and ultimate end of all things, Rom. 11, last verse.</p></blockquote>

<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-f89fa2cd79" data-kw="">
<blockquote><p>7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ordinatio</cite>, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

e/2eb6aa1012.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-will-of-god/#:~:text=To%20bring%20forward%20greater%20things%2C%20the,fallen%20by%20the%20tree%20of%20ignominy&amp;text=To%20bring%20forward%20greater%20things%2C%20the%20common%20reason&amp;text=we%20had%20fallen%20by%20the%20tree%20of%20ignominy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a779fe462" data-kw="">
<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>

</figure><figure class="quote" id="q-80a32aa2ee" data-kw="">
<blockquote><p>They ought not to have despaired, for whom the Lord, hanging on the cross, deigned to pray. He saw some of His own among many strangers. He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ All of which seems to be referred to some of His own, not to the many strangers. 17. Nevertheless, I judge, according to the mind of St. Augustine it is to be carried to each man of the whole collection in which Christ the Lord saw some of his own among many strangers, so that the salvation of certain ones was especially and efficaciously intended, and this was the principal motive on account of which the prayer and redemption were extended to the whole collection, in which many strangers were mixed in. For thus are received universally and without restriction those sentences: ‘He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ [Ruiz continues to section 26 with further, similar quotes from Augustine and the fathers on the subject.]</p></blockquote>

<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, p. 453</span></figcaption>

<blockquote><p>CANON 22. Concerning those things that belong to man. No man has anything of his own but untruth and sin. But if a man has any truth or righteousness, it from that fountain for which we must thirst in this desert, so that we may be refreshed from it as by drops of water and not faint on the way. CANON 23. Concerning the will of God and of man. Men do their own will and not the will of God when they do what displeases him; but when they follow their own will and comply with the will of God, however willingly they do so, yet it is his will by which what they will is both prepared and instructed.</p></blockquote>

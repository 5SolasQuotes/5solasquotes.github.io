<figure class="quote" id="q-7958195d20" data-kw="">
<blockquote><p>It seems, I confess, by its more obvious aspect [in the term ‘will of sign’, which is often misunderstood], too much to countenance the ignominious slander which profane and atheistical dispositions would fasten on God, and the course of his procedure towards men; and which it is the design of these papers to evince of as much absurdity and folly, as it is guilty of impiety and wickedness: as though He only intended to seem willing of what He really was not; that there was an appearance to which nothing did subesse [exist under]. And then why is the latter called voluntas [will]? unless the meaning be, He did only will the sign; which is false and impious;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconcileableness of God’s Prescience of the Sins of Men with the Wisdom and Sincerity of His Counsels, Exhortations, and Whatsoever Means He Uses to Prevent Them</cite>, Section 19, page 51-2</span></figcaption>

</figure><figure class="quote" id="q-b414c636c8" data-kw="">
<blockquote><p>Shall it be said that sin does not displease God; that He has no will against sin; it is not repugnant to his will? Yes; it is to his revealed will, to his law. But is that an untrue revelation? His law is not his will itself, but the signum [sign], the discovery of his will. Now, is it an insignificant sign? A sign that signifies nothing? Or to which there belongs no correspondent significatum [signification]? –nothing that is signified by it? Is that which is signified (for sure no one will say it signifies nothing) his real will, yea or no? Who can deny it? That will, then (and a most calm, sedate, impassionate will it must be understood to be), sin and consequently the consequent miseries of his creatures, are repugnant unto. … Therefore, it seems out of question, that the holy God does constantly and perpetually, in a true sense, will universal obedience, and the consequent felicity of all his creatures capable thereof; i.e. He does will it with simple complacency, as what were highly grateful to Him, simply considered by itself. Who can doubt, but that purity, holiness, blessedness, wheresoever they were to be beheld among his creatures, would be a pleasing and delightful spectacle to Him, being most agreeable to the perfect excellency, purity, and benignity of his own nature, and that their deformity and misery must be consequently unpleasing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears wept over Lost Souls</cite>, pp. 386-8</span></figcaption>

<blockquote><p>The term voluntas signi, literally, the will of the sign, is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’–thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded… The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, vol. 3 (Baker, 2003), Part 2, ch. 5.4, E., ‘The Ad Intra–Ad Extra Distinctions’, sections 1, p. 458</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-e02eae89de" data-kw="">
<blockquote><p>The will of God is one, since it is the very essence of God. Yet sometimes it is spoken of as many, as in the words of Ps. 110:2: ‘Great are the works of the Lord, sought out according to all His wills.’ Therefore sometimes the sign must be taken for the will… Some things are said of God in their strict sense; others by metaphor, as appears from what has been said before (q. 13, art. 3). When certain human passions are predicated of the Godhead metaphorically, this is done because of a likeness in the effect. Hence a thing that is in us a sign of some passion, is signified metaphorically in God under the name of that passion… In the same way, what is usually with us an expression of will, is sometimes metaphorically called will in God; just as when anyone lays down a precept, it is a sign that he wishes that precept obeyed. Hence a divine precept is sometimes called by metaphor the will of God, as in the words: ‘Thy will be done on earth, as it is in heaven’ (Matt 6:10)… Therefore in God there are distinguished will in its proper sense, and will as attributed to Him by metaphor. Will in its proper sense is called the will of good pleasure; and will metaphorically taken is the will of expression [signi], inasmuch as the sign itself of will is called will… Expressions [signa] of will are called divine wills, not as being signs that God wills anything; but because what in us is the usual expression [signa] of our will, is called the divine will in God. Thus punishment is not a sign that there is anger in God; but it is called anger in Him, from the fact that it is an expression [signum] of anger in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)”

— John White, A Defence of the Way to the True Church, … wherein the motives leading to papistry… are handled and fully disputed (London: Field, 1614), ch. 25, pp. 212-14 White (1570–1615) was an English clergyman, a royal chaplain and controversialist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Next+it+must+be+noted+how+peremptorily+he+%5Ba+Romish+adversary%5D+charges+me+with+ignorance+for+saying+this+antecedent+will+is+not+simply%2C+properly+and+formally+in+God.+But+he+should+have+considered+that+when+I+said+so%2C+I+spoke+in+the+words+of+Durand+%28Durand%2C+bk.+1%2C+dist.+46%2C+quest.+1%29%2C+one+of+his+own+side%2C+whom+I+alleged+in+the+margin%3A+that%2C+if+it+were+false+I+said%2C+yet+the+ignorance+should+not+be+fathered+on+me%2C+but+on+them+that+begot+it.+For+I+said+the+truth%2C+and+himself+is+ignorant+of+the+doctrine+of+his+own+Church.+For+Thomas+handling+this+antecedent+will%2C+says+%28pt.+1%2C+quest.+19%2C+art.+6%2C+to+obj.+1%29%2C+%E2%80%98We+do+not+simply+will+what+we+will+antecedently%3B+and+therefore+this+antecedent+will+may+rather+be+called+a+velleity+than+an+absolute+will.+%28magis+dici+potest+velleitas+quam+absoluta+voluntas%29+A+velleity%2C+that+is+to+say+as+Gregory+of+Valence+expounds+him+%28Commentary+on+Thomas%2C+pt.+1%2C+disp.+1%2C+quest.+19%2C+point+2%29%2C+%E2%80%98a+certain+conditionated+will%3B+when+that+only+can+be+said+simply+to+be+willed%2C+that+is+willed+consequently.%E2%80%99+Where+we+see+that+Thomas+reduces+this+antecedent+will+to+an+imperfect+kind+of+willing%2C+which+he+calls+a+velleity%2C+which+is+not+a+simple%2C+proper+or+formal+will%3A+and+the+most+Schoolmen+follow+him+upon+this+ground%2C+because+there+cannot+be+a+formal+will+in+God+which+is+not+fulfilled%2C+as+the+salvation+of+all+men+is+not.+Hence+it+is+says+Suarez+%28Tract+on+Predestination%2C+bk.+4%2C+ch.+2%2C+no.+2%29%2C+that+some+have+inferred+that+this+of+God+whereby+He+would+the+salvation+of+all+men%2C+is+no+proper+and+formal+act+of+willing+in+God%3A+because+He+has+no+imperfect+act+of+willing%2C+as+they+call+velleity%2C+but+only+a+signification+of+will+%28voluntatem+signi%29%2C+which+only+is+metaphorical+and+interpretative%2C+in+that+He+carries+Himself+towards+men%2C+as+if+He+had+that+act+of+willing.+Thus+think+Cajetan+and+Marsilius.+Others+say%2C+the+formal+and+proper+will+of+God+reaches+not+to+the+salvation+of+all+men%2C+for+that+cause+because+it+is+not+fulfilled%2C+but+only+to+the+giving+of+sufficient+means%3A+which+will%2C+only+to+appoint+sufficient+means%2C+is+formal+in+God%2C+and+thereof+God+is+said+to+will+the+salvation+of+all+men%3A+and+of+this+mind+are+many+Schoolmen.+This+will+of+God%2C+says+Vasquez+%28in+pt.+1+of+Thomas%2C+disp.+83%2C+no.+22%29%2C+whereby+He+would+the+salvation+of+all+men%2C+even+of+the+reprobate%2C+very+many+Schoolmen%2C+especially+the+newer%2C+think+to+be+only+a+conditionated+will%2C+which+they+call+a+velleity%3A+whose+act+is+not+absolute+and+perfect%2C+but+under+condition.+Now+the+probabler+opinion%2C+says+Dominicus+Bannes+%28Commentary%2C+pt.+1%2C+quest.+19%2C+art.+6%2C+conclusion+2%29%2C+is+that+there+is+formally+no+will+in+God+which+is+signified+by+the+name+of+velleity.+Whence+it+follows+that+since+by+the+doctrine+of+Thomas+and+many+others%2C+this+antecedent+will+is+but+a+velleity%2C+it+cannot+be+formally+in+God.+But+to+take+down+this+raw+student+yet+a+little+more%2C+Soto+Major+says+%28in+tome+above%2C+p.+274%29%3A+This+word%2C+God+will+the+salvation+of+all+men%2C+by+the+good+leave+of+so+many+ancient+authors%2C+we+will+not+only+expound+of+will+properly+so+called%2C+which+is+God%E2%80%99s+good+pleasure%2C+but+of+his+antecedent+will%3B+that+is+to+say%2C+an+imaginary+and+metaphorical+will%3A+according+to+the+which%2C+it+is+no+inconvenience+to+say%2C+God+will+have+all+men+to+be+saved%3A+of+which+antecedent+will%2C+or+will+improperly+so+called%2C+Damascene+speaks+%28p.+279%29.+And+again%3A+Damascene%E2%80%99s+antecedent+will+is+but+a+general%2C+metaphorical+and+improper+will%2C+which+they+call+a+velleity.+Here+you+see+that+Damascene+and+Thomas%E2%80%99s+antecedent+will+is+but+a+velleity%2C+and+this+velleity+is+no+will+simply+or+formally+in+God%3B+and+therefore+I+spoke+not+ignorantly%2C+but+after+the+mind+of+the+best+Schoolmen+that+write+when+I+said+out+of+Durand+that+this+antecedent+will+is+not+simply%2C+properly+and+formally+the+will+of+God%2C+but+knew+well+enough+what+I+said%3A+and+such+as+hold+the+contrary%2C+that+this+antecedent+will+whereby+God+is+said+to+will+the+salvation+of+all+men%2C+is+simply%2C+properly+or+formally+the+will+of+God%2C+are+driven+to+hold+a+paradox%2C+that+God%E2%80%99s+absolute+will%2C+which+is+defined+to+be+the+will+of+his+good+pleasure%2C+may+be+defeated+and+not+accomplished+%28Opus+est+fateri+non+omnem+voluntatem+Beneplaciti+semper+impleri.+Magal.+in+Tim.%2C+p.+252%29%3A+which+is+a+desperate+shift+and+contrary+to+the+doctrine+of+the+best+ancient+divines+in+the+Church+of+Rome+%28Thomas%2C+pt.+1%2C+quest.+19%2C+art.+6%3B+Master+%5Bof+the+Sentences%2C+Lombard%5D%2C+bk.+1%2C+dist.+46%2C+where+Scotus%2C+Ockham%2C+Dionysius+Capreollus%2C+dist.+45%2C+quest.+unic.+art.+2%2C+concl.+5%3B+Cajetan+on+1.+Tim.+2%3A4%3B+Dominic+Banez%2C+pt.+1%2C+quest.+19%2C+art.+6%2C+concl.+2%2C+in+sum.+text.+Perer.%2C+Select+Disputations+on+Jn.+1%2C+no.+73%29%3B+and+directly+against+the+Scripture%2C+which+says%2C+%E2%80%98Our+God+has+done+whatsoever+pleased+Him+in+heaven+and+earth.%E2%80%99+%28Ps.+135%3A6%29+%E2%80%98Who+has+resisted+his+will%3F%E2%80%99+%28Rom.+9%3A19%29+%E2%80%98Who+works+all+things+according+to+the+counsel+of+his+own+will.%E2%80%99+%28Eph.+1%3A11%29%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Defence+of+the+Way+to+the+True+Church%2C+%E2%80%A6+wherein+the+motives+leading+to+papistry%E2%80%A6+are+handled+and+fully+disputed+%28London%3A+Field%2C+1614%29%2C+ch.+25%2C+pp.+212-14+White+%281570%E2%80%931615%29+was+an+English+clergyman%2C+a+royal+chaplain+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd5332d564.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/cd5332d564.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=6.%20Next%20it%20must%20be%20noted,of%20his%20own%20will.%E2%80%99%20%28Eph.%201%3A11&amp;text=6.%20Next%20it%20must%20be%20noted%20how%20peremptorily&amp;text=the%20counsel%20of%20his%20own%20will.%E2%80%99%20%28Eph.%201%3A11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Secondly, there is Voluntas Signi [will of sign], a manifestation of his will, whether it be in his works, which are the fruits of his will, or his Word which is the evidence of his will, directing us to the knowledge what He would have us do. A sense tropical and figurative, yet most proper to inform us: and this is scattered into five divisions or species. First, Permissio, his permission or allowance, or privilege to things, without which they cannot be; Non fit aliquid nisi omnipotens fieri velit, vel sinendo ut fiat, vel faciendo [Nothing comes to be unless the Omnipotent wills it to come to be, either by permitting it to come to pass or by bringing it about]. (Augustine, Enchiridion) Secondly, Impletio, the perfecting or fulfilling of them. Thirdly, Consilium, his revealed decree. Fourthly, Praeceptum, his positive law; his precepts wherein He teaches and commands us to do what is acceptable in his sight. Fifthly and lastly, Prohibitio, the restraint He lays upon us, his command for the eschewing those actions which are contrary to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer delivered in Certain Sermons</cite>, (London: Haviland, 1628), ‘Thy will be done in earth as it is in heaven’, pp. 146-47 King (1592–1669) was the Bishop of Chichester, a poet and a friend of John Donne.</span></figcaption>

<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (d. 1633; 1997), bk. 1, ch. 7, pp. 99-100</span></figcaption>

<blockquote><p>Hence is that, Aquinas, Valentia, Durandus and Suarez† want the will of God divided thus: it is the will improperly and the division is by a homonym in homonyms, so that the will of sign is the will improperly. Thus Durand, on folio 13, ‘A command,’ he says, ‘is not directly and always a sign that the one commanding wants the thing commanded to be, but only that He wants to oblige the subject.’ † Aquinas, in pt. 2, q. 9, art. 11; Valentia, tome 1, disp. 1, q. 19, punc. 2; Durandus, bk. 1, dist. 48, q. 3; Suarez, tome 1, Of the Attributes of God, bk. 3, ch. 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations for Divine Grace, Exercitation 2</cite>, ch. 1, pp. 201-2</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence is that, Aquinas, Valentia, Durandus and Suarez† want the will of God divided thus: it is the will improperly and the division is by a homonym in homonyms, so that the will of sign is the will improperly. Thus Durand, on folio 13, ‘A command,’ he says, ‘is not directly and always a sign that the one commanding wants the thing commanded to be, but only that He wants to oblige the subject.’ † Aquinas, in pt. 2, q. 9, art. 11; Valentia, tome 1, disp. 1, q. 19, punc. 2; Durandus, bk. 1, dist. 48, q. 3; Suarez, tome 1, Of the Attributes of God, bk. 3, ch. 8.”

</figure><figure class="quote" id="q-db599deda4" data-kw="">
<blockquote><p>Question 1: Whether law [jus], and the decree of law, or the command [jussio] of God, is God Himself? Affirmed with a distinction. Answer: Concerning the decree, as it is regarded on the part of God, or actively: affirmed; as it is regarded on the part of the decreed thing, or passively or terminatively: denied. Concerning law [jus], which in Greek [is] δικαίωμα [ordinance / righteous requirement], Rom. 1:32, insofar as it is equivalent to the power of God: affirmed. Not otherwise than as we have established that God’s blessedness, glory, majesty do not really differ from Himself. The word ‘command’ [jussio], insofar as it denotes the same thing which the words ‘mandate,’ ‘precept,’ or ‘order’ [signify], properly signifies the effect of the divine will, but not the will of God itself; consequently the command or thing-commanded of God is not God Himself: in the way that the law of God is not God Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669), pp. 48-136 tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, 3.459</span></figcaption>

</figure><figure class="quote" id="q-e483399691" data-kw="">
<blockquote><p>Objection 2: Mt. 23:37, ‘How often would I have gathered thy children together, and thou wouldst not. How did Christ will, and so will that He complains of those who would not, if He had not through his help made them able [to] will, whom He knew could not will? Answer. Christ is here said to have willed to gather them together, not by the will of his good pleasure, which may never be resisted, but by his signifying or revealed will. For He is said to will to gather all unto Himself, because by the preaching of the Word He calls all in common unto salvation, and prefixes to Himself this end of preaching, that they should commit themselves to his protection and fidelity. By this will therefore He may will to gather the Jews together, though in the meantime He do not help them, that they themselves may be able to will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination, pp. 170-72</span></figcaption>

<blockquote><p>The revealed will of sign, as such, teaches, illuminates, directs and obligates men to the regulation of acts, whether those regulated acts actually exist and happen, or not.</p></blockquote>

</figure><figure class="quote" id="q-963b3cfced" data-kw="">
<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word:

1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice.

2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subjection to Christ in all his Ordinances &amp; Appointments the best means to preserve our Liberty</cite>, ... (d. 1649; London: S.G., 1657), ‘Of Ineffectual Hearing’, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is a twofold Word, or rather a double declaration of the same Word:

1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice.

2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.”

</figure><figure class="quote" id="q-f54f4838e3" data-kw="">
<blockquote><p>In Romans 2:4, it [longsuffering] is associated with the goodness and forbearance of God, and subsumed under his goodness, as that which is despised by the impenitent who treasures up for himself wrath in the day of wrath, who does not know that the goodness of God “leadeth him to repentance” (eis metanoian se agei). The choice of the verb agein is to be noted. Since the impenitent are in view, it cannot refer to efficacious grace. Nevertheless, it is a strong verb as its use in Romans 8:14 shows: “As many as are led by the Spirit of God, these are the sons of God” (cf. Gal. 5:18). It must be understood as a constraining influence flowing from the goodness of God which is calculated to bring men to repentance. The construction in Romans 2:4 is remarkably similar to that in II Peter 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’, On 2 Pet., 3:9</span></figcaption>

<blockquote><p>Effective permission or willing permission; especially, the providential concursus (q.v.) underlying evil acts of human beings; a concept typical of Reformed theology, which will not allow a bare or ineffectual permission on the part of God and which will acknowledge no realm of activity outside of the will of God. God therefore is viewed as positively willing to permit the free agency of human beings and as supporting their acts with his providential concursus even when those acts go against his revealed will.</p></blockquote>

</figure><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | voluntas Dei, ‘the will of God’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.”

s" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6f9facaff9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=The%20Reformed%20%5Bof%20the%201500%E2%80%99s%20and,acts%20go%20against%20his%20revealed%20will&amp;text=The%20Reformed%20%5Bof%20the%201500%E2%80%99s%20and%201600%E2%80%99s%5D%2C%20by&amp;text=events%20and%20acts%20go%20against%20his%20revealed%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The term voluntas signi, literally, the will of the sign [the revealed will], is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’—thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded. This signified or perceptive will moreover, does not contradict the will of the divine good pleasure, although the relationship between the two may sometimes be difficult to establish immediately. The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker, 2003), vol. 3 | ch. 5.4, Will and Freedom, E. The Ad Intra–Ad Extra Distinctions, 1. Voluntas beneplaciti and voluntas signi, p. 458</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

iv>

<blockquote><p>[Edward Leigh:] ‘God is patient, Psalm 103:8; Job. 21:7. God’s patience is that whereby He bears the reproach of sinners and defers their punishments; or it is the most bountiful will of God, whereby He doth long bear with sin which He hates, sparing sinners, not minding their destruction, but that He might bring them to repentance. See Acts 13:18.’¹ … It is, thus, ‘the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but He does warn them beforehand, lightly correct and seek to turn them unto Him.’² ¹ Leigh, Body of Divinity, II.xiii (p. 299), citing marginally Nahum 1:3 and Isa. 30:18; cf. Cocceius, Summa theol., III.x.67. ² Leigh, Treatise, II.xiii (p. 106).</p></blockquote>

6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-840df9d4d5" data-kw="">
<blockquote><p>It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God’s Serious &amp; Unfeigned Ardency of Desire that we do what is our Duty’ from Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London 1647), pp. 443-45 (irregular pagination: colophon lll2-lll3) &amp;, pp. 440-42 (colophon: Kkk4-Lll1)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-c12cd13863" data-kw="">
<blockquote><p>Query 3. Whether the will of God touching conversion be always accomplished therein?… God may be said to will the conversion of men two ways; either by such a will as is effective, and determinative of the event, or by such as is only virtual, and ordinative of the means tending thereunto: both parts of this distinction are bottomed upon scripture… …[W]herefore, in respect of that ordination, God may be truly said, by a kind of virtual and ordinative will, to will the turning and salvation of all men… 1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26). They have the gospel preached unto them: there we have God spreading out his hands all the day, standing and knocking at the door of the heart, crying out with redoubled calls, “Turn ye, turn ye, why will ye die?” Wooing and beseeching men, be ye reconciled unto me; making his salvation bringing grace appear unto all men, even to the non-elect themselves… what is the meaning of all this, if God no way will their conversion?… Neither will it salve the business, to say, there is a voluntas signi in all this; for what is voluntas signi, if it be not signum voluntatis? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart?… the true end of his call is their conversion, and that that end is not attained, the only reason lies within themselves, in their own corrupt, unbelieving hearts. Moreover, it is worthy of our consideration, that those scriptures (which the Remonstrants urge, to prove that all the operations of grace, even those in the very elect who actually turn unto God, are resistible) do signally set forth this ordinative will of God… wherefore, this will is God’s ordinative will, imported in the ministry of Christ and the prophets, the proper end and tendency whereof was to gather them into the bosom of his grace… Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction; it is the place where God records his name… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Matt. iii. 11). Gospel-preaching is not a mere sound or voice of words, but it importeth God’s ordinative counsel to turn men unto himself… Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls… but it proves that the proper end and tendency of the means afforded to the Jewish church, was that they might bring forth good fruits to God; and in respect of that ordination, God is said to expect those good fruits from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill</cite>, (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 131-32, 164 &amp; 208-10 | ‘Edward Polhill (1622-1694) on Matthew 23:37’</span></figcaption>

s ordinative will of God… wherefore, this will is God’s ordinative will, imported in the ministry of Christ and the prophets, the proper end and tendency whereof was to gather them into the bosom of his grace… Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction; it is the place where God records his name… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Matt. iii. 11). Gospel-preaching is not a mere sound or voice of words, but it importeth God’s ordinative counsel to turn men unto himself… Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls… but it proves that the proper end and tendency of the means afforded to the Jewish church, was that they might bring forth good fruits to God; and in respect of that ordination, God is said to expect those good fruits from them.”

— Edward Polhill, “The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill, (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 131-32, 164 &amp; 208-10 | ‘Edward Polhill (1622-1694) on Matthew 23:37’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuery+3.+Whether+the+will+of+God+touching+conversion+be+always+accomplished+therein%3F%E2%80%A6+God+may+be+said+to+will+the+conversion+of+men+two+ways%3B+either+by+such+a+will+as+is+effective%2C+and+determinative+of+the+event%2C+or+by+such+as+is+only+virtual%2C+and+ordinative+of+the+means+tending+thereunto%3A+both+parts+of+this+distinction+are+bottomed+upon+scripture%E2%80%A6+%E2%80%A6%5BW%5Dherefore%2C+in+respect+of+that+ordination%2C+God+may+be+truly+said%2C+by+a+kind+of+virtual+and+ordinative+will%2C+to+will+the+turning+and+salvation+of+all+men%E2%80%A6+1.+God+by+a+virtual+or+ordinative+will+does+will+the+turning+and+salvation+of+all+men+within+the+bosom+of+the+church%3B+for+they+have+Jesus+Christ+set+before+their+eyes%2C+and+what+was+the+true+end+of+Christ%E2%80%99s+coming%2C+but+to+turn+every+one+from+his+iniquities%2C+%28Acts+3%3A26%29.+They+have+the+gospel+preached+unto+them%3A+there+we+have+God+spreading+out+his+hands+all+the+day%2C+standing+and+knocking+at+the+door+of+the+heart%2C+crying+out+with+redoubled+calls%2C+%E2%80%9CTurn+ye%2C+turn+ye%2C+why+will+ye+die%3F%E2%80%9D+Wooing+and+beseeching+men%2C+be+ye+reconciled+unto+me%3B+making+his+salvation+bringing+grace+appear+unto+all+men%2C+even+to+the+non-elect+themselves%E2%80%A6+what+is+the+meaning+of+all+this%2C+if+God+no+way+will+their+conversion%3F%E2%80%A6+Neither+will+it+salve+the+business%2C+to+say%2C+there+is+a+voluntas+signi+in+all+this%3B+for+what+is+voluntas+signi%2C+if+it+be+not+signum+voluntatis%3F+If+it+be+only+an+outward+sign+or+appearance%2C+and+there+be+no+counterpane+or+prototype+thereof%2C+within+the+divine+will%2C+how+is+it+a+true+sign%3F+which+way+could+it+be+breathed+out+from+God%E2%80%99s+heart%3F%E2%80%A6+the+true+end+of+his+call+is+their+conversion%2C+and+that+that+end+is+not+attained%2C+the+only+reason+lies+within+themselves%2C+in+their+own+corrupt%2C+unbelieving+hearts.+Moreover%2C+it+is+worthy+of+our+consideration%2C+that+those+scriptures+%28which+the+Remonstrants+urge%2C+to+prove+that+all+the+operations+of+grace%2C+even+those+in+the+very+elect+who+actually+turn+unto+God%2C+are+resistible%29+do+signally+set+forth+this+ordinative+will+of+God%E2%80%A6+wherefore%2C+this+will+is+God%E2%80%99s+ordinative+will%2C+imported+in+the+ministry+of+Christ+and+the+prophets%2C+the+proper+end+and+tendency+whereof+was+to+gather+them+into+the+bosom+of+his+grace%E2%80%A6+Every+ordinance+is+an+ordinance+from+the+will+of+God%3B+it+is+an+appointment+dropped+down+from+heaven%3B+it+is+divinely+destinated+eis+oikodomen%2C+for+edification+and+not+for+destruction%3B+it+is+the+place+where+God+records+his+name%E2%80%A6+John%E2%80%99s+baptism+was+not+a+mere+external+sign+or+shadow%2C+but+imported+God%E2%80%99s+ordinative+counsel+to+bring+men+to+repentance%3B+it+was+eis+matanoian%2C+to+repentance%2C+as+its+proper+end%2C+%28Matt.+iii.+11%29.+Gospel-preaching+is+not+a+mere+sound+or+voice+of+words%2C+but+it+importeth+God%E2%80%99s+ordinative+counsel+to+turn+men+unto+himself%E2%80%A6+Every+ordinance+speaks+an+ordinative+counsel+for+some+spiritual+end%2C+a+serious+ordination+for+the+good+of+souls%E2%80%A6+but+it+proves+that+the+proper+end+and+tendency+of+the+means+afforded+to+the+Jewish+church%2C+was+that+they+might+bring+forth+good+fruits+to+God%3B+and+in+respect+of+that+ordination%2C+God+is+said+to+expect+those+good+fruits+from+them.%E2%80%9D%0A%0A%E2%80%94+Edward+Polhill%2C+%E2%80%9CThe+Divine+Will+Considered+in+its+Eternal+Decrees%E2%80%9D+in+The+Works+of+Edward+Polhill%2C+%28Morgan%2C+PA.%3A+Soli+Deo+Gloria+Publications%2C+1998%29%2C+pp.+131-32%2C+164+%26+208-10+%7C+%E2%80%98Edward+Polhill+%281622-1694%29+on+Matthew+23%3A37%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc12cd13863.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c12cd13863.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-signified-will-or-will-of-sign/#:~:text=Query%203.%20Whether%20the%20will%20of,expect%20those%20good%20fruits%20from%20them&amp;text=Query%203.%20Whether%20the%20will%20of%20God%20touching&amp;text=said%20to%20expect%20those%20good%20fruits%20from%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The third question. Whether the will of God be simply one, or divers; and if divers, which they be. … Secondly it is diverse in respect of diverse sorts of manners by which he seems to will those things which he will. For he wills good after one sort even for himself, evil after another, and for another respect then for itself, to wit, for the good may come of it: that is called his good will; for this his permissive will, or voluntary permission. Again he wills some things simply, as to create the world, save the elect, send his Son, &amp;c., others he wills conditionally, as if all men will be saved they must keep the commandments; or believe in Christ: and so some do interpret that place, “God would have all men to be saved.” His absolute will, say some, is ever done, his conditional will is not, but when the condition is performed: and therefore both these wills have divers names amongst divines. The first is called voluntas beneplaciti, the will of his good pleasure, because it simply so pleases God that this or that shall be done, which is properly his will: the other is called voluntas signi, the will of sign: because that precepts and promises with condition observing them, are signs that God will do so, though always and in all things he simply will not that which he commands, or promises: as we may see both in Abraham and Pharaoh. He commanded Abraham to kill his son, and it was a sign he would have had him done so, because he commanded: yet God would not that he should do it, for he forbad him, and he did it not: and this was the will of his good pleasure. He commanded Pharaoh to let Israel go: but he would not have him do so, for he hardened his heart lest he should let them depart: yet his commandment was a sign of his will, but such as one as Ludovieus Vives says, is improperly called his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Live Everlasting</cite>, ([Cambridge:] Legat, 1601), pp. 250-53 This work is largely a translation and abridgement of Zanchi’s De natura Dei.</span></figcaption>

<blockquote><p>53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.

54. There are five signs included in that old verse: He instructs, forbids, permits, counsels, and fuliflls. Because counseling coincides with instruction, it would have been better to have substituted: He promises.</p></blockquote>

<blockquote><p>XIX. Although God may be said to will the salvation of all by the will of sign [the revealed will] and to nill it by the beneplacit will [of decree], yet there is no contradiction here. Besides the fact that the universal proposition is to be understood not so much of the singulars of the genera as of the genera of the singulars, the former will relates to the mere approbation of God and the command of duty, while the latter is concerned with its futurition and fulfillment. The former denotes what is pleasing to God and what He has determined to enjoin upon man for the obtainment of salvation, but the latter what God Himself has decreed to do. But these two are not at variance: to will (i.e., to command man to believe) and to nill (i.e., to decree not to give him faith in order that he may believe)… XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XIX. Although God may be said to will the salvation of all by the will of sign [the revealed will] and to nill it by the beneplacit will [of decree], yet there is no contradiction here. Besides the fact that the universal proposition is to be understood not so much of the singulars of the genera as of the genera of the singulars, the former will relates to the mere approbation of God and the command of duty, while the latter is concerned with its futurition and fulfillment. The former denotes what is pleasing to God and what He has determined to enjoin upon man for the obtainment of salvation, but the latter what God Himself has decreed to do. But these two are not at variance: to will (i.e., to command man to believe) and to nill (i.e., to decree not to give him faith in order that he may believe)… XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).”

line.com/on-gods-signified-will-or-will-of-sign/#:~:text=XIX.%20Although%20God%20may%20be%20said,creature%20as%20to%20grant%20it%20salvation&amp;text=XIX.%20Although%20God%20may%20be%20said%20to%20will&amp;text=of%20the%20creature%20as%20to%20grant%20it%20salvation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-06dacfd041" data-kw="">
<blockquote><p>And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3):

1. Declarans [declaring]

2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 15-16 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

<blockquote><p>2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion, the faith of Judas the traitor, which nevertheless He by no means willed or decreed by the will of good pleasure since such things never happen in the nature of things… the object of the will of sign or approving of God, is that which is morally good and honest, but of the disapproving, what is unjust and evil: whether it happen in the nature of things, or not… Thus God willed and commanded the repentance of Cain, but it by no means follows therefore Cain repents, because the event of the thing or non-event of the thing is badly, and by no art of logic concluded from the will of sign or approving… the commandment of God does not signify to us the will of God about such an event; but only the will of God about such moral equity of the thing. … as far as pertains to the essence of the will of sign, God equally approves with moral complacency the final obedience of Judas the traitor, as the obedience of Peter the apostle:</p></blockquote>

</figure><figure class="quote" id="q-354cd715bd" data-kw="">
<blockquote><p>…He says by this will to Judas the traitor, ‘I command and will your final obedience,’ that is, I approve, and hold it morally pleasing and acceptable, whether that obedience actually exists, or not, as the law of an earthly prince is not made to this end, that men should simply cultivate society, but on the hypothesis of society being cultivated, that they should order their life civilly and according to the rule and norm of good laws; so the formal use of the Word of God revealing to us the will of sign is to illuminate, lead, direct what may be the pleasing good acceptable will of God, and how our acts, on the hypothesis that they are elicited and exist, can be instituted according to the Word of God, so that they may be pleasing and acceptable to God, and worthy of reward in Christ.</p></blockquote>

</figure><figure class="quote" id="q-e86649f96e" data-kw="">
<blockquote><p>Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.</p></blockquote>

<blockquote><p>(2)… Although God wills some things voluntas signi [will of sign, or the revealed will], like the repentance of the reprobate, the faith of Judas, the non-slaying of Christ, which He nevertheless anything but decreed by voluntas beneplaciti [will of good-pleasure, or decree] as things that would never happen; and He wills some things voluntas beneplaciti, which He can anything but will voluntate signi, like the selling of Joseph or the slaying of Christ. (3) But these wills are not contrary, because they are not concerned with the same things, nor is their connection and reference the same. The object of the beneplacitum [good-pleasure of decree] is an existent eventuating [causing to become an event] in the nature of things, which is to have or not to have an actual existence, be it a good or a bad existent [existence], consonant or not with the voluntas signi. But the object of the voluntas signi is approval of the morally good and honorable or disapproval of the unjust and wicked.</p></blockquote>

0voluntas%20signi%20%5Bwill&amp;text=honorable%20or%20disapproval%20of%20the%20unjust%20and%20wicked" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 5, ‘The Attributes of God’, section 25 in Reformed Dogmatics, ed. Bizer (1950; Wipf &amp; Stock, 2007), pp. 85-88, p. 88</span></figcaption>

</figure><figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>

</figure><figure class="quote" id="q-b14151e551" data-kw="">
<blockquote><p>Question: Seeing God purposed to destroy them, and did it not, is not his will alterable and inefficacious? Answer: The counsels, purposes, decrees of God are unalterable and do take place, Ps. 33:11; Isa. 14:27; 43:13; 46:10; Mal. 3:6; Heb. 6:17. For that said and done here, it’s more humano [by a human custom]: God saw cause-sufficient to move Him to their destruction, but seeing what evil was like to come about, He would not destroy them; had the Lord decreed it before the world, it must have taken place, no change or alteration could have been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the 20th-29th chapters of the prophet Ezekiel</cite>, ... (London: Chapman, 1658), on ch. 20, v. 8, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-2f386bf031" data-kw="">
<blockquote><p>Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions:

1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’.

2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary.

3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-pitcarne.html">Alexander Pitcarne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Sacrifice</cite>, (Edinburgh: Brown, 1664), pt. 1, pp. 146-47 Pitcarne (1622?–1695) was a partially conforming Scottish minister and academic.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-008128ea1b" data-kw="">
<blockquote><p>Do they [Jesuits] not overthrow the omnipotency of God by attributing to Him inefficacious wills? How is it that all are not saved, if He willed all to be saved? Does He not in heaven and earth whatever pleases Him, Ps. 135:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-menzies.html">John Menzies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of England Vindicated against her Chief Adversaries of the Church of Rome</cite>, ... (London: Wilkinson, 1680), ch. 4, p. 190 Menzies (1624–1684) was a Scottish presbyterian minister, Protester, a partial-conformist after the Restoration and a theological professor during that time.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Do they [Jesuits] not overthrow the omnipotency of God by attributing to Him inefficacious wills? How is it that all are not saved, if He willed all to be saved? Does He not in heaven and earth whatever pleases Him, Ps. 135:3.”

<blockquote><p>§12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

</figure><figure class="quote" id="q-e054536f86" data-kw="">
<blockquote><p>But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Nature of God... (Heidelberg: Wiener Neustadt, 1577), bk. 3 tr. AI by The Faith Received | ch. 3, quest. 3, ‘Whether in the knowledge of truth (which indeed is revealed in the sacred scriptures) our salvation is placed or not placed?’</span></figcaption>

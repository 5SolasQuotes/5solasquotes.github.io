<blockquote><p>Sundry of the better sort among us are prone to think that testimonies are of no value without that they be carried to great heights. Hence I pointed them to a notable instance we have have upon record concerning Joseph of Arimathea, to whom the Spirit of God has given a great character, Lk. 23:50-51. He was a good man and just, he consented not to the horrid deed of the murderers of our Lord. Some of note in our day would have said, That was not enough, he ought to have made a more resolute appearance; but we read not that the Lord said so. In several cases the current may be so very strong, that there’s access for no more than through grace to guard against the being carried down with it; ‘Thou shalt not follow a multitude to do evil,” Ex. 23:2.</p></blockquote>

</figure><figure class="quote" id="q-be7807c081" data-kw="">
<blockquote><p>It is very much abused, if it be offered to any such thing as that we must come out from among the ministers, and be separated from them, for: 1. This separation here commanded is from infidels, unrighteousness, darkness, Belial, idols. The Corinthians did very ill in eating and sitting at the idols’ tables of the gentiles, which gave great offense to the weak, 1 Cor. 10:17, 20. 2. This was not a separation from the Church of Corinth, nor from the ministers thereof; though there were many corruptions entertained among them, yet they were to have communion in public ordinances, as is proved above: Only it is a separation from the idolatry in it. There may be a separation from the corruptions of a Church, very well consistent with abiding in the communion of that Church.</p></blockquote>

</figure><figure class="quote" id="q-3d1ed319fc" data-kw="">
<blockquote><p>It is one thing to withdraw from civil conversing with particular wicked men, and another thing to separate from God’s Church for its defects. There is therefore this observable in separating and withdrawing, that we are to keep less fellowship in civil things with a brother that is a Church-member and is gross, than with one that is without and not a member; as the apostle writes, 2[?***] Cor. 5:10. But we may and should on the other side keep Church fellowship with a true Church, though in many things faulty and corrupt, whereas we may not at all with an idolatrous company in their worship. Hence in that same epistle to the Corinthians, going to and eating in idols’ temples or at their feasts was so much condemned; yet communicating with the Church of Corinth or living as a member of it (though corrupt both in doctrine and practice) was never found fault with as to worship: For it is clear that that of not eating with an offending brother looks only to civil fellowship, because it is such a fellowship that is condemned with them, as is allowed to heathens, which certainly is such. If our churches therefore be Christ’s churches, as sometimes the favorers of separation grant, there can be no separation from them without turning to a schism.</p></blockquote>

</figure><figure class="quote" id="q-8b60e1e0ff" data-kw="">
<blockquote><p>That Scripture, Rom. 16:17, does not command us to avoid everyone that causes divisions and offenses occasionally and passively, by giving the first rise to divisions by offensive courses; for that way divisions may be caused by infirmities and a man’s using his own light, and by the offense of others, whom upon that account to avoid, were contrary to the same apostle’s doctrine in that same epistle, chs. 14 and 15. But it commands us to avoid them which cause divisions and offenses actively, designedly and purposely, and do promote and abet a downright schism, and will not be persuaded to let divisions fall, though it may be done without prejudice to truth. Next, to “avoid,” there is the same with the duty of turning away, 2 Tim. 3:5, extended there to self-lovers, covetous proud, unholy, having a form of godliness without the power. This cannot be interpreted always and only of withdrawing from Church-communion; for then we must withdraw from all that are self-lovers, from all that are unholy, from all that are hypocrites, which none will affirm: But we may avoid men several other ways, by withdrawing from personal communion with them, or familiar converse, and from communion in their corrupt designs and courses.</p></blockquote>

<blockquote><p>But yet let me freely tell you, that there is one step in Mr. Erskine’s conduct that I am not able to justify; it is, When the synod of Perth and Stirling resolved to give him a modest rebuke, he did not silently receive it. I should never have advised my worthy brother Mr. Erskine to have made any confession of a fault even in his expressions, when his conscience justified him in the same; but I cannot think that his silence at the time that either the synod or General Assembly rebuked him, when they resolved thereby to finish the process, would be construed an acknowledgment of a fault: I am sure that the history of our blessed Lord’s sufferings bears expressly, that, when He was accused of many things before Pilate, He answered nothing; and when he was urged by the self-condemned heathen judge, He still continued silent; and I am persuaded that no good Christian can allege that his silence did import any confession of a fault, yea, it was a fulfilling of the Scripture, Isa. 53:7.</p></blockquote>

</figure><figure class="quote" id="q-ecb794e643" data-kw="">
<blockquote><p>While that act stands unrepealed, or not annulled, it remains an act and rule of this Church still, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature.’ Now, as to the Brethren: [1] I cannot see any ground to say the sentenced anent them are not materially rescinded, seeing as the Assembly 1733 and their commission did cast them out from this Church, so the Assembly 1734 gave the synod of Perth power and full authority to restore and unite them again to the communion thereof, and to their ministerial charges, which accordingly was done by that synod: And this, in my opinion, was a material condemning of the sentences of the former Assembly and commission that had been pronounced against them. (2) But, whereas ’tis said the act of Assembly 1733 against them, while unrepealed, ‘It still remains an act and rule of this Church, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature,’ and therefore they cannot accede to the judicatories till that act is rescinded, lest they homologate that sinful deed or sentence. Now if this argument prove anything, it proves too much; for it says we are never to join with a Church which has made any unjust or sinful act till repealed: And so the Brethren could never be justified for joining formerly with the Church of Scotland when such unaccountable acts as that of the Assembly 1638, sessions 23-24, was unrepealed: which discharges all persons of whatever quality, ministers or others, to speak or write against that Assembly, or any act of that Assembly, under pain of the censures of the Church: A very bad precedent! And so the Assembly 1642, session 7, enjoins that every presbytery proceed against non-communicants, whether Papists or others, according to the act of parliament, which looks too like the English Sacramental Test: And also the above-cited act of Assembly 1648, anent deposing all suspended ministers who do not submit to the sentences of Church judicatories, and so of other bad acts of Assembly from 1638 to 1649 inclusive. And, if an act in a particular case is a rule in a way of precedent in similar cases, or cases of the like nature, then the instance of overturning the settlement made by the Commission at Auchtermuchty, and the repeated instances of our late General Assemblies in allowing the people of Stow, Troqueir, Dennie, etc. the privilege of sealing ordinances, are good precedents to plead in like cases where ministers are intruded upon Christian congregations. 4thly, They say: “Seeing an accession to a Church cannot be made but in the situation in which that Church is when the accession is made unto her; therefore any accession to her in that situation so far approves of her, as to submit it to her authority what is to be counted defections, and what not; and, if that Church maintain not that testimony which they that accede to her maintain, then they fall from their testimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-36242d952b" data-kw="">
<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>

</figure><figure class="quote" id="q-678f093652" data-kw="">
<blockquote><p>To treat with us upon that posture, or upon such terms, is a treatment neither scriptural, reasonable, just nor fair; nor is it the habile way to get grievances redressed. If this be the condition of union, it can never take place in our day, nor in any other period for what I know; at this rate ye proclaim a perpetual war. Nor is there any condescension here; for we might return to the Church of Rome, would they redress just grievances, and return to their happy state wherein they were when the apostle Paul wrote his epistle to the Romans. But, to make Church communion necessarily depend on such a redress in every part, is both destitute of a necessary warrant from the Word, and requires a standing-out until the Churches of Christ be brought to such a state as we are never like to see, nor for what I know is contained within the verge of the Lord’s gracious promises unto his Church.</p></blockquote>

<blockquote><p>This is no separation from the Church of Scotland, either in her doctrine, worship, discipline or government, but only a departing, or going forth from her sins, backslidings and defections, as we are commanded by the Lord; and for a time only from some congregations, because of these. This is not a positive or active separation form the Church, casting at it as no Church, or defaming the ministry thereof, or gathering new distinct Churches; only a negative and passive separation, refusing to follow the declining part of the Church holding on in their new course, and choosing rather to stand still and cleave to that part, though smaller, endeavoring to retain and maintain the covenanted work of reformation against Popery, prelacy, Erastianism and sectarianism, schism and defection.</p></blockquote>

<blockquote><p>First, that the iniquity of the Queen Regent and disorder ought in nowise to withdraw neither our hearts, neither yet the hearts of other subjects, from the obedience due unto our sovereign. Secondly, that if we deposed the said Queen Regent rather of malic and private envy, than for the preservation of the commonwealth, and for that her sins appeared uncurable, that we should not escape God’s just judgment, howsoever that she had deserved rejection from honors. And thirdly,” he required, “that no such sentence should be pronounced against her, but that upon known and open repentance, and upon her conversion to the commonwealth, and submission to the nobility, place shall be granted unto her of regress to the same honors from the which, for just causes, she justly might be deprived.</p></blockquote>

</figure><figure class="quote" id="q-cd9c648b65" data-kw="">
<blockquote><p>So that it would not be a sufficient reason for forsaking the communion of a Church, only to allege a general depravation of manners, even when it should be true, that it did reign therein: But it is no less certain, that when it falls out, that one party of the Church… should confirm itself in errors, and in practices contrary to the service of God, and the salvation of men; and that not only it rejects the instructions given it upon that occasion, but would even force all others to be of the same sentiments, and to practice the same worship, the separation of the other party is just, necessary and indispensable: It is just, for everywhere where there can be nothing else but an unjust communion, there is justice in a separation from it: But there can be nothing else, but unjust communion with a party, which essentially destroys the true worship of God, which shuts up itself in errors, directly contrary to men’s salvation, and which, through an intolerable tyrrany, would constrain all those who live in it, to make a profession of the same errors, it is then just for a man to separate himself from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

0separate%20himself%20from%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6894577b59" data-kw="">
<blockquote><p>…we know no external lawful calling that kings have now, or their family, to the crown, but only the call of the people. All other calls to us are now invisible and unknown; and God would not command us to obey kings and leave us in the dark that we shall not know who is the king.” Lex Rex, p. 33 (rt col, bot). ² Cameron, Dictionary, p. 745. Rutherford: “Any tyrant stands in titulo [in the title], so long as the people and the estates who make him king have not recalled their grant; so as neither David, nor any single man, though six hundred with him [1 Sam. 23:13; 30:9], may un-king him or detract obedience from him as king…” Lex Rex, p. 59 (lt col, top)… As Rutherford argued during the Westminster era in Lex Rex (1644), that magnum opus of puritan political thought, the power of governing is retained in root in the commonality of the people³ and conferred on governors by the community’s consent. Hence by natural law the community’s consent is more fundamental than changeable positive laws and constitutions. ³ Lex Rex, pp. 1–2, 6, 29, 34, 123–24. … As the puritan political tradition was summed up and delineated by Rutherford, while a material tyrant with grounds for deposition may continue for a long time, he formally remains the valid, civil, God-recognized ruler, continuing to bear God’s authority in all lawful things, until the consent of the community (which had been given to him, legitimizing him as their ruler) is removed from him, normally by the publicly recognized and accepted civil procedure (that is, by the official bodies and in due order).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Civil Authority, Dethronement &amp; Cameronianism” in “Editor’s Extended Introduction”, 3. “Principled Partial Conformity in Government: The Church of Scotland under Erastianism &amp; Episcopacy (1660–1688)” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 95-103 | “Not till 1679 (with increasing sanctions on the non-conformists) did a minority of these covenanters split away from the rest, coming to believe Charles II had lost his valid civil authority due to his despotism… The Cameronians, contrary to the principles and ethos of the Scottish Reformation and the Westminster era covenanters,¹ and nearly all reformed theology before them, in a public declaration in 1680 at Sanquhar with around twenty men,² “disowned” Charles II as king… | … Rutherford:</cite>, pp. 96-100</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-273c4b3c37" data-kw="">
<blockquote><p>A meeting was held at which it was agreed that the ministers who had accepted the Indulgence should be invited to preach alongside their non-complying brethren, while the latter would be given access to their pulpits… Up till now [the latter part of 1677], Welwood had been virtually a lone [public] voice [against the Indulgence], but there were already signs that others were ready to follow in his footsteps. To forestall this, it was agreed that those presenting themselves for license should in future be required to give a promise not to preach on any matters which might create division–by which, of course, the Indulgence was primarily intended. All the non-complying ministers were strictly enjoined to enforce these requirements when licensing young men to preach. These instructions were in force by the beginning of 1678…</p></blockquote>

<blockquote><p>The disaffected among the people, particularly the young, were increasingly drawn to his [Cameron’s] side. ‘Everywhere now’, noted Hamilton with satisfaction, ‘it is the young ones that are carrying on the work.’ To the older ministers, however, these events were a cause for dismay… Warnings were issued about his teaching, and counter-meetings were held in places where he was to preach.</p></blockquote>

<blockquote><p>Unhappily, however, a spirit of disunion began to appear among their leaders, who, instead of combining against the common enemy, spent their time in hot disputes about points in which the most hearty and genuine friends of the Presbyterian cause [outside the establishment] differed from each other. These disputes referred to the indulgence; and it may appear strange that there should have been any controversy about a subject with regard to the sinfulness of which all of them were agreed. The question agitated was not whether the indulgence was lawful, but whether the acceptance of it should be expressly condemned in the proclamation to be made by those who were in arms, and numbered among their causes of fasting. This was opposed by some as inexpedient, because it would hinder many from joining them who were cordial friends to Presbytery; and it was proposed that this point should be reserved for the determination of a free General Assembly.¹ At the head of this party was Mr. John Welsh, whose expulsion from Irongray was formerly noticed, and who was not only in his own judgment opposed to the indulgence, but had been intercommuned for preaching in the fields for many years. Among all the eighteen ministers present, there was not one who had accepted the indulgence, or who approved of it. ¹ M’Crie’s Miscellaneous Writings, Review of Tales, &amp;c, p. 437. Sixteen of these ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron,² and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ² Richard Cameron was not present at Bothwell, being at that time in Holland, but he returned to Scotland shortly after. He declared to the ministers who licensed him, “that he would be a bone of contention among them; for if ever he preached against a national sin in Scotland, it should be against the indulgence, and for separation from the indulged.” [P. Walker’s Biograph. Presbyter, i. 292) ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians. On the present occasion they insisted that there should be inserted in the statement of their quarrel a decided condemnation of those who had taken the benefit of the indulgence; and proceeding on a mistaken view of the principles advocated by the Church of Scotland in the time of the Engagement, and by the Protesters in their contendings against the public resolutions [in the late-1640’s and early-1650’s], they refused to admit any into their ranks but those who would condemn and testify against the indulgence.† † M’Crie’s Memoirs of Veitch, &amp;c., p. 453… The violence, pertinacity, and extravagance of this party, prevailed over the more sober counsels of their brethren; and the consequence was, that several of the latter left the army in disgust. Still, however, the great body of the people remained, and though placed in the most unfavourable circumstances for meeting the enemy, they drew up with determined front at Bothwell Bridge, where they awaited their approach. The Covenanters behaved with the utmost gallantry, but, overpowered by superior numbers, they soon gave way, and the royal army obtained an easy victory over troops divided and disheartened by the conduct of their leaders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, pp. 328-331</span></figcaption>

nowledgments+implied+in+that+insidious+measure%2C+they+were+disposed+to+make+allowances+for+such+of+their+brethren+as+had+yielded+under+strong+temptation+or+plausible+arguments%3B+and+they+argued%2C+that+whatever+ecclesiastical+censure+their+conduct+might+afterwards+be+found+to+deserve%2C+to+deny+them+in+the+meantime+the+opportunity+of+vindicating+their+rights+and+liberties%2C+civil+and+religious%2C+by+excluding+them+from+the+army%2C+would+be+no+less+presumptuous+and+unjust+in+principle%2C+than+it+was+preposterous+in+the+present+circumstances+of+the+country.+This+liberal+view+of+the+subject+was+opposed+by+only+two+of+the+ministers%2C+namely%2C+Mr.+%5BDonald%5D+Cargill+and+Mr.+%5BThomas%5D+Douglas%3B+but+these+were+supported+by+a+considerable+number+of+the+lay+leaders+of+the+army%2C+at+the+head+of+whom+was+Sir+Robert+Hamilton.+Hamilton+appears+to+have+been+a+pious+man%2C+and+of+good+intentions%3B+but+of+narrow+views%2C+severe+in+his+temper%2C+and+altogether+unqualified+by+want+of+military+talents+and+experience%2C+for+the+command+which+he+assumed.+He+is+charged%2C+and+apparently+not+without+reason%2C+with+having+been+active+in+pushing+Cargill%2C+Cameron%2C%C2%B2+and+some+other+ministers%2C+to+those+extremes+which+produced+a+breach+between+them+and+their+brethren%2C+with+whom+they+had+until+of+late+acted+in+concert.%C2%B3+%C2%B2+Richard+Cameron+was+not+present+at+Bothwell%2C+being+at+that+time+in+Holland%2C+but+he+returned+to+Scotland+shortly+after.+He+declared+to+the+ministers+who+licensed+him%2C+%E2%80%9Cthat+he+would+be+a+bone+of+contention+among+them%3B+for+if+ever+he+preached+against+a+national+sin+in+Scotland%2C+it+should+be+against+the+indulgence%2C+and+for+separation+from+the+indulged.%E2%80%9D+%5BP.+Walker%E2%80%99s+Biograph.+Presbyter%2C+i.+292%29+%C2%B3+M%E2%80%99Crie%E2%80%99s+Mem.+of+Veitch%2C+%26c.%2C+Notices+of+James+Ure%2C+p.+452.+I+am+sorry+I+cannot+retract+the+judgment+here+pronounced+on+the+character+of+Hamilton%2C+the+correctness+of+which+has+been+ <blockquote><p>Some of these excellent men [at Bothwell] now went the length of disowning the authority of the king and government altogether. They contended that, by overturning the true religion, by setting up Prelacy and Erastianism, by ruining the covenanted work of reformation, and by persecuting to the death its faithful adherents, Charles had perfidiously violated the conditions of his coronation oath, and forfeited all right to their allegiance. Another party, however, much more numerous though less conspicuous, because less violent and extreme, defended their appearance in arms on other grounds. While they condemned the proceedings of the government as arbitrary and tyrannical, they were not prepared to renounce their allegiance to it in civil matters; they held with the compilers of our [Westminster] Confession [ch. 23], that ‘infidelity or difference in religion doth not make void the magistrate’s just and legal authority, nor free the people from their due obedience to him;’ and though they lamented as much as their brethren the general defection of all classes from the engagements of the [Solemn League and] covenant [1643], they could not see how this denuded the sovereign of his authority, which they were ready to acknowledge so long as he was, by the common consent of the nation, recognized as its ruler. At the same time, they considered themselves warranted to assume the attitude of self-defence against the intolerable oppressions and illegal encroachments which had, ‘contrary to all law and humanity,’ been practiced on them; and the reasons on which they justified their appearing in arms were chiefly these — that all other modes of redress had been closed against them; and that they found it necessary for the defence of the Protestant religion and Presbyterian government, and for the preservation of his majesty’s person and throne from the projects of Popish adversaries. A declaration embodying these views was prepared and presented at the council of war, before the battle of Bothwell Bridge; but through the opposition of the more violent leaders it was unhappily rejected.‡ There is reason to believe that this paper contained the sentiments of the most judicious, as well as of the great majority of the suffering Presbyterians; and that, had it been adopted, it might have recommended their cause more to the country at large, procured greater accessions to their numbers, and perhaps have insured success at an earlier period of the contest. ‡ This declaration is given in Wodrow’s History, iii. 96. In venturing these remarks we are far, very far, from allowing that those of the Covenanters who openly cast off allegiance to Charles suffered justly.</p></blockquote>

<blockquote><p>Mr. Robert Hamilton [1650–1701] was a gentleman of good family, being brother to Sir William Hamilton of Preston, to whose title and estates he would have succeeded, on his death, at the [Glorious] Revolution [1689], if he had not refused to own, or rather had not openly disowned, the authority of [King] William and Mary [of Orange]. He appears to have been a pious man and of good intentions, but of narrow views, severe in his temper, and altogether unqualified, by want of military talents and experience, for the command which he assumed, or which was conferred on him by the small body which proved successful in the skirmish at Drumclog [1679]. He is charged, and apparently not without reason, with having been active in pushing [Donald] Cargill, [Richard] Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert. This dissension was a main cause of the failure of the present attempt to redress national grievances. Hamilton and his party acted on the principle, that it was unlawful to associate, for vindicating their civil and religious rights, with any but those with whom they could join in church-communion; or, which amounts to the same thing, that it behoved them to introduce into the state of their quarrel, as appearing in arms, a condemnation of every thing in relation to the public interests of religion which was sinful or unscriptural;¹ a principle which, while it involved them in that very confounding of civil and ecclesiastical matters against which they inveighed so loudly under the name of Erastianism, tended to rivet the chains of servitude on themselves and the nation. ¹ [See ‘Not All Truths must be Preached in All Circumstances’ at ‘Pastors’ (RBO)] Into this error they appear to have been betrayed partly by mistaken notions of the controversy which had formerly arisen respecting the Public Resolutions [in the late-1640’s and early-1650’s].² What the more honest party at that period opposed was, the admitting to places of power and trust of such as had shown by their previous conduct that they were enemies to the reformation introduced into church and state, and would use the power intrusted to them to overturn it. ² [See ‘The Scottish Resolutioner-Protester Controversy, 1650’s’ (RBO)] This could not be said of those who had accepted of or acquiesced in the Indulgence,³ and still less of those whom Hamilton’s friends wrangled with so fiercely, who protested solemnly that they disapproved of the Indulgence, and whose former conduct vouched for the sincerity of their protestations. ³ [See the ‘Intro’ at ‘Defenses of Scottish Covenanting &amp; the Indulgence &amp; Occasional Hearing Controversies, 1661-1688’ (RBO)] Another remark is suggested by the facts here referred to. If ministers of the gospel would preserve their usefulness and respectability, they must guard their independence on the side of the people as well as of civil rulers. Provided they become “the servants of men,” it matters not much whether their masters wear a crown or a bonnet; and if, instead of going before the people to point out to them the path of duty, and checking them when they are ready to run into extremes, they wait to receive directions from them, and suffer themselves to be borne along by the popular stream, the consequences cannot fail to be fatal to both. Firm and tenacious of his purpose, the servant of the Lord, while gentle to all, ought to hold on the even tenor of his way, unmoved equally by the frown of the tyrant, the cry of the multitude, and the dictates of forward individuals, good and well-meaning men it may be, but who ” cannot see afar off,” and just need the more to be led that they think themselves capable of being leaders. An opposite conduct on the part of two or three ministers tended to foster those extravagant opinions and practices adopted by some presbyterians at this period, which discredited the cause for which they appeared, and which their best friends, though they may excuse, will not be able to defend, and should not seek to vindicate.</p></blockquote>

s [in the late-1640’s and early-1650’s].² What the more honest party at that period opposed was, the admitting to places of power and trust of such as had shown by their previous conduct that they were enemies to the reformation introduced into church and state, and would use the power intrusted to them to overturn it. ² [See ‘The Scottish Resolutioner-Protester Controversy, 1650’s’ (RBO)] This could not be said of those who had accepted of or acquiesced in the Indulgence,³ and still less of those whom Hamilton’s friends wrangled with so fiercely, who protested solemnly that they disapproved of the Indulgence, and whose former conduct vouched for the sincerity of their protestations. ³ [See the ‘Intro’ at ‘Defenses of Scottish Covenanting &amp; the Indulgence &amp; Occasional Hearing Controversies, 1661-1688’ (RBO)] Another remark is suggested by the facts here referred to. If ministers of the gospel would preserve their usefulness and respectability, they must guard their independence on the side of the people as well as of civil rulers. Provided they become “the servants of men,” it matters not much whether their masters wear a crown or a bonnet; and if, instead of going before the people to point out to them the path of duty, and checking them when they are ready to run into extremes, they wait to receive directions from them, and suffer themselves to be borne along by the popular stream, the consequences cannot fail to be fatal to both. Firm and tenacious of his purpose, the servant of the Lord, while gentle to all, ought to hold on the even tenor of his way, unmoved equally by the frown of the tyrant, the cry of the multitude, and the dictates of forward individuals, good and well-meaning men it may be, but who ” cannot see afar off,” and just need the more to be led that they think themselves capable of being leaders. An opposite conduct on the part of two or three ministers tended to foster those extravagant opinions and practices adopted by some presbyterians at this period, which discredited the cause for which they appeared, and which their best friends, though they may excuse, will not be able to defend, and should not seek to vindicate.”

— Thomas M’Crie Sr., Memoirs of Mr. William Veitch, and George Brysson, Written by Themselves, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825), “Biographical Notices of James Ure of Shargarton”, pp. 452-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Robert+Hamilton+%5B1650%E2%80%931701%5D+was+a+gentleman+of+good+family%2C+being+brother+to+Sir+William+Hamilton+of+Preston%2C+to+whose+title+and+estates+he+would+have+succeeded%2C+on+his+death%2C+at+the+%5BGlorious%5D+Revolution+%5B1689%5D%2C+if+he+had+not+refused+to+own%2C+or+rather+had+not+openly+disowned%2C+the+authority+of+%5BKing%5D+William+and+Mary+%5Bof+Orange%5D.+He+appears+to+have+been+a+pious+man+and+of+good+intentions%2C+but+of+narrow+views%2C+severe+in+his+temper%2C+and+altogether+unqualified%2C+by+want+of+military+talents+and+experience%2C+for+the+command+which+he+assumed%2C+or+which+was+conferred+on+him+by+the+small+body+which+proved+successful+in+the+skirmish+at+Drumclog+%5B1679%5D.+He+is+charged%2C+and+apparently+not+without+reason%2C+with+having+been+active+in+pushing+%5BDonald%5D+Cargill%2C+%5BRichard%5D+Cameron%2C+and+some+other+ministers%2C+to+those+extremes+which+produced+a+breach+between+them+and+their+brethren%2C+with+whom+they+had+until+of+late+acted+in+concert.+This+dissension+was+a+main+cause+of+the+failure+of+the+present+attempt+to+redress+national+grievances.+Hamilton+and+his+party+acted+on+the+principle%2C+that+it+was+unlawful+to+associate%2C+for+vindicating+their+civil+and+religious+rights%2C+with+any+but+those+with+whom+they+could+join+in+church-communion%3B+or%2C+which+amounts+to+the+same+thing%2C+that+it+behoved+them+to+introduce+into+the+state+of+their+quarrel%2C+as+appearing+in+arms%2C+a+condemnation+of+every+thing+in+relation+to+the+public+interests+of+religion+which+was+sinful+or+unscriptural%3B%C2%B9+a+principle+which%2C+while+it+involved+them+in+that+very+confounding+of+civil+and+ecclesiastical+matters+against+which+they+inveighed+so+loudly+under+the+name+of+Erastianism%2C+tended+to+rivet+the+chains+of+servitude+on+themselves+and+the+nation.+%C2%B9+%5BSee+%E2%80%98Not+All+Truths+must+be+Preached+in+All+Circumstances%E2%80%99+at+%E2%80%98Pastors%E2%80%99+%28RBO%29%5D+Into+this+error+they+appear+to+have+been+betrayed+partly+by+mistaken+notions+of+the+controversy+which+had+formerly+arisen+respecting+the+Public+Resolutions+%5Bin+the+late-1640%E2%80%99s+and+early-1650%E2%80%99s%5D.%C2%B2+What+the+more+honest+party+at+that+period+opposed+was%2C+the+admitting+to+places+of+power+and+trust+of+such+as+had+shown+by+their+previous+conduct+that+they+were+enemies+to+the+reformation+introduced+into+church+and+state%2C+and+would+use+the+power+intrusted+to+them+to+overturn+it.+%C2%B2+%5BSee+%E2%80%98The+Scottish+Resolutioner-Protester+Controversy%2C+1650%E2%80%99s%E2%80%99+%28RBO%29%5D+This+could+not+be+said+of+those+who+had+accepted+of+or+acquiesced+in+the+Indulgence%2C%C2%B3+and+still+less+of+those+whom+Hamilton%E2%80%99s+friends+wrangled+with+so+fiercely%2C+who+protested+solemnly+that+they+disapproved+of+the+Indulgence%2C+and+whose+former+conduct+vouched+for+the+sincerity+of+their+protestations.+%C2%B3+%5BSee+the+%E2%80%98Intro%E2%80%99+at+%E2%80%98Defenses+of+Scottish+Covenanting+%26+the+Indulgence+%26+Occasional+Hearing+Controversies%2C+1661-1688%E2%80%99+%28RBO%29%5D+Another+remark+is+suggested+by+the+facts+here+referred+to.+If+ministers+of+the+gospel+would+preserve+their+usefulness+and+respectability%2C+they+must+guard+their+independence+on+the+side+of+the+people+as+well+as+of+civil+rulers.+Provided+they+become+%E2%80%9Cthe+servants+of+men%2C%E2%80%9D+it+matters+not+much+whether+their+masters+wear+a+crown+or+a+bonnet%3B+and+if%2C+instead+of+going+before+the+people+to+point+out+to+them+the+path+of+duty%2C+and+checking+them+when+they+are+ready+to+run+into+extremes%2C+they+wait+to+receive+directions+from+them%2C+and+suffer+themselves+to+be+borne+along+by+the+popular+stream%2C+the+consequences+cannot+fail+to+be+fatal+to+both.+Firm+and+tenacious+of+his+purpose%2C+the+servant+of+the+Lord%2C+while+gentle+to+all%2C+ought+to+hold+on+the+even+tenor+of+his+way%2C+unmoved+equally+by+the+frown+of+the+tyrant%2C+the+cry+of+the+multitude%2C+and+the+dictates+of+forward+individuals%2C+good+and+well-meaning+men+it+may+be%2C+but+who+%E2%80%9D+cannot+see+afar+off%2C%E2%80%9D+and+just+need+the+more+to+be+led+that+they+think+themselves+capable+of+being+leaders.+An+opposite+conduct+on+the+part+of+two+or+three+ministers+tended+to+foster+those+extravagant+opinions+and+practices+adopted+by+some+presbyterians+at+this+period%2C+which+discredited+the+cause+for+which+they+appeared%2C+and+which+their+best+friends%2C+though+they+may+excuse%2C+will+not+be+able+to+defend%2C+and+should+not+seek+to+vindicate.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Sr.%2C+Memoirs+of+Mr.+William+Veitch%2C+and+George+Brysson%2C+Written+by+Themselves%2C+ed.+Thomas+M%E2%80%99Crie+%28Edinburgh%3A+William+Blackwood%2C+1825%29%2C+%E2%80%9CBiographical+Notices+of+James+Ure+of+Shargarton%E2%80%9D%2C+pp.+452-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32fce1c9ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/32fce1c9ef.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a,and%20should%20not%20seek%20to%20vindicate." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We who are here providentially convened in our own defence, for preventing and removing the mistakes and misapprehensions of all, especially of those whom we wish to be, and hope are friends, do declare our present purposes and endeavours to be only in vindication and defence of the true reformed religion in its profession and doctrine, as we stand obliged thereunto by our national and solemn league and covenants, and that solemn acknowledgment of sins, and engagement to duties, made and taken in the year 1648, declaring against popery, prelacy, Erastianism, and all things depending thereupon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3 | At the beginning of the gathering, that week in which the attempt was made upon Glasgow, when they came to deliberate upon a declaration to be emitted, most part by far, in the meeting for consultation, were of Mr. Hamilton and Mr. Douglas’s sentiments, Mr. Welsh and a few others excepted; so that it was carried almost without a struggle that the indulgence should be testified against in the declaration agreed to. All that Mr Welsh and those of his sentiments could do, was to get the passage relative thereunto kept in general terms. The paper at this time before them is but short, and follows.</cite>, pp. 90-95</span></figcaption>

<blockquote><p>Their former discord anent the state of their appearance, and their declaration, did a vast deal of hurt to the common cause, and to both sides. When the reports of it came abroad, multitudes who were coming to the army were discouraged, and great numbers, when they came to the camp, and saw how matters went, very soon left them. And I find both sides, in their papers, complaining of this; Mr. Hamilton’s party especially, towards the close of this rising, and when the moderate party overbalanced them, complained that many came to the camp, and finding that the cause was not clearly stated, and the indulgence not plainly opposed, they left the army: the other side complain, I imagine, with as much reason, that many quit the camp, and more who wished them well, came not up, by reason of the heights and extremities run into by many. As the time of the engagement approached, these differences run higher. The publishing the above-named declaration, June 13th, did very much ruffle those who opposed it; and they were not only broken in their affections, but the common soldiers were under no kind of discipline: their confusions increased, and numbers lessened much, before the king’s army came up; and, as has been hinted, they wanted skilled officers; their arms were out of case; they had very little ammunition, their rising being without any prior concert; and were in very melancholy circumstances… The officers met upon Saturday, June 21st, where the moderate party were supernumerary, by the accession of a good many gentlemen of some note, who joined them, and could not well be excluded [from] the meeting, which they named the council of war. At this meeting their debates run higher than ever, even when the enemy was within their view… …and Mr. Hamilton [a lay-leader in the army], who, as one of his own side acknowledges upon this occasion, “was often too forward, pretending to exercise a power which he had not, and that, his carriage at this time gave just occasion of offence to both sides,” opposed much the consulting with the ministers there, because, he said, none of the faithful ministers were present, but only such who owned the indulgence [which is false]; adding, that since the sword was drawn, he thought it duty to appear against all sin. It was reported he laid his hand upon his sword when he spoke what follows; but Mr. Hackston of Rathillet, in his relation of the divisions at Bothwell, denies this, but owns he added, “I have drawn my sword, and am equally ready against the indulged men and curates.” So high did the flame rise at a time when harmony was absolutely necessary. The moderate side continued to urge to have leaders chosen who were most capable of that trust, whether for or against the indulgence, whereupon Mr. Hamilton, and a good many with him, left the meeting, telling them as they went away, “That hitherto they had carried on this work, and now since they were setting up upon the foot of the indulgence, they had no freedom to venture their lives in that cause.”… Now the fatal nature of their divisions began to appear. When the commissioners came back, the officers fell a debating, and would come to no resolution. Mr. Hamilton, who assumed the general command, was against all accommodation, and others did not relish the proposal of laying down their arms; in short, they were quite disjointed and broken, and nothing was agreed upon, nor any answer returned to the general. So the lord Livingstone, upon the head of the foot-guards, came up with the cannon to force the bridge… Never was a good cause and gallant army, generally speaking, hearty and bold, worse managed…</p></blockquote>

g%2C+which+they+named+the+council+of+war.+At+this+meeting+their+debates+run+higher+than+ever%2C+even+when+the+enemy+was+within+their+view%E2%80%A6+%E2%80%A6and+Mr.+Hamilton+%5Ba+lay-leader+in+the+army%5D%2C+who%2C+as+one+of+his+own+side+acknowledges+upon+this+occasion%2C+%E2%80%9Cwas+often+too+forward%2C+pretending+to+exercise+a+power+which+he+had+not%2C+and+that%2C+his+carriage+at+this+time+gave+just+occasion+of+offence+to+both+sides%2C%E2%80%9D+opposed+much+the+consulting+with+the+ministers+there%2C+because%2C+he+said%2C+none+of+the+faithful+ministers+were+present%2C+but+only+such+who+owned+the+indulgence+%5Bwhich+is+false%5D%3B+adding%2C+that+since+the+sword+was+drawn%2C+he+thought+it+duty+to+appear+against+all+sin.+It+was+reported+he+laid+his+hand+upon+his+sword+when+he+spoke+what+follows%3B+but+Mr.+Hackston+of+Rathillet%2C+in+his+relation+of+the+divisions+at+Bothwell%2C+denies+this%2C+but+owns+he+added%2C+%E2%80%9CI+have+drawn+my+sword%2C+and+am+equally+ready+against+the+indulged+men+and+curates.%E2%80%9D+So+high+did+the+flame+rise+at+a+time+when+harmony+was+absolutely+necessary.+The+moderate+side+continued+to+urge+to+have+leaders+chosen+who+were+most+capable+of+that+trust%2C+whether+for+or+against+the+indulgence%2C+whereupon+Mr.+Hamilton%2C+and+a+good+many+with+him%2C+left+the+meeting%2C+telling+them+as+they+went+away%2C+%E2%80%9CThat+hitherto+they+had+carried+on+this+work%2C+and+now+since+they+were+setting+up+upon+the+foot+of+the+indulgence%2C+they+had+no+freedom+to+venture+their+lives+in+that+cause.%E2%80%9D%E2%80%A6+Now+the+fatal+nature+of+their+divisions+began+to+appear.+When+the+commissioners+came+back%2C+the+officers+fell+a+debating%2C+and+would+come+to+no+resolution.+Mr.+Hamilton%2C+who+assumed+the+general+command%2C+was+against+all+accommodation%2C+and+others+did+not+relish+the+proposal+of+laying+down+their+arms%3B+in+short%2C+they+were+quite+disjointed+and+broken%2C+and+nothing+was+agreed+upon%2C+nor+any+answer+returned+to+the+general.+So+the+lord+Livingstone%2C+upon+the+head+of+the+foot-guards%2C+came+up+with+the+cannon+to+force+the+bridge%E2%80%A6+Never+was+a+good+cause+and+gallant+army%2C+generally+speaking%2C+hearty+and+bold%2C+worse+managed%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+Wodrow%2C+The+History+of+the+Sufferings+of+the+Church+of+Scotland+from+the+Restoration+to+the+Revolution%2C+4+vols.+%28d.+1734%3B+Glasgow%3A+Blackie+%26+Son%2C+1832%29%2C+vol.+3%2C+pp.+102-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F220de25e77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/220de25e77.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Their%20former%20discord%20anent%20the%20state,speaking%2C%20hearty%20and%20bold%2C%20worse%20managed%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-c96b30e0f7" data-kw="">
<blockquote><p>The truth of history, however, requires that we should state here some of the steps taken by that party of the Presbyterians usually called Society People or Cameronians. [In 1680] One Henry Hall of Haughhead, in Teviotdale, a gentleman who was intimate with Mr. [Donald] Cargill, and had suffered great persecution, was apprehended at Queensferry with a paper in his possession disowning the government, and containing some very strong and exceptionable sentiments. This paper, it appears, was merely a scroll drawn up by Hall and Cargill, and more like a manifesto for a general rising of the people, than fitted for a suffering and subdued handful. It was never sanctioned by any meeting [of the Cameronians]; but having fallen into the hands of the governors, it was held as indicating the sentiments and designs of all the Presbyterians. The Queensferry Paper, as it was called, was thenceforth quoted and used against all suspected of Presbyterianism. Shortly after this Cameron and Cargill, with some others, having broken off from the rest of the Presbyterian ministers, published [in 1680] a declaration at Sanquhar, differing a little from, but in the same strain with, the Queensferry Paper. The Sanquhar Declaration openly declared war against Charles as a tyrant and usurper. This was followed up by one of the most singular scenes, perhaps, recorded in the history of the times — the Torwood excommunication. In a meeting held at Torwood, in Stirlingshire, in September, 1680, Mr. Cargill, after divine service, pronounced, with all solemnity and formality, the highest sentence of excommunication against King Charles, the Duke of York, the Dukes of Monmouth, Lauderdale, and Rothes, General Dalziel, and the advocate, Sir George Mackenzie; in the name of the Lord Jesus Christ casting them out of the church, and delivering them up unto Satan. These proceedings, we may well believe, irritated the ruling powers more than ever; and though unshared in and unapproved of by the rest of the Presbyterian ministers, they were eagerly laid hold of as pretexts for still greater severities against the whole of them. The furnace was “heated one seven times more than it was wont to be heated.” Into the history of the persecutions which followed we cannot minutely enter.</p></blockquote>

<blockquote><p>‘That the prevailing strength of the Cameronian party was the occasion of all’ that here he [the episcopal opponent] complains of, even the abolishing of episcopacy [at 1690]. [On the contrary.] All the presbyterians in Scotland did contribute their endeavors to this, as also did many who formerly had gone along with the courses that the episcopalians promoted: Now to call all the presbyterians, or most of them Cameronians, is as remote from truth as anything can be… The men of most note and zeal for presbytery did what in them lay to allay that forwardness of the people [around 1689], that the Church might be reformed in a more legal way.</p></blockquote>

</figure><figure class="quote" id="q-dab48019cf" data-kw="">
<blockquote><p>…while he [the opponent] says: ‘That all Scots-men were generally of one Communion, and that the presbyterians (except the Cameronians) had returned to the Episcopal Church, and were become hearers, and many communicaters with her: That there was no separate meetings kept, at least publicly, but very rarely.’ This, I say, is most false: For though never any of the presbyterians would, directly nor undirectly, own episcopal government, yet many of the more sober and intelligent among them did not think it unlawful to hear them occasionally, who had complied with episcopacy; yet they chose rather to hear their own lawful pastors, though driven into corners, than these unfaithful men: And not only so, but there were many thousands, beside Cameronians, who would never hear them: And that many (who when they had occasion to hear others, made use of that opportunity) did go to hear these men, when their liberty of hearing others was taken away, it is no wonder. Yet this practice was far less general than he says, and meetings of nonconformists were not so rare (for all the horrid persecution that they were under) as he would make us believe: Many, who were no Cameronians, kept up their meetings, though I confess it was no wonder that their meetings were not public [after about 1680], when they were by such barbarous persecutions driven into corners… §2. Another falshood is, that the party which was then treated severely, was only the Cameronians: Whereas, though they had their share of the persecution, yet other presbyterians were most cruelly dealt with; and it was observed, that, indeed, the spite of his [episcopal / royalist] party appeared most against the most sober of the presbyterians, as being the persons most capable to do them hurt. …It is also most false and calumnibus, ‘that all presbyterians in Scotland were of one principle, only the Cameronians were more ingenuous’: For the sober presbyterians did always condemn many, both principles and practices, of that party. Such as that magistrates and ministers fall, ipso facto, from their authority, respective, and stations, when they are guilty of mis-managements, and that private persons may treat them as such, without a ••••enee [decree?] of State or Church. That the rest of the presbyterians condemned the Cameronians for keeping up their meetings, is also an untruth, for they also kept up meetings; but they condemned them for the manner of their meeting, with such contempt of, and bidding defiance to the authority of the magistrate.</p></blockquote>

<blockquote><p>It appears that local societies for a time operated their own rules for admission, but Renwick was concerned that they should all work to a standard pattern and he prepared a model set of rules (below) which he intended to be of uniform application… It is not clear how widely these rules were adopted…. all members were required to assent [to them], and [to] which they were to promise ‘religiously to practice and observe’.</p></blockquote>

<blockquote><p>Much of the division, however, resulted from disowning the [civil] government [in 1680]… by the societies. The General Society rejected and rebuked many godly Presbyterian ministers because they would not disown the king although they shared the same views concerning church doctrine, worship and government. To make matters worse, the societies broke fellowship with those who listened to such ministers, causing further divisions.</p></blockquote>

</figure><figure class="quote" id="q-f45ff72fcc" data-kw="">
<blockquote><p>…[James] Renwick possessed great character, knowledge and spirit. Unfortunately, a faction persistently refused to hear Renwick for a variety of hair-splitting reasons, including Renwick’s ordination [in 1683 in Holland by the reformed Dutch Church] by those who used musical instruments in worship services. Even Reverend [Alexander] Peden initially warned people against Renwick. To compound their worries at home, public sentiment abroad turned against the Society People. Many abroad were concerned with the remnant’s controversial views on several subjects: namely, their refusal to acknowledge the king’s authority, their overly restrictive requirements for fellowship, and their lack of ecclesiastical capability to call and oversee ministers. These concerns made it almost impossible to ordain additional ministers abroad (Shields, Faithful Contendings, pp. 100-101). The following questions posed to attendees to the General Society meetings are illustrative of the extent to which they went to remain free of the defections of the day: (1) Do ye know the principles and practices of these societies from whom ye have your commission? (2) Do ye and they own our covenants and engagements, our faithful Declarations and Testimonies? (3) Are ye and they free of giving any manner of bond to the enemies? (4) Are ye and they free of paying cess [a tax], locality, and any militia money? (5) Are ye and they free of paying stipends to the curates or to the Indulged? (6) Are ye and they free of taking the enemies’ pass or protection? (7) Are ye and they free of answering unto enemies their courts? (8) Are ye and they free of capitulation any manner or way with the enemies, or furnishing them with commodities? (9) Are ye and they free of counseling and consenting to any in their compliance, any of their foresaid ways, for you, in your name? (10) Are ye and they free of joining with the curates or indulged, by hearing them preach, accepting the administration of the sacraments at their hands, subjecting unto their discipline, or being married by them? (11) Are ye and they free of joining any of the foresaid ways of complying, unfaithful, and silent ministers of the time? The severity of life on the run combined with the endless criticism from home and abroad bore hard on the Society People.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage (2000) Moore is very sympathetic with the Cameronians.</cite>, p. 103</span></figcaption>

C+or+furnishing+them+with+commodities%3F+%289%29+Are+ye+and+they+free+of+counseling+and+consenting+to+any+in+their+compliance%2C+any+of+their+foresaid+ways%2C+for+you%2C+in+your+name%3F+%2810%29+Are+ye+and+they+free+of+joining+with+the+curates+or+indulged%2C+by+hearing+them+preach%2C+accepting+the+administration+of+the+sacraments+at+their+hands%2C+subjecting+unto+their+discipline%2C+or+being+married+by+them%3F+%2811%29+Are+ye+and+they+free+of+joining+any+of+the+foresaid+ways+of+complying%2C+unfaithful%2C+and+silent+ministers+of+the+time%3F+The+severity+of+life+on+the+run+combined+with+the+endless+criticism+from+home+and+abroad+bore+hard+on+the+Society+People.%E2%80%9D%0A%0A%E2%80%94+Edwin+Nisbet+Moore%2C+Our+Covenant+Heritage+%282000%29+Moore+is+very+sympathetic+with+the+Cameronians.%2C+p.+103&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff45ff72fcc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f45ff72fcc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=%E2%80%A6%5BJames%5D%20Renwick%20possessed%20great%20character%2C%20knowledge,bore%20hard%20on%20the%20Society%20People." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3235a6afdb" data-kw="">
<blockquote><p>After the defeat [of Argyle’s expedition, 1685], two of the ministers who came over with Argyle’s party sought to join with the Society. The Society rejected them because they had left the country during a time of need, joined with Indulged ministers in worship, spoken out against the Society, associated with Argyle’s expedition, and had not supported [Donald] Cargill and [Richard] Cameron. In their defense, the two ministers compared their associations abroad with Renwick’s foreign ordination and expressed concerns regarding the Society’s testimonies and declarations. The two ministers would not abstain from fellowship with the Indulged, but ‘declared their willingness to lay things in present controversy aside, until they should be determined by a competent judicatory [which the Society People were not].’ (Shields, Faithful Contendings, pp. 168-182) The Society members, finding these terms unacceptable, decided not to join with these two ministers. Some left with the two ministers resulting in yet another painful division. (Ibid., 169)… [Patrick] Walker also listed James Nisbet as one who could attest to the conflicts that took place among the Society members during this time. James memoir describes how he saw first hand the divisions that resulted from the Argyle affair: ‘But, alas! I got my comforts a little lowered this day upon the reason following: There came to that meeting some of the worthy gentlemen who came home this year with the Earl of Argyle on his expedition; they and some other of our Christian friends looked shy and cold upon one another upon the account of some difference in judgment and opinion that was among them. [This] was matter of sorrow of heart to me now, but much more so afterwards, when I saw the woeful consequences thereof; for I quickly observed that these differences of opinion occasioned much alienation of affection, even among those who were otherwise truly religious. Likewise, it served much to eat out the vitals of religion in the waste of much precious time, which was spent in debating and contending, which might otherwise have been very usefully spent in seeking after and in pursuit of the one thing needful, the better part, which could not have been taken from them.’ (Nisbet, Private Life, pp. 114-15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage (2000) Moore is very sympathetic with the Cameronians.</cite>, p. 117</span></figcaption>

+matter+of+sorrow+of+heart+to+me+now%2C+but+much+more+so+afterwards%2C+when+I+saw+the+woeful+consequences+thereof%3B+for+I+quickly+observed+that+these+differences+of+opinion+occasioned+much+alienation+of+affection%2C+even+among+those+who+were+otherwise+truly+religious.+Likewise%2C+it+served+much+to+eat+out+the+vitals+of+religion+in+the+waste+of+much+precious+time%2C+which+was+spent+in+debating+and+contending%2C+which+might+otherwise+have+been+very+usefully+spent+in+seeking+after+and+in+pursuit+of+the+one+thing+needful%2C+the+better+part%2C+which+could+not+have+been+taken+from+them.%E2%80%99+%28Nisbet%2C+Private+Life%2C+pp.+114-15%29%E2%80%9D%0A%0A%E2%80%94+Edwin+Nisbet+Moore%2C+Our+Covenant+Heritage+%282000%29+Moore+is+very+sympathetic+with+the+Cameronians.%2C+p.+117&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3235a6afdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3235a6afdb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=After%20the%20defeat%20%5Bof%20Argyle%E2%80%99s%20expedition%2C,them.%E2%80%99%20%28Nisbet%2C%20Private%20Life%2C%20pp.%20114%2D15%29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b7f4593e65" data-kw="">
<blockquote><p>James Nisbet agonized over this difficult choice… should he join the clearly imperfect Church of Scotland? Based on the following account form his memoir, it is likely that he parted from the Society shortly after the Revolution Settlement because of the dangerous errors and behaviors of its members: ‘Their criticizing upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults and often fixing some where there is none; yea, seldom sparing one another even where they are one in judgment, [they made] the terms of their communion straighter than what God allows in his Word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children or servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government. They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion and to be savingly acquainted with the inward and serious part of real godliness. They would publish a declaration disowning the authority of the great King William [of the Glorious Revolution, 1689 ff.] and against the validity of the present church communion. When I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it… Thus my protesting, and refusing to join with them, enraged them exceedingly against me. As their scourge of tongues was grievously bent against others, so now was it against myself in a most grievous, unjust, and unreasonable manner… Thus, I left that party of the dissenters who now commonly go under the name of Mr. McMillan’s people…’ (Nisbet, Private Life, pp. 235-238)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage (2000) Moore is very sympathetic with the Cameronians.</cite>, p. 159</span></figcaption>

</figure><figure class="quote" id="q-e47239794e" data-kw="">
<blockquote><p>[The Queensferry Paper, 1680:] ‘We neither can, nor will hear preaching, nor receive sacraments from these ministers that have accepted of, and voted for that liberty; and declare all who have encouraged and strengthened their hands, by hearing and pleading for them, all those who have trafficked for a union with them, without their renouncing and repenting of these things, all those that do not testify faithfully against them, and after do not deport themselves suitably to their testimonies, and all who join not in public with their brethren, who are testifying against them; we declare that we shall not hear them preach, nor receive sacraments from them.’ This was a radical view of separation, extending not only to the ministers who had accepted the Indulgence and their supporters, but also to all those who could not bring themselves to condemn publicly what these ministers had done. As such, it went beyond the practice of all but a very few. [Donald] Cargill, for example, was known to have associated with Alexander Peden, who, though firmly against the Indulgence himself, could not find it in him to condemn the ministers who had accepted it. One is left to assume that here again the paper shows the influence of Cameron…</p></blockquote>

8We%20neither,paper%20shows%20the%20influence%20of%20Cameron%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There was also a paper, entitled An information against Mr Renwick’s party, given in to ministers… the papers had been left by Alexander Gordon… There was nothing on the face of the ‘information’ paper to suggest that it had not been compiled by the Carrick men themselves, but the style and substance of it pointed directly to Robert Langlands… The Societies, it charged… had imposed restrictions on ministers and cast off the whole suffering ministry… they had made ‘canons’ laying down the qualifications of those fitted to be members of their meetings, forbidding association with those they regarded as unfaithful, even to the extent of servants joining in family worship with their masters, or children with their parents;¹ and, not least, they had ‘cast off most part of the societies in the shires of Ayr and Galloway, chiefly upon these two heads, that they would not disown and condemn the [civil] declaration published by Argyle, and because they were clear to call and hear faithful suffering ministers’.</p></blockquote>

</figure><figure class="quote" id="q-0fa862c215" data-kw="">
<blockquote><p>As for the Sanquhar declaration [1680], in so far as it denies the king’s authority and declares a war against him, it is a mere madness… it is no Christian duty to debate about these and the like things, and for such causes to raise a schism. Oh how sad is it that so many do place godliness in maintaining the Sanquhar declaration, and in separating from them who in their judgment are not so zealous in these or other circumstances. I admonish them to cease from these and such like courses, if they be lovers of Christ and his cause and love not their own bodily and spiritual ruin. I pray therefore, do not make such feckless things grounds of schism; do not I pray stain piety with such a blot. Why do you sport with God, religion and the church? Leave things of the state to statesmen. Leave off such debates; God’s anger is kindled against Scotland; do not kindle it more.</p></blockquote>

<blockquote><p>It may be noted here that the term ‘Cameronian’, often loosely applied to the adherents of Cameron and Cargill, was originally coined about 1678 or 1679 to describe, disparagingly, those who shared [Richard] Cameron’s views on the supremacy [of the English and Scottish king] and Indulgence (cf. The Nonconformist’s Vindication, 1700, p. 16; A True and Impartial Relation of Bothwell Bridge, 1797, p. 16 [1751, p. 20]). It did not, however, gain much currency until after the Revolution of 1688, when it was used to denote those elements of the United Societies which did not join the Revolution Settlement (cf. [Patrick Walker] Six Saints of the Covenant, vol. I. p. 251)¹ ¹ [Walker says previously in the volume: “I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton, who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world;” Ibid., pp. 138-39] The term was never owned by those to whom it was applied, and it is uniformly described in their literature as a ‘by-name’ or ‘nick-name’ (cf. A Short Memorial of Sufferings and Grievances, 1690, title page). To the same effect are some remarks by John M’Main (Earnest Contendings, 1723, p. 376) when in taking Wodrow severely to task for using the term in his History he asserts, ‘He calumniates and fixes upon these faithful witnesses of Jesus Christ that stigma, or name of reproach, wherewith their enemies had branded them, calling them after a man, and falsely alleging that they termed themselves so, and labours to make his readers, in this and future generations, believe the calumny thus confirmed, that they were not Presbyterians. But he cannot produce one instance among all the cloud of witnesses, whom he so reproaches, evincing that ever any of them did so term themselves.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill (Durham: Evangelical Press, 1988)</cite>, p. 253, ch. 9, endnote 7</span></figcaption>

<blockquote><p>[August, 1689:] The most material thing deliberate[d] upon by them, was, that albeit the representing of our grievances to the King, while he was Prince of Orange had hitherto been delayed, whereby debates had been occasioned among ourselves, yet it might be considered whether it were now necessary to send the same. They all agreed that it was necessary and expedient to give a true representation of our cause and case to the King, and seek redress of our grievances, though this had been long delayed, and had formerly been agreed upon by the General Meeting at Crawford-John, February 13th last part. Whereby it was concluded that an address with a memorial of our grievances should be sent to the Prince of Orange, which memorial might now be written over again, and sent, with such alterations as the present circumstances called for. And they concluded that Earlstoun, Kerstand, and Sir. Robert Hamilton, and Mr. Alexander Shields should be desired to go to London with the same, or any two of them (Mr. Shields still being one of them) as they agree among themselves… Sir Robert signified his mind to this purpose… he expected they and he would not agree… And moreover, as for him they were to go unto, he could not address, nor own him as King, but only as Prince of Orange, but he said he was willing to hazard himself in representing our grievances to him as such, with an offer of our allegiance upon right terms, acknowledging we had been too hasty in owning him before. Neither would he go with Kerstand and Mr. Shields, who were of a contrary mind in this matter, seeing they might, when there, contradict one another in their discourses. Mr. Shields declared his willingness to go, if these desired would go with him, but for the reasons above given by each of them a stop was put to that affair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/michael-shields.html">Michael Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faithful Contendings Displayed, ed. John Howie (Glasgow: John Bryce, 1780) This is the main primary source account.</cite>, pp. 411-12</span></figcaption>

<blockquote><p>In this discouraging time, a General Meeting met at Douglas upon the 6th of November, 1689. After the meeting was modeled, it was enquired, What the meeting ought first to consider of? Some answered, That the business concerning union with the [other Church of Scotland] ministers was of greatest consequence, and therefore should be first deliberated upon…</p></blockquote>

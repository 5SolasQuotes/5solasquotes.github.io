<blockquote><p>…a General Meeting met at Douglas, the 3rd of December, 1690… After this, Messrs Lining and Shields, spoke to the Meeting, to this effect, That they would not impose upon any person, yet they advised them to hear those ministers who were most free and faithful, that they could have the opportunity of, and to have a care of running upon extremes on the right hand. After which some debates ensued. Whereupon it was proposed to the meeting that a paper should be drawn up, containing a protestation against the defections of the [Church of Scotland] ministers they [Cameronian laypersons] were to hear (which they might give in either to the minister with whom they were to join, or to the presbytery of the bounds) and what induced them to join at that time; as also that their joining at present was neither a condemning of, nor receding from our former testimony and contending, nor approving of these defections they witnessed against before… Upon the morrow they convened again. The said paper was presented and read; but there were debatings concerning the same between our ministers and some of the meeting. As also, the Meeting were of different sentiments about it, some against it upon one account, and some upon another account, and some were for it, thinking it better to join with such a testimony than without any at all. Not coming to any agreement, it was left to people’s liberty and freedom to give it or not, as they thought fit. It was proposed to the meeting, that in regard debates did not much good, but rather hurt, it was fittest to leave them off, and part; which… they did. Some stayed and took copies of the paper, which they gave in to ministers before they joined; a transcript of which follows. To the right reverend Minister and Eldership of the Parish of ________ or Presbtyery of ________ Although among other calamities that we have been exercised with in these days of tribulation that have gone over us, these have been very grievous unto us, that not only we have labored under a sad famine of gospel-ordinances, but under the reproach that we despised and rejected the offer of them: Yet we have a witness in heaven and in our own consciences, that nothing has been more lamented in our lot than the want [lack] of such a privilege, nor anything so much desired as the recovery and enjoyment of these ordinances, administered in freedom and faithfulness, purity and power, which for a long time, in our judgment, have been so restrained and restricted, burdened and borne down under the bushel of Erastian and Antichristian usurpations, that not only they watned that liberty, light and luster which the Lord Jesus had set them in by his institutions, but seemed to be encompassed with and subjected to these wicked encroachments that we could not have access to them without some way acknowledging and bowing unto these idols of jealousy, which being set up in the very entry of the house of the Lord, did scar and fright us from coming thereunto, so long as these usurpations were standing. But now these things being removed, and the church’s freedom and power restored, the doctrine, worship, discipline and government, and all the ordinances of Christ re-established in purity, peace and freedom, we cannot any longer stand at a distance from them. Nevertheless, the indignities done to our Lord Jesus, and injuries done to his church by these Erastian and Antichristian usurpations of Prelacy, Supremacy and absolute power; and the defections of ministers in comliance therewisth not being as yet confessed nor condemned, and our complaints and petitions offered to the late General Assembly, not being received nor regarded as we expected, which was a great grievance, and an addition to all our former complaints; and yet being resolved to remain no longer in withdrawing as formerly, we think it altogether needful for our own exoneration, and for making our communion the more comfortable, and free of all accession to, or partaking with the guilt of these offenses, which made us withdraw in former times; To offer and give in our testimony against all the wrongs done to Christ and this reformed covenanted Church of Scotland, by the Popish, Prelatical and malignant faction, in their wicked overturning its blessed ancient reformation, rescinding the righteous laws, and breaking, burning and burying the holy covenants that fenced it, and establishing upon the ruins thereof abjured Prelacy, supremacy and tyranny, and by all the defections of ministers in compliance with, or submission to the same; such as, heaing of curates, taking any of the oaths and bonds repugnant to the covenants, embracing the indulgences and indemnities of tyrants, addressing for, and accepting of the late Popish toleration, their lying bye from, or unfaithfulness in the exercise of their ministry in times of abounding snares and their present offensive omissions in not renewing the covenants, nor purging out all the Episcopal curates, etc. And particularly, we cannot forbear to testify (with all reverence and respect to your ministry, which now we offer and promise subjection to in the Lord) against your sin of ___________________________________________ Thus having given in our testimony against these sins and all other defections and corruptions in this church; We protest that our present joining may not be interpreted an approving of any of these sins, nor a condemning of, or receding from our former or present testimony against the same; and humbly plead, that this our testimony and protestation may be registered in the books of Session or Presbytery. Subscribed by us ________ the ___ day of ______.</p></blockquote>

tions+offered+to+the+late+General+Assembly%2C+not+being+received+nor+regarded+as+we+expected%2C+which+was+a+great+grievance%2C+and+an+addition+to+all+our+former+complaints%3B+and+yet+being+resolved+to+remain+no+longer+in+withdrawing+as+formerly%2C+we+think+it+altogether+needful+for+our+own+exoneration%2C+and+for+making+our+communion+the+more+comfortable%2C+and+free+of+all+accession+to%2C+or+partaking+with+the+guilt+of+these+offenses%2C+which+made+us+withdraw+in+former+times%3B+To+offer+and+give+in+our+testimony+against+all+the+wrongs+done+to+Christ+and+this+reformed+covenanted+Church+of+Scotland%2C+by+the+Popish%2C+Prelatical+and+malignant+faction%2C+in+their+wicked+overturning+its+blessed+ancient+reformation%2C+rescinding+the+righteous+laws%2C+and+breaking%2C+burning+and+burying+the+holy+covenants+that+fenced+it%2C+and+establishing+upon+the+ruins+thereof+abjured+Prelacy%2C+supremacy+and+tyranny%2C+and+by+all+the+defections+of+ministers+in+compliance+with%2C+or+submission+to+the+same%3B+such+as%2C+heaing+of+curates%2C+taking+any+of+the+oaths+and+bonds+repugnant+to+the+covenants%2C+embracing+the+indulgences+and+indemnities+of+tyrants%2C+addressing+for%2C+and+accepting+of+the+late+Popish+toleration%2C+their+lying+bye+from%2C+or+unfaithfulness+in+the+exercise+of+their+ministry+in+times+of+abounding+snares+and+their+present+offensive+omissions+in+not+renewing+the+covenants%2C+nor+purging+out+all+the+Episcopal+curates%2C+etc.+And+particularly%2C+we+cannot+forbear+to+testify+%28with+all+reverence+and+respect+to+your+ministry%2C+which+now+we+offer+and+promise+subjection+to+in+the+Lord%29+against+your+sin+of+___________________________________________+Thus+having+given+in+our+testimony+against+these+sins+and+all+other+defections+and+corruptions+in+this+church%3B+We+protest+that+our+present+joining+may+not+be+interpreted+an+approving+of+any+of+these+sins%2C+nor+a+condemning+of%2C+or+receding+from+our+former+or+present+testimony+against+the+same%3B+and+humbly+plead%2C+that+th <blockquote><p>As [the Cameronian leader] Michael Shields has in the foregoing relation frequently made mention of division and debates in their meetings [of the Society People at the end of the 1680’s], and has related how matters were carried on by the ministers and the majority of the people (of which number he was one) but has been sparing in giving account of the grounds upon which the minor party went in opposition to the several parts of their managements in the two last years (viz. 1689 &amp; 1690)…</p></blockquote>

</figure><figure class="quote" id="q-d400a62bf4" data-kw="">
<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenanters after the Revolution of 1688’ (Scottish Church History Society, 1950)</cite>, pp. 144-45</span></figcaption>

rst%20step%20towards%20what%20might,causing%20controversy%20in%20their%20own%20ranks." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-df3e0103da" data-kw="">
<blockquote><p>At the forty-first convention on 24 October 1688, the Societies decided against indifference to a Dutch landing and that they would rise, but only in a ‘defensive posture’ in order to avoid ‘snares’, by which they meant committing themselves in advance to Orange’s settlement, and to prevent their own ‘destruction’. If the Dutch landed in England, as was expected, the Societies would not suddenly appear in arms. Only when the Dutch expedition was ‘advanced’ in Scotland, the kingdom ‘in combustion’ and the Societies were pressed to declare which side they were on, would they rise in the ‘part of the country commanded by the Dutch’… Unlike in previous attempted risings, the Societies also agreed their position towards their potential partners in advance. The same convention unanimously concluded not to associate with the Dutch in one body or come under their command, but after ‘some debate’ it agreed to cooperate with them against their common enemy, accept arms and to take Dutchmen to teach them ‘the art of war’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ion%20on%2024,teach%20them%20%E2%80%98the%20art%20of%20war%E2%80%99." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2719866a3b" data-kw="">
<blockquote><p>Right from the beginning of the Revolution [of 1688-1689], there was an awareness by elements of the Societies’ leadership that the age of protests and remonstrances had come to an end and had been replaced by one of deft diplomatic manoeuvres and influencing outcomes. Instead of directly petitioning Orange for a Covenanted settlement, the Societies would renew the Covenants themselves in early March I689 and press other presbyterians to accept a Covenanted settlement through negotiation. Ultimately, that strategy failed. The pursuit of a Covenanted settlement within the fractured denominational landscape of post-Revolutionary Scotland was unrealistic, and in I69o, Shields, Boyd and Linning would lead the majority of the Societies to accept a uncovenanted presbyterian settlement of the Church under protest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, pp. 235-36</span></figcaption>

</figure><figure class="quote" id="q-22541cf5ab" data-kw="">
<blockquote><p>A minority within the Societies, such as Hamilton and Earlstoun, would continue to reject William’s kingship, but the majority, including their ministerial leadership, either tacitly or openly accepted it. That split proved to be fundamental and led to the great schism in the Societies in 1690, when Hamilton and a minority of the Societies refused to accept the Revolution settlement of Church and State, and, ultimately, publicly rejected William’s authority in the Sanquhar Declaration of 1692. (Walker, BP, I, 126; Shields, FCD, 411-2, 418-9.)… The Societies also took steps to secure the Revolution by offering military support…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, p. 240</span></figcaption>

— Mark Jardine, The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 240">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+minority+within+the+Societies%2C+such+as+Hamilton+and+Earlstoun%2C+would+continue+to+reject+William%E2%80%99s+kingship%2C+but+the+majority%2C+including+their+ministerial+leadership%2C+either+tacitly+or+openly+accepted+it.+That+split+proved+to+be+fundamental+and+led+to+the+great+schism+in+the+Societies+in+1690%2C+when+Hamilton+and+a+minority+of+the+Societies+refused+to+accept+the+Revolution+settlement+of+Church+and+State%2C+and%2C+ultimately%2C+publicly+rejected+William%E2%80%99s+authority+in+the+Sanquhar+Declaration+of+1692.+%28Walker%2C+BP%2C+I%2C+126%3B+Shields%2C+FCD%2C+411-2%2C+418-9.%29%E2%80%A6+The+Societies+also+took+steps+to+secure+the+Revolution+by+offering+military+support%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Mark+Jardine%2C+The+United+Societies%3A+Militancy%2C+Martyrdom+%26+the+Presbyterian+Movement+in+Late-Restoration+Scotland%2C+1679+to+1688+PhD+diss.+%28Univ.+of+Edinburgh%2C+2009%29%2C+Conclusion%2C+p.+240&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22541cf5ab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/22541cf5ab.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=A%20minority%20within%20the%20Societies%2C%20such,the%20Revolution%20by%20offering%20military%20support%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5dbfab2b4a" data-kw="">
<blockquote><p>For hardliners like Hamilton, the ‘under-hand-dealings’ of Shields, Linning and Boyd and the Societies’ connivance in the Revolution settlement broke their Covenanted obligations and diluted the Societies’ testimony which they had so faithfully maintained. In 1691, Hamilton and some societies revived the Societies’ general correspondence or convention to maintain their former testimony in every ‘pendicule’ and to stand ‘alone’ until their cause was vindicated. Later known as the MAcmillanites, the continuing Societies would go on to form the Cameronian or Reformed Presbyterian Presbyterian Church. The continuing Societies’ formed part of a patchwork with other existing fragments of the wider militant movement which rejected the Revolution settlement. They included the rump of the Cameronian Russellites, who maintained their split from the Societies after the reunion of 1688, and the non-Cameronian Hebronites, the followers of John Hepburn… All those sects originated in the schisms of the United Societies and, like the post-Revolution Church, laid claim to the Societies’ heritage…. …Their response to the Revolution, in particular, reveals that persecution was a major factor in shaping their militancy. When persecution was removed at the Revolution, the majority of the Societies were able to moderate their demands and co-ordinate their actions with other presbyterians… The Societies were… one of the midwives of the Revolution. Even though the Revolution sidelined their Covenanted platform, the leadership and majority of the Societies accepted and supported it in the hope that it would place Scotland on a better path than it had been under the Catholic King James and the Restoration regime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, p. 243</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For hardliners like Hamilton, the ‘under-hand-dealings’ of Shields, Linning and Boyd and the Societies’ connivance in the Revolution settlement broke their Covenanted obligations and diluted the Societies’ testimony which they had so faithfully maintained. In 1691, Hamilton and some societies revived the Societies’ general correspondence or convention to maintain their former testimony in every ‘pendicule’ and to stand ‘alone’ until their cause was vindicated. Later known as the MAcmillanites, the continuing Societies would go on to form the Cameronian or Reformed Presbyterian Presbyterian Church. The continuing Societies’ formed part of a patchwork with other existing fragments of the wider militant movement which rejected the Revolution settlement. They included the rump of the Cameronian Russellites, who maintained their split from the Societies after the reunion of 1688, and the non-Cameronian Hebronites, the followers of John Hepburn… All those sects originated in the schisms of the United Societies and, like the post-Revolution Church, laid claim to the Societies’ heritage…. …Their response to the Revolution, in particular, reveals that persecution was a major factor in shaping their militancy. When persecution was removed at the Revolution, the majority of the Societies were able to moderate their demands and co-ordinate their actions with other presbyterians… The Societies were… one of the midwives of the Revolution. Even though the Revolution sidelined their Covenanted platform, the leadership and majority of the Societies accepted and supported it in the hope that it would place Scotland on a better path than it had been under the Catholic King James and the Restoration regime.”

— Mark Jardine, The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 243">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+hardliners+like+Hamilton%2C+the+%E2%80%98under-hand-dealings%E2%80%99+of+Shields%2C+Linning+and+Boyd+and+the+Societies%E2%80%99+connivance+in+the+Revolution+settlement+broke+their+Covenanted+obligations+and+diluted+the+Societies%E2%80%99+testimony+which+they+had+so+faithfully+maintained.+In+1691%2C+Hamilton+and+some+societies+revived+the+Societies%E2%80%99+general+correspondence+or+convention+to+maintain+their+former+testimony+in+every+%E2%80%98pendicule%E2%80%99+and+to+stand+%E2%80%98alone%E2%80%99+until+their+cause+was+vindicated.+Later+known+as+the+MAcmillanites%2C+the+continuing+Societies+would+go+on+to+form+the+Cameronian+or+Reformed+Presbyterian+Presbyterian+Church.+The+continuing+Societies%E2%80%99+formed+part+of+a+patchwork+with+other+existing+fragments+of+the+wider+militant+movement+which+rejected+the+Revolution+settlement.+They+included+the+rump+of+the+Cameronian+Russellites%2C+who+maintained+their+split+from+the+Societies+after+the+reunion+of+1688%2C+and+the+non-Cameronian+Hebronites%2C+the+followers+of+John+Hepburn%E2%80%A6+All+those+sects+originated+in+the+schisms+of+the+United+Societies+and%2C+like+the+post-Revolution+Church%2C+laid+claim+to+the+Societies%E2%80%99+heritage%E2%80%A6.+%E2%80%A6Their+response+to+the+Revolution%2C+in+particular%2C+reveals+that+persecution+was+a+major+factor+in+shaping+their+militancy.+When+persecution+was+removed+at+the+Revolution%2C+the+majority+of+the+Societies+were+able+to+moderate+their+demands+and+co-ordinate+their+actions+with+other+presbyterians%E2%80%A6+The+Societies+were%E2%80%A6+one+of+the+midwives+of+the+Revolution.+Even+though+the+Revolution+sidelined+their+Covenanted+platform%2C+the+leadership+and+majority+of+the+Societies+accepted+and+support </figure><figure class="quote" id="q-993c3a2447" data-kw="">
<blockquote><p>I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands in sending that great man, King William, to overthrow our enemies and redeem us from slavery. Yet the aforesaid nine grievances [on pp. 232-33] stuck close with me, and stumbled me greatly; whereupon I had thoughts to go off the country. But alas, alas! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, because of the aforesaid nine grievances, to which they added many more. I at least was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowlege, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire: for, though Isaw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, p. 234</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, pp. 237-38</span></figcaption>

</figure><figure class="quote" id="q-43b91ea3d2" data-kw="">
<blockquote><p>Now, as formerly, I durst not but yield all true allegiance to the civil magistrate: so after this I durst not refuse any longer to hear the ministers of the presbyterian establishment who preach precious Christ, our dear Redeemer, to be the way, the truth, and the life… Under the ministry of some of which worthy minsiters I lived many years… …till… the much to be lamented death of the eminently religious, brave, and valiant William, Prince of Orange, King of Great Britain, our never to be forgotten kind and compassionate deliverer, who died, March 1702… Thus, from the time I left the dissenters, I wrestled through all the reign of great King William and Queen Anne, enjoying the gospel, clearly and faithfully preached by several worthy ministers, to the great edification and comfort of my soul, meditating frequently on the Scriptures, and repeating the Shorter Catechism to myself, all which I found much sweetness and satisfaction in…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, pp. 240-42</span></figcaption>

<blockquote><p>2. The greatest charge… appears [to be] that the Church of Scotland does not press the renewing of the Covenants, National [1638] and Solemn League [1643]. But there are several things as to this that they take no notice of, which, if noticed, might, in a great measure, allay their clamour: (1) That the National Covenant is, indeed, a confession of our faith, very praiseworthy in its time, but I conceive, for variety and perspicuity, not to be compared with the Westminster Confession, which we own and press. (2) That the Westminster Confession is ratified in King William’s Parliament, and the other [the National Covenant] was approven [implicitly, not explicitly] by the last Parliament of King Charles the Second [in 1681], where I think [James] the Duke of York presided, and included [it] in the bosom of the Test [for civil office] as a point thereof; which honour I believe that Parliament would not have given to the Westminster Confession. (3) As to the Solemn League, they would do well to consider, more seriously, what that answer does overly take notice of, p. 13, near the beginning, viz. that the [General] Assembly [of the Church of Scotland] appoints its being subscribed by all the true professors of the Reformed religion, only after its reception and approbation in the kingdom of England. But they should have considered further, that the Assembly, for aught I can find, by their act, do not appoint even that it be subscribed, only they recommend to the honorable Convention of Estates, that, being examined and approved by them, it may be sent to England, to be received and approven there, that after that it may be, with all religious solemnity, sworn, etc. (4) They would consider whether it be practicable to get England to consent to renew that Covenant, and if it be, whether they themselves will undertake to gain their consent. (5.) Whether we can renew it without their consent, and whether, in that case, it would be a league and covenant. (6) Whether that league and covenant obliges us by open force to constrain them to extirpate prelacy, when they are not willing and do not consent to it. (7) Whether it be in our power to do it. And, (8) Whether it were lawful for us to do it if it were in our power; and whether ever our blessed Lord gave any such commandment to his followers by the power of the sword to reform nations, as it is said Mahomet gave to his followers, and Romish antichrist has too much practiced. Another heavy charge against the Church of Scotland, on which these people ground their schism and separation, is, that the breaches of these covenants, and other such sins of public defection, are not, or have not been, publicly acknowledged. But this is very uncharitable, for, 1690, there was a very full acknowledgment and enumeration of those sins, and of defection in the causes of the fast emitted by that Assembly… For breach of covenant is really among the causes of that fast [in 1706], seeing the act expressly requires ministers both to warn of and confess the national sins enumerated in causes of fast 1690, 1700, and 1701, in all which breach of covenant is very particularly acknowledged… And now, if that be a sufficient ground of separation from the Church of Scotland, I could appeal to all the Protestant Churches in Europe… Another charge against mhiisters, wherefore they are to be separated from, is because our civil rulers have only asserted as the ground of their re-establishing Presbytery, that it was more agreeable to the people’s inclinations, etc.; ergo [therefore], ministers must be disowned. But have any ministers ever asserted that this is the only ground; have they not, do they not plead its divine right? Yea, if I mistake not, even the Parliament, in one of the acts, have asserted its being agreeable to and founded upon the Word of God. But I am weary of these things, and therefore will not go furder, nor meddle with that which seems to be also a great prejudice against ministers, their subjecting to the Government and our present Queen, who is of the communion of the Church of England. But, would ever our worthy Reformers, of whom they so much boast, have refused subjection to King James the Sixth and his son King Charles [I], because of that communion? Would they not have been well satisfied, if they had but suffered the Church of Scotland to enjoy her privileges? But I must now forbear, and remember I am not writing an answer to that paper, nor do I design it… I had forgot to signify, that though the author of the Modest Reply greatly quarrels [with] our Church constitution, yet, from what appears through his discourse, there is too much ground to apprehend that the great eye-sore is the civil constitution, and hinc illae lacrymae [hence those tears]!</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. The greatest charge… appears [to be] that the Church of Scotland does not press the renewing of the Covenants, National [1638] and Solemn League [1643]. But there are several things as to this that they take no notice of, which, if noticed, might, in a great measure, allay their clamour: (1) That the National Covenant is, indeed, a confession of our faith, very praiseworthy in its time, but I conceive, for variety and perspicuity, not to be compared with the Westminster Confession, which we own and press. (2) That the Westminster Confession is ratified in King William’s Parliament, and the other [the National Covenant] was approven [implicitly, not explicitly] by the last Parliament of King Charles the Second [in 1681], where I think [James] the Duke of York presided, and included [it] in the bosom of the Test [for civil office] as a point thereof; which honour I believe that Parliament would not have given to the Westminster Confession. (3) As to the Solemn League, they would do well to consider, more seriously, what that answer does overly take notice of, p. 13, near the beginning, viz. that the [General] Assembly [of the Church of Scotland] appoints its being subscribed by all the true professors of the Reformed religion, only after its reception and approbation in the kingdom of England. But they should have considered further, that the Assembly, for aught I can find, by their act, do not appoint even that it be subscribed, only they recommend to the honorable Convention of Estates, that, being examined and approved by them, it may be sent to England, to be received and approven there, that after that it may be, with all religious solemnity, sworn, etc. (4) They would consider whether it be practicable to get England to consent to renew that Covenant, and if it be, whether they themselves will undertake to gain their consent. (5.) Whether we can renew it without their consent, and whether, in that case, it would be a league and covenant. (6) Whether that league and covenant obliges us by open force to constrain them to extirpate prelacy, when they are not willing and do not consent to it. (7) Whether it be in our power to do it. And, (8) Whether it were lawful for us to do it if it were in our power; and whether ever our blessed Lord gave any such commandment to his followers by the power of the sword to reform nations, as it is said Mahomet gave to his followers, and Romish antichrist has too much practiced. Another heavy charge against the Church of Scotland, on which these people ground their schism and separation, is, that the breaches of these covenants, and other such sins of public defection, are not, or have not been, publicly acknowledged. But this is very uncharitable, for, 1690, there was a very full acknowledgment and enumeration of those sins, and of defection in the causes of the fast emitted by that Assembly… For breach of covenant is really among the causes of that fast [in 1706], seeing the act expressly requires ministers both to warn of and confess the national sins enumerated in causes of fast 1690, 1700, and 1701, in all which breach of covenant is very particularly acknowledged… And now, if that be a sufficient ground of separation from the Church of Scotland, I could appeal to all the Protestant Churches in Europe… Another charge against mhiisters, wherefore they are to be separated from, is because our civil rulers have only asserted as the ground of their re-establishing Presbytery, that it was more agreeable to the people’s inclinations, etc.; ergo [therefore], ministers must be disowned. But have any ministers ever asserted that this is the only ground; have they not, do they not plead its divine right? Yea, if I mistake not, even the Parliament, in one of the acts, have asserted its being agreeable to and founded upon the Word of God. But I am weary of these things, and therefore will not go furder, nor meddle with that which seems to be also a great prejudice against ministers, their subjecting to the Government and our present Queen, who is of the communion of the Church of England. But, would ever our worthy Reformers, of whom they so much boast, have refused subjection to King James the Sixth and his son King Charles [I], because of that communion? Would they not have been well satisfied, if they had but suffered the Church of Scotland to enjoy her privileges? But I must now forbear, and remember I am not writing an answer to that paper, nor do I design it… I had forgot to signify, that though the author of the Modest Reply greatly quarrels [with] our Church constitution, yet, from what appears through his discourse, there is too much ground to apprehend that the great eye-sore is the civil constitution, and hinc illae lacrymae [hence those tears]!”

— Robert Wodrow, Letter 39, ‘Vindication of the Church of Scotland in Answer to a Cameronian Pamphlet’ (1710) in The Correspondence of the Rev. Robert Wodrow, 3 vols. (Edinburgh: Wodrow Society, 1842), vol. 1, pp. 122-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+greatest+charge%E2%80%A6+appears+%5Bto+be%5D+that+the+Church+of+Scotland+does+not+press+the+renewing+of+the+Covenants%2C+National+%5B1638%5D+and+Solemn+League+%5B1643%5D.+But+there+are+several+things+as+to+this+that+they+take+no+notice+of%2C+which%2C+if+noticed%2C+might%2C+in+a+great+measure%2C+allay+their+clamour%3A+%281%29+That+the+National+Covenant+is%2C+indeed%2C+a+confession+of+our+faith%2C+very+praiseworthy+in+its+time%2C+but+I+conceive%2C+for+variety+and+perspicuity%2C+not+to+be+compared+with+the+Westminster+Confession%2C+which+we+own+and+press.+%282%29+That+the+Westminster+Confession+is+ratified+in+King+William%E2%80%99s+Parliament%2C+and+the+other+%5Bthe+National+Covenant%5D+was+approven+%5Bimplicitly%2C+not+explicitly%5D+by+the+last+Parliament+of+King+Charles+the+Second+%5Bin+1681%5D%2C+where+I+think+%5BJames%5D+the+Duke+of+York+presided%2C+and+included+%5Bit%5D+in+the+bosom+of+the+Test+%5Bfor+civil+office%5D+as+a+point+thereof%3B+which+honour+I+believe+that+Parliament+would+not+have+given+to+the+Westminster+Confession.+%283%29+As+to+the+Solemn+League%2C+they+would+do+well+to+consider%2C+more+seriously%2C+what+that+answer+does+overly+take+notice+of%2C+p.+13%2C+near+the+beginning%2C+viz.+that+the+%5BGeneral%5D+Assembly+%5Bof+the+Church+of+Scotland%5D+appoints+its+being+subscribed+by+all+the+true+professors+of+the+Reformed+religion%2C+only+after+its+reception+and+approbation+in+the+kingdom+of+England.+But+they+should+have+considered+further%2C+that+the+Assembly%2C+for+aught+I+can+find%2C+by+their+act%2C+do+not+appoint+even+that+it+be+subscribed%2C+only+they+recommend+to+the+honorable+Convention+of+Estates%2C+that%2C+being+examined+and+approved+by+them%2C+it+may+be+sent+to+England%2C+to+be+received+and+approven+there%2C+that+after+that+it+may+be%2C+with+all+religious+solemnity%2C+sworn%2C+etc.+%284%29+They+would+consider+whether+it+be+practicable+to+get+England+to+consent+to+renew+that+Covenant%2C+and+if+it+be%2C+whether+they+themselves+will+undertake+to+gain+their+consent.+%285.%29+Whether+we+can+renew+it+without+their+consent%2C+and+whether%2C+in+that+case%2C+it+would+be+a+league+and+covenant.+%286%29+Whether+that+league+and+covenant+obliges+us+by+open+force+to+constrain+them+to+extirpate+prelacy%2C+when+they+are+not+willing+and+do+not+consent+to+it.+%287%29+Whether+it+be+in+our+power+to+do+it.+And%2C+%288%29+Whether+it+were+lawful+for+us+to+do+it+if+it+were+in+our+power%3B+and+whether+ever+our+blessed+Lord+gave+any+such+commandment+to+his+followers+by+the+power+of+the+sword+to+reform+nations%2C+as+it+is+said+Mahomet+gave+to+his+followers%2C+and+Romish+antichrist+has+too+much+practiced.+Another+heavy+charge+against+the+Church+of+Scotland%2C+on+which+these+people+ground+their+schism+and+separation%2C+is%2C+that+the+breaches+of+these+covenants%2C+and+other+such+sins+of+public+defection%2C+are+not%2C+or+have+not+been%2C+publicly+acknowledged.+But+this+is+very+uncharitable%2C+for%2C+1690%2C+there+was+a+very+full+acknowledgment+and+enumeration+of+those+sins%2C+and+of+defection+in+the+causes+of+the+fast+emitted+by+that+Assembly%E2%80%A6+For+breach+of+covenant+is+really+among+the+causes+of+that+fast+%5Bin+1706%5D%2C+seeing+the+act+expressly+requires+ministers+both+to+warn+of+and+confess+the+national+sins+enumerated+in+causes+of+fast+1690%2C+1700%2C+and+1701%2C+in+all+which+breach+of+covenant+is+very+particularly+acknowledged%E2%80%A6+And+now%2C+if+that+be+a+sufficient+ground+of+separation+from+the+Church+of+Scotland%2C+I+could+appeal+to+all+the+Protestant+Churches+in+Europe%E2%80%A6+Another+charge+against+mhiisters%2C+wherefore+they+are+to+be+separated+from%2C+is+because+our+civil+rulers+have+only+asserted+as+the+ground+of+their+re-establishing+Presbytery%2C+that+it+was+more+agreeable+to+the+people%E2%80%99s+inclinations%2C+etc.%3B+ergo+%5Btherefore%5D%2C+ministers+must+be+disowned.+But+have+any+ministers+ever+asserted+that+this+is+the+only+ground%3B+have+they+not%2C+do+they+not+plead+its+divine+right%3F+Yea%2C+if+I+mistake+not%2C+even+the+Parliament%2C+in+one+of+the+acts%2C+have+asserted+its+being+agreeable+to+and+founded+upon+the+Word+of+God.+But+I+am+weary+of+these+things%2C+and+therefore+will+not+go+furder%2C+nor+meddle+with+that+which+seems+to+be+also+a+great+prejudice+against+ministers%2C+their+subjecting+to+the+Government+and+our+present+Queen%2C+who+is+of+the+communion+of+the+Church+of+England.+But%2C+would+ever+our+worthy+Reformers%2C+of+whom+they+so+much+boast%2C+have+refused+subjection+to+King+James+the+Sixth+and+his+son+King+Charles+%5BI%5D%2C+because+of+that+communion%3F+Would+they+not+have+been+well+satisfied%2C+if+they+had+but+suffered+the+Church+of+Scotland+to+enjoy+her+privileges%3F+But+I+must+now+forbear%2C+and+remember+I+am+not+writing+an+answer+to+that+paper%2C+nor+do+I+design+it%E2%80%A6+I+had+forgot+to+signify%2C+that+though+the+author+of+the+Modest+Reply+greatly+quarrels+%5Bwith%5D+our+Church+constitution%2C+yet%2C+from+what+appears+through+his+discourse%2C+there+is+too+much+ground+to+apprehend+that+the+great+eye-sore+is+the+civil+constitution%2C+and+hinc+illae+lacrymae+%5Bhence+those+tears%5D%21%E2%80%9D%0A%0A%E2%80%94+Robert+Wodrow%2C+Letter+39%2C+%E2%80%98Vindication+of+the+Church+of+Scotland+in+Answer+to+a+Cameronian+Pamphlet%E2%80%99+%281710%29+in+The+Correspondence+of+the+Rev.+Robert+Wodrow%2C+3+vols.+%28Edinburgh%3A+Wodrow+Society%2C+1842%29%2C+vol.+1%2C+pp.+122-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b2b566a7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5b2b566a7a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=2.%20The%20greatest%20charge%E2%80%A6%20appears%20%5Bto,hinc%20illae%20lacrymae%20%5Bhence%20those%20tears%5D%21" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-acd534d569" data-kw="">
<blockquote><p>For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.</p></blockquote>

</figure><figure class="quote" id="q-6d72d73003" data-kw="">
<blockquote><p>The language here employed is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 1</cite>, p. 76</span></figcaption>

</figure><figure class="quote" id="q-38d43ec2b4" data-kw="">
<blockquote><p>But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690… (1706; Edinburgh: Gray, 1747)</cite>, pp. 29-31</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.”

<blockquote><p>(2.) [Informatory Vindiction:] ‘We distinguish between a Church in a growing case, coming forward out of darkness, and advancing in reformation, and a Church declining and going back again. In the former many things may be born with, which, in the latter, are noways to be yielded unto, as in the time of the former prelacy many did hear prelatical men,’ etc. In times of defection and division, the Church was declining and going back, and in that case it was needful to be very peremptory in tenaciousness: But now she is growing and coming forward out of darkness, and advancing, though weakly, in reformation; and therefore now, sure it must be born with to hear presbyterian ministers, though formerly guilty of defections, as much as in former times to hear prelatical men. (3.) ‘We diftinguished between a Church and a reformed and settled state, and a Church in a broken and disturbed state.’ In times of defection and division, it was thought the: ‘most lawful expedient and conducive mean for maintaining the attained unto reformation, to abstract and withdraw from such disorders in ministers, which we could not otherwise get rectified.’ But now that is neither the lawful expedient, nor conducible mean to maintain reformation, but rather the way to obstruct it, to withdraw from ministers, whose former disorders we would have rectified in a case where the Church is settled, so far as to have liberty to keep General Assemblies to rectify them, and the government thereof is confirmed with the civil sanction of acts of parliament. … (6.) ‘We distinguished between a faithful and a sinless ministry.’ In times of defection and division, we might, for the want of the former qualification withdraw, that is, when they were not faithful.’ But now when they are more faithful, we cannot withdraw, except we would withdraw from them because they are not sinless, which in no case can be a ground.</p></blockquote>

</figure><figure class="quote" id="q-87ef79049c" data-kw="">
<blockquote><p>When these two unhappy principles were first invented and practised, whereof Mr. Hamilton was chief, viz. that ‘Every difference of judgment in our national controversies is a ground of separation;’ and that ‘There is no way of keeping up and managing a testimony, but by separation,’ which has a direct tendency to dissolve the unity of all churches, break all Christian societies, and ruin the whole frame of the good old cause of Presbyterianism, which was faithfully and with soul-abhorrence witnessed against at the very first out-breaking thereof by blest [Robert] M‘Ward, both privily and publickly in his writings against the same, of which I formerly gave some account.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols., ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript</cite>, p. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-11fa616f61" data-kw="">
<blockquote><p>I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton [was 39-40 years old], who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world; but it is straight before me, and I firmly resolve, if the Lord will, to give a more distinct account of the rise, steps, and unheard-of heights of all the right-hand extremes that have been in Scotland these 49 years, past and present; and set them up as beacons to the following ages, to beware of splitting upon such dangerous rocks. … But it is plain that these formed, divided parties of Dissenters are so puffed up with a frothy conceit of themselves and their actings, that they speak and write with, as if religion, zeal and faithfulness, wit and sense, would live and die with them; and none [other are held] to know anything of the times, nor what Israel ought to do, disdaining, disesteeming, disregarding, rash and harsh constructing of all who differ from, or oppose, them or their way of managing of a testimony; the very reverse of a gospel spirit. And I am sadly confirmed, by the many, long, melancholly debates these 48 years, of the truth of this spiritual pride rampant amongst them.</p></blockquote>

</figure><figure class="quote" id="q-f2de4a259d" data-kw="">
<blockquote><p>…and every party pretending to be the only Anti’s [anti-Erastian, anti-Popish, etc. persons] in the kingdom, against all evil things, and for all good; maintaining and transmitting the testimony, as it was handed down to the [Glorious] Revolution [1689]: yet they all agree in these two Anti-Presbyterian principles in such a period: [1.] In a positive proclaiming their disowning of the State, and separation from the Church and [from] all ministers and members that dare not go up with them in every jot in their over-stretched consequences. 2. They all agree against paying of all Crown-dues, even under this peaceable [civil] government under which we enjoy religion, life, and liberty. Which never any of our ministers, martyrs, did preach or witness against… It is a piece of demented infatuation to make little or no difference betwixt that period and this, and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols., ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript</cite>, pp. 142-43</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…and every party pretending to be the only Anti’s [anti-Erastian, anti-Popish, etc. persons] in the kingdom, against all evil things, and for all good; maintaining and transmitting the testimony, as it was handed down to the [Glorious] Revolution [1689]: yet they all agree in these two Anti-Presbyterian principles in such a period: [1.] In a positive proclaiming their disowning of the State, and separation from the Church and [from] all ministers and members that dare not go up with them in every jot in their over-stretched consequences. 2. They all agree against paying of all Crown-dues, even under this peaceable [civil] government under which we enjoy religion, life, and liberty. Which never any of our ministers, martyrs, did preach or witness against… It is a piece of demented infatuation to make little or no difference betwixt that period and this, and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.”

</figure><figure class="quote" id="q-3e4e9351e1" data-kw="">
<blockquote><p>On the part of the people generally, of course, there was no intention of seeking an armed confrontation with the government. The only aim of the majority who attended the field-meetings was to worship God according to their consciences–and to resort to justified self-defence if pushed to extremity… By 1677–or at least by the end of that year–a movement had become established which sought to stiffen the pattern of resistance, and in various ways to carry the battle to the authorities. The acknowledged leader of this movement was Robert Hamilton [who was 27 years old]… Hamilton, who had earlier had a reputation as a profligate, had apparently undergone a radical spiritual experience, and had set himself up as a champion of orthodoxy and of opposition to compromise… …Hamilton and his associates… With their support, and primarily at their instigation, some of the younger preachers began to hold meetings on the boundaries of, and even within, the parishes of such [indulged] ministers, with the object of drawing away their people from attending their services. This unmistakably aggressive stance was fully in line with Hamilton’s view of how to proceed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron (Durham: Evangelical Press, 1997)</cite>, pp. 76-77</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-9984774744" data-kw="">
<blockquote><p>…even by 1679 there were some twenty or thirty ministers still preaching in the fields, and no significant decline in the number of their hearers. But the year 1679 was to bring a very radical change and to usher in an era of persecution on a scale hitherto unknown. To some extent this situation resulted from the annoyance caused to the government by the activities of Robert Hamilton and his followers, who were by now acting as a kind of sel-appointed armed bodyguard to Cameron in his preaching tours about the country. Hamilton had already been involved, as early as November 1677, in a violent incident at the home of his friend John Balfour of Kinloch, in Fife [a principal actor in the assassination of Archbishop James Sharp in 1679], when a party of soldiers who approached the house were fired upon and one of them was seriously wounded. How far Hamilton himself may have been responsible for incidents of this kind is not altogether clear…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill (Durham: Evangelical Press, 1988)</cite>, p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-3051b669e2" data-kw="">
<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>

</figure><figure class="quote" id="q-b20d062e0f" data-kw="">
<blockquote><p>Cameron, for his part, clearly regretted the breach with [the leading non-conformist minister John] Welsh, though Hamilton, with his more argumentative nature, was more inclined to glory in it than otherwise.</p></blockquote>

</figure><figure class="quote" id="q-834e490251" data-kw="">
<blockquote><p>Hamilton seems to have felt that the tyranny of the times called for more positive action on the part of those who adhered to the [non-conforming, field-preaching] Presbyterian cause, and he is said to have tried, during the summer of 1678, to stir up some of the people in the west into an armed rising against the government [previously the battles had all been defensive]. Whether this allegation is well-founded cannot conclusively be proved… Feelings on the subject [of the Indulgence] ran high, and Cameron and Hamilton were accused of spreading dissension and disunity among the people and of causing disaffection towards ministers who did not share their radical opinions.</p></blockquote>

<blockquote><p>To the older ministers, however, these events were a cause for dismay… Particular indignation was directed against Hamilton, who was widely regarded as an interloper and troublemaker. Typical was an outburst by Williamson, who inveighed against ‘laymen, ignorant, idle men’, who had ‘taken upon them to meddle in the matter of church government without a call’. The clerk to the Dunscore meeting happened to meet Hamilton in the street and told him that he ‘had been a black sight to that country’ and that he ‘had set all on a fire’. Hamilton, true to character, rejoined that he was ‘satisfied to hear of any such effect, for they stood much in need of fire to thaw their frozen spirits’.</p></blockquote>

</figure><figure class="quote" id="q-3fd5c64a6f" data-kw="">
<blockquote><p>Largely as a result of the influence of Robert Hamilton, [in early 1679] there was less of a spirit of passive resistance and a greater determination to carry the battle to the authorities. The result was a series of confrontations of increasing violence. These started on 11 March, when Robert Johnstone, the Town Major of Edinburgh, who was noted for his persecution of those who attended unauthorized services, was lured to a house in the city under pretext of dispersing an illegal meeting, and was there set upon by a body of men, of whom Cameron’s brother Michael was one. On 30 March, when a field-meeting at Cummerhead, near Lesmahagow, was challenged by a party of soldiers, the response form those present was so robust that some of the soldiers were wounded and made prisoner, and the lieutenant in charge barely escaped with his life. Three weeks later a government trooper was shot dead, and another seriously wounded, in an attack by a body of armed men on their sleeping-quarters at Newmilns, in Ayshire. The blame for these and other incidents was, of course, attributed to Hamilton and his supporters, though there are good grounds to believe that some of them, particularly the last, were caused by rogue elements which had infiltrated his following and which he could not properly control.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron (Durham: Evangelical Press, 1997)</cite>, p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

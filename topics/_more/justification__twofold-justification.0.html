<blockquote><p>A fifth argument is that which so much sounds in all books: If good works be the effect and fruit of our justification, then they cannot be conditions, or causa sine qua non [a cause without which: nothing] of our justification. The consequence is clear, because such a supposed condition, or causa sine qua non, must be antecedent, and going before. Now the Orthodox bring Augustine’s known position, which also may be made good out of Scripture, Bona opera non praecedunt justificandum, sed sequuntur justificatum [‘Good works do not precede being justified, but follow having been justified’]; and another to that sense is quoted out of Gregory: Non per opera venitur ad fidem, sed per fidem ad opera [‘not through works is one come to faith, but through faith to works’], faith must go before works. Till we are justified, we are not able to do anything that is good… Seeing therefore that justification is antecedent to a holy life, good works cannot be any condition of it; and by this we may see that more things are required to our salvation than to our justification; to the possession of heaven and [versus] the entitling us thereunto. For justification does entitle and interest us in that eternal inheritance which is performed by faith; but to be made actual partakers of everlasting happiness, good works are the way to that Kingdom, not the cause of it. Therefore none contend more then the Orthodox writers for the necessity of good works, and that in respect of salvation; yet in respect of our justification, then the Scripture calls them a menstruous rag and such as are utterly unworthy. It’s true that justification cannot be continued in a man unless he continue in good works, yet for all that they are not conditions of his justification: they are qualifications and determinations of the subject who is justified, but no conditions of his justification. As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God. Its a thousand times affirmed by our divines, many things are required to the constitution of some subject, which yet are not either causes or conditions of such and such an effect: Light is necessarily required and dryness as qualities in fire, yet it burns as it’s hot, not as light or dry. To the integral being of a man are required his head and shoulders, so that the eye could not see if not seated there; yet a man’s shoulders are not the causa sine qua non of his seeing. Many things are necessarily conjoined together, and yet one is not the condition of the others’ effect. So that this doctrine does not exclude, but [does] command holy works, only it gives faith and works their proper place.</p></blockquote>

rks%20their%20proper%20place" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) Works required by the Law are either wrought before faith, without the aid of grace; or after believing, by the help of the Holy Ghost. The former are excluded from our justification, but not the latter. (3) Works of Obedience wrought after grace received, may be considered either as sincere only, or absolutely perfect according to what was originally required in the Covenant of Works. Those of the latter sort are excluded from any place in our justification, but not those of the former. … (5) Justification may be considered either as to its beginning or as unto its continuation, and so it has diverse causes under these diverse respects. (6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non [without which nothing]. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>

<blockquote><p>There is no grace, no duty, for the substance of them, nor for the manner of their performance, that are required either by the Law or the gospel, but they [justified persons] are obliged unto them. Where they are omitted, we acknowledge that the guilt of sin is contracted, and that attended with such aggravations, as some will not own or allow to be confessed unto God Himself. Hence in particular the faith and grace of believers, do constantly and deeply exercise themselves in godly sorrow, repentance, humiliation for sin, and confession of it before God, upon their apprehensions of its guilt. And these duties are so far necessary unto the continuation of our justification as that a justified estate cannot consist with the sins and vices that are opposite unto them. So the apostle affirms, that if we live after the flesh, we shall die, Rom. 8:13. He that does not carefully avoid falling into the fire or water, or other things immediately destructive of life natural, cannot live. But these are not the things whereon life does depend. Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. If this be that which is intended in this position, the continuation of our justification depends on our own obedience and good works, or that our own obedience and good works are the condition of the continuation of our justification, namely that God does indispensably require good works and obedience in all that are justified, so that a justified estate is inconsistent with the neglect of them, it is readily granted, and I shall never contend with any about the way whereby they choose to express the conceptions of their minds. … All other works and duties of obedience do accompany faith in the continuation of our justified estate, as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith that brings in the full accomplishment of the promises, Heb. 6:12, 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), pp. 207-11</span></figcaption>

</figure><figure class="quote" id="q-fa0c0168f5" data-kw="">
<blockquote><p>It is asked, moreover, whether or not we seek forgiveness of sins—that is, the first aspect of justification—from God on a daily basis? And if so, how can we say that justification is completed once and for all in this life? I respond that when we pray for the remission of sins, we are not praying for that benefit as if it were not already given to us. Rather, we are praying for the increase of our faith, and for the application of that benefit which is ours through faith and faith’s increase.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-4687edc845" data-kw="">
<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace, or an Exposition upon Luke 1:73-75</cite>, (Dublin, 1631), ch. 5, pp. 290-91</span></figcaption>

</figure><figure class="quote" id="q-441e778cae" data-kw="">
<blockquote><p>It must be diligently observed, that though justification be but one individual act in respect of the Father, Son and Holy Ghost, in the first act of faith, and conversion of a sinner, whereby the person of a man stands justified before God, and shall, without intercision of justification and loss of this favor of God, stand before the barre of God’s tribunal, and is, and always shall be absolutely justified and acquitted from all sins past, present and to come, because all obligations and handwritings against him, are in that act cancelled and blotted out: he forgiving all trespasses, Col. 2:13-14. Yet it must be known, that of this act there is (as it were) a double sentence: First, in court of heaven, at which time the elect in Christ have their names enrolled in the book of God’s effectual calling, and are numbered among the just, which sentence can never be revoked or blotted out: this is that which was passed with God (that I may so speak, after the manner of men) in the first act of conversion. Secondly, this sentence of forgiveness is passed in the court of the conscience of him that had the former sentence pronounced for him in heaven. This sentence is the second act of the holy Ghost, wrought in this manner. First, after that a sinner is cōvinced of his guiltiness of sin, and of his damnable condition because of his sin, then forgiveness is offered, and pronounced to the ear in that gracious promise of salvation to all that believe in Christ Jesus, which promise is proclaimed in the ministry of the Gospel, in which light of the Gospel, he shows unto a man possibility of salvation, setting before him (I speak of men of years and understanding) Christ the means of salvation; and by this means the Holy Ghost works faith in Christ; then confession and grief for sin; then prayer to ask forgiveness; and grace to live godly, and then does witness to his spirit that he is accepted of God. Thus sentence is pronounced in the conscience: from whence arises sense of God’s love, which is called the shedding abroad of the love of God in our hearts by the Holy Ghost, Rom. 5:5, also sense of the loving countenance of God, which is the sign of his loving kindness, and is that speech of God, by which he does say to our souls, he is our salvation, and then arises in our hearts peace of conscience, and joy in the Holy Ghost. This sentence of forgiveness unto the conscience has different degrees: it is sometimes more clear in the apprehension of the soul, sometimes more dim, yea sometimes quite blotted out in the counterpane of our release, or copy of our acquittance; as it was with David, Ps. 51, so that a person perfectly just before God, has sometime little or no sense or apprehension of it in his own conscience, but doubts whether he be in state of grace or no. Which happens because of the stain and guilt of new sins, which guilt abides in the conscience, until a man do confess his sins, repent, and ask forgiveness, and, by a renewed faith, apply forgiveness: by which means the evidence of his pardon is again by the Holy Ghost exemplified, and sentence by this new application is again pronounced in his conscience; whence arises new assurance of salvation, and renewed joy in the Holy Ghost. This is that justification, which for distinction sake, Divines call justification by parts, or continued, or repeated justification, or new application of one and the same justification: which justification though in respect of the sentence pronounced in heaven, is one individual act, whereby a man standeth alwayes just before God; yet in respect of the pronouncing of that sentence to the heart, it is not actually applied; neither can a particular sinne be said to be everie way actually forgiven, until after it have beene committed, is confessed, and repented of; nor untill forgivenesse be asked, and until the holy Ghost hath made new application thereof unto the conscience, through renewing of faith, by which a man doth again and again, as new sins are committed, apply the merits of the blood of Christ unto his soul. Also it must be known that the sentence of pardon which is passed in heaven with God, is not fully executed until the last degree of it, when sentence of absolution shall be pronounced by Christ Jesus: Come ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world, Matt. 25.34. It must moreover be conceived and held, that notwithstanding this distinction of justification between an absolute justification in respect of God, and a justification by parts in respect of application to mans conscience, there are not two kinds of justification, a first and a second, as the Papists hold: but one and the same justification, considered in different respects. In respect of God’s actual acceptation of a man’s person, justification is absolute; but in respect of the actual application and manifestation of God’s acceptation unto a mans conscience, justification is by parts and degrees. When a man already justified asks forgiveness, he doth not ask a new justification, but a second or new application of pardon unto the conscience of those particular sins which are daily committed, together with continuance of God’s favor, and more clear evidence that he is sealed up unto the day of redemption. The third thing to be spoken of for the better understanding the word [forgive] concerns the effects following the apprehension thereof; these are peace of conscience, and joy in the holy Ghost. These things touching justification and remission of sins being opened, we may understand what is prayed for, when we say, Forgive sins. We pray… Secondly, we pray that ourselves and others being justified and accepted into favor, it would please the Lord to continue this his favor, and that he would signify and make the same known to our hearts and consciences daily, by a new testification of the holy Ghost, accompanied with a new application of pardon for new sins daily committed, and that we may have more and more assurance of our perfect redemption at the day of judgment; and that we may have peace of conscience, and joy in the Holy Ghost, in the meantime.</p></blockquote>

<blockquote><p>20. Justification does not free from sin and death directly by taking away the blame or stain or all the effects of sin; rather it removes the guilty obligation to undergo eternal death. Rom. 8:1, 33-34, ‘There is no condemnation… Who shall lay anything to their charge?… who shall condemn? 21. Nor does it take away guilt so that the deserving of punishment is removed from sin. This cannot be taken away as long sin itself remains. But justification does take away guilt so that its haunting or deadly effects vanish. … 23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning. 25. Yet those who are justified need daily the forgiveness of sins. This is true because the continuance of grace is necessary to them; the consciousness and manifestation of forgiveness increases more and more as individual sins require it; and the execution of the sentence which is pronounced in justification may thus be carried out and completed.</p></blockquote>

<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>

<blockquote><p>But believers sin greatly after they are in a justified state, and so stand in need of renewed pardon, from time to time. That believers sin after they are in a justified state, sad experience, as well as God’s Word, does daily show; but the sins of those who are in a justified state come under another consideration, for their “persons are not under the law,” (or legal covenant) Rom. 6:14. They are in Christ, who is “the end of the law for righteousness, to every one that believeth,” Rom. 10:4. So that as believers have nothing to do with the law, so as to seek justification for their persons, by their obedience to the same; neither can the law, with its condemning power, reach them, so as to bring them into legal condemnation again: so that unless the covenant of grace be made void, the believer’s justified state remains, and he is no more under the law forever. … But if the saints are not under the law, or legal covenant, then it should seem from thence that they need no pardon of sin, and so ought not in their daily prayers to pray for the same: so where there is no law there is no transgression. Though believers are not under the law, or legal covenant, yet it does not from thence follow that they stand in no need of daily pardon. Indeed, they stand not in need of such pardon as unbelievers stand in need of, they are under a legal condemnation, obnoxious to the curse, and stand in need of a change of their state, God being to them a God of terror. But if at any time they are, through grace, brought savingly to believe in Christ, then God, as a God of all grace, freely justifies them, by remitting of their sins, and imputing of Christ’s righteousness for their justification, and properly this is Scripture justification, Rom. 4:6, 8. But believers standing in relation to God, as children to a tender-hearted Father, this alters the case quite, and shows a vast difference between the state of the one and of the other, the believer being “justified from all things,” Acts 13:39, and the unbeliever being “condemned already,” John 3:18. Now though God deal as a Judge with those that continue in their unbelief, yet He deals as a tender-hearted Father with all true believers. “Like as a father pitieth his children, so the Lord pitieth them that fear him: yea, he remembereth that we are dust,” Ps. 103:13-14. Now when the saints sin against a loving Father, then does God come forth with his fatherly corrections: “Then will I visit their transgressions with the rod, and their iniquity with stripes,” Ps. 89:32. And sometimes in a very sore manner; “Behold thou art wroth, for we have sinned,” Isa. 64:5. Indeed the sins of the saints shall not make void God’s covenant, therefore the prophet comes in the next words, saying, In those, that is, in thy mercies, is continuance, and we shall be saved; yet they highly provoke a tender-hearted Father by sinning against Him; and as often as the saints sin against their heavenly Father, in this their new covenant relation, so oft they stand in need of fatherly forgiveness. Thus with holy David, who had sinned in the matter of Uriah, yet when brought to confess the same, “Nathan said unto David, The Lord hath put away thy sin, thou shalt not die,” 2 Sam. 12:13; for by God’s law adulterers ought to be put to death, Lev. 20:10. Now God remitting this temporal chastisement to David, is said to pardon, or put away his sin: and the Church cried out, Lam. 3:42, “We have transgressed and rebelled, thou hast not pardoned;” that is, their afflictions were not removed. And in this sense God oft lets sin lie on his otherwise justified children for some time unpardoned, and as often as He is pleased to remit these chastisements, so often He may be said to pardon his children; and as long as the saints sin against their God and Father in their new covenant relation, so long shall we need renewed pardon, which will be whilst we are in this world. And this should keep the saints at the throne of grace, daily begging of pardon, confessing of sin, bewailing of corrupt nature, and entreating a farther discovery of their covenant state. Now in this respect, the saints daily need pardon of sin, and a more full discovery of their new covenant relation with God; so that it is not true in every respect, you see, to say all pardon is at once: but with respect to the justifying of our persons, in a proper sense, justification is but one constant, complete act of grace, admitting of no degrees, nor revocation, but remains firm for ever. But if God correct his justified children for their sins, does it not dishonour the cross of Christ? That God does correct his saints here for their sins, and not only from them, as some would have it, is most plain from the New, as well as from the Old Testament… So that though God does not, as a judge, take vengeance on his justified children for their sins, yet as a loving Father He assuredly corrects them when they go astray. And certainly there can be no good argument drawn from the perfection of Christ’s satisfaction, to exempt believers from fatherly corrections here for their going astray. Nay, holy David looks on God’s corrective dispensations, as his keeping of covenant with him: “I know, O Lord, thy judgments are right (that is, thy corrections) and that them in faithfulness hast afflicted me,” Ps. 119:75.</p></blockquote>

eir+sins%2C+and+imputing+of+Christ%E2%80%99s+righteousness+for+their+justification%2C+and+properly+this+is+Scripture+justification%2C+Rom.+4%3A6%2C+8.+But+believers+standing+in+relation+to+God%2C+as+children+to+a+tender-hearted+Father%2C+this+alters+the+case+quite%2C+and+shows+a+vast+difference+between+the+state+of+the+one+and+of+the+other%2C+the+believer+being+%E2%80%9Cjustified+from+all+things%2C%E2%80%9D+Acts+13%3A39%2C+and+the+unbeliever+being+%E2%80%9Ccondemned+already%2C%E2%80%9D+John+3%3A18.+Now+though+God+deal+as+a+Judge+with+those+that+continue+in+their+unbelief%2C+yet+He+deals+as+a+tender-hearted+Father+with+all+true+believers.+%E2%80%9CLike+as+a+father+pitieth+his+children%2C+so+the+Lord+pitieth+them+that+fear+him%3A+yea%2C+he+remembereth+that+we+are+dust%2C%E2%80%9D+Ps.+103%3A13-14.+Now+when+the+saints+sin+against+a+loving+Father%2C+then+does+God+come+forth+with+his+fatherly+corrections%3A+%E2%80%9CThen+will+I+visit+their+transgressions+with+the+rod%2C+and+their+iniquity+with+stripes%2C%E2%80%9D+Ps.+89%3A32.+And+sometimes+in+a+very+sore+manner%3B+%E2%80%9CBehold+thou+art+wroth%2C+for+we+have+sinned%2C%E2%80%9D+Isa.+64%3A5.+Indeed+the+sins+of+the+saints+shall+not+make+void+God%E2%80%99s+covenant%2C+therefore+the+prophet+comes+in+the+next+words%2C+saying%2C+In+those%2C+that+is%2C+in+thy+mercies%2C+is+continuance%2C+and+we+shall+be+saved%3B+yet+they+highly+provoke+a+tender-hearted+Father+by+sinning+against+Him%3B+and+as+often+as+the+saints+sin+against+their+heavenly+Father%2C+in+this+their+new+covenant+relation%2C+so+oft+they+stand+in+need+of+fatherly+forgiveness.+Thus+with+holy+David%2C+who+had+sinned+in+the+matter+of+Uriah%2C+yet+when+brought+to+confess+the+same%2C+%E2%80%9CNathan+said+unto+David%2C+The+Lord+hath+put+away+thy+sin%2C+thou+shalt+not+die%2C%E2%80%9D+2+Sam.+12%3A13%3B+for+by+God%E2%80%99s+law+adulterers+ought+to+be+put+to+death%2C+Lev.+20%3A10.+Now+God+remitting+this+temporal+chastisement+to+David%2C+is+said+to+pardon%2C+or+put+away+his+sin%3A+and+the+Church+cried+out%2C+Lam.+3%3A42%2C+%E2%80%9CWe+have+transgressed+and+rebelled%2C+thou+hast+not+pardoned%3B%E2%80%9D+that+is%2C+their+afflictions+were+not+removed.+And+in+this+sense+God+oft+lets+sin+lie+on+his+otherwise+justified+children+for+some+time+unpardoned%2C+and+as+often+as+He+is+pleased+to+remit+these+chastisements%2C+so+often+He+may+be+said+to+pardon+his+children%3B+and+as+long+as+the+saints+sin+against+their+God+and+Father+in+their+new+covenant+relation%2C+so+long+shall+we+need+renewed+pardon%2C+which+will+be+whilst+we+are+in+this+world.+And+this+should+keep+the+saints+at+the+throne+of+grace%2C+daily+begging+of+pardon%2C+confessing+of+sin%2C+bewailing+of+corrupt+nature%2C+and+entreating+a+farther+discovery+of+their+covenant+state.+Now+in+this+respect%2C+the+saints+daily+need+pardon+of+sin%2C+and+a+more+full+discovery+of+their+new+covenant+relation+with+God%3B+so+that+it+is+not+true+in+every+respect%2C+you+see%2C+to+say+all+pardon+is+at+once%3A+but+with+respect+to+the+justifying+of+our+persons%2C+in+a+proper+sense%2C+justification+is+but+one+constant%2C+complete+act+of+grace%2C+admitting+of+no+degrees%2C+nor+revocation%2C+but+remains+firm+for+ever.+But+if+God+correct+his+justified+children+for+their+sins%2C+does+it+not+dishonour+the+cross+of+Christ%3F+That+God+does+correct+his+saints+here+for+their+sins%2C+and+not+only+from+them%2C+as+some+would+have+it%2C+is+most+plain+from+the+New%2C+as+well+as+from+the+Old+Testament%E2%80%A6+So+that+though+God+does+not%2C+as+a+judge%2C+take+vengeance+on+his+justified+children+for+their+sins%2C+yet+as+a+loving+Father+He+assuredly+corrects+them+when+they+go+astray.+And+certainly+there+can+be+no+good+argument+drawn+from+the+perfection+of+Christ%E2%80%99s+satisfaction%2C+to+exempt+believers+from+fatherly+corrections+here+for+their+going+astray.+Nay%2C+holy+David+looks+on+God%E2%80%99s+corrective+dispensations%2C+as+his+keeping+of+covenant+with+him%3A+%E2%80%9CI+know%2C+O+Lord%2C+thy+judgments+are+right+%28that+is%2C+thy+corrections%29+and+that+them+in+faithfulness+hast+afflicted+me%2C%E2%80%9D+Ps.+119%3A75.%E2%80%9D%0A%0A%E2%80%94+William+Bridge%2C+%E2%80%98The+Doctrine+of+Justification+by+Faith%2C+Opened+%26+Applied+from+Rom.+3%3A24-25%2C+%E2%80%A6%E2%80%99+in+Works+%28London%3A+Tegg%2C+1845%29%2C+vol.+5%2C+pp.+384-89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbacfbd6ff5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/bacfbd6ff5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=But%20believers%20sin%20greatly%20after%20they,faithfulness%20hast%20afflicted%20me%2C%E2%80%9D%20Ps.%20119%3A75&amp;text=But%20believers%20sin%20greatly%20after%20they%20are%20in&amp;text=them%20in%20faithfulness%20hast%20afflicted%20me%2C%E2%80%9D%20Ps.%20119%3A75" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>

<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law, unless they should fall into such sins as should ipso facto, forfeit their justified estate, and transfer them from the Covenant of Grace, into the Covenant of Works, which we believe that God in his Faithfulness will preserve them from. And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. Still there abides the true nature of sin in every inconformity unto, or transgression of the Law in justified persons, which stands in need of daily actual pardon. For there is no man that lives and sins not, and if we say that we have no sin, we do but deceive our selves. None are more sensible of the guilt of sin, none are more troubled for it, none are more earnest in supplications for the pardon of it, than justified persons. For this is the effect of the sacrifice of Christ applied unto the souls of believers, as the apostle declares, Heb. 10:1-4, 10, 14, that it does take away conscience condemning the sinner for sin with respect unto the curse of the Law; but it does not take away conscience condemning sin in the sinner, which on all considerations of God and themselves, of the Law and the gospel, requires repentance on the part of the sinner, and actual pardon on the part of God. … …Now the first act of God in the imputation of righteousness cannot be repeated. And the actual pardon of sin after justification is an effect and consequent of that imputation of righteousness. If any man sin, there is a propitiation… Wherefore unto this actual pardon there is nothing required but the application of that righteousness which is the cause of it, and this is done by faith only. … What it is that, when a justified person is guilty of sin (as guilty he is more or less every day) and his conscience is pressed with a sense thereof, as that only thing which can endanger or intercept his justified estate, his favor with God, and title unto glory, he betakes himself unto, or ought so to do, for the continuance of his state, and pardon of his sins, what he pleads unto that purpose, and what is available thereunto…. And is it not of faith alone, which is that grace whereby they apply themselves unto the mercy or grace of God through the mediation of Christ? It is true that faith herein, works and acts itself in and by godly sorrow, repentance, humiliation, self-judging, and abhorrency, fervency in prayer and supplications with an humble waiting for an answer of peace from God, with engagements unto renewed obedience. But it is faith alone that makes applications unto grace in the blood of Christ for the continuation of our justified estate… The Scripture expressly does declare this to be the only way of the continuation of our justification, 1 Jn. 2:1-2, ‘These things write I unto you that you sin not. And if any man sin we have an advocate with the Father, Jesus Christ the Righteous; and he is the propitiation for our sins.’ It is required of those that are justified that they sin not; it is their duty not to sin; but yet it is not so required of them as that if in anything they fail of their duty they should immediately lose the privilege of their justification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, pp. 202-3</span></figcaption>

<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>

<blockquote><p>3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.</p></blockquote>

<blockquote><p>…a man may be said to be justified either intentionally, or virtually, or actually; either in God, or in Christ, or in himself. 1. Intentionally in God in God’s purpose and decree: This is from all eternity, but this decree and intention does not put anything into a state of actual being, but in the fulness of time. 2. Virtually in Christ: And this is from the day of Christ’s passion, and in the virtue of his satisfaction; yet this intends no more but that satisfaction is made and remission purchased by the blood of Christ. 3. Actually in himself: When a man has the possession of justification, immediately after his union with the Lord Jesus Christ. Now this justification considered as it is a state of favor, a covenant state with God, which a man at his first believing is put into, is not reiterated, no more than a wife, after that first entrance into the relation, is frequently made a wife; yet the particular acts of pardon, and imputation of Christ’s righteousness, are continually by God communicated unto the believer. In this respect this actual justification (or particular acts of pardon) has its degrees of progression: The beginning thereof is laid in our first union and incorporation into Christ; the consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission: Between both these, there is a progressive work of justification, by the constant actings of the Spirit, applying the blood of Christ by the hand of faith, to the quiet and comfort of the soul: The first we may term initial justification, the second progressive, the last perfective; the second is the fruit of the first, and the preludial assurance of the last: The first is wrought and sealed in the first sacrament, the second is wrought and sealed in the second sacrament; and both these branches of sacramental justification, are to us the pre-assurance of that complemental and perfective justification, the sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession. It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification: 1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39. 2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ. 4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33. 5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification: 1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39. 2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ. 4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33. 5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.”

<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

<blockquote><p>Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).</p></blockquote>

<blockquote><p>XXII… (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed, such that for the first constitution of justification, besides faith, not even the presence of good works is necessary, just as for the first constitution of fleshly marriage nothing is required but a consent of the spouses, because God justifies the ungodly (Rom. 4:5); then for its continuation their coexistence is required, just as for the continuation of marriage a coexistence of marriage duties is required, because faith working through love is required (Gal. 5:6); and finally for the consummation (insofar as the possession of eternal life is pronounced), the preexistence of good works is also required for the possession of eternal life (Mt. 25:35).</p></blockquote>

<blockquote><p>[You must distinguish:] 20. Betwixt pardon and justification conditional, which is an immediate effect of Christ’s death and resurrection, or rather of the making of the new Covenant. 2. And pardon and justification absolute, when we have performed all the conditions. 21. Betwixt conditional pardon and justification, which is only potential (such is that which immediately follows the enacting of the new Covenant to men before faith, or before they have sinned). 2. And conditional justification, which is actual, and of which the person has true possession, such is our justification after faith, till the Last Judgment, which is ours actually, but yet upon condition of perseverance in faith and sincere obedience. … 25. Betwixt the accusation of the Law (from [which] Christ does justify believers). 2. And the accusation of the Gospel or new Covenant, for not performing its conditions at all (from which no man can be justified, and for which there is no sacrifice). … 27. Betwixt our first possession of justification, which is upon our contract with Christ or mere faith. 2. And the confirmation, continuation and accomplishment of it (whose condition is also sincere obedience and perseverance).</p></blockquote>

<blockquote><p>For as no man receives that general justification which discharges from the guilt of all foregoing sins, but on the concurrence of repentance, faith, a purpose of a new life, and other actions of the same kind; so no man retains a state free from guilt in respect of following sins, but by means of the same actions of believing in God, calling on God, mortifying the flesh, daily repenting and sorrowing for sins daily committed. The reason why all these are required on our part is this: Because these cannot be still absent, but their opposites will be present, which are contrary to the nature of a justified man—As therefore to the conservation of natural life it is necessarily required that a man carefully avoid fire, water, precipices, poisons and other things destructive to the health of the body; so to the conserving of spiritual life, it is necessarily required that a man avoid incredulity, impenitency and other things that are destructive and contrary to the salvation of souls; which cannot be avoided unless the opposite and contrary actions be exercised. And these actions do not conserve the life of grace properly and of themselves by touching the very effect of conservation, but improperly and by accident, by excluding and removing the cause of destruction.</p></blockquote>

<blockquote><p>Justification takes place once for all. It is not repeated, neither is it a process; it is complete at once and for all time. There is no more or less in justification; man is either fully justified, or he is not justified at all. In distinction from it sanctification is a continuous process, which is never completed in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans Publishing Co., 1938), 513–14.</span></figcaption>

<blockquote><p>Verse. 13 For * ‖ not the hearers of the Law are just with God: but the doers of the Law ‖ shall be justified. RHEM. 5. [ 13. Not the hearers] This same sentence agreeable also to Christs words (Mat, 7. 21.) is the very ground of S. James disputation that not faith alone, but good works also do justify, [note] Therefore S. Paul (howsoever some perversely construe his words in other places) meaneth the same that S. James. And here he speaketh * not properly of the first justification, when an Infidel or ill man is made just, who had no acceptable works before to be justified by (of which kind he specially meaneth in other places of this Epistle) but he speaketh of the second justification or increase of former justice, which he that is in Gods grace, daily proceedeth in, by doing all kind of good works, which be justices: and for doing of which, he is just indeed before God, and of this kind doth S. James namely treate. Which is directly against the Heretics of this time, who not only attribute nothing to the works done in sin and infidelity, but esteeme nothing at all of all Christian mens works toward justification and salvation, condemning them unclean, sinful, hypocritical, and Pharisaical: which is directly against these and other Scriptures, and plain blaspheming of Christ and his grace, by whose spirit and cooperation we do them, CARTW. 5 [13. Not the hearers.] And if the wresting of mens words from their honest meaning be a sin worthy of death, what a horrible condemnation waiteth for these Jesuits, that pull and hale the Lords words to a quite contrary meaning then he set them downe. For the Apostle [note] having disputed in the former chapter, that no man hath any righteousness of his owne by any manner of worke. In this second chapter he descendeth to the special cause of the Jews, which of all other might seeme to be exempted from that generallity of Injustice, wherewith he had charged the whole world, the opinion of whose Justice might rise in that they had not only an exact knowledge of the law, in such sort, that every Jew was able after a sort to be a guide unto the blind, and a Doctor to the unlearned: But also for that in some measure of the holy spirit they received, many of [note] them gave their endeavor to do the works of the law, Now the Apostle to throw down this stately &amp; proud Castle of the opinion of their own justice, declareth that the Justification that is of the law, standeth not in the hearing or knowledge of the law, no if (possibly) they could attain the full and perfect knowledge thereof, but in the full and perfect doing and accomplishment thereof, which he doth more expressly set forth to the Galatians, where he requireth to justification by the works [note] of the law a performance of all the commandments, and that constant and perpetual without any intermission or interruption by stepping a hair breadth aside, either on the right hand or on the left. Now that the Apostle meaneth not those only which either heard the law only, or did the outward and civil works of the law, which a mere natural man doth, that but he withal compriseth those which having believed brought forth by the work of the spirit, good fruits; it appeareth diversely. First by the writing of this Epistle, wherein he instructed those that believed in Christ, but not without some wavering in this doctrine which he so largely unfoldeth, as appeareth in that his desire was [note] to come to them, that they might be strengthened. Secondly it appeareth by the testimony of the Prophet Ezechiel, who doth evidently as well by that which goeth before, as by that which cometh after, refer the sentence which the Apostle draweth from him, touching the name of God blasphemed amongst the Gentiles for the Jews sake, unto the true Church and spouse of Christ. And this the floating and unconstant Jesuits have in their marginal note at unawares confessed. wherein they say; It is a great sin that by the evil life of the faithful our Lords name should be evil [note] spoken of. And the example of David, a faithful man, who caused the name of God to be blasphemed, will not suffer us to remaine in any doubt, but that the cause of blaspheming of Gods name may fall into the Church of God. Last of all, this is evident by the examples of Abraham and David, which the [note] Apostle setteth forth. For touching Abraham, he obeying the voice of the Lord when he called him first out of Chaldea, and then out of Charan, must needs even then have faith; yet some years after upon the promise made unto him of the blessed seede received by faith, it is said that his faith did justify him, and not his good works, which he had done very excellent and manifold. So that although he were a doer of the law after he believed, yet still his Justification is placed in faith. This is yet more manifest in the example of David, who having believed, or at least having been sanctified more than 40 years, and done many singular acts of true godliness before his foul crimes, of the murder of many his faithful servants by the sword of the Ammonites, of the adultery with Bathsheba, and finally of the drunkenness that he threw Uriah into, placeth his repaire not as the Jesuits blasphemously do in the [note] satisfaction which is by works, but in faith which believeth and layeth hold of remission of sins by Christ. Whereby appeareth the lewd and blockish answer of the Jesuits, which wrest the Apostles denial of justification by works of the law to those civil works that men either worke by the light and strength of nature, or by a bare knowledge of the law, without any assistance of Gods spirit, and with all their sottish καινοφονία, and newfangled distinction of the first justification by faith alone, and of the second justification by faith and works together is crushed all to pieces; seeing the Apostles ascribeth the justification which men have after they are entered into the way of righteousness, not to works [note] done, either before or after to be done, but unto that faith which being first planted in their hearts after waxeth and groweh to that proportion that the Lord seeth good in his great wisdome to be fit for every one according to the place he occupieth in the body of Christ, and trials that he will prove them with. Hereupon the Apostle in the stairs whereby we orderly come to the kingdom of [note] heaven, doth never set one justification after another, but placeth sanctification after justification. And if this new and unlawful coine of distinction were true, then the sentence of the Apostle, should not have where to set foot, which declareth that as there is but one true body, one spirit whereby [note] that body liveth, one hope of our calling, one true Lord, one lawful baptisme, one true God: so there is but one true and holy faith. Touching Saint James it shall be answered (God willing) in the proper place. As for Augustine, he utterly refuseth to be fraughted with such beggarly merchandise, as you would load him with. But so (saith he) it must be understood that the doers of the law shall be justified, that we may know that they are not otherwise doers of the law, unless they be justified: that justification should not come to the doers of the law, or be an after comer to them, but that justification should go before the doers of the law, which cleane overturneth the Jesuits diversely. First that he maketh the doing of the law to be the effect of justification, which they make the cause, and call it the second Justification. Secondly because he maketh one Justification which always goeth before good works, and is done that we may be fit for good works. So this giveth answere to his words alleged in the next Annotation. For those words meane thus much, that we being just in Christ, because we have in him done the law, must have that grace ere we can do the law, as apeareth first because these words follow upon the former sentence, and is so expounded by the words immediately following. And by this it is as much as if a man would say, they shall be made doers of the law, not that they were, but that they may be, that so the Jews might understand which are the hearers of the law, that they have need of the grace of the just justifier: that they may be doers. For that Augustine doth not acknowledge a second righteousness, whereby a man may be justified, shall once for all appeare by these places following. Every living man justifieth [note] himselfe before himselfe, not before thee. How before himselfe? In pleasing themselves and displeasing thee. But before thee no man is justified. Enter not therefore with me into judgment O Lord my God, how much soever I seem to be righteous. Thou bringest out of thy treasure a rule, which when thou appliest unto me I shall be found nought. And after having noted with thy servant, that all, even the Apostles, after they were Apostles must pray, forgive us our sins. He saith in the end; Let therefore the Apostles say, Let them hardly say forgive us our debts as we forgive our debtors. And when it is said to them why say you so? what be your debts? [note] Let them answere, because no man living shall be justified in thy sight. And in another place he saith; He said not I shall not be able to abide it, but who shall be able to abide it, for that the whole life of man is in a manner barked at by their owne sins, that all consciences are accused by their owne thoughts, that there is not found a chaste heart which presumeth of it owne righteousness. If therefore there is no chaste heart that can presume of it own righteousness, let every mans heart presume of Gods mercy, and let it say unto God; If thou O Lord wilt observe or marke up our iniquities, O Lord who shall abide it? But what hope is there? because with thee there is mercy: And what is this mercy but the sacrifice? And what is the sacrifice but that which was offered for us? even the innocent blood that was shed hath done away all the sins of the guilty: the price only which was given redeemeth all captive from the hands of the enemy that carried them captive. Therefore there is mercy with the Lord: for if there were not mercy with thee: and if thou wilt be nothing else but a Judge, and not merciful, and observe or marke up all our iniquities, and inquire into them, who shall be able to abide it; who should stand and say I am innocent. As for the other trash which they have in their next noteless note. First let the good Reader marke, that they confessing proofe of our part out of the Scripture that to justify is to impute justifice, bring nothing to the reproofe thereof beside their owne barking. For their sottish consequence that God should be either ignorant or unjust, if he should repute him as righteous which is not so, is unworthy any answere: for first he hath Christs righteousness, which being a true and perfect righteousness is as verily his through faith, as if he had done it in his owne person. Secondly, they wickedly speak of a man that being justified by faith, is made a member of the body of Christ; when they say he is wicked, impious and unjust: for although they have remnant of sin them, yet for [note] that the same is not imputed unto them, it is blasphemous against Christ to account his members impious, and to make him a head of any impious body. Thirdly, this is not so much against us as against the Apostle, who speaketh so plainly that God justifieth the wicked, that he loved us when we were his enemies, as we cannot speak plainer. Againe they impudently belie us, when they make the state of the question between us and them; Whither it be more glory to God, and more to the commendation of Christs justice, to call and count an evil man so continuing for just, then by his grace to make him of an evil one just indeed, and so truly to justify him. For they know well that we teach, that the justified man must walk in all the ways and commandments of God, and urge the keeping of the Law much more straightly then they do, which make partly sin no sin, partly make venial sins, which a little holy, or rather harlotry water may take away: yea so we urge it, as we pronounce that they never truly believed, nor were ever justified which remaine in the same wickedness wherein they were when they first obtained mercy. Now take away your slanderous and lying forgery of us, that a man justified by faith remaineth still in impiety. And we boldly affirme that there is more glory to God, and commendation to Christs Justice, to call and account an evil man just; theu to make him of an evil one just, in the works that are done in and by himselfe. And this we say not only as you beggarly Sophisters are wont to do, but with sound and substantial proofe. And first after this sort, it is more to Gods glory, whereby glory is to be taken from men and given unto God, then that whereby glory being added to men is taken from God: But by justification through faith alone, or by imputation, glory is taken from men, and given to God; and contrariwise in justification by the deeds of the law. Wherefore it is more to Gods glory that he justifieth us by faith only then by the works of the law. The first proposition is both evident in itself, and is confirmed by the plaine testimonies of the Apostle. The second is as evident by the same Apostle, who shutteth out glorying from men not by the law of works, but by the law of faith. Where if the Jesuits would run to their old hole, that he meaneth the civil and outward works done of Jews and Gentiles not believing in Christ, their own disciples would hiss and clap their hands against them: for so much as so they should place greater excellency in works done infidelity, than in the faith that is in Christ; considering that the Apostle by that doing of the law there spoken of, affirmeth that more glory is pulled to men from God, then when their justification standeth by faith without works, wherein if there were yet any manner of scruple, yet the same is most evidently remedied of the Apostle, who by and by asking whether faith which he had mentioned in the former words were contrary to that law which likewise he had mentioned before: he (with great detestation) affirmeth, that faith not only doth not make the law void, or is contrary unto it: but that by faith he and all other of his fellows did establish the law. And indeed whither we consider the exact righteousness which God requireth in his law, it was never heretofore, nor ever shall be hereafter, that any the sons of Adam beside Christ, could or can precisely observe the law of God, or whither we consider that the Lord requireth sanctification in some acceptable measure, according to the gifts which he hath dealt to every of the faithful: there could not so much as the least and smallest commandment of God be once with a good heart (I say) not done, but not so much as endeavored by unbelievers, seeing all good works come from faith as the fountaine of them all. Now it is manifest that the faith of Christ is contrary to all such works proceeding from infidelity, as those which are not done of faith, nor proceede from a pure conscience purged by faith. Secondly we say that by our judgment of faith alone in the cause of salvation the justice of God is maintained, which by their fantasy of justification by works of the law is utterly overthrowne. For whilst the redemption and riddance from sin is placed in the death of Christ, and our stole and robe of righteousness, whereby we may confidently stand against the sentence of Gods judgment is placed in the obedience which our Saviour Christ yielded unto God his father in his own person: It is brought to pass that we have both a full &amp; perfect satisfaction for all our sins, and a whole and unmaimed righteousness, against which God in his most exact justice cannot proceede, no more than he can call his owne son unto a second death, or not accept his face, who is the righteousness of God himselfe. On the other side, if he should accept in Christ mens owne satisfaction for their sins, or the worke that they do after they be engraffed in this body of Christ for righteousness. It must necessarily follow, that God should be unjust in both, for he should take that for a perfect satisfaction which is not, (no man being able to make payment for the manifold talents wherewith he is indebted unto God) and that for a perfect and whole righteousness, which hath many transgressions of the law joined therewith: when therefore this justice (wherein his glory consisteth as well as in his mercy) would not suffer him to show mercy without a full recompence for sin, and an exact righteousness of the law: there remained only this way to accord his justice and mercy, and to cause them to embrace one another, that Christ should be both our surety to pay our debts, and our righteousness, by the which we might come into the presence of God. And if this imputative Justice without the works of the law be so strange in your ears; how cometh it to pass that yourselves hold that original sin of infants that are baptized is (without any work of theirs) pardoned in the blood of Christ: If imputation be generally refused in the Scripture, why have you admitted it in the remission of sins? why should you thrust it out in the other part of our salvation, which is righteousuess. And if God may impute mens sins to Christ being just, why may he not impute his righteousness to those that are not in themselves righteous? If therefore the pride of your heart doth carry you away that you will not amend yourselves at our correction, yet suffer yourselves to be corrected by yourselves. Having answered your question tell us we pray you, whether there is more honour to a King in freely forgiving his servant a debt, and giving him forthwith to be rich of; or to give him some means office or occupation, whereby he may in time (if he will) both pay his debt, and grow to wealth again. And for that you would seeme to be jealous of Gods glory, and of the commendation of Christs Justice, tell us further whither we or you shot nearer this mark: we which affirm that we have no manner of ability in ourselves, or by our natural power to do any thing which is good, but only by the grace of God in Christ; or you that affirme that we have some strength of nature in ourselves, which being helped by the grace of God in Christ is able to do the will of God. We which say with the Apostles that naturally we are stark dead; or you that say we are but half dead: we which give greater [note] power unto Christ in the healing of the soul, then to the Physician in healing of the body, or you which give no more unto Christ in healing the soul than is given to Physicians in healing the body: For when as the Physician through his cunning is able to recover a man that is halfe dead by his skill, notwithstanding cannot attaine to the restoring of a man that is dead: By this doctrine of yours you match and mate the Physicians cunning in his faculty, and our Saviour Christs in his. Finally we which make Christ a whole Saviour, or you that make him halfe a Saviour.</p></blockquote>

<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 611.</span></figcaption>

</figure><figure class="quote" id="q-231686be15" data-kw="">
<blockquote><p>13 Then Moses said unto God, Behold, when I shall come unto the children of Israel, and shall say unto them, The God of your fathers hath sent me unto you: if they say unto me, What is his Name? what shall I say unto them?. . . What do you learn out of the 13th verse? In the thirteenth verse in the question of Moses two things are to be observed: One, that we be careful to be instructed in all things concerning our calling, thereby to be able to answer all doubts that may be moved. Secondly, that asking any thing concerning God, as of his name or nature, we must aske it of himself, who because now he speaks not but by his ministers, interpreters of the Scriptures, we must have our recourse unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian religion substantially, methodically, plainly, and profitably treatised</cite>, (London, 1611), 1–2.</span></figcaption>

</figure><figure class="quote" id="q-f3e2c6707a" data-kw="">
<blockquote><p>If it be here objected that great vices have often made their appearance in the church we would reply that these are not defended and adhered to by the church, as by the various sects. Indeed, the church is the first to censure and condemn them. Hence, if there are faults in the church, these are disapproved of and removed. As long as this state of things lasts, so long the church remains.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, 59.</span></figcaption>

</figure><figure class="quote" id="q-caa3db1275" data-kw="">
<blockquote><p>From this influx, it is not surprising that the doctrines of faith and, most especially, that of the new birth became so rapidly corrupted in the churches. With separation from the world spurned, there is no wonder that the sanctity and glory of the gospel was overshadowed, and superstitious practices flooded in along with the unconverted pagans, until, at length, Christian church discipline was remodeled on the fashion of the pagan secular state. Once hypocrites and other unregenerate people began, as it were, to swamp and overwhelm the believers, there soon emerged leaders who were pleased enough to accommodate spiritual doctrines to the prevailing systems of philosophy. And so it came about that faith was neglected, doctrine no longer studied, regeneration equated to the mechanical performance of the rite of baptism, truth and piety no longer defended by any great efforts in the assemblies and councils, the majorities at best indifferent, at worst bitterly hostile, to the total over-shadowing of these essential things. By that time, most of the world had taken up the Christian profession so, at most, everything that had been instituted by Christ had been basely transmuted into another gospel. Strange to tell, it was done without a protest or major split in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Theology</cite>, (Soli Deo Gloria 1994), 660 | HT: Gary Johnson.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-455255632b" data-kw="">
<blockquote><p>Therefore St. John rejects a false and feigned faith; he demands a genuine faith which will openly confess before the world the two things it has learned, namely, that Christ is the Son of God and of Mary and that He became our Savior. If this Christian confession stands, other good works will follow. If you were a fornicator, an adulterer, or a drunkard, you will now be that no longer; for if you are redeemed from sin, you will henceforth desist from sin. Consider how you could harmonize a sinful life, greed, anger, hatred, and fornication with a claim to Christianity. No faith can exist where sin abounds. You must cease your fornication and marry; you dare not steal or bear false witness against your neighbor. If you do wallow in sin and commit adultery, unchastity, fornication, gluttony, carousing, and gambling, you are not yet redeemed from sin. For wherever sin still holds sway, there is no forgiveness of sin and no faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 22: Sermons on the Gospel of St. John: Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Saint Louis: Concordia Publishing House, 1999), 393–94.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-8569f39913" data-kw="">
<blockquote><p>2.1 As far as concerns the case of infants, you expressed your view that they ought not to be baptised within the second or third day of their birth; rather, the ancient law on circumcision ought to be respected and you therefore concluded that the newly-born should not be baptised and sanctified before the eighth day. Our Council adopted an entirely different conclusion. No one agreed with your opinion on the matter; instead, without exception we all formed the judgment that it is not right to deny the mercy and grace of God to any man that is born. 2.2 But seeing that the Lord says in His own Gospel: The Son of man has come not to destroy the souls of men but to save them, we must do everything we possibly can to prevent the destruction of any soul. We need to ask, what can be lacking to one who has been already formed by the hands of God in his mother’s womb? To our way of thinking, indeed, and to our eyes infants after their birth appear to grow and increase as the earthly days go by; but as far as God their Maker is concerned, whatever has been made by Him is perfect and complete thanks to His handiwork and almighty power. 6.1 And so, dearest brother, our verdict at the Council was this: we ought not to be the cause for debarring anyone from access to baptism and the grace of God, for He is merciful, kind, and loving towards all men. 6.2 And whilst this is a rule which ought to be observed and maintained concerning the whole of mankind, it is our view that it should be observed most particularly in the very case of newborn infants; they have all the more claim upon our assistance and God’s mercy for the reason that, right from the very first moment they are born, in their crying and wailing they are doing nothing else but imploring for our help</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Letters of St. Cyprian of Carthage, Letters 55–66</cite>, ed. Johannes Quasten, Walter J. Burghardt, and Thomas Comerford Lawler, trans. G. W. Clarke, vol. III, Ancient Christian Writers (New York; Mahwah, NJ: Newman Press, 1986), 110, 112.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

and+God%E2%80%99s+mercy+for+the+reason+that%2C+right+from+the+very+first+moment+they+are+born%2C+in+their+crying+and+wailing+they+are+doing+nothing+else+but+imploring+for+our+help%E2%80%9D%0A%0A%E2%80%94+Cyprian+of+Carthage%2C+The+Letters+of+St.+Cyprian+of+Carthage%2C+Letters+55%E2%80%9366%2C+ed.+Johannes+Quasten%2C+Walter+J.+Burghardt%2C+and+Thomas+Comerford+Lawler%2C+trans.+G.+W.+Clarke%2C+vol.+III%2C+Ancient+Christian+Writers+%28New+York%3B+Mahwah%2C+NJ%3A+Newman+Press%2C+1986%29%2C+110%2C+112.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8569f39913.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8569f39913.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/07/cyprian-on-infant-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-674765a0e8" data-kw="">
<blockquote><p>But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield: Studies in Theology</cite>, vol. 9 (Bellingham, WA: Logos Bible Software, 2008), 408.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-093d826dbf" data-kw="">
<blockquote><p>We desire all people, whom the benign influence of our clemency rules, to turn to the religion which tradition from Peter to the present day declares to have been delivered to the Romans by blessed Peter the Apostle, the religion which it is clear that the Pontiff Damasus and Peter Bishop of Alexandria, a man of apostolic holiness follow; this faith is that we should believe, in accordance with apostolic discipline and Gospel teaching, that there is one Godhead, Father, Son, and Holy Spirit, in an equal Majesty and a holy Trinity.1 We order those who follow this doctrine to receive the title of Catholic Christians, but others we judge to be mad and raving and worthy of incurring the disgrace of heretical teaching, nor are their assemblies to receive the name of churches. They are to be punished not only by Divine retribution but also by our own measures which we have decided in accordance with Divine inspiration.2 Given on the 3rd Kalends of March at Thessalonica, Gratianus and Theodosius being Consuls (February 27, 380).</p></blockquote>

<blockquote><p>For in respect of the observance of the eighth day in the Jewish circumcision of the flesh, a sacrament was given beforehand in shadow and in usage; but when Christ came, it was fulfilled in truth. For because the eighth day, that is, the first day after the Sabbath, was to be that on which the Lord should rise again, and should quicken us, and give us circumcision of the spirit, the eighth day, that is, the first day after the Sabbath, and the Lord’s day, went before in the figure; which figure ceased when by and by the truth came, and spiritual circumcision was given to us.</p></blockquote>

</figure><figure class="quote" id="q-ab803be0d5" data-kw="">
<blockquote><p>Others, like the sacramentarians, (those are justly called sacramentarians, who attribute to the sacraments what they do not contain, and by high-sounding but false and made-up promises, lead men away from simple trust in the one God to belief in the power of symbols. Therefore if any one hereafter finds “sacramentarians” in my writings, I want him to understand that class of men who attribute to symbols what belongs only to Divine Power and to the Holy Spirit, personally working in our souls, which symbols and the external word only proclaim and represent), the sacramentarians, I say, either not understanding or not wishing to understand the usage and meaning of our Lord’s words, twist this language so far as to venture to assert that the things themselves are really and materially conveyed by the sacraments by virtue of the words joined with the elements, and they defend their error by saying, “Faith is of things invisible.” “You do not see grace in baptism,” they say, “but it is certainly conveyed by virtue of the words, as soon as the clergyman has said, ‘I baptize thee in the name of the Father and of the Son and of the Holy Ghost.’ ” When you demand proof this proposition, they say: “Faith is of things invisible.” They fail to notice that baptism is not given to any one unless he first confesses that he has faith, if he is a grown person, or unless he has the promise in virtue of which he is counted a member of the Church, if he is a child. Thus this thing which the sacramentarians maintain is conveyed invisibly by the sacrament was actually conveyed before. For he who confesses faith had it before he confessed it and, therefore, before he was baptized. For confession precedes immersion. Thus the faith which was given by the light and gift of the Spirit was there before the candidate was admitted to the sacrament, or if he did not have faith, it is certainly not brought to him by baptism. For neither Judas nor Simon the sorcerer, who were without faith when they were baptized, received faith by baptism. But if an infant is to be baptized, since he cannot himself confess faith, he must have the promise which counts him within the Church. The promise is, that the Gentiles, when they have obtained the knowledge of God, and true religion, shall be just as much of the church and people of God as the Hebrews. This all the prophets heralded and Christ Himself most plainly promises. “They shall come from the east and from the west, and shall recline with the God of Abraham and Isaac and Jacob.”* And “The last shall be first,” and “The vineyard shall be given to other husbandmen,” and “There shall be one shepherd and one fold.” Since, therefore, the children of the Hebrews have always been counted with the Church with their parents, and the divine promise is sure, it is clear that the children of Christians belong to the Church of Christ just as much as their parents. This promise is not conveyed in baptism, but he to whom it has been previously given is baptized, that by a visible sign he may bear witness that he is of the number of those who through the goodness of God are called the people of God. Here surely nothing new is brought in, but that which has been previously given is recognized by a religious rite, and the name is given when the symbol and pledge have been received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Latin Works of Huldreich Zwingli</cite>, ed. William John Hinke (Philadelphia: Heidelberg Press, 1922), 2.194–95.</span></figcaption>

<blockquote><p>Now concerning baptism, baptize as follows: after you have reviewed all these things, baptize in the name of the Father and of the Son and of the Holy Spirit in running water. But if you have no running water, then baptize in some other water; and if you are not able to baptize in cold water, then do so in warm. But if you have neither, then pour water on the head three times in the name of the Father and Son and Holy Spirit. And before the baptism let the one baptizing and the who is to be baptized fast, as well as any others who are able. Also, you must instruct the one who is to be baptized to fast for one or two days beforehand.</p></blockquote>

<blockquote><p>The second question is, Whether the antichrist here described is an ecclesiastical of civil power; whether it is to arise in the Church or in the world. The considerations which are in favour of the former of these assumptions are, –

1. That the designations “man of sin” and “son of perdition” have a religious import, and are more appropriate to an ecclesiastical than to a worldly power or potentate.

2. Antichrist was to have the seat of his power in the “temple of God.” It is there he sits. This seems clearly to indicate that it is an ecclesiastical usurping, tyrannical, and persecuting power, that is here depicted. By the temple of God in this passage is generally understood the Church which is so often elsewhere called, and especially by Paul, God’s temple. Some, however, suppose that the reference is to the literal temple in Jerusalem; but this supposes, (a.) That the Jews are to be restored to their own land. (b.) That they are to be restored as Jews, or unconverted, and that the temple is to be there rebuilt. (c.) That the Thessalonians knew all this and would understand the Apostle as referring to the temple made with hands; which is to the last degree improbable.

3. His coming is after the working of Satan, with all power and signs and lying wonders. This is not the way in which worldly potentates gain their power; they rely on force. But this is the way, as though traced by the pen of history rather than by the pencil of prophecy, in which the papacy has attained and maintained its fearful ascendancy in the world. Its power has been achieved mainly by fraud, “by the deceivableness of unrighteousness;” by forged documents and false pretences; by claiming that Peter was made primate over the whole Church the vicar or plenipotentiary of Christ on earth; that he was the bishop of Rome; that his successors in that office were his successors in that primacy; and that as the vicar of Christ he was superior to all earthly potentates, nor merely as the spiritual is above the temporal, but as lord of the conscience, authorsized to decide what was right and what was wrong for them to do in all their relations as men and as rulers; which is a claim of absolute dominion.

This, however, is a small matter so far as it concerns the things of this world. It was to the mass of the people of little moment whether their absolute sovereign was a bishop or a prince; whether their absolute sovereign was a bishop or a prince; whether he resided at Rome or in Paris, whether his authority extended over one nation or over all nations. It is the false claim of the papacy to have supreme authority over the faith of men, to decide for them what they must believe on the pain of eternal perdition, that is the most fearful power ever assumed by sinful men. … These pains the pope and his subordinates falsely claim the power to alleviate or remit. These claims have no parallel in the history of the world. If such pretensions as these do not constitute the power which makes them Antichrist, then nothing more remains. Any future antichrist that may arise must be a small affair compared to the papacy.

Then again, the Apostle tells us, these portentous claims, these unrighteous deceits, were to be supported by “signs and lying wonders.” These have seldom, if ever, been appealed to by worldly powers to support their pretensions. They ever have been and still are among the chief supports of the papacy. There is not a false doctrine which it teaches, or a false assumption which it makes, which is not sustained by “lying wonders.” Its whole history is a history of apparitions of the Virgin Mary or of saints and angels; and of miracles of every possible description from the most stupendous to the most absurd. It has ever acted on the principle “populus vult decipi,” and that it is right to deceive them for their own good, or, the good of the Church. The whole system, so far as it is distinctive, is a system of falsehood, or false pretensions, supported by deceit.</p></blockquote>

<blockquote><p>The common opinion, however, among Protestants is, that the prophecies concerning Antichrist have special reference to the papacy. This conviction is founded in Paul’s second epistle to the Thessalonians. … The first question, to be determined in the interpretation of this prophecy, is, Whether Antichrist is a particular individual, or an institution, a power, or a corporation. Protestants generally adopt the latter view; because they do not regard any one pope, but the papacy, as the Antichrist of Scripture. In favour of this view it may be urged, (1.) That it is according to the analogy of prophecy to speak of nations, institutions, or kingdoms, as individuals. In Daniel, the ten kings are ten kingdoms or dynasties; the several beasts which he saw in vision, were not the symbols of particular men, but of nations. When therefore the Apostle speaks of Antichrist as “the man of sin,” and “the son of perdition,” it is perfectly consistent with Scriptural usage to understand him to refer to an order of men, or to an institution.

(2.) The work assigned to Antichrist in prophecy, extends over far too long a period to be accomplished by one man. (3.) Those who insist that the antichrist here predicted, is an individual man, are forced to admit that what is said in 2 Thessalonians ii. 7 (“He who now letteth, will let, until he be taken out of the way”) is to be understood of a power. It is generally understood of the Roman power. Luthardt understands it of the moral power which sustains the right, and therefore is opposed to the reckless disregard of all law, which is one of the characteristics of Antichrist. It is true that he supposes that reference is also made to one of the guardian or protecting angels spoken of by the prophet Daniel. But such an angel is not to be “taken out of the way.” And there is nothing in the context or in Paul’s writings anywhere to justify the assumption that reference is here had to any angelic personage.</p></blockquote>

<blockquote><p>If this does not forever prove that the papacy is the antichrist, then nothing does:

The destruction of the Papacy is the special work of the exalted Mediator, and there are the most powerful reasons why He should take vengeance upon that devoted system. Popery is essentially, and in every subject, the Antichrist – the inveterate and irreconcilable enemy of Christ. It stands in arrayed hostility to his character and offices. Popery exalts the creatures above the Saviour – representing the Virgin Mother as the Queen of Heaven, and as commanding her Son, and ascribing that power and homage to the Pope, his assumed vicar on earth, which belongs to Christ alone, and which it is the highest blasphemy to ascribe to any creature. He is dethroned from his mediatorial office, by exalting saint and angel-mediators. His priesthood is set aside by introducing human merits, and ascribing the virtue of his atonement to penances and bodily mortifications. The Roman pontiffs and the bishops and priests of Rome deny Christ his glory as a Prophet, by removing the key of knowledge, and preventing men from hearing the intimations of his will; while they arrogate to themselves more than regal honours, put on their own heads the diadem which He should exclusively wear, and promulgate laws and ordinances in opposition to the declared principles of his kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 296-7.</span></figcaption>

a3db587a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4a3db587a2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/29/thomas-houston-on-how-the-papacy-usurps-the-offices-of-christ-the-mediator/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The papal antichrist doctrine is a crucial component of the Reformed faith; hence it is enshrined in the Westminster Confession (25:6). Indeed, it is not merely a Reformed view, but is part of historic Protestantism (Lutherans, Anglicans and others held to it). Sadly, this important teaching is both denied and expunged from the Confession (as in the American Presbyterian churches, the Presbyterian Church in Ireland and the Evangelical Presbyterian Church in Ireland), or else it is downplayed and rarely preached upon. Thomas Manton, however, reminds us of several reasons why this teaching should not be abandoned or forgotten about:

Observe, then, that the doctrine of Antichrist is a profitable doctrine, and a point very necessary to be preached and known.

1. It is a point very necessary to admonish and warn the faithful, that they be not circumvented with these delusions, and be found in the opposite state to Christ Jesus, and the interests of his kingdom. God hath blown his trumpet: Rev. xviii. 4, ‘Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues;’ God calleth his people out of spiritual Babylon; it is dangerous and unsafe being there. If we would escape Babylon’s punishments we must escape her sins, not live in that communion and society where there are such temptations to idolatry and other detestable enormities. It is disputable whether the errors of Popery be damnable, or there be any possibility of salvation in that religion. Some deny all possibility; others, abating from the rigour of that opinion, assert a very great difficulty: 1 Cor. iii. 13, ‘Saved as by fire;’ if so much Christianity left as to save them, it is with much ado. But the question is not about our benefit, but our duty; not whether possibly we may be saved? but what is the way the Lord will have us to walk in? And if there were possibility or probability of salvation in the way, in the general, yet there is very little or none for them that live in a known sin, and especially in a sin of such a dangerous nature as abetting an opposite faction to Christ, such as is that of Antichrist.

2. It is necessary to fortify and forewarn the people of God against a double temptation. (1.) Against scandal; (2.) Against persecutions.

[1.] Against scandal. It is a dangerous temptation to atheism to see Christianity so corrupted and debauched by a vile submission to serve worldly ends, and turned into the pageantry of empty and ridiculous ceremonies, which beget scorn and contempt of it in the minds of all considering beholders; and therefore there are more atheists in Rome and Italy than in other countries. Supernatural things, disguised with a vain pomp, lose their reverence, and do not alarm the conscience, but harden the heart in a settled atheism and contempt of Christ. Now it is a mighty stay to the heart to see that this degeneration was foreseen and foretold: John xvi. 1, ‘These things have I spoken to you, that you should not be offended;’ Mat. xviii. 7, ‘Woe unto the world because of offences! for it must needs be that offences come; but woe to that man by whom the offence cometh!’

[2.] Against persecutions; for the man of sin is also a son of perdition, a destroyer of the saints, and maketh havoc of the people of God. Now it is grievous when Christians suffer by Christians, and we may have many doubtings and misgivings about our cause; but when Antichrist is clearly discovered, we submit the more cheerfully to suffer the hardest things under his tyranny; for suffering under antichristian persecution is martyrdom and suffering for Christ, as much as suffering under Pagan persecution: Rev. xiv. 13, ‘And I heard a voice from heaven saying unto me, write, Blessed are the dead which die in the Lord from henceforth,’ &amp;c. Not only the primitive martyrs, who were put to death by heathens, but those that are condemned by Christians and burned for heretics, those are martyrs also.

3. That we may the better understand true Christianity; ἀντικείμενα παραλληλειμένα μάλιστα φαίνεται, opposites illustrate each other. The two opposite states are Christianity and Antichristianity; the one is a ‘mystery of godliness,’ 1 Tim. iii. 16; the other, ‘a mystery of iniquity.’ The design of the mystery of godliness is to recover men from the devil, the world, and the flesh, unto God; the other, to seduce men from God to the devil, the world, and the flesh again; and that by corrupting the former mystery, or the most excellent institution that ever the world was acquainted with for the ennobling and refining man’s nature; so that Christ’s religion is turned against himself, to lull men’s consciences asleep, whilst they gratify the lusts of the eyes, the lusts of the flesh, or live in pride of life. The devil is gratified by all sin, but especially he is εἰδωλοχαρὴς, as Synesius calleth him; one that delighteth in idols, as knowing this is the best way to make men brutish, or to live in an oblivion or neglect of God; for an idol is ‘a teacher of lies,’ Hab. ii. 18, doth imprint upon the mind carnal and false conceptions of a deity.

4. To confirm us in the truth of the Christian faith, when we see the prophecies of it expressly fulfilled; for this is the Lord’s direction to know a true prophet, Deut. xviii. 22, if the thing come to pass, and the event doth punctually answer the prediction; but when a prophet speaketh in the name of the Lord, and the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken. Now, the apostles did not only teach the church the doctrine of Christianity, but by a prophetic spirit and divine revelation foretold things to come; and among these, the great thing which is to happen and come to pass before Christ’s second coming is Antichrist, or the appearing of the man of sin. Therefore, that we may not doubt of what is past, nor suspect what is further to come, it is good to study these prophecies, and know they are to be fulfilled in their time, that we may say that God, who hath kept touch with the world hitherto in all the predictions of the word, will not fail at last.

Use 1. To reprove them that think this is a curious point not to be searched into. Why then did God reveal it, and that so often by St Paul, by St John, in so many prophetical representations of it? Surely it is not curiosity to search into things revealed, but to intrude ourselves into things hidden, and which God hath put under a veil of secrecy. It is true men must know their measure, and not attempt to run before they can go, and venture upon obscure points before well versed in plain; and it is true, in more abstruse points, men must not rashly define, but soberly and modestly inquire, and compare predictions with plain events; this is no way culpable.

2. To reprove those that are so impatient of giving a little attendance to such doctrines for a while, and think at least matter more profitable should be insisted on; they are persuaded enough already. It is well if it be so; but those that stand should take heed lest they fall; and presumptuous confidence soonest giveth out, and forsaketh Christ. I would but propound this argument to them: If it were profitable for them that were to go out of the body long before Antichrist was revealed to be taught these things again and again, and they be charged to keep these things in remembrance, certainly it is more profitable for others that live at the time when these things are in being, and the temptation is at the next door, ready to break in upon them. Surely it is profitable to discover Antichrist, to reduce those that are gone astray, much more to prevent a revolt, that we may not return to this bondage after a deliverance from it.</p></blockquote>

s%2C+as+knowing+this+is+the+best+way+to+make+men+brutish%2C+or+to+live+in+an+oblivion+or+neglect+of+God%3B+for+an+idol+is+%E2%80%98a+teacher+of+lies%2C%E2%80%99+Hab.+ii.+18%2C+doth+imprint+upon+the+mind+carnal+and+false+conceptions+of+a+deity.%0A%0A4.+To+confirm+us+in+the+truth+of+the+Christian+faith%2C+when+we+see+the+prophecies+of+it+expressly+fulfilled%3B+for+this+is+the+Lord%E2%80%99s+direction+to+know+a+true+prophet%2C+Deut.+xviii.+22%2C+if+the+thing+come+to+pass%2C+and+the+event+doth+punctually+answer+the+prediction%3B+but+when+a+prophet+speaketh+in+the+name+of+the+Lord%2C+and+the+thing+follow+not%2C+nor+come+to+pass%2C+that+is+the+thing+which+the+Lord+hath+not+spoken.+Now%2C+the+apostles+did+not+only+teach+the+church+the+doctrine+of+Christianity%2C+but+by+a+prophetic+spirit+and+divine+revelation+foretold+things+to+come%3B+and+among+these%2C+the+great+thing+which+is+to+happen+and+come+to+pass+before+Christ%E2%80%99s+second+coming+is+Antichrist%2C+or+the+appearing+of+the+man+of+sin.+Therefore%2C+that+we+may+not+doubt+of+what+is+past%2C+nor+suspect+what+is+further+to+come%2C+it+is+good+to+study+these+prophecies%2C+and+know+they+are+to+be+fulfilled+in+their+time%2C+that+we+may+say+that+God%2C+who+hath+kept+touch+with+the+world+hitherto+in+all+the+predictions+of+the+word%2C+will+not+fail+at+last.%0A%0AUse+1.+To+reprove+them+that+think+this+is+a+curious+point+not+to+be+searched+into.+Why+then+did+God+reveal+it%2C+and+that+so+often+by+St+Paul%2C+by+St+John%2C+in+so+many+prophetical+representations+of+it%3F+Surely+it+is+not+curiosity+to+search+into+things+revealed%2C+but+to+intrude+ourselves+into+things+hidden%2C+and+which+God+hath+put+under+a+veil+of+secrecy.+It+is+true+men+must+know+their+measure%2C+and+not+attempt+to+run+before+they+can+go%2C+and+venture+upon+obscure+points+before+well+versed+in+plain%3B+and+it+is+true%2C+in+more+abstruse+points%2C+men+must+not+rashly+define%2C+but+soberly+and+modestly+inquire%2C+and+compare+predictions+with+plain+events%3B+this+is+no+way+culpable.%0A%0A2.+To+reprove+those+that+are+so+impatient+of+giving+a+little+attendance+to+such+doctrines+for+a+while%2C+and+think+at+least+matter+more+profitable+should+be+insisted+on%3B+they+are+persuaded+enough+already.+It+is+well+if+it+be+so%3B+but+those+that+stand+should+take+heed+lest+they+fall%3B+and+presumptuous+confidence+soonest+giveth+out%2C+and+forsaketh+Christ.+I+would+but+propound+this+argument+to+them%3A+If+it+were+profitable+for+them+that+were+to+go+out+of+the+body+long+before+Antichrist+was+revealed+to+be+taught+these+things+again+and+again%2C+and+they+be+charged+to+keep+these+things+in+remembrance%2C+certainly+it+is+more+profitable+for+others+that+live+at+the+time+when+these+things+are+in+being%2C+and+the+temptation+is+at+the+next+door%2C+ready+to+break+in+upon+them.+Surely+it+is+profitable+to+discover+Antichrist%2C+to+reduce+those+that+are+gone+astray%2C+much+more+to+prevent+a+revolt%2C+that+we+may+not+return+to+this+bondage+after+a+deliverance+from+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+complete+works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+46-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf7c06ac5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/df7c06ac5a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/15/thomas-manton-on-the-importance-of-believing-that-the-pope-is-the-antichrist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[…] Papists, home-born Papists, who are vipers that most unnaturally have endeavoured to eat through their mother’s bowels. Not their nature only, but their Religion also, teaches and allows them for the Good of the Catholic cause, falsely so called, not to spare their own native Country, their own kindred, Brothers, Fathers, no not of their own Religion. To blow up Parliaments, to ruin Cities, Countries, Kingdoms, is their ordinary work. Especially of those, whom they call Jesuits, the Bellows of Hell, the Incendiaries of Christendom, at this day. The Curse of God is upon them fearfully for arrogating their Name from Jesus, which signifies a Saviour, and is impropriated to the Son of God: Thou shalt call his name Jesus. These men, that call themselves Jesuits, are, by the just judgement of God upon them, Destroyers of Cities, Countries, Kingdoms, and might far better take their name from him, who is called in Hebrew Abaddon, and in Greek Apollon, but signifying a Destroyer. Revel. 9. 11.</p></blockquote>

<blockquote><p>The great Antichrist, is he, who under the name of Christ’s Vicar, persecutes him,

The Rules.

I. The name Antichrist belongs not to one person alone, but to a whole state or order of men, as it were in the same Kingdom succeeding each other.

Even as the word of High Priest. He is not then opposite to Christ, as one person is to another, in respect of substance, but he is opposite to him in respect of quality or office.

II. The Papists will have Antichrist to be one particular man; a Jew of the Tribe of Dan, the Jews Messiah, and the restorer of their Religion, who shall reign at Jerusalem three years and a half, shall fight with Henoch [Enoch] and Eliah [Elijah], shall offer to ascend to heaven from Mount Olivet, but shall be destroyed by Christ.

III. But we out of Scripture describe Antichrist thus. 1. That he is a man at one time, one; but in succession of time, an order of men; in the same state succeeding each other. 2. Raised by Satan. 3. A Christian in name only. 4. In very deed Christ’s Enemy. 5. Sitting in the Temple of God, as God. 6. Reigning in that great City, which ruleth over the Kings of the Earth. 7. Seducing the inhabitants of the Earth with laying wonders. 8. Setting a mark on his followers. 9. Full of idolatry, ambition, avarice, cruelty and impurity. 10. Revealed in the last times. 11. He shall be destroyed by the breath of Christ’s mouth, and shall be overthrown by his own lovers, and utterly abolished at Christ’s glorious coming.

Johannes Wollebius, The abridgment of Christian divinity, trans. Alexander Ross (3rd edn, London, 1660), pp 233-5.</p></blockquote>

<blockquote><p>Little children, it is the last hour; and as you have heard that the Antichrist is coming, even now many antichrists have come, by which we know that it is the last hour. (1 John 2:18)

John Calvin rejects the notion of a futuristic interpretation of antichrist, arguing that the office belongs to the papacy:

As ye have heard that antichrist will come. He speaks as of a thing well known. We may hence conclude that the faithful had been taught and warned from the beginning respecting the future disorder of the Church, in order that they might, carefully keep themselves in the faith they professed, and also instruct posterity in the duty of watchfulness. For it was God’s will that his Church should be thus tried, lest any one knowingly and willingly should be deceived, and that there might be no excuse for ignorance. But we see that almost the whole world has been miserably deceived, as though not a word had been said about Antichrist.

Moreover, under the Papacy there is nothing more notorious and common than the future coming of Antichrist; and yet they are so stupid, that they perceive not that his tyranny is exercised over them. Indeed, the same thing happens altogether to them as to the Jews; for though they hold the promises respecting the Messiah, they are yet further away from Christ than if they had never heard his name; for the imaginary Messiah, whom they have invented for themselves, turns them wholly aside from the Son of God; and were any one to shew Christ to them from the Law and the Prophets, he would only spend his labour in vain. The Popes have imagined an Antichrist, who for three years and a half is to harass the Church. All the marks by which the Spirit of God has pointed out Antichrist, clearly appear in the Pope; but the triennial Antichrist lays fast hold on the foolish Papists, so that seeing they do not see. Let us then remember, that Antichrist has not only been announced by the Spirit of God, but that also the marks by which he may be distinguished have been mentioned.

Even now are there many antichrists. This may seem to have been added by way of correction, as they falsely thought that it would be some one kingdom; but it is not so. They who suppose that he would be only one man, are indeed greatly mistaken. For Paul, referring to a future defection, plainly shows that it would be a certain body or kingdom. (2 Thess. 2:3.) He first predicts a defection that would prevail through the whole Church, as a universal evil; he then makes the head of the apostasy the adversary of Christ, who would sit in the temple of God, claiming for himself divinity and divine honours. Except we desire wilfully to err, we may learn from Paul’s description to know Antichrist. That passage I have already explained; it is enough now touch on it by the way.

But how can that passage agree with the words of John, who says that there were already many antichrists? To this I reply, that John meant no other thing than to say, that some particular sects had already risen, which were forerunners of a future Antichrist; for Cerinthus, Basilides, Marcion, Valentinus, Ebion, Arrius, and others, were members of that kingdom which the Devil afterwards raised up in opposition to Christ. Properly speaking, Antichrist was not yet in existence; but the mystery of iniquity was working secretly. But John uses the name, that he might effectually stimulate the care and solicitude of the godly to repel frauds.

But if the Spirit of God even then commanded the faithful to stand on their watch, when they saw at a distance only signs of the coming enemy, much less is it now a time for sleeping, when he holds the Church under his cruel and oppressive tyranny, and openly dishonours Christ.</p></blockquote>

<blockquote><p>Yea, we doubt not to prove the kingdom of the pope to be the kingdom and power of Antichrist. And therefore, my Lords, I cannot cease in the name of Christ Jesus to require of you that the matter may come in examination, and that ye, the estates of the realm, by your authority compel such as will be called bishops not only to desist from their cruel murdering of such as do study to promote God’s glory in detecting and disclosing the damnable impiety of that man of sin, the Roman Antichrist, but also that ye compel them to answer to such crimes as shall be laid to their charge for not righteously instructing the flock committed to their cares.</p></blockquote>

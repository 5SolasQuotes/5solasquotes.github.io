tion." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-01d73992a9" data-kw="">
<blockquote><p>We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice – also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics (Backer Academic, 2004)</cite>, 3:246</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity</cite>, pp. 359-93</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

link</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=It%20follows%20from%20this%20view%20that%2C,to%20be%20effectually%20applied%20to%20all%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c608953fb1" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed… The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review (1902), 13:1-37</cite>, p. 19</span></figcaption>

</figure><figure class="quote" id="q-51ebd4322d" data-kw="">
<blockquote><p>d. Finally, there is an objection derived from the bona fide [with good faith] offer of salvation… … (3) The universal offer of salvation does not consist in the declaration that Christ made atonement for every man that hears the gospel, and that God really intends to save each one. It consists in: (a) an exposition of the atoning work of Christ as in itself sufficient for the redemption of all men; … (c) a declaration that each one who comes to Christ with true repentance and faith will obtain the blessings of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (1950; Banner of Truth) | VI. The Purpose &amp; Extent of the Atonement, 4. Objections to the Doctrine of a Limited Atonement</cite>, pp. 397-98</span></figcaption>

</figure><figure class="quote" id="q-926982d7c8" data-kw="">
<blockquote><p>‘Christ died for all sufficiently, for the elect alone efficiently: that is, He indeed satisfied for all, but only the elect apply His satisfaction to themselves.’ Response: We have said above that the death of Christ is in itself sufficient for the redemption of all, yet destined only for the elect. But that He died sufficiently for all, and efficiently for the elect, can in no way be said: I. Because the division of efficiency and sufficiency implies a contradiction with the thing divided. For if He died for all, it follows that He willed by His death to expiate the sins of all, and to obtain their remission. For this the particle for (pro) requires, indicating the end, as does the very phrase. But if He willed to expiate, then certainly He also actually expiated. The reason is that whatever He ever willed to effect, He brought to effect; whether as the omnipotent God, or as the faithful servant of the Father, whom the Father always heard. If He actually expiated the sins of all individuals, therefore He died efficiently for all and each individual; which nevertheless this distinction denies. II. A distinction that removes theological principles is faulty. The distinction of sufficiency and efficiency removes theological principles. The reason is that it separates those things which God has joined in the covenant Jer. 31:33–34. For those whose Savior Christ is, He is their Savior both by merit and by efficacy together, not by one only. Therefore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-alting.html">Henry Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logical &amp; Theological Exegesis of the Augsburg Confession (Amsterdam: Janssonius, 1647), Syllabus of Controversies with Lutherans, Controversy 4, on Predestination, Question 3, 4. ‘Whether for All &amp; Every Person Christ Died’</cite>, p. 237 trans. AI</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>IV. Although then this most divine panace or catholic remedy is proposed to all in the Gospel, yet we believe that no efficacy of it can be transfused, except there be an applying of this by faith in the Son of God, even as there can be no efficacy in physic or medicaments, except the sick patient hearken to the physician, and apply his medicines; which metaphor the Holy Ghost uses in this case.</p></blockquote>

<blockquote><p>VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.</p></blockquote>

ine</a></div>

<blockquote><p>VIII. Hence is that received and fit distinction, that Christ died for all men, in respect of the sufficiency of his merit, or the greatness of the price: but in respect of the efficacy and fruit of his death, he died for all, and only for the believers; seeing not all, but only the faithful receive him: but the rest reject him through infidelity.</p></blockquote>

</figure><figure class="quote" id="q-bb2f39c05e" data-kw="">
<blockquote><p>IX. Thus, besides the Schoolmen, the orthodox fathers also teach: so Prosper Aquitanicus, in the year of Christ 460, Response to the Objections of Vincent., Objection 1: Whereas it is rightly said that our Savior was crucified for the redemption of all the world, for undertaking the affairs of human nature, and for the common loss in Adam: yet it may be said that He died only for these to whom his death was profitable. And Cyril on John l. 11, ch. 19, says, That Christ is an advocate for the sins of all the world: that is, not only for the Jews, but also for other nations; or, for all who, being called by faith, attain to righteousness and sanctification; so that the benefit of a mediator, not without cause, belongs only to them whose mediator and high-priest He is. X. But, of all men, Augustine speaks most clearly, whose opinion (because it is altogether ours) I thought to set in opposition to some sycophants. Thus he speaks (tome 1, ad Art. falso imp., article 1): If we consider the greatness and power of the price, and that it belongs to the only cause of mankind, the blood of Christ is the redemption of the whole world; but they that pass out of this life without faith and the sacrament of regeneration, they are not partakers of redemption. Whereas then by reason of that one nature of all, and the one cause of all, undertaken by our Lord truly, all are said to be redeemed, and yet not all are delivered from captivity, doubtless the property of redemption is in them out of whom the prince of this world is ejected: and now they are no more the vessels of Satan, but the members of Christ. Whose death is not so spent upon mankind that they also who are not regenerated should appertain to his redemption; but so, that what by one example is done for all, by a particular sacrament should be celebrated in each one: for that cup of immortality, which was composed of our infirmity, and of our verity, and of divine verity, it has in itself that which may benefit all, but if it be not drunk, it does not cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“IX. Thus, besides the Schoolmen, the orthodox fathers also teach: so Prosper Aquitanicus, in the year of Christ 460, Response to the Objections of Vincent., Objection 1: Whereas it is rightly said that our Savior was crucified for the redemption of all the world, for undertaking the affairs of human nature, and for the common loss in Adam: yet it may be said that He died only for these to whom his death was profitable. And Cyril on John l. 11, ch. 19, says, That Christ is an advocate for the sins of all the world: that is, not only for the Jews, but also for other nations; or, for all who, being called by faith, attain to righteousness and sanctification; so that the benefit of a mediator, not without cause, belongs only to them whose mediator and high-priest He is. X. But, of all men, Augustine speaks most clearly, whose opinion (because it is altogether ours) I thought to set in opposition to some sycophants. Thus he speaks (tome 1, ad Art. falso imp., article 1): If we consider the greatness and power of the price, and that it belongs to the only cause of mankind, the blood of Christ is the redemption of the whole world; but they that pass out of this life without faith and the sacrament of regeneration, they are not partakers of redemption. Whereas then by reason of that one nature of all, and the one cause of all, undertaken by our Lord truly, all are said to be redeemed, and yet not all are delivered from captivity, doubtless the property of redemption is in them out of whom the prince of this world is ejected: and now they are no more the vessels of Satan, but the members of Christ. Whose death is not so spent upon mankind that they also who are not regenerated should appertain to his redemption; but so, that what by one example is done for all, by a particular sacrament should be celebrated in each one: for that cup of immortality, which was composed of our infirmity, and of our verity, and of divine verity, it has in itself that which may benefit all, but if it be not drunk, it does not cure.”

— David Pareus, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+Thus%2C+besides+the+Schoolmen%2C+the+orthodox+fathers+also+teach%3A+so+Prosper+Aquitanicus%2C+in+the+year+of+Christ+460%2C+Response+to+the+Objections+of+Vincent.%2C+Objection+1%3A+Whereas+it+is+rightly+said+that+our+Savior+was+crucified+for+the+redemption+of+all+the+world%2C+for+undertaking+the+affairs+of+human+nature%2C+and+for+the+common+loss+in+Adam%3A+yet+it+may+be+said+that+He+died+only+for+these+to+whom+his+death+was+profitable.+And+Cyril+on+John+l.+11%2C+ch.+19%2C+says%2C+That+Christ+is+an+advocate+for+the+sins+of+all+the+world%3A+that+is%2C+not+only+for+the+Jews%2C+but+also+for+other+nations%3B+or%2C+for+all+who%2C+being+called+by+faith%2C+attain+to+righteousness+and+sanctification%3B+so+that+the+benefit+of+a+mediator%2C+not+without+cause%2C+belongs+only+to+them+whose+mediator+and+high-priest+He+is.+X.+But%2C+of+all+men%2C+Augustine+speaks+most+clearly%2C+whose+opinion+%28because+it+is+altogether+ours%29+I+thought+to+set+in+opposition+to+some+sycophants.+Thus+he+speaks+%28tome+1%2C+ad+Art.+falso+imp.%2C+article+1%29%3A+If+we+consider+the+greatness+and+power+of+the+price%2C+and+that+it+belongs+to+the+only+cause+of+mankind%2C+the+blood+of+Christ+is+the+redemption+of+the+whole+world%3B+but+they+that+pass+out+of+this+life+without+faith+and+the+sacrament+of+regeneration%2C+they+are+not+partakers+of+redemption.+Whereas+then+by+reason+of+that+one+nature+of+all%2C+and+the+one+cause+of+all%2C+undertaken+by+our+Lord+truly%2C+all+are+said+to+be+redeemed%2C+and+yet+not+all+are+delivered+from+captivity%2C+doubtless+the+property+of+redemption+is+in+them+out+of+whom+the+prince+of+this+world+is+ejected%3A+and+now+they+are+no+more+the+vessels+of+Satan%2C+but+the+members+of+Christ.+Whose+death+is+not+so+spent+upon+mankind+that+they+also+who+are+not+regenerated+should+appertain+to+his+redemption%3B+but+so%2C+that+what+by+one+example+is+done+for+all%2C+by+a+particular+sacrament+should+be+celebrated+in+each+one%3A+for+that+cup+of+immortality%2C+which+was+composed+of+our+infirmity%2C+and+of+our+verity%2C+and+of+divine+verity%2C+it+has+in+itself+that+which+may+benefit+all%2C+but+if+it+be+not+drunk%2C+it+does+not+cure.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+Article+2%2C+%E2%80%98Of+Christ%E2%80%99s+Death+%26+Merit%E2%80%99+in+Aphorisms+of+the+Orthodox+Doctrine+of+the+Reformed+Churches+in+Zachary+Ursinus%2C+The+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29%2C+pp.+694-98&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb2f39c05e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb2f39c05e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=IX.%20Thus%2C%20besides%20the%20Schoolmen%2C%20the,not%20drunk%2C%20it%20does%20not%20cure." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>

</figure><figure class="quote" id="q-3d88089415" data-kw="">
<blockquote><p>II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, He is the Savior of the elect only. Jn. 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Mt. 20:28, Jn. 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning He died efficaciously for all his sheep. Jn. 10:15. And in these all and alone there is a certain special universality, as is in Ambrose, bk. 1, Of the Calling of the Gentiles, ch. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.</p></blockquote>

</figure><figure class="quote" id="q-2217e3fe57" data-kw="">
<blockquote><p>It was in itself of infinite value and sufficiency to have been made a price to have bought and purchased all and every man in the world. That it did formally become a price for any is solely to be ascribed to the purpose of God, intending their purchase and redemption by it. The intention of the offerer and accepter that it should be for such, some, or any, is that which gives the formality of a price unto it; this is external. But the value and fitness of it to be made a price arises from its own internal sufficiency. Hence may appear what is to be thought of… [the statement] “The blood of Christ was a sufficient price for the sins of all the world;” –which last expression is corrected by some, and thus asserted, “That the blood of Christ was sufficient to have been made a price for all;” which is most true, as was before declared: for its being a price for all or some does not arise from its own sufficiency, worth, or dignity, but from the intention of God and Christ using it to that purpose, as was declared; and, therefore, it is denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom. And so it easily appears what is to be owned in the [Lombardian] distinction itself before expressed. If it intend no more but that the blood of our Savior was of sufficient value for the redemption of all and every one, and that Christ intended to lay down a price which should be sufficient [emphasis added; note this is consistent with being in the realm of hypothesis] for their redemption, it is acknowledged as most true.</p></blockquote>

ationale+in+this+way+%28note+his+hypothetical+and+contrary-to-fact+language%29%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2217e3fe57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2217e3fe57.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=It%20was%20in%20itself%20of%20infinite,it%20is%20acknowledged%20as%20most%20true." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-w-pink.html">A.W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-6d44b6da67" data-kw="">
<blockquote><p>Second, He did not offer Himself for angels, because He is not the epilēptōr (ἐπιλήπτωρ), the undertaker and redeemer of angels (Heb. 2:16). Therefore, we think it imprudently said that Christ’s blood suffices to redeem demons (Cornelius Jansen, Augustinus, tome 3, p. 382). Third, Christ sanctified and offered Himself for the seed of Abraham, whose epilēptōr He is (Heb. 2:16).</p></blockquote>

<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) | Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58-102</cite></span></figcaption>

<blockquote><p>III. The same controversy was afterwards renewed among the Romanists, some of whom defended the universality of redemption (with the Semipelagians), others its particularity (with Augustine and his genuine disciples). This controversy lay principally between the Jesuits and Jansenists, of whom the former (an offshoot of the Pelagians) warmly contend for the universality of Christ’s death, while the latter with great firmness defend its particularity, following their founder, Jansen, who has argued this subject very largely and with great solidity in his Augustinus (‘De Gratia Christi Salvatoris,’ 3.20 [1640/1964]. pp. 369-80), his Apologia Jansenii published in 1644, Art. 17,19,20+ and in Catechismo de Gratia, c. 7, de Predesti. q. 65+.</p></blockquote>

<blockquote><p>…the word… ‘Christ died for all‘ does never signify all and every one of mankind, by neither Scripture, nor the doctrine of adversaries: but is, as all divines say, to be expounded according to the subject in hand, secundum materiam substratam. Hence our 1st Rule, ‘All’ often signifies the most part, Mk. 1:64, ‘they all condemned him to be guilty of death,’ ‘the whole counsel,’ Mt. 26:59, yet Joseph of Arimathea consented not to his death, Lk. 23:51, and the flood destroyed them ‘all,’ Lk. 17:27, yet eight persons were saved; so ‘all Judah,’ Jer. 13:19, was carried into captivity. ‘All’ is often the same with many, ‘all the sheep of Kedar shall be gathered to thee,’ that is many, and Gen. 41, ‘and all the land came to Egypt,’ when the matter bears a clear exception, and other Scriptures expound it; then sure Christ’s dying for all must be expounded for his giving Himself a ransome for many, Mt. 20:28, compared with 1 Tim. 2:6… [Rule] 2. All skilled in the mother languages, and all divines say that the particle ‘ali’ [in Greek] is taken pro singulis generum, vel pro generibus singulorum; ‘all and every one of kinds, and for the kinds of all,’ though not absolutely excluding any kind. 1. The word ‘all’ is in materia necessaria, ‘in a necessary matter,’ taken for all and every one. ‘God made all nations of one blood,’ Acts 17:26. He ‘knows the hearts of all men,’ Acts 1:24; Rom. 3:12, ‘All have sinned,’ Rom. 5:12; 2 Cor. 5:10; 1 Tim. 4:10; Jam. 1:5; Phil. 2:10-11. 2. All without exclusion of particular men in a contingent matter is sometimes so taken, Mt. 26:33, ‘Though all be offended,’ Lk. 6:26; Rev. 4:26. 3. When ‘all’ is spoken of God’s works for men, or in men, especially works of mere grace opposite to men’s works: ‘all men,’ then is not taken in the largest sense, as Mr. Moor imagines: So our text; ‘I when I am lifted up from the earth, will draw all men to Me,’ cannot be meant of all men without exception: 1. Because it’s a clear restriction of calling of multitudes under the Messiah’s Kingdom after his death, and cannot but speak against a universal drawing in the times of the Old Testament. 2. Christ draws not all to Himself by the Gospel, because thousands hear not of Him; not virtually, for we read of no calling or drawing of Christ lifted up on the cross and crucified by the works of Nature: So God blesses all nations, not all and every one; God saves all Israel and turns away iniquity from Jacob, and forgives the sins of Israel; and God only saves, and only pardons believers. But will Mr. Moor say, God saves and pardons all and every man in Israel? Rule 3. There is hence a third rule, that ‘many’ is placed for all the elect, as Mt. 10:28, He ‘gave Himself a ransom for many.’ Mk. 14:14, ‘This is my blood of the New Testament, that is shed for many,’ as Rom. 5:15, ‘Through the offence of one, many were dead,’ that is, all were dead: So the sheep of Christ, Jn. 10:11, the scattered sons of God, Jn. 11:52, his people, Mt. 1:21, his brethren, Heb. 2, that he died, ‘for,’ must be exclusive of those that are not his sheep, not his brethren, not his people, not the sons of God… Rule 4. In the matter of our redemption, especially in the New Testament and prophecies of the Old of the same subject, Christ died for all, pro generibus singulorum, for men of all nations, some of all kinds… Rule 5. [Greek] or [Greek] is undeniably expounded of all that are saved only and is restrictive; such a physician cured all the city; that is, no man is cured but by him. Ex. 28:•4, Jethro says to Moses, ‘What is this that thou doest? thou sittest alone and all the people stand by thee from morning till evening,’ (for judgement)… Num 11:13 and his words bear not that all the people without exception came for judgment, that had been unpossible; but because there was then no other judge but Moses, the sense is cleare; all that were to be judged, they were to be judged by no other but by Moses only. Rev. 13:8, ‘And all that dwell in the earth worshipped the beast,’ that is, all seduced to Popish idolatry were seduced by the beastly vicar of Christ and his limbes; Jn. 11:48, ‘If we let him alone, all will believe in him;’ that is, none will believe in us, nor follow us; and all seduced men, shall be seduced by him… That Christ in this sense should be the Savior of all men, that He should have a negative voice in the salvation of all, that all the ransomed ones should come through his hands, is no other thing than Peter says, Acts 4:11, ‘That there is no other name under heaven by which men may be saved,’ and none comes to the Father, but by him, Jn. 14:6…</p></blockquote>

520a3180.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=%E2%80%A6the%20word%E2%80%A6%20%E2%80%98Christ%20died%20for%20all%E2%80%98,Father%2C%20but%20by%20him%2C%20Jn.%2014%3A6%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>An intention or a conscious goal is that which an agent aims to accomplish and the means are that which is used for attaining the intention. When the agent acts according to its nature, then the end of the action and the end of the agent is one and the same. But when the means are not fitted for the intentional end, then a distinction must be inferred between the end of the action and the end of the agent; between the intention and the intender. Now, the doctrine of divine simplicity implies that in God intention and Intender—act and Agent—cannot be other than one and the same. In humans intention and intender—acts and agents—may not be one and the same. In God the means for attaining the salvation of the elect are not, indeed cannot, be disproportionate to that end. There cannot be conditions—conditional redemption—to God. For according to the doctrine of divine simplicity, each thing is related to God, but God is not (reciprocally) related to anything. Yet, universalism anthropomorphically pictures God as using means that are not proportionate to the end and assumes that there is one intention in some salvific act and another intention in some other salvific act. Particularism upholds the doctrine of simplicity and consistently maintains the otherness of God in intending to save humans in Christ. Every salvific action of God is particular in intention, since in God intention and Intender cannot be other than one and the same.</p></blockquote>

<blockquote><p>We believe it can be proved to be the clear and certain teaching of Scripture, that Christ, having become our surety and substitute, took our place and assumed our responsibilities as transgressors of God’s law, and in consequence, endured the penalty we had incurred, and thereby rendered satisfaction to the Divine Justice and Law for our sins,—a satisfaction which was the true and adequate ground of all subsequent procedure on God’s part towards us, in bestowing forgiveness and spiritual blessings. Christ’s death, according to this view, was not merely penal in its general character, but it was on His part the endurance of the penalty we had merited,—the same penalty we had incurred;—the same, not, of course, in its circumstances or its external aspects, but in its legal value,—its moral worth, its real significance, as a compliance with the requirements of law, which denounced punishment and demanded satisfaction. It is true, indeed, that all orthodox divines have not attached quite so much importance as Dr. Owen does, to the distinction between the idem and the tantundem,—‘the same,’ and ‘the as much,’—a distinction which he presses so strongly in the exposition of this subject. Some divines of the highest eminence and orthodoxy have admitted that the substance of what Scripture teaches on this subject might be held to be declared by asserting that Christ suffered as much as sinners had deserved,—the tantundem and not the idem,—provided due care was taken to guard against the loose and vague generality of representing Christ’s death merely as a substitute for the penalty,—a phrase which may mean almost anything or almost nothing,—and to keep up distinctly and prominently the idea of substantial identity, or sameness as really attaching to it, when viewed as a judicial infliction in accordance with the provisions of law. But though some difference of phraseology has been sanctioned by high authority on this subject, there has been a very general concurrence of opinion among orthodox divines, that it is no real declaration of the scriptural doctrine of the Atonement to say that Christ’s death was a substitute for the penalty which men had incurred, or even to say that it was an equivalent for the penalty, unless the idea of substantial identity, or sameness,—sameness in worth and value, in import and significance,—be kept up, by its being represented as a full equivalent and an adequate compensation. This, at least, seems necessary in order to embody the sum and substance of what Scripture teaches upon the subject; and nothing short of this can be fairly held to be implied in the position that Christ suffered as a substitute for us, and thereby rendered satisfaction for our sins to God’s Justice and Law. Our [Westminster] Confession of Faith says (ch. 11, section 5) that both ‘the exact justice and the rich grace of God are glorified in the justification of sinners.’ And we are persuaded that it may be regarded as a general test of the soundness of men’s views upon this whole subject, that they not only assent honestly and intelligently to this statement of our Confession…</p></blockquote>

F642723a004.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/642723a004.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=We%20believe%20it%20can%20be%20proved,to%20this%20statement%20of%20our%20Confession%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect. IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>

<blockquote><p>9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>

<blockquote><p>Remonstrants: ‘Whoever ought to believe in Jesus Christ, for them Christ has died. But all and every person ought to believe in Christ. Therefore. Refutation 1: The proposition which you want, having a certain appearance of truth, is to be simply denied, unless however it is understood of the sufficiency of Christ’s death and of the end of his work.</p></blockquote>

<blockquote><p>Though I yield some degree of eﬃcacy in Christ’s death unto all; yet I conceive it far short, both of impetration [legal undertaking and payment of sins] and application of that gracious atonement, which is thereby wrought to the elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s bread is not meet for whelps; and full souls will despise honey-combs.</p></blockquote>

<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Miscellanies” (1722), WJE Online vol. 13, t. ‘Universal Redemption’</cite>, p. 174</span></figcaption>

<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: 1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person. 2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing. 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’ [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019)</cite>, pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-b4aa80c331" data-kw="">
<blockquote><p>‘For every man;’ to render sin remissible to all persons, and them salvable, God punishing man’s sin in Him, and laying on Him the iniquities of us all, Isa. 53:4-6; 1 Jn. 2:2; and so God became propitious and pleasable to all; and if all are not saved by it, it is because they do not repent and believe in Him, 2 Cor. 5:19-21; compare Jn. 10:15. This was evident to and well known by these Hebrews, as if they saw it, the work, concomitants, and effects of it demonstrating it. And this now in the gospel is evident to faith: it was so certainly visible and evidently true, as not to be denied but by infidels.</p></blockquote>

<blockquote><p>What are the fruits of this free grace of God with respect to the gift of Christ for us and to us, as related in this scripture-testimony… [3.] That God had made Him a little lower than the angels, in his being made man, that He might suffer and humble Himself to death. [4.] That God crowned the human nature of Christ with glory and honour… that by his sufferings He might make satisfaction, tasting death for every man, sensibly feeling and undergoing the bitter agonies of that shameful, painful, and cursed death of the cross, hereby putting all mankind into a new state of trial.</p></blockquote>

<blockquote><p>Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.</p></blockquote>

<blockquote><p>Again, that these same men admit in God a certain antecedent will of the salvation of all, he himself also acknowledges. From which it follows that, with much greater right, it is admitted in Christ. Moreover, this antecedent will does not pertain only to this: that God, abstracting from the fall of man, is said to desire the salvation of all, insofar as they are men; but, generally, the antecedent will of God is directed toward that which is right, that which is just, that which is good in itself. Thus, because it is right for man to be converted, to do penance, not to despise the goodness of God, not to reject his graces, to approach the Sacraments—God is considered to will all these things by an antecedent will, although, when the individual circumstances are considered, he has not decreed to confer upon each individual efficacious graces by which they certainly arrive at salvation, without which they certainly fall away from salvation. Therefore God does not desire, by an antecedent will, the salvation of all men merely on this account, that he made all rational creatures for blessedness; but also because, since he diffuses very many graces, both external and internal, among the reprobate, which it is unjust for them to abuse, and since he wills that an entrance into his Church should likewise be open to them, he is considered, by an antecedent will, to will that all arrive at salvation, because he would will that they not remain obstinate in wickedness, and that they make good use of the helps offered to them; although, on the other hand, by a will of justice, when all the circumstances are considered, he judged it better to leave them to their wickedness, and not to grant efficacious aids, by which alone the depravity of the human heart is overcome. Hence it is evident that God wills, by an antecedent will, the salvation both of the demons and of reprobate men; nevertheless, in a very different way in the case of men than in that of demons. For since he now offers no helps of grace to demons, nor wills that an entrance into the Church, or the aid of the sacraments, be open to them, consequently neither does he will them to make good use of his grace, which he now grants none to them. But, on the contrary, since men are still on the way, he must be thought, by an antecedent will, to desire for them conversion and a sincere return to himself and a good use of his graces, from which he by no means bars them—none of which he provides toward demons. That antecedent will, moreover, often seems to have been in Christ, as when he wept over Jerusalem and lamented its coming calamities in these words: “Luke says, ‘He wept over it, saying, If you also had known, and indeed in this your day, the things which are for your peace! But now they are hidden from your eyes, because days will come upon you, and your enemies will surround you with a rampart,’ etc.</p></blockquote>

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate. 32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. … 9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ… 10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>

<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.”

<blockquote><p>[Socinians and Photinians object:] (2) God is able to pardon sins without satisfaction. Therefore, it is probable, that He exacts no satisfaction. The antecedent is proven: Because He is able to remit of His own right as much as He pleases: since He is the absolute judge: but to each one one may remit as much as He pleases of his own right. Responses: 1. I deny the consequence; it is not valid to argue from the possible to the actual. 2. I also deny the antecedent. The proof is inconsequent: God is indeed able to remit of His own right as much as He pleases; but by His truth and righteousness He is not willing to remit so much, that without satisfaction He might forgive sins: because by His just judgment He once dictated to man the punishment of death: in the day that thou eatest therefore thou shalt surely die. Whence Scripture comments the righteousness of God in exacting satisfaction, Rom. 3:25. (3.) God wills to forgive us our sins without satisfaction. Therefore, He exacts no satisfaction. The antecedent is proven: because God does not exact anything from us except faith and repentance. Response: I deny the antecedent. The proof is inconsequent. For, even if from us He does not require and exact satisfaction: nevertheless, He exacts it from His Son, our Mediator, and imputes and grants the same to us freely. Faith itself implies this satisfaction: which is born toward Christ as the one redeeming and making satisfaction.</p></blockquote>

<blockquote><p>…Socinus in the very entrance into his Treatise of Christ the Saviour affirms that God might if He had pleased, without breach of his justice, have pardoned man’s sin freely, without any satisfaction required: and the same he after again presses and prosecutes in his ensuing discourses. Whether this be an error or no, I stand not now to discuss. Vorstius herein concurred with Socinus; and is for the same reproved by Tossanus; Grotius likewise for affirming the same is taxed by Ravenspergerus; defended by Vossius, who cites divines not a few, both old and new, saying the same: And it is maintained to pass by all others, by Calvin, Musculus, Zanchi, Grinaeus, Faius, Casman, Tilenus, Franzius, Smiglesius and our reverend Dr. Twisse; yet I am persuaded that no wise or discreet man at least will hence conclude any of these to be therefore Socinian heretics.</p></blockquote>

<blockquote><p>§3. God’s actual continuance of forfeited life, liberty, health, and other comforts, and his actual collation of many great mercies by the course of Nature, to such as by sin have deserved present damnation, is a degree of signification of his pardoning will and mercy by these natural signs (which they were not before sin and forfeiture). §4. Man being after guilt of death, thus reprieved and enriched with manifold mercies, and his life and faculties continued with many instructing providential helps and means, the very Law of Nature now obliges him to love and thankfulness to God that shows him so great kindness. §5. And the same Law of Nature obliges him to take that God still for a God of love and mercy, and to believe, that what mercy He has already showed the world and us, is on terms which he knows to be very well consistent with his holiness, truth and justice: And it obliges us therefore to seek to Him for mercy, and to use all possible means for further hope and pardon and recovery, and not to sit down in despair. §6. The common sense of all mankind from Adam to this day, acquaints us by that experience, that these hopes and duties are found in the Law of lapsed Nature: For all the world that never heard the Gospel, do yet take God to be a merciful, forgiving God, and take themselves to be under some duty for the obtaining of further mercy, recovery and felicity. §7. Though want of the sense of sin, and its desert, and man’s misery may be thought by some to be the only cause of this, and so that it is but sinful presumption, and no part of Nature’s obligation; yet this upon trial will prove false (though what they allege be one part of the cause). For: 1. These men do acknowledge themselves sinners, and to deserve punishment from God. 2. They find some misery and fear more. 3. It is not presumption to judge God to be merciful, when they and all the world do find Him so. 4. It is not presumption to judge, that he can and will pardon sin, when full experience assures us, that He has already pardoned much. To remit the sin, is (as we now speak of it) to remit the deserved punishment. And He that gives man forfeited life, health, time, and all the abundant mercies which the world is full of, does thereby so far actually forgive sin: Says Christ, ‘Whether is it easier to say thy sins be forgiven thee, or to say arise, take up thy Bed and walk,’ that is, Executively to forgive them, which is the full forgiveness, by taking away the punishment. 5. It is no presumption to believe such duty to be incumbent on us, as the remaining Law of Nature does oblige us to. 6. Nor yet to take God’s own encouragements to seek our own recovery and felicity. §8. The Light and Law of lapsed Nature does convince men of the duty of repenting and returning to God, and oblige them to it. So that as perfect obedience was the duty of entire Nature, so repentance is the duty of lapsed Nature: And I think few will say that all men are not hereby obliged to repent, and that in hope of mercy. §9. Hence it is that it is found among the communes notitiae [common notions], and all the world as well as Christians acknowledge it and plead for it. §10. They that by God’s patience and mercy are invited to repentance, which is a return from sin to God, and are by Nature obliged to it, ought to believe that it is not made their duty in vain, nor shall they lose by it if they perform it; for that were to accuse God of making man’s duty in vain, or to his loss, which is not to be suspected. §11. Therefore they are bound not to despair of pardon and salvation; for an obligation to use means as tending to recovery, is inconsistent with an obligation to despair. Therefore hope of mercy and use of some means mankind is obliged to by the Law of lapsed Nature. §12. This is not the obligation of the Law or Covenant of Innocency; for that Law bound us only as innocent to keep our innocency and perfectly therein obey: But it gives no pardon, nor appoints man any duty in order to pardon and recovery: Whatever does this, is a Law of Grace. §13. The sum of that duty which the Law of Nature now obliges man to, is, to consider of all the mercies which God vouchsafes sinners, and thankfully to improve them; to repent of sin, and turn to this God, who shows Himself a merciful pardoning God; To resign themselves to Him as their Owner, to obey Him as their Ruler, and to love and seek Him as their ultimate end; and to believe that his mercy will not let us be losers in so doing, nor to do it in vain. §14. But the supernatural revelation tells us much more than all this, of the promised Seed, the means of our salvation, and of our duty in believing them, and of the certainty and nature of the pardon, deliverance, and blessedness which we shall attain.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§3. God’s actual continuance of forfeited life, liberty, health, and other comforts, and his actual collation of many great mercies by the course of Nature, to such as by sin have deserved present damnation, is a degree of signification of his pardoning will and mercy by these natural signs (which they were not before sin and forfeiture). §4. Man being after guilt of death, thus reprieved and enriched with manifold mercies, and his life and faculties continued with many instructing providential helps and means, the very Law of Nature now obliges him to love and thankfulness to God that shows him so great kindness. §5. And the same Law of Nature obliges him to take that God still for a God of love and mercy, and to believe, that what mercy He has already showed the world and us, is on terms which he knows to be very well consistent with his holiness, truth and justice: And it obliges us therefore to seek to Him for mercy, and to use all possible means for further hope and pardon and recovery, and not to sit down in despair. §6. The common sense of all mankind from Adam to this day, acquaints us by that experience, that these hopes and duties are found in the Law of lapsed Nature: For all the world that never heard the Gospel, do yet take God to be a merciful, forgiving God, and take themselves to be under some duty for the obtaining of further mercy, recovery and felicity. §7. Though want of the sense of sin, and its desert, and man’s misery may be thought by some to be the only cause of this, and so that it is but sinful presumption, and no part of Nature’s obligation; yet this upon trial will prove false (though what they allege be one part of the cause). For: 1. These men do acknowledge themselves sinners, and to deserve punishment from God. 2. They find some misery and fear more. 3. It is not presumption to judge God to be merciful, when they and all the world do find Him so. 4. It is not presumption to judge, that he can and will pardon sin, when full experience assures us, that He has already pardoned much. To remit the sin, is (as we now speak of it) to remit the deserved punishment. And He that gives man forfeited life, health, time, and all the abundant mercies which the world is full of, does thereby so far actually forgive sin: Says Christ, ‘Whether is it easier to say thy sins be forgiven thee, or to say arise, take up thy Bed and walk,’ that is, Executively to forgive them, which is the full forgiveness, by taking away the punishment. 5. It is no presumption to believe such duty to be incumbent on us, as the remaining Law of Nature does oblige us to. 6. Nor yet to take God’s own encouragements to seek our own recovery and felicity. §8. The Light and Law of lapsed Nature does convince men of the duty of repenting and returning to God, and oblige them to it. So that as perfect obedience was the duty of entire Nature, so repentance is the duty of lapsed Nature: And I think few will say that all men are not hereby obliged to repent, and that in hope of mercy. §9. Hence it is that it is found among the communes notitiae [common notions], and all the world as well as Christians acknowledge it and plead for it. §10. They that by God’s patience and mercy are invited to repentance, which is a return from sin to God, and are by Nature obliged to it, ought to believe that it is not made their duty in vain, nor shall they lose by it if they perform it; for that were to accuse God of making man’s duty in vain, or to his loss, which is not to be suspected. §11. Therefore they are bound not to despair of pardon and salvation; for an obligation to use means as tending to recovery, is inconsistent with an obligation to despair. Therefore hope of mercy and use of some means mankind is obliged to by the Law of lapsed Nature. §12. This is not the obligation of the Law or Covenant of Innocency; for that Law bound us only as innocent to keep our innocency and perfectly therein obey: But it gives no pardon, nor appoints man any duty in order to pardon and recovery: Whatever does this, is a Law of Grace. §13. The sum of that duty which the Law of Nature now obliges man to, is, to consider of all the mercies which God vouchsafes sinners, and thankfully to improve them; to repent of sin, and turn to this God, who shows Himself a merciful pardoning God; To resign themselves to Him as their Owner, to obey Him as their Ruler, and to love and seek Him as their ultimate end; and to believe that his mercy will not let us be losers in so doing, nor to do it in vain. §14. But the supernatural revelation tells us much more than all this, of the promised Seed, the means of our salvation, and of our duty in believing them, and of the certainty and nature of the pardon, deliverance, and blessedness which we shall attain.”

— Richard Baxter, An End of Doctrinal Controversies… (London: Salusbury, 1691), ch. 12, Of the Several Laws or Covenants of God, sect. 3, ‘Of the Law or Covenant of Grace in the First Edition’, pp. 127-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A73.+God%E2%80%99s+actual+continuance+of+forfeited+life%2C+liberty%2C+health%2C+and+other+comforts%2C+and+his+actual+collation+of+many+great+mercies+by+the+course+of+Nature%2C+to+such+as+by+sin+have+deserved+present+damnation%2C+is+a+degree+of+signification+of+his+pardoning+will+and+mercy+by+these+natural+signs+%28which+they+were+not+before+sin+and+forfeiture%29.+%C2%A74.+Man+being+after+guilt+of+death%2C+thus+reprieved+and+enriched+with+manifold+mercies%2C+and+his+life+and+faculties+continued+with+many+instructing+providential+helps+and+means%2C+the+very+Law+of+Nature+now+obliges+him+to+love+and+thankfulness+to+God+that+shows+him+so+great+kindness.+%C2%A75.+And+the+same+Law+of+Nature+obliges+him+to+take+that+God+still+for+a+God+of+love+and+mercy%2C+and+to+believe%2C+that+what+mercy+He+has+already+showed+the+world+and+us%2C+is+on+terms+which+he+knows+to+be+very+well+consistent+with+his+holiness%2C+truth+and+justice%3A+And+it+obliges+us+therefore+to+seek+to+Him+for+mercy%2C+and+to+use+all+possible+means+for+further+hope+and+pardon+and+recovery%2C+and+not+to+sit+down+in+despair.+%C2%A76.+The+common+sense+of+all+mankind+from+Adam+to+this+day%2C+acquaints+us+by+that+experience%2C+that+these+hopes+and+duties+are+found+in+the+Law+of+lapsed+Nature%3A+For+all+the+world+that+never+heard+the+Gospel%2C+do+yet+take+God+to+be+a+merciful%2C+forgiving+God%2C+and+take+themselves+to+be+under+some+duty+for+the+obtaining+of+further+mercy%2C+recovery+and+felicity.+%C2%A77.+Though+want+of+the+sense+of+sin%2C+and+its+desert%2C+and+man%E2%80%99s+misery+may+be+thought+by+some+to+be+the+only+cause+of+this%2C+and+so+that+it+is+but+sinful+presumption%2C+and+no+part+of+Nature%E2%80%99s+obligation%3B+yet+this+upon+trial+will+prove+false+%28though+what+they+allege+be+one+part+of+the+cause%29.+For%3A+1.+These+men+do+acknowledge+themselves+sinners%2C+and+to+deserve+punishment+from+God.+2.+They+find+some+misery+and+fear+more.+3.+It+is+not+presumption+to+judge+God+to+be+merciful%2C+when+they+and+all+the+world+do+find+Him+so.+4.+It+is+not+presumption+to+judge%2C+that+he+can+and+will+pardon+sin%2C+when+full+experience+assures+us%2C+that+He+has+already+pardoned+much.+To+remit+the+sin%2C+is+%28as+we+now+speak+of+it%29+to+remit+the+deserved+punishment.+And+He+that+gives+man+forfeited+life%2C+health%2C+time%2C+and+all+the+abundant+mercies+which+the+world+is+full+of%2C+does+thereby+so+far+actually+forgive+sin%3A+Says+Christ%2C+%E2%80%98Whether+is+it+easier+to+say+thy+sins+be+forgiven+thee%2C+or+to+say+arise%2C+take+up+thy+Bed+and+walk%2C%E2%80%99+that+is%2C+Executively+to+forgive+them%2C+which+is+the+full+forgiveness%2C+by+taking+away+the+punishment.+5.+It+is+no+presumption+to+believe+such+duty+to+be+incumbent+on+us%2C+as+the+remaining+Law+of+Nature+does+oblige+us+to.+6.+Nor+yet+to+take+God%E2%80%99s+own+encouragements+to+seek+our+own+recovery+and+felicity.+%C2%A78.+The+Light+and+Law+of+lapsed+Nature+does+convince+men+of+the+duty+of+repenting+and+returning+to+God%2C+and+oblige+them+to+it.+So+that+as+perfect+obedience+was+the+duty+of+entire+Nature%2C+so+repentance+is+the+duty+of+lapsed+Nature%3A+And+I+think+few+will+say+that+all+men+are+not+hereby+obliged+to+repent%2C+and+that+in+hope+of+mercy.+%C2%A79.+Hence+it+is+that+it+is+found+among+the+communes+notitiae+%5Bcommon+notions%5D%2C+and+all+the+world+as+well+as+Christians+acknowledge+it+and+plead+for+it.+%C2%A710.+They+that+by+God%E2%80%99s+patience+and+mercy+are+invited+to+repentance%2C+which+is+a+return+from+sin+to+God%2C+and+are+by+Nature+obliged+to+it%2C+ought+to+believe+that+it+is+not+made+their+duty+in+vain%2C+nor+shall+they+lose+by+it+if+they+perform+it%3B+for+that+were+to+accuse+God+of+making+man%E2%80%99s+duty+in+vain%2C+or+to+his+loss%2C+which+is+not+to+be+suspected.+%C2%A711.+Therefore+they+are+bound+not+to+despair+of+pardon+and+salvation%3B+for+an+obligation+to+use+means+as+tending+to+recovery%2C+is+inconsistent+with+an+obligation+to+despair.+Therefore+hope+of+mercy+and+use+of+some+means+mankind+is+obliged+to+by+the+Law+of+lapsed+Nature.+%C2%A712.+This+is+not+the+obligation+of+the+Law+or+Covenant+of+Innocency%3B+for+that+Law+bound+us+only+as+innocent+to+keep+our+innocency+and+perfectly+therein+obey%3A+But+it+gives+no+pardon%2C+nor+appoints+man+any+duty+in+order+to+pardon+and+recovery%3A+Whatever+does+this%2C+is+a+Law+of+Grace.+%C2%A713.+The+sum+of+that+duty+which+the+Law+of+Nature+now+obliges+man+to%2C+is%2C+to+consider+of+all+the+mercies+which+God+vouchsafes+sinners%2C+and+thankfully+to+improve+them%3B+to+repent+of+sin%2C+and+turn+to+this+God%2C+who+shows+Himself+a+merciful+pardoning+God%3B+To+resign+themselves+to+Him+as+their+Owner%2C+to+obey+Him+as+their+Ruler%2C+and+to+love+and+seek+Him+as+their+ultimate+end%3B+and+to+believe+that+his+mercy+will+not+let+us+be+losers+in+so+doing%2C+nor+to+do+it+in+vain.+%C2%A714.+But+the+supernatural+revelation+tells+us+much+more+than+all+this%2C+of+the+promised+Seed%2C+the+means+of+our+salvation%2C+and+of+our+duty+in+believing+them%2C+and+of+the+certainty+and+nature+of+the+pardon%2C+deliverance%2C+and+blessedness+which+we+shall+attain.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+An+End+of+Doctrinal+Controversies%E2%80%A6+%28London%3A+Salusbury%2C+1691%29%2C+ch.+12%2C+Of+the+Several+Laws+or+Covenants+of+God%2C+sect.+3%2C+%E2%80%98Of+the+Law+or+Covenant+of+Grace+in+the+First+Edition%E2%80%99%2C+pp.+127-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c37b5eb0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c37b5eb0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=%C2%A73.%20God%E2%80%99s%20actual%20continuance%20of%20forfeited,and%20blessedness%20which%20we%20shall%20attain." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d7af0bea8a" data-kw="">
<blockquote><p>Here Owen appears to waver. On the one hand he allows that punishments may vary provided that the end of satisfying justice is met. On the other hand he seems to make an exception of the atonement, arguing or rather implying that there could not be another mode of satisfaction for sin than atonement by the God-man, the surety who has substituted himself in the room of sinners. Yet he seems to allow the possibility (though one that we are not in a position to know about) that the manner, time etc. of punishment belongs entirely to God, whose counsel we do not know. Which raises the question of why, if punishments in general, in respect of their nature and circumstances, are in the hand of God, why the punishment for sin may not similarly be. And if it may similarly be, even if we have not a clue about what an alternative mode of punishment may be in this case, then the atonement by Christ is not necessary in even the restricted sense that Owen has argued for earlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/paul-helm.html">Paul Helm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analysis 13 – Owen’s Option’ (2008) 17 paragrpahs at Helm’s Deep</cite></span></figcaption>

<blockquote><p>XXI. However, it is not possible for God to grant grace without a satisfaction corresponding to justice. For since He has given a law to man, denounced penalties for transgressors, and appointed judgment—and since He is, by nature, a judge—it cannot happen that in judging, He would act against the office of a just judge. But it would violate justice to justify and release the guilty without satisfaction, even if the guilty party repented. … XXVIII. From all this it is understood that there is no remission of sins without satisfaction, and no satisfaction except that which Christ, God manifested in the flesh, has perfectly rendered for us—being made sin and a curse for us (2 Cor. 5:21; Gal. 3:13), and then justified by the Father through His resurrection and glorification, receiving thereby the full acquittal (or apoche).</p></blockquote>

<blockquote><p>Regarding the first , the Arminians think that the death of Christ was not necessary for procuring salvation for men, and they believe that God could have pardoned sins without any satisfaction. The Orthodox [Reformed], indeed, believe that that way of saving the human race was the most fitting of all, since God was pleased to use it; yet most of them readily concede to the Arminians that it was not absolutely necessary, and they do not contend that God’s justice was to that extent inexorable. Amyraut believes that God’s justice is so inflexible, and the majesty of his laws so holy and inviolable, that it could not suffer sins to be pardoned without satisfaction. In this matter, he has surrounded the orthodox doctrine with a defense by which it is stripped by many others. He has, moreover, proved his opinion on this matter with arguments in his Theses on the Necessity of Satisfaction for Grace.</p></blockquote>

<blockquote><p>III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall: 1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.). 2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)? 3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God. 4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…</p></blockquote>

<blockquote><p>Carl Trueman’s study of the thought of John Owen both analyzes Owen’s own change of position and sets Owen’s doctrinal argumentation into the context of a centuries-long doctrinal conversation and debate over the necessity of the atonement, noting the position of Aquinas [holding to consequent necessity], the shift in argumentation brought about by Scotus’ voluntarism, and the apparent reflection of the Scotist view in Calvin’s own thought. Owen’s earlier approach followed out this more or less Scotistic approach and found confirming echoes in the thought of William Twisse and Samuel Rutherford. In his later approach, Owen saw the primary threat to orthodoxy as arising not from the Arminians but from the Socinians and, accordingly refocused his argument from a more intellectualist perspective and rooted the necessity of the atonement in God’s vindicatory justice. This shift in Owen’s formulation and the fact that it involved significant debate with and departure from the views of such significant Reformed thinkers as Calvin, Musculus, Twisse, and Rutherford and actually, as Trueman notes, put Owen into the company of Pareus, Piscator, Lubbertus, Cameron, and Maccovius, very clearly illustrates the diversity of the Reformed tradition, the presence of significant debates within the confessional tradition… Owen’s mature views placed him, on this particular issue, consciously in the camp of Piscator, Cameron, and Amyraut.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Carl Trueman’s study of the thought of John Owen both analyzes Owen’s own change of position and sets Owen’s doctrinal argumentation into the context of a centuries-long doctrinal conversation and debate over the necessity of the atonement, noting the position of Aquinas [holding to consequent necessity], the shift in argumentation brought about by Scotus’ voluntarism, and the apparent reflection of the Scotist view in Calvin’s own thought. Owen’s earlier approach followed out this more or less Scotistic approach and found confirming echoes in the thought of William Twisse and Samuel Rutherford. In his later approach, Owen saw the primary threat to orthodoxy as arising not from the Arminians but from the Socinians and, accordingly refocused his argument from a more intellectualist perspective and rooted the necessity of the atonement in God’s vindicatory justice. This shift in Owen’s formulation and the fact that it involved significant debate with and departure from the views of such significant Reformed thinkers as Calvin, Musculus, Twisse, and Rutherford and actually, as Trueman notes, put Owen into the company of Pareus, Piscator, Lubbertus, Cameron, and Maccovius, very clearly illustrates the diversity of the Reformed tradition, the presence of significant debates within the confessional tradition… Owen’s mature views placed him, on this particular issue, consciously in the camp of Piscator, Cameron, and Amyraut.”

adition%3A+a+Historiographical+Introduction%E2%80%9D+in+eds.+Haykin+%26+Jones%2C+Drawn+into+Controversie%3A+Reformed+Theological+Diversity+%26+Debates+within+Seventeenth-Century+British+Puritanism+%28V%26R%2C+2011%29%2C+pp..+26-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb2d7dc0b3f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b2d7dc0b3f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=Carl%20Trueman%E2%80%99s%20study%20of%20the%20thought,camp%20of%20Piscator%2C%20Cameron%2C%20and%20Amyraut." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3060066d73" data-kw="">
<blockquote><p>VIII. …We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted; or that salvation was purchased for him, whom God from eternity hath decreed to condemn: for this were a vain purchase… IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: and that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally, Christ may be said to reconcile all men to God by his death, after the same manner, that we say that the sun doth enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkness: Because if all and several men had their eyes, and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: after the same manner that the apostle saith, 1 Cor. 15:20, that ‘all men are made alive by Christ’, because no man is made alive but by Him.</p></blockquote>

</figure><figure class="quote" id="q-01a23db27c" data-kw="">
<blockquote><p>But here it is asked, since Christ is said to have tasted death for every man (Heb. 2:9), and for all (2 Cor. 5:15), and to have given Himself a ransom for all (1 Tim. 2:6), whether this can and ought to be understood of all men without exception, even of those who become not partakers of righteousness and life, nor are elected and given to Christ by special grace: at least with a distinction between sufficiency and efficacy? We answer… there are grave reasons why we dare not speak in this manner, in whatever sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-coccejus.html">Johannes Coccejus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Christ Satisfied for All’ in ch. 61, ‘On the Satisfaction of Christ’ in Sum of Theology (Geneva, 1665), trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-ponter.html">David Ponter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Classic “Sufficient for all, Efficient for the elect” and its Revision’ at Calvin &amp; Calvinism The webmaster is a hypothetical universalist. | This historical development of the interpretation of the Lombardian formula is partially confirmed by William Cunningham, The Reformers &amp; the Theology of the Reformation (Edinburgh: T&amp;T Clark, 1866), Essay 7, ‘Calvin &amp; Beza’</cite>, p. 397:</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Reply to Objection 4: Although the drop of blood that bled in the circumcision would be sufficient for every satisfaction, considering the condition of the divine person, nevertheless it would not be sufficient relative to the kind of penalty. For the human race was obligated to death, for which it was necessary that a death be paid. … Reply to Objection 6: The other penalties that Christ endured, although they were sufficient to make satisfaction on behalf of human nature, considering the condition of the one suffering, nonetheless this is not the case when considering the kind of penalty. For all other penalties were not contained in those penalties, as they were in the suffering of death.</p></blockquote>

<blockquote><p>Futher, though all men are not brought to salvation, yet the merit and grace of Christ, was of itself sufficient for all men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries… upon… Romans… (London: Iohn Daye, 1558)</cite>, p. 116b</span></figcaption>

</figure><figure class="quote" id="q-f1145c7e24" data-kw="">
<blockquote><p>Not all those who are called are predestined. For Christ said: ‘Many are called, but few are chosen’ (Mt. 22:14). But they contend that the calling is universal and that God would wish everyone saved. If it is understood as universal calling because it is offered to all and no one is excluded by name, it is true. If it is also called universal because the death of Christ and his redemption is sufficient for the whole world; that also is most true. But if this universality is meant so that He it is in everyone’s hand to receive the promises, I deny it: because to some it is given, to others it is not given. As if we did not see also that for a long time the very preaching of the Gospel was not given to many places, ages, and nations. God would have all to be saved, provided they believe. He gives faith to whom it seems good to Him. For He may justly do with his own what he will.</p></blockquote>

</figure><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>

</figure><figure class="quote" id="q-c95490c981" data-kw="">
<blockquote><p>Unto whom is the death and passion of Christ profitable? Although He might have been a sufficient price for the sins for all men, yet actually and effectually he died for his elect only, who receive Him and believe Him, Matt 1:21. “He will deliver his people from their sins.” John 10:15. “I lay down my life for my sheep.” and Chap. 17:19 “I sanctify myself,” for otherwise it would follow that Christ died [without] profit, and to no purpose in regard of many, and that the efficacy of Christ’s death could be made void by men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (London, 1606)</cite>, p. 235</span></figcaption>

</figure><figure class="quote" id="q-bb7c5b46b9" data-kw="">
<blockquote><p>Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (London, 1606)</cite>, pp. 433-34</span></figcaption>

</figure><figure class="quote" id="q-3f292d259d" data-kw="">
<blockquote><p>‘Who has made us fit’. Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (John 10), for his Church only (Eph. 1), not for the world (John 17). And therefore when the Scripture says, Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the Elect: for all, that is, for the Elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the Gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians (1617)</cite>, p. 99</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘Who has made us fit’. Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (John 10), for his Church only (Eph. 1), not for the world (John 17). And therefore when the Scripture says, Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the Elect: for all, that is, for the Elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the Gentiles also.”

— Nicholas Byfield, An Exposition Upon the Epistle to the Colossians (1617), p. 99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Who+has+made+us+fit%E2%80%99.+Doctrine%3A+We+are+neither+naturally+happy%2C+nor+universally+so%3B+not+naturally%2C+for+we+are+made+fit%3B+not+born+so%2C+not+universally%3B+for+He+has+made+%5Bus%5D+fit%2C+not+all+men.+Christ+died+for+his+sheep+only+%28John+10%29%2C+for+his+Church+only+%28Eph.+1%29%2C+not+for+the+world+%28John+17%29.+And+therefore+when+the+Scripture+says%2C+Christ+died+for+all+men%2C+we+must+understand+it%3A+First%2C+in+respect+of+the+sufficiency+of+his+death%2C+not+in+respect+of+the+efficiency+of+it.+Secondly%2C+in+respect+of+the+common+oblation+of+the+benefits+of+his+death+externally+in+the+Gospel+unto+all.+Thirdly%2C+as+his+death+extends+to+all+the+Elect%3A+for+all%2C+that+is%2C+for+the+Elect.+Fourthly%2C+for+all%2C+that+is%2C+for+all+that+are+saved%2C+so+that+none+that+are+justified+and+saved%2C+are+so%2C+but+by+the+virtue+of+his+death.+Fifthly%2C+for+all%2C+that+is+for+all+indefinitely%2C+for+all+sorts+of+men%2C+not+for+every+man+of+every+sort.+Lastly%2C+He+died+for+all%2C+that+is+not+for+the+Jews+only%2C+but+for+the+Gentiles+also.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+An+Exposition+Upon+the+Epistle+to+the+Colossians+%281617%29%2C+p.+99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f292d259d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f292d259d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=%E2%80%98Who%20has%20made%20us%20fit%E2%80%99.%20Doctrine%3A,only%2C%20but%20for%20the%20Gentiles%20also." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>LXXV. But by reason of the latter, distinctly, not all but many are named. For even though, on account of the infinite dignity of Christ’s Person, the price of His death is of infinite value (so that it would abundantly suffice for the salvation of even a thousand worlds, if they believed), nevertheless it is demonstrated in the Sacred Scriptures by this distinction of many from the rest, and by other invincible reasons, that He died as Savior not in the place and for the good of all, even the reprobate, but only of the elect.</p></blockquote>

</figure><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity in ed. John Beardslee, Reformed Dogmatics (Grand Rapids: Baker, 1977)</cite>, pp. 105-6</span></figcaption>

</figure><figure class="quote" id="q-6337527b5a" data-kw="">
<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>

</figure><figure class="quote" id="q-456a527028" data-kw="">
<blockquote><p>Touching that saying, ‘Denying the Lord that bought them;’ none are properly said to be bought by the Lord, but the elect; yet in a large sense, all to whom the Gospel comes are said to be bought by Him, yea all men, because the price He paid is sufficient to ransom all; neither is it by any defect therein that any perish, but through their own wickedness and unbelief.</p></blockquote>

</figure><figure class="quote" id="q-95071b0da1" data-kw="">
<blockquote><p>How did Christ condemn and pass sentence on the wicked world in his death? 1. He did it legally, in that his offering of a sufficient ransom for sin, there is a seal put on the condemnation of all impenitent men, that they shall ‘not see life but the wrath of God’ (that they were by nature under, being the captives of the Law) ‘abides on them,’ Jn. 3:36. ‘Because they believe not in the Son of God,’ Jn. 16:9. Christ’s dying day was the unbelievers’ doomsday.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 197</span></figcaption>

</figure><figure class="quote" id="q-42f7ff9a1c" data-kw="">
<blockquote><p>Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 233</span></figcaption>

<blockquote><p>Answer: You are neither to lay such a supposition down that either you are excluded from the number of those that Christ died for or included in that number: neither of the two are revealed to you, and secret things belong to the Lord. It is enough to you that: 1. you are not excluded, for anything that is revealed to you. 2. That thou have need of Christ, and are a guilty sinner. 3. That thou art commanded to believe: As for Christ’s not shedding of his blood for thee; say it were so: it’s no more absurd that you are obliged to believe on Christ as an all sufficient Redeemer for remission of sins (though remission be not purchased to you in Christ’s blood)…</p></blockquote>

<blockquote><p>2. It is to be considered, how many ways Christ may be said to give Himself [Greek], a ransom for us, or in our place. 1. Christ has sufficiently died for all [the elect] in their room to redeem them. For, pro [Greek], ‘for men’, notes ever the decree and intention of Christ dying for men; but the sufficiency and worth and intrinsical dignity of Christ’s death depends not upon the decree and intention of God, for the worth of the death and the blood of Him who is God, Acts 20:28; 1 Cor. 2:8, and the Lord of Glory is infinite, because of the infinitness of the Person, before and without the decree of God.</p></blockquote>

</figure><figure class="quote" id="q-ddb35e7337" data-kw="">
<blockquote><p>The second sort of divines (Contra-Remonstrants) [those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of the Covenant of Grace (1645), pp. 205-6, According to Mitchell and Struthers, who compiled the 1800’s edition of the Notes to the Westminster Assembly, Ball’s work “was held in high esteem by the Puritans, and [was] recommended by Reynolds, as well as Calamy and several other members of the Westminster Assembly.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-49b66891f4" data-kw="">
<blockquote><p>This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity… with Notes by the Rev. Thomas Boston (London: Tegg, 1837)</cite>, p. 106, Notes of Boston</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

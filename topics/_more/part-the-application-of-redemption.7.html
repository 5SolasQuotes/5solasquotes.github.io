<figure class="quote" id="q-97718e7522" data-kw="">
<blockquote><p>Yea, thou wilt find, that he, who prevented thee with grace, &amp; sought thee, ere ever thou soughtest him, &amp; gave thee grace to cry and pray, Have mercy, O God, yet he will seem to mis-know thee, and make thee none answer. Thou wilt cry in sickness, Mercy, but wilt thou always find mercy? No, no, thou wilt cry in other troubles, Mercy, and his Spirit no question will intercede for thee, and yet for a time he will make thee none answer. What meaneth this? why doeth he so? Now when he hath given thee grace to cry for mercy, a thirst &amp; an hunger for grace, (Blessed are they that hunger &amp; thirst) when he hath given thee this first grace, he will let thee cry a great while to try thy constancy.

We never get a spiritual grace in this life, but with the grace we get always a trial: and when he giveth us grace to cry: he will try if we will cry on. And to speak the truth, Brethren, All our life here, is but a trial of the graces of GOD, which he hath given us. We get not our heaven here, but a faith to look a far of unto it, an hunger, a thirst, a desire of it, and with our thirst a trial of our Faith, a trial of our Hope, of our desire, to see if we will stand in it. And then saith Peter, in the life to come, the trial of thy faith, and hope, and patience, being ended, What shall follow, Praise, and honour, and glory, when JESUS shall appear, 1. Pet. 1. 7. Thou shalt bee filled with saciety and fullness of joy, thine hunger and thirst shall be satisfied as soon as ever thou seest thy Redeemer.</p></blockquote>

</figure><figure class="quote" id="q-b72348cc45" data-kw="">
<blockquote><p>Hence the promises of the Gospel are indefinite, not universal, and in the Lord’s purpose and intention made with the Elect only, not with the Reprobate at all, for when God saith, if Judas, Cain, Pharaoh, believe they shall be saved, the Lords purpose being to deny to them the grace of believing, without which it is unpossible they can believe, the promise in God’s purpose is not made with them: He that so willeth what he promiseth upon a condition, which he that so willeth, only can do and work, and yet will not do or work the condition; he doth indeed not will to the party, what is so promised, if John send Peter to work in his garden upon condition, that if he work, he shall give him a talent a day, and in the mean while John only can give to Peter strength of legs, and arms, and body to work, can determine his consent to the work, and yet refuse to give strength, and to win his consent to the work; Sure he never willed either to give him a talent for his work, nor intended he should work at all.

Hence I argue, it is against the wisdom of God to intend and will that the Reprobate be redeemed, pardoned, saved, upon a condition, which he himself only can work by his grace, and absolutely and irresistibly will not work. Now in Scripture such a thing is argued not to be done, because the Scripture must be fulfilled; and the decree of God and his will fulfilled, as Christ’s bones upon this ground, could not be broken, and such a thing is done that the Scripture, and so the will and decree of God might be fulfilled, so that which is never done, is simply God’s will it shall never be done; that which is done is simply God’s will it must be; I mean either his permissive or approving will; and the will of God revealing, what is the duty of Reprobates though it never be done, argues it was not simply the will of God; hence that voluntas signi, in which God reveals what is our duty, and what we ought to do; not what is his decree, or what he either will, or ought to do, is not God’s will properly, but by a figure only, for commands, and promises, and threatnings revealed, argue not the will and purpose, decree or intention of God, which are properly his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself, or, A survey of our Saviour in his soul-suffering, his loveliness in his death, and the efficacy thereof</cite>, (London: Andrew Crooke, 1647), pp 415-16.</span></figcaption>

<blockquote><p>That God did intend the salvation and repentance of those to whom he never gave repentance and salvation, I hold it as impossible for you or any man to prove, as to pull God down from the throne of his omnipotency, or disrobe him of his immutable perfection: For, unless God continues to intend their repentance and salvation, even when they are damned, he must be mutable; and if he did will and desire their salvation, the reason why they failed of salvation must needs be, because God was not able to procure it. I never met yet with any other then vile shifts, to avoid these consequences, both in Arminius, and others that follow him.

But consider we your proofs: nay, what proof do you bring to prove the point you undertake, namely, that God doth not only intend their repentance, but that in the first place; and yet you cannot deny but that this, which you say God intends in the first place, never comes to pass: whereas the other, which God intends (you confess) though in a latter place, doth come to pass. But because I think it were absurd to conceive, that God intends their repentance whom he purposeth to harden, lest they should convert, and God should heal them; therefore I am willing to consider what you bring to the contrary.

Your first place is out of Deut. 8. 16. Who fed thee in the wilderness with manna, which thy fathers knew not, to humble thee, and to prove thee, and that he might do thee good in thy latter end. That of humbling thee, Junius and Piscator reads thus, ut affligeret te; belike, partly in reference to that which followeth, and to prove thee; (for as much as temporal humiliation hath more congruity to the proving of them, than spiritual; as whereby they humble themselves, and which followeth the proving of them, rather than goeth before it;) partly in reference to the third Verse, going before, where it is said more at full, Therefore he humbled thee, and made thee hungry, and fed thee with manna, which thou knewest not, neither did thy fathers know it; that he might teach thee, that man liveth not by bread only.

By which words we may gather a fair interpretation of that you allege: If it be spoken of humiliation spiritual, thus, He fed thee with manna to humble thee; that is, to teach thee to humble thy self: and so indeed his providence, providing alike to them all, did equally teach them all to humble themselves. But did God intend that every one should, de facto, humble himself? why then did he not give them eyes to see, and ears to hear, and an heart to perceive, as Deut. 29. 4. Moses tells them plainly, saying, Yet the Lord hath not given you an heart to perceive, and eyes to see, and ears to hear, unto this day.

I deny not but God did manifest, by the course of his providence towards them, what he did require and deserve at their hands, namely, that they should humble themselves to walk with the Lord their God; and the phrase, to humble thee, applied even to the most carnal, may have a fair construction, that thou shouldst be humbled, or, humble thy self, understanding it ex officio; for hereby he did manifest that this was their duty, answerable to God’s proceedings with them: and yet further, considering that he representeth his own gracious proceedings with them, by the proceedings of an earthly father with his children, Verse 5. Know therefore in thine heart, that as a man nurtureth his son, so the Lord thy God nurtureth thee; no marvel if he expresseth his affections and desires towards them, suitable to the desires and affections of an earthly father, who being not able effectually to procure their amendment, yet desires it.

And this is God’s usual course, to express himself in such language … But, shall we hereupon take liberty to build doctrines, as touching the nature of God, as if that which is figuratively uttered were properly delivered? He proved them all, I confess, and upon the probation some proved good silver, and others no better than dross; and thereupon he did good to the one in their latter end, and not unto the other: Neither did he ever purpose, that good in their latter end should redound unto any, but as they should be humbled: wherein, humiliation is made the condition of doing them good, not of God’s purpose or intention: And withal, God gave unto those that were truly mortified, that is, truly humbled, hearts to perceive, eyes to see, and ears to hear; but he gave not the like grace unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), pp 81-83.</span></figcaption>

<blockquote><p>The first step to true and sound repentance is to be wounded and disquieted in our hearts for sin, until our souls be pierced, and as it were struck through with the feeling of our corruptions, and of God’s displeasure, due unto us for the same, we have not made any entrance into the ways of godliness, nor laid the very foundation of the works of conversion, therefore the Prophet Joel exhorting the Israelites to repentance, biddeth them, rent their hearts: that is, the first stone that must be laid in this building: their hearts must be crushed and broken, for the wickedness committed against the Majesty of God; till then there is no turning unto him: one may as well bid a prisoner that is in strong hold, and hath bolts and fetters upon his heels, walk abroad and take the fresh air, and not remain any longer in that dark &amp; loathsome dungeon, as bid one that hath not his heart crushed &amp; humbled to turn unto the Lord: alas he is held fast in the chains of Satan, and cannot stir one foot to God-ward; therefore is it noted in those converts, Act. 2. 37. that They were pricked in their hearts] when they began the work of repentance, the rebukes of God had wakened their drowsy consciences, so that they saw their sins and God’s vengeance due unto them, and the words of Peter had gone through their hearts, even as a two edged sword, and then they were fit to bee soundly healed and comforted, when they had been pierced, and thoroughly wounded by the Arrows of God.

1 First, till the heart be broken for sin, there can be no plain confession of sin, and therefore no repentance. Men naturally are like wild Ass-Colts, nothing will work upon them, nor bring them unto any good frame or order; though they hear often of their faults, they will not acknowledge them, but be still unruly and untamed, as Paul was before his conversion; so long as he was heart-whole in his own conceit, though he had heard many excellent Sermons (no doubt,) yet he was like a beast still, never bewailing nor confessing his grievous offences, till the Lord had taken him down, and thoroughly mastered him.

2 Nay further, men are so far from taking pains to come to a true acknowledgement of their iniquities, till such time as there is a breach made into their hearts by godly sorrow, they do not so much as desire to be delivered from them, nor make any reckoning of God’s mercy for the pardoning of them: till such time as they become mourners for sin, they cannot possibly hunger and thirst after righteousness. And indeed what reason is there that they should esteem of that medicine which will cure, when they do not feel themselves to be sick? they think it a matter worth the looking after, to be freed from poverty, from infamy, from the pestilence, &amp;c. but as for the corruptions of their nature, and the sinfulness of their ways, they were never much troubled with them, and therefore they make little account to be delivered from them.</p></blockquote>

<blockquote><p>We must not therefore apprehend of God, as having a new will to do a thing in time, which he had not from eternity (as [Conrad] Vorstius and others blaspheme) but his will was from all eternity, that such a thing be in time accomplished by his wisdom.

As for example, in Creation, God did not then begin to have a will to create: but he had a will from all eternity, that the world should exist in time; and thus it is in Justification and Sanctification; not that these effects are from eternity, but God’s will is: And if you ask, Why, seeing God’s will to create or justify is from eternity, Creation and Justification are not also from eternity?

The answer is, because God is a free Agent, and so his will is not a necessary cause of the thing, for then it would be immediately, as the Sun beams are necessarily as soon as the Sun is, but it is a voluntary principle, and so maketh the effect to be at the time he prescribeth. As if there were an Artificer or Carpenter, that could by his mere will cause an house to be reared up; he might will this to be done in such and such a year long after his will of it to be: So God when the world is made, when a sinner is justified, willed these things from all eternity, and when they come to have a being, these effects cause an extrinsical denomination to be attributed to God, which was not before, as now he is a Creator, and was not before, now he justifieth, and did not before. There is no change made in God, but the alteration is in the creature.</p></blockquote>

<blockquote><p>It must suffice, in this Essay, to indicate briefly the effect of this apprehension of the privilege of the Christian, as the forgiven and justified child of God, upon his relation to the ordinances of the Gospel, and to the ministry of the Church. While this doctrine was obscured, the inevitable tendency was to regard those ordinances as acts, or sacrifices, on our part, by which men hoped to procure the forgiveness or grace of which they felt the need. They were of the nature of works, by which that grace was won or merited.

But from the point of view of the Reformed doctrine, they appeared rather as the manifestations and channels of God’s gifts and graces to His redeemed and justified children. Instead of losing in importance, they became still more precious, because we could approach them, submit ourselves to them, and use them, in full assurance of faith.</p></blockquote>

<blockquote><p>Now this brings me to mention one point that has brought a great deal of confusion to many genuine souls because of the loose way in which it is sometimes spoken of— that is, the difference between faith and assurance.

Christ is the object of faith. Christ is presented in the everlasting gospel as the one who died and who rose again and whose blood is able to cleanse from all sin. Christ is the one in whom there is eternal salvation. God says that whosoever believeth in Christ shall not perish but have everlasting life. Faith unites the soul to Christ as the Saviour of sinners. The soul realises, ‘I am a sinner, an empty sinner, a vile sinner, an undone sinner, a sinner who cannot deliver myself.’ And now, in the exercise of faith, the soul says, ‘Christ has been made precious to my soul by the Holy Spirit, and I embrace him, I believe in him, I trust in him, I embrace him.’ That’s faith, as distinct from assurance.

Now the gospel does not call a sinner to believe that Christ died for him. That’s very important. If you were called to believe that Christ died for you, that would mean that you were called to believe you are saved, which is in fact assurance and not faith. But a sinner who is exercising faith for the first time is exercising faith in order to be saved, not because they know they are saved.

Certainly the apostle spoke of ‘the Son of God, who loved me and, gave himself for me’. But that’s not faith, that’s assurance! What we’re talking about just now is the first exercise of faith that unites the soul to the divine Redeemer. The sinner exercises faith in Christ as the Saviour of sinners, as distinct from having assurance that Christ is the one who died for me. As Paul says, ‘This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners.’ That’s the presentation of Christ in the everlasting gospel which faith has to do with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/donald-maclean.html">Donald MacLean</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Searched and Known: An Exposition of Psalm 139:1</cite>, (Stornoway: Reformation Press, Kindle edition, 2018), Kindle Locations 180-194.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>It belongs to the very essence of the type of Christianity propagated by the Reformation that the believer should feel himself continuously unworthy of the grace by which he lives. At the centre of this type of Christianity lies the contrast of sin and grace; and about this centre everything else revolves. This is in large part the meaning of the emphasis put in this type of Christianity on justification by faith. It is its conviction that there is nothing in us or done by us, at any stage of our earthly development, because of which we are acceptable to God. We must always be accepted for Christ’s sake, or we cannot ever be accepted at all. This is not true of us only “when we believe.” It is just as true after we have believed. It will continue to be true as long as we live.

Our need of Christ does not cease with our believing; nor does the nature of our relation to Him or to God through Him ever alter, no matter what our attainments in Christian graces or our achievements in Christian behaviour may be. It is always on His “blood and righteousness” alone that we can rest. There is never anything that we are or have or do that can take His place, or that can take a place along with Him. We are always unworthy, and all that we have or do of good is always of pure grace. Though blessed with every spiritual blessing in the heavenlies in Christ, we are still in ourselves just “miserable sinners”: “miserable sinners” saved by grace to be sure, but “miserable sinners” still, deserving in ourselves nothing but everlasting wrath. That is the attitude which the Reformers took, and that is the attitude which the Protestant world has learned from the Reformers to take, toward the relation of believers to Christ.

There is emphasized in this attitude the believer’s continued sinfulness in fact and in act; and his continued sense of his sinfulness. And this carries with it recognition of the necessity of unbroken penitence throughout life. The Christian is conceived fundamentally in other words as a penitent sinner. But that is not all that is to be said: it is not even the main thing that must be said. It is therefore gravely inadequate to describe the spirit of “miserable-sinner Christianity” as “the spirit of continuous but not unhopeful penitence.” It is not merely that this is too negative a description, and that we must at least say, “the spirit of continuous though hopeful penitence.”

It is a wholly uncomprehending description, and misplaces the emphasis altogether. The spirit of this Christianity is a spirit of penitent indeed, but overmastering exultation. The attitude of the “miserable sinner” is not only not one of despair; it is not even one of depression; and not even one of hesitation or doubt; hope is too weak a word to apply to it. It is an attitude of exultant joy. Only this joy has its ground not in ourselves but in our Saviour. We are sinners and we know ourselves to be sinners, lost and helpless in ourselves. But we are saved sinners; and it is our salvation which gives the tone to our life, a tone of joy which swells in exact proportion to the sense we have of our ill-desert; for it is he to whom much is forgiven who loves much, and who, loving, rejoices much.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Miserable-Sinner Christianity in the Hands of the Rationalists. Article I: From Ritschl to Wernle’, Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

s+learned+from+the+Reformers+to+take%2C+toward+the+relation+of+believers+to+Christ.%0A%0AThere+is+emphasized+in+this+attitude+the+believer%E2%80%99s+continued+sinfulness+in+fact+and+in+act%3B+and+his+continued+sense+of+his+sinfulness.+And+this+carries+with+it+recognition+of+the+necessity+of+unbroken+penitence+throughout+life.+The+Christian+is+conceived+fundamentally+in+other+words+as+a+penitent+sinner.+But+that+is+not+all+that+is+to+be+said%3A+it+is+not+even+the+main+thing+that+must+be+said.+It+is+therefore+gravely+inadequate+to+describe+the+spirit+of+%E2%80%9Cmiserable-sinner+Christianity%E2%80%9D+as+%E2%80%9Cthe+spirit+of+continuous+but+not+unhopeful+penitence.%E2%80%9D+It+is+not+merely+that+this+is+too+negative+a+description%2C+and+that+we+must+at+least+say%2C+%E2%80%9Cthe+spirit+of+continuous+though+hopeful+penitence.%E2%80%9D%0A%0AIt+is+a+wholly+uncomprehending+description%2C+and+misplaces+the+emphasis+altogether.+The+spirit+of+this+Christianity+is+a+spirit+of+penitent+indeed%2C+but+overmastering+exultation.+The+attitude+of+the+%E2%80%9Cmiserable+sinner%E2%80%9D+is+not+only+not+one+of+despair%3B+it+is+not+even+one+of+depression%3B+and+not+even+one+of+hesitation+or+doubt%3B+hope+is+too+weak+a+word+to+apply+to+it.+It+is+an+attitude+of+exultant+joy.+Only+this+joy+has+its+ground+not+in+ourselves+but+in+our+Saviour.+We+are+sinners+and+we+know+ourselves+to+be+sinners%2C+lost+and+helpless+in+ourselves.+But+we+are+saved+sinners%3B+and+it+is+our+salvation+which+gives+the+tone+to+our+life%2C+a+tone+of+joy+which+swells+in+exact+proportion+to+the+sense+we+have+of+our+ill-desert%3B+for+it+is+he+to+whom+much+is+forgiven+who+loves+much%2C+and+who%2C+loving%2C+rejoices+much.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+%E2%80%9CMiserable-Sinner+Christianity+in+the+Hands+of+the+Rationalists.+Article+I%3A+From+Ritschl+to+Wernle%E2%80%99%2C+Princeton+Theological+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56fcb05311.html&amp;via=5Solas" target="_blank" rel="n <blockquote><p>The scope of the apostle is to illustrate the doctrine of justification he had before treated of. The substance of which consisted in this, that Christ, in virtue of the covenant of grace, accomplished all righteousness for his chosen covenant people, so that the obedience of Christ is placed to their charge, and they, on account thereof, are no less absolved from the guilt and dominion of sin, than if they themselves had done and suffered in their own person, what Christ did and suffered for them.

He declares that in this respect, Adam was the type of Christ, namely, as answering to him. It is therefore necessary, that the sin of Adam, in virtue of the covenant of works, be so laid to the charge of his posterity, who were comprised with him in the same covenant that, on account of the demerit of his sin, they are born destitute of original righteousness, and obnoxious to every kind of death, as much as if they themselves, in their own persons, had done what Adam did. Unless we suppose this to be Paul’s doctrine, his words are nothing but mere empty sound.</p></blockquote>

<blockquote><p>There is, however, a very great difference between human and divine adoption; the former was instituted to console the childless, and to supply the deficiency of nature; the latter takes place for our comfort, not for that of God, who had a Son, even his well-beloved—the former leads to the possession of the property of the deceased father; the latter to a share in the happiness of the Father everlasting—the one can bestow the name and titles, but not the disposition and qualities of sons; in the other the adopting Lord changes the heart. Lastly, the one supposes its objects to be good, and does not make them so; the other does not suppose, but makes its objects good.</p></blockquote>

</figure><figure class="quote" id="q-dcaa7c5b40" data-kw="">
<blockquote><p>First, It is of great consequence to have this Doctrine kept pure. Luther called it Articulus stantis aut cadentis Ecclesiae, as if this were the soul and pillar of Christianity. Pighius, though a Papist, calleth this the chief part of Christian Doctrine, confessing that it had been obscured rather then cleared by their own Writers: yea, this Doctrine about Justification is that which discerneth the Orthodox from Pagans, Papists, Socinians and Arminians.

Now there are divers reasons why we should keep the Philistines from throwing in earth to stop up this pleasant spring: As 1. because herein is the grace and good favour of God especially revealed. Therefore the Gospel is called glorious, because God did not so much exalt, and manifest his excellency in creating the world, as he did in providing of a Saviour, and pardon for a poor sinner: Hence it’s called the riches of his grace, rather then of power or righteousness.

We are therefore solicitous (whatsoever the Antinomians say to the contrary) that the doctrine of God’s grace in Justification may be fully improved to the uttermost, and that every broken heart may be put into a ravishment and admiration of it. We bewail those times of Popery, when the name and efficacy of Christ and his Grace, were obscured by the works and pretended righteousness of men.

2. It is very necessary to keep this pure, because of the manifold truths that must fall if this fall; if you err in this, the whole truth about Original sin, Free-will, and Obligation of the Law will likewise perish.

3. It is of great influence into practice; for what doth the heart smitten for sin, and filled with the displeasure of God, but run to this Doctrine, as the City of refuge? This is the water that their souls pant after, this is the bread that their fainting stomachs would gladly feed on: now if this water be turned into mud, if this bread be made into stones by the corrupt Doctrines of men, how must the soul perish for want of sustenance?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-c796423fd6" data-kw="">
<blockquote><p>The historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestanism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it.

On Mystical ground—as for example among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men. Perfectionism persistently makes its appearance.

It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestanism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it.

On Mystical ground—as for example among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men. Perfectionism persistently makes its appearance.

It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.”

<blockquote><p>He [Paul] illustrates and concludes this whole comparison, by shewing the abundance of sin in those that are justified, renders the grace of Christ more illustrious; and this he does by answering an objection concerning the end and use of the published Law.

It may be questioned, if death reigned by the Law of Nature, not written before Moses, what need was there of any written Law; and seeing righteousness comes not by the Law, as is said before, to what end was the Law?

He answers, by shewing a three-fold end of giving the Law.

First: The Law entered, that the offence might abound; i. e. The Law forbidding sin, and enjoining righteousness, in that space of time betwixt Adam and Christ, came in, that sin, (which was daily committed, and yet because of ignorance not acknowledged) might be known to be sin, and that the natural wickedness of men might appear, which occasions, that by how much the more the Law requires righteousness, by so much the more concupiscence is stirred up against the Law; and that by this, the sin which lies hid in men might be manifested, and known to abound.

But where] The second end, that from the abundance of sin in those that were to be justified, the exceeding abundant grace of Christ towards those that are justified might appear: seeing that where sin abounds in the conviction of men that are to be justified, there the grace of Christ justifying is found to super-abound.

Even as] The third end, that the power of sin, (as a King) by the Law, might more clearly appear, shewing forth its condemning power, the power of the righteousness of Christ (as a Superior King) held forth in the Gospel, might be more eminent, prevailing, not only to the abolishing of the Kingdom of sin, but also to the conferring of Eternal Life upon those that are justified: Therefore by how much the more the force of sin (reigning over men not justified) crowding them to the prison of Eternal death, might more clearly appear; by so much the more, the virtue, power, and excellency of the grace of Christ, overcoming and subduing sin, leading men powerfully unto Eternal Life, might more manifestly bee declared.</p></blockquote>

<blockquote><p>The whole doctrine of justification displays the glory of God; it sets forth his amazing goodness, his inviolable justice, his wonderful wisdom; it humbles the sinner, takes away all ground of boasting, comforts the soul when cast down and harassed with a sense of its sins, the accusation of the devil, and the terrors of the law, and tends to the promotion of real holiness.</p></blockquote>

<blockquote><p>Moreover, when the faithful soul thus receives Christ and rests upon Him, it doth not consider Christ as its Saviour only, but as its Lord. For it receiveth a whole Christ, and receiveth Him just as he is: and He is not less a Lord than a Saviour. Indeed he cannot be a Saviour, unless He be also Lord. In that doth our salvation consist, not that we are our own, or any creature’s, but Christ the Lord’s. Faith therefore receiveth Christ the Lord, Coloss. ii. 6.

Nor doth Christ any otherwise offer himself as a spouse to the soul, than under this condition, that she shall acknowledge Him for her Lord, Ps. xlv. 11. And when the soul casts herself upon Christ, she renounceth her own will, and giveth herself up to the will of Jesus, to be ordered by Him, as He shall please.

Hence there is in faith an humble giving and delivering up of self, by which the believer, as much as in him lies, as an act he is in duty bound to, makes a return of himself to Christ, who was so freely given to him. I am my Beloved’s, and my Beloved is mine, Cant. vi. 3. They gave their own selves to the Lord, 2 Cor. viii. 5.

Something like the form in which Amasai gave himself, with his companions, to David. 1 Chro. xii. 18. Thine are we, David, and on thy side, thou son of Jesse. And this giving up ourselves to Christ, which we set down as the seventh act of faith, is the continual spring and fountain of all true obedience, which is therefore called the obedience of faith, Rom. i. 5.</p></blockquote>

<blockquote><p>Q. How is this Faith and Repentance confirmed and increased in us?

A. By three means especially.

Q. Which is the first?

A. A diligent and faithful reading of the holy Scriptures, and hearing of the same word preached, receiving it with all meekness and hearty obedience. …

Q. Which is the second?

Answ. Fervent and constant prayer unto God in the holy Ghost, both public and private according to his will. …

Q. Which is the third?

Answer. A right using and partaking of both the holy Sacraments. viz. Baptism, and the Supper of the Lord.</p></blockquote>

<blockquote><p>Now, both from the order, and conjunction of these graces, we may infer a singular consolation to all the true Children of God. For if there be such a conjunction between these two graces of justification and sanctification, that whosoever hath the one, hath also the other, and who hath not both hath neither: then it followeth necessarily, that, as he that is justified, is also sanctified; So he that is sanctified, is also justified, and if the order between them be such, that a man cannot serve God in the duties of sanctification, until he be justified, nor cannot worship God aright, until he be redeemed from his spiritual enemies: then it followeth necessarily, that they who are in any true measure sanctified, are also justified; that they who sincerely desire, and endeavour to walk in the obedience of God’s holy will, making conscience of their ways, are redeemed from the hand of their spiritual enemies.

And not only may we from our sanctification come to the certain knowledge of our justification: but also we may thereby make our calling &amp; our election sure. For dost thou, professing the true faith, endeavour to keep a good conscience and to walk uprightly before God; then it is certain, that thou art justified by a true faith; art thou justified? then it is certain, that thou art effectually called art thou called according to Gods purpose? then without doubt thou are elected art thou elected? then undoubtedly thou shalt be saved.</p></blockquote>

<blockquote><p>Faith, abiding in Christ causes the conscience to be examined very carefully to see whether there still remain any sins, over which a man has not yet humbled himself before the great God, laying claim to the blood of His Son Jesus Christ which taketh away all sins, and for this sin in particular.

For, though the sins of believers bring them not, strictly speaking, under guilt or condemnation, they being once and for all freed from this in their initial justification: yet daily sins make them subject to paternal chastisement; yes, they bring about darkness and estrangement from God, and lack of liberty and a sense of sin, and a halting; so that such must be set free by a positive embracing of Jesus, before the soul can have any advancement in sanctification.</p></blockquote>

<blockquote><p>There are five Arguments of consolation to the Justified, who bewail the imperfection of their own obedience.

Become dead] Argum. 1. You are freed from the Covenant of Works, which admits no obedience besides what is perfect, and every way complete: Therefore all you that are Justified have consolation, which bewail the imperfection of your new obedience.

Of another] Argum 2. You are now married to another Husband, viz. to Christ, who is raised from the dead, who when he could answer the imperfections of your obedience, and (according to the Covenant of Grace) render your begun obedience acceptable unto God, he took it upon himself: You have this consolation that mourn over the imperfections of your new obedience.

Fruit] Argum. 3. Ye are married unto Christ, which is raised from the dead, that you may not abide unfruitful, but may bring forth fruit to the glory of God: Therefore take ye comfort, who bewail your imperfect obedience.

Argum. 4. Confirming the former, from the change of our condition, while we were unregenerate (and by consequence under a Law-Covenant) evil affections by the holy Law of God were stirred up, and put forth themselves powerfully in our members, and all our faculties both of soul and body, to the production of the deadly fruit of actual sin:

Therefore it will follow, when we are now regenerated, and under the Covenant of Grace, holy desires stirred up by the New Covenant, powerfully shew forth themselves in our members, to the bringing forth the fruit of good works unto God, that we might not abide unfruitful. Which is no small consolation; for if we by Faith would lay hold upon the Covenant of Grace, and would stir up our souls by the promises thereof applied unto us, there is no doubt but we should more plentifully bring forth good works; That is it which Christ saith, Joh. 15.5. I am the vine, ye are the branches, he that abides in me, and I in him, he brings forth much fruit: for without me you can do nothing.

Argum. 5. Opening and confirming the former, from the end of our changed condition, Now, to wit, after Justification, through the Grace of Christ we are freed from the Law-Covenant (that Covenant being dead in which we were held, or we being dead in Christ, in whom we were contained judicially) to that very end, that we should serve God, by the power of the Holy Ghost, bestowing new strength upon us, by bringing forth new and spiritual fruit, not superficial and hypocritical, which the letter of the old legal Covenant (now abolished) at the most, brought forth:

Therefore God will not fail of his end, but will cause those that are justified, bewailing their imperfect obedience, to bring forth much fruit in the newness of the letter, for the fruits which are brought forth by virtue of the Covenant of Grace, are truly new, and arise from the regenerating Spirit, furnishing us with new strength forthwith to good works; But the fruits which are brought forth by virtue of the Covenant of Works, either are open rebellion of corrupt Nature against God’s Law, or counterfeit obedience only in the outward performance; such as the fruits of the Pharisees are, who in the letter, that is, the outward shew, and formality obeyed, without any renovation of the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 16-17.</span></figcaption>

<blockquote><p>IX. Errors.

We condemn therefore those, which teach that for the worthiness of their works there is due unto them either remission of sins or eternal life or any other good gift. For, though we should perfectly fulfill the commandments of God, yet we should be but unprofitable servants. But no man, yea, after his engrafting into Christ keepeth the commandments of God as they should be kept. Meanwhile we disprove not the fathers in that they used the word merit, namely, so far forth as thereby they meant nothing else then a good work done by faith, unto which of favour and for the only merits of Christ was given a reward.

Again we cannot allow of those, which do so discourse of good works, as if they were things indifferent and therefore hold that the same are not only needless, but also do nothing avail to salvation. For how should any man be saved without faith? And how can he have a living faith without a care to do good works? And who can also hold faith, unless he also keep a good conscience? And how can he keep a good conscience, unless he also keep a care to avoid sin and to do good works and to frame his whole life to the will of God?

But we simply condemn all Libertines, who make it all one to keep or not to keep God’s commandments, to do well or to do ill. We condemn also those, which teach that our good works do profit the very souls of the dead, which lie in a certain burning flame, which they call purgatory, sith the scripture saith every one shall be judged according to his own works, which he did in his own body and not the works of other men, but their own works do follow them which are dead.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IX. Errors.

We condemn therefore those, which teach that for the worthiness of their works there is due unto them either remission of sins or eternal life or any other good gift. For, though we should perfectly fulfill the commandments of God, yet we should be but unprofitable servants. But no man, yea, after his engrafting into Christ keepeth the commandments of God as they should be kept. Meanwhile we disprove not the fathers in that they used the word merit, namely, so far forth as thereby they meant nothing else then a good work done by faith, unto which of favour and for the only merits of Christ was given a reward.

Again we cannot allow of those, which do so discourse of good works, as if they were things indifferent and therefore hold that the same are not only needless, but also do nothing avail to salvation. For how should any man be saved without faith? And how can he have a living faith without a care to do good works? And who can also hold faith, unless he also keep a good conscience? And how can he keep a good conscience, unless he also keep a care to avoid sin and to do good works and to frame his whole life to the will of God?

But we simply condemn all Libertines, who make it all one to keep or not to keep God’s commandments, to do well or to do ill. We condemn also those, which teach that our good works do profit the very souls of the dead, which lie in a certain burning flame, which they call purgatory, sith the scripture saith every one shall be judged according to his own works, which he did in his own body and not the works of other men, but their own works do follow them which are dead.”

— Jerome Zanchi, De religione christiana fides – Confession of Christian Religion, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXI.IX, 1: 369-71.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+Errors.%0A%0AWe+condemn+therefore+those%2C+which+teach+that+for+the+worthiness+of+their+works+there+is+due+unto+them+either+remission+of+sins+or+eternal+life+or+any+other+good+gift.+For%2C+though+we+should+perfectly+fulfill+the+commandments+of+God%2C+yet+we+should+be+but+unprofitable+servants.+But+no+man%2C+yea%2C+after+his+engrafting+into+Christ+keepeth+the+commandments+of+God+as+they+should+be+kept.+Meanwhile+we+disprove+not+the+fathers+in+that+they+used+the+word+merit%2C+namely%2C+so+far+forth+as+thereby+they+meant+nothing+else+then+a+good+work+done+by+faith%2C+unto+which+of+favour+and+for+the+only+merits+of+Christ+was+given+a+reward.%0A%0AAgain+we+cannot+allow+of+those%2C+which+do+so+discourse+of+good+works%2C+as+if+they+were+things+indifferent+and+therefore+hold+that+the+same+are+not+only+needless%2C+but+also+do+nothing+avail+to+salvation.+For+how+should+any+man+be+saved+without+faith%3F+And+how+can+he+have+a+living+faith+without+a+care+to+do+good+works%3F+And+who+can+also+hold+faith%2C+unless+he+also+keep+a+good+conscience%3F+And+how+can+he+keep+a+good+conscience%2C+unless+he+also+keep+a+care+to+avoid+sin+and+to+do+good+works+and+to+frame+his+whole+life+to+the+will+of+God%3F%0A%0ABut+we+simply+condemn+all+Libertines%2C+who+make+it+all+one+to+keep+or+not+to+keep+God%E2%80%99s+commandments%2C+to+do+well+or+to+do+ill.+We+condemn+also+those%2C+which+teach+that+our+good+works+do+profit+the+very+souls+of+the+dead%2C+which+lie+in+a+certain+burning+flame%2C+which+they+call+purgatory%2C+sith+the+scripture+saith+every+one+shall+be+judged+according+to+his+own+works%2C+which+he+did+in+his+own+body+and+not+the+works+of+other+men%2C+but+their+own+works+do+follow+t </figure><figure class="quote" id="q-40a18ab869" data-kw="">
<blockquote><p>It [assurance] is an intelligent and enlightened persuasion. “I know—and am persuaded,” says the apostle. How, and whence he knew this, will afterwards be noticed; in the mean time, it is proper to observe at the very outset, that he bases his persuasion on knowledge. What is said of it in all the riches of its full-grown strength, is true of it in its greenest and least advanced state—it is the “assurance of understanding.” It differs essentially and totally from all blind impulses, all enthusiastic imaginations, all sudden impressions made on the mind, but of which the person can give no intelligent or satisfactory account.

It is not the result of dreams or visions. It is not produced by immediate suggestions of the Spirit. It is not grafted on texts of Scripture ill-understood, and broken off from their connexion, which have been forcibly injected into the mind, or selected by a kind of spiritual lottery. “This persuasion cometh not of him that calleth you,” Christian; but is to be suspected of delusion, nourishing pride and self-conceit, and creating a fanciful and presumptuous confidence, accompanied with a feverish tumult in the affections, which bursts out into extravagance of sentiment and irregularity of conduct, and then gradually subsides and sinks to the point of freezing indifference and incredulity.

Genuine Christian assurance proceeds from spiritual illumination by means of the word of God. It is the effect of the Spirit’s “opening the understanding to understand the Scriptures,” and to know what they testify of Christ. “The God of our Lord Jesus Christ, the Father of glory, give unto you the Spirit of wisdom and revelation in the knowledge of Christ, that ye may know what is the hope of his calling, and what the riches of the glory of his inheritance.” “We have known and believed the love of God to us.” “The Son of God is come and hath given us an understanding that we may know him that is true.”

Faith is the act of an enlightened mind. The convinced sinner does not commit himself to the Saviour blindly, or in ignorance of his revealed character and qualifications. The weakest believer is always ready to give “a reason of the hope that is in him.” He cannot answer all the cavils of adversaries, but he can maintain his cause with the words of truth and soberness, and sometimes silence the caviller, by the reply of the man whose eyes the Lord opened, “Whether what you allege be true or no, I know not; but one thing I know, that whereas I was blind, now I see.” This persuasion is coolly formed, and cautiously expressed, and it is so because it is enlightened.

The Christian, especially at his first believing, is apt to suspect his perceptions, however clear and satisfactory, and to check his assurance, until he has dispassionately examined its grounds, and allowed the transport of his mind to subside. He is apt to go to the opposite extreme from the enthusiast: the latter is presumptuous, the former is jealous and diffident; the latter is satisfied with too little evidence, the former requires too much; the latter mistakes visions for realities, the former, like Thomas of old, suspects the reality to be a vision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assurance in Sermons</cite></span></figcaption>

<blockquote><p>And then yet further, know, That through the righteousness of Christ, thou art lookt upon thy self, in the point of Justification, without spot too. The Saints have their spots that is, they have their weaknesses, and some sins, their Sanctification is imperfect; I, but in regard of Justification, so, they are altogether without spot: So you have it in Cant. 4. 7. Where Christ speaks of his Spouse, Thou art all fair, my Love, there is no spot in thee — You will say, This seems to be against this text: No, not at all; for we may be without any spot, in regard of our Justification, and yet we may be spotted and defiled, and God may see that we are defiled with spots in our sanctification. It’s true, the Lord will not charge these spots upon thy soul that art in Christ; yet he doth expect that thou shouldst be humbled for them.</p></blockquote>

<blockquote><p>Let us then endeavour to open up the nature, grounds, and effects of a scriptural assurance of complete and final salvation. I begin with premising that this assurance is no apostolical gift, or extraordinary attainment, confined to the first age of the gospel, or to a favoured class of Christians. Judas, though an apostle, did not possess it: and Paul never speaks of it as a privilege of office, or an effect of inspiration.

He does not say on this as he says on another subject, “Am I not an apostle? have not I seen the Lord?” He does not “come to visions and revelations of the Lord,” he does not speak as one “caught up to the third heavens;” for he knew that he might have enjoyed all these privileges, and yet “be a castaway.” It was as a sinner—the “chief of sinners,” that he committed his soul to Christ: and it is as a believer, and on grounds common to all believers in every age, that he expresses the persuasion in the text.

What he here avows as an individual he elsewhere expresses in the name of all believers —”We rejoice in the hope of the glory of God.” And all the saints at Rome he associates with himself in that triumphant passage, “Who shall separate us from the love of Christ? I am persuaded that neither life nor death, nor any other creature shall be able to separate us from the love of God which is in Christ Jesus our Lord.”

God forbid, that we should cut off the streams of Christian consolation, and dry up the most fertile source of Christian holiness, by confining this attainment either to apostolical men, or to the primitive Christians. This were not to “follow their faith, considering the end of their conversation, Jesus Christ, the same yesterday, and to-day, and for ever.” Their minds might be more deeply imbued with the Spirit of truth; but we having the same Spirit of faith, according as it is written, “I have believed and therefore have I spoken,” we may believe and so speak. Every believer in Christ possesses this persuasion in some degree, and may attain to the full assurance of understanding, and faith, and hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assurance in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>Broken hearts are a wonderful delight unto the Lord: There are somethings in which God hath no delight in sinnings, nor in punishments: and there are two hearts in which God takes much delight, namely, in an upright heart and in a contrite heart, The broken heart he will not despise, nay he will look upon that heart to revive it: If broken hearts be God’s delight, and the objects of his reviving, then without question they are a means to prevent destruction.</p></blockquote>

<blockquote><p>VII. The power of free choice in the regenerate is yet weak, so that we have still need of the help of God, neither can we do all that we would.

But, because our regeneration is as it were only begun and not as yet perfect, so that whereas we were before wholly flesh, now we consist partly of the Spirit and partly of the flesh, which do continually fight the one against the other, that what good things we would, them we cannot perform; but in our spirit we serve the law of God, but in our flesh the law of sin.

Therefore we believe that which we also know by experience in the regenerate, that much bondage still remaineth, much darkness in the soul and perverseness in the heart and weakness in all the faculties of mind and body, that we have still need of new help from God and new grace, whereby both our minds may be more and more enlightened and our wills made better and better, and our strength to do good more increased and perfected.

And therefore, while we remain in this flesh, our free choice is never truly and merely free, that is, never able enough of it self to avoid ill and do good, especially sith the event of all things is not in our power, but in the hand of God; and that it must needs be that all those things come to pass, not which we think, but whatsoever his hand and purpose hath decreed shall be done.</p></blockquote>

</figure><figure class="quote" id="q-adaec5c6f3" data-kw="">
<blockquote><p>One great snare, that the Devil hath laid to entangle souls, hath been, to put them upon it to call every thing into question; which hath been the more dangerous, because such enquiry doth pretend to ingenuity, and is like that Tree of Knowledge, a tree to be desired to make one wise, and certainly it is far better to be humbly and modestly inquisitive, than popishly and sottishly ignorant, for the wise man’s eyes are in his head, but the fool destroys himself by a strange implicit faith, and blind obedience: But when a proud spirit shall become one of those hesitating questionists, how will he vaunt and triumph in his conceits, as if he had posed and non-plussed truth it self: When such a one is gotten into this strong hold, what will not his bold confidence dare to question?

And although he might consider that a fool may ask more questions than ten wise men can answer, yet still he persisteth in vain interrogatories; And such is the disturbance of his mind occasioned by the pride and wickedness of his heart, that let the most clear and pertinent reply be made to his demands; yet is he wholly indisposed to receive satisfaction. Thus is the poor, but proud and insulting skeptic, at once really the Devil’s bondslave, and conceitedly his own freeman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Security Against Seducing Spirits. Or, The Anointing from the Holy One the Best Teaching. Delivered in a Sermon at Paul’s before the Lord Mayor, Alderman, and Commonality of the City of London, upon the Fifth of November, 1651</cite>, ed. John Palmer and Christian Herring (1651; Purely Presbyterian Publications, 2019), v-vi.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/faith.html">Faith</a></span></div>

<blockquote><p>Now, the great gift, and large allowance of our Father, is expressed in the next words, “But ye have received the spirit of adoption,” &amp;c. Which spirit of adoption is a spirit of intercession, to make us cry to God as our Father. These are two gifts,—adoption, or the privilege of sons, and the spirit of adoption revealing the love and mercy of God to the heart, and framing it to a soul -like disposition. Compare the two states together, and it is a marvellous change,—a rebel condemned, and then pardoned, and then adopted to be a son of God;—a sinner under bondage, a bound slave to sin and Satan, not only from that intolerable bondage, but advanced to this liberty,—to be a son of God!

This will be the continued wonder of eternity, and that whereabout the song of angels and saints will be. Accursed rebels, expecting nothing but present death, sinners arraigned and sentenced before his tribunal, and already tasting hell in their consciences, and in fear of eternal perishing, not only to be delivered from that, but to be dignified with this privilege,—to be the sons of God, – to be taken from the gibbet to be crowned,—that is the great mystery of wisdom and grace revealed in the gospel, the proclaiming whereof will be the joint labour of all the innumerable companies above for all eternity.

Now, if you ask how this estate is attainable, himself tells us, John i. 12, “As many as believed, or received, to them he gave the privilege to be the sons of God.” The way is made plain and easy,—Christ the Son of God, the natural and eternal Son of God, became the son of man. To facilitate this, he hath taken on the burden of man’s sin, the chastisement of our peace; and so of the glorious Son of God he became like the wretched and accursed sons of men; and therefore God hath proclaimed in the gospel, not only an immunity and freedom from wrath, to all that in the sense of their own misery cordially receive him as he is offered; but the unspeakable privilege of sonship and adoption, for his sake who became our elder brother. Gal. iv. 4, 5.

Men that want children, use to supply their want by adopting some beloved friend in the place of a son; and this is a kind of supply of nature for the comfort of them that want. But it is strange that God, having a Son so glorious, the very character of his person, and brightness of his glory, in whom he delighted from eternity; strange, I say, that he should in a manner lose and give away his only-begotten Son, that he might by this means adopt others, poor, despicable creatures, yea, rebellious, to be his sons and daughters.

Certainly, this is an act infinitely transcending nature, such an act that bath an unsearchable mystery in it, into which angels desire to look, and never cease looking, because they never see the bottom of it. It was not out of indigency he did it, not for any need he had of us, or comfort expected from us, but absolutely for our necessity and consolation, that he might have upon whom to pour the riches of his grace.</p></blockquote>

</figure><figure class="quote" id="q-391d266aca" data-kw="">
<blockquote><p>I mind not here to consider the doctrine of the deluded Antinomians, who assert, that men are justified and actually pardoned from all eternity; and so not only before they believe, but before they are born; not distinguishing between active and passive justification.

The former, being an imminent act in God, and a constant will to pardon such persons as he hath chosen to everlasting life, is no doubt from eternity, and complete from that date. But the latter a transient act, exercised not only about, but terminated on the creature living and believing, whereby he is actually pardoned, and judicially declared righteous, while he stands trembling before the tribunal of God; and so cannot be from eternity.

Their doctrine in this is flatly opposite to the Scriptures; which declare all men once and by nature to be children of wrath, and under condemnation, and unpardoned; and truly overturns both law and gospel at one blow; the law, in that the case being so as they pretend, there is no need of it to accuse, convince, condemn, and to stop every mouth, and to make all the world guilty before God. And no better friends are they to the gospel, which proclaims salvation to lost sinners.

Yet none greater pretenders to the purity of the gospel than they; none seem to cry up free grace more, which nevertheless in very deed they labour to hide, while they set off the law altogether, without which a man shall never have a right taste of the grace of God. They cry down the law and a legal walk; which is, no doubt, the bane of many professors; but plucking up the law out of the conscience in the matter of justification, and a sinner’s acceptance with God, they root it out of the heart in the matter of sanctification. So true is it, Dum vitant stulti vitia, in contraria currunt.

But had more care been taken of preserving pure and entire the doctrine of free grace, it would no doubt have prevented the delusion of many simple and well-meaning people, and cut off the occasion of crying down good works, and the study of holiness, under pretence of sacrificing all to free grace, from others led merely by their own licentious humours.

And therefore, if I mistake not, the greatest noise that Antinomianism hath made in the church in these later centuries, hath been after a deluge of superstition; formality, and ignorance of the doctrine of the gospel, had overwhelmed the church, and sermons sounded rather like Seneca’s morals, than Paul’s doctrine of Christ crucified, and the riches of God’s grace.

So was it in the time of the reformation from Popery; so in the time of Britain’s struggling with and wading out from Prelacy and Arminianism, &amp;c. How dangerous is it to set up morality instead of the power of godliness, and life of faith? to turn the covenant of grace into a bastard covenant of works; and to mix the law with the gospel, which is indeed accounted by the Spirit of God another gospel, the preacher whereof is devoted to a curse? Gal. i. 6, 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Questions</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 44-45.</span></figcaption>

<blockquote><p>Christ “came not to destroy but to fulfil the law” (Mt. 5:17). Here plerosai does not mean to make the imperfect perfect or to correct the faulty (which would rather be to destroy [analysai] it), but according to Hebrew usage to do what is commanded. Thus Christ fulfilled the law not by addition or correction, but by observation and execution.

He fulfilled the law in three ways: either as a doctrine by faithful preaching, solid confirmation and powerful vindication; or as a rule (normam) by a full and consistent keeping of it; or as a type by a perfect consummation, by exhibiting in himself the truth of the types and prophecies and the body of its shadows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.3.5.</span></figcaption>

<blockquote><p>In point of purity. Other creatures admit of some defiling mixtures, the sun doth not. It looks upon filth, but contracts none. Christ is a lamb without blemish, and without spot. Such as cast aspersions upon him in the days of his flesh, calling him glutton, winebibber, and friend of Publicans and sinners, did but act the mad man’s part, throwing dirt at the Sun, which none could possibly fasten upon.

He came indeed into a sinful world, but as a Physician among his sick patients, to cure them without taking the sickness of them, being antidoted by his Divinity against all infection. He hath an hand even in sinful acts; as they are acts (for in him we move) but not in the sinfulness of them: shines into the noisome dunghills of our hearts with beams of grace, yet continues most pure. He was borne of a sinner, lived and conversed with sinners, dyed with and for sinners, yea as a sinner, yet had not in himself the least sin of his own to answer for.</p></blockquote>

<blockquote><p>Nor does it follow that they were dead in the guilt of that sin of ignorance, because they never repented of it. If they did not expressly and formally repent of it, yet they sought its pardon implicitly when they sought the pardon on all sins (even of secret sins). Nor was a special repentance to be exacted of them for this act more than for the other acts of which we do not read that they repented.

Otherwise we do not read that Noah repented of his drunkenness; or Lot of incest; or others for other sins. Still we do not doubt that they obtained the pardon of all their sins from God through faith in the Messiah. If many pious persons commit numerous sins out of ignorance and error (of which they never distinctly repent), this does not prevent their seeking and obtaining the pardon of them – saying with David, “cleanse thou me from secret faults” (Ps. 19:12). Why may we not say the same of the ancient polygamists?</p></blockquote>

</figure><figure class="quote" id="q-4605ce51f3" data-kw="">
<blockquote><p>It is eternal. Christ as mediator was loved before the foundation of the world in God’s purpose: John xvii. 24, ‘Father, I will that they also whom thou hast given me may be with me where I am, that they may behold my glory that thou hast given me; for thou hast loved me before the foundation of the world.’

And in loving Christ he loved us; and in choosing Christ as head of the church, the members were included in that election, for head and body cannot be severed. This grace was given us in Christ before the world began: 2 Tim. i. 9, ‘Who hath saved us, and called us with an holy calling; not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the world began.’

Some are not called as soon as others, but all are loved as soon as others, even from eternity. God’s love is as ancient as himself, there was no time when God did not think of us, and love us. We are wont to prize an ancient friend; the ancientest friend we have is God, who loved us not only before we were lovely, but before we were at all. He thought of us before ever we could have a thought of him; after we had a being in infancy, we could not so much as know that he loved us; and when we came to years of discretion, we knew how to offend before we knew how to love and serve him; we cared not for his love, but prostituted our hearts to other things.

Let us measure the short scantling of our lives with eternity, wherein God showed love to us. As to our beings, we are but of yesterday; as to the constitution of our souls, we are sinners from the womb; and when we are convinced of it, we adjourn and put off the love of God to old decrepit age, when we have spent our strength in the world, and wasted ourselves in deceitful and flesh-pleasing vanities.

Now it should shame us when we remember God’s love is as ancient as his being. Some look after God sooner than others; but if you look after God never so soon, God was at work before us; those that began earliest, as Josiah, John Baptist, find God more early providing for their eternal welfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several</cite>, Sermons upon the Seventeenth Chapter of St. John in Thomas Smith (ed.), The Works of Thomas Manton (22 vols, London: James Nisbet &amp; Co., 1873), 11: 80.</span></figcaption>

</figure><figure class="quote" id="q-82ce48c9f5" data-kw="">
<blockquote><p>1. Such as are taken into an everlasting covenant shall never totally fall from grace. But all truly gracious persons are taken into an everlasting covenant, therefore they shall never totally fall from grace. That gracious persons are taken into covenant is evident because the grace of the covenant is wrought in them. That this covenant is everlasting is evident from Isaiah 55:3: “I will make an everlasting covenant with you, even the sure mercies of David.” And from Jeremiah 32:40: “I will make an everlasting covenant with them.”

That such as are taken into an everlasting covenant shall never totally fall from grace is evident because their total fall from grace would turn them out of the covenant, inasmuch as it would turn them out of God’s favour. And there is no promise of the covenant that belongs to total apostates – many threatenings, but no promises – and so the covenant would not be everlasting to them, neither would the mercies therefore be sure mercies.

2. Those to whom God has made sure promises of everlasting life and happiness shall never totally fall from grace. But God has made sure promises of everlasting life and happiness to all who are truly gracious; therefore none who are truly gracious shall totally fall from grace. … All such as are truly gracious have these graces of faith and love, and therefore the promises of eternal life and happiness are made unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Work Begun in the Day of Grace Performed Until the Day of Christ</cite>, ed. Don Kistler (1672; Morgan PA: Soli Deo Gloria, 1998), p. 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/82ce48c9f5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/20/thomas-vincent-on-the-everlasting-covenant-and-the-perseverance-of-the-saints/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e52658df6f" data-kw="">
<blockquote><p>For if the man be a back-slider in heart, and a servant of sin, Christ never touched his pulse. He hath as yet sure grounds to question, whether he be loved of God, or be in Christ, or no; for except you prove the man to be loved with an everlasting love, you can prove nothing: And your argument will not conclude any thing for the man’s peace, except you will prove him to be chosen of God; which is his only question.

But say that he is loved from everlasting, and that he is in Christ, by faith, it’s easy to prove, that his sins cannot change everlasting love, nor make him less beloved of God nor separate him from the love of God. You must then either remove the man’s doubting, from signs inherent in the man, (and if he be a back-slider in heart, you fetch fire and water from beyond the Moon to cure him;) or you must fetch warrants to convince him, from the mind, eternal counsels of love and free grace within God; and that is all the question between the poor man and you.

You cannot prove God hath loved him from everlasting, because he hath loved him from everlasting. If Libertines in this Argument intend to prove, that a chosen convert in Christ hath no ground to question, that he is not beloved of God, and not in Christ 1. That is nothing to the Thesis of Antinomians, maintained by all, that sinners, as sinners, are to believe God’s eternal love in Christ to them; and so all sinners, elect or reprobate, are to believe the same.

2. Its nothing to the universal commandment, that all and every one in the visible Church, wearied and loaden with sin, or not wearied and loaden, are immediately to come to Christ and rest on him, as made of God to them their righteousness, sanctification, and redemption, without any inherent qualification in them.

3. It’s nothing to the point of freeing all, and building a golden bridge to deliver all who are obliged to believe, elect or reprobate, from doubting whether they be in Christ or not, that they may easily come to Christ, and believe his eternal love and redemption in him, though they be in the gall of bitterness, and bonds of iniquity, and that immediately. Which golden Paradise to heaven and Christ, Antinomians liberally promise to all sinners, as sinners. I cannot believe that it’s so easy a step to Christ.</p></blockquote>

</figure><figure class="quote" id="q-e07c23c8a2" data-kw="">
<blockquote><p>In the first covenant, though life was freely promised, yet it was immediately annexed to perfect obedience, as a consequent reward of it,—it was firstly promised unto complete righteousness of men’s persons. But in the second covenant, firstly and principally life, eternal grace and glory, is promised to Jesus Christ and his seed, antecedent to any condition or qualification upon their part.

And then again, all the promises that run in way of condition, as “he that believeth shall not perish,” &amp;c.—”if ye walk after the Spirit ye shall live;” these are all the consequent fruits of that absolute gracious disposition and resignation of grace and life to them whom Christ hath chosen; and so their believing, and walking, and obeying, cometh in principally as parts of the grace promised, and as witnesses and evidences, and confirmations of that life which is already begun, and will not see an end.

Besides that, by virtue of these absolute promises made to the seed of Christ, and Christ’s complete performance of all conditions in their name, the promises of life are made to faith principally, which hath this peculiar virtue, to carry forth the soul to another’s righteousness and sufficiency, and to bottom it upon another; and in the next place, to holy walking, though mixed with many infirmities, which promise in the first covenant was only annexed to perfect and absolute obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary: Being Sermons on the Eighth Chapter of the Epistle to the Romans</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 130-31.</span></figcaption>

<blockquote><p>When Christ speaks here of an abiding in Him as the true Vine, He thereby indicates that true believers, who are in Him and must abide in Him through faith, are truly cut out of that old stock Adam, upon which they grow by virtue of the covenant of works (Rom. 11. 16-24); and that they through true saving faith being grafted into Him, must draw life from Him as the true stock, unto growth and fruitfulness. …

O! how few there are who shall fall out of the old stock! And though we admit that not every one experiences all that has been described in that order; yet we are certain that each one must be completely cut away from Adam, ere he shall live and grow through Jesus, the second Adam.</p></blockquote>

<blockquote><p>Faith and assurance are then still found as it pertains to the root, the ground, the state, and the possession of it, as well as to some of the activities that flow from that possession, but not as it pertains to the outflow and influence of the manifestation and assurance, the emotions, the consolation, the joy and serenity, as it was experienced earlier. …

</figure><figure class="quote" id="q-f2cdf0ebfd" data-kw="">
<blockquote><p>But here the Apostle seems to comprehend a twofold holiness of those that are reconciled; one which consists in the remission of sins, and the imputation of Christ’s righteousness; the other which consists in our renovation, and in the fruits of holiness. For in both ways Christ presents all his people holy before God.

They are now strictly saints by imputation, because they are regarded as one mystical person with Christ their head; but as to inherent holiness, that is not effected instantly, but increases daily, and acquires not the summit of its perfection before we are translated from this life to the life of glory.

Yet we maintain that this incipient sanctification is real, although not complete. And therefore the Apostle adds these words, before God. For he is said to be just and holy before God, who is so in reality, not in appearance only; in rectitude of intention, not in fictitious imitation, as Lyra not inaptly remarks on these words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 258.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Here we see the cause why Christ called Judas a Devil: for he said. Have I not chosen you twelve, and one of you is a devil. He became to be a devil and a traitor by nourishing a wicked and a covetous heart. And here we are taught that the ministers of the word, if they make no conscience of sin, by the just judgement of God do prove devils incarnate: this example of Judas doth manifest the same: and the reason is plain, for the more knowledge a man hath, the more wicked he is if he want grace. They are like in this case unto a man that hath meat and drink enough, but no stomach to digest meat: whereby the more he eateth, the more it turneth to his hurt.

This I speak not to deface the callings of ministers; but that those which preach God’s word, should not do it with impenitent hearts, living in their own sins. For it is a fearful thing for a man to speak unto the people of the pardon of their sin, and yet himself not to apprehend the same by faith. A lump of wax if you keep it from heat, or from the fire it keeps his own form still, but if it be held to the fire, it melts and runs abroad: so ministers who by reason of their callings come near God, if they be lumps of iniquity and live in their sins, they shall find that the corruptions of their hearts will melt abroad as wax at the fire. And therefore every one that is designed to this calling, must first purge himself of his own sins, or else God’s judgements shall fall upon him, as they did on Judas that betrayed Christ.”

— William Perkins, An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 307.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+we+see+the+cause+why+Christ+called+Judas+a+Devil%3A+for+he+said.+Have+I+not+chosen+you+twelve%2C+and+one+of+you+is+a+devil.+He+became+to+be+a+devil+and+a+traitor+by+nourishing+a+wicked+and+a+covetous+heart.+And+here+we+are+taught+that+the+ministers+of+the+word%2C+if+they+make+no+conscience+of+sin%2C+by+the+just+judgement+of+God+do+prove+devils+incarnate%3A+this+example+of+Judas+doth+manifest+the+same%3A+and+the+reason+is+plain%2C+for+the+more+knowledge+a+man+hath%2C+the+more+wicked+he+is+if+he+want+grace.+They+are+like+in+this+case+unto+a+man+that+hath+meat+and+drink+enough%2C+but+no+stomach+to+digest+meat%3A+whereby+the+more+he+eateth%2C+the+more+it+turneth+to+his+hurt.%0A%0AThis+I+speak+not+to+deface+the+callings+of+ministers%3B+but+that+those+which+preach+God%E2%80%99s+word%2C+should+not+do+it+with+impenitent+hearts%2C+living+in+their+own+sins.+For+it+is+a+fearful+thing+for+a+man+to+speak+unto+the+people+of+the+pardon+of+their+sin%2C+and+yet+himself+not+to+apprehend+the+same+by+faith.+A+lump+of+wax+if+you+keep+it+from+heat%2C+or+from+the+fire+it+keeps+his+own+form+still%2C+but+if+it+be+held+to+the+fire%2C+it+melts+and+runs+abroad%3A+so+ministers+who+by+reason+of+their+callings+come+near+God%2C+if+they+be+lumps+of+iniquity+and+live+in+their+sins%2C+they+shall+find+that+the+corruptions+of+their+hearts+will+melt+abroad+as+wax+at+the+fire.+And+therefore+every+one+that+is+designed+to+this+calling%2C+must+first+purge+himself+of+his+own+sins%2C+or+else+God%E2%80%99s+judgements+shall+fall+upon+him%2C+as+they+did+on+Judas+that+betrayed+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Symbol+or+Creed+of+the+Apostles%2C+According+to+the+Tenor+of+Scripture%2C+in+The+Work+of+William+Perkins+%28Cambridge%3A+John+Legat%2C+1600%29%2C+p.+307.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe7f417812.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe7f417812.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/16/william-perkins-false-ministers-are-incarnate-devils/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-346770f521" data-kw="">
<blockquote><p>The beginning of hungering and thirsting after righteousness lies in the birth of conviction of sin. In fact the presence of this element in it is what distinguishes true, deep repentance from every kind of superficial regret for the secondary consequences of sin. True repentance strips sin of all that is accidental.

It resembles an inner chamber where no one and nothing else is admitted except God and the sinner and his sin. Into that chamber all the great penitents like David and Paul and Augustine and Luther have entered, and each one in the bitter anguish of his soul has borrowed the words of the psalmist: ‘Against thee, thee only have I sinned, and done this evil in thy sight, that thou mightest be justified when thou speakest, and be clear when thou judgest.’ A repentant sinner acquits God and condemns himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), p. 37.</span></figcaption>

<blockquote><p>Pardon of sin is an act of God’s free grace whereby to a repenting, believing sinner for the sake of Christ and his righteousness that obligation to punishment which ariseth from the sinfulness of his heart and life is dissolved and ceaseth; or this: ’tis a gracious act of God discharging the sinner by the gospel promise or grant from the obligation to punishment upon consideration of the satisfaction made by Christ accepted by the sinner and pleaded with God.</p></blockquote>

</figure><figure class="quote" id="q-142b2e2d78" data-kw="">
<blockquote><p>You will be on all occasions improving the righteousness of Christ by faith, for all the ends and uses of it which I mentioned, when discoursing of the excellency of this righteousness. You will improve it as a ransom unto justice, to deliver you from going down to the pit; you will improve it as a laver, to wash you from going down to the pit; you will improve it as a laver, to wash you from sin and from uncleanness; as a spiritual banquet, on which you will feed your hungry souls, for it is meat indeed and drink indeed; as a robe to cover your nakedness, and the best robe whereby to appear in the presence of God; as a shade to defend you from the scorching heat of the fiery law, or an awakened conscience; as a refuge to shelter you when pursued by avenging justice; as a ladder by which you will ascend unto communion with God, here and hereafter; and as the only title and foundation of your claim to eternal life.

Thus, I say, you will be constantly improving the righteousness of Christ by faith, for some of these ends and uses; and in this sense we may understand that word of the apostle, Rom. i. “The righteousness of God revealed from faith to faith.” It is that which faith fastens upon at first for justification, and it is that which faith is continually afterwards applying for some good use or other, in the soul’s progress in the way to glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ethiopia stretching out her hands to God in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

<blockquote><p>The Westminster divines worked on what might have been called “The Medium Catechism” before scrapping it and writing the Shorter and Larger Catechisms. The minutes of the Assembly give us some insight into what this catechism would have looked like had it been published:

Q. 6. What doe the Scriptures teach us to conceive of God?

A. God is a most glorious being, infinite in all perfections. …

Q. 15. What are we to believe concerning the holiness of God?

A. God is most perfectly holy, and neither causeth nor alloweth any to sin. …

Q. 19. Is God subject to any change or changeableness?

A. God is always the same unchangeably notwithstanding the changes in all others things.

Q. 20. What are we to believe concerning the truth of God?

A. God is most true in all his words, particularly in his promises and threatenings, and it is not possible for him to lie.

Q. 21. What are we to believe concerning the blessedness of God?

A. God is in himself most blessed, every way, and for ever, neither can any creature add to his happiness or take anything from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 708, 711, 15, 17 Sep. 1646, pp 283, 285.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

-perfections/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ca982ba289" data-kw="">
<blockquote><p>He was tempted as Man, but He conquered as God; yea, He bids us be of good cheer, for He has overcome the world. He hungered—but He fed thousands; yea, He is the Bread that giveth life, and That is of heaven. He thirsted—but He cried, If any man thirst, let him come unto Me and drink. Yea, He promised that fountains should flow from them that believe. He was wearied, but He is the Rest of them that are weary and heavy laden. He was heavy with sleep, but He walked lightly over the sea. He rebuked the winds, He made Peter light as he began to sink. He pays tribute, but it is out of a fish; yea, He is the King of those who demanded it.

He is called a Samaritan and a demoniac;—but He saves him that came down from Jerusalem and fell among thieves; the demons acknowledge Him, and He drives out demons and sinks in the sea legions of foul spirits, and sees the Prince of the demons falling like lightning. He is stoned, but is not taken. He prays, but He hears prayer. He weeps, but He causes tears to cease. He asks where Lazarus was laid, for He was Man; but He raises Lazarus, for He was God. He is sold, and very cheap, for it is only for thirty pieces of silver; but He redeems the world, and that at a great price, for the Price was His own blood. As a sheep He is led to the slaughter, but He is the Shepherd of Israel, and now of the whole world also. As a Lamb He is silent, yet He is the Word, and is proclaimed by the Voice of one crying in the wilderness.

He is bruised and wounded, but He healeth every disease and every infirmity. He is lifted up and nailed to the Tree, but by the Tree of Life He restoreth us; yea, He saveth even the Robber crucified with Him; yea, He wrapped the visible world in darkness. He is given vinegar to drink mingled with gall. Who? He who turned the water into wine, who is the destroyer of the bitter taste, who is Sweetness and altogether desire.

He lays down His life, but He has power to take it again; and the veil is rent, for the mysterious doors of Heaven are opened; the rocks are cleft, the dead arise. He dies, but He gives life, and by His death destroys death. He is buried, but He rises again; He goes down into Hell, but He brings up the souls; He ascends to Heaven, and shall come again to judge the quick and the dead, and to put to the test such words as yours. If the one give you a starting point for your error, let the others put an end to it.</p></blockquote>

He is called a Samaritan and a demoniac;—but He saves him that came down from Jerusalem and fell among thieves; the demons acknowledge Him, and He drives out demons and sinks in the sea legions of foul spirits, and sees the Prince of the demons falling like lightning. He is stoned, but is not taken. He prays, but He hears prayer. He weeps, but He causes tears to cease. He asks where Lazarus was laid, for He was Man; but He raises Lazarus, for He was God. He is sold, and very cheap, for it is only for thirty pieces of silver; but He redeems the world, and that at a great price, for the Price was His own blood. As a sheep He is led to the slaughter, but He is the Shepherd of Israel, and now of the whole world also. As a Lamb He is silent, yet He is the Word, and is proclaimed by the Voice of one crying in the wilderness.

He is bruised and wounded, but He healeth every disease and every infirmity. He is lifted up and nailed to the Tree, but by the Tree of Life He restoreth us; yea, He saveth even the Robber crucified with Him; yea, He wrapped the visible world in darkness. He is given vinegar to drink mingled with gall. Who? He who turned the water into wine, who is the destroyer of the bitter taste, who is Sweetness and altogether desire.

</figure><figure class="quote" id="q-5939d6249e" data-kw="">
<blockquote><p>This [lack of spiritual comfort] may arise from the prevalence of a natural melancholy [depression] in the body, whereby the understanding may be darkened, the fancy troubled, reason perverted, and the soul saddened. Melancholy is the mother of discomfort and the nurse of doubting. It was (as some think) depth of melancholy that prevailed upon Nebuchadnezzar, so that he did not know, he was a man or a beast. And in the like manner this bodily melancholy may so far distemper your soul that you who have grace yet may not know whether you are a child of God or a child of the devil. It is not more wonder to see a melancholy man doubt and question his spiritual condition than it is to see a child cry when beaten or to hear a sick man groan.

You may silence a melancholy man when you are not able to comfort him; and though you may resolve his doubts and scruples by evident and convincing answers and arguments, yet let such a man retire alone and brood over his melancholy thoughts, and by the prevalence of this perturbing humour all is forgotten, and he is as unsatisfied as if you had said nothing to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: The Truth, Growth, and Different Degrees</cite>, ed. Don Kistler (Morgan PA: Soli Deo Gloria, 1997), pp 114-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>He who believes has eternal life. In justification not only the merit of Christ’s passive obedience is imputed but also that of his active obedience. In that benefaction believers receive forgiveness, exemption from punishment, and are not returned to the prefall state of Adam, who with the power granted to him had to keep the law and earn eternal life. On the contrary: on the basis of Christ’s perfect obedience, they are immediately entitled to eternal life; the holy works accomplished by Christ are credited to them; they do not, by keeping the law, have to earn eternal life, but do good works based on the principle of eternal life already granted to them in faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. John Vriend, ed. John Bolt (4 vols, Grand Rapids: Baker Academic, 2003-08), iv, 635.</span></figcaption>

</figure><figure class="quote" id="q-b54bc7e852" data-kw="">
<blockquote><p>For as it is in nature: first we are babes, &amp; then as we increase in years, so we grow in strength: so it is in the life of a Christian; first ordinarily he hath a weak faith, and after grows from grace to grace, till he come to stronger faith: and at the last he be able to say, he is fully assured in his heart and conscience of the pardon of his sins &amp; of reconciliation to God in Christ. And this assurance ariseth from many experiences and other blessings, which being deeply and duly considered bring a man to be fully persuaded, that God is his God, and God the father, his father, and Jesus Christ his redeemer, and the Holy Ghost his sanctifier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 195.</span></figcaption>

</figure><figure class="quote" id="q-b25d102dd9" data-kw="">
<blockquote><p>If we do not commit the sins which daily and hourly, either in deed, word, or thoughts, we do commit: yet in the good things which we do, how many defects are there intermingled? God in that which is done, respecteth the mind &amp; intention of the doer. Cut of then all these things wherein we have regarded our own glory, those things which men do to please men, and to satisfy our own liking, those things which we do by any respect, not sincerely, &amp; purely for the love of God: and a small score will serve for the number of our righteous deeds.

Let the holiest and best thing we do, be considered: we are never better affected unto God, then when we pray; yet when we pray, how are our affections many times distracted? How little reverence do we shew unto the grand majesty of God unto whom we speak? How little remorse of our own miseries? How little taste of the sweet influence of his tender mercies do we feel? Are we not as unwilling many times to begin, and as glad to make an end; as if in saying, call upon me, he had set us a very burdensome task? It may seem somewhat extreme which I will speak: therefore let every one judge of it, even as his own heart shall tell him, and no otherwise …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works, and how the Foundation of Faith is Overthrown</cite>, (Oxford: Joseph Barnes, 1612), p. 10.</span></figcaption>

<blockquote><p>The general doubtsome faith of the Papists, is not faith, but unbelief; and therefore no wonder that our forefathers abjured it in our National Covenant.</p></blockquote>

</figure><figure class="quote" id="q-b813db9ab9" data-kw="">
<blockquote><p>In the midst of denying that Cornelius was saved while remaining a heathen, the Westminster divine Anthony Burgess pointed out that Cornelius was actually a believer in the promised Messiah. Ergo, the so-called “conversion” of Cornelius was not a revivalist conversion narrative at all. Instead, it is an example of someone during the period of transition between the Old and New Testaments coming to a realisation that Jesus of Nazareth was the promised Messiah:

I will not bring all the places they [who affirm the heathen can be saved] stand upon, that which is mainly urged is Act. 10 of Cornelius; his prayers were accepted, saith Peter, Now I perceive, &amp;.c. But this proceedeth from a mere mistake; for Cornelius had the implicit knowledge and faith of Christ, and had received the doctrine of the Messias, though he was ignorant of Christ, that individual Person. And as for that worshipping of him in every Nation, that is not understood of men abiding so, but whereas before it was limited to the Jews, now God would receive all that should come to him, of what Nation soever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), pp 80-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the midst of denying that Cornelius was saved while remaining a heathen, the Westminster divine Anthony Burgess pointed out that Cornelius was actually a believer in the promised Messiah. Ergo, the so-called “conversion” of Cornelius was not a revivalist conversion narrative at all. Instead, it is an example of someone during the period of transition between the Old and New Testaments coming to a realisation that Jesus of Nazareth was the promised Messiah:

I will not bring all the places they [who affirm the heathen can be saved] stand upon, that which is mainly urged is Act. 10 of Cornelius; his prayers were accepted, saith Peter, Now I perceive, &amp;.c. But this proceedeth from a mere mistake; for Cornelius had the implicit knowledge and faith of Christ, and had received the doctrine of the Messias, though he was ignorant of Christ, that individual Person. And as for that worshipping of him in every Nation, that is not understood of men abiding so, but whereas before it was limited to the Jews, now God would receive all that should come to him, of what Nation soever.”

<blockquote><p>Q. When shall a Christian heart come to this full assurance?

A. Not at the first, but in some continuance of time, when he hath been well practised in repentance, and hath had divers experiences of God’s love unto him in Christ: Then after them will appear in his heart the fullness of persuasion: which is the ripeness and strength of faith.</p></blockquote>

</figure><figure class="quote" id="q-0cf28b9d94" data-kw="">
<blockquote><p>Although a Gentile by birth, Cornelius, was yet a proselyte by religion. Although he could not believe that the Messiah had come and was that Jesus whom Peter preached, yet he could not believe with the Jews from the oracles of the prophets that he would come. Thus he is not to be reckoned among the Gentiles, but among the patriarchs who looked for salvation from a Redeemer not yet manifested. Hence by the advent of Peter, he did not receive a beginning, but an increase of faith.</p></blockquote>

</figure><figure class="quote" id="q-62f7cadd1b" data-kw="">
<blockquote><p>[F]or many greatly deceive themselves in hearing the word. They admit of sacred truths in their understanding, and assent unto them, but take not in the power of them on their consciences, nor strictly judge of their state and condition by them, which proves their ruin; for healthy they seem to themselves to believe that whereof in truth they believe not one syllable as they ought. They hear it, they understand it in the notion of it, they assent unto it, at least they do not contradict it, yea, they commend it oftentimes and approve of it, but yet they believe it not; for if they did, they would judge themselves by it, and reckon on it that it will be with them at the last day according as things are determined therein.</p></blockquote>

<blockquote><p>Q. What are the parts of Justification?

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 194.</span></figcaption>

<blockquote><p>Preaching at the opening of Fisherwich Presbyterian meeting-house, Belfast in 1827, Thomas Chalmers explained the connection between justification and sanctification. A contemporary report of the sermon gives us the following account of Dr Chalmers’s sermon:

He then came to the practical application of his subject, – that holiness of life, according to the Christian dispensation, was indispensable to eternal happiness. […] Sanctification is a renewal of the inward man, arising from the operation of the Holy Spirit producing a conviction of past error, and a determination for future amendment of life – for, said he, (with a warmth of manner which we have seldom witnessed,) though we are justified by faith alone, we are not justified by that faith which is alone. […] “THERE IS A WORLD OF THEOLOGY IN THAT SENTENCE – ‘We are justified by faith alone, but not by that faith which is alone.&#x27;” After a moment’s pause, he described the heaven of the Christian, as a heaven of uprightness – a heaven in which the state of a man’s soul, in a moral sense, arising from sanctification by faith, would be more conducive to celestial enjoyment that the place itself – an enjoyment arising from the pure worship of God, and the pleasure of holding converse with the saints, sanctified by faith in Christ. As well, he exclaimed, in a strain of intense eloquence, to which we feel inadequate to do justice, – as well might you offer a heaven of beauty to a blind man, or a heaven of melody to a deaf man, or a heaven of philosophy to a man void of understanding, as a heaven of holiness to a man unsanctified by faith. The place of that heaven is in the heart of man, regenerated by the conviction of the necessity of a virtuous course in this life, to the enjoyment of felicity in that to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 28 Sep. 1827</span></figcaption>

<blockquote><p>Now let us fall down before the Majesty of our good God with acknowledgment of our faults, praying him to make us perceive them more and more, so as we may mislike of them, and not only confess them with our mouth, but also lay open our hearts before him, and submit ourselves wholly to his holy word, and that in such wise we may be comforted by his free goodness, as it is showed us in our Lord Jesus Christ, and he reform us also by his holy spirit, to the end that whereas we of ourselves be full of rebelliousness, we may by his governing become teachable and ready to follow his holy will, and to give ourselves over all wholly unto him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Galatians</cite>, (1574; Audubon NJ, 1995), p. 456.</span></figcaption>

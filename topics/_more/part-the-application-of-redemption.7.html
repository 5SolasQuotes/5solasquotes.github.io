<div class="actions"><button class="copy" data-copy="“But here the Apostle seems to comprehend a twofold holiness of those that are reconciled; one which consists in the remission of sins, and the imputation of Christ’s righteousness; the other which consists in our renovation, and in the fruits of holiness. For in both ways Christ presents all his people holy before God.

They are now strictly saints by imputation, because they are regarded as one mystical person with Christ their head; but as to inherent holiness, that is not effected instantly, but increases daily, and acquires not the summit of its perfection before we are translated from this life to the life of glory.

Yet we maintain that this incipient sanctification is real, although not complete. And therefore the Apostle adds these words, before God. For he is said to be just and holy before God, who is so in reality, not in appearance only; in rectitude of intention, not in fictitious imitation, as Lyra not inaptly remarks on these words.”

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 258.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+here+the+Apostle+seems+to+comprehend+a+twofold+holiness+of+those+that+are+reconciled%3B+one+which+consists+in+the+remission+of+sins%2C+and+the+imputation+of+Christ%E2%80%99s+righteousness%3B+the+other+which+consists+in+our+renovation%2C+and+in+the+fruits+of+holiness.+For+in+both+ways+Christ+presents+all+his+people+holy+before+God.%0A%0AThey+are+now+strictly+saints+by+imputation%2C+because+they+are+regarded+as+one+mystical+person+with+Christ+their+head%3B+but+as+to+inherent+holiness%2C+that+is+not+effected+instantly%2C+but+increases+daily%2C+and+acquires+not+the+summit+of+its+perfection+before+we+are+translated+from+this+life+to+the+life+of+glory.%0A%0AYet+we+maintain+that+this+incipient+sanctification+is+real%2C+although+not+complete.+And+therefore+the+Apostle+adds+these+words%2C+before+God.+For+he+is+said+to+be+just+and+holy+before+God%2C+who+is+so+in+reality%2C+not+in+appearance+only%3B+in+rectitude+of+intention%2C+not+in+fictitious+imitation%2C+as+Lyra+not+inaptly+remarks+on+these+words.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1831%29%2C+1%3A+258.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2cdf0ebfd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2cdf0ebfd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/09/john-davenant-on-the-two-fold-holiness-of-the-saints/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0997eafc07" data-kw="">
<blockquote><p>We must notice also the two parts of which justification consists, viz. the remission of sins, and the right or title to eternal life; these two the scripture joins together – “Christ was made under the law, to redeem them that were under the law,” that is, from the curse of it, “ that we might receive the adoption of sons,” i.e. the right to life, which flows from adoption.

So again, Paul declares that “by faith we receive remission of sins, and an inheritance among them that are sanctified,” i.e. a right or title to eternal life, (Acts xvi. 18.) These two benefits are joined together; for although they could be separated in the nature of things, so that a sinner might obtain remission of sins, and yet not be crowned with eternal glory, yet are they inseparably connected together in the covenant of grace.

The first of these benefits is set forth under different forms of expression—such as remission, sins being sometimes represented as debts—pardon, alluding to the pardon which a judge grants to a criminal —cleansing, sin being often compared to filth, in which also there is an allusion to the blood of a propitiatory sacrifice—blotting out, which expression gives us the idea of a book in which divine justice notes down all our sins in order to punish them. It is further set forth by covering sin, God being regarded as hiding our sins under the veil of his mercy, so that his justice cannot behold them; also by non-imputation, alluding to the account books of merchants or traders.

Also by reconciliation, denoting previous enmity—deliverance, denoting previous bondage—making white, (Isaiah l. 18,) an allusion, if we may believe some persons, to what happened in the case of the scape-goat, who was sent away into the wilderness with a rope of red colour, which, during his journey, miraculously became white, if God pardoned the sins of the people; but if not, remained red. The other benefit is also expressed by various terms, and particularly by that of adoption, of which we shall treat presently.

The foundation of both these benefits is not the inherent righteousness, or good works of sinners themselves; for our justification, according to David and St. Paul, is without works, (Psalm cxliii. 2; Rom. iii. 20, 28; iv. 6; Gal. ii. 16); not merely works done before grace, which are nothing but sins, but works done even after grace received. If any man had ever been justified by works, surely it would have been David, or Abraham; but they were not so justified.

Besides, if the foundation of this benefit were our own righteousness or good works, the two covenants would be confounded; whereas they are diametrically opposed to each other nor can imperfect righteousness, such as is defiled with many stains, constitute any such foundation. Now such is the character of all our righteousness, which is compared to “filthy rags,” (Isaiah Ixiv. 6.) If you lean upon it, says even one of the Popes, Adrian VI it is a mere reed, which will break, and also pierce through the hand of him that thus leans upon it. Nor can such a righteousness deserve the remission of sins, since the forgiven sinner receives the very contrary to what he has truly deserved,</p></blockquote>

<blockquote><p>There are many things which distinguish this divine adoption from that which obtains among men. 1st, The former is not an expression to supply the want of children, which is commonly the case among men; for God has his only begotten Son, who is incomparably preferable to all the rest taken together, who is immortal as his Father; and though, from a principle of wonderful humility, he condescended to become mortal, and even to die, yet he rose again from the dead, and liveth for ever. From him is derived all that felicity, which our heavenly Father is pleased to confer upon us, out of his mere grace and bounty, through the merits and mediation of his dear Son. And is there any one, on whom this felicity is bestowed, who will not freely acknowledge himself to be quite unworthy of so great an honour?

Yet such honour has the eternal and incomprehensible love of God condescended to bestow on us, who are quite unworthy and undeserving; and in this also, the divine adoption differs from that which is customary among men, who generally chuse the most deserving they can meet with. But all those, whom God maketh choice of, are unworthy, and some even are remarkably so.

2dly, Men generally adopt but one a piece, or at most a few; but divine adoption admits into the heavenly family a most numerous host, extending even unto myriads, that Jesus, who is the head of the family, “may be the first born among many brethren.” And, 3dly, They are all heirs; when it is said, in another place, “That he might bring many sons into glory.” Nor is the inheritance of any individual in the least diminished in consequence of so vast a multitude of heirs; for it is an inheritance in light, and every one has the whole of it.</p></blockquote>

<blockquote><p>This covenant [of grace] was established immediately after the Fall of man. From that time forward it has been repeated, albeit rather obscurely under the law and, in truth, more openly under grace. This covenant of grace is understood, indeed, in several words; that is, in the promise of justice and life held forth under the condition of faith.

But God, in consideration of our faith, willed this covenant of grace to be declared and explained more extensively in his Gospel, just as the covenant of works was explicated in the doctrine of the law. And so in the Gospel, and primarily in the new testament (as it is called), we learn about Jesus Christ the Mediator, about his humiliation and his glorification, and finally about the benefits promised in the covenant — remission of sins, justification, sanctification, eternal life.

And so the Gospel which we hold in our hands, and the whole preaching of that Gospel, is nothing other than the doctrine of God’s gratuitous covenant declared and explained more extensively and fully. And so Paul, in Rom. 10, summarizes that word of faith, that is, the Gospel, in these words: ‘If you confess with your mouth the Lord Jesus, and believe in your heart that God has raised him from the dead, you will be saved.’

From this it is apparent that the entire doctrine of the Gospel is reducible to this covenant and the promise which it contains; and thus the Gospel is nothing other than a fuller explication of the covenant. But if someone cuts himself off from this covenant of grace, no further sacrifice remains for that man; indeed, this would be to demand a new mediator (Heb. 6:6; 10:26).</p></blockquote>

<blockquote><p>3. The Holy Spirit specially seals each particular believer, and makes him sure of his adoption, by a certain wonderful and secret testimony: for he is given to every believer as a pledge of divine love; and he, finally, pronounces in the hearts of the godly, that they are in favour with God: which testimony they both may and ought to believe. Therefore they do believe in particular that they are in the grace of God, and that their sins are remitted them.

The authorities from which all this is proved are well known: Rom. viii. 16, The Spirit beareth witness with our spirits that we are the children of God; Gal. iv. 6, Because ye are sons, God hath sent forth the Spirit of his Sort into your hearts, crying, Abba, Father; and Ephes. i. 13, 14, Ye were sealed with that Holy Spirit, after that ye believed, which is the earnest of your inheritance. Nor is this testimony fallacious or conjectural, but certain and infallible in all in whom it is found.

For the word is the ministration of the Spirit, 2 Cor. iii.; and faith conceived by the ministration of the word, is always joined with the witness of the Spirit itself. Therefore the impression of faith by the Holy Spirit, in the heart of a particular man, is, as it were, a particular testimony that he is in grace, and that he is a child of God. So Bernard, Serm. 5, De dedicat. ecclesise. Who can tell whether he is worthy of love or hatred? Who hath known the mind of the Lord? Here it is necessary that faith should come to our aid; that what is concealed concerning us in the heart of the Father, may be revealed to us by his Spirit; and his Spirit bearing witness may persuade our spirits that we are the children of God. But he persuades by calling and justifying us freely through faith.

[Cardinal Robert] Bellarmin[e] replies, that the Holy Spirit witnesses to our spirits only by some experience of an internal suavity and peace which produces nothing better than a conjectural certainty. De justif. lib. iii. cap. 9.

But Bernard rejects this Jesuitical comment: for he says this testimony is received by the act of faith; and that the Holy Spirit persuades our spirit that we are the children of God, by faith, not by fallible conjectures. So Chrysostom in viii. ad Rom. When the Spirit testifies can any doubt remain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39-40.</span></figcaption>

</figure><figure class="quote" id="q-21aebcefb8" data-kw="">
<blockquote><p>2. From the nature of the promises. The promises of gospel grace and the remission of sins, through the reconciliation of Christ, are to be so believed by us as to afford firm and solid consolation: but unless I in particular believe that I am reconciled, and that I am absolved from sins, they cannot yield this consolation. The former is evident, because the very end of gospel grace and of the divine promises is, that we may have strong consolation, Heb. vi. 18.

But that general faith of the Papists, that every one who believes truly and lives piously, hath remission of sins; or that conditional faith, I, if I am faithful, am in the grace of God, does not yield strong consolation, because it may consist with despair. It is necessary, says Bernard, to believe that you cannot have forgiveness, unless by the mercy of God; but at the same time believe this, that your own sins are forgiven you through him. Bernard, De annunt. Serm. 2.

And the reason is because promises of God do not take effect until they have been accepted by us; although, therefore, remission of sins, upon condition of faith, be offered to all, yet it must of necessity be accepted by men individually and singly, that it may be useful and salutary to each one. Promises are not accepted by those who do not, but by those who do know, and understand, and feel, that they apprehend and accept them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2. From the nature of the promises. The promises of gospel grace and the remission of sins, through the reconciliation of Christ, are to be so believed by us as to afford firm and solid consolation: but unless I in particular believe that I am reconciled, and that I am absolved from sins, they cannot yield this consolation. The former is evident, because the very end of gospel grace and of the divine promises is, that we may have strong consolation, Heb. vi. 18.

But that general faith of the Papists, that every one who believes truly and lives piously, hath remission of sins; or that conditional faith, I, if I am faithful, am in the grace of God, does not yield strong consolation, because it may consist with despair. It is necessary, says Bernard, to believe that you cannot have forgiveness, unless by the mercy of God; but at the same time believe this, that your own sins are forgiven you through him. Bernard, De annunt. Serm. 2.

And the reason is because promises of God do not take effect until they have been accepted by us; although, therefore, remission of sins, upon condition of faith, be offered to all, yet it must of necessity be accepted by men individually and singly, that it may be useful and salutary to each one. Promises are not accepted by those who do not, but by those who do know, and understand, and feel, that they apprehend and accept them.”

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+From+the+nature+of+the+promises.+The+promises+of+gospel+grace+and+the+remission+of+sins%2C+through+the+reconciliation+of+Christ%2C+are+to+be+so+believed+by+us+as+to+afford+firm+and+solid+consolation%3A+but+unless+I+in+particular+believe+that+I+am+reconciled%2C+and+that+I+am+absolved+from+sins%2C+they+cannot+yield+this+consolation.+The+former+is+evident%2C+because+the+very+end+of+gospel+grace+and+of+the+divine+promises+is%2C+that+we+may+have+strong+consolation%2C+Heb.+vi.+18.%0A%0ABut+that+general+faith+of+the+Papists%2C+that+every+one+who+believes+truly+and+lives+piously%2C+hath+remission+of+sins%3B+or+that+conditional+faith%2C+I%2C+if+I+am+faithful%2C+am+in+the+grace+of+God%2C+does+not+yield+strong+consolation%2C+because+it+may+consist+with+despair.+It+is+necessary%2C+says+Bernard%2C+to+believe+that+you+cannot+have+forgiveness%2C+unless+by+the+mercy+of+God%3B+but+at+the+same+time+believe+this%2C+that+your+own+sins+are+forgiven+you+through+him.+Bernard%2C+De+annunt.+Serm.+2.%0A%0AAnd+the+reason+is+because+promises+of+God+do+not+take+effect+until+they+have+been+accepted+by+us%3B+although%2C+therefore%2C+remission+of+sins%2C+upon+condition+of+faith%2C+be+offered+to+all%2C+yet+it+must+of+necessity+be+accepted+by+men+individually+and+singly%2C+that+it+may+be+useful+and+salutary+to+each+one.+Promises+are+not+accepted+by+those+who+do+not%2C+but+by+those+who+do+know%2C+and+understand%2C+and+feel%2C+that+they+apprehend+and+accept+them.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1831%29%2C+i%2C+39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F21aebcefb8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/21aebcefb8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/07/john-davenant-on-infallible-assurance-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-103b17c7c3" data-kw="">
<blockquote><p>From the consideration of which arises an important controversy between us and the Papists, which we shall briefly touch upon. The Apostle, as you have heard, desires for the faithful grace and peace from God, and from the Lord Jesus Christ; i. e. gratuitous acceptance for Christ’s sake, adoption among the children of God, and assurance of the remission of sins: Hence it is enquired Whether the faithful can or cannot assuredly determine with themselves that they are in favour with God, and that their sins are remitted them for Christ’s sake, in whom they have believed ? Our opinion is that every faithful and truly justified man may, and ought, infallibly to believe, that his sins are remitted to him as an individual, and that God is reconciled to him; i. e. that he hath this grace and peace, which the Apostle desired for the Colossians.

The opinion of the Papists is. That they who are truly justified and in favour with God, yet neither can nor ought to believe that they are reconciled to God and justified; but to hope and conjecture only that they are in a state of grace, and have obtained remission.

We establish our opinion by these arguments :

1. From the nature of faith. He who is endued with true faith sees, by the very light of that faith kindled in his heart through the Holy Spirit, that he believes in Christ, and is justified by faith: but he who sees this, at the same time is able to conclude that he is in favour with God, and that his sins are remitted him. For Scripture plainly states. Being justified by faith we have peace, Rom. v. 1 . He that believeth on the Son hath everlasting life, John iii, 16 and 36. Therefore the whole difficulty lies in this. To shew that a believer is authorised to say, not from conjecture and opinion, but from conviction, I believe in Christ. This is proved from Augustine, De Trin. xiii. 1, That which we are commanded to believe we are not able to see ; yet faith itself when it is wrought in us, we know to be in us. So Thomas [Aquinas], Whosoever hath knowledge or faith, is sure that he hath it; became it is of the nature of faith, that a man should be certain of those things of which he hath faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 36-38.</span></figcaption>

<blockquote><p>WHAT FAITH IS.

FAITH is a sure persuasion and an undoubted belief of the heart in the merciful promises of God, made to all faithful penitent sinners in Christ’s blood, and freely performed of God the Father for Christ’s sake.

WHAT BENEFITS WE RECEIVE OF GOD THROUGH FAITH.

By faith we, which afore by nature were the children of wrath, are made the sons and children of God. …

By faith we, which afore were sinners, are justified and counted righteous in the sight of God for Christ’s sake. …

By faith Christ’s fulfilling of the law is counted our fulfilling. …

By faith our works are allowed before God for Christ’s sake. …

By faith everlasting life is given unto us for Christ’s sake. …</p></blockquote>

</figure><figure class="quote" id="q-f6b948a82b" data-kw="">
<blockquote><p>Not only is it in the freedom of God to bestow the grace of regeneration upon elect infants prior to the rite of baptism, but it is to be believed that this is the course he usually pursues. This I deduce in the following manner from what has already been said: Since God may from their very birth receive elect infants into the fellowship of his covenant, unite them to Christ, reconcile them to himself, remitting to them the guilt of original sin, there seems no reason why he should not regenerate them at the same time, unless they are incapable of regeneration, which, as we have just proved, is not the case.

Besides, I cannot suppose it possible to prove by any example or testimony that the guilt of any sin may be taken away through forgiveness unless at the same time the dominion of that sin is broken, so that while it loses the power to condemn, it loses also the power to reign. So far as the power of sin is weakened, sin is mortified. So far as sin is mortified, the soul is quickened—this very quickening of the soul’s regeneration.

In addition, the soul cannot be united to Christ except through the Spirit of Christ. The Spirit of Christ is the Spirit of life (Rom. 8:2). Christ himself is our life (Col. 3:4). How then can it be that a soul chosen of God, beloved of Christ, absolved from the guilt of original sin, and united to the source of life by the Spirit of life should not be immediately quickened into spiritual life by Christ and his Spirit in virtue of that union?

From all these things it undeniably follows that those infants who, before receiving baptism, are regarded as partakers of the benefits of the covenant of grace, united to Christ, reconciled to God, absolved from the guilt of original sin, ought also to be regarded as born again and quickened by Christ’s Spirit. Nor does any argument occur to me to the contrary—so far, at least, as concerns those who depart from this life before attaining to the use of reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 147-48.</span></figcaption>

</figure><figure class="quote" id="q-785dedbe7c" data-kw="">
<blockquote><p>God has truly blessed us with all spiritual blessings in Jesus Christ. In that divine Christ, whom he gave us this morning in his sacrament, God presented us with all his most precious blessings – all the merits of his Son – all the consolations of his Spirit – all the sweets of his peace – all the riches of his grace – all the assurances of his glory; and if our hearts were then regulated aright, there is nothing in the treasures of his indulgence – nothing in the benefits of redemption – nothing in the joys of sanctification – nothing in the pleasure of reconciliation with God – nothing in all the sources of heavenly life and felicity, of which we have been partakers. Blessed, then, blessed be the God and Father of our Lord Jesus Christ, who hath blessed us this happy day with all spiritual blessings in Christ.</p></blockquote>

<blockquote><p>[I]n this present life there is no greater joy or contentment, nothing more certain or necessary for rising above all the difficulties we face, than to know and feel that we are children of God. When this foundation is laid, we can be sure that all that happens to us in some way a blessing of the heavenly Father. It is a means, an aid, a path that in his providence he has prepared either to lead us toward eternal life or to increase our glory in it.</p></blockquote>

</figure><figure class="quote" id="q-5b0b15e608" data-kw="">
<blockquote><p>How shall we, that are dead to sin, live any longer therein?” as much as to say, When grace has brought it to pass that we should die unto sin, what else shall we be doing, if we continue to live in it, than showing ourselves ungrateful to grace? The man who extols the virtue of a medicine does not contend that the diseases and wounds of which the medicine cures him are of advantage to him; on the contrary, in proportion to the praise lavished on the remedy are the blame and horror which are felt of the diseases and wounds healed by the much-extolled medicine. In like manner, the commendation and praise of grace are vituperation and condemnation of offences.

For there was need to prove to man how corruptly weak he was, so that against his iniquity, the holy law brought him no help towards good, but rather increased than diminished his iniquity; seeing that the law entered, that the offence might abound; that being thus convicted and confounded, he might see not only that he needed a physician, but also God as his helper so to direct his steps that sin should not rule over him, and he might be healed by betaking himself to the help of the divine mercy; and in this way, where sin abounded grace might much more abound,—not through the merit of the sinner, but by the intervention of his Helper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Spirit and the Letter</cite>, (412), 9 in Nicene and Post-Nicene Fathers 1, 5: 86.</span></figcaption>

ne-of-hippo-the-law-reveals-our-need-for-a-physician/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0ef5b46ada" data-kw="">
<blockquote><p>But I am more prone to this opinion, that I should believe that Lydia, a Jewish woman, was induced with the spirit of regeneration, and had received true piety, and believed in the Messiah promised, although she did not yet know that Jesus the Son of Mary was the Christ, because he was preached to her. Such an one was the Eunuch of Candaces, and Cornelius, who, Act. 10 is called a devout man, whose prayers, and alms, and piety, was praised, before he had heard anything of Christ …

I think it were a wickedness to account these among infidels, and among the rest of the Jews, who did blaspheme Christ, and despise him preaching. Seeing therefore that Lydia was such an one, God opened her heart, that she might attend to the words of Saint Paul, and might learn from him, that Christ whom she did expect, was already come, and that those things were fulfilled, which were fore-told of him by the Prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 36.9, p. 306.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

on-the-conversion-narratives-of-lydia-the-ethiopian-eunuch-and-cornelius/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2c3f0e6b60" data-kw="">
<blockquote><p>Some confine faith to the understanding, and make it no more but a firm assent of the understanding to the truth of God. It is the faint and languid definition which Bellarmine and too many with him give to faith — a definition which barreth confidence and personal application from the nature of faith.

Others will acknowledge no other faith but a certain confidence, without the least wavering that Christ is ours and his merits, and exclude from the number of the faithful all such as doubt. Both are in fault and run to opposite extremes.

As for that faith confined to the assent of the understanding, if we must only believe that St. Luke and St. John have truly related the history of Christ’s passion, and must not attempt to lay our whole trust on the merit of it, nor apply it to ourselves for fear of presumption, certainly we are in an ill case—in no better case than the devil, for he believeth the truth of God’s promises, but dares not apply them to himself.

And as for the full confidence in God’s mercy through Jesus Christ without any doubting, it is indeed the highest degree of faith, if it be upon good ground. Blessed and holy is he that hath that right confidence. And then it will be right when it worketh love, humility and repentance in the heart. That full confidence we must all aim unto and never leave till we obtain it. But as handsomeness and strength are not the essence but the perfection of man’s body, likewise a full confidence of our salvation upon good ground is not the essence but the perfection of faith.

So that as you would not deny a child or a lame man to be a true man; likewise you must not deny a trembling or a halting faith to be a true faith when a good soul saith, “Lord, I believe, help thou my unbelief” [Mark 9:24]. For observe that he that spake so, obtained of the Lord what he would have. To teach us that the humble penitent soul that can but take his recourse unto Christ hath faith enough to obtain his mercy.

These two acts of faith must be distinguished: the direct act, which embraceth the mercy of God through Jesus Christ; and the reflected act, which is the assurance and comfort that the soul feeleth by embracing the mercy of God in Jesus Christ.

The justifying act of faith is the direct act, not the reflected. For it is evident that we are justified before God because we embrace the mercy of God through the merits of Jesus Christ, not by the assurance and comfort arising out of it in our consciences. Wherefore it is a very ill consequence to say, I have no comfort, therefore I have no faith; for you are not justified by your comfort in God’s mercy through Jesus Christ but by our recourse to it. Were this well apprehended, it would ease many troubled consciences. “Come unto me,” saith Christ, “all ye that labour and are heavy laden” Matth. 11:28. Coming to Christ with a contrite heart, labouring and heavy laden, is believing on him; and many believe to salvation that believe not yet to comfort.

In effect coming to Christ in the style of Christ is believing on him. “Him that cometh to me, I will in no wise cast out,” saith he, John 6:37. And two verses before, “He that cometh to me shall never hunger, and he that believeth in me shall never thirst.” So in the sense of the Lord Jesus, coming to him and believing on him are all one. And they that come to him as the true and sole object of their faith are certainly justified, though they be not presently comforted. They are justified by faith when they believe not their own faith.

Let us be disciples of the disciples of Christ, learning of them to pray to him: “Lord increase our faith” [Luke 17:5]—there being no essential want in the world (either for the spiritual or the temporal) but comes for want of faith. Let him that mistrusteth God’s mercy have recourse nevertheless unto that mercy. Let him hope against hope. Let him wrestle, as Jacob, by a holy obstinacy, and not let the Lord go till he hath got a blessing</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Add to Your Faith Virtue (1684) in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

lieve%2C+help+thou+my+unbelief%E2%80%9D+%5BMark+9%3A24%5D.+For+observe+that+he+that+spake+so%2C+obtained+of+the+Lord+what+he+would+have.+To+teach+us+that+the+humble+penitent+soul+that+can+but+take+his+recourse+unto+Christ+hath+faith+enough+to+obtain+his+mercy.%0A%0AThese+two+acts+of+faith+must+be+distinguished%3A+the+direct+act%2C+which+embraceth+the+mercy+of+God+through+Jesus+Christ%3B+and+the+reflected+act%2C+which+is+the+assurance+and+comfort+that+the+soul+feeleth+by+embracing+the+mercy+of+God+in+Jesus+Christ.%0A%0AThe+justifying+act+of+faith+is+the+direct+act%2C+not+the+reflected.+For+it+is+evident+that+we+are+justified+before+God+because+we+embrace+the+mercy+of+God+through+the+merits+of+Jesus+Christ%2C+not+by+the+assurance+and+comfort+arising+out+of+it+in+our+consciences.+Wherefore+it+is+a+very+ill+consequence+to+say%2C+I+have+no+comfort%2C+therefore+I+have+no+faith%3B+for+you+are+not+justified+by+your+comfort+in+God%E2%80%99s+mercy+through+Jesus+Christ+but+by+our+recourse+to+it.+Were+this+well+apprehended%2C+it+would+ease+many+troubled+consciences.+%E2%80%9CCome+unto+me%2C%E2%80%9D+saith+Christ%2C+%E2%80%9Call+ye+that+labour+and+are+heavy+laden%E2%80%9D+Matth.+11%3A28.+Coming+to+Christ+with+a+contrite+heart%2C+labouring+and+heavy+laden%2C+is+believing+on+him%3B+and+many+believe+to+salvation+that+believe+not+yet+to+comfort.%0A%0AIn+effect+coming+to+Christ+in+the+style+of+Christ+is+believing+on+him.+%E2%80%9CHim+that+cometh+to+me%2C+I+will+in+no+wise+cast+out%2C%E2%80%9D+saith+he%2C+John+6%3A37.+And+two+verses+before%2C+%E2%80%9CHe+that+cometh+to+me+shall+never+hunger%2C+and+he+that+believeth+in+me+shall+never+thirst.%E2%80%9D+So+in+the+sense+of+the+Lord+Jesus%2C+coming+to+him+and+believing+on+him+are+all+one.+And+they+that+come+to+him+as+the+true+and+sole+object+of+their+faith+are+certainly+justified%2C+though+they+be+not+presently+comforted.+They+are+justified+by+faith+when+they+believe+not+their+own+faith.%0A%0ALet+us+be+disciples+of+the+disciples+of+Christ%2C+learning+of+them+to+pray+to+him%3A+%E2%80%9CLord+increase+our+faith%E2%80%9D+%5BLuke+17%3A5%5D%E2%80%94there+being+no+essential+want+in+the+world+%28either+for+the+spiritual+or+the+temporal%29+but+comes+for+want+of+faith.+Let+him+that+mistrusteth+God%E2%80%99s+mercy+have+recourse+nevertheless+unto+that+mercy.+Let+him+hope+against+hope.+Let+him+wrestle%2C+as+Jacob%2C+by+a+holy+obstinacy%2C+and+not+let+the+Lord+go+till+he+hath+got+a+blessing%E2%80%9D%0A%0A%E2%80%94+Peter+Du+Moulin%2C+Add+to+Your+Faith+Virtue+%281684%29+in+Mid-American+Journal+of+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c3f0e6b60.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c3f0e6b60.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/04/peter-du-moulin-on-avoiding-extreme-views-of-faith-and-assurance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The principal cause of justification is the triune God (2 Cor. 5:19). The internal moving cause is the grace of God (Rom. 3:24). The external cause is the righteousness of Christ (2 Cor. 5:21). The material cause, or that which is imputed to us, is the same righteousness of Christ (Phil. 3:9). The formal cause is the judicial acquittal from punishment and the judicial granting of life (Rom. 8:33). The instrumental cause is faith (Rom. 5:1). The final cause is the glory of God and our salvation (Rom. 3:25).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/leonard-van-rijssen.html">Leonard van Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologia Elencticae Completa. Et didaticae quantum sufficit</cite>, (Edinburgh, 1692), Chapter XIV, trans. J. Wesley White in Mid-American Journal of Theology, 16 (2005), p. 121.</span></figcaption>

</figure><figure class="quote" id="q-d270f66020" data-kw="">
<blockquote><p>But without faith it is impossible to please God.” (Hebrews 11:6)

Our Apostle speaks of faith. By this you are not to understand that historical faith, by which a man takes all to be true, firm and infallible, which God has revealed in His eternal word. A man can have that by a study of Divine truth which has a certain power of demonstration to the conscience, in convincing him that God alone is the Author of such a revelation. The devils themselves believe in this sense and they tremble. Neither are you to understand the faith of miracles; for in the great and universal day shall Christ say unto some, who in His name have cast out devils: “Depart from me, ye workers of iniquity, I know you not.” Neither understand here temporary faith; for that has no root, neither can it withstand the heat of adversity and persecution.

But understand with me that precious saving faith which is God’s priceless gift; whereby the convinced, burdened and heavy-laden sinner goes out of himself and all his own righteousness, unto Jesus, embracing Him and clinging to Him; this is the faith by which the just do live, and receive a share in all the good things of the covenant, whereby we can be saved. Our Apostle says of this saving faith, that without it men cannot please God; this being the doctrine of God’s precious word, that all which is not of faith, is sin; and hence, being displeasing to God, it speaks little comfort to those who rest upon their moral and respectable walk, or upon their profession and knowledge, without ever experiencing the heart-renewing grace of God. What do I say? It points out to them that all they do, since it issues not of faith, but displeases God, yes angers Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), xvii-iii.</span></figcaption>

<blockquote><p>In The Confession of Cyril Lukaris (1629/31), the “Calvinist Patriarch of Constantinople” affirmed justification by faith alone:

We believe that man is justified by faith, not by works. But when we say by faith, we mean the correlative of faith, which is the righteousness of Christ; on which faith, as it were, lays hold, and applies the same unto us for our salvation; which we declare to be for the sustaining, and not for the detriment, of works. And that works are not to be neglected, since they are necessary means for a witness to faith, and for certification of our calling, the truth itself teaches us. But withal they are of themselves in no wise sufficient to give boldness at the tribunal of Christ, and to claim a recompense as by merit of condignity, and to save the possessor; and that this is so human frailty testifies. But the righteousness of Christ applied to such as repent and imputed unto them alone justifies and saves the believer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 160.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

<blockquote><p>For while there remains any remnant of the lust of the flesh, to be kept in check by the rein of continence, God is by no means loved with all one’s soul. For the flesh does not lust without the soul; although it is the flesh which is said to lust, because the soul lusts carnally. In that perfect state the just man shall live absolutely without any sin, since there will be in his members no law warring against the law of his mind, but wholly will he love God, with all his heart, with all his soul, and with all his mind which is the first and chief commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Man’s Perfection in Righteousness: Addressed to Eutropius and Paulus</cite>, (415), 8 in NPNF1, 5: 165.</span></figcaption>

<blockquote><p>In all things submit yourself to be a child of God so that you reproach not His Sonship. He has not adopted you by His wonderful mercy. In all you do be sure to consider and act as one who is aware that God is always with you and by your side. Take heed, then, not only to your external senses but also to your most secret imaginations of thought so that none will possess you with lust or other sinful desires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of God and Spiritual Friendship</cite>, ed. James M. Houston (Basingstoke: Pickering &amp; Inglis, 1983), p. 7.</span></figcaption>

</figure><figure class="quote" id="q-8c735149c1" data-kw="">
<blockquote><p>How can a man have affiance in CHRIST, and rest upon him for salvation, who is not by Faith persuaded, and in some measure assured, that he is his Saviour? How can he hope and wait for the performance of the promises, that doth not believe that they belong unto him? Faith being the substance of things hoped for. How can a man have true peace of conscience, who is not persuaded, that God is reconciled to him? How can a man rejoice in God, who is not assured of Gods favour towards him? How can a man trust in God, that is not persuaded of Gods goodness towards him? How can a man be thankful unto God, who is not persuaded of Gods love and bounty towards him?

How shall they fear God as sons, that is, fearing to offend so merciful a Father, who are not persuaded that he is their Father in CHRIST? or when they have sinned, how shall they be encouraged to return unto him, if they be not persuaded of his fatherly respect to them? how shall they perform voluntary and cheerful obedience, who are not persuaded that their endeavours are accepted of him? How shall they pray, who doe not believe they shall be heard? Or as the Apostle speaketh, how shall they call upon him in whom they have not believed? Rom. 10.14. How shall they patiently and comfortably bear afflictions, who are not persuaded they be fatherly chastisements or trials proceeding from Gods love, and tending to their good? Finally, with what heart can men worship God, who are not persuaded, that their service is accepted of him? …

For the more a man is persuaded of Gods love and favour towards him in CHRIST, (that is, by how much the greater is a mans special Faith) so much the more he loveth God, and his neighbour for God’s sake; so much the more is he inflamed with the zeal of God: so much the more confidently doth he rest upon CHRIST for salvation: so much the more he hopeth for, and expecteth the good things promised: so much the more he rejoiceth, and glorieth in God: so much the more he is thankful to God for his goodness: so much the more he trusteth in GOD, so much the more he feareth to offend so gracious a GOD, and so merciful a Father: or having offended, he will so much the sooner return unto GOD: so much the more patiently and comfortably he beareth afflictions, saying with Job: though he kill me, yet will I put my trust in him: so much the more willingly and cheerfully will he obey and serve the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 79-81.</span></figcaption>

</figure><figure class="quote" id="q-43bc48652a" data-kw="">
<blockquote><p>The most usual word to signify, either the upright is Tham, or Thamim, which commonly is translated perfect, as Gen. 17.1. Deut. 18.13. Ps. 15.2.37.37.119.1. or uprightness, is Thom or thamim, which usually is translated perfection whereby not legal perfection is meant (which is absolute and complete, not only in respect of the parts, but also of degrees) but evangelical, according to the covenant of grace; which is nothing else (the Lord accepting in his children the will for the deed) but integrity or uprightness; and is so expounded Ps. 25.21. Jos. 24.14. Job. 1.1.; 2.3. Ps. 27.7. For very many in the scriptures have this perfection attributed to them, who notwithstanding had their imperfections. as Noah, Gen. 6.9. Job. 1.1.8.2.3. Jacob, Gen. 25.27. &amp;c. of Asa it is said 2. Chro. 15.17. that his heart was perfect all his days: and yet in the next Chapter there are recorded three foul sins, which he committed. 2. Chron. 16.7.10.12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 122-23.</span></figcaption>

<blockquote><p>Therefore, See that ye come unto Jesus Christ by Faith without delay, and Receive him as your only All-sufficient Saviour, that is able to save you to the uttermost; Accepting him upon his own terms of denying your selves, taking up your Cross daily, and following him. So Jesus Christ will be unto you, Wisdom, to guide you in the way to Heaven; Righteousness, to wash away all your Sins by his blood, and justify you freely by his spotless Righteousness imputed unto you; Sanctification, to furnish you sufficiently with all treasures of Grace out of his fullness of Grace; and Redemption, to deliver you from all your bondage under Sin, Satan, the curse of the Law, the Wrath to come, and all your Spiritual Enemies.</p></blockquote>

<blockquote><p>Christ hath merited righteousness for as many as are found in him. In him God findeth us, if we be faithful, for by faith we are incorporated into Christ. Then although in our selves we be altogether sinful, and unrighteous, yet even the man which is impious in him self, full of iniquity, full of sin, him being found in Christ through faith, and having his sin remitted through repentance: him God upholdeth with a gracious eye; putteth away his sin by not imputing; taketh quite away the punishment due thereunto, by pardoning it; and accepteth him in Jesus Christ, as perfectly righteous, as if he had fulfilled all that was commanded him in the law: shall I say more perfectly righteous, then if him self had fulfilled the whole law?</p></blockquote>

</figure><figure class="quote" id="q-08d7fc83ec" data-kw="">
<blockquote><p>Evan. Surely, neighbour Nomologista, you do not truly know yourself, for I am confident, that any man who truly knows himself, sees such secret corruptions of heart in every duty he performs, as causes him unfeignedly to confess, that whatever good action he does, it is but a polluted stream of a more corrupt fountain. And whatsoever you or any man else do conceive of yourselves, it is most certain, that whatsoever sin is forbidden in the word, or has been practised in the world, that sin every man carries in his bosom, for all have equally sinned in Adam, and therefore original lust is equally in all.

Nom. Sir, I can hardly be persuaded to this.

Evan. Well, neighbour Nomologista, I cannot so well tell how it is with you, but for mine own part, I tell you truly, I find my knowledge corrupted and defiled with ignorance and blindness, and my faith corrupted and defiled with doubting and distrust, and my love to God very much corrupted and defiled with sinful self-love and love to the world; and my joy in God much corrupted and defiled with carnal joy; and my godly sorrow very much corrupted and defiled with worldly sorrow.

And I find my prayers, my hearing, my reading, my receiving the sacrament, and such like duties, very much corrupted and defiled with dullness, drowsiness, sleepiness, wandering, and worldly thoughts, and the like.

And I find my sanctifying of the Lord’s name very much corrupted and defiled, by thinking and speaking lightly and irreverently of his titles; and by thinking, if not by speaking, grudgingly against some acts of his providence.

And I find my sanctifying of the Lord’s day very much corrupted and defiled, by sleeping too long in the morning, and by worldly thoughts and words, if not by worldly works.

And I find that all the duties that I have performed, either towards my superiors or inferiors, have been corrupted and defiled, either with too much indulgence, or with too much severity, or with base fears, or base hopes, or some self-end and by-respect.

And I find that all my duties that I have performed, either for the preservation of mine own or other’s life, chastity, goods, or good name, have been very much corrupted and defiled, either with a desire of mine own praise, own profit here, or to escape hell, and to obtain heaven hereafter; so that I see no good action which I have ever done free from having some corruption mixed with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 444.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-fd789b1404" data-kw="">
<blockquote><p>Good works are necessary to the salvation of the justified by a necessity of order, not of causality; or more plainly, as the way appointed to eternal life, not as the meritorious cause of eternal life.</p></blockquote>

<blockquote><p>And the passion of Christ had his effect and power from everlasting. For Christ yesterday and to day, for ever and the same world without end. Hebr. 13.8. And Paul to the Romans 4. defineth justification by David: Blessed are they whose iniquities are forgiven. Therefore in the time of David, before Christ had suffered, sins were forgiven by confidence and trust in that sacrifice of Christ to come.</p></blockquote>

</figure><figure class="quote" id="q-893b1e5973" data-kw="">
<blockquote><p>The chief function of Christ’s obedience to the moral law is, to earn a title for the believer to the rewards of heaven. This part of Christ’s agency is necessary; because, merely to atone for past transgression would not be a complete salvation. It would, indeed, save man from hell, but it would not introduce him to heaven. He would be delivered from the law’s punishment, but would not be entitled to the law’s reward. “The man which doeth the things of the law shall live by them,” Rom. 10:5. Mere innocence is not entitled to a reward. Obedience is requisite in order to this. Adam was not meritorious until the had obeyed the commandment, “Do this.” Before he could “enter into life,” he must “keep the commandment,” like every subject of the divine government and candidate for heavenly reward. The Mediator, therefore, must not only suffer for man, but must obey for him, if he would do for man everything that the law requires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 2: 432.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<blockquote><p>But is it not really selfish to pay so much attention to personal assurance? There are some well-meaning Christians who, in spite of themselves, are inclined to think that the charge is true, and are therefore rather hesitant to speak about this assurance. But the objection is really absurd. The underlying assumption would seem to be that all attention to self with a view to its welfare, is selfish. It is a patent fact, however, that the Modernist himself does not believe that, for then he would also have to consider eating and drinking, hygienic measures, physical exercise, the cultivation of moral purity, etc., as thoroughly selfish, and yet these are the very things that are stressed by the social gospel. It is certainly no more selfish to cultivate spiritual, than it is to promote physical well-being. …

But seeking personal assurance is not in itself an evidence of selfishness. We may be seeking our spiritual well-being in this respect, in order that we may be more able to help others, to promote the cause of God, to reveal the glory of his grace, and to magnify Him for the riches of the inheritance which He has prepared for us.</p></blockquote>

<blockquote><p>Is Christ altogether lovely; so lovely to us, and so beloved of God the Father? Let us then upon his obedience and righteousness; build upon it, that God cannot refuse that righteousness whose whole subject is altogether lovely. Let us come clothed in the garments of our Elder Brother, and then doubt not of acceptance; for it is in Christ that he loves us. In this well-beloved Son it is that God is well pleased with us. If we put on Christ’s righteousness, we put on God’s righteousness; and then how can God hate us? No more than he hates his own Son. Nay, he loves us, and that with the same love wherewith he loves him; for he loves whole Christ mystical, Head and members (John 17:23). Let this strengthen our faith, that if Christ be so altogether lovely in himself and to the Father, then we may comfortably come before the Father, clothed with the garments of him our Elder Brother, and so rest ourselves on the acceptation of his mediation, that is so beloved a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), p. 293.</span></figcaption>

<blockquote><p>12. Finally, The inexpressible importance of spiritual comfort, appears chiefly in this, that it promoteth, in an eminent degree, universal holiness of heart and life.

It revives and invigorates the graces of the Christian. It excites and encourages a holy man, to trust cordially and constantly in Christ, for sanctification; to love Him, and God in him, with ardent affection; and so to love his manifested glory, as to perform every duty, in faith, from love, and for the glory of his holy name. He cannot love God supremely, nor delight in doing his will unless he himself be delighted and cheered, by trusting that God loveth him. No arguments will persuade a man, to commit his way to the Lord, or to cast his care upon him; if he do not believe, that the Lord careth for him. It is a sense of redeeming love, warm on the heart, that captivates the soul, conciliates the will, and engages the affections.

A comfortable persuasion of the love of Jesus to the soul, will be operative in it, as a torch in a sheaf: it will gradually destroy its remaining enmity against him. It will enlarge the heart with ardent love to him, and elevate the affections above the world. The soul, in order to be kept from lusting after earthly and carnal pleasures, must, by an appropriating faith, take pleasure in the Saviour, and in his love. Holy comfort imbitters sin to a man, and disposes him, with deep abhorrence of it, to strive against it. It tends greatly to melt, and to humble the heart for sin. The firmer a holy man’s comfort is, the softer his heart is. The more “his heart is fixed, trusting in the Lord, so as not to be afraid of evil tidings;” the more disposed he is, to fear the evil of sinning against him.

Spiritual comfort also, inclines and encourages the saints, ardently to follow after universal holiness of life, and constantly to long for the perfection of it. “The Spirit of the Lord God,” saith Messiah, “is upon me, because the Lord hath anointed me, … to comfort all that mourn; to appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called Trees of righteousness, The planting of the Lord, that he might be glorified.” It disposes believers, to frequency and impartiality in self-examination; and excites them, to diligent endeavours after increasing communion with God, in every duty. It is employed by the Holy Spirit, to render them active, resolute, and cheerful, in the spiritual performance of all their various duties. Godly sorrow, indeed, disposes them to be serious; but it is holy joy, that renders them active: it is “the oil of gladness,” that makes the wheels of their voluntary obedience, move forward with ease and speed. Some measure of holy comfort is necessary to the practice of evangelical holiness. Summer, in the natural world, is necessary as well as winter.

The very nature of the duties and exercises of the true Christian, is such, that they require comfort of heart, for the acceptable performance of them. A holy life commonly begins with comfort, and is maintained by it. The way to be kept from carelessness and formality, in spiritual exercises, is, so to trust in Christ for salvation, as to cease to despond; for the soul grows careless by desponding. The sorrow of the world, and the fear of hell, enervate and benumb all the faculties of the soul. A man can perform no spiritual obedience, without some degree of spiritual joy, as well as of true love. The former, is as much the fruit of the Spirit, as the latter.

The Christian cannot be encouraged to pray to God; except he be consoled with the hope, that God, for Christ’s sake, will graciously hear and answer his prayer. He cannot cordially praise God; unless he be enabled to trust, that God will glorify the perfections of his nature, and magnify the promises of his covenant, in his eternal salvation. It is in proportion as his heart is comforted, that he will be truly thankful to the Lord, for the smallest favour. It is holy consolation, that makes every act of grace, every instance of duty, every part of spiritual service, how secret soever it be, pleasant to a good man. In a word, it is this, that so exhilarates, and so constrains him, as to make all his affection run out to the Lord Jesus, and all his strength run out for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 67-70.</span></figcaption>

+fruit+of+the+Spirit%2C+as+the+latter.%0A%0AThe+Christian+cannot+be+encouraged+to+pray+to+God%3B+except+he+be+consoled+with+the+hope%2C+that+God%2C+for+Christ%E2%80%99s+sake%2C+will+graciously+hear+and+answer+his+prayer.+He+cannot+cordially+praise+God%3B+unless+he+be+enabled+to+trust%2C+that+God+will+glorify+the+perfections+of+his+nature%2C+and+magnify+the+promises+of+his+covenant%2C+in+his+eternal+salvation.+It+is+in+proportion+as+his+heart+is+comforted%2C+that+he+will+be+truly+thankful+to+the+Lord%2C+for+the+smallest+favour.+It+is+holy+consolation%2C+that+makes+every+act+of+grace%2C+every+instance+of+duty%2C+every+part+of+spiritual+service%2C+how+secret+soever+it+be%2C+pleasant+to+a+good+man.+In+a+word%2C+it+is+this%2C+that+so+exhilarates%2C+and+so+constrains+him%2C+as+to+make+all+his+affection+run+out+to+the+Lord+Jesus%2C+and+all+his+strength+run+out+for+him.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+of+Spiritual+Comfort%2C+%282nd+edn%2C+Edinburgh%2C+1814%29%2C+pp+67-70.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a731b8a94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a731b8a94.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/04/john-colquhoun-on-spiritual-comfort-and-holiness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7a0773e451" data-kw="">
<blockquote><p>For such is the loving-kindness of God; He never turns his face away from a sincere repentance … And after this again, Manasses, having exceeded all in fury and tyranny, and having subverted the legal form of worship, and shut up the temple, and caused the deceit of idolatry to flourish, and having become more ungodly than all who were before him, when he afterwards repented, was ranked amongst the friends of God. Now if, looking to the magnitude of his own iniquities, he had despaired of restoration and repentance, he would have missed all which he afterwards obtained: but as it was, looking to the boundlessness of God’s tender mercy instead of the enormity of his transgressions, and having broken in sunder the bonds of the devil, he rose up and contended with him, and finished the good course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exhortation to Theodore after his fall</cite>, (c. 400), 1.6 in Nicene and Post-Nicene Fathers 1, 9: 95.</span></figcaption>

</figure><figure class="quote" id="q-0d50243949" data-kw="">
<blockquote><p>But some will say to work righteousness cannot be a work of faith, for the very heathen, which never heard of Christ, by the light of nature have done justice, and are highly commended by heathen writers for the same. Now, that which the heathen can do by the light of nature, is not thus to be extolled as a fruit of faith?

Answer. True it is, the heathen have done many works of justice. But we must wisely consider that every just work is not a fruit of faith, unless it be done by a righteous person in obedience to God and for His glory. But in all these, the heathen failed in their works. For, though the thing they did were good in themselves; yet, seeing the heathen were corrupt trees, remaining in the sinful state of corrupt nature, their works must needs be corrupt fruit, as coming from them. For an evil tree cannot bring forth good fruit.

The heart is the fountain of every action. Now their hearts were corrupt, being destitute of faith which purifies the heart. And therefore their works must needs be sinful. Again, they did not their works in obedience, for they were guided only by the light of nature, and knew not God aright, nor His commandments. And lastly, they propounded not the glory of God, as the end of their works, but the praise of men, their own profit, or some such end. But these worthy persons do not only such things as were just in themselves, but they do them in faith, in obedience, and for God’s glory, and so please God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 353.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-6700a17bc9" data-kw="">
<blockquote><p>What spirit shall we think they have, that will unchurch churches, because they have some defilement and unbrotherly brethren, accounting them no churches, no brethren, because they have some imperfections? Why hath not Christ a quarrel to the church then? is he blind? doth his love make him blind? No; he seeth corruption, but he seeth better things; somewhat of his own, that makes him overlook those imperfections, because they are such as he means to mortify, subdue, wear away, and to fire out by the power of his Spirit, which as fire shall waste all those corruptions in time. So it is with the church. Put the case, she hath some corruptions: that it be not with her as it should be, yet she is a church notwithstanding. The church of Corinth, we see, Paul styles them saints and brethren, with all those sweet names (1 Cor. 1:1, 2), notwithstanding they had many corruptions among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), pp 149-50.</span></figcaption>

</figure><figure class="quote" id="q-7e8c04575b" data-kw="">
<blockquote><p>Now from all this I would enforce this duty upon your consciences, to search the Scriptures if you think to have eternal life; search them if ye would know Christ, whom to know is life eternal; then again search them, for these are they that testify of him. Searching imports diligence,—much diligence,— ’tis a serious work; it is not a common seeking of an easy and common thing, but a search and scrutiny for some hidden thing, for some special thing.

It is not bare reading of the Scriptures that will answer this duty, except it be diligent and daily reading; and it is not that alone, except the spirit within meditate on them, and by meditation accomplish a diligent search. There is some hidden secret that you must search for that is enclosed within the covering of words and sentences. There is a mystery of wisdom that you must apply your hearts to search out, Eccl. 7.25. Jesus Christ is the treasure that is hid in this field. O a precious treasure of eternal life! …

If you would profit by the Scriptures, you must bring both your understanding and your affections to them, and depart not till they both return full. If you bring your understanding to seek the truth, you may find truth, but not truly; you may find it, but you are not found of it. You may lead truth captive, and enclose it in a prison of your mind, and encompass it about with a guard of corrupt affections, that it shall have no issue, no outgoing to the rest of your souls and ways, and no influence on them. You may know the truth, but you are not known of it, nor brought into captivity to the obedience of it.

The treasure that is hid in the Scriptures is Jesus Christ, whose entire and perfect name is, Way, Truth, and Life. He is a living truth and true life; therefore Christ is the adequate object of the soul, commensurable to all its faculties. He has truth in him to satisfy the mind; and has life and goodness in him to satiate the heart; therefore if thou wouldest find Jesus Christ, bring thy whole soul to seek him, as Paul expresseth it. He is true and faithful, and worthy of all acceptation, then bring thy judgment to find the light of truth, and thy affections to embrace the life of goodness that is in him.

Now, as much as ye find of him, so much have ye profited in the Scriptures. If you find commands there which you cannot obey, search again, and you may find strength under that command. Dig a little deeper, and you shall find Jesus the end of an impossible command. And when you have found him, you have found life and strength to obey, and you have found a propitiation and sacrifice for transgressing and not obeying. If you find curses in it, search again, and you shall find Jesus Christ under that, “made a curse for us”; you shall find him ‘the end of the law for righteousness to every one that believes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 50-51.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now from all this I would enforce this duty upon your consciences, to search the Scriptures if you think to have eternal life; search them if ye would know Christ, whom to know is life eternal; then again search them, for these are they that testify of him. Searching imports diligence,—much diligence,— ’tis a serious work; it is not a common seeking of an easy and common thing, but a search and scrutiny for some hidden thing, for some special thing.

It is not bare reading of the Scriptures that will answer this duty, except it be diligent and daily reading; and it is not that alone, except the spirit within meditate on them, and by meditation accomplish a diligent search. There is some hidden secret that you must search for that is enclosed within the covering of words and sentences. There is a mystery of wisdom that you must apply your hearts to search out, Eccl. 7.25. Jesus Christ is the treasure that is hid in this field. O a precious treasure of eternal life! …

If you would profit by the Scriptures, you must bring both your understanding and your affections to them, and depart not till they both return full. If you bring your understanding to seek the truth, you may find truth, but not truly; you may find it, but you are not found of it. You may lead truth captive, and enclose it in a prison of your mind, and encompass it about with a guard of corrupt affections, that it shall have no issue, no outgoing to the rest of your souls and ways, and no influence on them. You may know the truth, but you are not known of it, nor brought into captivity to the obedience of it.

The treasure that is hid in the Scriptures is Jesus Christ, whose entire and perfect name is, Way, Truth, and Life. He is a living truth and true life; therefore Christ is the adequate object of the soul, commensurable to all its faculties. He has truth in him to satisfy the mind; and has life and goodness in him to satiate the heart; therefore if thou wouldest find Jesus Christ, bring thy whole soul to seek him, as Paul expresseth it. He is true and faithful, and worthy of all acceptation, then bring thy judgment to find the light of truth, and thy affections to embrace the life of goodness that is in him.

Now, as much as ye find of him, so much have ye profited in the Scriptures. If you find commands there which you cannot obey, search again, and you may find strength under that command. Dig a little deeper, and you shall find Jesus the end of an impossible command. And when you have found him, you have found life and strength to obey, and you have found a propitiation and sacrifice for transgressing and not obeying. If you find curses in it, search again, and you shall find Jesus Christ under that, “made a curse for us”; you shall find him ‘the end of the law for righteousness to every one that believes.”

— Hugh Binning, The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 50-51.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+from+all+this+I+would+enforce+this+duty+upon+your+consciences%2C+to+search+the+Scriptures+if+you+think+to+have+eternal+life%3B+search+them+if+ye+would+know+Christ%2C+whom+to+know+is+life+eternal%3B+then+again+search+them%2C+for+these+are+they+that+testify+of+him.+Searching+imports+diligence%2C%E2%80%94much+diligence%2C%E2%80%94+%E2%80%99tis+a+serious+work%3B+it+is+not+a+common+seeking+of+an+easy+and+common+thing%2C+but+a+search+and+scrutiny+for+some+hidden+thing%2C+for+some+special+thing.%0A%0AIt+is+not+bare+reading+of+the+Scriptures+that+will+answer+this+duty%2C+except+it+be+diligent+and+daily+reading%3B+and+it+is+not+that+alone%2C+except+the+spirit+within+meditate+on+them%2C+and+by+meditation+accomplish+a+diligent+search.+There+is+some+hidden+secret+that+you+must+search+for+that+is+enclosed+within+the+covering+of+words+and+sentences.+There+is+a+mystery+of+wisdom+that+you+must+apply+your+hearts+to+search+out%2C+Eccl.+7.25.+Jesus+Christ+is+the+treasure+that+is+hid+in+this+field.+O+a+precious+treasure+of+eternal+life%21+%E2%80%A6%0A%0AIf+you+would+profit+by+the+Scriptures%2C+you+must+bring+both+your+understanding+and+your+affections+to+them%2C+and+depart+not+till+they+both+return+full.+If+you+bring+your+understanding+to+seek+the+truth%2C+you+may+find+truth%2C+but+not+truly%3B+you+may+find+it%2C+but+you+are+not+found+of+it.+You+may+lead+truth+captive%2C+and+enclose+it+in+a+prison+of+your+mind%2C+and+encompass+it+about+with+a+guard+of+corrupt+affections%2C+that+it+shall+have+no+issue%2C+no+outgoing+to+the+rest+of+your+souls+and+ways%2C+and+no+influence+on+them.+You+may+know+the+truth%2C+but+you+are+not+known+of+it%2C+nor+brought+into+captivity+to+the+ob anter</a></div>

<blockquote><p>Lastly he [Paul] exhorteth those that are reconciled, and thus endowed with his spirit, to bring forth works, worthy of those that repent to the end, that the glory of their king may shine in them. Rom. 8. ver. 29, 30. These degrees, in the administration of the kingdom of Christ, and of his new covenant, the Lord comprehendeth in that same speech to Paul, when he saith, that thou mayst open their eyes: that is done, when through the working of that king Christ, their conscience is illuminated through the holy Ghost. (For it is he that maketh his ministry effectual) so as they know both themselves and their sins, and again God, his holiness and righteousness, to which they must be conformable, that through faith turning unto him, they may receive in Christ a double benefit, forgiveness of their sins, &amp; a lot amongst the sanctified, who daily study (Christ exhorting them) to bring forth the worthy fruits of repentance. For whom he hath chosen, those also hath he called: whom he hath justified, those also he hath glorified.

First therefore let us see how Christ our king by calling into his kingdom, doth engender in men a desire of being reconciled to God; then how he offereth unto them the forgiveness of their sins, or rather the free grace of reconciliation and justification, and therewithal how he beginneth, their restoring to everlasting life and glory: how daily he setteth it forward, and at length in the world to come doth fully finish the same.</p></blockquote>

<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of the Atonement</cite>, (Columbia SC: Samuel Weir, 1845), pp 11, 28.</span></figcaption>

<blockquote><p>Here we see the cause why Christ called Judas a Devil: for he said. Have I not chosen you twelve, and one of you is a devil. He became to be a devil and a traitor by nourishing a wicked and a covetous heart. And here we are taught that the ministers of the word, if they make no conscience of sin, by the just judgement of God do prove devils incarnate: this example of Judas doth manifest the same: and the reason is plain, for the more knowledge a man hath, the more wicked he is if he want grace. They are like in this case unto a man that hath meat and drink enough, but no stomach to digest meat: whereby the more he eateth, the more it turneth to his hurt.

This I speak not to deface the callings of ministers; but that those which preach God’s word, should not do it with impenitent hearts, living in their own sins. For it is a fearful thing for a man to speak unto the people of the pardon of their sin, and yet himself not to apprehend the same by faith. A lump of wax if you keep it from heat, or from the fire it keeps his own form still, but if it be held to the fire, it melts and runs abroad: so ministers who by reason of their callings come near God, if they be lumps of iniquity and live in their sins, they shall find that the corruptions of their hearts will melt abroad as wax at the fire. And therefore every one that is designed to this calling, must first purge himself of his own sins, or else God’s judgements shall fall upon him, as they did on Judas that betrayed Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 307.</span></figcaption>

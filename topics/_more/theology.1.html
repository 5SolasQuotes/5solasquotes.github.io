<figure class="quote" id="q-e52cd4ef98" data-kw="">
<blockquote><p>Even though the natural knowledge of God is not salvific, it nevertheless serves a purpose and is useful for the following reasons:

(1) It teaches that God exists; that He is an invisible, spiritual Being; is infinite; is the first cause of all things; in His Being is infinitely exalted above all that exists; and is holy, omnipotent, good and just.

(2) It teaches that God is the cause of all things (also of him who meditates about God), and thus is sovereign Lord over all. It teaches that by His influence He upholds, governs, and directs all things according to His will, so that no one can stay His hand or say, “What doest Thou?”

(3) It teaches that every human being is obligated to Him with an irrevocable obligation to do His will as expressed in His law, which is revealed to him by virtue of the light of nature.

(4) By this man can view his sin and guilt against the background of God’s justice.

(5) It promotes the maintenance of human society.</p></blockquote>

<blockquote><p>115. But man is capable of knowing God from such creatures in three ways, as Denis [Pseudo-Dionysius] says in The Divine Names.

He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists.

Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things.

Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Romanos lectura</cite>, (c. 1259-65), C. 1, L. 6, 115.</span></figcaption>

</figure><figure class="quote" id="q-d9e023300a" data-kw="">
<blockquote><p>Archetypal Theology is not simply to be described as God’s Knowledge concerning Himself; but, if we wish to consider the Infinite Theology of God as a τύπον/type and πρωτότυπον/prototypical exemplar, according to which our Theology ought to be formed, it is to be added, which He decreed to manifest to the creature. And thus the Theology of the Creatures shall be a true Ectype, or the Image of the Archetype expressed in Creatures. It does not appear that this distinction is controverted very much:

1. for it is evident that God knows Himself most completely, and so no one is a more perfect θεολόγον/theologian, Matthew 11:27, neither in this particular is the Holy Spirit inferior to the Father or the Son, 1 Corinthians 2:10, 11.

2. It is no less certain that God has decreed to communicate some knowledge of Himself with Creatures, 1 Corinthians 2:7.

3. Neither will any of our Theology be able to be described as true, which does not correspond to that Knowledge of God concerning Himself and divine things, which Knowledge He decreed to be manifested to us in one way or another.

4. If the Knowledge of God also has regard to the Image of God, should not that Knowledge be called Ectypal, of which that Knowledge of God in God shall be the archetypal exemplar? yes, indeed, Colossians 3:10, ἐνδυσάμενοι τὸν νέον (ἄνθρωπον), τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ᾽ εἰκόνα τοῦ κτίσαντος αὐτόν, having put on the new (man), which is renewed in knowledge after the image of Him that created him.

5. The Sacred Scripture is said to deliver to us τύπον διδαχῆς, the form/type of doctrine, Romans 6:17, ὑποτύπωσιν ὑγιαινόντων λόγων, the pattern/prototype of sound words, 2 Timothy 1:13; but this is that knowledge of divine things revealed to us by the decree of God, in accordance with which our subjective Theology ought to be formed: so that to this extent this division of Theology also agrees quite well with the expression of Scripture.

6. Finally, this distinction shall be useful for this, that a Theologian might piously learn how to engage in the meditation of divine things, and thus from God to have an understanding in those things which have regard unto God, so that in his knowledge of God he might not deviate from that which of God and by God has been revealed to the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 7, pp 86-87.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology.html">Theology</a></span></div>

</figure><figure class="quote" id="q-86e4f186ed" data-kw="">
<blockquote><p>Hence, just as the most frequently used writings of the Old Testament in the Church are the Psalms of David, who obtained pardon after his sin, so the most frequently used writings of the New Testament are the epistles of Paul, who obtained mercy, so that by these examples sinners might be aroused to hope; although another reason for this custom could be that in each of these writings is contained almost the whole teaching of theology.</p></blockquote>

</figure><figure class="quote" id="q-acf9ebd0ea" data-kw="">
<blockquote><p>After a lapse of the dark ages, during which all active speculation slumbered, the great Thomas Aquinas, an Italian by birth, A.D. 1224, and a monk of the order of St. Dominic, Doctor Angelicus, advocated with consummate ability the Augustinian system of theology in that cumbrous and artificial manner which characterized the Schoolmen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York, 1879), p. 99.</span></figcaption>

</figure><figure class="quote" id="q-ffaf375a4b" data-kw="">
<blockquote><p>The Most Illustrious COCCEIUS, in ad ultimum Mosis, § 74, says these words, “It comes here to be wondered at, even a new pestilence sprouting at this time, of those that induce the soul to doubt, whether they themselves be, see, hear, etc. Wretched mortals, who reason against their own sense, doubting themselves to be, and daring to profess themselves to be infidels and ἀθέους/atheists, at least while they are willing to doubt; thereon they are going to apply themselves to this, that they might question all things, with respect to which they are able to delay their confidence (which the Scripture calls reasonings and murmurings), and remove from themselves the knowledge of God and His ways.” Add what things are found in his Summa Theologiæ, chapter VIII, § 25, opera, tome 7, page 160.</p></blockquote>

<blockquote><p>[T]he world will not come to an end until the number of the elect is complete, which completion is as it were the fulfilment of the whole of divine predestination; wherefore it is not fitting that the end of the world should be revealed except to him who has received the revelation of the whole of divine predestination, that is to Christ as man, through whom the whole predestination of the human race is in a manner fulfilled.</p></blockquote>

</figure><figure class="quote" id="q-f791fe3c1c" data-kw="">
<blockquote><p>Indeed there is what is called natural religion. There are many truths concerning God, and our duty to him, which are evident by the light of nature. But christian divinity, properly so called, is not evident by the light of nature; it depends on revelation. Such are our circumstances now in our fallen state, that nothing which it is needful for us to know concerning God, is manifest by the light of nature, in the manner in which it is necessary for us to know.

For the knowledge of no truth in divinity is of significance to us, any otherwise than as it some way or other belongs to the gospel-scheme, or as it relates to a Mediator. But the light of nature teaches us no truth in this matter. Therefore it cannot be said, that we come to the knowledge of any part of christian truth by the light of nature. It is only the word of God, contained in the Old and New Testament, which teaches us christian divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Knowledge in Jonathan Edwards on Knowing Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-e58e6da878" data-kw="">
<blockquote><p>The subject itself as well as the agreement of all the nations demonstrates that theology exists. The subject shows it, for it is both true that God exists and that He is the principle of every good thing in the universe; and God both speaks and acts. The agreement of all nations shows it, for all by the light of nature acknowledge that theology exists.</p></blockquote>

</figure><figure class="quote" id="q-5bb259085f" data-kw="">
<blockquote><p>And as Christ is the priest, as he is also the victim and the price of our reconciliation. He offered himself on the altar of the cross not to the devil, but to the triune God, and he did so for all with regard to the sufficiency of the price, but only for the elect with regard to the efficacy, because he brought about salvation only for the predestined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sentences</cite>, trans. Giulio Silano (1150; 4 vols, Toronto, 2007), III, d. 20, c. 5, a. 1.</span></figcaption>

</figure><figure class="quote" id="q-7c4b110a5c" data-kw="">
<blockquote><p>But Theology properly so called, is either Original or derived. Original, is that knowledge whereby God knows himself, which really differs not from God’s essence. Derived, is a certain image or representation of that Original primarily in Christ our mediator, secondarily in Christ’s members. Now whereas a part of Christ’s members is triumphant in heaven, another part militant here on earth; that Theologie of the triumphant part is called the Theologie of the blessed saints; that of the militant is styled the Theology of Travellers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 2.</span></figcaption>

</figure><figure class="quote" id="q-4f63c5d071" data-kw="">
<blockquote><p>So the apostle in these two verses is shewing what that knowledge of God was which the Heathens had, and how they came by it. God’s eternal power and Godhead, which are in themselves invisible, was a thing the knowledge whereof was attainable by the light of nature. They had common principles of knowledge given them of God, whereby, looking upon the works of creation, they might safely and solidly gather, what a God he was and what was his due; so that they were rendered inexcusable in abusing this light; and their mouths were stopped, so that they had nothing to say for themselves, why they lived in ungodliness and unrighteousness. …

However the Lord Jehovah be it himself unsearchable, yet hath he left at much light in folks, that were they desirous, by the very principles of natural knowledge, they might see as much of God as might convince them that he only is to be worshipped, loved, and feared for it pleased the Lord that as much as might be sufficient for this end, should remain attainable by sand-blind nature; that is it that might be known.</p></blockquote>

ormed Covenanter</a></div>

<blockquote><p>While Thomas Aquinas strongly resisted the blasphemous notion that God had the power to do things contrary to his nature (such as sin and lie), he did not adhere to the other erroneous view that divine omnipotence was restricted to what God actually does:

[I]f we consider his power absolutely, he can do other things besides those that are subject to his providence or operation: but he cannot do what has been eternally contained in the order to his providence, because he is unchangeable. Through failing to observe this distinction some have fallen into various errors. Some in an endeavour to extend to things themselves the unchangeableness of the divine order, said that all things must of necessity be as they are; so much so, that some declared that God is unable to do except what he does. Against this we have the words Matth. 26:53: Cannot I ask my Father, and he will give me presently more than twelve legions of angels?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.98.</span></figcaption>

</figure><figure class="quote" id="q-d82d41e871" data-kw="">
<blockquote><p>Wisdom is an architectonic system commanding and directing all others. Now this is most peculiar to theology, which is so far the arbiter and mistress of all sciences that it judges of them and cannot itself by judged by another. For all other systems must be referred to it as a standard, and whatever does not agree with theology must be rejected from them. So although it does not prescribe to other systems principles and objects, yet it so far rules over them (because it establishes their limits) that they neither dare hold to any object opposed to theology, nor to use their principles against it. And also with respect to the ultimate end (viz., the glory of God) which although they do not immediately attain, yet they are bound to have such a direction. […]

If theology takes some things from other systems, it is not as an inferior from superiors, but as a superior from inferiors (as a mistress freely using her handmaids). Theology does not so much take from others, as presupposes certain previously known things upon which it builds revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 20.</span></figcaption>

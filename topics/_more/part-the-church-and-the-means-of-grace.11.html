</figure><figure class="quote" id="q-1bdd639fb1" data-kw="">
<blockquote><p>Although the Reformed Presbyterian Synod was initially cautiously supportive of what it saw as the good aspects of the 1859 Revival in Ulster, it seems fairly clear that by 1861 they had come to realise that the movement was deeply pernicious (we would have preferred it had they agreed with the PCI’s Isaac Nelson and William Hamilton and completely condemned the movement, but this is still a very strong statement against the fanaticism which manifested itself during the Year of delusion). Here is what the Irish Synod wrote to their American brethren:

The great religious excitement, or, as it has been called, “Revival,” which took place here during the Summer of 1859, was so conducted that we could take very little part therein. As a similar movement took place in your own country a short time previous, it is not necessary that we should now refer particularly to it. Though the whole religious community in the North of Ireland was for a time greatly agitated, our people for the most part kept entirely aloof from those scenes of dangerous and irrational excitement everywhere prevailing.

And now that matters have assumed very much of their wonted aspect, we have no doubt but the “Revival” was overruled by God for the quickening of many of His dear saints, and we hope also leading to the conversion of not a few souls to Christ: but the almost utter annihilation of the distinction between truth and error; the contempt cast upon the instituted ordinances of grace; the substitution of mere excitement and feeling for knowledge and genuine experimental religion; the enthusiasm and presumption engendered in self-styled “converts” and self-constituted preachers; the perversion and corruption of the worship of God, have produced effects which it will require a considerable length of time to counteract and remedy.

But whilst we thus easily discover and point out the evils connected with such “Revivals,” how much more important it is for us to endeavour to obtain a real revival of true religion among ourselves! A revival of religion in our own souls, in our families, in our congregations, and in our churches. Do we not need it? Let us, therefore, strive together in prayer for a more copious effusion of the Holy Spirit, that all sin, self-seeking, pride, formality, hypocrisy, and worldly-mindedness may be put away from us, and that we may be made more holy, more spiritually-minded, more zealous for the Divine glory, and more devoted to His service – that our churches may be more vital, active, and godly, “strengthening the things that remain, that are ready to die.” Let our mutual aim be, that by holy living we may recommend the truth unto others, causing our lights so to shine before men, that others seeing our good works may be led to glorify our Father in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Hart and William McCarroll to American Synod, 18 April 1861’ in Covenanter</cite>, v, no. 8 (Aug. 1861), pp 214-15.</span></figcaption>

<blockquote><p>Our Covenanting forefathers were eminently honoured to contend for the crown-rights of the Redeemer. In their national vows, they plighted the allegiance of the nation to Him – and by those federal deeds, rulers and people were taken bound to consult for the promotion of Christ’s honour, and the interests of true religion, above any worldly interests. The laws passed in the reforming period in Britain were the embodiment of the grand fundamental principles of the Redeemer’s kingdom; and for a brief period, like a gleam of bright sunshine in the history of the nation, the doctrine was generally proclaimed, and widely respected, that Christ Jesus should reign supreme in his own house, and among his people, and that earthly rulers should yield Him all homage and subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 335.</span></figcaption>

<blockquote><p>Writing on behalf of American Synod to the moderator of the remnant of Old Light Reformed Presbyterians in Scotland, Samuel O. Wylie argued that those in the Scottish Synod who had voted for the removal of ecclesiastical censure from those who voted in British elections had defecting from the covenanting position and were guilty of schism:

[…] It is well known to us that for several years past, you have been enduring a great fight of affliction. The conflicts in opinion and judgment that have marked the meetings of your supreme Judicatory, for some time past, have not been unnoticed by us, not have we failed to observe in the published speeches and arguments of many of your ministers and members evidence of a radical and growing dereliction from a Covenanted faith and practice. We have watched with absorbed and painful interest the progress of events among you, and from the first dreaded the result.

The deliverance of your late Synod touching the Overture, and the political relations of its members and the people under its jurisdiction, though anticipated by us, has filled our hearts with unaffected sorrow. We mourn for the division in our Covenanted Zion, and we mourn, most of all, for the falling away of the Covenanted witnesses, and the dishonour done thereby to truth, and to the memory of a faithful and venerated ancestry. The defection scarcely perceptible in its incipient stages, in the progress of a natural development open and manifest of late to all, has culminated in actual schism, and in avowed departure from the distinctive article and feature in the faith and practice of the Reformed Presbyterian Church. Another dark page in Scotland’s history has been written.</p></blockquote>

<blockquote><p>Although it has been sadly forgotten in recent times, the Covenanter position is that those who dissent from the doctrine and order of the Reformed Presbyterian Church cannot be accepted into communicant membership or admitted to the Lord’s Table. Alexander McLeod explains the rationale for this below:

174. How many kinds of censurable offences are there?

The scandalous offences are of three kinds:- heresy, which consists in maintaining errors contrary to the subordinate standards of the Church, and to the holy scriptures [Rom. 16:17] – Immorality [1 Cor. 5:11] and contempt of Church-order, which consists in untenderness to brethren, neglect of ordinances, disrespect to the ministry, and resistance to the authority of the Church [2 Thess. 3:6].</p></blockquote>

<blockquote><p>We must carefully remember this, for there are two extremes to which men are subject. Either they will fall into superstition or they will be irreverent and pay no attention to the worship of God. There are many today who think that baptism and the Lord’s Supper are nothing, and that they could easily bypass them, as though they were angels. […] While recognising the first extreme, let us be careful on the other hand not to fall into superstition, which we are too included to do by nature. We see how those who want to be devout always go too far: some have, for instance, attached the salvation of men to baptism, and have thought that the blood of Christ was now nothing, so to speak. They say that without the water of baptism, nothing happens, and have even added charism, spittle, and all these empty rites. By their foolish fantasies, men have invented this and that in order to avoid the firm and solid determination to hold to the will of God declared to us in his Word.</p></blockquote>

</figure><figure class="quote" id="q-eaf4794a01" data-kw="">
<blockquote><p>Although many today think that you can be Reformed while rejecting theocratic politics, the reality is that most modern “Reformed” people have accepted the Anabaptist view of church-state relations:

The doctrines respecting the total disunion of civil and religious matters, by which many are led away in present times’, were unheard of in the world till broached by the Anabaptists of Germany, a few years posterior to the Reformation; and, although I would not wish to brand any system of principles with infamy merely because of the men by whom they were advocated or the circumstances that gave them birth, I cannot help saying, that the origin of these doctrines would lead me to entertain respecting them a very great degree of suspicion, if not of absolute disgust. The sentiments of these German sectaries were of the wildest description. They undertook to carry the Reformation unspeakably farther than had been done by the Reformers. They pretended to found a new Church entirely purified from the alloy of this world — altogether spiritual and divine. On behalf of this Church, they professed to be armed against all opposition by celestial visions and the power of working miracles. Among the doctrines which they advocated were polygamy — perfect equality — the abolition of all distinctions arising from birth, rank, and wealth—and the utter uselessness among Christians of all magistracy, laws, and government.

They proceeded at length to propagate their doctrines throughout Germany by the sword, and their fanatical sect was not crushed till the blood of more than a hundred thousand of the German people had been shed. This, my friends, is the origin of the doctrines respecting the spirituality of the kingdom of Christ, and the entire disunion of the Church and State, which we hear so much extolled in present times. And I cannot help saying, that, for my own part, I would be filled with inexpressible wonder if I could believe that the bringing forth before the world of a great scriptural principle, affecting the whole character and prosperity of the Church of Christ, had been reserved by Divine Providence for a party of fanatics the most wild, enthusiastic, and ferocious that the world ever saw.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Although many today think that you can be Reformed while rejecting theocratic politics, the reality is that most modern “Reformed” people have accepted the Anabaptist view of church-state relations:

The doctrines respecting the total disunion of civil and religious matters, by which many are led away in present times’, were unheard of in the world till broached by the Anabaptists of Germany, a few years posterior to the Reformation; and, although I would not wish to brand any system of principles with infamy merely because of the men by whom they were advocated or the circumstances that gave them birth, I cannot help saying, that the origin of these doctrines would lead me to entertain respecting them a very great degree of suspicion, if not of absolute disgust. The sentiments of these German sectaries were of the wildest description. They undertook to carry the Reformation unspeakably farther than had been done by the Reformers. They pretended to found a new Church entirely purified from the alloy of this world — altogether spiritual and divine. On behalf of this Church, they professed to be armed against all opposition by celestial visions and the power of working miracles. Among the doctrines which they advocated were polygamy — perfect equality — the abolition of all distinctions arising from birth, rank, and wealth—and the utter uselessness among Christians of all magistracy, laws, and government.

They proceeded at length to propagate their doctrines throughout Germany by the sword, and their fanatical sect was not crushed till the blood of more than a hundred thousand of the German people had been shed. This, my friends, is the origin of the doctrines respecting the spirituality of the kingdom of Christ, and the entire disunion of the Church and State, which we hear so much extolled in present times. And I cannot help saying, that, for my own part, I would be filled with inexpressible wonder if I could believe that the bringing forth before the world of a great scriptural principle, affecting the whole character and prosperity of the Church of Christ, had been reserved by Divine Providence for a party of fanatics the most wild, enthusiastic, and ferocious that the world ever saw.”

— William MacKray, Defence of civil establishments of religion in Reformed Presbyterian">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+many+today+think+that+you+can+be+Reformed+while+rejecting+theocratic+politics%2C+the+reality+is+that+most+modern+%E2%80%9CReformed%E2%80%9D+people+have+accepted+the+Anabaptist+view+of+church-state+relations%3A%0A%0AThe+doctrines+respecting+the+total+disunion+of+civil+and+religious+matters%2C+by+which+many+are+led+away+in+present+times%E2%80%99%2C+were+unheard+of+in+the+world+till+broached+by+the+Anabaptists+of+Germany%2C+a+few+years+posterior+to+the+Reformation%3B+and%2C+although+I+would+not+wish+to+brand+any+system+of+principles+with+infamy+merely+because+of+the+men+by+whom+they+were+advocated+or+the+circumstances+that+gave+them+birth%2C+I+cannot+help+saying%2C+that+the+origin+of+these+doctrines+would+lead+me+to+entertain+respecting+them+a+very+great+degree+of+suspicion%2C+if+not+of+absolute+disgust.+The+sentiments+of+these+German+sectaries+were+of+the+wildest+description.+They+undertook+to+carry+the+Reformation+unspeakably+farther+than+had+been+done+by+the+Reformers.+They+pretended+to+found+a+new+Church+entirely+purified+from+the+alloy+of+this+world+%E2%80%94+altogether+spiritual+and+divine.+On+behalf+of+this+Church%2C+they+professed+to+be+armed+against+all+opposition+by+celestial+visions+and+the+power+of+working+miracles.+Among+the+doctrines+which+they+advocated+were+polygamy+%E2%80%94+perfect+equality+%E2%80%94+the+abolition+of+all+distinctions+arising+from+birth%2C+rank%2C+and+wealth%E2%80%94and+the+utter+uselessness+among+Christians+of+all+magistracy%2C+laws%2C+and+government.%0A%0AThey+proceeded+at+length+to+propagate+their+doctrines+throughout+Germany+by+the+sword%2C+and+their+fanatical+sect+was+not+crushed+till+the+blood+of+more+than+a+hundred+thousand+of+the+German+people+had+been+shed.+This%2C+my+friends%2C+is+the+origin+of+the+doctrines+respecting+the+spirituality+of+the+kingdom+of+C <blockquote><p>An article in Moses Roney’s Reformed Presbyterian periodical highlights the absurdity of Old and New School Presbyterians tolerating man-stealers in their communion (which also reminds us that the Old-New School split was not merely about slavery):

Add to all this, the exciting subject of slavery creates division in both the Old and New School ranks, and hastens on a subdivision into separate bodies. The anti-slavery men maintain, teach and prove that the holding of unoffending men in bondage as goods and chattels, like beasts of burden, is theft and robbery; while many distinguished pro-slavery men teach, that it is a natural relation, and sanctioned by the gospel of Christ. They farther assert that the doctrine of immediate emancipation is fanatical, incendiary, and seditious; and acting on their principles, they encourage mobs to prevent by violence the discussion of the right of the slave to freedom. We should like to know certainly the ecclesiastical standing of the man that lately murdered the Rev. Mr. Lovejoy, at Alton, Illinois, for his attempt to plead the cause of the trampled down slave. We do know that a clerical brother of the martyr to the cause, of liberty, encouraged the mob that committed the murder; and we know that an elder of the Presbyterian body was in the mob that committed violence on the person of Amos Dresser. Now, how is it possible for men to continue long together in the same communion, when their sentiments are so adverse as that what one party holds to be theft and robbery, the other strenuously maintains to be righteous, and practices accordingly? How can they long continue to meet at the same communion table, whose adverse doctrines and practices have already issued in deeds of violence and blood?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/moses-roney.html">Moses Roney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divisions in the churches in Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>If this does not forever prove that the papacy is the antichrist, then nothing does:

The destruction of the Papacy is the special work of the exalted Mediator, and there are the most powerful reasons why He should take vengeance upon that devoted system. Popery is essentially, and in every subject, the Antichrist – the inveterate and irreconcilable enemy of Christ. It stands in arrayed hostility to his character and offices. Popery exalts the creatures above the Saviour – representing the Virgin Mother as the Queen of Heaven, and as commanding her Son, and ascribing that power and homage to the Pope, his assumed vicar on earth, which belongs to Christ alone, and which it is the highest blasphemy to ascribe to any creature. He is dethroned from his mediatorial office, by exalting saint and angel-mediators. His priesthood is set aside by introducing human merits, and ascribing the virtue of his atonement to penances and bodily mortifications. The Roman pontiffs and the bishops and priests of Rome deny Christ his glory as a Prophet, by removing the key of knowledge, and preventing men from hearing the intimations of his will; while they arrogate to themselves more than regal honours, put on their own heads the diadem which He should exclusively wear, and promulgate laws and ordinances in opposition to the declared principles of his kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 296-7.</span></figcaption>

<blockquote><p>Question 1: If multitudes and people externally Covenanted with God, though not internally, whom the Lord calls his people and chosen by him, Deuteronomy 7:6; Deuteronomy 10:15 be rightly constitute the Visible Church, as Mr Thomas Hooker granteth, then Kingdoms must be his Visible Church.

Answer: No doubt, Egypt, Assyria, all Nations, all the ends of the world, all the Kingdoms of this world are Prophesied to be the Kingdoms and the Covenant people of God, and the Lord challengeth them as his (Isaiah 19:25, blessed by Egypt my people) Isaiah 2:1-3; Psalm 22:27; Revelation 11:15; Psalm 96-98; Isaiah 42:10; Isaiah 49:7-8, 20-21; Song of Solomon 8:8; Acts 13:46, 47; Romans 15:8-12, must be visible Covenanted Churches of God, to whom the seals of the Covenant are due; But that none in Egypt, Assyria, of all the called Gentiles, though visibly and professedly in Covenant, and affirmed by the mouth of the Lord to be his people, the Sifter of the Jewish Church, and his Kingdoms, are members of the Visible Church, or hath right to membership and seals, except men judge them to be real converts, sound believers, and so internally called and chosen, is to prefer the judgment of men, to the Word of God. […] [T]here be Prophecies under the Messiah, that all the Kingdoms of the world, Revelation 11:15, Egypt, Assyria, Isaiah 19:25, all Nations, Isaiah 2:2, all the Gentiles, Isaiah 60, shall be the confederate people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 199-201.</span></figcaption>

99-201.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff58d648fcf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f58d648fcf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/26/samuel-rutherford-on-covenanted-nations-in-the-new-testament-age/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6f4186adbc" data-kw="">
<blockquote><p>Jesus answered, “Most assuredly, I say to you, unless one is born of water and the Spirit, he cannot enter the kingdom of God.” (John 3:5)

John Calvin’s comments seek to correct the view that water baptism is absolutely essential to salvation (some of his language may appear to imply baptismal regeneration, but, if read with due caution, the reader should understand that this is not his view), but also warns that it is dangerous to neglect the ordinance:

Chrysostom, with whom the greater part of expounders agree, makes the word Water refer to baptism. The meaning would then be, that by baptism we enter into the kingdom of God, because in baptism we are regenerated by the Spirit of God. Hence arose the belief of the absolute necessity of baptism, in order to the hope of eternal life. But though we were to admit that Christ here speaks of baptism, yet we ought not to press his words so closely as to imagine that he confines salvation to the outward sign; but, on the contrary, he connects the Water with the Spirit, because under that visible symbol he attests and seals that newness of life which God alone produces in us by his Spirit. It is true that, by neglecting baptism, we are excluded from salvation; and in this sense I acknowledge that it is necessary; but it is absurd to speak of the hope of salvation as confined to the sign. So far as relates to this passage, I cannot bring myself to believe that Christ speaks of baptism; for it would have been inappropriate.</p></blockquote>

<blockquote><p>Two things have I to remark here with regard to the Church of Scotland. First:- Every one who connects himself with that Church, takes up AN ANTI-COVENANTING POSITION! When King William and his parliament looked into the Statute Book of the Kingdom, they found the obnoxious Acts of Charles II., which rescinded all the laws which had been enacted in favour of the Covenanted Reformation, legibly inscribed therein:- and what did they do with these acts? Repeal them? Not at all? They retained those guilty acts in all their force, and passing over the Second Reformation altogether, they revised the Act of 1592, and constituted it the character of the Church of Scotland? Did the General Assembly of 1690, object to this iniquitous juggling? Not they, indeed. They saw that the rest was good, and the land pleasant, and so, Issachar-like, they bowed the shoulder to bear, and became servants unto tribute. Yes, this they did, although the King plainly told them in his “letter” that “he and his parliament” had enacted such a frame of church government “as was judged to be most agreeable to the inclinations of his subjects.” HE and his PARLIAMENT, you perceive, my reader, did the whole business!! Therefore, it is, that I assert, that every minister and member of the Revolution Church of Scotland, cuts himself off from all participation in the glories of the period between 1638 and 1649. The same, indeed, must be said of the Free Church of Scotland, and also of the Irish Presbyterian Assembly.

The Established Church of Scotland is cut off from all participation in the glories of the Covenanting era, by STATUTE LAW; whereas the Free Church and the Irish Presbyterian Church, have VOLUNTARILY cut themselves off from these glories, by homologating the Revolution Settlement. Aristotle appears to be so much out of date now, that it may it may appear hazardous to venture upon a syllogism; however, let us try one. FIRST, major-premises: – The Revolution Settlement deliberately passed by; utterly repudiated; and placed “the grave-stone” upon the “Covenants and Covenanted Reformation.” SECOND, minor-premises:- Every Church which homologates the Revolution Settlement, deliberately passes by; utterly repudiates; and places the “grave stone” upon the “Covenants and Covenanted Reformation.” THIRD, the conclusion:- But, the Established Church of Scotland, the Free Church, and the Irish Presbyterian Church, do, each and all, homologate the Revolution Settlement; therefore, the Established Church of Scotland, the Free Church, and the Irish Presbyterian Church, do, each and all, deliberately pass by; utterly repudiate; and place the “grave stone” upon the “Covenants and Covenanted Reformation.” Quod crat demonstrandum. It is not my business to attempt to reconcile with honour, or even with common honesty, the conduct of those gentlemen, who, after they have deliberately repudiated the whole Covenanted Reformation, name and thing, can turn round, when the purpose serves, and cry out – often quite snappishly – to real Covenanters, “You are not the real Covenanters; we are the real Covenanters!!” Although I cannot allow that such persons are the real Covenanters, I do most readily grant that they are the real sextons, the real grave-diggers of the Covenanted Reformation, for they have consigned the whole thing to oblivion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Britain</cite>, still a horn of the beast (Banbridge, 1878), pp 23-4.</span></figcaption>

<blockquote><p>The papal antichrist doctrine is a crucial component of the Reformed faith; hence it is enshrined in the Westminster Confession (25:6). Indeed, it is not merely a Reformed view, but is part of historic Protestantism (Lutherans, Anglicans and others held to it). Sadly, this important teaching is both denied and expunged from the Confession (as in the American Presbyterian churches, the Presbyterian Church in Ireland and the Evangelical Presbyterian Church in Ireland), or else it is downplayed and rarely preached upon. Thomas Manton, however, reminds us of several reasons why this teaching should not be abandoned or forgotten about:

Observe, then, that the doctrine of Antichrist is a profitable doctrine, and a point very necessary to be preached and known.

1. It is a point very necessary to admonish and warn the faithful, that they be not circumvented with these delusions, and be found in the opposite state to Christ Jesus, and the interests of his kingdom. God hath blown his trumpet: Rev. xviii. 4, ‘Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues;’ God calleth his people out of spiritual Babylon; it is dangerous and unsafe being there. If we would escape Babylon’s punishments we must escape her sins, not live in that communion and society where there are such temptations to idolatry and other detestable enormities. It is disputable whether the errors of Popery be damnable, or there be any possibility of salvation in that religion. Some deny all possibility; others, abating from the rigour of that opinion, assert a very great difficulty: 1 Cor. iii. 13, ‘Saved as by fire;’ if so much Christianity left as to save them, it is with much ado. But the question is not about our benefit, but our duty; not whether possibly we may be saved? but what is the way the Lord will have us to walk in? And if there were possibility or probability of salvation in the way, in the general, yet there is very little or none for them that live in a known sin, and especially in a sin of such a dangerous nature as abetting an opposite faction to Christ, such as is that of Antichrist.

2. It is necessary to fortify and forewarn the people of God against a double temptation. (1.) Against scandal; (2.) Against persecutions.

[1.] Against scandal. It is a dangerous temptation to atheism to see Christianity so corrupted and debauched by a vile submission to serve worldly ends, and turned into the pageantry of empty and ridiculous ceremonies, which beget scorn and contempt of it in the minds of all considering beholders; and therefore there are more atheists in Rome and Italy than in other countries. Supernatural things, disguised with a vain pomp, lose their reverence, and do not alarm the conscience, but harden the heart in a settled atheism and contempt of Christ. Now it is a mighty stay to the heart to see that this degeneration was foreseen and foretold: John xvi. 1, ‘These things have I spoken to you, that you should not be offended;’ Mat. xviii. 7, ‘Woe unto the world because of offences! for it must needs be that offences come; but woe to that man by whom the offence cometh!’

[2.] Against persecutions; for the man of sin is also a son of perdition, a destroyer of the saints, and maketh havoc of the people of God. Now it is grievous when Christians suffer by Christians, and we may have many doubtings and misgivings about our cause; but when Antichrist is clearly discovered, we submit the more cheerfully to suffer the hardest things under his tyranny; for suffering under antichristian persecution is martyrdom and suffering for Christ, as much as suffering under Pagan persecution: Rev. xiv. 13, ‘And I heard a voice from heaven saying unto me, write, Blessed are the dead which die in the Lord from henceforth,’ &amp;c. Not only the primitive martyrs, who were put to death by heathens, but those that are condemned by Christians and burned for heretics, those are martyrs also.

3. That we may the better understand true Christianity; ἀντικείμενα παραλληλειμένα μάλιστα φαίνεται, opposites illustrate each other. The two opposite states are Christianity and Antichristianity; the one is a ‘mystery of godliness,’ 1 Tim. iii. 16; the other, ‘a mystery of iniquity.’ The design of the mystery of godliness is to recover men from the devil, the world, and the flesh, unto God; the other, to seduce men from God to the devil, the world, and the flesh again; and that by corrupting the former mystery, or the most excellent institution that ever the world was acquainted with for the ennobling and refining man’s nature; so that Christ’s religion is turned against himself, to lull men’s consciences asleep, whilst they gratify the lusts of the eyes, the lusts of the flesh, or live in pride of life. The devil is gratified by all sin, but especially he is εἰδωλοχαρὴς, as Synesius calleth him; one that delighteth in idols, as knowing this is the best way to make men brutish, or to live in an oblivion or neglect of God; for an idol is ‘a teacher of lies,’ Hab. ii. 18, doth imprint upon the mind carnal and false conceptions of a deity.

4. To confirm us in the truth of the Christian faith, when we see the prophecies of it expressly fulfilled; for this is the Lord’s direction to know a true prophet, Deut. xviii. 22, if the thing come to pass, and the event doth punctually answer the prediction; but when a prophet speaketh in the name of the Lord, and the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken. Now, the apostles did not only teach the church the doctrine of Christianity, but by a prophetic spirit and divine revelation foretold things to come; and among these, the great thing which is to happen and come to pass before Christ’s second coming is Antichrist, or the appearing of the man of sin. Therefore, that we may not doubt of what is past, nor suspect what is further to come, it is good to study these prophecies, and know they are to be fulfilled in their time, that we may say that God, who hath kept touch with the world hitherto in all the predictions of the word, will not fail at last.

Use 1. To reprove them that think this is a curious point not to be searched into. Why then did God reveal it, and that so often by St Paul, by St John, in so many prophetical representations of it? Surely it is not curiosity to search into things revealed, but to intrude ourselves into things hidden, and which God hath put under a veil of secrecy. It is true men must know their measure, and not attempt to run before they can go, and venture upon obscure points before well versed in plain; and it is true, in more abstruse points, men must not rashly define, but soberly and modestly inquire, and compare predictions with plain events; this is no way culpable.

2. To reprove those that are so impatient of giving a little attendance to such doctrines for a while, and think at least matter more profitable should be insisted on; they are persuaded enough already. It is well if it be so; but those that stand should take heed lest they fall; and presumptuous confidence soonest giveth out, and forsaketh Christ. I would but propound this argument to them: If it were profitable for them that were to go out of the body long before Antichrist was revealed to be taught these things again and again, and they be charged to keep these things in remembrance, certainly it is more profitable for others that live at the time when these things are in being, and the temptation is at the next door, ready to break in upon them. Surely it is profitable to discover Antichrist, to reduce those that are gone astray, much more to prevent a revolt, that we may not return to this bondage after a deliverance from it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The papal antichrist doctrine is a crucial component of the Reformed faith; hence it is enshrined in the Westminster Confession (25:6). Indeed, it is not merely a Reformed view, but is part of historic Protestantism (Lutherans, Anglicans and others held to it). Sadly, this important teaching is both denied and expunged from the Confession (as in the American Presbyterian churches, the Presbyterian Church in Ireland and the Evangelical Presbyterian Church in Ireland), or else it is downplayed and rarely preached upon. Thomas Manton, however, reminds us of several reasons why this teaching should not be abandoned or forgotten about:

Observe, then, that the doctrine of Antichrist is a profitable doctrine, and a point very necessary to be preached and known.

1. It is a point very necessary to admonish and warn the faithful, that they be not circumvented with these delusions, and be found in the opposite state to Christ Jesus, and the interests of his kingdom. God hath blown his trumpet: Rev. xviii. 4, ‘Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues;’ God calleth his people out of spiritual Babylon; it is dangerous and unsafe being there. If we would escape Babylon’s punishments we must escape her sins, not live in that communion and society where there are such temptations to idolatry and other detestable enormities. It is disputable whether the errors of Popery be damnable, or there be any possibility of salvation in that religion. Some deny all possibility; others, abating from the rigour of that opinion, assert a very great difficulty: 1 Cor. iii. 13, ‘Saved as by fire;’ if so much Christianity left as to save them, it is with much ado. But the question is not about our benefit, but our duty; not whether possibly we may be saved? but what is the way the Lord will have us to walk in? And if there were possibility or probability of salvation in the way, in the general, yet there is very little or none for them that live in a known sin, and especially in a sin of such a dangerous nature as abetting an opposite faction to Christ, such as is that of Antichrist.

2. It is necessary to fortify and forewarn the people of God against a double temptation. (1.) Against scandal; (2.) Against persecutions.

[1.] Against scandal. It is a dangerous temptation to atheism to see Christianity so corrupted and debauched by a vile submission to serve worldly ends, and turned into the pageantry of empty and ridiculous ceremonies, which beget scorn and contempt of it in the minds of all considering beholders; and therefore there are more atheists in Rome and Italy than in other countries. Supernatural things, disguised with a vain pomp, lose their reverence, and do not alarm the conscience, but harden the heart in a settled atheism and contempt of Christ. Now it is a mighty stay to the heart to see that this degeneration was foreseen and foretold: John xvi. 1, ‘These things have I spoken to you, that you should not be offended;’ Mat. xviii. 7, ‘Woe unto the world because of offences! for it must needs be that offences come; but woe to that man by whom the offence cometh!’

[2.] Against persecutions; for the man of sin is also a son of perdition, a destroyer of the saints, and maketh havoc of the people of God. Now it is grievous when Christians suffer by Christians, and we may have many doubtings and misgivings about our cause; but when Antichrist is clearly discovered, we submit the more cheerfully to suffer the hardest things under his tyranny; for suffering under antichristian persecution is martyrdom and suffering for Christ, as much as suffering under Pagan persecution: Rev. xiv. 13, ‘And I heard a voice from heaven saying unto me, write, Blessed are the dead which die in the Lord from henceforth,’ &amp;c. Not only the primitive martyrs, who were put to death by heathens, but those that are condemned by Christians and burned for heretics, those are martyrs also.

3. That we may the better understand true Christianity; ἀντικείμενα παραλληλειμένα μάλιστα φαίνεται, opposites illustrate each other. The two opposite states are Christianity and Antichristianity; the one is a ‘mystery of godliness,’ 1 Tim. iii. 16; the other, ‘a mystery of iniquity.’ The design of the mystery of godliness is to recover men from the devil, the world, and the flesh, unto God; the other, to seduce men from God to the devil, the world, and the flesh again; and that by corrupting the former mystery, or the most excellent institution that ever the world was acquainted with for the ennobling and refining man’s nature; so that Christ’s religion is turned against himself, to lull men’s consciences asleep, whilst they gratify the lusts of the eyes, the lusts of the flesh, or live in pride of life. The devil is gratified by all sin, but especially he is εἰδωλοχαρὴς, as Synesius calleth him; one that delighteth in idols, as knowing this is the best way to make men brutish, or to live in an oblivion or neglect of God; for an idol is ‘a teacher of lies,’ Hab. ii. 18, doth imprint upon the mind carnal and false conceptions of a deity.

4. To confirm us in the truth of the Christian faith, when we see the prophecies of it expressly fulfilled; for this is the Lord’s direction to know a true prophet, Deut. xviii. 22, if the thing come to pass, and the event doth punctually answer the prediction; but when a prophet speaketh in the name of the Lord, and the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken. Now, the apostles did not only teach the church the doctrine of Christianity, but by a prophetic spirit and divine revelation foretold things to come; and among these, the great thing which is to happen and come to pass before Christ’s second coming is Antichrist, or the appearing of the man of sin. Therefore, that we may not doubt of what is past, nor suspect what is further to come, it is good to study these prophecies, and know they are to be fulfilled in their time, that we may say that God, who hath kept touch with the world hitherto in all the predictions of the word, will not fail at last.

Use 1. To reprove them that think this is a curious point not to be searched into. Why then did God reveal it, and that so often by St Paul, by St John, in so many prophetical representations of it? Surely it is not curiosity to search into things revealed, but to intrude ourselves into things hidden, and which God hath put under a veil of secrecy. It is true men must know their measure, and not attempt to run before they can go, and venture upon obscure points before well versed in plain; and it is true, in more abstruse points, men must not rashly define, but soberly and modestly inquire, and compare predictions with plain events; this is no way culpable.

2. To reprove those that are so impatient of giving a little attendance to such doctrines for a while, and think at least matter more profitable should be insisted on; they are persuaded enough already. It is well if it be so; but those that stand should take heed lest they fall; and presumptuous confidence soonest giveth out, and forsaketh Christ. I would but propound this argument to them: If it were profitable for them that were to go out of the body long before Antichrist was revealed to be taught these things again and again, and they be charged to keep these things in remembrance, certainly it is more profitable for others that live at the time when these things are in being, and the temptation is at the next door, ready to break in upon them. Surely it is profitable to discover Antichrist, to reduce those that are gone astray, much more to prevent a revolt, that we may not return to this bondage after a deliverance from it.”

— Thomas Manton, Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 46-8.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+papal+antichrist+doctrine+is+a+crucial+component+of+the+Reformed+faith%3B+hence+it+is+enshrined+in+the+Westminster+Confession+%2825%3A6%29.+Indeed%2C+it+is+not+merely+a+Reformed+view%2C+but+is+part+of+historic+Protestantism+%28Lutherans%2C+Anglicans+and+others+held+to+it%29.+Sadly%2C+this+important+teaching+is+both+denied+and+expunged+from+the+Confession+%28as+in+the+American+Presbyterian+churches%2C+the+Presbyterian+Church+in+Ireland+and+the+Evangelical+Presbyterian+Church+in+Ireland%29%2C+or+else+it+is+downplayed+and+rarely+preached+upon.+Thomas+Manton%2C+however%2C+reminds+us+of+several+reasons+why+this+teaching+should+not+be+abandoned+or+forgotten+about%3A%0A%0AObserve%2C+then%2C+that+the+doctrine+of+Antichrist+is+a+profitable+doctrine%2C+and+a+point+very+necessary+to+be+preached+and+known.%0A%0A1.+It+is+a+point+very+necessary+to+admonish+and+warn+the+faithful%2C+that+they+be+not+circumvented+with+these+delusions%2C+and+be+found+in+the+opposite+state+to+Christ+Jesus%2C+and+the+interests+of+his+kingdom.+God+hath+blown+his+trumpet%3A+Rev.+xviii.+4%2C+%E2%80%98Come+out+of+her%2C+my+people%2C+that+ye+be+not+partakers+of+her+sins%2C+and+that+ye+receive+not+of+her+plagues%3B%E2%80%99+God+calleth+his+people+out+of+spiritual+Babylon%3B+it+is+dangerous+and+unsafe+being+there.+If+we+would+escape+Babylon%E2%80%99s+punishments+we+must+escape+her+sins%2C+not+live+in+that+communion+and+society+where+there+are+such+temptations+to+idolatry+and+other+detestable+enormities.+It+is+disputable+whether+the+errors+of+Popery+be+damnable%2C+or+there+be+any+possibility+of+salvation+in+that+religion.+Some+deny+all+possibility%3B+others%2C+abating+from+the+rigour+of+that+opinion%2C+assert+a+very+great+difficulty%3A+1+Cor.+iii.+13%2C+%E2%80%98Saved+as+by+fire%3B%E2%80%99+if+so+much+Christianity+left+as+to+save+them%2C+it+is+with+much+ado.+But+the+question+is+not+about+our+benefit%2C+but+our+duty%3B+not+whether+possibly+we+may+be+saved%3F+but+what+is+the+way+the+Lord+will+have+us+to+walk+in%3F+And+if+there+were+possibility+or+probability+of+salvation+in+the+way%2C+in+the+general%2C+yet+there+is+very+little+or+none+for+them+that+live+in+a+known+sin%2C+and+especially+in+a+sin+of+such+a+dangerous+nature+as+abetting+an+opposite+faction+to+Christ%2C+such+as+is+that+of+Antichrist.%0A%0A2.+It+is+necessary+to+fortify+and+forewarn+the+people+of+God+against+a+double+temptation.+%281.%29+Against+scandal%3B+%282.%29+Against+persecutions.%0A%0A%5B1.%5D+Against+scandal.+It+is+a+dangerous+temptation+to+atheism+to+see+Christianity+so+corrupted+and+debauched+by+a+vile+submission+to+serve+worldly+ends%2C+and+turned+into+the+pageantry+of+empty+and+ridiculous+ceremonies%2C+which+beget+scorn+and+contempt+of+it+in+the+minds+of+all+considering+beholders%3B+and+therefore+there+are+more+atheists+in+Rome+and+Italy+than+in+other+countries.+Supernatural+things%2C+disguised+with+a+vain+pomp%2C+lose+their+reverence%2C+and+do+not+alarm+the+conscience%2C+but+harden+the+heart+in+a+settled+atheism+and+contempt+of+Christ.+Now+it+is+a+mighty+stay+to+the+heart+to+see+that+this+degeneration+was+foreseen+and+foretold%3A+John+xvi.+1%2C+%E2%80%98These+things+have+I+spoken+to+you%2C+that+you+should+not+be+offended%3B%E2%80%99+Mat.+xviii.+7%2C+%E2%80%98Woe+unto+the+world+because+of+offences%21+for+it+must+needs+be+that+offences+come%3B+but+woe+to+that+man+by+whom+the+offence+cometh%21%E2%80%99%0A%0A%5B2.%5D+Against+persecutions%3B+for+the+man+of+sin+is+also+a+son+of+perdition%2C+a+destroyer+of+the+saints%2C+and+maketh+havoc+of+the+people+of+God.+Now+it+is+grievous+when+Christians+suffer+by+Christians%2C+and+we+may+have+many+doubtings+and+misgivings+about+our+cause%3B+but+when+Antichrist+is+clearly+discovered%2C+we+submit+the+more+cheerfully+to+suffer+the+hardest+things+under+his+tyranny%3B+for+suffering+under+antichristian+persecution+is+martyrdom+and+suffering+for+Christ%2C+as+much+as+suffering+under+Pagan+persecution%3A+Rev.+xiv.+13%2C+%E2%80%98And+I+heard+a+voice+from+heaven+saying+unto+me%2C+write%2C+Blessed+are+the+dead+which+die+in+the+Lord+from+henceforth%2C%E2%80%99+%26c.+Not+only+the+primitive+martyrs%2C+who+were+put+to+death+by+heathens%2C+but+those+that+are+condemned+by+Christians+and+burned+for+heretics%2C+those+are+martyrs+also.%0A%0A3.+That+we+may+the+better+understand+true+Christianity%3B+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%BA%CE%B5%CE%AF%CE%BC%CE%B5%CE%BD%CE%B1+%CF%80%CE%B1%CF%81%CE%B1%CE%BB%CE%BB%CE%B7%CE%BB%CE%B5%CE%B9%CE%BC%CE%AD%CE%BD%CE%B1+%CE%BC%CE%AC%CE%BB%CE%B9%CF%83%CF%84%CE%B1+%CF%86%CE%B1%CE%AF%CE%BD%CE%B5%CF%84%CE%B1%CE%B9%2C+opposites+illustrate+each+other.+The+two+opposite+states+are+Christianity+and+Antichristianity%3B+the+one+is+a+%E2%80%98mystery+of+godliness%2C%E2%80%99+1+Tim.+iii.+16%3B+the+other%2C+%E2%80%98a+mystery+of+iniquity.%E2%80%99+The+design+of+the+mystery+of+godliness+is+to+recover+men+from+the+devil%2C+the+world%2C+and+the+flesh%2C+unto+God%3B+the+other%2C+to+seduce+men+from+God+to+the+devil%2C+the+world%2C+and+the+flesh+again%3B+and+that+by+corrupting+the+former+mystery%2C+or+the+most+excellent+institution+that+ever+the+world+was+acquainted+with+for+the+ennobling+and+refining+man%E2%80%99s+nature%3B+so+that+Christ%E2%80%99s+religion+is+turned+against+himself%2C+to+lull+men%E2%80%99s+consciences+asleep%2C+whilst+they+gratify+the+lusts+of+the+eyes%2C+the+lusts+of+the+flesh%2C+or+live+in+pride+of+life.+The+devil+is+gratified+by+all+sin%2C+but+especially+he+is+%CE%B5%E1%BC%B0%CE%B4%CF%89%CE%BB%CE%BF%CF%87%CE%B1%CF%81%E1%BD%B4%CF%82%2C+as+Synesius+calleth+him%3B+one+that+delighteth+in+idols%2C+as+knowing+this+is+the+best+way+to+make+men+brutish%2C+or+to+live+in+an+oblivion+or+neglect+of+God%3B+for+an+idol+is+%E2%80%98a+teacher+of+lies%2C%E2%80%99+Hab.+ii.+18%2C+doth+imprint+upon+the+mind+carnal+and+false+conceptions+of+a+deity.%0A%0A4.+To+confirm+us+in+the+truth+of+the+Christian+faith%2C+when+we+see+the+prophecies+of+it+expressly+fulfilled%3B+for+this+is+the+Lord%E2%80%99s+direction+to+know+a+true+prophet%2C+Deut.+xviii.+22%2C+if+the+thing+come+to+pass%2C+and+the+event+doth+punctually+answer+the+prediction%3B+but+when+a+prophet+speaketh+in+the+name+of+the+Lord%2C+and+the+thing+follow+not%2C+nor+come+to+pass%2C+that+is+the+thing+which+the+Lord+hath+not+spoken.+Now%2C+the+apostles+did+not+only+teach+the+church+the+doctrine+of+Christianity%2C+but+by+a+prophetic+spirit+and+divine+revelation+foretold+things+to+come%3B+and+among+these%2C+the+great+thing+which+is+to+happen+and+come+to+pass+before+Christ%E2%80%99s+second+coming+is+Antichrist%2C+or+the+appearing+of+the+man+of+sin.+Therefore%2C+that+we+may+not+doubt+of+what+is+past%2C+nor+suspect+what+is+further+to+come%2C+it+is+good+to+study+these+prophecies%2C+and+know+they+are+to+be+fulfilled+in+their+time%2C+that+we+may+say+that+God%2C+who+hath+kept+touch+with+the+world+hitherto+in+all+the+predictions+of+the+word%2C+will+not+fail+at+last.%0A%0AUse+1.+To+reprove+them+that+think+this+is+a+curious+point+not+to+be+searched+into.+Why+then+did+God+reveal+it%2C+and+that+so+often+by+St+Paul%2C+by+St+John%2C+in+so+many+prophetical+representations+of+it%3F+Surely+it+is+not+curiosity+to+search+into+things+revealed%2C+but+to+intrude+ourselves+into+things+hidden%2C+and+which+God+hath+put+under+a+veil+of+secrecy.+It+is+true+men+must+know+their+measure%2C+and+not+attempt+to+run+before+they+can+go%2C+and+venture+upon+obscure+points+before+well+versed+in+plain%3B+and+it+is+true%2C+in+more+abstruse+points%2C+men+must+not+rashly+define%2C+but+soberly+and+modestly+inquire%2C+and+compare+predictions+with+plain+events%3B+this+is+no+way+culpable.%0A%0A2.+To+reprove+those+that+are+so+impatient+of+giving+a+little+attendance+to+such+doctrines+for+a+while%2C+and+think+at+least+matter+more+profitable+should+be+insisted+on%3B+they+are+persuaded+enough+already.+It+is+well+if+it+be+so%3B+but+those+that+stand+should+take+heed+lest+they+fall%3B+and+presumptuous+confidence+soonest+giveth+out%2C+and+forsaketh+Christ.+I+would+but+propound+this+argument+to+them%3A+If+it+were+profitable+for+them+that+were+to+go+out+of+the+body+long+before+Antichrist+was+revealed+to+be+taught+these+things+again+and+again%2C+and+they+be+charged+to+keep+these+things+in+remembrance%2C+certainly+it+is+more+profitable+for+others+that+live+at+the+time+when+these+things+are+in+being%2C+and+the+temptation+is+at+the+next+door%2C+ready+to+break+in+upon+them.+Surely+it+is+profitable+to+discover+Antichrist%2C+to+reduce+those+that+are+gone+astray%2C+much+more+to+prevent+a+revolt%2C+that+we+may+not+return+to+this+bondage+after+a+deliverance+from+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+complete+works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+46-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf7c06ac5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df7c06ac5a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/15/thomas-manton-on-the-importance-of-believing-that-the-pope-is-the-antichrist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Although the editor of this blog is not opposed to home-schooling (indeed, it is often the only way for parents in our current circumstances to ensure their children get a Christian education), we reject the extremist notion that it is the only scriptural (or even the best) way to educate children. Our Reformed forebears did not believe this to be the case; you will even notice that Samuel Rutherford applies a favourite home-schooling “proof-text” to those who teach children in schools. This, moreover, also demonstrates that the Covenanters did not believe in Kuyperian notions of sphere-sovereignty. Since magistrates and school-teachers are also “fathers”, texts like Ephesians 6:4 could also be applied to them and not just to literal fathers. Hence they rejected the idea that education belonged to the “sphere” of the nuclear family alone :

There are with us Doctors of Divinity who teach in Schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3. 10. under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their Colleges, were young Prophets, or sons of the Prophets, as 1 Sam. 10. 5. 2 Kin. 4. 1. 1 King. 20. 35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Pro. 22. 6. Ephes. 6.4. if they aim at the Ministry, prophesy in our presbyterial meetings, 1 Cor. 14.29.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Although the editor of this blog is not opposed to home-schooling (indeed, it is often the only way for parents in our current circumstances to ensure their children get a Christian education), we reject the extremist notion that it is the only scriptural (or even the best) way to educate children. Our Reformed forebears did not believe this to be the case; you will even notice that Samuel Rutherford applies a favourite home-schooling “proof-text” to those who teach children in schools. This, moreover, also demonstrates that the Covenanters did not believe in Kuyperian notions of sphere-sovereignty. Since magistrates and school-teachers are also “fathers”, texts like Ephesians 6:4 could also be applied to them and not just to literal fathers. Hence they rejected the idea that education belonged to the “sphere” of the nuclear family alone :

There are with us Doctors of Divinity who teach in Schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3. 10. under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their Colleges, were young Prophets, or sons of the Prophets, as 1 Sam. 10. 5. 2 Kin. 4. 1. 1 King. 20. 35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Pro. 22. 6. Ephes. 6.4. if they aim at the Ministry, prophesy in our presbyterial meetings, 1 Cor. 14.29.”

— Samuel Rutherford, A peaceable and temperate plea for Paul’s Presbytery in, Scotland (London, 1642), p. 319.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+editor+of+this+blog+is+not+opposed+to+home-schooling+%28indeed%2C+it+is+often+the+only+way+for+parents+in+our+current+circumstances+to+ensure+their+children+get+a+Christian+education%29%2C+we+reject+the+extremist+notion+that+it+is+the+only+scriptural+%28or+even+the+best%29+way+to+educate+children.+Our+Reformed+forebears+did+not+believe+this+to+be+the+case%3B+you+will+even+notice+that+Samuel+Rutherford+applies+a+favourite+home-schooling+%E2%80%9Cproof-text%E2%80%9D+to+those+who+teach+children+in+schools.+This%2C+moreover%2C+also+demonstrates+that+the+Covenanters+did+not+believe+in+Kuyperian+notions+of+sphere-sovereignty.+Since+magistrates+and+school-teachers+are+also+%E2%80%9Cfathers%E2%80%9D%2C+texts+like+Ephesians+6%3A4+could+also+be+applied+to+them+and+not+just+to+literal+fathers.+Hence+they+rejected+the+idea+that+education+belonged+to+the+%E2%80%9Csphere%E2%80%9D+of+the+nuclear+family+alone+%3A%0A%0AThere+are+with+us+Doctors+of+Divinity+who+teach+in+Schools+and+Universities%2C+men+tried+to+be+holy+and+learned%2C+and+then+put+in+office%2C+as+1+Tim.+3.+10.+under+whose+instruction+are+students+aiming+at+the+holy+ministry+called+expectants%2C+as+in+the+Jewish+Church+in+their+Colleges%2C+were+young+Prophets%2C+or+sons+of+the+Prophets%2C+as+1+Sam.+10.+5.+2+Kin.+4.+1.+1+King.+20.+35.+These+Doctors+and+also+the+teachers+of+human+literature%2C+who+train+up+children+in+the+nurture+and+admonition+of+the+Lord%2C+Pro.+22.+6.+Ephes.+6.4.+if+they+aim+at+the+Ministry%2C+prophesy+in+our+presbyterial+meetings%2C+1+Cor.+14.29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+peaceable+and+temperate+plea+for+Paul%E2%80%99s+Presbytery+in%2C+Scotland+%28London%2C+1642%29%2C+p.+319.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa054699443.html&amp;via=5Solas" target="_blank" rel="n <blockquote><p>It has pleased the Lord also, to bring you a degree further, that both the honourable Houses of Parliament, and many others, whose hearts the Lord has touched, have entered into a SOLEMN LEAGUE AND COVENANT, for performing such duties, as are judged necessary at this time, for the honour of God, and for the deliverance and preservation of the church and kingdom, which no doubt will prove a precious and powerful means of good, if the name of the most High God, be not by it taken in vain. But take heed, that it be not forgotten by them that have taken it, before it be taken by others. And therefore two things would be looked into. (1.) That although it should never be taken by others, yet it obliges such as have entered in covenant, and although the whole nation be bound to the same duties which you are bound unto, you have entered into a new obligation, which, if you shall forget or violate, will certainly be laid to your charge. Jeremiah reproves Israel not for the transgression of the Law, which yet commanded the same duties, but for violation of the covenant (Jer. 34). (2) That others be instructed and moved to enter into the same covenant. For if they who have entered in covenant shall not consider that it is a perpetual covenant never to be forgotten, or (which God forbid) shall forget, their supervenient obligation, and others shall refuse to enter in covenant, it will not only make a division in the church and kingdom, but shall be a ready way to bring on a greater wrath, than yet has been seen or felt, upon one sort for their perfidy, and upon the other for their neglect or obstinacy.</p></blockquote>

<blockquote><p>The intoxication of the spirit of the mind by the venom of error, is as much contrary to the divine nature and will, is as much hateful to the Spirit of light and truth, and as evidently damnable, as the corruption of the will, and inferior affections, or any member of the body with whatsoever vice, or more bodily transgression. […] Whence it necessarily follows, that it is more, at least no less unlawful for a Christian state to give any liberty or toleration to error, than to set up in every city and parish of their dominions, bordellos for uncleanness [houses of prostitution], stages for plays [1], and lists for duels. That a liberty for errors is no less hateful to God, no less hurtful to men, than a freedom without any punishment, without any discouragement, for all men, when and wheresoever they pleased, to kill, to steal, to rob, to commit adultery, or to do any of these mischiefs, which are most repugnant to the civil law, and destructive of human society.</p></blockquote>

<blockquote><p>Now in all these commands, as their subject matter consists of things forbidden in the ten Commandments, as blasphemy, Apostasy, Witchcraft, Profanation of the Sabbath, etc. So that the commands for punishing such (for the substance of them), are moral too of common reason and equity, given to all Nations, and for all ages […]

For the first, let the Reader lay together these particulars I. that tis evident some of these commands, as against offering their children to Molech, as against dealing and contracting with a familiar Spirit deserve punishing among Christians and under the Gospel now, as well as under the Law, and if these, why not the other of Blasphemy, Idolatry, false prophecy, &amp;c? These latter are of moral things as well as the other; the first and these are delivered both by Moses in the same books, time, propounded after the same tenor and way, upon the same grounds and reasons […]

But if it be said those commands against offering their seed to Molech and of witches, are therefore punished by the magistrate, because they offend against lives and estates of mankind, in killing the children, in cattle being killed, and men’s bodies being hurt by witches and wizards, which is not the other of Apostasy, Blasphemy, &amp;c. I reply, tis to be observed that in all those places where the commands are given by God to the Magistrate about these, there’s not one jot or tittle expressed about offending against the second Table in life or goods, but all the reason formally declared, is, because against God immediately, and the commands of the first Table […]

Secondly, these commands to the Magistrate concerning Idolaters, Blasphemers, &amp;c. were not for the punishing of Israelites, the Jewish people only, but of all strangers in their Land, both of Proselytes that dwelt among them, and of others that only travelled through, or were there a while upon trading or such like occasions as these Scriptures show [he cites Lev. 20:2; 24:16] […]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now in all these commands, as their subject matter consists of things forbidden in the ten Commandments, as blasphemy, Apostasy, Witchcraft, Profanation of the Sabbath, etc. So that the commands for punishing such (for the substance of them), are moral too of common reason and equity, given to all Nations, and for all ages […]

For the first, let the Reader lay together these particulars I. that tis evident some of these commands, as against offering their children to Molech, as against dealing and contracting with a familiar Spirit deserve punishing among Christians and under the Gospel now, as well as under the Law, and if these, why not the other of Blasphemy, Idolatry, false prophecy, &amp;c? These latter are of moral things as well as the other; the first and these are delivered both by Moses in the same books, time, propounded after the same tenor and way, upon the same grounds and reasons […]

But if it be said those commands against offering their seed to Molech and of witches, are therefore punished by the magistrate, because they offend against lives and estates of mankind, in killing the children, in cattle being killed, and men’s bodies being hurt by witches and wizards, which is not the other of Apostasy, Blasphemy, &amp;c. I reply, tis to be observed that in all those places where the commands are given by God to the Magistrate about these, there’s not one jot or tittle expressed about offending against the second Table in life or goods, but all the reason formally declared, is, because against God immediately, and the commands of the first Table […]

Secondly, these commands to the Magistrate concerning Idolaters, Blasphemers, &amp;c. were not for the punishing of Israelites, the Jewish people only, but of all strangers in their Land, both of Proselytes that dwelt among them, and of others that only travelled through, or were there a while upon trading or such like occasions as these Scriptures show [he cites Lev. 20:2; 24:16] […]”

<blockquote><p>Who are these that fly as a cloud, and as doves to their windows” (Isaiah 60:8)

When preaching on the above text, the early Seceder Ebenezer Erskine distinguished between water baptism and the baptism of the Spirit:

There is the public window of baptism, that initiating ordinance, ‘which signifies and seals our ingrafting into Christ, and our partaking of the benefits of the new covenant, and our engagement to be the Lord’s.’ Sirs, ye are all entered into God’s outer house by this window. O do not stay there, but fly in a little further, even into the chambers of presence. The outward seal of God’s covenant gives you a right to take hold of the covenant, and of Christ the covenant Head; and I may say to you (who have come in at this window of the visible church), what Paul says concerning the Jews, Rom. ix. 4, “To you belongs the adoption, and the glory, and the covenants, and the giving of the law, and the service of God, and the promises;” and therefore take care that you do not forsake your own mercy; never rest until you get the baptism of the Spirit, as well as the baptism of water, by which ye shall be “sealed unto the day of redemption.</p></blockquote>

v>

<blockquote><p>In the midst of the mindless fanaticism surrounding the current presidential election, James Dick provides us with a sense of perspective that is sadly missing among the pseudo-religious right – who think that you can reform a nation by voting for a Mormon antichrist. It is especially sad that professors at “Puritan Reformed” seminaries ignore the teaching of the Reformed confession in relation to extirpating idolatry and caring for the poor and needy in order to justify supporting the heresy of American conservatism (being “conservative” in America means conserving an atheist, idolatrous, Christ-despising, hell-inspired constitution. It is, therefore, a political heresy to be a conservative in an American context. Why do you think the Libertarians and conservatives slander our Reformed forebears as Statists and socialists? It is because they know that the Reformed position is at odds with their idol of conservatism). I wonder how many Puritans would have voted for Socinians or members of other cults? Seriously, if you were to accept the reasoning in the post linked above, “vote for Mitt Romney because he is against abortion and homosexuality” [which is debatable], you could use it to justify voting for the Pope of Rome! After all, the Pope is against homosexuality and abortion, but no Puritan would ever have voted him or his votaries into civil office because they knew that the spiritual damage popery and false relgion can potentially do is far worse than anything that can be done by abortionists or homosexuals. The reality is that such “conservatism” (a useless term if ever there was one) is of its father the devil. May God deliver us from such folly by returning us to the Old Light Covenanter position:

The Reformed Presbyterian Church exists to keep this Gospel pure and entire. Is there any other Church that does this? If so, we shall be glad to join hand and heart with that Church. We do not know, however, of any Church but our own that openly protests against the nation’s rejection of Christ. We do not know of one single resolution or memorial or action of any Court of the British Presbyterian Churches in which they profess a desire to bring the nation to Christ’s feet. We do not know of a single act in which they denounce the sin of this nation in breaking Christ’s Covenants at the Restoration, and its continued sin in persisting in the breach of those Covenants today.

Yet members of these churches will tell us when we feel constrained to protest against a rebellious nation, and to separate ourselves from it, that they are taking the more excellent way of “voting for good men,” and seeking reform in the direction of which we are speaking. For first, no good man ever yet solicited the votes of the electors in order to advocate the restoration of the nation to Christ’s law. No vote was ever given or received for the purpose of purging the nation from its unholy confederacy with Christ’s enemies. When we find a candidate for Parliamentary honours who will pledge himself heartily and honestly to urge upon the nation the Gospel of our Testimony, and when we find members of other churches willing to vote that the Gospel of our Testimony may be accepted by the nation, it will be time enough for us to consider whether voting side by side with Papists and other enemies of Christ be a more excellent way, or any holy way at all, to seek reform.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), p. 19.</span></figcaption>

<blockquote><p>And first, just as all by most holy Baptism have been made members of Christ’s Kingdom and then received the covenant of eternal salvation, [1] so Your Royal Majesty will make a law that orders parents to educate and establish their children in Christ’s faith and obedience with great care, with a just penalty appointed for those who themselves infect their children with either false doctrine or bad morals or permit them to be infected by others. [2] Next, it must provide that they diligently make the Church’s catechism known to them when they are old enough to understand it. For unless the foundation of the Church is firmly laid in early childhood through the catechism of Christ, its upbuilding will proceed very poorly from then on. For those who do not labour with utmost zeal to instruct and train those whom they have consecrated to Christ the Lord in Baptism expose themselves to dire retribution. For those who neglect this when it is in their control snatch back the children whom they have consecrated to the Lord and hand them over to the dominion of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 280.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And first, just as all by most holy Baptism have been made members of Christ’s Kingdom and then received the covenant of eternal salvation, [1] so Your Royal Majesty will make a law that orders parents to educate and establish their children in Christ’s faith and obedience with great care, with a just penalty appointed for those who themselves infect their children with either false doctrine or bad morals or permit them to be infected by others. [2] Next, it must provide that they diligently make the Church’s catechism known to them when they are old enough to understand it. For unless the foundation of the Church is firmly laid in early childhood through the catechism of Christ, its upbuilding will proceed very poorly from then on. For those who do not labour with utmost zeal to instruct and train those whom they have consecrated to Christ the Lord in Baptism expose themselves to dire retribution. For those who neglect this when it is in their control snatch back the children whom they have consecrated to the Lord and hand them over to the dominion of Satan.”

</figure><figure class="quote" id="q-698ad15ccf" data-kw="">
<blockquote><p>When addressing the House of Commons, the Westminster divines pointed out that the “ignorant” were to be barred from communion. This is also taught in the Larger Catechism, Q&amp;A 173. There has, however, been some debate as to precisely what this refers to. Judging by other sources it would appear that “points of lesser concernment” referred to extra-confessional issues, at least this appears to be how the stricter Covenanters received the Westminster standards (see here). What is interesting to note here is that the divines thought that ignorance concerning the sacraments was enough to warrant suspension from the Lord’s Table:

The Assembly of Divines, having received an Order from this Honourable House, requiring them to expresse the particulars of that Ignorance &amp; Scandall, for which they conceive, that some persons ought to be suspended from the communion, do humbly present their sense both of the one &amp; of the other, in manner following.

[1.] By Ignorance, we mean, not all weaknesse of Knowledge, or the want of knowledge of points of lesser concernment to all sorts: But a want of a competent measure of Understanding in the Grounds &amp; principles of Religion layd down in the holy Scriptures, particularly in these, concerning God, the Father, Sonne, &amp; Holy Ghost; the state of man by Creation, &amp; by his fall; the Redemption by Jesus Christ; the way &amp; means to apply Christ &amp; his benefits; the nature &amp; necessity of Faith, Repentance &amp; a godly life; the nature &amp; use of the Sacraments; &amp; the condition of man after this life. […]

3. When any are found guilty of such Ignorance, or such Scandalls, we humbly conceive they ought to be suspended from the Communion, until they give sufficient proofe of their knowledge &amp; of their Repentance: The tryall of all which, we humbly conceive, is to be referred to the Eldership of the particular Congregation, of which any are reputed members; it being impossible to make such an enumeration of all particulars, as may be universally applicable to all persons and cases.

4. In this we have been the more bold to present our humble desires to the Honourable Houses, because other Reformed churches do in this manner take a triall of the knowledge of all those that would come to the Lords Supper, before they do admit them, &amp; withhold such as are found ignorant, as also those that are found scandalous, from the sacrament, untill they have sufficient proofe of the knowledge of the one sort, &amp; the Repentance of the other.

5. In the managing of all which, the Eldership is to proceed with all christian moderation &amp; prudence: And in case any person should be injured herein, there is a Remedy by the subordination of Assemblyes.

William Twisse prolocutor

Henry Roborough. Scriba

Adoniram Byfield scriba</p></blockquote>

<blockquote><p>The Westminster Assembly instructed the Houses of Parliament to see that Anabaptist and Antinomian errorists were restrained:

[…] (4) That all Ministers who teach or divulge, Baptizing of Infants to bee unlawful, The Morall law to be no rule for a Christian to walke by, That the Ministers of the Church of England are no true Ministers, &amp; their churches no true churches, That Seperation from them is necessary, &amp; churches to be gathered out of those churches, That power of Ordination belongeth to the people without officers, That fixed Assemblies &amp; a settled ministry in them are not necessary, That liberty is to bee given to all opinions &amp; sorts of Worship, &amp; That the Civill Magistrate hath noe power to restrain them, or any other points of Anabaptisme &amp; Antinomianisme, bee commanded to bring in the grounds &amp; reasons of their opinions in a brief &amp; compendious manner in writing under their hands unto the Assembly, or such as the Honourable Houses of Parliament shall appoint to be examined according to the Word of God: &amp; in the mean time be commanded to forbear all teaching, printing, or other wise divulging of them. […]

Henry Robrough Scriba.

Adoniram Byfield scriba</p></blockquote>

<blockquote><p>Q. What is Baptism?

A. A Sacrament of Regeneration, wherein by the outward washing of the body with water in the name of the Father, the Son, and the Holy Ghost, the inward cleansing of our souls by the blood of Christ is represented and sealed up unto us.

Q. Who are to be baptized?

A. They who in charity may be thought to be in the Covenant.

[Q.] Who are they?

A. Both all that profess themselves to be of the Christian faith, and also their children.

Q. What ground have we to judge the children of Christians to be in the Covenant?

A. The extent of God’s promise which reacheth even to them.

Q. How oft may one be baptized?

A. Only once: for once only we are born again and engrafted into Christ.</p></blockquote>

<blockquote><p>For what purpose, then, does the Reformed Presbyterian Church exist? And what is the advantage of having a Theological Hall in connection with our Church? If we wish only to be Christian in our profession and position as a Church, why not join, or allow ourselves to be absorbed by, some of the Christian Churches around us? Our reply is, We occupy a separate position as a church because we desire, we trust sincerely, to realise a fully Christian ideal of universal subjection to Christ our King on our part, and to extend the knowledge and appreciation of that ideal among the churches around us. We could not join any one of these churches without doing that which would be, from our point of view, equivalent to disobeying some of the Commandments of Christ, or opposing or disregarding some part of His authoritative revelation, and so coming short of the Christian ideal. Not that we charge any of the churches with deliberate or conscious disobedience; but that we find, in point of fact, that some of the most important principles of Christ’s truth – notably the principle of His rightful dominion as Mediator over the Church and over the nation – are allowed to fall into abeyance or into oblivion, at least in all the larger Evangelical Churches.

Passing, in the meantime, the principle of Christ’s absolute authority in His Church – a principle which is being constantly violated by the introduction of audacious inventions of man into Divine worship, and by the pushing of Christ’s own authoritative institutions into a corner – and looking at the principle of His Headship over the nation, we may conclude, without any tedious process of reasoning, that the church which sees Christ’s law set aside by the nation, and His authority rejected, and His Kingly rights trampled in the mire with disdain by every petty enemy, the church that admits and even argues for the principle that enemies of Christ have a right to be constituent members in that society in which God has declared that Christ has a right to be the Head, and in which therefore the will of Christ is the supreme and ultimate authority – the church that sees this monstrous wrong done to Christ, and stands by for generations without uttering one word of fearless denunciation, and without doing one single deed the object of which is to bring the nation back to the throne of Christ in dutiful allegiance, has not, in this respect at least, a broad or intelligent or conscientious conception of Christian duty.

We need, therefore, to maintain our denominational position that we may continue to utter a clear and faithful testimony for Christ the King, and to utter it all the more clearly and faithfully as others continue to become more careless about the fearful rebellion of the nation against Him, or to become more impatient of the restraints of our testimony against their criminal neglect. And as our Church must continue to exist, our Theological Hall must exist, not only that the doctrines of Evangelical Christianity generally may be taught and embraced, but also that the candidates for the ministry on leaving the Hall may go forth under the solemn and joyful conviction that Christ is “King of kings and Lord of lords,” and that minister is the King’s ambassador to be guided by the King’s will, and to labour for the world-wide acknowledgment of the King’s reign.</p></blockquote>

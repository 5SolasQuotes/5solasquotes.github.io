</figure><figure class="quote" id="q-829674cc1a" data-kw="">
<blockquote><p>James Fergusson, an early Covenanter minister, explains that the Sectaries adopted a latitudinarian view of admission to communion, thinking that church censure only applied to deniers of fundamental doctrines. Conversely, the Presbyterian Covenanter position was that those who persist in unconfessional error are to be subjected to ecclesiastical discipline:

A Church Toleration is, That whereby it is pleaded that Error and Heresy should have liberty to be vented and go free even from Church Censure; such as suspension from the Sacraments or Excommunication. There are but few Sectaries of any note that plead for Toleration in this Latitude, and that because the Scripture is so plain against it, Paul says, An Heretic after the first and second Admonition reject. Therefore they are content that Church-censures such as Excommunication be inflicted on Heretics, providing, First, that they be free from Civil censure. Secondly, That Excommunication be inflicted for no Error, but for these that are contrary to fundamental points of Truth, or as some say contrary to the very light of Nature: Upon these and no other will they have excommunication to strike.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors of toleration, Erastianism, Independency and separation. Delivered in some sermons from I John 4.1. Preached in the year 1652. To which are added four sermons preached on several occasions</cite>, (1652; Edinburgh, 1692), p. 49.</span></figcaption>

</figure><figure class="quote" id="q-23a2ba3197" data-kw="">
<blockquote><p>It must not be omitted that princes are not only referred to in holy writings as deacons or ministers of God, but also as pastors. Ezekiel complained heavily of this, for these pastors cruelly and perversely fed the people [Ezekiel 34]. Homer called his king Agamemno, “shepherd of the people”. These pastors should not behave like soldiers or mercenaries, oppressing and skinning the people, but they should serve as shepherds. Princes are called fathers, for the Romans called their senators patres conscripti, “enlisted fathers.” Nor was there a greater or more ancient honour in the Commonwealth than to be called pater patriae, “father of the homeland.” Therefore, the divine commandment “Honour your father and your mother” must also apply to princes, who should give paternal adoration in return [Exodus 20:12]. Princes should never forget that they do not rule over beasts but over men, and that they themselves are also men. They should therefore be much better and superior to those men whom they rule. Otherwise, they are not fit to rule. We do not give any sheep command over the other sheep. It is given to a ram, and then to a shepherd above him. Just as a shepherd rules the sheep, so is a magistrate commissioned to rule his people. Therefore, magistrates should surpass their people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>When addressing the Belfast Anti-Slavery Society in September 1840, a man by the name of Captain Stewart pointed out that the Covenanters were the only “Protestant” communion in the United States who did not practice the heresy of racial segregation in their churches:

[…] In the city of New York, a person who has one drop of Negro blood in his veins would not be admitted as a free sitter into any of the churches except the Covenanter, the Quaker, and Roman Catholic Churches. […]</p></blockquote>

</figure><figure class="quote" id="q-3beecfb726" data-kw="">
<blockquote><p>Often in religious history, ostensible theological “orthodoxy” has been used as a cloak for maliciousness. This is nowhere more evident than in the proslavery advocates among the Old School Presbyterians in antebellum America; although there were some who did not bow the knee to Baal on this issue, nevertheless, the position of Old School Presbyterians on slavery was often a disgrace to the Reformed faith (this was partly due to the Voluntaryism, which often led to an ungodly silence on political matters). The American Covenanter, James M. Willson, describes how little they did for the cause of emancipation and also chides the Free Church of Scotland for having fellowship with such a denomination:

In the Old School, of late years, the subject [abolition] is nearly unheard of. It has, as a body, no concern for the liberties of the coloured race. Its voice is never lifted up in condemnation and warning. Even while politicians are denouncing the system all around them as an infraction of God’s law, and a wholesale violation of Christian charity, this church “passes by on the other side.” I know of no body of professing Christians, so hopelessly wedded to this monstrous system of wrong as the Old School Presbyterians. And you will allow me to say, that a generation will not repair the injury done to the cause of human rights by the lukewarm course of the Free Church, in their late correspondence with this denomination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-m-willson.html">James M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Monitor and Missionary Chronicle of the Reformed Presbyterian Church in Ireland, May 1849, p. 437.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-71c0dc2498" data-kw="">
<blockquote><p>In 1834 one of the Belfast newspapers contained the following announcement of the opening of a new covenanting meeting-house in the town. The newspaper was Anglican and politically conservative in outlook, yet it recognised the liberality of the Covenanters:

The new Meeting-house of the Second Congregation of the Reformed Presbyterians, commonly called Covenanters, lately erected in South College-street, in this town, is to be opened for public worship, on Sunday next, at two o’clock afternoon. The congregation, although small, have very spiritedly contributed nearly one-half the cost of the building of this plain, but very neat place of worship. It is not, we believe generally known that the Covenanters support their own poor, and they also very liberally contribute to works of general benevolence. They receive no aid from Government to assist in paying their Clergymen. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/guardian-and-constitutional-advocate.html">Guardian and Constitutional Advocate</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 22 Aug. 1834</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>Many evangelicals think that you can be a Christian while treating the church as an optional extra. The Reformed faith denies this, and so the Westminster Confession teaches that outside the visible church there is no ordinary possibility of salvation (WCF 25:2). Likewise, Henry Bullinger expresses the same opinion when he says: ‘Without the church, as it were without the ark of Noe, is no salvation: but in the church, I mean, in the fellowship of Christ and the saints, is full forgiveness of all offences.’</p></blockquote>

<blockquote><p>11. Are there more visible Churches than one?

The term CHURCH is sometimes applied to a particular congregation; [Acts 9:31] sometimes to a particular ecclesiastical judicatory; [Matthew 18:17] to several congregations united under one judicatory; [Acts 8:1] and by reason of the folly of man, there are distinct associations of professed Christians, more or less differing from one another; [1 Cor. 3:3] and, with reference to these, it may be said there are more Churches than one.

12. Do the scripture approve of the erection of distinct churches?

The scriptures recommended, for the more convenient edification of the saints, the erection of distinct congregations, and of distinct judicatories; [Acts 20:41] but it is the sin and loss of professed Christians to establish distinctions which destroy the unity of the visible church; [James 3:16] since, according to the institution of Christ, the CHURCH IS ONE among all nations. [Ephesians 4:3-4]</p></blockquote>

</figure><figure class="quote" id="q-bc667b2099" data-kw="">
<blockquote><p>Regretfully, the Original Seceders did not unite with the Reformed Presbyterians in order to strengthen the covenanting cause against the forces of latitudinarian evangelicalism, liturgical antinomianism, and Romanism. Nevertheless, Thomas Hobart’s comments concerning the need for such unity, made at the Original Secession’s renewal of the covenants in 1873, are still relevant today:

And now that latitudinarian indifference on the one hand, and Popery on the other, are so rapidly increasing, and making such determined efforts to gain the ascendancy in our land, we trust we have this day but the beginning of the drawing together of the covenanting forces, – that the Reformed Presbyterians, who have so long and so nobly testified for the same truths, shall soon become one with us in maintaining a testimony for our glorious second reformation principles, and that as united we shall be the means, in the Spirit’s hand, of beginning to roll back the tide of error, will-worship, and ungodliness that threatens to overwhelm our land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-hobart.html">Thomas Hobart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast</cite>, (Perth, 1874), pp 19-20.</span></figcaption>

<blockquote><p>Church government also was dealt with in the Covenants. This was not thought to be such a trifling matter and so easy of settlement that the corrupt reason of man could decide what the form ought to be. The Covenanters were so humble and so distrustful of self in this, as in all other religious matters, that their appeal for guidance was to the Word of God and to it alone. And so the system of Church government set up was the New Testament, apostolic, simple, and Christ-honouring system of Presbyterianism. […] In this matter even modern opinon will give some slight praise to the Covenanters, and admit that as to the form of church government they were in no way behind their own or any other time.</p></blockquote>

<blockquote><p>I. The acknowledgment of the Scriptures of the Old and New Testaments to be the Word of God, and the only infallible rule of faith and practice.

II. The acknowledgment of the Westminster Confession of Faith, and Catechisms, Larger and Shorter, to be founded upon, and agreeable to, the Word of God.

III. The owning of the Divine right and original of the Presbyterian form of Church Government.

IV. The acknowledgment of the perpetual obligation of our Covenants, National and Solemn League; and, consistently with this, the obligation arising from the renovation of these Covenants by the Reformed Presbyterian Church.

V. The owning of the Scriptural testimonies and earnest contendings of Christ’s faithful witnesses, whether those who suffered under the last persecution, or such as have succeeded them in maintaining the same cause, and especially the Testimony of the Reformed Presbyterian Church.

VI. Practically adorning the doctrine of God our Saviour, by walking in all His commandments and ordinances blamelessly.</p></blockquote>

<blockquote><p>It is with men, and not with angels, that God condescends to enter into covenant. The proposal, however, to engage in covenanting, and the disposition to comply with that proposal on the part of man, and the disposition to comply with that proposal on the part of man, must come from the Lord. For it is not until God takes hold of sinners in the covenant of grace, that they cheerfully give themselves to God in a covenant of duty. The surrender they then make of themselves to God is a complete of entire surrender – a surrender, not in one, but in all the relations of life. Some, indeed, seem to think that whilst the sinner, as regenerated, cheerfully gives himself to God as an individual, as the head or member of a family, as a minister or member in the Church, he does not give, and is not asked to give, himself to God as the head or member of the State. Now, as Christ says, “All power is given to Me, in earth,” every genuine saint, we believe, knows that, so far from making any limitation or reservation when he says, “I am Thy servant, I am Thy servant; Thou hast loosed my bonds,” he unreservedly gives himself to God, at all times, in all circumstances, in all places, and in all relations. Being bought with a price, he esteems it his highest privilege to be permitted to give themselves to God, in the same covenant, as families, as Churches, as nations.</p></blockquote>

<blockquote><p>James Standfield, an Anglican layman and secretary of the Belfast Anti-Slavery Society, was heavily involved in a controversy about the Free Church of Scotland receiving money from and having fellowship with slaveholding churches (this controversy ran from 1844-8). In opposition to the view that American slavery was not sinful and that slaveholders should be admitted to communion, Standfield observed that, “These sentiments, I am happy to say, are repudiated by all the Covenanters in America”.</p></blockquote>

<blockquote><p>George Whitefield is often thought of as the archetypal “evangelical Calvinist”, hence we find his picture on the spine of Banner of Truth books. Moreover, one denomination, which attempts to marry revivalism and Calvinism, even named their theological hall after him. However, it is worth keeping in mind that both the early Reformed Presbyterians and the early Seceders regarded his brand of revivalism as deeply injurious to the covenanted reformation, due to its latitudinarianism and physical manifestations. In other words, they released that evangelicalism and covenanting principles were wholly incompatible. Here is what the Associate Presbytery, when renewing the covenants in 1763, thought of Whitefield’s religious movement:

The sins and provocations of this land are further increased, by the kind of reception that many, both ministers and people, have given to Mr George Whitefield, a professed member and priest of the superstitious church of England, and by the great entertainment that has been given to Latitudinarian Tenets, as further propagated by him and others; whereby any particular form of church-government is denied to be of divine institution, and, under a pretence of catholic love, a scheme is laid for uniting parties of all denominations in church communion, in a way destructive of any testimony for the declarative glory of Immanuel, as Head and King of Zion, and for the covenanted reformation of this church and land: for which a righteous God hath justly chosen their delusions, and sent forth a spirit of delusion among them, in the present awful work upon the bodies and spirits of men. And, tho’ the Lord has been pleased, in his sovereign goodness, to preserve a remnant from being carried off by the above dangerous scheme and awful delusion; yet, while endeavouring to testify against the same before the world, we have not be suitably exercised thereanent before the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/scottish-seceders.html">Scottish Seceders</a></span><span class="wk"><span class="lbl">Work:</span> <cite>for renewing the National Covenant of Scotland, and the Solemn League and Covenant of the three kingdoms in a way and manner agreeable to our present situation and circumstances in this period</cite>, (Glasgow, 1763), pp 34-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-80facc6494" data-kw="">
<blockquote><p>The Covenanters saw that the only cure for Ireland’s ills was the Word of God, and that the darkness of Romanism and all the crime and misery attendant thereon could be banished only by the light of God’s truth. And so they bound themselves that they would “sincerely, really, and constantly, through the grace of God, endeavour the reformation of religion in the Kingdom of Ireland in doctrine, worship, discipline, and government, according to the Word of God and the example of the best reformed Churches.” Does not this show that they were prepared for missionary work, and that the fulfilment of the Covenants would have meant the giving of the Bible to Ireland, as Rome has ever been refusing to give it, and not to Ireland alone but to the heathen nations of the world?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ramsey.html">John Ramsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The British covenants suited to present-day needs</cite>, (Belfast, 1897), p. 17.</span></figcaption>

<blockquote><p>When the Ten Year’s Conflict over state-interference in the Church of Scotland was at its height, eventually resulting in the Disruption and the formation of the Free Church in 1843, the Scottish Reformed Presbyterian Synod issued a number of resolutions at its meeting in Glasgow on 18 May 1842. One of these resolutions pointed out that the current conflict had its roots in the failure of the Glorious Revolution of 1688-9 to live up to the attainments of the Second Reformation:

That besides the objectionable course pursued in the Revolution Settlement with respect to the calling of Ministers, this Synod continue to protest against it as they have heretofore done, inasmuch as it is Erastian in its origin, inconsistent with the obligation of our National Covenants and the Divine right of Presbyterian Church Government, and leaves the whole of the Second Reformation both in Church and State under the condemnation of the Acts Recissory; while the Act of Union not only sanctioned the iniquitous repeal of that glorious work, but brought Scotland under a direct obligation permanently and inviolably to preserve in England the opposite system of Prelacy. And the Synod hold it to be an imperative duty of the Church of Christ, whatever course Statesmen choose to take, faithfully and honestly to homologate the attainments and engagements of the Second Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/londonderry-standard.html">Londonderry Standard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Standard</cite>, 1 June 1842.</span></figcaption>

<blockquote><p>Nor was discipline overlooked in the Covenants. This was regarded as an ordinance of God for preserving the purity of the church and for doing good to the soul that was dealt with. And here also it was the hand of the Lord that was looked for, and guidance was sought from the Word of God. The Covenanters saw clearly that there was no authority in Scripture for throwing open membership in the Church to all who chose to claim it. They saw, too, what so many of the modern sects have failed to see at the beginning of their career, but what all have been before long compelled to admit, and what many who have begun by opposing have ended by abusing – that no church can live without discipline. Errors must be extirpated, and offenders must be excluded. Ecclesiastical “malignants, incendiaries, and evil instruments” must be discovered and brought to trial. And what is it that most of all mars the good name of the church in the world now? It is not the dulness of her worship, nor the rigidity of her government, nor the sterness of her doctrine. It is the fact that so many of her members are the veriest hypocrites, and by their actions wholly belie their profession. It is the lack of discipline that most of all gives the adversary occasion to blaspheme. A wholesome, just and impartial church discipline is one of the crying needs of the present day. And the message of the Covenants is an exactly suitable message.</p></blockquote>

<blockquote><p>On the 12 August 1873, the Scottish and Irish Synods of the Original Seceders renewed the covenants in Belfast. As part of the work of covenant renovation, the Revd Thomas Hobart of Carluke preached on Jeremiah 50:5, “Come let us join ourselves to the Lord in a perpetual covenant that shall not be forgotten.” Applying this text to the peculiar circumstances of a covenant-breaking nation such as the United Kingdom, he reminded his hearers that Britain must repay her debt to the Lord; a debt which she has incurred by setting aside its sacred bonds:

That national covenants which are permanent in their matter are permanent also in their obligation. Covenants that are entered into for the attainment of a particular object, are said to be temporary in their matter, and cease to exist when they object contemplated is gained. Covenants in which men engage to love and serve the Lord, are said to be permanent in their matter, and so must be permanent in their obligation. Such in their matter, are the covenants entered into, at Sinai, at the time specified in our text, and during the two reforming periods in our native land. From the obligation under which they were brought by these deeds, to love and serve the Lord, to take His Spirit as their guide, and His word as their rule of life, the covenanters can never be released. But man covenants in both his individual and in his corporate capacity. His individual obligation ceases with his individual existence. His corporate obligation can cease only with his corporate existence. Now corporate society is viewed alike by God and by man as if it were one individual from the beginning to the end of its corporate existence. The debt, for instance, contracted by the corporate individual at one period of his existence is reckoned as the debt for which he is justly liable at every subsequent period until it is discharged. On this principle, Britain, as a corporate society, is held liable for the debt it as a nation contracted generations ago. On this principle God declares that nations that have been enabled to enter into covenant with Him, are under a special obligation to live for him as long as the national existence is maintained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-hobart.html">Thomas Hobart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast</cite>, (Perth, 1874), pp 16-17.</span></figcaption>

<blockquote><p>Thomas Cartwright, the early Presbyterian Puritan, helps us to understand how to apply the judicial laws of the Old Testament today. The moral-judicials (i.e. punishment of idolaters) simply apply today, as they are natural laws that cannot expire and thus bind all men everywhere (cf. Westminster Confession 19:5). The moral-positive judicials do not literally apply: only the general equity of these judicials is still valid, while the positivistic aspect has expired (cf. WCF 19:4). Below, Cartwright explains the Presbyterian position in distinction to the Prelatic antagonism to the Mosaic judicials:

And as for the judicial law, for as much as there are some of them made in regard of the region where they were given, and of the people to whom they were given, the Prince and the Magistrate keeping the substance and equity of them (as it were the marrow) may change the circumstances of them, as the times, and places, and manners of the people shall require. But to say that any magistrate can save the life of blasphemers, contemptuous and stubborn idolaters, murderers, adulterers, incestuous persons, and such like, which God by his judicial law hath commanded to be put to death, I utterly deny, and am ready to prove, if that pertained to this question. And therefore although the judicial laws are permitted to the discretion of the prince and magistrate, yet not so generally as you seem to affirm, and as I have oftentimes said, that not only must it not be done against the word, but according to the word and by it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thomas Cartwright, the early Presbyterian Puritan, helps us to understand how to apply the judicial laws of the Old Testament today. The moral-judicials (i.e. punishment of idolaters) simply apply today, as they are natural laws that cannot expire and thus bind all men everywhere (cf. Westminster Confession 19:5). The moral-positive judicials do not literally apply: only the general equity of these judicials is still valid, while the positivistic aspect has expired (cf. WCF 19:4). Below, Cartwright explains the Presbyterian position in distinction to the Prelatic antagonism to the Mosaic judicials:

And as for the judicial law, for as much as there are some of them made in regard of the region where they were given, and of the people to whom they were given, the Prince and the Magistrate keeping the substance and equity of them (as it were the marrow) may change the circumstances of them, as the times, and places, and manners of the people shall require. But to say that any magistrate can save the life of blasphemers, contemptuous and stubborn idolaters, murderers, adulterers, incestuous persons, and such like, which God by his judicial law hath commanded to be put to death, I utterly deny, and am ready to prove, if that pertained to this question. And therefore although the judicial laws are permitted to the discretion of the prince and magistrate, yet not so generally as you seem to affirm, and as I have oftentimes said, that not only must it not be done against the word, but according to the word and by it.”

— Thomas Cartwright, , A reply to an answer made of M. Doctor Whitgift, against the admonition to the parliament, (Hemel Hempstead, 1573), p. 22.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThomas+Cartwright%2C+the+early+Presbyterian+Puritan%2C+helps+us+to+understand+how+to+apply+the+judicial+laws+of+the+Old+Testament+today.+The+moral-judicials+%28i.e.+punishment+of+idolaters%29+simply+apply+today%2C+as+they+are+natural+laws+that+cannot+expire+and+thus+bind+all+men+everywhere+%28cf.+Westminster+Confession+19%3A5%29.+The+moral-positive+judicials+do+not+literally+apply%3A+only+the+general+equity+of+these+judicials+is+still+valid%2C+while+the+positivistic+aspect+has+expired+%28cf.+WCF+19%3A4%29.+Below%2C+Cartwright+explains+the+Presbyterian+position+in+distinction+to+the+Prelatic+antagonism+to+the+Mosaic+judicials%3A%0A%0AAnd+as+for+the+judicial+law%2C+for+as+much+as+there+are+some+of+them+made+in+regard+of+the+region+where+they+were+given%2C+and+of+the+people+to+whom+they+were+given%2C+the+Prince+and+the+Magistrate+keeping+the+substance+and+equity+of+them+%28as+it+were+the+marrow%29+may+change+the+circumstances+of+them%2C+as+the+times%2C+and+places%2C+and+manners+of+the+people+shall+require.+But+to+say+that+any+magistrate+can+save+the+life+of+blasphemers%2C+contemptuous+and+stubborn+idolaters%2C+murderers%2C+adulterers%2C+incestuous+persons%2C+and+such+like%2C+which+God+by+his+judicial+law+hath+commanded+to+be+put+to+death%2C+I+utterly+deny%2C+and+am+ready+to+prove%2C+if+that+pertained+to+this+question.+And+therefore+although+the+judicial+laws+are+permitted+to+the+discretion+of+the+prince+and+magistrate%2C+yet+not+so+generally+as+you+seem+to+affirm%2C+and+as+I+have+oftentimes+said%2C+that+not+only+must+it+not+be+done+against+the+word%2C+but+according+to+the+word+and+by+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+%2C+A+reply+to+an+answer+made+of+M.+Doctor+Whitgift%2C+against+the+admonition+to+the+parliament%2C+%28Hemel+Hempstead%2C <blockquote><p>Neo-Confederate mythology would have us believe that the only people who opposed Southern slavery were Unitarians, Jacobins and infidels. Historical reality is rather different, as the American Covenanters’ debarred slaveholders. Here is an extract from the minutes of the Reformed Presbytery in 1800:

In the Fall of 1800. — A call was made on Mr. McLeod to the pastoral charge of the united congregations of the city of New York and Coldenham. Mr. McLeod demurred to the call, on the ground that there were slaveholders among the subscribers to the call. The subject of slaveholding being now before the Presbytery, it was enacted that no slaveholder should be allowed the communion of the Church.</p></blockquote>

<blockquote><p>Speaking before the General Assembly of the Free Church of Scotland in 1849, the Revd Dr Henry Cooke of the Presbyterian Church in Ireland reminded his Scottish brethren that Ulster Presbyterians originally adhered to the Solemn League and Covenant:

Permit me then, in the first place, to remind you of what you know full well, that our origin as a Church is from you. We owe to the honoured names of Blair, and Livingstone, and Cunningham, and Hamilton – those great and distinguished names – the foundation of our Church, as in a great degree to those names you give the honour of your own. (Hear.)

In the second place, permit me to remind you that our Church grew up as a Church under the same Solemn League and Covenant with yours. I examined this day, in one of your houses of record, an original of one of those documents signed by the mighty of your land. Under the name Solemn League and Covenant with yourselves, the Presbyterians of Ulster grew up by the blessings of Almighty God …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-cooke.html">Henry Cooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commercial Chronicle</cite>, 2 June 1849.</span></figcaption>

</figure><figure class="quote" id="q-e7baccd699" data-kw="">
<blockquote><p>Although some think that they can claim a historical link with the Second Reformation Church of Scotland without acknowledging the covenants of the seventeenth-century, this supposition is a-historical. This is because in 1640 the General Assembly of the Scottish Kirk made it an ex-communicable offence not to adhere to the National Covenant (which, incidentally, proves that the early Covenanters believed in close communion/confessional membership):

The Assembly ordains, that such as have subscribed the Covenant and speaks against the same, if he be a Minister, shall be deprived: And if he continue so, being deprived, shall be excommunicate: And if he be any other man, shall be dealt with as perjured, and satisfy publikely [sic] for his perjury.</p></blockquote>

</figure><figure class="quote" id="q-3c413d8d35" data-kw="">
<blockquote><p>Self-righteous people, who think that they are to be saved by their own works, have no business to come to the Lord’s Table. Strange as it may sound at first, these persons are the least qualified of all to receive the Sacrament. They may be outwardly correct, moral and respectable in their lives, but so long as they trust in their own goodness for salvation, they are entirely in the wrong place at the Lord’s Supper.

For what do we declare at the Lord’s Supper? We publicly profess that we have no goodness, righteousness, or worthiness of our own, and that all our hope is in Christ. We publicly profess that we are guilty, sinful, and corrupt, and naturally deserve God’s wrath and condemnation. We publicly profess that Christ’s merit and not ours, Christ’s righteousness and not ours, is the alone cause why we look for acceptance with God. Now what has a self-righteous man to do with an ordinance like this? Clearly nothing at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), p. 137.</span></figcaption>

<blockquote><p>The Divine Wisdom which found it expedient for man before the Fall, not to live alone, hath made it much more needful for man to live in Society after his weakening by sin; Woe to him that is alone, for if he fall who shall raise him up? The best wits of themselves are prone to errors and miscarriages, and left alone, are inclined to run on in any evil way they have once begun: But engagement in fellowship, especially with the Saints, is a preservative against the beginnings of evil, and a retractive therefrom when begun. Every gracious neighbour is a Counsellor and Pedagogue, the greater the incorporation is of such, the better is every Member directed and the more strengthened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), p. 196.</span></figcaption>

</figure><figure class="quote" id="q-5497843023" data-kw="">
<blockquote><p>If, therefore, magistrates command that which is prejudicial to the general welfare of the society, or dishonourable to God, the Supreme Governor of it, they ought to be disobeyed. And, if they be habitually cruel and tyrannical, they ought to be resisted and deposed, if circumstances permit.

1. When the great body of the subjects are much alienated in affection, a revolution may be accomplished without much hazard or hurt.

2. By resisting tyrannical princes in proper circumstances, nations have often preserved their lives as well as their liberties from impending ruin.

3. Such resistance, prudently managed, is an effectual warning to other magistrates to beware of abusing and opposing their subjects.

4. In mixed forms of government, the propriety of resistance is most clear as well as most easy: as when a parliament resists a king, or a king resists a parliament, in defence of the common liberties of the nation. – Nevertheless, as princes are exposed to many and uncommon difficulties, and are apt to be imposed on by their confidents:- and as their real designs are not easily penetrated, and often not to be pried into by their subjects; – and as resistance ordinarily occasions much bloodshed and misery, – subjects ought to put the best construction upon the conduct of their governors that it can justly admit, – and never proceed to violent measures but where it is absolutely necessary, and where there is an hopeful prospect of success.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious View of Natural and Revealed Religion</cite>, (1782; Fearn: Christian Focus, 2002), pp 23-24.</span></figcaption>

</figure><figure class="quote" id="q-5d63c12f3b" data-kw="">
<blockquote><p>My Brethren and I, that have had Occasion here to confer about you, see a Beauty in the Providence of your being in Communion with the English Church; otherwise such great Confluences from among them, had not attended your Ministry, nor consequently received the Benefit, or reaped the Advantage by it, which so many of them have done.

And tho’ infinite Wisdom has made and may yet make this an alluring Bait to draw them forth; yet as England’s Reformation at first (from Popery and its superstitious and ceremonial Services) however great and glorious, was far from being to full as that of some other Protestant Churches, particularly that of Scotland; so we would fain hope, that, when a new and general Reformation shall be set on Foot, some more at least of the Rags of that Romish Church will be dropp’d, such as (abstracting at present from the Subject of Church-Government) many useless Rites and Customs relating to Worship, that have no scriptural Foundation.

This is what some of the most pious and eminent Divines of your Communion, have wished to see reformed, knowing that many of these were retained at first, only under a View of Reforming gradually, and from some prudential Considerations; and knowing also that the continued Retaining of these Things, which the reforming Fathers designed gradually to cast off, has been more stumbling to the Friends, than ever it was gaining to the Enemies of the Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-47d8008cc9" data-kw="">
<blockquote><p>I would desire to persuade you to humility from this, according to the lesson Christ gives us, Matt. xi. 29, “Learn of me, for I am meek and lowly.” And the apostle makes singular use of this mystery of the abasement of the Majesty, to abate from our high esteem of ourselves, Phil. ii. 3-6. O should not the same mind be in us that was in Christ! God abased, man exalted,—how unsuitable are these, think you! God lowly in condition and disposition, and man, though base in condition, yet high in his deposition and in his own estimation! What more mysterious than God humbled? And what more monstrous than man proud? Truly, pride is the most deformed thing in a man, but in a Christian it is monstrous and prodigious.

If he did humble himself out of charity and love, who was so high and glorious, how should we humble ourselves out of necessity, who are so low and base? And out of charity and love too, to be conformed and like unto him! Nature may persuade the one, but Christianity teacheth the other,—to be lowly in mind, and esteem every one better than ourselves. To be meek, patient, long-suffering, reason may persuade it, upon the consideration of our own baseness, emptiness, frailty, and nothingness. But this lesson is taught in Christ’s school, not from that motive only,—the force of necessity, but from a higher motive,—the constraint of love to Jesus Christ,—“learn of me.” Suppose there were no necessity of reason in it, yet affection might be a stronger necessity to persuade conformity to him, and following his example, who became so low, and humbled himself to the death even for us.</p></blockquote>

<blockquote><p>I. Who are to be considered as the proper subjects of Christian baptism?

That baptism ought to be administered to all adult persons, who profess faith in Christ, and obedience to him, and who have not been baptized in their infancy, is not doubted by any. In this all who consider baptism as an ordinance at present obligatory are agreed. But it is well known that there is a large and respectable body of professing Christians among us who believe, and confidently assert, that baptism ought to be confined to adults; who insist, that when professing Christians bring their infant offspring, and dedicate them to God, and receive for them the washing of sacramental water in the name of the Father, and of the Son, and of the Holy Ghost, they entirely pervert and misapply an important Christian ordinance.

We highly respect the sincerity and piety of many who entertain these opinions; but we are perfectly persuaded that they are in error, nay in great and mischievous error; in error which cannot fail of exerting a most unhappy influence on the best interests of the church of God. We have no doubt that the visible church is made up, not only of those who personally profess the true religion, but also of their children; and that we are bound not only to confess Christ before men for ourselves, but also to bring our infant seed in the arms of faith and love, and present them before the Lord, in that ordinance which is at once a seal of God’s covenant with his people, and an emblem of those spiritual blessings which, as sinners, we and our children equally and indispensably need.

Our reasons for entertaining this opinion, with entire confidence, are the following:

1. Because in all Jehovah’s covenants with his professing people, from the earliest ages, and in all states of society, their infant seed have been included. That this was the case with regard to the first covenant made with Adam in paradise, is granted by all ­ certainly by all with whom we have any controversy concerning infant baptism. And indeed the consequences of the violation of that covenant to all his posterity, furnish a standing and a mournful testimony that it embraced them all. The covenant made with Noah, after the deluge, was, as to this point, of the same character. Its language was, “Behold, I establish my covenant with you and with your seed” (Gen. 9:9).

The covenant with Abraham was equally comprehensive. “Behold,” says Jehovah, “my covenant is with thee.” Behold, “I will establish my covenant between me and thee and thy seed after thee” (Gen. 17:4, 7).

The covenants of Sinai and of Moab, it is evident, also comprehended the children of the immediate actors in the passing scenes, and attached to them, as well as to their fathers, an interest in the blessings or the curses, the promises or the threatenings which those covenants respectively included. Accordingly, when Moses was about to take leave of the people, he addressed them as “standing before the Lord their God, with their little ones, and their wives, to enter into covenant with the LORD their God” (Deut. 29:10-12).

And when we come to the New Testament economy, still we find the same interesting feature not only retained, but more strikingly and strongly displayed. Still the promise, it is declared, is “to us and our children, even as many as the Lord our God shall call” (Acts 2:39).

Now, has this been a feature in all Jehovah’s covenants with his people in every age? And shall we admit the idea of its failing in that New Testament or Christian covenant, which, though the same in substance with those which preceded it, excels them all in the extent of its privileges, and in the glory of its promises? It cannot be.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I. Who are to be considered as the proper subjects of Christian baptism?

That baptism ought to be administered to all adult persons, who profess faith in Christ, and obedience to him, and who have not been baptized in their infancy, is not doubted by any. In this all who consider baptism as an ordinance at present obligatory are agreed. But it is well known that there is a large and respectable body of professing Christians among us who believe, and confidently assert, that baptism ought to be confined to adults; who insist, that when professing Christians bring their infant offspring, and dedicate them to God, and receive for them the washing of sacramental water in the name of the Father, and of the Son, and of the Holy Ghost, they entirely pervert and misapply an important Christian ordinance.

We highly respect the sincerity and piety of many who entertain these opinions; but we are perfectly persuaded that they are in error, nay in great and mischievous error; in error which cannot fail of exerting a most unhappy influence on the best interests of the church of God. We have no doubt that the visible church is made up, not only of those who personally profess the true religion, but also of their children; and that we are bound not only to confess Christ before men for ourselves, but also to bring our infant seed in the arms of faith and love, and present them before the Lord, in that ordinance which is at once a seal of God’s covenant with his people, and an emblem of those spiritual blessings which, as sinners, we and our children equally and indispensably need.

Our reasons for entertaining this opinion, with entire confidence, are the following:

1. Because in all Jehovah’s covenants with his professing people, from the earliest ages, and in all states of society, their infant seed have been included. That this was the case with regard to the first covenant made with Adam in paradise, is granted by all ­ certainly by all with whom we have any controversy concerning infant baptism. And indeed the consequences of the violation of that covenant to all his posterity, furnish a standing and a mournful testimony that it embraced them all. The covenant made with Noah, after the deluge, was, as to this point, of the same character. Its language was, “Behold, I establish my covenant with you and with your seed” (Gen. 9:9).

The covenant with Abraham was equally comprehensive. “Behold,” says Jehovah, “my covenant is with thee.” Behold, “I will establish my covenant between me and thee and thy seed after thee” (Gen. 17:4, 7).

The covenants of Sinai and of Moab, it is evident, also comprehended the children of the immediate actors in the passing scenes, and attached to them, as well as to their fathers, an interest in the blessings or the curses, the promises or the threatenings which those covenants respectively included. Accordingly, when Moses was about to take leave of the people, he addressed them as “standing before the Lord their God, with their little ones, and their wives, to enter into covenant with the LORD their God” (Deut. 29:10-12).

And when we come to the New Testament economy, still we find the same interesting feature not only retained, but more strikingly and strongly displayed. Still the promise, it is declared, is “to us and our children, even as many as the Lord our God shall call” (Acts 2:39).

Now, has this been a feature in all Jehovah’s covenants with his people in every age? And shall we admit the idea of its failing in that New Testament or Christian covenant, which, though the same in substance with those which preceded it, excels them all in the extent of its privileges, and in the glory of its promises? It cannot be.”

99s+covenants+with+his+people+in+every+age%3F+And+shall+we+admit+the+idea+of+its+failing+in+that+New+Testament+or+Christian+covenant%2C+which%2C+though+the+same+in+substance+with+those+which+preceded+it%2C+excels+them+all+in+the+extent+of+its+privileges%2C+and+in+the+glory+of+its+promises%3F+It+cannot+be.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+Infant+Baptism+Scriptural+and+Reasonable%3A+And+Baptism+by+Sprinkling+or+Affusion+the+Most+Suitable+and+Edifying+Mode%3A+In+Four+Discourses%2C+%28Philadelphia%3A+Joseph+Whetman%2C+1835%29%2C+pp+14-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7773e3dadd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7773e3dadd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/27/samuel-miller-on-baptism-and-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>But they are confident that they have invincible objections for excommunicating the calling of princes from the church and from all hope of salvation in citing several passages, badly misunderstood, which they imprudently turn in their favour. First of all, they cite that our Lord Jesus did not order that the woman who was caught in adultery be stoned to death, as the law of God requires. Rather He had mercy on her, saying, “Go and sin no more” (John 8:11).

Before replying, I ask but one question. They say that the ban has replaced the temporal sword in the Christian church, so much so that in place of punishing a crime by death as was formerly done, today we must punish the delinquent by depriving him of the fellowship of believers. Thus I ask them, how do they excuse Jesus Christ for what He has done? For He did not observe their rule. For He neither condemned the woman by banishing her from the fellowship of believers nor condemned her to death. Thereby we already see what poor scatterbrains they are, speaking without reason.

Now I come to the true solution that is quite easy. It is to note that these poor fools in this passage follow that exposition with which the papal priests feather their nests. For since marriage was prohibited them, they wanted as a recompense a licence to commit adultery. Thus they borrowed the wives of their neighbours. Now in order for it not to appear that adultery was such a great sin, they said that we should be under the law of grace of Jesus Christ in anything, they said adulterers should go unpunished.

These poor people, as I have said, follow them. And thus they experience what Jesus Christ said, that “if a blind man leads another, both fall into the pit” (Matt. 15:14; Luke 6:39). …

In sum, the action which our Lord Jesus took toward the adulteress is nothing other than what His servants and ministers of His Word take today toward all malefactors. For they only try to exhort them to repent and to turn around on the right road. Then they comfort their consciences by presenting them with the grace of our Lord Jesus and by assuring them of the remission of sins. They do not attempt to punish them. Such does not belong to them. But they do not stand in the way of justice doing what it must.

In summary, let us understand the office of our Lord Jesus, and we will surmount any difficulties. His office is to forgive sins and to address His Word to the consciences of sinners. To mete out corporal punishments is not His task, but He leaves these to those to whose authority it belongs and to whom the charge has been commissioned, according to what He says in another text: “Render to Caesar the things that are Caesar’s” (Matt. 22:21).</p></blockquote>

</figure><figure class="quote" id="q-a18f08e0ca" data-kw="">
<blockquote><p>I seek not to obtrude unto you any private opinion of mine own; the best learned in our profession are of this judgement, that all the corruptions of the Church of Rome, do not prove her to deny the foundation directly; if they did, they should grant her simply to be no Christian Church. But I suppose, saith one, that in the Papacy some Church remaineth, a Church crased [cracked], or, if you will, broken quite in pieces, forlorn, mishapen, yet some Church: his reason is this, Antichrist must sit in the Temple of God.

Least any man should think such sentences as these to be true, only in regard of those, whom that Church is supposed to have kept by the special providence of God, as it were in the secret corners of his bosom, free from infection, and as sound in the faith, as we trust, by his mercy, we our selves are: I permit it to your wise considerations, whether it be more likely, that as frenzy, though it self take away the use of reason, doth notwithstanding prove them reasonable creatures which have it, because none can be frantic but they: so Antichristianity being the bain, and plain overthrow of Christianity, may nevertheless argue the Church wherein Antichrist sitteth, to be Christian.</p></blockquote>

<blockquote><p>For the power of faith, or rather of God in the Word and in the Sacraments from Whom we have faith, is such that it rises to Heaven; it does not make the body of Christ descend and return from Heaven, for He shall remain there until He comes to judge the living and the dead, as Scripture testifies (Acts 3:21); and faith does not wish, nor can wish to contradict this.

But this power is such that faith rises to Heaven in founding itself upon the promises of God; there, in all truth, it unites and, so to speak, incorporates to Christ those in whose heart it dwells. This is the reason why, in the liturgy which the early Church observed, this phrase was in use: “Lift up your hearts!” This was to exhort the believers not to linger over and cleave to the external signs, but rather to use them as ladders, to climb up to Christ who is in Heaven.</p></blockquote>

<blockquote><p>What an effect would be produced on an unbelieving world if a better spirit were more prevalent; if Churches, though distinguished by trivial peculiarities, regarded each other with brotherly affection; if one form of polity, admitting of fraternal correspondence, were embraced by all true Christians; and if the soldiers of the cross presented the appearance of one great army, all trained in the discipline of integrity and truth, all animated by the same spirit, and all displaying a united front to the common foe!

Now the Church is split up into countless sections; her divisions are fitted to make a most unfavourable impression on all who are without; her visible appearance, instead of being an inviting, and instructive, and edifying spectacle, is rather fitted to discourage, to puzzle, and to repel. She is now as a house divided against itself; her most valiant men of war, instead of bearing down with all their might on the enemy, often turn their arms against each other; and thus her energies are frequently expended in the strife of internal discord. No wonder, under these circumstances, that Christianity, in relation to the world lying in wickedness, has been so little aggressive.</p></blockquote>

v>

<blockquote><p>For by faith Abel offered unto God a greater sacrifice than Cain; by the which he obtained witness that he was righteous, God testifying of his gifts: by the which faith also he being dead, yet speaketh.” Hebrews 11:4 (Geneva Bible)

Hence we learn that the church militant is a mixed and compounded company of men – not of one sort, but true believers and hypocrites mingled together, as here in the very infancy of the church there was Cain worshipping in show as well as Abel that worshipped in truth. So it was in the infancy, so in her perpetual growth. And so it shall be in the last age of the church. The good shall never be quite separated from the bad, until Christ Himself do it at the last judgment. Goats shall always be mingled among the sheep, “till Christ the great shepherd do separate them himself” (Matt. 25:34). And he that imagines a perfect separation till then, imagines a fancy in his brain and such a church as cannot be found upon the earth.

This being so, let no man therefore be afraid to join himself to the visible church, neither let any that are in it go out of it, because the bad are mingled with the good; for so it has been always and ever will be. He then that will go out of a church because there be hypocrites in it must go out of the world, for such a church is not found but triumphant in heaven.</p></blockquote>

<blockquote><p>That we really feed in the Holy Supper on the flesh and blood of Christ, no otherwise than as bread and wine are the aliments of our bodies, we freely confess. If a clearer explanation is asked, we say, that the substance of Christ’s flesh and blood is our spiritual life, and that it is communicated to us under the symbols of bread and wine; for Christ, in instituting the mystery of The Supper, promised nothing falsely, nor mocked us with a vain shew, but represented by external signs what he has really given us.

Now the question rests on the mode of communication; and hence the conflict arises, because we refuse to subscribe to their fancy respecting a local presence. We say, that though Christ is in heaven, yet through the hidden and incomprehensible power of his Spirit, this favor comes to us that His flesh becomes life to us, so that we become flesh of his flesh and bones of his bones. (Ephesians 5:30.) By them, on the contrary, it is maintained, that except Christ comes down on earth, there is no participation.

That they may, however, get rid of the absurdity of a local presence, it has been found necessary to fabricate the strange notion of ubiquity; which, if we think it not possible to reconcile to the principles of faith, we must beg them at least to pardon our ignorance. Here we follow not our own understanding; but according to the knowledge given us from above, we cannot comprehend that it is at all agreeable to Scripture to say that the body of Christ is everywhere. Both Christ himself and His Apostles clearly shew that the immensity of God does not belong to the flesh; a personal union is what they teach; and no one, except Eutyches, has hitherto taught, that the two natures became so blended, that when Christ became man, the attributes of Deity were communicated to his human nature.

I am not indeed disposed to raise an odium against them by means of a man who has been condemned; they are yet to be reminded to think more attentively, and to consider how contention leads astray even good, learned, and acute men, when they are led away only by a desire to defend their own cause. Doubtless the best and the shortest way of confronting Nestorius at the Council of Ephesus would have been to say, that personal union communicates to two natures what is peculiar to each: to adduce this no one thought of doing on account of its absolute absurdity. I therefore greatly wonder that they who oppose us do not consider into what labyrinth they plunge themselves.

For if the infinity of God appertains to the flesh of Christ, because God was manifested in the flesh, with equal reason His Divinity may be said to have grieved and to have been thirsty, and to have been subject to death, and, in short, to have died; for they cannot escape, as it is a similar mode of reasoning. Christ, while yet a mortal, declared that He knew not when the day of judgment would be. Does He not in these words clearly and distinctly ascribe something to His human nature which could not justly be ascribed to His Divinity? What they bring forward as to the communication of properties, it is unreasonable, and what I may say without offending them, they mistake in a matter that is very simple and plain; for to ascribe what is peculiar to Deity to the Son of man, and again to attribute to Deity what belongs only to humanity, is very improper and rash.</p></blockquote>

<blockquote><p>Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition (2 Thessalonians 2:3)

Papists vainly pretend that the pope is the successor of Peter. Granted, the pope is the successor of an apostle. As Thomas Manton points out, however, he derives his succession from the son of perdition, Judas Iscariot:

[2.] The son of perdition, wherein he is likened to Judas: John xvii. 12, ‘None of them is lost but the son of perdition.’ Him he resembleth in covetousness, treachery, and final destruction. The term may be explained either passively, or actively:—(1.) Passively, as one condemned to everlasting destruction; as the ‘son of death,’ is one condemned to die: 2 Sam. xii. 5, ‘He shall be a son of death;’ we translate it, ‘He shall surely die.’ So ‘children of wrath,’ Eph. ii. 3; so here, ‘son of perdition.’

(2.) Actively, bringing destruction upon himself and others; one that shall destroy others, and so he is called ‘Abaddon,’ and ‘Apollyon,’ Rev. ix. 11, and is opposite to Christ, who is ‘the author of salvation.’ Heb. v. 9, but Antichrist of destruction. And let us see the parallel between him and Judas; for the person is a type, as well as the name hath a significancy. Antichrist then is like Judas—in profession, a disciple of Christ; in office, a governor of the church; but in practice, a traitor. As they said of the blind man, John ix. 9, ‘Some said, This is he; others, He is very like him.’ The Pope boasteth that his seat is apostolical, his chair is Peter’s chair, and that he is the successor of the apostle. Grant it, but there is an error of the person—not of Peter, but of Judas. Let us see the parallel:—

(1.) Judas was not a stranger, but a pretended friend and apostle: Acts i. 17, ‘He was numbered with us, and obtained part of this ministry.’ Turks [Muslims] and infidels are enemies to Christ, but Antichrist seeketh to undermine him, under a pretence of friendship; ἀντίχριστος is one in show for, and in effect against Christ, and the beast in the Revelation is said to ‘push with the horns of the lamb.’ Rev. xiii. 11. If he were a professed enemy, what mystery were there in it? But mystery was written upon the woman’s forehead, Rev. xvii. 5; and here, ver. 7, ‘The mystery of iniquity.’ It is wisdom to discern the false prophet, Rev. xiii. 18, but there needeth no great wisdom to discover an open and professed adversary.

(2.) He sold Christ for a small matter. Omnia Romae venalia: pardons, indulgences, freedom from purgatory, all to be bought with money; and it is a small matter, considering the things put to sale, the pardon of sins, the souls of men redeemed with Christ’s precious blood. The antichristian state maketh a market of religion; truth is made to yield to interest and profit.

(3.) Judas betrayed Christ with a kiss, under a pretence of honouring him: Luke xxii. 48, ‘Jesus said unto him, Judas, betrayest thou the Son of man with a kiss?’ Antichrist is a true adversary of Christ, though he pretend to adore him; as those that murdered the present prophets would by all means beautify the tombs of the prophets deceased, and bear a respect to their memories, Mat. xxiii. 30. He pretendeth to be his servant, yea, a servant of servants, but is really his enemy. The apostle telleth us of some that were ‘enemies to the cross of Christ,’ Phil. iii. 18. Who to appearance such friends to the cross as the rabble of nominal Christians? but they are opposers of his spiritual kingdom, the virtue and power of the cross. You have crucifixes every where, painted, carved, gilded; they are ready to worship the cross with a holy worship; they set it in their temples, altars, wear it in their bosoms, and wherever they meet it show it reverence, adorn it with gold, silver, and precious stones. Their popes and prelates have it carried before them; and are not these friends of the cross? No; they live a worldly, sensual life, and all their religion tendeth there unto; therefore enemies of the cross of Christ, because they mind earthly things. This is right antichrist-like, to betray Christ under a colour of adoration.

(4.) Judas was a guide to them that came to take Christ; and one main work of Antichrist is to be a ringleader in persecuting for religion. Christ is in heaven, death hath no more power over him; his natural body is above abuse, but his mystical body still suffereth: Acts ix. 6, ‘Why persecutest thou me?’ Antichrist is the head of the persecuting state, others are his emissaries and agents, to take Christ in his members. It is a politic religion, that must be carried on with worldly artifices, with power and cruelty.

5.) Lastly, The covetousness of Judas is set forth. He was a thief, one that carried the bag, John xii. 6. England, to its bitter cost, knoweth the polling exactions of the Papacy; all its dealings with us were to fill the bag out of this puteus inexhaustus. Now all these things should open our eyes; we may behold the man of sin, the son of perdition; one egg is not more like to another than Judas and Antichrist.</p></blockquote>

5.) Lastly, The covetousness of Judas is set forth. He was a thief, one that carried the bag, John xii. 6. England, to its bitter cost, knoweth the polling exactions of the Papacy; all its dealings with us were to fill the bag out of this puteus inexhaustus. Now all these things should open our eyes; we may behold the man of sin, the son of perdition; one egg is not more like to another than Judas and Antichrist.”

— Thomas Manton, Eighteen Sermons on the Second Chapter of the Second Epistle to the Thessalonians, containing the description, rise, growth, and fall of Antichrist, with divers cautions and arguments to establish Christians against the Apostasy of the Church of Rome, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 32-33.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLet+no+one+deceive+you+by+any+means%3B+for+that+Day+will+not+come+unless+the+falling+away+comes+first%2C+and+the+man+of+sin+is+revealed%2C+the+son+of+perdition+%282+Thessalonians+2%3A3%29%0A%0APapists+vainly+pretend+that+the+pope+is+the+successor+of+Peter.+Granted%2C+the+pope+is+the+successor+of+an+apostle.+As+Thomas+Manton+points+out%2C+however%2C+he+derives+his+succession+from+the+son+of+perdition%2C+Judas+Iscariot%3A%0A%0A%5B2.%5D+The+son+of+perdition%2C+wherein+he+is+likened+to+Judas%3A+John+xvii.+12%2C+%E2%80%98None+of+them+is+lost+but+the+son+of+perdition.%E2%80%99+Him+he+resembleth+in+covetousness%2C+treachery%2C+and+final+destruction.+The+term+may+be+explained+either+passively%2C+or+actively%3A%E2%80%94%281.%29+Passively%2C+as+one+condemned+to+everlasting+destruction%3B+as+the+%E2%80%98son+of+death%2C%E2%80%99+is+one+condemned+to+die%3A+2+Sam.+xii.+5%2C+%E2%80%98He+shall+be+a+son+of+death%3B%E2%80%99+we+translate+it%2C+%E2%80%98He+shall+surely+die.%E2%80%99+So+%E2%80%98children+of+wrath%2C%E2%80%99+Eph.+ii.+3%3B+so+here%2C+%E2%80%98son+of+perdition.%E2%80%99%0A%0A%282.%29+Actively%2C+bringing+destruction+upon+himself+and+others%3B+one+that+shall+destroy+others%2C+and+so+he+is+called+%E2%80%98Abaddon%2C%E2%80%99+and+%E2%80%98Apollyon%2C%E2%80%99+Rev.+ix.+11%2C+and+is+opposite+to+Christ%2C+who+is+%E2%80%98the+author+of+salvation.%E2%80%99+Heb.+v.+9%2C+but+Antichrist+of+destruction.+And+let+us+see+the+parallel+between+him+and+Judas%3B+for+the+person+is+a+type%2C+as+well+as+the+name+hath+a+significancy.+Antichrist+then+is+like+Judas%E2%80%94in+profession%2C+a+disciple+of+Christ%3B+in+office%2C+a+governor+of+the+church%3B+but+in+practice%2C+a+traitor.+As+they+said+of+the+blind+man%2C+John+ix.+9%2C+%E2%80%98Some+said%2C+This+is+he%3B+others%2C+He+is+very+like+him.%E2%80%99+The+Pope+boasteth+that+his+seat+is+apostolical%2C+his+chair+is+Peter%E2%80%99s+chair%2C+and+that+he+is+the+successor+of+the+apostle.+Grant+it%2C+but+there+is+an+error+of+the+person%E2%80%94not+of+Peter%2C+but+of+Judas.+Let+us+see+the+parallel%3A%E2%80%94%0A%0A%281.%29+Judas+was+not+a+stranger%2C+but+a+pretended+friend+and+apostle%3A+Acts+i.+17%2C+%E2%80%98He+was+numbered+with+us%2C+and+obtained+part+of+this+ministry.%E2%80%99+Turks+%5BMuslims%5D+and+infidels+are+enemies+to+Christ%2C+but+Antichrist+seeketh+to+undermine+him%2C+under+a+pretence+of+friendship%3B+%E1%BC%80%CE%BD%CF%84%CE%AF%CF%87%CF%81%CE%B9%CF%83%CF%84%CE%BF%CF%82+is+one+in+show+for%2C+and+in+effect+against+Christ%2C+and+the+beast+in+the+Revelation+is+said+to+%E2%80%98push+with+the+horns+of+the+lamb.%E2%80%99+Rev.+xiii.+11.+If+he+were+a+professed+enemy%2C+what+mystery+were+there+in+it%3F+But+mystery+was+written+upon+the+woman%E2%80%99s+forehead%2C+Rev.+xvii.+5%3B+and+here%2C+ver.+7%2C+%E2%80%98The+mystery+of+iniquity.%E2%80%99+It+is+wisdom+to+discern+the+false+prophet%2C+Rev.+xiii.+18%2C+but+there+needeth+no+great+wisdom+to+discover+an+open+and+professed+adversary.%0A%0A%282.%29+He+sold+Christ+for+a+small+matter.+Omnia+Romae+venalia%3A+pardons%2C+indulgences%2C+freedom+from+purgatory%2C+all+to+be+bought+with+money%3B+and+it+is+a+small+matter%2C+considering+the+things+put+to+sale%2C+the+pardon+of+sins%2C+the+souls+of+men+redeemed+with+Christ%E2%80%99s+precious+blood.+The+antichristian+state+maketh+a+market+of+religion%3B+truth+is+made+to+yield+to+interest+and+profit.%0A%0A%283.%29+Judas+betrayed+Christ+with+a+kiss%2C+under+a+pretence+of+honouring+him%3A+Luke+xxii.+48%2C+%E2%80%98Jesus+said+unto+him%2C+Judas%2C+betrayest+thou+the+Son+of+man+with+a+kiss%3F%E2%80%99+Antichrist+is+a+true+adversary+of+Christ%2C+though+he+pretend+to+adore+him%3B+as+those+that+murdered+the+present+prophets+would+by+all+means+beautify+the+tombs+of+the+prophets+deceased%2C+and+bear+a+respect+to+their+memories%2C+Mat.+xxiii.+30.+He+pretendeth+to+be+his+servant%2C+yea%2C+a+servant+of+servants%2C+but+is+really+his+enemy.+The+apostle+telleth+us+of+some+that+were+%E2%80%98enemies+to+the+cross+of+Christ%2C%E2%80%99+Phil.+iii.+18.+Who+to+appearance+such+friends+to+the+cross+as+the+rabble+of+nominal+Christians%3F+but+they+are+opposers+of+his+spiritual+kingdom%2C+the+virtue+and+power+of+the+cross.+You+have+crucifixes+every+where%2C+painted%2C+carved%2C+gilded%3B+they+are+ready+to+worship+the+cross+with+a+holy+worship%3B+they+set+it+in+their+temples%2C+altars%2C+wear+it+in+their+bosoms%2C+and+wherever+they+meet+it+show+it+reverence%2C+adorn+it+with+gold%2C+silver%2C+and+precious+stones.+Their+popes+and+prelates+have+it+carried+before+them%3B+and+are+not+these+friends+of+the+cross%3F+No%3B+they+live+a+worldly%2C+sensual+life%2C+and+all+their+religion+tendeth+there+unto%3B+therefore+enemies+of+the+cross+of+Christ%2C+because+they+mind+earthly+things.+This+is+right+antichrist-like%2C+to+betray+Christ+under+a+colour+of+adoration.%0A%0A%284.%29+Judas+was+a+guide+to+them+that+came+to+take+Christ%3B+and+one+main+work+of+Antichrist+is+to+be+a+ringleader+in+persecuting+for+religion.+Christ+is+in+heaven%2C+death+hath+no+more+power+over+him%3B+his+natural+body+is+above+abuse%2C+but+his+mystical+body+still+suffereth%3A+Acts+ix.+6%2C+%E2%80%98Why+persecutest+thou+me%3F%E2%80%99+Antichrist+is+the+head+of+the+persecuting+state%2C+others+are+his+emissaries+and+agents%2C+to+take+Christ+in+his+members.+It+is+a+politic+religion%2C+that+must+be+carried+on+with+worldly+artifices%2C+with+power+and+cruelty.%0A%0A5.%29+Lastly%2C+The+covetousness+of+Judas+is+set+forth.+He+was+a+thief%2C+one+that+carried+the+bag%2C+John+xii.+6.+England%2C+to+its+bitter+cost%2C+knoweth+the+polling+exactions+of+the+Papacy%3B+all+its+dealings+with+us+were+to+fill+the+bag+out+of+this+puteus+inexhaustus.+Now+all+these+things+should+open+our+eyes%3B+we+may+behold+the+man+of+sin%2C+the+son+of+perdition%3B+one+egg+is+not+more+like+to+another+than+Judas+and+Antichrist.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+Sermons+on+the+Second+Chapter+of+the+Second+Epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+Antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+Apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+Complete+Works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+32-33.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F09d1b9255e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/09d1b9255e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/16/thomas-manton-on-the-popes-apostolic-succession-from-judas-iscariot/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>For the pope not contenting himself with the transcendency of ecclesiastical jurisdiction over the whole church, though he has no warrant for it in his boundless and endless ambition, did climb yet higher, and partly by the favour, or foolishness rather, of Christian princes, and partly by his own fraudulent and violent dealing, as the son of him who has been a murderer and a liar from the beginning, has set himself up first amongst, and next over the greatest princes and mightiest emperors, to dispose of their crowns and dignities at his pleasure, which is the mark and character of him who is spoken of by the apostle, Who sitteth in the temple of God as God, showing himself that he is God, and opposing and exalting himself above all that is called God (2 Thess. 2:4).</p></blockquote>

<blockquote><p>Q. Why is faith required [to rightly receive communion]?

A. Because well we may eat the Bread, and drink the wine without faith; but we cannot eat Christ’s body, and drink his Blood without faith.

True; for the eating of his Body is a spiritual eating, and the drinking of his Blood is a spiritual drinking, consisting in meditation of the wonderful love of GOD the Father, who to save our souls, spared not his own Son: The wonderful love of God the Son, who to save our souls, spared not his own self but gave himself to suffer a shameful death, a bitter death, and an accursed death for our sins: He is the love of Christ that passeth knowledge: such is the breadth and the length and depth, and height of it, that we are not able sufficiently to comprehend it.

And like as the body by feeding and drinking, doth gather strength to the better performance of all actions of nature: so the soul of a Christian by meditation on this love of Christ in giving his body to be crucified, and his blood to be shed for our sins, doth gather more and more strength continually for the better performance of all actions of grace; whether they be actions of dependence, to depend upon him, and put our trust in him in all states, in all conditions, even in the time of affliction, and persecution, and at the very house of death; Or whether they be actions of conformity to his will, in obeying him, and walking in the ways of his commandments unto the end?</p></blockquote>

<blockquote><p>The person who is a Covenanter because of conviction accepts the doctrines end principles of the Church, not merely because of the tradition or authority of the Church, but because he is convinced in his heart and mind that they really are the doctrines end principles of the word of God, the Holy Bible. His loyalty is a loyalty to the written word of God. …

This kind of Covenanter is not a reed shaken by the wind; he is established firmly in his heart. He knows both what he believes, and why he believes it. He can give real Bible reasons for his belief. As a member of the Covenanter Church he is convinced, honest, and faithful to his obligations, regardless of inconvenience, unpopularity or reproach. He will receive the reward of a conscientious and consistent Christian.</p></blockquote>

<blockquote><p>Some people have remained Covenanters just because of tradition. They attend services and follow the Covenanter manner of worship just because they are in the habit of doing so. They cannot give any real Bible reasons for their Covenanter faith and practice. If you ask them why they do not vote in political elections, they can only reply that voting is against the principles of the Covenanter Church. They are like the little girl who was asked why we do not have organs in our churches. She replied solemnly, ”We don’t because we’re Covenanters, and Covenanters don’t.” The person who is a Covenanter merely because of custom or tradition is not really a Covenanter at heart. His loyalty is not a conscientious loyalty to the truth of God; it is merely a blind loyalty to church tradition. This is a very poor reason for being a Covenanter.</p></blockquote>

<blockquote><p>In the midst of the Ten Years Conflict between the non-intrusionist party in the Church of Scotland and the British state, Robert S. Candlish explained that the non-intrusionists were contending for the headship of Christ over his church:

The principle for which we are contending has already been explained tonight – we are contending for the prerogatives of Christ’s Crown and the prerogatives of the office-bearers of his Church. There are two things which flow from this doctrine – that rulers should be subject to Christ, and that those under them should be free. Christ alone is the King and head of his Church. All we ask is spiritual independence – that each office-bearer in Christ’s Church should be left free in his own department. We seek no clerical power as has been falsely represented. […]

That is the great point for which we are called upon to contend – that Christ is King and Head of his Church. The Church of the Lord Jesus Christ is not the creature of the state; it is the creature of God, and independent of the state. The Church was not founded by the fiat of any earthly prince, but by the same mighty power which said, “Let there be light, and there was light.” The Church arose not as did Prelacy, from the cabals of princes […] but by the word of the living God, and is independent of political origin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commercial Chronicle</cite>, 17 July 1841</span></figcaption>

<blockquote><p>John Calvin argued that, prior to the Reformation,

Satan lay idle and luxuriated in deep repose. For what else had he to do but jest and sport, in tranquil and peaceable possession of his kingdom? Yet when the light shining from on high in a measure shattered his darkness, when that “strong man” had troubled and assailed his kingdom [cf. Luke 11:22], he began to shake off his accustomed drowsiness and to take up arms. And, first, indeed, he stirred up men to action that thereby he might violently oppress the dawning truth. And when this profited him nothing, he turned to stratagems: he aroused disagreements and dogmatic contentions through his catabaptists and other monstrous rascals in order to obscure and at last extinguish the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian religion</cite>, ed. J. T. McNeill, trans. F. L. Battles (Westminster Press edn, Philadelphia, 1960), prefatory address to the King of France, p. 28.</span></figcaption>

</figure><figure class="quote" id="q-78c624f8d1" data-kw="">
<blockquote><p>Our Lord’s welcome to children, pronounced in the days of his flesh, implies their membership, “Suffer the little children to come unto me, … for of such is the kingdom of God.” [Mark 10:14] The “kingdom of God” here evidently means the visible Church; and the Saviour expressly declares that infants belong to the Church, and are numbered with his disciples. When it is said “of such,” &amp;c., it cannot merely mean that persons of a childlike disposition compose the kingdom of God, for this would assign no proper reason why infants should be brought to Christ, nor for our Lord’s being displeased with the disciples for seeking to hinder their approach.

If infants are thus declared by our Lord to belong to his Church, then there is certainly no proper reason why they may not be formally and solemnly declared such by baptism. Besides, it cannot be affirmed that they may not have been baptized on this occasion. Our Lord baptized not, but his disciples; and by laying his hands on them, and blessing them, He as solemnly received them as they could have been by the external rite which denotes the conveyance of spiritual blessings. In his discourse to Nicodemus, our Lord declares that none enter his kingdom but such as are born of water, &amp;c.; and the expression being generally understood to contain an allusion to baptism by water, they are excluded from the kingdom of God. Devoid of membership in the Church here, they are cut off from the hopes of eternal salvation – a conclusion this from which, although avowed by some Baptist writers, the pious mind recoils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A practical treatise on Christian baptism</cite>, (1853) in Works: doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), iii, 73-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-67a90d231a" data-kw="">
<blockquote><p>The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>framework of the church. A treatise on church government</cite>, (Edinburgh, 1890), pp 4-5.</span></figcaption>

<blockquote><p>We loudly maintain that the sacrifice of the Mass is nothing else than an impious profanation of the Lord’s Supper. This we make plain by the clear words of our Lord. For in instituting the sacred Supper, he does not enjoin us to sacrifice, but invites us to partake of the sacrifice which he himself once offered. He commands distribution to be made, and orders all alike to communicate in both symbols. And there is no obscurity in the words; Take, distribute among yourselves; drink ye all of this cup. What resemblance is there between the observance which corresponds to our Lord’s command and the Papal Mass, in which they pretend that Christ offers himself to the Father to expiate the sins of the world by the sacrifice of himself, and not only so, but also to obtain redemption for the dead – in which no invitation is given to partake, but one individual sets himself apart from the whole flock – and where, if any one comes forward to partake, the half is withheld from him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons and decrees of the Council of</cite>, Trent, with the antidote (1547) in John Calvin: tracts and letters, trans. and ed. Henry Beveridge (7 vols, Edinburgh, 1851), iii, 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

</figure><figure class="quote" id="q-4112fbcb1a" data-kw="">
<blockquote><p>Against the learning of the Times, they make large Invectives; the Universities, and all the Colleges in them, they will have razed to the ground; they profess them to be worse than Monasteries that justly were abolished: whatever Arts and Sciences are taught in the Christian Schools, they count them idle and vain: Grammar, Rhetoric, Logic, Philosophy, are all unlawful Arts.

The Heathen Writers which are used in any Faculty, such as Aristotle, Plato, Cicero, and the like, they would have them all burnt, as the Authors of unlawful Arts. They reject all School-Degrees, such as Bachelors, Masters of Art, Doctors of any faculty. They will have no Students of Divinity. They tell us that youths mis-spend their time, and exceedingly abuse themselves, by studying of those things which usually are recommended unto them as preparations for the Ministry, whether Common places, Commentaries upon Scripture, or Protestant writers of Controversies; all such Books they will have laid aside; yea, it is their advice to reject all Books but the Bible alone.

As for Divinity-Disputations, they make large Invectives against them, as Paganish and very sinful Exercises; notwithstanding all this, they proclaim themselves great Patrons of all true Learning; albeit, as yet they have not been pleased to let the world know what kind of Letters and Books they will be pleased with, when all that hitherto have been known, are laid aside by their persuasion.</p></blockquote>

<blockquote><p>In fine, as each person is not admitted to baptism from respect or regard to one of his parents alone, but on account of the perpetual covenant of God; so in like manner, no just reason suffers children to be debarred from their initiation into the church in consequence of the bad conduct of only one parent. In the mean time we confess that it is indispensable for them to have sponsors. For nothing is more preposterous than that persons should be incorporated with Christ, of whom we have no hopes of their ever becoming his disciples. Wherefore if none of its relations present himself to pledge his faith to the church that he will undertake the task of instructing the infant, the rite is a mockery and baptism is prostituted. […]

[I]f we exclude from baptism those whom we have had proofs of having been domesticated, as it were, in the church, the exclusion would be too rigorous. In the mean time, therefore, waiting till greater progress have been made, and discipline have gained strength, let children be admitted to baptism on the condition we have mentioned, viz: that their sponsors engage that they will make it their business to have them brought up in the principles of a pious and uncorrupted religion.</p></blockquote>

7/john-calvin-on-baptism-the-covenant-of-grace-and-christian-instruction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Let all our divisions be with the enemy; among ourselves let the bond of brotherly union continue and increase. All that are for God, and the welfare of the kingdoms in the three nations, are united together by the covenant and band of God [the Solemn League and Covenant]. All ages shall call them cursed, who for imaginable advantage, private or public, shall labour to put asunder what God has conjoined. The greatest advantages cannot make up the loss which unavoidably will follow upon such a breach […] that man is greatest, who with the greatest sedulity employs himself to cast water on every beginning, on every least appearance of any division which Satan may be working in the Parliament, in the Assembly, in the city, in the army, and, above all, between these covenanted nations.</p></blockquote>

</figure><figure class="quote" id="q-aa59d72b09" data-kw="">
<blockquote><p>The following series of resolutions on the subject of National Education were submitted by Mr. Anderson, and unanimously adopted:-

1. That there is a loud call for the establishment in Scotland of a national system of education, based on Scriptural principles, thoroughly imbued with the spirit of the Gospel, and adequate to provide the whole land with sound literary and religious instruction.

2. That it is the duty of the Government and Legislature to establish such a system without delay.

3. That there are remarkable facilities for the accomplishment of this most desirable object, inasmuch as, notwithstanding of existing differences in regard to matters of religion, and even in regard to the duties of Government respecting education, there is an almost universal desire among all classes in Scotland that the Bible and the Shorter Catechism of the Westminster Assembly should be read in every school.

4. That in the Act of the Legislature establishing such a system, there ought to be a distinct recognition of the Word of God, and of the principles of true religion founded on that infallible record; and that provision should be made for teaching in every school the Holy Scriptures, and the doctrines and duties inculcated in the Divine Word, as these are summarily set forth in the Shorter Catechism; that the schools should be open to such well qualified teachers, and to those only, of whatever name or denomination, as give evidence of good moral and religious character, and of cordially believing the Word of God, and holding its precious truths, as these are exhibited in the Shorter Catechism, which it would be their duty to teach; and that local boards should be established everywhere through the land for the election of teachers, and for carrying out the system according to these principles.

5. That, in conviction of this Synod, such a system, if once established and carried into vigorous operation, would be cordially received and practically adopted by Christian men of every denomination, and could not fail, by the blessing of God, to confer incalculable benefits in the advancement throughout Scotland of knowledge, religion, and morality.

6. That the Rev. William Anderson, the Rev. Dr. Goold, and Mr. Matthew Tait, be appointed a committee to take charge of these resolutions – to convey them to the Government of the country, and to Scottish Members of Parliament, and to hold such correspondence with other parties as may appear desirable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian-synod-of-scotland.html">Reformed Presbyterian Synod of Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Reformed Presbyterian Synod in Scotland’ in Monitor and Missionary Chronicle</cite>, ii, no. 23 (Mar. 1854), p. 259.</span></figcaption>

<blockquote><p>1. Circumcision of the flesh was a seal of the Circumcision of the heart promised in the Covenant of Grace, Deuteronomy 30:6, and of the cutting of the foreskin thereof, Jeremiah 4:4; Jeremiah 9:26; Ezekiel 36:26, 27, and baptism is the same, Colossians 2:11, 12; Titus 3:5.

2. Circumcision is a seal of the righteousness of faith, Romans 4:11, so is baptism, as 1 Peter 3:21; Romans 4:24.

3. Circumcision is a seal of the Covenant, and by a metonymy called the Covenant of God in the flesh, Genesis 17:7, 13, so is baptism a solemn installing of all Samaria, Acts 8, in the Christian Covenant, and so Acts 2:39.

4. Circumcision is a solemn way of instituting any in the Church of Israel, so we are by one Spirit baptized into one body, 1 Corinthians 12:12, 13.

5. The command of Circumcising is as large as Covenanting, but that is with Abraham the father, and his seed, Acts 2:39, make the command of being Baptized, ekasos every one of you be Baptized, as large as the promise of the Christian Covenant, and call: For the promise is to you and to your children, and to as many as the Lord shall call.

6. The command supposes that all Circumcised, the males of eight days old understand not the promise of the Covenant, the nature, use, signification, and end of the seal and the command to be baptized, supposeth that the children to whom the Covenant promise is made do not understand the same as touching baptism and the Covenant promise, Acts 2:39.

7. If the positive command be general that all these in Covenant should be marked with the initiatory seal of the Covenant: As Genesis 17:7-8, I am thy God and the God of thy seed: Therefore old and young be circumcised, then there was no other command in particular, to baptize old or young, but the institution of Baptism in place of Circumcision needful. […]</p></blockquote>

<blockquote><p>Unless they will abolish their laws and ordinances and restore to Christ’s churches their liberty and have it taught among them, they are guilty of all the souls that perish under this miserable captivity, and the papacy is truly the kingdom of Babylon and of the very Antichrist. For who is “the man of sin” and “the son of perdition” [II Thess. 2:3] but he who with his doctrines and his laws increases the sins and perdition of souls in the church, while sitting in the church as if he were God? [II Thess. 2:4]. All this the papal tyranny has fulfilled, and more than fulfilled, these many centuries. It has extinguished faith, obscured the sacraments and oppressed the gospel; but its own laws, which are not only impious and sacrilegious, but even barbarous and foolish, it has decreed and multiplied without end.</p></blockquote>

<blockquote><p>6. OBJECT. “To make adherence to these covenants, and an unlimited approbation of every tenet and act of the reformers, in entering into and maintaining them, necessary to admission to church privileges, renders your terms of communion very complex and unwieldy. And as many of the documents are now involved in obscurity, through the lapse of time, and the inaccuracy of records, a considerable part must be believed implicitly, and rested upon the fallible testimony of men.”

PERHAPS it may be admitted, that our terms of church communion could well enough bear some simplification, and amendment. We never believed them to be perfect. – With respect to an unlimited approbation of our venerable reformers, this we never require. We would wish to be followers of them as far as they were followers of Christ. We would call no man master, with regard to the articles of our faith. To the law and to the testimony of God, we would look for the sanction of all our religious principles, and approve of our ancestors, only as far as their conduct was agreeable to that unerring rule.

We adhere to our present religious system, not because it was adopted by our ancestors, but because we believe it to be agreeable to the word of God, and consequently ought to be adopted by all nations, wherever the scriptures have been revealed. We admire their faithfulness and valiant contendings, and hold ourselves bound to go and do likewise – As to the charge of implicit faith, it will, I trust, appear unfounded. Some knowledge of the history of any society, is necessary previous to a junction with it. Upon the man who would connect himself with any particular society of men, independently of this knowledge, the charge of implicit faith may justly devolve. This is necessary to form an accurate view of the ground on which the society stands. Particular parts of its history may be so interwoven with its constitution and laws, that the knowledge of the former is necessary to appreciate the value of the latter. With these, it is the business of every one, who intends connecting himself with the society, to be acquainted. Just so in our church admissions. We do not make anything a term of communion, but what is founded on the word of God. And when we find a man totally ignorant of our ecclesiastical history, we consider him unqualified to be an accurate judge of our church standing.</p></blockquote>

<blockquote><p>I will utter My judgments against them concerning all their wickedness, because they have forsaken Me, burned incense to other gods, and worshipped the works of their own hands. (Jeremiah 1:16)

A friend of mine recently published a post on The contradiction of Christian Reconstruction, which highlighted the inconsistency of those who claim to be upholding the law of God in society while they refuse to uphold the regulative principle of worship. Despite the good intentions of many Reconstructionists [1], their failure to adopt the Reformed approach to worship means that if they were to come to power they would quickly provoke the wrath of God against society.

As John Calvin explains when commenting on the above text, ‘The Jews had, indeed, in various ways, provoked his vengeance; but he mentions here one kind of wickedness, because it was the very fountain of evils, – they had departed from the law and the pure worship of God’. [2] Since most Christian Reconstructionists reject the requirements of God’s law in relation to worship (which is the most important part), Reconstructionism is self-contradictory and self-defeating. In the name of upholding God’s law, they reject God’s law in the sphere of worship. In the name of bringing society under Christian standards, they promote humanism in the realm of what most intimately pertains to Christ’s glory. Hence all that Christian Reconstructionism will ultimately achieve is the provocation of Divine wrath against the society in which it is embraced.

[1] Some Reconstructionists do affirm the regulative principle of worship, but they are a minority. I accept the basic aims of Reconstructionism (God’s law and postmillennialism), but eschew their Kuperianism, Neo-Calvinism, liturgical antinomianism, low views of the church, non-confessionalism, latitudinarianism, small governmentism, and American morality.</p></blockquote>

<blockquote><p>The second question is, Whether the antichrist here described is an ecclesiastical of civil power; whether it is to arise in the Church or in the world. The considerations which are in favour of the former of these assumptions are, –

1. That the designations “man of sin” and “son of perdition” have a religious import, and are more appropriate to an ecclesiastical than to a worldly power or potentate.

2. Antichrist was to have the seat of his power in the “temple of God.” It is there he sits. This seems clearly to indicate that it is an ecclesiastical usurping, tyrannical, and persecuting power, that is here depicted. By the temple of God in this passage is generally understood the Church which is so often elsewhere called, and especially by Paul, God’s temple. Some, however, suppose that the reference is to the literal temple in Jerusalem; but this supposes, (a.) That the Jews are to be restored to their own land. (b.) That they are to be restored as Jews, or unconverted, and that the temple is to be there rebuilt. (c.) That the Thessalonians knew all this and would understand the Apostle as referring to the temple made with hands; which is to the last degree improbable.

3. His coming is after the working of Satan, with all power and signs and lying wonders. This is not the way in which worldly potentates gain their power; they rely on force. But this is the way, as though traced by the pen of history rather than by the pencil of prophecy, in which the papacy has attained and maintained its fearful ascendancy in the world. Its power has been achieved mainly by fraud, “by the deceivableness of unrighteousness;” by forged documents and false pretences; by claiming that Peter was made primate over the whole Church the vicar or plenipotentiary of Christ on earth; that he was the bishop of Rome; that his successors in that office were his successors in that primacy; and that as the vicar of Christ he was superior to all earthly potentates, nor merely as the spiritual is above the temporal, but as lord of the conscience, authorsized to decide what was right and what was wrong for them to do in all their relations as men and as rulers; which is a claim of absolute dominion.

This, however, is a small matter so far as it concerns the things of this world. It was to the mass of the people of little moment whether their absolute sovereign was a bishop or a prince; whether their absolute sovereign was a bishop or a prince; whether he resided at Rome or in Paris, whether his authority extended over one nation or over all nations. It is the false claim of the papacy to have supreme authority over the faith of men, to decide for them what they must believe on the pain of eternal perdition, that is the most fearful power ever assumed by sinful men. … These pains the pope and his subordinates falsely claim the power to alleviate or remit. These claims have no parallel in the history of the world. If such pretensions as these do not constitute the power which makes them Antichrist, then nothing more remains. Any future antichrist that may arise must be a small affair compared to the papacy.

Then again, the Apostle tells us, these portentous claims, these unrighteous deceits, were to be supported by “signs and lying wonders.” These have seldom, if ever, been appealed to by worldly powers to support their pretensions. They ever have been and still are among the chief supports of the papacy. There is not a false doctrine which it teaches, or a false assumption which it makes, which is not sustained by “lying wonders.” Its whole history is a history of apparitions of the Virgin Mary or of saints and angels; and of miracles of every possible description from the most stupendous to the most absurd. It has ever acted on the principle “populus vult decipi,” and that it is right to deceive them for their own good, or, the good of the Church. The whole system, so far as it is distinctive, is a system of falsehood, or false pretensions, supported by deceit.</p></blockquote>

ry+is+a+history+of+apparitions+of+the+Virgin+Mary+or+of+saints+and+angels%3B+and+of+miracles+of+every+possible+description+from+the+most+stupendous+to+the+most+absurd.+It+has+ever+acted+on+the+principle+%E2%80%9Cpopulus+vult+decipi%2C%E2%80%9D+and+that+it+is+right+to+deceive+them+for+their+own+good%2C+or%2C+the+good+of+the+Church.+The+whole+system%2C+so+far+as+it+is+distinctive%2C+is+a+system+of+falsehood%2C+or+false+pretensions%2C+supported+by+deceit.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+%283+vols%2C+New+York%3A+Charles+Scribner%2C+1872-74%29%2C+3%3A+815-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f138b7ca8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f138b7ca8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/11/03/charles-hodge-on-the-protestant-view-of-antichrist-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-de5360efd0" data-kw="">
<blockquote><p>The common opinion, however, among Protestants is, that the prophecies concerning Antichrist have special reference to the papacy. This conviction is founded in Paul’s second epistle to the Thessalonians. … The first question, to be determined in the interpretation of this prophecy, is, Whether Antichrist is a particular individual, or an institution, a power, or a corporation. Protestants generally adopt the latter view; because they do not regard any one pope, but the papacy, as the Antichrist of Scripture. In favour of this view it may be urged, (1.) That it is according to the analogy of prophecy to speak of nations, institutions, or kingdoms, as individuals. In Daniel, the ten kings are ten kingdoms or dynasties; the several beasts which he saw in vision, were not the symbols of particular men, but of nations. When therefore the Apostle speaks of Antichrist as “the man of sin,” and “the son of perdition,” it is perfectly consistent with Scriptural usage to understand him to refer to an order of men, or to an institution.

(2.) The work assigned to Antichrist in prophecy, extends over far too long a period to be accomplished by one man. (3.) Those who insist that the antichrist here predicted, is an individual man, are forced to admit that what is said in 2 Thessalonians ii. 7 (“He who now letteth, will let, until he be taken out of the way”) is to be understood of a power. It is generally understood of the Roman power. Luthardt understands it of the moral power which sustains the right, and therefore is opposed to the reckless disregard of all law, which is one of the characteristics of Antichrist. It is true that he supposes that reference is also made to one of the guardian or protecting angels spoken of by the prophet Daniel. But such an angel is not to be “taken out of the way.” And there is nothing in the context or in Paul’s writings anywhere to justify the assumption that reference is here had to any angelic personage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (3 vols, New York: Charles Scribner, 1872-74), 3: 812, 814-15.</span></figcaption>

<blockquote><p>1. The effects of slavery on domestic relations.

The system of American Slavery confers upon slaveholders an absolute right of property in their slaves. This sets aside the husband’s interest in his wife, and the wife’s interest in her husband. Although slave-laws do not recognize the relation of marriage between slaves, it is recognized of God — and in his sight the slave is equally entitled with his master to enter into the relation, — and has the same right of protection in its enjoyment. But slavery, in its practical working, steps in between the slave and the enjoyment of his right.

This evil is not merely an abuse of the system; it necessarily flows from it. The right of property claimed by the master, and secured by law, gives him the power of disposing of the slave in anyway, and at any time, that may suit his inclination or his interest; a power which is so commonly used as to approximate very nearly to universality. The husband is torn from his wife; and the wife from her husband. We refer not to the anguish of heart caused by such involuntary separations; nor to the inability thus induced to perform mutually the obligations belonging to the relation. These have already been presented as direct arguments against slavery. At present we refer only to the violation of right which unavoidably follows the system. To secure the right of the slave would affect the master’s claim, therefore his right, however sacred, is cancelled to gratify the avarice of the slaveholder, and to maintain the system of iniquity.

By the law of God, as well as of reason, the husband is bound to protect and support his wife, but slavery denies him the right of doing either, farther than may suit the inclination of his master. His wife may, without crime, or the charge of crime, be flogged most cruelly before his eyes, and slavery does not even permit him to complain; the most wanton outrages may be committed on her person, and he dare not lift his hand to rescue her; nor even open his lips to remonstrate. The law provides no remedy; it does not even admit his right to seek redress; one thing, and only one, the law contemplates:— The absolute right of the master, to the entire exclusion of all right on the part of the slave. Slavery thus, in its practical working, violates rights, which are admitted by reason and guaranteed by the authority of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/moses-roney.html">Moses Roney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The holding of human beings in a state of slavery sinful in Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>Traditionally the sacrament had been open to all not actually excommunicated or under other kirk censures. Increasingly during the 1640s it appears (though the process has not been traced in detail) that some ministers put more and more emphasis on stringent qualifications necessary for admission. Tests of religious knowledge, repentance for sins and political loyalties were introduced. Thus adherence to the national covenant and the solemn league and covenant became necessary for admission.</p></blockquote>

</figure><figure class="quote" id="q-faa6039eea" data-kw="">
<blockquote><p>Commenting on the conduct of the majority Scottish RP Synod (1863) in removing ecclesiastical censure from those who voted in British elections, the London-Scottish Reformed Presbyterian Magazine (which represented the minority who dissented from this) argued that it was a violation of the covenants to admit those who voted to communion:

[W]e cannot refrain from remarking further here, that the Synod and congregations of the majority part of the Reformed Presbyterians do not themselves keep the Covenants. Extending church privileges to such as take part in political action with the British Constitution, they hold fellowship with malignants against the express engagements both of the National and the Solemn League and Covenant. If those who supported popery, prelacy, and arbitrary civil power in the days of the Covenant engagements were malignants, what else are they who now uphold popery, prelacy, and Erastianism, and condemn the Covenants themselves as unlawful deeds? There is need for the Synod and congregations, therefore, to instead of descending to loose and unworthy union, ascending to reformation, by retracing steps of defection already taken, even although this would cost a sacrifice, which few professors in this age of the world are inclined to make.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Commenting on the conduct of the majority Scottish RP Synod (1863) in removing ecclesiastical censure from those who voted in British elections, the London-Scottish Reformed Presbyterian Magazine (which represented the minority who dissented from this) argued that it was a violation of the covenants to admit those who voted to communion:

[W]e cannot refrain from remarking further here, that the Synod and congregations of the majority part of the Reformed Presbyterians do not themselves keep the Covenants. Extending church privileges to such as take part in political action with the British Constitution, they hold fellowship with malignants against the express engagements both of the National and the Solemn League and Covenant. If those who supported popery, prelacy, and arbitrary civil power in the days of the Covenant engagements were malignants, what else are they who now uphold popery, prelacy, and Erastianism, and condemn the Covenants themselves as unlawful deeds? There is need for the Synod and congregations, therefore, to instead of descending to loose and unworthy union, ascending to reformation, by retracing steps of defection already taken, even although this would cost a sacrifice, which few professors in this age of the world are inclined to make.”

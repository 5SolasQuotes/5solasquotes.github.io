<blockquote><p>Jephtha Williams was gathered to his people August 19th, 1851, in the 77th year of his age.

This exemplary Christian acceded to the Reformed Presbyterian Church, with his wife, thirty-two years ago, in the Congregation of Coldenham. It was then under the care of the Rev. Mr. Willson. They were both greatly respected members of Goodwill Presbyterian Congregation, in full communion. In that church they had been both held as slaves, in Long Island, and had bought their own freedom for $.500. Jephtha, among his Presbyterian brethren, heard it said that Covenanters were a very bad people, “turners of the world upside down.” Curiosity led, him to hear the Rev. James Milligan, then pastor of the Coldenham Congregation. The preaching pleased him greatly, as evangelical and edifying. He expected, during the interval of public worship, to find out, by the talk of the people, their evil designs as traitors to the commonwealth. The Presbyterians then held slaves. [It is not clear why this sentence is here – DR] He was, however, disappointed, as the conversation of the Covenanters was on religious topics altogether, such as the worship of the forenoon. Of that he approved, of course, and could not but contrast it with the talk of his Goodwill brethren on politics, harvests, butter, cows, calves, dollars, and cents. But his mind had been so prejudiced by the slanders of many, that he thought it all hypocrisy; still, he began to think that possibly Covenanters might be Christians. He came often to hear the word preached, sought acquaintance with the members, and read the terms of communion. He requested the pastor of the Coldenham Congregation to point out to him the alterations that the Presbyterian General Assembly had made in the Westminster Confession of Faith, and give him the history of the National Covenant of Scotland, and of the Solemn League and Covenant. He asked whether coloured members would be buried in our grave-yard, — “for,” he said, “we are not permitted to bury our dead in Goodwill burying-ground.” It seems almost incredible that any who profess to be the disciples of the meek and lowly Jesus, would carry the cruelties of slavery down to “the house appointed for all living.” But they do; yes, even those who call themselves orthodox Presbyterians! After much searching of heart, consultation with his intelligent and very exemplary wife, and prayer, he and she applied to session, gave great satisfaction when examined, and were enrolled among Christ’s witnesses.

For thirty-two years he and his household “have adorned the doctrine of God our Saviour.” His conversation, prayer, and example, have been blessed of God to bring into the church more than sixty souls of his coloured brethren, and thirteen families, nine of which are in his own family. No ne of all these in Orange county have ever been subjected to church censure. For thirty-two years, we have good reason for believing, that family worship, night and morning, was never omitted in his household.

He died in the full assurance of faith – on his death-bed “speaking peace to all his seed.” Is slavery better than the lot of these disciples of Christ? A large funeral testified the respect in which he was held by his brethren and neighbours.

J. R. W.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1851, p. 128</span></figcaption>

<blockquote><p>And with respect to the government of Christ’s house, alas! the generality of the present age seem to be agreed, that it is a matter of mere indifferency and moonshine, whether a person be of the Episcopalian, Independent, or Presbyterial way of thinking about it; although it is the declared principle of this church, founded on the word of God, solemnly sworn unto and sealed by the blood of many of the Lord’s witnesses, That the spiritual power and authority, is lodged, neither in the hand of the civil magistrate, not in the community of the faithful, as they call them, but in church officers, ministers and elders acting in parity, and judicatories subordinate to one another. Now, we say that a faithful minister of Christ is set for the defence of the gospel, namely, both for the defence of gospel-truth, and likewise of the hedge of government, which the glorious Head hath set about it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The character of a faithful minister of Christ in The works of Ebenezer Erskine</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“And with respect to the government of Christ’s house, alas! the generality of the present age seem to be agreed, that it is a matter of mere indifferency and moonshine, whether a person be of the Episcopalian, Independent, or Presbyterial way of thinking about it; although it is the declared principle of this church, founded on the word of God, solemnly sworn unto and sealed by the blood of many of the Lord’s witnesses, That the spiritual power and authority, is lodged, neither in the hand of the civil magistrate, not in the community of the faithful, as they call them, but in church officers, ministers and elders acting in parity, and judicatories subordinate to one another. Now, we say that a faithful minister of Christ is set for the defence of the gospel, namely, both for the defence of gospel-truth, and likewise of the hedge of government, which the glorious Head hath set about it.”

— Ebenezer Erskine, The character of a faithful minister of Christ in The works of Ebenezer Erskine">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+with+respect+to+the+government+of+Christ%E2%80%99s+house%2C+alas%21+the+generality+of+the+present+age+seem+to+be+agreed%2C+that+it+is+a+matter+of+mere+indifferency+and+moonshine%2C+whether+a+person+be+of+the+Episcopalian%2C+Independent%2C+or+Presbyterial+way+of+thinking+about+it%3B+although+it+is+the+declared+principle+of+this+church%2C+founded+on+the+word+of+God%2C+solemnly+sworn+unto+and+sealed+by+the+blood+of+many+of+the+Lord%E2%80%99s+witnesses%2C+That+the+spiritual+power+and+authority%2C+is+lodged%2C+neither+in+the+hand+of+the+civil+magistrate%2C+not+in+the+community+of+the+faithful%2C+as+they+call+them%2C+but+in+church+officers%2C+ministers+and+elders+acting+in+parity%2C+and+judicatories+subordinate+to+one+another.+Now%2C+we+say+that+a+faithful+minister+of+Christ+is+set+for+the+defence+of+the+gospel%2C+namely%2C+both+for+the+defence+of+gospel-truth%2C+and+likewise+of+the+hedge+of+government%2C+which+the+glorious+Head+hath+set+about+it.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+The+character+of+a+faithful+minister+of+Christ+in+The+works+of+Ebenezer+Erskine&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe9d125e39c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e9d125e39c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/09/21/ebenezer-erskine-on-the-ministers-duty-to-uphold-the-divine-right-of-presbyterial-church-government/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In 1646, when the Presbyterians had fully regained the ascendancy, the Scottish Parliament passed an act, requiring every parish to have a schoolmaster, and ordaining, that if in any case, heritors or land-holders neglected raising means for his support, the Presbytery should nominate twelve men, to make the assessment upon their property. Indeed, strange as it may appear, the period between 1638 and 1660, seems almost entitled to be called the golden age of popular education in Scotland. In the universal diffusion of religious instruction, it was decidedly so. ‘For,’ says Kirkton, a very respectable Church historian of the times, ‘every parish had a minister, every village a school, every family almost had a Bible—yea, in most of the country, all the children of age could read, and were provided with Bibles either by their parents, or ministers.

I have lived many years in a parish, where I never heard an oath — and you would not, for a great part of the country, have lodged in a family, where the Lord was not worshipped by reading, singing, and prayer. ‘Nobody,’ he quaintly adds, ‘complained more of our church government, than our taverners, whose ordinary lament was, that their trade was hopeless—people were become so sober.’ It was thus, by planting the school by the side of the kirk, that the Reformed clergy raised the people of Scotland, both from feudal bondage and spiritual thraldom; and most grateful was the return which they every where received. During that period, school teaching was a regular profession — as much so as that of the ministry, and men were educated for it. Piety no less than learning and aptness to teach, was regarded as an essential qualification in a school-master. The parish school was the nursery of the kirk, and the master was expected to co-operate with the minister, in all his plans and efforts for the spiritual good of the rising generation. To command the best talents and to place the teacher on the highest vantage ground, in the discharge of his duties, a house was provided for his family, and he received a liberal and permanent support. In the sacredness of his office, the pastor was above him; but in talents and scholarship, it was thought that the school-master stood upon nearly the same level.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, pp 307-08</span></figcaption>

<blockquote><p>The great Antichrist, is he, who under the name of Christ’s Vicar, persecutes him,

The Rules.

I. The name Antichrist belongs not to one person alone, but to a whole state or order of men, as it were in the same Kingdom succeeding each other.

Even as the word of High Priest. He is not then opposite to Christ, as one person is to another, in respect of substance, but he is opposite to him in respect of quality or office.

II. The Papists will have Antichrist to be one particular man; a Jew of the Tribe of Dan, the Jews Messiah, and the restorer of their Religion, who shall reign at Jerusalem three years and a half, shall fight with Henoch [Enoch] and Eliah [Elijah], shall offer to ascend to heaven from Mount Olivet, but shall be destroyed by Christ.

III. But we out of Scripture describe Antichrist thus. 1. That he is a man at one time, one; but in succession of time, an order of men; in the same state succeeding each other. 2. Raised by Satan. 3. A Christian in name only. 4. In very deed Christ’s Enemy. 5. Sitting in the Temple of God, as God. 6. Reigning in that great City, which ruleth over the Kings of the Earth. 7. Seducing the inhabitants of the Earth with laying wonders. 8. Setting a mark on his followers. 9. Full of idolatry, ambition, avarice, cruelty and impurity. 10. Revealed in the last times. 11. He shall be destroyed by the breath of Christ’s mouth, and shall be overthrown by his own lovers, and utterly abolished at Christ’s glorious coming.

Johannes Wollebius, The abridgment of Christian divinity, trans. Alexander Ross (3rd edn, London, 1660), pp 233-5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>For further discussion of the exegetical basis for the above points, read the notes on pages 235-7 of the above book. This can be found here.</cite></span></figcaption>

<blockquote><p>First, then, the difference betwixt the Old and New Testament dispensations, with regard to extent, is deserving of marked attention. The former was greatly restricted; it was almost exclusively confined to one people; and to this limitation the members of the church had been long accustomed. The new dispensation, again, was possessed of an opposite character; it was distinguished by a universal extension of its privileges; it threw down the middle wall of partition by which the Jews were kept separate from the other nations of the earth, broadly maintained that there was no difference between the Jew and the Gentile, and opened its arms to Greek and Jew, Barbarian and Scythian, bond and free. But the previous state of things had given rise to deep-seated prejudice in favour of exclusive privilege, which it was no easy matter to uproot. […]

They were Jews, and were manifestly reluctant to descend to a common level with others, in regard to the enjoyment of religious privilege; a miracle was even required to be wrought to convince an apostle that God is no respector [sic] of persons, and to carry home to him the lesson, “What God hath cleansed, that call not thou common.” If such narrow views were entertained by those who had the best opportunities of correct information, we need not wonder at the bigoted prejudices of others. The preaching of the Gospel to the Gentiles awakened the jealously of the Jews, and to such a length did they carry their opposition, that they even persecuted the preachers, “forbidding them to speak to the Gentiles, that they might be saved.” […]

Considering such a state of things, it is surely not difficult to account for the use of terms of extensive import, in speaking of the blessings of the new economy. To mark the contrast, the strongest language that could be employed because necessary. In these circumstances, we can conceive of nothing more natural than to use the phrases all men, all the world, &amp;c., to denote men in general, without regard to national distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The atonement and intercession of Jesus Christ</cite>, (New York, 1863), pp 214-16.</span></figcaption>

ive+import%2C+in+speaking+of+the+blessings+of+the+new+economy.+To+mark+the+contrast%2C+the+strongest+language+that+could+be+employed+because+necessary.+In+these+circumstances%2C+we+can+conceive+of+nothing+more+natural+than+to+use+the+phrases+all+men%2C+all+the+world%2C+%26c.%2C+to+denote+men+in+general%2C+without+regard+to+national+distinction.%E2%80%9D%0A%0A%E2%80%94+William+Symington%2C+The+atonement+and+intercession+of+Jesus+Christ%2C+%28New+York%2C+1863%29%2C+pp+214-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F132cff52f5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/132cff52f5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/09/07/william-symington-on-the-gospel-versus-racial-bigotry/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Do we want Jesus Christ to declare us his own? Do we want him to be our king? Then, we must accept his doctrine. We must be willing to be led as he sees fit, for him to become our strength and refuge. Then we can boast that Jesus Christ is our king. Moreover, we need to recognize that this doctrine is aimed at us, to reprove and bring us in line. For if that fails to occur, then we can never benefit from the school of Jesus Christ. Let anyone, therefore, who is content to remain in his natural state, look for a master other than God’s Son. For if we cannot let go of our personal interests and foolish fantasies, we can never be taught by him.</p></blockquote>

<blockquote><p>In this post, Moses Roney’s Reformed Presbyterian periodical continues its praise of the Scottish Reformers for bringing education to the people. After discussing how King James VI and Charles I wanted to use schools for sinister purposes, Dr Humphrey points out that the Reformed Church of Scotland was willing to provide the schools themselves (even though the civil rulers often neglected to do their duty). According to the Scottish theory of the two-kingdoms, education does not need to be monopolised by either church or state, instead both institutions should co-operate to promote the glory of God in the training of the nation’s youth:

But the church of Scotland did not [for] wait these tardy and sinister moves of the government. Those good men, who saw so early and clearly what was necessary to lay the foundations of Protestantism broad and deep throughout the country, determined to do what they could for the establishment of parochial schools, however neglectful the civil rulers might be of their duty. While they expostulated with the nobility for their supineness, they exerted themselves as if all the hopes of Scotland depended on their efforts; in so much that, in the Lowlands especially, popular education had made great progress before the state came to their aid. It is stated in a document still extant, that only twenty years after the reformation, ‘so great had been the progress of religious instruction in a country where, forty years before, the Bible was not suffered to be read, that almost every house possessed a copy, and that it was read in it!’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, p. 306</span></figcaption>

</figure><figure class="quote" id="q-898d6eb1b3" data-kw="">
<blockquote><p>I very much question whether the whole history of human improvement can furnish the outline of an educational system, at once so comprehensive, so simple, and so much in advance of the age in which it was drawn up; and certainly, there is nothing which more strikingly shows what a heaven-wide difference there is between the genius of Protestantism and Popery. That men, who had themselves been taught to consider ‘ignorance as the mother of devotion,’ should all at once have such enlargement of views, in regard to education, as soon as the light of reformation dawned upon their minds, and that they should find time to mature so wise a plan, while they were obliged to dispute every inch of ground with the enemy, and while, as yet, the conflict between light and darkness hung in such awful suspense,—is truly wonderful. It would almost seem as if there must have been something supernatural in the illumination which guided them; for they could have derived but little assistance from the most enlightened nations, whether ancient or modern; and to this very day, no material improvement has been made upon their system. If we did not know that our Puritan forefathers brought it along with them to New-England, the similarity is so striking, that no one could doubt the Scottish origin, and the Prussian system of popular education, the most perfect and efficient, probably, which the world ever saw, is manifestly indebted to the same source for all its essential elements.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I very much question whether the whole history of human improvement can furnish the outline of an educational system, at once so comprehensive, so simple, and so much in advance of the age in which it was drawn up; and certainly, there is nothing which more strikingly shows what a heaven-wide difference there is between the genius of Protestantism and Popery. That men, who had themselves been taught to consider ‘ignorance as the mother of devotion,’ should all at once have such enlargement of views, in regard to education, as soon as the light of reformation dawned upon their minds, and that they should find time to mature so wise a plan, while they were obliged to dispute every inch of ground with the enemy, and while, as yet, the conflict between light and darkness hung in such awful suspense,—is truly wonderful. It would almost seem as if there must have been something supernatural in the illumination which guided them; for they could have derived but little assistance from the most enlightened nations, whether ancient or modern; and to this very day, no material improvement has been made upon their system. If we did not know that our Puritan forefathers brought it along with them to New-England, the similarity is so striking, that no one could doubt the Scottish origin, and the Prussian system of popular education, the most perfect and efficient, probably, which the world ever saw, is manifestly indebted to the same source for all its essential elements.”

<blockquote><p>In 1837 the American Covenanter Reformed Presbyterian periodical, edited by Moses Roney, published an article by a man called Dr Humphrey on ‘Education in Scotland’. This article helpfully points out that the universal diffusion of education was one of the leading principles of the Scottish Reformation. How sad it is that men who claim to stand in the tradition of the Scottish Reformers would decry this system were it upheld today (this includes those who think public education is inherently wrong and that home-schooling is the only biblical form of education):

The parochial schools of Scotland have been the admiration of enlightened men in all countries, for two hundred and fifty years. Like civil and religious liberty and all the noble institutions of that country, they are the offspring of the Reformation. Before John Knox rolled back the thunders of the Vatican upon the Pope and his Cardinals, and blew that mighty blast which shook down the walls of spiritual Babylon in North Britain, the people were as deeply sunk in ignorance, as they were in the superstition and idolatry of the great anti-christian apostacy. Very few, except the nobility, could read, and almost none could write. But as soon as Scotland had thrown off the Romish yoke, or rather, while she was struggling for life with ‘the man of sin,’ and the faggots were scarcely quenched in the grass market of Edinburgh, the Reformers were busily employed in maturing a plan for the universal diffusion of letters throughout the country. They rightly judged, that to eradicate the errors of Popery, and instil the faith of the gospel into the hearts of the rising generation, the establishment of schools under pious teachers was essential. How anxious they were to see a school-house planted by the side of every kirk, and to make sound learning the hand-maid of pure religion, is strikingly manifest in […] the ‘First Book of Discipline,’ drawn up by Knox and his immortal compeers, and presented to the nobility in 1560 – almost three centuries ago.</p></blockquote>

<blockquote><p>Little children, it is the last hour; and as you have heard that the Antichrist is coming, even now many antichrists have come, by which we know that it is the last hour. (1 John 2:18)

John Calvin rejects the notion of a futuristic interpretation of antichrist, arguing that the office belongs to the papacy:

As ye have heard that antichrist will come. He speaks as of a thing well known. We may hence conclude that the faithful had been taught and warned from the beginning respecting the future disorder of the Church, in order that they might, carefully keep themselves in the faith they professed, and also instruct posterity in the duty of watchfulness. For it was God’s will that his Church should be thus tried, lest any one knowingly and willingly should be deceived, and that there might be no excuse for ignorance. But we see that almost the whole world has been miserably deceived, as though not a word had been said about Antichrist.

Moreover, under the Papacy there is nothing more notorious and common than the future coming of Antichrist; and yet they are so stupid, that they perceive not that his tyranny is exercised over them. Indeed, the same thing happens altogether to them as to the Jews; for though they hold the promises respecting the Messiah, they are yet further away from Christ than if they had never heard his name; for the imaginary Messiah, whom they have invented for themselves, turns them wholly aside from the Son of God; and were any one to shew Christ to them from the Law and the Prophets, he would only spend his labour in vain. The Popes have imagined an Antichrist, who for three years and a half is to harass the Church. All the marks by which the Spirit of God has pointed out Antichrist, clearly appear in the Pope; but the triennial Antichrist lays fast hold on the foolish Papists, so that seeing they do not see. Let us then remember, that Antichrist has not only been announced by the Spirit of God, but that also the marks by which he may be distinguished have been mentioned.

Even now are there many antichrists. This may seem to have been added by way of correction, as they falsely thought that it would be some one kingdom; but it is not so. They who suppose that he would be only one man, are indeed greatly mistaken. For Paul, referring to a future defection, plainly shows that it would be a certain body or kingdom. (2 Thess. 2:3.) He first predicts a defection that would prevail through the whole Church, as a universal evil; he then makes the head of the apostasy the adversary of Christ, who would sit in the temple of God, claiming for himself divinity and divine honours. Except we desire wilfully to err, we may learn from Paul’s description to know Antichrist. That passage I have already explained; it is enough now touch on it by the way.

But how can that passage agree with the words of John, who says that there were already many antichrists? To this I reply, that John meant no other thing than to say, that some particular sects had already risen, which were forerunners of a future Antichrist; for Cerinthus, Basilides, Marcion, Valentinus, Ebion, Arrius, and others, were members of that kingdom which the Devil afterwards raised up in opposition to Christ. Properly speaking, Antichrist was not yet in existence; but the mystery of iniquity was working secretly. But John uses the name, that he might effectually stimulate the care and solicitude of the godly to repel frauds.

But if the Spirit of God even then commanded the faithful to stand on their watch, when they saw at a distance only signs of the coming enemy, much less is it now a time for sleeping, when he holds the Church under his cruel and oppressive tyranny, and openly dishonours Christ.</p></blockquote>

<blockquote><p>Now let us consider “when” this exaltation occurs: when “peoples flow to it,” saying, Let us go up to the mountain of God, that he may teach us his ways and we may walk in his paths [Micah 4:1-2]. Micah’s intention in saying that peoples shall flow to it, is to show there is a great difference between the Church that was under the Law, and the Church that will exist at the coming and manifestation of our Lord Jesus Christ. For in Micah’s time, there was only one nation whom God had chosen; only Abraham’s children had been elected to hear the doctrine of salvation. It was to them alone in particular that God had said: “I am [the Lord] you God, who has brought you out of the land of Egypt” [Exodus 20:2]. That is why he was called in those days “the God of Abraham, of Isaac, and of Jacob” [Exodus 3:6]. But now Micah says that God will sound a trumpet that will be heard to the ends of the earth, just as Psalm 2 declared that Jesus Christ has been consecrated King and Lord of all, and that his Father has bestowed the entire earth, from the rising to the setting of the sun, on him as his posterity [Psalm 2:7-9]. That is the dignity that is entailed in Micah’s declaration that all peoples shall come together on the mountain of Zion, at the house of God [Micah 4:2].

Now this results in an important affirmation of our faith. For we can see how patient God was in calling us to a knowledge of the Gospel. For our fathers were poor pagans, without a covenant with God. They were estranged from his Church. The promises of salvation completely excluded them, as Saint Paul points out in Ephesians 2[:11-12]. Yet, today, we are united with Abraham and his lineage; we have been grafted into the people of God. How did that come about? Through the Gospel. Now, if this had happened, or had come about, without God having prophesied that it would, we could say: “Ah! it happened by chance!” But when we hear that it was proclaimed from of old, that is a true boost to our faith. For God, desirous of a special people among whom his Law might be preached, nonetheless proclaimed that a time would come when the doctrine of salvation would be revealed to all the world; that peoples would flow to it; that a true amity and understanding of faith would exist; that peoples formerly dispersed and separated from each other by great distances would unite together; and that wherever walls had kept them apart, those walls would come down.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the book of Micah</cite>, trans. and ed. B. W. Farley (1551; Phillipsburg, 2003), pp 193-4.</span></figcaption>

</figure><figure class="quote" id="q-72eb6d0f4a" data-kw="">
<blockquote><p>But in the execution of this punishment there must a great consideration be had and observed; first, of the persons; then, of the errors; and, lastly, of the penalties. For in persons there is great diversity: because there are some standard-bearers, and heady grand captains, which are stout, hypocrites, and full of tongue, and therefore the aptest for to seduce; who, falling headlong without amendment to their own destruction, do with themselves draw other[s] into danger. They must by all means be bridled and kept under, as plagues to the church; lest, like a canker, they spread all over. Again, there are some silly seduced souls, made fools by other men, which err not of malice nor stubborn stomach, but do repent and amend in time. These the magistrate must not straightway condemn, but pray to the Lord, and bear with their error, and teach them in the spirit of gentleness, until they be brought to a better mind.

Moreover, in erroneous doctrines some are more intolerable than other some are. Some there be so wicked and blasphemous, that they are unworthy to be heard, much less to be done. Some there are which do directly and openly tend to the overthrow of the commonweal, unless they be in time appeased and resisted. But those crimes that are brought in and accused, ought first to be by the scripture and manifest truth convinced to be such as they are said to be. When the truth is known, and manifest proofs of scripture alleged, then is it lawful most sharply to punish those blasphemers of God and overthrowers of the church and commonweal. But a light and easier penalty must be set on the heads of them whose offence consisteth in light and smaller errors: for some do err so, that by their error God is not blasphemed, the church not subverted, nor the commonweal in any danger at all. Where, by the way, every one must think of that saying of the apostle: “Bear ye one another’s burden.” And again: “The weak in faith received ye, not to the doubtfulness of questions.”

Furthermore, in punishment and penalties there is great difference. They that err stubbornly, and do their endeavour to draw in and keep other men in their errors, blasphemers, troublers, and subverters of churches, may by law be put to death. But it followeth not thereupon, that every one which erreth must therefore by and by suffer loss of his life. […] And Josue, before he made open war to be proclaimed upon the children of Reuben, did first by embassage command them to dig down the altar, which they seemed to have made contrary to the law of the Lord. The emperor Justinian also granted pardon to them which repented, and turned to a sounder opinion, Constitut. 109. Moreover, Josias did not utterly kill all them that were wrapped in error and idolatry, but those especially that were incurable, and would not recant. The magistrate therefore must wisely moderate the matter, and be very circumspect in punishing offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 360-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>Here [London] you may likewise see a Reverend Assembly of grave and learned Divines, who daily wait upon the Angel in the Mount, to receive from him the lively Oracles, and the pattern of God’s house, to present unto you. All these are of our own Nation; and with them you may see the Honourable, reverend, and learned Commissioners of the Church of Scotland; and in them behold the wisdom and affection of their whole Church and Nation, willing to live and die with us.

All these you may behold in one view; and which is more, you may behold them all of one heart, and one mind, after so many plots and conspiracies to divide them one from another, and thereby to ruin them all: And which is yet more, you may see them all met together this day on purpose, both to praise God for this union, and to rejoice in it, and to hold it out to all the world, and thereby to testify, that as one man they will live and die together in this common cause of God, of our Lord Jesus Christ, his Church, and these three kingdoms. O beloved! how beautiful is the face of this Assembly?</p></blockquote>

<blockquote><p>Among “evangelical Calvinists” Henry Scougal’s book, The life of God in the soul of man, is held in high esteem – largely owing to the book’s influence upon George Whitefield. The Scottish Seceders, however, regarded it as a work that was harmful to the gospel:

Socinian and Arminian doctrine is now in such general request, that some have ventured openly to recommend these principles without being noticed by any of the judicatories of the church. Mr. William Wishart, principal of the college of Edinburgh, has recommended Dr. Scougal’s life of God in the soul of man, upon which Mr. Whitefield’s experiences are founded; a book calculated to lead off from faith in the righteousness of Christ without us, to a righteousness within us, and inward sensations, as the ground of our pardon and acceptance before God.</p></blockquote>

<blockquote><p>For since false teachers and heretics in regard of the spiritualness of their sin are the worst of evil doers, and such as work abomination in the Israel of God, and there is no particular laws in the New Testament for bodily coercing of Sorcerers, Adulterers, Thieves, Traitors, false witnesses, who but speak lies against the good name of their neighbour, not against the name of God, nor against Sodomites, defilers of their bodies with beasts, perjured persons, Covenant breakers, liars &amp;.c. What reason in nature can there be to punish the one, and not the other? for it may with as good colour of reason be said, that all the Laws in the old Testament, for drawing of the sword against Sodomites, Adulterers and such like, were typical and temporary, and are done away now in Christ, for Christ will have these converted in as spiritual a way by the only power of the word of God as the other and no where in any express law in the New Testament doth God command to use the bloody sword against them, more than against blasphemers.</p></blockquote>

<blockquote><p>Where the Lord does not dwell, peace will not inhabit. How frequently may we observe, in their family connexions, discord and enmity between man and wife, unkind parents, disobedient children, tyrannical masters, and treacherous servants? Thus they live, “hateful in themselves, and hating one another.” If they have what the world accounts prosperity, their hard master, Satan, so works upon their evil dispositions, that they can derive no real comfort.</p></blockquote>

<blockquote><p>On the 30 April 1845, the Edinburgh Presbytery of the Reformed Presbyterian Church of Scotland (Covenanter) passed a number of resolutions against chattel slavery and fellowship with slaveholding churches. The eighth resolution contains the following condemnation of the practice of racial segregation in the churches of America:

8. That while this Court express these views in reference to American slavery and the duties of the Churches, they cannot refrain from expressing their sympathy, not only with the oppressed slaves, but with the people of colour generally in that land, who, under the influence of cruel prejudices and unjust laws, are subjected to all manner of hardships and indignities in the whole intercourse of life.

Nor can this Court refrain from condemning the conduct of many of the churches in the United States, in reference to this matter, inasmuch as they sanction and strengthen these cruel prejudices and unjust laws, by preventing persons of colour, recognised as members of the church, from sitting in the same pews, and from taking their seats at the Lord’s table in company with their white brethren; thus in their public assemblies having respect to persons committing sin, and being convinced of the law as transgressors; and it is the conviction of this Court, that churches acting in this cruel and sinful manner, render themselves unworthy of fellowship with Christians and Christian churches, who desire to adhere consistently to the laws of Christ, the alone King and Head of his Church, with whom there is neither Greek nor Jew, circumcision nor uncircumcision, barbarian, Scythian, bond nor free; but himself all, and in all.

Joseph Wilson, Moderator.

Wm. Anderson, Clerk.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edinburgh-reformed-presbytery.html">Edinburgh Reformed Presbytery</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Deliverance of the Reformed Presbytery of Edinburgh on American slavery and church-fellowship with slave-holders (Edinburgh, 1845), p. 4.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>As with all the Reformers, Martin Bucer recognised that care for the poor was part the external observance of true religion and thus fell within the realm of the civil magistrate’s just and legal authority (Isaiah 49:23; 60:1-22). Nowadays, such teaching is caricatured as “socialism” and “statism” by Kuyperians, Libertarians and the devotees of American morality. Such perspectives, however, have little to do with historic Reformed political theology and will only serve provoke the wrath of God against such injustice:

And indeed we must be ashamed and grieve when the right care of the poor has already been restored in very many regions which still serve Antichrist, whereas the very ones who glory in the reception of the gospel and the Kingdom of Christ, although they are not unaware how necessary this practice is, and how much it is a part of the salutary religion of Christ, still fail to reestablish it.</p></blockquote>

</figure><figure class="quote" id="q-7fc339e327" data-kw="">
<blockquote><p>In 1857 the minister of Londonderry Reformed Presbyterian Church, the Revd Robert Nevin, visited the American Covenanter Synod. The letter below informs us of the reaction of the Americans to his visit and their interest in Roman Catholic mission and covenant renewal:

To the Moderator and the members of the Reformed Presbyterian Synod of Ireland.

Dear brethren,

[…] Your brother, Rev. R. Nevin, whose intention of visiting our land you mention, is present with us at our synodical meeting. It gives us great pleasure to say that we have been comforted by his appearing among us. In an address, which at our request he kindly delivered, he gave such and encouraging account of your estate – of the success of your various schemes for adorning the interests of the covenanted cause, especially your mission among the Roman Catholic population and of the fruits of your renewal of the covenants, as made our hearts glad. To us in our trials and difficulties, his words were cheering, and in fact that his kind and seasonable counsel was suited to animate us with a firmer purpose to go forward with the solemn work to which we had assigned the first two days of our meeting. […]

Samuel Sterrit, Mod

John G. Boyd, Clerk</p></blockquote>

<blockquote><p>In the midst of distinguishing biblical penal servitude from American slavery, the Synod of the Reformed Presbyterian Church of Scotland argued that the moral-judicial laws would form the basis for the civil codes of Christian nations during the church’s latter-day glory:

Those Hebrews alone were subjected to the servitude prescribed who had been convicted of some moral offence. There were especially, two crimes that were visited with this form of punishment – theft, for which they could make restitution, and the contraction of debt which they were unable to pay. How different the way which you act! It is not persons who have been guilty of offences deserving punishment, at the hand of the civil courts, that you are bringing into slavery, or keeping in it. Were you to seize upon all the incorrigible thieves, and all the fraudulent bankrupts that you could find in the Union, and carry them off to the plantations, to perform the labours you now exact from unoffending Africans, there would have been no ground for a charge of injustice. We would rather rejoice in your reviving the spirit of that sacred jurisprudence which was given in the volume of revelation by the Israelites, and which, we have no doubt, will yet furnish, in its great moral principles, the basis of that high judicial code which christian nations shall enjoy, when God will “make their officers peace, and their exactors righteousness.</p></blockquote>

<blockquote><p>In the midst of his critique of the Presbyterian Church in Ireland, the Revd James Kennedy, the Covenanter minister at Limavady (who later moved to America), pointed out that the PCI was inconsistent in professing adherence to the Westminster Standards while, at the same time, admitting those of erroneous sentiments into their pulpits:

Another step in reform we would endeavour to bring to our brethren to take would be the ceasing to employ to teach their congregations men whom in consistency they must consider to be erroneous in sentiment and principle. We have already referred to the fact, that members of the Assembly freely invite to their pulpits, to teach their people, Congregationalists and Baptists; and the time is not long past when even Methodists – known to be of Arminian sentiments – were to be found occasionally in the pulpits of Presbyterian ministers. […]

The Presbyterians of Ireland in the times of the Covenant acted not thus, for as [James Seaton] Reid well shews, when Arminians and Baptists attempted to shew their face in any locality, the most strenuous efforts were made to suppress their erroneous teachings. All this may be thought very uncharitable to Baptists, but really after all, men who deny that we are even baptized – hold us an unbaptized mass of unconverted professors, and must in consistency deny that we have a sacrament at all, and thus virtually unchurch us, deserve little charity at our hands, and we have no sympathy with the inconsistency of the men who by patronising such, pull Presbyterianism down with the one hand while they build it up with the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-kennedy.html">James Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tekel. The Reformed Presbyterian Church and the General Assembly of the Presbyterian Church in Ireland weighed in the balance of truth</cite>, (Londonderry, 1858), pp 24-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>24. And let us consider one another, etc. I doubt not but that he addresses the Jews especially in this exhortation. It is well­known how great was the arrogance of that nation; being the posterity of Abraham, they boasted that they alone, to the exclusion of all others, had been chosen by the Lord to inherit the covenant of eternal life. Inflated by such a privilege, they despised other nations, and wished to be thought as being alone in the Church of God; nay, they superciliously arrogated to themselves the name of being The Church. It was necessary for the Apostles to labor much to correct this pride; and this, in my judgment, is what the Apostle is doing here, in order that the Jews might not bear it ill that the Gentiles were associated with them and united as one body in the Church.

And first, indeed, he says, Let us consider one another; for God was then gathering a Church both from the Jews and from the Gentiles, between whom there had always been a great discord, so that their union was like the combination of fire and water. Hence the Jews recoiled from this, for they thought it a great indignity that the Gentiles, should be made equal with them. To this goad of wicked emulation which pricked them, the Apostle sets up another in opposition to it, even that of love; or the word παροξυσμὸς, which he uses, signifies the ardor of contention. Then that the Jews might not be inflamed with envy, and be led into contention, the Apostle exhorts them to a godly emulation, even to stimulate one another to love.

25. Not forsaking the assembling of ourselves together, etc. This confirms the view that has been given. The composition of the Greek word ought to be noticed; for ἐπὶ signifies an addition; then ἐπισυναγωγὴ, assembling together, means a congregation increased by additions. The wall of partition having been pulled down, God was then gathering those as his children who had been aliens from the Church; so the Gentiles were a new and unwonted addition to the Church. This the Jews regarded as a reproach to them, so that many made a secession from the Church, thinking that such a mixture afforded them a just excuse; nor could they be easily induced to surrender their own right; and further, they considered the right of adoption as peculiar, and as belonging exclusively to themselves. The Apostle, therefore, warns them, lest this equality should provoke them to forsake the Church; and that he might not seem to warn them for no reason, he mentions that this neglect was common to many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 239-40.</span></figcaption>

25. Not forsaking the assembling of ourselves together, etc. This confirms the view that has been given. The composition of the Greek word ought to be noticed; for ἐπὶ signifies an addition; then ἐπισυναγωγὴ, assembling together, means a congregation increased by additions. The wall of partition having been pulled down, God was then gathering those as his children who had been aliens from the Church; so the Gentiles were a new and unwonted addition to the Church. This the Jews regarded as a reproach to them, so that many made a secession from the Church, thinking that such a mixture afforded them a just excuse; nor could they be easily induced to surrender their own right; and further, they considered the right of adoption as peculiar, and as belonging exclusively to themselves. The Apostle, therefore, warns them, lest this equality should provoke them to forsake the Church; and that he might not seem to warn them for no reason, he mentions that this neglect was common to many.”

— John Calvin, Commentaries on the epistle of Paul the apostle to the Hebrews, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 239-40.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C24.+And+let+us+consider+one+another%2C+etc.+I+doubt+not+but+that+he+addresses+the+Jews+especially+in+this+exhortation.+It+is+well%C2%ADknown+how+great+was+the+arrogance+of+that+nation%3B+being+the+posterity+of+Abraham%2C+they+boasted+that+they+alone%2C+to+the+exclusion+of+all+others%2C+had+been+chosen+by+the+Lord+to+inherit+the+covenant+of+eternal+life.+Inflated+by+such+a+privilege%2C+they+despised+other+nations%2C+and+wished+to+be+thought+as+being+alone+in+the+Church+of+God%3B+nay%2C+they+superciliously+arrogated+to+themselves+the+name+of+being+The+Church.+It+was+necessary+for+the+Apostles+to+labor+much+to+correct+this+pride%3B+and+this%2C+in+my+judgment%2C+is+what+the+Apostle+is+doing+here%2C+in+order+that+the+Jews+might+not+bear+it+ill+that+the+Gentiles+were+associated+with+them+and+united+as+one+body+in+the+Church.%0A%0AAnd+first%2C+indeed%2C+he+says%2C+Let+us+consider+one+another%3B+for+God+was+then+gathering+a+Church+both+from+the+Jews+and+from+the+Gentiles%2C+between+whom+there+had+always+been+a+great+discord%2C+so+that+their+union+was+like+the+combination+of+fire+and+water.+Hence+the+Jews+recoiled+from+this%2C+for+they+thought+it+a+great+indignity+that+the+Gentiles%2C+should+be+made+equal+with+them.+To+this+goad+of+wicked+emulation+which+pricked+them%2C+the+Apostle+sets+up+another+in+opposition+to+it%2C+even+that+of+love%3B+or+the+word+%CF%80%CE%B1%CF%81%CE%BF%CE%BE%CF%85%CF%83%CE%BC%E1%BD%B8%CF%82%2C+which+he+uses%2C+signifies+the+ardor+of+contention.+Then+that+the+Jews+might+not+be+inflamed+with+envy%2C+and+be+led+into+contention%2C+the+Apostle+exhorts+them+to+a+godly+emulation%2C+even+to+stimulate+one+another+to+love.%0A%0A25.+Not+forsaking+the+assembling+of+ourselves+together%2C+etc.+This+confirms+the+view+that+has+been+given.+The+composition+of+the+Greek+word+ought+to+be+noticed%3B+for+%E1%BC%90%CF%80%E1%BD%B6+signifies+an+addition%3B+then+%E1%BC%90%CF%80%CE%B9%CF%83%CF%85%CE%BD%CE%B1%CE%B3%CF%89%CE%B3%E1%BD%B4%2C+assembling+together%2C+means+a+congregation+increased+by+additions.+The+wall+of+partition+having+been+pulled+down%2C+God+was+then+gathering+those+as+his+children+who+had+been+aliens+from+the+Church%3B+so+the+Gentiles+were+a+new+and+unwonted+addition+to+the+Church.+This+the+Jews+regarded+as+a+reproach+to+them%2C+so+that+many+made+a+secession+from+the+Church%2C+thinking+that+such+a+mixture+afforded+them+a+just+excuse%3B+nor+could+they+be+easily+induced+to+surrender+their+own+right%3B+and+further%2C+they+considered+the+right+of+adoption+as+peculiar%2C+and+as+belonging+exclusively+to+themselves.+The+Apostle%2C+therefore%2C+warns+them%2C+lest+this+equality+should+provoke+them+to+forsake+the+Church%3B+and+that+he+might+not+seem+to+warn+them+for+no+reason%2C+he+mentions+that+this+neglect+was+common+to+many.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentaries+on+the+epistle+of+Paul+the+apostle+to+the+Hebrews%2C+trans.+John+Owen+%281549%3B+n.p.%2C+1853%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%2C+1993%29%2C+xxii%2C+239-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03b79a484d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03b79a484d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/04/03/john-calvin-on-racial-integration-in-the-church-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-9dde05490c" data-kw="">
<blockquote><p>But though this has been said with reference to what is here handled, yet we may hence draw a general truth, — that no government is to be set up in the Church by the will of men, but that we are to wait for the command of God, and also that we ought to follow a certain rule in electing ministers, so that no one may intrude according to his own humour. Both these things ought to be distinctly noticed: for the Apostle here speaks not of persons only, but also of the office itself; nay, he denies that the office which men appoint without God’s command is lawful and divine. For as it appertains to God only to rule his Church, so he claims this right as his own, that is, to prescribe the way and manner of administration. I hence deem it as indisputable, that the Papal priesthood is spurious; for it has been framed in the workshop of men. God nowhere commands a sacrifice to be offered now to him for the expiation of sins; nowhere does he command priests to be appointed for such a purpose. While then the Pope ordains his priests for the purpose of sacrificing, the Apostle denies that they are to be counted lawful priests; they cannot therefore be such, except by some new privilege they exalt themselves above Christ, for he dared not of himself to take upon him this honour, but waited for the command of the Father. […] It hence appears that the greatest defect is the character of the office itself, that is, when men of themselves invent what God has never commanded. The less endurable then are those Romish sacrificers, who prattle of nothing but their own titles, that they may be counted sacred, while yet they have chosen themselves without any authority from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 116-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-e36ba5a74f" data-kw="">
<blockquote><p>But since our infants also ought to be baptized according to the promise of the Lord, “I will be your God, and the God of your seed” (Gen. 17:7), both the parents of the baptized infants and the ministers of the Church must take the responsibility that, as soon as they have matured, they will be diligently catechized and instructed in the doctrine of Christ, so that they may make for themselves publicly in church the profession of their faith which they were unable to do when they were baptized, confessing their sins, and embracing with a most grateful heart the grace of Baptism conferred on them in infancy, renouncing the world and Satan, and pledging themselves to the obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), pp 228-9.</span></figcaption>

</figure><figure class="quote" id="q-583cc3509c" data-kw="">
<blockquote><p>We are servants and not lords. I see never a word in this text, nay, in all the scripture that the Master of the feast sent out lords to woo home his bride; He “sent out His servants,” but not His lords. Read all the Bible from the beginning to the ending, you shall not find it. Daft men may dispute, and by respect may carry it away; but read all the Old and New Testament both, and let me see if ever this lord prelate, or that lord bishop, was sent to woo home his bride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-cant.html">Andrew Cant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The National Covenant. Sermon at Glasgow (1638) in James Kerr (ed.), The Covenants and the Covenanters: covenants, sermons, and documents of the Covenanted Reformation</cite></span></figcaption>

</figure><figure class="quote" id="q-4c390f119c" data-kw="">
<blockquote><p>You have state yourselves public witnesses for Jesus Christ, who profess to adhere to, and propagate his injured truths, and to commemorate with thankfulness the remarkable mercies, which he has bestowed on our Church and Nation, and to testify against and mourn over our own and our fathers’ fearful backsliding from that Covenanted work of Reformation once attained in our land. See that you be judicious, upright, constant and faithful in your profession. I now approach death heartily satisfied, with our excellent Westminster Confession of Faith, Catechisms and Form of Church Government, and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the Doctrines and practice the duties therein contained. […] Study to see everything with your own eyes but never indulge and itch after NOVELTIES! Most of those which are now esteemed such, are nothing but OLD ERRORS which were long ago justly refuted, varnished over with some new expressions. If I mistake not the Churches are entering into a fearful cloud of apostacy and trouble! But he that endures to the end shall be saved. Be ye faithful unto death and Christ shall give you a crown of life.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“You have state yourselves public witnesses for Jesus Christ, who profess to adhere to, and propagate his injured truths, and to commemorate with thankfulness the remarkable mercies, which he has bestowed on our Church and Nation, and to testify against and mourn over our own and our fathers’ fearful backsliding from that Covenanted work of Reformation once attained in our land. See that you be judicious, upright, constant and faithful in your profession. I now approach death heartily satisfied, with our excellent Westminster Confession of Faith, Catechisms and Form of Church Government, and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the Doctrines and practice the duties therein contained. […] Study to see everything with your own eyes but never indulge and itch after NOVELTIES! Most of those which are now esteemed such, are nothing but OLD ERRORS which were long ago justly refuted, varnished over with some new expressions. If I mistake not the Churches are entering into a fearful cloud of apostacy and trouble! But he that endures to the end shall be saved. Be ye faithful unto death and Christ shall give you a crown of life.”

wer+of+the+civil+magistrate+about+sacred+%2C+%281780%3B+Glasgow%2C+1803%29%2C+xviii-xix.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c390f119c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c390f119c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/03/02/john-brown-of-haddington-on-the-responsibility-of-divinity-students-to-promote-the-covenanted-reformation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>At length, it was attempted by the horrible blasphemies of Michael Servetus, not a man, but a monster of all wickedness, in reference to the adorable mystery of the holy Trinity. This most abandoned man, although often warned, did not cease disgorging the most pestiferous poison among the common people, which he had already scattered for many years in the celebrated places of Europe. At length being thrown into prison and persevering in his diabolical obstinacy, he suffered the most just punishment of execrable impiety in the year 1553.</p></blockquote>

<blockquote><p>On the other hand, we must labour for humility, prudence, gentleness, meekness. A man may be very zealous and resolute, and yet very meek and merciful: Jesus Christ was a Lion and yet a Lamb also; in one place, He telleth them He cometh to send “fire on the earth:” and, in another place, rebuketh His disciples “for their fiery spirits.” There was the composition in Moses, and in Paul; and it is of great use, especially in this work of reformation.

I have not observed any disputes carried on with more bitterness in men’s writings, and with a more unsanctified heat of spirit, yea, and by godly men too, than in controversies about discipline, church government, ceremonies, and the like. Surely, to argue about government with such ungoverned passions, to argue for reformation with a spirit so unreformed, is very uncomely.

Let us be zealous, as Christ was, to cast out all, to extirpate and root out every plant His heavenly Father hath not planted; and yet let us do it in an orderly way, and with the Spirit of Christ, whose servants we are. “The servant of the Lord must not strive, but be gentle to all men, apt to teach, patient, in meekness instructing those that oppose.” We solemnly engage this day our utmost endeavours for reformation; let us remember this, that too much heat, as well as too much coldness, may harden men in their ways, and hinder reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>

</figure><figure class="quote" id="q-bf179d3ba9" data-kw="">
<blockquote><p>Her ministry should be learned and pious. Without the former, they will only betray, through ignorance, their cause into the hands of the enemy; without the latter, they will pollute the sacred sanctuary.

Consider, for a moment, what a ridiculous figure the ambassador sent to negotiate with a foreign nation would make, who could not read his master’s commission. Would such an one be qualified to be an ambassador to an earthly potentate? Is not the negotiation of the King of kings much more important than the adjustment of the differences between states and empires?

When Christ called his ministers in an extraordinary manner, he gave them extraordinary qualifications: and among these we find the gift of tongues. In 1 Tim. 1:7, those are severely reprehended, who presume to enter on an office without due qualifications: “desiring to be teachers of the law, yet understanding neither what they say, nor whereof they affirm.” Such are the clouds of illiterate, methodistic locusts which darken the horizon of these States. Without abilities, natural or acquired, they pour forth like torrents, over the face of the earth, and lead aside the simple and unwary. The infuriated zeal with which they propagate their poisonous doctrines, resembles much the character of the Scribes and Pharisees, mentioned, Matt. 23:15: “Who compass sea and land to make one proselyte, and when he is made, he is rendered twofold more the child of hell than themselves.”

Without a due measure of learning, how can they meet the cavillings of deists and crafty impostors, and so act the part of an evangelist, required, Tit. 1:9, namely, to be able to convince the gainsayers, and put adversaries to silence?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 30-1.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-da357d4baf" data-kw="">
<blockquote><p>[I]f any do not permit themselves to be catechized and taught and refuse to follow all the precepts of Christ and to make a legitimate profession of faith and of the obedience to be rendered to Christ and his Church, they ought to be rejected from the company of the saints and the communion of the sacraments, because those who are of this kind openly repudiate the grace of Baptism and altogether separate themselves from the Kingdom of Christ. For the precept of the Lord is manifest in the last chapter of Matthew: that the baptized must be taught to observe whatever he himself has commanded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), pp 229-30.</span></figcaption>

<blockquote><p>The terms of Communion in the Reformed Presbyterian Church are certainly more comprehensive than those in force in any other denomination. It is necessary that all who become members acknowledge the inspiration and infallibility of the Old and New Testaments; the agreeableness of the Confession of Faith and Catechisms (Larger and Shorter) with the Word of God; the divine right of Presbyterianism; the perpetual obligation of the National Covenant and Solemn League and Covenant; practical dissent from all national constitutions that ignore the Lord Jesus Christ as King of nations, and the duty of adorning the doctrine of God our Saviour by a life of godliness. No Church in the world has a larger creed for membership. […]

The popular cry now is for a brief creed, and the avowed object of this cry is that larger numbers may be led into the membership of the Church. The more comprehensive and intensive the creed the fewer must the members of the Church be; the fewer and less explicit the articles of the creed the more numerous will be the members. A creed with many articles is said to be a stumbling-block in the way of those without, to burden the Church and diminish her influence. It is true, doubtless, that a large creed is the occasion of much unpopularity meanwhile, but the adoption of the policy implied in the objection would abolish all creeds, however brief and narrow. […] To remove any truth from the creed of a Church is to strip her of part of the armour with which she is to gird herself for the duty required of her by her great Commander-in-chief. It is to limit and narrow the area on which she stands, and so bind her arms – her powers and influence. “The faith which was once for all delivered unto the saints” is one body; it is a perfect unity; and the Church that attempts to mutilate that perfect body incurs a dread responsibility. Her offence against the Lord is aggravated when this deed is perpetuated under the profession of breadth and enlargement. When the policies of ecclesiastical procedure have the peacock feathers of liberality and charity, with which they have been adorned, plucked off, they stand revealed as vultures which, with unrestrained appetite, would devour the whole body of revealed truth, and reduce the Christian and the Church to a condition of lamentable leanness – the mere skeletons of Christians and Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-kerr.html">James Kerr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterianism: its special claims</cite>, (Belfast, 1895), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-13f458389c" data-kw="">
<blockquote><p>The early Reformed Presbyterians and Seceders opposed evangelical latitudinarianism, the idea that important doctrines could be laid aside so that we can all stand “together for the gospel”. This mindset is similar to that of Liberalism, in that it thinks that some biblical truths are “essentials”, while others are “non-essentials”. Although it is true that some dogmas are more important than others, once something has been confessed by the church as biblical teaching it cannot be dismissed as a non-essential; if it was a non-essential God would not have put it in the Bible. Such was the extent of their opposition to such pernicious ideas, that the Anti-Burgher Seceders in Ireland declared it to be a disciplinarian offence for their people to join with latitudinarian evangelical groups:

[…] Evangelical Society of Ulster, question of discipline of such of our Communion as have connection with the same. […] Synod decided unanimously that such as join the Evangelical Society were following a divisive course &amp; that such should be tenderly dealt with, and that while all encouragement should be given to praying societies in our own congregations persons belonging to our communion should be admonished to withdraw from private religious societies not under our inspection […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/associate-synod-of-ireland.html">Associate Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts &amp; proceedings of the Associate Synod of Ireland (Anti-Burgher) 1788-1818, 29 July 1800 (P.R.O.N.I., Belfast, D/3815/D/4), pp 62-3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>There is a great ignorance even of the very first principles of religion. It will be very easy, Sirs, to introduce Popery into Scotland. Oh, the gross ignorance of our principles that are contained in our Catechisms, larger and shorter, and Confession of Faith, sworn to in the Covenants.</p></blockquote>

</figure><figure class="quote" id="q-9676dfb93d" data-kw="">
<blockquote><p>That the Distinctive Principles may be maintained without compromise, the Reformed Presbyterian Church believes in and practices Close Communion. Both reason and revelation are in accord with this stand. Apart from Close Communion the discipline of the Church cannot be maintained. Common sense teaches that it is a glaring inconsistency to testify against anti-Christian doctrines and practices and at the same time admit to the highest privileges of the Church those who adhere to said doctrines and practices. For example, if a member of a Reformed Presbyterian congregation were to join an oath-bound secret society, it would be the duty of the Session to discipline him, and if he refused to retract, to exclude him from the Lord’s Table. The Lord’s Supper is the highest and holiest privilege which the Church has to offer. Would it be consistent for the Church to permit a non-member who belonged to an oath-bound secret society to partake of the Communion while at the same time it prohibited one of its own members on the ground that he belonged to the same society? The Communion is of value to the Church only to the extent to which her members are bound together by the common faith and a common life with one another and with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-b-tweed.html">J. B. Tweed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The communicants’ class</cite>, (2nd edn, Newton, 1960), p. 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>
<div class="actions"><button class="copy" data-copy="“That the Distinctive Principles may be maintained without compromise, the Reformed Presbyterian Church believes in and practices Close Communion. Both reason and revelation are in accord with this stand. Apart from Close Communion the discipline of the Church cannot be maintained. Common sense teaches that it is a glaring inconsistency to testify against anti-Christian doctrines and practices and at the same time admit to the highest privileges of the Church those who adhere to said doctrines and practices. For example, if a member of a Reformed Presbyterian congregation were to join an oath-bound secret society, it would be the duty of the Session to discipline him, and if he refused to retract, to exclude him from the Lord’s Table. The Lord’s Supper is the highest and holiest privilege which the Church has to offer. Would it be consistent for the Church to permit a non-member who belonged to an oath-bound secret society to partake of the Communion while at the same time it prohibited one of its own members on the ground that he belonged to the same society? The Communion is of value to the Church only to the extent to which her members are bound together by the common faith and a common life with one another and with Christ.”

</figure><figure class="quote" id="q-7bd0210acb" data-kw="">
<blockquote><p>In the answer to question 191 of the Westminster Larger Catechism (“What do we pray for in the second petition [of the Lord’s prayer]?”), the Westminster divines instructed us to pray that the church would be ‘countenanced and maintained by the civil magistrate’. Some have argued that this binds us to believe in the establishment principle, but that it does not require us to believe in state endowment of the church. J. G. Vos, however, recognised that the establishment principle as confessed in the Westminster Standards did demand that the church be endowed by the state. Thus when commenting on this part of the catechism he wrote, ‘When the catechism was written, 350 years ago, the prevailing idea on this question was that there was to be an official or established church, which would not only be recognized by the civil government as the true visible church of Jesus Christ, but also be supported financially from the national treasury’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-g-vos.html">J. G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: a commentary</cite>, ed. G. I. Williamson (Philipsburg, 2002), p. 555.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>Yea, we doubt not to prove the kingdom of the pope to be the kingdom and power of Antichrist. And therefore, my Lords, I cannot cease in the name of Christ Jesus to require of you that the matter may come in examination, and that ye, the estates of the realm, by your authority compel such as will be called bishops not only to desist from their cruel murdering of such as do study to promote God’s glory in detecting and disclosing the damnable impiety of that man of sin, the Roman Antichrist, but also that ye compel them to answer to such crimes as shall be laid to their charge for not righteously instructing the flock committed to their cares.</p></blockquote>

</figure><figure class="quote" id="q-d591808529" data-kw="">
<blockquote><p>How cruel are men grown to their little infants, by keeping of them from the seal of entrance into the Kingdom of heaven, and making their children (their own children) to be just in the same condition with the children of Turks and Infidels? I remember at the beginning of these wars there was a great fear fell upon godly people about their little children, and all their care was for their preservation, and their safety; and for the continuance of the Gospel to them, &amp;c.

But now our little children are likely to be in a worser condition then ever. The Oxford Army labour to steal away the Gospel from them, and the Anabaptist labours to steal away the seal of the covenant of Grace from them; and that which is worser then all, there are some godly people love to have it so. And all this has come upon us as a just punishment for our Baptismal covenant-breaking.</p></blockquote>

</figure><figure class="quote" id="q-85240cd66f" data-kw="">
<blockquote><p>But there are churches which also, to a large extent, take worldly expediency as their rule; for in some churches, almost any person will be taken into membership, if he can but pay his way. Members of Secret Societies – such as Freemasons, Orangemen, Good Templars, &amp;c. – are quite welcome, although the whole spirit of the Bible is in direct antagonism to all Secret Societies.

The fundamental principle of that popular order, Freemasons, is in flat opposition to the law of love, as laid down by Christ in the New Testament. Freemasons love and do good to Freemasons; but Christ teaches that we should love and do good to all men. The good Samaritan was good and kind to the man who fell among thieves, although the man was not a Freemason; and neither the man nor the Samaritan knew anything at all about grips, signs, or secret pass-words.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But there are churches which also, to a large extent, take worldly expediency as their rule; for in some churches, almost any person will be taken into membership, if he can but pay his way. Members of Secret Societies – such as Freemasons, Orangemen, Good Templars, &amp;c. – are quite welcome, although the whole spirit of the Bible is in direct antagonism to all Secret Societies.

The fundamental principle of that popular order, Freemasons, is in flat opposition to the law of love, as laid down by Christ in the New Testament. Freemasons love and do good to Freemasons; but Christ teaches that we should love and do good to all men. The good Samaritan was good and kind to the man who fell among thieves, although the man was not a Freemason; and neither the man nor the Samaritan knew anything at all about grips, signs, or secret pass-words.”

<blockquote><p>7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.</p></blockquote>

<blockquote><p>That God wills the good of men in bestowing any good gifts or graces upon them, needed no proof at all: We have always willingly granted this proposition. Yet for the true understanding thereof it must be observed that when we say, ‘This is God’s will; this is God’s aim or intent,’ these words have not always the same signification. This author [Samuel Hoard, an Arminian], by confounding the diverse meaning of these and the like words, does strangely entangle himself through his whole discourse. First therefore: Anything is said to be according to God’s will which, considered in itself, is according to the goodness and pureness of the Divine nature. This is a perpetual and necessary volition in God, qua Deo placet omne bonum [by which God is pleased by every good thing]. (See [Diego] Ruiz [d. 1632], Of the Will of God, disp. 6, §2, p. 38) And this simplex complacentia [simple complacency] towards all good actions of men, or events unto men, is possible circa creaturas omnes etiam nunquam futuras [about all creatures, even which will never be]. For there is no goodness imaginable which has not an agreement with the good will of God which we call amorem simplicis complacentiae [a love of simple complacency]. Satis constat hujusmodi complacentiam Dei versari circa poenitentiam, gratiam et gloriam possibilem Judae aut cujus libet damnati [It is sufficiently clear that this kind of complacency in God has reference to the possible repentance, grace, and glory of Judas, or of any damned person whatsoever]. (Ruiz, disp. 19, p. 214) But this is not it which we now speak of. 2. Secondly, God is said to will, desire or aim-at that good, for the obtaining whereof He affords fitting means, though withal He wills that it shall be in the liberty of the creature to hinder and frustrate those means, and though He have absolutely decreed to permit the creature to abuse them unto his own destruction. This is that which usually is termed by divines voluntas antecedens, voluntas conditionata, voluntas simplicis complacentiae [the will preceding, will-conditioned, will of simple complacency]. And thus God is said to aim-at or to will and desire the conversion, justification and salvation of those who never shall be converted, justified or saved. Neither must we think that by these men God’s omnipotent will is crossed, because his voluntas simplicis complacentiae [will of simple complacency] is not fulfilled. For the absolute will of God was that in such persons their own free-will might hinder the good effect of his gifts and graces, which He was absolutely resolved to permit for some greater good. Lastly, there is a will in God which strictly and most properly is called voluntas beneplaciti [will of good-pleasure] or his absolute will, which is not only a liking of the good willed unto the creature, and an ordering of fit means whereby the creature (if his own free-will hinder not) may attain it, but a merciful decree of so ordering the means and the very will of the creature, that it shall infallibly and infrustrately obtain the good end whereunto such means were accommodated. And of this will Ruiz truly affirms: Sola haec voluntas absoluta simpliciter amplectitur objectum, et ideo sola simpliciter et absolute meretur nomen voluntatis Beneplaciti [Only this absolute will simply embraces its object, and therefore only it, simply and absolutely, deserves the name of the will of good pleasure.]. (disp. 18, §4, p. 185) We grant, therefore, that in the second acception of the word ‘will,’ God truly wills, likes, desires the repentance, faith, perseverance and salvation of all to whom the Gospel is preached and Christ offered. But in the last and most proper acception, God wills the perseverance and salvation only of his elect, in whom He never ceases working till the happy effect be produced. Our divines at [the Synod of] Dort [1618-1619] granted a true and serious will in God according to the second acception of the word ‘will,’ but not according to the last. Which will simplicis complacentiae [of simple complacency] may stand with absolute reprobation. If this author can be content to acknowledge that for a true, serious and no delusory will, which affords the creature means of repenting, believing and being saved, though under an eternal absolute decree of permitting the final disobedience and perdition of the creature, we will free him from the trouble of answering the places of Scripture, and with him embrace the interpretation of Damascene, who tells us (Of the Orthodox Faith, bk. 4, ch. 20) that albeit the Scriptures do in such places seem to make God’s benefits causes of man’s sin and ruin, yet they must be understood [Greek], not [Greek]. A physician does give his patient physick with an absolute will to cure so far as his skill and ability will stretch: But God does not always give the means of salvation unto all men out of his absolute will, for then all should be cured and saved. Ps. 135, Omnia quaecunque voluit Deus, fecit in coelo et in terra [All which God wills is done in heaven and in earth]. Fulgentius gives the reason (1 ad Mon., ch. 12), Quia cui semper subest cum volet posse, non aliud est in illo velle quam posse [For to whom there is always present the ability whenever he wills, in him to will is nothing other than to be able.]. The will of God inviting or moving men to perform such good acts as tend to their salvation is God’s true and serious will, though He have not decreed by such means to produce their salvation. (See [Michael] Bajus, Institutes, bk. 1, ch. 104, etc. etc. 115, 116) This will is often despised by men to their own damnation. But there is a will not only ordaining means to the end, but of causing men to use the means unto the consecution of the end. And thus by giving them special grace, God wills the kingdom of glory only unto the elect. The former will is not to be baffled with the name of dissimulation, because this latter is only it which brings men unto glorification. And we further add that the reprobates in resisting the former will, which is vera voluntas simplicis complacentiae [the true will of simple complacency], do always fulfill the latter, which is God’s absolute will of permitting this resistance and of gathering out of it a greater illustration of his own glory. The blessings and means which God out of his goodness afforded to the angels, to Adam and which He continually affords unto wicked men, by the ill frame of their hearts may be and have been turned to their own hurt; and yet we cannot but acknowledge in them an antecedent and gracious will to do them good. But we do acknowledge, over and above this will of complacency, an absolute will of efficiency, by which God has mercifully decreed to work in some persons the will and the deed, and by the means of grace, de facto, to bring them unto glory. These two different manners of willing and working the salvation of men do demonstrate an absolute will in God of saving some, which we call the absolute decree of their election, and an absolute will of permitting others to draw upon themselves damnation by voluntary abusing the means of grace, which we call absolute reprobation. Chrysostom (who is no depressor of man’s free-will) was not ignorant of this absolute will of God turning and bending man’s which way He pleases: Si Deus voluerit, nullus impediet [If God wills, none impedes]. (See many times in homily 2 on Ps. 50) And of this will St. Augustine speaks (Enchiridion, ch. 97): In coelo et in terra non quaedam voluit et fecit, quaedam vero voluit et non fecit, sed omnia quaecun{que} voluit fecit. [In heaven and on earth, He did not will some things and accomplish them and will other things but not accomplish them; rather, He accomplished all things whatsoever He willed.] And St. Jerome, speaking of the Samaritans, says (apud Petr. Diac.): Si voluisset, ex indevotis devotos fecisset [If He had willed, He had made the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>

ade the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].”

— John Davenant, Animadversions upon a Treatise entitled, God’s Love to Mankind, ... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 390-93">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+God+wills+the+good+of+men+in+bestowing+any+good+gifts+or+graces+upon+them%2C+needed+no+proof+at+all%3A+We+have+always+willingly+granted+this+proposition.+Yet+for+the+true+understanding+thereof+it+must+be+observed+that+when+we+say%2C+%E2%80%98This+is+God%E2%80%99s+will%3B+this+is+God%E2%80%99s+aim+or+intent%2C%E2%80%99+these+words+have+not+always+the+same+signification.+This+author+%5BSamuel+Hoard%2C+an+Arminian%5D%2C+by+confounding+the+diverse+meaning+of+these+and+the+like+words%2C+does+strangely+entangle+himself+through+his+whole+discourse.+First+therefore%3A+Anything+is+said+to+be+according+to+God%E2%80%99s+will+which%2C+considered+in+itself%2C+is+according+to+the+goodness+and+pureness+of+the+Divine+nature.+This+is+a+perpetual+and+necessary+volition+in+God%2C+qua+Deo+placet+omne+bonum+%5Bby+which+God+is+pleased+by+every+good+thing%5D.+%28See+%5BDiego%5D+Ruiz+%5Bd.+1632%5D%2C+Of+the+Will+of+God%2C+disp.+6%2C+%C2%A72%2C+p.+38%29+And+this+simplex+complacentia+%5Bsimple+complacency%5D+towards+all+good+actions+of+men%2C+or+events+unto+men%2C+is+possible+circa+creaturas+omnes+etiam+nunquam+futuras+%5Babout+all+creatures%2C+even+which+will+never+be%5D.+For+there+is+no+goodness+imaginable+which+has+not+an+agreement+with+the+good+will+of+God+which+we+call+amorem+simplicis+complacentiae+%5Ba+love+of+simple+complacency%5D.+Satis+constat+hujusmodi+complacentiam+Dei+versari+circa+poenitentiam%2C+gratiam+et+gloriam+possibilem+Judae+aut+cujus+libet+damnati+%5BIt+is+sufficiently+clear+that+this+kind+of+complacency+in+God+has+reference+to+the+possible+repentance%2C+grace%2C+and+glory+of+Judas%2C+or+of+any+damned+person+whatsoever%5D.+%28Ruiz%2C+disp.+19%2C+p.+214%29+But+this+is+not+it+which+we+now+speak+of.+2.+Secondly%2C+God+is+said+to+will%2C+desire+or+aim-at+that+good%2C+for+the+obtaining+whereof+He+affords+fitting+means%2C+though+withal+He+wills+that+it+shall+be+in+the+liberty+of+the+creature+to+hinder+and+frustrate+those+means%2C+and+though+He+have+absolutely+decreed+to+permit+the+creature+to+abuse+them+unto+his+own+destruction.+This+is+that+which+usually+is+termed+by+divines+voluntas+antecedens%2C+voluntas+conditionata%2C+voluntas+simplicis+complacentiae+%5Bthe+will+preceding%2C+will-conditioned%2C+will+of+simple+complacency%5D.+And+thus+God+is+said+to+aim-at+or+to+will+and+desire+the+conversion%2C+justification+and+salvation+of+those+who+never+shall+be+converted%2C+justified+or+saved.+Neither+must+we+think+that+by+these+men+God%E2%80%99s+omnipotent+will+is+crossed%2C+because+his+voluntas+simplicis+complacentiae+%5Bwill+of+simple+complacency%5D+is+not+fulfilled.+For+the+absolute+will+of+God+was+that+in+such+persons+their+own+free-will+might+hinder+the+good+effect+of+his+gifts+and+graces%2C+which+He+was+absolutely+resolved+to+permit+for+some+greater+good.+Lastly%2C+there+is+a+will+in+God+which+strictly+and+most+properly+is+called+voluntas+beneplaciti+%5Bwill+of+good-pleasure%5D+or+his+absolute+will%2C+which+is+not+only+a+liking+of+the+good+willed+unto+the+creature%2C+and+an+ordering+of+fit+means+whereby+the+creature+%28if+his+own+free-will+hinder+not%29+may+attain+it%2C+but+a+merciful+decree+of+so+ordering+the+means+and+the+very+will+of+the+creature%2C+that+it+shall+infallibly+and+infrustrately+obtain+the+good+end+whereunto+such+means+were+accommodated.+And+of+this+will+Ruiz+truly+affirms%3A+Sola+haec+voluntas+absoluta+simpliciter+amplectitur+objectum%2C+et+ideo+sola+simpliciter+et+absolute+meretur+nomen+voluntatis+Beneplaciti+%5BOnly+this+absolute+will+simply+embraces+its+object%2C+and+therefore+only+it%2C+simply+and+absolutely%2C+deserves+the+name+of+the+will+of+good+pleasure.%5D.+%28disp.+18%2C+%C2%A74%2C+p.+185%29+We+grant%2C+therefore%2C+that+in+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+God+truly+wills%2C+likes%2C+desires+the+repentance%2C+faith%2C+perseverance+and+salvation+of+all+to+whom+the+Gospel+is+preached+and+Christ+offered.+But+in+the+last+and+most+proper+acception%2C+God+wills+the+perseverance+and+salvation+only+of+his+elect%2C+in+whom+He+never+ceases+working+till+the+happy+effect+be+produced.+Our+divines+at+%5Bthe+Synod+of%5D+Dort+%5B1618-1619%5D+granted+a+true+and+serious+will+in+God+according+to+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+but+not+according+to+the+last.+Which+will+simplicis+complacentiae+%5Bof+simple+complacency%5D+may+stand+with+absolute+reprobation.+If+this+author+can+be+content+to+acknowledge+that+for+a+true%2C+serious+and+no+delusory+will%2C+which+affords+the+creature+means+of+repenting%2C+believing+and+being+saved%2C+though+under+an+eternal+absolute+decree+of+permitting+the+final+disobedience+and+perdition+of+the+creature%2C+we+will+free+him+from+the+trouble+of+answering+the+places+of+Scripture%2C+and+with+him+embrace+the+interpretation+of+Damascene%2C+who+tells+us+%28Of+the+Orthodox+Faith%2C+bk.+4%2C+ch.+20%29+that+albeit+the+Scriptures+do+in+such+places+seem+to+make+God%E2%80%99s+benefits+causes+of+man%E2%80%99s+sin+and+ruin%2C+yet+they+must+be+understood+%5BGreek%5D%2C+not+%5BGreek%5D.+A+physician+does+give+his+patient+physick+with+an+absolute+will+to+cure+so+far+as+his+skill+and+ability+will+stretch%3A+But+God+does+not+always+give+the+means+of+salvation+unto+all+men+out+of+his+absolute+will%2C+for+then+all+should+be+cured+and+saved.+Ps.+135%2C+Omnia+quaecunque+voluit+Deus%2C+fecit+in+coelo+et+in+terra+%5BAll+which+God+wills+is+done+in+heaven+and+in+earth%5D.+Fulgentius+gives+the+reason+%281+ad+Mon.%2C+ch.+12%29%2C+Quia+cui+semper+subest+cum+volet+posse%2C+non+aliud+est+in+illo+velle+quam+posse+%5BFor+to+whom+there+is+always+present+the+ability+whenever+he+wills%2C+in+him+to+will+is+nothing+other+than+to+be+able.%5D.+The+will+of+God+inviting+or+moving+men+to+perform+such+good+acts+as+tend+to+their+salvation+is+God%E2%80%99s+true+and+serious+will%2C+though+He+have+not+decreed+by+such+means+to+produce+their+salvation.+%28See+%5BMichael%5D+Bajus%2C+Institutes%2C+bk.+1%2C+ch.+104%2C+etc.+etc.+115%2C+116%29+This+will+is+often+despised+by+men+to+their+own+damnation.+But+there+is+a+will+not+only+ordaining+means+to+the+end%2C+but+of+causing+men+to+use+the+means+unto+the+consecution+of+the+end.+And+thus+by+giving+them+special+grace%2C+God+wills+the+kingdom+of+glory+only+unto+the+elect.+The+former+will+is+not+to+be+baffled+with+the+name+of+dissimulation%2C+because+this+latter+is+only+it+which+brings+men+unto+glorification.+And+we+further+add+that+the+reprobates+in+resisting+the+former+will%2C+which+is+vera+voluntas+simplicis+complacentiae+%5Bthe+true+will+of+simple+complacency%5D%2C+do+always+fulfill+the+latter%2C+which+is+God%E2%80%99s+absolute+will+of+permitting+this+resistance+and+of+gathering+out+of+it+a+greater+illustration+of+his+own+glory.+The+blessings+and+means+which+God+out+of+his+goodness+afforded+to+the+angels%2C+to+Adam+and+which+He+continually+affords+unto+wicked+men%2C+by+the+ill+frame+of+their+hearts+may+be+and+have+been+turned+to+their+own+hurt%3B+and+yet+we+cannot+but+acknowledge+in+them+an+antecedent+and+gracious+will+to+do+them+good.+But+we+do+acknowledge%2C+over+and+above+this+will+of+complacency%2C+an+absolute+will+of+efficiency%2C+by+which+God+has+mercifully+decreed+to+work+in+some+persons+the+will+and+the+deed%2C+and+by+the+means+of+grace%2C+de+facto%2C+to+bring+them+unto+glory.+These+two+different+manners+of+willing+and+working+the+salvation+of+men+do+demonstrate+an+absolute+will+in+God+of+saving+some%2C+which+we+call+the+absolute+decree+of+their+election%2C+and+an+absolute+will+of+permitting+others+to+draw+upon+themselves+damnation+by+voluntary+abusing+the+means+of+grace%2C+which+we+call+absolute+reprobation.+Chrysostom+%28who+is+no+depressor+of+man%E2%80%99s+free-will%29+was+not+ignorant+of+this+absolute+will+of+God+turning+and+bending+man%E2%80%99s+which+way+He+pleases%3A+Si+Deus+voluerit%2C+nullus+impediet+%5BIf+God+wills%2C+none+impedes%5D.+%28See+many+times+in+homily+2+on+Ps.+50%29+And+of+this+will+St.+Augustine+speaks+%28Enchiridion%2C+ch.+97%29%3A+In+coelo+et+in+terra+non+quaedam+voluit+et+fecit%2C+quaedam+vero+voluit+et+non+fecit%2C+sed+omnia+quaecun%7Bque%7D+voluit+fecit.+%5BIn+heaven+and+on+earth%2C+He+did+not+will+some+things+and+accomplish+them+and+will+other+things+but+not+accomplish+them%3B+rather%2C+He+accomplished+all+things+whatsoever+He+willed.%5D+And+St.+Jerome%2C+speaking+of+the+Samaritans%2C+says+%28apud+Petr.+Diac.%29%3A+Si+voluisset%2C+ex+indevotis+devotos+fecisset+%5BIf+He+had+willed%2C+He+had+made+the+impious+pious%5D.+And+that+prayer+of+Basil+is+famous+%28On+the+Incarnation%2C+ch.+8%29%3A+Malos%2C+quaesumus%2C+bonos+facito%3B+bonos+in+bonitate+conserva.+Omnia+enim+potes%3A+quem+enim+volueris%2C+salvas%3A+et+non+est+qui+resistat+tibi.+%5BMake+the+wicked+good%2C+we+beseech+You%3B+preserve+the+good+in+goodness.+For+You+can+do+all+things%3A+whomsoever+You+will%2C+You+save%3B+and+there+is+none+who+may+resist+You.%5D+Since+therefore+the+Scriptures+and+the+Fathers%2C+and+all+orthodox+divines%2C+who+confess+that+to+be+a+true+will+which+by+affording+ordinary+means+aims+at+the+sanctification+%281+Tim.+4%3A3%29+and+salvation+of+all+men+%281+Tim.+2%3A4%29%2C+do+notwithstanding%2C+intimate+unto+us+an+absolute+will+eternally+predestinating+and+in+time+infallibly+working+the+salvation+only+of+some+men%3B+it+is+but+a+weak+kind+of+reasoning+from+the+affirmation+of+the+one+to+conclude+a+negation+of+the+other.+The+doctrine+of+absolute+election+and+reprobation+infers+that+God+had+not+an+absolute+will+by+those+means+of+grace+which+He+bestowed+upon+the+non-elect+angels+or+men+to+bring+them+unto+glory%3B+and+that+He+had+an+absolute+will+to+permit+themselves+to+abuse+them+to+the+procuring+of+their+own+eternal+misery%3A+And+yet+he+that+should+say+that+God+by+giving+the+non-elect+angels+such+excellent+endowments%2C+or+by+giving+Cain+and+Judas+such+fatherly+admonitions%2C+did+in+those+means+aim+at+their+destruction%2C+speaks+both+ignorantly+and+profanely.+For+the+aim+of+God+and+the+end+of+any+good+gift+which+He+vouchsafes+unto+men%2C+is+to+be+measured+by+the+nature+of+the+gift+itself+and+not+by+the+perverse+use+which+God+suffers+the+receivers+to+make+of+it.+Calvin+usually+speaks+in+the+Scripture-phrase%2C+even+in+those+points+which+seem+harsh+to+the+ears+of+the+Remonstrants.+But+this+author+having+before+truly+explained+how+such+phrases+are+to+be+understood%2C+namely+of+the+end+whereunto+reprobates+always+finally+abuse+them%2C+and+not+of+the+end+whereunto+God+has+ordained+them%2C+he+had+done+much+better+to+have+afforded+Calvin%E2%80%99s+words+this+charitable+construction.+And+as+for+Beza%2C+he+denies+not+a+proper+and+true+ordination+of+the+divine+grace+unto+the+effecting+of+salvation+in+all+to+whom+it+is+afforded%2C+nor+a+true+will+of+complacency+in+God%2C+that+by+them+it+should+be+used+to+that+good+end%3A+but+he+denies+an+absolute+will+in+God+of+saving+them+by+that+grace%3B+and+he+shows+the+end+which+the+wicked+always+come+to+by+abusing+it%2C+which+is%2C+ut+gravius+puniantur+%5Bthat+they+are+more+severely+punished%5D.+That+Calvin+had+no+other+meaning%2C+appears+by+these+words+of+his+which+shut-up+the+section+out+of+which+the+former+are+taken%3A+Quid+sibi+vult+Dominus+eos+docendo+a+quibus+ne+intelligatur+curat%3F+Considera+unde+vitium%2C+et+desines+interrogare.+In+verbo+enim+qualiscunque+sit+obscuritas%2C+satis+tamen+semper+est+lucis+ad+convincendam+impiorum+conscientiam.+%5BWhat+does+the+Lord+intend+by+teaching+those+whom+He+takes+no+care+should+understand%3F+Consider+from+where+the+fault+proceeds%2C+and+you+will+cease+to+inquire.+For+in+the+Word%2C+whatever+its+obscurity+may+be%2C+there+is+nevertheless+always+enough+light+to+convict+the+consciences+of+the+wicked.%5D+The+drift+of+Calvin+is+not+to+affirm+that+God+works+either+by+any+positive+action%2C+or+by+proper+ordination+of+his+Word+unto+any+such+end+that+deafness%2C+blindness%2C+senselesseness+whereunto+the+reprobate+grow+only+by+their+own+default.+But+because+God%2C+who+could+soften+their+hearts+and+would+if+they+were+in+the+number+of+his+elect%2C+has+ordained+not+to+do+it%2C+this+ordination+is+intimated+by+the+event+which+perpetually+follows+upon+it%2C+namely+deafness%2C+blindness%2C+etc.+So+that+all+which+Calvin+intends+is+this+%28see+%C2%A714-15%2C+where+is+mind+is+explained%29%2C+that+where+God+has+not+comprised+men+within+his+merciful+decree+of+predestination%2C+there+He+has+decreed+to+hold-off+his+hand+from+effectually+opening+their+ears+and+eyes%3B+and+they+suo+vitio+obsurdescunt+%5Bbecome+deaf+through+their+own+fault%5D%2C+etc.+And+Beza+had+no+other+intent%2C+but+to+show+that+the+Word+preached+unto+the+reprobate+%28Opuscula%2C+p.+30+and+Of+Predestination%2C+p.+434%29%3A+non+eo+usque+conjunctum+cum+Spiritus+ministerio%2C+ut+illos+vera+fide%2C+qua+propria+nota+electi+a+reprobis+dignoscuntur%2C+Christo+ut+palmites+frugiferos+inserat.+%5Bis+not+so+joined+with+the+ministry+of+the+Spirit+as+to+insert+them+into+Christ+by+true+faith%2C+by+which%2C+as+the+distinctive+mark%2C+the+elect+are+distinguished+from+the+reprobate+as+fruitful+branches.%5D+Whence+follows+that+woeful+event%2C+ut+justo+exitio+devoti+magis+ac+mag%C3%ACs+reddantur+%5BGreek%5D+%5Bthat+they+may+be+rendered+more+and+more+devoted+to+just+destruction%5D.+For+%5BJohannes%5D+Maccovius%2C+if+his+speeches+%5Bsee+pp.+372-73+in+the+previous+section%5D+tend+to+show+the+intentional+end+of+the+gospel+preached%2C+and+not+the+eventual+success%2C+we+utterly+disclaim+his+opinion.+For+God+properly+intends+no+end+of+his+volitions+or+actions+but+Himself%2C+unto+whose+glory+all+things+have+naturam+mediorum+%5Bthe+nature+of+means%5D%2C+not+intenti+finis+%5Bthe+intention+of+an+end%5D.+The+intention+therefore+of+means+by+God+unto+any+lower+or+inferior+end+is+nothing+else+but+the+fitness+of+such+means+considered+in+themselves+%28and+not+abused%29+for+the+producing+of+that+end%3A+And+this+intention+is+not+altered+by+the+decree+of+reprobation%3B+for+that+decree+as+it+is+immanent+and+eternal+in+voluntate+divina%2C+nihil+ponit+in+reprobato+%5Bin+the+divine+will%2C+puts+nothing+in+the+reprobate%5D%3A+And+when+the+temporal+execution+comes%2C+it+puts+no+malice+into+his+will%3B+it+puts+no+necessitation+unto+wicked+actions+upon+his+will%3B+it+only+puts+in+God+an+absolute+will+of+not-giving+effectual+grace%2C+and+of+not-working+in+him+salutiferous+actions%2C+whereupon+follows+perditio+tua+exte+%5Byour+destruction+is+out+of+yourself%2C+Hos.+13%3A9%5D.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Animadversions+upon+a+Treatise+entitled%2C+God%E2%80%99s+Love+to+Mankind%2C+...+%28Cambridge%3A+Daniel%2C+1641%29%2C+%E2%80%98Answer%3A+Whether+the+decree+of+absolute+Reprobation+is+contrary+unto+the+use+and+end+of+God%E2%80%99s+gifts+bestowed+upon+men%2C%E2%80%99%2C+pp.+390-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d7762388.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f6d7762388.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=That%20God%20wills%20the%20good%20of,is%20out%20of%20yourself%2C%20Hos.%2013%3A9&amp;text=That%20God%20wills%20the%20good%20of%20men%20in&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>

<blockquote><p>God in this attribute of mercy is infinite and incomprehensible. He is in this as in other attributes; indeed He is God. Heaps of places I might bring in; the Bible abounds with passages of the merciful inclination of God: Ex. 34:6-7, ‘The Lord God merciful and gracious, etc.’ And again, ‘Keeping mercy for thousands.’ Dt. 5:10, ‘And showing mercy unto thousands.’ Ps. 36:5, ‘Thy mercy O Lord is in the heavens,’ or unto the heavens. So that we need not ask as Esau did of Jacob his father about a blessing, ‘Hast thou but one blessing my father?’ (Gen. 27:38) So hast Thou but one mercy, O God? For come there never so many, there is mercy for all. The bottomless ocean of God’s mercy can never possibly be drawn dry by the creature. Many admirable sayings have we touching God’s mercy: First, God inclines to it; it comes naturally from Him: not as waters out of the pump, but as showers from heaven. Tis but ‘open our mouths’ and God will fill them [Ps. 95]. Yea secondly (to use the words of a painful and learned writer; [John] Downame’s Christian Warfare, bk. 2, ch. 34, sect. 4, p. 204), ‘It is not only not troublesome and painful’ (to wit because it is natural to God to show mercy) ‘but also pleasant and delightful for God to show mercy, etc.’ And a little after: ‘And contrariwise it should be troublesome and irksome, if I may so speak‘ (says mine author) ‘for God not to show and exercise his nature and mercy, etc.’ And once more: ‘For as the eye is delighted with seeing, and to be restrained therefrom is grievous unto it, as the ear is delighted with hearing and is much molested if it be stopped; and as every part and faculty of the body and soul are delighted in exercising their several actions and functions and are much vexed and cumbered if by any means they should be hindered, so is the Lord delighted and well pleased in showing and exercising his own nature and attributes.’ God weeps when He strikes, but smiles when He strokes. It does his heart good (as we use to say of men). Certainly God will not be barred of his pleasure; He rejoices much to have an occasion offered of exercising his mercy. Ps. 147:11, David says that, ‘the Lord is delighted in them that fear Him and attend upon his mercy.’ When men wait for mercy, God is delighted to exercise it towards them. Judicious Mr. [Joseph] Caryl, ‘To show mercy pleases Him more than it relieves us.’ Thirdly, God is said ‘to multiply’ to show mercy. Single acts of mercy cannot give Him content: He shows mercies by thousands, unto thousands of his people. Fourthly, ye have an expression, Isa. 30:18, ‘And therefore will He be exalted that He may have mercy upon you.’ But what do I speak of that which is infinite and incomprehensible? Sooner can we number the stars of heaven, drops of the ocean, sands on the shore, yea atoms in the sun, than give you a true account of the mercies of this most merciful God. What is a drop to the ocean? (Quantum scintilla ad mare se habet, tantum hominis malitia ad Dei clementiam imo vero non tantum; [As much as a spark is to the sea, so much is man’s wickedness to God’s clemency; indeed, not even so much.] Chrysostom) And what are our sins to the mercies of God. Infiniteness cannot be limited. God’s thoughts of mercy are exalted above the thoughts of our unworthiness far higher than the heavens are exalted above the earth. Mercy is as it were God’s fetching of breath. His infinite and incomprehensible goodness does in a sort wholly live in works of mercy; For all the world are object of God’s mercy since Adam’s fall: ‘For all have sinned, and have come short of the glory of God.’ That famous man, Jerome Zanchi has notable stuff about this matter. I will take notice but of one passage, upon Ex. 34:6-7, where it is said that God is slow to anger. He writes (On the Attributes, bk. 2, ch. 1, quest. 2): ‘And therefore we must note, although anger be attributed unto God, it is in God nothing else but the chief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I said) the attribute of goodness sets God on work to put Himself out in endless mercies and tender bowels beyond what man or angel can possibly imagine.</p></blockquote>

hief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I — Thomas Larkham, The Attributes of God Unfolded &amp; Applied, ... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 131-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+in+this+attribute+of+mercy+is+infinite+and+incomprehensible.+He+is+in+this+as+in+other+attributes%3B+indeed+He+is+God.+Heaps+of+places+I+might+bring+in%3B+the+Bible+abounds+with+passages+of+the+merciful+inclination+of+God%3A+Ex.+34%3A6-7%2C+%E2%80%98The+Lord+God+merciful+and+gracious%2C+etc.%E2%80%99+And+again%2C+%E2%80%98Keeping+mercy+for+thousands.%E2%80%99+Dt.+5%3A10%2C+%E2%80%98And+showing+mercy+unto+thousands.%E2%80%99+Ps.+36%3A5%2C+%E2%80%98Thy+mercy+O+Lord+is+in+the+heavens%2C%E2%80%99+or+unto+the+heavens.+So+that+we+need+not+ask+as+Esau+did+of+Jacob+his+father+about+a+blessing%2C+%E2%80%98Hast+thou+but+one+blessing+my+father%3F%E2%80%99+%28Gen.+27%3A38%29+So+hast+Thou+but+one+mercy%2C+O+God%3F+For+come+there+never+so+many%2C+there+is+mercy+for+all.+The+bottomless+ocean+of+God%E2%80%99s+mercy+can+never+possibly+be+drawn+dry+by+the+creature.+Many+admirable+sayings+have+we+touching+God%E2%80%99s+mercy%3A+First%2C+God+inclines+to+it%3B+it+comes+naturally+from+Him%3A+not+as+waters+out+of+the+pump%2C+but+as+showers+from+heaven.+Tis+but+%E2%80%98open+our+mouths%E2%80%99+and+God+will+fill+them+%5BPs.+95%5D.+Yea+secondly+%28to+use+the+words+of+a+painful+and+learned+writer%3B+%5BJohn%5D+Downame%E2%80%99s+Christian+Warfare%2C+bk.+2%2C+ch.+34%2C+sect.+4%2C+p.+204%29%2C+%E2%80%98It+is+not+only+not+troublesome+and+painful%E2%80%99+%28to+wit+because+it+is+natural+to+God+to+show+mercy%29+%E2%80%98but+also+pleasant+and+delightful+for+God+to+show+mercy%2C+etc.%E2%80%99+And+a+little+after%3A+%E2%80%98And+contrariwise+it+should+be+troublesome+and+irksome%2C+if+I+may+so+speak%E2%80%98+%28says+mine+author%29+%E2%80%98for+God+not+to+show+and+exercise+his+nature+and+mercy%2C+etc.%E2%80%99+And+once+more%3A+%E2%80%98For+as+the+eye+is+delighted+with+seeing%2C+and+to+be+restrained+therefrom+is+grievous+unto+it%2C+as+the+ear+is+delighted+with+hearing+and+is+much+molested+if+it+be+stopped%3B+and+as+every+part+and+faculty+of+the+body+and+soul+are+delighted+in+exercising+their+several+actions+and+functions+and+are+much+vexed+and+cumbered+if+by+any+means+they+should+be+hindered%2C+so+is+the+Lord+delighted+and+well+pleased+in+showing+and+exercising+his+own+nature+and+attributes.%E2%80%99+God+weeps+when+He+strikes%2C+but+smiles+when+He+strokes.+It+does+his+heart+good+%28as+we+use+to+say+of+men%29.+Certainly+God+will+not+be+barred+of+his+pleasure%3B+He+rejoices+much+to+have+an+occasion+offered+of+exercising+his+mercy.+Ps.+147%3A11%2C+David+says+that%2C+%E2%80%98the+Lord+is+delighted+in+them+that+fear+Him+and+attend+upon+his+mercy.%E2%80%99+When+men+wait+for+mercy%2C+God+is+delighted+to+exercise+it+towards+them.+Judicious+Mr.+%5BJoseph%5D+Caryl%2C+%E2%80%98To+show+mercy+pleases+Him+more+than+it+relieves+us.%E2%80%99+Thirdly%2C+God+is+said+%E2%80%98to+multiply%E2%80%99+to+show+mercy.+Single+acts+of+mercy+cannot+give+Him+content%3A+He+shows+mercies+by+thousands%2C+unto+thousands+of+his+people.+Fourthly%2C+ye+have+an+expression%2C+Isa.+30%3A18%2C+%E2%80%98And+therefore+will+He+be+exalted+that+He+may+have+mercy+upon+you.%E2%80%99+But+what+do+I+speak+of+that+which+is+infinite+and+incomprehensible%3F+Sooner+can+we+number+the+stars+of+heaven%2C+drops+of+the+ocean%2C+sands+on+the+shore%2C+yea+atoms+in+the+sun%2C+than+give+you+a+true+account+of+the+mercies+of+this+most+merciful+God.+What+is+a+drop+to+the+ocean%3F+%28Quantum+scintilla+ad+mare+se+habet%2C+tantum+hominis+malitia+ad+Dei+clementiam+imo+vero+non+tantum%3B+%5BAs+much+as+a+spark+is+to+the+sea%2C+so+much+is+man%E2%80%99s+wickedness+to+God%E2%80%99s+clemency%3B+indeed%2C+not+even+so+much.%5D+Chrysostom%29+And+what+are+our+sins+to+the+mercies+of+God.+Infiniteness+cannot+be+limited.+God%E2%80%99s+thoughts+of+mercy+are+exalted+above+the+thoughts+of+our+unworthiness+far+higher+than+the+heavens+are+exalted+above+the+earth.+Mercy+is+as+it+were+God%E2%80%99s+fetching+of+breath.+His+infinite+and+incomprehensible+goodness+does+in+a+sort+wholly+live+in+works+of+mercy%3B+For+all+the+world+are+object+of+God%E2%80%99s+mercy+since+Adam%E2%80%99s+fall%3A+%E2%80%98For+all+have+sinned%2C+and+have+come+short+of+the+glory+of+God.%E2%80%99+That+famous+man%2C+Jerome+Zanchi+has+notable+stuff+about+this+matter.+I+will+take+notice+but+of+one+passage%2C+upon+Ex.+34%3A6-7%2C+where+it+is+said+that+God+is+slow+to+anger.+He+writes+%28On+the+Attributes%2C+bk.+2%2C+ch.+1%2C+quest.+2%29%3A+%E2%80%98And+therefore+we+must+note%2C+although+anger+be+attributed+unto+God%2C+it+is+in+God+nothing+else+but+the+chief+goodness+and+justice+whereby+He+abhors+evil%2C+and+according+to+his+just+judgment%2C+does+at+length+punish+it+if+it+be+not+amended+by+his+longsuffering+and+patience.+This+here+hence+appears+evidently+speaking+of+revenge%2C+which+is+an+effect+of+anger%3B+He+does+not+say+that+He+does+presently+inflict+punishment%2C+or+that+He+is+so+ready+to+inflict+it+as+to+show+mercy%3A+but+He+says+that+He+%E2%80%98is+slow+to+anger%2C%E2%80%99+etc.%E2%80%99+And+upon+the+28th+of+Isa.+21%2C+where+the+words+are%3A+%E2%80%98For+the+Lord+shall+rise+up+as+in+mount+Perahim%3B+He+shall+be+wrath+as+in+the+valley+of+Gibeon%2C+that+He+may+do+his+work%2C+his+strange+work%2C+and+bring+to+pass+his+acts%2C+his+strange+act.%E2%80%99+%E2%80%98The+prophet%E2%80%99+%28says+Zanchi%29%3A+%E2%80%98makes+two+sorts+of+God%E2%80%99s+works%3A+his+proper+and+strange+works.+The+proper+work+of+God+is+to+show+mercy+and+to+spare+or+forgive%3B+his+strange+work+is+to+be+angry+and+to+punish.%E2%80%99+So+far+he.+I+have+been+somewhat+long+about+this+quotation.+The+weight+lies+upon+this%2C+that+mercy+in+God+is+his+nature%2C+and+therefore+infinite%3B+it+is+the+very+life+of+God%2C+his+drawing+of+breath+in+his+proper+works.+Mercy%2C+goodness%2C+longsuffering+are+according+to+the+nature+of+the+Deity%2C+which+is+far+remote+from+all+unjust+severity%2C+cruelty%2C+tyranny+and+pride.+All+providences+have+mercy+in+them.+Tis+of+the+infinite+mercy+of+God+that+the+world+is+borne+up%2C+which+would+else+sink+into+its+first%3A+nothing.+It+is+mercy+%5Bthat%5D+respites+the+damnation+of+wicked+men+and+saves+the+elect%3B+yea%2C+behold+I+tell+you+a+mystery%2C+mercies+bring+calamities%3A+1+Cor.+11%3A32%2C+%E2%80%98But+when+we+are+judged+we+are+chastened+of+the+Lord+that+we+should+not+be+condemned+with+the+world.%E2%80%99+O+let+me+draw+breath+a+little%21+Consider+what+unexpected%2C+even+incredible+mercies+God+sometimes+breathes+out.+Even+when+He+seems+to+breathe+out+smoke+and+flames%2C+yet+He+is+angry+that+He+may+bring+his+work+to+pass%2C+that+is+to+say%2C+his+proper+work%3B+that+is%2C+that+he+may+have+mercy+and+preserve.+The+Devil%2C+he+breathes+out+deaths%2C+miseries+and+mischiefs%2C+but+God+loads+us+with+mercies%2C+and+%28as+I+said%29+the+attribute+of+goodness+sets+God+on+work+to+put+Himself+out+in+endless+mercies+and+tender+bowels+beyond+what+man+or+angel+can+possibly+imagine.%E2%80%9D%0A%0A%E2%80%94+Thomas+Larkham%2C+The+Attributes+of+God+Unfolded+%26+Applied%2C+...+%28London%3A+Eglesfield%2C+1656%29+Larkham+%281602%E2%80%931669%29+was+an+English+puritan+clergyman+and+settler+in+New+England.%2C+pp.+131-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F900923f427.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/900923f427.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=God%20in%20this%20attribute%20of%20mercy,man%20or%20angel%20can%20possibly%20imagine&amp;text=God%20in%20this%20attribute%20of%20mercy%20is%20infinite&amp;text=beyond%20what%20man%20or%20angel%20can%20possibly%20imagine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>

</figure><figure class="quote" id="q-a51d71ac82" data-kw="">
<blockquote><p>The second consideration which we would have the Christian to take along with him when he begins to study the mercy and love of God is this: know that it is natural and native for Him to love; justice is his strange act, Isa. 28:21, importing his great unwillingness to be much taken up in the exercise of that attribute of justice. If we would ask the question, What is God? we could have no answer so suitable and pertinent to it as that which He has given Himself, He is merciful and loving. It is his great design, and likewise his desire, to be taken up in his attribute of mercy… And we conceive, that which does eminently declare how much God delights in mercy, and how natural it is for Him to love, is this: that notwithstanding there was a strong and invincible impediment laid in the way of the exercise of the attribute of mercy (which if angels and men had attempted to have loosed, should eternally have crushed and depressed them into the lowest hell), yet love was not hindered in its exercise by this strong impediment. O blessed be that love, for it was strong; and that good will, for it was wonderful: that when there was such an impediment laid in the way, it did put wisdom in exercise to find out the way how it might exercise itself towards man without leaving an imputation on justice! It likewise put omnipotent power to exercise, that it might exercise the decrees of wisdom that were such a holy and divine restraint on the love of God; and before the curse was proclaimed towards man for the breach of his holy law, love did propose the way how that everlasting curse, which man by his own hand had wrapped about his own neck, might be taken away…</p></blockquote>

<blockquote><p>Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…</p></blockquote>

<blockquote><p>Further, The inclination of thy heart towards fruitless and unprofitable creatures does fore-preach to thee the inclination of the heart of God towards thee in the Judgment: If thou hast either cow or any other beast that is now unprofitable to thee, though thou mayst suffer them for some time to be with thee, as God suffers sinners in the world, yet all this while thy heart is not with them, but thou wilt take thy time to clear thy hands of them. Why, just so shall thy judgment be as God says, ‘Though Moses and Samuel stood before Me,’ that is, to pray Me to spare this people, ‘yet my heart could not be towards them; therefore cast them out of my sight and let them go forth.’ Jer. 15:1; Eze. 14:13-14.</p></blockquote>

<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations upon our Savior’s Parable of the Prodigal Son</cite>, … (London: Roycroft, 1678), ch. 27, pp. 253-54</span></figcaption>

ne</a></div>
</figure><figure class="quote" id="q-25871be9fa" data-kw="">
<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, pp. 584-85</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).”

— Stephen Charnock, Several Discourses upon the Existence &amp; Attributes of God, … (d. 1680; London: Newman, 1682), Goodness of God, pp. 584-85">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+goodness+of+God+is+his+inclination+to+deal+well+and+bountifully+with+his+creatures.+%28Cocceius%2C+Sum%2C+p.+50%29+%E2%80%98Tis+that+whereby+He+wills+there+should+be+something+besides+Himself+for+his+own+glory.+God+is+good+in+Himself+and+to+Himself%2C+i.e.+highly+amiable+to+Himself%3B+and+therefore+some+define+it+a+perfection+of+God%2C+whereby+He+loves+Himself+and+his+own+excellency%3B+but+as+it+stands+in+relation+to+his+creatures%2C+%E2%80%99tis+that+perfection+of+God+whereby+He+delights+in+his+works+and+is+beneficial+to+them.+God+is+the+highest+goodness%2C+because+He+does+not+act+for+his+own+profit%2C+but+for+his+creatures%E2%80%99+welfare+and+the+manifestation+of+his+own+goodness.+He+sends+out+his+beams+without+receiving+any+addition+to+Himself+or+substantial+advantage+from+his+creatures.+%E2%80%98Tis+from+this+perfection+that+He+loves+whatsoever+is+good%2C+and+that+is+whatsoever+He+has+made%2C+for+%E2%80%98every+creature+of+God+is+good.%E2%80%98+%281+Tim.+4%3A4%29+Every+creature+has+some+communications+from+Him%2C+which+cannot+be+without+some+affection+to+them%3B+Every+creature+has+a+footstep+of+divine+goodness+upon+it%3B+God+therefore+loves+that+goodness+in+the+creature%2C+else+He+would+not+love+Himself.+%28Cajetan%2C+in+pt.+2+of+2%2C+quest.+34%2C+art.+3%29+God+hates+no+creature%2C+no+not+the+devils+and+damned+as+creatures%3B+He+is+not+an+enemy+to+them+as+they+are+the+works+of+his+hands%3A+He+is+properly+an+enemy+that+does+simply+and+absolutely+wish+evil+to+another%3B+but+God+does+not+absolutely+wish+evil+to+the+damned%3B+that+justice+that+He+inflicts+upon+them%2C+the+deserved+punishment+of+their+sin%2C+is+part+of+his+goodness+%28as+shall+afterward+be+shown%29.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God%2C+%E2%80%A6+%28d.+1680%3B+London%3A+Newman%2C+1682%29%2C+Goodness+of+God%2C+pp.+584-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25871be9fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/25871be9fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20goodness%20of%20God%20is%20his,goodness%20%28as%20shall%20afterward%20be%20shown&amp;text=The%20goodness%20of%20God%20is%20his%20inclination%20to&amp;text=of%20his%20goodness%20%28as%20shall%20afterward%20be%20shown" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588</span></figcaption>

<blockquote><p>3. The third thing is the goodness of God in his government…. his goodness hovers over the whole frame… to conduct them to those ends which might illustrate his wisdom and goodness to his creatures. His goodness does no less incline Him to provide for them than to frame them. ‘Tis the natural inclination of man to love what is purely the birth of his own strength or skill. He is fond of preserving his own inventions, as well as laborious in inventing them. ‘Tis the glory of a man to preserve them as well as to produce them. God loves everything which He has made, which love could not be without a continued diffusiveness to them, suitable to the end for which He made them.</p></blockquote>

<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>

<blockquote><p>III Proposition: In asking any spiritual gift we are encouraged by the bounty and mercy of God [as in Ps. 119:64]. David signifies both: 1. His bounty or benignity, or that free inclination which is in God to do good to his creatures. 2. His mercy respects the creature as affected with any misery. Mercy properly is a proneness to succour and relieve a man in misery notwithstanding sin. Now the larger thoughts of mercy, the more hope, partly because we have no plea of merit and therefore mercy is the fountain of all the good which comes to us from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (London: T.P., 1681) | sermon 72, on Ps. 119:64, pp. 436-37</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-4e53e27cae" data-kw="">
<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (London: T.P., 1681) | sermon 84, on Ps. 119:76, “Let, I pray thee, thy merciful kindness be for my comfort”, p. 512</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-42f6262da0" data-kw="">
<blockquote><p>(2) There is more goodwill in his heart than is visible in his dealings. The merciful nature of God should be a support to us, though we see nothing of the effects of it in his providence. Job 10:13, ‘These things hast Thou hid in thine heart; I know that it is with Thee.’ He speaks of his favourable inclination to show pity to distressed creatures. We are not able always to reconcile his present dispensations with his gracious nature, yet faith must not quit its holdfast: We must see what is hid in God’s heart and comfort ourselves with that favor and mercy which we know to be essential to Him: Though the mercy and pity be not visible and obvious to sense, the disposition and inclination abides in God unchangeable and sure. God is a merciful God still, and Christ a compassionate Savior, though the effects be suspended to try and sharpen our faith.</p></blockquote>

<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>

<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ</cite>, … (Geneva, 1666), Disputation 1, sect. 28 tr. AI at The Received Faith</span></figcaption>

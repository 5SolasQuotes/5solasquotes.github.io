<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christian Religion</cite>, ... (London: R.R., 1692), Christ the Hope of Glory, ch. 6, p. 112</span></figcaption>

<blockquote><p>XL. Third, zeal for exploring, if we observe some propensity of God toward us, some love, grace, or mercy, whether is it only that universal propensity which is inclined to beasts as well as men (Ps. 36:6), or that common propensity which is inclined to the reprobate as well as the elect.</p></blockquote>

</figure><figure class="quote" id="q-ca36a5eaa5" data-kw="">
<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23</span></figcaption>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: … 2. The nexus which intervenes between knowledge and will also demands that what one knows with the consciousness of knowledge, he also acknowledge according to the dignity and goodness of the thing which he observes in it; to which, attending, an intellectual being also tends and is borne toward it as toward a good thing—which belongs to the will. But this has place much more and more eminently in God, whose intellect, the more perfect it is, so much the more distinctly represents to His most absolute thought the truth and goodness of things in their objects: which things, when He approves, He wills well.</p></blockquote>

<blockquote><p>3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.”

<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753. 137. Unpublished MS sermon on Lk. 6:35. 138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743. 139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>

.%20119%3A%5B1%5D40&amp;text=If%20God%E2%80%99s%20love%20is%20known%20by%20what%20it&amp;text=1743.%20139.%20Unpublished%20MS%20sermons%20on%20Ps.%20119%3A%5B1%5D40" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>amor Dei: the love of god; i.e., both the love of creatures for God and the divine attribute of love… Considered as a divine attribute, the amor Dei can be defined as the propensity of the divine essence or nature for the good, both in the sense of God’s inward intrinsic, benevolentia, or willing of the good, and in the sense of God’s external, extrinsic, beneficentia, or kindness, toward his creatures… the amor Dei communis is directed toward all human beings, both elect and reprobate, and is manifest in the blessings, or benefits (beneficia), of God… the amor Dei communis is understood to be benevolentia in the strict sense of goodwill toward human beings…</p></blockquote>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>

<blockquote><p>Mastricht offers as a brief definition the statement that the divine will is God’s ‘propensity toward the good,’ (Theoretico-practica theol., II.xvii.4) and the somewhat longer definition that ‘will in God is nothing other than his most wise propensity toward himself as the highest goal and toward creatures as means, for the sake of himself,’ inasmuch as creatures attain the fulfilment of the good not in themselves but in God.’ (Theoretico-practica theol., II.xv.7; cf. Cocceius, Summa theol. III.x.23-24 and Van Asselt, Federal Theology, p. 166.)</p></blockquote>

— Richard Muller, Post-Reformation Reformed Dogmatics, (Baker Academic, 2003), vol. 3, p. 445">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMastricht+offers+as+a+brief+definition+the+statement+that+the+divine+will+is+God%E2%80%99s+%E2%80%98propensity+toward+the+good%2C%E2%80%99+%28Theoretico-practica+theol.%2C+II.xvii.4%29+and+the+somewhat+longer+definition+that+%E2%80%98will+in+God+is+nothing+other+than+his+most+wise+propensity+toward+himself+as+the+highest+goal+and+toward+creatures+as+means%2C+for+the+sake+of+himself%2C%E2%80%99+inasmuch+as+creatures+attain+the+fulfilment+of+the+good+not+in+themselves+but+in+God.%E2%80%99+%28Theoretico-practica+theol.%2C+II.xv.7%3B+cf.+Cocceius%2C+Summa+theol.+III.x.23-24+and+Van+Asselt%2C+Federal+Theology%2C+p.+166.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics%2C+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+p.+445&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa2a62bb899.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a2a62bb899.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Mastricht%20offers%20as%20a%20brief%20definition,Van%20Asselt%2C%20Federal%20Theology%2C%20p.%20166&amp;text=Mastricht%20offers%20as%20a%20brief%20definition%20the%20statement&amp;text=III.x.23%2D24%20and%20Van%20Asselt%2C%20Federal%20Theology%2C%20p.%20166" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d78be705ee" data-kw="">
<blockquote><p>[Benedict Pictet:] Now we call goodness that affection in God, by which he is inclined to communicate himself to his creatures… The first act of God’s goodness in time is creation, and because what is produced always depends on what produces it, the second act of goodness is preservation.” (Theol. chr., II.vii.2-3; cf. Ridgely, Body of Divinity (1885), p. 109.) In this most inclusive sense, the divine goodness can be identified as benevolentia, the ‘inclination of the will to do good as far as it is possible and lawful to do so‘ or, indeed, as ‘the love of God towards his creatures’ by which he acts to ‘promote their happiness and perfection.’ (Venema, Inst. theol., VII (p. 163).) Accordingly, Scripture teaches that ‘God is love’ (1 John 4:8), that he is ‘good and upright’ (Ps. 25:8), that he takes ‘no pleasure’ in the death of his creatures (Ezek. 18:32), would have none perish (2 Pet. 3:9), and ‘will have all men to be saved‘ (1 Tim. 2:4). (Cf. Venema, Inst. theol., VII (p. 163), with Turretin, Inst. theol. elencticae, III.xx.2, 5.)</p></blockquote>

</figure><figure class="quote" id="q-32484f2f45" data-kw="">
<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 564-65</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 566</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-30c6bb1512" data-kw="">
<blockquote><p>Thus, gratia Dei [the grace of God] is that perfection or attribute according to which God, out of a totally gracious and unmerited love, is conceived as willing to communicate himself to his creatures. (Rijssen, Summa Theol., III.xliii) Considered as affective, as ratione actus interni in Deo [a rule of the internal act in God], grace is a propensity of the divine will–while considered as effective it is the gifts of the Spirit graciously given to us by God, either the ordinary gifts of faith, hope, and love or the extraordinary gifts bestowed upon the church for its edification. (Rijssen, Summa theol., III.xliii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 571</span></figcaption>

</figure><figure class="quote" id="q-89c11aa158" data-kw="">
<blockquote><p>This pattern of definition results in the understanding of mercy as an affection, although there remains among the Reformed orthodox the assumption that the inclination to aid the creature is so intrinsic to the divine nature that mercy also can be understood as an essential attribute of God: the disposition belongs to God essentially, although its transient revelation belongs to the category of affection. (Cf. Brakel, Redelijke Godsdienst, I.iii.35.)</p></blockquote>

<blockquote><p>velleitas (or velle): willingness; thus (1) the condition of having a capability of willing or the ability of a spiritual being to act without exterior compulsion; or (2) a general willingness or nonefficacious openness of will to the occurrence of something, as distinct from an actual or efficacious willing. See arbitrium; voluntas.</p></blockquote>

<blockquote><p>The perfect desire of the saints cannot be in vain; but nothing prevents their conditional desire from being in vain, and that is the kind of desire by which we do not wish to be stripped but clothed [2 Cor. 5:4] about, namely, if that ‘were possible’. And this desire is called a willingness, ‘velleity’, by some.</p></blockquote>

<blockquote><p>The words of the apostle, ‘God will have all men to be saved, etc.’ [1 Tim. 2:4] can be understood in three ways: Third, according to [John] Damascene (Of the Orthodox Faith, 2.29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 19</cite>, article 6, Whether the will of God is always fulfilled?, reply to objection 1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 28, verse 63</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bc6445d2aa" data-kw="">
<blockquote><p>Here we see what care about our salvation is manifested by our Heavenly Father, who wishes us to take hold of his power and goodness, that we may know how great it is, and may partake of it more and more abundantly; for He would wish to deal with us on the same familiar terms as with his children, if we did not prevent Him by our wickedness. Since, therefore, we are incapable of enjoying his fatherly tenderness, He must display his strength and majesty, that, being awed by it, and affected by the anticipation of the judgment, we may humbly entreat Him, and sincerely implore peace and pardon. Now, this is done when we are truly converted to Him; for, so long as we please ourselves, and flatter our vices, we cannot but displease Him; and, on the other hand, if we enter into peace with Him, we must make war against Satan and sin. How earnestly God desires to be reconciled to us appears still more clearly from the repetition of the words. He might have said, in a single word, that He is merciful and ready to bestow pardon; and therefore, when He twice repeats the words, ‘that he may make peace with Me,’ He declares that willingly and most earnestly He hastens to blot out all our offenses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 27:5</span></figcaption>

<blockquote><p>‘For He abounds in pardoning.’ Now, because it is difficult to remove terror from trembling minds, Isaiah draws all argument from the nature of God, that He will be ready to pardon and to be reconciled. Thus the Holy Spirit dwells on this part of doctrine, because we always doubt whether or not God is willing to pardon us; for, although we entertain some thoughts of his mercy, yet we do not venture fully to believe that, it belongs to us. It is not without reason, therefore, that this clause is added, that we may not be hindered by uncertainty or doubt as to his infinite compassion toward us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 55:7</span></figcaption>

<blockquote><p>And such a hope ought especially to encourage us to repent, for we see that God is ready to receive us and seeks reconciliation with us, and is always prepared to forgive all our sins, provided we from the heart return to Him; and He seems as one unwilling to inflict punishment.</p></blockquote>

<blockquote><p>But as it cannot be but that God will smite us with his rods, not only because we deserve to be smitten, but also because it is expedient, it is necessary to flee to this consolation which is offered to us, even that God having afflicted us with grief will again shew us compassion, even ‘according to the multitude of his mercies.’ He confirms the truth of what he alleges by a reference to the very nature of God Himself. Hence, that the faithful might not debate with themselves whether God would be propitious to them, after having inflicted on them a temporary punishment, the prophet comes to their aid, and sets before them the mercy of God, or rather mercies, in the plural number; as though he had said, that it could not be that God should deny Himself, and that therefore He would be always merciful to his people; for otherwise his mercy would be obliterated, yea, that mercy which is inseparable from his eternal essence and divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, 3 | verse 32, “But though he cause grief, yet will he have compassion according to the multitude of his mercies.”</span></figcaption>

line · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7302550d0c" data-kw="">
<blockquote><p>Ye,” says Christ, “who are evil, know how to do good to your children” (Mt. 7:11); what then are we to expect from the very fountain of goodness? As, then, parents are not willingly angry with their children, nor handle them roughly, there is no doubt but that God never punishes men except when He is constrained. There is, as I have said, an impropriety in the expression, but it is enough to know, that God derives no pleasure from the miseries of men, as profane men say, who utter such blasphemies as these, that we are like balls with which God plays, and that we are exposed to many evils, because God wishes to have as it were, a pleasant and delectable spectacle in looking on the innumerable afflictions, and at length on the death of men. That such thoughts, then, might not tempt us to unbelief, the prophet here puts a check on us, and declares that God does not afflict from his heart, that is, willingly, as though He delighted in the evils of men, as a judge, who, when he ascends his throne and condemns the guilty to death, does not do this from his heart, because he wishes all to be innocent, and thus to have a reason for acquitting them; but yet he willingly condemns the guilty, because this is his duty. So also God, when He adopts severity towards men, He indeed does so willingly, because He is the judge of the world; but He does not do so from the heart, because He wishes all to be innocent—for far away from Him is all fierceness and cruelty; and as He regards men with paternal love, so also He would have them to be saved, were they not as it were by force to drive Him to rigor. And this feeling he also expresses in Isaiah, “Ah! I will take consolation from mine adversaries.” (Isa. 1:24) He calls them adversaries who so often provoked Him by their obstinacy; yet He was led unwillingly to punish their sins, and hence He employed a particle expressive of grief, and exclaimed ‘Ah!’ as a father who wishes his son to be innocent, and yet is compelled to be severe with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, 3 | verse 33, “For he doth not afflict willingly nor grieve the children of men.”</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Verse 33. ‘For he does not afflict willingly.’ Here he tells that if God afflicts, He does it not willingly, but strokes are drawn out of His hand by our provocations and the necessity of our estate. Objection. But how can anything be done to us and God not willing to do it? Answer. He is willing and not willing. [Willing,] because justice requires it, and He must correct us or lose us. Unwilling, because strokes are extorted out of His hand. We see then that simply and absolutely or properly God delights not in our affliction, but when He afflicts, it is extorted from His justice. 2. This shows the procuring cause of our grief is not in the Lord but in ourselves. God is the causer of our grief but not the procurer of it. God is the worker and {bringer about} of grief but not the causer of it. … Use Two. If God afflicted not willingly, then be sure He will comfort willingly. As He is unwilling to strike, so He is ready to comfort. As a father would rejoice to see his son thrive, so would God to see us study to please Him. He can let the rod lie aside us all day, clap [pat] our heads and lay His benefits to our hand. Know then, as it is against God’s will that you come into grief, so it is with His will that you be comforted, or if He let you lie still in that grief, it is because He sees it is necessary for you to steep yourself in trouble [so] that your perverse nature [may] be humbled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Jeremiah’s Lamentations</cite>, (1628; Naphtali Press &amp; RHB, 2020), on Lam. 3:33, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“Verse 33. ‘For he does not afflict willingly.’ Here he tells that if God afflicts, He does it not willingly, but strokes are drawn out of His hand by our provocations and the necessity of our estate. Objection. But how can anything be done to us and God not willing to do it? Answer. He is willing and not willing. [Willing,] because justice requires it, and He must correct us or lose us. Unwilling, because strokes are extorted out of His hand. We see then that simply and absolutely or properly God delights not in our affliction, but when He afflicts, it is extorted from His justice. 2. This shows the procuring cause of our grief is not in the Lord but in ourselves. God is the causer of our grief but not the procurer of it. God is the worker and {bringer about} of grief but not the causer of it. … Use Two. If God afflicted not willingly, then be sure He will comfort willingly. As He is unwilling to strike, so He is ready to comfort. As a father would rejoice to see his son thrive, so would God to see us study to please Him. He can let the rod lie aside us all day, clap [pat] our heads and lay His benefits to our hand. Know then, as it is against God’s will that you come into grief, so it is with His will that you be comforted, or if He let you lie still in that grief, it is because He sees it is necessary for you to steep yourself in trouble [so] that your perverse nature [may] be humbled.”

— David Dickson, Sermons on Jeremiah’s Lamentations, (1628; Naphtali Press &amp; RHB, 2020), on Lam. 3:33, p. 205">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse+33.+%E2%80%98For+he+does+not+afflict+willingly.%E2%80%99+Here+he+tells+that+if+God+afflicts%2C+He+does+it+not+willingly%2C+but+strokes+are+drawn+out+of+His+hand+by+our+provocations+and+the+necessity+of+our+estate.+Objection.+But+how+can+anything+be+done+to+us+and+God+not+willing+to+do+it%3F+Answer.+He+is+willing+and+not+willing.+%5BWilling%2C%5D+because+justice+requires+it%2C+and+He+must+correct+us+or+lose+us.+Unwilling%2C+because+strokes+are+extorted+out+of+His+hand.+We+see+then+that+simply+and+absolutely+or+properly+God+delights+not+in+our+affliction%2C+but+when+He+afflicts%2C+it+is+extorted+from+His+justice.+2.+This+shows+the+procuring+cause+of+our+grief+is+not+in+the+Lord+but+in+ourselves.+God+is+the+causer+of+our+grief+but+not+the+procurer+of+it.+God+is+the+worker+and+%7Bbringer+about%7D+of+grief+but+not+the+causer+of+it.+%E2%80%A6+Use+Two.+If+God+afflicted+not+willingly%2C+then+be+sure+He+will+comfort+willingly.+As+He+is+unwilling+to+strike%2C+so+He+is+ready+to+comfort.+As+a+father+would+rejoice+to+see+his+son+thrive%2C+so+would+God+to+see+us+study+to+please+Him.+He+can+let+the+rod+lie+aside+us+all+day%2C+clap+%5Bpat%5D+our+heads+and+lay+His+benefits+to+our+hand.+Know+then%2C+as+it+is+against+God%E2%80%99s+will+that+you+come+into+grief%2C+so+it+is+with+His+will+that+you+be+comforted%2C+or+if+He+let+you+lie+still+in+that+grief%2C+it+is+because+He+sees+it+is+necessary+for+you+to+steep+yourself+in+trouble+%5Bso%5D+that+your+perverse+nature+%5Bmay%5D+be+humbled.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+Sermons+on+Jeremiah%E2%80%99s+Lamentations%2C+%281628%3B+Naphtali+Press+%26+RHB%2C+2020%29%2C+on+Lam.+3%3A33%2C+p.+205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F121aeadfca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/121aeadfca.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Verse%2033.%20%E2%80%98For%20he%20does%20not,your%20perverse%20nature%20%5Bmay%5D%20be%20humbled&amp;text=Verse%2033.%20%E2%80%98For%20he%20does%20not%20afflict%20willingly&amp;text=so%5D%20that%20your%20perverse%20nature%20%5Bmay%5D%20be%20humbled" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bf0de92f98" data-kw="">
<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>

</figure><figure class="quote" id="q-90ef894f52" data-kw="">
<blockquote><p>Why then does He punish with perdition? No otherwise than as some just judge, that would have all men live regularly, and free from disorders; but having transgressed the laws, justice compels him, and that by a good and rectified will, to punish them. Some would have this will of God to be velleitatem [willingness] rather than voluntatem [will]; not so much an absolute will and resolution, as a willingness and desire: not unlike a merchant’s casting his freight overboard in a dangerous tempest. He would willingly save them, and yet he is willingly content to lose them, says one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Second Epistle General of St. Peter</cite>, (1633; Soli Deo Gloria, 1990), on 2 Pet. 3:9, “Not willing that any should perish,”, pp. 693-95</span></figcaption>

</figure><figure class="quote" id="q-2ccc0475a4" data-kw="">
<blockquote><p>…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Stock of Divine Knowledge, being a lively Description of the Divine Nature, or the Divine Essence, Attributes &amp; Trinity particularly explained and profitably applied</cite>, … (London: T.H., 1641) Stock (c.1568-1626) was an English puritan., ch. 19, Of the Anger of God, pp. 217-18</span></figcaption>

</figure><figure class="quote" id="q-2d1bafe9b6" data-kw="">
<blockquote><p>Thirdly, God has expressed Himself in Scripture, as much, yea more, for his willingness, than for his power to help; therefore we need not make our uncertainty of his will the reason of our unbelief, when we say, we are assured of his power: God has said, He is Almighty, etc., but there are not only words importing that God is willing to help his people, but promises and oaths that He will (Ps. 50:15) ‘Call upon me, and I will deliver thee’; Eze. 33:11, ‘As I live, saith the Lord God, I have no pleasure in the death of the wicked (that place is meant primarily of a civil death, a death in trouble) but that the wicked turn from his way and live.’ Yea, God has manifested a willingness to help a people, which his power has not seconded; but He never manifested his power, when his will did not concur: that most passionate exclamation, ‘O Jerusalem, Jerusalem, How often would I have gathered thee! etc.’ [Mt. 23:37] implies a general willingness in Christ to gather Jerusalem, yet Christ did not act his divine power effectually for their gathering.</p></blockquote>

<blockquote><p>The Fourth Doctrine Propounded in Chapter 45: that God and Christ are exceedingly willing and desirous to be reconciled with sinners.</p></blockquote>

<blockquote><p>This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.</p></blockquote>

</figure><figure class="quote" id="q-38ad15fc71" data-kw="">
<blockquote><p>Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, pp. 54-55</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2… And on the other side, it is equally as true that God has a willingness to glorify his vindicative justice as well as remunerative: to punish with death any one of his elect upon condition of final disobedience and impenitency, as well as to reward with life, upon condition of obedience and repentance.</p></blockquote>

</figure><figure class="quote" id="q-f9ab762637" data-kw="">
<blockquote><p>6. For the ground and warrant of Christ’s willingness to save and draw sinners, do but consider: 1. The words of the text, ‘I will draw all men to Me;’ it is as if He would say, ‘I will baulk no nation, nor any man upon a national respect;’ the first covenant to the Jews suffered a mighty exception: What is God, the God of the Jews only? Have all the nations of the earth done with their part of heaven and salvation, but only the narrow trinket and bit of the earth in poor little Judea? This made the Gospel despised and liable to sad and heavy calumnies. Christ must have narrow bowels, and must be ebb, short, and thin in free grace if the matter be so. Nay but, Christ has mercy for all men: ‘I will draw all men,’ that is, multitudes of Jews and gentiles: for that Christ draws all and every one without exception, and that by his death, is against Scripture and experience; but He has an ‘all’ that he draws: Tit. 2:11, ‘The grace of God has appeared to all men [Greek]; what grace? the teaching grace of God that teaches us to wait for the blessed hope and the appearance of the glory and of our Savior Jesus Christ: sure, this must bee the preached Gospel; now the Gospel by Scripture experience, [and by] consent of Arminians, never appeared, in the least sound, to all and every son of Adam; then Christ must have another ‘all,’ a fair and numerous multitude whom He saves and draws, and this says He, had a good will to save all, and that his elect ones believe… 2. Christ is willing to take away all heart-exceptions of unbelief from men, as… Eze. 33, The people slandered the Lord, He delighted so to have the people pine away in their iniquities, that He would punish them for no fault, but the children’s teeth should be set on edge for the sins of the father and the grapes that they eat not themselves. The Lord answers that calumny, Eze. 18, ‘And here, as I live, I delight not so (so as you slanderously, and blasphemously say) in the death of a sinner, by my life, I desire you may repent and live, nor have I pleasure to punish innocent men, for no sin at all.&#x27;</p></blockquote>

ted+so+to+have+the+people+pine+away+in+their+iniquities%2C+that+He+would+punish+them+for+no+fault%2C+but+the+children%E2%80%99s+teeth+should+be+set+on+edge+for+the+sins+of+the+father+and+the+grapes+that+they+eat+not+themselves.+The+Lord+answers+that+calumny%2C+Eze.+18%2C+%E2%80%98And+here%2C+as+I+live%2C+I+delight+not+so+%28so+as+you+slanderously%2C+and+blasphemously+say%29+in+the+death+of+a+sinner%2C+by+my+life%2C+I+desire+you+may+repent+and+live%2C+nor+have+I+pleasure+to+punish+innocent+men%2C+for+no+sin+at+all.%27%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%E2%80%A6+%28London%3A+J.D.%2C+1647%29%2C+pt.+3%2C+pp.+445-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9ab762637.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f9ab762637.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=6.%20For%20the%20ground%20and%20warrant,men%2C%20for%20no%20sin%20at%20all&amp;text=6.%20For%20the%20ground%20and%20warrant%20of%20Christ%E2%80%99s&amp;text=punish%20innocent%20men%2C%20for%20no%20sin%20at%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ea84f799e" data-kw="">
<blockquote><p>…I only now advise every one who is kept from believing by this, that he knows not whether he be contained under the pardon or no, not to look to God’s secret will, but to attend to God’s revealed will in his Word, wherein it is expressly said that God would have no man to perish, but would have all men come to repentance [2 Pet. 3:9]; and so oft. That He desires not the death of a sinner [Eze. 18:23,32], that hereby he may be moved to seek and hope for that mercy, which God is so willing to bestow upon him, if the fault be not in his own self, as it was in the unbelieving Jews in Jerusalem, of whom our Savior complained, saying, ‘How often would I have gathered thy Children, as the Hen gathereth her Chickens under her wings, and ye would not?’ [Mt. 23:37] A further manifestation of this willingness in God to save sinners, may be seen in his gracious invitation of the unworthiest to come to the wedding of his Son [Mt. 22:2-3]: yea, more by his beseeching sinners to be reconciled to Him [2 Cor. 5:20]: and by the many and weighty arguments He uses to persuade men to believe, by the great rewards, earthly and spiritual, temporal and eternal, which all believers shall enjoy; and by the fearful woes which shall fall on all unbelievers, both in this life, and that to come, as plentifully is to be seen throughout the Scriptures.</p></blockquote>

<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee. 9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God. 10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved. 11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>

<blockquote><p>Observation 5. Christ the Bridegroom and His Father are very willing to have the match made up and the marriage completed… therefore they expostulate when this marriage is refused, “O Jerusalem, Jerusalem, how often would I have gathered you, but you would not!” (Mt. 23:37). “O Jerusalem, Jerusalem, if thou, even thou, hadst known in this thy day the things that belong to thy peace!” (Lk. 19:42). All these sad complaints, that Israel would not hearken to his voice, and his people would have none of Him (Ps. 81:11), that He came to His own, and His own received Him not (Jn. 1:11), and that they will not come to Him that they might have life (Jn. 5:40), make out His willingness abundantly and undeniably.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ</cite>, (1764; Soli Deo Gloria, 2002), sermon 3, ‘Gospel Presentations are the Strongest Invitations’, p. 55 on Mt. 22:4, ‘All things are ready; come to the marriage.’</span></figcaption>

ead it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0c0f228bdf" data-kw="">
<blockquote><p>3. If God has so laid the design to save a sinner freely, then how great, how just is the condemnation of guilty sinners that will not hasten in unto it: How could the Lord have laid it more freely then He has? Oh that any sinner, forever condemned to Hell without it, should withstand it! Why sinner? Shall the Blessed God, that might have much glory in condemning thee to all eternity, be willing to save thee freely; and wilt thou not come and bow unto Him and accept of it? All the contempt of God in all his holy commands is not like this, to turn the back upon free-mercy, free-salvation: This will be the worm that never dies to any of your souls that shall not come into and rightly accept of gospel-salvation, that you might have been saved freely, have had grace, remission of sins, Jesus Christ, the Spirit, eternal life freely, and yet turned your backs upon it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-palmer.html">Anthony Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel New-Creature</cite>, (London: Brewster, 1658), pp. 115–16</span></figcaption>

</figure><figure class="quote" id="q-21f5ef72eb" data-kw="">
<blockquote><p>Thus then is Christ made use of as the way to the Father in the point of justification when the poor weakened sinner, convinced of his sin and misery, of his own inability to help himself, of the insufficiency of all means beside Christ, of Christ’s all-sufficiency, readiness and willingness to help, of the equity and reasonableness of the conditions on which He is offered, and life through Him, is now content and fully satisfied with this way, actually renouncing all other ways whatsoever, and does with heart and hand embrace Jesus Christ and take Him as He is offered in the gospel to make use of Him for all things, to lean to Him and rest upon Him in all hazards; and particularly to refuge itself in his wings and to rest there with complacency, satisfaction and delight; and hide itself from the wrath of God and all accusations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life</cite>, (1677), ch. 6, How Christ is Made Use of for Justification, as a Way</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-3cbc3b4bee" data-kw="">
<blockquote><p>The willingness of God to receive returning sinners is manifested in the highest degree; and the willingness of a sinner to return to Him in duty has the strongest engagements. He has done as much to encourage our obedience as to illustrate his glory. We cannot conceive what could be done greater for the salvation of our souls and consequently what could have been done more to enforce our observance. We have a Redeemer, as man, to copy it to us, and as God to perfect us in it. It would make the heart of any to tremble to wound Him that has provided such a salve for our sores and to make grace a warrant for rebellion:</p></blockquote>

<blockquote><p>Device [of Satan] (4). By suggesting to a sinner Christ’s unwillingness to save. It is true, says Satan, Christ is able to save you, but is He willing? Surely, though He is able, yet He is not willing to save such a wretch as you are, that has trampled his blood under your feet, and that has been in open rebellion against Him all thy days, etc. The remedy against this device of Satan is, briefly to consider these few things: Remedy (1). First, The great journey that He has taken, from heaven to earth, on purpose to save sinners, does strongly demonstrate his willingness to save them. Mt. 9:13, ‘I came not to call the righteous, but sinners to repentance.’ 1 Tim. 1:15, ‘This is a faithful saying, and worthy of all acceptation, that Jesus Christ came into the world to save sinners, of whom I am chief.’ Secondly, His divesting Himself of his glory in order to sinners’ salvation, speaks out his willingness to save them. He leaves his Father’s bosom, He puts off his glorious robes, and lays aside his glorious crown, and bids adieu to his glistering courtiers the angels; and all this He does, that He may accomplish sinners’ salvation. Thirdly, That sea of sin, that sea of wrath, that sea of trouble, that sea of blood that Jesus Christ waded through, that sinners might be pardoned, justified, reconciled and saved does strongly evidence his willingness to save sinners, 1 Cor. 5:19,20. Fourthly, His sending his ambassadors, early and late, to woo and entreat sinners to be reconciled to Him, does with open mouth show his readiness and willingness to save sinners. Fifthly, His complaints against such as refuse Him, and that turn their backs upon Him, and that will not be saved by Him, does strongly declare his willingness to save them: Jn. 1:11, ‘He came to his own, and his own received Him not.’ So in Jn. 5:40, ‘But ye will not come to me, that ye may have life.’ Sixthly, The joy and delight that He takes at the conversion of sinners, does demonstrate his willingness that they should be saved: Lk. 15:7, ‘I say unto you, That likewise joy shall be in heaven over one sinner that repents, more than over ninety and nine just persons that need no repentance.’ God the Father rejoices at the return of his prodigal son: Christ rejoices to see the travail of his soul: the Spirit rejoices that He has another temple to dwell in…</p></blockquote>

</figure><figure class="quote" id="q-2b785e7f49" data-kw="">
<blockquote><p>Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mk. 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Mt. 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatenings, 1 Jn. 5:23, Mt. 11:21; witness those pathetical lamentations, Mt. 23:37, Lk. 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners;</p></blockquote>

<blockquote><p>Chapter 11 – Seeing it is not possible that the reprobate should receive this grace and live, and also seeing this is infallibly foreseen of God; and again, seeing God has fore-determined to suffer it so to be: Why does He yet will and command that the Gospel, and so grace in the general tenders [offers] thereof, should be proffered unto them? That God is willing to save even those that perish forever, is apparent, both from the consideration of the goodness of his nature, of man’s being his creature, and indeed in a miserable state. But I say, as I have also said already, there is a great difference between his being willing to save them, through their complying with these his reasonable terms, and his being resolved to save them, whether they, as men, will close therewith, or no: So only He saves the elect themselves, even according to the riches of his Grace, even according to his riches in glory, by Christ Jesus working effectually in them what the Gospel, as a condition, calls for from them.</p></blockquote>

</figure><figure class="quote" id="q-6b9fdcb41c" data-kw="">
<blockquote><p>His sorrows and mourning upon the account of the obstinacy and unbelief of sinners, speaks the vehemency of his desire after union with them… The Redeemer’s tears wept over obstinate Jerusalem, spake the zeal and fervency of his affection to their salvation; how loth Christ is to give up sinners. What a mournful voice is that in John 5:40, “And you will not come unto me, that you might have life.” How fain [desirous] would I give you life? but you would rather die than come unto Me for it. What can Christ do more to express his willingness? All the sorrows that ever touched the heart of Christ from men, were upon this account, that they would not yield to his calls and invitations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Flavel</cite>, 6 vols. (d. 1691; London: Baynes &amp; Son, 1820) | vol. 4, England’s Duty Under the Present Gospel: Eleven Sermons on Revelation 3:20 (1689), Sermon 6, “Jesus Christ an Earnest Suitor for Union and Communion with the Souls of Sinners”, p. 117</span></figcaption>

<blockquote><p>3dly. The gospel sets forth his willingness to save us. Faith has an aspect upon Christ as able and willing to save: for power without a will to save is unprofitable, and the will without power is fruitless and ineffectual. For the begetting of faith we are to consider the proposal and offer of grace in the Gospel, and the promise of it. 1. In the gospel there is a proposal of grace to all: the invitation is universal; ‘Whoever will, let him come to the waters of life freely.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

</figure><figure class="quote" id="q-d8fb1313fc" data-kw="">
<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>

</figure><figure class="quote" id="q-c8942359ec" data-kw="">
<blockquote><p>It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Reality and Efficacy of Divine Grace”</cite>, (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.”

— Andrew Fuller, “The Reality and Efficacy of Divine Grace”, (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+admitted+that+God%E2%80%99s+love+to+man+is+in+one+sense+universal.+He+bears+good-will+towards+them%2C+as+the+work+of+his+hands%3B+but+it+does+not+follow+thence+that+He+must+do+all+that+he+could+do+for+their+salvation%E2%80%A6+As+to+God%E2%80%99s+willingness+that+all+should+turn+and+live%2C+as+God%E2%80%99s+will+has+been+observed+sometimes+expresses+what+He+approves%2C+and+sometimes+what+He+purposes.+God+wills%2C+approves+and+desires+a+sinner%E2%80%99s+turning+unto+Him.+It+is+that+which%2C+through+the+whole+Bible%2C+is+required+of+him%3B+and+whosoever+thus+returns+shall+live.+I+may+add%2C+God+is+willing+to+receive+and+forgive+every+sinner+that+returns+to+Him+through+Jesus+Christ.+He+desires+not+the+death+of+a+sinner%2C+but+rather+that+he+would+repent+and+live.+But+He+has+not+purposed+the+salvation+of+every+sinner%2C+or+to+incline+his+heart+to+embrace+the+salvation+exhibited+in+the+gospel.+In+this+sense%2C+the+salvation+of+some+is+neither+desired+nor+designed%3A+if+it+were%2C+it+would+be+effected%3B+for+%E2%80%9Chis+counsel+shall+stand%2C+and+He+will+do+all+his+pleasure.%E2%80%9D%E2%80%93%E2%80%9CWhatsoever+his+soul+desires%2C+even+that+he+does%2C%E2%80%9D+Isa.+46%3A10%3B+Job+23%3A13.%E2%80%9D%0A%0A%E2%80%94+Andrew+Fuller%2C+%E2%80%9CThe+Reality+and+Efficacy+of+Divine+Grace%E2%80%9D%2C+%281815%29+in+The+Complete+Works+of+Andrew+Fuller+%28Harrisonburg%2C+Virginia%3A+Sprinkle+Publications%2C+1988%29%2C+2%3A554&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8942359ec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c8942359ec.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=It%20is%20admitted%20that%20God%E2%80%99s%20love,he%20does%2C%E2%80%9D%20Isa.%2046%3A10%3B%20Job%2023%3A13&amp;text=It%20is%20admitted%20that%20God%E2%80%99s%20love%20to%20man&amp;text=even%20that%20he%20does%2C%E2%80%9D%20Isa.%2046%3A10%3B%20Job%2023%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a721c77241" data-kw="">
<blockquote><p>Those invitations, when considered as calls, to perform the duties of believing and repenting, belong to the law; but when viewed as expressions of the readiness, or willingness of God, to bestow salvation on sinners, and, as affording them an additional warrant to trust in the compassionate Savior for it, they form a part of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, p. 119</span></figcaption>

<blockquote><p>3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing.</p></blockquote>

</figure><figure class="quote" id="q-cad23babcc" data-kw="">
<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>

<blockquote><p>longanimitas: longsuffering; the patient bearing of an offense, particularly over a long period of time; thus, the willingness of God to endure the offense of sin rather than immediately annihilate the world in its wickedness. The longanimitas Dei is the affection of the divine will according to which God wills to await repentance and to allow millennia to elapse, for the sake of mankind, between the fall and the final judgment. Longanimitas is virtually synonymous with patientia, indicating the height of patience.</p></blockquote>

</figure><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>

</figure><figure class="quote" id="q-dfd5cc8b27" data-kw="">
<blockquote><p>While all duties are commanded in the law, all privileges and blessings are offered in the gospel. While the former are required of all, the latter are presented to all. Christ and all the blessings of His great salvation are in the gospel offered freely, fully, presently, and particularly, and that to sinners of mankind in common; and as they are offered, so must they be received by sinners. The ministers of the gospel are authorized by the Lord Jesus to “preach the gospel to every creature” (Mark 16:15)—that is, to publish the full and free offer of Himself and of His righteousness and salvation to every rational creature, every son and daughter of Adam to whom they may have access to speak. And it is, indeed, good tidings of great joy which shall be to all people that “unto us” sinners of the human race this “child is born,” this “son is given” (Isa. 9:6). The receiving of Christ by faith supposes a previous offering or giving of Him to hearers of the gospel in order to afford them a warrant to receive Him. As the raining of the manna about the camp of Israel in the wilderness is called a giving of it prior to their eating of it, so the gospel offer of Christ is styled a giving of Him previous to a sinner’s reception of Him by faith (John 6:31–32). Indeed, it is as necessary a part of the glorious plan of salvation by Jesus Christ that He be given in offer before believing as that He be given in possession in and after believing.</p></blockquote>

</figure><figure class="quote" id="q-e69857d634" data-kw="">
<blockquote><p>Paul considered it as involved in what he had already said, and especially in the predictions of the ancient prophets, that it was the will of God that all men should call upon him. This being the case, he argues to prove that it was his will that the gospel should be preached to all. As invocation implies faith, as faith implies knowledge, knowledge instruction, and instruction an instructor, so it is plain that if God would have all men to call upon him, he designed preachers to be sent to all, whose proclamation of mercy being heard, might be believed, and being believed, might lead men to call on him and be saved. This is agreeable to the prediction of Isaiah, who foretold that the advent of the preachers of the gospel should be hailed with great and universal joy. According to this, which is the common and most natural view of the passage, it is an argument founded on the principle, that if God wills the end, he wills also the means; if he would have the Gentiles saved, according to the predictions of his prophets, he would have the gospel preached to them.</p></blockquote>

<blockquote><p>For God had promised Christ, not to one person or to another, but to the whole seed of Abraham. If the Jews were deprived, for the most part, of the joy that was offered to them, it arose from their unbelief; just as, at the present day, God invites all indiscriminately to salvation through the Gospel, but the ingratitude of the world is the reason why this grace, which is equally offered to all, is enjoyed by few.</p></blockquote>

</figure><figure class="quote" id="q-acaa8945ad" data-kw="">
<blockquote><p>Strange as it may sound, it is true, that many—perhaps the majority—of those who feed their souls on this great declaration, seem to have trained themselves to think, when it falls upon their ears, in the first instance at least, not so much of how great, how immeasurably great, God’s love is, as rather of how great the world is. It is the world that God loves, they say,—the world: and forthwith they fall to thinking how great the world is, and how, nevertheless, God loves it all. Think, they cry, of the multitudes of men that swarm over the face of the earth; and have swarmed over it through all the countless generations from the beginning; and will swarm over it in ever-increasing numbers through perhaps even more countless generations yet to come, until the end: and God loves them all, each and every one of them, from the least to the greatest; so loves them that He has given His only begotten Son to die for them, for each and every one of them—and for each and every one of them with the same intent,—the intent, namely, that he may be saved. oh how great the love of God must be to embrace in its compass these uncounted multitudes of men; and so to embrace them that every individual that enters as a constituent unit into the mass of mankind receives his full share of it, or rather is inundated by its undivided and undiminished flood! Certainly this is a great conception. But it is just as certainly not a great enough conception to meet the requirements of our text . . . . . . We discover, then, that the distribution of the term “world” in our text into “each and every man” in the world not only begins with the obvious misstep of directing our attention at once rather to the greatness of the world than to the greatness of God’s love and only infers the latter from the former; but ends by positively belittling the love of God, as if it could content itself with half-measures,—nay, in numerous instances, with what is practically no measure at all. For if it is satisfied with merely opening a way of salvation and leaving men to walk in this way or not as they list, the hard facts of life force us to add that it is satisfied with merely opening a way of salvation for multitudes to whom it should never be made known that a way of salvation lay open before them, although their sole hope lies in their walking in it. The text is given to enhance in our hearts the conception of the love of God to sinners: to make us to know somewhat of the height and depth and length and breadth of it, though truly is passes knowledge. It will not do, then, as we read it to throw limitations around this love, as if it could not accomplish that whereto it is set.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour of the World</cite>, (Bellingham, WA: Logos Bible Software, 2008), 103–105, 108, 111.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“Strange as it may sound, it is true, that many—perhaps the majority—of those who feed their souls on this great declaration, seem to have trained themselves to think, when it falls upon their ears, in the first instance at least, not so much of how great, how immeasurably great, God’s love is, as rather of how great the world is. It is the world that God loves, they say,—the world: and forthwith they fall to thinking how great the world is, and how, nevertheless, God loves it all. Think, they cry, of the multitudes of men that swarm over the face of the earth; and have swarmed over it through all the countless generations from the beginning; and will swarm over it in ever-increasing numbers through perhaps even more countless generations yet to come, until the end: and God loves them all, each and every one of them, from the least to the greatest; so loves them that He has given His only begotten Son to die for them, for each and every one of them—and for each and every one of them with the same intent,—the intent, namely, that he may be saved. oh how great the love of God must be to embrace in its compass these uncounted multitudes of men; and so to embrace them that every individual that enters as a constituent unit into the mass of mankind receives his full share of it, or rather is inundated by its undivided and undiminished flood! Certainly this is a great conception. But it is just as certainly not a great enough conception to meet the requirements of our text . . . . . . We discover, then, that the distribution of the term “world” in our text into “each and every man” in the world not only begins with the obvious misstep of directing our attention at once rather to the greatness of the world than to the greatness of God’s love and only infers the latter from the former; but ends by positively belittling the love of God, as if it could content itself with half-measures,—nay, in numerous instances, with what is practically no measure at all. For if it is satisfied with merely opening a way of salvation and leaving men to walk in this way or not as they list, the hard facts of life force us to add that it is satisfied with merely opening a way of salvation for multitudes to whom it should never be made known that a way of salvation lay open before them, although their sole hope lies in their walking in it. The text is given to enhance in our hearts the conception of the love of God to sinners: to make us to know somewhat of the height and depth and length and breadth of it, though truly is passes knowledge. It will not do, then, as we read it to throw limitations around this love, as if it could not accomplish that whereto it is set.”

— Benjamin B. Warfield, The Saviour of the World, (Bellingham, WA: Logos Bible Software, 2008), 103–105, 108, 111.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CStrange+as+it+may+sound%2C+it+is+true%2C+that+many%E2%80%94perhaps+the+majority%E2%80%94of+those+who+feed+their+souls+on+this+great+declaration%2C+seem+to+have+trained+themselves+to+think%2C+when+it+falls+upon+their+ears%2C+in+the+first+instance+at+least%2C+not+so+much+of+how+great%2C+how+immeasurably+great%2C+God%E2%80%99s+love+is%2C+as+rather+of+how+great+the+world+is.+It+is+the+world+that+God+loves%2C+they+say%2C%E2%80%94the+world%3A+and+forthwith+they+fall+to+thinking+how+great+the+world+is%2C+and+how%2C+nevertheless%2C+God+loves+it+all.+Think%2C+they+cry%2C+of+the+multitudes+of+men+that+swarm+over+the+face+of+the+earth%3B+and+have+swarmed+over+it+through+all+the+countless+generations+from+the+beginning%3B+and+will+swarm+over+it+in+ever-increasing+numbers+through+perhaps+even+more+countless+generations+yet+to+come%2C+until+the+end%3A+and+God+loves+them+all%2C+each+and+every+one+of+them%2C+from+the+least+to+the+greatest%3B+so+loves+them+that+He+has+given+His+only+begotten+Son+to+die+for+them%2C+for+each+and+every+one+of+them%E2%80%94and+for+each+and+every+one+of+them+with+the+same+intent%2C%E2%80%94the+intent%2C+namely%2C+that+he+may+be+saved.+oh+how+great+the+love+of+God+must+be+to+embrace+in+its+compass+these+uncounted+multitudes+of+men%3B+and+so+to+embrace+them+that+every+individual+that+enters+as+a+constituent+unit+into+the+mass+of+mankind+receives+his+full+share+of+it%2C+or+rather+is+inundated+by+its+undivided+and+undiminished+flood%21+Certainly+this+is+a+great+conception.+But+it+is+just+as+certainly+not+a+great+enough+conception+to+meet+the+requirements+of+our+text+.+.+.+.+.+.+We+discover%2C+then%2C+that+the+distribution+of+the+term+%E2%80%9Cworld%E2%80%9D+in+our+text+into+%E2%80%9Ceach+and+every+man%E2%80%9D+in+the+world+not+only+begins+with+the+obvious+misstep+of+directing+our+attention+at+once+rather+to+the+greatness+of+the+world+than+to+the+greatness+of+God%E2%80%99s+love+and+only+infers+the+latter+from+the+former%3B+but+ends+by+positively+belittling+the+love+of+God%2C+as+if+it+could+content+itself+with+half-measures%2C%E2%80%94nay%2C+in+numerous+instances%2C+with+what+is+practically+no+measure+at+all.+For+if+it+is+satisfied+with+merely+opening+a+way+of+salvation+and+leaving+men+to+walk+in+this+way+or+not+as+they+list%2C+the+hard+facts+of+life+force+us+to+add+that+it+is+satisfied+with+merely+opening+a+way+of+salvation+for+multitudes+to+whom+it+should+never+be+made+known+that+a+way+of+salvation+lay+open+before+them%2C+although+their+sole+hope+lies+in+their+walking+in+it.+The+text+is+given+to+enhance+in+our+hearts+the+conception+of+the+love+of+God+to+sinners%3A+to+make+us+to+know+somewhat+of+the+height+and+depth+and+length+and+breadth+of+it%2C+though+truly+is+passes+knowledge.+It+will+not+do%2C+then%2C+as+we+read+it+to+throw+limitations+around+this+love%2C+as+if+it+could+not+accomplish+that+whereto+it+is+set.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+The+Saviour+of+the+World%2C+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2008%29%2C+103%E2%80%93105%2C+108%2C+111.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facaa8945ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/acaa8945ad.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/12/warfield-on-love-and-world-in-john-316-2/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

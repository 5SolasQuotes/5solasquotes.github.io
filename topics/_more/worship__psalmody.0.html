<blockquote><p>We observed with much regret that the Psalms of David, which is the divinely authorized Hymn Book of the Christian Church, are seldom used. Not content with a supplement of hymns, for occasionally use, one collection has followed another, each more bulky and copious than its predecessor, until the Psalms of David are in no small danger of being thrust wholly out of sight and mind.

The Hymn Books, which all denominations have formed, each one to please its own taste for poetry, and its own views of orthodoxy, like the traditions of the scribes of old, are making void the oracles of God, and estranging the church from those inspired compositions in which the sweet-singer of Israel celebrates the fortunes of the Church and her glorious Head, in strains adapted to every age, until the Son of God shall appear to take the kingdom to himself, and terminate the mediatorial work.

The Psalms, as a natural consequence, seem less read in private, and less understood and relished – treated as if they were the hymns of a bygone dispensation, having little nourishment for a gospel church. Christians who will not take the trouble of penetrating beneath the antique veil and drapery of these noble compositions, pronounce them Jewish grapes, fit only for the infancy of the church and the ritual service of Judaism; yet good Bishop Horne, by his piety, and Bishop Horsley by his perspicacity – two minds as differently constituted as ever two minds were – have both attained the same convictions, and spread before us in their expositions, not the unripe grapes of Judaism, but the ripe clusters of Zion, discerning themselves, and making visible to others Christ and his church, its joys and sorrows, sufferings and triumphs, until time shall be no more.</p></blockquote>

<blockquote><p>(1) It is extremely dangerous. Heresies and errors by this means, may, and often have been very insensibly introduced into churches, congregations or families. (2) There is no need of it. The Holy Ghost hath, in the Psalms of David, and other scriptural songs, furnished us with such a rich collection of gospel doctrines and precious promises – an extensive fund of solid experiences – an exhaustless mine of gospel grace and truth – an endless variety to suit every state or condition, in which either our own soul, or the church of Christ, can be upon earth. These were framed by him who searcheth the hearts, and knows the deep things of God; and hence must be better adapted to the case of souls or societies, than any private composition whatever. (3) Though the Holy Ghost never saw meet to leave us a liturgy of prayers; yet from the poetical compositions thereof, it is plain he intended these psalms and songs for a standing form of praise in the church. It is certain they were used in this manner under the Old Testament. The Holy Ghost hath, under the New, plainly directed us to the use hereof, Col. iii. 16. Eph. v. 19. The PSALMS, HYMNS, and SPIRITUAL SONGS, there recommended are plainly the same with the MIZMOREM, TEHILLIM, and SHIRIM, mentioned in the Hebrew titles of David’s Psalms, iii. iv. v. &amp;c. cxlv. cxx. – cxxxiv.</p></blockquote>

<blockquote><p>Hymns of human composition are used so commonly now in public worship by Presbyterian churches that it is difficult to believe that the practice is not a hundred years old, and that in some of the churches it is of very recent date. On the supposition that it is good and dutiful and wise to sing such hymns in worship, it is equally difficult to account for the neglect of the churches at the time of the Reformation, and for generations afterwards. What could have so blinded the reformers as to make them reject hymns and sing the Psalms alone? How could the Westminster Divines, in framing their Confession of Faith and Directory for Worship, have been so unanimous in the blunder that the service of praise is to consist of the “Singing of Psalms?” And apart from the aspect of duty, how could the Presbyterian churches, for about a hundred and fifty or two hundred years after the Westminster Assembly, have been so insensible to the power of hymns as an attractive addition to their public services? We cannot by any means understand how it was that, if it was dutiful to use hymns in worship, the reformers did not discover the Scriptural warrant for the duty, especially as hymns had been used for centuries by the Church of Rome. Nor can we understand how they rejected the hymns and used the Psalms alone, unless on the supposition that they believed the use of hymns to be part of the will-worship of Rome.

If they were wrong on this point, then Rome and our modern Presbyterian churches are right. In that case, the Puritans and Covenanters were fanatics, and Romanists were truly enlightened. And most of our Presbyterian churches of the present day were fanatical too, and did not become truly enlightened and liberal till they got hack to the Romish practice! The Free Church of Scotland, for example, which existed for nearly forty years without an authorized hymn-book must have been so far an heir to Puritanic and Covenanting fanaticism till the year of grace 1882, when it went back beyond the time of the Presbyterian Reformation to find a nobler inheritance in the Romish practice of singing uninspired hymns in worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

<blockquote><p>What need is there, then, for adding to God’s book of praise a hymn-book of our own making? And what is gained when the addition is made? Nothing is gained in the way of spirituality, or beauty, or power. Nothing is gained but spiritual loss. Nor is a hymn ever used without loss; for the best hymn that ever was written by man on a Scriptural subject is excelled by a psalm, or perhaps by many psalms on the same subject. For example, the pretty hymn written by the papist Cardinal Newman, beginning

Lead kindly light amid the encircling gloom,

is infinitely inferior to the 5th, and 25th, and 27th, and 36th, and 86th, and 119th, and 143d, and many other psalms on the same subject. Yet this hymn appears in the hymn-books of the Established, the United Presbyterian, and the Free Churches. Every time the papist’s hymn is sung by any of their congregations, it is preferred for the time being and for the purpose in hand to a divine hymn, which is of course as much superior as God’s Word is to man’s. It is nowhere said in Scripture that the entrance of John Henry Newman’s words gives light, yet “cultured” congregations use them in preference to the perfect Word on which the blessing depends, and while they are but pleasing themselves they think they are doing God service and receiving his blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

<blockquote><p>Gilbert McMaster was an American Covenanter who originally hailed from Saintfield, County Down in what is now Northern Ireland. In 1818 he wrote a number of letters in defence of psalmody. In one of these letters, he pointed out that the excitements of so-called revivals were no excuse for the use of uninspired hymns:

It is most notorious, that those excitements called revivals of religion, which make the greatest noise, are effected where the most pernicious errors are habitually taught. That these, and modern hymns, have a great share in the production of those noisy but short-lived agitations, need not be doubted. Israel’s worship of the golden calf was marked by a greater excitement than the usual and approved worship of Jehovah.

A visit to those favoured districts of revival, a few months after a magazine description, or ecclesiastical report has been given of the multitudes converted, would cast a shade of doubt, generally, on those fine narratives. And the man who considers that the embracing of truth, turning to God through a crucified and exalted Saviour, and living a life of practical godliness, are the best proofs of real conversion, wishes, sincerely, that the things were published as they really are, and that our country furnished one journal, which would venture to tell all the truth.</p></blockquote>

<blockquote><p>William Gouge was an eminent member of the Westminster Assembly of divines. His comments below shed light on what the Westminster Confession is referring to when it identifies the ‘singing of psalms with grace in the heart’ as an element of religious worship (XXI.V). Pay close attention to his employment of Ephesians 5:19 and Colossians 3:16, as these are often appealed to by those who defend the employment of uninspired songs in worship:

12 Q. What duties of piety are done by Minister and people all together?

A. Singing of Psalms. Mat. 26.30.

Singing of Psalms was always used by God’s people, not only in the Tabernacle, Temple and Synagogue of the Jews, but also in Christian Churches. Christ used it with his Disciples (Mat. 26.30) It is enjoined by the Apostle (Eph. 5.19. Col. 3:16.) and it was practiced by the primitive Church, (1 Cor. 14. 15, 26.) By this duty jointly performed by all, as our own spirits are quickened, so we quicken the spirits of others: and we are all made the more cheerful in serving God. On this ground they who are merry are enjoined to sing. Jam. 5.13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-0374cb9c06" data-kw="">
<blockquote><p>In the point of excellency, no other form of psalmody can bear a comparison with the songs of inspiration. Imperfection is stamped upon all the works of man; the most highly finished pieces of sacred poetry frequently discover weakness of sentiment, or are marred by improper figures and allusion. Of the Psalms alone, it can be truly declared that they are perfect. The Holy Spirit has transcribed his own character of purity, wisdom and love, in these unrivalled compositions. This excellence they claim above every rival, that, as the words of God, they are of tried power to enlighten the mind, purify the affections, subjugate the will, and transform the whole inner man. It accords with the experience of the saints in every age to believe that the Spirit’s hallowed influences descend most copiously upon his own words: the most sensible relief, encouraging counsel, and abounding comfort are experienced in calling them to remembrance, and by faith applying them. As the design of singing praise is evidently to elevate the affections, and to excite the hope and peace and joy, the believer has reason to expect that, in using the inspired Psalms, which are the immediate productions of the Holy Spirit, these spiritual emotions will be awakened, and the enjoyment of their appropriate objects realized; the same confidence, in an equal measure, he has no ground to entertain from the use of uninspired psalmody.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Arians, Socinians, Arminians, and other sectaries, have all pleaded for the use of uninspired hymns. The reason is obvious:- they could find room, by this means, to circulate their unscriptural tenets, while the use of inspired psalms would be fatal for their heterodox dogmas.</p></blockquote>

</figure><figure class="quote" id="q-a1e7006354" data-kw="">
<blockquote><p>We allege, further, that there is no ground to conclude that the use of the inspired Psalms in the Church was abrogated at the close of the former economy.

It is an incontrovertible maxim, that whatever God has appointed to be observed in his worship should be perpetually observed, unless he himself intimated that it is temporary, or declares its abrogation. Singing God’s praise is obviously a moral duty, and, as such, of permanent obligation. Jehovah himself once appointed this duty to be performed in the words of David and Asaph; that is, by means of the inspired Psalms. Neither the duty of singing not the form of psalmody was of a ceremonial of judicial nature, [1] and, consequently, there is no reason to regard them abrogated when Christ came, and the partition wall was broken down. The church is, moreover, one in all ages. Every institution which her glorious Head has given her, she is bound carefully to observe, until it be abrogated by the same authority which first ordained it. No instance can be adduced in which the King of Zion has abrogated the use of the church’s inspired songs, or given permission to supplant them by the effusions of men. The divine sanction for using the Psalms is, therefore, yet disannulled, and the church now has the same warrant for drawing hence spiritual consolation, as had those to whom the sweet singer of Israel first delivered the inspired songs of Zion.</p></blockquote>

gy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Samuel Simms, who at the time of writing was the minister of Loughbrickland Reformed Presbyterian Church (Covenanter) in Co. Down, did not exactly think that exclusive psalmody was a “non-essential”. Here is what he says about the evil of uninspired hymns:

Singing uninspired hymns is not, properly speaking, public worship at all; it is public will-worship, and is an utter abomination in God’s sight! A minister might just as well take his text out of Calvin’s Institutes, as give out a mere human composition, however good, to be sung by the congregation.</p></blockquote>

</figure><figure class="quote" id="q-b8c2732f0a" data-kw="">
<blockquote><p>The 1859 Revival in Ulster led to uninspired hymns being brought into the worship of the Presbyterian Church in Ireland (PCI), though this was not officially sanctioned. As a Reformed Presbyterian (Covenanter) minister, the Revd Josias A. Chancellor of Bready sought to defend the biblical and confessional position. In so doing, he employed the following argument for exclusive psalmody using the basic hermeneutic of covenant theology (i.e. continuity with the Old Testament, except for abrogation in the New Testament):

[W]hen the administration of religion was changed, and carnal ordinances vanished away, we can detect no indication of change in the service of song. Baptism at once took the place of circumcision, the Passover was displaced by the Lord’s Supper, the first day of the week was observed instead of the seventh, sacrifices gradually ceased, and at length the Temple was destroyed, but there is no hint of any alteration being needed in the matter of praise, nor was there the slightest cessation of its observance. On the contrary, Christ and his Apostles continued to sing the Psalms, just as they had been sung before, and the Christian Church was commanded to keep up the exercise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-a-chancellor.html">J. A. Chancellor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lay-preaching and hymn-singing unwarranted in the Church: in reply to the Rev. F. J. Porter and Dr. Marcus Dill</cite>, (2nd edn, Londonderry, 1860), p. 22.</span></figcaption>

</figure><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-3e8fffde8a" data-kw="">
<blockquote><p>1. Because the apostles require us to sing ‘Psalms, Hymns and Spiritual Songs’ (Jm. 5:13; Eph. 5:19; Col. 3:16). Which three are known to be the usual titles of the Scripture Psalms ([Greek &amp; Hebrew] See Ainsworth on the title of Psalm 3).

2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-allen.html">Richard Allen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay to Prove the Singing of Psalms with Conjoined Voices, a Christian Duty</cite>, (London, 1696), p. 59. Allen was likely a baptist as at least two of the ministers recommending his book in the preface were baptists and as he is mainly arguing against the position that held that the psalms in meter ought not to be sung at all. He argues for majority psalm singing in the work.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. Because the apostles require us to sing ‘Psalms, Hymns and Spiritual Songs’ (Jm. 5:13; Eph. 5:19; Col. 3:16). Which three are known to be the usual titles of the Scripture Psalms ([Greek &amp; Hebrew] See Ainsworth on the title of Psalm 3).

2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.”

<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, (1697; RHB, 2019), Locus 23, ‘On the Grace of Sanctification’, section 14, p. 166</span></figcaption>

</figure><figure class="quote" id="q-1a602939db" data-kw="">
<blockquote><p>Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II</cite>, 1736 (WJE Online Vol. 51)</span></figcaption>

</figure><figure class="quote" id="q-541151c9b8" data-kw="">
<blockquote><p>Another thing God did towards this work at that time was His inspiring David to show forth Christ and His redemption in Divine songs, which should be for the use of the Church in public worship throughout all ages. … This was also a glorious advancement of the office of redemption, as God hereby gave His Church a book of divine songs for their use in that part of their public worship–viz., singing His praises throughout all ages to the end of the world. It is manifest the Book of Psalms was given of God for this end. … David is called the “sweet Psalmist of Israel” (II Sam. 23:1), because he penned Psalms for the use of the Church of Israel;… and we find the same are appointed in the New Testament to be made use of in their worship: ‘Speaking to yourselves in psalms and hymns and spiritual songs’ (Eph. 5:19).</p></blockquote>

/div>
</figure><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-629728bd23" data-kw="">
<blockquote><p>By psalms are meant the Psalms of David, and others that compose the book that goes with that name; and by hymns we are to understand, not such as are made by good men, without the inspiration of the Spirit of God; since they are placed between psalms and spiritual songs, made by men inspired by the Holy Ghost… but these are only another name for the book of Psalms, the running title of which may as well be the book of Hymns, as it is rendered by Ainsworth… and by ‘spiritual songs’ are meant the same Psalms of David, Asaph, etc. and the titles of many of them are songs… These three words answer to Mizmorim, Tehillim, and Shirim, the several titles of David’s Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 5:19.Gill (1697-1771) was an English particular Baptist.</span></figcaption>

<blockquote><p>Meanwhile, a certain Hilary, a Catholic layman of tribunitial rank, incited to anger, for some reason or other, against the ministers of God, as often happens, in abusive, censorious language, wherever it was possible, was violently attacking the custom which, at the time, had been introduced in Carthage, of singing hymns from the Book of Psalms either before the oblation or when what had been offered was being distributed to the people; he insisted that this should not be done. At the urging of my brethren, I answered him; the book is called Against Hilary.</p></blockquote>

<blockquote><p>As for public prayers, there are two kinds of them—the one is expressed in words only, the other with song; and this is no recent invention, for from the first origin of the church, this has been the case, as appears in history. And even St. Paul does not speak of verbal prayer alone, but also of singing. And in truth, we know by experience that song has great force and power in moving and inflaming the heart of man to invoke and praise God with more vehement and ardent zeal. It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. For the first, it is not without cause that the Holy Spirit exhorts us so carefully, by the Holy Scripture, to rejoice ourselves in God, and that all our joy should rest there as its true end. For he knows how truly we are inclined to please ourselves in vanity. Thus while our nature draws and leads us to seek all means of foolish and vicious enjoyment—on the contrary, our Lord, to separate and draw us from the allurements of the flesh and of the world, presents to us every possible means to fill us with that spiritual joy which he commends so much to us. But amongst other things which are suitable for the recreation of men, and for yielding them pleasure, music is either the first, or one of the chief, and we must esteem it a gift of God bestowed for that end. Therefore, by so much the more, we ought to see that it is not abused, for fear of soiling and contaminating it; turning that to our condemnation which was given for our profit and good. Even were there no other consideration than this alone, it ought to move us to regulate the use of music, so as to make it subservient to all good morals, and that it should not give occasion for loosing the bridle of dissoluteness, that it should not lead to voluptuousness, nor be the instrument of immodesty and impurity. But further, there is scarcely anything in this world which can more powerfully turn or bend hither and thither the manners of men, as Plato has wisely remarked. And in fact we experimentally feel that it has a secret and incredible power over our hearts to move them one way or other. Therefore we ought to be so much the more careful to regulate it in such a manner, that it may be useful to us, and in no ways pernicious. For this reason, the ancient doctors of the church often complained that the people of their time were addicted to disgraceful and immodest songs, which, not without cause, they esteemed and called a deadly and Satanic poison for corrupting the world. But in speaking of music, I include two parts, to wit, the words, or subject and matter; secondly, the song or melody. It is true that all evil words, as saith St. Paul, corrupt good manners, but when melody is united to them, they much more powerfully pierce the heart, and enter in: just as when by a funnel wine is poured into a vessel, so poison and corruption is infused into the depth of the heart by the melody. What then is to be done? It is to have songs not only pure, but also holy, that they may be incitements to stir us up to pray to and praise God, and to meditate on his works, in order to love him, fear him, honour and glorify him. But what St. Augustine says is true, that none can sing things worthy of God but he who has received power from himself. Wherefore when we have sought all round, searching here and there, we shall find no songs better and more suitable for this end than the Psalms of David which the Holy Spirit dictated and gave to him. And therefore when we sing them, we are as certain that God has put words into our mouths as if he himself sang within us to exalt his glory. Wherefore Chrysostom exhorts all men and women and little children to accustom themselves to sing them as a means of associating themselves with the company of angels; further, we must remember what St. Paul says, that spiritual songs cannot be sung well but with the heart; but the heart requires the understanding: and in that saith St. Augustine lies the difference between the song of man and that of birds, for a linnet, a nightingale, and a jay, may sing well, but it will be without understanding. But the peculiar gift of man is to sing knowing what he says. Further, the understanding ought to accompany the heart and affections, which cannot be unless we have the song imprinted in our memory, that we may be ever singing it. This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David. Touching the music, it appeared that it should be simple in the way we have put it, to carry weight and majesty suitable to the subject, and even fit to be sung in church as has been said.</p></blockquote>

he+depth+of+the+heart+by+the+melody.+What+then+is+to+be+done%3F+It+is+to+have+songs+not+only+pure%2C+but+also+holy%2C+that+they+may+be+incitements+to+stir+us+up+to+pray+to+and+praise+God%2C+and+to+meditate+on+his+works%2C+in+order+to+love+him%2C+fear+him%2C+honour+and+glorify+him.+But+what+St.+Augustine+says+is+true%2C+that+none+can+sing+things+worthy+of+God+but+he+who+has+received+power+from+himself.+Wherefore+when+we+have+sought+all+round%2C+searching+here+and+there%2C+we+shall+find+no+songs+better+and+more+suitable+for+this+end+than+the+Psalms+of+David+which+the+Holy+Spirit+dictated+and+gave+to+him.+And+therefore+when+we+sing+them%2C+we+are+as+certain+that+God+has+put+words+into+our+mouths+as+if+he+himself+sang+within+us+to+exalt+his+glory.+Wherefore+Chrysostom+exhorts+all+men+and+women+and+little+children+to+accustom+themselves+to+sing+them+as+a+means+of+associating+themselves+with+the+company+of+angels%3B+further%2C+we+must+remember+what+St.+Paul+says%2C+that+spiritual+songs+cannot+be+sung+well+but+with+the+heart%3B+but+the+heart+requires+the+understanding%3A+and+in+that+saith+St.+Augustine+lies+the+difference+between+the+song+of+man+and+that+of+birds%2C+for+a+linnet%2C+a+nightingale%2C+and+a+jay%2C+may+sing+well%2C+but+it+will+be+without+understanding.+But+the+peculiar+gift+of+man+is+to+sing+knowing+what+he+says.+Further%2C+the+understanding+ought+to+accompany+the+heart+and+affections%2C+which+cannot+be+unless+we+have+the+song+imprinted+in+our+memory%2C+that+we+may+be+ever+singing+it.+This+present+book+%5Bthe+Genevan+Psalter%2C+1543%5D%2C+for+this+cause%2C+besides+what+otherwise+has+been+said%2C+ought+to+be+particularly+acceptable+to+every+one+who+desires%2C+without+reproach%2C+and+according+to+God%2C+to+rejoice+in+seeing+his+own+salvation%2C+and+the+good+of+his+neighbours%3B+and+thus+has+no+need+to+be+much+recommended+by+me%2C+as+it+carries+in+itself+its+own+value+and+praise.+Only+let+the+world+be+well+advised%2C+that+instead+of+songs+partly+vain+and+frivolous%2C+partly+foolish+and+dull%2C+partly+filthy+and+vile%2C+and+consequently+wicked+and+hurtful%2C+which+it+has+heretofore+used%2C+it+should+accustom+itself+hereafter+to+sing+these+heavenly+and+divine+songs%2C+with+good+king+David.+Touching+the+music%2C+it+appeared+that+it+should+be+simple+in+the+way+we+have+put+it%2C+to+carry+weight+and+majesty+suitable+to+the+subject%2C+and+even+fit+to+be+sung+in+church+as+has+been+said.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Other+citations+%28work+not+named%29%2C+Preface+to+the+1543+Genevan+Psalter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a169505ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2a169505ee.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/saturday-psalm-series-we-sing-psalms-in-public-worship-calvin/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ff57609447" data-kw="">
<blockquote><p>Though the “Book of Praises” was gathered during the OT era and used in the Temple’s worship, its full intent as a canon of praise could not be fully grasped until Christ came. Its intent was to reveal and praise the Savior-King who would fulfill all the promises of God’s covenant with Israel. Jesus Christ must therefore be understood as the Sovereign of the Psalter, but also as the source of and the purpose for the development of the canon of the Psalter.</p></blockquote>

</figure><figure class="quote" id="q-a84fbec54d" data-kw="">
<blockquote><p>The advice of the Committee is that the Synod accede to the overture of Classic Grand Rapids East, that is a) ‘To amend Article 69 of our Church Order….so that a synodically approved collection of hymns may be added which may be used in our public worship and regular services; b)’To take the required steps to procure such a collection of hymns which may be used in our divine worship.’ As reasons for this advice the Committee adduces that which Classic Grand Rapids East has submitted to the Synod, and which is re-affirmed by Classis Hackensack. In addition to the material brought by these Classes your Committee would call the attention of the Synod to the following matters: 1. There is a need for definite action. Our people are using hymns. Our churches in some localities sing hymns in song services held immediately before the public worship. The demand for hymns has gained great momentum. Your committee feels that Synod should exercised a guiding hand before this demand can no longer be controlled….. …Not to encourage hymns would cause increasing discontent among our people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/acta-der-synode-1928-van-christelijke-gereformeerde-kerk.html">Acta der Synode 1928 van Christelijke Gereformeerde Kerk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 11–29 Juni, 1928, Holland, Michigan. Artikel 57.</span></figcaption>

</figure><figure class="quote" id="q-31f82330d9" data-kw="">
<blockquote><p>Only it appeared to me to be requisite to show in passing, that this book makes known to us this privilege, which is desirable above all others — that not only is there opened up to us familiar access to God, but also that we have permission and freedom granted us to lay open before him our infirmities which we would be ashamed to confess before men. Besides there is also here prescribed to us an infallible rule for directing us with respect to the right manner offering to God the sacrifice of praise, which he declares to be most precious in his sight, and of the sweetest odour. There is no other book in which there is to be found more express and magnificent commendations, both of the unparalleled liberality of God towards his Church, and of all his works; there is no other book in which there is recorded so many deliverances nor one in which the evidences and experiences of the fatherly providence and solicitude which God exercises towards us are celebrated with such splendor of diction, and yet with the strictest adherence to truth, in short, there is no other book in which we are more perfectly taught the right manner of praising God, or in which we are more powerfully stirred up to the performance of this religious exercise. Moreover although The Psalms are replete with all the precepts which serve to frame our life to every part of holiness, piety, and righteousness, yet they will principally teach and train us to bear the cross; and the bearing of the cross is a genuine proof our obedience, since by doing this, we renounce the guidance of our own affections and submit ourselves entirely to God, leaving him to govern us, and to dispose of our life according to his will, so that the afflictions which are the bitterest and most severe to our nature, become sweet to us, because they proceed from him. In one word, not only will we here find general commendations of the goodness of God, which may teach men to repose themselves in him alone, and to seek all their happiness solely in him; and which are intended to teach true believers with their whole hearts confidently to look to him for help in all their necessities; but we will also find that the free remission of sins, which alone reconciles God towards us and procures for us settled peace with him, is so set forth and magnified, as that here there is nothing wanting which relates to the knowledge of eternal salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ’s Preface to the Commentary on the Psalms (HT: Matt Crutchmer)</span></figcaption>

t+severe+to+our+nature%2C+become+sweet+to+us%2C+because+they+proceed+from+him.+In+one+word%2C+not+only+will+we+here+find+general+commendations+of+the+goodness+of+God%2C+which+may+teach+men+to+repose+themselves+in+him+alone%2C+and+to+seek+all+their+happiness+solely+in+him%3B+and+which+are+intended+to+teach+true+believers+with+their+whole+hearts+confidently+to+look+to+him+for+help+in+all+their+necessities%3B+but+we+will+also+find+that+the+free+remission+of+sins%2C+which+alone+reconciles+God+towards+us+and+procures+for+us+settled+peace+with+him%2C+is+so+set+forth+and+magnified%2C+as+that+here+there+is+nothing+wanting+which+relates+to+the+knowledge+of+eternal+salvation.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Other+citations+%28work+not+named%29%2C+%E2%80%99s+Preface+to+the+Commentary+on+the+Psalms+%28HT%3A+Matt+Crutchmer%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31f82330d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/31f82330d9.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/11/tell-me-again-why-dont-we-sing-the-psalms/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-be5edc98fb" data-kw="">
<blockquote><p>The Christian Reformed Church holds it as one of its distinctive principles that the psalms are to be used in public worship as the chief manual of praise. There is divine authority for this use of the psalms, as shown by 1 Chron. 16:4, 7; II Chron. 29:30; Ps. 105:2; 95:1, 2 and Neh. 12:24. Our Lord and his apostles used them to praise God. The “hymn” of Matt. 26:30 and Mark 14;26 refers to Psalms 113 to 118, the great “Hallel” of the Passover celebration. The hymns, songs, and psalms of Eph. 15:19 and Col. 3:16 evidently to not refer to N. T. compositions but to the O.T. Psalms which in the Greek version bear the titles given above. The psalms meet the great requirements of praise, exalting God in His being and work and continuing confessions of our unworthiness, our faith, our gratitude, our needs. In depth of spirituality the psalms excel the hymns. “In the psalms we hear the abiding, eternal fundamental note of the pious heart resounding.” [G. M. Ophoff, Church Right—ed.]….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-beets.html">Henry Beets</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Historical and Explanatory Introduction,” in The Psalter, Doctrinal Standards, Liturgy, And Church Order of the Christian Reformed Church in America</cite>, (Grand Rapids: William B. Eerdmans Publishing Co., 1926).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition 9</cite>, trans. Erik Routley in The Church and Music (London: Duckworth, 1950), 129.</span></figcaption>

<blockquote><p>…the command to sing psalms in the name of the Lord was obeyed by everyone in every place: for the command to sing psalms is in force in all Churches which exist among the nations, not only for the Greeks but also for the Barbarians; and further, throughout the whole world, in towns and villages and in the fields also, in short, in the whole Church, the people of Christ, who are gathered from all nations, sing to the one God, whom the prophets foretold, hymns and psalms with a loud voice, so that the voice of the psalm-singers is heard by those standing outside.</p></blockquote>

</figure><figure class="quote" id="q-dfd0847676" data-kw="">
<blockquote><p>There are many today who are tired of singing the Bible Psalms in the worship of God. This has various reasons, no doubt. Some are tired of singing the Psalms because they are not willing to bear the cross of being different from the big, popular churches. The other churches sing popular hymns, and the Psalms seem to be not only different but peculiar and old-fashioned. Some object to the Psalms because they do not like theology of the Psalms, with its emphasis on the righteousness and justice of God, and His destruction of His enemies. Some object to the Psalms because they do not like the Jewish flavor and coloring of the Psalms—the names of people and places, the references to the history of the children of Israel, the Hebrew flavor of the language. …Those who object to the Psalms do not want to dwell in the tents of Shem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing The Whole Of the Psalter, Wholeheartedly. Ashamed of the Tents of Shem?</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-3f6608a3f1" data-kw="">
<blockquote><p>OF all other parts of the holy Bible, this Book of the Psalms, (penned for the most part by David, the sweet Singer of Israel, and a man after God’s own heart) is stuffed and filled with greatest plenty and variety of precious Lessons and instructions unto eternal life. The choice and flower of all things profitable and comfortable for the right course of a Christian life, is therein briefly contained, and very movingly and feelingly expressed.

In them we may be acquainted with the Majesty and Mysteries of God, with the Sufferings of Christ, with unfeigned Repentance, unwearied Patience, spiritual Wisdom, and wonderful Courage of the godly man, and true Christian. In them we may behold the terrors of Wrath, and the anguishes of an afflicted Conscience, the comforts of Grace, and great Deliverances, the wonderful works of Providence over this World, and the promised joys of that World which is to come. In a word, all good necessarily to be either known or done, or had, is plentifully, as out of a rich Treasury, revealed and offered unto us in these heavenly Songs of David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A three-fold treatise containing the saints’ sure and perpetual guide. Self-enriching examination. Soul-fattening fasting. Or, meditations, concerning the word, the sacrament of the Lord’s Supper, and fasting</cite>, (London: E. Purslow, 1634), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>It is affirmed, that in Col. 3:16, and in the parallel scriptures, we have indubitable evidence of the divine right of psalms, hymns, and spiritual songs, of human composition. The word of Christ, that is, according to a very lame exposition, the gospel, or writings of the New Testament, exclusively, must dwell in us richly, and that with a reference to our mutual improvement; which is effected by teaching one another, in the singing of psalms, hymns, and spiritual songs; which compositions not being found in the Old Testament, must be drawn from, and formed according to the doctrines of the gospel, found in the New Testament; for there alone, “the word of Christ,” which is to constitute the great matter of these compositions, is to be found, being expressly distinguished by the apostle, in writing to the Hebrews, from all former revelations.

To these assertions I make the following replies:—You will justify me in remarking, in the first place, that it is not true, that the “word of Christ,” or the gospel, is confined, exclusively, to the writings of the New Testament. One who well understood what the gospel is, informs us, that it was preached unto Abraham; and that to the Antediluvians the righteousness of faith, of which Noah was both an heir and a preacher, was made known. To them Christ by his Spirit preached in the day of forbearance, though now they occupy the place of imprisoned spirits. If the Spirit of Christ preached to them, one would reasonably conclude, they enjoyed the revelation of the word of Christ.

We are also certified, that the gospel was preached to the Israelites in the wilderness.—Unto us was the gospel preached as well as unto them. How could these writers presume to assert, that “where the apostle writes immediately to the Jews themselves, he expressly distinguishes the word of Christ from all former revelations, made by Moses and the prophets,”—“distinguishes the gospel from all the revelations of the divine will, in the Old Testament,”—when that apostle informs those very people, and in that same epistle, that the gospel, in “the revelation of the divine will in the Old Testament,” was preached to their fathers? May not a suspicion, without illiberality, exist, that men who write and talk at this rate, are novices in the knowledge of what the gospel is? But, in every age of the church, teachers have been found, understanding neither what they said, nor whereof they affirmed.

My second remark is this:—It is gratuitous to assert, that in the Old Testament scriptures, psalms, hymns, and spiritual songs, are not to be found. Is not this a pitiful play on words? Does it become men of sense thus to write? …

My third remark is on the text, Col. 3:16.—It appears to be both misunderstood and misapplied. Duties highly important, and the manner of performing them, are enjoined. They are three: An intimate and extensive acquaintance with the doctrine of Christ: Let the word of Christ dwell in you richly—Wisely promoting each other’s edification: In all wisdom, teaching and admonishing one another—Praising God, with proper dispositions of heart, in the use of psalms, hymns, and spiritual songs: In psalms, and hymns, and spiritual songs, singing with grace in your heart to the Lord. The celebration of the divine perfections, in suitable songs, wisely teaching and admonishing one another, are duties demanded by God; and that to discharge these duties aright, requires an extensive acquaintance with the inspired page, our apostle teaches, and the Christian readily acknowledges; but the scripture under consideration neither requires the members of the church to commence making hymns, nor authorizes the use of such, in the church, when made.

Psalms, and hymns, and spiritual songs, are, indeed, to be sung; but these are found in this inspired Book. The attempt to justify the expulsion of the Book of Psalms, and the introduction of uninspired hymns, from these injunctions of the sacred writer, argues a remarkable obliquity of intellect, not excused, even by the unhappy punctuation of our version. I have said, unhappy punctuation; for “through bad pointing this verse is not very intelligible; the several members of it should be distinguished thus: Let the doctrine of Christ dwell richly among you; teaching and admonishing each other in all wisdom; singing, with grace in your hearts unto the Lord, in psalms, hymns, and spiritual songs. This arrangement the original will not only bear, but it absolutely requires it, and it is not sense without it.” Still, it must be seen, that no pointing, however bad, can give any countenance to a human, in preference to an inspired system of psalms. Whether the argument upon which I have animadverted, merits a better character than “gratuitous assumption,” I leave to my reader to decide.</p></blockquote>

<blockquote><p>Jesus Christ, our Saviour, full of grace and truth, is the chief character found in the Book of Psalms. He never poses, but is seen in multiform activities and appearances. His personal traits are graceful and symmetrical; His attributes and moral qualities show exquisite perfection. Jesus frequently mentioned the Psalms as containing the things concerning Himself. In the inspired Psalter we have an account of Christ’s commission, ministry, sacrifice, victory and exaltation. He is seen with no inequality of features or disparity of powers, such as of necessity appear in all sectarian hymnbooks; without atrophied or overgrown faculties and attributes so prominent in man-made manuals of praise.

In the Psalms, Jesus arises in solitary greatness and superlative dignity. “He is fairer than the children of men”; “mighty with glory and majesty”; “anointed with the oil of joy above His fellows”; “great in power, and terrible in His doings”; “the Lord strong and mighty in battle”; “the King of glory,” scaling the heights of heaven, and entering into the eternal city in triumph. Jesus in the Psalms reaches the utmost extremes of life, and fills all the space between. He is matchless in greatness and meekness; in majesty and humility; in mightiness and gentleness; in the execution of judgment, and in compassion for sinners. Jesus ascended up on high and occupies the loftiest seat in glory; yet regards with loving favour all who are lowly and contrite. Jesus makes the great sun to rise each morning, rejoicing as a strong man to run his race; yet forgets not to light the candle of him who sits in darkness and distress. Jesus calls out the stars nightly, as His unfailing choir to sing His glory; yet takes pleasure in listening to praise offered by the infant on the mother’s breast.

Jesus speaks with a powerful voice that breaks the cedar, and makes the mountain tremble; yet softly whispers comfort in the ears of those who walk in the valley of the shadow of death. Jesus, with imperial authority, commands twenty thousand chariots, and thousands of angels; yet receives the trembling soul into His presence, and entertains the lowliest in His pavilion. Jesus is wroth with sinners every day; fire goes before Him and burns up His foes round about; the glory of His face is to them a consuming flame; yet He always has a pleasant countenance for the upright.

Jesus, with uplifted hand, solemnly swears that the stubborn and rebellious shall not enter into His rest; yet opens wide the gate through which the righteous shall enter in, and dwell with God. Jesus opens the windows of heaven; the clouds pour out water; the skies sound loudly; the earth is deluged for the sins of the people; yet He carefully treasures up the tear-drops of the penitent in His bottle. Jesus has the mighty hosts of the universe at His command and in His service; yet girds himself as a nurse and smoothes the bed of His sick servant.

O this blessed Jesus! this matchless Jesus, thoroughly accomplished for His redemption work, glorious in all His attributes and activities! How His presence lights up the Psalms! The Psalms are vibrant with the energy of Jesus, and brilliant with the brightness of His Person. They are tender with the sympathy of His heart, and awe-inspiring with flashes of His majesty. They voice His messages of peace, and echo His reproofs against sin. This great Psalter of God is the ivory Palace of Praise, where Jesus is enthroned in the presence of His devout worshippers. His garments smell of myrrh, aloes, and cassia, the rich varieties of grace by the anointing of the Holy Spirit.</p></blockquote>

O this blessed Jesus! this matchless Jesus, thoroughly accomplished for His redemption work, glorious in all His attributes and activities! How His presence lights up the Psalms! The Psalms are vibrant with the energy of Jesus, and brilliant with the brightness of His Person. They are tender with the sympathy of His heart, and awe-inspiring with flashes of His majesty. They voice His messages of peace, and echo His reproofs against sin. This great Psalter of God is the ivory Palace of Praise, where Jesus is enthroned in the presence of His devout worshippers. His garments smell of myrrh, aloes, and cassia, the rich varieties of grace by the anointing of the Holy Spirit.”

y+Spirit.%E2%80%9D%0A%0A%E2%80%94+James+Calvin+McFeeters%2C+Christ+in+the+Psalms+in+Covenanter+Witness&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd97616fe21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d97616fe21.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/09/13/james-calvin-mcfeeters-on-christ-and-the-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Quest. CXXIV. Is it lawful to use David’s psalms in our assemblies?

Answ. Yes: 1. Christ used them at his last supper, as is most probable; and he ordinarily joined with the Jews that used them; and so did the apostles.

2. It is confessed lawful to read or say them; therefore also to sing them. For saying and singing difference not the main end.

3. They are suitable to our use, and were the liturgy of the Jewish church, not on a ceremonial account, but for that fitness which is common to us with them.

4. We are commanded in the New Testament to sing psalms; and we are not commanded to compose new ones; nor can every one make psalms, who is commanded to sing psalms. And if it be lawful to sing psalms of our own or our neighbour’s making, much more of God’s making by his Spirit in his prophets.

Object. They are not suitable to all our cases, nor to all in the assembly.

Answ. 1. We may use them in that measure of suitableness to our cases which they have. You may join with a man in prayer who expresseth part of your wants, though he express not all. Else you must join with no man in the world.

2. If ungodly men are present when the faithful speak to God, must we not speak our proper case, because they are present? The minister in church-administrations speaketh principally in the name of the faithful, and not of hypocrites. Must he leave out of his prayers all that is proper to the godly, merely because some wicked men are there? No more must the church do in singing unto God.

3. They that cannot speak every word in a psalm just as their own case, may yet speak it as instructive; otherwise they might not read or say it.

But the sectarian objections against singing David’s psalms are so frivolous, that I will not tire the reader with any more.</p></blockquote>

</figure><figure class="quote" id="q-77bd7f78df" data-kw="">
<blockquote><p>It is assumed that this is not a mere party work for the purposes of mere partyism. Few deny, that, throughout all the Departments of the Church, a reform is needed in her Psalmody. The subject now advocated is a solemn institution of the Church of God, authorized by her standards, and the main points of which, now advocated, are sustained by many, if not by all, of the ablest men of her several denominations.

The argument is not a little sectional one, but a plea upon the broad ground of Christian institution, for Christian consistency, truth, and influence, in a deeply interesting part of the solemnities of Zion. In the sustentation of the plea, the voice of some of the most distinguished men of the Presbyterian, Episcopal, and Baptist, families of the great Christian commonwealth, is distinctly heard.</p></blockquote>

<blockquote><p>Should we hesitate to embrace a faithful witness for the cause of truth, and one, too, suffering in that cause? Surely not. It is not the cause of a party. The question between us and our antagonists is, in my opinion, come to this—Is the Testament of our Lord and Saviour Jesus Christ one Testament? Is it given by the inspiration of God, or not? Did holy men of God speak as moved by their own passions and local prejudices, or as moved by the Holy Ghost? If the book of Psalms be such as many represent it, and if it must be set aside from the peculiar use for which the Lord and Saviour Jesus Christ intended it, I see not but it is a thrust at the whole Bible, and implicitly dishonours and subverts the whole.

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

Conscious of much unworthiness, and that I am less than the least of all saints, yet I should shudder to chime in with the prevailing defamation, not to say blaspheming of that part of the Word of God, the book of Psalms, which indeed falls equally, though indirectly, on the whole of the Old Testament, and from that rebounds with equal force on the New Testament; for without faith in the one, I cannot see how there can be a true and saving faith in the other. The saying of the apostle respecting the law, is equally applicable here — “He that offends in one point, is guilty of all.” Whoever lifted up a tool on God’s altar, was guilty of polluting it. But what impure tools have proud, carnal, daring mortals, lifted against the Bible, with the pretext, as they say, of smoothing and polishing the rough stones thereof! But they have by their foolish and sinful attempts diminished its majesty, sublimity, grandeur, and dignity, and made ‘it like the works of men, and not of God. If those men could with equal ease form our globe into a smooth surfaced ball, no doubt they would try their hands on it, and imagine they had greatly improved it. But it is not as easy to spoil God’s works, as it is to reproach and blaspheme his Word.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.</p></blockquote>

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.”

— Robert Annan, Letter to Adam Rankin, c. 1785 in ‘An Original Letter from Rev. Robert Annan’, Evangelical Repository, 13, no. 5 (October 1854), pp 274-75.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShould+we+hesitate+to+embrace+a+faithful+witness+for+the+cause+of+truth%2C+and+one%2C+too%2C+suffering+in+that+cause%3F+Surely+not.+It+is+not+the+cause+of+a+party.+The+question+between+us+and+our+antagonists+is%2C+in+my+opinion%2C+come+to+this%E2%80%94Is+the+Testament+of+our+Lord+and+Saviour+Jesus+Christ+one+Testament%3F+Is+it+given+by+the+inspiration+of+God%2C+or+not%3F+Did+holy+men+of+God+speak+as+moved+by+their+own+passions+and+local+prejudices%2C+or+as+moved+by+the+Holy+Ghost%3F+If+the+book+of+Psalms+be+such+as+many+represent+it%2C+and+if+it+must+be+set+aside+from+the+peculiar+use+for+which+the+Lord+and+Saviour+Jesus+Christ+intended+it%2C+I+see+not+but+it+is+a+thrust+at+the+whole+Bible%2C+and+implicitly+dishonours+and+subverts+the+whole.%0A%0AI+believe+the+men+have+no+such+intention%2C+they+mean+not+so.+But+they+appear+to+me+to+be+under+the+influence+of+most+dreadful+and+dangerous+temptations%3B+and+to+yield+to+them+would+be+the+greatest+evil+we+could+do+to+them%2C+the+greatest+cruelty+and+injustice+to+themselves+and+their+posterity%2C+as+well+as+unfaithfulness+to+the+Lord.+This+has+been+long+my+opinion%2C+and+I+yet+see+no+cause+to+alter+it.+The+cunning+adversary+of+the+church+is+never+at+rest.+By+various+artifices+and+deceptions+he+endeavours+to+subvert+the+faith+of+Christians%2C+and+weaken+their+attachment+to+the+Word+of+God.+I+cannot+help+ranking+the+present+opposition+to+the+pure+scriptural+Psalmody+in+the+same+class+with+Deism%2C+Socinianism%2C+Arianism%2C+Arminianism%2C+Universal+Salvation%2C+Antinomianism%2C+and+that+it+is+a+trial+of+the+faith+and+patience+of+the+saints.+May+the+Lord+enable+us+to+stand+fast%2C+and+to+keep+clean+garments.%0A%0AConscious+of+much+unworthiness%2C+and+that+I+am+less+than+the+least+of+all+saints%2C+ <blockquote><p>This Psalm was composed by David upon occasion, or at the time, of the bringing of the ark of God into the tabernacle which David had prepared for it in Zion, as may be gathered by comparing it with 1 Chron. xvi. 7, 23, 24, &amp;c., where almost the whole Psalm is to be found, But as the ark was an evident type of the Messiah, which David very well knew, as hath been oft-noted before; so David’s thoughts, or at least the design of God’s Spirit, which indited this Psalm, was extended beyond and above it, even to the times of the Messiah, and to his glorious and universal kingdom, in which not the Jews only, but the heathen nations also, should worship the true God, and kiss his Son the Messiah. …

O sing to the LORD a new song: sing to the LORD, all the earth.

A new song, upon this new and great occasion; not the removal of the ark, wherein there was nothing new but an inconsiderable circumstance of place, and that not yet fixed; but the coming of the Messiah, and the confirming of the new covenant by his blood, and the calling of the Gentiles. All the earth; all the nations of the earth, who shall then partake of those great blessings and privileges which are now peculiar to Israel.

2 Sing unto the LORD, bless his name; shew forth his salvation from day to day.

His salvation; that great work of the redemption and salvation of the world by the Messias.

3 Declare his glory among the heathen, his wonders among all people.

You who shall be called out of all the heathen nations to the knowledge of God and Christ, publish this glorious and wonderful work amongst all the heathen nations to whom you belong or may come. …

7 Give unto the LORD, O ye kindreds of the people, give unto the LORD glory and strength.

O ye kindreds of the people; or, O ye families of the people of the world. And the word families may be understood either, 1. Strictly and properly; and so it may be intimated that this great blessing of salvation by Christ should not be imparted to whole nations, but only to some persons taken out of every people and nation, as it is expressed, Revelation v. 9. Or, 2. More largely for nations, as it is taken, Gen. xii. 3 Jer. xxv. 9 Zechariah xiv. 18; and so it may be implied that not only some few of the heathen people should be brought to the acknowledgment and worship of the true God, as was usual in the times of the Old Testament, but that whole nations should come in to the church of God together.

8 Give unto the LORD the glory due unto his name: bring an offering, and come into his courts.

Into the courts of his house. But under this one part of worship he comprehends the whole worship of God; and he speaks of the worship of the New Testament under the expressions of legal worship, as the prophets elsewhere do, as Matt. i. 11, and elsewhere. …

10 Say among the heathen that the LORD reigneth: the world also shall be established that it shall not be moved: he shall judge the people righteously.

Say among the heathen: you converted Gentiles, declare this to those who yet remain in the darkness of heathenism. That the Lord reigneth; that God hath now set up his throne and kingdom in the world. And as that kingdom shall never be destroyed, but shall stand for ever, as is said, Dan. Ii. 44; so the nations of the world shall by the means of it enjoy an established and lasting peace; which is every where mentioned as one of the blessings which the Messiah shall give to the world, as Psa. Lxxii. 3,7; Isa. Ix. 6,7; lxvi. 12; Micah v. 5; Zech. ix. 10.

He shall judge the people righteously; he shall not abuse his invincible power and established dominion to the oppression of his people, as other princes frequently do, but shall govern them by the rules of justice and equity, which is the only foundation of a true and solid peace. See Isa. xxxii. 17.

13 Before the LORD: for he cometh, for he cometh to judge the earth: he shall judge the world with righteousness, and the people with his truth.

Before the Lord; at the presence and approach of their Lord and Maker. To judge the earth; to take to himself that power and authority which belongs to him, to set up his throne and dominion among all the nations of the earth. With his truth; or, in his faithfulness, i.e. so as he hath promised to do. He will certainly and abundantly fulfil all God’s promises made to his people.</p></blockquote>

<blockquote><p>In the second part of this first testimony is declared further: — 1. What Christ will moreover do: He will “sing praises unto God;” and, 2. Where he will do it: “In the midst of the congregation.” The expression of both these is accommodated unto the declaration of God’s name and of praising him in the temple.

1. The singing of hymns of praise unto God in the great congregation was then a principal part of his worship. And in the first expression two things are observable: —

(1.) What Christ undertakes to do; and that is, to praise God. Now this is only exegetical of what went before. He would praise God by declaring his name. There is no way whereby the praise of God may be celebrated like that of declaring his grace, goodness, and love unto men; whereby they may be won to believe and trust in him, whence glory redounds unto him. (2.) The cheerfulness and alacrity of the spirit of Christ in this work. He would do it as with joy and singing, with such a frame of heart as was required in them who were to sing the praises of God in the great assemblies in the temple.

2. Where would he do this? קָהָ֣ל בְּת֖וֹךְ, “in the midst of the congregation,” — “the great congregation,” as he calls it, verse 23; that is, the great assembly of the people in the temple. And this was a type of the whole church of the elect under the new testament. The Lord Christ, in his own person, by his Spirit in his apostles, by his word, and by all his messengers unto the end of the world, setting forth the love, grace, goodness, and mercy of God in him the mediator, sets forth the praise of God in the midst of the congregation.

I shall only add, that whereas singing of hymns unto God was an especial part of the instituted worship under the old testament, to whose use these expressions are accommodated, it is evident that the Lord Christ hath eminently set forth this praise of God in his institution of worship under the new testament, wherein God will ever be glorified and praised. This was that which the Lord Christ engaged to do upon the issue of his sufferings; and we may propose it unto our example and instruction …</p></blockquote>

<blockquote><p>In Dr. [Alexander] Whyte’s opinion, at no time has any land for its size, save Palestine, produced “so many men and women of a profoundly spiritual experience, and of an adoring and heavenly mind, as Scotland possessed in the sixteenth and seventeenth centuries”.

In his ecstasy he exclaims, “What minds and what hearts those men and women had! And how they gave up their whole mind and heart to the life of godliness in the land, and to the life of God in their own hearts! How thin and poor our religious life appears beside theirs!”

To the causes which he suggests for this superiority — the persecution, the new Reformation doctrines, the masculine and Pauline preaching — other two at least may be added, the solid and serious books then in favour, and the place assigned to the inspired psalms, now too often usurped by frothy hymns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dr Whyte and Samuel Rutherford (1894) in Critical Reviews Relating Chiefly to Scotland</cite></span></figcaption>

</figure><figure class="quote" id="q-af722b3239" data-kw="">
<blockquote><p>David could not be accused of being ignorant of prayer and unaware of his own nature; if he knew that so much power resided in his nature he nevertheless called on God as his helper, his constant helper; and even this constant help does not satisfy him, but, lest God should at any time despise him, he calls upon Him in abject prayer, and through the whole collection of the Psalms he proclaims his need and cries it aloud. If, therefore, this is something so important to know that he kept saying it constantly, and if he confessed that it is so necessary to teach, how can Pelagius and Caelestius discard every refutation of it in the Psalms, and repudiate all similar teaching, and then believe they can convince some persons that we do not need the help of God, and ought not to ask it, while all the saints bear witness that they can do nothing without it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/innocent.html">Innocent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Aurelius, 27 January 417 (no. 181) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), p. 124.</cite></span></figcaption>

</figure><figure class="quote" id="q-1ebc1247bf" data-kw="">
<blockquote><p>Now I do maintain that what Mr. C. [Thomas Smyth] here denies to be the question, is the question, in part at least. It is, whether Church shall sing “any thing and every thing, from rigid Calvinism down to blank Arminianism,” or be confined to the Psalms of David. This is the practical question; and experience has shewn that when we depart from this divine standard — the Psalms of David — there is no limit to the hymn-making business: and among the multitude of hymns that are in use there is Arminianism of the blankest kind, as well as other errors, set off too in all the charms of poetry, and rendered bewitching and ensnaring by being offered up in Christian assemblies as praise to God.

Although the Presbyterian Church may have taken order to prevent such erroneous hymns from being introduced into her collection, yet she has never, as far as my knowledge extends, adopted any measures to prevent her members from singing such hymns in other Christian assemblies. No, on the contrary, we often read glowing accounts of great revivals in which the different hymn-singing denominations have participated, and without a doubt the hymn books of the different sects are employed on such occasions — books containing a variety of sentiments — and at such times, (the conclusion is inevitable,) the mingled throng of anxious, animated worshippers, join in sweet concord, singing now “rigid Calvinism,” and again pouring forth the “blank Arminianism,” and all ascending as praise to God.

The Church should “take order” in the selection of her Psalmody, says our brother; and who, or what does he mean by “the Church?” Why, forsooth, he means the Old School Presbyterian Church — rather a presumptous claim — sufficiently arrogant for a Pope or a Prelate to advance. The Confession of Faith says, (ch xxv. 2,) “the visible Church, which is also Catholic, or universal under the Gospel, consists of all those throughout the world that profess the true religion, together with their children,” &amp;c. For this Catholic Church there ought to be a standard of praise. But if every denomination of professing Christians, (in all of which there are some true members of the visible Catholic Church,) is allowed to “take order,” and provide its own songs of praise, the consequence will be, as it is this day, that God’s people will be constrained to sing “any thing and every thing,” &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter I. Psalmody – The Question in Evangelical Guardian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Dr. [James H.] Snowden belongs to a denomination which has a Hymnal. At the back of this Hymnal there is a “Psalter.” This Psalter contains sixty selections, averaging twenty to thirty verses each. All are taken from the Old Testament Psalms; and they are intended for use in the public worship of Almighty God. We imagine that they are used regularly by most of the congregations of the Presbyterian Church to which Dr. Snowden belongs.

Yet according to Dr. Snowden the Psalms passed centuries ago “into the museum of fossilized religion and extinct theology.” A more grievous misrepresentation, it would be hard to find. “If a son shall ask bread of any of you that is a father, will he give him a stone?” Either the ministers of the Presbyterian Church in the U.S.A. are calling upon their congregations once or twice every Sunday to resurrect some of the “fossils” of an all but forgotten past, to feed on “stones,” or else Dr. Snowden has traduced and defamed some of the most precious possessions of the Christian believer of today.

The Old Testament Psalms are pre-eminently the book of devotion of the Christian Church. They are not “fossils”; they are not “dead and turned to stone.” They are full of living truth because they are the words of the living God. They have brought blessing and comfort and life to countless generations of believers. They were the solace of the persecuted saints on the desolate moors of Scotland and in the mountain fastnesses of the Waldenses. Martyrs went to the stake with psalms on their lips. They have been read and chanted and sung in every part of the Christian Church; and will continue to be so used while time shall last. “Fossils”! Every Christian who is loyal to God’s word will emphatically repudiate such an outrageous metaphor.</p></blockquote>

</figure><figure class="quote" id="q-d897e7cab1" data-kw="">
<blockquote><p>We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?</p></blockquote>

<blockquote><p>As for the curses drawn out of divers Psalms, where David craveth God’s help against his enemies, desiring that they may be overthrown and confounded, we say as we have said touching that which S. Paul writeth of Alexander the copper smith that is: that David having the spirit of prophecy, might have certain revelation of the overthrow of those against whom he prayed and guided by the same spirit, he forsheweth and wisheth (in conforming him self to the just judgement of God) that his enemies shall come to shame and confusion:

Considering also that this Prophet represented the head of the Church, that is to say Jesus Christ, King of Kings and only head of the faithful: And in this respect he boldly proceedeth and saith: that all they that withstand him whom God hath raised up above others, shall be sharply punished for their boldness and rashness for that they with stand God and his Christ. We may not then defend our selves with such like cursings as are found in many places of Scriptures, seeing there are certain things particular to Prophets, which cannot consequently belong to them that are much inferior to such holy personages: which did as it were foresee their overthrow at hand, whom they wished to be saved if they would have repented: …</p></blockquote>

nd+despise+the+gospel+of+our+Lord+Jesus+Christ%2C+%28London%3A+Lucas+Harison%2C+%5B1570%5D%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b51f5e102.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8b51f5e102.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/08/27/augustin-marlorat-on-the-imprecatory-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles, his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices.

It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offence and hesitation. …

There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/agobard-of-lyon.html">Agobard of Lyon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Divine Psalmody</cite>, (c. 384-88), trans. Allen Cabaniss in George E. McCracken (ed.), Early Medieval Theology, The Library of Christian Classics (Louisville KY: The Westminster Press, 1957), pp 365-66, 367.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Of the 150 Psalms in the Psalter, some six are commonly classified as “imprecatory” Psalms—the 55th, 59th, 69th, 79th, 109th and 137th. Many other Psalms contain “imprecatory” elements, namely, divinely inspired prayers for the destruction of certain wicked men, enemies of God. The Psalter is constantly being reproached because of the “imprecatory” Psalms. It is said that these Psalms breathe a savage spirit, that they are alien to the “spirit of Jesus,” that they are not suited to Christian devotion, and so forth.

These objections spring partly from a misunderstanding of the Psalms themselves. The objectors often regard them as mere human compositions. They see in them simply David’s private wrath against his personal enemies. But such is not the character of these Psalms. They are divinely inspired and they are directed against implacable enemies of God and of God’s kingdom. They are so cited in the New Testament (Psalm 69:25 and 109:8 quoted in Acts 1:20).

Nor are the “imprecatory” Psalms really contrary to the “spirit of Jesus” or the “spirit” of the New Testament. All that is found in them can be matched by statements of the New Testament, and none is more terrible than the words of Jesus Christ against those permanently identified with Satan’s kingdom. The objections also arise partly from a false idealism in religion, which regards Christianity as merely a matter of ideals. Christianity is not merely a matter of ideals; it is not even merely salvation; Christianity is divine redemption from an objective realm of evil—from the land of Egypt, from the house of bondage, from Satan’s kingdom.

Christianity involves divine judgment on sin and sinners as truly as it involves divine redemption for God’s people. The false notion that God is nothing but love is responsible for much of the opposition to these Psalms. The present writer recalls hearing a young woman, a member of a Psalm-singing church, say of Psalm 137: “I just HATE that Psalm!”

The most charitable explanation of this attitude toward a part of God’s holy Word is that this young woman really understood neither Psalm 137, nor the real character of Biblical religion as divine redemption from an objective realm of evil. She had no doubt been fed on a false religious idealism which thought of God as nothing but love, and left His justice entirely out of the picture.

Such is a very one-sided view of God. “Behold the goodness and severity of God” (Romans 11:22)—not only the goodness of God, but also the severity of God. The Psalms give the whole picture, not just one side. They portray not only God’s love and salvation, but His justice and retribution meted out to wicked men. Christ’s kingdom is not advanced without Satan’s kingdom being destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ashamed of the Tents of Shem? in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fac1d9e67d" data-kw="">
<blockquote><p>I have arranged the book into fifty-two Meditations, adapted for each Lord’s Day, not merely because it is not intended to read them continuously through, but because the subject is, so to speak, specially identified with the risen Saviour. For the truth lying at the foundation of the Psalms, and which makes them the Hymnal of the Church, is the identification of Christ with the Church.

All the sorrows of the believer run up into the sorrow of Christ; and all the joys of the believer flow from the joy of Christ. And around these three truths — helpless misery, glorious salvation, and faith, with its exponent, prayer — move all the Psalms. Any seeming repetitions may therefore in part perhaps be due to the constant recurrence of these three elements throughout the Psalms.

Had the volume been suitable for it, I would fain have inscribed it, such as it is, to those loved friends to whom it is my privilege to minister in the gospel of His Son. Any mark of affection, however slender, to those who are themselves so earnest and loving, would have been peculiarly grateful.

And now I would send it forth with the earnest prayer that the Lord the Spirit who indited the Psalms, would give us all increasingly, the spiritual understanding and the spiritual joy of them in Christ; and so bless the effort to open this alabaster-box, that the savour of His name may be as ointment poured forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Golden Diary of Heart Converse with Jesus in the Book of Psalms. Arranged for every Sunday in the Year</cite>, (London: James Nisbet &amp; Co., 1866), vi-vii.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

— Alfred Edersheim, The Golden Diary of Heart Converse with Jesus in the Book of Psalms. Arranged for every Sunday in the Year, (London: James Nisbet &amp; Co., 1866), vi-vii.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+have+arranged+the+book+into+fifty-two+Meditations%2C+adapted+for+each+Lord%E2%80%99s+Day%2C+not+merely+because+it+is+not+intended+to+read+them+continuously+through%2C+but+because+the+subject+is%2C+so+to+speak%2C+specially+identified+with+the+risen+Saviour.+For+the+truth+lying+at+the+foundation+of+the+Psalms%2C+and+which+makes+them+the+Hymnal+of+the+Church%2C+is+the+identification+of+Christ+with+the+Church.%0A%0AAll+the+sorrows+of+the+believer+run+up+into+the+sorrow+of+Christ%3B+and+all+the+joys+of+the+believer+flow+from+the+joy+of+Christ.+And+around+these+three+truths+%E2%80%94+helpless+misery%2C+glorious+salvation%2C+and+faith%2C+with+its+exponent%2C+prayer+%E2%80%94+move+all+the+Psalms.+Any+seeming+repetitions+may+therefore+in+part+perhaps+be+due+to+the+constant+recurrence+of+these+three+elements+throughout+the+Psalms.%0A%0AHad+the+volume+been+suitable+for+it%2C+I+would+fain+have+inscribed+it%2C+such+as+it+is%2C+to+those+loved+friends+to+whom+it+is+my+privilege+to+minister+in+the+gospel+of+His+Son.+Any+mark+of+affection%2C+however+slender%2C+to+those+who+are+themselves+so+earnest+and+loving%2C+would+have+been+peculiarly+grateful.%0A%0AAnd+now+I+would+send+it+forth+with+the+earnest+prayer+that+the+Lord+the+Spirit+who+indited+the+Psalms%2C+would+give+us+all+increasingly%2C+the+spiritual+understanding+and+the+spiritual+joy+of+them+in+Christ%3B+and+so+bless+the+effort+to+open+this+alabaster-box%2C+that+the+savour+of+His+name+may+be+as+ointment+poured+forth.%E2%80%9D%0A%0A%E2%80%94+Alfred+Edersheim%2C+The+Golden+Diary+of+Heart+Converse+with+Jesus+in+the+Book+of+Psalms.+Arranged+for+every+Sunday+in+the+Year%2C+%28London%3A+James+Nisbet+%26+Co.%2C+1866%29%2C+vi-vii.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffac1d9e67d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fac1d9e67d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/13/alfred-edersheim-on-christ-and-the-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

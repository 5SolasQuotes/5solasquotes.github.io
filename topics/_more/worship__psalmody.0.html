<blockquote><p>Yea, in those confessions, those passionate psalms made for him, we find him acknowledging of sin as his own. This will appear by some passages in those psalms which are prophetically made of Christ, and utter the inward addresses of his soul unto his Father. And of all the psalms, or other prophecies of this nature, there is no one except the twenty-second, which can challenge more passages in so small a space, applied expressly unto Christ in the New Testament, than the sixty-ninth psalm. In ver. 4 we have it, ‘They hated me without a cause.’ This we find applied by Christ himself, as prophesied of himself, John xv. 25. Again, we have it ver. 9 of that psalm, ‘The zeal of thine house hath eaten me up.’

This you have in like manner, John ii. 19, applied unto Christ. Moreover, the next words of that 9th verse, ‘The reproaches of them that reproached thee are fallen upon me.’ Lo, you have them applied by Paul as expressly unto Christ, Rom. xv. 3. Again, that passage, ver. 21, ‘They gave me gall for my meat, and in my thirst they gave me vinegar to drink;’ you know both the story and the application of it by the evangelists, Matthew, Mark, and John. Then that other passage that follows, ‘Let their table be made a snare,’ you have it applied accordingly unto the Jews that crucified him, for their crucifying of him, Rom. xi. 9.

Now then, so many of these being so applied, why should not those others also be so applied? as when it is said, ver. 4, 5, ‘Then I restored that which I took not away; O God, thou knowest my foolishness, and my guiltiness is not hid from thee.’ How fitly do these words express the imputation of sin to him. It was a proverbial speech, when a man suffered innocently as to his own person, to say that ‘He restored that which he took not,’ and so Christ on the cross is brought in here speaking. For as Isaiah tells us, ‘He bore our sins;’ with Oh in the next verse of the psalm he confesseth as his own, having taken them upon him. ‘O God, thou knowest my foolishness’ (that is my sin, as foolishness it is usually taken), ‘and my sins are not hidden from thee.’ Which is plainly in other words that which the apostle says of him, 2 Cor. v., ‘He that knew no sin was made sin.’

The like you have in the fortieth psalm, ‘Sacrifice and burnt-offering thou wouldst not; Lo I come,’ &amp;c., ver. 6, 7, which how it is applied to Christ you may read in Heb. x, neither can it well be applied to any other. Yet, ver. 12, he says, ‘My iniquities take hold of me.’ He calls them his, not by perpetration, but by a voluntary assumption, and by imputation, reckoning them as his. So Isaiah liii. 6, ‘He laid on him the iniquities of us all.’ In the Hebrew it is, ‘He caused to meet in him the iniquities of us all.’ He was made the great ocean, into which the guilt of all our sins did run.</p></blockquote>

<blockquote><p>The 72d Psalm is an eminent instance of Christ being the subject matter of praise; the person spoken of. To apply it exclusively to David or to Solomon would contradict the facts of history and be little short of impiety. An infinitely greater than David or Solomon is here. While the petition with which the Psalm begins can apply to them both, in a far higher sense it applies to him who is both David’s Son and Lord. In this song the Old Testament worshipper prayed for the establishment and perpetuity of the kingdom of the Messiah before he came into the world. We in singing it and other Messianic songs celebrate the greatness of the kingdom and the glory of the King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>

<blockquote><p>XXV. But are not “psalms, hymns, and spiritual songs,” mentioned in the New Testament, to be sung?

Yes. We are commanded to sing them. Eph. 5:19. Col. 3:16.

XXVI. Were they not something different from the Book of Psalms?

No. For the Colossians and Ephesians had already the Septuagint. “Moses was read in their synagogues every Sabbath day,” their first Christian assemblies Acts 13:15, and converts were Jews Acts 18:19; 19:1,19. Col. 2:14, and therefore, when they were thus directed, they would easily understand, that the psalmois, humnois and odais pneumatikais were obviously the Mitzmorim Shirim, and Tehillim previously given in the Book of Psalms, by the inspiration of God. Besides, in the Septuagint Psa. 72:20, and by Josephus Antiq. B. VII. chap. 12, the Tephiloth, or prayers of David, are called hymns.

XXVII. Do not these various terms indicate different kinds of hymns, from those found in the Book of Psalms, and authorize the composition of religious poetry as the matter of praise?

No. No more than the terms law, commandment, and statutes, in the 119th Psalm, denote any thing different from the word of God, and authorize, as the revealed will of Heaven, the writings of Josephus, the Koran, or the Book of Mormon.

XXVIII. When commanded to “let the word of Christ dwell in” them “richly,” if his “word” could not be found in the “hymns and spiritual songs” contained in the Book of Psalms, could the Colossians and Ephesians remain upon the earth, until modern hymnologists could supply its supposed defects?

No. Nor yet compose, without divine inspiration, hymns for themselves, of which God would assuredly accept, as the matter of his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-blaikie.html">Alexander Blaikie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism of Praise</cite>, (1849; Boston: S. K. Whipple and Co, 1854), pp 12-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Repentance is an inward sorrowing, and continual mourning of the heart and conscience for sin joined with faith and both inward, and outward amendment: Inward I say in changing the thoughts and affections of the heart: and outward in changing the words, and works from evil to good. This repentance no doubt was in David, who when he was covertly reproved by the prophet Nathan, and his sins laid before his eyes, did not stubbornly defend them, and so justle against God: nor yet secretly excuse them, and daube them over, but cried out in the bitterness of his heart: I have sinned, and thereupon made the 51. Psalm.

A Psalm indeed full of dolour and heaviness: Wherein the Prophet bewaileth his falls, lamenteth his sins, and prayeth even for a new heart, and a new spirit, new thoughts, new affections, new purposes of amendment of life. So that in David we may see an inward sorrowing, a lasting grief (as the book of Psalms doth every where declare, which layeth him out as it were in an Anatomy) yea, and great reformation, both in inward, &amp; outward sins. Here therefore behold what is Repentance.</p></blockquote>

<blockquote><p>The Book of Psalms, viewed merely as a poetical composition, has very high claims on our attention. Men of the most refined and cultivated taste have often been attracted to the study of it from the poetical beauties with which it abounds, and have admitted, in this respect, the superiority of its claims. The greatest of our English poets thus speaks of these sacred songs: “Not in their divine argument alone, but in the very critical art of composition, they may be easily made appear over all the kinds of lyric poesy to be incomparable.” [John Milton] Another elegant scholar speaking on the same subject, says, “In lyric flow and fire, in crushing force and majesty, that seems still to echo the awful sounds once heard beneath the thunder clouds of Sinai, the poetry of the ancient Scriptures is the most superb that ever burned within the breast of man.” [Sir Daniel K. Sandford]

But the intrinsic excellence of this Book gives it still higher claims on our attention. Written under the influence of the Spirit of inspiration, its subject-matter is worthy of its celestial origin. In general, it contains details of the national history of the Jewish people, records of particular portions of the life and experience of individuals, and predictions of future events. Each of these heads embraces a wide field, and they include illustrations of every religious truth which it is necessary for us to know, exemplifications of every devout feeling which it is our duty to cherish, and examples of every spiritual conflict which it is possible for us to experience. We meet with many disclosures of the greatness, majesty, and perfections of the only true God; his government of the world; and his special care over his chosen people.

We meet with the varied exercises of the regenerated soul, and behold it at one time offering up fervent supplications to the Hearer of prayer, at another celebrating his perfections and works; at one time giving utterance to the ardent breathings of love to God, and trust in him, at another struggling with unbelief and corruption; at one time mourning under the divine chastisement on account of sin, at another rejoicing in a sense of forgiving mercy, and enjoying the peace which passeth all understanding. We have presented to us many wonderful predictions concerning the Messiah, his humiliation, sufferings, death, resurrection, and ascension to his Father’s right hand; his work in heaven as the intercessor of his people, and his authority as universal King; the effusion of the influences of the Holy Spirit, and the conversion of all nations to the faith of the Gospel. In short, we have unfolded to our view the final judgment, the gathering of all the righteous to God, and the eternal exclusion of the wicked from happiness and from hope.

These and similar topics which are set forth in the noblest strains of poetry, and in a diction whose magnificence and sublimity correspond to the importance and grandeur of the sentiments, constitute the materials of this Book; and while they afford an incontestable proof that it Is inspired, that it does not consist of the creations of mere human genius, but is an emanation from heaven, they show that its character and tendency are altogether different from the character and tendency of the most admired poetry, which the genius of heathen nations has ever produced.

It ministers to no depraved passion; it fosters no fictitious virtue; it disdains to offer its delicious incense at the shrine of degrading superstition. It teaches the most exalted piety, and the purest morality. It tends only to refine and exalt the nature of man, to elevate the soul to God, and inspire it with the admiration and love of his character, to curb the passions, purify the affections, and excite to the cultivation of whatsoever things are true, honest, just, pure, lovely, and of good report. It has guided the saint in doubt and difficulty; it has nerved him for self-denial and suffering; it has imparted support and comfort to him in the hour of death.

This Book has accordingly been highly appreciated by the best of men in every age, and they have laboured to find expressions in which to set forth its excellence. Athanasius styles it, “An epitome of the whole Scriptures;” Basil, “A compendium of all theology;” Luther, “A little Bible, and the summary of the Old Testament;” Melancthon, “The most elegant work extant in the world;” and for Calvin’s estimate of its value we refer to the excellent preface with which he introduces this department of his labours to the attention of the reader.</p></blockquote>

<blockquote><p>VIII. Did David, as the psalmist of Israel, write all the psalms?

No. He wrote probably more than one half of them. Yet they are called by his name (David, Heb. 4:7. Rom. 11:9) because he was employed more extensively than any other, in this part of the word of God, as the amanuensis of the Holy Ghost.

IX. What name was originally given to that part of the Holy Scriptures which is thus called David?

It was called “Tehillim,” that is, hymns or praises, because it was given as the matter of divine praise to the church of God in every future age. It is also called “Psalms,” because many of these “spiritual songs” were, at the temple worship, sung with the psaltery. Parts of the book have other names, as Mizmor, Shir (46, title), Tehillah (145, title), Tephilah (17,86,102, titles), Prayers, Shir-hammacholoth (120-134) – Odes of Ascension. They are also called, in the Septuagint, Psalmoi.

X. When were the Tehillim, or Psalms written and formed into a book?

They were written in a manner similar to the other parts of Scripture Heb. 1:1, during a period of nearly one thousand years, and were collected into one book, probably by “Ezra the priest, a scribe of the law of the God of heaven.” They stood in their present numerical order in the days of the apostles. Acts 13:33.

XI. Were other songs, beside those contained in the Book of Psalms, composed during that period?

Yes, many. Such as the Song of Deborah Judg. 5:12, the song of the well Num. 21:17, 18, the 1005 songs of Solomon, and others.

XII. Were not these then given as the matter of her praise, or are they not commanded to be sung by the church in all future ages?

No. As we read of different books in Scripture, such as the book of Gad, of Nathan, of Jehu, of Jasher, and the Epistle from Laodicea, which were not collected into the sacred canon, by the Holy Ghost, so we thus know, that by the same divine sovereignty, the songs thus noticed, or even recorded, were ephemeral as matter of praise; while the songs contained in the “Sepher Tehillim,” or Book of Psalms, and collected and placed in one book by the Spirit, are a part of “the word of God, which liveth and abideth forever,” selected by infinite wisdom, and given expressly as the matter of praise to the church until the end of time. The same principle applies to any isolated and occasional hymns or songs, which may be found in the New Testament.

XIII. Were any attempts made to add to the Book of Psalms, after it was completed?

Yes. The 151st psalm was fabricated, and attempted to be added to the then perfect book, nearly three hundred years before “the Christian era.” Septuagint, Psa. 151st.

XIV. Is such an attempt authorized by God?

No. It arises from the depravity of our nature, and the opposition of our wills to the divine will, and consequently forms a part of what the Holy Ghost calls “will worship,” which has a show of wisdom. Col. 2:23.

XV. Is, then, this book called the Book of Psalms, by the Holy Ghost?

It is so called, both by Jesus Christ and by the Spirit. Luke 20:42; Acts 1:20; Heb. 4:7.

XVI. Was it given to the Jewish church to be the matter of praise to God?

Yes. 1 Chron. 16:7; 25:1, 5; Psa. 81:1; . Neh. 12:8, 46; Psa. 137:3, 4; Ezra 3:10.

XVII. Was the Jewish church in reality different from the Christian?

No. They are the same church, under different dispensations. Acts 7:38; Heb. 4:2; Gal. 4:3, 4.

XVIII. When Christ came “to fulfil all righteousness,” and by his evangelists and apostles to complete the oracles of God, did he, or they, praise Jehovah by singing psalms?

Yes, both did. Matt. 26:30; Mark 14:26; Acts 16:25; Psa. 22:2; Heb. 2:13.

XIX. Did they deliver, by inspiration, any other “psalms, hymns, or spiritual songs,” than those contained “in David”? Heb. 4:7.

No. One such psalm or song would be a treasure for the edification of the saints, if “the Psalms” had been simply Jewish; and yet it would not afford a precedent or warrant for uninspired men to make human hymns, and sing them as praise to God. Isa. 1:12. Hos. 13:2.

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.</p></blockquote>

<blockquote><p>What is there, sir, concerning Christ’s kingdom that is not celebrated in the Psalms in the language of fulfilment? I say that even when the mystery of God shall have been finished, and both the fulness of Israel and the fulness of the Gentiles shall have been brought in, the Church may celebrate her millennial glory in the language of fulfilment from the Psalms of David.

“He mindful of his grace and truth To Israel’s house hath been; And the salvation of our God All ends of the earth have seen.”

All the ends of the earth that have seen the salvation of our God, know the Psalms of David. The Psalms are the grand catholic hymnal, and the singing of them provides for Christian union and for perfect catholicity.</p></blockquote>

</figure><figure class="quote" id="q-8032717e6d" data-kw="">
<blockquote><p>Oh! the wise invention of the teacher who contrived that while we were singing we should at the same time learn something useful; by this means, too, the teachings are in a certain way impressed more deeply on our minds. Even a forceful lesson does not always endure, but what enters the mind with joy and pleasure somehow becomes more firmly impressed upon it.

What, in fact, can you not learn from the psalms? Can you not learn the grandeur of courage? The exactness of justice? The nobility of self-control? The perfection of prudence? A manner of penance [repentance]? The measure of patience? And whatever other good things you might mention? Therein is perfect theology, a prediction of the coming of Christ in the flesh, a threat of judgment, a hope of resurrection, a fear of punishment, promises of glory, an unveiling of mysteries; all things, as if in some great public treasury, are stored up in the Book of Psalms.

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.</p></blockquote>

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.”

<blockquote><p>For what more commodity did the Jews receive by King David’s means, then we by our sovereign Lady Queen Elizabeth’s? What enemies, what dangers, what deaths did he escape: from the like whereof the Lorde hath not as often, as wonderfully, preserved her Majesty? The ark of the covenant, wherein the testimony was laid, whereon the mercy-seat was placed, from which the voice of God was heard, at which his name was called upon, whereto they had not sought in the days of Saul, King David brought into his city: and caused the Levites joyfully to play on instruments of music, and lift up their voices at the bringing of it.

Queen Elizabeth hath brought us the body and truth of that whereof his ceremonies were but shadows only, the free use and Christian doctrine of the Gospel, the word of God, the holy Scriptures, the prayers and public service of the highest, all in a language known to all: and hath moved her Subjects to receive these means of their instruction and salvation with Psalms, and hymns, and spiritual songs, singing with a grace in their hearts unto the Lord. [1]

David to those heavenly treasures added earthly, &amp; enriched his kingdom with silver and gold. The purity of coin restored by her Majesty for base and copper monies wherewith she found the realm pestered, doth say no less for her: beside place of silver and gold with other ornaments in so great plenty, as if God would verify according to the letter that which he promised his Church in a mystery, For brass will I bring gold, and for iron will I bring silver. Much did it make for the safety of Jury, that David put garrisons in Syria and Idumaea, countries that bordered upon the North and South thereof much.

But more for England, that Elisabeth (to pass over the fortifying of borders) hath furnished it with all sort of armour, and munition, never more or better: and thereto with a royal navy of vessels, so stately, so strong, so well appointed for wars, that our land is fenced with walls, not only of wood as Gręcia was against Xerxes, but of brass &amp; iron too against foreign enemies. The people of Israel confessed of themselves that they were delivered out of the hand of the Philistines, and other enemies by that King. The wars which our Queen hath had for our safeguard in Scotland and France, even aliens have seen and shewed to the world that they were attached with marvellous honour and advantage to her self &amp; her realm.</p></blockquote>

<blockquote><p>The unction and fragrance of the Spirit with which the Psalms are replete lead me to notice, before leaving this portion of our survey, that it is an utter misconception to represent the Old Testament religion as more fed by mundane hopes, than by the influence of the Holy Spirit.

It is to pervert the plainest evidence to affirm, as Cocceius and his school affirmed, that there was neither sonship nor the spirit of adoption in the Old Testament Church. That was to ignore the Abrahamic Covenant, and Christ’s divine presence with His Church, and merely to fix all attention upon the intermediate and transitory Sinai Covenant. But the Psalms to which we are adverting, when considered as the actual expression of praise for the Israelitish Church, as well as a legacy handed down to us in the Christian Church, sufficiently refute that view.

No book of a similar kind was prepared for the New Testament Church. The Holy Spirit, replenishing the sweet singers of Israel with spiritual truth and holy love, anticipated in this way much of the necessity that should be felt in Christian times. I am not here discussing the debated point as to the use of psalms in public worship.

My object is to show the spirituality of the Israelitish Church as evinced by its inspired and invaluable psalms. They describe the eternity and omnipresence, the majesty and condescension, the justice and mercy of God in a strain of the most fervid devotion. They sing of repentance and faith, of joy in God and delight in God’s law, with an ardour beyond which it is impossible to go. They depict Christ’s royal reign and His union with His Church; the anointing with the oil of gladness (Ps. 45.7); the receiving of gifts for men (Ps. 68.18); and the supreme dominion with which Christ was to be invested by the Father with a tenderness, unction, and joy, to which no other words are equal And those psalms which are called “new songs” anticipate the full millennial glory.

To reason back from effect to cause, the power and presence of the Spirit in ample fulness must have been graciously conferred to produce these psalms, and to use them fitly when prepared. We trace the power of God’s Spirit in turning the captivity of Israel, and in filling them with penitence. Not only so: the apostle, when adducing the quotation from the Psalms, “I believed, therefore have I spoken,” prefixes “We having the same spirit of faith — we also believe and therefore speak” (2 Cor 4.13; Ps. 116.10). The language of the apostle affirms the same faith and the possession of the same Spirit.

From this fact, and from the whole series of quotations made from them, it is evident that the experience of the Church was the same in both economies, though complexional varieties attached to each. But these varieties, as Calvin well remarks, describe the Church more in its corporate character than in the experience of the individual members. The true Church in the Old Testament, whatever might be the character of the nominal adherents, cannot be said to be unspiritual when we trace a faith and a knowledge of God, a fidelity and courage, an endurance and self-denial in all that great cloud of witnesses that fill us with astonishment, and leave us conscious that we are practically far behind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 25-27.</span></figcaption>

<blockquote><p>ALL SCRIPTURE is INSPIRED by God and is useful, 1 composed by the Spirit for this reason, namely, that we men, each and all of us, as if in a general hospital for souls, may select the remedy for his own condition. For, it says, ‘care will make the greatest sin to cease.’ 2 Now, the prophets teach one thing, historians another, the law something else, and the form of advice found in the proverbs something different still.

But, the Book of Psalms has taken over what is profitable from all. It foretells coming events; it recalls history; it frames laws for life; it suggests what must be done; and, in general, it is the common treasury of good doctrine, carefully finding what is suitable for each one. The old wounds of souls it cures completely, and to the recently wounded it brings speedy improvement; the diseased it treats, and the unharmed it preserves. On the whole, it effaces, as far as is possible, the passions, which subtly exercise dominion over souls during the lifetime of man, and it does this with a certain orderly persuasion and sweetness which produces sound thoughts.

When, indeed, the Holy Spirit saw that the human race was guided only with difficulty toward virtue, and that, because of our inclination toward pleasure, we were neglectful of an upright life, what did He do? The delight of melody He mingled with the doctrines so that by the pleasantness and softness of the sound heard we might receive without perceiving it the benefit of the words, just as wise physicians who, when giving the fastidious rather bitter drugs to drink, frequently smear the cup with honey.

Therefore, He devised for us these harmonious melodies of the psalms, that they who are children in age or, even those who are youthful in disposition might to all appearances chant but, in reality, become trained in soul. For, never has any one of the many indifferent persons gone away easily holding in mind either an apostolic or prophetic message, but they do chant the words of the psalms, even in the home, and they spread them around in the market place, and, if perchance, someone becomes exceedingly wrathful, when he begins to be soothed by the psalm, he departs with the wrath of his soul immediately lulled to sleep by means of the melody.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 10 on Psalm 1</cite>, 1 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 151-52.</span></figcaption>

</figure><figure class="quote" id="q-1ed38d6d8a" data-kw="">
<blockquote><p>Of joining with the congregation in hearing the Word, even read as well as preached. See what a reverend respect God’s people shewed even to the Word read, Nehem 8, 3. The ears of all the people were attentive unto the book of the Law; and ver. 5. When Ezra opened the book (to read it) all the people stood up.

Make conscience to join with the congregation in those prayers that are read as well as in those that are conceived. For those that are read are holy, &amp; good prayers, and all the congregation should make their prayers and supplications with one accord, as they did, Act. 1. 14. Hold thy self bound to join with the congregation in singing of Psalms also. See how well God shewed himself to be pleased with this duty, 2 Chron. 20. 22. When they began to sing, and to praise; the Lord set ambushments against the children of Ammon, &amp;c.</p></blockquote>

</figure><figure class="quote" id="q-1bdf6fb235" data-kw="">
<blockquote><p>In the imprecatory psalms, we are raised to his throne to join with him in his denunciations of wrath on his enemies. Private resentment is not to be allowed a place in singing these songs. That would be to offer strange fire on God’s altar, and instead of being acceptable service would expose to his displeasure.

The general import of these psalms is substantially as in the second and third petitions of the Lord’s prayer. “Thy kingdom come, thy will be done on earth as it is in heaven.” As taught in the Shorter Catechism in the petition: “Thy kingdom come,” we pray that “Satan’s kingdom may be destroyed.” This must take place before the kingdom of Christ can be established; and in singing those imprecatory petitions we magnify his grace in these displays of his power by which this glorious result is to be accomplished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-31c43e2a8c" data-kw="">
<blockquote><p>Among Treatises fit to be published and read, Treatises of Devotion are most fit: as being freest from offence, and fullest of divine matter. If comparison may be made betwixt parts of sacred Scripture, the Psalms of David have an excellency in that they consist of matters of Devotion. Answerable to the style of his name, is the style of his book. The style of his name was, A man after GOD’S own heart. For such was his piety and sincerity as GOD was well pleased therewith, and took much delight therein. The rather because his devotion towards GOD incited him to do what GOD required to be done. So the Book of Psalms, may well carry this style, A book after God’s own heart, in that nothing is more acceptable unto GOD, nothing wherein he takes more delight then Devotion.

And no book of sacred Scripture fuller of Devotion then that book. Most of the Psalms wholly consist of Prayers or Praises: very few, if any at all, wherein there are not some divine raptures, and such heavenly ejaculations, as manifest an heart full of Devotion. For Devotion is a pious and humble affection to God-wards. Humble through conscience of a man’s own infirmity. Pious through a due consideration of the divine clemency. Such Devotion is never more fully and to the life manifested then in Prayers and Praises.

For in these divine duties, if rightly performed, the soul presents it self before GOD, and that in a special manner, being after a sort even rapt out of the body. Then, if ever, doth the Soul, so far as it is capable, with an holy admiration apprehend the divine Majesty, Purity, Justice, Wisdom, Power, yea Mercy, Goodness, and other excellencies wherewith GOD is decked. Then, if ever is the soul brought thoroughly to discern its own infirmity, impurity, baseness, vileness and cursedness.

For contraries paralleled, or laid together do most lively set forth each other in their own proper colours. He that liveth in a dark dungeon, will be enamoured with the bright shining of the Sun, when he can have liberty to see it. And he that hath long lived under bright Sun-shine, more thoroughly discerns the horror and damage of darkness. Now GOD and man are in many respects directly opposite each to other: This opposition is best discerned in our most serious contemplations of Gods excellencies and due consideration of our own manifold infirmities, which is most to purpose done in acts and exercises of Devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Robert Bolton, Certain devout prayers of Mr. Bolton upon solemn occasions</cite></span></figcaption>

<blockquote><p>David, Asaph, &amp;c, having put down the sentiments contained in the words of the Psalms, sent them to Jeduthan, by whom they were adapted to, and became constituent parts in, the worship of the Jewish Church. As such, our Lord and his apostles acknowledged them; and on the cross the Redeemer began one of them, the continuing of which his sufferings prevented.

All other songs fall infinitely beneath these, being liable to mislead; but in these songs there is no fear of mistake in the sentiments they convey. In David’s songs there are no feeble parts; and he gives credit to his reader for perception in their perusal, without those links to connect the different parts, which moderns find it needful to introduce. His mind catches the prominent beauties as they rise before him; like the roebuck, bounding from rock to rock, regardless of the spaces that intervene.

Many of these sacred songs contained or explained the history of their country, and recorded the deeds of their ancestors. And who would not be fired in singing the deeds of Bannockburn, of Marston Moor, or Waterloo?</p></blockquote>

</figure><figure class="quote" id="q-0e33c54de6" data-kw="">
<blockquote><p>Those who wish to know the bearing of Scripture on human hymns as matter of God’s worship should read the two excellent little treatises, respectively entitled, The True Psalmody, and The Public Worship of God, the first of which is an American publication, and the other was penned by the late Dr. [James] Gibson.

It is enough to state here that the Psalms are as much superior to uninspired hymns as God’s Word is to man’s word, and we ought to serve God with the best; that there is no warrant for worshipping God with human hymns, and therefore we have no ground for hoping that such praise will be accepted; and, further, while admitting that metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that Book alone was meant to serve as our manual of praise.

Christ specially referred to “the Book of Psalms,” and Paul, quoting the words, “Thou art my Son, this day have I begotten thee,” says they are “ written in the second Psalm,” thus indicating that they were then arranged in their present order. There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion, is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd Psalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems the most satisfactory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hymnology of the Scottish Reformation. I. in Original Secession Magazine</cite></span></figcaption>

<blockquote><p>‘Sing to the Lord, O ye his saints.’ Not if someone utters the words of the psalm with his mouth, does that one sing to the Lord; but, all who send up the psalmody from a clean heart, and who are holy, maintaining righteousness toward God, these are able to sing to God, harmoniously guided by the spiritual rhythms.

How many stand there, coming from fornication? How many from theft? How many concealing in their hearts deceit? How many lying? They think they are singing, although, in truth they are not singing. For, the Scripture invites the saint to the singing of psalms. ‘A bad tree cannot bear good fruit.’ nor a bad heart utter words of life. Therefore, ‘make the tree good and its fruits good.’ Cleanse your hearts, in order that you may bear fruit in the spirit and may be able, after becoming saints, to sing psalms intelligently to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 14 on Psalm 29</cite>, 3 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 217-18.</span></figcaption>

</figure><figure class="quote" id="q-b55ea98a8d" data-kw="">
<blockquote><p>Having been requested to write a Preface to a reprint, in Ireland, of an American treatise on the Psalmody of Christian worship, I have most cheerfully complied; — partly on account of the importance of the subject — partly on account of the talent displayed in the work — and partly that, by a detail of my own experience, I may add my humble testimony to a great principle.

My earliest recollection of family and public psalmody is that of the exclusive use of the English version of the Biblical Psalms, authorized by the Reformed Church of Scotland. In our Presbyterian Churches, so far as my knowledge extends, others were unknown. When I entered the ministry, in 1807, the Scottish selection of Paraphrases and Hymns had come into partial use; and influenced by the feeling in their favour, I was gradually led to adopt them. The principle of their use once adopted, the way to others was opened to an unlimited extent; for if these paraphrases and hymns be good for public worship, it follows that others may be as good, or better.

Accordingly, at one time of my ministry, I dedicated both time and pains to selecting, from all accessible sources, an additional volume, with an essay, embodying a defence of its use in private or in public worship. I need scarcely add, that I believed my arguments — which were partly original, and partly derivative — to be unanswerable. I shall now detail, and as briefly as may be, the circumstances that first led me to doubt, and finally to reject my former conclusions.

Having been appointed to a short missionary tour, I left my home in good health, but was taken suddenly ill, and, during a month, was unable to return; and it was when “wearisome nights were appointed to me, and tossings to and fro until the dawning of the day,” that, in frequent solitude, I was thrown, almost entirely, on the resources of memory.

But with that faculty God had sufficiently endowed me; and the psalms committed in school-boy days, and paraphrases and hymns of riper years, presented ready subjects of meditation. And it was then, that, all unexpectedly, yet irresistibly, it was impressed upon me, by experience and feeling, that the most celebrated hymns of uninspired men were, like Job’s friends, “miserable comforters,” when compared with the experience of Christ, in the days of humiliation, of which the Book of Psalms is the true prophetic picture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-cooke.html">Henry Cooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to The True Psalmody; or, The Bible Psalms the Church’s Only Manual of Praise (Belfast: James Johnston, 1861).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Another thing God did towards this work, at that time, was his inspiring David to show forth Christ and his redemption, in divine songs, which should be for the use of the church, in public worship, throughout all ages. David was himself endued with the spirit of prophecy.

He is called a prophet, Acts ii. 29.30. “Let me freely speak to you of the patriarch David, that he is both dead and buried, and his sepulchre is with us unto this day: therefore being a prophet, and knowing that God had sworn with an oath,” &amp;c. So that herein he was a type of Christ, that he was both a prophet and king.

We have no certain account of the time when David was first endued with the spirit of prophecy; but it is manifest, that it either was at the time that Samuel anointed him, or very soon after; for he appears soon after acted by this spirit, in the affair of Goliath: and then great part of the psalms were penned in the time of his troubles, before he came to the crown; as might be made manifest by an induction of particulars.

The oil that was used in anointing David was a type of the spirit of God; and the type and the antitype were given both together; as we are told, 1 Sam. xvi.13. “Then Samuel took the horn of oil, and anointed him in the midst of his brethren; and the spirit of the Lord came down upon David from that day forward:” and it is probable, that it now came upon him in its prophetical influences.

The way that this spirit influenced him was, to inspire him to show forth Christ, and the glorious things of his redemption, in divine songs, sweetly expressing the breathings of a pious soul, full of admiration of the glorious things of the Redeemer, inflamed with divine love, and lifted up with praise; and therefore he is called the sweet psalmist of Israel. 2 Sam. xxiii.1. “Now those be the last words of David: David the son of Jesse said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet psalmist of Israel.”

The main subjects of these sweet songs were the glorious things of the gospel; as is evident by the interpretation that is often put upon them, and the use that is made of them in the New Testament; for there is no one book of the Old Testament that is so often quoted in the New, as the book of Psalms. Joyfully did this holy man sing of those great things of Christ’s redemption, that had been the hope and expectation of God’s church and people from the beginning of the church of God on earth; and joyfully did others follow him in it, as Asaph, Heman, Ethan, and others; for the book of Psalms was not all penned by David, though the greater part of it was. Hereby the canon of scripture was further added to; and an excellent portion of divine writ was it that was added.

This was a great advancement that God made in this building; and the light of the gospel, which had been gradually growing from the fall, was exceedingly increased by it: for whereas before there was but here and there a prophecy given of Christ in a great many ages, nowhere Christ is spoken of by his ancestor David abundantly, in multitudes of songs, speaking of his incarnation, life, death, resurrection, ascension into heaven, his satisfaction, intercession; his prophetical, kingly, and priestly office; his glorious benefits in this life and that which is to come; his union with the church, and blessedness of the church in him; the calling of the Gentiles, the future glory of the church near the end of the world, and Christ’s coming to the final judgement. All these things, and many more, concerning Christ and his redemption, are abundantly spoken of in the book of Psalms.

This was also a glorious advancement of the affair of redemption, as God hereby gave his church a book of divine songs for their use in that part of their public worship, viz. singing his praises, throughout all ages to the end of the world. It is manifest the book of Psalms was given of God for this end. It was used in the church of Israel by God’s appointment: this is manifest by the title of many of the psalms, in which they are inscribed to the chief musician, i. e. to the man that was appointed to be the leader of divine songs in the temple, in the public worship of Israel.

So David is called, the sweet psalmist of Israel, because he penned psalms for the use of the church of Israel; and accordingly we have an account that they were actually made use of in the church of Israel for that end, even ages after David was dead; as 2 Chron. xxix.30. “Moreover, Hezekiah the king, and the princes, commanded the Levites to sing praises unto the Lord, with the words of David, and of Asaph the seer.”

And we find that the same are appointed in the New Testament to be made use of in the Christian church, in their worship: Eph. v. 19. “Speaking to yourselves in psalms, hymns, and spiritual songs.” Col. iii. 16. “Admonishing one another in psalms, hymns, and spiritual songs.” And so they have been, and will to the end of the world be made use of in the church to celebrate the praises of God. The people of God were wont sometimes to worship God by singing songs to his praise before; as they did at the Red sea; and they had Moses’s prophetical song, in the 32nd chapter of Deuteronomy, committed to them and Deborah, and Barak, and Hannah, sung praises to God: but now first did God commit to his church a book of divine songs for their constant use.</p></blockquote>

oming+to+the+final+judgement.+All+these+things%2C+and+many+more%2C+concerning+Christ+and+his+redemption%2C+are+abundantly+spoken+of+in+the+book+of+Psalms.%0A%0AThis+was+also+a+glorious+advancement+of+the+affair+of+redemption%2C+as+God+hereby+gave+his+church+a+book+of+divine+songs+for+their+use+in+that+part+of+their+public+worship%2C+viz.+singing+his+praises%2C+throughout+all+ages+to+the+end+of+the+world.+It+is+manifest+the+book+of+Psalms+was+given+of+God+for+this+end.+It+was+used+in+the+church+of+Israel+by+God%E2%80%99s+appointment%3A+this+is+manifest+by+the+title+of+many+of+the+psalms%2C+in+which+they+are+inscribed+to+the+chief+musician%2C+i.+e.+to+the+man+that+was+appointed+to+be+the+leader+of+divine+songs+in+the+temple%2C+in+the+public+worship+of+Israel.%0A%0ASo+David+is+called%2C+the+sweet+psalmist+of+Israel%2C+because+he+penned+psalms+for+the+use+of+the+church+of+Israel%3B+and+accordingly+we+have+an+account+that+they+were+actually+made+use+of+in+the+church+of+Israel+for+that+end%2C+even+ages+after+David+was+dead%3B+as+2+Chron.+xxix.30.+%E2%80%9CMoreover%2C+Hezekiah+the+king%2C+and+the+princes%2C+commanded+the+Levites+to+sing+praises+unto+the+Lord%2C+with+the+words+of+David%2C+and+of+Asaph+the+seer.%E2%80%9D%0A%0AAnd+we+find+that+the+same+are+appointed+in+the+New+Testament+to+be+made+use+of+in+the+Christian+church%2C+in+their+worship%3A+Eph.+v.+19.+%E2%80%9CSpeaking+to+yourselves+in+psalms%2C+hymns%2C+and+spiritual+songs.%E2%80%9D+Col.+iii.+16.+%E2%80%9CAdmonishing+one+another+in+psalms%2C+hymns%2C+and+spiritual+songs.%E2%80%9D+And+so+they+have+been%2C+and+will+to+the+end+of+the+world+be+made+use+of+in+the+church+to+celebrate+the+praises+of+God.+The+people+of+God+were+wont+sometimes+to+worship+God+by+singing+songs+to+his+praise+before%3B+as+they+did+at+the+Red+sea%3B+and+they+had+Moses%E2%80%99s+prophetical+song%2C+in+the+32nd+chapter+of+Deuteronomy%2C+committed+to+them+and+Deborah%2C+and+Barak%2C+and+Hannah%2C+sung+praises+to+God%3A+but+now+first+did+God+commit <blockquote><p>‘God be merciful unto us, and bless us; and cause His face to shine upon us. That Thy way may be known upon earth, Thy saving health among all nations.’ Psalm Ixvii. 1, 2

The royal Psalmist, in the spirit of inspiration, personating the Church of the redeemed in every age, and more especially under its last and most perfect dispensation, here offers up a sublime prayer for its inward prosperity, and outward universal extension. All is in the order of nature and of grace. Knowing full well that he who has not obtained mercy from the Lord, cannot be a fit bearer of it to others, — that he who has obtained no blessings himself, can dispense none,—that he who enjoys no light, can communicate none, — he first of all, with marked and beautiful propriety, begins with the supplication of personal and individual blessings: — ‘God be merciful unto us,’ forgiving and pardoning all our sins: ‘and bless us,’ conferring every gift and every grace really needful for time and eternity: ‘and lift up the light of thy countenance upon us,’ cheering us with the smile of reconciliation and love, and causing the Sun of Righteousness to arise on our darkened souls with healing in his beams.

But does the Psalmist stop here? Does he for a moment intend that he and his fellow-worshippers, as representatives of the visible Church of the living God, should absorb all the mercy, all the blessing, and all the light of Jehovah’s countenance? Oh no! Having thus fervently prayed for evangelical blessings to descend upon himself, and every member of the Church, he immediately superadds, in the true evangelistic or missionary spirit, ‘That thy way,’ or, as it is given in our metrical version, ‘That so thy way may be known upon earth, thy saving health among all nations.’

How significant the connection here established between the obtainment and the distribution of evangelical favours! ‘God be merciful unto us, and bless us.’ — Why? only that we ourselves may be pardoned and sanctified, and thereby attain to true happiness? No. There is another grand end in view, to the accomplishment of which our being blessed is but a means. ‘God be merciful unto us, and bless us, that so thy way may be known on earth,’ — that so — that thus — that in this way — that by our instrumentality — that by our being blessed, and having the light of thy countenance shining upon us, — ‘thy way’ — thy way of justification through the atoning righteousness of the Redeemer, — thy way of sanctification by his Holy Spirit, — ‘may be made known on earth, and thy saving health among all nations.’</p></blockquote>

<blockquote><p>One of the sections of the Directory is given to the Singing of Psalms, and declares it “the duty of Christians to praise God publickly by singing of psalms together in the congregation, and also privately in the family”. This rubric manifestly implied the provision of a Psalm Book, and it was made part of the function of the Assembly in preparing a basis for uniformity of worship in the churches of the three kingdoms, to supply them with a common Psalm Book. The way was prepared for this by the submitment to the Assembly by the House of Commons on Nov. 20, 1643, of the query whether “it may not be useful and profitable to the Church that the Psalms set forth by Mr. Rouse be permitted to be publicly sung”.

The result of the Assembly’s examination of Mr. Rouse’s version (first printed in 1643) was to recommend it, after it had been subjected to a thorough revision at its own hands, to Parliament as a suitable Psalm-Book for the Church (autumn of 1645). The Commons accordingly ordered the book printed in this revised form (it appeared in 1646, i. e., Feb. 1647), and (April 15, 1646) issued an order establishing it as the sole Psalm Book to be used in the Churches of England and Wales, though the House of Lords never concurred in this order.

The Scotch Assembly subjected the book to a still furthermore searching revision, and by an act passed in 1649 (ratified by the Estates of Parliament in 1650) approved it in this new form for use in the Scottish Churches. It is in this Scottish revision alone (printed in 1650) in which they can only by courtesy continue to bear the name of Francis Rouse as their author, that these Psalms have passed into wide use.</p></blockquote>

ield%2C+The+Westminster+Assembly+and+its+Work+in+Princeton+Theological+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff26b6f2f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ff26b6f2f6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/23/b-b-warfield-on-the-formation-of-the-scottish-psalter/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4c63dc1cb8" data-kw="">
<blockquote><p>Then again, we have had an argument from Scripture, from the text, “Let the Word of Christ dwell in you richly, in all wisdom, teaching and admonishing one another in psalms and hymns and spiritual songs.” But first, let it be inquired how the Word of Christ – the Word of God – is to dwell in us richly by singing the word of man? That is a strange idea to extract from the writings of a well regulated intellect like that of Paul – not to speak of their being written under the inspiration of the Spirit.

I can understand how the Word of God should dwell in us richly by singing the Word of God – dwelling on it in solemn, meditative, grave, sweet singing of it, till – to use a Scotch phrase – it seeps into the soul and takes its dwelling there, while in warm emotion of faith the worshipper’s spirit in believing song dwells deliberately upon it. Thus it may come to dwell richly in us. But how is God’s Word to dwell in us by singing man’s word? How is the Divine Word to dwell in us by singing human hymns?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>

iv>
</figure><figure class="quote" id="q-f72725eb53" data-kw="">
<blockquote><p>First of all, then, on behalf of human hymns, it has been said, “We live now under a better and brighter dispensation than that of the Old Testament, therefore the inspired Psalms of David, and other Psalms in Holy Scripture, are insufficient.”

But the question is not whether the dispensation under which we now live is better and brighter than that which preceded it; but whether, under this better and brighter dispensation, there is any security for better and brighter hymns than the Psalms of David, and whether there is a promise given to any man, or any body of men, of a richer unction of the Spirit – and not a richer unction only, but a specifically inspiring action of the Spirit – for the purpose of composing hymns for the public worship of God in the Church than was given to him, of whom it is written, that in his blessed swan song he spoke as follows:– “David, the son of Jesse, said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet Psalmist of Israel, said, The Spirit of the Lord spoke by me, and His Word was in my tongue.” Is there any modern hymnologist in circumstances to say that? Dr. Adam must tell us who he is, before his argument from the greater brightness of the New Testament dispensation is of any worth, otherwise it is an argument not only on behalf of hymns, but against the Book of Psalms.

Further, we are told that “it would be strange if we were never to rise in this respect above the dispensation which had passed away.” Yes, no doubt, when the fulness of the times was come, the Church rose above the dispensation which then passed away. But the question is not whether we are to rise above the Old Testament dispensation, but whether we are, by the help of uninspired hymnologists, to rise above the Spirit and Word of God in the mouth of “David, the son of Jesse, the man who was raised up on high, the anointed of the God of Jacob, the sweet Psalmist of Israel.”

Is it modest to talk of rising above the height to which he who was “raised up on high” was raised? Still further, it has been said, “It would be strange if we were always to walk in the morning dawn, and never pass into the sunshine of the perfect day.” Sir, who can fail to admire the ingenuity which has discovered the resplendent fulness of noontide glory in uninspired songs, and nothing but twilight in the Psalms of David! Was it an uninspired modern hymnologist whose pen produced the following, or was it the Psalmist of Israel?

“Because of life the fountain pure Remains alone with thee, And in that purest light of thine We clearly light shall see.”

If the Psalms are but twilight, and human hymns the sunshine of the perfect day, then walk always in the perfect light … Sing nothing but human hymns, for that is perfect sunshine; and sing no Psalms of David, for that is going back to twilight. Excuse me, however, if I think that this argument of our friends is moonshine, and the logic of it is the logic of the twilight, and suited for those only who are of weaker vision. I say the Psalms are the full noonday light of Messianic glory, and the hymns are but the twilight – likely, if you trust to them, or put them on a level with the Word of God, to prove an evening and not a morning twilight, and you know the fatal difference there.</p></blockquote>

</figure><figure class="quote" id="q-1bdc43c173" data-kw="">
<blockquote><p>Why it is, that while two or three very small denominations of Christians use the Psalms of David exclusively, the remaining “ninety-nine hundredths” of the Christian Church exclude these divine songs from divine worship, and adopt in their stead mere human compositions.

The question then is, shall we use, in the instituted worship of God, the Psalms, and Hymns, and Spiritual songs of the Holy Ghost, usually called the Psalms of David, or shall we use human compositions? Or, in other words, shall we sing in the praise of God his songs, or ours? This is the main question or point; and what is the spontaneous response to this question from every Christian heart? Certainly it is, that we should sing the Lord’s songs.</p></blockquote>

</figure><figure class="quote" id="q-72a0683c47" data-kw="">
<blockquote><p>The question then is not, what shall the Presbyterian Church sing? No such thing; but the great question is, what ought the Catholic or Universal Church to sing? Or, as it is the duty of all men to praise God — “all lands” — “from the rising of the sun unto the going down of the same,” and that too in every age, and under every dispensation of grace — the question is, what ought the standard of praise for this mighty mass of immortal minds, in each and every revolving generation be?

Shall it be David’s Psalms, composed by the Divine Spirit — made, designed, adapted, and appointed by him to advance his praise: or shall every petty sect and fragment of the Church, in every passing generation, presume, without Divine permission, to make or select from human compositions, their own hymns, adapted to the diversified faith of the ever-changing multitude?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The question then is not, what shall the Presbyterian Church sing? No such thing; but the great question is, what ought the Catholic or Universal Church to sing? Or, as it is the duty of all men to praise God — “all lands” — “from the rising of the sun unto the going down of the same,” and that too in every age, and under every dispensation of grace — the question is, what ought the standard of praise for this mighty mass of immortal minds, in each and every revolving generation be?

Shall it be David’s Psalms, composed by the Divine Spirit — made, designed, adapted, and appointed by him to advance his praise: or shall every petty sect and fragment of the Church, in every passing generation, presume, without Divine permission, to make or select from human compositions, their own hymns, adapted to the diversified faith of the ever-changing multitude?”

<blockquote><p>It is good to sing psalms, especially if they are sung to the Lord and with reverence, but it is not good if the psalms are used without any reverence either at dinner parties with drinking or in the churches for profit. Likewise, an oath made under the name of God is good if it is done in a trial and reverently with the fear of the Lord. It is not good if it is done rashly and lightly.</p></blockquote>

</figure><figure class="quote" id="q-b63324ff26" data-kw="">
<blockquote><p>Had the Psalms been scattered throughout the books of the Old Testament, instead of being collected into one Book, then it might have been fairly inferred that the people of God were left to sing all the songs contained in the sacred writings— the songs of Moses, Deborah, Hannah, &amp;c., as well as those composed by David, Asaph, and others, and now found in the Psalter.

But infinite Wisdom in preparing a Psalm Book for His Church, thought proper to leave out the song of Moses at the Red Sea, of Deborah, of Hannah, and other songs, and who will say that it was a fault, and that God ought to have incorporated these songs with the “Sepher Tehillim,” or Book of Praises?

How can Mr. C. [Thomas Smyth] say, as he often does in substance, that the Church is as much hound to sing those Divine songs which have been left out of the Psalter, as those contained in it? If so, why were they left out? Their omission was surely not an oversight in the Deity. It was His will that they should be omitted, and no man can say with propriety that they should not, and that the Church was, and is still bound to employ them in Divine worship, notwithstanding their exclusion from that standard of praise which God himself has provided.

It may be the songs of Moses, Deborah, and others, not found in the Book of Psalms, were sung in the stated worship of God previous to the compilation of that Book, but after the compilation was made, and they were omitted, it was no longer proper to employ them in the regular instituted service of the Temple-—else where was the propriety of God’s “taking order” in selecting a system of Psalmody, if, after the selection was made, every one had a right to add to it what ever he thought proper, and even those very songs which Infinite Wisdom thought wise to omit?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter IV. Psalmody – Divine Authority in Evangelical Guardian</cite></span></figcaption>

</figure><figure class="quote" id="q-67ba3cedeb" data-kw="">
<blockquote><p>Singing of psalms must be used in thy family. The Lord Jesus and his family did practise this duty: Mat. xxvi. 30, ‘And when they sang a hymn, they went out into the Mount of Olives.’ David in that psalm, at the dedication of his house, speaketh that his glory should sing praise to God, and not be silent, Ps. xxx. title, ver. 4 and 12. Our tongues are called our glory, not only because by our speech we excel beasts, but chiefly because therewith we should glorify God. It is observable that most of those places which prophesy the Gentiles’ conversion, do mention their worshipping the true God by singing, Ps. cviii. 3, c., and lxiv. 4; Isa. liv. 1, and lii. 8.

The Holy Ghost when he commandeth that the word should keep house with us, doth also enjoin us to ‘teach and admonish one another in psalms, and hymns, and spiritual songs,’ (which are the titles of David’s psalms, and the known division of them, expressly answering to the Hebrew words, Shurim, Telhillim, and Mizinurim, by which his psalms are distinguished and entitled, as the learned observe,) ‘singing and making melody with grace in our hearts to the Lord,’ Col. iii. 16; Eph. v. 19; James v. 13. Basil speaks high in the praise of praising God by this holy exercise. Chrysostom speaketh of some in his time who always concluded their suppers with singing a psalm, and, saith he, they lived like angels.

This ordinance will much quicken holy affections, and help a Christian to serve God with more cheerfulness. When the Israelites were singing the 136th psalm at the bringing in the ark, the glory of the Lord filled the house, 2 Chron. xx. 22. The sweet singer in Israel was the man after God’s own heart.

Only, reader, be careful to sing David’s psalms with David’s spirit, and not like a nightingale to sing by rote: ‘I will sing with my spirit, and I will sing with the understanding also.’ Making melody with grace in the heart, is the best tune to set all David’s psalms with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 341-42.</span></figcaption>

</figure><figure class="quote" id="q-003412738b" data-kw="">
<blockquote><p>At evening when the due time of repairing to rest approaches, call together again all thy family; read a chapter in the same manner that was prescribed in the morning; then, in a holy imitation of our Lord and his disciples, sing a psalm: but in singing of psalms, either after supper, or at any other time, observe these rules:

Rules to be observed in Singing of Psalms.

1. Beware of singing divine psalms for an ordinary recreation, as do men of impure spirits, who sing holy psalms intermingled with profane ballads: They are God’s word: take them not in thy mouth in vain.

2. Remember to sing David’s psalms with David’s spirit (Matt. xxii. 43.)

3. Practise St. Paul’s rule — “I will sing with the spirit, but I will sing with the understanding also.” (1 Cor. xiv. 15.)

4. As you sing uncover your heads (1 Cor. xi. 4), and behave yourselves in comely reverence as in the sight of God, singing to God in God’s own words; but be sure that the matter make more melody in your hearts (Eph. v. 19; Col. iii. 16) than the music in your ear; for the singing with grace in our hearts is that which the Lord is delighted withal, according to that old verse:

Non vox, sed votum; non miisica chordula, sed cor:

Non clamans, sed amana, psallit in aure Dei.

‘Tis not the voice, but vow;

Sound heart, not sounding string;

True zeal, not outward show,

That in God’s ear doth ring.

5. Thou mayest, if thou thinkest good, sing all the psalms over in order, for all are most divine and comfortable; but if thou wilt choose some special psalms, as more fit for some times and purposes, and such as, by the oft usage, thy people may the easier commit to memory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 154-55.</span></figcaption>

</figure><figure class="quote" id="q-cb267f3fcf" data-kw="">
<blockquote><p>But Translations according to the import of the words and sense of the text, are as much the Word of God, as the Text in the original … Which follows, the Translation of the words in Meetre, if it have the full sense of the words, is as much the Word of God, as if it were translated in prose, or ordinary sentence for reading; for it is not the way or method, but the sense and meaning of the words, that is the Word of God. So that I may as well say when I sing in such a composition, it is as much the Word of God as when I read the same words in the Bible, only they are orderly disposed for that action. None must by this reason, pretend to know the Word of God in reading or expounding but he that knows the Hebrew, and Greek; and that must be also in the first perfect copy, immediately transcribed from inspired understandings …</p></blockquote>

</figure><figure class="quote" id="q-1a4990e9ac" data-kw="">
<blockquote><p>Also, “he is not willing that any should perish, but that all should come to repentance,” 2 Pet. iii. 9, even all those towards whom he exercises patience and long-suffering for that end; which, as the apostle there informs us, is ” to us-ward,”— that is, to believers, of whom he is speaking. Of them, also, it is said that he doth not afflict willingly nor grieve the children of men,” Lam. iii. 33, even his church, of which the prophet is speaking; although this also may be extended to all, God never afflicting or grieving men but it is for some other reason and cause than merely his own will, their destruction being of themselves.

David, indeed, tells us that “the Lord is gracious, and full of compassion; slow to anger, and of great mercy;” that “the Lord is good to all ; and his tender mercies are over all his works,” Ps. cxlv, 8, 9 : but he tells us withal whom he intends by the “all” in this place, even the “generations which praise his works and declare his mighty acts,” verse 4; those who “abundantly utter the memory of his great goodness, and sing of his righteousness,” verse 7; or his “saints,” as he expressly calls them, verse 10. The work he there mentions is the work of the kingdom of Christ over all, wherein the tender mercies of God are spread abroad in reference to them that do enjoy them. Not but that God is good to all, even to his whole creation, in the many unspeakable blessings of his providence, wherein he abounds towards them in all goodness, but that is not here intended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; Edinburgh: Banner of Truth, 1966), xii, 559-60.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>The whole Book of Psalms hath a peculiar respect unto Jesus Christ, either directly or in the person of David, who was his greatest personal type, next to Aaron and Melchizedeck [sic]; but there are some psalms that are altogether directly prophetical of him and of his offices,—namely, the 2d psalm is prophetical of his kingdom; the 16th psalm, of the work of his mediation and obedience to God therein; the 22d, of his priestly office, his sufferings, death, his resurrection, and intercession; the 40th, of his oblation and suffering; the 72d, of his kingly and prophetical power and glorious regard unto his people; the 68th, of his glorious exaltation; and this 45th psalm is a prophecy and description of his person, and his kingly office, and of the espousals of him and his church.</p></blockquote>

<blockquote><p>When in the latter part of Psalm 22 the Messiah joyfully gives a presentiment of the saving and super-abounding fruit, that, by His Sponsorial Merits and vicarious Passion, the people, given to Him by the Father to be redeemed to Himself, were going to carry off, which people were to be satisfied with the delights of the house of the Lord unto eternal life; the Messiah signifies that in the enjoyment of these spiritual benefits, to be communicated to a world brought unto a glory merited by Himself through sufferings, absolutely every distinction of peoples and nations is going to be removed; such that whatever families of the nations and those that were inhabiting the very ends of the earth were to be led to the gracious communion of God in Christ through the Spirit of faith and repentance, no less than those that were able to be named of Israel by right of birth; indeed, with the rejection of the latter having been appointed until an especially ἱκανoν/suitable time, the former are to be reputed as the Israel of God, verses 23-28.

But also, among all these nations, whichever ones might be in view, without distinction of condition, whether more sumptuous or slight, in the world, it is prophesied that they are to be made partakers of this grace, to be bequeathed in superlative abundance, verse 29: Indeed, this is not going to be the prerogative of one age or of a brief time, but through all ages succeeding one another unto the consummation of this world the seed of the Church is going to be roused, which is going to enlist under God and Christ as King, and rejoice in the privileges of the holy city, verse 30.</p></blockquote>

</figure><figure class="quote" id="q-992ebd07b1" data-kw="">
<blockquote><p>Of course there are many other arguments for the use of hymns, as, for instance, that the Psalms are unsuitable for New Testament worship, breathe a spirit of revenge, and so forth, which borders, we think, on blasphemy; or that, as we are at liberty to pray in our own words, so we must be at liberty to sing praise in our own words in answer to this is that our liberty depends altogether on God’s revealed will, not on what we may think reasonable and further, that men were at liberty to pray in Old Testament times in their own words, but were required to employ only authorized psalmody in praise; and there is no reason for change in the matter now, and no reason for supposing that men are able now to frame suitable ones of praise, when they were considered so unable then that God furnished them with songs from heaven. Besides when people sing a hymn, they are not singing in their own words, but in the words of the hymn-writer, or in the words of an ecclesiastically authorized hymn-book. And if congregations are to take words other than their own in any case, one would think they would be safer with God’s words than with man’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-a6e684dc8d" data-kw="">
<blockquote><p>But it can be proved by perfectly sufficient evidence that the terms “hymns” and “songs” are actually different names for the inspired Psalms, and must have been perfectly familiar as such to the Ephesians and Colossians. The terms “psalms, and hymns, and songs” are all employed as titles to different psalms in the inspired collection in the Septuagint translation of the Old Testament into the Greek language. Moreover, in Colossians iii. 16, the command to sing psalms and hymns and song is prefaced by the expression, “Let the word of Christ dwell in you richly;” and then there follow the participial clauses, “speaking to one another, and singing with grace,” as explanatory of the command about the word of Christ, and showing, we think, unmistakably that the psalms, hymns, and songs are all “the word of Christ,” or portions of his inspired psalmody. Besides, the word “spiritual” following all three terms, as it does in the Greek, may more rationally be regarded as qualifying all three than only the last one, and may without violence he translated “inspired.” The command would then be to sing the psalms, hymns, and songs given by the Spirit of God for that purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-410f54fa7e" data-kw="">
<blockquote><p>As for those psalms which contain DENUNCIATIONS of divine vengeance upon the enemies of God and his church, we are to consider, that these expressions were dictated by the infallible Spirit of God; that the objects of them were foreseen to be irreconcilable enemies of Christ and his church; that those who sing them, only applaud the equity of the doom which God hath justly pronounced upon such offenders; and that they are to be sung with a full persuasion of the event, as a certain, awful and just display of the glory and tremendous justice of JEHOVAH. Though we ought, therefore, never to apply them to particular parties or persons who have injured us, yet to decline using them, out of a pretence of charity, is to suppose ourselves wiser than him whose understanding is infinite, and more merciful than the Father of mercies, who is full of compassion, and delighteth in mercy. Moreover, as these external enemies, devoted to destruction, were in some sense emblematic of our spiritual enemies, within or without the passages may be sung with application to ourselves, as directed against these principalities and powers, and spiritual wickedness, in high places, with whom we have to wrestle, while on earth, Eph. vi. 10-19. I Pet. v. 8, 9, Rom. viii. 13, Gal. v. 17-24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David, in metre: allowed by the authority of the General Assembly of the Church of Scotland, and of the Presbyterian Churches in</cite>, America. With notes exhibiting the connexion, explaining the sense, and for directing and animating devotion (Pittsburgh, 1812), v-vi.</span></figcaption>

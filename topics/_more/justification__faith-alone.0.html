</figure><figure class="quote" id="q-cd266b799e" data-kw="">
<blockquote><p>…there be some things that the Law of Nature commands, as to move, eat, sleep; and here with leave I distinguish factum, ‘the common practice’ of men, from the jus, what men in conscience ‘ought’ to do; As concerning the former, moral and natural men’s practice is all resolved in their own carnal will and lusts; and so they eat, move and sleep because nature and carnal will leads them thereinto, not because God in the Law of nature (which I humbly conceive to be a part of the first elements and principles of the Moral Law, or Decalogue, and so a part of Scripture) does so warrant us to do; and therefore the moving, eating, drinking of natural Moralists, are materially lawful and conform to Scripture, for God by the Law of nature commands both heathen men and pure Moralists within the visible Church [nominal church members], to do natural acts of this kind, because the Lord has revealed that to be his will in the Book of Nature: But these heathen do these acts because they are suitable to their lusts and carnal will, and not because God has commanded them so to do in the Book of Nature; and this is their sin in the manner of doing though materially, et quod substantiam actus [and that according to the substance of the act], the action be good; and the same is the sin of natural men within the visible Church, and a greater sin, for God not only commands them in the Law of Nature, but also in Scripture to do all these natural acts, because God has revealed his will in these natural actions, as they are moral, to natural men within the visible Church, both in the Law of Nature and in the Scripture, and de jure they ought to obey because God so commands in bot; and in regard all within the visible Church are obliged to all natural actions in a spiritual way, though their eating, moving, sleeping be lawful materially, et quod substantiam actus; yet because they do them without any the least habitual reference to God, so commanding in Nature’s Law and Scripture, they are in the manner of doing, sinful;</p></blockquote>

</figure><figure class="quote" id="q-3f52c54f34" data-kw="">
<blockquote><p>The Papists, Socinians and Remonstrants all acknowledge faith to justify, but by it they mean obedience to God’s commandments, and so make it a work, and [do] not consider it as an instrument receiving Christ and his promise. A Papist, a Socinian, a Protestant says, ‘We are justified by faith,’ but dispositive [dispositionally, as an inherent disposition], says the Papist, conditionaliter [conditionally, as a condition only], says the Socinian, applicativè [applyingly], says the Protestant. Faith justifies not as a quality or habit [an inward abiding power] in us, as the Papists teach, Ipsa fides censetur esse justitia [faith itself is considered to be righteousness], for so it is a part of sanctification, but as it is the instrument and hand to receive Christ who is our righteousness, much less as it is an act, as Socinus and his followers teach, as though [Greek] ipsum credere [‘to believe itself’], did properly justify; if we should be justified by it as it is an act, then we should be justified by our works and we should be no longer justified actually then we do actually believe, and so there should be an intercision of justification so oft as there is an intermission of the act of faith; but justification is a continued act. … When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. … Objection: Faith is a work; therefore if we be justified by faith, then by works. Answer: With faith we must join the object of it, viz. Christ, Fides justificat non absolutè, sed relativè sc. cum objecto, non efficiendo sed afficiendo et applicando [‘Faith does not justify absolutely, but relatively, even with the object, not efficiently, but affectively and applyingly]. The Scripture says we are justified by faith, and through faith, but never for faith or because of our faith: per fidem, ex fide, non propter fidem. We can only be justified by that righteousness which is universal and complete; faith is a partial righteousness, Phil. 3:9, and as imperfect as other graces. … Only faith receives Christ and a promise. Faith justifies by the mere ordination of God, that on the receiving of Christ, or resting on Him we shall be justified. The proper act of faith which justifies is the relying on Christ for pardon of sin. To justify does not flow from any act of grace, because of the dignity and excellency of that act, but because of the peculiar nature, that it does receive and apply; therefore to receive Christ and to believe in Him is all one, and faith is always opposed to works. Bellarmine objects that to apply is a work or action. It is true, it is a grammatical action, but a predicamental passion [an Aristotelian category of disposition]. But says Bellarmine, ‘Love lays hold on Christ, and by love we are made one;’ but yet there is a difference: love makes us one with Christ extramittendo [sending out], faith intramittendo [bringing in], and besides love joins us to Christ after we are made one by faith, so that it cannot justify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’</cite>, pp. 528-29</span></figcaption>

</figure><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.”

<blockquote><p>The grace of God is manifested in the second covenant, in that he freely provideth and offereth to sinners a Mediator,[t] and life and salvation by him;[v] and requiring faith as the condition to interest them in him,[w] promiseth and giveth his Holy Spirit[x] to all his elect, to work in them that faith,[y] with all other saving graces;[z] and to enable them unto all holy obedience,[a] as the evidence of the truth of their faith[b] and thankfulness to God,[c] and as the way which he hath appointed them to salvation.[d] [t] Gen. 3:15. Isa. 42:6. John 6:27. [v] 1 John 5:11,12. [w] John 3:16. John 1:12. [x] Prov. 1:23. [y] 2 Cor. 4:13. [z] Gal. 5:22,23. [a] Ezek. 36:27. [b] James 2:18,22. [c] 2 Cor. 5:14,15. [d] Eph. 2:18.</p></blockquote>

<blockquote><p>How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).</p></blockquote>

</figure><figure class="quote" id="q-54f697d22b" data-kw="">
<blockquote><p>(1.) What we mean by a condition in the gospel-covenant. By a condition of the covenant, we do not mean in the strictest rigid sense of the word, such a restipulation to God from man of perfect obedience in his own person, at all times, so as the least failure therein forfeits all the mercies of the covenant; that is rather the condition of Adam’s covenant of works, than of the evangelical covenant: nor do we assert any meritorious condition, that in the nature of an impulsive cause shall bring man into the covenant and its privileges, or continue him in when brought in. This we renounce as well as you: but our question is about such a condition as is neither in the nature of an act perfect in every degree, nor meritorious in the least of the benefit conferred, nor yet done in our own strength. But plainly and briefly, our question is, Whether there be not something as an act required of us in point of duty, to a blessing consequent by virtue of a promise? Such a thing, whatever it be, hath the nature of a condition, inasmuch as it is antecedent to the benefit of the promise; and the mercy or benefit granted, is suspended until it be performed. The question is not, whether there be any intrinsical worth or value in the thing so required, to oblige the disposer to make or perform the grant or promise, but merely that it be antecedent to the enjoyment of the benefit; and that the disposer of the benefit do suspend the benefit until it be performed? Thus an act or duty of ours, which has nothing at all of merit in it, or answerable value to the benefit it relates to, may be in a proper sense a condition of the said benefit. ‘For what is a condition in the true notion of it, but (1) the suspension of a grant until something future be done?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-3722156804" data-kw="">
<blockquote><p>4. Therefore, if we look merely to the Law, the result must be despondency, confusion, and despair, seeing that by it we are all cursed and condemned, while we are kept far away from the blessedness which it holds forth to its observers. Is the Lord, then, you will ask, only sporting with us? Is it not the next thing to mockery, to hold out the hope of happiness, to invite and exhort us to it, to declare that it is set before us, while all the while the entrance to it is precluded and quite shut up? I answer, although the promises, insofar as they are conditional, depend on a perfect obedience of the Law, which is nowhere to be found, they have not, however, been given in vain. For when we have learned that the promises would be fruitless and unavailing, did not God accept us of his free goodness, without any view to our works, and when, having so learned, we, by faith, embrace the goodness thus offered in the gospel, the promises, with all their annexed conditions, are fully accomplished. For God, while bestowing all things upon us freely, crowns his goodness by not disdaining our imperfect obedience; forgiving its deficiencies, accepting it as if it were complete, and so bestowing upon us the full amount of what the Law has promised. But as this point will be more fully discussed in treating of justification by faith, we shall not follow it further at present.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. Therefore, if we look merely to the Law, the result must be despondency, confusion, and despair, seeing that by it we are all cursed and condemned, while we are kept far away from the blessedness which it holds forth to its observers. Is the Lord, then, you will ask, only sporting with us? Is it not the next thing to mockery, to hold out the hope of happiness, to invite and exhort us to it, to declare that it is set before us, while all the while the entrance to it is precluded and quite shut up? I answer, although the promises, insofar as they are conditional, depend on a perfect obedience of the Law, which is nowhere to be found, they have not, however, been given in vain. For when we have learned that the promises would be fruitless and unavailing, did not God accept us of his free goodness, without any view to our works, and when, having so learned, we, by faith, embrace the goodness thus offered in the gospel, the promises, with all their annexed conditions, are fully accomplished. For God, while bestowing all things upon us freely, crowns his goodness by not disdaining our imperfect obedience; forgiving its deficiencies, accepting it as if it were complete, and so bestowing upon us the full amount of what the Law has promised. But as this point will be more fully discussed in treating of justification by faith, we shall not follow it further at present.”

— John Calvin, Institutes of the Christian Religion trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174., vol. 1, bk. 2, ch. 7, sect. 4, p. 410">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Therefore%2C+if+we+look+merely+to+the+Law%2C+the+result+must+be+despondency%2C+confusion%2C+and+despair%2C+seeing+that+by+it+we+are+all+cursed+and+condemned%2C+while+we+are+kept+far+away+from+the+blessedness+which+it+holds+forth+to+its+observers.+Is+the+Lord%2C+then%2C+you+will+ask%2C+only+sporting+with+us%3F+Is+it+not+the+next+thing+to+mockery%2C+to+hold+out+the+hope+of+happiness%2C+to+invite+and+exhort+us+to+it%2C+to+declare+that+it+is+set+before+us%2C+while+all+the+while+the+entrance+to+it+is+precluded+and+quite+shut+up%3F+I+answer%2C+although+the+promises%2C+insofar+as+they+are+conditional%2C+depend+on+a+perfect+obedience+of+the+Law%2C+which+is+nowhere+to+be+found%2C+they+have+not%2C+however%2C+been+given+in+vain.+For+when+we+have+learned+that+the+promises+would+be+fruitless+and+unavailing%2C+did+not+God+accept+us+of+his+free+goodness%2C+without+any+view+to+our+works%2C+and+when%2C+having+so+learned%2C+we%2C+by+faith%2C+embrace+the+goodness+thus+offered+in+the+gospel%2C+the+promises%2C+with+all+their+annexed+conditions%2C+are+fully+accomplished.+For+God%2C+while+bestowing+all+things+upon+us+freely%2C+crowns+his+goodness+by+not+disdaining+our+imperfect+obedience%3B+forgiving+its+deficiencies%2C+accepting+it+as+if+it+were+complete%2C+and+so+bestowing+upon+us+the+full+amount+of+what+the+Law+has+promised.+But+as+this+point+will+be+more+fully+discussed+in+treating+of+justification+by+faith%2C+we+shall+not+follow+it+further+at+present.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion+trans.+Henry+Beveridge+%281559%3B+Edinburgh%3A+Calvin+Translation+Society%2C+1845%29+Note+Calvin+ </figure><figure class="quote" id="q-6ef0405c03" data-kw="">
<blockquote><p>From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174.</cite>, vol. 2, bk. 3, ch. 4, sect. 22, p. 212</span></figcaption>

</figure><figure class="quote" id="q-909814f5f4" data-kw="">
<blockquote><p>Therefore, the Gospel debars from the benefits of Christ all infidels, not only by a plain exclusion, but also by that condition of faith and repentance, under which, either expresly or tacitly, God promises to men the benefits of Christ, and which is never to be found in those that persevere in sin.</p></blockquote>

</figure><figure class="quote" id="q-e492c301ae" data-kw="">
<blockquote><p>[Papists:] The Lord says not [in Mt. 15:28; Mk. 7:29], ‘Thy daughter is saved by thy faith,’ as if it were by a means or instrument only of attaining that benefit, as you [Protestants] say, but [rather] for this saying as [it was] a meritorious cause. Answer: 1. Confession is taken for faith itself. 2. Faith is here taken in an objective sense, as it signifies Christ apprehended by faith, to whose only merit this benefit is to be ascribed: but by the means of faith; which God requires as an intermediate conditon on our part to this, that any benefit from his bountiful hand may be obtained, etc. [3] Unless that solution please better, which taking the name of ‘faith’ properly, says, that by that speech is not signified a cause, but a condition only, because all things are promised to him that believes; whence it is no wonder if when God gives any benefit to the faithful, He is said to give it for faith, which He necessarily requires in the receiver: Not that he deserves it by believing, but because God has promised it to none but to the believer; and that of mere grace in the Mediator Jesus Christ, in whom all the promises are yea and Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians, ch. 2, verse 8, p. 273 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3</cite>, p. 409</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-ca9e52e604" data-kw="">
<blockquote><p>Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, ch. 3, (3), proposition 2, p. 48</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.”

— Johannes Wollebius, Compendium of Christian Doctrine, pt. 1 in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 3, (3), proposition 2, p. 48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+the+divine+will+is+also+called+that+which+God+wants+done+%5Bvoluntas+signi%5D%2C+because+it+signifies+what+is+acceptable+to+god%3B+what+He+wants+done+by+us.+It+is+called+%E2%80%98consequent%E2%80%99+because+it+follows+that+eternal+antecedent%3B+%E2%80%98conditional%E2%80%99+because+the+commandments%2C+prohibitions%2C+warnings%2C+and+promises+of+God+all+have+a+condition+of+obedience+or+disobedience+attached+to+them.+Finally+it+is+called+%E2%80%98revealed%2C%E2%80%99+because+it+is+always+explained+in+the+word+of+God.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Doctrine%2C+pt.+1+in+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+ch.+3%2C+%283%29%2C+proposition+2%2C+p.+48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca9e52e604.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ca9e52e604.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=Thus%20the%20divine%20will%20is%20also,explained%20in%20the%20word%20of%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26c617e229" data-kw="">
<blockquote><p>VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice. VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, ch. 20, sect. 7–8, pp. 116-17 Latin: conditione</span></figcaption>

</figure><figure class="quote" id="q-84434082ab" data-kw="">
<blockquote><p>CXIII. Then, it seems somewhat uncertain when they [some Reformed theologians] distinguish between the act that predisposes one to justification and the act they say is formally justifying. According to the Reformed perspective, faith does not justify as a sort of form through which we are justified but rather as an instrument grasping Christ’s merit, as many say, or as a condition of the covenant of grace, which God counts as righteousness for Christ’s sake, as others prefer to say. These views, upon closer examination, converge to the same point. No one would say faith is a physical instrument of our justification; it can only intervene as a moral instrument. But faith can’t be a moral instrument of justification unless in the sense that God has promised forgiveness of sins to believers, which cannot be attained without the intervention of a living and effective faith. This is essentially the same as being a condition of the covenant of grace, wherein God offers grace and glory to believers and repentants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 165-66 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“CXIII. Then, it seems somewhat uncertain when they [some Reformed theologians] distinguish between the act that predisposes one to justification and the act they say is formally justifying. According to the Reformed perspective, faith does not justify as a sort of form through which we are justified but rather as an instrument grasping Christ’s merit, as many say, or as a condition of the covenant of grace, which God counts as righteousness for Christ’s sake, as others prefer to say. These views, upon closer examination, converge to the same point. No one would say faith is a physical instrument of our justification; it can only intervene as a moral instrument. But faith can’t be a moral instrument of justification unless in the sense that God has promised forgiveness of sins to believers, which cannot be attained without the intervention of a living and effective faith. This is essentially the same as being a condition of the covenant of grace, wherein God offers grace and glory to believers and repentants.”

— Louis Le Blanc, Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 165-66 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCXIII.+Then%2C+it+seems+somewhat+uncertain+when+they+%5Bsome+Reformed+theologians%5D+distinguish+between+the+act+that+predisposes+one+to+justification+and+the+act+they+say+is+formally+justifying.+According+to+the+Reformed+perspective%2C+faith+does+not+justify+as+a+sort+of+form+through+which+we+are+justified+but+rather+as+an+instrument+grasping+Christ%E2%80%99s+merit%2C+as+many+say%2C+or+as+a+condition+of+the+covenant+of+grace%2C+which+God+counts+as+righteousness+for+Christ%E2%80%99s+sake%2C+as+others+prefer+to+say.+These+views%2C+upon+closer+examination%2C+converge+to+the+same+point.+No+one+would+say+faith+is+a+physical+instrument+of+our+justification%3B+it+can+only+intervene+as+a+moral+instrument.+But+faith+can%E2%80%99t+be+a+moral+instrument+of+justification+unless+in+the+sense+that+God+has+promised+forgiveness+of+sins+to+believers%2C+which+cannot+be+attained+without+the+intervention+of+a+living+and+effective+faith.+This+is+essentially+the+same+as+being+a+condition+of+the+covenant+of+grace%2C+wherein+God+offers+grace+and+glory+to+believers+and+repentants.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+put+forth+at+Various+Times+at+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+AI+by+Colloquia+Scholastica+%281645%3B+London%3A+Moses+Pitt%2C+1683%29%2C+On+Justifying+Faith%2C+pt.+1%2C+pp.+165-66+Le+Blanc+%281614-1675%29+was+a+reformed+professor+of+theology+at+Sedan%2C+France.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84434082ab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/84434082ab.html">Permalink</a><a class="src" href="https://refor </figure><figure class="quote" id="q-42cdfa28cc" data-kw="">
<blockquote><p>And what greater discovery of good will could there be? 3. In the free offers that he makes of it to men. He has not only made way for it, by the obedience of his Son, who paid the price for our redemption, but published it in the Gospel, and tendered it to all that come within the sound of that proclamation: And there are two things that set forth his readiness to apply this forgiveness to sinners. 1. That He makes offer of, and invites sinners to accept it. He has ordered that man be told that He has forgiveness, and that they be bidden to come for it. He does not wait till miserable sinners cry to Him for it; which yet would be a rich favor, if so they might find it at his hands, but because they sought it not, nor ever would have done so, He sends them an embassy about it, Isa. 65:1-2; 2 Cor. 5:20. And would He do so, did He not delight in pardoning? 2. That He offers it freely. And if He did not do so, the sinner must forever go without it, for he had nothing to purchase it with. The gospel invitations come as freely as can be supposed, Isa. 55:1; Rev. 22:17. If it be here objected, You teach that there are gospel conditions on which it is only to be had; how then can it be said to be free? It may readily be replied: There are no other conditions required in the Gospel but what among men are required in order to receiving and being invested with the freest gift that can be: there is nothing but acceptance of this gift and acknowledgment of the kindness of the bestower; faith is the hand that receives it, whereas unbelief puts it away; and is it not meet that he who would have the benefit of a gift, do accept of it? or does such acceptance derogate from the grace of the Giver? and what is our obedience, but our thankfulness to God for so unspeakable a gift? and shall any say the gift was not free, because I was thankful for it? the sinner was worthy of death and deserved no pardon, and yet he may have it for receiving, and is not God willing?</p></blockquote>

</figure><figure class="quote" id="q-78696e7bc2" data-kw="">
<blockquote><p>That God ‘requires of sinners faith in Christ that they may be saved,’ admits of no dispute. The part assigned to faith, however, has been much controverted. Many excellent divines, in consequence of the distinction which they made between the covenant of redemption and the covenant of grace, were led to speak of faith as the condition of the latter covenant. But the term, as used by them, signifies not a meritorious or procuring cause, but simply something which goes before, and without which the other cannot be obtained. They consider faith merely as a condition of order or connection, as it has been styled, and as an instrument or means of obtaining an interest in the salvation offered in the gospel. This is very different from the meaning attached to the term by Arminians and Neonomians, who represent faith as a condition on the fulfilment of which the promise is suspended. The Westminster Assembly elsewhere affirm, that God requires of sinners faith in Christ, “as the condition to interest them in him.” But this is very different from affirming that faith is the condition of the covenant of grace. That faith is indispensably necessary as the instrument by which we are savingly interested in Christ, and personally instated in the covenant, is a most important truth, and this is all that is intended by the Westminster Divines. They seem to have used the term condition as synonymous with instrument; for, while in one place they speak of faith as the condition to interest sinners in the Mediator, in other places they affirm, that ‘faith is the alone instrument of justification,’ and teach, that ‘faith justifies a sinner in the sight of God, only as it is an instrument by which he receiveth and applieth Christ and his righteousness.’ As the word condition is ambiguous, apt to be misunderstood, and is frequently employed in an unsound and dangerous sense, it is now disused by evangelical divines.</p></blockquote>

<blockquote><p>V. Faith is the alone instrument of the sinner’s justification. That we are justified by faith is so frequently and expressly declared in the Scriptures, that no one who professes to receive the Word of God as the rule of his faith can venture to deny it. There are very different opinions, however, in regard to the office of faith in the justification of a sinner. Some say that a sinner is justified by faith, as it is an act performed by him; as if faith came in the room of perfect obedience, required by the law. This we have already disproved; and “it is well known,” says Witsius, “that the Reformed Churches condemned Arminius and his followers for saying that faith comes to be considered, in the matter of justification, as a work or act of ours.</p></blockquote>

</figure><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878)</cite>, pp. 438–39</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>10. In what sense can faith be called a condition of salvation? Faith is a condition sine qua non [without which: nothing] of salvation, i.e., no adult man can be saved if he does not believe, and every man that does believe shall be saved. It is, however, a gift of God and the first part or stage of salvation. Viewed on God’s side it is the beginning and index of his saving work in us. Viewed on our side it is our duty, and must be our own act. It is, therefore, as our act, the instrument of our union with Christ, and thus the necessary antecedent, though never the meritorious cause, of the gracious salvation which follows. Faith as the condition is of course living faith, which necessarily brings forth “confession” and obedience.</p></blockquote>

<blockquote><p>f. It is both conditional and unconditional. … In a sense it may be said that God Himself fulfills the condition in the elect. That which may be regarded as a condition in the covenant, is for those who are chosen unto everlasting life also a promise, and therefore a gift of God. Finally, the covenant is not conditional in the sense that the reception of every separate blessing of the covenant is dependent on a condition. We may say that faith is the conditio sine qua non [condition without which: nothing] of justification, but the reception of faith itself in regeneration is not dependent on any condition, but only on the operation of the grace of God in Christ.</p></blockquote>

<blockquote><p>10. Protestants, however, almost universally teach that we are justified by faith alone, and that not after the manner of a disposition (as the Romanists say) but after the manner of an instrument; that is, that justification is received, or as they themselves say, apprehended by no other thing than faith.</p></blockquote>

</figure><figure class="quote" id="q-e2e12b5328" data-kw="">
<blockquote><p>Faith is a necessary and lively instrument of justification, which is amongst the number of true causes, not being a cause without which the thing is not done, but a cause whereby it is done. The cause without which a thing is not done, is only present in the action, and does nothing therein: But as the eye is an active instrument for seeing, and the care for hearing, so is faith also for justifying. If it be demanded whose instrument it is? It is the instrument of the soul, wrought therein by the Holy Ghost, and is the free gift of God. In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation.</p></blockquote>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical. 37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense. 38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

<blockquote><p>…our orthodox divines do say that faith justifies as it’s an instrument, laying hold on Christ, so that Christ received by faith is properly that which justifies, not faith itself, or any dignity in it. This is the hand that receiveth the jewel, which does enrich us. This doctrine, though so generally received and avowed by all Protestant writers, yet of late is rejected among other reasons, because [it is said] there cannot be any passive instrument. Now I much wonder that Bellarmine, Becanus and other subtil Jesuits that turned every stone to overthrow faith’s instrumentality in justification, should so far forget their logic and metaphysics as not to pitch upon this objection above all, that there cannot be any such thing as a passive instrument. Truly I think, when a man of godly affections broaches an error, which he takes to be a truth, he himself is a passive instrument to bring others into errors. If we regard natural causes and moral, we may easily mention many passive instruments: In natural things the throat is a passive instrument of drinking. The Conduit-pipe of conveying water, and twenty such instances men may think of. In morality, taking that largely, there are many passive instruments: Nebuchadnezzar and all wicked men are God’s passive instruments. The Serpent by which the Devil deceived Eve, was a passive instrument: and to come nearer to our purpose, who can deny but that miraculous faith was a passive instrument in doing miracles, for the power of working miracles is infinite and could not be communicated to a creature no more than the creation of a world, only they by resting on God’s power, God wrought these wonderful things by them. But nothing does so fully represent this as the opinion of Aristotle and others following him, that intelligere is pati, and so videre, audire, are pati, ‘to understand is to receive,’ and so ‘to see’ and ‘hear;’ the soul does these by those faculties which are passive instruments therein; and therefore when Bellarmine would prove that credere and apprehendere were actions and works, it’s well answered that to believe or to lay hold on Christ (the Greek word applied often to faith is [Greek]. Though they be grammatical actions, yet they are naturally passions, as intelligere, videre are active verbs according to grammar, but naturally and physically are passions: So that a man in believing is passive, that is, he receives Christ for his righteousness: But of a passive instrument more hereafter. Justification is not in giving something to God but in receiving from Him; we do not curiously litigate about the word ‘instrument;’ by instrumentum we mean no more than medium, whereby the soul receives the Gospel-righteousness tendered unto it, and those peculiar expressions you heard the Scripture gives to faith, can evince no less. If therefore faith justify upon a peculiar reason, that that grace only has, viz. because it receives and applies Christ our righteousness, then other graces and holy works, having no such capacity, cannot justify. As the hand only, not the eyes or the feet, are the instrument that take alms given to a poor man. This consideration made that learned man Mr. [John] Ball, say how faith and works should be conjoined as con-causes in justification is impossible to conceive. Treatise of the Covenant of Grace, p. 70. And it’s a mere sophism to say that if by faith we receive Christ, and faith is the receiving of Christ, then we receive Christ by receiving; for its not the notion of faith that is properly the instrument receiving, but faith as the habit putting itself into act. So that the meaning is, faith acting or laying hold upon Christ, is the instrument receiving Him. Neither is this to give too much to faith, no more than in the faith of miracles, when Christ said to some, ‘Thy faith hath made thee whole,’ that thereby our Savior gave any dignity to faith, as if that were the cause of their health.</p></blockquote>

<blockquote><p>XIV. In addition, it is worth inquiring how faith influences justification, or how it stands in relation to justification: (1) it certainly does not influence it as its meritorious cause, either totally or partially, because Scripture not only testifies constantly that we are justified freely by the grace of God (Rom. 3:24; Eph. 2:8–9), but it also refers our justification to the righteousness of Christ as our only dikaioma on account of which we are justified (Rom. 3:25; Phil. 3:9). Nor (2) on account of our faith considered in any way as our righteousness which is admitted in the gospel by God by way of acceptilation, in place of full obedience to the law, because Scripture nowhere says that we are justified on account of faith, but only by faith, and in addition, it wholly refers that on account of which we are justified to Christ’s righteousness (Rom. 5:18; 3:25). Nor (3) by faith insofar as that speaks of and implies an obedience to the commands of Christ on account of which through the pure grace of God we are justified, because Scripture throughout contrasts faith and obedience or good works (Rom. 3:27–28; Eph. 2:8–9; Gal. 2:16). Perhaps (4) it justifies as an instrument by which we take hold of Christ. Protestants generally think in this way, and certainly truly, if only you take this with due distinction. And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, sect. 14, ‘How faith influences justification: How it does not influence’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“XIV. In addition, it is worth inquiring how faith influences justification, or how it stands in relation to justification: (1) it certainly does not influence it as its meritorious cause, either totally or partially, because Scripture not only testifies constantly that we are justified freely by the grace of God (Rom. 3:24; Eph. 2:8–9), but it also refers our justification to the righteousness of Christ as our only dikaioma on account of which we are justified (Rom. 3:25; Phil. 3:9). Nor (2) on account of our faith considered in any way as our righteousness which is admitted in the gospel by God by way of acceptilation, in place of full obedience to the law, because Scripture nowhere says that we are justified on account of faith, but only by faith, and in addition, it wholly refers that on account of which we are justified to Christ’s righteousness (Rom. 5:18; 3:25). Nor (3) by faith insofar as that speaks of and implies an obedience to the commands of Christ on account of which through the pure grace of God we are justified, because Scripture throughout contrasts faith and obedience or good works (Rom. 3:27–28; Eph. 2:8–9; Gal. 2:16). Perhaps (4) it justifies as an instrument by which we take hold of Christ. Protestants generally think in this way, and certainly truly, if only you take this with due distinction. And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.”

— Petrus van Mastricht, Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, sect. 14, ‘How faith influences justification: How it does not influence’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXIV.+In+addition%2C+it+is+worth+inquiring+how+faith+influences+justification%2C+or+how+it+stands+in+relation+to+justification%3A+%281%29+it+certainly+does+not+influence+it+as+its+meritorious+cause%2C+either+totally+or+partially%2C+because+Scripture+not+only+testifies+constantly+that+we+are+justified+freely+by+the+grace+of+God+%28Rom.+3%3A24%3B+Eph.+2%3A8%E2%80%939%29%2C+but+it+also+refers+our+justification+to+the+righteousness+of+Christ+as+our+only+dikaioma+on+account+of+which+we+are+justified+%28Rom.+3%3A25%3B+Phil.+3%3A9%29.+Nor+%282%29+on+account+of+our+faith+considered+in+any+way+as+our+righteousness+which+is+admitted+in+the+gospel+by+God+by+way+of+acceptilation%2C+in+place+of+full+obedience+to+the+law%2C+because+Scripture+nowhere+says+that+we+are+justified+on+account+of+faith%2C+but+only+by+faith%2C+and+in+addition%2C+it+wholly+refers+that+on+account+of+which+we+are+justified+to+Christ%E2%80%99s+righteousness+%28Rom.+5%3A18%3B+3%3A25%29.+Nor+%283%29+by+faith+insofar+as+that+speaks+of+and+implies+an+obedience+to+the+commands+of+Christ+on+account+of+which+through+the+pure+grace+of+God+we+are+justified%2C+because+Scripture+throughout+contrasts+faith+and+obedience+or+good+works+%28Rom.+3%3A27%E2%80%9328%3B+Eph.+2%3A8%E2%80%939%3B+Gal.+2%3A16%29.+Perhaps+%284%29+it+justifies+as+an+instrument+by+which+we+take+hold+of+Christ.+Protestants+generally+think+in+this+way%2C+and+certainly+truly%2C+if+only+you+take+this+with+due+distinction.+And+so+that+you+may+do+this%2C+we+must+distinguish+between+passive+and+active+justification.+In+passive+justification%2C+we+are+persuaded+that+we+are+justified+by+God%2C+or+from+it+we+conclude+that+we+are+justified+by+God.+In+this+way+it+certainly+can+be+said+that+we+are+justified+by+faith+as+an+instrument%2C+insofar+as+in+the+practical+syllogism%2C+by+means+of+which+we+conclude+that+we+are+infallibly+justified%2C+faith+stands+as+the+middle+term%3A+%E2%80%9CThe+one+who+believes+is+justified%3B+I+believe%3B+therefore%2C+I+am+justified.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%282nd+ed.+1698%3B+RHB%29%2C+vol.+5%2C+pt.+1%2C+bk.+6%2C+ch.+6%2C+%E2%80%98The+Justification+of+those+to+be+Redeemed%E2%80%99%2C+sect.+14%2C+%E2%80%98How+faith+influences+justification%3A+How+it+does+not+influence%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc84efdb233.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c84efdb233.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=XIV.%20In%20addition%2C%20it%20is%20worth,I%20believe%3B%20therefore%2C%20I%20am%20justified." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-c6059b169b" data-kw="">
<blockquote><p>After effectual calling follows justification, which consists in God’s imputation of the righteousness of Christ, who has already been apprehended by faith in effectual calling, to the sinner, just as if that righteousness were the sinner’s own… On the basis of these considerations, take note that faith has a twofold function: the first in effectual calling, when it accepts Christ with his righteousness as such is offered to man; the second in justification, when it accepts Christ with his righteousness as such is imputed to man. It should be noted, moreover, that when man is said to be justified through faith, the faith in question is that which has already played a role in effectual calling—a role, that is, in apprehending Christ and his righteousness as such is offered to man. But salvation is more appropriately attributed to that faith that apprehends the righteousness of Christ imputed to man in justification. “By grace you have been saved through faith” (Eph. 2.8).”… It may be asked: If in effectual calling Christ’s righteousness is apprehended through faith, then cannot someone be said to be justified already by that righteousness? I answer, no. For justification is the pronouncement of a sentence. But in effectual calling there is no pronouncement of a sentence. Therefore, one cannot be called justified as a result of effectual calling alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’ trans. Aaron Clay Denlinger &amp; Noah Phillips MAJT 27 (d. 1599; 2016)</cite>, p. 103</span></figcaption>

</figure><figure class="quote" id="q-c52c042edb" data-kw="">
<blockquote><p>Some would suppose our union to Christ, and consequently, by virtue of that, our justification by Christ, to be before actual faith, even in adult persons, and consequently without it; they insist upon a priority in nature and time, and build positions upon that distinction that will not hold… They who hold justification before faith are afraid lest they should be betrayed into a justification by works, if they should hold otherwise; and therefore choose rather to plead for a justification before faith, and without faith, lest they should seem to be justified by anything in and from themselves; but how contrary is this to Scripture, ‘He that believeth not, is condemned’? (Jn. 3:18) But he that believes not, is justified, is nowhere written in my Bible.</p></blockquote>

</figure><figure class="quote" id="q-62bc35a5e2" data-kw="">
<blockquote><p>VIII. Third, the object of the justifying action:… (2) men (1 Tim. 2:5), not just any, but: … (d) called to receive the Redeemer and the conditions of redemption (Rom. 8:30; 1 Pt. 2:9–10); (e) regenerated and made alive (Eph. 2:5), illuminated in mind (Eph. 1:17–19), renewed in heart or will (Ezek. 36:26), so that they are able to submit to calling, and receive the Redeemer offered to them, and the terms of redemption; (f) converted (Jer. 31:18–19), so that through the power received in regeneration, they by faith actually receive God and the Mediator (Phil. 3:12), and turn themselves from their sins to righteousness (Jer. 31:19); (g) united with Christ, so that they possess, in none other than Christ, a righteousness not their own, but Christ’s, that which is through faith (Phil. 3:9; 1 Cor. 1:30; Acts 4:12). From these things can at the same time be perceived the order and procedure of God whereby he is accustomed to provide the justification of the miserable sinner. IX… whereby he calls the elect to receive the Redeemer given to them (2 Tim. 1:9), whereby he grants faith to them, by means of which they receive him (Phil. 1:29) and are united with him (Phil. 3:9), the same grace, I say, whereby he reckons and pronounces them righteous in Christ.</p></blockquote>

e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/62bc35a5e2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=VIII.%20Third%2C%20the%20object%20of%20the,and%20pronounces%20them%20righteous%20in%20Christ." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-2afe7caaae" data-kw="">
<blockquote><p>As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>

<blockquote><p>1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.</p></blockquote>

<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith.</p></blockquote>

<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification [1] in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith. Also they who are not effectually called to the state of grace and to communion with Christ till they come to years of discretion, though they have the gift of faith immediately at the same time infused into them: yet Christ’s righteousness is in order of nature communicated to them, and they are made righteous by it before God, before they do actually believe, or can truly believe that Christ is made to them righteousness, or can by believing possess and enjoy his righteousness for justification. As a child may be born, or made an heir to lands, honor and riches, and may have a true right and interest in them, and be lord of all, before he has wit [understanding] to know his own estate, or discretion to possess actually and use them: so men may be justified by Christ’s righteousness made theirs, in the first instant of their regeneration and spiritual union with Christ, before they do actually believe, and sensibly possess and enjoy Christ and his obedience for justification. [2] But if we take justification in a secondary sense, as it is an act wherein the elect themselves do cooperate and work together with God, by receiving and applying to themselves particularly the gift of righteousness freely given unto them, and by possessing and enjoying it; then must actual believing go before it as the instrumental cause, by which God justifies them in their own sense and feeling, and upon which He does esteem and account them righteous in the intercourse between Him and them, and gives them his warrant to esteem themselves justified with Him. [3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. Of [1] the first [“most proper”] justification, the apostle speaks, Rom. 5:19, where he says that by the obedience of Christ many are made righteous, and Rom. 8:4 and 2 Cor. 5:21. Of [2] the second [of enjoying it] he speaks, Rom. 3:28, and 4:3, and Gal. 3:8, where he says we are justified by faith without works or deeds of the law. Of [3] the third [“in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, James 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life… (London: Badger, 1641)</cite>, pp. 79-82</span></figcaption>

l+union+with+Christ%2C+before+they+do+actually+believe%2C+and+sensibly+possess+and+enjoy+Christ+and+his+obedience+for+justification.+%5B2%5D+But+if+we+take+justification+in+a+secondary+sense%2C+as+it+is+an+act+wherein+the+elect+themselves+do+cooperate+and+work+together+with+God%2C+by+receiving+and+applying+to+themselves+particularly+the+gift+of+righteousness+freely+given+unto+them%2C+and+by+possessing+and+enjoying+it%3B+then+must+actual+believing+go+before+it+as+the+instrumental+cause%2C+by+which+God+justifies+them+in+their+own+sense+and+feeling%2C+and+upon+which+He+does+esteem+and+account+them+righteous+in+the+intercourse+between+Him+and+them%2C+and+gives+them+his+warrant+to+esteem+themselves+justified+with+Him.+%5B3%5D+But+if+we+take+justification+in+a+judiciary+sense%2C+as+it+is+used+in+courts+of+justice+and+judgment%2C+for+proving%2C+declaring%2C+and+pronouncing+men+righteous%3A+then+not+only+faith+and+actual+believing%2C+but+also+repentance%2C+amendment+of+life%2C+and+all+holy+Christian+duties%2C+and+good+works+of+piety%2C+mercy%2C+and+charity+must+necessarily+go+before+as+evidences%2C+testimonies%2C+and+proofs+by+which+men+must+be+justified%2C+that+is%2C+judged%2C+declared%2C+and+pronounced+righteous.+First%2C+in+the+court+of+their+own+conscience%2C+so+often+as+sin+and+Satan+stand+up+against+them+to+accuse+them.+Secondly%2C+in+the+common+judgment+of+men.+Thirdly%2C+in+the+general+judgment+at+the+last+day.+Of+%5B1%5D+the+first+%5B%E2%80%9Cmost+proper%E2%80%9D%5D+justification%2C+the+apostle+speaks%2C+Rom.+5%3A19%2C+where+he+says+that+by+the+obedience+of+Christ+many+are+made+righteous%2C+and+Rom.+8%3A4+and+2+Cor.+5%3A21.+Of+%5B2%5D+the+second+%5Bof+enjoying+it%5D+he+speaks%2C+Rom.+3%3A28%2C+and+4%3A3%2C+and+Gal.+3%3A8%2C+where+he+says+we+are+justified+by+faith+without+works+or+deeds+of+the+law.+Of+%5B3%5D+the+third+%5B%E2%80%9Cin+a+judiciary+sense%E2%80%9D%5D+Saint+James+speaks%2C+where+he+says+that+Abraham+was+justified+by+works%2C+James+2%3A21%3B+and+Job+13%3A18%2C+where+he+says%2C+%E2%80%9CBehold+now+I+have+ordered+my+cause%2C+I+know+that+I+shall+be+justified%E2%80%9D%3B+and+this+St.+Paul+calls+%E2%80%98justification+of+life%E2%80%99%2C+Rom.+5%3A18%2C+because+it+is+an+adjudging+of+men+to+eternal+life%2C+according+to+the+evidence+of+their+works%2C+as+our+Savior+shows%2C+Mt.+24%3A35.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+Key+of+Saving+Knowledge%2C+Opening+out+of+the+Holy+Scriptures+the+Right+Way+%26+Straight+Passage+to+Eternal+Life%E2%80%A6+%28London%3A+Badger%2C+1641%29%2C+pp.+79-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffcb71814de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fcb71814de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=Question%3A%20Can%20any%20man%20be%20justified,as%20our%20Savior%20shows%2C%20Mt.%2024%3A35." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<figure class="quote" id="q-bb28d063cd" data-kw="">
<blockquote><p>But these general truths may be added, concerning the Judicial Laws: 1. None can say that none of the Judicial Laws, concerning political constitutions, is to be observed in the New Testament: for then many special rules of natural and necessary equity would be rejected, which are contained in the Judicial Laws of God: Yea all the laws of equity in the world would be so cast; for none can be instanced, which may not be reduced to some of the Judicial Laws: And if any of them are to be observed, certainly these penal statutes so necessary for the preservation of policies, must be binding. … 3. Those Judicial Laws, which had either somewhat typical, or pedagogical, or peculiar to the then Judaical State, are indeed not binding to us under that formality; though even these doctrinally are very useful, in so far as in their general nature, or equity of proportion, they exhibit to us some documents of duty: but those penal judgments, which in the matter of them are appended to the Moral Law, and are in effect but accurate determinations and accommodations of the Law of Nature, which may suit our circumstances as well as the Jews, do oblige us as well as them. And such are these penal statutes I adduce; for, that blasphemy, murder and idolatry, are heinous crimes and that they are to be punished, the Law of Nature dictates; and how, and by whom, in several cases, they are to be punished, the Law judicial determines. Concerning the Moral Equity even of the strictest of them: [William] Ames, Of the Conscience, Book 5, ‘Of the Appended Precepts of Moses’. 4. Those Judicial Laws, which are but Positive in their form, yet if their special internal and proper reason and ground by Moral, which pertains to all nations, which is necessary and useful to mankind, which is rooted in and may be fortified by human reason, and as to the substance of them approven by the more intelligent heathens; those are Moral, and oblige all Christians as well as Jews: and such are these laws of punishing idolaters, etc. founded upon Moral grounds, pertaining to all nations necessary and useful to mankind, rooted in and fortified by human reason, to wit that the wrath of God may be averted, and that all may hear and fear and do no more so wickedly; especially this reason be superadded, when the case is such, that innocent and honest people cannot be preserved, if such wicked persons be not take order with.</p></blockquote>

</figure><figure class="quote" id="q-16ee5f6fb3" data-kw="">
<blockquote><p>9. The prime Positive Law of God is the Judicial Law, which God by the ministry of Moses, prescribed to the people of Israel, wherein the Lord was pleased to be the particular Lawgiver and Judge of that people, whom He had chosen from among all nations for a peculiar people to Himself, and to whose inclinations it is befitted. There are not a few who esteem the Judicial Law obliging unto all nations, mainly, because it does not appear in the Gospel, to be abolished as the Ceremonial Laws are, and because of its excellency beyond the laws of heathens, or other men, who might not only err in expediency, rendering their laws unprofitable, but also might make them unjust and inconsistent with the immutable moral Law of Nature; which reasons do sufficiently infer, that in the constitution of human laws, chief respect ought to be had to the Judicial Laws of God, and they assumed where the inclination of the people and their condition do not render them inconvenient. But that these laws were accommodat[ed] unto the Jews proper temper, is evident in the law concerning the bill of divorcement [Dt. 24:1-4], which bears, to be permitted for the hardness of their hearts; which was natural and peculiar to them, of jealousy and bitterness against their wives, therefore the Lord not only appointed trial, neither natural, necessary, nor accustomed elsewhere, by those tokens of virginity, for evidencing the wife’s unfaithfulness in not giving a polluted woman for a chaste [Dt. 22:14-20], but also the extraordinary and miraculous trial, by the water of jealousy [Num. 5:12-31], and therefore Christ did expressly abrogate that law [Mt. 5:31-32] and show us that Moses did not command to divorce, but for the hardness of their hearts only permitted it, and did command that when the husband would put away his wife, he should give her a bill of divorce, but it does not follow that the Judicial Law is in itself a Law to all nations, or that the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/viscount-of-stair-james-dalrymple.html">Viscount of Stair James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, vol. 1, p. 5</span></figcaption>

r+hearts+only+permitted+it%2C+and+did+command+that+when+the+husband+would+put+away+his+wife%2C+he+should+give+her+a+bill+of+divorce%2C+but+it+does+not+follow+that+the+Judicial+Law+is+in+itself+a+Law+to+all+nations%2C+or+that+the+Lord+purposed+it+so+to+her%2C+but+on+the+contrair%2C+it+appears+that+his+purpose+was+only+to+deliver+it%2C+for+a+peculiar+Law+to+Israel%2C+when+He+says%2C+%E2%80%98What+nation+is+so+great+that+has+statutes+and+judgments+so+righteous%2C+as+is+all+this+Law%2C+which+I+set+before+you+this+day%2C%E2%80%99+Dt.+4%3A8.+And+again+%E2%80%98He+shows+his+Word+unto+Jacob%2C+his+statutes+and+judgments+to+Israel%2C+He+has+not+dealt+so+with+every+nation%2C+and+as+for+his+Judgments%2C+they+have+not+known+them.%E2%80%99+Ps.+147%3A19+And+therefore+the+same+Law+was+not+to+Israelites+and+to+strangers%2C+even+to+proselytes%3B+as+appears+in+the+matter+of+usury+and+bondage%2C+which+were+allowed+to+strangers%2C+but+the+former+simply+forbidden%2C+and+the+latter+limited+as+to+Israelites%3A+Neither+is+there+any+necessity+of+an+express+abolition+of+this+Law+in+the+Gospel%2C+seeing+it+was+not+given+to+all+nations%3B+and+it+does+yet+bind+the+Jews+so+far+as+it+does+not+build+upon+the+Ceremonial+Law%3A+And+therefore+that+part+of+the+Judicial+Law%2C+which+is+founded+upon%2C+or+conducible+to+the+Moral+Law+may+be+well+received+by+other+nations%2C+to+whose+inclination+the+same+expediences+will+agree+as+most+of+the+criminal+laws+are%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Viscount+of+Stair+James+Dalrymple%2C+The+Institutions+of+the+Law+of+Scotland%2C+vol.+1%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16ee5f6fb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/16ee5f6fb3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=9.%20The%20prime%20Positive%20Law%20of,most%20of%20the%20criminal%20laws%20are&amp;text=9.%20The%20prime%20Positive%20Law%20of%20God%20is&amp;text=agree%20as%20most%20of%20the%20criminal%20laws%20are" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f8c05f3f4" data-kw="">
<blockquote><p>For besides the moral precepts (in which all mankind are concerned) we have an account of the laws of the Israelites by which they were to be governed in their own land: And though it be true, that these judicial laws were given to the Hebrews, and that they were concerned in them, and that other nations must be governed by the laws of their several countries, yet, certain it is, that the justice and the equity, on which these laws are founded, and which they recommend, are worthy the consideration and imitation too of other nations. And if inquisitive persons think it worth their while to look into the laws of Sparta, and Athens, of Rome and other kingdoms and commonwealths, certainly they must judge the laws of Moses, which came from God Himself, are well worthy their looking into, and their serious consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-kidder.html">Richard Kidder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Five Books of Moses</cite>, vol. 1, p. 272</span></figcaption>

<blockquote><p>In short, our Reformers [of the Scottish Church, specifically John Knox, c. 1560] maintained: That the doctrine of defensive arms was necessary: that passive obedience or non-resistance was sinful when people had means for resistance (Knox, History, pp. 389, 396, Append. p. 25, 107, Passim.) That Daniel and his fellows did not resist by the sword because God had not given them the power and the means (Ibid., p. 317) That the primitive Christians assisted their preachers, even against the rulers and magistrates, and suppressed idolatry wheresoever God gave them force (Ibid., p. 393). (d) They maintained that the Judicial Laws of Moses (though not adopted into the Christian system) in many considerable instances continued still obligatory; particularly that the laws punishing adultery, murder, idolatry with death, were binding; that in obedience to these laws, that sentence was to be executed not only on subjects, but on sovereigns (Ibid., pp. 391-393; Passim.) That whosoever executes God’s Law, on such criminals, is not only innocent, but in his duty…</p></blockquote>

</figure><figure class="quote" id="q-9b6f2c952e" data-kw="">
<blockquote><p>With respect to the particular laws by which the Jews were governed, the common sentiment of sound divines, and the best writers on the laws of nations, is, that although the judicial law is not binding as such upon Christian nations, so that they should be bound to regulate all their laws according unto it, yet it demands distinguished attention, and is to be regarded, as a pattern, in those laws which proceeded upon moral grounds. In it there was nothing inconsistent with the principles of equity and religion. God give unto Israel ‘right judgments and true laws, good statutes and commandments.’ All just laws among men are deductions from the moral law, applied to human affairs. But in the judicial law, the conclusions were deduced and applied, not by the fallible and corrupt reason of man (as in ordinary laws) but by unerring wisdom. These respected either the first or second table of the moral law, duties which immediately related to God or man. It is a radical mistake, on this subject, to suppose that the peculiarity of the judicial law did lie solely and properly in its reference to matters of religion, or the first table. It is to be observed also in those laws which related to things civil, or the duties of the second table. There is no more propriety in representing all the judicial laws respecting the first table as peculiar, than there is in representing all those which related to the second table as peculiar. Peculiarities there were in both; but after allowances are made for these, there remain moral grounds for both; and whatever proceeded upon moral grounds in the judicial law, whether it respected things immediately connected with religion, or with justice and civil order, is exemplary, and must be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Difference</cite>, (Edinburgh: George Caw, 1807), pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>

<blockquote><p>10th Question: Is the profession of faith and promise—that is, this sacred covenant—required to be confirmed by solemn oath and subscription? Response: Conclusion: This is not simply, nor everywhere or always, necessary; nor does apostolic practice teach this. For it could ordinarily suffice if that solemn promise is made in the presence of the whole Church, or before a synod with many witnesses. Especially when it pertains to matters of God, before his eyes and in his house, namely the Church. An oath is the end of all contradiction, introduced because of human wickedness. Because we must greatly distance ourselves from the evil practice of Papal clerics, who too rashly confirm their causes with dire oaths, curses, and the pledging of souls. Because it is proper for the faithful to be earnest, sincere, and simple, like sheep and doves. Therefore, care must be taken that this abundant caution does not, in some way, seem to cast doubt on their proper fourth way. Conclusion: Nevertheless, it is not illicit to take extra caution, whether for adversaries, or for extraordinary wickedness, frauds and deceptions of men, or for any other just cause. Because, in the renewal and restatement of the sacred covenant, such was done (see 2 Chron. 15:12-15; Neh. 9:38 and 10:1). Therefore, why could this not be done in some case at the first institution of the covenant? Because an oath may be declaratory and promissory in the matter of confession, profession of faith, and embracing the Church and its cause, as Paul’s example teaches (see 2 Cor. 1:23; Rom. 9:1). This, combined with the example of God’s people (see 2 Chron. 15; Neh. 9-10), was imitated by the king and nobility in Scotland in 1581, and by the French Church in the National Synod of Alès in 1619, where they received and confirmed the doctrine of the National Synod of Dordrecht against today’s Pelagians. Furthermore, in Scotland in 1638 and recently in 1643, the nobility, ministers, and people in Scotland and England were united in a solemn confederation. Here, compare what has been said elsewhere about the pledging of souls for their doctrine and cause, and about oaths in public form or church confessions. Part 3, Selected Dissertation on the Oath of Religion. Because not only are oral declarations before the whole Church required, but also subscriptions by the ordinary ministers, elders, and deacons among us are not without reason expected… …it would not be absurd or illicit if, in some case, and for the reasons previously mentioned, a subscription from the members of the Church were required. 4. Because oaths and subscriptions hold a significant place in any confederations and assemblies, and why not in sacred and ecclesiastical matters, if necessity demands it. Conclusion: We reject here oaths of obedience to the Pope, those concerning the Council of Trent; also, the abjurations of reformed doctrine and Church; furthermore, inquisitorial oaths and those arising ex officio [“from duty” unto self-incrimination]. In brief, all oaths and all sacred subscriptions that are not made in injustice, but in truth and judgment.</p></blockquote>

</figure><figure class="quote" id="q-640fec49e5" data-kw="">
<blockquote><p>If any say that I derogate much from the authority of the Church when I do nothing which she prescribes except I see it lawful and expedient, because I should do this much for the exhortation and admonition of a brother. Answer: 1. I give far more reverence to the direction of the Church than to the admonition of a brother, because that is ministerial, this fraternal: that comes from authority, this only from charity: that is public, this private: that is given by many, this by one: And finally, the Church has a calling to direct me in some things wherein a brother has not. 2. If it be still instanced that in the point of obedience, I do no more for the Church than for any brother because I am bound to do that which is made evident to be lawful and expedient, though a private Christian do but exhort me to it, or, whether I be exhorted to it or not. For answer to this I say that I will obey the directions of the Church in many things rather than the directions of a brother; for in two things which are in themselves indifferent, and none of them inexpedient, I will do that which the Church requires, though my brother should exhort me to the contrary. But always I hold me at this sure ground, that I am never bound in conscience to obey the ordinances of the Church except they be evidently lawful and expedient. This is that, sine quo non obligant [without which they do not bind], and also that which does chiefly bind, though it be not the only thing which binds. Now for making the matter more plain we must consider that the constitutions of the Church are either lawful or unlawful: if unlawful, they bind not at all: if lawful, they are either concerning things necessary as Acts 15:28, and then the necessity of the things do bind, whether the Church ordain them or not; or else concerning things indifferent, as when: the Church ordains that in great towns there shall be sermon on such a day of the week and public prayers every day at such an hour, here it is not the bare authority of the Church that binds, without respect to the lawfulness or expediency of the thing itself which is ordained (else we were bound to do everything which the Church ordains, were it never so unlawful, for quod competit alicui qua tali, competit omni tali. We behold the authority of the Church making laws, as well in unlawful ordinances as in lawful, not yet is it the lawfulness or expediency of the thing itself without respect to the ordinance of the Church (for possibly other times and diets were as lawful and expedient too for such exercises, as those ordained by the Church), but it is the authority of the Church prescribing a thing lawful or expedient. In such a case then neither does the authority of the Church bind except the thing be lawful and expedient, not does the lawfulness and expediency of the thing bind except the Church ordain it, but both these jointly do bind.</p></blockquote>

<blockquote><p>The improper binder [of the conscience] is that which has no power or virtue in itself to bind conscience: but does it only by virtue of God’s Word or of some part of it. It is threefold: human laws, an oath, a promise.</p></blockquote>

<blockquote><p>But to make it yet more and plentifully appear how miserably our opposites would enthrall our consciences, I will here show: 1. What the binding of the conscience is, 2. How the laws of the Church may be said to bind [and how not]. 3. What is the judgment of Formalists touching the binding power of ecclesiastical laws.</p></blockquote>

</figure><figure class="quote" id="q-20d2ebcab3" data-kw="">
<blockquote><p>For 1. The very ground and reason wherefore we ought to obey the magistrate, is, for that he is the minister of God, or a deputy set in God’s stead to us. Now, he is the minister of God only for our good, Rom. 13:4. Neither were he God’s minister, but his owne master, if he should rule at his pleasure and command things which serve not for the good of the subjects. Since therefore the commandments of princes bind only so far as they are the ministers of God for our good: and God’s ministers they are not, in commanding such things as are either in their nature unlawful, or in their use inconvenient: it follows that such commandments of theirs cannot bind. (Pareus, on Rom. 13:4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637) | 3rd Part, pp. 134-138, 142 &amp; 155-57 of ch. 8, ‘That the Lawfulness of the Ceremonies cannot be Warranted by any Ordinance of the Civil Magistrate…’ This is the best., p. 134</span></figcaption>

iv>
</figure><figure class="quote" id="q-4b80df7169" data-kw="">
<blockquote><p>But still I ask, are we absolutely and always bound to obey magistrates? Nay, but only when they command such things as are according to the rules of the Word, so that either they must be obeyed, or the Law of Charity shall be broken: in this case, and no other, we are bidden obey.</p></blockquote>

<blockquote><p>The conclusion is clear from what is said before, because all civil laws, as merely positive, in the case of non-contempt, do not oblige, and in the case of non-scandal…</p></blockquote>

</figure><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.”

bedience.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+Cases+of+Conscience+Practically+Resolved+Containing+a+Decision+of+the+Principal+Cases+of+Conscience+of+Daily+Concernment+%26+Continual+Use+Amongst+Men%3A+Very+Necessary+for+their+Information+%26+Direction+in+These+Evil+Times%2C+3rd+Decade%2C+Case+6%2C+%E2%80%98Whether+the+Laws+of+Men+do+Bind+the+Conscience%2C+%26+How+Far+we+are+Tied+to+Their+Obedience%3F%E2%80%99+in+Cases+of+Conscience+Practically+Resolved+Containing+a+Decision+of+the+Principal+Cases+of+Conscience+of+Daily+Concernment+%26+Continual+Use+Amongst+Men%3A+Very+Necessary+for+their+Information+%26+Direction+in+These+Evil+Times+%28London%2C+1654%29%2C+pp.+211-13%2C+218-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd118d349d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d118d349d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=Thus%20human%20laws%20cannot%20bind%20the,frees%20us%20from%20a%20sinful%20disobedience&amp;text=Thus%20human%20laws%20cannot%20bind%20the%20conscience%3A%20It&amp;text=the%20penalty%20frees%20us%20from%20a%20sinful%20disobedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…so neither is the prince to be obeyed, using his authority against God, in commanding impious and unhonest things: we must give unto Caesar the things that are Caesar’s and unto God the things which are God’s, we may not give unto the prince the things which are God’s, that is, the conscience. And in this case the apostles give us a rule, to obey God rather than man, Acts 4:19, when obedience then is denied in unjust and unlawful things, not the authority which is God’s ordinance, but the abuse of the authority is gainsaid.</p></blockquote>

</figure><figure class="quote" id="q-43d9e0e19c" data-kw="">
<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans</cite>, (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</span></figcaption>

</figure><figure class="quote" id="q-d217a63508" data-kw="">
<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/paul-bayne.html">Paul Bayne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness, or a Brief &amp; Learned Exposition of the Main &amp; Fundamental Points of Christian Religion</cite>, (London, 1618), pt. 1, question 3, p. 24</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.”

<blockquote><p>And as touching the binding power of their [magistrates’] laws, be they never so just, they cannot bind you any other way, nor [except] in respect of the general end of them: For per se they cannot bind more than the Churches’ laws can. Which things Dr. Forbes also has told you out of Calvin [Irenicum, bk. 2, ch. 4, §3]. And hence it follows, that whensoever you may omit that which princes enjoin, without violating the law of charity, you are not holden to obey them, [even] for the majesty of princely authority. … whatsoever princes can commendably either do by themselves, or command to be done by others in such matters as anyway pertain to the external worship of God, must be both lawful in the nature of it, and expedient in the use of it, which conditions if they be wanting [lacking], their commandments cannot bind to obedience. … 3. We are bound by the Law of God to do nothing which is not good and profitable or edifying, 1 Cor. 6:12 &amp; 14:26. This Law of Charity is of a higher and straighter bound than the Law of any prince in the world… Therefore it is most necessary as well for princes to permit, as for subjects to take liberty to try and examine by the judgement of discretion, everything which authority enjoins whether it be agreeable or repugnant to the rules of the Word, and if after trial it be found repugnant to abstain from the doing of the same.</p></blockquote>

</figure><figure class="quote" id="q-e46b470ae9" data-kw="">
<blockquote><p>He that commandeth not what God commandeth, and punisheth and killeth where God, if personally and immediately present, would neither command nor punish, is not in these acts to be subjected unto, and obeyed as a superior power, though in habit he may remain a superior power; for all habitual, all actual superiority is a formal participation of the power of the Most High.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh, 1843), | Question 29, Whether in the Case of Defensive War, the Distinction of the Person of the King, as a Man, who can commit acts of hostile Tyranny against his Subject, and of the Office and Royal Power that He has from God and the People, as a King, Can Have Place?</span></figcaption>

</figure><figure class="quote" id="q-82acf8b81b" data-kw="">
<blockquote><p>Christ has not made pastors under-kings to create any laws morally obliging the conscience to obedience in the court of God, which God has not made to their hand; if the king and synods only declare and propound, by a power of jurisdiction, that which God in the Law of Nature or the written Word has commanded; they are not the Law-makers, nor creators of that morality in the Law, which lays bonds on the conscience; yea, they have no organical, nor inferior influence in creating that morality, God only by an immediate act as the only immediate king, made the morality, and if king, parliaments and synods be under kings and under Law-givers, they must have an under-action, and a ministerial, subservient, active influence under Christ in creating as second causes, that which is the formal reason, and essence of all laws binding the conscience, and that is the morality that obliges the soul to eternal wrath, though king, parliament, pastors or synods should never command such a moral thing: Now to propound, or declare, that God’s will is to be done in such an act, or synodical directory or canon, and to command it to be observed under civil and ecclesiastical pain, is not to make a law, it is indeed to act authoritatively under Christ as King: but it makes them neither kings, nor Law-givers, no more than heralds are little kings, or inferior law-givers, and parliaments, because in the name and authority of king and parliament they promulgate the laws of king and parliament: The heralds are mere servants, and do indeed represent king and parliament, and therefore to wrong them, in the promulgation of laws, is to wrong king and parliament; but the heralds had no action, no hand at all in making the laws; they may be made when all the heralds are sleeping, and so by no propriety of speech can heralds be called mediate kings, under-Lawgivers, just so here, as touching the morality of all human laws, whether civil or ecclesiastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ has not made pastors under-kings to create any laws morally obliging the conscience to obedience in the court of God, which God has not made to their hand; if the king and synods only declare and propound, by a power of jurisdiction, that which God in the Law of Nature or the written Word has commanded; they are not the Law-makers, nor creators of that morality in the Law, which lays bonds on the conscience; yea, they have no organical, nor inferior influence in creating that morality, God only by an immediate act as the only immediate king, made the morality, and if king, parliaments and synods be under kings and under Law-givers, they must have an under-action, and a ministerial, subservient, active influence under Christ in creating as second causes, that which is the formal reason, and essence of all laws binding the conscience, and that is the morality that obliges the soul to eternal wrath, though king, parliament, pastors or synods should never command such a moral thing: Now to propound, or declare, that God’s will is to be done in such an act, or synodical directory or canon, and to command it to be observed under civil and ecclesiastical pain, is not to make a law, it is indeed to act authoritatively under Christ as King: but it makes them neither kings, nor Law-givers, no more than heralds are little kings, or inferior law-givers, and parliaments, because in the name and authority of king and parliament they promulgate the laws of king and parliament: The heralds are mere servants, and do indeed represent king and parliament, and therefore to wrong them, in the promulgation of laws, is to wrong king and parliament; but the heralds had no action, no hand at all in making the laws; they may be made when all the heralds are sleeping, and so by no propriety of speech can heralds be called mediate kings, under-Lawgivers, just so here, as touching the morality of all human laws, whether civil or ecclesiastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.”

hen+all+the+heralds+are+sleeping%2C+and+so+by+no+propriety+of+speech+can+heralds+be+called+mediate+kings%2C+under-Lawgivers%2C+just+so+here%2C+as+touching+the+morality+of+all+human+laws%2C+whether+civil+or+ecclesiastical%2C+God+Himself+immediately%2C+yea%2C+from+eternity+by+an+act+of+his+free-pleasure+made+that+without+advice+of+men+or+angels%3B+for+who+instructed+Him%3F+Neither+Moses%2C+nor+prophet%2C+nor+apostle%3B+yea%2C+all+here+are+meri+precones%2C+only+heralds%3B+Yet+are+not+all+these+heralds%2C+who+declare+the+morality+of+laws%2C+%5Bfor%5D+equals+may+declare+them+charitative%5Bly%5D%2C+by+way+of+charity+to+equals%3B+but+these+only+are+to+be+obeyed+as+heralds+of+laws%2C+whom+God+has+placed+in+authority%2C+as+kings%2C+parliaments%2C+synods%2C+the+Church%2C+masters%2C+fathers%2C+captains%3B+And+it+follows+no+ways+that+we+disclaim+the+authority+of+all+these+because+we+will+not+enthrone+them+in+the+chair+of+the+Supreme+and+only+Lawgiver%2C+and+head+of+the+Church%3B+they+are+not+under-Law-givers+and+little+kings+to+create+laws%2C+the+morality+of+which+binds+the+conscience+%28for+this+God+only+can+do%29%3B+therefore%2C+there+be+no+parliaments%2C+no+kings%2C+no+rulers+that+have+authority+over+men%2C+it+is+a+most+unjust+consequence%3B+for+all+our+divines%2C+against+Papists%2C+deny+that+human+laws%2C+as+human%2C+do+bind+the+conscience%3B+but+they+deny+not%2C+but+assert+the+power+of+jurisdiction+in+kings%2C+parliaments%2C+synods%2C+pastors.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F82acf8b81b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/82acf8b81b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=Christ%20has%20not%20made%20pastors%20under%2Dkings,jurisdiction%20in%20kings%2C%20parliaments%2C%20synods </figure><figure class="quote" id="q-f6b15e6750" data-kw="">
<blockquote><p>Whereas some teach, that when we doubt of the lawfulness of the thing enjoined, and are certain that obedience to authority is a duty, we must do the thing; We conceive that we cannot be certain of our obligation to obey in a case wherein we are not sure of the lawfulness of the thing commanded, because we are sure we must not obey the magistrate’s command in things unlawful, and our ignorance or error cannot alter our obligation to God’s Law. Here is therefore an uncertainty on either side, and perhaps the danger may be greater on the side of obeying than refusing. For possibly the injunction of a heinous sin may be the matter of the uncertainty, and in this staight we apprehend it more unsafe and less excusable to choose the greater before the lesser sin, though indeed it be lawful to choose neither.</p></blockquote>

</figure><figure class="quote" id="q-8a6261ad06" data-kw="">
<blockquote><p>The Church’s power is one and the same in things indifferent and necessary in matters of doctrine, discipline, and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial, and determined to what is good, expedient, and convenient.</p></blockquote>

<blockquote><p>9. It seems to threaten a snare when inquiry about the duty of the time is pursued without respect to the present case and circumstances thereof. For thus a snare may wait in a thing at other times indifferent, the neglect whereof under some special circumstances may be a quitting their duty; and the doing also, or yielding to something in another case warrantable, at sometimes may fall under a moral prohibition. As this, when a thing in itself indifferent, circa sacra et cultum Dei [around sacred things and the worship of God], is pressed by the magistrate as necessary by virtue of his sole command, and to the subjecting the godly in things wherein they are not subject, and to the prejudice of an other jurisdiction; can there be an inquiry about this in the general, without a particular application to the complex case? It may be said a snare is then on the entry when that consideration of the prophet is not much regarded in the present question, ‘Is this a time for such a thing?’ For the disciples to refresh themselves with sleep was a piece of innocent duty; but that they could not watch this one hour with their Master in his sufferings, must needs vary the case, for it was in so far a deserting Him.</p></blockquote>

</figure><figure class="quote" id="q-c42b46fc70" data-kw="">
<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.”

<blockquote><p>3. The goodness or badness of a human action may be considered two ways, viz. either in actu signato [in the signified act] and quo ad speciem [as to the species], or in actu exercito [in the exercised act] and quo ad individuum [as to the individual thing]. For an action is said to be specificated by its object and individuated by its circumstances. So that when an action is good or evill in respect of the object of it, then it is called good or evil quo ad speciem. When it is good or evil in respect of the circumstances of it, then it is said to be good or evil quo ad individuum. … 6. Every thing which is indifferent in the nature of it is not by-and-by indifferent in the use of it. But the use of a thing-indifferent ought evermore to be either choosed or refused, followed or forsaken, according to these three rules delivered to us in God’s Word: 1. the rule of piety, 2. the rule of charity, 3. the rule of purity. … We may not for the commandment of men transgress the rule of piety by doing any thing which is not for God’s glory and ordered according to his will; neither ought any of us to obey men except for the Lord’s sake and as the servants of Christ, doing the will of God, which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ and as if Christ commanded it]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity, but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly, may we obey men so as to break the law of purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information… … 2. As for those actions which proceed from the deliberation of reason, howbeit many of them be indifferent quo ad speciem, yet none of them is, nor can be indifferent quo ad individuum. The reason of this difference and distinction is because every action has its species or kind from the object; and a human moral action has its species or kind from the object referred to the original of human actions, which is reason. Whereupon it comes that if the object of the action include something that agrees to the order of reason, it shall be a good action according to it’s kind: for example, to give alms to an indigent man. But if it include something that is repugnant to the order of reason, it shall be an evil action according to its kind, as to steal or take away another man’s goods. Now sometimes it happens that the object of an action does not include something that belongs to the order of reason, as to lift a straw from the ground, to go to the field etc. such actions are indifferent, according to their kind. But we must pronounce far otherwise of them, when we speak of them quo ad individuum, because as they are individuated by their circumstances, so in their individual being they have their goodness or badness from the same circumstances, as has been showed. So that no such action as is deliberated upon can be indifferent quo ad individuum; because oportet [it is needful] says Thomas, quod quilibet individualis actus habeat aliquam circumstantiam, per quam trahetur ad bonum, vel malum, ad minus ex parte intentionis finis [every individual act has some circumstance, through which it is drawn to the good or bad, to a lesser degree, from the part of the intention of the end].</p></blockquote>

<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

<blockquote><p>…especially seeing his Majesty [King Charles I] shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

</figure><figure class="quote" id="q-ec3ab1befd" data-kw="">
<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’, pp. 461-62</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-70c58eeba7" data-kw="">
<blockquote><p>§2. But first I will lay together some propositions for decision of the controversy: How far we are bound to obey men’s precepts about religion, especially in case we doubt of the lawfulness of obeying them, and so cannot obey them in faith? §3. Briefly: 1. We must obey both magistrates and pastors in all things lawful which belong to their offices to command. 2. It belongs not to their office to make God a new worship; but to command the mode and circumstances of worship belongs to their office. For guiding them wherein, God has given them general rules. 3. We must not take the lawful commands of our governors to be unlawful. 4. If we do through weakness or perverseness take lawful things to be unlawful, that will not excuse us in our disobedience. Our error is our sin, and one sin will not excuse another sin. Even as on the other side, if we judge things unlawful to be lawful, that will not excuse us for our disobedience to God in obeying men. 5. As I have before showed, many things that are miscommanded must be obeyed. 6. As an erroneous judgment will not excuse us from obedience to our governors, so much less will a doubtfulness excuse us. 7. As such a doubting, erring judgment cannot obey in (plenary) faith, so much less can he disobey in faith. For it is a known command of God, that we obey them that have the rule over us: but they have no Word of God against the act of obedience now in question. It is their own erring judgment that entangles them in a necessity of sinning (till it be changed). 7. In doubtful cases, it is our duty to use God’s means for our information: and one means is to consult with our teachers and hear their words with teachableness and meekness. 8. If upon advising with them we remain in doubt about the lawfulness of some circumstance of order, if it be such as may be dispensed with, they should dispense with us: if it may not be dispensed with without a greater injury to the Church or cause of God than our dispensation will countervail, then is it our duty to obey our teachers notwithstanding such doubts: For it being their office to teach us, it must be our duty to believe them with a human faith, in cases where we have no evidences to the contrary: And the duty of obeying them being certain, and the sinfulness of the thing commanded being uncertain and unknown, and only suspected, we must go on the surer side. 9. Yet must we in great and doubtful cases, not take up with the suspected judgment of a single pastor, but apply ourselves to the unanimous pastors of other Churches. 10. Christians should not be over-busy in prying into the work of their governors, not too forward to suspect their determinations: But when they know that it is their ruler’s work to guide them by determining of due circumstances of worship, they should without causeless scruples readily obey, till they see just reason to stop them in their obedience; They must not go out of their own places to search into the actions of another man’s office to trouble themselves without any cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659) | ch. 15, ‘Reasons for Obedience in Lawfull things’, pp. 483-85</span></figcaption>

s.+8.+If+upon+advising+with+them+we+remain+in+doubt+about+the+lawfulness+of+some+circumstance+of+order%2C+if+it+be+such+as+may+be+dispensed+with%2C+they+should+dispense+with+us%3A+if+it+may+not+be+dispensed+with+without+a+greater+injury+to+the+Church+or+cause+of+God+than+our+dispensation+will+countervail%2C+then+is+it+our+duty+to+obey+our+teachers+notwithstanding+such+doubts%3A+For+it+being+their+office+to+teach+us%2C+it+must+be+our+duty+to+believe+them+with+a+human+faith%2C+in+cases+where+we+have+no+evidences+to+the+contrary%3A+And+the+duty+of+obeying+them+being+certain%2C+and+the+sinfulness+of+the+thing+commanded+being+uncertain+and+unknown%2C+and+only+suspected%2C+we+must+go+on+the+surer+side.+9.+Yet+must+we+in+great+and+doubtful+cases%2C+not+take+up+with+the+suspected+judgment+of+a+single+pastor%2C+but+apply+ourselves+to+the+unanimous+pastors+of+other+Churches.+10.+Christians+should+not+be+over-busy+in+prying+into+the+work+of+their+governors%2C+not+too+forward+to+suspect+their+determinations%3A+But+when+they+know+that+it+is+their+ruler%E2%80%99s+work+to+guide+them+by+determining+of+due+circumstances+of+worship%2C+they+should+without+causeless+scruples+readily+obey%2C+till+they+see+just+reason+to+stop+them+in+their+obedience%3B+They+must+not+go+out+of+their+own+places+to+search+into+the+actions+of+another+man%E2%80%99s+office+to+trouble+themselves+without+any+cause.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship%2C+%28London%2C+1659%29+%7C+ch.+15%2C+%E2%80%98Reasons+for+Obedience+in+Lawfull+things%E2%80%99%2C+pp.+483-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70c58eeba7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/70c58eeba7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=2.%20But%20first%20I%20will%20lay,to%20trouble%20themselves%20without%20any%20cause&amp;text <blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>

</figure><figure class="quote" id="q-e50800b783" data-kw="">
<blockquote><p>I would learn of him what makes a lawful ordinance about matters of fact or things to be done? Not the will of superiors, else there shall be no unlawful ordinances (for every ordinance has the will of the ordainer). Not the lawfulness of the thing in itself which is ordained either, for then every ordinance which prescribes a thing lawful in itselfe, were it never so inexpedient in respect of supervenient circumstances, should be lawful. To a lawful ordinance, then, [is] required not only that the thing ordained be lawful in itself… [but] also that it be not inexpedient. So that a thing may be lawful in itself, yet not lawfully ordained, because the ordinance commands the doing of it; whereas there are many things lawful which ought not to be done, because they are not expedient, 1 Cor. 6:12. 3. Since it cannot be a lawful ordinance which ordains a thing inexpedient, it can not be a lawful obedience which is yielded to such an ordinance.</p></blockquote>

</figure><figure class="quote" id="q-dda84bdd5e" data-kw="">
<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.] 5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>

<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition, in 8 Volumes</cite>, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.</span></figcaption>

— Edmund Burke, The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition, in 8 Volumes, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+reality+there+are+two%2C+and+only+two%2C+foundations+of+law%3B+and+they+are+both+of+them+conditions+without+which+nothing+can+give+it+any+force%3B+I+mean+equity+and+utility.+With+respect+to+the+former%2C+it+grows+out+of+the+great+rule+of+equality%2C+which+is+grounded+upon+our+common+nature%2C+and+which+Philo%2C+with+propriety+and+beauty%2C+calls+the+mother+of+justice.+All+human+laws+are%2C+properly+speaking%2C+only+declaratory%3B+they+may+alter+the+mode+and+application%2C+but+have+no+power+over+the+substance+of+original+justice.+The+other+foundation+of+law%2C+which+is+utility%2C+connected+in+the+same+manner+with%2C+and+derived+directly+from%2C+our+rational+nature%3B+for+any+other+utility+may+be+the+utility+of+a+robber%2C+but+cannot+be+that+of+a+citizen%3B+the+interest+of+the+domestic+enemy%2C+and+not+that+of+a+member+of+the+commonwealth.+This+present+equality+can+never+be+the+foundation+of+statues+which+create+an+artificial+difference+between+men%2C+as+the+laws+before+us+%5Bunder+consideration+in+his+time%5D+do%2C+in+order+to+induce+a+consequential+inequality+in+the+distribution+of+justice.+Law+is+a+mode+of+human+action+respecting+society%2C+and+must+be+governed+by+the+same+rules+of+equity+which+govern+every+private+action%3B+and+so+Tully+%5BCicero%3F%5D+considers+it+in+his+Offices+as+the+only+utility+%5Bbeing+a+utility+to+all+commonly%5D+agreeable+to+that+%5Bcommon%5D+nature%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Edmund+Burke%2C+The+Works+%26+Correspondence+of+the+Right+Honourable+Edmund+Burke.+A+New+Edition%2C+in+8+Volumes%2C+vol.+6+%28d.+1797%3B+London%2C+1852%29%2C+p.+17.+See+also+the <blockquote><p>closed with the Presbyterian in the beginning of the rebellion, took the [Solemn League &amp;] Covenant [1643], sided with the Independents, became a great creature of the long parliament by whose authority he was made tutor to James, Duke of York [would later be King James II], and an active person against his sovereign [King Charles I]”. Ascham was murdered by royalists in Spain. Wiki: “His first published work was A Discourse… This appeared in 1648, probably in July at the height of the political uncertainty engendered by the second Civil War. The previous month the Army had shown that it wielded both political and military power and Ascham’s Discourse was widely seen as a defense of the Army as the conquering power, and as a plea for “the rank of the people” to adopt a position of political quiescence. Parliament’s ultimate victory and the establishment of the Commonwealth posed a problem for those who felt unable to accept the legality of the new government but were now being required to give it their allegiance, and also for those who regarded their oath of allegiance to King Charles I… as a solemn oath to God that could not be broken. One argument, provided by a group of political theorists variously called the Engagers, or de facto theorists, was to argue that an individual could give their obedience to the de facto government in being simply because it was in power. For many such a theory was deeply shocking since it emphasized power at the expense of authority, and subordinated allegiance to self-interest. The debate was initiated by Francis Rous who published a brief pamphlet in April 1649 [The Lawfulness of Obeying the Present Government] in which he argued that allegiance could be given to the Commonwealth even though it were acknowledged to be an illegal power. It was a radical shift in the basis of the argument that was to be followed through by theorists engaged in the debate on de facto government. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.</p></blockquote>

t. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever

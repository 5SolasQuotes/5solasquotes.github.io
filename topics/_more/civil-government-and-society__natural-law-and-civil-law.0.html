<blockquote><p>Though Saul’s destroying of the Amalekites in that cause was moral, in regard ‘they lay in wait for Israel, when they came out of Egypt,’ and so of perpetual obligation, yet the destroying of them, 1 Sam. 15, is temporary and obliges not us: 1. Because that generation were their sons, not those same persons that oppressed Israel when they came out of Egypt, and we may not punish the sons for the sins of their fathers with death; therefore God’s positive command to Saul, and the reason, ‘I remember what Amalek did’ (in Moses his time) ‘therefore kill them,’ does not oblige us, except we had the like command. 2. Because the slaying of man, woman, infant and suckling, ox and sheep, was temporary and cannot have a perpetually obligatory ground in the Law of nature or natural justice obliging us. 3. Where there is an injury done to God against the Law of nature and against our brethren in drawing them from serving the true God, and a punishment commanded by God to be inflicted once; that punishment, or the like in substance and nature, must ever be such as obliges us in the like cases; The learned professors in Leiden say, ‘They can see no reason but they must oblige under the New Testament.’ I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the Law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the Magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9e2bfe81dd" data-kw="">
<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.”

<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

</figure><figure class="quote" id="q-4488692647" data-kw="">
<blockquote><p>Answer: 1. Show a law of nature that the father might enslave his children; by a divine positive law, presupposing sin, the father might do that; and yet I think that may be questioned, whether it was not a permission rather than a law, as was the bill of divorce; but a law of nature it was not; 2. The Popish Prelate [John Maxwell] can see no law but the law of nature here; but it is because he is blind or will not see. His reason is, It was not by mutual and voluntary contract of children and fathers, therefore it was by the law of nature; so he that cursed his father was to die by God’s law. This law was not made by mutual consent betwixt the father and the son, therefore it was a law of nature: the Prelate will see no better. Nature will teach a man to enslave himself to redeem himself from death, but that it is a dictate of nature that a man should enslave his son, I conceive not.</p></blockquote>

</figure><figure class="quote" id="q-be07a9b2e5" data-kw="">
<blockquote><p>As for the law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says, and the prophet says (Mal. 2) that the Lord hates putting away;</p></blockquote>

</figure><figure class="quote" id="q-b3e9b3071f" data-kw="">
<blockquote><p>…a permissive law of God… such as a law of a bill of divorcement… The law of a bill of divorcement is a mere positive law, permitted in a particular exigent, when a husband, out of levity of heart and affection, cannot love his wife; therefore God by a law permitted him out of indulgence to put her away, that both might have a seed (the want [lack] whereof, because of the blessed Seed to be born of woman, was a reproach in Israel [in the Old Testament]), and though this was an affliction to some particular women, yet the intent of the law and the soul thereof was a public benefit to the commonwealth of Israel, of which sort of laws I judge the hard usage permitted by God to his people — in the master toward the servant — and the people of God toward the stranger, of whom they might exact usury — though not toward their brethren.</p></blockquote>

<blockquote><p>Nor can we think that the hardness of one prince’s heart can be a ground for God to make [such] a [tyrannical civil] law [in Rutherford’s day] so destructive to his church and all mankind; such a permissive law, being [claimed to be] a positive law of God [by Erastian defenders of tyrants], must have a word of Christ for it, else we are not to receive it… …I ask, how men can annul any divine law of God, though but a permissive law… …the object of a permissive law is sin…</p></blockquote>

</figure><figure class="quote" id="q-258c414b3b" data-kw="">
<blockquote><p>But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.”

<blockquote><p>Hence it [polygamy] might be lawful in the court of earth (so as to obtain immunity from civil and ecclesiastical punishments among men), but not in the court of heaven before God. … XXIX. As to divorce, God neither simply commanded nor permitted it, but only wished to restrain by fixed laws the facility of divorces which prevailed among the Jews against the natural law of marriage, so as to regulate the mode of an unlawful thing, not however to make it lawful. Hence Christ says that God ‘permitted’ or ‘tolerated’ it ‘because of the hardness of heart of the Jews’ (Mt. 19:8).</p></blockquote>

</figure><figure class="quote" id="q-cdbd942d91" data-kw="">
<blockquote><p>When, therefore, a community, by the instinct and guidance of nature, incline to government, and to defend themselves from violence, they do not, by that instinct, formally agree to government by magistrates; and when a natural conscience gives a deliberate consent to good laws, as to this, “Whoso sheddeth man’s blood, by man shall his blood be shed,” Gen. 9:6, he does tacitly consent that his own blood shall be shed; but this he consents unto consequently, tacitly, and conditionally, — if he shall do violence to the life of his brother: yet so as this consent proceeds not from a disposition every way purely natural.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644), Question 2, pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5d2b3ad8ce" data-kw="">
<blockquote><p>That this Author saith, God commanded those that transgressed his holy Law with an high hand, and presumptuously to be killed, lest they should live and profane his holy things; I defend not: But sure Erastus erreth, who will have all such to be killed by the Magistrate under the New Testament, because they were killed in the Old: Then are we to stone men that gathereth sticks on the Lord’s Day; the child that is stubborn to his Parents, the Virgins, daughters of Ministers that committeth fornication are to be put to death. Why, but then the whole judicial Law of God shall oblige us Christians as Carolosladius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them, so it was mysterious teach of us, how God hated such and such sins, and mysteries of that kind are gone with the other shadows. But we read not (saith Erastus) where Christ hath changed those Laws in the New Testament. It is true, Christ hath not said in particular, I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated until the evening; nor hath he said particularly of every carnal Ordinance and judicial Law, it is abolished. Be we conceive, the whole bulk of the judicial Law, as judicial, and as it concerned the Republick of the Jews only, is abolished, though the moral equity of all those be not abolished; also some punishments were merely symbolical, to teach the detestation of such a vice, as the boaring with an aul the ear of him that loved his Master, and desired still to serve him, and the making of him his perpetual servant. I should think the punishing with death the man that gathered sticks on the Sabbath was such; and in all this, the punishing of a sin against the Moral Law by the Magistrate, is Moral and perpetual; but the punishing of every sin against the Moral Law, tali modo, so and so, with death, which spitting on the face: I much doubt if these punishments in particular, and in their positive determination to the people of the Jews, be moral and perpetual: As he that would marry a captive woman of another Religion, is to cause her first pare her nails, and wash herself, and give her a month, or less time to lament the death of her Parents, which was a Judicial, not a Ceremonial Law; that this should be perpetual, because Christ in particular hath not abolished it, to me seems most unjust; for as Paul saith, He that is Circumcised becomes a debtor to the whole Law, sure to all the Ceremonies of Moses his Law: So I argue, à pari, from the like, He that will keep one judicial Law, because judicial and given by Moses, becometh debtor to keep the whole judicial Law, under pain of God’s eternal wrath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication</cite>, … (London : John Field for Christopher Meredith, 1646), 493–94.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-786cf49f11" data-kw="">
<blockquote><p>But how doth it appear that these or any other Judicial Laws of Moses do at all appertain to us, as rules to guide us in like cases? I shall with him who scrupleth this, to read Piscator his Appendix to his Observations upon the 21, 22, 23. Chapters of Exodus, where he excellently disputeth this question, Whether the Christian Magistrate be bound to observe the Judicial laws of Moses, as well as the Jewish Magistrate was. He answereth by the common distinction, he is obliged to those things in the Judicial law which are unchangeable, and common to all Nations: but not to those things which are mutable, or proper to the Jewish Republic. But then he explaineth this distinction, that by things mutable, and proper to the Jews, he understandeth the emancipation of an Hebrew servant or handmaid in the seventh year, a mans marying his brothers wife and raising up seed to his brother, the forgiving of debts at the Jubilee, marying with one of the same Tribe, and if there be any other like to these; also Ceremonial trespasses, as touching a dead body, etc. But things immutable, and common to all Nations are the laws concerning Moral trespasses, Sins against the Moral law, as murder, adultery, theft, enticing away from God, blasphemy, striking of Parents. Now that the Christian Magistrate is bound to observe these Judicial laws of Moses which appoint the punishments of sins against the Moral law, he proveth by these reasons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty, Appendix</cite>, (London: Christopher Meredith, 1645), 6–7.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“But how doth it appear that these or any other Judicial Laws of Moses do at all appertain to us, as rules to guide us in like cases? I shall with him who scrupleth this, to read Piscator his Appendix to his Observations upon the 21, 22, 23. Chapters of Exodus, where he excellently disputeth this question, Whether the Christian Magistrate be bound to observe the Judicial laws of Moses, as well as the Jewish Magistrate was. He answereth by the common distinction, he is obliged to those things in the Judicial law which are unchangeable, and common to all Nations: but not to those things which are mutable, or proper to the Jewish Republic. But then he explaineth this distinction, that by things mutable, and proper to the Jews, he understandeth the emancipation of an Hebrew servant or handmaid in the seventh year, a mans marying his brothers wife and raising up seed to his brother, the forgiving of debts at the Jubilee, marying with one of the same Tribe, and if there be any other like to these; also Ceremonial trespasses, as touching a dead body, etc. But things immutable, and common to all Nations are the laws concerning Moral trespasses, Sins against the Moral law, as murder, adultery, theft, enticing away from God, blasphemy, striking of Parents. Now that the Christian Magistrate is bound to observe these Judicial laws of Moses which appoint the punishments of sins against the Moral law, he proveth by these reasons.”

<blockquote><p>It is true, indeed, a prince should be loath to put out that life that God hath put in, and should beware, to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince hath no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate the punishment, but to say he may let the man go free, he hath no power. But yet they will insist further, and say, Is not this one of the judicial laws that was given to the Jews—then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them—they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know, that natural men, ethnics, who had never the law of the Jews, they executed the murderer.</p></blockquote>

<blockquote><p>THUS MUCH CONCERNING INWARD FREEDOM: NOW CONCERNING OUTWARD FREEDOM. The outward freedom, is that which pertaineth to the outward life. And it is called Christian liberty, because it belongeth to Christians only. And that is two fold, freedom from the laws of Moses, and freedom indifferent things. Freedom from the laws of Moses, is that by which Christians are loosed from the ceremonial, &amp; Judicial laws of Moses, namely, so far forth as they only pertaine to the civil governement under Moses. 1. Cor. 9. 1. 19. 2. Cor. 3. 17. Heb. 9. 10. For such laws which belong to the law of nature, and by which all nations are bound, are not abrogated.</p></blockquote>

<blockquote><p>3. Beside this law, commonly called moral, God was pleased to give to the people of Israel, as a church under age, ceremonial laws, containing several typical ordinances, partly of worship, prefiguring Christ, his graces, actions, sufferings, and benefits; and partly, holding forth divers instructions of moral duties. All which ceremonial laws are now abrogated, under the new testament. 4. To them also, as a body politic, he gave sundry judicial laws, which expired together with the State of that people; not obliging any other now, further than the general equity thereof may require. 5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.</p></blockquote>

</figure><figure class="quote" id="q-0dfde41248" data-kw="">
<blockquote><p>The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshiped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come [Gal. 4:3–4; cf. ch. 3:23–24], in order that he might fully manifest his wisdom to the nations, and show the truth of those things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted certain formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety, inasmuch as they kept the church of the Jews in service and reverence to God, and yet could be distinguished from piety itself. In like manner, the form of their judicial laws, although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law, had something distinct from that precept of love. Therefore, as ceremonial laws could be abrogated while piety remained safe and unharmed, so too, when these judicial laws were taken away, the perpetual duties and precepts of love could still remain. But if this is true, surely every nation is left free to make such laws as it foresees to be profitable for itself. Yet these must be in conformity to that perpetual rule of love, so that they indeed vary in form but have the same purpose. For I do not think that those barbarous and savage laws such as gave honor to thieves, permitted promiscuous intercourse, and others both more filthy and more absurd, are to be regarded as laws. For they are abhorrent not only to all justice, but also to all humanity and gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.20.15.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-80218f438b" data-kw="">
<blockquote><p>Moreover, the law of Moses is an example of the natural law, most suitably expressing the common notions of nature endowed by natural law. For the principles and conclusions of the natural law, that is, those common notions of nature, are perfectly expressed in the law of Moses. These common notions not only exist in the corrupted nature of man, but also existed in the pure and original nature.</p></blockquote>

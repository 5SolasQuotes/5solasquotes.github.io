</figure><figure class="quote" id="q-de76fe8313" data-kw="">
<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>

<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (Edinburgh, 1641), pp. 125-6</span></figcaption>

<blockquote><p>Objection 9 [of a congregationalist to presbyterianism]: ‘From the church here spoken of [in Mt. 18] there is no appeal because the sentence is ratified in heaven. It inflicts the highest punishment: the censure of excommunication; and a higher judicature can do no more. There is no reason to appeal to a higher judicature because the inferior may err, because all above a congregation are courts which may err also. For presbyteries, provincial councils, national, and the universal council of the catholic Church may err.’ So Mr. Mather (Richard Mather &amp; William Tompson, Answer to Mr. Herle, ch. 2, pp. 13-14). [Rutherford’s] Answer [1.]: Because the sentence is ratified in heaven is no reason why we may not appeal from a congregation. The sentence of an inferior judge proceeding rightly is ratified in heaven, yet we may appeal from him. To appeal is but upon fears of ill administration; to desert a lower court and go to a higher court. So when we fear that a counsel and advice given by a sister church is not according to the Word of God, which yet is according to the Word of God, upon the supposal of that fear we decline that council and take another. Neither are we to appeal de jure, ‘from a just sentence,’ in a presbytery. Illud possumus quod jure possumus [‘What we can do, is that which we can do by law’]. What the inferior Sanhedrin of Israel did justly was ratified in heaven. Yet by God’s Law there might be an appeal from it to the highest Sanhedrin. 2. Nor is this a good reason: that we may not appeal from a judicature which may inflict the highest censure. For inferior judicatures in Israel had power of life and death, yet might man appeal from them. 3. The cause of appeals is not because inferior judicatures may err: for so we might appeal from all judicatures, even from a general council, for it may err. But the true grounding [of appeals] is: 1. Because rarius errant, they [higher councils] ‘do not so frequently err’. 2. They are not so inclined and disposed to err, ‘for many eyes see more than one,’ and many eyes do more seldom miscarry in not taking up the right object than one. 3. Because we conceive more equality and less partiality in higher courts.</p></blockquote>

<blockquote><p>…the position which this gentleman undertakes to establish is, ‘that appeals and complaints cannot be constitutionally entertained in our church judicatories except in judicial cases;’… This doctrine, after all that he has said in its favour, we are more than ever persuaded is unconstitutional, mischievous, and in the highest degree unreasonable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review</cite>, no. 2 (April, 1835), article 3, ‘New Ecclesiastical Law, no. 2’, pp. 186-97</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

— Samuel Miller, The Biblical Repertory &amp; Theological Review, no. 2 (April, 1835), article 3, ‘New Ecclesiastical Law, no. 2’, pp. 186-97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+position+which+this+gentleman+undertakes+to+establish+is%2C+%E2%80%98that+appeals+and+complaints+cannot+be+constitutionally+entertained+in+our+church+judicatories+except+in+judicial+cases%3B%E2%80%99%E2%80%A6+This+doctrine%2C+after+all+that+he+has+said+in+its+favour%2C+we+are+more+than+ever+persuaded+is+unconstitutional%2C+mischievous%2C+and+in+the+highest+degree+unreasonable.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+The+Biblical+Repertory+%26+Theological+Review%2C+no.+2+%28April%2C+1835%29%2C+article+3%2C+%E2%80%98New+Ecclesiastical+Law%2C+no.+2%E2%80%99%2C+pp.+186-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fd22aa2aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3fd22aa2aa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=the%20position%20which%20this%20gentleman%20undertakes,and%20in%20the%20highest%20degree%20unreasonable&amp;text=the%20position%20which%20this%20gentleman%20undertakes%20to%20establish&amp;text=unconstitutional%2C%20mischievous%2C%20and%20in%20the%20highest%20degree%20unreasonable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-104eb0485a" data-kw="">
<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases. It is really a matter of importance. It would be a hard case if a party, suffering under a grievous wrong, should be turned away from the bar of our highest judicatory, merely on the ground that he had mistaken the nature of his remedy… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and com- plaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it… …There is a good deal of confusion and error often occasioned by the mere designation of our ecclesiastical bodies as courts or judicatories. They are so called Avhen not sitting in judicial capacity… Our courts are bodies sui generis [of their kind]; they include within themselves legislative, executive and judicial powers. Yet this division is in a great measure arbitrary. These several powers are but different modes of exercising the general governing authority in the Church; and it is often very difficult to say whether a particular act should be placed under the one or the other of these heads… An appeal supposes an aggrieved party, but he may appeal from any kind of decision which directly affects himself. A complaint supposes some kind of impropriety in the act complained of, but it may be entered against any kind of act alleged to be improper. So that any kind of decision may be regularly brought up in each of the several ways specified above. That this is the true meaning of this article, might be inferred with certainty from the fact that it has always been so understood and acted upon; and that it is almost a literal transcript of the Scottish rule on the same subject, which has always been interpreted and applied in the same way… In the first place, these technical terms are to be understood, not according to their use in civil courts, but according to our own ecclesiastical usage. Our bodies are called courts; their decisions are called judgments; the matters brought before them are called cases. Are we to infer from this, as has been done by the New School lawyers and brethren, that they have nothing but judicial powers… In the second place, our rules were drawn up with special reference to that class of cases which is of most frequent occurrence, and hence the language employed is adapted to such cases… In the third place it is a fallacy running through this argument that there can be no judicial investigation of anything but a judicial act… There is, therefore, no foundation in our constitution for this new doctrine. Every letter of the rules may be, and has been fully complied with in a multitude of cases, where the decision appealed from was merely an executive act… We shall proceed to show that this new doctrine, especially if applied to complaints as well as appeals (and we have seen that the two cannot in this matter be consistently separated), is subversive of the fundamental principles of Presbyterianism, and inconsistent with the uniform practice of the Church… This doctrine is at variance also with the undeviating practice of our own and all other Presbyterian Churches. This of itself is a fatal objection to any new doctrine. The fact that we have been going on in accordance with the usage of all other Presbyterian bodies, for a hundred and twenty years, interpreting and administering our constitution in a certain way, is answer enough… The words of our book have the sense which they were intended to bear; and they were intended to bear the sense in which its authors and administrators have ever understood and applied them… That the practice of our Church has been uniform on this subject, is admitted… There is not then, upon our Minutes, a single case of an appeal or complaint, which was rejected on the ground that it did not refer to a judicial sentence. We have been going on for a hundred and twenty years entertaining such appeals without any one dreaming of their being irregular… If after all this a new and opposite doctrine is to be introduced, there never can be any stability or security with regard to any principle of Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.</p></blockquote>

Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.”

— Charles Hodge, Discussions in Church Polity, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’ | a. ‘Appeals in Cases Not Judicial’ 470">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+is%2C+the+General+Assembly+decided+that+appeals+cannot+lie+except+in+judicial+cases.+It+is+really+a+matter+of+importance.+It+would+be+a+hard+case+if+a+party%2C+suffering+under+a+grievous+wrong%2C+should+be+turned+away+from+the+bar+of+our+highest+judicatory%2C+merely+on+the+ground+that+he+had+mistaken+the+nature+of+his+remedy%E2%80%A6+We+have+had+a+superior+judicatory+in+our+Church+for+more+than+a+hundred+and+twenty+years.+During+about+seventy+years+of+this+period%2C+our+discipline+was+conducted+according+to+the+Westminster+Directory.+In+1789+our+present+constitution+went+into+operation%3B+which+was+submitted+to+an+extensive+revision+and+alteration%2C+as+to+matters+of+detail%2C+in+1821.+Under+these+several+systems%2C+appeals+and+complaints+were+allowed%2C+without+hindrance+or+contradiction%2C+from+any+kind+of+decision+in+an+inferior+judicatory+by+a+person+who+felt+himself+aggrieved%2C+until+1834.+Then%2C+for+the+first+time+in+our+history%2C+as+far+as+we+know%2C+the+idea+was+started+that+appeals+and+complaints+could+be+made+only+in+cases+strictly+judicial.+%E2%80%A6That+this+novel+doctrine+was+not+at+that+time+the+doctrine+of+the+synod%2C+which+the+Rev.+gentleman+defended%2C+is+plain%E2%80%A6+Though+the+synod+was+thus+free+from+this+new+doctrine+in+May+1834%2C+it+grew+in+such+sudden+favour%2C+that+when+that+body+met+the+following+autumn%2C+they+decided+not+merely+that+appeals+and+com-+plaints+could+not+lie+except+in+judicial+cases%2C+but+even+that+protests+were+in+the+same+predicament.+This+is+an+instructive+illustration+of+the+fact+that+the+wisest+and+best+men+sometimes+allow+themselves+to+be+run+away+with+by+a+plausible+idea%2C+though+contrary+to+all+their+own+previous+professions+and+practice.+This%2C+however%2C+was+a+mere+temporary+delusion.+The+members+of+that+synod+who+had+signed+or+allowed+protests+in+all+kinds+of+cases+before%2C+still+continued+to+sign+or+allow+them%2C+with+equal+freedom%2C+their+own+decision+to+the+contrary+notwithstanding%E2%80%A6+We+found+its+very+authors+and+advocates+disregarding+it+the+very+next+year%3B+acting+as+though+no+such+doctrine+had+ever+been+broached.+If+they+practically+abandoned+it+as+untenable%E2%80%A6+The+Synod+of+Philadelphia+extended+the+%5Bnew%5D+doctrine+to+appeals%2C+complaints+and+protests.+Thus+putting+minorities+completely+under+the+feet+of+majorities%2C+not+allowing+them+even+the+right+of+recording+their+dissent+with+the+reasons+for+it%E2%80%A6+%E2%80%A6There+is+a+good+deal+of+confusion+and+error+often+occasioned+by+the+mere+designation+of+our+ecclesiastical+bodies+as+courts+or+judicatories.+They+are+so+called+Avhen+not+sitting+in+judicial+capacity%E2%80%A6+Our+courts+are+bodies+sui+generis+%5Bof+their+kind%5D%3B+they+include+within+themselves+legislative%2C+executive+and+judicial+powers.+Yet+this+division+is+in+a+great+measure+arbitrary.+These+several+powers+are+but+different+modes+of+exercising+the+general+governing+authority+in+the+Church%3B+and+it+is+often+very+difficult+to+say+whether+a+particular+act+should+be+placed+under+the+one+or+the+other+of+these+heads%E2%80%A6+An+appeal+supposes+an+aggrieved+party%2C+but+he+may+appeal+from+any+kind+of+decision+which+directly+affects+himself.+A+complaint+supposes+some+kind+of+impropriety+in+the+act+complained+of%2C+but+it+may+be+entered+against+any+kind+of+act+alleged+to+be+improper.+So+that+any+kind+of+decision+may+be+regularly+brought+up+in+each+of+the+several+ways+specified+above.+That+this+is+the+true+meaning+of+this+article%2C+might+be+inferred+with+certainty+from+the+fact+that+it+has+always+been+so+understood+and+acted+upon%3B+and+that+it+is+almost+a+literal+transcript+of+the+Scottish+rule+on+the+same+subject%2C+which+has+always+been+interpreted+and+applied+in+the+same+way%E2%80%A6+In+the+first+place%2C+these+technical+terms+are+to+be+understood%2C+not+according+to+their+use+in+civil+courts%2C+but+according+to+our+own+ecclesiastical+usage.+Our+bodies+are+called+courts%3B+their+decisions+are+called+judgments%3B+the+matters+brought+before+them+are+called+cases.+Are+we+to+infer+from+this%2C+as+has+been+done+by+the+New+School+lawyers+and+brethren%2C+that+they+have+nothing+but+judicial+powers%E2%80%A6+In+the+second+place%2C+our+rules+were+drawn+up+with+special+reference+to+that+class+of+cases+which+is+of+most+frequent+occurrence%2C+and+hence+the+language+employed+is+adapted+to+such+cases%E2%80%A6+In+the+third+place+it+is+a+fallacy+running+through+this+argument+that+there+can+be+no+judicial+investigation+of+anything+but+a+judicial+act%E2%80%A6+There+is%2C+therefore%2C+no+foundation+in+our+constitution+for+this+new+doctrine.+Every+letter+of+the+rules+may+be%2C+and+has+been+fully+complied+with+in+a+multitude+of+cases%2C+where+the+decision+appealed+from+was+merely+an+executive+act%E2%80%A6+We+shall+proceed+to+show+that+this+new+doctrine%2C+especially+if+applied+to+complaints+as+well+as+appeals+%28and+we+have+seen+that+the+two+cannot+in+this+matter+be+consistently+separated%29%2C+is+subversive+of+the+fundamental+principles+of+Presbyterianism%2C+and+inconsistent+with+the+uniform+practice+of+the+Church%E2%80%A6+This+doctrine+is+at+variance+also+with+the+undeviating+practice+of+our+own+and+all+other+Presbyterian+Churches.+This+of+itself+is+a+fatal+objection+to+any+new+doctrine.+The+fact+that+we+have+been+going+on+in+accordance+with+the+usage+of+all+other+Presbyterian+bodies%2C+for+a+hundred+and+twenty+years%2C+interpreting+and+administering+our+constitution+in+a+certain+way%2C+is+answer+enough%E2%80%A6+The+words+of+our+book+have+the+sense+which+they+were+intended+to+bear%3B+and+they+were+intended+to+bear+the+sense+in+which+its+authors+and+administrators+have+ever+understood+and+applied+them%E2%80%A6+That+the+practice+of+our+Church+has+been+uniform+on+this+subject%2C+is+admitted%E2%80%A6+There+is+not+then%2C+upon+our+Minutes%2C+a+single+case+of+an+appeal+or+complaint%2C+which+was+rejected+on+the+ground+that+it+did+not+refer+to+a+judicial+sentence.+We+have+been+going+on+for+a+hundred+and+twenty+years+entertaining+such+appeals+without+any+one+dreaming+of+their+being+irregular%E2%80%A6+If+after+all+this+a+new+and+opposite+doctrine+is+to+be+introduced%2C+there+never+can+be+any+stability+or+security+with+regard+to+any+principle+of+Presbyterian+Church+government%E2%80%A6+Nothing+short+of+a+plain+and+intelligible+denial+of+the+right+to+complain+of+oppressive+and+unconstitutional+acts%3B+or+to+appeal+from+unrighteous+decisions%2C+though+they+may+not+be+judicial%2C+will+induce+Presbyterians+to+forego+a+privilege+which+they+have+enjoyed+from+the+very+foundation+of+their+Church%E2%80%A6+If+it+is+to+be+applied+to+appeals%2C+we+see+not+how+any+one+can+fail+to+apply+it+to+complaints+and+references%2C+and+if+so+applied%2C+all+must+acknowledge+that+our+system+of+government+would+be+completely+overturned.+The+right+of+appeal+is+already+restricted+within+very+harrow+limits.+It+is+not+the+privilege+of+any+member+of+the+court.+It+belongs+exclusively+to+an+aggrieved+party%3B+to+those+whose+character+or+interests+are+immediately+concerned+in+the+decision.+And+to+all+such+it+is+a+right+guaranteed+by+the+constitution+and+by+the+undeviating+practice+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%2C+%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99+%7C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99+470&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104eb0485a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/104eb0485a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=That%20is%2C%20the%20General%20Assembly%20decided,the%20undeviating%20practice%20of%20the%20Church&amp;text=That%20is%2C%20the%20General%20Assembly%20decided%20that%20appeals&amp;text=and%20by%20the%20undeviating%20practice%20of%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The human law is that which humans, proceeding by reason, produce from the preceding laws, accommodated first to common just, honest, useful, and necessary conclusions, then to particular determinations for the condition of persons for whose good it is produced, the things or matters concerning which it is produced, and for the circumstances which occur to them. … We call determinations that part of human law that circumscribes any of those natural conclusions with specific (as we call it) boundaries, not by the authority of nature, but rather by the judgment of the wisest persons, by the common law of nature specifically accommodated to the mode of individual things. .. The objects of just proportion exist in three kinds… for the sake of producing specific determinations. For either they are [1] primary objects whose good is seen by natural, divine, and human law; or [2] they are secondary objects that are ordered to the former ones as to their own end; or, [3] finally, they are accidents, by which the previous two objects are commonly clothed in a certain way and change.</p></blockquote>

n%20law%20is%20that%20which,in%20a%20certain%20way%20and%20change&amp;text=The%20human%20law%20is%20that%20which%20humans%2C%20proceeding&amp;text=commonly%20clothed%20in%20a%20certain%20way%20and%20change" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f7f4fed4b1" data-kw="">
<blockquote><p>The great writers of all ages are cited [by Grotius] with a superfluous lavishness… as to give a historic catholicity to his doctrine by showing that the laws he is endeavoring to formulate have, in fact, been accepted in all times and by all men.” – Intro, p. 10 For a summary of some of Grotius’s distinctive points, some of which disagree with Rutherford, see the Intro, p. 11. Rutherford cites Grotius 42 times in Lex Rex. Selden, John – Of the Dominion, or, Ownership of the Sea, Two Books. In the First is showed that the Sea, by the Law of Nature, or Nations, is not common to all men, but capable of private dominion or propriety, as well as the land. In the Second is proved that the dominion of the British Sea, or that which encompasses the isle of Great Britain, is, and ever has been, a part or appendant of the empire of that island (London: 1652) ToC Selden (1584-1654) was an Erastian, English jurist, a scholar of England’s ancient laws and constitution, and a scholar of Jewish law. He was known as a polymath; John Milton hailed Selden in 1644 as “the chief of learned men reputed in this land.</p></blockquote>

nces/#:~:text=The%20great%20writers%20of%20all%20ages,learned%20men%20reputed%20in%20this%20land&amp;text=The%20great%20writers%20of%20all%20ages%20are%20cited&amp;text=chief%20of%20learned%20men%20reputed%20in%20this%20land" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[‘Equity’ is] the suitable application of the law to the demands of the situation, in which is seen the law’s will and intention [i.e. the spirit of the law]… or it is the moderating and amendment of the law that comes about from the prudence of the judge accommodating himself to the circumstances of the case, and bending the law to the case, not the case to the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/neil-hemmingsen.html">Neil Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Law of Nature: A Demonstrative Method (1562), ed. E.J. Hutchinson (Grand Rapids: CLP Academic, 2018), pp. 125-126</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[‘Equity’ is] the suitable application of the law to the demands of the situation, in which is seen the law’s will and intention [i.e. the spirit of the law]… or it is the moderating and amendment of the law that comes about from the prudence of the judge accommodating himself to the circumstances of the case, and bending the law to the case, not the case to the law.”

<blockquote><p>II. What are the Parts of the law, and what their Differences? Laws are divine and human. Human laws are such as are instituted by men, and which bind certain persons to certain external duties concerning which there is no express divine precept or prohibition with a promise of reward and threatening of punishment, corporal and temporal. Human laws are either civil or ecclesiastical. Civil are such positive laws as are instituted by magistrates, or by some corporation, or state, in reference to a certain order or class of actions to be observed in the state in contracts, trials, punishments, &amp;c. Ecclesiastical, or ceremonial laws, are those which the church institutes in reference to the order which is to be observed in the ministry of the church, and which lay down certain prescriptions in reference to those things which contribute to the divine law…. Divine laws are those which God has instituted, which belong partly to angels, partly to men, and partly to certain classes of men. These do not only require external actions or obedience, but they also require internal qualities, actions and motives: nor do they merely propose temporal rewards and punishments; but also such as are spiritual and eternal. They are also the ends for which human laws are instituted. Of divine laws there are some that are eternal and unchangeable; whilst there are others that are changeable; yet only by God himself, who has instituted them. The divine law is ordinarily divided, or considered as consisting of three parts; the moral, the ceremonial and the judicial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, 34th Lord’s Day, ‘Of the 10 Commandments’, pp. 490-491</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>The enactment of law is the process by which the magistrate, with the consent of the optimates and estates of his imperium and realm, legislates what is fair, useful, and necessary to the commonwealth.4 The magistrate shall especially see that the customs, temperament, and ancient rights of the nation are respected, and that new laws are accommodated to them.</p></blockquote>

</figure><figure class="quote" id="q-95f1337787" data-kw="">

</figure><figure class="quote" id="q-8ac8089445" data-kw="">
<blockquote><p>But I consider that there is a wide difference between the case of a congregation or society in which the right [of ladies to vote for ecclesiastical officers] had been recognized, at least tacitly and by practice, and the case of another congregation or society which had never recognized it, but had uniformly acted on a different principle. In the latter case, I would think it my duty to continue the common practice, not only because it had been the custom, but also because I looked on it as well-founded. And if any individuals should complain that they were denied their rights, I would say to them, ‘You are not denied any rights which were ever recognized in the body of which you are members; and provided you think that the right of election is too much circumscribed by its laws or usages, the least thing that is incumbent on you is, to wait until you can obtain a rectification of the supposed evil in a regular way, and, in the meantime, to show me and those whose province it is to authorize the alteration, that our present practice and mode of management is faulty and unscriptural.’ … It is generally allowed that when he refers to ‘nature itself’, he means to include custom, which is in many cases the best expounder of those principles and feelings which are natural to man, and recognized by those who are unenlightened by divine revelation; and by the manner in which he appeals to it, the apostle teaches us that there is a regard due to such dictates even in what relates to the Church; as we are taught by several places of the New Testament, that, from inadvertence or from other causes, Christians and Christian Churches may fall into opinions and practices, which those who had only nature’s dim lamp to guide them avoided.</p></blockquote>

</figure><figure class="quote" id="q-c2efe17297" data-kw="">
<blockquote><p>There are two sorts of laws whereby God requires the obedience of his rational creatures, which are commonly called moral and positive… Positive laws are taken to be such as have no reason for them in themselves – nothing of the matter of them is taken from the things themselves commanded – but do depend merely and solely on the sovereign will and pleasure of God. Such were the laws and institutions of the sacrifices of old; and such are those which concern the sacraments and other things of the like nature under the New Testament. Moral laws are such as have the reasons of them taken from the nature of the things themselves required in them; for they are good from their respect to the nature of God himself, and from that nature and order of all things which he hath placed in creation. So that this sort of laws is but declarative of the absolute goodness of what they do require; the other is constitutive of it, as unto some certain ends. Laws positive, as they are occasionally given, so they are esteemed alterable at pleasure. Being fixed by mere will and prerogative, without respect to any thing that should make them necessary antecedent to their giving, they may by the same authority at any time be taken away and abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excercitation 4, ‘On the Causes of the Sabbath’</cite>, pp. 75-76 in A Treatise on the Sabbath… new ed., rev. &amp; ed. J.W. Brooks (London, 1829)</span></figcaption>

<blockquote><p>IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which He also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolical law given to Adam [Gen. 2:16-17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God). There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedently to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, Question 1, section 4, p. 2</span></figcaption>

</figure><figure class="quote" id="q-88f912c2be" data-kw="">
<blockquote><p>It’s the Law of Nature in general that the whole rule the part, but it follows not [that] therefore every member is to submit to every positive law of the whole though most unjust; the member is to submit to every Law of Nature commanded by the whole: The little finger infected with a gangrene is to submit to the whole man that it be cut off for the safety of the whole body, but its against particular nature that it be cut off, but most suitable to universal nature [regarding the whole]. So in the general it’s natural for the creature-rational to obey the Creator; but it follows not, but it’s a mere positive law that Peter give his life for the Gospel when God by a positive command calls him to it; and the law-positive, if divine, is not contrary to the law of universal-nature [of the whole].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 461</span></figcaption>

<blockquote><p>XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 18, pp. 12</span></figcaption>

<blockquote><p>VIII. Human Law is that which, from principles known by nature and experience, prescribes, sanctions, and commands to be observed certain particular conclusions and determinations, useful, honest, and necessary for the public and private good both of Church and Commonwealth, according to the reason and convenience of persons, things, times, places, and other circumstances: which laws, if they conflict with divine or natural right, are unworthy of the name of law, and in no way obligate the conscience of those who are subject either to observance or to punishment.</p></blockquote>

</figure><figure class="quote" id="q-1926b08cf8" data-kw="">
<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.”

<blockquote><p>5. Where it is said [in the Westminster Confession of Faith], ch. 21, sect. 7, that: ‘by a positive, moral and perpetual commandment, binding all men in all ages, He has particularly appointed one day in seven for a Sabbath,’ I understand it only of a virtual obligation, as much as belongs to the Law, as enacted before promulgation, but not of a true actual obligation. For no law can bind till it is promulgated; and positives are not promulgated by nature; therefore not to all men in all ages; therefore they bind not all men in all ages.</p></blockquote>

<blockquote><p>…He is a visible Head in this sense, in that he reigns and rules, even in the external visible policy of his Church, through all the catholic, visible Church, in his officers, lawful synods, ordinances, giving them laws in all positive externals… I shall believe that Christ must in all positive things of external policy, give to them particular laws in the Scripture and rule them [civil magistrates in his Church]; and that they being members, not the Head, must as particularly be ruled in all externals-positive, by the will and Law of the Head Christ… 2. The positives of the policy of Christ’s house must be congruous to a supernatural end, the edification of souls…</p></blockquote>

</figure><figure class="quote" id="q-0101761904" data-kw="">
<blockquote><p>…as in a Church in an island, where the pastors are dead or taken away by pest[ilence] or otherways; the people may ordain pastors or rather do that which may supply the defect of ordination, as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten. Yea and Flavianus and Diodorus preached in Antioch, as Theodoret says; yea, says Voetius, an ordinary ministry might be imposed on a laic, or private person by the Church, though the presbytery consent not, in case of necessity. God (says Gerson) may make an immediate intermission of a calling by bishops; yea (says Anton. speaking of necessity’s law) the Pope may commit power of excommunication, quia est de jure positive, pure laico &amp; mulieri, to one mere laic, or a woman; though we justify not this, yet it is hence concluded that God has not tied Himself to one set rule of ordinary, positive laws: a captive woman (as Socrates says) preached the Gospel to the king and queen of Iberranes, and they to the people of the land.</p></blockquote>

<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place. 33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17). 34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Mortifications [donations] given to religious uses by a positive law may be recalled by a more divine and stronger law of nature, such as this, ‘I will have mercy and not sacrifice.’ Suppose David, of his own proper heritage, had given the showbread to the priests; yet, when David and his men are famishing, he may take it back from them against their will. Suppose Christ had bought the ears of corn and dedicated them to the altar; yet might He and his disciples eat them in their hunger [Mt. 15:5-6]. The vessels of silver, dedicated to the church, may be taken and bestowed on wounded soldiers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843), p. 66 rt col</span></figcaption>

</figure><figure class="quote" id="q-2de2f2a80a" data-kw="">
<blockquote><p>I presuppose that the division of goods does not necessarily flow from the law of nature, for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]… If I have leave to permit that, in time of necessity, all things are common by God’s law, [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning: 1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth. 2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence. 3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner. 4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…</p></blockquote>

<blockquote><p>I conceive, though the State make a positive law, for order’s cause, that the king ordinarily convene parliaments; yet, if we dispute the matter in the court of conscience, the [parliamentary] estates have intrinsically (because they are the estates, and essentially judges of the land) ordinary power to convene themselves.</p></blockquote>

</figure><figure class="quote" id="q-9251b8fa2a" data-kw="">
<blockquote><p>Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843), p. 184 rt col</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.”

<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>

<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>

<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 220</span></figcaption>

</figure><figure class="quote" id="q-df04ad4eee" data-kw="">
<blockquote><p>God, to whom belongs the world and the fulness thereof, disponed to Abraham and his seed the land of Canaan for their inheritance and ordained that they should use their bow and their sword for the actual possession thereof; and the like divine right had David to the Edomites and Ammonites, though the occasion of David’s taking possession of these kingdoms by his sword did arise from particular and occasional exigencies and injuries; but it follows in no sort that, therefore, kings now wanting any word of promise, and so of divine right to any lands, may ascend to the thrones of other kingdoms than their own by no other title than the bloody sword. That God’s will was the chief patent here is clear, in that God forbade his people to conquer Edom, or Esau’s possession, when as He gave them command to conquer the Amorites. I doubt not to say, if Joshua and David had no better title than their bloody sword, though provoked by injuries, they could have had no right to any kingly power over these kingdoms; and if only success by the sword be a right of providence, it is no right of precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 49 rt col</span></figcaption>

<blockquote><p>Yea to kill a man is physically indifferent, for that is physically, yea morally, without relation to any law indifferent, which is capable of lawfulness or unlawfulness, according as it shall be commanded of, or forbidden by God. But for a man to kill his son, is of itself such, certain, if God command a judge to kill his son, it is lawful for the father to kill his son, if the Lord forbid Abraham to kill his son, it is unlawful for Abraham to kill his son.</p></blockquote>

</figure><figure class="quote" id="q-020063863f" data-kw="">
<blockquote><p>Answer: Though the violation of the general [moral] law hurts the conscience, it being against the Fifth Commandment; it follows not that the violation of every particular law, even that that is merely positive, hurts the conscience before God: For then the carrying of armor in the night [which is suspicious of violence and may be dangerous to a town], suppose no ruler on earth make a law there anent, should be a sin before God, which no wise-man can say. 2. The other reason is more important, and draws with it that school-question agitated by [civil] jurists also and [ecclesiastical] canonists, An ulla detur lex pure paenalis; ‘If there be a law purely penal,’ without sin in it: And if the law of rulers in things merely positive be merely penal and co-active, and not formally obliging [connected] to sin. But I Answer: Rulers do justly punish the transgression of a positive law, not as particularly human and positive: But as: 1. It has connection with the moral reason of the law. 2. As the particular transgression is scandalous and against order, in which case the formal object of the just punishment inflicted by the ruler, is in very deed not the simple omission of the positive act of a particular human law, but the violation of the moral goodness annexed to it, and of the scandal given. Now in this meaning, the transgression of the positive human law is not kindly [in its kind], per se, of itself punishable, but by accident, and so it binds the conscience by accident; and in this sense, great doctors, as Ambrose, Anselm, Theodoret, Chrysostom, Navarra, Felinus, Taraquel, say that human laws oblige the conscience. But the most learned of the [ecclesiastical] canonists aver that not to obey civil laws, laying aside the evil of scandal, is no mortal sin, and so does not involve the conscience in guiltiness before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), ch. 2, pp. 216-9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Answer: Though the violation of the general [moral] law hurts the conscience, it being against the Fifth Commandment; it follows not that the violation of every particular law, even that that is merely positive, hurts the conscience before God: For then the carrying of armor in the night [which is suspicious of violence and may be dangerous to a town], suppose no ruler on earth make a law there anent, should be a sin before God, which no wise-man can say. 2. The other reason is more important, and draws with it that school-question agitated by [civil] jurists also and [ecclesiastical] canonists, An ulla detur lex pure paenalis; ‘If there be a law purely penal,’ without sin in it: And if the law of rulers in things merely positive be merely penal and co-active, and not formally obliging [connected] to sin. But I Answer: Rulers do justly punish the transgression of a positive law, not as particularly human and positive: But as: 1. It has connection with the moral reason of the law. 2. As the particular transgression is scandalous and against order, in which case the formal object of the just punishment inflicted by the ruler, is in very deed not the simple omission of the positive act of a particular human law, but the violation of the moral goodness annexed to it, and of the scandal given. Now in this meaning, the transgression of the positive human law is not kindly [in its kind], per se, of itself punishable, but by accident, and so it binds the conscience by accident; and in this sense, great doctors, as Ambrose, Anselm, Theodoret, Chrysostom, Navarra, Felinus, Taraquel, say that human laws oblige the conscience. But the most learned of the [ecclesiastical] canonists aver that not to obey civil laws, laying aside the evil of scandal, is no mortal sin, and so does not involve the conscience in guiltiness before God.”

— Samuel Rutherford, The Divine Right of Church Government, … (1646), ch. 2, pp. 216-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer%3A+Though+the+violation+of+the+general+%5Bmoral%5D+law+hurts+the+conscience%2C+it+being+against+the+Fifth+Commandment%3B+it+follows+not+that+the+violation+of+every+particular+law%2C+even+that+that+is+merely+positive%2C+hurts+the+conscience+before+God%3A+For+then+the+carrying+of+armor+in+the+night+%5Bwhich+is+suspicious+of+violence+and+may+be+dangerous+to+a+town%5D%2C+suppose+no+ruler+on+earth+make+a+law+there+anent%2C+should+be+a+sin+before+God%2C+which+no+wise-man+can+say.+2.+The+other+reason+is+more+important%2C+and+draws+with+it+that+school-question+agitated+by+%5Bcivil%5D+jurists+also+and+%5Becclesiastical%5D+canonists%2C+An+ulla+detur+lex+pure+paenalis%3B+%E2%80%98If+there+be+a+law+purely+penal%2C%E2%80%99+without+sin+in+it%3A+And+if+the+law+of+rulers+in+things+merely+positive+be+merely+penal+and+co-active%2C+and+not+formally+obliging+%5Bconnected%5D+to+sin.+But+I+Answer%3A+Rulers+do+justly+punish+the+transgression+of+a+positive+law%2C+not+as+particularly+human+and+positive%3A+But+as%3A+1.+It+has+connection+with+the+moral+reason+of+the+law.+2.+As+the+particular+transgression+is+scandalous+and+against+order%2C+in+which+case+the+formal+object+of+the+just+punishment+inflicted+by+the+ruler%2C+is+in+very+deed+not+the+simple+omission+of+the+positive+act+of+a+particular+human+law%2C+but+the+violation+of+the+moral+goodness+annexed+to+it%2C+and+of+the+scandal+given.+Now+in+this+meaning%2C+the+transgression+of+the+positive+human+law+is+not+kindly+%5Bin+its+kind%5D%2C+per+se%2C+of+itself+punishable%2C+but+by+accident%2C+and+so+it+binds+the+conscience+by+accident%3B+and+in+this+sense%2C+great+doctors%2C+as+Ambrose%2C+Anselm%2C+Theodoret%2C+Chrysostom%2C+Navarra%2C+Felinus%2C+Taraquel%2C+say+that+human+laws+oblige+the+conscience.+But+the+most+learned+of+the+%5Becclesiastical%5D+canonists+aver+that+not+to+obey+civil+laws%2C+laying+aside+the+evil+of+scandal%2C+is+no+mortal+sin%2C+and+so+does+not+involve+the+conscience+in+guiltiness+before+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+ch.+2%2C+pp.+216-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F020063863f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/020063863f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=Answer%3A%20Though%20the%20violation%20of%20the,the%20conscience%20in%20guiltiness%20before%20God&amp;text=Answer%3A%20Though%20the%20violation%20of%20the%20general%20%5Bmoral&amp;text=not%20involve%20the%20conscience%20in%20guiltiness%20before%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a7deb7955d" data-kw="">
<blockquote><p>But our [prelate] doctors will have the commandments-positive of men to stand [upon the Church of Scotland], and the commandments of God, which are expressly of the law of nature to fall before their Dagon, and to lose all obligatory power, whereas God’s own positive-law yields, and loses obligatory power, when God’s natural commandment of mercy comes in competition with it, as is clear as the noon-day, in David famishing, who eat[s] the showbread, which by a positive law, was not lawful to any save the priests only, to eat, yet must man’s law stand and God’s law of nature fall at the pleasure of these Doctors.</p></blockquote>

</figure><figure class="quote" id="q-c39a02a1ae" data-kw="">
<blockquote><p>2. Public peace in all the commandments of superiors, in so far as can be without sin, obliges the conscience, as Heb. 12:14, ‘Follow peace with all men and godliness;’ Ps. 34:14, ‘Seek peace and follow after it;’ Rom. 12:18. 3. Subjection to the censures of rulers by suffering patiently is an obligation lying upon all private persons, 1 Pet. 2:20, ‘But if when ye do well and suffer for it, ye take it patiently, this is acceptable to God;’ Rom. 13:2, ‘Whosoever therefore resisteth the power, resisteth the ordinance of God.’ 4. Nothing in non-obeying unwarrantable commandments must be done that redounds to the discredit of the ruler or the hurting of his majesty and honor, 1 Pet. 2:17, ‘Honor the king;’ Eccl. 10:20, ‘Curse not the king: for even when we deny subjection or obedience-objective to that which they command, yet owe we obedience official, and all due respect and reverence to the person and eminent place of the ruler, as Acts 7:2, Steven calls them, Men, brethren and fathers, Acts. 7:51, and yet ‘stiffnecked resisters of the Holy Ghost.’</p></blockquote>

<blockquote><p>2nd Caution. When God gives some particular commandment to his people, dispensing with some other commandment of the moral law: for that time it binds not. For all the 10 commandments must be conceived with this condition, Except God command otherwise. Example 1. The Sixth Commandment is, ‘Thou shalt not kill’: but God gives a particular commandment to Abraham: ‘Abraham offer thy son Isaac in sacrifice to Me.’ And this latter commandment at that instant did bind Abraham: and he is therefore commended for his obedience to it. II. And when God commanded the children of Israel to compass Jericoh seven days and therefore on the Sabbath, the Fourth Commandment prescribing the sanctifying of rest on the Sabbath for that instant and in that action did not bind conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, … (Cambridge, 1596), pp. 15-16</span></figcaption>

<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>

</figure><figure class="quote" id="q-9e19da6b07" data-kw="">
<blockquote><p>But there is nothing so small in either doctrinals or policy [of the moral platform of Church government in the Word] so as men may alter, omit and leave off these smallest positive things that God has commanded; for Christ says [that] paying of tithe of mint, ought not to be omitted… We urge the immutability of Christ’s Laws, as well in the smallest as greatest things, though the commandments of Christ be greater or less in regard of the intrinsical matter… Yet they are both alike great, in regard of the authority of Christ the commander, Mt. 28:18-19. And it’s too great boldness to alter any commandment of Christ, for the smallness of the matter, for it lies upon our conscience, not because it is a greater or a lesser thing, and has degrees of obligatory necessity lying in it for the matter; but it ties us for the authority of the Lawgiver…</p></blockquote>

</figure><figure class="quote" id="q-3552d56983" data-kw="">
<blockquote><p>Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations: 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment; for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son; if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did Gods precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination-natural in a father to preserve the life of the child. So the positive command of the Father, that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die.</p></blockquote>

</figure><figure class="quote" id="q-dae3e85038" data-kw="">
<blockquote><p>Sometime he [Satan] tempts to lawful liberties, to ear, setting the Law of nature in opposition to the divine positive-law, Gen. 3. ‘The tree is good for meat;’ then God and Nature ordained it for food. In all which, holy Sovereignty gives influences natural to the tempter; nor will He have us to question his Sovereignty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace</cite>, … (London, 1659), pp. 110-111</span></figcaption>

— Samuel Rutherford, Influences of the Life of Grace, … (London, 1659), pp. 110-111">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSometime+he+%5BSatan%5D+tempts+to+lawful+liberties%2C+to+ear%2C+setting+the+Law+of+nature+in+opposition+to+the+divine+positive-law%2C+Gen.+3.+%E2%80%98The+tree+is+good+for+meat%3B%E2%80%99+then+God+and+Nature+ordained+it+for+food.+In+all+which%2C+holy+Sovereignty+gives+influences+natural+to+the+tempter%3B+nor+will+He+have+us+to+question+his+Sovereignty.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Influences+of+the+Life+of+Grace%2C+%E2%80%A6+%28London%2C+1659%29%2C+pp.+110-111&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdae3e85038.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/dae3e85038.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=Sometime%20he%20%5BSatan%5D%20tempts%20to%20lawful,have%20us%20to%20question%20his%20Sovereignty&amp;text=Sometime%20he%20%5BSatan%5D%20tempts%20to%20lawful%20liberties%2C%20to&amp;text=will%20He%20have%20us%20to%20question%20his%20Sovereignty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3b5a3f9db9" data-kw="">
<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…”

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>

<blockquote><p>However, all those things of which it cannot be said that God was not by necessity of nature bound to the other part of the contradiction (or in which we know that God can make or has actually made some change in the obligation) belong to positive right. Such were the symbolical law given to Adam and the ceremonial laws of the Old Testament (which depended on the free will of God). Here also the permission of sin is usually referred.</p></blockquote>

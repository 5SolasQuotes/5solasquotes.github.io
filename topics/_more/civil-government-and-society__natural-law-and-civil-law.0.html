ch+a+theory+was+deeply+shocking+since+it+emphasized+power+at+the+expense+of+authority%2C+and+subordinated+allegiance+to+self-interest.+The+debate+was+initiated+by+Francis+Rous+who+published+a+brief+pamphlet+in+April+1649+%5BThe+Lawfulness+of+Obeying+the+Present+Government%5D+in+which+he+argued+that+allegiance+could+be+given+to+the+Commonwealth+even+though+it+were+acknowledged+to+be+an+illegal+power.+It+was+a+radical+shift+in+the+basis+of+the+argument+that+was+to+be+followed+through+by+theorists+engaged+in+the+debate+on+de+facto+government.+In+the+debate+that+followed+Ascham+played+a+major+part+in+developing+a+theory+of+political+obligation+to+the+de+facto+power.+In+1649+it+is+possible+that+he+was+author+of+a+short+anonymous+pamphlet%2C+A+Combate+between+Two+Seconds.+One+for+Obeying+the+Present+Government.+The+Other+the+second+part+of+a+Demurrer+undeservedly+called+Religious%2C+which+was+published+in+July.+This+work+firstly+took+issue+with+those+whose+arguments+continued+to+be+based+on+Romans+13%3A1%E2%80%932+and+in+particular+addressed+the+arguments+in+an+anonymous+work+that+may+have+been+published+in+two+parts%2C+but+that+is+extant+only+in+its+second+part+entitled+The+Second+Part+of+the+Religious+Demurrer%3B+and+secondly+bypassed+the+critical+emphasis+on+Romans+13%3A1%E2%80%932+to+develop+arguments+based+on+the+need+to+protect+oneself+from+chaos%2C+as+originally+deployed+by+Ascham+in+his+1648+Discourse.+Having+thus+entered+the+pamphlet+%E2%80%9Cwar%E2%80%9D%2C+Ascham+then+began+to+expand+his+arguments.+He+was+certainly+the+author+of+a+longer+pamphlet%2C+The+Bounds+and+Bonds+of+Publique+Obedience%2C+which+appeared+in+August+1649%3B+and+by+November+he+had+added+nine+chapters+to+his+1648+Discourse%2C+which+now+appeared+under+the+title+Of+the+Confusions+and+Revolutions+of+Government.+This+work+attracted+the+attention+of+Robert+Sanderson+who+criticized+it+in+a+short+and+pungent+pamphlet+%5BResolutions+of+Conscience+%28by+a+learned+Divine%29+in+answer+to+a+letter+sent+with+Mr.+Ascham%E2%80%99s+Book%2C+Treating%2C+How+farre+it+may+be+lawful+to+submit+to+an+Usurped+Power.%5D.+Ascham%E2%80%99s+Reply+to+a+paper+of+Dr.+Sanderson%E2%80%99s%2C+containing+a+censure+of+Mr.+A.+A.+his+book+of+the+Confusions+and+Revolution+of+Government%2C+which+was+published+on+9+January+1650%2C+was+directed+as+much+as+against+Edward+Gee%E2%80%98s+Exercitation+concerning+usurped+powers+as+against+Sanderson%E2%80%99s+work.+In+these+works+Ascham%E2%80%99s+essential+argument+was+that+in+a+situation+in+which+people+had+to+look+after+their+own+safety%2C+they+were+justified+in+giving+their+allegiance+to+any+power+that+was+capable+of+protecting+them%2C+whatever+the+legality+of+its+title+to+power.+By+the+autumn+of+1649+the+debate+began+to+center+on+the+specific+question+of+the+Oath+of+Allegiance+and+the+Engagement+to+the+Commonwealth%3A+Two+Acts+of+Parliament+were+passed+requiring+people+to+take+an+Oath+of+Allegiance+to+the+Commonwealth%2C+on+11%2F12+October+1649%2C+and+on+2+January+1650.+Conventionally+oaths+were+regarded+as+%E2%80%9Cthe+strictest+ties+and+obligations+that+a+man+can+be+under%E2%80%9D.+For+many+the+Engagement+to+the+Commonwealth+was+impossible+to+take+because+it+overrode+their+prior+obligation+to+the+monarchy+%28King+Charles+I+and+his+heirs%29.+The+Presbyterian+Richard+Baxter+held+that+he+%E2%80%9Ccould+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%E2%80%9D.+%28Reliquiae+Baxterianae%2C+London%2C+1696%2C+p.+54%29+In+contrast%2C+Ascham+argued+that+all+oaths+involved+tacit+conditions%2C+of+which+the+ability+of+the+government+to+protect+the+people+was+the+main+one.+A+government+that+could+not+protect+its+people+lost+the+right+to+their+allegiance.+Ascham%E2%80%99s+1648+Discourse+was+to+be+republished%2C+anonymously%2C+following+the+ousting+of+King+James+II+%5Bin+1688%2F9%5D.+Then+the+question+of+the+legality+of+the+oath+of+allegiance+to+King+William+and+Queen+Mary+%5Bin+the+Glorious+Revolution%5D+had+ <blockquote><p>A Holy Commonwealth… is a candid confession as to why a conservative [congregationalist] Puritan fought for Parliament in the Civil War and gave his support to the Cromwells. Baxter publicly repudiated the work in 1670, and in 1683 the Oxford University authorities ordered it to be part of a book-burning that included the works of Hobbes and Milton.” – on Amazon Hale, Matthew – The Analysis of the Law 3rd ed. (d. 1676; n.p., n.d.) Hale (1609-1676) was an Anglican and influential barrister, judge and jurist most noted for his treatise, The History of the Pleas of the Crown. Hale’s early works, including, A Discourse of the Knowledge of God, reflect his early Puritan and Reformed background. After ca. 1660 his thought becomes more Arminian. Hale’s Analysis of the Common Law (below) is noted as the first published history of English law and a strong influence on William Blackstone’s Commentaries on the Laws of England. Hale’s jurisprudence struck a middle-ground between Edward Coke’s “appeal to reason” and John Selden’s “appeal to contract”, while refuting elements of Thomas Hobbes’s theory of natural law. Stair, James Dalrymple – The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations… (Edinburgh, 1681) Dalrymple (1619–1695), 1st Viscount of Stair, was a Scottish lawyer, statesman and had close relationships at times with leading covenanters. In 1662, as a judge, though it was required of him, he refused to declare the National Covenant and the Solemn League &amp; Covenant to be unlawful oaths. The work above shows influences from Stair’s philosophical training, his foreign travels, and continental jurists as well as English lawyers. In 1695 there was published a small volume entitled, A Vindication of the Divine Perfections, Illustrating the Glory of God in them by Reason and Revelation, methodically digested… It is undoubtedly Stair’s work, and was edited by the two Nonconformist divines, William Bates and John Howe. . 1700’s See below on Common Law &amp; English law. . 1800’s Thomas, John Penford – A Treatise of Universal Jurisprudence (London, 1829) ToC Bastiat, Frederic – The Law (1850; NY: 1964) Bastiat (1801–1850) was a French economist, writer and a prominent member of the French Liberal School. A Freemason and a member of the French National Assembly, Bastiat developed the economic concept of opportunity cost. As an advocate of classical economics and the economics of Adam Smith, his views favored a free market and influenced the Austrian School. Bastiat did most of his writing during the years just before — and immediately following — the Revolution of February 1848. This was the period when France was rapidly turning to complete socialism. As a Deputy to the Legislative Assembly, Bastiat was studying and explaining each socialist fallacy as it appeared. And he explained how socialism must inevitably degenerate into communism. But most of his countrymen chose to ignore his logic. Lindley, Nathaniel – An Introduction to the Study of Jurisprudence, being a translation of the general part of [Anton] Thibaut’s System Des Pandekten Rechts, with Notes &amp; Illustrations (London, 1855) Thibaut (1772–1840) was a German jurist. Wiki: “The fame of this book [of Thibaut’s] results from its being the first modern complete compendium of the subject, distinguished alike by the accuracy of its sources and the freedom and unpedantic manner in which the subject is handled. It is, in effect, a codification of the Roman law as it then obtained in Germany, modified by canon law and the practice of the courts into a comprehensive system of Pandect [Roman] law.</p></blockquote>

+Thibaut%E2%80%99s%5D+results+from+its+being+the+first+modern+complete+compendium+of+the+subject%2C+distinguished+alike+by+the+accuracy+of+its+sources+and+the+freedom+and+unpedantic+manner+in+which+the+subject+is+handled.+It+is%2C+in+effect%2C+a+codification+of+the+Roman+law+as+it+then+obtained+in+Germany%2C+modified+by+canon+law+and+the+practice+of+the+courts+into+a+comprehensive+system+of+Pandect+%5BRoman%5D+law.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Holy+Commonwealth%3A+or+Political+Aphorisms%2C+Opening+the+True+Principles+of+Government%3A+for+the+Healing+of+the+Mistakes%2C+%26+Resolving+the+Doubts%2C+that+Most+Endanger+England+at+this+Time%2C+%E2%80%A6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F90e68c39ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/90e68c39ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=A%20Holy%20Commonwealth,comprehensive%20system%20of%20Pandect%20%5BRoman%5D%20law&amp;text=A%20Holy%20Commonwealth&amp;text=into%20a%20comprehensive%20system%20of%20Pandect%20%5BRoman%5D%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

ce/#:~:text=10%2C%20Direction%207.%20Meddle%20not,would%20have%20others%20do%20by%20you&amp;text=10%2C%20Direction%207.%20Meddle%20not%20with%20lawsuits&amp;text=as%20you%20would%20have%20others%20do%20by%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is an indispensable duty to forgive; we are not bound to trust an enemy, but we are bound to forgive him… It is with going to law as it is with going to war; when the just rights of a nation are invaded, it is lawful to go to war; so when a man’s estate is trespassed upon by another, he may go to law to recover it. But the law must be used in the last place; when no entreaties or arbitrations will prevail, then the chancery must decide it. Yet this is no revenge, it is not so much to injure another, as to right one’s self, which may be, and yet we may live in charity.</p></blockquote>

<blockquote><p>Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>

<blockquote><p>7. They hold, that the oath ex officio [out of duty], whereby Popish and English ecclesiastical governors, either upon some secret informations or suggestions, or private susicions go about to bind men’s consciences to accuse themselves and their friends of such crimes or imputations as cannot by any direct course of law be proved against them, and whereby they are drawn to be instruments of many heavy crosses upon themselves and their friends, and that often for those actions that they are persuaded in their consciences are good and holy: I say that they hold that such an oath (on the urger’s part) is most damnable and tyrannous, against the very law of Nature, devised by Antichrist, through the inspiration of the Devil; that by means thereof the professors and practicers of the true religion might either in their weakness, by perjury damn their own souls or be drawn to reveal to the enemies of Christianity those secret religious acts and deeds, that being in the persuasion of their consciences for the advancement of the Gospel, will be a means of heavy sentences of condemnation against themselves and their dearest friends.</p></blockquote>

</figure><figure class="quote" id="q-38a59f0360" data-kw="">
<blockquote><p>Only thus much I should advise, that if it be known that any person is guilty of a capital crime (as for example of adultery) though we be not bound alway to accuse them openly, or to bring them to such a confession or self-accusation as may hazard their lives, yet: 1. The pastor may suspend them and in some cases require the people to avoid them when the fact is publicly known (though the party not prosecuted) and give but a general intimation of the fault, as known already; though perhaps the evidence will not hold in law. (As I have known persons that openly confess adultery at home, but denying it before the judge, come off as if they were innocent; and yet confess it again when they come home.) And I should think that such persons should not be re-admitted to Communion, till they do manifest public serious penitence in the congregation: but only in general terms (seeing they are not bound to accuse themselves, so as to expose their lives to danger), as thus: ‘I confess before God and this congregation that I am a heinous sinner, and unworthy of communion with the Church: the particulars I need not express, seeing the congregation may easily know my meaning, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Only thus much I should advise, that if it be known that any person is guilty of a capital crime (as for example of adultery) though we be not bound alway to accuse them openly, or to bring them to such a confession or self-accusation as may hazard their lives, yet: 1. The pastor may suspend them and in some cases require the people to avoid them when the fact is publicly known (though the party not prosecuted) and give but a general intimation of the fault, as known already; though perhaps the evidence will not hold in law. (As I have known persons that openly confess adultery at home, but denying it before the judge, come off as if they were innocent; and yet confess it again when they come home.) And I should think that such persons should not be re-admitted to Communion, till they do manifest public serious penitence in the congregation: but only in general terms (seeing they are not bound to accuse themselves, so as to expose their lives to danger), as thus: ‘I confess before God and this congregation that I am a heinous sinner, and unworthy of communion with the Church: the particulars I need not express, seeing the congregation may easily know my meaning, etc.&#x27;”

</figure><figure class="quote" id="q-dd27223d60" data-kw="">
<blockquote><p>Question 9: Is a man ever bound to accuse himself, and seek justice against himself? Answer 1: In many cases a man is bound to punish himself: As when the law against swearing, cursing or the like, does give the poor a certain mulct [fine] which is the penalty: He ought to give that money himself: And in cases where it is a necessary cure to himself: And in any case where the public good requires it: As if a magistrate offend whom none else will punish, or who is the judge in his own cause: he should so far punish himself as is necessary to the suppression of sin, and to the preserving of the honor of the laws: As I have heard of a justice that swore twenty oaths, and paid his twenty shillings for it. 2. A man may be bound in such a divine vengeance or judgment as seeks after his particular sin, to offer himself to be a sacrifice to justice, to stop the judgement: As Jonah and Achan did. 3. A man may be bound to confess his guilt and offer himself to justice to save the innocent, who is falsely accused and condemned for his crime. 4. But in ordinary cases a man is not bound to be his own public accuser or executioner. Question 10: May a witness voluntarily speak that truth which he knows will further an unrighteous cause, and be made use of to oppress the innocent? Answer: He may never do it as a confederate in that intention: Nor may he do it when he knows that it will tend to such an event (though threatened or commanded) except when some weightier accident does preponderate for the doing it (as the avoiding of a greater hurt to others than it will bring on the oppressed, etc.). Question 11: May a witness conceal some part of the truth? Answer: Not when he swears to deliver the whole truth: nor when a good cause is like[ly] to suffer, or a bad cause to be furthered by the concealment: nor when he is under any other obligation to reveal the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>

<blockquote><p>1. An unrighteous judge does condemn the cause of God Himself: For every righteous cause is his. 2. …It is a damnable sin not to relieve the innocent and imprisoned in their distress, when we have power… 3. It is a turning of the remedy into a double misery; and taking away the only help of oppressed innocency. What other defense has innocency, but Law and Justice? And when their refuge itself does fall upon them and oppress them, whither shall the righteous fly? 4. It subverts laws and government, and abuses it to destroy the ends which it is appointed for. 5. Thereby it turns human society into a state of misery, like the depredations of hostility. 6. It is a deliberate resolved sin, and not done in a passion by surprise: It is committed in that place, and in that form, as acts of greatest deliberation should be done: As if he should say, upon full disquisition, evidence and deliberation, I condemn this person, and his cause. 7. All this is done as in the Name of God, and by his own commission, by one that pretends to be his officer or minister, Rom. 3:3- 6. For the judgement is the Lord’s; 2 Chron. 19:8-10 &amp; 19:5-7. And how great a wickedness is it thus to blaspheme, and to represent Him as Satan, an enemy to truth and righteousness, to his servants and Himself?… 8. It is sin against the fullest and frequentest prohibitions of God. Read over Ex. 23:1-3, etc.; Lev. 10:15; Dt. 1:16-17 &amp; 16:18; Isa. 1:17, 20, 23; Dt. 24:17 &amp; 27:19, ‘Cursed be he that perverts the judgement of the stranger, the fatherless and widow, and all the people shall say Amen’; Ezra 7:26; Ps. 33:5 &amp; 37:28 &amp; 72:2 &amp; 94:15 &amp; 106:3,30; Prov. 17:27 &amp; 19:28 &amp; 20:8 &amp; 29:4 &amp; 31:5; Eccl. 5:8; Isa. 5:7 &amp; 10:2 &amp; 56:1-2 &amp; 59:14-15; Jer. 5:1 &amp; 7:5 &amp; 9:24; Eze. 18:8 &amp; 45:9; Hos. 12:6; Amos 5:7,15,24 &amp; 6:12; Mic. 3:9; Zech. 7:9 &amp; 8:16; Gen. 18:19; Prov. 21:3,7,15. I cite not the words to avoid prolixity… 9. False judges cause the poor to appeal to God against them, and the cries of the afflicted shall not be forgotten, Lk. 18:5-8. 10. They call for God’s judgement upon themselves, and devolve the work into his hands… Ps. 9:7-9, ‘The Lord hath prepared his throne for judgement, and he shall judge the world in righteousness, he shall minister judgement to the people in uprightness; he will be a refuge for the oppressed;’ Ps. 37:6, ‘He will bring forth righteousness as the light, and thy judgement as the noon day;’ Ps. 89:14, ‘Justice and judgement are the habitation of his throne;’ Ps. 103:6, ‘The Lord executeth righteousness and judgement for all that are oppressed;’ Ps. 146:7. In a word, the sentence of an unjust Judge is passed against his own soul, and he calls to God to condemn him righteously, who unrighteously condemned others. Of all men, he cannot stand in judgement, nor abide the righteous doom of Christ.</p></blockquote>

<blockquote><p>1st Conclusion. The members of the visible-Church are not mere lictors [those who execute judicial decisions] and executioners of the sentences of the eldership: 1. Because they are to observe, warn, watch over the manners of their fellow members and to teach, exhort and admonish one another; and are guilty if they be deficient in that; 2. Because by the law of charity, as they are brethren under one head Christ, they are to warn and admonish their rulers.</p></blockquote>

<blockquote><p>This is a received maxim also: Quod tangit omnes, ab omnibus, suo more, tractari debet. ‘What concerns all, should be agitated by all, according to their degrees of concernment’; but excommunication of a person, in a consociated Church, concerns all the consociated Churches in a presbytery: all are scandalized; all may be, and are in danger to be leavened with the infectious lump.</p></blockquote>

<blockquote><p>1st Distinction. There be odds betwixt a free willing people executing the sentence of the Church, and mere executioners and lictors [those who execute judicial sentences]. 2nd Distinction. There is a doubting of conscience-speculative, through ignorance of some circumstance of the fact; and a doubt of conscience practical through ignorance of something, which one is obliged to know, and so there is also a speculative and a practical certainty of a thing. 3rd Distinction. There is one certainty required in questione juris, in ‘a question of law’, and another in questione facti, in ‘question of fact’. 4th Distinction. There is, and may be an ignorance-invincible which a man cannot help, in a question of fact; but Papists and schoolmen err who maintain an invincible ignorance in questione juris, in ‘a question of law’, and in this they lay imperfection on God’s Word. 5th Distinction. There is a moral diligence given for knowledge of a thing which suffices to make the ignorance excusable, and there is a moral diligence not sufficient. 6th Distinction. There is a sentence manifestly unjust as the condemning of Christ by witnesses belying one another, and a sentence doubtsomely false. … 3rd Conclusion. There is not required the like certainty of conscience-practical in a question of fact, that is required in a question of law: 1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word. 2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’ 3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin. All soldiers in war and lictors, and these who execute the sentence of excommunication, are to know what are the just causes of war and what crimes by God’s Law deserve death and what not, as what homicide, sorcery, parricide, incest and the like sins deserve by God’s Law, and what not: because every one is obliged to know morally what concerns his conscience, that he be not guilty before God; the executioner who beheaded John Baptist sinned, because he was obliged to know this [much]: a prophet who rebukes incest in a king ought not to be put to death; therefore [the conclusion follows]; it was unlawful for the men of Judah to come and make war with Jeroboam and the ten tribes because God forbade that war, 1 Kings 12:23-24. 4th Conclusion. It is not enough that some say: if the question be negatively-just, then soldiers and executioners and people may execute the sentence; that is, if they see no unlawfulness in the fact, I mean unlawfulness in materia juris, in ‘a matter of law’. Hence some say subjects and common soldiers not admitted to the secrets of the council of war may fight lawfully when there is this negative-justice in the war; but foreign soldiers who are conduced [brought in], may not do so, for the [Scriptural] law says he is not free of a fault who intermeddles with matters which belong not to him, to the hurt of others; so teaches Suarez, D. Bannes and Dr. Duvallius; Yet the command of the prince can remove no doubt of conscience; also that the cause of the war in the matter of law, so far as it is agreeable to God’s Word, is not manifest to executioners, is there culpable ignorance no less than the ignorance of a sentence manifestly unjust; Ergo [Therefore], the practice of these who execute a sentence negatively-only-just, is not lawful. I prove the antecedent: [1.] because the practical ignorance of what we do which is not warranted by God’s Word, is always culpable, whether the cause be clear or dark: for no obscurity of God’s Law does excuse our ignorant practice when the Word of God can sufficiently resolve us. 2. It is not enough that our moral actions in their lawfulness be just-negatively; because actions moral which are beside the Word of God (praeter dei verbum) to us, who hold God’s Word [to be] perfect in faith and manners, are also, contra dei verbum, against the Word of God, and so unlawful. 3. Because actions-moral, having no warrant but the sole will and commandment of superiors, are undertaken upon the sole faith that what superiors command, if it seem not to us unjust, though it be in itself unjust, may lawfully be done. Now we condemn this in schoolmen and Popish causuists, that the commandment of superiors (as says Gregory de Valent., Bannes, Suarez, Silvester, Navarre) may take away and remove all doubting of conscience and make the action lawful. Whereas Navarre, Corduba, Sylvester [and] Adrian hold that an action done without a due practical-certainty is unlawful. If he should diligently (says Suarez) search for the truth, and cannot find it, yet the doubter may practice, so he practically persuade himself, he does it out of a good mind; and whereas the Jesuit says that it is his negligence in not seeking the truth, he answers, his negligence which is by past cannot have influence in his present action, to make it unlawful, because it is past and gone. But I answer: it is physically past, but it is morally present to infect the action, as habitual ignorance makes the acts of unbelief morally worse or ill. And to these we may add that he who does with such a doubt: 1. He sins, because he does not in faith; 2. He exposes himself to the hazard of sinning and of joining with an unjust sentence. 3. It is the corrupt doctrine of Papists, who muzzle up the people in ignorance and discharge them to read God’s Word, and so maintain (because of the obscurity and imperfection of God’s Word, which is not able to determine all questions) that there is an ignorance of many lawful duties which is invincible and to be excused as no ways sinful and which vitiates not our moral actions; so Thomas, Bonaventura, Richard, Gabriele, Occam, Antoninus, Adrianus, Almaine, Suarez, though Occam and Almain may be expounded favorably. 5th Conclusion. Soldiers, lictors, servants [and] people under the eldership are not mere instruments moved only by superiors, as schoolmen say: 1. Because they are moral agents and are no less to obey in faith than superiors are to command in faith, and they are to obey their superiors only in the Lord. 2. They are to give all diligence that they be not accessory to unjust sentences, lest they partake of other men’s sins. What Aquinas, Greg. de Valent. and And. Duvallius says against this, is not to be stood upon. 6th Conclusion. But in questione facti, in matters of fact, there is not required that certainty of conscience. But that we may more clearly understand the conclusion, a question of fact is taken three ways: 1. For a fact expressly set down in God’s Word, as that Moses led the people through the wilderness, that Cain slew his brother Abel, these are questions de facto [in fact], not questiones facti [questions of fact], and must be believed as Almaine and Occam say well, with that same certainty by which we believe God’s Word. 2. A question of fact is [sometimes] taken for a question [which is actually mixed]: the subject whereof is a matter of fact, but the attribute is a matter of law: as if Christ, in saying He was the Son of God, did blaspheme; if the Lord’s priests, in giving David showbread, did commit treason against King Saul; there is some question there made circa factum, about the fact, but it is formally a question of law. For these questions may be cleared by God’s Word, and the ignorance of any questions which may be cleared by God’s Word is vincible [able to be overcome] and culpable, for the law says [that,] ‘The ignorance of these things which we are obliged to know is culpable’, and excuses not. But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no [1 Cor. 5], whether Titus committed murder or no; and in this there is sometimes invincible ignorance when all diligence morally-possible is given, to come to the knowledge of the fact. Now we know here [that] the question of law must be proved by the law; all are obliged in conscience to know what sins deserve death and excommunication. But whether this man John, Anna, Marie has committed such sins, is a question of fact and cannot be proved by the law or the Word of God, for the Law is not anent singulars or particulars; this is proved by sense and the testimony of witnesses, and therefore the certainty-practical of conscience here is human and fallible, not divine and infallible. Now, though soldiers, lictors or people join to the execution of a sentence, and have their doubtings anent the fidelity of the witnesses, yet when all diligence morally possible is given to try the matter, they may well be said to do in faith, though they have not certainty of faith concerning the fact, because there cannot be certainty of divine faith in facts; men’s confession, sense [and] the testimony of witnesses cannot breed divine faith: yea here the judge himself may condemn the innocent, and yet the sentence of the judge may be most just because the witnesses are liars, and the judge gives out that sentence in faith, because God’s Word has commanded him to proceed secundum allegata &amp; probata [according to what is alleged and proved]: he must give sentence under two or three witnesses. Yea, though the judge saw with his eyes the guilty commit the fact, yet he cannot by God’s Law condemn him, but upon the testimony of witnesses. For the wise Lord sees what confusion and tyranny should follow if one might be both index, actor and testis, the judge, the accuser, and the witness. And when the judge gives out a sentence to absolve the guilty and condemn the innocent, his sentence is judicially and formally just, and materially and by accident, and contrary to his intention only, unjust; If the judge in that case should say (as Master Weemes observes well) [that] ‘such a proposition is true, when he knows it to be false, and being posed and urged in conscience, is this an innocent man or no?’ If he should answer and say [that] he is not, [or] should he then answer contrary to his knowledge? But as a judge he must answer: he is not innocent, because witnesses, being with all possible diligence examined, have condemned him; and it is no inconvenience here to say that the judge has one conscience as a man and another contrary conscience as a judge in the question of fact; for God has tied his conscience as a judge to the fidelity of witnesses, known not to be false. I desire the reader to see anent this more in Bonaventura, Richardus, Occam, Antoninus, Adrian and our countryman John Weems [Exposition of the Laws of Moses (1632), vol. 2, ch. 17, ‘Whether a Judge is Bound to Give Sentence According to Things Proved &amp; Alleged, or According to his Own Private Knowledge’, pp. 66-70] and Henricus. Now because souldiers, lictors and people are not judges, if they know the fact in law deserves such and such punishments, where the sentence is not manifestly false and unjust, but in the matter of law just, though erroneous in the matter of fact, all possible diligence being used by the judges, they are to execute that sentence upon the testimony of the judges, though they be not personally present at the proceedings of the judges and eldership, which may be proved many ways: 1. By the confession of our [congregationalist] brethren, if any of the congregation be absent by sickness, childbirth-pain, trading over sea, imprisonment, the congregation does justly put away from amongst them the incestuous Corinthian, and they who are absent are to repute the party excommunicate[d], as a heathen; as their own practice is at censures in the weekday, the largest half of the congregation is absent, yet the absent upon the testimony of the Church hold valid what is done by the Church. 2. Other sister-Churches, who ought not [necessarily] to be present at Church-censures, as our [congregationalist] Brethren teach, are to repute the excommunicate[d] cast out by a sister Church-independent (as they say) as a heathen, because being bound in Heaven: here, is he not bound in a Church-visible, one mile distant from the Church excommunicating? Yet this is no tyranny of conscience. 3. Women are to execute the sentence and to eschew the company of the party excommunicated, yet are they not to be present as judges to usurp authority over the men. This [John] Robinson grants. 4. This should evert all judicatories of peace and war, so many thousands, Acts 2, could not be present at every act of censure and that daily, nor are acts of discipline necessarily tied to the Lord’s Day. They are (I grant) acts of divine worship, but the whole multitude of women and children are deprived of the liberty that God has given them for six days to the works of their calling, if they must be personally present at all the acts of discipline, to cognosce of all scandals, and to here and receive testimonies against elders under two or three witnesses, which is the office of Timothy, this way the overseeing of the manners of the people, which also our Brethren lay upon the whole people, takes up the great part of the pastor’s office and the whole office of ruling elders. And if we lay upon the people the work and all the acts of the office, how can we not lay upon them the office itself? 5. All Israel, gathered to war from Dan to Beersheba, could not, by virtue of duty and obligation, be present personally at the determination of lawful war: Nay, if they were all present as judges, as Mr. Ainsworth would have them, there [would] be no governors and feeders in Israel, but all the governed are feeders, and so no magistrate and ruler, as Anabaptists teach here: 1. It were not lawful for one to be king over more people than he could in his own personal presence judge, contrary to God’s Word, that teaches us to obey these who are sent by the supreme magistrate, as we obey the king, 1 Pet. 2:13-14. Therefore, these who are sent by him are lawful judges, and yet the king judges by them and in them. 2. This error is founded upon a worse error, to wit, that the supreme magistrate had no power of life and death in Israel without consent of the people, but certainly there are as specious and plausible reasons, if not more specious, for the peoples’ government in all civil matters than there can be for their Church-power of judging in the Church-matters and [the] government thereof. Yet there is no ground for it. 1. Because the rulers only could not be charged to execute judgement in the morning, to deliver the oppressed, to execute judgement for the fatherless and the widow; nor can there be a promise made to establish the king’s throne for obeying that commandment, as God’s Word teaches, if the people have as great, yea, greater power in judging than the rulers have by this our Brethren’s argument. They say all the believers at Corinth, 1 Cor. 5, could not be commanded to cast out the incestuous person, nor could they all be taxed for omitting that duty, if they had not power to excommunicate. 2. Neither can the Spirit of God complaint that the judges builded Zion with blood, and the heads of the house of Jacob and princes of the house of Israel did abhor judgement and pervert equity, as the prophets say, nor could they be condemned as roaring lions and ravening wolves, as the prophet says: for the judge might well be faultless when the poor were crushed in the gate and judgment turned into gall and wormwood, because they cannot help the matter: the people are the greatest part in carrying matters in judgment. 2. We see David’s practice in condemning the Amalakite out of his own confession, not asking the people’s consent, and in condemning to death Baanah and Rehab, for killing Ishbosheth. Solomon gave sentence against Adonijah, Joab [and] Shimei without consent of the people; David pardoned Shimei contrary to the counsel of Zerviah’s sons. 3. If from the people’s witnessing and hearing of judgment in the gate we conclude [that] the people were judges with the rulers, there was never a time when there was no king in Israel and no judge to put evil doers to shame, but every man did what seemed good in his own eyes, contrary to Scripture because all are a generation of kings and princes no less than the ruler himself, as Anabaptists teach. By the doctrine of our brethren, I deny not but he that gathered sticks on the Sabbath was brought, Num. 15:33, to Moses and to Aaron and to all the congregation, but the congregation signifies not the common multitude. For [verse] 35, Moses received the sentence from God and pronounced it, and the congregation stoned him to death; and Num. 27:1, The daughters of Zelophehad stood before Moses, Eleazar and before the princes as judges, and before all the congregation as witnesses, not as judges: but vv. 6-7, Moses gave out the judicial sentence from the Lord’s mouth. And 1 Kings 21:12, Naboth stood in presence of the people to be judged, but the nobles and princes were his judges, because, v. 8, Jezabel wrote to the nobles and princes that v. 10, they should carry out Naboth and stone him, to wit, judicially, and v. 11, the nobles and princes did as Jezabel had sent unto them. And Jeremiah, ch. 26, pleaded his cause before the princes and people, for v. 10, the princes [text in Hebrew] set down (judicially) in the entry of the new gate of the Lord’s House: nothing can be gathered from the place to prove that the people judged, but because Jeremiah spake to the princes and the people, who, verse 24, were in a fury and rage against Jeremiah, if Ahikam had not saved him from their violence.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1st Distinction. There be odds betwixt a free willing people executing the sentence of the Church, and mere executioners and lictors [those who execute judicial sentences]. 2nd Distinction. There is a doubting of conscience-speculative, through ignorance of some circumstance of the fact; and a doubt of conscience practical through ignorance of something, which one is obliged to know, and so there is also a speculative and a practical certainty of a thing. 3rd Distinction. There is one certainty required in questione juris, in ‘a question of law’, and another in questione facti, in ‘question of fact’. 4th Distinction. There is, and may be an ignorance-invincible which a man cannot help, in a question of fact; but Papists and schoolmen err who maintain an invincible ignorance in questione juris, in ‘a question of law’, and in this they lay imperfection on God’s Word. 5th Distinction. There is a moral diligence given for knowledge of a thing which suffices to make the ignorance excusable, and there is a moral diligence not sufficient. 6th Distinction. There is a sentence manifestly unjust as the condemning of Christ by witnesses belying one another, and a sentence doubtsomely false. … 3rd Conclusion. There is not required the like certainty of conscience-practical in a question of fact, that is required in a question of law: 1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word. 2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’ 3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin. All soldiers in war and lictors, and these who execute the sentence of excommunication, are to know what are the just causes of war and what crimes by God’s Law deserve death and what not, as what homicide, sorcery, parricide, incest and the like sins deserve by God’s Law, and what not: because every one is obliged to know morally what concerns his conscience, that he be not guilty before God; the executioner who beheaded John Baptist sinned, because he was obliged to know this [much]: a prophet who rebukes incest in a king ought not to be put to death; therefore [the conclusion follows]; it was unlawful for the men of Judah to come and make war with Jeroboam and the ten tribes because God forbade that war, 1 Kings 12:23-24. 4th Conclusion. It is not enough that some say: if the question be negatively-just, then soldiers and executioners and people may execute the sentence; that is, if they see no unlawfulness in the fact, I mean unlawfulness in materia juris, in ‘a matter of law’. Hence some say subjects and common soldiers not admitted to the secrets of the council of war may fight lawfully when there is this negative-justice in the war; but foreign soldiers who are conduced [brought in], may not do so, for the [Scriptural] law says he is not free of a fault who intermeddles with matters which belong not to him, to the hurt of others; so teaches Suarez, D. Bannes and Dr. Duvallius; Yet the command of the prince can remove no doubt of conscience; also that the cause of the war in the matter of law, so far as it is agreeable to God’s Word, is not manifest to executioners, is there culpable ignorance no less than the ignorance of a sentence manifestly unjust; Ergo [Therefore], the practice of these who execute a sentence negatively-only-just, is not lawful. I prove the antecedent: [1.] because the practical ignorance of what we do which is not warranted by God’s Word, is always culpable, whether the cause be clear or dark: for no obscurity of God’s Law does excuse our ignorant practice when the Word of God can sufficiently resolve us. 2. It is not enough that our moral actions in their lawfulness be just-negatively; because actions moral which are beside the Word of God (praeter dei verbum) to us, who hold God’s Word [to be] perfect in faith and manners, are also, contra dei verbum, against the Word of God, and so unlawful. 3. Because actions-moral, having no warrant but the sole will and commandment of superiors, are undertaken upon the sole faith that what superiors command, if it seem not to us unjust, though it be in itself unjust, may lawfully be done. Now we condemn this in schoolmen and Popish causuists, that the commandment of superiors (as says Gregory de Valent., Bannes, Suarez, Silvester, Navarre) may take away and remove all doubting of conscience and make the action lawful. Whereas Navarre, Corduba, Sylvester [and] Adrian hold that an action done without a due practical-certainty is unlawful. If he should diligently (says Suarez) search for the truth, and cannot find it, yet the doubter may practice, so he practically persuade himself, he does it out of a good mind; and whereas the Jesuit says that it is his negligence in not seeking the truth, he answers, his negligence which is by past cannot have influence in his present action, to make it unlawful, because it is past and gone. But I answer: it is physically past, but it is morally present to infect the action, as habitual ignorance makes the acts of unbelief morally worse or ill. And to these we may add that he who does with such a doubt: 1. He sins, because he does not in faith; 2. He exposes himself to the hazard of sinning and of joining with an unjust sentence. 3. It is the corrupt doctrine of Papists, who muzzle up the people in ignorance and discharge them to read God’s Word, and so maintain (because of the obscurity and imperfection of God’s Word, which is not able to determine all questions) that there is an ignorance of many lawful duties which is invincible and to be excused as no ways sinful and which vitiates not our moral actions; so Thomas, Bonaventura, Richard, Gabriele, Occam, Antoninus, Adrianus, Almaine, Suarez, though Occam and Almain may be expounded favorably. 5th Conclusion. Soldiers, lictors, servants [and] people under the eldership are not mere instruments moved only by superiors, as schoolmen say: 1. Because they are moral agents and are no less to obey in faith than superiors are to command in faith, and they are to obey their superiors only in the Lord. 2. They are to give all diligence that they be not accessory to unjust sentences, lest they partake of other men’s sins. What Aquinas, Greg. de Valent. and And. Duvallius says against this, is not to be stood upon. 6th Conclusion. But in questione facti, in matters of fact, there is not required that certainty of conscience. But that we may more clearly understand the conclusion, a question of fact is taken three ways: 1. For a fact expressly set down in God’s Word, as that Moses led the people through the wilderness, that Cain slew his brother Abel, these are questions de facto [in fact], not questiones facti [questions of fact], and must be believed as Almaine and Occam say well, with that same certainty by which we believe God’s Word. 2. A question of fact is [sometimes] taken for a question [which is actually mixed]: the subject whereof is a matter of fact, but the attribute is a matter of law: as if Christ, in saying He was the Son of God, did blaspheme; if the Lord’s priests, in giving David showbread, did commit treason against King Saul; there is some question there made circa factum, about the fact, but it is formally a question of law. For these questions may be cleared by God’s Word, and the ignorance of any questions which may be cleared by God’s Word is vincible [able to be overcome] and culpable, for the law says [that,] ‘The ignorance of these things which we are obliged to know is culpable’, and excuses not. But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no [1 Cor. 5], whether Titus committed murder or no; and in this there is sometimes invincible ignorance when all diligence morally-possible is given, to come to the knowledge of the fact. Now we know here [that] the question of law must be proved by the law; all are obliged in conscience to know what sins deserve death and excommunication. But whether this man John, Anna, Marie has committed such sins, is a question of fact and cannot be proved by the law or the Word of God, for the Law is not anent singulars or particulars; this is proved by sense and the testimony of witnesses, and therefore the certainty-practical of conscience here is human and fallible, not divine and infallible. Now, though soldiers, lictors or people join to the execution of a sentence, and have their doubtings anent the fidelity of the witnesses, yet when all diligence morally possible is given to try the matter, they may well be said to do in faith, though they have not certainty of faith concerning the fact, because there cannot be certainty of divine faith in facts; men’s confession, sense [and] the testimony of witnesses cannot breed divine faith: yea here the judge himself may condemn the innocent, and yet the sentence of the judge may be most just because the witnesses are liars, and the judge gives out that sentence in faith, because God’s Word has commanded him to proceed secundum allegata &amp; probata [according to what is alleged and proved]: he must give sentence under two or three witnesses. Yea, though the judge saw with his eyes the guilty commit the fact, yet he cannot by God’s Law condemn him, but upon the testimony of witnesses. For the wise Lord sees what confusion and tyranny should follow if one might be both index, actor and testis, the judge, the accuser, and the witness. And when the judge gives out a se — Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, ... (1644), Ch. 3, Section 3, Question 4, ‘Whether or No is there a Necessity of the Personal Presence of the Whole Church in All the Acts of Church-Censures?’, pp. 41-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st+Distinction.+There+be+odds+betwixt+a+free+willing+people+executing+the+sentence+of+the+Church%2C+and+mere+executioners+and+lictors+%5Bthose+who+execute+judicial+sentences%5D.+2nd+Distinction.+There+is+a+doubting+of+conscience-speculative%2C+through+ignorance+of+some+circumstance+of+the+fact%3B+and+a+doubt+of+conscience+practical+through+ignorance+of+something%2C+which+one+is+obliged+to+know%2C+and+so+there+is+also+a+speculative+and+a+practical+certainty+of+a+thing.+3rd+Distinction.+There+is+one+certainty+required+in+questione+juris%2C+in+%E2%80%98a+question+of+law%E2%80%99%2C+and+another+in+questione+facti%2C+in+%E2%80%98question+of+fact%E2%80%99.+4th+Distinction.+There+is%2C+and+may+be+an+ignorance-invincible+which+a+man+cannot+help%2C+in+a+question+of+fact%3B+but+Papists+and+schoolmen+err+who+maintain+an+invincible+ignorance+in+questione+juris%2C+in+%E2%80%98a+question+of+law%E2%80%99%2C+and+in+this+they+lay+imperfection+on+God%E2%80%99s+Word.+5th+Distinction.+There+is+a+moral+diligence+given+for+knowledge+of+a+thing+which+suffices+to+make+the+ignorance+excusable%2C+and+there+is+a+moral+diligence+not+sufficient.+6th+Distinction.+There+is+a+sentence+manifestly+unjust+as+the+condemning+of+Christ+by+witnesses+belying+one+another%2C+and+a+sentence+doubtsomely+false.+%E2%80%A6+3rd+Conclusion.+There+is+not+required+the+like+certainty+of+conscience-practical+in+a+question+of+fact%2C+that+is+required+in+a+question+of+law%3A+1.+Because+in+a+question+of+law+all+ignorance+is+moral+and+culpably+evil+to+any+who+undertakes+actions+upon+conscience+of+obedience+to+others%3B+for+to+all+within+the+visible+Church+the+Word+of+God+is+exactly+perfect+for+faith+and+manners%2C+and+everyone+is+obliged+to+know+all+conclusions+of+law+that+are+determinable+by+God%E2%80%99s+Word.+2.+Every+one+in+his+actions+is+to+do+out+of+a+plerophory%2C+and+a+full+persuasion%2C+of+heart%2C+that+what+he+does+pleases+God%2C+Rom.+14%3A14%2C+%E2%80%98I+know+and+am+persuaded+by+the+Lord+Jesus+that+nothing+is+unclean+of+itself.%E2%80%99+3.+We+are+to+do+nothing+but+what+is+lawful+and+what+in+our+consciences+we+are+persuaded+is+lawful%2C+and+are+to+know+what+is+sin+and+what+is+no+sin.+All+soldiers+in+war+and+lictors%2C+and+these+who+execute+the+sentence+of+excommunication%2C+are+to+know+what+are+the+just+causes+of+war+and+what+crimes+by+God%E2%80%99s+Law+deserve+death+and+what+not%2C+as+what+homicide%2C+sorcery%2C+parricide%2C+incest+and+the+like+sins+deserve+by+God%E2%80%99s+Law%2C+and+what+not%3A+because+every+one+is+obliged+to+know+morally+what+concerns+his+conscience%2C+that+he+be+not+guilty+before+God%3B+the+executioner+who+beheaded+John+Baptist+sinned%2C+because+he+was+obliged+to+know+this+%5Bmuch%5D%3A+a+prophet+who+rebukes+incest+in+a+king+ought+not+to+be+put+to+death%3B+therefore+%5Bthe+conclusion+follows%5D%3B+it+was+unlawful+for+the+men+of+Judah+to+come+and+make+war+with+Jeroboam+and+the+ten+tribes+because+God+forbade+that+war%2C+1+Kings+12%3A23-24.+4th+Conclusion.+It+is+not+enough+that+some+say%3A+if+the+question+be+negatively-just%2C+then+soldiers+and+executioners+and+people+may+execute+the+sentence%3B+that+is%2C+if+they+see+no+unlawfulness+in+the+fact%2C+I+mean+unlawfulness+in+materia+juris%2C+in+%E2%80%98a+matter+of+law%E2%80%99.+Hence+some+say+subjects+and+common+soldiers+not+admitted+to+the+secrets+of+the+council+of+war+may+fight+lawfully+when+there+is+this+negative-justice+in+the+war%3B+but+foreign+soldiers+who+are+conduced+%5Bbrought+in%5D%2C+may+not+do+so%2C+for+the+%5BScriptural%5D+law+says+he+is+not+free+of+a+fault+who+intermeddles+with+matters+which+belong+not+to+him%2C+to+the+hurt+of+others%3B+so+teaches+Suarez%2C+D.+Bannes+and+Dr.+Duvallius%3B+Yet+the+command+of+the+prince+can+remove+no+doubt+of+conscience%3B+also+that+the+cause+of+the+war+in+the+matter+of+law%2C+so+far+as+it+is+agreeable+to+God%E2%80%99s+Word%2C+is+not+manifest+to+executioners%2C+is+there+culpable+ignorance+no+less+than+the+ignorance+of+a+sentence+manifestly+unjust%3B+Ergo+%5BTherefore%5D%2C+the+practice+of+these+who+execute+a+sentence+negatively-only-just%2C+is+not+lawful.+I+prove+the+antecedent%3A+%5B1.%5D+because+the+practical+ignorance+of+what+we+do+which+is+not+warranted+by+God%E2%80%99s+Word%2C+is+always+culpable%2C+whether+the+cause+be+clear+or+dark%3A+for+no+obscurity+of+God%E2%80%99s+Law+does+excuse+our+ignorant+practice+when+the+Word+of+God+can+sufficiently+resolve+us.+2.+It+is+not+enough+that+our+moral+actions+in+their+lawfulness+be+just-negatively%3B+because+actions+moral+which+are+beside+the+Word+of+God+%28praeter+dei+verbum%29+to+us%2C+who+hold+God%E2%80%99s+Word+%5Bto+be%5D+perfect+in+faith+and+manners%2C+are+also%2C+contra+dei+verbum%2C+against+the+Word+of+God%2C+and+so+unlawful.+3.+Because+actions-moral%2C+having+no+warrant+but+the+sole+will+and+commandment+of+superiors%2C+are+undertaken+upon+the+sole+faith+that+what+superiors+command%2C+if+it+seem+not+to+us+unjust%2C+though+it+be+in+itself+unjust%2C+may+lawfully+be+done.+Now+we+condemn+this+in+schoolmen+and+Popish+causuists%2C+that+the+commandment+of+superiors+%28as+says+Gregory+de+Valent.%2C+Bannes%2C+Suarez%2C+Silvester%2C+Navarre%29+may+take+away+and+remove+all+doubting+of+conscience+and+make+the+action+lawful.+Whereas+Navarre%2C+Corduba%2C+Sylvester+%5Band%5D+Adrian+hold+that+an+action+done+without+a+due+practical-certainty+is+unlawful.+If+he+should+diligently+%28says+Suarez%29+search+for+the+truth%2C+and+cannot+find+it%2C+yet+the+doubter+may+practice%2C+so+he+practically+persuade+himself%2C+he+does+it+out+of+a+good+mind%3B+and+whereas+the+Jesuit+says+that+it+is+his+negligence+in+not+seeking+the+truth%2C+he+answers%2C+his+negligence+which+is+by+past+cannot+have+influence+in+his+present+action%2C+to+make+it+unlawful%2C+because+it+is+past+and+gone.+But+I+answer%3A+it+is+physically+past%2C+but+it+is+morally+present+to+infect+the+action%2C+as+habitual+ignorance+makes+the+acts+of+unbelief+morally+worse+or+ill.+And+to+these+we+may+add+that+he+who+does+with+such+a+doubt%3A+1.+He+sins%2C+because+he+does+not+in+faith%3B+2.+He+exposes+himself+to+the+hazard+of+sinning+and+of+joining+with+an+unjust+sentence.+3.+It+is+the+corrupt+doctrine+of+Papists%2C+who+muzzle+up+the+people+in+ignorance+and+discharge+them+to+read+God%E2%80%99s+Word%2C+and+so+maintain+%28because+of+the+obscurity+and+imperfection+of+God%E2%80%99s+Word%2C+which+is+not+able+to+determine+all+questions%29+that+there+is+an+ignorance+of+many+lawful+duties+which+is+invincible+and+to+be+excused+as+no+ways+sinful+and+which+vitiates+not+our+moral+actions%3B+so+Thomas%2C+Bonaventura%2C+Richard%2C+Gabriele%2C+Occam%2C+Antoninus%2C+Adrianus%2C+Almaine%2C+Suarez%2C+though+Occam+and+Almain+may+be+expounded+favorably.+5th+Conclusion.+Soldiers%2C+lictors%2C+servants+%5Band%5D+people+under+the+eldership+are+not+mere+instruments+moved+only+by+superiors%2C+as+schoolmen+say%3A+1.+Because+they+are+moral+agents+and+are+no+less+to+obey+in+faith+than+superiors+are+to+command+in+faith%2C+and+they+are+to+obey+their+superiors+only+in+the+Lord.+2.+They+are+to+give+all+diligence+that+they+be+not+accessory+to+unjust+sentences%2C+lest+they+partake+of+other+men%E2%80%99s+sins.+What+Aquinas%2C+Greg.+de+Valent.+and+And.+Duvallius+says+against+this%2C+is+not+to+be+stood+upon.+6th+Conclusion.+But+in+questione+facti%2C+in+matters+of+fact%2C+there+is+not+required+that+certainty+of+conscience.+But+that+we+may+more+clearly+understand+the+conclusion%2C+a+question+of+fact+is+taken+three+ways%3A+1.+For+a+fact+expressly+set+down+in+God%E2%80%99s+Word%2C+as+that+Moses+led+the+people+through+the+wilderness%2C+that+Cain+slew+his+brother+Abel%2C+these+are+questions+de+facto+%5Bin+fact%5D%2C+not+questiones+facti+%5Bquestions+of+fact%5D%2C+and+must+be+believed+as+Almaine+and+Occam+say+well%2C+with+that+same+certainty+by+which+we+believe+God%E2%80%99s+Word.+2.+A+question+of+fact+is+%5Bsometimes%5D+taken+for+a+question+%5Bwhich+is+actually+mixed%5D%3A+the+subject+whereof+is+a+matter+of+fact%2C+but+the+attribute+is+a+matter+of+law%3A+as+if+Christ%2C+in+saying+He+was+the+Son+of+God%2C+did+blaspheme%3B+if+the+Lord%E2%80%99s+priests%2C+in+giving+David+showbread%2C+did+commit+treason+against+King+Saul%3B+there+is+some+question+there+made+circa+factum%2C+about+the+fact%2C+but+it+is+formally+a+question+of+law.+For+these+questions+may+be+cleared+by+God%E2%80%99s+Word%2C+and+the+ignorance+of+any+questions+which+may+be+cleared+by+God%E2%80%99s+Word+is+vincible+%5Bable+to+be+overcome%5D+and+culpable%2C+for+the+law+says+%5Bthat%2C%5D+%E2%80%98The+ignorance+of+these+things+which+we+are+obliged+to+know+is+culpable%E2%80%99%2C+and+excuses+not.+But+thirdly%2C+a+question+of+fact+is+properly+a+question+whether+this+Corinthian+committed+incest+or+no+%5B1+Cor.+5%5D%2C+whether+Titus+committed+murder+or+no%3B+and+in+this+there+is+sometimes+invincible+ignorance+when+all+diligence+morally-possible+is+given%2C+to+come+to+the+knowledge+of+the+fact.+Now+we+know+here+%5Bthat%5D+the+question+of+law+must+be+proved+by+the+law%3B+all+are+obliged+in+conscience+to+know+what+sins+deserve+death+and+excommunication.+But+whether+this+man+John%2C+Anna%2C+Marie+has+committed+such+sins%2C+is+a+question+of+fact+and+cannot+be+proved+by+the+law+or+the+Word+of+God%2C+for+the+Law+is+not+anent+singulars+or+particulars%3B+this+is+proved+by+sense+and+the+testimony+of+witnesses%2C+and+therefore+the+certainty-practical+of+conscience+here+is+human+and+fallible%2C+not+divine+and+infallible.+Now%2C+though+soldiers%2C+lictors+or+people+join+to+the+execution+of+a+sentence%2C+and+have+their+doubtings+anent+the+fidelity+of+the+witnesses%2C+yet+when+all+diligence+morally+possible+is+given+to+try+the+matter%2C+they+may+well+be+said+to+do+in+faith%2C+though+they+have+not+certainty+of+faith+concerning+the+fact%2C+because+there+cannot+be+certainty+of+divine+faith+in+facts%3B+men%E2%80%99s+confession%2C+sense+%5Band%5D+the+testimony+of+witnesses+cannot+breed+divine+faith%3A+yea+here+the+judge+himself+may+condemn+the+innocent%2C+and+yet+the+sentence+of+the+judge+may+be+most+just+because+the+witnesses+are+liars%2C+and+the+judge+gives+out+that+sentence+in+faith%2C+because+God%E2%80%99s+Word+has+commanded+him+to+proceed+secundum+allegata+%26+probata+%5Baccording+to+what+is+alleged+and+proved%5D%3A+he+must+give+sentence+under+two+or+three+witnesses.+Yea%2C+though+the+judge+saw+with+his+eyes+the+guilty+commit+the+fact%2C+yet+he+cannot+by+God%E2%80%99s+Law+condemn+him%2C+but+upon+the+testimony+of+witnesses.+For+the+wise+Lord+sees+what+confusion+and+tyranny+should+follow+if+one+might+be+both+index%2C+actor+and+testis%2C+the+judge%2C+the+accuser%2C+and+the+witness.+And+when+the+judge+gives+out+a+sentence+to+absolve+the+guilty+and+condemn+the+innocent%2C+his+sentence+is+judicially+and+formally+just%2C+and+materially+and+by+accident%2C+and+contrary+to+his+intention+only%2C+unjust%3B+If+the+judge+in+that+case+should+say+%28as+Master+Weemes+observes+well%29+%5Bthat%5D+%E2%80%98such+a+proposition+is+true%2C+when+he+knows+it+to+be+false%2C+and+being+posed+and+urged+in+conscience%2C+is+this+an+innocent+man+or+no%3F%E2%80%99+If+he+should+answer+and+say+%5Bthat%5D+he+is+not%2C+%5Bor%5D+should+he+then+answer+contrary+to+his+knowledge%3F+But+as+a+judge+he+must+answer%3A+he+is+not+innocent%2C+because+witnesses%2C+being+with+all+possible+diligence+examined%2C+have+condemned+him%3B+and+it+is+no+inconvenience+here+to+say+that+the+judge+has+one+conscience+as+a+man+and+another+contrary+conscience+as+a+judge+in+the+question+of+fact%3B+for+God+has+tied+his+conscience+as+a+judge+to+the+fidelity+of+witnesses%2C+known+not+to+be+false.+I+desire+the+reader+to+see+anent+this+more+in+Bonaventura%2C+Richardus%2C+Occam%2C+Antoninus%2C+Adrian+and+our+countryman+John+Weems+%5BExposition+of+the+Laws+of+Moses+%281632%29%2C+vol.+2%2C+ch.+17%2C+%E2%80%98Whether+a+Judge+is+Bound+to+Give+Sentence+According+to+Things+Proved+%26+Alleged%2C+or+According+to+his+Own+Private+Knowledge%E2%80%99%2C+pp.+66-70%5D+and+Henricus.+Now+because+souldiers%2C+lictors+and+people+are+not+judges%2C+if+they+know+the+fact+in+law+deserves+such+and+such+punishments%2C+where+the+sentence+is+not+manifestly+false+and+unjust%2C+but+in+the+matter+of+law+just%2C+though+erroneous+in+the+matter+of+fact%2C+all+possible+diligence+being+used+by+the+judges%2C+they+are+to+execute+that+sentence+upon+the+testimony+of+the+judges%2C+though+they+be+not+personally+present+at+the+proceedings+of+the+judges+and+eldership%2C+which+may+be+proved+many+ways%3A+1.+By+the+confession+of+our+%5Bcongregationalist%5D+brethren%2C+if+any+of+the+congregation+be+absent+by+sickness%2C+childbirth-pain%2C+trading+over+sea%2C+imprisonment%2C+the+congregation+does+justly+put+away+from+amongst+them+the+incestuous+Corinthian%2C+and+they+who+are+absent+are+to+repute+the+party+excommunicate%5Bd%5D%2C+as+a+heathen%3B+as+their+own+practice+is+at+censures+in+the+weekday%2C+the+largest+half+of+the+congregation+is+absent%2C+yet+the+absent+upon+the+testimony+of+the+Church+hold+valid+what+is+done+by+the+Church.+2.+Other+sister-Churches%2C+who+ought+not+%5Bnecessarily%5D+to+be+present+at+Church-censures%2C+as+our+%5Bcongregationalist%5D+Brethren+teach%2C+are+to+repute+the+excommunicate%5Bd%5D+cast+out+by+a+sister+Church-independent+%28as+they+say%29+as+a+heathen%2C+because+being+bound+in+Heaven%3A+here%2C+is+he+not+bound+in+a+Church-visible%2C+one+mile+distant+from+the+Church+excommunicating%3F+Yet+this+is+no+tyranny+of+conscience.+3.+Women+are+to+execute+the+sentence+and+to+eschew+the+company+of+the+party+excommunicated%2C+yet+are+they+not+to+be+present+as+judges+to+usurp+authority+over+the+men.+This+%5BJohn%5D+Robinson+grants.+4.+This+should+evert+all+judicatories+of+peace+and+war%2C+so+many+thousands%2C+Acts+2%2C+could+not+be+present+at+every+act+of+censure+and+that+daily%2C+nor+are+acts+of+discipline+necessarily+tied+to+the+Lord%E2%80%99s+Day.+They+are+%28I+grant%29+acts+of+divine+worship%2C+but+the+whole+multitude+of+women+and+children+are+deprived+of+the+liberty+that+God+has+given+them+for+six+days+to+the+works+of+their+calling%2C+if+they+must+be+personally+present+at+all+the+acts+of+discipline%2C+to+cognosce+of+all+scandals%2C+and+to+here+and+receive+testimonies+against+elders+under+two+or+three+witnesses%2C+which+is+the+office+of+Timothy%2C+this+way+the+overseeing+of+the+manners+of+the+people%2C+which+also+our+Brethren+lay+upon+the+whole+people%2C+takes+up+the+great+part+of+the+pastor%E2%80%99s+office+and+the+whole+office+of+ruling+elders.+And+if+we+lay+upon+the+people+the+work+and+all+the+acts+of+the+office%2C+how+can+we+not+lay+upon+them+the+office+itself%3F+5.+All+Israel%2C+gathered+to+war+from+Dan+to+Beersheba%2C+could+not%2C+by+virtue+of+duty+and+obligation%2C+be+present+personally+at+the+determination+of+lawful+war%3A+Nay%2C+if+they+were+all+present+as+judges%2C+as+Mr.+Ainsworth+would+have+them%2C+there+%5Bwould%5D+be+no+governors+and+feeders+in+Israel%2C+but+all+the+governed+are+feeders%2C+and+so+no+magistrate+and+ruler%2C+as+Anabaptists+teach+here%3A+1.+It+were+not+lawful+for+one+to+be+king+over+more+people+than+he+could+in+his+own+personal+presence+judge%2C+contrary+to+God%E2%80%99s+Word%2C+that+teaches+us+to+obey+these+who+are+sent+by+the+supreme+magistrate%2C+as+we+obey+the+king%2C+1+Pet.+2%3A13-14.+Therefore%2C+these+who+are+sent+by+him+are+lawful+judges%2C+and+yet+the+king+judges+by+them+and+in+them.+2.+This+error+is+founded+upon+a+worse+error%2C+to+wit%2C+that+the+supreme+magistrate+had+no+power+of+life+and+death+in+Israel+without+consent+of+the+people%2C+but+certainly+there+are+as+specious+and+plausible+reasons%2C+if+not+more+specious%2C+for+the+peoples%E2%80%99+government+in+all+civil+matters+than+there+can+be+for+their+Church-power+of+judging+in+the+Church-matters+and+%5Bthe%5D+government+thereof.+Yet+there+is+no+ground+for+it.+1.+Because+the+rulers+only+could+not+be+charged+to+execute+judgement+in+the+morning%2C+to+deliver+the+oppressed%2C+to+execute+judgement+for+the+fatherless+and+the+widow%3B+nor+can+there+be+a+promise+made+to+establish+the+king%E2%80%99s+throne+for+obeying+that+commandment%2C+as+God%E2%80%99s+Word+teaches%2C+if+the+people+have+as+great%2C+yea%2C+greater+power+in+judging+than+the+rulers+have+by+this+our+Brethren%E2%80%99s+argument.+They+say+all+the+believers+at+Corinth%2C+1+Cor.+5%2C+could+not+be+commanded+to+cast+out+the+incestuous+person%2C+nor+could+they+all+be+taxed+for+omitting+that+duty%2C+if+they+had+not+power+to+excommunicate.+2.+Neither+can+the+Spirit+of+God+complaint+that+the+judges+builded+Zion+with+blood%2C+and+the+heads+of+the+house+of+Jacob+and+princes+of+the+house+of+Israel+did+abhor+judgement+and+pervert+equity%2C+as+the+prophets+say%2C+nor+could+they+be+condemned+as+roaring+lions+and+ravening+wolves%2C+as+the+prophet+says%3A+for+the+judge+might+well+be+faultless+when+the+poor+were+crushed+in+the+gate+and+judgment+turned+into+gall+and+wormwood%2C+because+they+cannot+help+the+matter%3A+the+people+are+the+greatest+part+in+carrying+matters+in+judgment.+2.+We+see+David%E2%80%99s+practice+in+condemning+the+Amalakite+out+of+his+own+confession%2C+not+asking+the+people%E2%80%99s+consent%2C+and+in+condemning+to+death+Baanah+and+Rehab%2C+for+killing+Ishbosheth.+Solomon+gave+sentence+against+Adonijah%2C+Joab+%5Band%5D+Shimei+without+consent+of+the+people%3B+David+pardoned+Shimei+contrary+to+the+counsel+of+Zerviah%E2%80%99s+sons.+3.+If+from+the+people%E2%80%99s+witnessing+and+hearing+of+judgment+in+the+gate+we+conclude+%5Bthat%5D+the+people+were+judges+with+the+rulers%2C+there+was+never+a+time+when+there+was+no+king+in+Israel+and+no+judge+to+put+evil+doers+to+shame%2C+but+every+man+did+what+seemed+good+in+his+own+eyes%2C+contrary+to+Scripture+because+all+are+a+generation+of+kings+and+princes+no+less+than+the+ruler+himself%2C+as+Anabaptists+teach.+By+the+doctrine+of+our+brethren%2C+I+deny+not+but+he+that+gathered+sticks+on+the+Sabbath+was+brought%2C+Num.+15%3A33%2C+to+Moses+and+to+Aaron+and+to+all+the+congregation%2C+but+the+congregation+signifies+not+the+common+multitude.+For+%5Bverse%5D+35%2C+Moses+received+the+sentence+from+God+and+pronounced+it%2C+and+the+congregation+stoned+him+to+death%3B+and+Num.+27%3A1%2C+The+daughters+of+Zelophehad+stood+before+Moses%2C+Eleazar+and+before+the+princes+as+judges%2C+and+before+all+the+congregation+as+witnesses%2C+not+as+judges%3A+but+vv.+6-7%2C+Moses+gave+out+the+judicial+sentence+from+the+Lord%E2%80%99s+mouth.+And+1+Kings+21%3A12%2C+Naboth+stood+in+presence+of+the+people+to+be+judged%2C+but+the+nobles+and+princes+were+his+judges%2C+because%2C+v.+8%2C+Jezabel+wrote+to+the+nobles+and+princes+that+v.+10%2C+they+should+carry+out+Naboth+and+stone+him%2C+to+wit%2C+judicially%2C+and+v.+11%2C+the+nobles+and+princes+did+as+Jezabel+had+sent+unto+them.+And+Jeremiah%2C+ch.+26%2C+pleaded+his+cause+before+the+princes+and+people%2C+for+v.+10%2C+the+princes+%5Btext+in+Hebrew%5D+set+down+%28judicially%29+in+the+entry+of+the+new+gate+of+the+Lord%E2%80%99s+House%3A+nothing+can+be+gathered+from+the+place+to+prove+that+the+people+judged%2C+but+because+Jeremiah+spake+to+the+princes+and+the+people%2C+who%2C+verse+24%2C+were+in+a+fury+and+rage+against+Jeremiah%2C+if+Ahikam+had+not+saved+him+from+their+violence.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+...+%281644%29%2C+Ch.+3%2C+Section+3%2C+Question+4%2C+%E2%80%98Whether+or+No+is+there+a+Necessity+of+the+Personal+Presence+of+the+Whole+Church+in+All+the+Acts+of+Church-Censures%3F%E2%80%99%2C+pp.+41-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe20a76224e.html&amp;via=5Solas" target="_blank" rel="noopener">Share o <blockquote><p>7. We take it that the 15th Proposition contains the true mean between the usurped power of some pastors to bind the people, by a known erring sentence, to go against God’s Word; and the usurped power which many pretend to, of ruling the Church by their major vote. But how far the congregation should first have cognisance of the matter, or be heard in the debate; or how far the ministers must endeavor their consent, or suspend their own actions for want of their consent, we do not determine. And therefore all moderate presbyterians and Independents may well agree with us in this; because it’s no power that we deny the pastors, but a power of binding men to go against God’s Word; and it is not any of their liberty that we deny the people, but only ruling ministerial authority, which God never gave them, we must needs deny them.</p></blockquote>

<blockquote><p>Question 12: Must a judge and jury proceed secundum allegata &amp; probata, ‘according to evidence and proof’, when they know the witness to be false and the truth to be contrary to the testimony, but are not able to evince [prove] it? Answer: Distinguish between the negative and the positive part of the verdict or sentence: In the negative they must go according to the evidence and testimonies, unless the Law of the land leave the case to their private knowledge. As for example: They must not sentence a thief or murderer to be punished upon their secret unproved knowledge; They must not adjudge either moneys or lands to the true owner from another without sufficient evidence and proof; They must forbear doing justice because they are not called to it, nor enabled. But positively they may do no injustice upon any evidence or witness against their own knowledge of the truth: As they may not upon known false witness, give away any man’s lands or money, or condemn the innocent: But [they] must in such a case renounce the office: The judge must come off the bench, and the jury protest that they will not meddle or give any verdict (whatever come of it): Because God and the Law of Nature prohibit their injustice. Objection: ‘It is the Law that does it, and not we.’ Answer: It is the Law and you: and the Law cannot justify your agency in any unrighteous sentence. The case is plain and past dispute.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Question 12: Must a judge and jury proceed secundum allegata &amp; probata, ‘according to evidence and proof’, when they know the witness to be false and the truth to be contrary to the testimony, but are not able to evince [prove] it? Answer: Distinguish between the negative and the positive part of the verdict or sentence: In the negative they must go according to the evidence and testimonies, unless the Law of the land leave the case to their private knowledge. As for example: They must not sentence a thief or murderer to be punished upon their secret unproved knowledge; They must not adjudge either moneys or lands to the true owner from another without sufficient evidence and proof; They must forbear doing justice because they are not called to it, nor enabled. But positively they may do no injustice upon any evidence or witness against their own knowledge of the truth: As they may not upon known false witness, give away any man’s lands or money, or condemn the innocent: But [they] must in such a case renounce the office: The judge must come off the bench, and the jury protest that they will not meddle or give any verdict (whatever come of it): Because God and the Law of Nature prohibit their injustice. Objection: ‘It is the Law that does it, and not we.’ Answer: It is the Law and you: and the Law cannot justify your agency in any unrighteous sentence. The case is plain and past dispute.”

</figure><figure class="quote" id="q-c4481efc4d" data-kw="">
<blockquote><p>Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto. 8. What is denied jure to ecumenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecumenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … 1658, pp. 107-8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

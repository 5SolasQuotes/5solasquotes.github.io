<blockquote><p>We see not how letters of recommendation, most lawful as we judge, and necessary, can resign ministerial power, a liberty bought with Christ’s blood (as you say) to any other church, for we think all the visible Churches are one catholic visible Church and should have a visible communion, and so that there is no resignation of ministerial power in these letters, but they are declaratory of the Christian behavior of the dismissed Christian. We ask if dimissory letters be authoritative and done by the church as the church, and how can a church usurp authority (by your way) over a sister church to recommend a sojourner to a church-state and church liberties and seals of the Covenant? one church has no authority over another. If these letters be merely private and merely declaratory, to manifest and declare the sojourner’s Christian behavior, only then he had power and right without these letters or any act of resignation, or giving away ministerial power, to be a Church-member of the visible Church to the which he goes. Therefore, he was a member of the visible Church to which he goes before the dimissory letters were written; and the letters do resign no right but only notify and declare the sojourner’s preexistent right, and so there is a visible Church and a visible communion of all congregations on earth, and must be an external power and authority in all for synods. Let our [congregationalist] brethren see to this. [Margin note:] It is true, none should remove from one congregation to another without God go before them, nor can they change countries without God’s warranting direction, Gen 12:1; 46:4, but that such removal is a matter of Church-discipline, and must be done by a ministerial power, is unwarranted by any word of God. 3. [In congregationalism] The person to remove must be dismissed and loosed by the consent of the whole congregation (if conveniency permit) else he is not exonered of his church-oath made to that congregation; What if conveniency do not permit? then is he loosed from an oath without consent of the Church, which did by oath receive him. I thinkejusdem potestatis est(as the law says) ligare et solvere, ‘that’ Church ‘power which binds must loose.’ 4. If the [man-drawn-up] church-covenant be an everlasting covenant, as Jer. 50:5 [which the congregationalists proof-texted], tying the man to the membership of that particular congregation forever, I see not how the church can use [letters of transfer like] indulgences and Pope-like dispensations against the oath of God, to break it upon light and frivolous reasons [such as moving, etc.]; for if God punish covenant breaking, so also should the church, and can by no indulgence be accessory to the breach of God’s oath; there is too great a smell of Popery, Arminianism, and Socinianism in this way in my weak judgement. But if the man be not sworn a member of that particular church by his oath, he is sworn a member of the visible Church universal, which our brethren cannot well say. Neither is any covenant called an everlasting covenant in the Scripture but the Covenant of Grace, Jer. 31:33; 32:40; Isa. 54:9-10, and that is made with the invisible catholic Church of believers, as is the Covenant [in] Jer. 50:5, and not a Covenant with one visible congregation; and what warrant has the Church to dispense with the breach of such an everlasting Covenant? 5. The testimony of other churches, if it be a warrant to you, in faith, to receive into the church such a one as a saint and a temple of the Holy Spirit, how should it not also be a warrant to you to cast out and excommunicate also? 6. The person coming from another Church, if of approven piety, is received, by lifting up of the hands, or silence of the church, as you say: 1. Have we a warrant from God’s Word for such a new inchurching? 2. Why is he not received by a church oath? as a minister transplanted to another church must have ordination and election of new [according to congregationalists], for to you there is alike reason. 3. If there be no need of a new church oath to make him a member of that visible congregation, seeing now he is loosed from the former, you insinuate his former church-oath did make him a member of a visible church, and so he that is a visible member in a church, is a visible member of all, and so there must be a visible Church-catholic, if there be a catholic visible membership in any one member, and so you destroy what you build.</p></blockquote>

<blockquote><p>1. Particular converts are first converted into the Church-catholic entitive, and secondarily conjoined into particular consociations, for the more opportune enjoyment of ordinances actually and constantly. … 7. They that are only in the Church-catholic visible are not ‘without’ in the apostle’s sense [1 Cor. 5:12]. … 10. The being in the general Covenant [of Grace] gives right to the ordinances, and not any particular covenant; neither do we find any mention in Scripture of any particular covenant either urged or used at admission of members into a particular congregation, or at the constitution thereof. … 12. The departure of a member from a particular congregation and removal to another for convenience or by necessity is no sin; but departing from the Church-catholic, and ceasing to be a member thereof, is a sin.</p></blockquote>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

<blockquote><p>Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.</p></blockquote>

<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>

<blockquote><p>IV. As to the people’s case, it needs no other answer: 1. No member may remove without cause: 2. Nor abruptly and uncharitably to the church’s dissatisfaction, when he may avoid it. But 3. He may remove upon many just causes (private or public) whether the church and pastors consent or not, so the manner be as becomes a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory: a Sum of Practical Theology and Cases of Conscience (1673), pt. 3, Christian Ecclesiastics, Question 104, ‘Is a pastor obliged to his flock for life? Or is it lawful so to oblige himself? And may he remove without their consent? And so also of a church-member, the same questions are put.’ Baxter was a congregationalist.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-0ee44f02bd" data-kw="">
<blockquote><p>It is a common infirmity with many men to wish their opinions turned into laws. They think certain things right and expedient, and instead of being content to act on their own judgment, and allow others to act on theirs, they desire their view of the matter to be made obligatory on all their brethren… Another thinks that a regular dismission of a Church member should be given only in certain cases, and he wishes his private judgment to be turned into a public law. In an extended Church like ours, there are few evils which ought to be more sedulously avoided than excessive legislation. Leave as much liberty to all concerned as possible, if you wish to preserve peace or union. As to this question of communion, it is well known that there are two very different views arising out of different theories of the nature and design of the Church. The one view is that of the great body of the Christian world, and is the clear doctrine of our standards. It assumes that the terms of Christian communion are unalterably fixed in the Word of God, and can be neither increased nor diminished by any human authority. This is one great principle. Another is, that nothing can justly be required as a term of Christian communion, which Christ has not made necessary to admission to heaven. In other words, that we are bound to receive and treat as Christian brethren all whom Christ receives as disciples. We are not to make ourselves stricter or holier than He… Every Church must receive, in fact, all whom she regards as the true followers of Christ. Therefore, the lowest terms of salvation are the highest admissible terms of communion. If these principles are correct, it follows that however restrictive are the conditions a Church may see fit to establish as the terms of ministerial fellowship, it must recognize as a sister Church every body which holds and teaches the fundamental doctrines of the gospel, however erroneous it may be in other respects; and, therefore, it cannot with any consistency refuse either to receive members from such Church, or to dismiss them to it. That is, so far as general principles are concerned. For there may be particular cases in which, for special reasons, it is proper to refuse to receive a member from another Presbyterian church, belonging to our own body… The other radically different view of Christian communion is that which is characteristic of our Scotch brethren, and especially of the secession portion of them. They regard the Church so much as a witness for the truth, that they overlook its wider aspect as a “congregation of faithful men,” or ” the communion of saints.” They consider themselves, therefore, as joining in the testimony of any Church with which they commune; and they require all who wish to commune with them to join in their peculiar testimony, whatever it may be. Of course they cannot consistently commune themselves, nor allow their members to commune with any other than their own churches. Even some of the leaders of the Free Church of Scotland seemed, at first, in danger of falling into this false theory. They were in their zeal for cutting off all communion with the Established Church [of Scotland], lest, as they said, they should vitiate their testimony. Happily for them and the cause of Christ, this was a passing cloud. That Church has adhered to the scriptural doctrine, which has ever been held sacred by the great body of Protestants. Christian communion is communion of men as Christians, not as Presbyterians, Methodists, or Episcopalians. We recognize those with whom we commune, or to whom we dismiss our members, as Christians, and as nothing more. We give no sanction to their peculiarities, whatever they may be… We have so often heard the strongest feeling expressed by our pastors on this subject, that we are persuaded that any attempt of the General Assembly to prevent their enjoying on this subject the liberty wherewith Christ hath made them free, would be followed by the most unhappy consequences. We rejoice, therefore, in the wise disposition of this matter recorded above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 12 | section 5, ‘Dismission of Members to other Churches’ (1873) 236-39</cite></span></figcaption>

<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans… (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</cite></span></figcaption>

</figure><figure class="quote" id="q-7304caa200" data-kw="">
<blockquote><p>7. When any member of any of the churches of their own way go from one church to another only as travelers or sojourners for the time, they are admitted to sacraments, only bringing with them letters of recommendation from their own church. Ans. to 32. q., p. 29. But when any such member comes from one of their churches to another to be admitted as a fixed member there, then he is not admitted (notwithstanding any letters of recommendation or any other testimonial or evidence whatsoever) without such a new examination as aforesaid, and as if he had never been examined nor admitted into church-society before. Ans. to 32. q. pp. 29-30; Ans. to 9. Pos., p. 62; Apology, p. 2, 7, 9, 35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers… (London, 1644) Rathband was a Westminster divine.</cite>, Ch. 3; p. 10</span></figcaption>

</figure><figure class="quote" id="q-83d968759b" data-kw="">
<blockquote><p>2. By virtue of this church communion, they say, one church by letters of recommendation may give power to another church over any of her members for excommunication, and the ministers of one church may convey power to the ministers of another church for administration of the sacraments to any of their members. Cotton, Catechism, p. 7; Apology, pp. 2, 14, 26, 40; J.W. to T.S… 3. But without such letters of recommendations and formal granting over of such power, from one church and minister to another, it were unlawful in any case to administer any church ordinance to any church or members but their own or to admit them to any church communion upon any pretense whatsoever. Apology, pp. 14, 26, 40.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers… (London, 1644) Rathband was a Westminster divine.</cite>, Ch. 10, pp. 37-38</span></figcaption>

</figure><figure class="quote" id="q-0b44dcca6e" data-kw="">
<blockquote><p>I answer, recommendatory letters can never give a Church-right to the Church-privileges of the seals of the Covenant: they do but only notify, manifest and declare the Church-right which the man had before. Therefore, either he cannot in any sort be capable of the seals of the Covenant in another congregation than his own whereof he is an inchurched member [as upon a congregationalist view], which destroys all communion of sister Churches, or if he be capable of the seals in another congregation [which be the case], he was capable and had a Church-right in himself before he received recommendatory letters: yea, these whom we recommend by letters as fit to partake of the sacraments in another congregation, we presuppose they have Church-right to the seals in another congregation-visible than in their own whereof they are members, except our testimony be false. Therefore, before our recommendatory letters, the person of approved piety was a member of all the visible Churches about, hoc ipso, and ‘by that same reason,’ that he is a member of one visible congregation: Yea Peter clearly insinuates that all who have received the Holy Ghost, are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the Eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals, and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer when he goes to another visible congregation than his own, that faith gives him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does as a condition notify this faith and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-c548ce00e1" data-kw="">
<blockquote><p>2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners… (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.”

— Daniel Cawdrey, Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners… (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+A+second+way+of+your+communion+of+%5Bcongregationalist%5D+churches%2C+is%2C+%E2%80%98By+way+of+recommendation%2C+as+Paul+in+the+behalf+of+Phoebe%2C+etc.%E2%80%99+But+this+is+so+far+from+being+any+part+of+the+power+of+the+keys+that+it+is+a+duty+which+a+church+or+party+owe+to+any+Christian+that+is+godly%2C+not+by+virtue+of+any+particular+church-membership%2C+but+by+the+common+interest+of+Christianity%2C+yea%2C+by+the+common+right+of+humanity%2C+even+to+an+honest+heathen%2C+according+to+the+Ninth+Commandment%2C+which+requires+us+to+bear+true+witness+to+our+brother+if+we+be+thereto+required.+The+letters+are+only+declarative%2C+of+the+good+behaviour+of+the+party%2C+occasioned+to+remove+to+such+a+place.+Was+this+%28think+you%29+a+part+of+the+power+of+the+keys+delivered+to+Peter+and+the+rest+of+the+apostles%3F+Besides%2C+if+there+be+any+virtue+in+these+letters%2C+to+admit+a+member+into+communion%2C+is+there+not+a+like+virtue+in+them+to+excommunicate+one+ungodly%3F+And+if+these+letters+dimissory+have+power+to+admit+a+member+of+one+church+to+be+a+member+of+another%2C+without+any+new+covenanting%2C+have+they+not+the+like+power+to+admit+the+pastor+of+one+church%2C+to+be+a+pastor+of+another+Church%2C+without+any+new+ordination%3F+which+yet%2C+I+believe%2C+you+do+not+practice.%E2%80%9D%0A%0A%E2%80%94+Daniel+Cawdrey%2C+Vindici%C3%A6+Clavium%3A+or%2C+A+Vindication+of+the+Keys+of+the+Kingdom+of+Heaven%2C+into+the+Hands+of+the+Right+Owners%E2%80%A6+%281645%29%2C+ch.+4%2C+%E2%80%98Of+the+Subject+of+Church-Liberty%E2%80%99%2C+p.+41+Cawdrey+%281588%E2%80%931664%29+was+a+presbyterian+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc548ce00e1. <blockquote><p>[John Owen:] ‘To make men members of any particular churches, their own consent is required.’ If he mean this of an explicit consent (as I suppose he does, or he says nothing) it is fully disproved above; and implicit confessed [consent is] sufficient. A man that removes his habitation (as both he and we grant, it’s free for him to do) may, by setting down in another congregation and submitting himself to all the ordinances of Christ there, with performance of all offices of love to the members of that congregation, implicitly and yet sufficiently consent[s] to be a member thereof. And on the other hand, a man may not remove his habitation from a congregation wherein he has long consented to communicate, and yet remove his consent to be a member of another, as we see too much, in this loose and wandering age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved against Dr. Owen… (London: 1657), ch. 8</cite>, pp. 175-76</span></figcaption>

<blockquote><p>3. The matter that Paul recommend Phebe for to the Roman Christians was a duty of common Christian love, to entertain her kindly as a Christian, to assist her as they could in her affairs at Rome, a duty jure naturali [by natural law] incumbent to all Christians both conjunctly and severally. And so the recommendation for that on her behalf might well be directed to all, elders and people. But interest of concurring in actings of Church government, being not juris naturalis but juris positivi [by positive law], persons must be sure of special warrant and vocation for concurring in them. So that ’tis but a very sick consequence, if letters of recommendation for such purpose, as these for Phebe, may be (or if ye will, ought to be) directed to the whole Church, then ought the whole Church also to concur in actings of Church government and jurisdiction [as in congregationalism]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone, Pretended to be out of the Mountain, Tried &amp; Found to be a Counterfeit… (Edinburgh, 1654), pt. 2, section 3</cite>, p. 250</span></figcaption>

<blockquote><p>4. The manner of performing this worship of sanctifying the Lord’s Day in holy duties is required not only to be in public, nor only in secret, but [also] by the members of each family jointly, and apart from other families. For 1. It [the 4th Commandment] cannot be understood to require worship only in public together, because: 1. There may be in some cases no access to public worship, and yet the command of sanctifying the Lord’s Day lies still on, and no doubt by families. 2. Waiting on public worship is but one piece of sanctifying the Lord’s Day, and that but in a part of it; therefore there must be some other thing included here.</p></blockquote>

</figure><figure class="quote" id="q-d9e28f8389" data-kw="">
<blockquote><p>Negative precepts oblige to every point of time. Affirmative do not so. He that is always under obligation to pray solemnly, is not obliged to be always solemnly at prayer. The worship of God is better than most actions of our lives; yet the saving of a town or house from fire, yea, plucking of a sheep or an ox out of a ditch, is sometimes to be preferred. The most sacred, external act of duty becomes sin, when it excludes that which is more a duty at that time. How fatal, how totally destructive an error might it have proved, before, to the Jewish nation, always to have thought it unlawful to defend themselves on the Sabbath-Day! (as it was once said to have been; Plutarch, de Superst.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’</cite>, pp. 278-79</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-271f39cb1b" data-kw="">
<blockquote><p>The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (d. 1707; Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>

</figure><figure class="quote" id="q-f2407f6077" data-kw="">
<blockquote><p>…it lies as a necessary duty upon all to worship and serve God. The Hebrew words and Greek are several and observable that express this worship, which are exactly handled among the learned; The ground of this worship is because He is the Jehovah, who giveth us our being, and all other mercies: It is therefore most natural and a most indispensable debt to acknowledge Him for his supreme excellency herein and to give Him a peculiar and proper worship. Now this worship and service is either internal, or external, or mixed, compounded of both; internal consists in our love of God above all things, faith and hope in Him, obedience to his commands, which the Scripture prefers before all external worship; External is that of adoration and inclination of the body, kissing the hand, bowing the knee, dedicating temples, altars, and offering of sacrifices; Mixed is compounded of both these, such as calling upon God’s name by petition and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 27, p. 156</span></figcaption>

</figure><figure class="quote" id="q-3c364f2acd" data-kw="">
<blockquote><p>For principally and properly God is worshipped in our spirit: Jn. 4:24, ‘The true worshippers shall worship the Father in spirit.’ Rom. 1:9, ‘Whom I serve in my spirit.’ 1 Pet. 3:15, ‘Sanctify God in your hearts.’ By the ‘spirit’ I understand the thought of the mind, the consience and the affections of the heart. For in these is the first and principal seat of divine and spiritual worship. As for the body, it is but a secondary instrument of the service of God… the true religion of the New Testament has but few prescribed ceremonies and for the most part is divine and spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 700</span></figcaption>

</figure><figure class="quote" id="q-1aff900802" data-kw="">
<blockquote><p>The second point is that the outward worship does not please God of itself, but by means of the inward before described. Again, it is spiritual, not by itself, because it stands in bodily actions; but by reason of the inward worship, whence it proceeds and whereof it is a sign. Moreover, being severed from inward worship, it is worship in show, and not worship in truth. If they eye be evil, the whole body is dark. (Mt. 6:13) Christ bids the Pharisees to wash the inside of the cup and platter, and then all shall be clean (Mt. 23:25-26).</p></blockquote>

<blockquote><p>The worship of God is an honor to be given to God alone according to his commandment: ‘If I be your father, where is my honor?’ ‘I will not give my glory to an other:’ ‘that he that honoureth the Son, might honor the Father also:’ ‘that they may glorify your Father in heaven.’ Prov. 3:9, ‘Honor God with thy riches.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-fd7f6ad98e" data-kw="">
<blockquote><p>…a definition of the worship of God may be framed thus: The worship or service of God is when, upon right knowledge of God, we freely give Him the honor that is proper to him, in our hearts, according to his own will. Worship thus defined must be condsidered as a distinct thing from that honor which is called ‘veneration’. For worship properly belongs to persons, and veneration to things which appertain to persons. And veneration is to have a reverent estimation of anything or to preserve and keep it without hurt, as making store of it, and to use it reverently if it be to be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 702</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9df714d182" data-kw="">
<blockquote><p>…worship taken generally, signifies the giving of honor and reverence to another. Now this honor is either civil or divine. Civil honor is that outward reverence we give to men, by prostrating of the body, or bowing of the knee; and the end of this civil worship is, that thereby we might acknowledge another to be our superior… The second kind of honor is divine or religious worship, when we give such honor to another that thereby we do ascribe divinity and divine power unto it, acknowledging thereby that it is some divine thing above all creatures. And this we do first, when we ascribe the Godhead to it, and make it God: secondly, when we ascribe God’s attributes to it, as omnipotency, providence, etc. thirdly, when we acknowledge it to be the creator and maker of all things: fourthly, when we acknowledge it to be the giver of those good things we enjoy, and the defender of us from evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Satan’s Sophistry Answered by our Savior Christ, &amp; in Diverse Sermons Further Manifested</cite>, (London, 1604), ‘Satan’s Sophistry,’, pp. 114-15</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d4a1f8a400" data-kw="">
<blockquote><p>Divine worship is any action or service that is immediately and directly performed unto God Himself, whether the true God or a false, whether commanded by divine authority, imposed by human, or assumed upon our own heads and pleasures. For in this latitude of sense is divine worship to be conceived, that it may comprehend under it both true and false worship.</p></blockquote>

<blockquote><p>1. Worship of God is all that servitude, observancy, reverence and religion whereby as well inwardly in the heart, as outwardly in the work itself, we honor God and serve Him. 2. This, if it be rightly performed according unto the will of God, is termed true worship; but if contrariwise, it is called false and idolatrous worship. 3. True worship of God is every work, inward and outward, commanded by God, performed in faith, to this principal end, that God may be glorified. 4. And to worship God truly is so to worship Him as He has commanded in his Word how He would be worshipped.</p></blockquote>

<blockquote><p>Q. What is the worship of God? A. That reverent respect and love wherewith we are to embrace his maiesty with our whole man. 1 Sam. 12:24; Mt. 22:37-38. The Schoolmen define it to be an immediate act of the will upon God: but this is the whole rule of divinity, which is nothing else but the ordering of the will so as it may please God. Now the act of the will is either to believe or obey, and obedience is either immediate, as piety, or mediate as charity. Hence the love of my neighbor is not an immediate act upon God, and in this sense worship is well distinguished from charity: as having no nearer object than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-yates.html">John Yates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Model of Divinity, Catechistically Composed</cite>, … (London, 1622), bk. 2, ch. 1, ‘Of the Law’, p. 307</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-f9b2e72a0b" data-kw="">
<blockquote><p>The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (1639; Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 23, p. 239 See also the chart on, pp. 72-73.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.”

<blockquote><p>Answer [Bishop Sydserff]: How define ye worship? Opponent [Rutherford]: An act of man whereby God is immediately honored. Answer: Say also according to God’s command. Opponent: I will not say, when I define worship in general. If I should define lawful worship I would add this–that it be according to God’s command. I remit to your learning to think: If one thing can give nature both to genus and to species, you know good logic speaks against this. God’s command cannot but give being to worship and to this particular worship, to wit, to lawful worship; and [in] this [your] way I might say [that] idolatry, sacrificing to Satan as Indians do, slaying of children to Moloch, etc. shall not be false worship except they be urged as commanded of God.</p></blockquote>

<blockquote><p>To worship is to give to anyone the honor due unto him: So the rendering unto God that love, that fear, that service, that honor which is due unto him is the worshipping of God, that’s the Scripture definition, Ps. 29:2, ‘Give unto the Lord the honor due unto his name;’ then follows by way of exposition, ‘Worship the Lord in the beauty of holiness,’ that is, in his holy Temple, in his beautiful sanctuary, or in the comely honor of his sanctuary. So that worship is the tendering of honor to the Lord, in a way honorable to Him, namely according to his own will and laws of worship: which is intimated by coming to worship Him in his beautiful sanctuary, where all things about the service of God were exactly prescribed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London [1643]), Job 1:13-14, pp. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-d6fbf690f8" data-kw="">
<blockquote><p>Worship, generally, is the tender of our homage to God, and giving Him immediate honor. Accordingly, a part of worship, is whatsoever is presented to God, (whether thing or action) as a special homage, and as an immediate honor to Him. Or at least ought to be so, if it be not. … 1. As worship comprehends under the term both true worship and false worship, or right worship and will-worship; So the cause of it is our intention to present it as a special homage (as was said) and an immediate honor to God. Such intention, we say, is the formal cause, that such an action is worship in him that presents it, or such a thing, in him that tenders it. And without such intention, no action is formally worship in any man, however it be in the nature of the action, or in any other person that presents it. As for instance: The repeating of any sentence of Scripture, or the Lord’s prayer, intending thereby to honor God, is a part of worship: But to repeat it, to teach a child to spell or read, or to understand a language, or to use it as a charm or the like, is certainly no worship, because it wants an intention of immediate honoring God by it. So to kneel down before an image or crucifix with intention to honor God by that action is worship (though false and idolatrous), but to kneel down before it, not seeing it, nor thinking of it, or to pull out a thorn out of one’s foot or the like, is no worship: because, again, here wants an intention of honoring God by such an action. 2. But now, as worship denotes only true and right worship, so the proper efficient cause, and that which both legitimates and necessitates such intention, is the command of God. What He commands to be presented to Him, whether seeming substance or circumstance, has the nature of a special homage and immediate honor to Him, and ought to be presented (as often as it is presented) with such intention. From which command also flows an answerable acceptation of such a commanded thing or action, when accordingly performed with that intention: And with that intention there may and should also be an expectation of such acceptation, whereby the intention is proved in a man’s conscience, whether the matter be commanded or not. For will-worshippers expect an acceptation, though without warrant. And profane hypocrites, though they pretend to worship God, yet when they intend it not, they expect no acceptation. We say then, our expectation of acceptation declares whether we tender such a thing as a part of worship, or use it as a mere circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/definitions-of-worship.html">Herbert Palmer &amp; Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbatum redivivum, or the Christian Sabbath Vindicated</cite>, (London: White, 1645), ch. 12</span></figcaption>

</figure><figure class="quote" id="q-722b31153c" data-kw="">
<blockquote><p>The sorts of this worship are twofold: 1. Solemn. 2. Common. The solemn worship is that whereto men do wholly give themselves, setting themselves apart from all other things to attend it wholly. The common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or any thing of his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: Lee, 1654), bk. 9, ch. 4, ‘3rd Commandment’, p. 789</span></figcaption>

</figure><figure class="quote" id="q-f72a8a70fc" data-kw="">
<blockquote><p>The scope, end and sum of this [2nd] Commandment is to order us in the solemn worship of God, called Heb. 9:1, ‘Ordinances of divine service,’ and usually termed ‘religious exercises.’ For the constituting of a solemn worship of God three things are required: 1. That it be done with immediate reference to God, and that Himself or something in his stead be made the object thereof, and so therein we draw near to Him, and He to us. 2. That it tend in the doer’s intention directly and of itself to the honoring of God and pleasing Him, and getting of grace from him, by exercising of some or all the virtues required in the First Commandment. 3. That there be a separating of ourselves from all other businesses to be wholly and altogether employed about such acts in which the difference between common and solemn worship does seem to stand. Worship consists in three things: 1. There must be a right knowledge and high apprehension of God, the person to be worshipped. 2. A reflexion of this knowledge. 3. An abasement of the creature under the reflexion of this knowledge, Rev. 5: Christ is represented as sitting on a throne. The people of God are there brought in as compassing Him about, they have high apprehensions of the person of Christ, his glory and holiness. 2. They reflect these excellencies. 3. They abase themselves, fall on their faces, vers. ult. Every religious exercise or ordinance of divine service has usually divers particular acts, that be as parts of the whole, and in the orderly uniting of which the whole is accomplished. And whatsoever is done in any such exercise of religion, for the end and purpose of pleasing God and getting grace from him with respect of conscience to Him (as esteeming that He must and will have it so, or else the service shall not be well-pleasing and acceptable to Him) this is a part of worship, or of divine service. For example: a man brought an ox or a ram, a lamb or such like thing, and presented it to the priest, he did offer it unto God, and that directly with intention of exercising obedience and faith to God. Likewise this offering was to be made by a certain person in a certain place, at a certain time, with certain garments and rites: So all those observations became parts of this worship; for in these also the intention of the doer was directly carried to God, hoping and purposing by them to please God and exercise faith and obedience, and other graces, as well and as much as by the very offering itself, and accounting the service not to be acceptable to God without them.</p></blockquote>

<blockquote><p>Divine worship is that which is performed in acknowledgement of Deity, or any divine excellency, in that to whom it is performed. This is due to God alone.</p></blockquote>

</figure><figure class="quote" id="q-e5341f29d7" data-kw="">
<blockquote><p>The worshipping of God is the direct acknowledging of his Being and perfections to his honor. Indirectly or consequentially He is acknowledged in every obediential act by those that truly obey and serve Him: And this is indirectly and participatively to worship Him: And therefore all things are holy to the holy, because they are holy in the use of all… But this is not the worship which we are here to speak of: but that which is primarily and directly done to glorify Him by the acknowledgement of his excellencies. Thus God is worshipped either inwardly by the soul alone, or also outwardly by the body expressing the worship of the soul. For that which is done by the body alone without the concurrence of the heart, is not true worship, but an hypocritical image or show of it (equivocally called ‘worship’). The inward worship of the heart alone, I have spoken of in the former tome [of A Christian Directory]. The outward or expressive worship is simple or mixed: Simple when we only intend God’s worship immediately in the action: And this is found chiefly in praises and thanksgiving, which therefore are the most pure and simple sort of expressive worship. Mixed worship is that in which we join some other intention, for our own benefit in the action: As in prayer where we worship God by seeking to Him for mercy: And in reverent hearing or reading his Word, where we worship Him by a holy attendance upon his instructions and commands: And in his sacraments where we worship Him by receiving and acknowledging his benefits to our souls: And in oblations where we have respect also to the use of the thing offered: And in holy vows and oaths, in which we acknowledge Him our Lord and Judge. All these are acts of divine worship, though mixed with other uses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London: White, 1673), pt. 3, Ch. 1, ‘Of the Worship of God in General’, pp. 673-74</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The worshipping of God is the direct acknowledging of his Being and perfections to his honor. Indirectly or consequentially He is acknowledged in every obediential act by those that truly obey and serve Him: And this is indirectly and participatively to worship Him: And therefore all things are holy to the holy, because they are holy in the use of all… But this is not the worship which we are here to speak of: but that which is primarily and directly done to glorify Him by the acknowledgement of his excellencies. Thus God is worshipped either inwardly by the soul alone, or also outwardly by the body expressing the worship of the soul. For that which is done by the body alone without the concurrence of the heart, is not true worship, but an hypocritical image or show of it (equivocally called ‘worship’). The inward worship of the heart alone, I have spoken of in the former tome [of A Christian Directory]. The outward or expressive worship is simple or mixed: Simple when we only intend God’s worship immediately in the action: And this is found chiefly in praises and thanksgiving, which therefore are the most pure and simple sort of expressive worship. Mixed worship is that in which we join some other intention, for our own benefit in the action: As in prayer where we worship God by seeking to Him for mercy: And in reverent hearing or reading his Word, where we worship Him by a holy attendance upon his instructions and commands: And in his sacraments where we worship Him by receiving and acknowledging his benefits to our souls: And in oblations where we have respect also to the use of the thing offered: And in holy vows and oaths, in which we acknowledge Him our Lord and Judge. All these are acts of divine worship, though mixed with other uses.”

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, … (London: White, 1673), pt. 3, Ch. 1, ‘Of the Worship of God in General’, pp. 673-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+worshipping+of+God+is+the+direct+acknowledging+of+his+Being+and+perfections+to+his+honor.+Indirectly+or+consequentially+He+is+acknowledged+in+every+obediential+act+by+those+that+truly+obey+and+serve+Him%3A+And+this+is+indirectly+and+participatively+to+worship+Him%3A+And+therefore+all+things+are+holy+to+the+holy%2C+because+they+are+holy+in+the+use+of+all%E2%80%A6+But+this+is+not+the+worship+which+we+are+here+to+speak+of%3A+but+that+which+is+primarily+and+directly+done+to+glorify+Him+by+the+acknowledgement+of+his+excellencies.+Thus+God+is+worshipped+either+inwardly+by+the+soul+alone%2C+or+also+outwardly+by+the+body+expressing+the+worship+of+the+soul.+For+that+which+is+done+by+the+body+alone+without+the+concurrence+of+the+heart%2C+is+not+true+worship%2C+but+an+hypocritical+image+or+show+of+it+%28equivocally+called+%E2%80%98worship%E2%80%99%29.+The+inward+worship+of+the+heart+alone%2C+I+have+spoken+of+in+the+former+tome+%5Bof+A+Christian+Directory%5D.+The+outward+or+expressive+worship+is+simple+or+mixed%3A+Simple+when+we+only+intend+God%E2%80%99s+worship+immediately+in+the+action%3A+And+this+is+found+chiefly+in+praises+and+thanksgiving%2C+which+therefore+are+the+most+pure+and+simple+sort+of+expressive+worship.+Mixed+worship+is+that+in+which+we+join+some+other+intention%2C+for+our+own+benefit+in+the+action%3A+As+in+prayer+where+we+worship+God+by+seeking+to+Him+for+mercy%3A+And+in+reverent+hearing+or+reading+his+Word%2C+where+we+worship+Him+by+a+holy+attendance+upon+his+instructions+and+commands%3A+And+in+his+sacraments+where+we+worship+Him+by+receiving+and+acknowledging+his+benefits+to+our+souls%3A+And+in+oblations+where+we+have+respect+also+to+the+use+of+the+thing+offered%3A+And+in+holy+vows+and+oaths%2C+in+which+we+acknowledge+Him+our+Lord+and+Judge.+All+these+are+acts+of+divine+worship%2C+though+mixed+with+other+uses.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+%E2%80%A6+%28London%3A+White%2C+1673%29%2C+pt.+3%2C+Ch.+1%2C+%E2%80%98Of+the+Worship+of+God+in+General%E2%80%99%2C+pp.+673-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5341f29d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e5341f29d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=The%20worshipping%20of%20God%20is%20the,worship%2C%20though%20mixed%20with%20other%20uses&amp;text=The%20worshipping%20of%20God%20is%20the%20direct%20acknowledging&amp;text=of%20divine%20worship%2C%20though%20mixed%20with%20other%20uses" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-ad8d7e9e1d" data-kw="">
<blockquote><p>There is a twofold worship: 1. A civil reverence we give to persons of honour, Gen. 23:7, ‘Abraham stood up and bowed himself to the children of Heth.’ Piety is no enemy to courtesy. 2. A divine worship, which we give to God, is his prerogative-royal, Neh. 8:6, ‘They bowed their heads, and worshipped the Lord with their faces towards the ground.’ This divine worship God is very jealous of; this is the apple of his eye, this is the pearl of his crown which He guards as he did the Tree of Life, with cherubims and a flaming sword, that no man may come near to violate it: Divine worship must be such as God Himself has appointed, else it is offering strange fire, Lev. 10:2.</p></blockquote>

</figure><figure class="quote" id="q-f396ba73aa" data-kw="">
<blockquote><p>Worship is the right, fitting, and delightful response of moral beings–angelic and human–to God the Creator, Redeemer, and Consummator, for who He is as one eternal God in three Persons–Father, Son, and Holy Spirit–and for what He has done in creation and redemption, and for what He will do in the coming consummation, to whom be all praise and glory, now and forever, world without end. Amen.</p></blockquote>

<blockquote><p>By the one same act man both serves and worships God, for worship regards the excellence of God, to Whom reverence is due: while service regards the subjection of man who, by his condition, is under an obligation of showing reverence to God. To these two belong all acts ascribed to religion, because, by them all, man bears witness to the Divine excellence and to his own subjection to God, either by offering something to God, or by assuming something Divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, second part</cite>, Question 81, ‘Of Religion’, Article 3, ‘Whether religion is one virtue’, Reply to Objection 2. Rutherford (below) follows Aquinas in this.</span></figcaption>

<blockquote><p>The worship (or service) of God is a work commanded of God, wrought through faith (principally) to the setting forth of the glory of God. In this definition there be three things, which in the true worship of God are necessarily joined together: First: The matter (or material part), which is a work commanded of God. Secondly: The cause, namely that the same work be done of faith, in Jesus Christ. Thirdly: The end, namely the glory of God, which the worker respects, that by this means he may declare himself obedient to his heavenly father.</p></blockquote>

<blockquote><p>‘Worship,’ in our English tongue, and as it is used to express the original scriptures, is diversely taken. Sometime largely, as when it expresses the Greek word latreuo, as Phil. 3:3, ‘we are the circumcision which worship God in the spirit:’ and Acts 24:14, ‘so worship I the God of my fathers.’ And thus both the English &amp; Greek answers to the Hebrew ghnabad [עָבַד], which properly signifies to serve, Ex. 3:12; Dt. 10:12; 2 Sam. 15:8.</p></blockquote>

<blockquote><p>…there is also required, that we have Him outwardly in our bodies and external actions; and that is, when as with the outward man we serve and worship Him. The which also we owe unto God, seeing He has created and redeemed both our souls and bodies, that we should in both perform service unto Him…. the Lord require it with the other, and that with the sweet incense of the heart and mind, we offer our bodies also a living sacrifice, holy and acceptable unto Him [Rom. 12:1-2]… Our Sauior also requires, not only that we have in us the heat of spiritual graces, but that also that we cause their light to shine out before men, that they seeing our good works, may glorify our Father which is in heaven… Now this external honour is either in outward signs or actions… Of the other sort is the outward service of God, in calling upon Him, vowing unto Him, swearing by his Name, celebrating feasts to his honor, and all outward obedience to the Law, which, in respect of the person to whom they are to be performed, namely, God alone and no other, are all required in the First Commandment.</p></blockquote>

<blockquote><p>But that this may be the clearer, I conceive that there is a twofold, immediate honoring of God in the worship of God: 1. An honoring of God less immediate, as hearing of the Word, is an immediate honoring of God, because honor flows immediately from God, both ex conditione operis, and ex conditione operantis; ‘from the nature of the work’, and ‘[from the] intention of the worker’: yet it is a less immediate honoring of God, in regard that I may also hear the Word even from the condition of the work, and so from the intrinsic end of the worker that I may learn to know God and believe; for thus far I am led to honor God immediately in hearing the Word, that action of its own nature conveying honor to God; there intervenes also a medium amidst between me and honoring of God, to wit, the preacher or the Bible (to which no external adoration is due): [2.] There is another more immediate worship, to wit, praising of God, from which, by an immediate result, God is honored, and in worship especially, strictly, immediate, God is immediately honored both in the intention of the work and the intrinsic end of it, and the intention of the worker; though no other thing be done, and others be not edified either in knowledge, increase of faith or any other ways: And in this, duties of the Second Table, of mercy and justice, differ from worship in that such acts of love and mercy, as to give alms to save the life of my brother or of his beast, are not acts of worshipping God; their intrinsic end, and the nature of the work being to do good to the creature, principally, ex natura et conditione operis, though God also thereby be honored, yet in a more secondary consideration: For I praying to God, do immediately, from the nature of the action, honor God, though no good should either redound to myself or to the creature; thereby it is true, God, by acts of love and mercy to our neighbor, is honored two ways: 1. In that men seeing our good works do thence take occasion to glorify our heavenly Father, whose truth teaches us by the grace of God to do these works, but the intrinsic and proper use of these is to do good to ourselves, as in works of sobriety, and to our neighbor, as in works of righteous dealing, but not immediately, and in the first and primary consideration to honor God, as in works of piety, holiness and worship, the honoring of God by secondary resultance, does issue also from these duties of righteousness, but not as from the acts of praying, praising, sacramental eating, drinking. 2. The doer of these acts of mercy may, and is to intend, the honoring of God.</p></blockquote>

<blockquote><p>Hitherto concerning the causes of Christian theology: its parts follow, which are two: One, the knowledge of God: the other, His worship: both of which are directed toward the glory of God and the salvation of man. Explanation: Christian theology is rightly distributed into these parts: For theology is the doctrine of salvation: And our salvation and blessedness consists in these two parts: (1.) That we rightly know God. (2.) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these to parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his Theology into these parts, Acts 24:14-16, I believe all things which are written, and have hope in GOD: and I do exercise myself to have a conscience void of offence. Whence the same Paul reprehends the Gentiles, because they glorified not God, neither were they thankful, Romans 1:21. Whence Athanasius, in an oration, unum esse Deum [There is one God], elegantly states: The whole salvation of Christians consists in believing and worshipping. Hence it is evident that theology is rather practical teaching, than theoretical, because its theory is directed toward practice, that is, the worship of God: on which pretext some prefer it to be called prudentiam/prudence, rather than scientiam/science or sapientiam/wisdom: even though it embraces the highest wisdom in itself… In the same sense, by others faith and good works are constituted as the parts of theology.</p></blockquote>

<blockquote><p>If we compare the two Tables together as to the matter contained in them and the immediate object of each duty commanded, the duties of the First Table are greater and the duties of the Second Table lesser, the one relating more immediately, the other more mediately to religion, in which respect they express peculiarly our love to God, which is called the first and great command; For the first four commands require that which in its own nature is worship, and is in an immediate way to be given to God; but the duites required in the other six, are not properly, formally and immediately called for as parts of worship to God, though, as they are acknowledgments of Him, they may be consequentially thereto referred.</p></blockquote>

<blockquote><p>Calvin observes… ‘There is in man a twofold government: the one spiritual, whereby the conscience is instructed unto piety and the worship of God: the other political, whereby a man is taught the duties of humanity and civility…’… For whatever is a trespass against the revealed Will of God for duty in moral obedience or instituted worship, is a sin; not but that instituted worship is fundamentally moral obedience, but is therefore in some sense distinguished from it (the serving of God according to his own appointment being the principal part of the Moral Law) because God has, according to the several states of his Church, altered the mode and manner of his worship, as he has thought it best in his wisdom, and as has been most suitable to the several ages and states of his Church; which alterable or altered circumstances, being the product of Christ’s prerogative alone, are called his instituted worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/isaac-chauncy.html">Isaac Chauncy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Hierarchy: or the Divine Right of a Sacred Dominion in Church &amp; Conscience</cite>, … (London: Crouch, 1681), ch. 1</span></figcaption>

</figure><figure class="quote" id="q-bdf4968223" data-kw="">
<blockquote><p>And to speak briefely, this worshipping of God, which is to serve in spirit, is reduced unto four principal points: which are adoration, trust, invocation, and giving of thanks. Adoration is an humble and religious submission, whereby we utterly submit ourselves unto God, and that in all things. Trust is whereby we rest in Him, considering the power, wisdom and high goodness wherewith He is adorned: For which things we cleave unto Him; neither do we think that He will forsake or frustrate us. Invocation is: whereby we fly unto God, in all perils, and adversities: as which know that He is everywhere at hand, and that, according to his promises, He both can and will succor us with his defence. Giving of thanks is, whereby we refer all good things unto Him, as unto the first author… But spiritual worshipping consists altogether of faith and charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 1, verse 9, pp. 7 &amp; 9</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-5791856475" data-kw="">
<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye offer up your bodies a living sacrifice, holy, and acceptable unto God, which is your reasonable worshipping… He desires us to offer ourselves unto God. And this oblation he says shall have the nature of a sacrifice… A sacrifice is a voluntary action, wherein we worship God and offer unto Him somewhat, whereby we testify his chief dignity and dominion, and our servitude and submission towards Him. In this definition are expressed all the causes. The matter is the oblation: the form is the action, not a natural action, but that which is done with election, and inspired by the Holy Ghost: neither is it a political or economical action but a religious action: for that pertains to the worshipping of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 12, pp. 410-11, 413</span></figcaption>

<blockquote><p>That which we in Latin read, cultum, that is, ‘worshipping,’ is in Greek, [Greek], which word, as the Latin fathers write, and especially Augustine in his 10th book, Of the City of God, the 1st chapter, properly signifies the worshipping of God. For although (says he) many other things are worshipped, yet this worship called [Greek] belongs not unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 12, pp. 410-11, 413</span></figcaption>

<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law. 11. The end of the First Commandement is that God among his people will bear rule ouer all, and wholly enjoy his authority. And to the end that this may come to pass, He commands all impiety, and all false opinions concerning God to be far from us: and in like sort, He enjoins Himself to be worshipped and adored of us in the true practice of godliness. 12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law. 11. The end of the First Commandement is that God among his people will bear rule ouer all, and wholly enjoy his authority. And to the end that this may come to pass, He commands all impiety, and all false opinions concerning God to be far from us: and in like sort, He enjoins Himself to be worshipped and adored of us in the true practice of godliness. 12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.”

<blockquote><p>Also when it [‘worship’] expresses the Greek word sebomai; as Acts 18:13, ‘to worship God contrary to the law;’ and Acts 18:7, ‘Justus a worshipper of God.’ And so both it and the Greek answer to the Hebrew jaré [יָרֵא], which properly signifies to fear or reverence, as Mt. 15:9, ‘in vaine they worship Me;’ for that which in Hebrew is, ‘their fear towards me,’ Isa. 29:13. So Job and Jonah, as the Hebrew says, ‘feared,’ as the Greek [Septuagint] translates, ‘worshipped God.’ Also when it interprets the Greek word threskeuo, as Col. 2:18, ‘the worshipping of angels;’ and verse 23, ‘in will-worship’ or voluntary religion. Thus worship is largely used for the fear and service of God, or any religious action.</p></blockquote>

<blockquote><p>Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London: Rothwell), on 2 Pet. 1:5-7, p. 151</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.”

</figure><figure class="quote" id="q-d75588582f" data-kw="">
<blockquote><p>Worship is as large as the Commandment, nay as the whole Word of God. For so it is ordinarily defined, a work commanded, done in faith, and then it must needs extend itself as far as the Commandment. And if to obey God in conscience of his Commandment, in all actions, civil and sacred, of piety, justice or mercy, be to worship Him, then to believe whatsoever the Lord has taught, relying upon the truth and credit of the Revealer, is worship also. And hence it is, that the worship of God is usually divided into immediate and mediate worship: which comprehends all duties which we owe to God or Man.</p></blockquote>

<blockquote><p>The sorts of this worship are twofold: 1. Solemn, 2. Common… The Common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or anything of his.</p></blockquote>

<blockquote><p>…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:</p></blockquote>

<blockquote><p>‘Which is your reasonable service;’ or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner… Others, by ‘reasonable service,’ understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ… And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Whole Bible</cite>, (d. 1679), on Romans 12, verse 1</span></figcaption>

<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law. 11. The end of the First Commandement… He enjoins Himself to be worshipped and adored of us in the true practice of godliness. 12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-13b85e0057" data-kw="">
<blockquote><p>The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22. This stands in two things. First, in yielding subjection of the conscience to the commandments, threatnings and promises of God, so as we are willing that it should become bound unto them. Secondly, when the rest of the powers of the soul, in their place and time, perform obedience unto God.</p></blockquote>

<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>

</figure><figure class="quote" id="q-f21e34ae8f" data-kw="">
<blockquote><p>5. The Efficient Cause, I mean the first and Principal Efficient of true worship, is the Holy Ghost, by whom we are moved and stirred up to worship and honor God. 6. For the Spirit is He which gives us faith itself from whence flows worship, and excites us to do the works of piety, both internal and external. He works in us both the will and the deed, after the good pleasure of his will, as the apostle speaks. 7. The Secondary and Less Principal Efficient Cause of worship, are we ourselves, who adore and honor God. 8. The Material Cause is the work itself commanded by God, whereby we serve Him, adoring Him with the greatest reverence we possibly may: for no creature has any right of instituting the worship of God. 9. Hereupon is excluded all will-worship, and the figment of good intention, to wit, when men do evil, that good may come thereof, or when they themselves do invent works, which they obtrude unto God for worship, not works evil in themselves, but yet not commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13. 10. For it is not sufficient, for worship that some work be not evil, or not forbidden, but it ought to be commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13. 11. The Formal Cause is faith. For good works and just actions do not only flow from faith as from the Efficient Cause; even as all human actions proceed from the soul: but also those works have their being from faith, as from a form, whereby they are godly, holy and therefore acceptable unto God. 12. The Final Cause is the glory of God, whereunto must be referred all the whole worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 10, ‘Of the Worship of God…’, pp. 65-66 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. The Efficient Cause, I mean the first and Principal Efficient of true worship, is the Holy Ghost, by whom we are moved and stirred up to worship and honor God. 6. For the Spirit is He which gives us faith itself from whence flows worship, and excites us to do the works of piety, both internal and external. He works in us both the will and the deed, after the good pleasure of his will, as the apostle speaks. 7. The Secondary and Less Principal Efficient Cause of worship, are we ourselves, who adore and honor God. 8. The Material Cause is the work itself commanded by God, whereby we serve Him, adoring Him with the greatest reverence we possibly may: for no creature has any right of instituting the worship of God. 9. Hereupon is excluded all will-worship, and the figment of good intention, to wit, when men do evil, that good may come thereof, or when they themselves do invent works, which they obtrude unto God for worship, not works evil in themselves, but yet not commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13. 10. For it is not sufficient, for worship that some work be not evil, or not forbidden, but it ought to be commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13. 11. The Formal Cause is faith. For good works and just actions do not only flow from faith as from the Efficient Cause; even as all human actions proceed from the soul: but also those works have their being from faith, as from a form, whereby they are godly, holy and therefore acceptable unto God. 12. The Final Cause is the glory of God, whereunto must be referred all the whole worship of God.”

— Gabriel Powel, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 10, ‘Of the Worship of God…’, pp. 65-66 Powel (baptised 1576–1611) was a Welsh Anglican minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+The+Efficient+Cause%2C+I+mean+the+first+and+Principal+Efficient+of+true+worship%2C+is+the+Holy+Ghost%2C+by+whom+we+are+moved+and+stirred+up+to+worship+and+honor+God.+6.+For+the+Spirit+is+He+which+gives+us+faith+itself+from+whence+flows+worship%2C+and+excites+us+to+do+the+works+of+piety%2C+both+internal+and+external.+He+works+in+us+both+the+will+and+the+deed%2C+after+the+good+pleasure+of+his+will%2C+as+the+apostle+speaks.+7.+The+Secondary+and+Less+Principal+Efficient+Cause+of+worship%2C+are+we+ourselves%2C+who+adore+and+honor+God.+8.+The+Material+Cause+is+the+work+itself+commanded+by+God%2C+whereby+we+serve+Him%2C+adoring+Him+with+the+greatest+reverence+we+possibly+may%3A+for+no+creature+has+any+right+of+instituting+the+worship+of+God.+9.+Hereupon+is+excluded+all+will-worship%2C+and+the+figment+of+good+intention%2C+to+wit%2C+when+men+do+evil%2C+that+good+may+come+thereof%2C+or+when+they+themselves+do+invent+works%2C+which+they+obtrude+unto+God+for+worship%2C+not+works+evil+in+themselves%2C+but+yet+not+commanded+by+God%2C+1+Sam.+15%3A22%3B+Eze.+20%3A19%3B+Mt.+15%3A9%3B+Isa.+29%3A13.+10.+For+it+is+not+sufficient%2C+for+worship+that+some+work+be+not+evil%2C+or+not+forbidden%2C+but+it+ought+to+be+commanded+by+God%2C+1+Sam.+15%3A22%3B+Eze.+20%3A19%3B+Mt.+15%3A9%3B+Isa.+29%3A13.+11.+The+Formal+Cause+is+faith.+For+good+works+and+just+actions+do+not+only+flow+from+faith+as+from+the+Efficient+Cause%3B+even+as+all+human+actions+proceed+from+the+soul%3A+but+also+those+works+have+their+being+from+faith%2C+as+from+a+form%2C+whereby+they+are+godly%2C+holy+and+therefore+acceptable+unto+God.+12.+The+Final+Cause+is+the+glory+of+God%2C+whereunto+must+be+referred+all+the+whole+worship+of+God.%E2%80%9D%0A%0A%E2%80%94+Gabriel+Powel%2C+De+adiaphoris%2C+Theological+%26+Scholastical+Positions+concerning+the+Nature+%26+Use+of+Things+Indifferent.+Where+also+is+Methodically+%26+Briefely+Handled%2C+of+Civil+%26+Ecclesiastical+Magistrates%2C+of+Human+Laws%2C+of+Christian+Liberty%2C+of+Scandal+%26+of+the+Worship+of+God%2C+De+adiaphoris%2C+Theological+%26+Scholastical+Positions+concerning+the+Nature+%26+Use+of+Things+Indifferent.+Where+also+is+Methodically+%26+Briefely+Handled%2C+of+Civil+%26+Ecclesiastical+Magistrates%2C+of+Human+Laws%2C+of+Christian+Liberty%2C+of+Scandal+%26+of+the+Worship+of+God+%28London%2C+1607%29%2C+ch.+10%2C+%E2%80%98Of+the+Worship+of+God%E2%80%A6%E2%80%99%2C+pp.+65-66+Powel+%28baptised+1576%E2%80%931611%29+was+a+Welsh+Anglican+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff21e34ae8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f21e34ae8f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=5.%20The%20Efficient%20Cause%2C%20I%20mean,all%20the%20whole%20worship%20of%20God&amp;text=5.%20The%20Efficient%20Cause%2C%20I%20mean%20the%20first&amp;text=be%20referred%20all%20the%20whole%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thirdly, ceremonies called “sacred” are of two sorts, properly so called, or reductively. Properly sacred are all and only such as be of divine institution, which we call also simply necessary, necessitato praecepti [by the necessity of precept]. Reductively sacred are such as in their particular have no divine institution, but are applied in their use to those things which are divine, and these we call arbitrary or ambulatory ceremonies.</p></blockquote>

<blockquote><p>§5. What things of or belonging to divine worship, may be devised or instituted by man. The things set down under the former head as forbidden, are such new ordinances of worship as are coordinate with the divine ordinances, and are in proper sense additions, pretending, or in themselves expressing the same nature, reason, end and use that the divine ordinances have, and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same. And they are not proper additions, because they are not of the same nature and use: and these are unlawful.</p></blockquote>

<blockquote><p>[Daniel] Chamier (says the Rejoinder) [Panstratiae Catholicae] tome 3, bk. 20 [‘On Vows’], ch. 5 [‘In what way vows are the worship of God. Arguments of the Papists’], four times uses this distinction of worship proper and accidental. But Chamier only calls those special material acts which are conjoined with formal acts of worship, accidental parts of worship: as if a man vowed to drink no wine for a certain time, his abstaining from wine pertains to worship only by accident. So if in solemn prayer for a prince, his titles and style be rehearsed, or any special terms of honor, this pertains to prayer by accident.</p></blockquote>

</figure><figure class="quote" id="q-f84e1e20f2" data-kw="">
<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect): 1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given. 2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object. 3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh, 1658), ch. 1, ‘Concerning the Holy Trinity &amp; Object of Worship’, p. 12</span></figcaption>

</figure><figure class="quote" id="q-f70124e0d4" data-kw="">
<blockquote><p>There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684), section 18, p. 205</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.”

0supernatural%20unimitable%20representations,the%20same%20as%20a%20bright%20medium&amp;text=There%20were%20also%20supernatural%20unimitable%20representations%2C%20though%20not&amp;text=shining%20through%20the%20same%20as%20a%20bright%20medium" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-3750c533ad" data-kw="">
<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like: which words all we use in the worshipping of man also, howbeit diversely; and the difference thereof does all the scripture teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>

</figure><figure class="quote" id="q-33a10a09f9" data-kw="">
<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>There is a civil worship mentioned in Scripture, as well as divine worship. Civil worship may be given to men. And there is a twofold civil worship (spoken of in Scripture). There is a civil worship of duty, and there is a civil worship of courtesy. That of duty is from inferiors to their superiors, from children to their parents, from servants to their masters, from subjects to kings and magistrates. These gods must have civil worship. As Gen. 48:11, when Joseph came into the presence of Jacob his father, he bowed down to the ground; this was a civil worship, and a worship of duty from an inferior to a superior. And it is said of the brethren of Judah, Gen. 49:8, when Jacob on his death-bed blessed the 12 Tribes, ‘Thy brethren shall worship thee or bow down to thee.’ It is the same word used here in this text. Judah’s honor was to wield the scepter, the government was laid upon his shoulders; now he being the chief magistrate, all the rest of the tribes, all his brethren must worship him or give civil honor unto him. Secondly, There is likewise a worship of courtesy, which is from equals, when one equal will bow to another, or when a superior (as sometimes in courtesy he will) bows down or worships his inferior: As it is noted concerning Abraham, that when he came before the men of the country of Heth, he bowed himself; Now Abraham was the superior, he was a prince and a great man, yet coming before the men of the country, he bowed himself, and it is the same word. So then this civil worship may lawfully be given unto men. But as for divine worship that is proper and peculiar unto God, that glory He will not give to graven images, man or angel, and therefore we must not. Hence we find that when Cornelius and John did act their civil worship a little too far, they were presently taken oft for they should entrench upon the divine worship. Civil worship when it is excessive and goes too far is sinful, as in Acts 10.25, Luke relates that as soon as Peter came in, Cornelius met him and fell at his feet and worshipped him; the worship was to Peter, for we are not to think that Cornelius was so grossly ignorant as to take Peter for a god, and to give him divine worship; but the meaning of it is, that he fell down at his feet and gave him an honor and respect beyond what he ought to have done, he was excessive in it: therefore Peter takes him off, ‘Stand up’ (says he): ‘I myself also am a man, I am a man as thou art, though an apostle give me such respect as becomes a minister of Christ, take heed that you give me no more than belongs to a man.’ So the angel, Rev. 22:8, when John falls down at his feet and worships, he takes him up, ‘See thou do it not,’ says he, ‘for I am thy fellow servant:’ This is too much for man, ‘worship God,’ as it is in the end of the verse; such worship belongs properly and peculiarly unto God.</p></blockquote>

ngs%20properly%20and%20peculiarly%20unto%20God&amp;text=There%20is%20a%20civil%20worship%20mentioned%20in%20Scripture&amp;text=such%20worship%20belongs%20properly%20and%20peculiarly%20unto%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>With regard to public worship, the Presbyterian system is characterized by great simplicity and plainness. Many have censured the Presbyterian mode of worship as too plain–as not availing itself enough of those external means which tend to excite reverential emotion. But in this point, also, it took for its rule the simplicity of the Scriptures. The great idea presented in the Gospel is spiritual worship, free alike from multitudinous forms that cumber memory and distract the mind, and from a gorgeous apparatus that dazzles and beguiles the senses. Its object is to direct the eye of faith to the Savior alone, and to fill the mind with nothing but sacred truth. Such is scriptural simplicity in worship and in instruction; and this perfect example the Presbyterian Church strove closely to follow. Praise, prayer, and preaching, all simple, all direct, all spiritual, all from the heart, all for God’s glory and man’s salvation, were the sole elements and aim of Presbyterian worship. This was its idea of what public worship ought to be; because this was all for which the Gospel record gave authority. And the Scottish Reformers firmly held that will-worship was sinful and pernicious; that God alone could prescribe what mode of worship would be acceptable in his sight; and that it was equally dangerous to add to, or to take from, whatsoever God had commanded. They had seen too much of the ignorance, folly, and crime prevalent among those who were addicted to the sensuous and emotional worship of Rome, to attach much value to mere forma and show in matters of religion. And when they turned to the pure and simple worship of the New Testament, they beheld in it the majestic simplicity of the clear blue heavens in their cloudless glory. They felt, therefore, that they were rendering homage to the God of heaven best, when they were worshipping Him after the example of the Lord Jesus Christ and his apostles. No other defense for the plainness and simplicity of their mode of worship would they have offered; and no other defense does any true Presbyterian think it can require–perhaps it were more correct to say, in this very simplicity and plainness, so directly scriptural, consists its greatest merit. And it may be safely said, that in no other system has there been produced a greater amount of religious knowledge, strong faith, and practical piety throughout the entire body of worshippers.</p></blockquote>

</figure><figure class="quote" id="q-50c5c02faf" data-kw="">
<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>

<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>

<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

<blockquote><p>Now these things carry a show of humility, and so those thousands of superstitious ceremonies and ways of worship that have been brought into the Church, they come under the name of zeal and devotion; but observe the Scripture, you shall see: Baptism, the Lord’s Supper, when purely administered although in a grave and holy way, yet in such simplicity and plainness, that there is not the least mention of the least ceremony or traditional worship that afterwards was introduced; and this the apostle meant when he said [that] he was afraid lest the Serpent should beguile them from the simplicity of the Gospel of Christ, 2 Cor. 11:3, [‘But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.’]. Oh that is a worthy place! There is a simplicity in the doctrine, worship, and life of the Gospel, and your minds are easily corrupted from this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture Directory for Church-Officers &amp; People, or, A Practical Commentary upon 1 Cor. 3</cite>, … (London, 1659), on verse 4, p. 55</span></figcaption>

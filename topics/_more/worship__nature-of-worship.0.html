ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ac91a2d43e" data-kw="">
<blockquote><p>Eighthly, God under the New Testament has appointed all his worship in a plain, simple way, not to please the eye, or affect the heart, but only to draw out the spiritual exercise of the soul. Insomuch that it is the most difficult thing that can be: not to be offended at the simplicity of Gods worship now appointed; ‘I am afraid,’ says Paul, ‘as the serpent beguiled Eve, so your minds should be corrupted from the simplicity of the Gospel of Christ.’ [2 cor. 11:3] Paul was afraid of this: the Devil is to be feared more as a glittering subtle serpent than a raging roaring lion: and in nothing does his serpentine art appear more then in introducing worship that is pompous and ceremonious. As children love to play with babies; so do ignorant, carnal people with an external sensible worship. And the more spiritual any ordinance, or the administration of it is, the less glorious it is unto a corrupt heart; whereas a gracious heart [full of God’s grace] sees glorious majesty in spirituality. Christ’s presence in the temple, expounding, informing and reforming, made the second temple more glorious than the former, which did exceed in gold and other magnificence. As the painting of a precious jewel hinders the native and proper luster of it, so does human pomp added to the pure institutions of Christ take off from the innate beauty and glory of them. God indeed in the Old Testament appointed a solemn external worship, full of sensible glory and pomp, but it was because they were infants, and children had rather have a baby than a rich inheritance. Expect therefore in the worship of God, that which may exercise thy faith, heavenly-mindedness, and dependency upon God, which may make a divine impression and stamp upon thy soul, not that which may ravish thy eyes and thy ears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652) | section 3, sermon 27, p. 158</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>

<blockquote><p>What holy invectives does Paul in his epistles make against superstitious worship? Yet how few are the men that mind the pure instituted worship of God, that would have the fountains of Israel without the mixture of any mud in them? Outward oppressions in Popery were nothing so heavy upon the godly as the corrupt mixtures in God’s worship; but if you observe the general disposition of men, they are wholly carried out to some sensible superstitious ways of worship. They love not the simplicity and purity of God’s worship. It is great proficiency in Christianity not to have our minds corrupted herein. As children delight in babies, so do men [delight] in some worships of their own that they have made. What is Popery but a mere stage-play in the worship of God? And if you ask of hundreds of ceremonies they have: ‘Whose image and superscription is upon them?’ You shall find none of God’s imprinted on them. There were the statutes of the heathens (Lev. 20) and these the people must not go in (Eze. 20). There are statutes of our fathers we must not walk in: Oh there is too much of this superstition still in men! Men by false worship manifest they have not spiritual hearts.</p></blockquote>

<blockquote><p>When the worship of God, in its purity and simplicity, is the object of our esteem and love, ’tis the effect of a spiritual frame of soul. During the Levitical dispensation, the service of God was performed with pomp and luster, suitable to the Church in its minority, when faith did need the assistance of the senses: But now the Church is come to mature age, and brought to nearer communion with God, the gaudy allurements of sense are taken away. Men are naturally under the dominion of sense; of this there is the most clear and palpable proof in the heathen world, that would rather worship visible idols than the true invisible God. ‘Tis a certain indication of men’s carnal minds, that they are pleased with carnal service, that lavishly runs out in formalities, which by sympathy works upon them. This affects the eye, and is far more easy than spiritual, inward worship that issues from the strength of the soul and is performed with attention and ardency. This is very disparaging to the nature of God; for it proceeds from the conceiving of Him to be like themselves (who are not heavenly and spiritual) to be pleased with an earthly bodily service. The introducing theatrical ceremonies into the service of God, is directly opposite to the simplicity of the Gospel. Whatever pretenses are made, that they set a gloss upon the plainness of Christian worship and make it more amiable and venerable, they are like the artificial painting of natural beauty that corrupts and does not commend it. The productions of human minds are imperfect at first, and are polished and arrive to perfection by degrees: But divine institutions are complete in their kind at first, and the more they recede from their original, [the more] they lose of their purity and perfection. How acceptable those parts of worship (not chosen and commanded by God) are we may clearly understand by considering that the enjoining such new rites, is a tacit presumption that the reason of man knows better how God should be honored than Himself does; and how unprofitable they are to us, is evident: for being used without his warrant and promise, we cannot expect the conveyance of his grace, and obtaining his favor by them. Only spiritual religion, the inward reality, is of value in his esteem. When the understanding is spiritually enlightened, it esteems the simplicity of Gospel-worship to be its true beauty: ‘Tis like the nakedness of Paradise, the indication of the unstained purity of our first parents in that state. ‘Tis true, in the Worship of God, we are to glorify Him with our bodies, to behave ourselves in such a manner, as may express reverence and excite affection; but the joining human devices upon that pretense, is the snare of conscience and has been fatal to the peace of the Church.</p></blockquote>

<blockquote><p>D. G. Hart writes that ‘worship in the age of the Holy Spirit is not flashy or visibly powerful but instead is so simple that it appears to be inconsequential.’ As we have seen in this book, that is the great problem most of mainstream Christianity has with corporate worship. The traditionally Reformed approach seems so simple that surely something must change. The two main ways to address this are either to make worship far more exciting and entertaining or to make worship far more ethereal and mystical. At least then the act of worship will seem to be significant. What are these simple and seemingly inconsequential means of worship that are spurned by many Christians today? The word, the sacraments, and prayer, all experienced corporately in the life of the church. They are often referred to as the ordinary (there’s that word again) means of grace. Why “ordinary”? There is certainly nothing about the Scriptures that would attract itself to a modern society that has all but given up on reading. What could a book possibly do to give me a spiritual experience? Similarly, what is so spectacular about bread, wine, and water? The elements of the sacraments are culled from mundane, everyday life. “I can get those things at home,” one might object, “so what makes church so special?” And prayer is certainly far from fantastical. Haven’t we all, in our weakest moments, viewed it as a tedious chore? And yet these elements are to fill the worship service because they are ordained by God to communicate His grace and blessing to us. The early church understood this: “And they continued steadfastly in the apostles’ doctrine and fellowship, in the breaking of bread, and in prayers” (Acts 2:42). Do we? Are we content to persist in and dedicate ourselves to these simple means? We must remember that while they appear simple to the naked eye, the eye of faith will see in them so much more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-landry-cruse.html">Jonathan Landry Cruse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Happens When We Worship</cite>, (RHB, 2020)</span></figcaption>

<blockquote><p>But I the rather assent to Alexander Hales, because I have read somewhere, I think it is in Hospinian, de Templis, that the Pope has no organ-piping music in his Church or chapel. And these I account the relics of ancient simplicity in worship, which the Pope received from the first bishops of Rome, and regarded not to make alterations of, without advantage.</p></blockquote>

<blockquote><p>But as the said Jews, I say, did then refuse such waters, so the said people refusing both the said pure and simple worship of God and true Church discipline, and preferring to it that vain, frothy, pompous, human will-worship, or liturgy of Rome, somewhat refined I confess, but yet the very same in substance, therefore did the Lord bring upon them that proud prelatical, hierarchical Church government, by the means of it, the which has at length broken into England, especially, and has so overflowed and passed through it, that it is come, not only to the neck, but even to the very top of the cheeks and ears of some of the best servants of God…</p></blockquote>

</figure><figure class="quote" id="q-9ff29c0ec7" data-kw="">
<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-fenwick.html">William Fenwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Enquiry After Ancient Truths, both in Scripture &amp; Fathers, Touching the Subsistence of the Church of God</cite>, … (London, 1643), pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Religion needs not any such ornaments, except men would make the worship of God, when naked, under shame, and so under sin (for Justice married shame and sin once). But as roses, lillies, the sun, and other glorious creatures, are most beautiful without garments, and not capable of shame; so is the worship of God.</p></blockquote>

<blockquote><p>20. They are not fond of significant mystic ceremonies in the worship and service of God, but rather follow and symbolize that comely Gospel-simplicity which Christ and his apostles used that in the Church of Rome has been sadly marred with the whorish fairdings and gaudrie of human devices, additions and traditions, rather borrowed from the old pagan pagentry than the sacred page: But though they nauseate such relics and pieces of Papistry, yet what rites and ceremonies are decent and convenient, either from the nature or adjuncts of the religious things or actions they are exercised about, they are neither so shay nor foolish as to refuse to use them, K. J. Conf., art: 21, Acts of the Assembly, 1638, ss: 7, Assembly’s Confession, ch. 21, article 1.</p></blockquote>

</figure><figure class="quote" id="q-fd3f638bb2" data-kw="">
<blockquote><p>Not long since [during the times of Romanism] what a stir was there about the more than decent, even superstitious adorning of temples, and building of altars, and brave canopies, what sumptuous things and fine knacks had they, and all to set out a pompous superstitious way of worship? This altogether prevailed; as for the purity and simplicity of Gods ways and worship, how was it trampled under feet as an unworthy contemptible thing? But these things that for a while seemed so glorious, begin to vanish, and we hope ere long will come to nothing, the very memory of them shall perish, the purity of God’s worship, and the simplicity of the Gospel in God’s ordinances shall recover their beauty and glory when those braveries shall be no more.</p></blockquote>

</figure><figure class="quote" id="q-10f17955b5" data-kw="">
<blockquote><p>So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Augustine observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 7, sermon 57</span></figcaption>

<div class="actions"><button class="copy" data-copy="“So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Augustine observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.”

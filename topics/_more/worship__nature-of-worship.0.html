</figure><figure class="quote" id="q-74b6e0f3c8" data-kw="">
<blockquote><p>Lawfulnesse is an essential property of divine worship resulting from God’s particular approving will in his Word, as is clear, Hosea 8:5; 1 Chron. 15:13; Lev. 10:1; 2 Sam. 7:7; Jer. 7:30; Acts 15:24… …for it [arbitrary worship] cannot have its warrant from God’s general will whereby the proposition of a syllogism is warranted, but not the assumption, for thus the golden calfe of Jeroboam, the worshipping of Satan, should be lawful: for I can form a syllogism to it from Scripture (All worship commanded in the Word is lawful, but Jeroboam’s golden calf is commanded in the Word; Therefore, it is lawful… If ceremonies come partly from men’s will, partly from the light of reason, then do they conclude the lawfulness of ceremonies either fallibly or necessarily: If the former be said, we have little warrant of conscience to practice them; nor can God be honored, nor these things lawful, good, and edificative, more than unlawful, evil and unapt to edify, seeing there be no light of Scripture or nature to make them good to us; and because a fallible and unnecessary consequence is over fallible and unnecessary, and stands (as Aristotle says well) in an indivisible point. It is a non-consequence, and so men’s will is the best house that ceremonies are descended of. If they can be proved by a necessary and infallible consequence, we desire to hear it…</p></blockquote>

</figure><figure class="quote" id="q-76b56e04c0" data-kw="">
<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

nment%2C+as+well+as+matters+of+faith%3F+which+those+called+presbyterians+believe+it+is%3B+because+they+find+sufficient+directions+in+it+for+the+decent+and+orderly+performance+of+all+acts+of+worship%2C+without+any+human+supplements%3B+and+such+Church-officers+directed+by+it%2C+such+acts+of+jurisdiction+and+censures+prescribed+in+it%2C+as+are+sufficient+to+preserve+the+unity%2C+peace+and+purity+of+the+Church%3B+which+are+the+great+ends+of+that+government.%E2%80%9D%0A%0A%E2%80%94+English+Presbyterians%2C+Anonymous%2C+English+Presbytery%2C+or+an+Account+of+the+Main+Opinions+of+those+ministers+and+people+in+England+who+go+under+the+name+of+Presbyterians%2C+%E2%80%A6+%28London%2C+1680%29%2C+pp.+1-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76b56e04c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/76b56e04c0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=There%20are%20three%20fundamental%20principles%20held,the%20great%20ends%20of%20that%20government&amp;text=There%20are%20three%20fundamental%20principles%20held%20by%20non%2Dconformists&amp;text=which%20are%20the%20great%20ends%20of%20that%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26081e435a" data-kw="">
<blockquote><p>With regard to the form to be observed in receiving the sacraments, it is not without reason that you entertain doubts and scruples, for nothing is better than to abide by that pure simplicity which we hold from the Son of God, whose ordinance ought to be our single rule, to which also the usage of the apostles was perfectly conformable. And indeed the moment we deviate ever so little from it, our admixture of human invention cannot fail to be a corruption. But it seems to us that your condition is different from that of the pastors of the place and the great body of the people. If the pastors did their duty, they would employ all their endeavours to retrench those superfluities which do not tend to edification, or rather which serve to obscure the clearness of the gospel. The [civil] governors on their part would also do well to see to it. It is a vice to be condemned so far as they are concerned, that they keep up these unmeaning mummeries — which are as it were a residue of Popish superstitions, the recollection of which we should strive as much as in us lies to exterminate. But in your capacity of private individuals, not only you may lawfully, but what is more, you should support and suffer such abuses as it is not in your power to correct. We do not hold lighted candles in the celebration of the eucharist, nor figured bread to be such indifferent things that we would willingly consent to their introduction, or approve of them, though we object not to accommodate ourselves to the use of them, where they have been already established, when we have no authority to oppose them. If we were called upon to receive such ceremonies, we should hold ourselves bound according to the position in which God has placed us, to admit of no compromise in resisting their introduction, and in maintaining constantly the purity which the church confided to us already possesses. But should our lot be cast in some place where a different form prevails, there is not one of us who from spite against a candle or a chasuble [a ministerial vestment] would consent to separate himself from the body of the church, and so deprive himself of the use of the sacrament.</p></blockquote>

<blockquote><p>Edward Bagshaw, p. 12: ‘2. Being present where those things are used in the worship of God, which God has not commanded, this would involve us in the guilt and contagion of them…’ Richard Baxter: Here are two more false doctrines intimated: 1. That to use things in the worship of God which He has not commanded (without exception) is a sin. 2. That being present where they are used involves us in the guilt. Where note: 1. That it is not part of the worship [formally], but things used in the worship that he speaks of. 2. That I proved the contrary to both these at large… and [Bagshaw] gives not a syllable of answer to my twenty instances and many undeniable reasons to the contrary… Sermon notes, meters, tunes, printed Bibles (as printed) and divided into chapters and verses, the words of a sermon or prayer, the particular method, cups, tables, etc. are used in the worship of God without any particular command or any command for this rather than that in cases of indifferency: and yet all these are not therefore unlawful.</p></blockquote>

<blockquote><p>1. There is that in God’s worship which is no part of his worship. 2. There is a secondary worship subservient to God’s institutions which men may make laws about.</p></blockquote>

<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>

<blockquote><p>But No Collection Is To Be Made In The Time of Divine Service Therefore though I cannot like of the disordered gathering for the poor that is in many places, where in the time of divine service you shall see men go up and down asking, receiving, changing, and bestowing of money – wherein many times you shall have them so disagree, that they are louder than the minister – and the rest stand looking, and listening unto them, leaving the worship of God (as though it did not concern them), and thus all is confused; so yet I am persuaded that this is the fittest time to make this provision. And I presume that it is not the meaning of our godly wise rulers in the church and commonwealth (who are abused therein), that any such thing should be done; but that the gathering being made at some other time of day, before or after the divine service, they might have it in a readiness beforehand, to bestow at the end of service upon the needy, according to their discretion; or generally to take some good order that God might be best served, our brethren relieved, and no man justly offended. {And it seems that Justin Martyr would insinuate thus much unto us, that in his time at their public assemblies not only there was collection for the poor, but in this manner. For speaking of all things that were done publicly, he speaks of this last, as though it were last done, when he says: ‘first the books of the prophets and apostles were read; then some exhortation was made to the people; after this there was prayer and thanksgiving.’ [157] Not that there was none before, but then were there solemn prayers for the whole Church, and for them that are in authority. ‘Fourthly, the creatures of bread and wine were blessed and distributed unto the people; and last of all the richer sort did contribute something to the poor, as God did make them able, and willing.’ By which as we may presume that it was his meaning to show that this was their order, that the reading and preaching of the Word of God and prayer went before the sacrament, so all of them before their collection for the poor; so that it did neither prevent any of them, nor was mingled with them; whose example should be our imitation.} 157. Justin Martyr, Apolog. 2 [Cf. First Apology, ch. 67, ANF 1, 186. Cf. Migne, PG 6, 430.] But we may say of this thing [offering during the worship service], as the papists do of private mass (which they cannot defend), that the iniquity of the people brought it in. For when men through covetousness would not follow the rule of the apostle, to put something apart for the poor, as they should find God had blessed them (1 Cor. 16:2), and so bring that with them and have it in readiness, as he says here, being persuaded that it is a duty which God requires of them, and so do it cheerfully (2 Cor. 9:7), as unto Him who has promised to reward it; but being left to their discretion, they have shifted it off as they might; and when divine service was ended, and now nothing more was to be done in the church but that, they would not tarry [for] it. Then, the collectors for the poor were compelled to take them in the midst of God’s service, when for very shame by starting {aside} they could not refuse. But from the beginning it was not so; and seeing God is not the author of confusion, all things in the Church must be done honestly and in good order (1 Cor. 14:33-40). {But what order can there be in this, that then, when the minister is reading or praying, unto the which all should attend without interruption, others should be chopping and changing of money, and squaring about it? Or to speak the best of it, quietly taking out their purse, seeking in it, and distributing out of it? We would think it strange, if while the pastor were thus occupied, some other men should read aloud a chapter in another end of the church, or three or four should begin to sing a psalm. Why then should it not seem as strange unto us, when the minister is occupied in the public service, that others should interpose themselves with gathering of money? Especially seeing that others may better agree together than these two, seeing they are more suitable, as being all of them parts of God’s divine immediate worship, and so is not the gathering and giving of alms, though it be a work of the Sabbath day. Besides, seeing the apostle does justly blame the Corinthians for not using their spiritual gifts so in the public assemblies, as the whole church might be best edified by them – saying, What is to be done then brethren? when ye come together, according as every one of you hath a psalm, or hath a doctrine, or hath a tongue, or hath revelation, or hath interpretation: let all things be done unto edifying (1 Cor. 14:26) – then how much more would he blame them, for so using their temporal gifts in the church, that they should tend to the destruction of themselves, and others? Now for a man, when he is devoutly occupied in any part of God’s public worship, to have another man come and pull him by the sleeve, and to whisper in his ear, and for him then to draw out his purse, and to change money; whether this be likely to edify, or destroy them both, that is, to further, or to hinder them in that about the which then they should be occupied, let other men judge. I am sure it is contrary to an injunction made in the days of our late sovereign Queen Elizabeth, of most blessed and famous memory, which as far as I conceive is not reversed by any of the last canons and ecclesiastical constitutions made in the first year of his Highness’ reign (whom God preserve and bless), in which it was decreed, ‘that no man, woman, or child, should otherwise be occupied in the time of service, than in quiet attendance to hear, mark, and understand that that is read, preached and ministered.’ [158] 158. Elizabeth, Injunct. Article 38 (Q. Iniunct. Articl. 38). [Cf. Injunctions given by the Queens Majesty concerning both the clergy and laity (1559; repr. c.1840), 9]. And so I conclude, that as alms giving is a necessary and perpetual duty to be performed upon the Sabbath day, so that it ought to be performed after that manner that no part of God’s public worship may be hindered, interrupted, or made unprofitable by it.</p></blockquote>

or+the+whole+Church%2C+and+for+them+that+are+in+authority.+%E2%80%98Fourthly%2C+the+creatures+of+bread+and+wine+were+blessed+and+distributed+unto+the+people%3B+and+last+of+all+the+richer+sort+did+contribute+something+to+the+poor%2C+as+God+did+make+them+able%2C+and+willing.%E2%80%99+By+which+as+we+may+presume+that+it+was+his+meaning+to+show+that+this+was+their+order%2C+that+the+reading+and+preaching+of+the+Word+of+God+and+prayer+went+before+the+sacrament%2C+so+all+of+them+before+their+collection+for+the+poor%3B+so+that+it+did+neither+prevent+any+of+them%2C+nor+was+mingled+with+them%3B+whose+example+should+be+our+imitation.%7D+157.+Justin+Martyr%2C+Apolog.+2+%5BCf.+First+Apology%2C+ch.+67%2C+ANF+1%2C+186.+Cf.+Migne%2C+PG+6%2C+430.%5D+But+we+may+say+of+this+thing+%5Boffering+during+the+worship+service%5D%2C+as+the+papists+do+of+private+mass+%28which+they+cannot+defend%29%2C+that+the+iniquity+of+the+people+brought+it+in.+For+when+men+through+covetousness+would+not+follow+the+rule+of+the+apostle%2C+to+put+something+apart+for+the+poor%2C+as+they+should+find+God+had+blessed+them+%281+Cor.+16%3A2%29%2C+and+so+bring+that+with+them+and+have+it+in+readiness%2C+as+he+says+here%2C+being+persuaded+that+it+is+a+duty+which+God+requires+of+them%2C+and+so+do+it+cheerfully+%282+Cor.+9%3A7%29%2C+as+unto+Him+who+has+promised+to+reward+it%3B+but+being+left+to+their+discretion%2C+they+have+shifted+it+off+as+they+might%3B+and+when+divine+service+was+ended%2C+and+now+nothing+more+was+to+be+done+in+the+church+but+that%2C+they+would+not+tarry+%5Bfor%5D+it.+Then%2C+the+collectors+for+the+poor+were+compelled+to+take+them+in+the+midst+of+God%E2%80%99s+service%2C+when+for+very+shame+by+starting+%7Baside%7D+they+could+not+refuse.+But+from+the+beginning+it+was+not+so%3B+and+seeing+God+is+not+the+author+of+confusion%2C+all+things+in+the+Church+must+be+done+honestly+and+in+good+order+%281+Cor.+14%3A33-40%29.+%7BBut+what+order+can+there+be+in+this%2C+that+then%2C+when+the+minister+is+reading+or+praying%2C+unto+the+which+all+should+attend+without+interruption%2C+others+should+be+chopping+and+changing+of+money%2C+and+squaring+about+it%3F+Or+to+speak+the+best+of+it%2C+quietly+taking+out+their+purse%2C+seeking+in+it%2C+and+distributing+out+of+it%3F+We+would+think+it+strange%2C+if+while+the+pastor+were+thus+occupied%2C+some+other+men+should+read+aloud+a+chapter+in+another+end+of+the+church%2C+or+three+or+four+should+begin+to+sing+a+psalm.+Why+then+should+it+not+seem+as+strange+unto+us%2C+when+the+minister+is+occupied+in+the+public+service%2C+that+others+should+interpose+themselves+with+gathering+of+money%3F+Especially+seeing+that+others+may+better+agree+together+than+these+two%2C+seeing+they+are+more+suitable%2C+as+being+all+of+them+parts+of+God%E2%80%99s+divine+immediate+worship%2C+and+so+is+not+the+gathering+and+giving+of+alms%2C+though+it+be+a+work+of+the+Sabbath+day.+Besides%2C+seeing+the+apostle+does+justly+blame+the+Corinthians+for+not+using+their+spiritual+gifts+so+in+the+public+assemblies%2C+as+the+whole+church+might+be+best+edified+by+them+%E2%80%93+saying%2C+What+is+to+be+done+then+brethren%3F+when+ye+come+together%2C+according+as+every+one+of+you+hath+a+psalm%2C+or+hath+a+doctrine%2C+or+hath+a+tongue%2C+or+hath+revelation%2C+or+hath+interpretation%3A+let+all+things+be+done+unto+edifying+%281+Cor.+14%3A26%29+%E2%80%93+then+how+much+more+would+he+blame+them%2C+for+so+using+their+temporal+gifts+in+the+church%2C+that+they+should+tend+to+the+destruction+of+themselves%2C+and+others%3F+Now+for+a+man%2C+when+he+is+devoutly+occupied+in+any+part+of+God%E2%80%99s+public+worship%2C+to+have+another+man+come+and+pull+him+by+the+sleeve%2C+and+to+whisper+in+his+ear%2C+and+for+him+then+to+draw+out+his+purse%2C+and+to+change+money%3B+whether+this+be+likely+to+edify%2C+or+destroy+them+both%2C+that+is%2C+to+further%2C+or+to+hinder+them+in+that+about+the+which+then+they+should+be+occupied%2C+let+other+men+judge.+I+am+sure+it+is+contrary+to+an+injunction+made+in+the+days+of+our+late+sovereign+Queen+Elizabeth%2C+of+most+blessed+and+famous+memory%2C+which+as+far+as+I+conceive+is+not+reversed+by+any+of+the+last+canons+and+ecclesiastical+constitutions+made+in+the+first+year+of+his+Highness%E2%80%99+reign+%28whom+God+preserve+and+bless%29%2C+in+which+it+was+decreed%2C+%E2%80%98that+no+man%2C+woman%2C+or+child%2C+should+otherwise+be+occupied+in+the+time+of+service%2C+than+in+quiet+attendance+to+hear%2C+mark%2C+and+understand+that+that+is+read%2C+preached+and+ministered.%E2%80%99+%5B158%5D+158.+Elizabeth%2C+Injunct.+Article+38+%28Q.+Iniunct.+Articl.+38%29.+%5BCf.+Injunctions+given+by+the+Queens+Majesty+concerning+both+the+clergy+and+laity+%281559%3B+repr.+c.1840%29%2C+9%5D.+And+so+I+conclude%2C+that+as+alms+giving+is+a+necessary+and+perpetual+duty+to+be+performed+upon+the+Sabbath+day%2C+so+that+it+ought+to+be+performed+after+that+manner+that+no+part+of+God%E2%80%99s+public+worship+may+be+hindered%2C+interrupted%2C+or+made+unprofitable+by+it.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+Sabbathum+Veteris+et+Novi+Testamenti%2C+or+The+True+Doctrine+of+the+Sabbath%2C+1635%2C+ed.+Christopher+Coldwell+%28Dallas%2C+TX+and+Grand+Rapids%2C+MI%3A+Naphtali+Press+and+Reformation+Heritage+Books%2C+2015%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39a49d7ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/39a49d7ec1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=But%20No%20Collection%20Is%20To%20Be,interrupted%2C%20or%20made%20unprofitable%20by%20it&amp;text=But%20No%20Collection%20Is%20To%20Be%20Made%20In&amp;text=be%20hindered%2C%20interrupted%2C%20or%20made%20unprofitable%20by%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d60eb4534a" data-kw="">
<blockquote><p>The means for the maintenance of the poor are collected, by the deacons, the first day of the week, and other days of the public assembling of the people to the worship of God, at the entry of the Church. And if this prove not a competency, then do the people either bring in their charity on such days as are appointed by the eldership, or are willing to be taxed, according as they shall be judged to be able. In some cities, and parishes where this order has been carefully observed, none have been suffered to beg, and none have lacked.</p></blockquote>

<blockquote><p>The giving of alms for the support of the suffering, the poor, and the neglected has become an increasingly important liturgical concern [in ‘twentieth-century American Protestantism’]. This is expressed by the fact that the collection of alms is made during the service of worship rather than before it or after it. This was not the older practice; there has always been a certain hesitancy about collecting alms during worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hughes Old, Themes &amp; Variations</cite>, pp. 109-10, as cited in Terry Johnson, Leading in Worship, p. 35, fn. #12</span></figcaption>

<blockquote><p>6. Not everything in what is called a worship service must be worship.¹ The material presence of things or actions do not therein make them formally worship (2 Chron. 6:13; 20:21-23; Neh. 8:4; Acts 20:7-11). While generally speaking a church ought to keep within ‘Principles for the Use of Indifferent Things in Worship’, as that is what is found in the Word, yet, again, there is no necessary rule that all worship must be continuous. ¹ See historic reformed writers affirm: ‘Not Everything in what is called a Worship Service must be Worship’. The Reformed in the Post-Reformation sometimes held a monetary offering to be indifferent and able to be prudently done in the worship service,¹ even in the Church of Scotland.² The Westminster Assembly on a fast day filled with worship took a collection for maimed soldiers at the end.³ Westminster, allowing for the view and practice expressed, said in her Directory for the Public Worship of God, ‘Celebration of the Communion’: “The collection for the poor is so to be ordered, that no part of the public worship be thereby hindered.” The same might be said for children’s church. ¹ At the Reformation the collection of money (and possibly other things) was frequently moved from being with the offering of the Mass to after the Lord’s Supper, and was designated for the poor. On the continent it was often done as a part of the service, either at the dismissal, or just before: Hughes O. Old, The Patristic Roots of Reformed Worship (Zurich: Theologischer Verlag Zurich, 1975), pp. 28, 46, 49, 53-54, 63, 184, 310. In the Anglican Church it was done at the Lord’s Supper; see the reform made by Cranmer, illustrating his thought, in Horton Davies, Worship &amp; Theology in England: from Cranmer to Hooker, 1534-1603 (Princeton University Press, 1973), p. 188. Even a paradigmatic separatist congregation in Amsterdam, pastored by an English puritan turned separatist, had a similar practice: Ibid, p. 339. The partially conforming puritan, Nicholas Bownd, though against a collection in the service due to disturbances, yet testifies of the practice in his context: Bownd, Sabbathum Veteris et Novi Testamenti: or The True Doctrine of the Sabbath, ed. Chris Coldwell (Naphtali Press &amp; Reformation Heritage Books, 2015), pp. 353-55. The presbyterian and independent ministers’ request to the Anglican Church at the Savoy Conference (1661) shows what was happening and is consistent with pragmatic reasons: that the “Collection for the poor may be better made at or a little before the departing of the communicants.” The Grand Debate between the most reverend Bishops &amp; the Presbyterian Divines appointed by His Sacred Majesty as Commissioners for the Review &amp; Alteration of the Book of Common Prayer... (London, 1661), ‘Exceptions’, p. 15 ² William McMillan documents the collection often being taken when coming to sit at the Lord’s Table, or while there: The Worship of the Scottish Reformed Church, 1550-1638... (London: Clarke, 1931) ch. 18, pp. 220-21; Frederick W. McNally, The Westminster Directory, its Origin &amp; Significance, PhD diss. (University of Edinburgh, 1958), pp. 325-27 ³ John Lightfoot, Journal of the Proceedings of the Assembly of Divines, John R. Pitman (London: 1824) in The Whole Works of John Lightfoot, vol. 13, Oct. 17, 1643, p. 19 Thomas Cartwright (d. 1603) was a father of presbyterianism and puritanism in the late-1500’s and a partial-conformist to the Anglican Church government and worship. Over things he did not agree with therein, the chief political advisor to Queen Elizabeth was appealed to by Edward Dering (d. 1576), another presbyterian partial-conformist, to exhort Cartwright “to use Christian liberty and to bear with the time[s].”¹ That is, if something is not impious or of itself immoral (such as children’s church is not), with sufficient justification it may be done as part of one’s liberty in Christian life, though it be in a worship service and may be considered as worship by others. See this puritan principle of partial conformity soundly theologically set forth and defended.² ¹ Peter Lake, Moderate Puritans &amp; the Elizabethean Church (Cambridge University Press, 1982), p. 19 ² See Fentiman’s quote under ‘Not Everything in what is called a Worship Service must be Worship’, the book by English, Partially Conforming Puritans, A Refutation of the Errors of Separatists (1644; RBO, 2025) and the page at large, ‘On Occasional &amp; Principled Partial Conformity without Sin, or Moderate Puritanism’.</p></blockquote>

<blockquote><p>For, whereas worshipping God in, by, or before a creature respective [repectively], or with relation to the creature, may be understood before it respective, or with relation to it, as the terminus [end], or object to which it is directed; as worshipping before, Lk. 4:7, is worshipping of Satan, Mt. 4:9, and the relation to the creature may be as conceiving God included in it, as in the consecrated host, or represented by it, as by the golden calf, or a crucifix, or as pertaining to God, being consecrated to Him, as Gideon’s ephod, or Popish relics of saints or hallowed grains or the like, without God’s institution. In these and such like relations, the adoration being directed to the creatures, whether as the only object to which, or the intermediate object, whether properly or improperly; of itself or by accident… But he [the opponent] thought it best… to express himself more intelligibly… in the minor [proposition], that: ‘kneeling is adoration or worshipping of God before the creature respectivè, or with relation to the creature, as the objectum significativè à quo [the signifying object from which], or the motive of the kneeling.’ But in this sense I deny his major [proposition, that this be idolatry]; and that he may not think me bereft of my wits, but that I know what I say, I give him this reason of my denial: I find the Holy Ghost inviting the Jews to worship at God’s footstool, his holy hill, Ps. 99:5, 9, which were creatures; and there they were to bow down to God, in, by or before these creatures respective, or with relation to them, as the objectum significative a quo, that is, that thing which was an object signifying God’s presence there, and the motive of their bowing down to God; which, if they had not been there, that is, the ark, temple, altar, they would not have done; and there was no idolatry therein. And to stop the evasion, that it was so, when God appointed it, though this would not avoid the instance, the bread and wine being of God’s appointment, and the use of them in the sacrament of the Lord’s Supper, as well as the altar, ark, temple, were, they were instituted to be memorative signs of Christ’s body and blood, communicated to the receivers by faith; yet I find that adoration or worshipping of God before the creature respective, or with relation to it, as the objectum significative a quo, and the motive of the adoration, has been performed occasionally without institution, and yet no idolatry committed. When the Israelites at mount Carmel, 1 Kn. 18:38, saw the fire of the Lord fall and consume the burnt offering and the wood, and the stones, and the dust, and lick up the water that was in the trench, they fell on their faces and they said, ‘The Lord He is God, the Lord He is the God.’ Here was adoration of God before the creature respective, or with relation to it, as the objectum significative a quo, signifying the Lord to be God; and as the motive of that adoration, which, if it had not been there, they would not have done it; and yet no idolatry committed. Another instance is 2 Chron. 7:3, when all the children of Israel saw how the fire came down, and the glory of the Lord upon the house, they bowed themselves with their faces to the ground upon the pavement, and worshipped and praised the Lord, saying, ‘For He is good, for his mercy endureth forever.’ Here was adoration and worshipping God, in, by or before a creature, not having special institution, abiding in their sight, as the objectum significative a quo, or the motive of their adoration, and worship of the Lord, and yet no Idolatry. I confess that when the worship is before it, so as it is directed to it, as upon the sight of the bread, or a crucifix, the host, or a crucifix is worshipped, whether terminatively, or as the representative of another, it is idolatry: As If Job, when he had seen the un when it shined, or the moon walking in brightness, his heart had been secretly enticed, and his mouth had kissed his hand, as it is Job 31:26-27, it had been idolatry: For then the sun had been not only objectum a quo [the object from which], the motive or occasion, but also objectum ad quod [the object to which], or the terminus ad quem [the end to which], to which it had been directed. But if he had only taken occasion, upon the sight of the sun, to worship God, as David did, Ps. 8:3, magnify or worship God the Creator, it had been no idolatry, though the moon or sun were the objectum a quo significative, or the sight 〈◊〉 it, the motive to it. Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship, there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members… for the adoring of God, though it be at the receiving the elements, yet the elements are not objectum significative a quo, or the motive of their kneeling, according to the [Anglican] Common-Prayer Book, which says that the order in the office for the administration of the Lord’s Supper, that: ‘The communicants should receive it kneeling, is well meant, for a signification of our humble and grateful acknowledgement of the benefits of Christ, therein given to all worthy receivers; and for the avoiding of such profanation and disorder in the holy Communion as might otherwise ensue: That thereby no adoration is intended, or ought to be done, either unto the sacramental bread and wine there bodily received, or unto any corporal presence of Christ’s natural flesh and blood.’ Which intimate that the elements are not the objectum significative a quo, or the motive of their kneeling; but the benefits of Christ in the Lord’s Supper, given to all worthy receivers; And that, not the sight of bread or wine, (which is not seen till the cup be in their hand) but the remembrance of Christ’s death, and the remission of sins by his blood, by faith, are the motive to kneel to God, with prayer and thanksgiving to Him, without any honor of the bread and wine, though received, eaten and drunk, to remember Christ’s death, as the procuring cause of those benefits. As for his [the opponent’s] reason, if the elements were not there, they would not kneel; therefore they are the objectum significative a quo, or the motive of their kneeling; partly the antecedent is not true, for they kneel before they receive the elements brought to them, and after they have eaten and drunk, while they are in the meditation of Christs death, and the benefits by it, using holy ejaculation in prayer and thanksgiving to God…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For, whereas worshipping God in, by, or before a creature respective [repectively], or with relation to the creature, may be understood before it respective, or with relation to it, as the terminus [end], or object to which it is directed; as worshipping before, Lk. 4:7, is worshipping of Satan, Mt. 4:9, and the relation to the creature may be as conceiving God included in it, as in the consecrated host, or represented by it, as by the golden calf, or a crucifix, or as pertaining to God, being consecrated to Him, as Gideon’s ephod, or Popish relics of saints or hallowed grains or the like, without God’s institution. In these and such like relations, the adoration being directed to the creatures, whether as the only object to which, or the intermediate object, whether properly or improperly; of itself or by accident… But he [the opponent] thought it best… to express himself more intelligibly… in the minor [proposition], that: ‘kneeling is adoration or worshipping of God before the creature respectivè, or with relation to the creature, as the objectum significativè à quo [the signifying object from which], or the motive of the kneeling.’ But in this sense I deny his major [proposition, that this be idolatry]; and that he may not think me bereft of my wits, but that I know what I say, I give him this reason of my denial: I find the Holy Ghost inviting the Jews to worship at God’s footstool, his holy hill, Ps. 99:5, 9, which were creatures; and there they were to bow down to God, in, by or before these creatures respective, or with relation to them, as the objectum significative a quo, that is, that thing which was an object signifying God’s presence there, and the motive of their bowing down to God; which, if they had not been there, that is, the ark, temple, altar, they would not have done; and there was no idolatry therein. And to stop the evasion, that it was so, when God appointed it, though this would not avoid the instance, the bread and wine being of God’s appointment, and the use of them in the sacrament of the Lord’s Supper, as well as the altar, ark, temple, were, they were instituted to be memorative signs of Christ’s body and blood, communicated to the receivers by faith; yet I find that adoration or worshipping of God before the creature respective, or with relation to it, as the objectum significative a quo, and the motive of the adoration, has been performed occasionally without institution, and yet no idolatry committed. When the Israelites at mount Carmel, 1 Kn. 18:38, saw the fire of the Lord fall and consume the burnt offering and the wood, and the stones, and the dust, and lick up the water that was in the trench, they fell on their faces and they said, ‘The Lord He is God, the Lord He is the God.’ Here was adoration of God before the creature respective, or with relation to it, as the objectum significative a quo, signifying the Lord to be God; and as the motive of that adoration, which, if it had not been there, they would not have done it; and yet no idolatry committed. Another instance is 2 Chron. 7:3, when all the children of Israel saw how the fire came down, and the glory of the Lord upon the house, they bowed themselves with their faces to the ground upon the pavement, and worshipped and praised the Lord, saying, ‘For He is good, for his mercy endureth forever.’ Here was adoration and worshipping God, in, by or before a creature, not having special institution, abiding in their sight, as the objectum significative a quo, or the motive of their adoration, and worship of the Lord, and yet no Idolatry. I confess that when the worship is before it, so as it is directed to it, as upon the sight of the bread, or a crucifix, the host, or a crucifix is worshipped, whether terminatively, or as the representative of another, it is idolatry: As If Job, when he had seen the un when it shined, or the moon walking in brightness, his heart had been secretly enticed, and his mouth had kissed his hand, as it is Job 31:26-27, it had been idolatry: For then the sun had been not only objectum a quo [the object from which], the motive or occasion, but also objectum ad quod [the object to which], or the terminus ad quem [the end to which], to which it had been directed. But if he had only taken occasion, upon the sight of the sun, to worship God, as David did, Ps. 8:3, magnify or worship God the Creator, it had been no idolatry, though the moon or sun were the objectum a quo significative, or the sight 〈◊〉 it, the motive to it. Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship, there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members… for the adoring of God, though it be at the receiving the elements, yet the elements are not objectum significative a quo, or the motive of their kneeling, according to the [Anglican] Common-Prayer Book, which says that the order in the office for the administration of the Lord’s Supper, that: ‘The communicants should receive it kneeling, is well meant, for a signification of our humble and grateful acknowledgement of the benefits of Christ, therein given to all worthy receivers; and for the avoiding of such profanation and disorder in the holy Communion as might otherwise ensue: That thereby no adoration is intended, or ought to be done, either unto the sacramental bread and wine there bodily received, or unto any corporal presence of Christ’s natural flesh and blood.’ Which intimate that the elements are not the objectum significative a quo, or the motive of their kneeling; but the benefits of Christ in the Lord’s Supper, given to all worthy receivers; And that, not the sight of bread or wine, (which is not seen till the cup be in their hand) but the remembrance of Christ’s death, and the remission of sins by his blood, by faith, are the motive to kneel to God, with prayer and thanksgiving to Him, without any honor of the bread and wine, though received, eaten and drunk, to remember Christ’s death, as the procuring cause of those benefits. As for his [the opponent’s] reason, if the elements were not there, they would not kneel; therefore they are the objectum significative a quo, or the motive of their kneeling; partly the antecedent is not true, for they kneel before they receive the elements brought to them, and after they have eaten and drunk, while they are in the meditation of Christs death, and the benefits by it, using holy ejaculation in prayer and thanksgiving to God…”

— John Tombes, Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast, … (London: E. Cotes, 1667) 333 pp. ToC | ch. 7, section 15, ‘Kneeling in receiving the sacramental elements is not idolatry’, pp. 257-60">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%2C+whereas+worshipping+God+in%2C+by%2C+or+before+a+creature+respective+%5Brepectively%5D%2C+or+with+relation+to+the+creature%2C+may+be+understood+before+it+respective%2C+or+with+relation+to+it%2C+as+the+terminus+%5Bend%5D%2C+or+object+to+which+it+is+directed%3B+as+worshipping+before%2C+Lk.+4%3A7%2C+is+worshipping+of+Satan%2C+Mt.+4%3A9%2C+and+the+relation+to+the+creature+may+be+as+conceiving+God+included+in+it%2C+as+in+the+consecrated+host%2C+or+represented+by+it%2C+as+by+the+golden+calf%2C+or+a+crucifix%2C+or+as+pertaining+to+God%2C+being+consecrated+to+Him%2C+as+Gideon%E2%80%99s+ephod%2C+or+Popish+relics+of+saints+or+hallowed+grains+or+the+like%2C+without+God%E2%80%99s+institution.+In+these+and+such+like+relations%2C+the+adoration+being+directed+to+the+creatures%2C+whether+as+the+only+object+to+which%2C+or+the+intermediate+object%2C+whether+properly+or+improperly%3B+of+itself+or+by+accident%E2%80%A6+But+he+%5Bthe+opponent%5D+thought+it+best%E2%80%A6+to+express+himself+more+intelligibly%E2%80%A6+in+the+minor+%5Bproposition%5D%2C+that%3A+%E2%80%98kneeling+is+adoration+or+worshipping+of+God+before+the+creature+respectiv%C3%A8%2C+or+with+relation+to+the+creature%2C+as+the+objectum+significativ%C3%A8+%C3%A0+quo+%5Bthe+signifying+object+from+which%5D%2C+or+the+motive+of+the+kneeling.%E2%80%99+But+in+this+sense+I+deny+his+major+%5Bproposition%2C+that+this+be+idolatry%5D%3B+and+that+he+may+not+think+me+bereft+of+my+wits%2C+but+that+I+know+what+I+say%2C+I+give+him+this+reason+of+my+denial%3A+I+find+the+Holy+Ghost+inviting+the+Jews+to+worship+at+God%E2%80%99s+footstool%2C+his+holy+hill%2C+Ps.+99%3A5%2C+9%2C+which+were+creatures%3B+and+there+they+were+to+bow+down+to+God%2C+in%2C+by+or+before+these+creatures+respective%2C+or+with+relation+to+them%2C+as+the+objectum+significative+a+quo%2C+that+is%2C+that+thing+which+was+an+object+signifying+God%E2%80%99s+presence+there%2C+and+the+motive+of+their+bowing+down+to+God%3B+which%2C+if+they+had+not+been+there%2C+that+is%2C+the+ark%2C+temple%2C+altar%2C+they+would+not+have+done%3B+and+there+was+no+idolatry+therein.+And+to+stop+the+evasion%2C+that+it+was+so%2C+when+God+appointed+it%2C+though+this+would+not+avoid+the+instance%2C+the+bread+and+wine+being+of+God%E2%80%99s+appointment%2C+and+the+use+of+them+in+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+as+well+as+the+altar%2C+ark%2C+temple%2C+were%2C+they+were+instituted+to+be+memorative+signs+of+Christ%E2%80%99s+body+and+blood%2C+communicated+to+the+receivers+by+faith%3B+yet+I+find+that+adoration+or+worshipping+of+God+before+the+creature+respective%2C+or+with+relation+to+it%2C+as+the+objectum+significative+a+quo%2C+and+the+motive+of+the+adoration%2C+has+been+performed+occasionally+without+institution%2C+and+yet+no+idolatry+committed.+When+the+Israelites+at+mount+Carmel%2C+1+Kn.+18%3A38%2C+saw+the+fire+of+the+Lord+fall+and+consume+the+burnt+offering+and+the+wood%2C+and+the+stones%2C+and+the+dust%2C+and+lick+up+the+water+that+was+in+the+trench%2C+they+fell+on+their+faces+and+they+said%2C+%E2%80%98The+Lord+He+is+God%2C+the+Lord+He+is+the+God.%E2%80%99+Here+was+adoration+of+God+before+the+creature+respective%2C+or+with+relation+to+it%2C+as+the+objectum+significative+a+quo%2C+signifying+the+Lord+to+be+God%3B+and+as+the+motive+of+that+adoration%2C+which%2C+if+it+had+not+been+there%2C+they+would+not+have+done+it%3B+and+yet+no+idolatry+committed.+Another+instance+is+2+Chron.+7%3A3%2C+when+all+the+children+of+Israel+saw+how+the+fire+came+down%2C+and+the+glory+of+the+Lord+upon+the+house%2C+they+bowed+themselves+with+their+faces+to+the+ground+upon+the+pavement%2C+and+worshipped+and+praised+the+Lord%2C+saying%2C+%E2%80%98For+He+is+good%2C+for+his+mercy+endureth+forever.%E2%80%99+Here+was+adoration+and+worshipping+God%2C+in%2C+by+or+before+a+creature%2C+not+having+special+institution%2C+abiding+in+their+sight%2C+as+the+objectum+significative+a+quo%2C+or+the+motive+of+their+adoration%2C+and+worship+of+the+Lord%2C+and+yet+no+Idolatry.+I+confess+that+when+the+worship+is+before+it%2C+so+as+it+is+directed+to+it%2C+as+upon+the+sight+of+the+bread%2C+or+a+crucifix%2C+the+host%2C+or+a+crucifix+is+worshipped%2C+whether+terminatively%2C+or+as+the+representative+of+another%2C+it+is+idolatry%3A+As+If+Job%2C+when+he+had+seen+the+un+when+it+shined%2C+or+the+moon+walking+in+brightness%2C+his+heart+had+been+secretly+enticed%2C+and+his+mouth+had+kissed+his+hand%2C+as+it+is+Job+31%3A26-27%2C+it+had+been+idolatry%3A+For+then+the+sun+had+been+not+only+objectum+a+quo+%5Bthe+object+from+which%5D%2C+the+motive+or+occasion%2C+but+also+objectum+ad+quod+%5Bthe+object+to+which%5D%2C+or+the+terminus+ad+quem+%5Bthe+end+to+which%5D%2C+to+which+it+had+been+directed.+But+if+he+had+only+taken+occasion%2C+upon+the+sight+of+the+sun%2C+to+worship+God%2C+as+David+did%2C+Ps.+8%3A3%2C+magnify+or+worship+God+the+Creator%2C+it+had+been+no+idolatry%2C+though+the+moon+or+sun+were+the+objectum+a+quo+significative%2C+or+the+sight+%E3%80%88%E2%97%8A%E3%80%89+it%2C+the+motive+to+it.+Till+divine+worship+be+given+to+a+creature%2C+it+is+not+idolatry%2C+although+in+the+kind+or+means+of+worship%2C+there+may+be+will-worship%3B+and+in+the+opinion+of+those+that+count+their+act+or+the+object+to+be+holy%2C+when+it+is+not%2C+there+may+be+superstition+of+the+mind%3B+and+in+the+use+of+such+things%2C+or+forbearing+their+use%2C+superstition+in+the+members%E2%80%A6+for+the+adoring+of+God%2C+though+it+be+at+the+receiving+the+elements%2C+yet+the+elements+are+not+objectum+significative+a+quo%2C+or+the+motive+of+their+kneeling%2C+according+to+the+%5BAnglican%5D+Common-Prayer+Book%2C+which+says+that+the+order+in+the+office+for+the+administration+of+the+Lord%E2%80%99s+Supper%2C+that%3A+%E2%80%98The+communicants+should+receive+it+kneeling%2C+is+well+meant%2C+for+a+signification+of+our+humble+and+grateful+acknowledgement+of+the+benefits+of+Christ%2C+therein+given+to+all+worthy+receivers%3B+and+for+the+avoiding+of+such+profanation+and+disorder+in+the+holy+Communion+as+might+otherwise+ensue%3A+That+thereby+no+adoration+is+intended%2C+or+ought+to+be+done%2C+either+unto+the+sacramental+bread+and+wine+there+bodily+received%2C+or+unto+any+corporal+presence+of+Christ%E2%80%99s+natural+flesh+and+blood.%E2%80%99+Which+intimate+that+the+elements+are+not+the+objectum+significative+a+quo%2C+or+the+motive+of+their+kneeling%3B+but+the+benefits+of+Christ+in+the+Lord%E2%80%99s+Supper%2C+given+to+all+worthy+receivers%3B+And+that%2C+not+the+sight+of+bread+or+wine%2C+%28which+is+not+seen+till+the+cup+be+in+their+hand%29+but+the+remembrance+of+Christ%E2%80%99s+death%2C+and+the+remission+of+sins+by+his+blood%2C+by+faith%2C+are+the+motive+to+kneel+to+God%2C+with+prayer+and+thanksgiving+to+Him%2C+without+any+honor+of+the+bread+and+wine%2C+though+received%2C+eaten+and+drunk%2C+to+remember+Christ%E2%80%99s+death%2C+as+the+procuring+cause+of+those+benefits.+As+for+his+%5Bthe+opponent%E2%80%99s%5D+reason%2C+if+the+elements+were+not+there%2C+they+would+not+kneel%3B+therefore+they+are+the+objectum+significative+a+quo%2C+or+the+motive+of+their+kneeling%3B+partly+the+antecedent+is+not+true%2C+for+they+kneel+before+they+receive+the+elements+brought+to+them%2C+and+after+they+have+eaten+and+drunk%2C+while+they+are+in+the+meditation+of+Christs+death%2C+and+the+benefits+by+it%2C+using+holy+ejaculation+in+prayer+and+thanksgiving+to+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+Theodulia%2C+or+a+Just+Defence+of+Hearing+the+Sermons+%26+other+teaching+of+the+present+Ministers+of+England+against+a+book+unjustly+entitled%2C+A+Christian+testimony+against+them+that+serve+the+image+of+the+beast%2C+%E2%80%A6+%28London%3A+E.+Cotes%2C+1667%29+333+pp.+ToC+%7C+ch.+7%2C+section+15%2C+%E2%80%98Kneeling+in+receiving+the+sacramental+elements+is+not+idolatry%E2%80%99%2C+pp.+257-60&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb4154b57e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/cb4154b57e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=For%2C%20whereas%20worshipping%20God%20in%2C%20by,in%20prayer%20and%20thanksgiving%20to%20God&amp;text=For%2C%20whereas%20worshipping%20God%20in%2C%20by%2C%20or%20before&amp;text=holy%20ejaculation%20in%20prayer%20and%20thanksgiving%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>He [the pastor] begins the [public] worship with prayer and praising, and closes therewith (as the apostles, Acts 20:18,19,36; Matt 26:30, as the church of Corinth added to prophesying praying and the singing of psalms, 1 Cor. 14:14-17, and as this moral worship was ordinary to the Jews).</p></blockquote>

<blockquote><p>The worship of God is twofold: principal or less principal. The Lord says, Hos. 6:6, ‘I will mercy, not sacrifice,’ that is, rather mercy than sacrifice. Where mercy is made the main and principal worship of God, and sacrifice also is worship, but the necessary or less principal… This principal worship has two properties. The first is eternity: for it begins in this life, and is perfected in the life to come. Because it is that everlasting worship wherewith angels and saints shall forever worship God in Heaven. And herein it differes from ceremonies and sacraments, which have an end in this life. The second is that it pleases God of itself, and that without sacraments or ceremonies: so there be no contempt of them: s it was in the thief upon the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, pp. 702-3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The worship of God is twofold: principal or less principal. The Lord says, Hos. 6:6, ‘I will mercy, not sacrifice,’ that is, rather mercy than sacrifice. Where mercy is made the main and principal worship of God, and sacrifice also is worship, but the necessary or less principal… This principal worship has two properties. The first is eternity: for it begins in this life, and is perfected in the life to come. Because it is that everlasting worship wherewith angels and saints shall forever worship God in Heaven. And herein it differes from ceremonies and sacraments, which have an end in this life. The second is that it pleases God of itself, and that without sacraments or ceremonies: so there be no contempt of them: s it was in the thief upon the cross.”

— William Perkins, ‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works, (d. 1602; London: Legatt, 1626), vol. 1, pp. 702-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+worship+of+God+is+twofold%3A+principal+or+less+principal.+The+Lord+says%2C+Hos.+6%3A6%2C+%E2%80%98I+will+mercy%2C+not+sacrifice%2C%E2%80%99+that+is%2C+rather+mercy+than+sacrifice.+Where+mercy+is+made+the+main+and+principal+worship+of+God%2C+and+sacrifice+also+is+worship%2C+but+the+necessary+or+less+principal%E2%80%A6+This+principal+worship+has+two+properties.+The+first+is+eternity%3A+for+it+begins+in+this+life%2C+and+is+perfected+in+the+life+to+come.+Because+it+is+that+everlasting+worship+wherewith+angels+and+saints+shall+forever+worship+God+in+Heaven.+And+herein+it+differes+from+ceremonies+and+sacraments%2C+which+have+an+end+in+this+life.+The+second+is+that+it+pleases+God+of+itself%2C+and+that+without+sacraments+or+ceremonies%3A+so+there+be+no+contempt+of+them%3A+s+it+was+in+the+thief+upon+the+cross.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works%2C+%28d.+1602%3B+London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+pp.+702-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F397e4d5875.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/397e4d5875.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=The%20worship%20of%20God%20is%20twofold,in%20the%20thief%20upon%20the%20cross&amp;text=The%20worship%20of%20God%20is%20twofold%3A%20principal%20or&amp;text=it%20was%20in%20the%20thief%20upon%20the%20cross" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>

<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme, or the Grounds &amp; Principles of Christian Religion</cite>, … (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’, pp. 114-16</span></figcaption>

ma" href="../../quote/15b44f5f14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=Q.%20What%20is%20the%20main%20scope,makes%20Himself%20known%20unto%20his%20people&amp;text=Q.%20What%20is%20the%20main%20scope%20of%20the&amp;text=whereby%20He%20makes%20Himself%20known%20unto%20his%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>They offered fire that God had not commanded. Hence I say that all things in Gods worship must have a warrant out of God’s Word, must be commanded. It’s not enough that it is not forbidden: I beseech you observe it: it is not enough that a thing is not forbidden, and what hurt is there in it? But it must be commanded: I confess in matters that are civil and natural, there this may be enough; If it be but according to the rules of prudence, and not forbidden in the Word; we may make use of this in civil and natural things. But now when we come to matters of religion, and the worship of God, we must either have a command, or some what out of God’s Word by some consequence drawn from some command wherein God manifests his will; either a direct command, or by comparing one thing with another, or drawing consequences plainly from the words. We must have a warrant of the worship of God… It’s true, there are some things in the worship of God that are natural and civil helps, and there we need not have any command: As for instance; when we come to worship God, the congregation meets, they must have a convenient place to keep the air and weather from them: now this is but a natural help, and so far as I use the place of worship as a natural help I need have no command. But if I will put any thing in a place beyond what it has in its own nature, there I must look for a command. For if I account one place more holy than another; or to think that God should accept of worship in one place rather than in another: This is to raise it above what it is in its own nature. So that when any creature is raised in a religious way, above what it has in it by nature; if I have not Scripture to warrant me I am therein superstitious. It’s a very useful rule for to help you: If any creature that you make any use of in a way of religion beyond what it has in its own nature, if you have not some warrant from the Word of God (whatsoever specious show there may be in it) it is superstition. As now for the place, there was a place that was holy, but then it had an institution from God. And so for garments, to use those that are decent, the light of reason is enough: but if I will put any thing upon them beyond what there is in them in their own nature, as heretofore in a surplice, what, had that any more decency in its own nature, but only man’s institution? Now when man shall put a religious respect upon a thing, by virtue of his own institution when he has not a warrant from God; here’s superstition! … Now God has written the law of natural worship in our hearts, as that we should love God, fear God, trust in God, and pray to God; this God has written in our hearts: But there are other things in the worship of God that are not written in our hearts, that only depend upon the Will of God revealed in his Word, which were no duties except they were revealed in his Word. And these are of such a nature as we can see no reason for, but only this, because God will have them. As now, there are many kinds of ceremonies to manifest honor to princes that there is no reason for them at all, but merely because it is a civil institution so appointed: So God would have some ways for the honoring of Him, that the creature should not see into the reason of them, but merely the Will of God to have them so:</p></blockquote>

+a+very+useful+rule+for+to+help+you%3A+If+any+creature+that+you+make+any+use+of+in+a+way+of+religion+beyond+what+it+has+in+its+own+nature%2C+if+you+have+not+some+warrant+from+the+Word+of+God+%28whatsoever+specious+show+there+may+be+in+it%29+it+is+superstition.+As+now+for+the+place%2C+there+was+a+place+that+was+holy%2C+but+then+it+had+an+institution+from+God.+And+so+for+garments%2C+to+use+those+that+are+decent%2C+the+light+of+reason+is+enough%3A+but+if+I+will+put+any+thing+upon+them+beyond+what+there+is+in+them+in+their+own+nature%2C+as+heretofore+in+a+surplice%2C+what%2C+had+that+any+more+decency+in+its+own+nature%2C+but+only+man%E2%80%99s+institution%3F+Now+when+man+shall+put+a+religious+respect+upon+a+thing%2C+by+virtue+of+his+own+institution+when+he+has+not+a+warrant+from+God%3B+here%E2%80%99s+superstition%21+%E2%80%A6+Now+God+has+written+the+law+of+natural+worship+in+our+hearts%2C+as+that+we+should+love+God%2C+fear+God%2C+trust+in+God%2C+and+pray+to+God%3B+this+God+has+written+in+our+hearts%3A+But+there+are+other+things+in+the+worship+of+God+that+are+not+written+in+our+hearts%2C+that+only+depend+upon+the+Will+of+God+revealed+in+his+Word%2C+which+were+no+duties+except+they+were+revealed+in+his+Word.+And+these+are+of+such+a+nature+as+we+can+see+no+reason+for%2C+but+only+this%2C+because+God+will+have+them.+As+now%2C+there+are+many+kinds+of+ceremonies+to+manifest+honor+to+princes+that+there+is+no+reason+for+them+at+all%2C+but+merely+because+it+is+a+civil+institution+so+appointed%3A+So+God+would+have+some+ways+for+the+honoring+of+Him%2C+that+the+creature+should+not+see+into+the+reason+of+them%2C+but+merely+the+Will+of+God+to+have+them+so%3A%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Worship%2C+%E2%80%A6+%28London%2C+1653%29%2C+Sermon+1%2C+pp.+9-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf1d5cb57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/eaf1d5cb57.html">Permalink</a><a class="src" h </figure><figure class="quote" id="q-ee9c14edcf" data-kw="">
<blockquote><p>Herein it [the 2nd Commandment] differs from the First Commandment, that commanded the worship of God which is natural, this the worship which is by divine institution. Downame Sum of Divinity. Cultus naturalis [natural worship] is that which nature directs all people to, or which arises from the nature of God. This belongs to all reasonable creatures. He that acknowledges there is a God, will acknowledge that He is to be be believed, feared, trusted, loved and prayed to: this was performed by Adam in Paradise and by the angels in Heaven, Isa. 6:3; Heb. 1:6. Cultus institutus, ‘instituted worship’ depends on the revelation of the will of God, this was commanded Adam in his innocency, as the Tree of Knowledge of Good and Evil, and the Tree of Life show. Natural worship is the chief, instituted worship may be interrupted. A time of worship is juris naturalis [of the law of nature], the seventh day juris positivi [of positive law]. Some in these days say all institutions are mere forms, and men may use or not use them at their pleasure according to their light: Qui non est religiosus non est Christianus. Cultus institutus est medium ex Dei voluntate ordinatum, ad cultum naturalem exercendum et pro nov•ndum. indica•tur hujusmodi media omnia à Deo instituta, in secundò praecepto per prohibitionem oppositorum mediorum omnium cultus ab hominibus excogitatorum, sub titulo sculptilis et imaginis, que cum praecipua fuerunt olim▪ hominum inventa, cultum Dei depravantia, aptissimè proponuntur (per Syn••dochen in Decalogo praecipuam) loco omnium humani ingenii commentorum ad cu••um spectantium. Ames, Marrow of Theology, bk. 2, ch. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), bk. 9, ch. 3, ‘2nd Commandment’, p. 767 margin note on Dt., 4:15-19</span></figcaption>

</figure><figure class="quote" id="q-c297e9359a" data-kw="">
<blockquote><p>Let me now perswade you to rejoyce evermore by the two arguments of necessity and utility. 1. The necessity of it: (1) That you may own God as your God, delighting in God is a duty of the First Commandment, ‘Thou shalt have no other gods before Me:’ that is, rejoice in no other, but in Me only, as thy full and all-sufficient portion and happiness: And therefore it is a part, not of instituted, but of natural worship; such worship which we are to give God though He had never given direction about it; which immediately results from the owning and choosing of God for our God. For if God be not loved and delighted in more than anything, or all things else, He is not our God. Now then is there not a necessity, if you would worship God as God, that you should rejoice evermore, and delight in Him as sufficient to your happiness, whether the world comes or goes, whether your creature comforts and relations continue with you, or be taken from you? God still must be the heart’s delight and your exceeding joy. Ps. 37:4, ‘Delight thyself also in the Lord, and He shall give thee the desires of thine heart.&#x27;</p></blockquote>

<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Question 31, section III, p. 286</span></figcaption>

<blockquote><p>[Natural worship] is to know God, to acknowledge Him to be God, and glorify Him as God. Now man, as a dependent creature, stands in need of help in this concern; much more fallen man, who has no natural light left in him, to direct him how to worship God acceptably. And therefore God has pleased to show him a way, wherein he may do it; and to this way belong all the institutions appointed to man since the fall.</p></blockquote>

<blockquote><p>The moral grandeur of the death of Jesus is not a little enhanced when it is apprehended in its distinctive character as an act of worship. If we consider it exclusively in the light of a judicial sentence, and detach from the Saviour those active sentiments of piety and religion which make Him a doer rather than a sufferer, we may understand the principles of moral government which underlie the atonement, but we shall fail to appreciate the dignity and glory of Jesus. It is not right to consider Him as the helpless victim of inexorable wrath; and all the imputations upon the goodness and clemency of God, which the malice of the human heart has made His vicarious punishment the pretext of suggesting, are at once dispelled when we enter into His own mind, and see the spirit of devotion in which He presented His soul as an offering for sin… We dare not entertain the thought, even for an instance, that the Father is harsh or vindictive, or that a cloud obscures the benevolence of His nature, when the very circumstances which are most revolting in the tragedy of Calvary are elements of a worship which the Son delighted to render, and felt that the Father was glorious in accepting. Considered as an act of worship, there is a majestic awe, a moral sublimity thrown around the death of Jesus, which fails to be impressed when attention is exclusively confined to the legal principles which made it indispensable to the pardon of the guilty. It is invested with a sacredness which makes us pause and adore. Never was there such a doxology as when Jesus died, and the whole work of redemption is a grand litany which has no parallel in the history of the universe. There can be no wonder that the Father should love the Son. Such worshippers are not to be dismissed from the sanctuary, nor such homage lightly esteemed. Never, never was there displayed before, and never, never will there be displayed again, such piety as that which burned in the bosom of Jesus when He laid down His life of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings</cite>, vol. 2, ‘The Sacrifice of Christ: the Type &amp; Model of Missionary Effort’, pp. 418-19</span></figcaption>

</figure><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

36.%20%5Bm%5D%20Micah%206%3A8&amp;text=The%20duties%20required%20in%20the%20first%20commandment%20are&amp;text=l%5D%20Jer.%2031%3A18.%20Ps.%20119%3A136.%20%5Bm%5D%20Micah%206%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-814c750a7b" data-kw="">
<blockquote><p>The light of nature sheweth that there is a God, who hath lordship and sovereignty over all; is good, and doeth good unto all; and is therefore to be feared, loved, praised, called upon, trusted in, and served, with all the heart, and with all the soul, and with all the might.[a] But the acceptable way of worshipping the true God is instituted by himself, and so limited by his own revealed will, that he may not be worshipped according to the imaginations and devices of men, or the suggestions of Satan, under any visible representation, or any other way not prescribed in the holy Scripture.[b] [a] Rom. 1:20. Acts 17:24. Ps. 119:68. Jer. 10:7. Ps. 31:23. Ps. 18:3. Rom. 10:12. Ps. 62:8. Josh. 24:14. Mark 12:33. [b] Deut. 12:32. Matt. 15:9. Acts 17:25. Matt. 4:9,10. Deut. 4:15-20. Exod. 20:4-6. Col. 2:23.</p></blockquote>

<blockquote><p>So it no ways follows upon the other hand, that because the Law of Nature prescribes some parts of worship, that therefore it is the measure of all divine worship.</p></blockquote>

</figure><figure class="quote" id="q-66d8ababe8" data-kw="">
<blockquote><p>The worship of God is either natural or instituted. Natural worship is that which in specie, and immediately, is founded in the nature of God and the nature of man, and God’s relation to man, and man’s relation to God. And it is twofold, either that which is naturally necessary, or that which is naturally laudable. That which is naturally necessary, is indispensable and unchangeable. That which is naturally laudable must be used whensoever conveniently it may. There is natural worship due to God, both as the Creator of man and as the Redeemer of fallen man. As God is our Creator, He is our absolute Owner and Ruler, and Benefactor; and as such, He is to be acknowledged by us with all due observance. And whatsoever acts of observance towards God we are upon this ground immediately obliged unto, they are natural worship due to God as our Creator. All natural worship due to God as Creator is discernable by natural revelation, or the Book of Nature. In Nature entire it was clearly and completely thereby discernible; but in Nature fallen, more dimly and defectively; yet not for want of objective evidence, but for the indisposition of our faculty. Likewise to God our Redeemer, there is a worship due from us, naturally and immediately arising from our redemption, and our relation to God therein founded. And it is (our redemption being supposed) no more of God’s arbitrary institution than that worship which is founded in the Law of our Creation and primitive State. To the knowledge of this sort of natural worship, we come by means of that divine revelation by which we come to the knowledge of our redeemed state. But the knowledge of our redeemed state being supposed, natural reason will show that such and such acts of observance in specie are naturally and indispensably due to God our Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>§5. ‘Divine worship distinguished into Natural &amp; Instituted. And first, of Natural Worship’ in The Remains</cite>, … (d. 1680; London: Parkhurst, 1684), ‘Of Divine Worship’, pt. 1, pp. 174-75</span></figcaption>

<blockquote><p>7th Problem. Whether therefore out of the natural law, as contradistinguished from supernatural, the rule and way of worshipping God is able to be deduced or subsumed under it? Response: I deny. Indeed, in general and indefinitely in what way God is to be worshipped, and negatively, in what way He is not to be worshipped, in many things it is able to be shown from there; but the natural worship of God, positively and in the species, now as modified after the Fall, is not able to be explicitly and definitively subsumed under it or deduced from it, much less instituted worship. This is to be expected, therefore, from supernatural revelation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (Utrecht, 1648 ff.), | vol. 1, 21. ‘Appendices to… on the Authority &amp; Righteousness of God, pt. 2’, p. 398, 7th Problem</span></figcaption>

</figure><figure class="quote" id="q-72d522d913" data-kw="">
<blockquote><p>Concerning worshipping or honoring (which two terms are both one)… Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like… God has created us and made us unto his own likeness; and our Saviour Christ has bought us with his blood. And therefore are we God’s possession, of duty and right; and Christ’s servants only, to wait on his will and pleasure, and ought therefore to move neither hand nor foot, nor any other member, either heart or mind, otherwise than He has appointed. God is honoured in his own person, when we receive all things, both good and bad, at his hand; and love his law with all our hearts; and believe, hope, and long for all that He promises.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Concerning worshipping or honoring (which two terms are both one)… Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like… God has created us and made us unto his own likeness; and our Saviour Christ has bought us with his blood. And therefore are we God’s possession, of duty and right; and Christ’s servants only, to wait on his will and pleasure, and ought therefore to move neither hand nor foot, nor any other member, either heart or mind, otherwise than He has appointed. God is honoured in his own person, when we receive all things, both good and bad, at his hand; and love his law with all our hearts; and believe, hope, and long for all that He promises.”

— William Tyndale, An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+worshipping+or+honoring+%28which+two+terms+are+both+one%29%E2%80%A6+Therefore%2C+that+thou+be+not+beguiled+with+falsehood+of+sophistical+words%2C+understand+that+the+words+which+the+scripture+uses+in+the+worshipping+or+honoring+of+God%2C+are+these%3A+Love+God%2C+cleave+to+God%2C+dread%2C+serve%2C+bow%2C+pray+and+call+on+God%2C+believe+and+trust+in+God%2C+and+such+like%E2%80%A6+God+has+created+us+and+made+us+unto+his+own+likeness%3B+and+our+Saviour+Christ+has+bought+us+with+his+blood.+And+therefore+are+we+God%E2%80%99s+possession%2C+of+duty+and+right%3B+and+Christ%E2%80%99s+servants+only%2C+to+wait+on+his+will+and+pleasure%2C+and+ought+therefore+to+move+neither+hand+nor+foot%2C+nor+any+other+member%2C+either+heart+or+mind%2C+otherwise+than+He+has+appointed.+God+is+honoured+in+his+own+person%2C+when+we+receive+all+things%2C+both+good+and+bad%2C+at+his+hand%3B+and+love+his+law+with+all+our+hearts%3B+and+believe%2C+hope%2C+and+long+for+all+that+He+promises.%E2%80%9D%0A%0A%E2%80%94+William+Tyndale%2C+An+Answer+to+Sir+Thomas+More%E2%80%99s+Dialogue%2C+the+Supper+of+the+Lord%2C+%E2%80%A6+%28d.+c.+1536%3B+Cambridge%3A+Parker+Society%2C+1850%29%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72d522d913.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/72d522d913.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=Concerning%20worshipping%20or%20honoring%20%28which%20two,long%20for%20all%20that%20He%20promises&amp;text=Concerning%20worshipping%20or%20honoring%20%28which%20two%20terms%20are&amp;text=hope%2C%20and%20long%20for%20all%20that%20He%20promises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-078a1af5af" data-kw="">
<blockquote><p>Now albeit Nature (as was said) teach all men that there is a eternal and mighty God, who should be worshipped and honored by them. Yet it descends not unto such particular precepts as can have any show of making ought for significant ceremonies Omnibus enim innatum est et in animo quasi insculptum, esse deos: but yet quales sint, says Cicero, varium est. And as Nature has not taught men to know the Nature and the attributes of the Godhead, together with the sacred Trinity of persons in the same: so neither has it taught what sort or manner of worship should be given unto God, Lex naturalis rerum communium est, and does only inform us with those common notions called [Greek]. Concerning the worship of God, it speaks only de genere, not de specie. Wherefore there can be no inference from that worship which the Law of Nature requires, either of any distinct kind of worship, or of any ceremony in that kind. No more than it follows, Si est animal, est Asinus [‘If it is an animal, it is a donkey’]; for à genere ad speciem non valet consequentia affirmando.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 9, p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

s Online</a></div>
</figure><figure class="quote" id="q-5d31cde9dc" data-kw="">
<blockquote><p>For although the light of nature teach that God is to be worshipped, yet in substantial things reason teaches not how this worship of God is to be administred, nor the house of God to be governed, but in all this we must depend upon the mind and pleasure of Christ, the King of his Church, and Saviour of his body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Friendly Trial of the Grounds tending to Separation in a Plain &amp; Modest Dispute</cite>, … (Cambridge: Daniel, 1640), ch. 12, p. 233</span></figcaption>

</figure><figure class="quote" id="q-9490e704dd" data-kw="">
<blockquote><p>It’s [the light of nature is] altogether insufficient to prescribe or set down any worship of God. Hence God does so often forbid us to walk after our own imaginations and to do that which we shall choose. The apostle calls it will-worship, when a man’s will is the mere cause of it. Now, it’s true, men are more apt to admire this, as we see in the Pharisees and Papists; they dote upon their traditions more then God’s institutions… It’s true indeed, even in worship, light of Nature and prudence is instrumentally required to order the institutions of God; but as reason may not make a new article of faith, so neither a new part of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London, 1647), Lecture 7, pp. 74</span></figcaption>

</figure><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), pp. 89-90</span></figcaption>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…for if prayer was a worship enjoined to Adam before the Fall, no less than public worship of praising for the workmanship of creation, Gen. 2:2-3, it may be said, if Adam was to suit any thing in prayer to God, then especially was he to pray that he might not sin, and might not be led into temptation, but might stand in obedience, and so might have influences to determine his will to stand and continue therein, and this the law of nature seems to say.</p></blockquote>

</figure><figure class="quote" id="q-2e9436ec60" data-kw="">
<blockquote><p>By the worship of God inquired after [in this treatise], not that which is natural or moral, which is required in the First Commandment is intended. Such is our faith and confidence in Him, our fear of Him, our subjection of soul and conscience unto Him as the great Soveraign Lord, first cause, last end, Judge and Rewarder of all men; the Law whereof was originally written in the heart of man, and has been variously improved and directed by new revelations and institutions. And this worship is called natural upon a double account. First, because it depends on the nature of God, a due perception and understanding whereof makes all this worship indispensibly necessary: for none can know God but it is his duty to glorify Him as God, that is, to believe in Him, love Him, trust Him, and call upon Him, which all are therefore cursed that do not, Ps. 79:6; 2 Thess. 1:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-2c32178ba9" data-kw="">
<blockquote><p>That God is to be worshipped, and that according to his own will and appointment, is a (a) principal branch of the Law of our creation, written in our hearts; the (b) sense whereof is renewed in the Second Commandment; but the ways and means of that worship, depend merely on God’s (c) soveraign pleasure and institution. (a) Rom. 1:21, ch. 2:14-15; Acts 15:16-17; 17:23-24-29. (b) Exodus 20:4-6, (c) Jer. 7:31; Ex. 25:40; Heb. 3:1-6; John 1:18. Explication. These two things all men see by nature. First, that God, however they mistook in their apprehensions of Him, would be and was to be worshipped with some outward solemn worship. So that although some are reported to have even cast off all knowledge and sense of a divine being, yet never any were heard of that came to an acknowledgement of any God, true or false, but they all consented that he was constantly and solemnly to be worshipped. And that not only by individual persons, but by societies together, that so they might own and honour Him whom they took for their God. And thus far outward worship is required in the First Commandment; namely, that the inward be exercised and expressed. When we take God for our God, we take Him to worship Him, Dt. 10:12-13. Other thoughts, namely of inward worship without outward expression at all or any time, or in any way, are but a covert unto atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 2, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-fbe2805f91" data-kw="">
<blockquote><p>For since it is natural and moral not only that man should worship God publicly with some external service (and indeed in the communion of saints and in a public assembly), but also that some time should be set apart for this purpose…</p></blockquote>

</figure><figure class="quote" id="q-43fbd6a599" data-kw="">
<blockquote><p>4. When a man, finding that God is a free and intellectual Agent, and sees, as he may by natural reason, everything ordered to a suitable end to his Being, and by a suitable means or rule conducing to that end, and finds a higher degree of being in himself than in other creatures, and consequently an higher end, and consequently an higher rule conducing to that end, he does most naturally resolve this rule into that law, which by the will of God is given to man conducing to that end, the subject of which rule must be all his internal and external actions, both in reference to God, to himself and to others: but here then is the next question, and the next degree of ignorance in men, viz. What that law or will of God is concerning man? and from hence grow those varieties and errors in worship of God. And though haply most men, knowing the true God, may by the same Light of Nature concur in the general and fundamentals of worship, viz. That God is to be feared with all reverence, loved with all intention, obeyed with all sincerity, cheerfulness and exactness: all which are but natural conclusions from the nature of God, the nature of Man, and the relation that he bears to God, as his Creator, Lord, and Preserver…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of God, &amp; of Ourselves I. by the Light of Nature, II. by the Sacred Scriptures</cite>, (London: 1688), pt. 1, ‘By the Light of Nature’, ch. 5, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-2d5028ba59" data-kw="">
<blockquote><p>Objection: The use of instruments was by the light of nature before the ceremonial Law, and therefore could not expire with it. Answer: 1. The dictates of Nature can make no man know that the sound of any innanimate creature can be acceptable service to God, if you abstract from his positive institutions; yea, without institution it were presumption to offer such manner of service unto God; Nature, I grant will dictate that our voice and tongues, which God has given us as a glory to glorify Himself, should be made use of in his praises: Nature also may prompt a man to use instruments for his own recreation, and may prove sometimes an useful diversion in time of disquiet of mind, but it’s beyond the reach of nature to know that such noise and sounds shall be pleasing to God, except when God reveals and appoints it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men in the Worship of God, by William, Lord Bishop of Derry</cite>, ... (Edinburgh: Anderson, 1694), ch. 1, pp. 17-18</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objection: The use of instruments was by the light of nature before the ceremonial Law, and therefore could not expire with it. Answer: 1. The dictates of Nature can make no man know that the sound of any innanimate creature can be acceptable service to God, if you abstract from his positive institutions; yea, without institution it were presumption to offer such manner of service unto God; Nature, I grant will dictate that our voice and tongues, which God has given us as a glory to glorify Himself, should be made use of in his praises: Nature also may prompt a man to use instruments for his own recreation, and may prove sometimes an useful diversion in time of disquiet of mind, but it’s beyond the reach of nature to know that such noise and sounds shall be pleasing to God, except when God reveals and appoints it.”

<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 19, p. 105</span></figcaption>

<blockquote><p>…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 2-4</span></figcaption>

<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>

<blockquote><p>…the precepts of the natural law are general, and require to be determined: and they are determined both by human law and by Divine law. And just as these very determinations which are made by human law are said to be, not of natural, but of positive law; so the determinations of the precepts of the natural law, effected by the Divine law, are distinct from the moral precepts which belong to the natural law. Wherefore to worship God, since it is an act of virtue, belongs to a moral precept; but the determination of this precept, namely that He is to be worshipped by such and such sacrifices, and such and such offerings, belongs to the ceremonial precepts. Consequently the ceremonial precepts are distinct from the moral precepts.</p></blockquote>

<blockquote><p>Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.</p></blockquote>

</figure><figure class="quote" id="q-e0036c79c8" data-kw="">
<blockquote><p>An institution is that which is merely founded upon God’s will, raising up a thing beyond its own natural or moral efficacy, with an efficacy beyond it… Institutions are not only express commands in the letter of them; for examples and promises, hints and implicit intimations may hold forth the will of Christ. Neither is everything that is the will and command of Christ an institution… So also there are means of edification which are providential, and so occasionally will serve… So as the constant setting apart of such a thing, for such an end (though providentially and occasionally, it may serve for such an end) rises up to an institution also. …Institutions are but the will of Christ, declared concerning such things as are exercised above the common nature of them, to a further spiritual end. Therefore the declaring the will of God about them, holds in common with the declaration of God’s will in other commands… We do not make everything a promise is made to an institution… promises are the declaration of God’s will, be they made to what things soever; and if they fall upon such things as are raised up above natural and common efficacy, with promise of a supernatural power to accompany them, then they are institutions…. When there is a commission of power given, there is a declared institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Thomas Goodwin</cite>, Of the Constitution, Right, Order &amp; Government of the Churches of Christ (London: Snowden, 1696), ch. 4, pp. 17-19 in The Works of Thomas Goodwin… the Fourth Volume (London: Darby, 1697)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

rth+Volume+%28London%3A+Darby%2C+1697%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe0036c79c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e0036c79c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=An%20institution%20is%20that%20which%20is,given%2C%20there%20is%20a%20declared%20institution&amp;text=An%20institution%20is%20that%20which%20is%20merely%20founded&amp;text=of%20power%20given%2C%20there%20is%20a%20declared%20institution" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>

<blockquote><p>Truth is opposed to a ceremony and shadow. The ceremonies of old were shadows, or the external body of religion, in which the soul and spirit of godliness should have been enclosed, but the Lord did always urge more earnestly the substance and truth than the ceremony, the weightier matters of the Law, piety, equity, and sobriety, than these lighter external ceremonies: He sets an higher account upon mercy than sacrifice, and upon obedience than ceremonies; But this people turned just contrary; they summed up all their religion in some ceremonial performance, and separated those things God had so nearly conjoined; they would be devout men in offering sacrifices in their washings in their rites, and yet made no conscience of heart and soul-piety toward God, and upright just dealing with men: Therefore the Lord so often quarrels them and rejects all their service as being a device and invention of their own which never entered in his heart, Isa. 1, from 10 to 16; Jer. 7 throughout; Isa. 66 to 6; Isa. 28. Now if you will examine it impartially it is even just so with us, there are some external things in religion which in comparison with the weightier things of faith, and obedience are but ceremonial; in these you place the most part, if not all your religion, and think yourselves good Christians if you be baptized and hear the Word, and partake of the Lord’s table and such like, though in the mean time you be not given to secret prayer and reading, and do not inwardly judge and examine yourselves, that you may flee unto a Mediator, though your conversation be unjust and scandalous among men; I say unto such souls, as the Lord to the Jews, Who hath required this at your hands? who commanded you to hear the Word, to be baptized, to wait on publick ordinances? Away with all this, it is abomination to his Majesty; though it please you never so well, the more it displeases Him; If you say, why commands He us to hear? etc. I say the Lord never commanded these external ordinances for the sum of true religion; that was not the great thing which was in his heart that He had most pleasure unto, but the weightier matters of the Law, piety, equity and sobriety, a holy and godly conversation adorning the Gospel: ‘What hath the Lord required of thee, but this, O man, To do justly, and walk humbly with thy God?’ So then thou dost not worship him in truth, but in shadow; the truth is holiness and righteousness; that external profession is but a ceremony; while you separate these external ordinances from these weighty duties of piety and justice, that they are but as dead body without a soul. If the Lord required truth of old, much more now, when He has abolished the multitude of ceremonies that the great things of his Law may be more seen and loved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion</cite>, … ([Glasgow] 1666 / 1667), 2nd Sermon on Jn. 4:24, pp. 134-35</span></figcaption>

<blockquote><p>Relationships and behaviors are manipulated by very powerful unspoken rules. These rules are seldom, if ever, said out loud. In fact, when spoken out loud many of them sound ridiculous. No one says out loud, ‘What people think about us is more important than what is really happening.’ Yet the unspoken rules communicate these and other shaming messages. The ‘can’t-talk’ rule keeps people quiet by labeling them as the problem if they notice and confront a problem. Because people feel they cannot talk about an unspoken rule, they learn to talk in ‘code’ to convey what they mean. Coding is an example of verbal manipulation… Messages are sent through a verbal code that others are supposed to decode… ‘Don’t you think it would be better this way?’ means, ‘I want you to do it this way.’ People also code non-verbally with body language–by giving dirty looks, becoming loud or quiet, or leaving the room in a sullen or disconnected attitude. Triangling is another way to act manipulative in relationships. This simply means to send a message to someone through another person instead of delivering it directly. The effects [are]: Great ‘radar’–the ability to pick up tensions in situations and relationships; ability to decode the crooked messages of others; saying things in code instead of saying them straight; talking about people instead of to them; message-carrying for people; expecting others to know your code; difficulty trusting people; reading other meanings into what people say.</p></blockquote>

<blockquote><p>If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [Aberdeen] Doctors); this is the doctrine of the Jesuits, Suarez, Thomas, Sanchez and Gregory de Valentia [all Romanists]… when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be… against God’s commandment, and know that human authority commands the contrary, and am persuaded it is indifferent, and a positive commandment of men, if the Church’s determination be here to sway my conscience, to practice is to me blind obedience, for human authority as it is such, gives no light.” Divine Right of Church Government (1646), Dispute Touching Scandal, Question 4, p. 43 When you seek reasons for what is going on and the only answers you get are of the kind, “The elders have determined…”, “This was the counsel of the presbytery,” “The principal clerk believes…” this is all directing you to trust persons without it being established in God-given reason. Take a cue from common life: persons that insist on you trusting them are the last persons you should trust. Trustworthy persons freely give their reasons precisely because they understand them as the grounds of the rightness of the action. Persons always (silently) trying to gain your confidence, are manipulators. . Unanimity The church leadership is geared towards being unanimous in their decisions and actions in order to give a united front (notice the disparity here with the people). They may do things unanimously or not at all. With time, of course, this puts pressure on all the elders to agree, even in situations that aren’t so cut and dry. And if they all do, you should too. “Look, all the elders are unanimous on this.” This is especially compelling under the (pressurized) lingo and mantra of Church unity, which really fits well with cultic characteristics. Cults thrive on the principle that the leadership’s will is God’s will, just like under the Papacy. In presbyterianism that may fly under the flag of a misinterpreting and mishandling of Mt. 18:18, “Whatsoever ye shall bind on earth shall be bound in heaven.</p></blockquote>

<blockquote><p>But the sun has the highest, best and most burningly glorious characteristics of all.” But there are a whole lotta good things it can’t do, which others can; the moon is more elegant, the stars sparkling, the cool wind refreshing and waddling baby skunks are really cute. When there’s no Christian liberty judgmentalism is the norm. Hypocrisies become glaring; straining at gnats is glorified while camels get swallowed. One can’t use the sacred lingo except in approving ways (otherwise it hurts the group’s ideals, image and cause, which is tantamount to sacrilege). With a bit of time the ideals of the leader are basically the ideals of the group. The very epitomy of the most desirable balance of this best spiritual life is the leader; his godly characteristics are not just a pattern in the church, but the mold. If the leaders don’t see it this way, most of the people do. He doesn’t seem to have any faults; he never mentions any (except for petty faults hardly considered sins). Any other balance than his is seen as less godly or good. The reason why the expectations never end is because he (or they) are trying to mold you to be like him, or them. The rising leaders are replicas of him, or try to be; you notice similar lingo, mannerisms, choices, imaging, etc. He is pleased they are following the best way (his). The elders always support his ideas. He has persuaded his closer colleagues of his same principles (distinctives). They are either his adoring fans or the same indistinguishable front with him. If you’re not fully on board with all these choices you probably feel like a bit of a second class citizen, passed over, inferior or a sandbag. What do you make of the Holy Spirit’s words in Eccl. 7:16: “Be not righteous over much; neither make thyself over wise: why shouldest thou destroy thyself?” They have only ever referenced this verse in a diminuitive way. . Pressure to do what You’re Not Comfortable with Manipulation is a near-universal characteristic of cultic groups, but it’s not most basic. Why do persons manipulate? To get you to do something you’re not comfortable with. You see all the fronted reasons they put forth, but they don’t add up. Why all the pressure? They won’t reveal their real reasons, but why not? If you knew them, you wouldn’t do it. They don’t see natural boundaries (Lk. 11:5-7) themselves and their view of you doesn’t take natural boundaries or your conscience into account (otherwise known as ‘respect’), because they are blinded by their principles. Hence they don’t believe you have a right to these boundaries. That is why the teeth of the bear-trap only dig deeper and further in. The only justification you need is, “I’m not comfortable with that.” You are not to do things apart from your faith that it’s right and with a sure conscience before the Lord: “Whatsoever is not of faith is sin,” (Rom. 14:23). For them to pressure you, or counsel, instruct or command you to do it anyway, without satisfying your reasons and conscience to your satisfaction, is to pressure you to sin, which is sinful of them. If you give your reasons and they minimize or dismiss them without satisfying them, and still pressure you, whatever they want you to do (especially if it means stepping into what may be a bear-trap), do not do it. If this is a pattern of their behavior, you are talking to a cultic person or cult leaders. If they won’t listen to you but give you the most spiritual reasons for doing what you’re not comfortable with, quoting Scriptures, citing Church authority, the elders’ great wisdom, etc. etc. you are being brainwashed and now know how and why most people around you can go along with this. The likely reason they won’t give you straight-forward satisfying reasons is because they are keeping from you not only the real reasons, but what will occur if you comply (which you can be sure you will not be comfortable with). They may speak softly, humbly and seek your agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.</p></blockquote>

ur agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.”

-cults/#:~:text=But%20the%20sun%20has%20the%20highest,you%20expressly%3A%20%E2%80%9CWe%20are%20a%20cult&amp;text=But%20the%20sun%20has%20the%20highest%2C%20best%20and&amp;text=are%20telling%20you%20expressly%3A%20%E2%80%9CWe%20are%20a%20cult" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Kafka trap”¹ was coined in 2010 off the book of Franz Kafka, The Trial (1925). The main character is accused of something never specified through the whole book and his every defense and refusal to acknowledge guilt is turned on him to be proof of guilt. He is determined guilty in advance and then, by their power over him, the prosecutors work backwards from their conclusion, seeking out any evidence that will support and confirm it. You being continually accused of being immoral diverts persons from seeing that what the leadership is doing is immoral. ¹ See Life Lessons, ‘Kafka trap’ in ‘7 Linguistic Tricks People Use to Deceive &amp; Manipulate You’ (n.d.); Argumentative Penguin, ‘Verbal Prison: How To Spot &amp; Escape The Kafka Trap’ (2021); L.T. Wright, ‘What Is a Kafka Trap &amp; How Does It Work?’ (2021); Stephen T. Kirschner, ‘How to Refute Popular Talking Points &amp; Avoid Kafka Traps, Part 1’ (2020). It’s the elders’ meeting (in closed session) that you have been called to (no witnesses but them): They direct it; you are put on the stand (about that see the section on Pressure). They will ask you questions (you can only speak to that specific question), and then opportunity will be given for them to comment afterwards before you are seen out the door. The interview has been limited to the (subjective) “manner” of what you have done, not your action’s content, substance or reasons (ignore that your manner may be informed and justified by your action’s substance). Their charge is asserted and unfalsifiable, you are already discredited, the arguments are circular, centering back on you, you’re guilty until proven innocent, they’re searching you for information to confirm and you are being detained, with connections cut off, and silenced while intimidated, harrassed and condemned. You answer their questions and they gaslight it, using (and blowing up) the information against you; they won’t let you go into the circumstances (they know the truth would condemn them; they are covering it up) but interrupt, cut you off and talk over you with raised voice (law applies to you, not them). Being so emotionally frazzled it’s hard to answer their questions (most of which assume your guilt) and they often won’t let you answer the very questions they ask. They raise suspicions against you (without letting you speak to them); they ask for your motives and impute motives to you. They are literally waiting for you to slip up in what you say, so that it will be on record and they will have brought out the underlying principle of the whole situation (they will say to others) which you will have to repent for, with the whole of it, or face progressive discipline (involving public censure). They aggress with body language (pointing, turning their back, re-facing you, throwing their hands in the air) and react in opposite manners (e.g. being stern and chuckling; if you see asymmetrical facial expressions, they despise you; you are in danger). If you defend yourself they act as martyrs, as if you attacked them, with wide open body language (acting). They appeal to anything and everything against you (even other people’s choices) and repeatedly, point-blank condemn you (this is supposed to persuade you?). When you try to ask honest, humble questions, they are ignored. If you state things, they are not shy to directly contradict you (the purpose is not to reason, but for show) without giving you opportunity to respond. Instead of giving reasons (if they gave any you could contest them) they act utterly astonished, gaping, that you broke the unwritten rule. “What were you thinking?!” “Why didn’t you come to us first?!” (they never prove the necessity of this). You are left thinking, “I didn’t know that was wrong or I had to come to you first (per natural law and Scripture).” If you defend yourself, even with the Bible (if they finally let you), you are proud,¹ selfish, self-righteous, arrogant and are blame-shifting. ¹ Rutherford: “Pride and contempt are only seen to God: Prelates have no place to punish heart-acts; they are to prove by two witnesses the malice, and pride, and contempt of authority; but this is invisible to men’s eyes.” Divine Right, Intro to Doctrine of Scandal, p. 655 They don’t have to cite specific evidence because “Everyone knows it,” “The problem is you,” you won’t take responsibility for your sin, do you think you’re greater than they, “What about us? You knew that would reflect on us” (they just gave away their real motivation, as most people do if you listen closely). “Must I not do what is right before the Lord, even when it may reflect on my friends?” [Silence, redirecting the interrogation.] You are told forcefully and repeatedly, “You should be silent and listen to your elders.” You remain silent without responding, and the verbal abuse continues. Any slip of facial expression or body posture and you are condemned for not listening as the hour and a half goes by, or you are being “disrespectful to a Gospel minister.” They reroute the “conversation,” endlessly, till they are repeating the same thing over and over and then find this grounds for calling time. Is the moderator (with the obvious conflict of interest) doing his job? Why not? What was the point of all that? To extract from you a confession for the purpose of scapegoating, clearing themselves, to shame you, discredit you (lest anyone follow you in this cause) and reduce you into conformity. It was a non-repeatable step in the process, before the next one. Your being warned and not being cooperative is on file. The only way to stop the social, psychological, verbal and spiritual abuse from your spiritual authorities is to admit you’re guilty, repent, surrender to them and conform to the unwritten rules. Repentance is hard because you have to find some way what you did was wrong. But it will be easier next time. If your elders are keen on experimental religion, they will be looking for (judging) the fruits of your repentance, expressed over time to their satisfaction. If you give in to this, your wife at home should rebuke you. The official record only says they intended to have a friendly interview with you, and made a sufficient inquest. You can be sure they selectively recorded everything else (official notes were being taken the whole time), but that is not available to you or others, or at best may be requested (and denied or otherwise limited at their dictation) through them. But this is presbyterianism, you can appeal, right? No: they never issued a determination; there’s nothing to appeal: it was an interview. You could petition the higher court (possibly made up of largely the same people) regarding their demeanor towards you, if you don’t mind spending months or the next year doing it, but they are quite adept at the ecclesiastical machine and have many ways to turn this down with unwritten traditions, or they may simply witness against you. How will they rule and who will people believe, you or them? The Kafka trap hinges on: power posturing, shaming, learned powerlessness (see the Intro), the united front, implicit faith in the authorities, group-psychology, social pressure (being done by your friends), politeness, your trusting of them, emotions, manipulation, confusion (1 Cor. 14:33), self-preservation (the strongest inclination), equity rescuing (Intro), a predetermined end (which you are not aware of), there being no power of neutral appeal and the ability to cover it up. The best way to counteract the Kafka trap is not to step foot into it or allow yourself to be in a position where you could be put into one. If you must enter it, bring a recorder of some sort and look up your laws about such. Remember, God sees and records everything. If you find yourself in a Kafka trap: – Keep your composure as best as possible (they will use even this against you), knowing it will eventually be over and you will then have better opportunity to assess and plan as time goes on. Take a long term approach. Don’t be provoked and don’t make a mistake. – You’re not going to win by defending yourself or reasoning with them. They make the rules, play referee and are the umpires. It will likely be better in the long run to be mostly silent and take the unfair abuse for the higher good (which does not imply your consent). Though your silence will be used against you (contary to natural, Biblical and civil law), it looks more outwardly in conformity to their desires and the alternative is worse. – Your immediate goal is to get through the meeting. Do not be provoked; remember to breathe, slowly. – What to do in the meeting: The temptation is to use objective language (conveying truth), but subjective language is harder (for them) to argue with and will be of stronger force to anyone who actually reads the official notes. The presence of the note-taker can be your friend (though the moderator may likely be of no help: he’s in on it). Say things like the following (even though it will still be used against you: they will gaff at it: “You say this, when you…!”): – I feel like I’m being interrupted and cut off. – I feel like what I say is being used against me. – I feel intimidated, like I am being condemned. – I don’t know why there is so much pressure. – I don’t feel comfortable answering from the way you asked. – Why are you pointing at me and elders have their arms crossed? – Can I give my reasons from the Bible? (You might have to ask this many times) If you are given the opportunity for any last words, say: “I feel like I have not been allowed to speak freely.</p></blockquote>

— Reformed Books Online, Cults and Spiritual Legalism, The Kafka Trap">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CKafka+trap%E2%80%9D%C2%B9+was+coined+in+2010+off+the+book+of+Franz+Kafka%2C+The+Trial+%281925%29.+The+main+character+is+accused+of+something+never+specified+through+the+whole+book+and+his+every+defense+and+refusal+to+acknowledge+guilt+is+turned+on+him+to+be+proof+of+guilt.+He+is+determined+guilty+in+advance+and+then%2C+by+their+power+over+him%2C+the+prosecutors+work+backwards+from+their+conclusion%2C+seeking+out+any+evidence+that+will+support+and+confirm+it.+You+being+continually+accused+of+being+immoral+diverts+persons+from+seeing+that+what+the+leadership+is+doing+is+immoral.+%C2%B9+See+Life+Lessons%2C+%E2%80%98Kafka+trap%E2%80%99+in+%E2%80%987+Linguistic+Tricks+People+Use+to+Deceive+%26+Manipulate+You%E2%80%99+%28n.d.%29%3B+Argumentative+Penguin%2C+%E2%80%98Verbal+Prison%3A+How+To+Spot+%26+Escape+The+Kafka+Trap%E2%80%99+%282021%29%3B+L.T.+Wright%2C+%E2%80%98What+Is+a+Kafka+Trap+%26+How+Does+It+Work%3F%E2%80%99+%282021%29%3B+Stephen+T.+Kirschner%2C+%E2%80%98How+to+Refute+Popular+Talking+Points+%26+Avoid+Kafka+Traps%2C+Part+1%E2%80%99+%282020%29.+It%E2%80%99s+the+elders%E2%80%99+meeting+%28in+closed+session%29+that+you+have+been+called+to+%28no+witnesses+but+them%29%3A+They+direct+it%3B+you+are+put+on+the+stand+%28about+that+see+the+section+on+Pressure%29.+They+will+ask+you+questions+%28you+can+only+speak+to+that+specific+question%29%2C+and+then+opportunity+will+be+given+for+them+to+comment+afterwards+before+you+are+seen+out+the+door.+The+interview+has+been+limited+to+the+%28subjective%29+%E2%80%9Cmanner%E2%80%9D+of+what+you+have+done%2C+not+your+action%E2%80%99s+content%2C+substance+or+reasons+%28ignore+that+your+manner+may+be+informed+and+justified+by+your+action%E2%80%99s+substance%29.+Their+charge+is+asserted+and+unfalsifiable%2C+you+are+already+discredited%2C+the+arguments+are+circular%2C+centering+back+on+you%2C+you%E2%80%99re+guilty+until+proven+innocent%2C+they%E2%80%99re+searching+you+for+information+to+confirm+and+you+are+being+detained%2C+with+connections+cut+off%2C+and+silenced+while+intimidated%2C+harrassed+and+condemned.+You+answer+their+questions+and+they+gaslight+it%2C+using+%28and+blowing+up%29+the+information+against+you%3B+they+won%E2%80%99t+let+you+go+into+the+circumstances+%28they+know+the+truth+would+condemn+them%3B+they+are+covering+it+up%29+but+interrupt%2C+cut+you+off+and+talk+over+you+with+raised+voice+%28law+applies+to+you%2C+not+them%29.+Being+so+emotionally+frazzled+it%E2%80%99s+hard+to+answer+their+questions+%28most+of+which+assume+your+guilt%29+and+they+often+won%E2%80%99t+let+you+answer+the+very+questions+they+ask.+They+raise+suspicions+against+you+%28without+letting+you+speak+to+them%29%3B+they+ask+for+your+motives+and+impute+motives+to+you.+They+are+literally+waiting+for+you+to+slip+up+in+what+you+say%2C+so+that+it+will+be+on+record+and+they+will+have+brought+out+the+underlying+principle+of+the+whole+situation+%28they+will+say+to+others%29+which+you+will+have+to+repent+for%2C+with+the+whole+of+it%2C+or+face+progressive+discipline+%28involving+public+censure%29.+They+aggress+with+body+language+%28pointing%2C+turning+their+back%2C+re-facing+you%2C+throwing+their+hands+in+the+air%29+and+react+in+opposite+manners+%28e.g.+being+stern+and+chuckling%3B+if+you+see+asymmetrical+facial+expressions%2C+they+despise+you%3B+you+are+in+danger%29.+If+you+defend+yourself+they+act+as+martyrs%2C+as+if+you+attacked+them%2C+with+wide+open+body+language+%28acting%29.+They+appeal+to+anything+and+everything+against+you+%28even+other+people%E2%80%99s+choices%29+and+repeatedly%2C+point-blank+condemn+you+%28this+is+supposed+to+persuade+you%3F%29.+When+you+try+to+ask+honest%2C+humble+questions%2C+they+are+ignored.+If+you+state+things%2C+they+are+not+shy+to+directly+contradict+you+%28the+purpose+is+not+to+reason%2C+but+for+show%29+without+giving+you+opportunity+to+respond.+Instead+of+giving+reasons+%28if+they+gave+any+you+could+contest+them%29+they+act+utterly+astonished%2C+gaping%2C+that+you+broke+the+unwritten+rule.+%E2%80%9CWhat+were+you+thinking%3F%21%E2%80%9D+%E2%80%9CWhy+didn%E2%80%99t+you+come+to+us+first%3F%21%E2%80%9D+%28they+never+prove+the+necessity+of+this%29.+You+are+left+thinking%2C+%E2%80%9CI+didn%E2%80%99t+know+that+was+wrong+or+I+had+to+come+to+you+first+%28per+natural+law+and+Scripture%29.%E2%80%9D+If+you+defend+yourself%2C+even+with+the+Bible+%28if+they+finally+let+you%29%2C+you+are+proud%2C%C2%B9+selfish%2C+self-righteous%2C+arrogant+and+are+blame-shifting.+%C2%B9+Rutherford%3A+%E2%80%9CPride+and+contempt+are+only+seen+to+God%3A+Prelates+have+no+place+to+punish+heart-acts%3B+they+are+to+prove+by+two+witnesses+the+malice%2C+and+pride%2C+and+contempt+of+authority%3B+but+this+is+invisible+to+men%E2%80%99s+eyes.%E2%80%9D+Divine+Right%2C+Intro+to+Doctrine+of+Scandal%2C+p.+655+They+don%E2%80%99t+have+to+cite+specific+evidence+because+%E2%80%9CEveryone+knows+it%2C%E2%80%9D+%E2%80%9CThe+problem+is+you%2C%E2%80%9D+you+won%E2%80%99t+take+responsibility+for+your+sin%2C+do+you+think+you%E2%80%99re+greater+than+they%2C+%E2%80%9CWhat+about+us%3F+You+knew+that+would+reflect+on+us%E2%80%9D+%28they+just+gave+away+their+real+motivation%2C+as+most+people+do+if+you+listen+closely%29.+%E2%80%9CMust+I+not+do+what+is+right+before+the+Lord%2C+even+when+it+may+reflect+on+my+friends%3F%E2%80%9D+%5BSilence%2C+redirecting+the+interrogation.%5D+You+are+told+forcefully+and+repeatedly%2C+%E2%80%9CYou+should+be+silent+and+listen+to+your+elders.%E2%80%9D+You+remain+silent+without+responding%2C+and+the+verbal+abuse+continues.+Any+slip+of+facial+expression+or+body+posture+and+you+are+condemned+for+not+listening+as+the+hour+and+a+half+goes+by%2C+or+you+are+being+%E2%80%9Cdisrespectful+to+a+Gospel+minister.%E2%80%9D+They+reroute+the+%E2%80%9Cconversation%2C%E2%80%9D+endlessly%2C+till+they+are+repeating+the+same+thing+over+and+over+and+then+find+this+grounds+for+calling+time.+Is+the+moderator+%28with+the+obvious+conflict+of+interest%29+doing+his+job%3F+Why+not%3F+What+was+the+point+of+all+that%3F+To+extract+from+you+a+confession+for+the+purpose+of+scapegoating%2C+clearing+themselves%2C+to+shame+you%2C+discredit+you+%28lest+anyone+follow+you+in+this+cause%29+and+reduce+you+into+conformity.+It+was+a+non-repeatable+step+in+the+process%2C+before+the+next+one.+Your+being+warned+and+not+being+cooperative+is+on+file.+The+only+way+to+stop+the+social%2C+psychological%2C+verbal+and+spiritual+abuse+from+your+spiritual+authorities+is+to+admit+you%E2%80%99re+guilty%2C+repent%2C+surrender+to+them+and+conform+to+the+unwritten+rules.+Repentance+is+hard+because+you+have+to+find+some+way+what+you+did+was+wrong.+But+it+will+be+easier+next+time.+If+your+elders+are+keen+on+experimental+religion%2C+they+will+be+looking+for+%28judging%29+the+fruits+of+your+repentance%2C+expressed+over+time+to+their+satisfaction.+If+you+give+in+to+this%2C+your+wife+at+home+should+rebuke+you.+The+official+record+only+says+they+intended+to+have+a+friendly+interview+with+you%2C+and+made+a+sufficient+inquest.+You+can+be+sure+they+selectively+recorded+everything+else+%28official+notes+were+being+taken+the+whole+time%29%2C+but+that+is+not+available+to+you+or+others%2C+or+at+best+may+be+requested+%28and+denied+or+otherwise+limited+at+their+dictation%29+through+them.+But+this+is+presbyterianism%2C+you+can+appeal%2C+right%3F+No%3A+they+never+issued+a+determination%3B+there%E2%80%99s+nothing+to+appeal%3A+it+was+an+interview.+You+could+petition+the+higher+court+%28possibly+made+up+of+largely+the+same+people%29+regarding+their+demeanor+towards+you%2C+if+you+don%E2%80%99t+mind+spending+months+or+the+next+year+doing+it%2C+but+they+are+quite+adept+at+the+ecclesiastical+machine+and+have+many+ways+to+turn+this+down+with+unwritten+traditions%2C+or+they+may+simply+witness+against+you.+How+will+they+rule+and+who+will+people+believe%2C+you+or+them%3F+The+Kafka+trap+hinges+on%3A+power+posturing%2C+shaming%2C+learned+powerlessness+%28see+the+Intro%29%2C+the+united+front%2C+implicit+faith+in+the+authorities%2C+group-psychology%2C+social+pressure+%28being+done+by+your+friends%29%2C+politeness%2C+your+trusting+of+them%2C+emotions%2C+manipulation%2C+confusion+%281+Cor.+14%3A33%29%2C+self-preservation+%28the+strongest+inclination%29%2C+equity+rescuing+%28Intro%29%2C+a+predetermined+end+%28which+you+are+not+aware+of%29%2C+there+being+no+power+of+neutral+appeal+and+the+ability+to+cover+it+up.+The+best+way+to+counteract+the+Kafka+trap+is+not+to+step+foot+into+it+or+allow+yourself+to+be+in+a+position+where+you+could+be+put+into+one.+If+you+must+enter+it%2C+bring+a+recorder+of+some+sort+and+look+up+your+laws+about+such.+Remember%2C+God+sees+and+records+everything.+If+you+find+yourself+in+a+Kafka+trap%3A+%E2%80%93+Keep+your+composure+as+best+as+possible+%28they+will+use+even+this+against+you%29%2C+knowing+it+will+eventually+be+over+and+you+will+then+have+better+opportunity+to+assess+and+plan+as+time+goes+on.+Take+a+long+term+approach.+Don%E2%80%99t+be+provoked+and+don%E2%80%99t+make+a+mistake.+%E2%80%93+You%E2%80%99re+not+going+to+win+by+defending+yourself+or+reasoning+with+them.+They+make+the+rules%2C+play+referee+and+are+the+umpires.+It+will+likely+be+better+in+the+long+run+to+be+mostly+silent+and+take+the+unfair+abuse+for+the+higher+good+%28which+does+not+imply+your+consent%29.+Though+your+silence+will+be+used+against+you+%28contary+to+natural%2C+Biblical+and+civil+law%29%2C+it+looks+more+outwardly+in+conformity+to+their+desires+and+the+alternative+is+worse.+%E2%80%93+Your+immediate+goal+is+to+get+through+the+meeting.+Do+not+be+provoked%3B+remember+to+breathe%2C+slowly.+%E2%80%93+What+to+do+in+the+meeting%3A+The+temptation+is+to+use+objective+language+%28conveying+truth%29%2C+but+subjective+language+is+harder+%28for+them%29+to+argue+with+and+will+be+of+stronger+force+to+anyone+who+actually+reads+the+official+notes.+The+presence+of+the+note-taker+can+be+your+friend+%28though+the+moderator+may+likely+be+of+no+help%3A+he%E2%80%99s+in+on+it%29.+Say+things+like+the+following+%28even+though+it+will+still+be+used+against+you%3A+they+will+gaff+at+it%3A+%E2%80%9CYou+say+this%2C+when+you%E2%80%A6%21%E2%80%9D%29%3A+%E2%80%93+I+feel+like+I%E2%80%99m+being+interrupted+and+cut+off.+%E2%80%93+I+feel+like+what+I+say+is+being+used+against+me.+%E2%80%93+I+feel+intimidated%2C+like+I+am+being+condemned.+%E2%80%93+I+don%E2%80%99t+know+why+there+is+so+much+pressure.+%E2%80%93+I+don%E2%80%99t+feel+comfortable+answering+from+the+way+you+asked.+%E2%80%93+Why+are+you+pointing+at+me+and+elders+have+their+arms+crossed%3F+%E2%80%93+Can+I+give+my+reasons+from+the+Bible%3F+%28You+might+have+to+ask+this+many+times%29+If+you+are+given+the+opportunity+for+any+last+words%2C+say%3A+%E2%80%9CI+feel+like+I+have+not+been+allowed+to+speak+freely.%E2%80%9D%0A%0A%E2%80%94+Reformed+Books+Online%2C+Cults+and+Spiritual+Legalism%2C+The+Kafka+Trap&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3aff170d0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3aff170d0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cults/#:~:text=Kafka%20trap%E2%80%9D%C2%B9%20was%20coined%20in%202010,not%20been%20allowed%20to%20speak%20freely&amp;text=Kafka%20trap%E2%80%9D%C2%B9%20was%20coined%20in%202010%20off%20the&amp;text=I%20have%20not%20been%20allowed%20to%20speak%20freely" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The first of the two warning signs is that there is an environment of secrecy… First, a reluctance or outright refusal to answer questions about certain topics, or to justify decisions. If a recurrent response to questions about church decisions is “you need to trust us” or, worse, chastisement for not trusting the ladership, this is a major sign of an environment of secrecy. Trustworthy people have good reasons for their decisions that they should be willing to share. Likewise, if there is frequent inveighing against gossip, especially around controversial decisions, this may reflect an unwillingness from the leadership to be forthright in their reasoning… A third mark of secrecy is if people leave without explanation and are never heard from again… If no one in the church is talking to them, and no one ever knows why they leave, this is indicative of an environment of secrecy… 2. Another more serious sign beyond secrecy is fear… do people seem afraid of the leadership for no discernible reason? Are people ever publicly chastised for asking questions? Are submission and authority exhorted from the congregation with regularity? An atmosphere of fear, especially fear of the leadership, is yet another sign that a church is unhealthy.</p></blockquote>

<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’</cite>, (2025) at BBC.com</span></figcaption>

</figure><figure class="quote" id="q-86e20c4717" data-kw="">
<blockquote><p>Of all tyrannies, a tyranny sincerely exercised for the good of its victims may be the most oppressive. It would be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth. This very kindness stings with intolerable insult. To be ‘cured’ against one’s will and cured of states which we may not regard as disease is to be put on a level of those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals.</p></blockquote>

<blockquote><p>1. Isolation of members psychologically and or physically from individuals outside the group whose ideas and philosophies are contrary to those promoted by the group. 2. Intense “love-bombing” that so powerfully affects individuals with deep-seated emotional needs that those persons are psychologically thrown off balance. They are faced with an agonizing decision: stay with the group and receive love, or lose the group and lose love. 3. A systematic replacement of the pre-conversion identities of members with a new group related identity. 4. Rapid-fire teaching techniques that do not allow members to think critically about what is being said, coupled with an environment where an open discussion of relevant issues and expression of contrary opinions is discouraged. 5. The use of fear and intimidation against members who desire to leave the group, or former members seeking to break ties with the group. 6. Use of deceptive recruitment techniques that include false information about the groups doctrinal beliefs and coverups of negative episodes in the group history. 7. Total, unquestioning allegiance to a central leader or elite core of leaders. 8. The promotion of and ” ends justifies the means” philosophy within the group. 9. An “us” versus “them” mentality that stresses the group’s unique hold on truth and demonizes anyone who opposes that alleged truth. 10. An inordinate emphasis on submission and obedience to group authority, which effectively guilts a person into submission. 11. Consistent stress on the importance of following the divinely revealed truths being taught by a group leader or leaders. 12. A siege mentality that dismisses all criticism as “persecution”. 13. Shunning and harsh criticism of “rebellious” members who question the teachings or practices of the group. 14. An elitist attitude that is drilled into members, which state that those outside the group are spiritually lukewarm, compromising, or entirely lost. 15. Excess of control over personal aspects of members lives: i.e. where to live, where to work, who to date, who to marry, what literature to read, when vacations can be taken, etc. 16. Rigid restrictions related to the sleeping habits, food intake, exercise, and leisure times of members.</p></blockquote>

<blockquote><p>My experience after two decades both at the local level and institutional level is this: for Southern Baptists image is everything. There is nothing and no one they will not sacrifice on the altar of their image. But it’s not just a commitment; it’s embedded in the culture itself. When image is everything, a culture of fear follows, so that anyone who does not match up with that image is considered a threat. As we’ve seen in the last couple of years, the SBC has been plagued with covering up sin to protect its image. But this occurs at the local church level as well. When there is sin in the leadership, the impulse is to cover it up to protect the image rather than being transparent with the church. Southern Baptist pastors often tell their congregations, “Just trust us,” and “Don’t gossip,” which results in a church incapable of acting when they suspect sin in the leadership. Moreover, they have little recourse to an external ecclesiastical authority to hold the leadership accountable… I can no longer go along with Southern Baptists who pride themselves on a type of independence that locks out effective external accountability. Nor can I continue ignoring the spiritual abuse that so many have suffered as a consequence. In short, when image is everything, the cross is eclipsed. Ironically, this does not image the humility of Christ.</p></blockquote>

<blockquote><p>Step Five: Analysis Becomes Myth At this stage, the explanation stops needing actual proof. Not because the evidence is overwhelming, but because the story has become self-sustaining. It can explain everything if you just try hard enough. … The belief now no longer functions as an explanation of reality, instead it’s a closed or “self-sealing” system. It can’t be tested, corrected, or falsified. And most importantly, it can’t be escaped without significant psychological cost. It’s a bit like a prison. Because at this point, abandoning it would mean admitting that the soothing clarity you felt was an illusion. This allows anxiety back in the front door, often holding hands with public humiliation. For many “disaffected” and isolated young men, this is an intolerable duo to entertain. But once a belief can’t be falsified, it’s no longer analysis. It’s a mythology. And mythology has a dangerous advantage: it feels deeper than facts, like a soul-level insight. You’ve finally seen behind the curtain to where the puppet masters pull the strings. You don’t have to guess or speculate, you know. … Step Six: Myth Becomes Moral Signal This is when conspiracy thinking stops being a private explanation held by an individual, and instead becomes a public signal to others. You can hear it in the language: … ”If you don’t see it, you’re asleep.” ”Once you see it, you can’t unsee it.</p></blockquote>

<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>

<blockquote><p>There is a lot of psychological distress involved in even talking about it. I don’t care for the overuse of words like ‘trauma,’ but it really has felt traumatic, and we weren’t suffering the worst of it by any means. Our family has been shunned by the pastor because he didn’t believe we voted for him to be installed [as the pastor], although we did; you don’t realize how much damage it does to have your spiritual leader refuse to even speak to you, because it starts to seem normal. I was also reprimanded when one of the elders found out that I asked a question about the church’s unconventional sacramental practices to someone outside the church. There have been sustained, vicious attacks on family members by the session [of elders]. There is consistent abuse of Matthew 18 to stifle any publicly voiced criticisms of actions by the session. There is a lack of transparency: for example, the session refuses to release a comprehensive budget to the congregation, and makes major purchases without a congregational vote. Church discipline has no established procedure, and excommunication is done behind closed doors, without a public trial or public testimony by witnesses. Excommunications are also based on manufactured sins; the current excommunication, for example, is based on the charge of “living in darkness.” The pastor has literally pronounced eternal damnation over people who have criticized him in public. The session has even gone after people who left the church and are no longer members, going so far as to contact people’s ex-spouses to attempt to find incriminating information about them to convey to the non-member’s new pastor. They also routinely spread around information that was given in confidence for counseling purposes. Everyone we’ve told who is not in the church is appalled; in retrospect we wonder why it took so long for us to leave, but it really is painful. It was hard to leave for a number of reasons. First, we had a lot of specific doctrinal agreements with that church, that most other churches don’t share. Along with that came like-minded friends who we really did not want to give up. Things got incrementally worse over a long time, and quite often the leadership had semi-plausible explanations for their actions which were not easy to disprove. The worst of it was not targeted at us, and we thought we could just keep our heads down and avoid interacting with the session. We wished we could more vocally confront them, but the people being abused asked that we not get involved, so we didn’t feel that we could. Over time the cognitive dissonance grew worse, and it seemed to us the Holy Spirit had entirely withdrawn from the church. The church moving to a new building that was much farther away gave us a ready excuse to go elsewhere that couldn’t be argued with. Then the final decision was made for us when the pastor purported to damn our relative; that’s a bell that can’t really be unrung, and we couldn’t commune in good faith after that. We are members of the congregation. We are hoping the elders will just leave us alone, but they have harassed people who have left before, so we are trying to get under the shelter of another church quickly. We did a complete communication blackout. We blocked all of the communication outlets from all of the elders, so we won’t have to even see anything they might send which could tempt us to reply. Articles on spiritual abuse do capture very well the experience of being in the situation, the damage it does and the psychological consequences of getting out.</p></blockquote>

<blockquote><p>…the worship of God is twofold, inward or outward… The outward is that worship whereby the inward is testified outwardly in the speach and actions… Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… Now in adoration there are four virtues: feare, obedience, patience, thankfulness. … The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22. This stands in two things. First, in yielding subjection of the conscience to the commandments, threatnings and promises of God, so as we are willing that it should become bound unto them. Secondly, when the rest of the powers of the soul, in their place and time, perform obedience unto God. … …touching inward worship, we must remember that it alone is properly, simply, and of itself, the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it.</p></blockquote>

<blockquote><p>He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.”

— John Calvin, Commentary on 1 Corinthians, 10, verse 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+certainly+did+not+suspect+the+Corinthians+of+such+a+degree+of+ignorance+or+carelessness+as+to+think+that+they+worshipped+idols+in+their+heart.+But+as+they+made+no+scruple+of+frequenting+the+assemblies+of+the+wicked%2C+and+observing+along+with+them+certain+rites+instituted+in+honor+of+idols%2C+he+condemns+this+liberty+taken+by+them%2C+as+being+a+very+bad+example.+It+is+certain%2C+then%2C+that+when+he+here+makes+mention+of+idolatry%2C+he%2C+speaks+of+what+is+outward%2C+or%2C+if+you+prefer+it%2C+of+the+profession+of+idolatry.+For+as+God+is+said+to+be+worshipped+by+the+bending+of+the+knee%2C+and+other+tokens+of+reverence%2C+while+the+principal+and+genuine+worship+of+Him+is+inward%2C+so+is+it+also+as+to+idols%2C+for+the+case+holds+the+same+in+things+opposite.+It+is+to+no+purpose+that+very+many+in+the+present+day+endeavor+to+excuse+outward+actions+on+this+pretext%2C+that+the+heart+is+not+in+them%2C+while+Paul+convicts+of+idolatry+those+very+acts%2C+and+assuredly+with+good+reason.+For%2C+as+we+owe+to+God+not+merely+the+secret+affection+of+the+heart%2C+but+also+outward+adoration%2C+the+man+who+offers+to+an+idol+an+appearance+of+adoration+takes+away+so+much+of+the+honor+due+to+God.+Let+him+allege+as+he+may+that+his+heart+is+quite+away+from+it.+The+action+itself+is+to+be+seen%2C+in+which+the+honor+that+is+due+to+God+is+transferred+to+an+idol.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+1+Corinthians%2C+10%2C+verse+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6dd71bd322.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6dd71bd322.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-internal-external-worship/#:~:text=He%20certainly%20did%20not%20suspect%20the,God%20is%20transferred%20to%20an%20idol&amp;text=He%20certainly%20did%20not%20suspect%20the% </figure><figure class="quote" id="q-8d0a5de47d" data-kw="">
<blockquote><p>5. Divine worship is internal only or external also. Internal worship is merely spiritual, and performed only within the temple of man’s heart, of which none are witnesses but God and a man’s own conscience. All the inward motions of the heart directed unto God are parts of this worship, as faith, hope, confidence, love, fear and joy in God, etc. which are all of them diverse acts and parts of inward worship, in everyone of which God is honored. All which spring from the apprehension of our own wants, and God’s infinite excellency and goodness towards us… 6. External worship is an expressing and setting forth of the internal by outward signs and rites: by which as by certain outward bodily shadows and colors the spiritual and inward worship of God is made visible and sensible to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Divine Worship</cite>, … (1604), ch. 1</span></figcaption>

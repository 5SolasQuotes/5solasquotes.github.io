<blockquote><p>Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients. 1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth. 2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. … 3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same. 4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.</p></blockquote>

rs+no+vital+subordinate+and+active+influence+in+these+acts%3B+as+we+say%2C+the+apothecaries%E2%80%99+glass+heals+the+wound%2C+because+the+oil+in+the+glass+works+the+cure%2C+when+the+glass+does+actively+contribute+nothing+to+the+cure%3B+or+the+ass+makes+rich%2C+when+it+carries+the+gold+that+enriches+only%3B+this+sense+Antinomians+hold+forth+and+make+us+mere+patients+and+blocks+in+the+way+to+heaven%2C+and+this+sense+Jesuits%2C+especially+Martinez+de+Ripald%2C+falsely+charges+upon+Luther+and+Calvin%3B+and+the+Council+of+Trent%2C+inspired+with+the+same+lying+spirit%2C+says+the+same.+4.+The+fourth+%5Band+correct%5D+sense+is+that+grace+and+free-will+does+work+so+as+grace+is+the+principal%2C+first+inspiring+and+fountain+cause%3A+1.+It+being+a+new+supernatural+disposition+and+habit+in+the+soul%2C+Jn.+14%3A23%3B+1+Jn.+2%3A27%3B+3%3A9%3B+Jn.+4%3A14%3B+Isa.+44%3A3-4%3B+Eze.+36%3A26-27%3B+Dt.+30.6%3B+a+good+treasure+or+stock+of+grace%2C+Mt.+12%3A35%3B+Lk.+6%3A45.+And+also+actually+it+determines%2C+sweetly+inclines+and+stirs+the+will+to+these+acts%3B+yet+so+as+free-will+moves+actively%2C+freely%2C+and+confers+a+radical%2C+vital+and+subordinate+influence+and+is+not+a+mere+patient+in+all+these%2C+as+Antinomians+dream%2C+Ps.+119%3A32.+%E2%80%98I+will+run+the+way+of+thy+commandments%2C+when+thou+shall+enlarge+my+heart%2C%E2%80%99+Jn.+14%3A12%2C+%E2%80%98he+that+believeth+in+Me%2C+the+works+that+I+do%2C+he+shall+do%2C+and+greater+than+these%2C%E2%80%99+Mt.+12%3A50%2C+%E2%80%98He+that+does+the+will+of+my+heavenly+Father%2C+the+same+is+my+brother%2C%E2%80%99+etc.+1+Cor.+9%3A24%2C+%E2%80%98So+run+that+ye+may+obtain%2C%E2%80%99+Rev.+2%3A2%2C+%E2%80%98I+know+thy+works+and+thy+labour%2C%E2%80%99+1+Thess.+1%3A3%2C+%E2%80%98Remembering+without+ceasing+your+work+of+faith+and+labor+of+love%2C+and+patience+of+hope%3A%E2%80%99+1.+We+are+not+dead+in+supernatural+works%2C+and+mere+blocks%2C+Rom.+6%3A11%2C+%E2%80%98We+are+alive+unto+God+in+Jesus+Christ%2C%E2%80%99+Eph.+2%3A1%2C+%E2%80%98He+hath+quickened+us%2C%E2%80%99+Rev.+2%3A3%2C+%E2%80%98For+my+name%E2%80%99s+sake+thou+hast+laboured%2C+and+had+not+fainted%2C%E2%80%99+1+Cor.+15%3A58%2C+%E2%80%98Be+ye+steadfast%2C+unmoveable%2C+always+abundant+in+the+work+of+the+Lord.%E2%80%99+There+is+activity+in+the+Spirit+to+lust+against+the+flesh%2C+Gal.+5%3A17%3B+Rom.+7%3A15.+Nor+is+the+blessedness+of+the+saints+only+passive+in+receiving%3A+though+to+be+justified+and+receive+Christ%E2%80%99s+righteousness+be+the+fountain+blessedness%2C+Ps.+32%3A1%3B+Rom.+4%3A6-7%3B+Gal.+3%3A13.+But+the+Scripture+speaks+of+a+true+and+solid+blessedness+in+action%2C+Ps.+119%3A1%2C+%E2%80%98Blessed+are+the+undefiled+in+the+way%2C%E2%80%99+Isa.+56%3A2%2C+%E2%80%98Blessed+is+the+man+that+doth+this%2C%E2%80%99+Jm.+1%3A12%2C+%E2%80%98Blessed+is+the+man+that+endureth+temptation%2C%E2%80%99+Ps.+119%3A2%2C+%E2%80%98Blessed+are+they+that+keep+his+testimonies%2C%E2%80%99+Ps.+106%3A3%2C+%E2%80%98Blessed+are+they+that+keep+judgment%2C+Rev.+22%3A14%2C+%E2%80%98Blessed+are+they+that+do+his+commandments%2C+Mt.+5%2C+%E2%80%98Blessed+are+they+that+mourn%2C+that+hunger+and+thirst%3B%E2%80%98+Then+there+must+be+a+part+of+blessedness+in+sanctification%2C+as+in+justification%3B+though+the+one+be+the+cause%2C+the+other+the+effect.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65+%26+470-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec223b0914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ec223b0914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Assertion%201%3A%20In%20the%20first%20moment,the%20cause%2C%20the%20other%20the%20effect&amp;text=Assertion%201%3A%20In%20the%20first%20moment%20of%20our&amp;text=one%20be%20the%20cause%2C%20the%20other%20the%20effect" rel="noopener" targ <blockquote><p>Synonyms [of regeneration] more properly signifying are: … II. Conversion. This word sometimes denotes the act of God alone; sometimes the complete act of God and man; sometimes the formal act of man, so that it is of the same notion as the word penitence and repentance. The first signification looks to the act of first or preventing grace, and properly pertains here and makes a synonym of regeneration. In the Pelagian controversies concerning grace and free will, such conversion is wont to be called by theologians the first moment of conversion, where man conducts himself purely passively. The second signification looks to the act of God’s second grace, by which man, instructed and informed through preventing or first grace with a new habitual principle of spiritual life impressed by the omnipotent facility of God, is premoved and excited by God to perform acts and to actually elicit acts of spiritual life, or of repentance and faith, Jer. 31:18; Song 1:4. The third signification properly looks to the act of man. For man is the proper and formal principle of actual penitence or repentance, of conversion from his sin—not God, who is the effective principle. For He Himself does not do, so as to be that proper and particular cause (which, for example, is Peter repenting), that is, He does not grieve, does not repent, does not weep bitterly, does not die to sin, does not rise to new life; but He makes us to do, as Augustine speaks. We ourselves therefore do those things, but not of ourselves—as I remember reading that distinction in the homilies of Ardentius Pictaviensis [Ardent of Poitiers]. … II. Sometimes it [‘regeneration’] denotes: 1. The first impression of the new creature, or the change from non-being to spiritual being. 2. Its conservation, continuation, and augmentation. 3. Its instauration and renovation. 4. Its consummation and final perfection. … As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>

<blockquote><p>III. Problem: Whether man’s intellect and will concur to regeneration? Response: Negatively, if you understand active concourse as of a cause, so that synergy is attributed to them; but if you understand concourse as of a subject, it is granted: for it conducts itself purely passively in the first moment.</p></blockquote>

<blockquote><p>Regeneration is God’s action in elect sinners, redeemed, actively justified and called through Christ, by which He substantially (realiter) turns them from corruption to new life (or holiness), that they may henceforth live unto God.</p></blockquote>

<blockquote><p>V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.</p></blockquote>

<blockquote><p>(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/elias-grebenitz.html">Elias Grebenitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), Disputation 1, ‘On Regeneration in General’, p. 7 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt.</cite></span></figcaption>

0e68b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7f4e0e68b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=3%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly,grace.%20It%20is%20otherwise%20called%20conversion&amp;text=3%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly%3A%20For%20the&amp;text=Strimesius%5D%2C%20operating%20grace.%20It%20is%20otherwise%20called%20conversion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.</p></blockquote>

<blockquote><p>No one is regenerated without his own act consequently. Thus the newborn does not elicit the act of regeneration (I grant it); with his own act antecedently (I deny it), because we are passive in the beginning of regeneration.</p></blockquote>

</figure><figure class="quote" id="q-9a1c37103a" data-kw="">
<blockquote><p>I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.”

— John Flavel, “John Flavel’s (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+know+no+orthodox+divine+in+the+world%2C+that+presumes+to+thrust+in+any+work+of+man%E2%80%99s+into+the+covenant+of+grace%2C+as+a+condition%2C+which%2C+in+the+Arminian+sense%2C+he+may+or+may+not+perform%2C+according+to+the+power+and+pleasure+of+his+own+free+will%2C+without+the+preventing+or+determining+grace+of+God%3B+which+preventing+grace+is+contained+in+those+promises%2C+Eze.+36%3A25%E2%80%9327%2C+etc.+Nor+yet+that+there+is+any+meritorious+worth%2C+either+of+condignity+or+congruity+in+the+Popish+sense%2C+in+the+very+justifying+act+of+faith%2C+for+the+which+God+justifies+and+saves+us.+But+we+say%2C+That+though+God%2C+in+the+way+of+preventing+grace%2C+works+faith+in+us%2C+and+when+it+is+so+wrought%2C+we+need+his+assisting+grace+to+act+it%2C+yet+neither+his+assisting+nor+preventing+grace+makes+the+act+of+faith+no+more+to+be+our+act%3B+it+is+we+that+believe+still+though+in+God%E2%80%99s+strength%2C+and+that+upon+our+believing%2C+or+not+believing%2C+we+have+or+have+not+the+benefits+of+God%E2%80%99s+promises%3B+which+is+the+very+proper+notion+of+a+condition.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+%E2%80%9CJohn+Flavel%E2%80%99s+%281630%E2%80%931691%29+Reply+to+Baptist+Hyper-Calvinism+from+Vindici%C3%A6+Legis+et+F%C5%93deris+and+the+Issue+of+Conditions%E2%80%9D+from+Vindici%C3%A6+Legis+et+F%C5%93deris%3A+Or%2C+A+Reply+to+Mr.+Philip+Cary%E2%80%99s+Solemn+Call+%281690%29+in+The+Whole+Works+of+the+Rev.+Mr.+John+Flavel%2C+6+vols.+%28London%3A+Baynes+%26+Son%2C+1820%29%2C+vol.+6%2C+pp.+348%E2%80%9356+at+Theological+Meditations&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a1c37103a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9a1c37103a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=I%20know%20no%20orthodox%20divine%20in,very%20proper%20notion%20of%20a%20condition&amp;text=I%20know%20no%20orthodox%20divine%20in%20the%20world&amp;text=is%20the%20very%20proper%20notion%20of%20a%20condition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bbc82a597e" data-kw="">
<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’</cite>, p. 73</span></figcaption>

eration%20does%20not%20only%20show,and%20therefore%20God%20furnishes%20him%20accordingly&amp;text=2dly%2C%20Regeneration%20does%20not%20only%20show%20the%20wide&amp;text=enter%20upon%2C%20and%20therefore%20God%20furnishes%20him%20accordingly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e2f2ddb52d" data-kw="">
<blockquote><p>That we may attain unto a more clear understanding of the nature of this regeneration, so necessary to salvation: we must carefully observe with regard to the word, that both the Scriptures and also divines use it sometimes in a larger sense, to denote the whole operation of the Holy Ghost upon the souls of those who are to be saved, whereby they are brought into a state of grace, so that, besides the external call, it comprehends conversion, and even initial santification: in which sense practical divines lay down the marks, motives and means of regeneration. Sometimes the word regeneration is used in a more limited sense, as distinguished from the external call, from conversion and from sanctification: so that the external call signifies only the offer of redemption for our reception: Regeneration conveys that power into the soul, by which the person who is to be saved is enabled to receive the offer. Conversion puts forth the power received into actual exercise, so that the soul does actually receive the offered benefits. Sanctification brings forth the fruits of conversion, or of faith and repentance, in a carefulness to maintain good works, yet not so immediately but that a union with Christ and justification come between conversion and sanctification, at least in the order of nature, if not of time. It is in this stricted sense of the word we shall consider the doctrine of regeneration at present…</p></blockquote>

<blockquote><p>Those places of Scripture which are alleged [Dt. 10:16; Jer. 4:4; Eze. 18:31; Rom. 12:2; Joel 2:13; Mt. 4:17] speak not of regeneration strictly so called, by which God infuses the first principle of life, but of conversion, wherein He brings forth the life already bestowed into actual exercise.</p></blockquote>

<blockquote><p>In these commands God speaks to his Church, to his people who had long been his delight; therefore they must have been already regenerate; since, without regeneration no one can see or enter into the kingdom of God. Therefore by these commands God does not mean to bring about regeneration as it denotes the first infusion of the spiritual life, but the drawing forth of that life which is infused by regeneration into the second acts or consequent exercises (which is expressly mentioned in the passage, from whence the first of these commands is quoted) which is done in conversion, that follows upon regeneration, in which man, being drawn, runs after God; being turned, he actively converts and turns himself to God by the power of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration… (New Haven, 1770), | section 25</cite>, pp. 36-37</span></figcaption>

</figure><figure class="quote" id="q-472d20d9b5" data-kw="">
<blockquote><p>But however it may be: Since among the Lutherans and the Reformed it is not a matter of controversy that: 1. After the Fall, man is intimately corrupt, dead in sins, and therefore utterly unfit to begin and to perfect any spiritual good. 2. Not only faith itself, but also the inclination and disposition to faith is a gratuitous gift of God. 3. Man, in the first moment of conversion, behaves purely passively, etc. From this it is clear that the Reformed and the Lutherans can be reconciled more easily than others concerning this matter. . ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin §XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. Ps. 119:18: God “reveals the eyes to consider the wondrous things of the Divine Law.” Lk. 24:45: he “opens the minds of men, that they may understand the Scriptures.” Acts 16:14: he “opens the heart, that they may attend to those things which are said by the ministers.” Eph. 1:17-18: he “gives the Spirit of Wisdom and of revelation, in the knowledge of Christ, the eyes of our heart being enlightened, that we may know what the hope is of our calling, and what are the riches of the glory of his inheritance in the saints.” Ps. 51:12 &amp; Eph. 2:10: He “creates a clean heart” in them, and “renews a right spirit” in their bowels. Eze. 36:26-27: he “gives a new heart and puts a new spirit in the midst of the converted: and takes away the stony heart out of their flesh, and gives them a heart of flesh, and puts his spirit in the midst of them, and causes them to walk in his commandments, and to keep his judgments, and do them.” Jn. 3:5 &amp; 1 Pet. 1:3: he regenerates from heaven. Jn. 6:44: he draws. Eph. 1:19-20: he “works on them according to the operation of the might of his power, which he wrought in Christ, raising him up from the dead.” Phil. 2:13: he works “both to will and to accomplish.” 2 Thess. 1:11: He “fulfills all the good pleasure of his goodness, and the work of faith in power” in them. Heb. 13:21: He “works in them that which is well pleasing in his sight through J.C.” Jer. 31:33: He “gives his law in their bowels, and will write it in their heart.” Whence Israel there sighs in vv. 18-19 “Convert thou me, and I shall be converted: for thou art the Lord my God. For after thou didst convert me, I did penance: and after thou didst show unto me, I struck my thigh.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But however it may be: Since among the Lutherans and the Reformed it is not a matter of controversy that: 1. After the Fall, man is intimately corrupt, dead in sins, and therefore utterly unfit to begin and to perfect any spiritual good. 2. Not only faith itself, but also the inclination and disposition to faith is a gratuitous gift of God. 3. Man, in the first moment of conversion, behaves purely passively, etc. From this it is clear that the Reformed and the Lutherans can be reconciled more easily than others concerning this matter. . ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin §XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. Ps. 119:18: God “reveals the eyes to consider the wondrous things of the Divine Law.” Lk. 24:45: he “opens the minds of men, that they may understand the Scriptures.” Acts 16:14: he “opens the heart, that they may attend to those things which are said by the ministers.” Eph. 1:17-18: he “gives the Spirit of Wisdom and of revelation, in the knowledge of Christ, the eyes of our heart being enlightened, that we may know what the hope is of our calling, and what are the riches of the glory of his inheritance in the saints.” Ps. 51:12 &amp; Eph. 2:10: He “creates a clean heart” in them, and “renews a right spirit” in their bowels. Eze. 36:26-27: he “gives a new heart and puts a new spirit in the midst of the converted: and takes away the stony heart out of their flesh, and gives them a heart of flesh, and puts his spirit in the midst of them, and causes them to walk in his commandments, and to keep his judgments, and do them.” Jn. 3:5 &amp; 1 Pet. 1:3: he regenerates from heaven. Jn. 6:44: he draws. Eph. 1:19-20: he “works on them according to the operation of the might of his power, which he wrought in Christ, raising him up from the dead.” Phil. 2:13: he works “both to will and to accomplish.” 2 Thess. 1:11: He “fulfills all the good pleasure of his goodness, and the work of faith in power” in them. Heb. 13:21: He “works in them that which is well pleasing in his sight through J.C.” Jer. 31:33: He “gives his law in their bowels, and will write it in their heart.” Whence Israel there sighs in vv. 18-19 “Convert thou me, and I shall be converted: for thou art the Lord my God. For after thou didst convert me, I did penance: and after thou didst show unto me, I struck my thigh.”

— Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men, for Promoting Ecclesiastical Concord 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), p. 163">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+however+it+may+be%3A+Since+among+the+Lutherans+and+the+Reformed+it+is+not+a+matter+of+controversy+that%3A+1.+After+the+Fall%2C+man+is+intimately+corrupt%2C+dead+in+sins%2C+and+therefore+utterly+unfit+to+begin+and+to+perfect+any+spiritual+good.+2.+Not+only+faith+itself%2C+but+also+the+inclination+and+disposition+to+faith+is+a+gratuitous+gift+of+God.+3.+Man%2C+in+the+first+moment+of+conversion%2C+behaves+purely+passively%2C+etc.+From+this+it+is+clear+that+the+Reformed+and+the+Lutherans+can+be+reconciled+more+easily+than+others+concerning+this+matter.+.+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29%2C+pp.+25-26+Latin+%C2%A7XIV%E2%80%A6+in+the+first+moment+of+conversion%2C+while+the+intellect+is+being+illuminated%2C+the+will+is+being+prepared%2C+disposed%2C+and+changed%2C+it+behaves+merely+passively%2C+with+Scripture+as+witness.+Ps.+119%3A18%3A+God+%E2%80%9Creveals+the+eyes+to+consider+the+wondrous+things+of+the+Divine+Law.%E2%80%9D+Lk.+24%3A45%3A+he+%E2%80%9Copens+the+minds+of+men%2C+that+they+may+understand+the+Scriptures.%E2%80%9D+Acts+16%3A14%3A+he+%E2%80%9Copens+the+heart%2C+that+they+may+attend+to+those+things+which+are+said+by+the+ministers.%E2%80%9D+Eph.+1%3A17-18%3A+he+%E2%80%9Cgives+the+Spirit+of+Wisdom+and+of+revelation%2C+in+the+knowledge+of+Christ%2C+the+eyes+of+our+heart+being+enlightened%2C+that+we+may+know+what+the+hope+is+of+our+calling%2C+and+what+are+the+riches+of+the+glory+of+his+inheritance+in+the+saints.%E2%80%9D+Ps.+51%3A12+%26+Eph.+2%3A10%3A+He+%E2%80%9Ccreates+a+clean+heart%E2%80%9D+in+them%2C+and+%E2%80%9Crenews+a+right+spirit%E2%80%9D+in+their+bowels.+Eze.+36%3A26-27%3A+he+%E2%80%9Cgives+a+new+heart+and+puts+a+new+spirit+in+the+midst+of+the+converted%3A+and+takes+away+the+stony+heart+out+of+their+flesh%2C+and+gives+them+a+heart+of+flesh%2C+and+puts+his+spirit+in+the+midst+of+them%2C+and+causes+them+to+walk+in+his+commandments%2C+and+to+keep+his+judgments%2C+and+do+them.%E2%80%9D+Jn.+3%3A5+%26+1+Pet.+1%3A3%3A+he+regenerates+from+heaven.+Jn.+6%3A44%3A+he+draws.+Eph.+1%3A19-20%3A+he+%E2%80%9Cworks+on+them+according+to+the+operation+of+the+might+of+his+power%2C+which+he+wrought+in+Christ%2C+raising+him+up+from+the+dead.%E2%80%9D+Phil.+2%3A13%3A+he+works+%E2%80%9Cboth+to+will+and+to+accomplish.%E2%80%9D+2+Thess.+1%3A11%3A+He+%E2%80%9Cfulfills+all+the+good+pleasure+of+his+goodness%2C+and+the+work+of+faith+in+power%E2%80%9D+in+them.+Heb.+13%3A21%3A+He+%E2%80%9Cworks+in+them+that+which+is+well+pleasing+in+his+sight+through+J.C.%E2%80%9D+Jer.+31%3A33%3A+He+%E2%80%9Cgives+his+law+in+their+bowels%2C+and+will+write+it+in+their+heart.%E2%80%9D+Whence+Israel+there+sighs+in+vv.+18-19+%E2%80%9CConvert+thou+me%2C+and+I+shall+be+converted%3A+for+thou+art+the+Lord+my+God.+For+after+thou+didst+convert+me%2C+I+did+penance%3A+and+after+thou+didst+show+unto+me%2C+I+struck+my+thigh.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+Theological+Treatise+on+Predestination%2C+Election+%26+Reprobation+of+Men%2C+for+Promoting+Ecclesiastical+Concord+3rd+ed.+tr.+by+AI+by+Nosferatu+%28Leiden%2C+1705%29%2C+p.+163&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F472d20d9b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/472d20d9b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=But%20however%20it%20may%20be%3A%20Since,unto%20me%2C%20I%20struck%20my%20thigh&amp;text=But%20however%20it%20may%20be%3A%20Since%20among%20the&amp;text=didst%20show%20unto%20me%2C%20I%20struck%20my%20thigh" rel="noopener" target="_blank"

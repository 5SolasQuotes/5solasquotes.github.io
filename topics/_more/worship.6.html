</figure><figure class="quote" id="q-528533c5d0" data-kw="">
<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>

</figure><figure class="quote" id="q-3a80add179" data-kw="">
<blockquote><p>We acknowledge the scriptures of God contained in the Old and New Testament to contain the whole doctrine of faith and good manners, our Covenant rejects all traditions contrary, without and beside the word of God, and so it rejects all religious observances, all human ceremonies, all religious symbolical signs, all new means of worshipping God, all images, positive rites which have any influence in God’s worship as will-worship, and impious additions to God’s word, Jer. 7:7; 2 Sam. 7:7; Deut. 12:32; Deut. 4:2; Lev. 10:2; Heb. 1:13; Heb. 7:14; 1 Chron. 15:13; 1 Kings 12:32; Matt 15:14; Rev. 22:18, whereas they lack warrant from God’s word. All actions of divine worship, all religious means of worship, all actions of moral conversation must be warranted by, according as it is written…</p></blockquote>

</figure><figure class="quote" id="q-942af74721" data-kw="">
<blockquote><p>Though making of images simply be not unlawful and discharged by this [2nd] Commandment, yet thereby every representation of God (who is the object to be worshipped) and every image religiously made use of in worship is condemned (though civil and political images and statues, which are used as ornaments, or badges of honor, or remembrancers of some fact, etc. be not condemned)… …images (otherwise lawful) when abused to idolatry become unlawful, and are not to be suffered but orderly to be removed, we call that more than a civil or a common use, when religious worship or reverence is purposely intended to them, or there is, by some one occasion or other, danger lest they may be so abused; and of this sort (viz. dangerous ones) are: 1. Images in places of worship, but it is not idolatry to have dead men’s images on their tombs or monuments in churches.</p></blockquote>

</figure><figure class="quote" id="q-e26adb4488" data-kw="">
<blockquote><p>Again if by this phrase he [the opponent] mean that a purposed observation of an outward act, with an aim and reference to such a thing, is of necessity required to make up a ceremony or a ceremonious action, in worship or otherwise, it is a miserable mistake: Instance thus: A carnal protestant presents himself amongst such as are at mass, he professes to his companions, before he goes in, and does in the purpose of his heart seriously loath the pix and idol there, yet when it’s lifted up, he bows as others do: Let any man in reason tell me, did he not use or abuse rather a divine ceremony in that bowing or no? If the Rejoinder say yes, as he must, unless he will speak against all reason and truth: I then reply upon his own grounds: That outward action which is not purposely referred, that is not a ceremony; but this action is not purposely observed with any aim to that end for the party intended no such thing, purposed no such matter, but did it as a thing of-course, as a man should bow his knee for exercise when he is alone. 2. Peter withdrawing himself from the gentiles at the coming of the Jews, he did not purposely this, with reference to any Judaical seperation, as judging any legal pollution in joining with the gentiles, or holiness in parting from them, and therfore he did not practice any Jewish ceremony, according to the Rejoinder’s conceit, but directly contrary to the text: there is no end of these absurdities.</p></blockquote>

</figure><figure class="quote" id="q-d14eeca9bd" data-kw="">
<blockquote><p>Now that a man who adores before the painted or graven image of Christ, though he profess that he intends his whole adoration to Christ, and that he places the image before him only to represent Christ, and to stir up his mind to worship Christ, does nevertheless commit idolatry, I trust none of our Opposites will deny.</p></blockquote>

</figure><figure class="quote" id="q-cf84acc948" data-kw="">
<blockquote><p>Our Opposites here tell us of two things necessary to the making up of idolatry, neither of which is found in their kneeling. First, they say except there be an intention in the worshipper to adore the creature which is before his eyes, his kneeling before it is no idolatry… Answer. …Nay then the three children should not have been idolaters if they had kneeled before Nebuchadnezzar’s image, intending their worship to God only, and not to the image. Our Opposites here take the Nicodemites by the hand. But what says Calvin? ‘Si isti boni sapientesque Sophistae, ibi tum fuissent, simplicitatem illorum trium servorum Dei irrisissent. Nam hujusmodi credo cos verbis objurgassent: miseri homines istud quidem*non est adorare, quum vos in rebus nullam fidem adhibetis: nulla est Idololatria nisi ubi est devotio, hoc est quaedam animi ad idola colenda venerandasque adjunctio atque applicatio, &amp;c.’ (De fugiend. idololat., homily 1) If Paybody had been in Calvin’s place he could not have called the [protestant] Nicodemites idolaters, forasmuch as they have no intention to worship the Popish images when they kneel and worship before them. Nay, the grossest idolaters that ever were, shall by this doctrine be no idolaters, and Paul shall be censured for teaching that the Gentiles did worship devils, since they did not intend to worship devils. ‘Idololatrae nec olim in Paganismo intendebant, nec hodie in Papatu intendunt, Daemonibus offerre. Quid tum? Apostolus contrarium pronuntiat, quicquid illi intendant,’ says Pareus (Com. in illum locum, sect. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.”

— Samuel Rutherford, Letters (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+the+religious+homage+done+to+an+image%2C+or+even+to+elements%2C+is+in+itself+an+external+act+of+idolatry%2C+insofar+as+the+act+is+concerned%2C+although+the+intention+of+such+homage+may+be+directed+to+God+the+Great+First+Cause%2C+%E2%80%94so+the+act+of+kneeling+to+a+piece+of+bread%2C+seeing+that%2C+according+to+the+ordinance%2C+the+whole+man%2C+internal+and+external%2C+ought+to+be+engaged+in+the+elementary+signs%2C+is+a+relative+act+of+worship+and+an+adoration+of+the+bread+itself.+The+reason+is%3A+an+intention+to+worship+a+material+object+is+not+of+the+essence+of+external+adoration%2C+as+appears+in+a+religious+act+of+homage.+Thus%2C+the+bending+of+the+knee+before+the+Babylonish+image+is+an+external+act+of+worship%2C+even+though+the+three+youths+had+no+intention+to+worship+any+but+the+true+God%3B+and+in+like+manner%2C+those+who%2C+from+fear+or+the+hope+of+reward+or+vain-glory%2C+bend+the+knee+to+Jeroboam%E2%80%99s+golden+calf+%28which+the+text+clearly+enough+proclaims+to+have+been+done+by+the+king+himself%2C+from+no+religious+motive+but+the+mere+desire+to+rule%29%2C+do+pay+ad-+oration+to+the+calf+by+the+external+act%2C+although%2C+no+doubt%2C+they+may+suppose+the+calf+a+mere+created+object+and+unworthy+of+honor%2C%E2%80%94because+the+act+of+homage%2C+whether+we+mean+it+or+not%2C+is%2C+from+the+ordinance+of+God+and+nature%2C+a+symbol+of+worship.+Therefore%2C+as+the+bread+%5Bin+the+Lord%E2%80%99s+Supper%5D+denotes+the+body+of+Christ+%28even+though+that+idea+be+not+present+to+the+mind%29%2C+so+in+like+manner%2C+kneeling%2C+when+used+as+a+religious+service%2C+is+the+external+adoration+of+that+bread%2C+in+presence+of+which+we+bow+as+before+the+delegated+representative+of+God%2C+be+our+intention+what+it+may.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Letters+%28Edinburgh%2C+1894%29%2C+pp.+193-94+Also+reprinted+by+Banner+of+Truth.+Rutherford+is+here+quoting+from+some+other+public+document%2C+possibly+from+the+Latin+of+David+Calderwood%E2%80%99s+Altar+of+Damascus%2C+p.+595.+%7C+Letter+91%2C+to+Robert+Gordon+of+Knockbrex&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8994f6114d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8994f6114d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/religious-images-in-worship/#:~:text=As%20the%20religious%20homage%20done%20to,be%20our%20intention%20what%20it%20may&amp;text=As%20the%20religious%20homage%20done%20to%20an%20image&amp;text=of%20God%2C%20be%20our%20intention%20what%20it%20may" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-162e016af7" data-kw="">
<blockquote><p>If these other things of policy be necessary, necessitate precepti [by the necessity of precept], in regard that Jesus Christ has commanded them to be observed, why then are some things alterable which Christ has commanded to be observed, some things unalterable? Cross and surplice, which prelates say have been in the Church these twelve hundred years, are in themselves as positive, and have as small affinity with the civil laws, customs and manners of nations (except they mean sinful customs) as sacramental eating and drinking. And the like may be said of all the alterable ceremonies sometimes in use, in England, and now in force amongst Papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, p. 10</span></figcaption>

</figure><figure class="quote" id="q-034cea6e81" data-kw="">
<blockquote><p>…as Papists say, their unwritten traditions are agreeable to the Word, and though beside Scripture, yet not against it: and [are] the very will of God no less than the written Word; and let Formalists assure us that their positive additaments of surplice and cross are the same which God commands in the Scriptures by the prophets and apostles, and though beside, yet not contrary to the Word: But I pray you what better is the distinction of beside the Word, not contrary to the Word of God, out of the mouth of Papists, to maintain unwritten traditions, which to them is the express Word of God, than out of the mouth of Formalists, for their unwritten positives, which are worse than Popish traditions in that they are not the express Word of God, by their own grant?</p></blockquote>

</figure><figure class="quote" id="q-aba9d7468c" data-kw="">
<blockquote><p>In this sort may Christians honor the cross: for who makes any question but in our wars against the Jews or Mahumetists, we may bear our ensigns or arms crossed, for public testifying to the infidels that we are Christians, and our adversaries are miscreants and void of faith. So may the cross be engrave[n] on money to show that it is the coin or stamp of a Christian prince. So may the cross be placed on the gates of cities, castles or houses, to deliver apparently that the inhabitants in such places do make profession of Christianity. So was it long since ordained that the instruments of contracts or bargaining made by public notaries should be sealed and signed with the cross, as it is read in lib. de Cod. And in such like politic considerations, we reject not the use of the material cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise on the Virtue of the Cross &amp; the True Manner How to Honour It (London, 1599), ‘How the Cross Ought to be Honored’, no page number. de La Faye (1540-1615) served with Theodore Beza in Geneva as a reformed professor of philosophy and theology.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-08d8e4b231" data-kw="">
<blockquote><p>Objection: Be it true that crosses were purposely appointed to be adored, yet not so now. The Jews would not admit of the image of Caesar in the Church, yet they abolished it not, but admitted it in their coin… [Rutherford’s] Answer: 1. Though the cross were first framed for no adoration… … 5. We remove not crosses from coinage, no more than the Jews did the image of Caesar. But we agree with them [the Jews], [Richard] Hooker [an Anglican] being judge, in banishing them from the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty, pp. 89-92 in The Divine Right of Church Government (London, 1646)</cite></span></figcaption>

</figure><figure class="quote" id="q-4d7f690453" data-kw="">
<blockquote><p>The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the Frensh bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit [one’s dress], by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 9</cite>, p. 47.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-7f6fd69470" data-kw="">
<blockquote><p>I am not, however, so superstitious as to think that all visible representations of every kind are unlawful. But as sculpture and paintings are gifts of God, what I insist for is, that both shall be used purely and lawfully, that gifts which the Lord has bestowed upon us, for his glory and our good, shall not be preposterously abused, nay, shall not be perverted to our destruction. We think it unlawful to give a visible shape to God, because God Himself has forbidden it… Visible representations are of two classes, viz., historical, which give a representation of events, and pictorial, which merely exhibit bodily shapes and figures. The former are of some use for instruction or admonition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (1559), bk. 1, ch. 11, section 12 trans. Beveridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e1a8e069d5" data-kw="">
<blockquote><p>…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures. Also we make a distinction of images, that some of them be true, and some of them false. Among the true, those be reckoned, which doo represent those things, which either be, or haue béene, or hereafter shall be. But those are called false, which represent those things that neither be, have been, nor yet ever shall be: as are the chymaeras and centaurs. There be also some images filthy and some honest, according as those things be which are expressed by them. Also they may be distinguished according to the circumstance of the place, because some be set in a holy place and some in places prophane. Again, others there be which are appointed in respect of worship and religion: but others are erected as ornaments, and only for the remembrance of a thing.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures. Also we make a distinction of images, that some of them be true, and some of them false. Among the true, those be reckoned, which doo represent those things, which either be, or haue béene, or hereafter shall be. But those are called false, which represent those things that neither be, have been, nor yet ever shall be: as are the chymaeras and centaurs. There be also some images filthy and some honest, according as those things be which are expressed by them. Also they may be distinguished according to the circumstance of the place, because some be set in a holy place and some in places prophane. Again, others there be which are appointed in respect of worship and religion: but others are erected as ornaments, and only for the remembrance of a thing.”

<blockquote><p>But as far as images are concerned, whether painted or sculpted, though we do not reject their use when sacred material or histories are represented, nevertheless we do not admit them in holy places without hesitation. Nor do we do we judge it prudent especially that sculpted images be set up in Temples, not because it is impious in and of itself, or because we think it not allowed, but rather because of the sad appearance of the Churches we see in Temples of the Papists, which took its origin from the use of Images and pictures… For this reason, though I completely concede that the use of images in which sacred things and histories are represented in temples is a matter of indifference (adiaphoron), nevertheless since people easily abuse thme when they are seen in sacred places, I think they do wisely who eliminate all these things from temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4</cite>, pp. 469-70</span></figcaption>

<blockquote><p>2. Though it be not simply unlawful to express in painting the visible shapes that were showed in vision to the prophets, if it be only for use and signification of the history, or if there be any other commendable use: yet to make those shapes for any use of religion, or service of God, is abominable idolatry. Fulke, ibid.: Epiphanius saw in a Church at Anablatha, an image painted in a table, as it had been of Christ or a saint; he took it down and cut it in pieces: affirming that it was contrary to the Scripture for any image of a man to hang in the Church of Christ. The Elibertine Council, Canon 36 decreed that no pictures should be made in Churches. If no pictures, much less carved images, which are a more strong provocation to idolatry. Augustine renders a reason why it is dangerous to have images in Churches, where there is yea but the least fear of superstition: Quis orat intuens simulachrum, qui non sic afficitur, vt ab eo se exaudiri putet, nec ab eo sibi praestari, quod desideret, putet? Who (sayth he) prayeth beholding an image, and is not so affected as though he were heard of it, and hopeth not to have that performed by it which he desireth? Ps. 113.</p></blockquote>

<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship</cite>, pp. 283-84 (1633)</span></figcaption>

<blockquote><p>That which no law of God or valid law of man forbids, is not unlawful: but the use of the things forementioned, no law of God or valid law of man forbids: Therefore the use of the things forementioned, is not unlawful. He that will say that there is any such law must show that law and prove his affirmative: But let him take heed of adding to God’s law: A false prophet that fathered a false message from God was an heinous sinner. Is it not worse falsely to father a law on Him?</p></blockquote>

</figure><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>

— Charles Gataker, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+I+conceive+my+self%2C+though+by+many+degrees+inferior+to+Timothy%2C+yet+in+some+measure+to+lie+under+St.+Paul%E2%80%99s+double+charge+to+him+%281+tim.+6%3A20%29%2C+first+%5BGreek%5D%2C+to+keep+the+precious+truth+committed+to+my+trust%2C+and+then+what+I+have+been+sufficiently+taught+and+assured+of%2C+to+commit+the+same+unto+faithful+men%2C+who+shall+be+able+to+teach+others+also+%282+Tim.+2%29.+Thus+far+I+allow+tradition+of+the+faith+once+delivered+to+the+saints%2C+though+it+be+not+infallible%2C+unchangeable+and+incorruptible%2C+either+by+the+course+of+nature+or+by+the+promise+of+grace+to+any+particular+race+or+succession+of+men%2C+yet+to+be+a+duty+required+of+ministers%2C+and+a+means+to+propagate+the+truth%3B+whether+that+delivery+be+transacted+by+word+of+mouth%2C+which+is+transient%2C+or+by+writing%2C+which+is+permanent%2C+as+now+I+transmit%2C+what+I+have+received.%E2%80%9D%0A%0A%E2%80%94+Charles+Gataker%2C+Preface+in+Thomas+Gataker%2C+An+Antidote+Against+Error+Concerning+Justification%E2%80%A6+%28d.+1654%3B+London%3A+Brome%2C+1670%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55ed48034e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55ed48034e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/on-human-traditions/#:~:text=For%20I%20conceive%20my%20self%2C%20though,I%20transmit%2C%20what%20I%20have%20received&amp;text=For%20I%20conceive%20my%20self%2C%20though%20by%20many&amp;text=as%20now%20I%20transmit%2C%20what%20I%20have%20received" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-acfb5649fc" data-kw="">
<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners... (London, 1645), ch. 6</cite>, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-e0af007caa" data-kw="">
<blockquote><p>Divine Apostolical Institutions (that we may draw to our purpose) were again of two sorts: First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15:1, for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the congregations, and some other the like. Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor [John Prideaux, d. 1650];</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-divines.html">Westminster Divines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daniel Cawdrey &amp; Herbert Palmer | Sabbatum Redivivum: or, The Christian Sabbath Vindicated (London, 1645), fourth part, ch. 1, ‘The Lord’s Day is of Divine Institution’, p. 463 Irregular page numbering Westminster divines</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-b82843f267" data-kw="">
<blockquote><p>5. …Women are to be vailed in the assemblies, because of the angels, 1 Cor. 11:10, to show their reverence and subjection to them being present; and angels are covered, to show their reverence and subjection unto Christ; it’s an honor to the angels, that in reverence to them the women are to be vailed; and it’s a great honor to Christ, that angels reverence and adore Him.</p></blockquote>

<blockquote><p>3. Such [persons] as openly proclaim their want [lack] of reverence, by their outward irreverend, unbeseeming gestures, which are stately coming into the assembly of God’s people, even when they are serving of God, with their hats on their heads, sitting at prayer, casting their eyes this way and that way…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews… (London, 1655), ch. 12, §135, ‘Of serving God reverendly’, p. 388 Gouge (1575–1653) was a Cambridge scholar, lecturer and Westminster divine.</cite></span></figcaption>

<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>

<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>

<blockquote><p>The daring attack that is now made by some of the directors of the Edinburgh and Glasgow Railway on the law of God and the peace of our Scottish Sabbath – the blasphemous motion which they mean to propose to the shareholders in February next – and the wicked pamphlets which are now being circulated in thousands, full of all manner of lies and impieties- call loudly for the calm, deliberate testimony of all faithful ministers and private Christians in behalf of God’s holy day. … (1) The keeping open of Reading-Rooms – In this town, and in all the large towns of Scotland, I am told, you may find in the public reading-rooms many of our men of business turning over the newspapers and magazines at all hours of the Lord’s day… (2) The keeping open Public-Houses – Public-houses are the curse of Scotland. I never see a sign, “Licensed to sell spirits,” without thinking that it is a licence to ruin souls. (3) Sunday Trains upon the Railway – A majority of the directors of the Edinburgh and Glasgow Railway have shown their determination, in a manner that has shocked all good men, to open the railway on the Lord’s day.</p></blockquote>

s%20day" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b5478b31f" data-kw="">
<blockquote><p>The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)”

— James Dennison, The Market Day of the Soul: the Puritan Doctrine of the Sabbath in England, 1532-1700 (RHB, 2008), pp. 133-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Puritan+doctrine+generally+opposed+the+extreme+strictness+which+some+accorded+the+Sabbath.+Some+%5Bextreme+persons%5D+argued+that%3A+%281%29+Ex.+16%3A23+prohibited+all+baking+and+cooking+on+the+Sabbath%3B+%282%29+Ex.+16%3A29+forbade+all+walking+on+the+Sabbath%3B+%283%29+Ex.+20%3A10+prohibited+all+work+of+any+kind+on+the+Sabbath+%5Beven+acts+of+necessity%5D%3B+%284%29+Ex.+31%3A14-15%3B+35%3A3%3B+Num.+15%3A35+forbade+all+work%2C+even+the+gathering+of+sticks+for+a+fire%2C+on+the+Sabbath.+%28Cf.+George+Walker%2C+The+Doctrine+of+the+Holy+Weekly+Sabbath+%281641%29+pp.+117-19%29+The+puritan+answer+to+this+excessive+strictness+was+to+direct+attention+to+the+context+of+each+Biblical+reference%E2%80%A6+Ex.+20%3A10+was+never+intended+to+forbid+works+of+necessity+and+charity%2C+as+Christ+Himself+makes+clear+when+He+shows+that+it+was+lawful+to+pull+a+beast+out+of+a+pit+on+the+Sabbath+%28Lk.+14%3A5%29%2C+to+lead+a+beast+to+water+on+the+Sabbath+%28Lk.+13%3A15%29+and+to+circumcise+a+man+on+the+Sabbath+%28Jn.+7%3A22-23%29.+%28Ibid.%2C+p.+121%29+Ex.+35%3A3+forbade+the+kindling+of+a+fire+on+the+Sabbath%2C+but+the+context+makes+it+clear+that+fires+in+general+were+not+prohibited%3B+rather+fires+for+work+on+the+Tabernacle+were+forbidden.+%28Ibid.%2C+p.+121%29+Ex.+31%3A14-15+and+Num.+15%3A35+make+work+on+the+Sabbath+punishable+by+death%3B+however%2C+Walker+argues+that+it+is+work+done+presumptuously+%28cf.+Num.+15%3A30-31%29%2C+i.e.+by+contemptuously+despising+the+commandment+of+God%2C+which+incurs+the+death+penalty.+%28Ibid.+p.+122%29%E2%80%9D%0A%0A%E2%80%94+James+Dennison%2C+The+Market+Day+of+the+Soul%3A+the+Puritan+Doctrine+of+the+Sabbath+in+England%2C+1532-1700+%28RHB%2C+2008%29%2C+pp.+133-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b5478b31f.html&amp;via=5Solas" ta <blockquote><p>Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life… (London: Kingstone, 1622), bk. 2, ch. 8, section 5, ‘Of the Spiritual Sanctification, &amp; the Outward Rest’</cite>, pp. 132-33</span></figcaption>

<blockquote><p>47. The rest of the day is to be spent in pious activity. Formerly there was an offering peculiar to the sabbath, but the continued or daily offering with its drink offering was not to be omitted, Num. 28:10. 48. Public worship, which is to be celebrated most solemnly, necessarily requires Scripture reading, meditation, prayer, holy discourse, and contemplation of the works of God wherein we may be more open to public worship and worship may become truly effective in us.</p></blockquote>

<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments… (London: Newman, 1675), 4th Commandment, Sanctification of</cite>, pp. 289-90</span></figcaption>

<blockquote><p>§20. For private duties, both personal and domestic, they are either antecedent or consequent to the solemn public worship, as usually for time it is celebrated amongst us. These consisting in the known religious exercises of prayer, reading the Scripture, meditation, family instructions from the advantage of the public ordinances, they are to be recommended unto every one’s conscience, ability, and opportunity, as they shall find strength and assistance for them.</p></blockquote>

<blockquote><p>2. The duties of worship to be attended by us on this Day, are either Natural or Instituted… 1. The duties of natural worship, are such as are suited to the nature of man and flow from the great end he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the end and usefulness of it… 2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>

<blockquote><p>And Nehemiah, which is the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, ‘This day is holy unto the Lord your God; mourn not, nor weep.’ For all the people wept, when they heard the words of the law. Then he said unto them: ‘Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.’ So the Levites stilled all the people, saying, ‘Hold your peace, for the day is holy; neither be ye grieved.’ And all the people went their way to eat, and to drink, and to send portions, and to make great mirth, because they had understood the words that were declared unto them.</p></blockquote>

<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath… (Amsterdam, 1638), ch. 21 Westminster divine</cite>, p. 152</span></figcaption>

</figure><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641)</cite>, p. 241</span></figcaption>

<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>

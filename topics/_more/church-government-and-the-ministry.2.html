<blockquote><p>Q. What sorts of public theft are there?

A. Two, either in Church, or Common-wealth.

Q. What is Church theft?

A. It is called Sacrilege, consisting partly in things spirituall, and partly in things temporal.

Q. What is the sacrilege that consists in things spiritual?

A. When the Church is deprived of sound doctrine, through the insufficiency, or negligence, or corruption of he Pastors and Teachers.

Q. Who are they that sin in this kind of sacrilege?

A. Either Ministers, or people.

Q. What Ministers do sin therein?

A. First, the ignorant, insufficient, and dumb Ministers, which take wages, &amp; cannot do their duty; with the makers &amp; maintainers of them. 2. The idle negligent Ministers; whither refer Monks, Friers, Nuns, &amp;c.

Q. How do the people sin herein?

A. When they not only are content to be under such Ministers, as either cannot, or will not reprove them of their sins, but also desire and seek for them.

Q. What is that Sacrilege which consists in things temporal?

A. When the goods of the Church are taken from them to whom they belong; or when men make sale or merchandize of Benefices and Church-livings.

Q. What is the theft of the Common-wealth?

A. When the common goods are either taken away, or applied to any private use, or when rewards are given, or taken, to corrupt judgment; or when men become like false coiners of money, washers, or clippers, or the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (London: Thomas Man, 1616), pp 151-52.</span></figcaption>

a22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dddda5da22.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/31/thomas-cartwright-on-public-theft/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Forgetting what we hear. If a Scholar have his Rules laid before him, and he forgets them as fast as he reads them, he will never learn. Aristotle calls the Memory, the Scribe of the Soul; and Bernard calls it the Stomach of the Soul, because it hath a retentive faculty, and turns heavenly food into blood and spirits.

We have great memories in other things; we remember that which is vain. Cyrus could remember the name of every Soldier in his huge Army; we remember injuries. This is to fill a precious Cabinet with dung; but, quàm facilis oblivio boni? as Jerome saith, how soon doe we forget the sacred truths of God? We are apt to forget three things, our faults, our friends, our instructions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autarkeia, or, The art of divine contentment</cite>, (2nd edn, London: Ralph Smith, 1654), pp 7-8.</span></figcaption>

<blockquote><p>Quest. What is the Office and Work of the Ruling Elders?

Answ. Seeing the Kingdom of God is not of this World, but Heavenly and Spiritual, and the Government of his Kingdom is not Lordly, but Stewardly and Ministerial, and to labour in the Ministry of Exhortation and Doctrine, is the proper Work of the Pastors and Teachers, it remaineth therefore to be the Office and Work of the Ruling Elders to assist the Pastors and Teachers, in diligent Attendance to all other Aids of Rule besides Exhortation and Doctrine, as becometh good Stewards of the Household of God.

As I. To open and shut the Doors of God’s House, by Admission of Members, by Ordination of Officers, by Excommunication of notorious and obstinate Offenders. 2. To see none live in the Church inordinately without a Calling, or idle in their Calling. 3. To prevent and heal Offences whether in Life or Doctrine, that might corrupt their own Church, or other Churches also, if their Counsel be required. 4. To prepare Matters for the Churches Consideration, and to moderate the Carriage of all Matters in the Church-Assemblies, as to propound Matters to the Church, and to order the Seasons of Speech and Silence in the Church. 5. Finally, To feed the Flock of God by a Word of Admonition; and, as they shall be called, to visit and pray for their sick Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), pp 53-54.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-7dfe8ecde9" data-kw="">
<blockquote><p>We remember, several years ago, when the question of slavery was keenly agitated, that it was a favourite argument of the upholders of that nefarious traffic, that the slaves in many of the plantations were more comfortably provided for than our operatives at home; that they were very kindly used by their masters, and had, personally, no desire to be liberated. In urging this argument, they altogether forgot or overlooked that the main question was, not whether the slaves were ill-treated, but whether it was right in man to hold property in his fellow-men. So it is in the consideration of the question of Patronage.

We are apt some times to forget that the main question is, not the abuse of power on the part of the patron, in presenting to the Church unworthy and graceless ministers, but the propriety of his possessing such a power at all. It is true that had patrons always exercised their power judiciously, and for the ends for which it is alleged to have been entrusted to them, it might have been very difficult to awaken a general and deep-felt interest in the mere abstract question. The mass of mankind are more easily and universally moved by a felt grievance and the prospect of redress, than by the simple exhibition of truth; and had all our patrons been men of the character described in the above quotation, it might not have been very easy to induce the people to make a united and determined stand against Patronage.

We might have expected, and, no doubt, would have obtained, better results under such a restricted system of Patronage, just as the slaves of a benevolent proprietor would experience the fruits of his kindness and care. But except in this single thing, that we might expect a Christian patron to make conscience of the exercise of his power, does it differ in any respect from the system under which the Church now groans? The thing objected against, is not so much the way in which Patronage has been exercised, as the nature of the power which is implied in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>The first Authors of these wicked opinions were N. [John] Wheelwright some adherents to M. Wheelright, and Mistress [Anne] Hutchinson. This woman is called the American Jezebel, she was the wife of M. William Hutchison of Boston, the daughter of M. [Francis] Marbury, sometime preacher in London: She was haughty, bold, active in wit, eloquent, vain, and self-conceited, would not stick to lye, and brought these opinions from old England and so was holden for a time out of Church communion, yet admitted, deceived many with extolling of Christ as working all in the souls of believers, as in dead and passive Organs and depressed sanctification and all qualifications of inherent graces as nothing held union with Christ and justification without faith, she drew to her way many godly people and many loose and prophane by a weekly lecture she held in her house, under pretence of repeating sermons, took on her to sit in a chair and to teach men.

All these foresaid errors were condemned by a general assembly of the Churches of New England, at New-town August 30. 1637. They learned by sad experience of these seducers from that time, as I am informed to remove farther from M. [John] Robinson’s democracy and popular government, and come a little nearer to Presbyterial Government, and while they embrace that Apostolic Government, they shall ever be infested with heresies, as now they are this day with new Bee-hives of Anabaptists, Seekers Enthusiasts, Familists, and Antinomians: they come, blessed bee the Lord, a little nearer to it then they did, M. [John] Cotton in his Treatise of the keys of the kingdom of heaven, set out by M. T[homas]. Goodwin and M. Philip Nye, is well sound in our way, if he had given some more power to assemblies, as is clear Act. 15. and in some lesser points, Though Independents in England oppose that Godly and learned Divine, and as we hear have suppressed his judgement touching constitution of visible Churches, and are not willing that Antinomians, Familists, Socinians, Anabaptists, or other abominable sectaries be brought to the trial of a lawful Church assembly, but plead for a toleration to them, which the Churches of New England deservedly abhor as Atheistical and destructive to the truth, peace and unity of the Church of Christ.

Mistress Hutchison ought to have been convened before this Church-assembly, and M. Wheelright and others were convened before a civil court in Massachusetts. Octo. 2. 1637. For disturbance of the public peace, where in the month of March, M. Wheelright was convict of sedition: upon occasion whereof, a number of Familists gave in a Petition or Remonstrance complaining that their beloved M. Wheelright was condemned for no fault, whereas his doctrine was no other then the very expressions of the holy ghost himself, though he had said expressly, That Magistrates, Ministers, and most of the people were under a Covenant of works, and therefore were enemies to Christ, such as Herod, Pilate, Scribes and Pharisees, and encouraged the people to rise up against them, as Philistims, and pronounced the curse of Meroz on them who would not join with them against the churches of the legalists. And made mention of Moses his killing the Egyptian. Much false doctrine and debates and disputes raised he in the Church there, which were not known before his coming to the Country, where upon he was sentenced to be disfranchised and banished out of their jurisdiction and committed to safe custody till he should find surety to depart before the end of March, upon this he appealed to the Kings Majesty.

Others of his Disciples saying he held forth nothing but the truth of Christ, were censured, some banished, some fined, and imprisoned. Mistress Hutchison boldly justified her self, that she might teach as Priscilla did, reproached the Ministers as Legalists, told by revelation and many misapplied Scriptures that she was forewarned by God, in Old England that she should separate from all Ministers because legal men: except M. Cotton and M. Wheelright; that she should come to New England, suffer for the truth. She said she should be delivered as Daniel was from the Lyons. Such Prophets love to foretell things past and say they knew them before they came to pass.</p></blockquote>

<blockquote><p>Sect. 8. First, Who these Elders were. The word [Elders] in its primary and original sense, relates to Age, and denotes, either such as lived a great while; even till they came to be old; or, such as lived a great while ago; those of former times; as Deut. 32. 7. Heb. 11. 2. and so ’tis the same with …, Matth. 5. 21. and thence it’s derived to signify most commonly, both Dignity and Authority; and so we find both in Hebrew, Greek, Latin, and English (to name no more) the words importing Age or Eldership, viz. …, Senatus, Aldermen, do denote both Honour and Power. And

(1) This sense is very frequent both in the Old and New Testament. I shall mention but a few places of the chief; as Deut. 22. 15.——the Elders of City in the gate (the place of Judicature). And they are sometimes called, Elders of the people, i. e. such who had authority over the people; as Elders of a City, are they that are in power in that City. Thus Matth. 26. 3. Then assembled together the chief Priests, and Scribes, and Elders of the people. So c. 27. 1. When the morning was come, all the chief Priests, and Elders of the people took counsel, &amp;c.

Hence they are commonly joined with [Rulers]; as 2 King. 10. 1. Jehu wrote letters——to the Rulers of Jezreel, and to the Elders. Act. 4. 8. Ye Rulers and Elders of Israel; and they are very frequently joined with [chief Priests, and Scribes and Pharisees;] and then the distinction that was between them, I conceive may be stated thus; As they were distinguished from the Priests, they seem to be Lay-men (as we call ’em), and as distinguished from Scribes, they were such as were not brought up wholly in the study of the Law, or at least did not make that their Profession; but were some of the Nobility and Gentry, admitted to be Members of the Sanhedrim, as is most evident from these places following, Acts 22. 5. The High Priest doth bear me witness, with all the estate of the Elders; from whom also I received letters unto the brethren, and went to Damascus, to bring them which were there, bound unto Jerusalem, for to be punished: and c. 24. 1. Ananias the High Priest descended with the Elders, who informed the Governor against Paul. Matth. 26. 59. Now the chief Priests and Elders, and all the Council, sought false witness against Jesus, &amp;c. Mark 15. 1. The chief Priests held a consultation with the Elders and Scribes, and the Whole Council. So that nothing is more clear, than that they were Members of the Council, and persons in, and of, Authority.

I have been the more full in this point, because Grotius in loc. thinks that these Elders here mentioned, though they were learned and wise men, and so possibly might be Members of the Sanhedrim upon that account; yet that the mention made of ’em here, does not relate to any such capacity they were in; but only, as celebrated Teachers, who were not only famous in their Generations, but were had in great veneration and esteem in after-times, and their judgements and dogmas were of great authority. And so Beza takes ’em too, only for the ancient Doctors, and not for persons in authority. But even Grotius himself elsewhere (viz. in Acts 4. 5.) gives this account of ’em, Seniors, idem quod Senators, &amp; consules vrbium. Elders are the same with the Senate, or Court of Aldermen, or, at least, Common-council-men, and ‘Burgesses of Cities: And the places forementioned do most evidently and undeniably evince, that they were persons in authority, and members of the Sanhedrim (as I said before) or great Council of the Nation: And therefore

Sect. 9. (2) They were the proper Judges of Ecclesiastical affairs, to whose cognisance matters of Religion did appertain. …

(3) We may easily imagine the reason why the Scribes and Pharisees here, were so much concerned at this neglect of the Disciples, viz. because their own Copyhold was touched, and their own authority lay at stake, inasmuch as they were the Successors of these Elders; so that the slight that was put upon the one, redounded to the disparagement of the other. Non mirum Scribas violatione traditionum seniorum cito of∣fensos fuisse, quod co &amp; ipsorum authoritas elevari videretur, qui jam Seniorum locum tenerent, illorum successores, &amp; institutorum propagatorcs, saith Brugensis. Hence Christ calls ’em your Traditions.

So then, The Elders here meant were such as lived in former times, who were persons of great Dignity and Authority, to whose cognisance matters of Religion did appertain, and to whom it belonged to belonged to form and frame these Constitutions or Traditions.

Where, by the way, you may take notice (and that you may take the more and better notice of it, know, That it is the Observation of the prodigiously learned Dr. [Edward] Stillingfleet) That the word [Elder] or Presbyter, according to the common use of it, has a higher Character, and is of more excellent import, than the word [Bishop]; the former noting Dignity and Authority, (as has been showed); the latter, only matter of Duty, Charge, Trouble and Business. His words are … a name importing Duty more than Honour, and not a Title above Presbyter, but rather used by way of diminution and qualification of the power implied in the name [Presbyter]. Iren. p. 286. But this by the by. Thus you see, Who these Elders were.</p></blockquote>

— Vincent Alsop, An exercitation on the historical relation, Matth. 15, 1–9, Mark 7, 1–13, concerning eating with unwashen hands by way of appendix or supplement to the discourse concerning indifferencies: and More particularly, to Argument or Reason the Fourth; to prove, That Indifferencies enjoined by Authority do, (London: Benj. Alsop, 1680), pp 8-13.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSect.+8.+First%2C+Who+these+Elders+were.+The+word+%5BElders%5D+in+its+primary+and+original+sense%2C+relates+to+Age%2C+and+denotes%2C+either+such+as+lived+a+great+while%3B+even+till+they+came+to+be+old%3B+or%2C+such+as+lived+a+great+while+ago%3B+those+of+former+times%3B+as+Deut.+32.+7.+Heb.+11.+2.+and+so+%E2%80%99tis+the+same+with+%E2%80%A6%2C+Matth.+5.+21.+and+thence+it%E2%80%99s+derived+to+signify+most+commonly%2C+both+Dignity+and+Authority%3B+and+so+we+find+both+in+Hebrew%2C+Greek%2C+Latin%2C+and+English+%28to+name+no+more%29+the+words+importing+Age+or+Eldership%2C+viz.+%E2%80%A6%2C+Senatus%2C+Aldermen%2C+do+denote+both+Honour+and+Power.+And%0A%0A%281%29+This+sense+is+very+frequent+both+in+the+Old+and+New+Testament.+I+shall+mention+but+a+few+places+of+the+chief%3B+as+Deut.+22.+15.%E2%80%94%E2%80%94the+Elders+of+City+in+the+gate+%28the+place+of+Judicature%29.+And+they+are+sometimes+called%2C+Elders+of+the+people%2C+i.+e.+such+who+had+authority+over+the+people%3B+as+Elders+of+a+City%2C+are+they+that+are+in+power+in+that+City.+Thus+Matth.+26.+3.+Then+assembled+together+the+chief+Priests%2C+and+Scribes%2C+and+Elders+of+the+people.+So+c.+27.+1.+When+the+morning+was+come%2C+all+the+chief+Priests%2C+and+Elders+of+the+people+took+counsel%2C+%26c.%0A%0AHence+they+are+commonly+joined+with+%5BRulers%5D%3B+as+2+King.+10.+1.+Jehu+wrote+letters%E2%80%94%E2%80%94to+the+Rulers+of+Jezreel%2C+and+to+the+Elders.+Act.+4.+8.+Ye+Rulers+and+Elders+of+Israel%3B+and+they+are+very+frequently+joined+with+%5Bchief+Priests%2C+and+Scribes+and+Pharisees%3B%5D+and+then+the+distinction+that+was+between+them%2C+I+conceive+may+be+stated+thus%3B+As+they+were+distinguished+from+the+Priests%2C+they+seem+to+be+Lay-men+%28as+we+call+%E2%80%99em%29%2C+and+as+distinguished+from+Scribes%2C+they+were+such+as+were+not+brought+up+wholly+in+the+study+of+the+Law%2C+or+at+least+did+not+make+that+their+Profession%3B+but+were+some+of+the+Nobility+and+Gentry%2C+admitted+to+be+Members+of+the+Sanhedrim%2C+as+is+most+evident+from+these+places+following%2C+Acts+22.+5.+The+High+Priest+doth+bear+me+witness%2C+with+all+the+estate+of+the+Elders%3B+from+whom+also+I+received+letters+unto+the+brethren%2C+and+went+to+Damascus%2C+to+bring+them+which+were+there%2C+bound+unto+Jerusalem%2C+for+to+be+punished%3A+and+c.+24.+1.+Ananias+the+High+Priest+descended+with+the+Elders%2C+who+informed+the+Governor+against+Paul.+Matth.+26.+59.+Now+the+chief+Priests+and+Elders%2C+and+all+the+Council%2C+sought+false+witness+against+Jesus%2C+%26c.+Mark+15.+1.+The+chief+Priests+held+a+consultation+with+the+Elders+and+Scribes%2C+and+the+Whole+Council.+So+that+nothing+is+more+clear%2C+than+that+they+were+Members+of+the+Council%2C+and+persons+in%2C+and+of%2C+Authority.%0A%0AI+have+been+the+more+full+in+this+point%2C+because+Grotius+in+loc.+thinks+that+these+Elders+here+mentioned%2C+though+they+were+learned+and+wise+men%2C+and+so+possibly+might+be+Members+of+the+Sanhedrim+upon+that+account%3B+yet+that+the+mention+made+of+%E2%80%99em+here%2C+does+not+relate+to+any+such+capacity+they+were+in%3B+but+only%2C+as+celebrated+Teachers%2C+who+were+not+only+famous+in+their+Generations%2C+but+were+had+in+great+veneration+and+esteem+in+after-times%2C+and+their+judgements+and+dogmas+were+of+great+authority.+And+so+Beza+takes+%E2%80%99em+too%2C+only+for+the+ancient+Doctors%2C+and+not+for+persons+in+authority.+But+even+Grotius+himself+elsewhere+%28viz.+in+Acts+4.+5.%29+gives+this+account+of+%E2%80%99em%2C+Seniors%2C+idem+quod+Senators%2C+%26+consules+vrbium.+Elders+are+the+same+with+the+Senate%2C+or+Court+of+Aldermen%2C+or%2C+at+least%2C+Common-council-men%2C+and+%E2%80%98Burgesses+of+Cities%3A+And+the+places+forementioned+do+most+evidently+and+undeniably+evince%2C+that+they+were+persons+in+authority%2C+and+members+of+the+Sanhedrim+%28as+I+said+before%29+or+great+Council+of+the+Nation%3A+And+therefore%0A%0ASect.+9.+%282%29+They+were+the+proper+Judges+of+Ecclesiastical+affairs%2C+to+whose+cognisance+matters+of+Religion+did+appertain.+%E2%80%A6%0A%0A%283%29+We+may+easily+imagine+the+reason+why+the+Scribes+and+Pharisees+here%2C+were+so+much+concerned+at+this+neglect+of+the+Disciples%2C+viz.+because+their+own+Copyhold+was+touched%2C+and+their+own+authority+lay+at+stake%2C+inasmuch+as+they+were+the+Successors+of+these+Elders%3B+so+that+the+slight+that+was+put+upon+the+one%2C+redounded+to+the+disparagement+of+the+other.+Non+mirum+Scribas+violatione+traditionum+seniorum+cito+of%E2%88%A3fensos+fuisse%2C+quod+co+%26+ipsorum+authoritas+elevari+videretur%2C+qui+jam+Seniorum+locum+tenerent%2C+illorum+successores%2C+%26+institutorum+propagatorcs%2C+saith+Brugensis.+Hence+Christ+calls+%E2%80%99em+your+Traditions.%0A%0ASo+then%2C+The+Elders+here+meant+were+such+as+lived+in+former+times%2C+who+were+persons+of+great+Dignity+and+Authority%2C+to+whose+cognisance+matters+of+Religion+did+appertain%2C+and+to+whom+it+belonged+to+belonged+to+form+and+frame+these+Constitutions+or+Traditions.%0A%0AWhere%2C+by+the+way%2C+you+may+take+notice+%28and+that+you+may+take+the+more+and+better+notice+of+it%2C+know%2C+That+it+is+the+Observation+of+the+prodigiously+learned+Dr.+%5BEdward%5D+Stillingfleet%29+That+the+word+%5BElder%5D+or+Presbyter%2C+according+to+the+common+use+of+it%2C+has+a+higher+Character%2C+and+is+of+more+excellent+import%2C+than+the+word+%5BBishop%5D%3B+the+former+noting+Dignity+and+Authority%2C+%28as+has+been+showed%29%3B+the+latter%2C+only+matter+of+Duty%2C+Charge%2C+Trouble+and+Business.+His+words+are+%E2%80%A6+a+name+importing+Duty+more+than+Honour%2C+and+not+a+Title+above+Presbyter%2C+but+rather+used+by+way+of+diminution+and+qualification+of+the+power+implied+in+the+name+%5BPresbyter%5D.+Iren.+p.+286.+But+this+by+the+by.+Thus+you+see%2C+Who+these+Elders+were.%E2%80%9D%0A%0A%E2%80%94+Vincent+Alsop%2C+An+exercitation+on+the+historical+relation%2C+Matth.+15%2C+1%E2%80%939%2C+Mark+7%2C+1%E2%80%9313%2C+concerning+eating+with+unwashen+hands+by+way+of+appendix+or+supplement+to+the+discourse+concerning+indifferencies%3A+and+More+particularly%2C+to+Argument+or+Reason+the+Fourth%3B+to+prove%2C+That+Indifferencies+enjoined+by+Authority+do%2C+%28London%3A+Benj.+Alsop%2C+1680%29%2C+pp+8-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8f74166e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a8f74166e9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/11/vincent-alsop-on-the-elders-of-the-jewish-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8aac0f4eb0" data-kw="">
<blockquote><p>Our apostles also knew, through our Lord Jesus Christ, and there would be strife on account of the office of the episcopate. For this reason, therefore, inasmuch as they had obtained a perfect fore-knowledge of this, they appointed those [ministers] already mentioned, and afterwards gave instructions, that when these should fall asleep, other approved men should succeed them in their ministry.

We are of opinion, therefore, that those appointed by them, or afterwards by other eminent men, with the consent of the whole Church, and who have blamelessly served the flock of Christ in a humble, peaceable, and disinterested spirit, and have for a long time possessed the good opinion of all, cannot be justly dismissed from the ministry.

For our sin will not be small, if we eject from the episcopate those who have blamelessly and holily fulfilled its duties. Blessed are those presbyters who, having finished their course before now, have obtained a fruitful and perfect departure [from this world]; for they have no fear lest any one deprive them of the place now appointed them. But we see that ye have removed some men of excellent behaviour from the ministry, which they fulfilled blamelessly and with honour.</p></blockquote>

anter</a></div>

<blockquote><p>Vers. 34. Let your Women keep silence in the Churches: for it is not permitted unto them to speak; but they are commanded to be under obedience: as also saith the Law.

Precept 5. Whereby he forbids that Women should speak in the Church, i. e. teach publicly, or propound questions, because subjection is appointed in the Word of God, for the Sex of Women, Gen. 3.16. requires.

Vers. 35. And if they will learn any thing, let them ask their Husbands at home: for it is a shame for Women to speak in the Church.

That he might prevent an Objection, he commands them to learn at home privately of their Husbands, or elsewhere, that which they would demand publicly, adding another reason of the Precept, because it is unseemly that a Woman should speak in the Church.</p></blockquote>

<blockquote><p>Observe that man of Sin or Antichrist, although singularly, and Emphatically, and as it were, personally pointed at, is not notwithstanding to be understood as terminated in any one individual person whatsoever; but as those many Antichrists make up that wicked society of Apostate Heretics, of what kind soever; so is this great Antichrist.

A chief of this great Apostacy, but as one in succession, though diverse in persons, so it is said of the Pope and Papacy That as to the place and office of the Papacy, all Popes from first to last, are but as one Pope, so when they say, the Pope is head of the Church, that is not intended of any one Pope alone, but of any and all in that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-jones.html">Henry Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of antichrist preached at Christ-Church, Dublin, Novemb. 12, 1676. By the Right Reverend Father in God, HENRY, Lord Bishop of MEATH.</cite>, (2nd edn, London: Nathaniel Ponder, 1679), p. 4.</span></figcaption>

</figure><figure class="quote" id="q-0694016242" data-kw="">
<blockquote><p>Paul is right to subordinate Jesus Christ the Son to God the Father because he is the intermediary through whom the righteousness and peace of God the Father reaches our consciences—he is the one who confers the righteousness and peace that God the Father has ordained for us. This verse tells us something about God the Father and God the Son. God the Father is the ultimate source of our righteousness, peace and salvation. Christ Jesus the Son is the intermediary through whom we receive that righteousness, peace and salvation—in other words, he is the one who delivers them to us.

The point here is that God the Father does not justify anybody apart from Christ, nor does he give anyone peace of mind apart from him. Likewise, it is plain from this what the gospel is and especially what it teaches, which is that the grace and peace of God the Father is manifested to us in our Lord Jesus Christ. To put it another way, the gospel teaches that our Lord Jesus Christ gave himself up for our sins in order to rescue us from this present world, according to the will of God our Father.</p></blockquote>

<blockquote><p>PATRONAGE is usually defined to be the exercise of a power of presentation to a Church, which power is held solely in virtue of some secular qualification, such as inheritance or purchase. … In a matter relating to the appointment of the office-bearers of the Church, our ultimate appeal must be “to the law and to the testimony.” Were it true, as some allege, that Scripture lays down no general principles or definite rule, for the guidance of the Church in the election of her office bearers, this matter would fall to be regulated by an enlightened regard to utility; but we trust to make it plain in the course of the following observations, that we are not left by Scripture altogether in the dark, in a matter which so nearly concerns the interests of the Church.

Amid much that is distressing and painful in the circumstances in which the Church of Scotland is now placed in its relations with the Civil Power, it is matter of sincere gratification that these very circumstances are forcing her office-bearers and members back upon first principles—constraining them to abandon all temporizing shifts and expedients, and to take their stand upon the broad and sure basis of the everlasting and unchangeable word of God.

It was a great step in advance towards right principles which the General Assembly made in 1834, when the old doctrine of Non-intrusion was asserted, and effective steps taken to have that principle carried into operation in every case of settlement. It was a still further and more gratifying advance in the same direction, when, five years thereafter, the Assembly took up the language, and resumed the tone of the ancient Assemblies of the Church, and declared the free and unfettered prerogatives which the Lord Jesus Christ, as King and Head of his Church, had conferred upon her.

It is impossible to attach too much importance to this declaration, whether we regard it merely in the light of a testimony in behalf of a great scriptural truth, or as the most healthful indication which could have been afforded, that the Church of Scotland, after a long and dreary period of defalcation, had rid herself of the notion, which lay upon her like an incubus, and paralysed her energies, that she was a mere civil corporation, existing for civil ends.

This idea, fostered under the reign of Moderatism, and forming indeed the very essence of it, had wrought most deadly mischief, not only as regarded the matter of settlement, in which the great thing to be considered was, not the “perfecting of the Saints,” but the following out of the will of the patron; but also as regarded the matter of preaching, in which the great thing to be considered was, not the winning of souls to Christ, but the rearing up of good citizens, on the basis of a cold and secular Morality.

One thing only remains, so far as regards the assertion of principles, to set the Church upon the platform of her ancient standards, and that is, to re-declare the indefeasible right of the members of the Church to elect their own office-bearers. This principle appears necessarily to flow from that of the spiritual independence of the Church, and it is practically one of the most important consequences which result from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), pp 1-2.</span></figcaption>

<blockquote><p>Here may we see what a deadly evil power void of the fear of God is. For when that religion and reverence which ought doth not reign, the more holy the place is which a man doth possess, the more boldly doth he rage.

For which cause we [should] always take good heed that the wicked be not preferred unto the government of the Church. And those which are called to this function must behave themselves reverently and modestly, lest they seem to be armed to do hurt.

But and if it so happen they abuse their honour, the Spirit declareth there, as in a glass, what small account we ought to make of their decrees and commandments. The authority of the pastors hath certain bounds appointed which they may not pass. And if they dare be so bold, we may lawfully refuse to obey them; for if we should, it were in us great wickedness, as it followeth now.</p></blockquote>

<blockquote><p>No one, indeed, who has studied, or even looked at the creeds of Oxford and Rome, can doubt their essential identity. Their likeness marks the nearness of their kindred. Every year is increasing the resemblance, and it will soon be impossible to discover any feature of difference. Hence the necessity of sounding the alarm.

We shall first of all take up the doctrine of apostolical succession in the ministry. It is maintained by the writers of the Tracts, and their sect, that no man can be a minister of Christ, or hold office in his Church, who has not been ordained by a bishop; which bishop must be able to trace his ordination, in unbroken line, from the apostles themselves. There cannot be a Church of Christ at all where this episcopal and apostolical succession does not exist. They say, that they “are as sure that the bishop is Christ’s representative, as if they actually saw him work miracles, as St Peter and St Paul did.” [Tracts, no. 10, p. 4.]

And again: that “Presbyterian ministers hare assumed a power which was never entrusted to them; that they have presumed to exercise the power of ordination, and to perpetuate a succession of ministers, without having received a commission so to do.” [Tracts, no. 7, p. 2.] And again: “They affirm that the fact of their present, bishops being the heirs and representatives of the apostles, by successive transmission, is too notorious to require proof; for every link in the chain is known, from St Peter to our present metropolitan.” [Ibid.]

Such, then, in their own words, is their doctrine of episcopal and apostolical succession. It is a chain of many links, one end of which was made fast eighteen hundred years ago at Jerusalem, and, taking many a circle through diverse countries and ages, is to be seen in the nineteenth century fixed securely at Canterbury. A small “upper room,” filled with the poor, despised, and persecuted disciples of the Cross, sufficed for its original fixing point; now it is nowhere to be found but in palaces glittering with royal splendour, and filled with the rich, the noble, and the wise! Everything depends upon the different links in this chain being ascertained; and hence the eagerness with which its fond admirers strive to trace its progress from age to age.

In doing so, we confess that their researches have often seemed to us to resemble the visionary romance of a wild Eastern tale, in which some unearthly being, in league with the spirits of darkness, is busied in searching sea, and earth, and hell, for some hidden treasure of silver or gold. The whole of the “Tracts for the Times” remind us of this; but in no point more vividly than in their inquiries after the apostolical succession. They dig deep in their search for the various links of this mysterious chain.

It takes many a sweep, but they spare no industry to have it, and no ingenuity to fasten together its manifold links. It is easy to mark its progress in the first ages, as it twined itself round the beloved Jerusalem, bright as the gold of its own temple; or took its way through the land of Israel, glittering like Jordan in the unbroken sunshine of those purer days; or branching off to Corinth, or Ephesus, or Philippi, or Crete; from these, as from so many centres of influence, to perpetuate and send forth the mystic virtues.

But utter this period, the toil, the learning, the ingenuity, the conjectures, the bold assertions, and shameless falsehoods, that are required to discover and connect the links of this wondrous chain, are truly amazing. From city to city, from country to country, from one bishop’s palace to another, above ground and underground, in the midst, of profligacy and piety, they pursue their search.

Sometimes a female Pope may be the link; sometimes there may be a double link, in two infidel profligates claiming with equal right the chair of St Peter; sometimes it is through the dark walls of the Inquisition-dungeons that they find its massive links protruding, besmeared with the blood of saints; it matters not, it is still in their eyes precious and holy—each link a solid wedge of incorruptible gold! What must that ministry, that Church be, whose very existence is made to depend upon its strictly lineal descent from infidels, and profligates, and persecutors!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puseyism. Apostolical Succession in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

It takes many a sweep, but they spare no industry to have it, and no ingenuity to fasten together its manifold links. It is easy to mark its progress in the first ages, as it twined itself round the beloved Jerusalem, bright as the gold of its own temple; or took its way through the land of Israel, glittering like Jordan in the unbroken sunshine of those purer days; or branching off to Corinth, or Ephesus, or Philippi, or Crete; from these, as from so many centres of influence, to perpetuate and send forth the mystic virtues.

But utter this period, the toil, the learning, the ingenuity, the conjectures, the bold assertions, and shameless falsehoods, that are required to discover and connect the links of this wondrous chain, are truly amazing. From city to city, from country to country, from one bishop’s palace to another, above ground and underground, in the midst, of profligacy and piety, they pursue their search.

Sometimes a female Pope may be the link; sometimes there may be a double link, in two infidel profligates claiming with equal right the chair of St Peter; sometimes it is through the dark walls of the Inquisition-dungeons that they find its massive links protruding, besmeared with the blood of saints; it matters not, it is still in their eyes precious and holy—each link a solid wedge of incorruptible gold! What must that ministry, that Church be, whose very existence is made to depend upon its strictly lineal descent from infidels, and profligates, and persecutors!”

— Horatius Bonar, Puseyism. Apostolical Succession in Christian Miscellany">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNo+one%2C+indeed%2C+who+has+studied%2C+or+even+looked+at+the+creeds+of+Oxford+and+Rome%2C+can+doubt+their+essential+identity.+Their+likeness+marks+the+nearness+of+their+kindred.+Every+year+is+increasing+the+resemblance%2C+and+it+will+soon+be+impossible+to+discover+any+feature+of+difference.+Hence+the+necessity+of+sounding+the+alarm.%0A%0AWe+shall+first+of+all+take+up+the+doctrine+of+apostolical+succession+in+the+ministry.+It+is+maintained+by+the+writers+of+the+Tracts%2C+and+their+sect%2C+that+no+man+can+be+a+minister+of+Christ%2C+or+hold+office+in+his+Church%2C+who+has+not+been+ordained+by+a+bishop%3B+which+bishop+must+be+able+to+trace+his+ordination%2C+in+unbroken+line%2C+from+the+apostles+themselves.+There+cannot+be+a+Church+of+Christ+at+all+where+this+episcopal+and+apostolical+succession+does+not+exist.+They+say%2C+that+they+%E2%80%9Care+as+sure+that+the+bishop+is+Christ%E2%80%99s+representative%2C+as+if+they+actually+saw+him+work+miracles%2C+as+St+Peter+and+St+Paul+did.%E2%80%9D+%5BTracts%2C+no.+10%2C+p.+4.%5D%0A%0AAnd+again%3A+that+%E2%80%9CPresbyterian+ministers+hare+assumed+a+power+which+was+never+entrusted+to+them%3B+that+they+have+presumed+to+exercise+the+power+of+ordination%2C+and+to+perpetuate+a+succession+of+ministers%2C+without+having+received+a+commission+so+to+do.%E2%80%9D+%5BTracts%2C+no.+7%2C+p.+2.%5D+And+again%3A+%E2%80%9CThey+affirm+that+the+fact+of+their+present%2C+bishops+being+the+heirs+and+representatives+of+the+apostles%2C+by+successive+transmission%2C+is+too+notorious+to+require+proof%3B+for+every+link+in+the+chain+is+known%2C+from+St+Peter+to+our+present+metropolitan.%E2%80%9D+%5BIbid.%5D%0A%0ASuch%2C+then%2C+in+their+own+words%2C+is+their+doctrine+of+episcopal+and+apostolical+succession.+It+is+a+chain+of+many+links%2C+one+end+of+which+was+made+fast+eighteen+hundred+years+ago+at+Jerusalem%2C+and%2C+taking+many+a+circle+through+diverse+countries+and+ages%2C+is+to+be+seen+in+the+nineteenth+century+fixed+securely+at+Canterbury.+A+small+%E2%80%9Cupper+room%2C%E2%80%9D+filled+with+the+poor%2C+despised%2C+and+persecuted+disciples+of+the+Cross%2C+sufficed+for+its+original+fixing+point%3B+now+it+is+nowhere+to+be+found+but+in+palaces+glittering+with+royal+splendour%2C+and+filled+with+the+rich%2C+the+noble%2C+and+the+wise%21+Everything+depends+upon+the+different+links+in+this+chain+being+ascertained%3B+and+hence+the+eagerness+with+which+its+fond+admirers+strive+to+trace+its+progress+from+age+to+age.%0A%0AIn+doing+so%2C+we+confess+that+their+researches+have+often+seemed+to+us+to+resemble+the+visionary+romance+of+a+wild+Eastern+tale%2C+in+which+some+unearthly+being%2C+in+league+with+the+spirits+of+darkness%2C+is+busied+in+searching+sea%2C+and+earth%2C+and+hell%2C+for+some+hidden+treasure+of+silver+or+gold.+The+whole+of+the+%E2%80%9CTracts+for+the+Times%E2%80%9D+remind+us+of+this%3B+but+in+no+point+more+vividly+than+in+their+inquiries+after+the+apostolical+succession.+They+dig+deep+in+their+search+for+the+various+links+of+this+mysterious+chain.%0A%0AIt+takes+many+a+sweep%2C+but+they+spare+no+industry+to+have+it%2C+and+no+ingenuity+to+fasten+together+its+manifold+links.+It+is+easy+to+mark+its+progress+in+the+first+ages%2C+as+it+twined+itself+round+the+beloved+Jerusalem%2C+bright+as+the+gold+of+its+own+temple%3B+or+took+its+way+through+the+land+of+Israel%2C+glittering+like+Jordan+in+the+unbroken+sunshine+of+those+purer+days%3B+or+branching+off+to+Corinth%2C+or+Ephesus%2C+or+Philippi%2C+or+Crete%3B+from+these%2C+as+from+so+many+centres+of+influence%2C+to+perpetuate+and+send+forth+the+mystic+virtues.%0A%0ABut+utter+this+period%2C+the+toil%2C+the+learning%2C+the+ingenuity%2C+the+conjectures%2C+the+bold+assertions%2C+and+shameless+falsehoods%2C+that+are+required+to+discover+and+connect+the+links+of+this+wondrous+chain%2C+are+truly+amazing.+From+city+to+city%2C+from+count <blockquote><p>It might be very expedient, upon the principles of Christian prudence, that, where it can be accomplished, every pastor of a large congregation should still have assistant ministers; and some presidents among the pastors of different congregations, when they are meeting about any public business, is what common sense dictates in such circumstances: and if instead of a chair-man chosen for that particular time and occasion, some person, of experienced, approved fidelity and ability, should be appointed to exercise some stated over-fight over a few of the neighbouring congregations, it might perhaps be attended with such consequences, as would render such a sort of discipline not only tolerable, but eligible.

Something of this kind was projected in archbishop Usher’s plan for the reduction of episcopacy, by which he would have moderated it in such a manner, as to have brought it very near the presbyterian government of the Scotch church; the weekly parochial vestry answering to their church-session; the monthly synod, to be held by the Chorepiscopi, answering to their presbyteries; the diocesan synod to their provincial, and the national to their general assembly. The meeting of the dean and chapter, practised in the church of England, is but a faint shadow of the second, the ecclesiastical court of the third, and the convocation of the fourth.</p></blockquote>

<blockquote><p>Is CHRIST the Head of the Church? then the Pope is not the Head of the Church: An Headship is applied to CHRIST; for if the Pope be the Head of the Church, then the Church is the Body of the Pope, which no Papist durst ever say to this day: Now these two stand relative. Princes are said to be the Head of the Church, as Saul to be Head of the Tribes, that is only in regard of Eminency of Place, that they be to see all the Members of the Church do their Duty.</p></blockquote>

<blockquote><p>The question, whether any particular form of Church Government is so laid down in Scripture, as that the claim of divine right may be advanced on its behalf, and that, of consequence, the Church is bound, in all to adopt and act upon it;- will not now be formally discussed. It has been made the subject of too much extended and ardent controversy, to be brought within the compass of a few sentences, or even a few pages. It may not be improper, however, briefly to say, that it would, indeed, have been singular, if a community, called out of the world, and organized under the peculiar authority of the all-wise Redeemer, had been left entirely without any direction as to its government:

That the Scriptures, undoubtedly, exhibit to us a form of ecclesiastical organization and rule, which was, in fact, instituted by the Apostles, under the direction of infinite Wisdom: That this form was evidently taken, with very little alteration, from the preceding Economy, thus giving additional presumption in its favour: That we find the same plan closely copied by the churches for a considerable time after the apostolic age:- That it continued to be in substance the chosen and universal form of government in the Church, until corruption, both in doctrine and practice, had, through the ambition and degeneracy of ecclesiastics, gained a melancholy prevalence:- And, that the same form was also substantially maintained by the most faithful witnesses for the truth, during the dark ages, until the great body of the Reformers took it from their hands, and established it in their respective ecclesiastical connexions.

These premises would appear abundantly to warrant the conclusion, that the form of Government which answers this description, is the wisest and best; that it is adapted to all ages and states of society; and that it is agreeable to the will of Christ that it be universally received in his Church. All this the writer of the following Essay fully believes may be established in favor of Presbyterianism. There seems no reason, however, to believe, with some zealous votaries of the hierarchy, that any particular form of government is in so rigorous a sense of divine right, as to be essential to the existence of the Church; so that where this form is wanting, there can be no Church. To adopt this opinion, is to take a very narrow and unscriptural view of the covenant of grace.

After yielding to the visible Church and its ordinances, all the importance which the word of God warrants, still it cannot be doubted, that on the one hand, men in regular external membership with the purest Church on earth, may be hypocrites, and perish; and on the other, that all who cordially repent of sin, and receive the Saviour in spirit and in truth, will assuredly obtain eternal life, although they never enjoyed the privilege of a connexion with any portion of the visible Church on earth. The tenor of the Gospel covenant is, He that believeth on the Son of God hath eternal life, and shall not come into condemnation, but is passed from death unto life; but he that believeth not the Son, shall not see life, but the wrath of God abideth on him.

Still it is plain, from the word of God, as well as from uniform experience, that the government of the Church is a matter of great importance; that the form as well as the administration of that government is more vitally connected with the peace, purity and edification of the Church, than many Christians appear to believe; and, of consequence, that it is no small part of fidelity to our Master in heaven to “hold fast” the form of ecclesiastical order, as well as the “form of sound words” which He has delivered to the saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay, on the Warrant, Nature and Duties of the Office of the Ruling Elder in the Presbyterian Church</cite>, (New York: Jonathan Leavitt, 1831), pp 18-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

E2%80%9Chold+fast%E2%80%9D+the+form+of+ecclesiastical+order%2C+as+well+as+the+%E2%80%9Cform+of+sound+words%E2%80%9D+which+He+has+delivered+to+the+saints.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+An+Essay%2C+on+the+Warrant%2C+Nature+and+Duties+of+the+Office+of+the+Ruling+Elder+in+the+Presbyterian+Church%2C+%28New+York%3A+Jonathan+Leavitt%2C+1831%29%2C+pp+18-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbccc38c8cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bccc38c8cb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/26/samuel-miller-avoiding-extremes-on-the-divine-right-of-church-government/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1b8f76400d" data-kw="">
<blockquote><p>And we begin with tile Ruling Elders’ place, for that carries a kind of simplicity with it: there be more ingredients required to make up the Office of Pastor and Doctor, and therefore we shall take leave to trade in the first. …

That there is such an Office and Officer appointed by Christ, as the Scriptures are plain to him, whose spirit and apprehension is not possessed and forestalled with prejudice: So this cause hath been maintained by mand of Christ’s Worthies of former, and now of latter times; and now at last, by those two famous and eminent Champions, Mr. Rutterfort [Samuel Rutherford], and Mr. Gilespy [George Gillespie].

So that we have no controversy here but with Hierarchical Persons, the force and power of whose Arguments, lies especially in a Pursuvant and a Prison, armed with Authority of an High-Commission. And therefore we shall content our selves to settle the Scriptures shortly upon their basis and bottom, according to the sense of the Spirit of God, in the several places, and dispute briefly, there-from, and so finish this Head of Discipline.

The first Argument we have from Rom. 12.7. which gives in witness to this truth, where all these officers are numbered and named expressly; if the meaning of the words be once manifested, which will be made clear in the particulars following. …

The second Argument is taken from 1 Cor. 12.28. God hath set some in his Church; as first, Apostles; then Prophets; thirdly, Teachers; after that Powers, then gifts of healing, helps, Governments. The scope of the place, and the Apostle his intendment is, to lay open the several Offices and Officers that the Lord hath set in his Church, and so many chief members, out of which the Church is constituted as an entire body. …

From which premises, the dispute issues thus: As Apostles, Prophets, and Teachers are distinct, so are Helps and Governments distinct; for the Spirit puts them in the same rank, as having a parity of reason, which appertains to them all. But they were distinct Offices, and found in persons as distinct Officers, as vers. 30. Are all Apostles? Are all Teachers? Therefore, the same is true of Governors. …

A third argument is taken from the famous place, 1 Tim. 5.17. which is full to our purpose in hand, and intended by the Holy Spirit of the Lord, to make evident the station and office of Ruling Elders, unto the end of the world; and it is admirable to observe, how the factors and followers of the Pope and Prelates, who labour to prop up their place and pre-eminency, have used all the wiliness of their wits, and unwearable wrestlings of their carnal reason, to darken the evidence of the truth, and to defeat the power of the proof in this place, as fearing, it should seem, lest by this means their way to promote and maintain the pride of Prelacy, would be utterly prejudiced and overthrown; whereas, do but suffer the Deacon to lay aside the care of the poor, make him but half a Priest, give him the allowance that he may baptize, and not give the Sacrament of the Supper; raise the Ruling-Elder one stair higher, that he may be a Teaching-Presbyter:

By this time, the Bishop is beyond the bound of an ordinary Elder, and with a little help, he will be handed up into a Diocesan Palace, and one lift more will make him a Primate; and if the Kings of the earth favour him, he will make himself a Pope presently; for they differ but in degrees, not in kind. So that you must not wonder to see the contention grow so hot touching a Ruling Elder, because if he be confined with his compass, the wings of Pope and Prelate will be exceedingly clipped, and their power impeached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the sum of church-discipline. Wherein the way of the churches of New-England is warranted out of the word, and all exceptions of weight, which are made against it, answered</cite>, (London: John Bellamy, 1648), Part 2.1, pp 8, 10, 11-12.</span></figcaption>

<blockquote><p>All obedience to men is limited thus, that it be in the Lord, and with regard to His supremacy; and therefore, no authority can oblige to the obedience of any command that crosses His. Authority is primitively and originally in God, and He gives not His glory to another. He gives not away any of His peculiar authority to man, but substitutes Him; and our first tie is to God, as His creatures, and this is universal.

The greatest kings are His vassals, and owe Him homage, and no authority derived from Him, can free us from that which we owe to Himself There is a straight line of subordination, and if superiors leave this, we are to adhere to it, looking directly to God, keeping our station.</p></blockquote>

<blockquote><p>Old age is honoured in every society, which is why the synagogue, and later on the church, had elders, without whose advice nothing was done in the church. I do not know why the custom has faded out. Perhaps it is because of the laziness of the teachers, or more likely because of their pride, since they want to be seen as the only ones who do anything.</p></blockquote>

</figure><figure class="quote" id="q-c8a69f0ca6" data-kw="">
<blockquote><p>The Apostle S Paul doth notably amplify the honour due to the true and faithful Ministers. The Elders that rule well (saith he) let them be had in double honour, specially they which labour in the word and doctrine, as if he should say, let those Elders which are appointed to watch and look to the manners and behaviour of the children of God, if they execute this charge faithfully, be had in double honour: but above all, let the faithful Ministers, such as labour in the word, be honoured: for why? the other are overseers of your outward behaviour, but these have an other manner of office, they watch over your souls, which tendeth to the salvation both of body and soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourteenth Sermon</cite>, in The works of the reverend and faithful servant of Jesus Christ M. Richard Greenham, minister and preacher of the Word of God collected into one volume: revised, corrected, and published, for the further building of all such as love the truth, and desire to know the power of godliness, ed. Henry Holland (5th edn, London: William Welby, 1612), p. 352.</span></figcaption>

blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0f22e73c1b" data-kw="">
<blockquote><p>Christ was said to be God’s servant, partly as he subjected himself to the condition of man, and because he lived among men in a needy, servile, and abject state of life, not like a prince, but a servant, which is the lowest form of rational creatures. And it is expressed by ‘taking the form of a servant’ upon him, Phil. 2:7. Angels are called sons, and man a servant; ‘The sons of God shouted for joy,’ Job 38:7. In the family of heaven they were to God as servants.

And partly as he was a choice instrument for the executing of God’s decrees. Those that are taken into any degree of subserviency to God’s counsels have this badge of honour put upon them, to be God’s servants, as Nebuchadnezzar is called God’s servant, Jer. 27:6. Now, because Christ submitted himself to the office of the mediatorship, and so to a subserviency to God’s decrees, he is called a servant: Isa. 13:1, ‘Behold my servant, whom I uphold;’ Isa. 49:3, ‘Thou art my servant.’

And this being an instrument of God’s decrees, is called service, because whosoever is employed in it is to sequester himself for the uses of God, and to divest himself of all self-respect, and like a servant to be at the command of another, and wholly to give up himself to the profit and benefit of his Master. So Christ, not aiming at himself, accomplished the work of God to God’s glory and the salvation of man. And—

Partly as he subjected himself to the law of God and the covenant of works, which was a covenant of servants. A servant expects his hire as the reward of his work, and therefore the state of the gospel is called a state of sonship: Gal. 4:5, ‘To redeem them that were under the law, that they might receive the adoption of sons.’ So in the 1st verse of that chapter, ‘The heir, as long as he is a child, differeth nothing from a servant;’ that is, those that are under the covenant of grace did very little differ from those that are under the covenant of works, in the time of the church’s infancy and ceremonial dispensation, because it was a ministry of condemnation.

Everywhere the covenant of works is made as the covenant of an hireling, and implieth bondage and service. And therefore Christ, because he submitted himself to such a covenant, and seeing he was to be judged of God according to all extremity and rigour, things were carried between God and Christ in a way of justice, and our grace and glory were due to him. So that in all these respects Christ was God’s servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 442-43.</span></figcaption>

<blockquote><p>[18. You shall bind.] The Jesuits would fain the this key of excommunication unto the Bishop’s girdle alone: which is against the mind of our Saviour Christ, and circumstance of the place: but if they will say so, and speak so strangely, they must warrant it with some other places of scriptures, where the Church is taken for one, which is as much to say, one man is many, one member is as body, one alone is a company. And beside this strangeness of speech, it destroyeth the sovereignty of the medicine which our Saviour Christ prepared for such a festered soar, as would neither be healed by private admonition, neither with admonition before one or two witnesses.

For as the fault growth, so our Saviour Christ would have the number of those before whom he should be checked and rebuked, likewise grow. Therefore from a private admonition, he riseth unto the admonition before two or three: and from them to the Church; which if we should say, it is but one: then unto a dangerouser wound, should be laid an easier plaster. And therefore our Saviour doth not rise from two to one (for that were not to rise but to fall, nor to proceed, but go backward) but to many. But Paul is the best interpreter, who in a case of excommunication, declareth that the same is to be done in the presence, and with consent of the assembly, whereof the party which is to be excommunicated, is a member.

To conclude: Theophilact upon this place interpreteth, Tell the Church, that is Many. And because that assembly in the time of the Law, were of two sorts: for some had the handling of the word, othersome watching against the offences of the Church, did by common counsel with the ministers of the word, take order against the same. Those governing Elders are divers times in the story of the Gospel made mention of, under the title of the Rulers of the Synagogue. And this manner of government, because it was to be translated into the Church of Christ under the Gospel, our Saviour by the order (at that present) used amongst the Jews, declareth what after should be done in his Church.

Agreeably hereunto the Apostle both declared the Lord’s ordinance in this behalf, and put the same in practice in ordaining to every several Church, beside the Ministry of the word, certain of the chiefest men which should assist the work of the Lord’s building. This was also faithfully practised of the Churches, after the Apostles’ times, as long as they remained in any good and allowable soundness of the doctrine. And being fallen from the Churches, especially from certain of them, the want thereof is sharply and bitterly cast in the teeth of the Church teachers, by whose ambition that came to pass.

I conclude therefore, that to tell the Church, is not to tell the Bishop or Minister of the word only; but a company which hath oversight of the Church; by whom, or by whose mouth, which is the minister of the word, the rest of the body of the Church is to be advertised: to the end that the sword of excommunication cut not without their privity and consent. Whereupon it is evident, that the places of these Fathers, which give power to the Bishops to bind, and to loose: do not restrain it unto them, shutting out the rest of the Church, which might be shewed by many testimonies out of them, if the same were needful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of the Rhemists Translation, Glosses and Annotations on the New Testament</cite>, (Leiden, 1618), p. 90.</span></figcaption>

<blockquote><p>Another point in the [Cambridge] platform [of 1649], not universally received, is, the distinct office of ruling elders, to join with the pastors in those acts of church-rule, which are distinct from the ministry of the word and sacraments, or to watch over the conversation of the church-members with authority.

There are some who cannot see any such officer as what we call a ruling elder, directed and appointed in the word of God; and the inconveniencies, whereunto many churches have been plunged by elders, not of such a number, or not of such a wisdom, as were desirable, have much increased a prejudice against the office itself; be sure, partly through a prejudice against the office, and partly, indeed chiefly, through a penury of men well qualified for the discharge of it, as it has been heretofore understood and applied, our churches are now generally destitute of such helps in government.

On the other side; there are others, who, if they asked, What order for lay-elders in the word of God? Answer, that properly, the only lay-elders known to be in any church, are the chancellours in the church of England; persons entrusted with the rules of the church, and yet not ordained unto any office in it.

But, that unless a church have divers elders, the church-government must needs become either prelatic or popular; and that a church’s needing but one elder, is an opinion contrary not only to the sense of the faithful in all ages, but also to the law of the scriptures, where there can be nothing plainer, than, elders, who rule well, and are worthy of double honour, though they do not labour in word and doctrine; whereas, if there were any teaching elders, who do not labour in word and doctrine, they would be so far from worthy of double honour, that they would not be worthy of any honour at all.</p></blockquote>

</figure><figure class="quote" id="q-ce94e89629" data-kw="">
<blockquote><p>The other two passages (1 Cor. viii. 11, and Rom. xiv. 15) being addressed, as warnings, to those who, on the strength of their own clearer light and firmer conscience, might despise or offend the weaker members of the Church, evidently point out the light in which the former are to regard the latter; as brethren, namely, interested in the same Saviour with themselves, yet not so secure as to be beyond the reach of serious and fatal injury, at the hands of their fellow-Christians.

The lesson to the strong is twofold: Look not on the weak with contempt, as if their scruples were undeserving of attention; they are your brethren still, relying, as you do, on Christ as their only surety;—Neither plead, in excuse for any use of your liberty that wounds or ensnares their consciences, that this is no concern of yours, since, if they are Christ’s, he will keep them safe from harm; so far as your conduct toward them is concerned, you are to treat them, even as you are to treat yourselves, with all that delicacy and tenderness which the most precarious and uncertain tenure of grace might prompt.

To you, the humble believer, on whose unnecessary fastidiousness you are tempted to look down, and with whose minute cases of casuistry you are provoked to play, is still, with all his weakness, a brother, to be treated by you as a brother, for whom, as well as for you, Christ died: and whatever may be his security in the Saviour whom he trusts, that can be no reason for your trifling and tampering with his soul, if you would not have his blood to answer for; but, on the contrary, if ever you are inclined to follow your own more liberal opinions, without respect to their influence on him, at that moment, whatever God may think of him, he is to you simply a brother, who, through your knowledge, and by your eating, is in extreme danger of perishing and being destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), xxiv-v.</span></figcaption>

</figure><figure class="quote" id="q-8f28a02866" data-kw="">
<blockquote><p>It thus appears abundantly manifest, from multiplied Scripture evidence, that the chief end for which the Christian Church is constituted — the leading design for which she is made the repository of heavenly blessings — the great command under which she is laid — the supreme function which she is called on to discharge — is, in the name and stead of her glorified Head and Redeemer, unceasingly to act the part of an evangelist to all the world. The inspired prayer which she is taught to offer for spiritual gifts and graces, binds her, as the covenanted condition on which they are bestowed at all, to dispense them to all nations.

The divine charter which conveys to her the warrant to teach and preach the Gospel at all, binds her to teach and preach it to all nations. The divine charter which embodies a commission to administer Gospel ordinances at all, binds her to administer these to all nations. The divine charter which communicates power and authority to exercise rule or discipline at all, binds her to exercise these not alone or exclusively, to secure her own internal purity and peace, union and stability; but chiefly and supremely, in order that she may thereby be enabled the more speedily, effectually, and extensively, to execute her grand evangelistic commission in preaching the Gospel to all nations.</p></blockquote>

<blockquote><p>I know that in the primitive church they had in every church certain Seniors, to whom the government of the congregation was committed, but that was before there was any Christian Prince or magistrate that openly professed the Gospel, and before there was any Church by public authority established, or under Civil government: I told you before, that the diversity of time and state of the church requireth diversity of government in the same. …

Both the names &amp; offices of Seniors were extinguished before Ambrose time, as he himself doth testify, writing upon the fifth of the first to Timothy.

Indeed as Ambrose saith, writing upon the fifth of the first to Timothy, The Synagogue, and after, the Church had Seniors, without whose counsel nothing was done in the Church, but that was before his time, and before there was any Christian Magistrates, or any Church established.</p></blockquote>

<blockquote><p>Thirdly, According to some there is this Third Office in the Church of Christ, namely, that of Lay-Elders, and their Foundation for it is in Rom. 12.8. He that ruleth with Diligence; where he that ruleth is distinguished from him that teacheth and exhorteth, and therefore they say he is a different Officer, and they observe that he comes after him that teacheth and exhorteth, which shews, that he is an Officer inferior to the Teacher and Exhorter. And therefore there is Reason to infer, that ὁ προϊστάμενος, he that ruleth, is the Lay-Presbyter, whose peculiar business it is to be an Overseer and Censor of the Manners of those ‘who belong to the Christian Congregation.

So it is thought to be clear from that other Text, I Cor. 12. 28. which mentions Helps and Governments, that by them are meant Ruling Elders in the Church, who are not Pastors or Teachers (for they are distinguished from them) but are helpful and serviceable in the Governing of the Church, by taking care of the outward Behaviour of its Members. And as before he that ruleth was placed after the Teacher and Exhorter, so here they observe, that Helps and Governments are placed after Teachers, to let us know that they are not the Preaching for Teaching Governors, nor Bishops of the Church.

That is looked upon another plain Text, I Tim. 5. 17. Let the Elders that rule well be counted worthy of double Honour, especially those that labour in the Word and Doctrine. Where are two Sorts of Elders, those that Rule, and those that both Rule and do other Offices in the Church. The Lay-Seniors that are appointed to keep Things in good Order, and to assist in the Governing and Disciplinary Part, are said to Rule well, and therefore deserve a high Degree of Honour and Praise; but there is another Rank of Elders, who labour in the Word and Doctrine, whose Office it is to instruct and guide Men as to all Spiritual Affairs, and these are especially worthy of double Honour. The Emphasis lies in the Word μάλιστα, especially, which, where-ever it is used in the New Testament, signifies another Thing, or Person, different from what was before-mentioned in the Place. So here it makes a Distinction between Elders, between the Ruling and the Teaching Elder.

But here some Object (and with great Weight and Reason) that the καλῶς προεστῶτες are the same with προϊσταμένους, I Thess. 5. 12. who are acknowledged to be Bishops, or else Preaching Elders. But the Answer that is given to this Objection is this, That to Rule, or to be set over others is applicable to both that sort of Elders I’m now speaking of, and to the others. The Lay-Elder is said to Rule, not because the others do not Rule, but because he doth nothing else but Rule, he doth not Preach or Perform any Office that belongs to the Ministry.

Besides, if by ruling Elders in this Place he mean Bishops or Preaching Ministers, then the Apostle here would have those who take no Pains and Care in the Word and Doctrine, to have Honour, yea, and he lets us know that they are worthy of it; which is a Meaning unworthy of the Apostle. For the Pastoral Office requires Pains and Labour, and therefore it is certain the Apostle would not speak thus concerning those that labour not: Whence some conclude, that by the Ruling Elders here we are not to understand the Teachers of the Church, but that the plain Interpretation is this, To labour in the Word and Doctrine is here the Periphrasis of a Preaching Elder or Minister, and so it is opposed to that other Office, which consists only in Ruling. …

The short is, that some are of Opinion that labouring in the Word and Doctrine comprehends here the whole Ministerial Employment, as it is usual to express the whole by a Principal Part, and it is contradistinguished from, and preferred to the ruling well, that is, the bare Office of those who were Lay-Men, but appointed by the Church to look into the Manners of the People, and so to govern and preside over the congregation. Whence it is inferred by some, that Lay-Elders are an Evangelical Appointment in the Church.

And they tell us moreover, that this Office of a Ruling Elder is according to the Practice of the Church of God among the Jews, his own People. It is certain that there was this kind of Elders under that Oeconomy. The Sanhedrim was compounded of Priests and Lay-Elders, as is evident from Num. 11.16. 24, 25-33. 16. Deut. 17. 8, 9. as well as from other Jewish Writers since, who acquaint us that there were two Sorts of Elders among the Jews, the Ruling ones, who governed in their Assemblies and Synagogues, and the Teaching ones, who read and expounded the Scriptures. Accordingly Dr. [John] Lightfoot in his Harmony of the New Testament inclines to interpret 1 Tim. 5. 17. of the Elders in the Christian Congregations, who answer to the Lay-Elders in the Jewish Synagogue. For this Learned Writer, who was well versed in the Jewish Customs and Practices, tells us, that in every Synagogue among the Jews there were Elders that ruled chiefly in the Affairs of the Synagogue, and other Elders that labour d in the Word and Doctrine.

And so it was in the Christian Church, there was a Mixture of Clergy and Laity in their Consults about Church-Matters, as we lee frequently in the Ails of the Apostles. The concurrence of the People was thought necessary in the Apostles Times in the public Censures of the Church, in Election of Pastors, and in all Ecclesiastical Concerns. But more particularly the Practice of those Times with regard to Lay-Elders, is said to be manifest from what is recorded in the Apostolical Epistles, which hath been already produced to confirm this Office in the Church. Perhaps that Text (which is not thought of in Acts 20. 17, 20, doth the fame, for ’tis said that St. Paul called the Elders of the Church of Ephesus; and ’tis said farther, that St. Paul taught them publicly, and from House to House, whence it maybe gathered, that among those Elders some of them were Lay-Men, for some of them were not Teachers, but were taught, and these were those that we call Lay-Elders.

And afterwards the Christian Church retained this Usage, for which they quote St. Augustine’s 137th Epistle, where he motions the Clergy, and the Elders and the People. So in his 3d. Book against Cresconius he mentions Deacons and Seniors, that is, Lay-Elders, for he distinguishes them from other Presbyters. One of his Epistles to his Church of Hippo, is thus superscribed. To the Clergy and the Elders. See chap. 56. in the fore-named Book against Cresconius, where he mentions Peregrinus the Presbyter, and the Seniors. … Thus it appears, that this was an Ancient Office in the Church, and not invented by Calvin, as some have thought and writ.

And then, as to the Reason of the Thing, some think there should be no Ground of Quarrelling with this Office in the Church, seeing it is so Useful. For it was Instituted for the Ease of the Preaching Elders, that they might not be over-burdened with Business, and that they might more conveniently apply themselves to that Employment which is purely Ecclesiastical and Spiritual. And it was wisely appointed to take off the Envy and Odium from the Ministers, which would be their Lot if they intermeddled too much with Affairs. And it is a Way to cement the Clergy and Laity, and to bring them to a Friendly and Christian Correspondence, and to unite them firmly in the same great Interest, that of Religion.

It might here be remembered, that they had a very great Opinion of Laymen in the former and best Times of the Christian Church, for they were admitted to Synods and Councils, and they were advanced to the highest Ecclesiastical Dignities. Thus Spyridion, tho’ a plain Countryman and a Shepherd, was made a Bishop. Ambrose, a Secular Magistrate, and Governour of Milan, was chosen Bishop of that Place by the People. Nectarius a Layman was put into the fame Office at Constantinople. Sidonius, a French Soldier was made Bishop of Auvergne in France. And if Laymen were admitted to Bishopricks, it can’t be thought indecorous that they are placed in a much lower Station in the Church, than that of Ruling Elders.

These seem to have been allowed of by our Reformers, as is evident from the Injunctions which were given by King Edward the VIth. to those Persons who were to take care of Reforming and Settling Ecclesiastical Affairs in his Reign. See the Chapter de Divinis Officits, where the Minister and the Elders are particularly mentioned, and are commanded to look after the Discipline of the Church. See the Reverend Bishop [Gilbert] Burnet’s History of the Reformation.

Nor is this esteemed by some to be against the Genius of the Evangelical Administration, which suffers not Secular Men to discharge Spiritual Offices; for the Lay-Elders Office is not properly and strictly such, they take care only of the External Matters of the Church, and are only Assistants in the outward administering of Discipline, and look into the Manners and Carriage of the Christians belonging to such or such an Assembly. But they excuse no part of the Ecclesiastical Ministry, which properly appertains to the Ministers of the Gospel.</p></blockquote>

ther+Offices+in+the+Church.+The+Lay-Seniors+that+are+appointed+to+keep+Things+in+good+Order%2C+and+to+assist+in+the+Governing+and+Disciplinary+Part%2C+are+said+to+Rule+well%2C+and+therefore+deserve+a+high+Degree+of+Honour+and+Praise%3B+but+there+is+another+Rank+of+Elders%2C+who+labour+in+the+Word+and+Doctrine%2C+whose+Office+it+is+to+instruct+and+guide+Men+as+to+all+Spiritual+Affairs%2C+and+these+are+especially+worthy+of+double+Honour.+The+Emphasis+lies+in+the+Word+%CE%BC%CE%AC%CE%BB%CE%B9%CF%83%CF%84%CE%B1%2C+especially%2C+which%2C+where-ever+it+is+used+in+the+New+Testament%2C+signifies+another+Thing%2C+or+Person%2C+different+from+what+was+before-mentioned+in+the+Place.+So+here+it+makes+a+Distinction+between+Elders%2C+between+the+Ruling+and+the+Teaching+Elder.%0A%0ABut+here+some+Object+%28and+with+great+Weight+and+Reason%29+that+the+%CE%BA%CE%B1%CE%BB%E1%BF%B6%CF%82+%CF%80%CF%81%CE%BF%CE%B5%CF%83%CF%84%E1%BF%B6%CF%84%CE%B5%CF%82+are+the+same+with+%CF%80%CF%81%CE%BF%CF%8A%CF%83%CF%84%CE%B1%CE%BC%CE%AD%CE%BD%CE%BF%CF%85%CF%82%2C+I+Thess.+5.+12.+who+are+acknowledged+to+be+Bishops%2C+or+else+Preaching+Elders.+But+the+Answer+that+is+given+to+this+Objection+is+this%2C+That+to+Rule%2C+or+to+be+set+over+others+is+applicable+to+both+that+sort+of+Elders+I%E2%80%99m+now+speaking+of%2C+and+to+the+others.+The+Lay-Elder+is+said+to+Rule%2C+not+because+the+others+do+not+Rule%2C+but+because+he+doth+nothing+else+but+Rule%2C+he+doth+not+Preach+or+Perform+any+Office+that+belongs+to+the+Ministry.%0A%0ABesides%2C+if+by+ruling+Elders+in+this+Place+he+mean+Bishops+or+Preaching+Ministers%2C+then+the+Apostle+here+would+have+those+who+take+no+Pains+and+Care+in+the+Word+and+Doctrine%2C+to+have+Honour%2C+yea%2C+and+he+lets+us+know+that+they+are+worthy+of+it%3B+which+is+a+Meaning+unworthy+of+the+Apostle.+For+the+Pastoral+Office+requires+Pains+and+Labour%2C+and+therefore+it+is+certain+the+Apostle+would+not+speak+thus+concerning+those+that+labour+not%3A+Whence+some+conclude%2C+that+by+the+Ruling+Elders+here+we+are+not+to+understand+the+Teachers+of+the+Church%2C+but+that+the+plain+Interpretation+is+this%2C+To+labour+in+the+Word+and+Doctrine+is+here+the+Periphrasis+of+a+Preaching+Elder+or+Minister%2C+and+so+it+is+opposed+to+that+other+Office%2C+which+consists+only+in+Ruling.+%E2%80%A6%0A%0AThe+short+is%2C+that+some+are+of+Opinion+that+labouring+in+the+Word+and+Doctrine+comprehends+here+the+whole+Ministerial+Employment%2C+as+it+is+usual+to+express+the+whole+by+a+Principal+Part%2C+and+it+is+contradistinguished+from%2C+and+preferred+to+the+ruling+well%2C+that+is%2C+the+bare+Office+of+those+who+were+Lay-Men%2C+but+appointed+by+the+Church+to+look+into+the+Manners+of+the+People%2C+and+so+to+govern+and+preside+over+the+congregation.+Whence+it+is+inferred+by+some%2C+that+Lay-Elders+are+an+Evangelical+Appointment+in+the+Church.%0A%0AAnd+they+tell+us+moreover%2C+that+this+Office+of+a+Ruling+Elder+is+according+to+the+Practice+of+the+Church+of+God+among+the+Jews%2C+his+own+People.+It+is+certain+that+there+was+this+kind+of+Elders+under+that+Oeconomy.+The+Sanhedrim+was+compounded+of+Priests+and+Lay-Elders%2C+as+is+evident+from+Num.+11.16.+24%2C+25-33.+16.+Deut.+17.+8%2C+9.+as+well+as+from+other+Jewish+Writers+since%2C+who+acquaint+us+that+there+were+two+Sorts+of+Elders+among+the+Jews%2C+the+Ruling+ones%2C+who+governed+in+their+Assemblies+and+Synagogues%2C+and+the+Teaching+ones%2C+who+read+and+expounded+the+Scriptures.+Accordingly+Dr.+%5BJohn%5D+Lightfoot+in+his+Harmony+of+the+New+Testament+inclines+to+interpret+1+Tim.+5.+17.+of+the+Elders+in+the+Christian+Congregations%2C+who+answer+to+the+Lay-Elders+in+the+Jewish+Synagogue.+For+this+Learned+Writer%2C+who+was+well+versed+in+the+Jewish+Customs+and+Practices%2C+tells+us%2C+that+in+every+Synagogue+among+the+Jews+there+were+Elders+that+ruled+chiefly+in+the+Affairs+of+the+Synagogue%2C+and+other+Elders+that+labour+d+in+the+Word+and+Doctrine.%0A%0AAnd+so+it+was+in+the+Christian+Church%2C+there+was+a+Mixture+of+Clergy+and+Laity+in+their+Consults+about+Church-Matters%2C+as+we+lee+frequently+in+the+Ails+of+the+Apostles.+The+concurrence+of+the+People+was+thought+necessary+in+the+Apostles+Times+in+the+public+Censures+of+the+Church%2C+in+Election+of+Pastors%2C+and+in+all+Ecclesiastical+Concerns.+But+more+particularly+the+Practice+of+those+Times+with+regard+to+Lay-Elders%2C+is+said+to+be+manifest+from+what+is+recorded+in+the+Apostolical+Epistles%2C+which+hath+been+already+produced+to+confirm+this+Office+in+the+Church.+Perhaps+that+Text+%28which+is+not+thought+of+in+Acts+20.+17%2C+20%2C+doth+the+fame%2C+for+%E2%80%99tis+said+that+St.+Paul+called+the+Elders+of+the+Church+of+Ephesus%3B+and+%E2%80%99tis+said+farther%2C+that+St.+Paul+taught+them+publicly%2C+and+from+House+to+House%2C+whence+it+maybe+gathered%2C+that+among+those+Elders+some+of+them+were+Lay-Men%2C+for+some+of+them+were+not+Teachers%2C+but+were+taught%2C+and+these+were+those+that+we+call+Lay-Elders.%0A%0AAnd+afterwards+the+Christian+Church+retained+this+Usage%2C+for+which+they+quote+St.+Augustine%E2%80%99s+137th+Epistle%2C+where+he+motions+the+Clergy%2C+and+the+Elders+and+the+People.+So+in+his+3d.+Book+against+Cresconius+he+mentions+Deacons+and+Seniors%2C+that+is%2C+Lay-Elders%2C+for+he+distinguishes+them+from+other+Presbyters.+One+of+his+Epistles+to+his+Church+of+Hippo%2C+is+thus+superscribed.+To+the+Clergy+and+the+Elders.+See+chap.+56.+in+the+fore-named+Book+against+Cresconius%2C+where+he+mentions+Peregrinus+the+Presbyter%2C+and+the+Seniors.+%E2%80%A6+Thus+it+appears%2C+that+this+was+an+Ancient+Office+in+the+Church%2C+and+not+invented+by+Calvin%2C+as+some+have+thought+and+writ.%0A%0AAnd+then%2C+as+to+the+Reason+of+the+Thing%2C+some+think+there+should+be+no+Ground+of+Quarrelling+with+this+Office+in+the+Church%2C+seeing+it+is+so+Useful.+For+it+was+Instituted+for+the+Ease+of+the+Preaching+Elders%2C+that+they+might+not+be+over-burdened+with+Business%2C+and+that+they+might+more+conveniently+apply+themselves+to+that+Employment+which+is+purely+Ecclesiastical+and+Spiritual.+And+it+was+wisely+appointed+to+take+off+the+Envy+and+Odium+from+the+Ministers%2C+which+would+be+their+Lot+if+they+intermeddled+too+much+with+Affairs.+And+it+is+a+Way+to+cement+the+Clergy+and+Laity%2C+and+to+bring+them+to+a+Friendly+and+Christian+Correspondence%2C+and+to+unite+them+firmly+in+the+same+great+Interest%2C+that+of+Religion.%0A%0AIt+might+here+be+remembered%2C+that+they+had+a+very+great+Opinion+of+Laymen+in+the+former+and+best+Times+of+the+Christian+Church%2C+for+they+were+admitted+to+Synods+and+Councils%2C+and+they+were+advanced+to+the+highest+Ecclesiastical+Dignities.+Thus+Spyridion%2C+tho%E2%80%99+a+plain+Countryman+and+a+Shepherd%2C+was+made+a+Bishop.+Ambrose%2C+a+Secular+Magistrate%2C+and+Governour+of+Milan%2C+was+chosen+Bishop+of+that+Place+by+the+People.+Nectarius+a+Layman+was+put+into+the+fame+Office+at+Constantinople.+Sidonius%2C+a+French+Soldier+was+made+Bishop+of+Auvergne+in+France.+And+if+Laymen+were+admitted+to+Bishopricks%2C+it+can%E2%80%99t+be+thought+indecorous+that+they+are+placed+in+a+much+lower+Station+in+the+Church%2C+than+that+of+Ruling+Elders.%0A%0AThese+seem+to+have+been+allowed+of+by+our+Reformers%2C+as+is+evident+from+the+Injunctions+which+were+given+by+King+Edward+the+VIth.+to+those+Persons+who+were+to+take+care+of+Reforming+and+Settling+Ecclesiastical+Affairs+in+his+Reign.+See+the+Chapter+de+Divinis+Officits%2C+where+the+Minister+and+the+Elders+are+particularly+mentioned%2C+and+are+commanded+to+look+after+the+Discipline+of+the+Church.+See+the+Reverend+Bishop+%5BGilbert%5D+Burnet%E2%80%99s+History+of+the+Reformation.%0A%0ANor+is+this+esteemed+by+some+to+be+against+the+Genius+of+the+Evangelical+Administration%2C+which+suffers+not+Secular+Men+to+discharge+Spiritual+Offices%3B+for+the+Lay-Elders+Office+is+not+properly+and+strictly+such%2C+they+take+care+only+of+the+External+Matters+of+the+Church%2C+and+are+only+Assistants+in+the+outward+administering+of+Discipline%2C+and+look+into+the+Manners+and+Carriage+of+the+Christians+belonging+to+such+or+such+an+Assembly.+But+they+excuse+no+part+of+the+Ecclesiastical+Ministry%2C+which+properly+appertains+to+the+Ministers+of+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Theologia+Reformata%3A+or%2C+The+Body+and+Substance+of+the+Christian+Religion%2C+Comprised+in+distinct+Discourses+or+Treatises+upon+the+Apostles+Creed%2C+the+Lord%E2%80%99s+Prayer%2C+and+the+Ten+Commandments%2C+%282+vols%2C+London%3A+John+Lawrence%2C+1713%29%2C+1%3A+525-28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F579b885cfa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/579b885cfa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/07/john-edwards-on-the-office-of-ruling-elder/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ac4ae9b101" data-kw="">
<blockquote><p>God’s increasing goodness may give some satisfaction to such as make question of Church Governors, proper and peculiar to the Church.

Of such I demand, whether it be a good, useful, and needful thing, for the Church to have Governors of its own; and secondly, whether the Church of the Jews had such Governors, or no. Surely, me thinks neither of these should be denied.

Have not families, schools of learning, Colleges, Universities, Cities, Towns, all manner of Corporations, Companies and Societies, Governors proper and peculiar to themselves: besides the public Magistrates, who are also over them? Is it not by experience found, that such proper and peculiar Governors are needful and useful, and so good in their several spheres? And shall the best Society on earth, the militant Church, be without Ecclesiastical Governors, proper and peculiar to it?</p></blockquote>

</figure><figure class="quote" id="q-b08aff16c7" data-kw="">
<blockquote><p>Every Jewish city of any repute had its council, which sat in the chief synagogue of the city; and as in the Jewish polity, church and state were not only intimately united, but were, in fact, identical;[1] this council had supreme authority in all matters, whether ecclesiastical or civil. Each council had its President or Patriarch. Its members were styled Presbyters, or Elders. …

Maimonides, in his treatise on fasting, sets before us the same form of government. Whenever there is a fast for rain, “the ark is brought out into the street; the assembled people cover themselves with sackcloth, and scatter ashes on the ark, and on the book of the law: then one of the congregation takes some of the ashes, and sprinkles them on the head of the President. The ark is then placed in the midst; and, all sitting down, some Rabbi of the Elders stands up to read, &amp;c.” This quotation from Maimonides exhibits the form of government above described; viz. a council, consisting of members called Elders, and a President, the head of this council.</p></blockquote>

<blockquote><p>Certainly be it as it will, that there have been, are and will be many Antichrists, and false teachers, which oppose themselves against Christ, yet there is one of them to whom this title is, by an unhappy excellency, principally due.

Inasmuch as that beside the abominable impurity of his doctrine, which is common to him with the others, he invades the royal prerogative of Christ; hoisting himself above the Magistrate and the Angels themselves, and so above all that is called God (for these are they to whom this name is allowed in Scripture), whilst arrogating to himself a power over consciences, he pretends a supremacy over all Christians: a supremacy of religion, and which is spiritual; and so fits in the temple of God, behaving himself, as if he were God; taking upon him the power of binding &amp; loosing consciences; of making that sin which God hath not called sin; of giving dispensations where God gives none; of rating good works and setting a price upon them, enhancing, and moderating the market according to his occasions.

When he hath terrified the consciences of the greatest Monarchs, working this impression into them by his deputies, that how serious soever their repentance may be, yet they cannot enjoy peace either of soul, or body, unless his absolution come between. Whilst he makes unclean the use of creatures whom God hath sanctified by his word, not commending a fast, but enforcing an abstinence from certain creatures against the express word of God, which pronounceth this doctrine, a doctrine of Devils.

Whilst he undertakes to make marriage unlawful, which the Scripture hath called honourable amongst all men, and the bed undefiled. When he dispenseth with the breaking of vows, when he allows for honest those marriages, which the word of God hath declared to be incestuous. When he declares by his indulgential Bulls, that prayers had in a place by him assigned, are more precious, then if they had been without his assignation. Exercising this traffic, that with the sale of things spiritual, of souls and consciences, he may stuff his treasures, which he imployeth, as the world knoweth, either in maintaining war against Christian Princes, or in promoting his kindred, or in making his proud, prophane, Epicurean court swim in superfluities of dissolute luxury.

What shall we say more? When he undertaketh to shut and open at his pleasure the gates of Paradise, to prolong, or abbreviate the torments of those that are departed. When arrogating to himself this power, he useth such a partiality in the execution of it; partiality, say we? When he proceeds in such niggardliness, and avarice, yea such barbarous inhumanity, saving only whom it pleaseth him to save, being able (if you will believe himself) to save all. Is not this to arrogate a power proper, and peculiar to God alone?

But this power which in God, the Lord and Master of all, is no whit tyrannical: in man, who is obliged to do for another all he can possible, to love his neighbour as himself, more then tyrannical. Finally, when out of his authority, he employeth the Angels, in the pretended execution of his commandments, usurps not he an authority more then human, altogether divine?

Yet notwithstanding, this so strangely usurped power, is the master sinew of that policy, by which this unwieldy body subsisteth, the Colossus and main pillar of the Roman Church, a nerve which taking its original from the head, straggles through the whole body, being distributed to every member proportionably to its use: even as in the kingdoms of the world, the Monarchies reserving with themselves, as it were, the spring-head, and sun of sovereignty, nevertheless communicate the streams of this spring, the beams of this sun in proportion to their officers, according to each of their functions.</p></blockquote>

<blockquote><p>But there are other Philistines namely Arminian and Socinian Philistines, by which Church and State are much endangered, and it is the business now in hand to lay open their mystery of iniquity to the public view. We may say to these pestilent Heretics as well as to malignant Statesmen, Ita nati estis ut mala vestra ad Rempub. pertineant; for there are no greater Statesmen in the world then the English Arminians, and Popish Socinians; for such Monsters hath England nourished as are not to be found in all Africa.

Herod and Pilate, the Roman and the Racovian Antichrist, are made friends in England, all the Grand-Malignants, Arminians, Papists, and Socinians are of one confederacy, all united under one head the Arch-Bishop of Canterbury, the Patriarch or Pope of this British world, alterius orbis Papa as his Brother-Pope hath given him leave to phrase it, because he saw the Arch-Bishop too proud to acknowledge his Supremacy, but forward enough to maintain any other point of Popery, &amp; ready to join with him to suppress all Pure Protestants.

If this Design take effect, there may well be a reconciliation professed &amp; established between Rome and Canterbury, the two Popes may divide the spoil of the Church between them if they can but agree at parting. Whether some have not endeavoured to make such a Reconciliation; whether all points of Popery almost have not been greedily embraced in England, and that of the Pope’s Supremacy only rejected, more out of pride then conscience, let the prudent judge, they have light and evidence enough, and new evidence is daily produced.</p></blockquote>

<blockquote><p>FIRST, I would consider Christ’s coming into the world, or his taking upon him our nature to put himself in a capacity to purchase redemption for us.—Christ became incarnate, or, which is the same thing, became man, to put himself in a capacity for working out our redemption: for though Christ, as God, was infinitely sufficient for the work, yet to his being in an immediate capacity for it, it was needful that he should not only be God but man.

If Christ had remained only in the divine nature, he would not have been in a capacity to have purchased our salvation; not from any imperfection of the divine nature, but by reason of its absolute and infinite perfection: for Christ, merely as God, was not capable either of that obedience or suffering that was needful. The divine nature is not capable of suffering: for it is infinitely above all suffering. Neither is it capable of obedience to that law that was given to man. It is as impossible that one who is only God, should obey the law that was given to man, as it is that he should suffer man’s punishment.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“FIRST, I would consider Christ’s coming into the world, or his taking upon him our nature to put himself in a capacity to purchase redemption for us.—Christ became incarnate, or, which is the same thing, became man, to put himself in a capacity for working out our redemption: for though Christ, as God, was infinitely sufficient for the work, yet to his being in an immediate capacity for it, it was needful that he should not only be God but man.

If Christ had remained only in the divine nature, he would not have been in a capacity to have purchased our salvation; not from any imperfection of the divine nature, but by reason of its absolute and infinite perfection: for Christ, merely as God, was not capable either of that obedience or suffering that was needful. The divine nature is not capable of suffering: for it is infinitely above all suffering. Neither is it capable of obedience to that law that was given to man. It is as impossible that one who is only God, should obey the law that was given to man, as it is that he should suffer man’s punishment.”

<blockquote><p>Christ, as king of his church, hath appointed a government in her, and committed to office-bearers, under him, a power to execute his laws, and pronounce judgment according to them, for the preservation of order and peace, and the promoting of the interests of truth and holiness to his glory. …

The overlooking of the important ends to be served by the church as a visible society, is a capital error, or at least has been the source of many hurtful mistakes in our own, as well as in former times. Many seem to confine their views entirely to what is necessary for training up a number of individuals for eternal life; the only wise God hath combined this with the maintenance of a public cause, to the advancement of his glory on earth; and for this purpose has erected and maintains an organized and permanent association, which he has constituted the depositary of his truths, laws, and ordinances.

Those institutions which tend directly to promote personal salvation and holiness, such as the word, sacraments, and prayer, could not be preserved in purity, or practised to edification, without the external administration of laws. Church members are not all true saints; and such of them as are so, being renewed but in part, stand in need of counsel, restraint, and correction.

But there is a higher reason than even this for ecclesiastical judicature; it belongs to the administration of that kingdom which was given to Christ as Mediator, and constitutes an essential part of his glory as the lawgiver, judge, and king of the church. The divine government of the universe is conducted by laws adapted to the various orders of created beings. Though sin had not entered into our world, mankind would have lived under the external regimen of law, if there had been no other reason for it than this, that an exhibition of the moral government of God might be preserved among them.

In our law the sovereign is called the Grand Justiciar, and earthly kings, in general, rule and dispense justice in the remotest parts of their dominions, by means of the subordinate governors and judges whom they appoint. And in like manner, the authority of the church’s king is exercised, and his glory illustrated, by the instrumentality of those who, in his name, dispense his ordinances, and execute his laws. “He that heareth you, heareth me; and he that despiseth you, despiseth me; and he that despiseth me, despiseth him that sent me.</p></blockquote>

<blockquote><p>The person spoken unto [in Psalm 110:1] is the Son, אָדוֹן, “the Lord,” David’s Lord; in what respect we must now inquire. The Lord Christ, the Son, in respect of his divine nature, is of the same essence, power, and glory, with the Father, John x. 30. Absolutely, therefore, and naturally, in that respect he is capable of no subordination to the Father or exaltation by him, but what depends on and flows from his eternal generation, John v. 26.

By dispensation he humbled himself, and emptied himself of this glory, Phil. ii. 7, 8; not by a real parting with it, but by the assumption of human nature into personal union with himself, being made flesh, John i. 14; wherein his eternal glory was clouded for a season, John xvii. 5, and his person humbled to the discharge of those acts of his mediation which were to be performed in the human nature, Phil. ii. 9, 10.

This person of Christ is here spoken unto, not in respect of his divine nature only, which is not capable of exaltation or glory by the way of free gift or donation; nor in respect of his human nature only, which is not the king and head of the church; but with respect unto his whole person, wherein the divine nature, exerting its power and glory with the will and understanding of the human nature, is the principle of those theandrical acts whereby Christ ruleth over all in the kingdom given him of his Father, Rev. i. 17, 18.

As he was God, he was David’s Lord, but not his son; as he was man, he was David’s son, and so absolutely could not be his Lord; in his person, as he was God and man, he was his Lord and his son, — which is the intention of our Saviour’s question, Matt. xxii. 45.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. William H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 224-25.</span></figcaption>

</figure><figure class="quote" id="q-91f1d8428c" data-kw="">
<blockquote><p>But I know General Assemblies can reel and err, Every man is a liar. I never say, whatsoever is concluded by them is necessary. I say, what is determined by them is de jure, that is, ought to be agreeable to God’s word, for I shew that General Assemblies have their warrant from Act. 15. and my meaning and words are clear. …

All the power and authority of Synods we conceive to be ministerial, not Lordly, limited, regulated by the only word of God in the scripture, and in matters circumstantial, of order, and decency, as time, place, persons (observe I say not in mystical Religions, Ceremonies, called, but unjustly, indifferent, or the like) by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren, and the glory of God, and a lawful Synod, wee judge hath power ministerial from Christ, to pass constitutions decrees, Acts 16.4.

(Laws I do not call them, because Christ is the only Law-giver, King, and head of his Church, his Officers are only servants, and Heralds to hold forth his Lawes) and these constitutions condemning Arminianism, Socinianism, Familism, Antinomianism, &amp;c. as sometimes Mr. Burton being but one single Pastor by word and writ condemned them and that in the name, and authority of Christ (as he then said) and commanding in the Lord that they consent to the form of sound doctrine, rebuking all that subvert souls, and trouble the Churches, Acts 15.23, 24.

[A]re to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will, and mere authority of the Heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God, even as the single Independent Congregation is to be heard in things lawful under pain of excommunication, as our brethren say from Matth. 18. and yet, Matth. 18. sets not up Antichrist, and caries not on the Mystery of iniquity.

And we teach that the Magistrate, as the Minister of God, after due examination according to the word, is obliged to add his civil sanction to these constitutions, and to guard the Ministers with his Sword; and to punish Arminians, Socinians, Familists, &amp;c. as Mr. Burton cried against them of old, and appealed to the supreme Magistrate, the King’s Majesty against them: though we judge the Magistrates sword in all this, keeps such a distance from the conscience, that this is so far from being a State Government of the Church, that these constitutions have no power at all over the conscience from the sword, and are alike binding, and were, Acts 15. Though the Magistrate were not on earth, and though he should oppose them, as he did then.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brotherly and free epistle to the patrons and friends of pretended Liberty of Conscience in A survey of the spiritual antichrist</cite></span></figcaption>

C+not+without+reclamation%2C+or+appeal%2C+if+they+be+either+contrary+or+beside+the+scriptures%2C+but+conditionally+in+so+far+as+they+are+agreeable+to+the+Word+of+God%2C+even+as+the+single+Independent+Congregation+is+to+be+heard+in+things+lawful+under+pain+of+excommunication%2C+as+our+brethren+say+from+Matth.+18.+and+yet%2C+Matth.+18.+sets+not+up+Antichrist%2C+and+caries+not+on+the+Mystery+of+iniquity.%0A%0AAnd+we+teach+that+the+Magistrate%2C+as+the+Minister+of+God%2C+after+due+examination+according+to+the+word%2C+is+obliged+to+add+his+civil+sanction+to+these+constitutions%2C+and+to+guard+the+Ministers+with+his+Sword%3B+and+to+punish+Arminians%2C+Socinians%2C+Familists%2C+%26c.+as+Mr.+Burton+cried+against+them+of+old%2C+and+appealed+to+the+supreme+Magistrate%2C+the+King%E2%80%99s+Majesty+against+them%3A+though+we+judge+the+Magistrates+sword+in+all+this%2C+keeps+such+a+distance+from+the+conscience%2C+that+this+is+so+far+from+being+a+State+Government+of+the+Church%2C+that+these+constitutions+have+no+power+at+all+over+the+conscience+from+the+sword%2C+and+are+alike+binding%2C+and+were%2C+Acts+15.+Though+the+Magistrate+were+not+on+earth%2C+and+though+he+should+oppose+them%2C+as+he+did+then.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+brotherly+and+free+epistle+to+the+patrons+and+friends+of+pretended+Liberty+of+Conscience+in+A+survey+of+the+spiritual+antichrist&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91f1d8428c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91f1d8428c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/14/samuel-rutherford-on-the-limited-authority-of-synods/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-561a1afab7" data-kw="">
<blockquote><p>Let all baptized children, from the hour of their receiving the seal of God’s covenant, be recorded and recognized as infant disciples. Let the officers of the church, as well as their parents according to the flesh, ever regard them with a watchful and affectionate eye. Let Christian instruction, Christian restraint, and Christian warning, entreaty and prayer ever attend them, from the mother’s lap to the infant school, and from the infant school to the seminary, whatever it may be, for more mature instruction.

Let them be early taught to reverence and read the word of God, and to treasure up select portions of it in their memories. Let appropriate catechisms, and other sound compends of Christian truth, be put into their hands, and by incessant repetition and inculcation be impressed upon their minds. Let a school or schools, according to its extent, be established in each church, placed under the immediate instruction of exemplary, orthodox, and pious teachers, carefully superintended by the pastor, and visited as often as practicable by all the officers of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), p. 63.</span></figcaption>

rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-220a731d09" data-kw="">
<blockquote><p>Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition (2 Thessalonians 2:3)

4. The apostasy from the Lord will be determined chiefly by these two things; — (1.) By undermining his authority; (2.) Or destroying the interests of his kingdom. By these two we may understand the falling away, which is to come first.

[1.] By undermining his authority. Certainly his authority is under mined when others presume to usurp his place without his leave. Therefore, to superinduce a universal head of the visible church, which Christ never appointed, is manifestly to usurp his authority; though the party so intruding should pretend to hold his sovereignty from Christ, and under him, yet this is treason against Christ, for here is an authority set up without, and therefore against, his consent.

Put the case in a temporal kingdom, and the thing will be clear. And thus the Pope is the usurping head of a rebellion against Christ. Where did Christ institute him to take this office? Tu es Petrus is such a stale pretence, so often baffled and defeated, and pretended upon so small grounds; — as that Christ hereby conveyed singular authority to Peter above the rest of the disciples, that from Peter it descendeth to his successors, and to those of Rome (if ever he were at Rome), and not those of Antioch; — that it is endless to pursue the absurdities of this impertinent allegation.

The argument holdeth the more strongly when the Pope condemneth all the churches that will not be his subjects, how holy, good, and obedient to the laws of Christ soever they be. Surely, if anything, this is an apostasy or a revolt from our rightful Lord; and to consent to this rebellion and usurpation is to be drawn into a conspiracy against Christ, to submit to the head of the most pernicious schism that did ever rend the church of Christ, and to betray the liberty of the people of our Lord to a tyrannical usurpation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 27.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

</figure><figure class="quote" id="q-cb1bf99755" data-kw="">
<blockquote><p>[W]hen one is required to preside over the Church, and to be entrusted with the care of so many souls, the whole female sex must retire before the magnitude of the task, and the majority of men also. …

The divine law indeed has excluded women from the ministry, but they endeavour to thrust themselves into it; and since they can effect nothing of themselves, they do all through the agency of others; and they have become invested with so much power that they can appoint or eject priests [1] at their will: things in fact are turned upside down, and the proverbial saying may be seen realized — “The ruled lead the rulers:” and would that it were men who do this instead of women, who have not received a commission to teach. Why do I say teach? for the blessed Paul did not suffer them even to speak in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Priesthood</cite>, (c. 381-85), 2.2, 3.9 in Nicene and Post Nicene Fathers 1, 9: 40, 49.</span></figcaption>

</figure><figure class="quote" id="q-b585e7fdca" data-kw="">
<blockquote><p>But this must not be omitted that princes in the holy scriptures are not only called Deacons, or Ministers of God, but also Pastors: Of whom Ezechiel complaineth for many causes, for that they cruelly and perversely fed the people of God. Homer also calleth his Agamemnon the pastor of the people.

For they ought not to bear rule as thieves or hirelings, to fleece and to oppress, but to keep, nourish, and feed like Pastors. They are also called Fathers, wherefore the Senators among the Romans were called Patres conscripti, that is, appointed Fathers. Neither was there a greater or more ancient honour in the Commonweal, than to be called, The father of the Country.

Yea also a Magistrate by the law of God is comprehended under this commandment, Honour thy father and thy mother. Princes then owe unto their subjects a father love, and they ought always to remember that they are not rulers over beasts, but over men, and that themselves also are men: who yet should be far better and more excellent, than those whom they govern, otherwise they are not fit to govern them. For we make not a sheep the chief ruler over sheep, but the Bellwether, and then the Shepherd. And even as a shepherd excelleth the sheep, so ought they to whom the office of a Magistrate is committed, to excel the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes:</cite>, The Common Places, trans. Anthony Marten (2nd edn, London, 1583), 4.13.3, p. 227.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But this must not be omitted that princes in the holy scriptures are not only called Deacons, or Ministers of God, but also Pastors: Of whom Ezechiel complaineth for many causes, for that they cruelly and perversely fed the people of God. Homer also calleth his Agamemnon the pastor of the people.

For they ought not to bear rule as thieves or hirelings, to fleece and to oppress, but to keep, nourish, and feed like Pastors. They are also called Fathers, wherefore the Senators among the Romans were called Patres conscripti, that is, appointed Fathers. Neither was there a greater or more ancient honour in the Commonweal, than to be called, The father of the Country.

Yea also a Magistrate by the law of God is comprehended under this commandment, Honour thy father and thy mother. Princes then owe unto their subjects a father love, and they ought always to remember that they are not rulers over beasts, but over men, and that themselves also are men: who yet should be far better and more excellent, than those whom they govern, otherwise they are not fit to govern them. For we make not a sheep the chief ruler over sheep, but the Bellwether, and then the Shepherd. And even as a shepherd excelleth the sheep, so ought they to whom the office of a Magistrate is committed, to excel the people.”

<blockquote><p>When writing in opposition to the British government’s proposed scheme of National Education in Ireland, The Orthodox Presbyterian periodical, which Henry Cooke (among others) edited, reminded its readers that governments should establish the true religion and refuse to patronise false religion:

We are of that old fashioned school who maintain, that Governments may and should patronize and support true religion, and religious education, and neither must nor should patronize and support a false and unscriptural system. Moreover we do maintain, that when Governments, upon any pretence whatsoever, patronize or establish an unscriptural system, those Governments become partners in the sin, and will be made, if they repent not, “partakers of the plague,” which God will pour out upon every system of error and sin.

Still farther do we assert our conviction, that the people who stupidly or negligently acquiesce in the sins of the Government will, at the bar of providence and judgment, stand chargeable with the guilt. We therefore call upon the people, by respectful, honest, and bold petition, so to express their opinions, that should the Parliament proceed to establish Popery, and re-marry the nation to the long divorced errors and plagues of Rome, the people may stand unconnected with the guilt of the deed.</p></blockquote>

<blockquote><p>This Superiority which Gospel Ministers have, is not a lordly Dominion either over the Persons or Faith of their Flock. No, any Thing of this Sort that ever crept – into the Church,. had its Rife from the Subtilty of Satan, who envied its Peace, and is directly opposite to the Gospel, which forbids lordly Dominion, the Gospel Ministers Authority being given only for Edification and not for Destruction, as the Apostle has it 2 Cor. x. 8.

And it consists, 1. in an authoritative Publication of the Laws of Christ’s House. 2. In an authoritative Enforcement of them by a ministerial Offer of the Gospel Privileges as the Rewards of Obedience. And, 3. in a Power to inflict, according to Christ’s Appointment, the Gospel Punishments upon the Disobedient, the highest whereof is Excommunication, whereby the Disobedient are delivered over to Satan, for the Destruction of the Flesh, that the Spirit may be saved in the Day of the Lord Jesus, as the Apostle has it 1 Cor. v. 5.</p></blockquote>

<blockquote><p>At the time of the union between the Synod of Ulster and the Seceders in 1840, several Secession ministers remained outside owing to some scruples about what was taking place. One of their scruples was the fact that the new Presbyterian Church in Ireland did not require its members to adhere to the Westminster Confession, only its officers. In response, the General Assembly passed the following resolutions:

The Committee appointed at last Assembly, to confer with certain dissentient brethren, reported, – That certain brethren who have hitherto abstained from entering into the United Church, have signified their willingness to become members, on the Assembly now affirming resolutions, which the Committee have unanimously agreed to recommend for their adoption.

The following resolutions being read and considered, were unanimously adopted:-

I. That a profession of belief, conformable to the Westminster Confession of Faith, be required from intrants to communion, and from parents at the baptism of their children.

II. That the erroneous and immoral be debarred from sealing ordinances.

III. That communicants be admitted to the Lord’s Table by tokens, distributed only by the ministers and elders conjointly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/general-assembly-of-the-presbyterian-church-in-ireland.html">General Assembly of the Presbyterian Church in Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the General Assembly of the Presbyterian Church in Ireland. Belfast, July, 1841 (Belfast, 1841), i, p. 53.</cite></span></figcaption>

r.wordpress.com/2019/05/27/the-westminster-confession-and-membership-of-the-presbyterian-church-in-ireland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Lastly, he must tender her as much as all her friends, because he hath taken her from her friends, and covenanted to tender her for them all. To shew how he should tender her, Peter saith, ‘Honour the woman as the weaker vessel,’ 1 Peter iii. 7.

As we do not handle glasses like pots, because they are weaker vessels, but touch them nicely and softly for fear of cracks, so a man must entreat his wife with gentleness and softness, not expecting that wisdom, nor that faith, nor that patience, nor that strength in the weaker vessel, which should be in the stronger; but think when he takes a wife he takes a vineyard, not grapes, but a vineyard to bear him grapes; therefore he must sow it, and dress it, and water it, and fence it, and think it a good vineyard, if at last it bring forth grapes.

So he must not look to find a wife without a fault, but think that she is committed to him to reclaim her from her faults; for all are defective. And if he find the proverb true, that in space cometh grace, he must rejoice as much at his wife when she amendeth, as the husbandman rejoiceth when his vineyard beginneth to fructify.

This is far from civil war between man and wife; in all his offices is found no office to fight. If he cannot reform his wife without beating, he is worthy to be beaten for choosing no better; when he hath used all means that he may, and yet she is like herself, he must take her for his cross, and say with Jeremiah, ‘This is my cross, and I will bear it.’ But if he strike her, he takes away his hand from her, which was the first part he gave her to join them together; and she may put her complaint against him, that he hath taken away part of her goods. Her cheeks are made for thy lips, and not for thy fists.

The very name of a wife is like the angel which stayed Abraham’s hand when the stroke was coming, Gen. xxii. 11. If David, because he could not express the good and comfort of unity, was fain to say, Ps. cxxxiii. 1, ‘O how good and joyful a thing it is for brethren to dwell together in unity’ then weigh and judge how harsh and bitter a thing it is for man and wife to dwell together at enmity.

For the first year after marriage, God would not have the husband to go to war with his enemies, Deut. xxiv. 5; but no year would he have him war with his wife; and therefore God gave him that year to stay at home and settle his love, that he might not war, nor jar after; for the God of peace dwelleth not in the house of war. As a kingdom cannot stand to be divided, Mat. xii. 26, so a house cannot stand if it be divided; for strife is like fire, which leaves nothing but dust, and smoke, and ashes behind it.

We read in Scripture of masters that struck their servants, but never of any that struck his wife, but rebuked her. Lot was drunk when he lay with his daughters instead of his wife, Gen. xix. 33; and so is he which striketh his wife instead of his servant. The law sheweth how a bondman should be corrected, but the wife is like a judge, which is joined in commission with her husband to correct others. Wilt thou strike one in his own house? no more shouldst thou strike thy wife in her house. She is come to thee as to a sanctuary, to defend her from hurt, and canst thou hurt her thyself?

Therefore Abraham was called Sarah’s veil, Gen. xx. 16, because he should shield her; for a veil is made to save. Abraham said to Lot, ‘Are we not brethren?’ Gen. xiii. 8, that is, may brethren jar? But they may say, Are we not one: Can one chide with another? Can one fight with another? He is a bad host that welcomes his guest with stripes. Doth a king trample his crown? Solomon calleth the wife, ‘the crown of her husband,’ Prov. xii. 4; therefore he which woundeth her, woundeth his own honour.

She is a free citizen in thine own house, and hath taken the peace of thee the first day of her marriage, to hold thy hand till she release thee again. Adam says of his spouse, Gen. ii. 23, ‘This is flesh of my flesh; but ‘no man,’ saith Paul, Eph. v. 29, ‘ever hated his own flesh.’ So then, if a man ask whether he may strike his wife, God saith, nay, thou mayest not hate thy wife, for no man hateth his own flesh; shewing that he should not come near blows, but think his wrath too much; for Paul saith, Col. iii. 19, ‘Be not bitter to your wives, noting, that anger in a husband is a vice.

Doth the cock spur the hen: Every man is ashamed to lay his hands on a woman, because she cannot match him; therefore he is a shameless man which layeth hands on his wife. The hand doth not buffet its own cheek, but stroke it. If a man be seen raging with himself, he is carried to bedlam; so these madmen which beat themselves should be sent to bedlam till their madness be gone.

Solomon saith, Prov. v. 19, ‘Delight continually in her love,’ that is, begin, proceed, and end in love. In revenge, therefore, he sheweth that delight is gone, because he calleth love their delight. Therefore, as Paul saith of bishops, 1 Tim. iii. 3, ‘A bishop must be no striker, so a husband must be no striker; for he which striketh his own flesh breaketh that law which saith, ‘Thou shalt not make a scar in thy flesh,’ Lev. xix. 28, Deut. xiv. 1, and is like the Baalites which wounded their own bodies, I Kings xviii. 28. Thus we have sent letters unto husbands to read before they fight. Now let us go home to love again.

Wouldst thou learn how to make thy match delightful? Solomon saith, ‘rejoice in her love continually,’ Prov. v. 19. As though thou couldst not delight without love, and with love thou mayest delight continually, therefore love is called the thankful virtue, because it rendereth peace, and ease, and comfort to them that make use of her. So much for husbands.</p></blockquote>

<blockquote><p>When the whole body of the Church is spoken of, Christ is brought forward conspicuously so as to include all the children of God. We hear what Paul says: “The promises were given to Abraham and to his seed. He saith not, And to seeds, as of many, but as of one, And to thy seed, which is Christ.” (Gal. iii. 16.)

He does not include the whole multitude of children who were descended from Abraham himself according to the flesh, seeing that all were not partakers of the blessing. Ishmael was rejected, Esau was a reprobate, and many others were cut off. When the people were rescued from Babylon, but a small remnant came out; for the greater part rejected God’s astonishing kindness. Where then was “the seed?” In Christ, who is the Head, and contains in himself the rest of the members; for in him is joined and bound by an indissoluble bond all the seed.</p></blockquote>

<blockquote><p>It is the height of this bitter tyranny, to act cruelly towards the wife by stripes or blows; which we do not read that any one among the heathen did, unless he was drunk or mad. Hence the civil law permits the wife to avail herself of a divorce, if she can prove that her husband has beaten her: and it gives as a reason, that blows are foreign to a state of freedom, Cod. lib. 5. tit. 17. De repudiis; and in Novell, constit. 117.

For no superiority whatever gives the power of coercing the inferior by blows. If two persons enter into a league of friendship on the condition that the younger shall obey the elder, and be directed in all things by his wisdom and discretion; he is bound to obedience by virtue of this contract: but if he refuse to do that, he cannot be forced to his duty by blows.

The same must be said with regard to the matrimonial contract: for in this the husband and wife agree to a certain amicable fellowship in life, so that the wife is to be subject to her husband, and directed by him; but as a companion, not as a slave; by advice, not by stripes.

Aristotle gives this reason; because it is not fit to instil such fear into the wife, which may be injurious both to respect and love: but that servile fear which is instilled by blows is subversive of both. Neither is it fit that any one should exercise power over another by constraint supported by no law; but that power of chastising a wife by stripes is supported by no law either Divine or human.

Finally add, That is not to be done which cannot be done without sin, and what always derives its origin from this sin of bitterness. For although parents often chastise their children from love; yet both the experience and conscience of every one will testify, that no one proceeds to beat his wife except from anger, bitterness, or hatred; all which are unlawful things, and diametrically opposite to the matrimonial state. Therefore, let all bitterness be done away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 167-68.</span></figcaption>

<blockquote><p>Mr Alexander McLeod was ordained in the meeting house at Coldenham on the 6th July 1801 to take Charge of the united congregation of New York and Walkill as their fixed Pastor. The scattered state of the Church and other circumstances required his immediate absence, and it was not until the 25 September that he delivered his Introductory Discourse to the Church on each side of Walkill.

Again the organization of the Church session was detained by providential occurrences. There were but two elders and the absence of one on Mr McLeod’s return from New York rendered it impossible to constitute a Session until the 14th day of November, on the evening of that the elders and the minister met and agreed to Constitute the session.</p></blockquote>

<blockquote><p>True, this high and holy conception of a university was soon falsified. Young men whose object was not the study itself nevertheless coveted the privileges attached to the order of the learned and began to penetrate our sacred garden like veritable parasites. And then the sense of constituting a separate order bred stupid and foolish self-exaltation that stamped everyone whose name simply appeared on the registrar’s rolls as a scholar, while everyone who did not belong to the elect, to the “men of the gown,” was booed and reviled as a philistine or a “man of the town.”

Especially when the order of scholars still had external privileges and could with impunity defy the “constables” during nightly raids on shop signs and doorbells, and when a student paid no import duty on his wine, then privilege, as everywhere else, here too worked its evil effect. Not studying but creating a nuisance in public and carousing and drinking their fellows under the table became the base occupation in which students sought their honour. And of course, from their student days this false pride accompanied them into life. Because they had once attended university they thought they could forever look down with contempt on all those who had never gone to university. The holy laurels of learning fell into the mire, and the renegades’ faces were wreathed in the vines of wild creepers.

This behaviour came home to roost, and the outcome was that the sphere of scholarship lost its native impulse, tore up its charter, and put itself in the service of the State, so that Scolastica dissolved into Politica. Worse, a desire to break down the faith instead of shoring it up became for many the principal motive for doing scholarship. At last the evil, narrow-minded selfishness arrived that sees no higher purpose in the academy than to assist its visitors as quickly as possible in preparing them for what is called a “position.” The first stage caused the academy to forfeit its freedom, the second set it in opposition to God, and the third lowered it to the level of studying to pass the exams.

And who knows, maybe they have also sneaked into our own university already—those young men who supposedly are devoting themselves to academic studies but who have only one goal in mind: once and for all, and as quickly and cheaply as possible, to be done with bookish learning. They are parasites who come in order to pursue “success” but whose parched lips have never tasted one sip from the holy grail of scholarship. They are not looking for silver and do not search for hidden gold in the mine of scholarship: their only goal is to acquire a steady position and a guaranteed salary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholarship: Two Convocation Addresses on University Life</cite>, trans. Henry Van Dyke (1889 and 1900; Bellingham, WA: Lexham Press, 2015), unpaginated (Logos edition).</span></figcaption>

<blockquote><p>I seek not to obtrude unto you any private opinion of mine own; the best learned in our profession are of this judgement, that all the corruptions of the Church of Rome, do not prove her to deny the foundation directly; if they did, they should grant her simply to be no Christian Church. But I suppose, saith one, that in the Papacy some Church remaineth, a Church crased [cracked], or, if you will, broken quite in pieces, forlorn, mishapen, yet some Church: his reason is this, Antichrist must sit in the Temple of God.

Least any man should think such sentences as these to be true, only in regard of those, whom that Church is supposed to have kept by the special providence of God, as it were in the secret corners of his bosom, free from infection, and as sound in the faith, as we trust, by his mercy, we our selves are: I permit it to your wise considerations, whether it be more likely, that as frenzy, though it self take away the use of reason, doth notwithstanding prove them reasonable creatures which have it, because none can be frantic but they: so Antichristianity being the bain, and plain overthrow of Christianity, may nevertheless argue the Church wherein Antichrist sitteth, to be Christian.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I seek not to obtrude unto you any private opinion of mine own; the best learned in our profession are of this judgement, that all the corruptions of the Church of Rome, do not prove her to deny the foundation directly; if they did, they should grant her simply to be no Christian Church. But I suppose, saith one, that in the Papacy some Church remaineth, a Church crased [cracked], or, if you will, broken quite in pieces, forlorn, mishapen, yet some Church: his reason is this, Antichrist must sit in the Temple of God.

Least any man should think such sentences as these to be true, only in regard of those, whom that Church is supposed to have kept by the special providence of God, as it were in the secret corners of his bosom, free from infection, and as sound in the faith, as we trust, by his mercy, we our selves are: I permit it to your wise considerations, whether it be more likely, that as frenzy, though it self take away the use of reason, doth notwithstanding prove them reasonable creatures which have it, because none can be frantic but they: so Antichristianity being the bain, and plain overthrow of Christianity, may nevertheless argue the Church wherein Antichrist sitteth, to be Christian.”

<blockquote><p>Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition (2 Thessalonians 2:3)

Papists vainly pretend that the pope is the successor of Peter. Granted, the pope is the successor of an apostle. As Thomas Manton points out, however, he derives his succession from the son of perdition, Judas Iscariot:

[2.] The son of perdition, wherein he is likened to Judas: John xvii. 12, ‘None of them is lost but the son of perdition.’ Him he resembleth in covetousness, treachery, and final destruction. The term may be explained either passively, or actively:—(1.) Passively, as one condemned to everlasting destruction; as the ‘son of death,’ is one condemned to die: 2 Sam. xii. 5, ‘He shall be a son of death;’ we translate it, ‘He shall surely die.’ So ‘children of wrath,’ Eph. ii. 3; so here, ‘son of perdition.’

(2.) Actively, bringing destruction upon himself and others; one that shall destroy others, and so he is called ‘Abaddon,’ and ‘Apollyon,’ Rev. ix. 11, and is opposite to Christ, who is ‘the author of salvation.’ Heb. v. 9, but Antichrist of destruction. And let us see the parallel between him and Judas; for the person is a type, as well as the name hath a significancy. Antichrist then is like Judas—in profession, a disciple of Christ; in office, a governor of the church; but in practice, a traitor. As they said of the blind man, John ix. 9, ‘Some said, This is he; others, He is very like him.’ The Pope boasteth that his seat is apostolical, his chair is Peter’s chair, and that he is the successor of the apostle. Grant it, but there is an error of the person—not of Peter, but of Judas. Let us see the parallel:—

(1.) Judas was not a stranger, but a pretended friend and apostle: Acts i. 17, ‘He was numbered with us, and obtained part of this ministry.’ Turks [Muslims] and infidels are enemies to Christ, but Antichrist seeketh to undermine him, under a pretence of friendship; ἀντίχριστος is one in show for, and in effect against Christ, and the beast in the Revelation is said to ‘push with the horns of the lamb.’ Rev. xiii. 11. If he were a professed enemy, what mystery were there in it? But mystery was written upon the woman’s forehead, Rev. xvii. 5; and here, ver. 7, ‘The mystery of iniquity.’ It is wisdom to discern the false prophet, Rev. xiii. 18, but there needeth no great wisdom to discover an open and professed adversary.

(2.) He sold Christ for a small matter. Omnia Romae venalia: pardons, indulgences, freedom from purgatory, all to be bought with money; and it is a small matter, considering the things put to sale, the pardon of sins, the souls of men redeemed with Christ’s precious blood. The antichristian state maketh a market of religion; truth is made to yield to interest and profit.

(3.) Judas betrayed Christ with a kiss, under a pretence of honouring him: Luke xxii. 48, ‘Jesus said unto him, Judas, betrayest thou the Son of man with a kiss?’ Antichrist is a true adversary of Christ, though he pretend to adore him; as those that murdered the present prophets would by all means beautify the tombs of the prophets deceased, and bear a respect to their memories, Mat. xxiii. 30. He pretendeth to be his servant, yea, a servant of servants, but is really his enemy. The apostle telleth us of some that were ‘enemies to the cross of Christ,’ Phil. iii. 18. Who to appearance such friends to the cross as the rabble of nominal Christians? but they are opposers of his spiritual kingdom, the virtue and power of the cross. You have crucifixes every where, painted, carved, gilded; they are ready to worship the cross with a holy worship; they set it in their temples, altars, wear it in their bosoms, and wherever they meet it show it reverence, adorn it with gold, silver, and precious stones. Their popes and prelates have it carried before them; and are not these friends of the cross? No; they live a worldly, sensual life, and all their religion tendeth there unto; therefore enemies of the cross of Christ, because they mind earthly things. This is right antichrist-like, to betray Christ under a colour of adoration.

(4.) Judas was a guide to them that came to take Christ; and one main work of Antichrist is to be a ringleader in persecuting for religion. Christ is in heaven, death hath no more power over him; his natural body is above abuse, but his mystical body still suffereth: Acts ix. 6, ‘Why persecutest thou me?’ Antichrist is the head of the persecuting state, others are his emissaries and agents, to take Christ in his members. It is a politic religion, that must be carried on with worldly artifices, with power and cruelty.

5.) Lastly, The covetousness of Judas is set forth. He was a thief, one that carried the bag, John xii. 6. England, to its bitter cost, knoweth the polling exactions of the Papacy; all its dealings with us were to fill the bag out of this puteus inexhaustus. Now all these things should open our eyes; we may behold the man of sin, the son of perdition; one egg is not more like to another than Judas and Antichrist.</p></blockquote>

<blockquote><p>For the pope not contenting himself with the transcendency of ecclesiastical jurisdiction over the whole church, though he has no warrant for it in his boundless and endless ambition, did climb yet higher, and partly by the favour, or foolishness rather, of Christian princes, and partly by his own fraudulent and violent dealing, as the son of him who has been a murderer and a liar from the beginning, has set himself up first amongst, and next over the greatest princes and mightiest emperors, to dispose of their crowns and dignities at his pleasure, which is the mark and character of him who is spoken of by the apostle, Who sitteth in the temple of God as God, showing himself that he is God, and opposing and exalting himself above all that is called God (2 Thess. 2:4).</p></blockquote>

<blockquote><p>The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.</p></blockquote>

<blockquote><p>Against the learning of the Times, they make large Invectives; the Universities, and all the Colleges in them, they will have razed to the ground; they profess them to be worse than Monasteries that justly were abolished: whatever Arts and Sciences are taught in the Christian Schools, they count them idle and vain: Grammar, Rhetoric, Logic, Philosophy, are all unlawful Arts.

The Heathen Writers which are used in any Faculty, such as Aristotle, Plato, Cicero, and the like, they would have them all burnt, as the Authors of unlawful Arts. They reject all School-Degrees, such as Bachelors, Masters of Art, Doctors of any faculty. They will have no Students of Divinity. They tell us that youths mis-spend their time, and exceedingly abuse themselves, by studying of those things which usually are recommended unto them as preparations for the Ministry, whether Common places, Commentaries upon Scripture, or Protestant writers of Controversies; all such Books they will have laid aside; yea, it is their advice to reject all Books but the Bible alone.

As for Divinity-Disputations, they make large Invectives against them, as Paganish and very sinful Exercises; notwithstanding all this, they proclaim themselves great Patrons of all true Learning; albeit, as yet they have not been pleased to let the world know what kind of Letters and Books they will be pleased with, when all that hitherto have been known, are laid aside by their persuasion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), p. 32.</span></figcaption>

<blockquote><p>The following series of resolutions on the subject of National Education were submitted by Mr. Anderson, and unanimously adopted:-

1. That there is a loud call for the establishment in Scotland of a national system of education, based on Scriptural principles, thoroughly imbued with the spirit of the Gospel, and adequate to provide the whole land with sound literary and religious instruction.

2. That it is the duty of the Government and Legislature to establish such a system without delay.

3. That there are remarkable facilities for the accomplishment of this most desirable object, inasmuch as, notwithstanding of existing differences in regard to matters of religion, and even in regard to the duties of Government respecting education, there is an almost universal desire among all classes in Scotland that the Bible and the Shorter Catechism of the Westminster Assembly should be read in every school.

4. That in the Act of the Legislature establishing such a system, there ought to be a distinct recognition of the Word of God, and of the principles of true religion founded on that infallible record; and that provision should be made for teaching in every school the Holy Scriptures, and the doctrines and duties inculcated in the Divine Word, as these are summarily set forth in the Shorter Catechism; that the schools should be open to such well qualified teachers, and to those only, of whatever name or denomination, as give evidence of good moral and religious character, and of cordially believing the Word of God, and holding its precious truths, as these are exhibited in the Shorter Catechism, which it would be their duty to teach; and that local boards should be established everywhere through the land for the election of teachers, and for carrying out the system according to these principles.

5. That, in conviction of this Synod, such a system, if once established and carried into vigorous operation, would be cordially received and practically adopted by Christian men of every denomination, and could not fail, by the blessing of God, to confer incalculable benefits in the advancement throughout Scotland of knowledge, religion, and morality.

6. That the Rev. William Anderson, the Rev. Dr. Goold, and Mr. Matthew Tait, be appointed a committee to take charge of these resolutions – to convey them to the Government of the country, and to Scottish Members of Parliament, and to hold such correspondence with other parties as may appear desirable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian-synod-of-scotland.html">Reformed Presbyterian Synod of Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Reformed Presbyterian Synod in Scotland’ in Monitor and Missionary Chronicle</cite>, ii, no. 23 (Mar. 1854), p. 259.</span></figcaption>

<blockquote><p>Unless they will abolish their laws and ordinances and restore to Christ’s churches their liberty and have it taught among them, they are guilty of all the souls that perish under this miserable captivity, and the papacy is truly the kingdom of Babylon and of the very Antichrist. For who is “the man of sin” and “the son of perdition” [II Thess. 2:3] but he who with his doctrines and his laws increases the sins and perdition of souls in the church, while sitting in the church as if he were God? [II Thess. 2:4]. All this the papal tyranny has fulfilled, and more than fulfilled, these many centuries. It has extinguished faith, obscured the sacraments and oppressed the gospel; but its own laws, which are not only impious and sacrilegious, but even barbarous and foolish, it has decreed and multiplied without end.</p></blockquote>

</figure><figure class="quote" id="q-3d625cdf1d" data-kw="">
<blockquote><p>I will utter My judgments against them concerning all their wickedness, because they have forsaken Me, burned incense to other gods, and worshipped the works of their own hands. (Jeremiah 1:16)

A friend of mine recently published a post on The contradiction of Christian Reconstruction, which highlighted the inconsistency of those who claim to be upholding the law of God in society while they refuse to uphold the regulative principle of worship. Despite the good intentions of many Reconstructionists [1], their failure to adopt the Reformed approach to worship means that if they were to come to power they would quickly provoke the wrath of God against society.

As John Calvin explains when commenting on the above text, ‘The Jews had, indeed, in various ways, provoked his vengeance; but he mentions here one kind of wickedness, because it was the very fountain of evils, – they had departed from the law and the pure worship of God’. [2] Since most Christian Reconstructionists reject the requirements of God’s law in relation to worship (which is the most important part), Reconstructionism is self-contradictory and self-defeating. In the name of upholding God’s law, they reject God’s law in the sphere of worship. In the name of bringing society under Christian standards, they promote humanism in the realm of what most intimately pertains to Christ’s glory. Hence all that Christian Reconstructionism will ultimately achieve is the provocation of Divine wrath against the society in which it is embraced.

[1] Some Reconstructionists do affirm the regulative principle of worship, but they are a minority. I accept the basic aims of Reconstructionism (God’s law and postmillennialism), but eschew their Kuperianism, Neo-Calvinism, liturgical antinomianism, low views of the church, non-confessionalism, latitudinarianism, small governmentism, and American morality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the book of the prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), ix, 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

<blockquote><p>The second question is, Whether the antichrist here described is an ecclesiastical of civil power; whether it is to arise in the Church or in the world. The considerations which are in favour of the former of these assumptions are, –

1. That the designations “man of sin” and “son of perdition” have a religious import, and are more appropriate to an ecclesiastical than to a worldly power or potentate.

2. Antichrist was to have the seat of his power in the “temple of God.” It is there he sits. This seems clearly to indicate that it is an ecclesiastical usurping, tyrannical, and persecuting power, that is here depicted. By the temple of God in this passage is generally understood the Church which is so often elsewhere called, and especially by Paul, God’s temple. Some, however, suppose that the reference is to the literal temple in Jerusalem; but this supposes, (a.) That the Jews are to be restored to their own land. (b.) That they are to be restored as Jews, or unconverted, and that the temple is to be there rebuilt. (c.) That the Thessalonians knew all this and would understand the Apostle as referring to the temple made with hands; which is to the last degree improbable.

3. His coming is after the working of Satan, with all power and signs and lying wonders. This is not the way in which worldly potentates gain their power; they rely on force. But this is the way, as though traced by the pen of history rather than by the pencil of prophecy, in which the papacy has attained and maintained its fearful ascendancy in the world. Its power has been achieved mainly by fraud, “by the deceivableness of unrighteousness;” by forged documents and false pretences; by claiming that Peter was made primate over the whole Church the vicar or plenipotentiary of Christ on earth; that he was the bishop of Rome; that his successors in that office were his successors in that primacy; and that as the vicar of Christ he was superior to all earthly potentates, nor merely as the spiritual is above the temporal, but as lord of the conscience, authorsized to decide what was right and what was wrong for them to do in all their relations as men and as rulers; which is a claim of absolute dominion.

This, however, is a small matter so far as it concerns the things of this world. It was to the mass of the people of little moment whether their absolute sovereign was a bishop or a prince; whether their absolute sovereign was a bishop or a prince; whether he resided at Rome or in Paris, whether his authority extended over one nation or over all nations. It is the false claim of the papacy to have supreme authority over the faith of men, to decide for them what they must believe on the pain of eternal perdition, that is the most fearful power ever assumed by sinful men. … These pains the pope and his subordinates falsely claim the power to alleviate or remit. These claims have no parallel in the history of the world. If such pretensions as these do not constitute the power which makes them Antichrist, then nothing more remains. Any future antichrist that may arise must be a small affair compared to the papacy.

Then again, the Apostle tells us, these portentous claims, these unrighteous deceits, were to be supported by “signs and lying wonders.” These have seldom, if ever, been appealed to by worldly powers to support their pretensions. They ever have been and still are among the chief supports of the papacy. There is not a false doctrine which it teaches, or a false assumption which it makes, which is not sustained by “lying wonders.” Its whole history is a history of apparitions of the Virgin Mary or of saints and angels; and of miracles of every possible description from the most stupendous to the most absurd. It has ever acted on the principle “populus vult decipi,” and that it is right to deceive them for their own good, or, the good of the Church. The whole system, so far as it is distinctive, is a system of falsehood, or false pretensions, supported by deceit.</p></blockquote>

ry+is+a+history+of+apparitions+of+the+Virgin+Mary+or+of+saints+and+angels%3B+and+of+miracles+of+every+possible+description+from+the+most+stupendous+to+the+most+absurd.+It+has+ever+acted+on+the+principle+%E2%80%9Cpopulus+vult+decipi%2C%E2%80%9D+and+that+it+is+right+to+deceive+them+for+their+own+good%2C+or%2C+the+good+of+the+Church.+The+whole+system%2C+so+far+as+it+is+distinctive%2C+is+a+system+of+falsehood%2C+or+false+pretensions%2C+supported+by+deceit.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+%283+vols%2C+New+York%3A+Charles+Scribner%2C+1872-74%29%2C+3%3A+815-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f138b7ca8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f138b7ca8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/11/03/charles-hodge-on-the-protestant-view-of-antichrist-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The common opinion, however, among Protestants is, that the prophecies concerning Antichrist have special reference to the papacy. This conviction is founded in Paul’s second epistle to the Thessalonians. … The first question, to be determined in the interpretation of this prophecy, is, Whether Antichrist is a particular individual, or an institution, a power, or a corporation. Protestants generally adopt the latter view; because they do not regard any one pope, but the papacy, as the Antichrist of Scripture. In favour of this view it may be urged, (1.) That it is according to the analogy of prophecy to speak of nations, institutions, or kingdoms, as individuals. In Daniel, the ten kings are ten kingdoms or dynasties; the several beasts which he saw in vision, were not the symbols of particular men, but of nations. When therefore the Apostle speaks of Antichrist as “the man of sin,” and “the son of perdition,” it is perfectly consistent with Scriptural usage to understand him to refer to an order of men, or to an institution.

(2.) The work assigned to Antichrist in prophecy, extends over far too long a period to be accomplished by one man. (3.) Those who insist that the antichrist here predicted, is an individual man, are forced to admit that what is said in 2 Thessalonians ii. 7 (“He who now letteth, will let, until he be taken out of the way”) is to be understood of a power. It is generally understood of the Roman power. Luthardt understands it of the moral power which sustains the right, and therefore is opposed to the reckless disregard of all law, which is one of the characteristics of Antichrist. It is true that he supposes that reference is also made to one of the guardian or protecting angels spoken of by the prophet Daniel. But such an angel is not to be “taken out of the way.” And there is nothing in the context or in Paul’s writings anywhere to justify the assumption that reference is here had to any angelic personage.</p></blockquote>

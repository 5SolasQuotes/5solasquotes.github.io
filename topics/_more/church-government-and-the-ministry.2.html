<blockquote><p>1. The effects of slavery on domestic relations.

The system of American Slavery confers upon slaveholders an absolute right of property in their slaves. This sets aside the husband’s interest in his wife, and the wife’s interest in her husband. Although slave-laws do not recognize the relation of marriage between slaves, it is recognized of God — and in his sight the slave is equally entitled with his master to enter into the relation, — and has the same right of protection in its enjoyment. But slavery, in its practical working, steps in between the slave and the enjoyment of his right.

This evil is not merely an abuse of the system; it necessarily flows from it. The right of property claimed by the master, and secured by law, gives him the power of disposing of the slave in anyway, and at any time, that may suit his inclination or his interest; a power which is so commonly used as to approximate very nearly to universality. The husband is torn from his wife; and the wife from her husband. We refer not to the anguish of heart caused by such involuntary separations; nor to the inability thus induced to perform mutually the obligations belonging to the relation. These have already been presented as direct arguments against slavery. At present we refer only to the violation of right which unavoidably follows the system. To secure the right of the slave would affect the master’s claim, therefore his right, however sacred, is cancelled to gratify the avarice of the slaveholder, and to maintain the system of iniquity.

By the law of God, as well as of reason, the husband is bound to protect and support his wife, but slavery denies him the right of doing either, farther than may suit the inclination of his master. His wife may, without crime, or the charge of crime, be flogged most cruelly before his eyes, and slavery does not even permit him to complain; the most wanton outrages may be committed on her person, and he dare not lift his hand to rescue her; nor even open his lips to remonstrate. The law provides no remedy; it does not even admit his right to seek redress; one thing, and only one, the law contemplates:— The absolute right of the master, to the entire exclusion of all right on the part of the slave. Slavery thus, in its practical working, violates rights, which are admitted by reason and guaranteed by the authority of God.</p></blockquote>

<blockquote><p>For it is a grave and important matter, and one which is of vital concern both to Christ and the world at large, that we take steps to help the youth. By so doing we will be taking steps to help also ourselves and everybody else. Bear in mind that such insidious, subtle, and crafty attacks of the devil must be met with great Christian determination. My dear sirs, if we have to spend such large sums every year on guns, roads, bridges, dams, and countless similar items to insure the temporal peace and prosperity of a city, why should not much more be devoted to the poor neglected youth – at least enough to engage one or two competent men to teach school?</p></blockquote>

<blockquote><p>Commenting on the conduct of the majority Scottish RP Synod (1863) in removing ecclesiastical censure from those who voted in British elections, the London-Scottish Reformed Presbyterian Magazine (which represented the minority who dissented from this) argued that it was a violation of the covenants to admit those who voted to communion:

[W]e cannot refrain from remarking further here, that the Synod and congregations of the majority part of the Reformed Presbyterians do not themselves keep the Covenants. Extending church privileges to such as take part in political action with the British Constitution, they hold fellowship with malignants against the express engagements both of the National and the Solemn League and Covenant. If those who supported popery, prelacy, and arbitrary civil power in the days of the Covenant engagements were malignants, what else are they who now uphold popery, prelacy, and Erastianism, and condemn the Covenants themselves as unlawful deeds? There is need for the Synod and congregations, therefore, to instead of descending to loose and unworthy union, ascending to reformation, by retracing steps of defection already taken, even although this would cost a sacrifice, which few professors in this age of the world are inclined to make.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/london-scottish-reformed-presbyterian-magazine.html">London-Scottish Reformed Presbyterian Magazine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The union movement’ in London-Scottish Reformed Presbyterian Magazine</cite>, (Apr. 1871), p. 228.</span></figcaption>

</figure><figure class="quote" id="q-1bdd639fb1" data-kw="">
<blockquote><p>Although the Reformed Presbyterian Synod was initially cautiously supportive of what it saw as the good aspects of the 1859 Revival in Ulster, it seems fairly clear that by 1861 they had come to realise that the movement was deeply pernicious (we would have preferred it had they agreed with the PCI’s Isaac Nelson and William Hamilton and completely condemned the movement, but this is still a very strong statement against the fanaticism which manifested itself during the Year of delusion). Here is what the Irish Synod wrote to their American brethren:

The great religious excitement, or, as it has been called, “Revival,” which took place here during the Summer of 1859, was so conducted that we could take very little part therein. As a similar movement took place in your own country a short time previous, it is not necessary that we should now refer particularly to it. Though the whole religious community in the North of Ireland was for a time greatly agitated, our people for the most part kept entirely aloof from those scenes of dangerous and irrational excitement everywhere prevailing.

And now that matters have assumed very much of their wonted aspect, we have no doubt but the “Revival” was overruled by God for the quickening of many of His dear saints, and we hope also leading to the conversion of not a few souls to Christ: but the almost utter annihilation of the distinction between truth and error; the contempt cast upon the instituted ordinances of grace; the substitution of mere excitement and feeling for knowledge and genuine experimental religion; the enthusiasm and presumption engendered in self-styled “converts” and self-constituted preachers; the perversion and corruption of the worship of God, have produced effects which it will require a considerable length of time to counteract and remedy.

But whilst we thus easily discover and point out the evils connected with such “Revivals,” how much more important it is for us to endeavour to obtain a real revival of true religion among ourselves! A revival of religion in our own souls, in our families, in our congregations, and in our churches. Do we not need it? Let us, therefore, strive together in prayer for a more copious effusion of the Holy Spirit, that all sin, self-seeking, pride, formality, hypocrisy, and worldly-mindedness may be put away from us, and that we may be made more holy, more spiritually-minded, more zealous for the Divine glory, and more devoted to His service – that our churches may be more vital, active, and godly, “strengthening the things that remain, that are ready to die.” Let our mutual aim be, that by holy living we may recommend the truth unto others, causing our lights so to shine before men, that others seeing our good works may be led to glorify our Father in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Hart and William McCarroll to American Synod, 18 April 1861’ in Covenanter</cite>, v, no. 8 (Aug. 1861), pp 214-15.</span></figcaption>

</figure><figure class="quote" id="q-2e7fe114e1" data-kw="">
<blockquote><p>Writing on behalf of American Synod to the moderator of the remnant of Old Light Reformed Presbyterians in Scotland, Samuel O. Wylie argued that those in the Scottish Synod who had voted for the removal of ecclesiastical censure from those who voted in British elections had defecting from the covenanting position and were guilty of schism:

[…] It is well known to us that for several years past, you have been enduring a great fight of affliction. The conflicts in opinion and judgment that have marked the meetings of your supreme Judicatory, for some time past, have not been unnoticed by us, not have we failed to observe in the published speeches and arguments of many of your ministers and members evidence of a radical and growing dereliction from a Covenanted faith and practice. We have watched with absorbed and painful interest the progress of events among you, and from the first dreaded the result.

The deliverance of your late Synod touching the Overture, and the political relations of its members and the people under its jurisdiction, though anticipated by us, has filled our hearts with unaffected sorrow. We mourn for the division in our Covenanted Zion, and we mourn, most of all, for the falling away of the Covenanted witnesses, and the dishonour done thereby to truth, and to the memory of a faithful and venerated ancestry. The defection scarcely perceptible in its incipient stages, in the progress of a natural development open and manifest of late to all, has culminated in actual schism, and in avowed departure from the distinctive article and feature in the faith and practice of the Reformed Presbyterian Church. Another dark page in Scotland’s history has been written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-o-wylie.html">S. O. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Anderson, 3 June 1863 in Covenanter, vii, no. 9 (Sep. 1863), pp 232-3.</cite></span></figcaption>

<blockquote><p>An article in Moses Roney’s Reformed Presbyterian periodical highlights the absurdity of Old and New School Presbyterians tolerating man-stealers in their communion (which also reminds us that the Old-New School split was not merely about slavery):

Add to all this, the exciting subject of slavery creates division in both the Old and New School ranks, and hastens on a subdivision into separate bodies. The anti-slavery men maintain, teach and prove that the holding of unoffending men in bondage as goods and chattels, like beasts of burden, is theft and robbery; while many distinguished pro-slavery men teach, that it is a natural relation, and sanctioned by the gospel of Christ. They farther assert that the doctrine of immediate emancipation is fanatical, incendiary, and seditious; and acting on their principles, they encourage mobs to prevent by violence the discussion of the right of the slave to freedom. We should like to know certainly the ecclesiastical standing of the man that lately murdered the Rev. Mr. Lovejoy, at Alton, Illinois, for his attempt to plead the cause of the trampled down slave. We do know that a clerical brother of the martyr to the cause, of liberty, encouraged the mob that committed the murder; and we know that an elder of the Presbyterian body was in the mob that committed violence on the person of Amos Dresser. Now, how is it possible for men to continue long together in the same communion, when their sentiments are so adverse as that what one party holds to be theft and robbery, the other strenuously maintains to be righteous, and practices accordingly? How can they long continue to meet at the same communion table, whose adverse doctrines and practices have already issued in deeds of violence and blood?</p></blockquote>

<blockquote><p>If this does not forever prove that the papacy is the antichrist, then nothing does:

The destruction of the Papacy is the special work of the exalted Mediator, and there are the most powerful reasons why He should take vengeance upon that devoted system. Popery is essentially, and in every subject, the Antichrist – the inveterate and irreconcilable enemy of Christ. It stands in arrayed hostility to his character and offices. Popery exalts the creatures above the Saviour – representing the Virgin Mother as the Queen of Heaven, and as commanding her Son, and ascribing that power and homage to the Pope, his assumed vicar on earth, which belongs to Christ alone, and which it is the highest blasphemy to ascribe to any creature. He is dethroned from his mediatorial office, by exalting saint and angel-mediators. His priesthood is set aside by introducing human merits, and ascribing the virtue of his atonement to penances and bodily mortifications. The Roman pontiffs and the bishops and priests of Rome deny Christ his glory as a Prophet, by removing the key of knowledge, and preventing men from hearing the intimations of his will; while they arrogate to themselves more than regal honours, put on their own heads the diadem which He should exclusively wear, and promulgate laws and ordinances in opposition to the declared principles of his kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 296-7.</span></figcaption>

<blockquote><p>Two things have I to remark here with regard to the Church of Scotland. First:- Every one who connects himself with that Church, takes up AN ANTI-COVENANTING POSITION! When King William and his parliament looked into the Statute Book of the Kingdom, they found the obnoxious Acts of Charles II., which rescinded all the laws which had been enacted in favour of the Covenanted Reformation, legibly inscribed therein:- and what did they do with these acts? Repeal them? Not at all? They retained those guilty acts in all their force, and passing over the Second Reformation altogether, they revised the Act of 1592, and constituted it the character of the Church of Scotland? Did the General Assembly of 1690, object to this iniquitous juggling? Not they, indeed. They saw that the rest was good, and the land pleasant, and so, Issachar-like, they bowed the shoulder to bear, and became servants unto tribute. Yes, this they did, although the King plainly told them in his “letter” that “he and his parliament” had enacted such a frame of church government “as was judged to be most agreeable to the inclinations of his subjects.” HE and his PARLIAMENT, you perceive, my reader, did the whole business!! Therefore, it is, that I assert, that every minister and member of the Revolution Church of Scotland, cuts himself off from all participation in the glories of the period between 1638 and 1649. The same, indeed, must be said of the Free Church of Scotland, and also of the Irish Presbyterian Assembly.

The Established Church of Scotland is cut off from all participation in the glories of the Covenanting era, by STATUTE LAW; whereas the Free Church and the Irish Presbyterian Church, have VOLUNTARILY cut themselves off from these glories, by homologating the Revolution Settlement. Aristotle appears to be so much out of date now, that it may it may appear hazardous to venture upon a syllogism; however, let us try one. FIRST, major-premises: – The Revolution Settlement deliberately passed by; utterly repudiated; and placed “the grave-stone” upon the “Covenants and Covenanted Reformation.” SECOND, minor-premises:- Every Church which homologates the Revolution Settlement, deliberately passes by; utterly repudiates; and places the “grave stone” upon the “Covenants and Covenanted Reformation.” THIRD, the conclusion:- But, the Established Church of Scotland, the Free Church, and the Irish Presbyterian Church, do, each and all, homologate the Revolution Settlement; therefore, the Established Church of Scotland, the Free Church, and the Irish Presbyterian Church, do, each and all, deliberately pass by; utterly repudiate; and place the “grave stone” upon the “Covenants and Covenanted Reformation.” Quod crat demonstrandum. It is not my business to attempt to reconcile with honour, or even with common honesty, the conduct of those gentlemen, who, after they have deliberately repudiated the whole Covenanted Reformation, name and thing, can turn round, when the purpose serves, and cry out – often quite snappishly – to real Covenanters, “You are not the real Covenanters; we are the real Covenanters!!” Although I cannot allow that such persons are the real Covenanters, I do most readily grant that they are the real sextons, the real grave-diggers of the Covenanted Reformation, for they have consigned the whole thing to oblivion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Britain</cite>, still a horn of the beast (Banbridge, 1878), pp 23-4.</span></figcaption>

<blockquote><p>The papal antichrist doctrine is a crucial component of the Reformed faith; hence it is enshrined in the Westminster Confession (25:6). Indeed, it is not merely a Reformed view, but is part of historic Protestantism (Lutherans, Anglicans and others held to it). Sadly, this important teaching is both denied and expunged from the Confession (as in the American Presbyterian churches, the Presbyterian Church in Ireland and the Evangelical Presbyterian Church in Ireland), or else it is downplayed and rarely preached upon. Thomas Manton, however, reminds us of several reasons why this teaching should not be abandoned or forgotten about:

Observe, then, that the doctrine of Antichrist is a profitable doctrine, and a point very necessary to be preached and known.

1. It is a point very necessary to admonish and warn the faithful, that they be not circumvented with these delusions, and be found in the opposite state to Christ Jesus, and the interests of his kingdom. God hath blown his trumpet: Rev. xviii. 4, ‘Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues;’ God calleth his people out of spiritual Babylon; it is dangerous and unsafe being there. If we would escape Babylon’s punishments we must escape her sins, not live in that communion and society where there are such temptations to idolatry and other detestable enormities. It is disputable whether the errors of Popery be damnable, or there be any possibility of salvation in that religion. Some deny all possibility; others, abating from the rigour of that opinion, assert a very great difficulty: 1 Cor. iii. 13, ‘Saved as by fire;’ if so much Christianity left as to save them, it is with much ado. But the question is not about our benefit, but our duty; not whether possibly we may be saved? but what is the way the Lord will have us to walk in? And if there were possibility or probability of salvation in the way, in the general, yet there is very little or none for them that live in a known sin, and especially in a sin of such a dangerous nature as abetting an opposite faction to Christ, such as is that of Antichrist.

2. It is necessary to fortify and forewarn the people of God against a double temptation. (1.) Against scandal; (2.) Against persecutions.

[1.] Against scandal. It is a dangerous temptation to atheism to see Christianity so corrupted and debauched by a vile submission to serve worldly ends, and turned into the pageantry of empty and ridiculous ceremonies, which beget scorn and contempt of it in the minds of all considering beholders; and therefore there are more atheists in Rome and Italy than in other countries. Supernatural things, disguised with a vain pomp, lose their reverence, and do not alarm the conscience, but harden the heart in a settled atheism and contempt of Christ. Now it is a mighty stay to the heart to see that this degeneration was foreseen and foretold: John xvi. 1, ‘These things have I spoken to you, that you should not be offended;’ Mat. xviii. 7, ‘Woe unto the world because of offences! for it must needs be that offences come; but woe to that man by whom the offence cometh!’

[2.] Against persecutions; for the man of sin is also a son of perdition, a destroyer of the saints, and maketh havoc of the people of God. Now it is grievous when Christians suffer by Christians, and we may have many doubtings and misgivings about our cause; but when Antichrist is clearly discovered, we submit the more cheerfully to suffer the hardest things under his tyranny; for suffering under antichristian persecution is martyrdom and suffering for Christ, as much as suffering under Pagan persecution: Rev. xiv. 13, ‘And I heard a voice from heaven saying unto me, write, Blessed are the dead which die in the Lord from henceforth,’ &amp;c. Not only the primitive martyrs, who were put to death by heathens, but those that are condemned by Christians and burned for heretics, those are martyrs also.

3. That we may the better understand true Christianity; ἀντικείμενα παραλληλειμένα μάλιστα φαίνεται, opposites illustrate each other. The two opposite states are Christianity and Antichristianity; the one is a ‘mystery of godliness,’ 1 Tim. iii. 16; the other, ‘a mystery of iniquity.’ The design of the mystery of godliness is to recover men from the devil, the world, and the flesh, unto God; the other, to seduce men from God to the devil, the world, and the flesh again; and that by corrupting the former mystery, or the most excellent institution that ever the world was acquainted with for the ennobling and refining man’s nature; so that Christ’s religion is turned against himself, to lull men’s consciences asleep, whilst they gratify the lusts of the eyes, the lusts of the flesh, or live in pride of life. The devil is gratified by all sin, but especially he is εἰδωλοχαρὴς, as Synesius calleth him; one that delighteth in idols, as knowing this is the best way to make men brutish, or to live in an oblivion or neglect of God; for an idol is ‘a teacher of lies,’ Hab. ii. 18, doth imprint upon the mind carnal and false conceptions of a deity.

4. To confirm us in the truth of the Christian faith, when we see the prophecies of it expressly fulfilled; for this is the Lord’s direction to know a true prophet, Deut. xviii. 22, if the thing come to pass, and the event doth punctually answer the prediction; but when a prophet speaketh in the name of the Lord, and the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken. Now, the apostles did not only teach the church the doctrine of Christianity, but by a prophetic spirit and divine revelation foretold things to come; and among these, the great thing which is to happen and come to pass before Christ’s second coming is Antichrist, or the appearing of the man of sin. Therefore, that we may not doubt of what is past, nor suspect what is further to come, it is good to study these prophecies, and know they are to be fulfilled in their time, that we may say that God, who hath kept touch with the world hitherto in all the predictions of the word, will not fail at last.

Use 1. To reprove them that think this is a curious point not to be searched into. Why then did God reveal it, and that so often by St Paul, by St John, in so many prophetical representations of it? Surely it is not curiosity to search into things revealed, but to intrude ourselves into things hidden, and which God hath put under a veil of secrecy. It is true men must know their measure, and not attempt to run before they can go, and venture upon obscure points before well versed in plain; and it is true, in more abstruse points, men must not rashly define, but soberly and modestly inquire, and compare predictions with plain events; this is no way culpable.

2. To reprove those that are so impatient of giving a little attendance to such doctrines for a while, and think at least matter more profitable should be insisted on; they are persuaded enough already. It is well if it be so; but those that stand should take heed lest they fall; and presumptuous confidence soonest giveth out, and forsaketh Christ. I would but propound this argument to them: If it were profitable for them that were to go out of the body long before Antichrist was revealed to be taught these things again and again, and they be charged to keep these things in remembrance, certainly it is more profitable for others that live at the time when these things are in being, and the temptation is at the next door, ready to break in upon them. Surely it is profitable to discover Antichrist, to reduce those that are gone astray, much more to prevent a revolt, that we may not return to this bondage after a deliverance from it.</p></blockquote>

when+Christians+suffer+by+Christians%2C+and+we+may+have+many+doubtings+and+misgivings+about+our+cause%3B+but+when+Antichrist+is+clearly+discovered%2C+we+submit+the+more+cheerfully+to+suffer+the+hardest+things+under+his+tyranny%3B+for+suffering+under+antichristian+persecution+is+martyrdom+and+suffering+for+Christ%2C+as+much+as+suffering+under+Pagan+persecution%3A+Rev.+xiv.+13%2C+%E2%80%98And+I+heard+a+voice+from+heaven+saying+unto+me%2C+write%2C+Blessed+are+the+dead+which+die+in+the+Lord+from+henceforth%2C%E2%80%99+%26c.+Not+only+the+primitive+martyrs%2C+who+were+put+to+death+by+heathens%2C+but+those+that+are+condemned+by+Christians+and+burned+for+heretics%2C+those+are+martyrs+also.%0A%0A3.+That+we+may+the+better+understand+true+Christianity%3B+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%BA%CE%B5%CE%AF%CE%BC%CE%B5%CE%BD%CE%B1+%CF%80%CE%B1%CF%81%CE%B1%CE%BB%CE%BB%CE%B7%CE%BB%CE%B5%CE%B9%CE%BC%CE%AD%CE%BD%CE%B1+%CE%BC%CE%AC%CE%BB%CE%B9%CF%83%CF%84%CE%B1+%CF%86%CE%B1%CE%AF%CE%BD%CE%B5%CF%84%CE%B1%CE%B9%2C+opposites+illustrate+each+other.+The+two+opposite+states+are+Christianity+and+Antichristianity%3B+the+one+is+a+%E2%80%98mystery+of+godliness%2C%E2%80%99+1+Tim.+iii.+16%3B+the+other%2C+%E2%80%98a+mystery+of+iniquity.%E2%80%99+The+design+of+the+mystery+of+godliness+is+to+recover+men+from+the+devil%2C+the+world%2C+and+the+flesh%2C+unto+God%3B+the+other%2C+to+seduce+men+from+God+to+the+devil%2C+the+world%2C+and+the+flesh+again%3B+and+that+by+corrupting+the+former+mystery%2C+or+the+most+excellent+institution+that+ever+the+world+was+acquainted+with+for+the+ennobling+and+refining+man%E2%80%99s+nature%3B+so+that+Christ%E2%80%99s+religion+is+turned+against+himself%2C+to+lull+men%E2%80%99s+consciences+asleep%2C+whilst+they+gratify+the+lusts+of+the+eyes%2C+the+lusts+of+the+flesh%2C+or+live+in+pride+of+life.+The+devil+is+gratified+by+all+sin%2C+but+especially+he+is+%CE%B5%E1%BC%B0%CE%B4%CF%89%CE%BB%CE%BF%CF%87%CE%B1%CF%81%E1%BD%B4%CF%82%2C+as+Synesius+calleth+him%3B+one+that+delighteth+in+idols%2C+as+knowing+this+is+the+best+way+to+make+men+brutish%2C+or+to+live+in+an+oblivion+or+neglect+of+God%3B+for+an+idol+is+%E2%80%98a+teacher+of+lies%2C%E2%80%99+Hab.+ii.+18%2C+doth+imprint+upon+the+mind+carnal+and+false+conceptions+of+a+deity.%0A%0A4.+To+confirm+us+in+the+truth+of+the+Christian+faith%2C+when+we+see+the+prophecies+of+it+expressly+fulfilled%3B+for+this+is+the+Lord%E2%80%99s+direction+to+know+a+true+prophet%2C+Deut.+xviii.+22%2C+if+the+thing+come+to+pass%2C+and+the+event+doth+punctually+answer+the+prediction%3B+but+when+a+prophet+speaketh+in+the+name+of+the+Lord%2C+and+the+thing+follow+not%2C+nor+come+to+pass%2C+that+is+the+thing+which+the+Lord+hath+not+spoken.+Now%2C+the+apostles+did+not+only+teach+the+church+the+doctrine+of+Christianity%2C+but+by+a+prophetic+spirit+and+divine+revelation+foretold+things+to+come%3B+and+among+these%2C+the+great+thing+which+is+to+happen+and+come+to+pass+before+Christ%E2%80%99s+second+coming+is+Antichrist%2C+or+the+appearing+of+the+man+of+sin.+Therefore%2C+that+we+may+not+doubt+of+what+is+past%2C+nor+suspect+what+is+further+to+come%2C+it+is+good+to+study+these+prophecies%2C+and+know+they+are+to+be+fulfilled+in+their+time%2C+that+we+may+say+that+God%2C+who+hath+kept+touch+with+the+world+hitherto+in+all+the+predictions+of+the+word%2C+will+not+fail+at+last.%0A%0AUse+1.+To+reprove+them+that+think+this+is+a+curious+point+not+to+be+searched+into.+Why+then+did+God+reveal+it%2C+and+that+so+often+by+St+Paul%2C+by+St+John%2C+in+so+many+prophetical+representations+of+it%3F+Surely+it+is+not+curiosity+to+search+into+things+revealed%2C+but+to+intrude+ourselves+into+things+hidden%2C+and+which+God+hath+put+under+a+veil+of+secrecy.+It+is+true+men+must+know+their+measure%2C+and+not+attempt+to+run+before+they+can+go%2C+and+venture+upon+obscure+points+before+well+versed+in+plain%3B+and+it+is+true%2C+in+more+abstruse+points%2C+men+must+not+rashly+define%2C+but+soberly+and+modestly+inquire%2C+and+compare+predictions+with+plain+events%3B+this+is+no+way+culpable.%0A%0A2.+To+reprove+those+that+are+so+impatient+of+giving+a+little+attendance+to+such+doctrines+for+a+while%2C+and+think+at+least+matter+more+profitable+should+be+insisted+on%3B+they+are+persuaded+enough+already.+It+is+well+if+it+be+so%3B+but+those+that+stand+should+take+heed+lest+they+fall%3B+and+presumptuous+confidence+soonest+giveth+out%2C+and+forsaketh+Christ.+I+would+but+propound+this+argument+to+them%3A+If+it+were+profitable+for+them+that+were+to+go+out+of+the+body+long+before+Antichrist+was+revealed+to+be+taught+these+things+again+and+again%2C+and+they+be+charged+to+keep+these+things+in+remembrance%2C+certainly+it+is+more+profitable+for+others+that+live+at+the+time+when+these+things+are+in+being%2C+and+the+temptation+is+at+the+next+door%2C+ready+to+break+in+upon+them.+Surely+it+is+profitable+to+discover+Antichrist%2C+to+reduce+those+that+are+gone+astray%2C+much+more+to+prevent+a+revolt%2C+that+we+may+not+return+to+this+bondage+after+a+deliverance+from+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+complete+works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+46-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf7c06ac5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df7c06ac5a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/15/thomas-manton-on-the-importance-of-believing-that-the-pope-is-the-antichrist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Although the editor of this blog is not opposed to home-schooling (indeed, it is often the only way for parents in our current circumstances to ensure their children get a Christian education), we reject the extremist notion that it is the only scriptural (or even the best) way to educate children. Our Reformed forebears did not believe this to be the case; you will even notice that Samuel Rutherford applies a favourite home-schooling “proof-text” to those who teach children in schools. This, moreover, also demonstrates that the Covenanters did not believe in Kuyperian notions of sphere-sovereignty. Since magistrates and school-teachers are also “fathers”, texts like Ephesians 6:4 could also be applied to them and not just to literal fathers. Hence they rejected the idea that education belonged to the “sphere” of the nuclear family alone :

There are with us Doctors of Divinity who teach in Schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3. 10. under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their Colleges, were young Prophets, or sons of the Prophets, as 1 Sam. 10. 5. 2 Kin. 4. 1. 1 King. 20. 35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Pro. 22. 6. Ephes. 6.4. if they aim at the Ministry, prophesy in our presbyterial meetings, 1 Cor. 14.29.</p></blockquote>

<blockquote><p>[…] Papists, home-born Papists, who are vipers that most unnaturally have endeavoured to eat through their mother’s bowels. Not their nature only, but their Religion also, teaches and allows them for the Good of the Catholic cause, falsely so called, not to spare their own native Country, their own kindred, Brothers, Fathers, no not of their own Religion. To blow up Parliaments, to ruin Cities, Countries, Kingdoms, is their ordinary work. Especially of those, whom they call Jesuits, the Bellows of Hell, the Incendiaries of Christendom, at this day. The Curse of God is upon them fearfully for arrogating their Name from Jesus, which signifies a Saviour, and is impropriated to the Son of God: Thou shalt call his name Jesus. These men, that call themselves Jesuits, are, by the just judgement of God upon them, Destroyers of Cities, Countries, Kingdoms, and might far better take their name from him, who is called in Hebrew Abaddon, and in Greek Apollon, but signifying a Destroyer. Revel. 9. 11.</p></blockquote>

<blockquote><p>In the midst of the mindless fanaticism surrounding the current presidential election, James Dick provides us with a sense of perspective that is sadly missing among the pseudo-religious right – who think that you can reform a nation by voting for a Mormon antichrist. It is especially sad that professors at “Puritan Reformed” seminaries ignore the teaching of the Reformed confession in relation to extirpating idolatry and caring for the poor and needy in order to justify supporting the heresy of American conservatism (being “conservative” in America means conserving an atheist, idolatrous, Christ-despising, hell-inspired constitution. It is, therefore, a political heresy to be a conservative in an American context. Why do you think the Libertarians and conservatives slander our Reformed forebears as Statists and socialists? It is because they know that the Reformed position is at odds with their idol of conservatism). I wonder how many Puritans would have voted for Socinians or members of other cults? Seriously, if you were to accept the reasoning in the post linked above, “vote for Mitt Romney because he is against abortion and homosexuality” [which is debatable], you could use it to justify voting for the Pope of Rome! After all, the Pope is against homosexuality and abortion, but no Puritan would ever have voted him or his votaries into civil office because they knew that the spiritual damage popery and false relgion can potentially do is far worse than anything that can be done by abortionists or homosexuals. The reality is that such “conservatism” (a useless term if ever there was one) is of its father the devil. May God deliver us from such folly by returning us to the Old Light Covenanter position:

The Reformed Presbyterian Church exists to keep this Gospel pure and entire. Is there any other Church that does this? If so, we shall be glad to join hand and heart with that Church. We do not know, however, of any Church but our own that openly protests against the nation’s rejection of Christ. We do not know of one single resolution or memorial or action of any Court of the British Presbyterian Churches in which they profess a desire to bring the nation to Christ’s feet. We do not know of a single act in which they denounce the sin of this nation in breaking Christ’s Covenants at the Restoration, and its continued sin in persisting in the breach of those Covenants today.

Yet members of these churches will tell us when we feel constrained to protest against a rebellious nation, and to separate ourselves from it, that they are taking the more excellent way of “voting for good men,” and seeking reform in the direction of which we are speaking. For first, no good man ever yet solicited the votes of the electors in order to advocate the restoration of the nation to Christ’s law. No vote was ever given or received for the purpose of purging the nation from its unholy confederacy with Christ’s enemies. When we find a candidate for Parliamentary honours who will pledge himself heartily and honestly to urge upon the nation the Gospel of our Testimony, and when we find members of other churches willing to vote that the Gospel of our Testimony may be accepted by the nation, it will be time enough for us to consider whether voting side by side with Papists and other enemies of Christ be a more excellent way, or any holy way at all, to seek reform.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), p. 19.</span></figcaption>

<blockquote><p>For what purpose, then, does the Reformed Presbyterian Church exist? And what is the advantage of having a Theological Hall in connection with our Church? If we wish only to be Christian in our profession and position as a Church, why not join, or allow ourselves to be absorbed by, some of the Christian Churches around us? Our reply is, We occupy a separate position as a church because we desire, we trust sincerely, to realise a fully Christian ideal of universal subjection to Christ our King on our part, and to extend the knowledge and appreciation of that ideal among the churches around us. We could not join any one of these churches without doing that which would be, from our point of view, equivalent to disobeying some of the Commandments of Christ, or opposing or disregarding some part of His authoritative revelation, and so coming short of the Christian ideal. Not that we charge any of the churches with deliberate or conscious disobedience; but that we find, in point of fact, that some of the most important principles of Christ’s truth – notably the principle of His rightful dominion as Mediator over the Church and over the nation – are allowed to fall into abeyance or into oblivion, at least in all the larger Evangelical Churches.

Passing, in the meantime, the principle of Christ’s absolute authority in His Church – a principle which is being constantly violated by the introduction of audacious inventions of man into Divine worship, and by the pushing of Christ’s own authoritative institutions into a corner – and looking at the principle of His Headship over the nation, we may conclude, without any tedious process of reasoning, that the church which sees Christ’s law set aside by the nation, and His authority rejected, and His Kingly rights trampled in the mire with disdain by every petty enemy, the church that admits and even argues for the principle that enemies of Christ have a right to be constituent members in that society in which God has declared that Christ has a right to be the Head, and in which therefore the will of Christ is the supreme and ultimate authority – the church that sees this monstrous wrong done to Christ, and stands by for generations without uttering one word of fearless denunciation, and without doing one single deed the object of which is to bring the nation back to the throne of Christ in dutiful allegiance, has not, in this respect at least, a broad or intelligent or conscientious conception of Christian duty.

We need, therefore, to maintain our denominational position that we may continue to utter a clear and faithful testimony for Christ the King, and to utter it all the more clearly and faithfully as others continue to become more careless about the fearful rebellion of the nation against Him, or to become more impatient of the restraints of our testimony against their criminal neglect. And as our Church must continue to exist, our Theological Hall must exist, not only that the doctrines of Evangelical Christianity generally may be taught and embraced, but also that the candidates for the ministry on leaving the Hall may go forth under the solemn and joyful conviction that Christ is “King of kings and Lord of lords,” and that minister is the King’s ambassador to be guided by the King’s will, and to labour for the world-wide acknowledgment of the King’s reign.</p></blockquote>

<blockquote><p>And with respect to the government of Christ’s house, alas! the generality of the present age seem to be agreed, that it is a matter of mere indifferency and moonshine, whether a person be of the Episcopalian, Independent, or Presbyterial way of thinking about it; although it is the declared principle of this church, founded on the word of God, solemnly sworn unto and sealed by the blood of many of the Lord’s witnesses, That the spiritual power and authority, is lodged, neither in the hand of the civil magistrate, not in the community of the faithful, as they call them, but in church officers, ministers and elders acting in parity, and judicatories subordinate to one another. Now, we say that a faithful minister of Christ is set for the defence of the gospel, namely, both for the defence of gospel-truth, and likewise of the hedge of government, which the glorious Head hath set about it.</p></blockquote>

<blockquote><p>In 1646, when the Presbyterians had fully regained the ascendancy, the Scottish Parliament passed an act, requiring every parish to have a schoolmaster, and ordaining, that if in any case, heritors or land-holders neglected raising means for his support, the Presbytery should nominate twelve men, to make the assessment upon their property. Indeed, strange as it may appear, the period between 1638 and 1660, seems almost entitled to be called the golden age of popular education in Scotland. In the universal diffusion of religious instruction, it was decidedly so. ‘For,’ says Kirkton, a very respectable Church historian of the times, ‘every parish had a minister, every village a school, every family almost had a Bible—yea, in most of the country, all the children of age could read, and were provided with Bibles either by their parents, or ministers.

I have lived many years in a parish, where I never heard an oath — and you would not, for a great part of the country, have lodged in a family, where the Lord was not worshipped by reading, singing, and prayer. ‘Nobody,’ he quaintly adds, ‘complained more of our church government, than our taverners, whose ordinary lament was, that their trade was hopeless—people were become so sober.’ It was thus, by planting the school by the side of the kirk, that the Reformed clergy raised the people of Scotland, both from feudal bondage and spiritual thraldom; and most grateful was the return which they every where received. During that period, school teaching was a regular profession — as much so as that of the ministry, and men were educated for it. Piety no less than learning and aptness to teach, was regarded as an essential qualification in a school-master. The parish school was the nursery of the kirk, and the master was expected to co-operate with the minister, in all his plans and efforts for the spiritual good of the rising generation. To command the best talents and to place the teacher on the highest vantage ground, in the discharge of his duties, a house was provided for his family, and he received a liberal and permanent support. In the sacredness of his office, the pastor was above him; but in talents and scholarship, it was thought that the school-master stood upon nearly the same level.</p></blockquote>

I have lived many years in a parish, where I never heard an oath — and you would not, for a great part of the country, have lodged in a family, where the Lord was not worshipped by reading, singing, and prayer. ‘Nobody,’ he quaintly adds, ‘complained more of our church government, than our taverners, whose ordinary lament was, that their trade was hopeless—people were become so sober.’ It was thus, by planting the school by the side of the kirk, that the Reformed clergy raised the people of Scotland, both from feudal bondage and spiritual thraldom; and most grateful was the return which they every where received. During that period, school teaching was a regular profession — as much so as that of the ministry, and men were educated for it. Piety no less than learning and aptness to teach, was regarded as an essential qualification in a school-master. The parish school was the nursery of the kirk, and the master was expected to co-operate with the minister, in all his plans and efforts for the spiritual good of the rising generation. To command the best talents and to place the teacher on the highest vantage ground, in the discharge of his duties, a house was provided for his family, and he received a liberal and permanent support. In the sacredness of his office, the pastor was above him; but in talents and scholarship, it was thought that the school-master stood upon nearly the same level.”

<blockquote><p>The great Antichrist, is he, who under the name of Christ’s Vicar, persecutes him,

The Rules.

I. The name Antichrist belongs not to one person alone, but to a whole state or order of men, as it were in the same Kingdom succeeding each other.

Even as the word of High Priest. He is not then opposite to Christ, as one person is to another, in respect of substance, but he is opposite to him in respect of quality or office.

II. The Papists will have Antichrist to be one particular man; a Jew of the Tribe of Dan, the Jews Messiah, and the restorer of their Religion, who shall reign at Jerusalem three years and a half, shall fight with Henoch [Enoch] and Eliah [Elijah], shall offer to ascend to heaven from Mount Olivet, but shall be destroyed by Christ.

III. But we out of Scripture describe Antichrist thus. 1. That he is a man at one time, one; but in succession of time, an order of men; in the same state succeeding each other. 2. Raised by Satan. 3. A Christian in name only. 4. In very deed Christ’s Enemy. 5. Sitting in the Temple of God, as God. 6. Reigning in that great City, which ruleth over the Kings of the Earth. 7. Seducing the inhabitants of the Earth with laying wonders. 8. Setting a mark on his followers. 9. Full of idolatry, ambition, avarice, cruelty and impurity. 10. Revealed in the last times. 11. He shall be destroyed by the breath of Christ’s mouth, and shall be overthrown by his own lovers, and utterly abolished at Christ’s glorious coming.

Johannes Wollebius, The abridgment of Christian divinity, trans. Alexander Ross (3rd edn, London, 1660), pp 233-5.</p></blockquote>

<blockquote><p>In this post, Moses Roney’s Reformed Presbyterian periodical continues its praise of the Scottish Reformers for bringing education to the people. After discussing how King James VI and Charles I wanted to use schools for sinister purposes, Dr Humphrey points out that the Reformed Church of Scotland was willing to provide the schools themselves (even though the civil rulers often neglected to do their duty). According to the Scottish theory of the two-kingdoms, education does not need to be monopolised by either church or state, instead both institutions should co-operate to promote the glory of God in the training of the nation’s youth:

But the church of Scotland did not [for] wait these tardy and sinister moves of the government. Those good men, who saw so early and clearly what was necessary to lay the foundations of Protestantism broad and deep throughout the country, determined to do what they could for the establishment of parochial schools, however neglectful the civil rulers might be of their duty. While they expostulated with the nobility for their supineness, they exerted themselves as if all the hopes of Scotland depended on their efforts; in so much that, in the Lowlands especially, popular education had made great progress before the state came to their aid. It is stated in a document still extant, that only twenty years after the reformation, ‘so great had been the progress of religious instruction in a country where, forty years before, the Bible was not suffered to be read, that almost every house possessed a copy, and that it was read in it!’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, p. 306</span></figcaption>

<blockquote><p>I very much question whether the whole history of human improvement can furnish the outline of an educational system, at once so comprehensive, so simple, and so much in advance of the age in which it was drawn up; and certainly, there is nothing which more strikingly shows what a heaven-wide difference there is between the genius of Protestantism and Popery. That men, who had themselves been taught to consider ‘ignorance as the mother of devotion,’ should all at once have such enlargement of views, in regard to education, as soon as the light of reformation dawned upon their minds, and that they should find time to mature so wise a plan, while they were obliged to dispute every inch of ground with the enemy, and while, as yet, the conflict between light and darkness hung in such awful suspense,—is truly wonderful. It would almost seem as if there must have been something supernatural in the illumination which guided them; for they could have derived but little assistance from the most enlightened nations, whether ancient or modern; and to this very day, no material improvement has been made upon their system. If we did not know that our Puritan forefathers brought it along with them to New-England, the similarity is so striking, that no one could doubt the Scottish origin, and the Prussian system of popular education, the most perfect and efficient, probably, which the world ever saw, is manifestly indebted to the same source for all its essential elements.</p></blockquote>

</figure><figure class="quote" id="q-3cc1a9a6a4" data-kw="">
<blockquote><p>In 1837 the American Covenanter Reformed Presbyterian periodical, edited by Moses Roney, published an article by a man called Dr Humphrey on ‘Education in Scotland’. This article helpfully points out that the universal diffusion of education was one of the leading principles of the Scottish Reformation. How sad it is that men who claim to stand in the tradition of the Scottish Reformers would decry this system were it upheld today (this includes those who think public education is inherently wrong and that home-schooling is the only biblical form of education):

The parochial schools of Scotland have been the admiration of enlightened men in all countries, for two hundred and fifty years. Like civil and religious liberty and all the noble institutions of that country, they are the offspring of the Reformation. Before John Knox rolled back the thunders of the Vatican upon the Pope and his Cardinals, and blew that mighty blast which shook down the walls of spiritual Babylon in North Britain, the people were as deeply sunk in ignorance, as they were in the superstition and idolatry of the great anti-christian apostacy. Very few, except the nobility, could read, and almost none could write. But as soon as Scotland had thrown off the Romish yoke, or rather, while she was struggling for life with ‘the man of sin,’ and the faggots were scarcely quenched in the grass market of Edinburgh, the Reformers were busily employed in maturing a plan for the universal diffusion of letters throughout the country. They rightly judged, that to eradicate the errors of Popery, and instil the faith of the gospel into the hearts of the rising generation, the establishment of schools under pious teachers was essential. How anxious they were to see a school-house planted by the side of every kirk, and to make sound learning the hand-maid of pure religion, is strikingly manifest in […] the ‘First Book of Discipline,’ drawn up by Knox and his immortal compeers, and presented to the nobility in 1560 – almost three centuries ago.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, p. 304</span></figcaption>

<blockquote><p>Little children, it is the last hour; and as you have heard that the Antichrist is coming, even now many antichrists have come, by which we know that it is the last hour. (1 John 2:18)

John Calvin rejects the notion of a futuristic interpretation of antichrist, arguing that the office belongs to the papacy:

As ye have heard that antichrist will come. He speaks as of a thing well known. We may hence conclude that the faithful had been taught and warned from the beginning respecting the future disorder of the Church, in order that they might, carefully keep themselves in the faith they professed, and also instruct posterity in the duty of watchfulness. For it was God’s will that his Church should be thus tried, lest any one knowingly and willingly should be deceived, and that there might be no excuse for ignorance. But we see that almost the whole world has been miserably deceived, as though not a word had been said about Antichrist.

Moreover, under the Papacy there is nothing more notorious and common than the future coming of Antichrist; and yet they are so stupid, that they perceive not that his tyranny is exercised over them. Indeed, the same thing happens altogether to them as to the Jews; for though they hold the promises respecting the Messiah, they are yet further away from Christ than if they had never heard his name; for the imaginary Messiah, whom they have invented for themselves, turns them wholly aside from the Son of God; and were any one to shew Christ to them from the Law and the Prophets, he would only spend his labour in vain. The Popes have imagined an Antichrist, who for three years and a half is to harass the Church. All the marks by which the Spirit of God has pointed out Antichrist, clearly appear in the Pope; but the triennial Antichrist lays fast hold on the foolish Papists, so that seeing they do not see. Let us then remember, that Antichrist has not only been announced by the Spirit of God, but that also the marks by which he may be distinguished have been mentioned.

Even now are there many antichrists. This may seem to have been added by way of correction, as they falsely thought that it would be some one kingdom; but it is not so. They who suppose that he would be only one man, are indeed greatly mistaken. For Paul, referring to a future defection, plainly shows that it would be a certain body or kingdom. (2 Thess. 2:3.) He first predicts a defection that would prevail through the whole Church, as a universal evil; he then makes the head of the apostasy the adversary of Christ, who would sit in the temple of God, claiming for himself divinity and divine honours. Except we desire wilfully to err, we may learn from Paul’s description to know Antichrist. That passage I have already explained; it is enough now touch on it by the way.

But how can that passage agree with the words of John, who says that there were already many antichrists? To this I reply, that John meant no other thing than to say, that some particular sects had already risen, which were forerunners of a future Antichrist; for Cerinthus, Basilides, Marcion, Valentinus, Ebion, Arrius, and others, were members of that kingdom which the Devil afterwards raised up in opposition to Christ. Properly speaking, Antichrist was not yet in existence; but the mystery of iniquity was working secretly. But John uses the name, that he might effectually stimulate the care and solicitude of the godly to repel frauds.

But if the Spirit of God even then commanded the faithful to stand on their watch, when they saw at a distance only signs of the coming enemy, much less is it now a time for sleeping, when he holds the Church under his cruel and oppressive tyranny, and openly dishonours Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 190-1.</span></figcaption>

<blockquote><p>In the midst of distinguishing biblical penal servitude from American slavery, the Synod of the Reformed Presbyterian Church of Scotland argued that the moral-judicial laws would form the basis for the civil codes of Christian nations during the church’s latter-day glory:

Those Hebrews alone were subjected to the servitude prescribed who had been convicted of some moral offence. There were especially, two crimes that were visited with this form of punishment – theft, for which they could make restitution, and the contraction of debt which they were unable to pay. How different the way which you act! It is not persons who have been guilty of offences deserving punishment, at the hand of the civil courts, that you are bringing into slavery, or keeping in it. Were you to seize upon all the incorrigible thieves, and all the fraudulent bankrupts that you could find in the Union, and carry them off to the plantations, to perform the labours you now exact from unoffending Africans, there would have been no ground for a charge of injustice. We would rather rejoice in your reviving the spirit of that sacred jurisprudence which was given in the volume of revelation by the Israelites, and which, we have no doubt, will yet furnish, in its great moral principles, the basis of that high judicial code which christian nations shall enjoy, when God will “make their officers peace, and their exactors righteousness.</p></blockquote>

</figure><figure class="quote" id="q-9dde05490c" data-kw="">
<blockquote><p>But though this has been said with reference to what is here handled, yet we may hence draw a general truth, — that no government is to be set up in the Church by the will of men, but that we are to wait for the command of God, and also that we ought to follow a certain rule in electing ministers, so that no one may intrude according to his own humour. Both these things ought to be distinctly noticed: for the Apostle here speaks not of persons only, but also of the office itself; nay, he denies that the office which men appoint without God’s command is lawful and divine. For as it appertains to God only to rule his Church, so he claims this right as his own, that is, to prescribe the way and manner of administration. I hence deem it as indisputable, that the Papal priesthood is spurious; for it has been framed in the workshop of men. God nowhere commands a sacrifice to be offered now to him for the expiation of sins; nowhere does he command priests to be appointed for such a purpose. While then the Pope ordains his priests for the purpose of sacrificing, the Apostle denies that they are to be counted lawful priests; they cannot therefore be such, except by some new privilege they exalt themselves above Christ, for he dared not of himself to take upon him this honour, but waited for the command of the Father. […] It hence appears that the greatest defect is the character of the office itself, that is, when men of themselves invent what God has never commanded. The less endurable then are those Romish sacrificers, who prattle of nothing but their own titles, that they may be counted sacred, while yet they have chosen themselves without any authority from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 116-17.</span></figcaption>

</figure><figure class="quote" id="q-bf179d3ba9" data-kw="">
<blockquote><p>Her ministry should be learned and pious. Without the former, they will only betray, through ignorance, their cause into the hands of the enemy; without the latter, they will pollute the sacred sanctuary.

Consider, for a moment, what a ridiculous figure the ambassador sent to negotiate with a foreign nation would make, who could not read his master’s commission. Would such an one be qualified to be an ambassador to an earthly potentate? Is not the negotiation of the King of kings much more important than the adjustment of the differences between states and empires?

When Christ called his ministers in an extraordinary manner, he gave them extraordinary qualifications: and among these we find the gift of tongues. In 1 Tim. 1:7, those are severely reprehended, who presume to enter on an office without due qualifications: “desiring to be teachers of the law, yet understanding neither what they say, nor whereof they affirm.” Such are the clouds of illiterate, methodistic locusts which darken the horizon of these States. Without abilities, natural or acquired, they pour forth like torrents, over the face of the earth, and lead aside the simple and unwary. The infuriated zeal with which they propagate their poisonous doctrines, resembles much the character of the Scribes and Pharisees, mentioned, Matt. 23:15: “Who compass sea and land to make one proselyte, and when he is made, he is rendered twofold more the child of hell than themselves.”

Without a due measure of learning, how can they meet the cavillings of deists and crafty impostors, and so act the part of an evangelist, required, Tit. 1:9, namely, to be able to convince the gainsayers, and put adversaries to silence?</p></blockquote>

</figure><figure class="quote" id="q-23a2ba3197" data-kw="">
<blockquote><p>It must not be omitted that princes are not only referred to in holy writings as deacons or ministers of God, but also as pastors. Ezekiel complained heavily of this, for these pastors cruelly and perversely fed the people [Ezekiel 34]. Homer called his king Agamemno, “shepherd of the people”. These pastors should not behave like soldiers or mercenaries, oppressing and skinning the people, but they should serve as shepherds. Princes are called fathers, for the Romans called their senators patres conscripti, “enlisted fathers.” Nor was there a greater or more ancient honour in the Commonwealth than to be called pater patriae, “father of the homeland.” Therefore, the divine commandment “Honour your father and your mother” must also apply to princes, who should give paternal adoration in return [Exodus 20:12]. Princes should never forget that they do not rule over beasts but over men, and that they themselves are also men. They should therefore be much better and superior to those men whom they rule. Otherwise, they are not fit to rule. We do not give any sheep command over the other sheep. It is given to a ram, and then to a shepherd above him. Just as a shepherd rules the sheep, so is a magistrate commissioned to rule his people. Therefore, magistrates should surpass their people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-3beecfb726" data-kw="">
<blockquote><p>Often in religious history, ostensible theological “orthodoxy” has been used as a cloak for maliciousness. This is nowhere more evident than in the proslavery advocates among the Old School Presbyterians in antebellum America; although there were some who did not bow the knee to Baal on this issue, nevertheless, the position of Old School Presbyterians on slavery was often a disgrace to the Reformed faith (this was partly due to the Voluntaryism, which often led to an ungodly silence on political matters). The American Covenanter, James M. Willson, describes how little they did for the cause of emancipation and also chides the Free Church of Scotland for having fellowship with such a denomination:

In the Old School, of late years, the subject [abolition] is nearly unheard of. It has, as a body, no concern for the liberties of the coloured race. Its voice is never lifted up in condemnation and warning. Even while politicians are denouncing the system all around them as an infraction of God’s law, and a wholesale violation of Christian charity, this church “passes by on the other side.” I know of no body of professing Christians, so hopelessly wedded to this monstrous system of wrong as the Old School Presbyterians. And you will allow me to say, that a generation will not repair the injury done to the cause of human rights by the lukewarm course of the Free Church, in their late correspondence with this denomination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-m-willson.html">James M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Monitor and Missionary Chronicle of the Reformed Presbyterian Church in Ireland, May 1849, p. 437.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-71c0dc2498" data-kw="">
<blockquote><p>In 1834 one of the Belfast newspapers contained the following announcement of the opening of a new covenanting meeting-house in the town. The newspaper was Anglican and politically conservative in outlook, yet it recognised the liberality of the Covenanters:

The new Meeting-house of the Second Congregation of the Reformed Presbyterians, commonly called Covenanters, lately erected in South College-street, in this town, is to be opened for public worship, on Sunday next, at two o’clock afternoon. The congregation, although small, have very spiritedly contributed nearly one-half the cost of the building of this plain, but very neat place of worship. It is not, we believe generally known that the Covenanters support their own poor, and they also very liberally contribute to works of general benevolence. They receive no aid from Government to assist in paying their Clergymen. […]</p></blockquote>

<blockquote><p>When the Ten Year’s Conflict over state-interference in the Church of Scotland was at its height, eventually resulting in the Disruption and the formation of the Free Church in 1843, the Scottish Reformed Presbyterian Synod issued a number of resolutions at its meeting in Glasgow on 18 May 1842. One of these resolutions pointed out that the current conflict had its roots in the failure of the Glorious Revolution of 1688-9 to live up to the attainments of the Second Reformation:

That besides the objectionable course pursued in the Revolution Settlement with respect to the calling of Ministers, this Synod continue to protest against it as they have heretofore done, inasmuch as it is Erastian in its origin, inconsistent with the obligation of our National Covenants and the Divine right of Presbyterian Church Government, and leaves the whole of the Second Reformation both in Church and State under the condemnation of the Acts Recissory; while the Act of Union not only sanctioned the iniquitous repeal of that glorious work, but brought Scotland under a direct obligation permanently and inviolably to preserve in England the opposite system of Prelacy. And the Synod hold it to be an imperative duty of the Church of Christ, whatever course Statesmen choose to take, faithfully and honestly to homologate the attainments and engagements of the Second Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/londonderry-standard.html">Londonderry Standard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Standard</cite>, 1 June 1842.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-a031b28189" data-kw="">
<blockquote><p>Thomas Cartwright, the early Presbyterian Puritan, helps us to understand how to apply the judicial laws of the Old Testament today. The moral-judicials (i.e. punishment of idolaters) simply apply today, as they are natural laws that cannot expire and thus bind all men everywhere (cf. Westminster Confession 19:5). The moral-positive judicials do not literally apply: only the general equity of these judicials is still valid, while the positivistic aspect has expired (cf. WCF 19:4). Below, Cartwright explains the Presbyterian position in distinction to the Prelatic antagonism to the Mosaic judicials:

And as for the judicial law, for as much as there are some of them made in regard of the region where they were given, and of the people to whom they were given, the Prince and the Magistrate keeping the substance and equity of them (as it were the marrow) may change the circumstances of them, as the times, and places, and manners of the people shall require. But to say that any magistrate can save the life of blasphemers, contemptuous and stubborn idolaters, murderers, adulterers, incestuous persons, and such like, which God by his judicial law hath commanded to be put to death, I utterly deny, and am ready to prove, if that pertained to this question. And therefore although the judicial laws are permitted to the discretion of the prince and magistrate, yet not so generally as you seem to affirm, and as I have oftentimes said, that not only must it not be done against the word, but according to the word and by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A reply to an answer made of M. Doctor Whitgift, against the admonition to the parliament</cite>, (Hemel Hempstead, 1573), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thomas Cartwright, the early Presbyterian Puritan, helps us to understand how to apply the judicial laws of the Old Testament today. The moral-judicials (i.e. punishment of idolaters) simply apply today, as they are natural laws that cannot expire and thus bind all men everywhere (cf. Westminster Confession 19:5). The moral-positive judicials do not literally apply: only the general equity of these judicials is still valid, while the positivistic aspect has expired (cf. WCF 19:4). Below, Cartwright explains the Presbyterian position in distinction to the Prelatic antagonism to the Mosaic judicials:

And as for the judicial law, for as much as there are some of them made in regard of the region where they were given, and of the people to whom they were given, the Prince and the Magistrate keeping the substance and equity of them (as it were the marrow) may change the circumstances of them, as the times, and places, and manners of the people shall require. But to say that any magistrate can save the life of blasphemers, contemptuous and stubborn idolaters, murderers, adulterers, incestuous persons, and such like, which God by his judicial law hath commanded to be put to death, I utterly deny, and am ready to prove, if that pertained to this question. And therefore although the judicial laws are permitted to the discretion of the prince and magistrate, yet not so generally as you seem to affirm, and as I have oftentimes said, that not only must it not be done against the word, but according to the word and by it.”

— Thomas Cartwright, , A reply to an answer made of M. Doctor Whitgift, against the admonition to the parliament, (Hemel Hempstead, 1573), p. 22.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThomas+Cartwright%2C+the+early+Presbyterian+Puritan%2C+helps+us+to+understand+how+to+apply+the+judicial+laws+of+the+Old+Testament+today.+The+moral-judicials+%28i.e.+punishment+of+idolaters%29+simply+apply+today%2C+as+they+are+natural+laws+that+cannot+expire+and+thus+bind+all+men+everywhere+%28cf.+Westminster+Confession+19%3A5%29.+The+moral-positive+judicials+do+not+literally+apply%3A+only+the+general+equity+of+these+judicials+is+still+valid%2C+while+the+positivistic+aspect+has+expired+%28cf.+WCF+19%3A4%29.+Below%2C+Cartwright+explains+the+Presbyterian+position+in+distinction+to+the+Prelatic+antagonism+to+the+Mosaic+judicials%3A%0A%0AAnd+as+for+the+judicial+law%2C+for+as+much+as+there+are+some+of+them+made+in+regard+of+the+region+where+they+were+given%2C+and+of+the+people+to+whom+they+were+given%2C+the+Prince+and+the+Magistrate+keeping+the+substance+and+equity+of+them+%28as+it+were+the+marrow%29+may+change+the+circumstances+of+them%2C+as+the+times%2C+and+places%2C+and+manners+of+the+people+shall+require.+But+to+say+that+any+magistrate+can+save+the+life+of+blasphemers%2C+contemptuous+and+stubborn+idolaters%2C+murderers%2C+adulterers%2C+incestuous+persons%2C+and+such+like%2C+which+God+by+his+judicial+law+hath+commanded+to+be+put+to+death%2C+I+utterly+deny%2C+and+am+ready+to+prove%2C+if+that+pertained+to+this+question.+And+therefore+although+the+judicial+laws+are+permitted+to+the+discretion+of+the+prince+and+magistrate%2C+yet+not+so+generally+as+you+seem+to+affirm%2C+and+as+I+have+oftentimes+said%2C+that+not+only+must+it+not+be+done+against+the+word%2C+but+according+to+the+word+and+by+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+%2C+A+reply+to+an+answer+made+of+M.+Doctor+Whitgift%2C+against+the+admonition+to+the+parliament%2C+%28Hemel+Hempstead%2C <blockquote><p>Speaking before the General Assembly of the Free Church of Scotland in 1849, the Revd Dr Henry Cooke of the Presbyterian Church in Ireland reminded his Scottish brethren that Ulster Presbyterians originally adhered to the Solemn League and Covenant:

Permit me then, in the first place, to remind you of what you know full well, that our origin as a Church is from you. We owe to the honoured names of Blair, and Livingstone, and Cunningham, and Hamilton – those great and distinguished names – the foundation of our Church, as in a great degree to those names you give the honour of your own. (Hear.)

In the second place, permit me to remind you that our Church grew up as a Church under the same Solemn League and Covenant with yours. I examined this day, in one of your houses of record, an original of one of those documents signed by the mighty of your land. Under the name Solemn League and Covenant with yourselves, the Presbyterians of Ulster grew up by the blessings of Almighty God …</p></blockquote>

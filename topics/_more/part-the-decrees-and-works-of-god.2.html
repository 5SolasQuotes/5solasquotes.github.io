</figure><figure class="quote" id="q-3674505d20" data-kw="">
<blockquote><p>Now you are to meditate how God brought forth all his works in the space of six days, before He finished them; He did not create the world all at once, but took time for the creation of it, to teach us to take special time duly and orderly to consider and meditate on the works of God: if He that could have made the Heavens and the earth, the sun, moon and stars, and all creatures, in a moment; yet it pleased Him to take time for the creating of them; this should teach us to select some space of time for the meditation of them: We must not think it enough to look upon them at one view, but to pass from part to part, from one creature to another, and in every creature to admire the workmanship, power, wisdom and goodness of the Creator, as we are taught, Ps. 92:4-5… which psalm as the title tells us, was a meditation penned for the Sabbath day: therefore I say, God would spend six days about the creation of the world, whereas He might have done it in an instant, and in a moment of time, to the end that we might the better meditate upon it from point to point, for which purpose He presently ordained the Sabbath… The eternal power and Godhead is seen by the things that are made; but most of us have great cause to be ashamed, that we have spent so little time in meditating on the works of God; yea who can truly say he has spent so much time in meditating on God’s works as God spent in making them? How few are there that have set apart so much time ever since they were born, as (if it were all laid together) will make up six days one entire week? What a shame is it for man whom God made on purpose to view his works, and by them to glorify Him, not to spend so much time in meditating upon them as God spent in making of them;</p></blockquote>

<blockquote><p>The time of their [the devils’] standing in their primitive state is conceived to be very short; for their creation (though the Socinians hold it was long before) must fall within the compass of six days, for in that space the Scripture tells us God made heaven and earth, and all things therein: and therefore within the space of six days He created the angels also. Some refer their creation to the first day’s work, others to the fourth day: and it’s probably thought that Adam’s continuance in innocency was not much above one day, and yet even then there were fallen Angels to tempt him: so that their glorious and blessed state could not, according to the computation, last above six or seven days, such a speedy issue did God make with them upon their very first sin…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Discourses or Sermons</cite>, … (London: 1693), Of Pardon &amp; Forgiveness of Sin, etc. bk. 5, pp. 29-30</span></figcaption>

</figure><figure class="quote" id="q-b02372010d" data-kw="">
<blockquote><p>2 Pet. 3:8, ‘One day is with the Lord as a thousand years, and a thousand years as one day.’ When he says, ‘a thousand years’, he means all years, all time put together, is but as one day to the Lord. A day was the first distinction of time; the first perfect time that was created, was a day: now put a thousand years together, it is but as one day to the Lord; All times and one time are all one to him who inhabits eternity. In Ps. 90:6, it is, a thousand years are but as yesterday, which notes all time past, as Peter notes, all time to come, is, but as one day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1647), on ch. 9:3, pp. 151</span></figcaption>

</figure><figure class="quote" id="q-c9b63a1088" data-kw="">
<blockquote><p>…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.”

</figure><figure class="quote" id="q-e60a53b20b" data-kw="">
<blockquote><p>Even though Calvin, Ames, and the authors of the Westminster Standards, with few exceptions, if any, undoubtedly understood the days to be ordinary days, there is no ground for supposing that they intended to exclude any and all other views, in particular the view that the days may be longer. Such views are outside their purview; their concern, in fact, moves in the opposite direction, against the instantaneous view that denies any length. This point bears emphasizing within the context of the current debate about the days of Genesis. To establish that the Standards mandate the six 24 hour days view requires more than demonstrating that the Divines, perhaps even to a man, held that the days were ordinary days. To demonstrate that of itself establishes nothing. What needs also to be shown, which we believe cannot be shown, is that they intended to exclude the views that the days are longer in some respect or that they represent a literary framework.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-theological-seminary-east-faculty.html">Westminster Theological Seminary, East, Faculty</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Theological Seminary &amp; the Days of Creation</cite>, (1999), p. 3</span></figcaption>

e</a></div>
</figure><figure class="quote" id="q-8978241b0b" data-kw="">
<blockquote><p>In his great work, The Hexaëdemeron (1230–35), Grossteste attempts a synthesis of all major interpretations hitherto given in the church… Here, in this medieval scholastic bishop, lie the roots of what eventually became known as the framework hypothesis.</p></blockquote>

</figure><figure class="quote" id="q-e9f4985e54" data-kw="">
<blockquote><p>(1) Before the Westminster Assembly there were a variety of interpretations of Genesis 1 and its days. If the text of Genesis is so clear-cut why did the church down the centuries not see it that way? Does that not say something not only about the interpreters but also the text? Claims that a literal reading of the days of Genesis 1 is obvious fall down when the history of interpretation is taken into consideration. (2) We will be wise to heed the warnings Augustine and Calvin give on the difficulty of interpreting this chapter, and so beware of dogmatic claims they themselves did not advance. Jerome pointed to the Jewish rabbis’ refusal to let anyone under thirty interpret it. Creation transcends our knowledge and experience. A heavy dose of medicine from Job 38:1ff is in order. As with any other passage, Genesis 1 must not be interpreted in isolation but in the context of the whole of Scripture. (3) Until the mid-sixteenth century the interpreters we cited were all abreast of the philosophy and science of their day, and often made use of it in biblical interpretation. That we reject many of their scientific beliefs is because of our own scientific knowledge. That we place implicit faith in the laws of gravity is due to what we know scientifically, rather than from the Bible. So far I, for one, have found this reliable! Calvin allows and supports scientific work. He indicates Genesis is of a different literary genre than a science text book. (4) The Reformed tradition of the sixteenth century interpreted creation theologically. The classic Reformed creeds consider it in the context of the doctrine of God, as an ex nihilo work of the Trinity. In so doing, they affirm their continuity with the historic teaching of the church. The question of the days of creation was not even a matter of discussion… Its absence is striking. It was never a matter of confessional significance…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“‘In the Space of Six Days’: the Days Of Creation From Origen to the Westminster Assembly’ in Westminster Theological Journal 61:2</cite>, (Fall, 1999), pp. 149-74 | Summary Conclusions:, p. 174</span></figcaption>

</figure><figure class="quote" id="q-c0d8a6778c" data-kw="">
<blockquote><p>The issue is not whether any of the Westminster Divines held a view of long ages or of a literary framework, as Hall repeatedly claims, but whether the confessional language requires a view of six 24-hour days and nothing else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70, p. 261</span></figcaption>

</figure><figure class="quote" id="q-62d6ab6209" data-kw="">
<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70, pp. 263, 265-66</span></figcaption>

<div class="actions"><button class="copy" data-copy="“With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.”

<blockquote><p>Of the remaining Westminster divines who explicitly supported six 24-hour days of creation, some were very explicit on additional details, claiming more than the Scriptures make clear and certainly more than the Westminster Standards say.</p></blockquote>

<blockquote><p>The charges I have still to mention are of minor importance. The first of them is the assertion, so often and confidently propounded of late, that the Confession represents the creation of the world as having taken place in six ‘natural or literal days,’ which almost all orthodox divines now grant that it did not. But the whole ground for the assertion is furnished by the words ‘natural or literal’ which the objectors themselves insert or assume. The authors of the Confession, as Dr. A. A. Hodge has well observed (Commentary on the Confession of Faith, p. 82), simply repeat the statements of Scripture in almost identical terms, and any interpretation that is fairly applicable to such passages of Scripture as Gen. 2:3 and Exodus 20:2, is equally applicable to the words of the Confession. It is quite true, as he has shown, that since the Confession was composed, many facts of science previously unknown have been brought to light respecting the changes through which our globe and probably the stellar universe had passed before the establishment of the present order of things, and that new arguments have thus been furnished against interpreting the days mentioned in the above passages of Scripture as literal days. But it is a mistake to suppose that this method of interpreting the days in these passages originated in modern times, and was altogether unknown to the men who framed our Confession. To prove it a mistake it is not necessary to have recourse to the ingenious conjecture that some of the Cambridge men in the Assembly may have been acquainted with the manuscript work of Dean [John] Colet [d. 1519], preserved in their archives, and only given to the public in our own time, in which the figurative interpretation of the days of creation is maintained.¹ ¹ Colet’s Letters to Radulpluis oit the Mosaic Account of the Creation, with translation and notes by J. H. Lupton. 1876 [pp. 3-28]. There is no lack of evidence, in works published before the meeting of the Assembly, and familiar to several of its members, to show that the figurative interpretation had long before Dean Colet’s time commended itself to several eminent scholars and divines with whose works members of the Assembly were acquainted. If there was one Jewish scholar with whose writings such men as Lightfoot, Selden, Gataker, Seaman, and Coleman were more familiar than another, it was Philo of Alexandria [d. c. 50]; and Philo has not hesitated to characterise it as ‘rustic simplicity, to imagine that the world was created in six days, or, indeed, in any clearly defined space of time.’ Augustine,² the great Latin doctor, with whose works several of the Westminster divines were far better acquainted than most of their successors, in his Literal Commentary on Genesis, maintains that the days of the creation-week were far different from (longe dispares), and again, very unlike to (multum impares) those that now are in the earth. ² Migne’s edition of Augustine, De Genesi ad literam, iv.27. Procopius [d. 565], a Greek writer not unknown to some of the Westminster divines, teaches that the number of six days was assumed not as a mark of actual time, but as a manner of teaching the order of creation; while in certain commentaries in that age, attributed to the Venerable Bede [d. 735], and largely read in England, though now deemed spurious, a similar opinion is said to be found.³ ³ Most of these testimonies are referred to, and the opinion they express is admitted to be probabilis [probable], in the sense his sect used that term, by Sixtus Senensis [a Romanist, d. 1569] in his Bibliotheca Sancta, p. 422. The figurative interpretation therefore of the six days of creation is no make-shift of hard-pressed theologians in the nineteenth century. It was held by respectable scholars and divines, from early times, and was known to the framers of our Confession; and had they meant deliberately to exclude it they would have written not six days, but six natural or literal days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-mitchell.html">Alexander Mitchell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Assembly: Its History &amp; Standards</cite>, (1884), pp. 394-97</span></figcaption>

<blockquote><p>It gives precedence to the person and work of Christ over election and the covenant, so that Christ is isolated from these contexts and cannot vicariously atone for his people, since there is no fellowship between him and us.</p></blockquote>

</figure><figure class="quote" id="q-41dcce4d62" data-kw="">
<blockquote><p>First, if we seek God’s fatherly mercy and kindly heart, we should turn our eyes to Christ, on whom alone God’s Spirit rests [cf. Matt. 3:17]. If we seek salvation, life, and the immortality of the Heavenly Kingdom, then there is no other to whom we may flee, seeing that he alone is the fountain of life, the anchor of salvation, and the heir of the Kingdom of Heaven. Now what is the purpose of election but that we, adopted as sons by our Heavenly Father, may obtain salvation and immortality by his favor? No matter how much you toss it about and mull it over, you will discover that its final bounds still extend no farther. Accordingly, those whom God has adopted as his sons are said to have been chosen not in themselves but in his Christ [Eph. 1:4]; for unless he could love them in him, he could not honor them with the inheritance of his Kingdom if they had not previously become partakers of him. But if we have been chosen in him, we shall not find assurance of our election in ourselves; and not even in God the Father, if we conceive him as severed from his Son. Christ, then, is the mirror wherein we must, and without self-deception may, contemplate our own election. For since it is into his body the Father has destined those to be engrafted whom he has willed from eternity to be his own, that he may hold as sons all whom he acknowledges to be among his members, we have a sufficiently clear and firm testimony that we have been inscribed in the book of life [cf. Rev. 21:27] if we are in communion with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Westminster Press, 1961), 3.24.5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/election.html">Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“First, if we seek God’s fatherly mercy and kindly heart, we should turn our eyes to Christ, on whom alone God’s Spirit rests [cf. Matt. 3:17]. If we seek salvation, life, and the immortality of the Heavenly Kingdom, then there is no other to whom we may flee, seeing that he alone is the fountain of life, the anchor of salvation, and the heir of the Kingdom of Heaven. Now what is the purpose of election but that we, adopted as sons by our Heavenly Father, may obtain salvation and immortality by his favor? No matter how much you toss it about and mull it over, you will discover that its final bounds still extend no farther. Accordingly, those whom God has adopted as his sons are said to have been chosen not in themselves but in his Christ [Eph. 1:4]; for unless he could love them in him, he could not honor them with the inheritance of his Kingdom if they had not previously become partakers of him. But if we have been chosen in him, we shall not find assurance of our election in ourselves; and not even in God the Father, if we conceive him as severed from his Son. Christ, then, is the mirror wherein we must, and without self-deception may, contemplate our own election. For since it is into his body the Father has destined those to be engrafted whom he has willed from eternity to be his own, that he may hold as sons all whom he acknowledges to be among his members, we have a sufficiently clear and firm testimony that we have been inscribed in the book of life [cf. Rev. 21:27] if we are in communion with Christ.”

— John Calvin, Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Westminster Press, 1961), 3.24.5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+if+we+seek+God%E2%80%99s+fatherly+mercy+and+kindly+heart%2C+we+should+turn+our+eyes+to+Christ%2C+on+whom+alone+God%E2%80%99s+Spirit+rests+%5Bcf.+Matt.+3%3A17%5D.+If+we+seek+salvation%2C+life%2C+and+the+immortality+of+the+Heavenly+Kingdom%2C+then+there+is+no+other+to+whom+we+may+flee%2C+seeing+that+he+alone+is+the+fountain+of+life%2C+the+anchor+of+salvation%2C+and+the+heir+of+the+Kingdom+of+Heaven.+Now+what+is+the+purpose+of+election+but+that+we%2C+adopted+as+sons+by+our+Heavenly+Father%2C+may+obtain+salvation+and+immortality+by+his+favor%3F+No+matter+how+much+you+toss+it+about+and+mull+it+over%2C+you+will+discover+that+its+final+bounds+still+extend+no+farther.+Accordingly%2C+those+whom+God+has+adopted+as+his+sons+are+said+to+have+been+chosen+not+in+themselves+but+in+his+Christ+%5BEph.+1%3A4%5D%3B+for+unless+he+could+love+them+in+him%2C+he+could+not+honor+them+with+the+inheritance+of+his+Kingdom+if+they+had+not+previously+become+partakers+of+him.+But+if+we+have+been+chosen+in+him%2C+we+shall+not+find+assurance+of+our+election+in+ourselves%3B+and+not+even+in+God+the+Father%2C+if+we+conceive+him+as+severed+from+his+Son.+Christ%2C+then%2C+is+the+mirror+wherein+we+must%2C+and+without+self-deception+may%2C+contemplate+our+own+election.+For+since+it+is+into+his+body+the+Father+has+destined+those+to+be+engrafted+whom+he+has+willed+from+eternity+to+be+his+own%2C+that+he+may+hold+as+sons+all+whom+he+acknowledges+to+be+among+his+members%2C+we+have+a+sufficiently+clear+and+firm+testimony+that+we+have+been+inscribed+in+the+book+of+life+%5Bcf.+Rev.+21%3A27%5D+if+we+are+in+communion+with+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+ed.+John+T.+McNeill%2C+trans.+Ford+Lewis+Battles%2C+The+Library+of+Christian+Classics+%28Westminster+Press%2C+1961%29%2C+3.24.5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41dcce4d62.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41dcce4d62.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/10/calvin-christ-is-the-mirror-of-our-election/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-719e461a18" data-kw="">
<blockquote><p>Thus there are many others today who want to be counted as evangelical theologians and who, so far as their words are concerned, do teach that men are delivered from their sins by the death of Christ. Meanwhile, however, they insult Christ most grievously by distorting and overthrowing His Word in a villainous and wicked manner. In addition, they teach faith in a way that attributes more to love than to faith; for they imagine that God regards and accepts us on account of the love with which we love God and our neighbor after we have already been reconciled. If this is true, then we have no need whatever of Christ. In this way they serve, not the true God but an idol of their own heart—an idol which they have made up for themselves. For the true God does not regard or accept us on account of our love, virtue, or newness of life (Rom. 6:4); He does so on account of Christ. But they raise the objection: “Yet He commands that we love Him with all our heart.” All right, but it does not follow: “God has commanded; therefore we do so.” If we loved God with all our heart, etc., then, of course, we would be justified and would live on account of that obedience, according to the statement (Lev. 18:5): “By doing this a man shall live.” But the Gospel says: “You are not doing this; therefore you shall not live on account of it.” For the statement, “You shall love the Lord,” requires perfect obedience, perfect fear, trust, and love toward God. In the corruption of their nature men neither do nor can produce this. Therefore the Law, “You shall love the Lord,” does not justify but accuses and damns all men, in accordance with the statement (Rom. 4:15): “The Law brings wrath.” But “Christ is the end of the Law, that everyone who has faith may be justified” (Rom. 10:4).</p></blockquote>

</figure><figure class="quote" id="q-b17351ef41" data-kw="">
<blockquote><p>It may press us to admire the grace of God to his children. He cannot satisfy himself in doing good to you, but he must do good to your children too. How should we entertain this with reverence! When God told Abraham, I am thy God, and the God of thy seed, ‘Abraham fell upon his face,’ as humbly adoring the goodness of God, Gen.17:3; so David, when God spake concerning his house and his children: 2 Sam. 7:18, 19, ‘What am I, O Lord, and what is my house, that thou hast brought me hitherto?’ And this was yet a small thing in thy sight, O Lord God; for thou hast spoken also of thy servant’s house for a great while to come;’ he stands wondering at this mercy of God.</p></blockquote>

<blockquote><p>II. By the state of innocence, we mean the first condition of man created after the image of God internal goodness and external happiness. As it abounded in all goods (of the body as well as of the soul) necessary for obtaining true happiness in that state, so it experienced the most holy and agreeable government of God. Hence it consists principally of two parts: the happy condition of man and the federal government of God around him. His happiness arose from the image of God in which he was created. It consisted especially in original righteousness and the immortality and dominion consequent upon it (of which we have spoken before in the Topic on Creation). To it also belonged his liberty, the subject of this question.</p></blockquote>

</figure><figure class="quote" id="q-e3b58928de" data-kw="">
<blockquote><p>If Mr. Baxter go on with his intentions about a tract concerning universal redemption, perhaps we may have these things cleared; and yet, we must tell him beforehand, that if he draw forth nothing on that subject but what is done by Amyraldus, and like things to them, he will give little satisfaction to learned and stable men upon the issue of his undertaking. I shall not presume to take another man’s task out of his hand, especially one’s who is so every way able to go through with it; else I durst undertake to demonstrate that treatise of Amyraldus, mentioned by Mr. Baxter, to be full of weak and sophistical argumentations, absurd contradictions, vain strife of words, and, in sum, to be as birthless a tympanous endeavour as ever so learned a man was engaged in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 10 (Edinburgh: T&amp;T Clark, n.d.), 478–79.</span></figcaption>

<blockquote><p>Canon IV: Before the creation of the world, God decreed in Christ Jesus our Lord according to his eternal purpose (Eph 3:11), in which, from the mere good pleasure of his own will, without any prevision of the merit of works or of faith, to the praise of his glorious grace, to elect some out of the human race lying in the same mass of corruption and of common blood, and, therefore, corrupted by sin. He elected a certain and definite number to be led, in time, unto salvation in Christ, their Guarantor and sole Mediator. And on account of his merit, by the mighty power of the regenerating Holy Spirit, he decreed these elect to be effectually called, regenerated and gifted with faith and repentance. So, indeed, God, determining to illustrate his glory, decreed to create man perfect, in the first place, then permit him to fall, and finally pity some of the fallen, and therefore elect those, but leave the rest in the corrupt mass, and finally give them over to eternal destruction. Canon V: Christ himself is also included in the gracious decree of divine election, not as the meritorious cause, or foundation prior to election itself, but as being himself also elect (I Pet 2:4, 6). Indeed, he was foreknown before the foundation of the world, and accordingly, as the first requisite of the execution of the decree of election, chosen Mediator, and our first born Brother, whose precious merit God determined to use for the purpose of conferring, without detriment to his own justice, salvation upon us. For the Holy Scriptures not only declare that election was made according to the mere good pleasure of the divine counsel and will (Eph 1:5, 9; Matt 11:26), but was also made that the appointment and giving of Christ, our Mediator, was to proceed from the zealous love of God the Father toward the world of the elect. Canon VI: Wherefore, we can not agree with the opinion of those who teach: l) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete. For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is in finitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>

<blockquote><p>30. To what is appeal made to support the nonliteral interpretation? a) To the fact that sun and moon (or rather the rotation of the earth around its axis in relation to the sun) were not yet present. As we know, the length of an ordinary day is determined by this rotation. b) To the indefinite use of the term “day” in other places in Scripture (Gen 2:4; 5:1; 2 Sam 21:12; Isa 11:16), also to the expression “day of the Lord” (= day of judgment) in the prophets, and to Psa 90:4; 2 Pet 3:8. c) To the analogy with other things of God. Here we have to do with God’s days. Now the “things of God” are certainly archetypical (exemplars) for the things of men, but they are not completely identical. Thus we have no right, it is thought, to judge that God‘s days are like the days of men. d) To the fact that the duration of God‘s Sabbath is eternal. That is one of the days here, the seventh day. If the seventh day is not limited to 24 hours, then the six previous days need not be limited to that time span. On these grounds many, including those who are not intent on a reconciliation of the Scripture with science, accept an extraordinary length for the creation days. This includes many church fathers and theologians of the Middle Ages, and, among more recent theologians, even Charles Hodge inclines to this view. 31. What supports the interpretation that takes “day” in its ordinary meaning? a) The entire creation aimed at man as its completion. It is difficult to accept that preparing for this goal took thousands of years. b) All the creation days must have been of the same length. Who can accept, however, that a day on which nothing else occurred than the separation between light and darkness was a day of thousands of years? c) The fact that the sun and moon, as measures of time, were not present, does not mean that there was no time. Already from the beginning God ordained a rhythm and created the light so that it would alternate with the darkness. When later this light was concentrated in the sun and the other bodies, we are told nothing about it being only then that the 24-hour day began. There was no change at that point. Therefore we have a reason for assuming that before that time the rotation of the earth took place at the same speed and that light was so positioned as was necessary for an alternation of day and night within 24 hours. d) From v. 14 on the days are unquestionably ordinary days of 24 hours. There God says emphatically of the lights in the expanse that they will be “for days and years.” One might rescue the nonliteral view by assuming for the fourth to the sixth days an extremely slow rotation of the earth about its axis, but what about plant life during those long nights? The night has to have been half of the full day. e) It is not accurate to say that the days are God‘s days. God ad intra does not have days. Creation is an act proceeding outwardly from God. Appealing to the eternal Sabbath is also of no avail. Although God’s Sabbath is certainly endless, that cannot be said of the first Sabbath (after the six-day creation) for mankind. f) The use of the term “day” in Gen 9:4 is figurative, but in Gen 1 figurative language is not used. What one must show is another place in Scripture where a first, a second, a third day, etc., are just as sharply separated and nevertheless describe periods of time. The “day of the Lord” in the prophets refers to a specific day, that is, a day on which the Lord appears for judgment, even though His judgment may last longer than one day. 32. Must someone who holds that the days are long time periods be regarded a heretic? No, in this sense the question is not an essential one. It would only become so if it provided the occasion for granting priority in principle over the Word of God to the so-called results of science.</p></blockquote>

— Geerhardus Vos, Reformed Dogmatics: A System of Christian Theology Single Volume Edition">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C30.+To+what+is+appeal+made+to+support+the+nonliteral+interpretation%3F+a%29+To+the+fact+that+sun+and+moon+%28or+rather+the+rotation+of+the+earth+around+its+axis+in+relation+to+the+sun%29+were+not+yet+present.+As+we+know%2C+the+length+of+an+ordinary+day+is+determined+by+this+rotation.+b%29+To+the+indefinite+use+of+the+term+%E2%80%9Cday%E2%80%9D+in+other+places+in+Scripture+%28Gen+2%3A4%3B+5%3A1%3B+2+Sam+21%3A12%3B+Isa+11%3A16%29%2C+also+to+the+expression+%E2%80%9Cday+of+the+Lord%E2%80%9D+%28%3D+day+of+judgment%29+in+the+prophets%2C+and+to+Psa+90%3A4%3B+2+Pet+3%3A8.+c%29+To+the+analogy+with+other+things+of+God.+Here+we+have+to+do+with+God%E2%80%99s+days.+Now+the+%E2%80%9Cthings+of+God%E2%80%9D+are+certainly+archetypical+%28exemplars%29+for+the+things+of+men%2C+but+they+are+not+completely+identical.+Thus+we+have+no+right%2C+it+is+thought%2C+to+judge+that+God%E2%80%98s+days+are+like+the+days+of+men.+d%29+To+the+fact+that+the+duration+of+God%E2%80%98s+Sabbath+is+eternal.+That+is+one+of+the+days+here%2C+the+seventh+day.+If+the+seventh+day+is+not+limited+to+24+hours%2C+then+the+six+previous+days+need+not+be+limited+to+that+time+span.+On+these+grounds+many%2C+including+those+who+are+not+intent+on+a+reconciliation+of+the+Scripture+with+science%2C+accept+an+extraordinary+length+for+the+creation+days.+This+includes+many+church+fathers+and+theologians+of+the+Middle+Ages%2C+and%2C+among+more+recent+theologians%2C+even+Charles+Hodge+inclines+to+this+view.+31.+What+supports+the+interpretation+that+takes+%E2%80%9Cday%E2%80%9D+in+its+ordinary+meaning%3F+a%29+The+entire+creation+aimed+at+man+as+its+completion.+It+is+difficult+to+accept+that+preparing+for+this+goal+took+thousands+of+years.+b%29+All+the+creation+days+must+have+been+of+the+same+length.+Who+can+accept%2C+however%2C+that+a+day+on+which+nothing+else+occurred+than+the+separation+between+light+and+darkness+was+a+day+of+thousands+of+years%3F+c%29+The+fact+that+the+sun+and+moon%2C+as+measures+of+time%2C+were+not+present%2C+does+not+mean+that+there+was+no+time.+Already+from+the+beginning+God+ordained+a+rhythm+and+created+the+light+so+that+it+would+alternate+with+the+darkness.+When+later+this+light+was+concentrated+in+the+sun+and+the+other+bodies%2C+we+are+told+nothing+about+it+being+only+then+that+the+24-hour+day+began.+There+was+no+change+at+that+point.+Therefore+we+have+a+reason+for+assuming+that+before+that+time+the+rotation+of+the+earth+took+place+at+the+same+speed+and+that+light+was+so+positioned+as+was+necessary+for+an+alternation+of+day+and+night+within+24+hours.+d%29+From+v.+14+on+the+days+are+unquestionably+ordinary+days+of+24+hours.+There+God+says+emphatically+of+the+lights+in+the+expanse+that+they+will+be+%E2%80%9Cfor+days+and+years.%E2%80%9D+One+might+rescue+the+nonliteral+view+by+assuming+for+the+fourth+to+the+sixth+days+an+extremely+slow+rotation+of+the+earth+about+its+axis%2C+but+what+about+plant+life+during+those+long+nights%3F+The+night+has+to+have+been+half+of+the+full+day.+e%29+It+is+not+accurate+to+say+that+the+days+are+God%E2%80%98s+days.+God+ad+intra+does+not+have+days.+Creation+is+an+act+proceeding+outwardly+from+God.+Appealing+to+the+eternal+Sabbath+is+also+of+no+avail.+Although+God%E2%80%99s+Sabbath+is+certainly+endless%2C+that+cannot+be+said+of+the+first+Sabbath+%28after+the+six-day+creation%29+for+mankind.+f%29+The+use+of+the+term+%E2%80%9Cday%E2%80%9D+in+Gen+9%3A4+is+figurative%2C+but+in+Gen+1+figurative+language+is+not+used.+What+one+must+show+is+another+place+in+Scripture+where+a+first%2C+a+second%2C+a+third+day%2C+etc.%2C+are+just+as+sharply+separated+and+nevertheless+describe+periods+of+time.+The+%E2%80%9Cday+of+the+Lord%E2%80%9D+in+the+prophets+refers+to+a+specific+day%2C+that+is%2C+a+day+on+which+the+Lord+appears+for+judgment%2C+even+though+His+judgment+may+last+longer+than+one+day.+32.+Must+someone+who+holds+that+the+days+are+long+time+periods+be+regarded+a+heretic%3F+No%2C+in+this+sense+the+question+is+not+an+essential+one.+It+would+only+become+so+if+it+provided+the+occasion+for+granting+priority+in+principle+over+the+Word+of+God+to+the+so-called+results+of+science.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Reformed+Dogmatics%3A+A+System+of+Christian+Theology+Single+Volume+Edition&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52eb2eb6b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52eb2eb6b4.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/12/geerhardus-vos-on-the-creation-days/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Canon V: Christ himself is also included in the gracious decree of divine election, not as the meritorious cause, or foundation prior to election itself, but as being himself also elect (I Pet 2:4, 6). Indeed, he was foreknown before the foundation of the world, and accordingly, as the first requisite of the execution of the decree of election, chosen Mediator, and our first born Brother, whose precious merit God determined to use for the purpose of conferring, without detriment to his own justice, salvation upon us. For the Holy Scriptures not only declare that election was made according to the mere good pleasure of the divine counsel and will (Eph 1:5, 9; Matt 11:26), but was also made that the appointment and giving of Christ, our Mediator, was to proceed from the zealous love of God the Father toward the world of the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-h-heidegger-and-francis-turretin.html">J. H. Heidegger and Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, (1675)</span></figcaption>

<blockquote><p>Creation is a work of God, by which he has brought forth all creatures of nothing (Gen 1.2) A creature is whatsoever has been made by God of nothing. Now all the creatures of God were created very good. Therefore all nature, as it is nature, is good because it is the work of God. Of these creatures some are created according to the image of God; some are not. The image of God is that dignity and excellency in which the reasonable creatures, begin created like unto God, do excel other creatures. Of this image of God there are two parts: perfect reason and perfect blessedness. Perfect reason is is a part of God’s image, by which the reasonable creature does more expressly carry the image of God his creator, while by a certain divine force it knows plainly things without error, as they are, and does will and choose no other tuning that which does please God. And that perfect reason consists both in the mind and in the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Partitiones theologiae translated as The Substance of the Christian Religion</cite>, (London, 1595). Spelling modernized.</span></figcaption>

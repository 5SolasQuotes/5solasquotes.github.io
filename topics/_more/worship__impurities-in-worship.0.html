<blockquote><p>III Rule. Every man must measure himself by his own strength and do nothing beyond his ability. This rule is set down, though expressed in other terms, Rom. 12:3, ‘No man must presume to understand above that which is meet to understand, but ought to be wise according to sobriety as God hath dealt to every man the measure of faith.’ An example of the transgression of this rule we have in David’s three worthies who break into the host of the Philistines to fetch David the king water from the well of Bethleham, 2 Sam. 23:16, which act of theirs was a rash enterprise and such a one as David himself condemns in that chapter, because they went beyond their strength to encounter with a whole garrison of men, they being themselves but few, namely three in number. IV Rule. We must distinguish between the necessary works of our callings that pertain to us and other works that are out of our callings and pertain not unto us: and we must do the other though we leave these undone. This rule is propounded in 1 Thess. 4:11, ‘Meddle with your own business.’ That is, do the necessary works of your callings that belong to you though you leave the other for the time undone. The contrary to it is to live or to behave himself inordinately, 2 Thess. 3:7. And we have an example of the transgression hereof in Peter, Jn. 21:21, whom when Christ had commanded to follow Him, he would needs ask Him what John should do; Christ gives him this answer: ‘What is that to thee?’ In which words He teaches that not only Peter, but also every man must attend upon the necessary and proper works of his own vocation and not deal with other men’s business, which, because Peter did, he is by that answer secretly reproved and justly condemned of curiosity in that behalf. … VIII Rule. We must give place to the sway of the times wherein we live so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times, but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul, who, living among the heathen (Acts 19:10), was constrained to speak as they; and therefore he says that he departed in a ship to Rome whose badge was [of the heathen gods] Castor and Pollux. (Acts 28:11) Again, he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but only in general against false gods, saying that ‘they be no gods that are made with hands,’ [ch. 19] v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did. Again, in the primitive Church, the apostles for the weakness of the Jews, did yield to the use of circumcision [Acts 16:1-5] and permitted abstinence from blood and that which was strangled, etc. so far forth as it stood with pure religion and good conscience: and if they had not so done they should not have won the Jews to the faith as they did. IX Rule. If we cannot do the good things that we desire in that exquisite manner that we would, we must content ourselves with the mean; and in things which are good, and to be done, it is the safest course to satisfy ourselves in doing the less, least in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action. It is a good and wise counsel of the Preacher to this purpose, Eccl. 7:16, ‘Be not just overmuch:’ and his meaning may be this; Be not too strict or curious in effecting that which thou intendest, exactly, when thou canst not; but rest contented in this, that thou hast done thine endeavor; and take to the less when the greater cannot be effected. In some countries Popish images erected in Churches do stand undefaced. The good desire of the people is that they may be pulled down, but this cannot be brought to pass. What then are they to do in this case? They must not grow to extremity and pull them down themselves, but they must entreat the lawful magistrate for their removal and pray to God that He may be moved so to do; and in the meantime, rest content with that [which] they have done and wait the magistrates’ pleasure. In the judicial law, by reason of the hardness of the Jews’ hearts, sundry sins could not utterly be taken away, as divorcements, polygamy, usury. Hereupon the Lord makes a law of toleration, without approbation, and did not remove them quite away, for that was not possible in regard of man for the time; but [He] restrained the evil that could not be quite off and abolished otherwise. And herein appeared the great wisdom of God in making a law not to allow of, nor yet utterly to take away, but to moderate the practice of these sins in the Jews, for the hardness of their hearts. In like manner, in this our land there is the practice of usury, a sin that cannot, nor ever shall be rooted out utterly. For this cause the States of this [English] kingdom have out of their wisdom provided a Law for the toleration thereof after a sort, and that upon special cause. For if the magistrate should have enacted a Law utterly to abolish it, it would before this (in likelihood) have grown to great extremity. The same was the practice of the apostles in their times, who yielded to bear with the use of circumcision for a time when they could not otherwise utterly cut it off. [Acts 16:1-5]</p></blockquote>

hen thou canst not; but rest contented in this, that thou hast done thine endeavor; and take to the less when the greater cannot be effected. In some countries Popish images erected in Churches do stand undefaced. The good desire of the people is that they may be pulled down, but this cannot be brought to pass. What then are they to do in this case? They must not grow to extremity and pull them down themselves, but they must entreat the lawful magistrate for their removal and pray to God that He may be moved so to do; and in the meantime, rest content with that [which] they have done and wait the magistrates’ pleasure. In the judicial law, by reason of the hardness of the Jews’ hearts, sundry sins could not utterly be taken away, as divorcements, polygamy, usury. Hereupon the Lord makes a law of toleration, without approbation, and did not remove them quite away, for that was not possible in regard of man for the time; but [He] restrained the evil that could not be quite off and abolished otherwise. And herein appeared the great wisdom of God in making a law not to allow of, nor yet utterly to take away, but to moderate the practice of these sins in the Jews, for the hardness of their hearts. In like manner, in this our land there is the practice of usury, a sin that cannot, nor ever shall be rooted out utterly. For this cause the States of this [English] kingdom have out of their wisdom provided a Law for the toleration thereof after a sort, and that upon special cause. For if the magistrate should have enacted a Law utterly to abolish it, it would before this (in likelihood) have grown to great extremity. The same was the practice of the apostles in their times, who yielded to bear with the use of circumcision for a time when they could not otherwise utterly cut it off. [Acts 16:1-5]”

— William Perkins, Cases of Conscience (d. 1602; Cambridge. 1606), bk. 3, ch. 2, pp. 480-85">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII+Rule.+Every+man+must+measure+himself+by+his+own+strength+and+do+nothing+beyond+his+ability.+This+rule+is+set+down%2C+though+expressed+in+other+terms%2C+Rom.+12%3A3%2C+%E2%80%98No+man+must+presume+to+understand+above+that+which+is+meet+to+understand%2C+but+ought+to+be+wise+according+to+sobriety+as+God+hath+dealt+to+every+man+the+measure+of+faith.%E2%80%99+An+example+of+the+transgression+of+this+rule+we+have+in+David%E2%80%99s+three+worthies+who+break+into+the+host+of+the+Philistines+to+fetch+David+the+king+water+from+the+well+of+Bethleham%2C+2+Sam.+23%3A16%2C+which+act+of+theirs+was+a+rash+enterprise+and+such+a+one+as+David+himself+condemns+in+that+chapter%2C+because+they+went+beyond+their+strength+to+encounter+with+a+whole+garrison+of+men%2C+they+being+themselves+but+few%2C+namely+three+in+number.+IV+Rule.+We+must+distinguish+between+the+necessary+works+of+our+callings+that+pertain+to+us+and+other+works+that+are+out+of+our+callings+and+pertain+not+unto+us%3A+and+we+must+do+the+other+though+we+leave+these+undone.+This+rule+is+propounded+in+1+Thess.+4%3A11%2C+%E2%80%98Meddle+with+your+own+business.%E2%80%99+That+is%2C+do+the+necessary+works+of+your+callings+that+belong+to+you+though+you+leave+the+other+for+the+time+undone.+The+contrary+to+it+is+to+live+or+to+behave+himself+inordinately%2C+2+Thess.+3%3A7.+And+we+have+an+example+of+the+transgression+hereof+in+Peter%2C+Jn.+21%3A21%2C+whom+when+Christ+had+commanded+to+follow+Him%2C+he+would+needs+ask+Him+what+John+should+do%3B+Christ+gives+him+this+answer%3A+%E2%80%98What+is+that+to+thee%3F%E2%80%99+In+which+words+He+teaches+that+not+only+Peter%2C+but+also+every+man+must+attend+upon+the+necessary+and+proper+works+of+his+own+vocation+and+not+deal+with+other+men%E2%80%99s+business%2C+which%2C+because+Peter+did%2C+he+is+by+that+answer+secretly+reproved+and+justly+condemned+of+curiosity+in+that+behalf.+%E2%80%A6+VIII+Rule.+We+must+give+place+to+the+sway+of+the+times+wherein+we+live+so+far+forth+as+may+stand+with+keeping+faith+and+a+good+conscience.+We+may+not+be+temporizers+and+change+our+religion+with+the+times%2C+but+yet+we+may+and+must+give+place+to+times+as+we+give+place+to+the+stream%2C+so+that+it+be+done+with+keeping+of+true+religion+and+good+conscience.+This+rule+was+practiced+by+Paul%2C+who%2C+living+among+the+heathen+%28Acts+19%3A10%29%2C+was+constrained+to+speak+as+they%3B+and+therefore+he+says+that+he+departed+in+a+ship+to+Rome+whose+badge+was+%5Bof+the+heathen+gods%5D+Castor+and+Pollux.+%28Acts+28%3A11%29+Again%2C+he+was+three+years+in+Ephesus%2C+an+idolatrous+place%2C+where+the+great+goddess+Diana+was+worshipped%3B+yet+in+all+that+time+he+contained+himself+and+spake+nothing+in+particular+against+Diana%2C+but+only+in+general+against+false+gods%2C+saying+that+%E2%80%98they+be+no+gods+that+are+made+with+hands%2C%E2%80%99+%5Bch.+19%5D+v.+26.+Nay%2C+Alexander+could+not+charge+him+with+this%2C+that+he+had+in+all+that+while+blasphemed+their+goddess+Diana.+Paul+therefore+was+feign+to+yield+to+the+sway+of+those+times+that+so+he+might+do+some+good+in+Ephesus+by+his+ministry.+Whereas%2C+if+he+had+spoken+against+Diana+directly%2C+it+had+not+been+possible+for+him+to+have+done+that+good+by+preaching+which+otherwise+he+did.+Again%2C+in+the+primitive+Church%2C+the+apostles+for+the+weakness+of+the+Jews%2C+did+yield+to+the+use+of+circumcision+%5BActs+16%3A1-5%5D+and+permitted+abstinence+from+blood+and+that+which+was+strangled%2C+etc.+so+far+forth+as+it+stood+with+pure+religion+and+good+conscience%3A+and+if+they+had+not+so+done+they+should+not+have+won+the+Jews+to+the+faith+as+they+did.+IX+Rule.+If+we+cannot+do+the+good+things+that+we+desire+in+that+exquisite+manner+that+we+would%2C+we+must+content+ourselves+with+the+mean%3B+and+in+things+which+are+good%2C+and+to+be+done%2C+it+is+the+safest+course+to+satisfy+ourselves+in+doing+the+less%2C+least+in+venturing+to+do+the+more%2C+which+cannot+be%2C+we+grow+to+the+extremity%2C+and+so+fail+or+offend+in+our+action.+It+is+a+good+and+wise+counsel+of+the+Preacher+to+this+purpose%2C+Eccl.+7%3A16%2C+%E2%80%98Be+not+just+overmuch%3A%E2%80%99+and+his+meaning+may+be+this%3B+Be+not+too+strict+or+curious+in+effecting+that+which+thou+intendest%2C+exactly%2C+when+thou+canst+not%3B+but+rest+contented+in+this%2C+that+thou+hast+done+thine+endeavor%3B+and+take+to+the+less+when+the+greater+cannot+be+effected.+In+some+countries+Popish+images+erected+in+Churches+do+stand+undefaced.+The+good+desire+of+the+people+is+that+they+may+be+pulled+down%2C+but+this+cannot+be+brought+to+pass.+What+then+are+they+to+do+in+this+case%3F+They+must+not+grow+to+extremity+and+pull+them+down+themselves%2C+but+they+must+entreat+the+lawful+magistrate+for+their+removal+and+pray+to+God+that+He+may+be+moved+so+to+do%3B+and+in+the+meantime%2C+rest+content+with+that+%5Bwhich%5D+they+have+done+and+wait+the+magistrates%E2%80%99+pleasure.+In+the+judicial+law%2C+by+reason+of+the+hardness+of+the+Jews%E2%80%99+hearts%2C+sundry+sins+could+not+utterly+be+taken+away%2C+as+divorcements%2C+polygamy%2C+usury.+Hereupon+the+Lord+makes+a+law+of+toleration%2C+without+approbation%2C+and+did+not+remove+them+quite+away%2C+for+that+was+not+possible+in+regard+of+man+for+the+time%3B+but+%5BHe%5D+restrained+the+evil+that+could+not+be+quite+off+and+abolished+otherwise.+And+herein+appeared+the+great+wisdom+of+God+in+making+a+law+not+to+allow+of%2C+nor+yet+utterly+to+take+away%2C+but+to+moderate+the+practice+of+these+sins+in+the+Jews%2C+for+the+hardness+of+their+hearts.+In+like+manner%2C+in+this+our+land+there+is+the+practice+of+usury%2C+a+sin+that+cannot%2C+nor+ever+shall+be+rooted+out+utterly.+For+this+cause+the+States+of+this+%5BEnglish%5D+kingdom+have+out+of+their+wisdom+provided+a+Law+for+the+toleration+thereof+after+a+sort%2C+and+that+upon+special+cause.+For+if+the+magistrate+should+have+enacted+a+Law+utterly+to+abolish+it%2C+it+would+before+this+%28in+likelihood%29+have+grown+to+great+extremity.+The+same+was+the+practice+of+the+apostles+in+their+times%2C+who+yielded+to+bear+with+the+use+of+circumcision+for+a+time+when+they+could+not+otherwise+utterly+cut+it+off.+%5BActs+16%3A1-5%5D%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+Cases+of+Conscience+%28d.+1602%3B+Cambridge.+1606%29%2C+bk.+3%2C+ch.+2%2C+pp.+480-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F357e027618.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/357e027618.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=III%20Rule.%20Every%20man%20must%20measure,utterly%20cut%20it%20off.%20%5BActs%2016%3A1%2D5%5D" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>

<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>

</figure><figure class="quote" id="q-13395f7f0e" data-kw="">
<blockquote><p>Because, where the doctrine itself is sound and pure, and the ceremonies used to a civil honesty and decency, the inconveniences are rather to be passed by in silence than that by occasion of them men should proceed to contentions and more grievous tumults; Calvin, Epistle 303, fol. 497. Because, albeit these things be not to be approved, yet, sometimes these indifferent things, howsoever offensive and burdensome, are to be born withal, so far forth (quoad aliter non liceat) as conveniently we cannot do otherwise, lest if men contend about them more bitterly then they ought, it be both an hindrance to the progress of the Gospel, and the things which in their own nature are indifferent, be taught by our vehement contention to be plainly wicked; which two points do bring with them most grievous inconveniences; P. Martyr to [John] Hooper, Common Places, folio 1086 [p. 117]. And therefore these things which the pastors cannot change, they should rather bear withal, than by forsaking the Church for that cause they should give occasion for far greater and more dangerous mischiefs unto Satan, who seeks nothing else; Beza, Epistle 12, fol. 99. … Because we must give place unto the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience, Acts 28:11; 19:10, 26; 15:28-29; Master [William] Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 482-83. Because if we cannot do the good that most we desire, in such exquisite manner as we would, we must content ourselves with the mean, and in things which are good and to be done, it is the safest course to satisfy ourselves in doing the less, lest in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action, Eccl. 7:16; read the proofs: Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 483-86.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, pp. 163-65</span></figcaption>

</figure><figure class="quote" id="q-30672bf3d8" data-kw="">
<blockquote><p>Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.</p></blockquote>

<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328. 1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>

<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>

<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, p. 196</span></figcaption>

</figure><figure class="quote" id="q-fda464187d" data-kw="">
<blockquote><p>This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espy, or than, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance, do greatly dishonor God, and lay an hard imputation upon Him; as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeavor with a true and sincere heart) to seek the Lord.</p></blockquote>

<blockquote><p>…the first administration of the Lord’s Supper by our Savior, which was a pattern of all after-administrations, and therefore most exact and perfect in point of essentials. It wanted [lacked] nothing essentially belonging unto the administration of the Lord’s Supper… But now it was by Christ administred unto a Church which was not presbyterated (if we understand the term in regard of ruling elders). And therefore to have ruling elders in a church is not essential, but accidental unto the administration of the Lord’s Supper. And therefore the mere absence or want of them (especially when it is by the default of others only) is no sufficient bar against administration of the Lord’s Supper… as because Christ gave the Lord’s Supper only unto men; therefore it follows that it is lawful to administer the Lord’s Supper unto a congregation made up only of men, which is a thing usual in ships at sea and amongst merchants trading in remote parts: even so because Christ gave the Lord’s Supper unto a Church destitute of ruling elders; therefore the administration of it unto a Church that now is destitute of ruling elders is lawful, as being agreeable unto the practice of Christ in the first administration thereof.</p></blockquote>

<blockquote><p>Me thinks it is somewhat a strange kind of reasoning, because the rod of discipline is wanting [lacking], the children should be denied bread; yea, but you will say, dogs will eat the children’s bread: Why, will you therefore starve the children because dogs without your default may snatch the children’s portion? Shall the children be debarred (as I may say) their daily bread, because it will become accidentally poison unto dogs?… As it is better for God’s sheep to feed upon pasture where some weeds grow rather than starve for want [lack] of food: So it is better for God’s shepherds to suffer some weeds to grow in the sheeps’ pastures if they cannot prevent it, than to starve their flocks; yea, and as it is better for the sheep to feed among goats rather than starve, so it is better the shepherds should suffer the goats to feed upon the sheeps’ pasture though it should poison them, than for the sheep to be kept from it;</p></blockquote>

<blockquote><p>…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.</p></blockquote>

</figure><figure class="quote" id="q-3a21169bb9" data-kw="">
<blockquote><p>About refraining a moral duty for the evil mixed with it, or in the persons performing it: 1. As we are not to do evil that good may come of it, no more ought we to leave what is morally good undone for the evil that is some way mixed with it. Zeal for good is to be preferred to that which is against evil. The greatest good is better than the greatest evil is bad. Whatever good thing we do tends towards our union with the chiefest Good, the refraining of evil not so immediately. 2. Betwixt things indifferent and what is morally good, you have this difference: If there be any mixture of evil with the one, it becomes wholly evil; there is nothing of good in it to give stop or preponderate; but what is morally good will remain so still, though mixed with evil. We may allay the worth of it, as baser metals mixed with gold, but yet it is gold still, and may be perfectly severed. 3. ‘When I would do good,’ says the apostle, ‘evil is present with me.’ [Rom. 7:21] I cannot hear, or read or pray, and the rest, but with a mixture of sin; yet upon this account I may not cease from or neglect a known duty, not though materially considered the evil accompanying being greater than the good; as in meditation, when blasphemous thoughts arise, etc. To omit a known duty is a sin of wilfulness; the evil from me in it is but infirmity only; The least wilful sin is greater and more provoking than the greatest sin of infirmity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“About refraining a moral duty for the evil mixed with it, or in the persons performing it: 1. As we are not to do evil that good may come of it, no more ought we to leave what is morally good undone for the evil that is some way mixed with it. Zeal for good is to be preferred to that which is against evil. The greatest good is better than the greatest evil is bad. Whatever good thing we do tends towards our union with the chiefest Good, the refraining of evil not so immediately. 2. Betwixt things indifferent and what is morally good, you have this difference: If there be any mixture of evil with the one, it becomes wholly evil; there is nothing of good in it to give stop or preponderate; but what is morally good will remain so still, though mixed with evil. We may allay the worth of it, as baser metals mixed with gold, but yet it is gold still, and may be perfectly severed. 3. ‘When I would do good,’ says the apostle, ‘evil is present with me.’ [Rom. 7:21] I cannot hear, or read or pray, and the rest, but with a mixture of sin; yet upon this account I may not cease from or neglect a known duty, not though materially considered the evil accompanying being greater than the good; as in meditation, when blasphemous thoughts arise, etc. To omit a known duty is a sin of wilfulness; the evil from me in it is but infirmity only; The least wilful sin is greater and more provoking than the greatest sin of infirmity.”

— Philip Nye, A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2, pp. 8-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAbout+refraining+a+moral+duty+for+the+evil+mixed+with+it%2C+or+in+the+persons+performing+it%3A+1.+As+we+are+not+to+do+evil+that+good+may+come+of+it%2C+no+more+ought+we+to+leave+what+is+morally+good+undone+for+the+evil+that+is+some+way+mixed+with+it.+Zeal+for+good+is+to+be+preferred+to+that+which+is+against+evil.+The+greatest+good+is+better+than+the+greatest+evil+is+bad.+Whatever+good+thing+we+do+tends+towards+our+union+with+the+chiefest+Good%2C+the+refraining+of+evil+not+so+immediately.+2.+Betwixt+things+indifferent+and+what+is+morally+good%2C+you+have+this+difference%3A+If+there+be+any+mixture+of+evil+with+the+one%2C+it+becomes+wholly+evil%3B+there+is+nothing+of+good+in+it+to+give+stop+or+preponderate%3B+but+what+is+morally+good+will+remain+so+still%2C+though+mixed+with+evil.+We+may+allay+the+worth+of+it%2C+as+baser+metals+mixed+with+gold%2C+but+yet+it+is+gold+still%2C+and+may+be+perfectly+severed.+3.+%E2%80%98When+I+would+do+good%2C%E2%80%99+says+the+apostle%2C+%E2%80%98evil+is+present+with+me.%E2%80%99+%5BRom.+7%3A21%5D+I+cannot+hear%2C+or+read+or+pray%2C+and+the+rest%2C+but+with+a+mixture+of+sin%3B+yet+upon+this+account+I+may+not+cease+from+or+neglect+a+known+duty%2C+not+though+materially+considered+the+evil+accompanying+being+greater+than+the+good%3B+as+in+meditation%2C+when+blasphemous+thoughts+arise%2C+etc.+To+omit+a+known+duty+is+a+sin+of+wilfulness%3B+the+evil+from+me+in+it+is+but+infirmity+only%3B+The+least+wilful+sin+is+greater+and+more+provoking+than+the+greatest+sin+of+infirmity.%E2%80%9D%0A%0A%E2%80%94+Philip+Nye%2C+A+Case+of+Great+%26+Present+Use%3A+Wh <blockquote><p>Objection 2: There is much error mixed with the few truths they preach, as Popery, Arminianism, etc. There are also invective reflections, yea railings against the people of God. Answer 1: What is morally good will bear the mixture of a great deal of evil, and yet retain its goodness still: the goodness being from God, who is a greater good than Satan or sin is an evil. Answer 2: We cannot expect from men of ordinary gifts that truth be preached without the mixture of errors more or less: We know but in part, therefore are to prove all things, and hold fast that which it good, Heb. 5:14. A saint, as other creatures, though weak and newly born, has a raft of what is food suitable and what sincere. Answer 3: As for those intemperate expressions and reflections on the people of God: I confess it is sad, but were there not such against Paul and his party? (Phil. 1:15) Yet notwithstanding they are to be heard even by the same persons they enveighed against, for the truth’s sake.</p></blockquote>

e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Objection%202%3A%20There%20is%20much%20error,enveighed%20against%2C%20for%20the%20truth%E2%80%99s%20sake." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659)</cite>, ch. 2; p. 417</span></figcaption>

<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude: 1. That every misordering of such great affairs is the sin of them that do it. 2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient. 3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>

ay+or+after+sun-setting%2C+I+would+obey.+But+if+he+command+that+we+assemble+only+at+midnight%2C+what+should+I+do+then%3F+The+thing+is+not+simply+unlawful%3A+He+does+but+misdo+his+own+work.+And+therefore+for+some+times+I+would+obey%2C+if+it+were+necessary+to+avoid+a+greater+evil.+But+if+he+make+it+the+ordinary+case%2C+I+would+not+obey%3A+because+it+destroys+the+worship+itself+in+a+manner%2C+as+if+he+simply+forbade+it%2C+and+this+he+has+no+power+to+do.+An+inconvenient+gesture+I+would+use+in+obedience+and+to+avoid+a+greater+evil%3A+But+I+would+not+obey+him+that+would+command+me+to+stand+on+my+head+always+in+hearing.+An+unhandsome+vesture+I+would+use+in+obedience+to+a+lawful+governor+and+to+avoid+a+greater+evil%3A+But+not+so+ridiculous+a+vesture+as+would+set+all+the+people+on+laughing+so+as+to+frustrate+the+work+that+we+assemble+for.+%C2%A769.+In+all+such+cases+where+governors+act+not+as+usurpers+in+a+matter+that+they+have+no+authority+in%2C+but+only+misdo+their+own+work%2C+it+much+concerns+the+subjects+to+foresee+what%E2%80%99s+likely+to+be+the+consequents+of+their+obeying+or+disobeying%2C+and+accordingly+to+do+that+which+tends+most+to+the+ends+of+the+work%3A+still+holding+to+this+rule%2C+that+we+must+obey+in+all+things+lawful.+%C2%A770.+And+when+we+do+obey+in+a+case+of+miscommanding%2C+it+is+not+a+doing+evil+that+good+may+come+of+it%2C+as+some+do+misconceive%3A+But+it+is+only+a+submitting+to+that+which+is+ill+commanded%2C+but+not+evil+in+him+that+does+submit.+It+is+the+determiner+that+is+the+cause+of+the+inconvenience%2C+and+not+the+obeyer.+Nor+is+it+inconvenient+for+me+to+obey%2C+though+it+be+worse+perhaps+to+him+that+commands.+While+he+sins+in+commanding%2C+he+may+make+it+my+duty+to+obey.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+on+Church+Government+%26+Worship+%28London%2C+1659%29%2C+ch.+2%3B+pp.+423-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9be2d609ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9be2d609ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=%C2%A766%E2%80%A6%20There%20is%20a%20second%20thing,make%20it%20my%20duty%20to%20obey." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.</p></blockquote>

it online · Reformed Books Online</a></div>

<blockquote><p>VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>

<blockquote><p>In a word, God has bound all his ministers to use all their gifts to the churches’ greatest edification: But to use a more defective form, with liberty to use my best gifts also, and to exercise my ministry publicly to all, is more to the churches’ edification than to use my own gifts only a few days in a corner and then to lie in prison and use them no more. Though no man must of choice prefer the less congruous before the more congruous, when he is free (which I confess is a sin), yet it is a duty to prefer a less congruous order before none, or before a better for a day with a restraint of that and all our ministry hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 32</cite>, p. 186</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In a word, God has bound all his ministers to use all their gifts to the churches’ greatest edification: But to use a more defective form, with liberty to use my best gifts also, and to exercise my ministry publicly to all, is more to the churches’ edification than to use my own gifts only a few days in a corner and then to lie in prison and use them no more. Though no man must of choice prefer the less congruous before the more congruous, when he is free (which I confess is a sin), yet it is a duty to prefer a less congruous order before none, or before a better for a day with a restraint of that and all our ministry hereafter.”

<blockquote><p>…but [nonconformists] will keep all loving correspondence with them [parish churches], and seasonably sometimes communicate with them to show their principles by their practice. For the benefit of Christian love and concord, may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They prefer their own manner of worshipping God, as better than the Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

<blockquote><p>§16. Rule 5. If I vow that I will do some duty better, I am not thereby disobliged from doing it at all when I am disabled from doing it better. Suppose a magistrate seeing much amiss in Church and commonwealth, does vow a reformation and vow against the abuses which he finds; If now the people’s obstinacy and rebellion disable him to perform that vow, it does not follow that he must lay down his scepter and cease to govern them at all because he cannot do it as he ought, if he were free. So if the pastors of any Church do vow the reformation of Church abuses, in their places, if they be hindered by their rulers, or by the people, it does not follow that they must lay down their callings and not worship God publicly at all because they cannot do it as they would and ought if they were free, as long as they may worship him without committing any sin. God’s first obligation on me is to worship Him, and the second for the manner, to do it as near his order as I can: Now if I cannot avoid the imperfections of worship, though I vowed it, I must not therefore avoid the worship itself (as long as corruptions destroy not the very nature of it and I am put myself upon no actual sin). For I was bound to worship God before my vows, and in order of nature before my obligation de modo: And my vow was made with an implied condition, that the thing were possible and lawful: And when that ceases to be possible or lawful which I vowed, I must nevertheless do that which still remains possible and lawful. To give over God’s solemn worship with the Church is no reformation. To prefer no worship before imperfect worship is a greater deformation and corruption than to prefer imperfect worship before that which is more perfect. And to prefer a worship imperfect in the manner, before no church worship at all, is a greater reformation than to prefer a more perfect manner of worship before a more imperfect and defective. To worship God decently and in order, supposes that He must be worshipped: And he that does not worship at all, does not worship Him decently. If a physician vow that he will administer a certain effectual antidote to all his patients that have the plague, and that he will not administer a certain less effectual preparation, which some apothecaries through covetousness or carelessness had brought into common use, to the injury of the sick: His vow is to be interpreted with these exceptions, ‘I will do it if I can, without dishonesty or a greater mischief: I will not administer the sophisticated antidote when I can have better: I vow this for my patients benefit and not for their destruction.’ Therefore if the sophisticated antidote is much better than none, and may save men’s lives, and the patients grow wilful and will take no other, or authority forbid the use of any other, the physicion is neither bound to forsake his calling rather than use it, nor to neglect the life of his patients: (If their lives indeed lie upon his care and they may not be in some good hopes without him, and the good of many require him not to neglect a few): But he must do what he can when he cannot do what he would, and only show that he consents not to the sophistication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: White, 1673), pt. 3</cite>, ch. 5, title 2, pp. 703-4</span></figcaption>

<blockquote><p>But, good friend, if really Christ and Scripture be your guide, I desire no more; tell me, and lay by partiality: Did not Christ and his apostles use both in the synagogues, Church, meetings and writings a faulty translation of the Old Testament, and as bad as ours. Deny it if you can for shame. Though sometimes they varied, they mostly used the Septuagint, according to which our faulty translation of the Old Testament is made, as it differs from the Hebrew. Is this no confutation of you? [(1)] Yea, Christ and the apostles used it the rather because it was in common use… I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not… How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence.</p></blockquote>

ts+faults%2C+much+less+their+presence+in+the+synagogues+when+others+read+Moses+and+the+prophets+in+them.+And+the+Psalms+in+the+Septuagint+translation+were+part+of+their+liturgy.+For+man+to+speak+faultily+is+no+wonder%3A+It+has+a+more+plausible+pretence+for+separation+to+say+that+men+corrupt+the+Word+of+God.+And+yet+when+it+is+but+such+an+effect+of+human+imperfection%2C+it+is+no+just+pretence.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29+%7C+section+5%2C+%E2%80%98A+comparison+of+the+use+of+a+faulty+translation+of+the+Scripture+and+a+faulty+liturgy%E2%80%99+See+also+the+whole+of+this+article.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb2ae6493e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b2ae6493e6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=But%2C%20good%20friend%2C%20if%20really%20Christ,imperfection%2C%20it%20is%20no%20just%20pretence." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1cd7397674" data-kw="">
<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 68</span></figcaption>

</figure><figure class="quote" id="q-ec32e2afb4" data-kw="">
<blockquote><p>We never held it unlawful to do one of these actions, though it were by mistake unlawfully commanded; e. g. If the rulers prescribe a time, place, metre, tune, etc. unfit, if it be not so bad as to overthrow the ends and use of the worship, the fault of the commander will not disoblige us from the duty of obeying. And whereas some argue that no man has authority to sin; therefore, we are not bound to obey that which is no act of authority, I answer: Rulers have authority to command that which is good though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined. We never pray without some fault in the manner, and yet must rather do it so than not at all. The mistaken ruler bids us not sin: It’s his sin to choose a mis-circumstance; and it is not his own action that he bids us do, but ours: And it’s to us a lawful circumstance, because [it is] necessary to concord and commanded, though mistakingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 13-14</span></figcaption>

.github.io%2Fquote%2Fec32e2afb4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ec32e2afb4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=We%20never%20held%20it%20unlawful%20to,to%20concord%20and%20commanded%2C%20though%20mistakingly." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 6-7, 10</span></figcaption>

<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.</cite></span></figcaption>

— John Corbet, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSection+5.+Note+that+things+not+determined+of+God+%5Bfor+public+worship%5D+and+left+to+the+determination+of+men+must+be+such+as+are+necessary+in+genere%2C+and+not+things+idle+and+superfluous.+A+superior+may+not+institute+a+superfluous+thing+that+is+not+simply+evil%2C+though+sometimes+the+inferior+may+lawfully+obey+therein%3B+or+to+speak+more+properly%2C+%5Bthe+inferior+may%5D+lawfully+do+the+thing+to+avoid+inconvenience%2C+or+to+testify+respect+to+the+superior%2C+though+in+that+particular+he+has+no+lawful+power+to+command.+Note+also%2C+that+of+things+necessary+in+genere%2C+the+superior+may+not+lawfully+determine+for+such+species%2C+as%2C+though+not+simply+evil%2C+may+have+a+tendency+to+evil+or+be+evil+in+the+consequence%2C+when+he+may+determine+that+which+will+not+be+evil+in+the+consequence.+Yet+the+inferior+may+obey%2C+or+rather+observe+the+thing+commanded%2C+when+the+evil+consequence+of+non-observance+will+be+greater+than+the+evil+consequence+of+observance.+Section+6.+If+superiors+command+that+which+is+above+their+sphere+to+command+%5Bfor+public+worship%5D%2C+namely%2C+things+not+necessary+in+genere+%5Bby+its+kind%5D%2C+yet+if+they+be+not+simply+evil%2C+subjects+may%C2%B9+do+those+things%2C+unless+they+be+evil+in+their+consequence+to+a+higher+degree+than+the+not+doing+of+them+would+be.%C2%B2+In+this+case+it+is+not+formal+obedience%2C%C2%B3+but+they+are+done+for+the+end%E2%80%99s+sake+and+to+avoid+evil.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%E2%80%A6+in+The+Remains+of+the+Reverend+%26+Learned+Mr.+John+Corbet%E2%80%A6+%28London%3A+Thomas+Parkhurst%2C+1684%29%2C+pt.+3+Corbet+%28d.+1680%29+was+an+English%2C+congregationalist+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fqu <blockquote><p>Yet there was in those rites some manner of difference, not only between the first Passover celebrated in Egypt and the subsequent ones, but also between the primary Passover, which was ordinarily eaten in the month of Nisan on the fourteenth day, and the secondary one, which was celebrated in the second month on the fourteenth day, for the sake of those who were either unclean or absent in the prior month, because in the latter, the communicants were not bound to such an exact purging of all leaven, and also they conducted this feast for not but one day [instead of seven].</p></blockquote>

<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jame-owen.html">Jame Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

21%5D%2C%20and%20renounced%20Christianity%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1de66e8c9a" data-kw="">
<blockquote><p>If all the people may lawfully join themselves with that Church which has the ablest teacher, then almost all the world must go to a few men and leave the rest. Then Barnabas may be forsaken, if Paul be the chief speaker… And God has more means than ministerial abilities to increase men’s graces: He that keeps in God’s order under a meaner [less excellent], honest minister, is like to be a more humble, thriving Christian than he that will break that order under pretense of edification. The Lord knows that I speak against my own visible carnal interests in all this… 10. Christians should not first ask, ‘Where may I have the best minister, or company, or purest Ordinances? or where may I receive most good?’ But they must first ask, ‘Where lies my duty? and where may I do most good?’ For God’s work must be done before our own. And the saving of souls and propagation of the Gospel must be preferred before our comforts. Yea let me tell you my observation: The comfort that Christians have in a suffering, self-denying course of doing good is a surer and more stable comfort than that which is drawn from the special advantages of ordinances. That man that lives among a company of poor ignorant souls, and will set himself night and day resolvedly and unweariedly to teach them, persuade them and win them to Christ, till he have bettered the imperfect church where he is, shall usually be a man of solid settled peace. When he that says, ‘These are carnal, heathens, wicked; This is a weak ministry; I will go join myself to such an excellent minister and Church, and let them alone,’ this man will likely be soon sadded with his new comforts, and weary of his precious ordinances, and be as ready to vilify them and turn to some other till in this disorder he have run himself out of breath, if not out of all appearance of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite></span></figcaption>

<blockquote><p>12. Yet no man should prefer worse before better, if all things [be] set together it be better indeed to the person at that time. … 26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant,¹ which renounces profaneness, schism, and all that is contrary to godliness. … 28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable. 29. Such use of godly public ministers [in the parish churches] may well stand with the best improvement we can make of the private help of others. … 34. Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest¹ minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers² and to be fined and lie in prison on no better a cause.</p></blockquote>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>

</figure><figure class="quote" id="q-f7398ec5b3" data-kw="">
<blockquote><p>…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?</p></blockquote>

</figure><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>

<blockquote><p>…and their fear toward me is taught by the precept of men: therefore, behold, I will proceed to do a marvellous work among the people, even a marvellous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid” (Isa. 29:13-14). And in another place, “But in vain do they worship Me, teaching for doctrines the commandments of men” (Mt. 15:9)… pious princes are repeatedly praised (2 Kings 22:1, etc.) for acting according to all his precepts, and not declining either to the right hand or the left. I go further: although there be no open manifestation of impiety in fictitious worship, it is strictly condemned by the Spirit, inasmuch as it is a departure from the command of God… And the more clearly the will of God has been manifested to us, the less excusable is our petulance in attempting anything.</p></blockquote>

<blockquote><p>But if you will indeed continue as I see that you have begun, I now declare to you beforehand that it will come to pass that what has happened to other disturbers of the Churches may happen also to you and to all your followers (if there should be any)… namely, that you may learn too late that you have harmed no one more than yourself.</p></blockquote>

</figure><figure class="quote" id="q-6d554ae102" data-kw="">
<blockquote><p>Let every man walk within the compass of his calling. Whatsoever lies not in us to reform, it shall be our zeal and piety to tolerate, and with patience to forbear, especially in things of this nature, which concern not so much the outward communion with God or man, essentially required in a visible state, as the due ordering of business in the said communion, wherein there be many superfluities and defects, salva tamen Ecclesia; yea, and such a Church notwithstanding, as wherein the best and truest members (circumstances considered) may have more cause to rejoice than to grieve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians (d. 1617), ch. 2</cite>, pp. 297-98</span></figcaption>

</figure><figure class="quote" id="q-3b7d563a92" data-kw="">
<blockquote><p>Because, whereas the ministers are willing to reform abuses, and the magistrate is peremptory and resolute not to reform for some reasons of policy, the minister in that case is not to leave his ministry, or to trouble the Church, intempestiuis clamoribus, or to contest or contend with the magistrate: The reason is, because this course tends to the overthrow of the Church, and is opposite to that charity which he owes unto Christ and to his church, out of which ground and rule he ought to preach, and to hold on in the course of his ministry. He ought indeed to teach publicly and privately (as the matter requires) what is to be done, but this he must perform without sedition and troubling of the Church, but peaceably and discreetly. Charity will inform the pastor, if he love the Church indeed, how he ought in these cases to behave himself; Zanchi, On Philippians 1, fol. 45. Look also: Musculus, loc. pt. 2, Of Traditions, §6, fol. 31. …Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it; Zanchi, ibid. … Because if pastors cannot reform all things which need amendment, according to their desire, they must not therefore cast away their ministry, or trouble the whole Church with an unusual asperity. The reason: Because all godly ground and form of ecclesiastical discipline ought ever to have respect and have reference to the unity of the Spirit in the bond of peace, which the apostle commanded to be kept by serving one another; and which rule not being kept, the medicine of discipline grows to be superfluous and pernicious. It is confessed that pastors ought with their uttermost endeavors to labor that there remain no corruption in the Church: but they must use that wisdom which our Savior prescribes, lest by plucking up the tares, they hurt the good corn. Wherefore the precept of the apostle of separating the evil (or of mending corruption) must by no means be neglected, cum sine periculo violandae pacis fieri potest, when it may be done without the danger of violation of the Churches’ peace: for else He would not have it done. Calvin, Institutes, bk. 4, ch. 12, §11, 13.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Because, whereas the ministers are willing to reform abuses, and the magistrate is peremptory and resolute not to reform for some reasons of policy, the minister in that case is not to leave his ministry, or to trouble the Church, intempestiuis clamoribus, or to contest or contend with the magistrate: The reason is, because this course tends to the overthrow of the Church, and is opposite to that charity which he owes unto Christ and to his church, out of which ground and rule he ought to preach, and to hold on in the course of his ministry. He ought indeed to teach publicly and privately (as the matter requires) what is to be done, but this he must perform without sedition and troubling of the Church, but peaceably and discreetly. Charity will inform the pastor, if he love the Church indeed, how he ought in these cases to behave himself; Zanchi, On Philippians 1, fol. 45. Look also: Musculus, loc. pt. 2, Of Traditions, §6, fol. 31. …Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it; Zanchi, ibid. … Because if pastors cannot reform all things which need amendment, according to their desire, they must not therefore cast away their ministry, or trouble the whole Church with an unusual asperity. The reason: Because all godly ground and form of ecclesiastical discipline ought ever to have respect and have reference to the unity of the Spirit in the bond of peace, which the apostle commanded to be kept by serving one another; and which rule not being kept, the medicine of discipline grows to be superfluous and pernicious. It is confessed that pastors ought with their uttermost endeavors to labor that there remain no corruption in the Church: but they must use that wisdom which our Savior prescribes, lest by plucking up the tares, they hurt the good corn. Wherefore the precept of the apostle of separating the evil (or of mending corruption) must by no means be neglected, cum sine periculo violandae pacis fieri potest, when it may be done without the danger of violation of the Churches’ peace: for else He would not have it done. Calvin, Institutes, bk. 4, ch. 12, §11, 13.”

— John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’, pp. 166-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause%2C+whereas+the+ministers+are+willing+to+reform+abuses%2C+and+the+magistrate+is+peremptory+and+resolute+not+to+reform+for+some+reasons+of+policy%2C+the+minister+in+that+case+is+not+to+leave+his+ministry%2C+or+to+trouble+the+Church%2C+intempestiuis+clamoribus%2C+or+to+contest+or+contend+with+the+magistrate%3A+The+reason+is%2C+because+this+course+tends+to+the+overthrow+of+the+Church%2C+and+is+opposite+to+that+charity+which+he+owes+unto+Christ+and+to+his+church%2C+out+of+which+ground+and+rule+he+ought+to+preach%2C+and+to+hold+on+in+the+course+of+his+ministry.+He+ought+indeed+to+teach+publicly+and+privately+%28as+the+matter+requires%29+what+is+to+be+done%2C+but+this+he+must+perform+without+sedition+and+troubling+of+the+Church%2C+but+peaceably+and+discreetly.+Charity+will+inform+the+pastor%2C+if+he+love+the+Church+indeed%2C+how+he+ought+in+these+cases+to+behave+himself%3B+Zanchi%2C+On+Philippians+1%2C+fol.+45.+Look+also%3A+Musculus%2C+loc.+pt.+2%2C+Of+Traditions%2C+%C2%A76%2C+fol.+31.+%E2%80%A6Wherefore+many+things+are+to+be+tolerated+by+the+ministers+that+the+peace+of+churches+be+not+rent+and+that+schisms+may+be+avoided%2C+so+that+they+be+not+such+things+or+doctrines+which+do+fight+with+the+foundation+and+do+heave+at+it%3B+Zanchi%2C+ibid.+%E2%80%A6+Because+if+pastors+cannot+reform+all+things+which+need+amendment%2C+according+to+their+desire%2C+they+must+not+therefore+cast+away+their+ministry%2C+or+trouble+the+whole+Church+with+an+unusual+asperity.+The+reason%3A+Because+all+godly+ground+and+form+of+ecclesiastical+discipline+ought+ever+to+have+respect+and+have+reference+to+the+unity+of+the+Spirit+in+the+bond+of+peace%2C+which+the+apostle+commanded+to+be+kept+by+serving+one+another%3B+and+which+rule+not+being+kept%2C+the+medicine+of+discipline+grows+to+be+superfluous+and+pernicious.+It+is+confessed+that+pastors+ought+with+their+uttermost+endeavors+to+labor+that+there+remain+no+corruption+in+the+Church%3A+but+they+must+use+that+wisdom+which+our+Savior+prescribes%2C+lest+by+plucking+up+the+tares%2C+they+hurt+the+good+corn.+Wherefore+the+precept+of+the+apostle+of+separating+the+evil+%28or+of+mending+corruption%29+must+by+no+means+be+neglected%2C+cum+sine+periculo+violandae+pacis+fieri+potest%2C+when+it+may+be+done+without+the+danger+of+violation+of+the+Churches%E2%80%99+peace%3A+for+else+He+would+not+have+it+done.+Calvin%2C+Institutes%2C+bk.+4%2C+ch.+12%2C+%C2%A711%2C+13.%E2%80%9D%0A%0A%E2%80%94+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1623%29%2C+%E2%80%98Reformed+Practices%E2%80%99%2C+pp.+166-67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b7d563a92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3b7d563a92.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Because%2C%20whereas%20the%20ministers%20are%20willing,bk.%204%2C%20ch.%2012%2C%20%C2%A711%2C%2013." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The non-conformist, non-separatist, puritan minister authors of this book: …were examples of holiness, so in this, that they have ever, not only forborne, but steadfastly opposed to their great reproach, damage and danger many ways, the corruptions in our [Anglican] Church government, worship and liturgy, and have been lights and leaders to these latter times therein, yet always in a peaceable and regular way, as not on the one side to subject themselves to suspicious inventions, so on the other, not sinfully to separate from the communion and true worship of churches, accounting it more agreeable to all rules of piety, charity and Christian prudence to tolerate for the time what they could not mend rather than to rent and tear all in pieces to an utter ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Publisher, William Rathband, to the Reader” in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p.</cite></span></figcaption>

</figure><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>

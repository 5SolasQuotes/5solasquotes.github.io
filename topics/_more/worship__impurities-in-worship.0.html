<blockquote><p>Verse 5… But David was not the man he had appointed for this work, and therefore though the Lord commended David for this holy intention, as is evident, 1 Kings 8:18, ‘And the Lord said unto David my father, ‘Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart,” and made many gracious promises unto him at this time, vv. 10-12, etc. to testify how well He took it that he had such a purpose in his mind: yet withal He made known to him that He meant not that it should be done by him, but by his son… Verse 6… Though David’s intent was generally in itself good, insomuch that the Lord Himself commended him for it, as is manifest in that place before cited, 1 Kings 8:18, yet it was not without some mixture of error: for herein he failed, because he undertook to do it without any particular direction or warrant from God, led hereto only by the judgment of his own reason, that it was not fit God should dwell within curtains, when He dwelt in an house of cedar; and therefore though the Lord told him that his purpose was in the general commendable, yet withall He rejected his purpose and discovered thereby that he should have waited his leasure and direction, and disproved his reason…</p></blockquote>

<blockquote><p>Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Chron. 30, vv. 20 &amp; 22</cite></span></figcaption>

</figure><figure class="quote" id="q-5948798c27" data-kw="">
<blockquote><p>First, if we tender up to God all that we have. Though we be never so poor and mean, yet if God has the strength of our souls, God accepts it. For we are to know that God does not stand in need of what we have, or of what we do; but that we might show our respect to Him: Therefore if we give all that we have, God accepts it. As a child, if it puts forth all its strength that it has to do a business which the father bids him, whether the business be done or no, the father looks upon it and accepts it as suitable to the child’s strength; and it shows the respect that the child has to his father. And as it is storied of an emperor that when a poor man had nothing to offer him but a little water that he had taken up with his hand, he having nothing else, the emperor accepts of it. So that’s that which God looks for, that the creature should lift Him above all. If therefore when thou comest to worship God, God has more of thy heart then ever any creature in the world had, God accepts of that, and that you must look unto; Can you say so, when you go to worship God: Lord it is true there is much weakness in my spirit, but Thou that knowest all things knowest that thou hast more of my heart than ever any creature in the world had. This is suitable to God: God will account this (in the Covenant of Grace) to be a present suitable to Himself. As in the Law, when they offered to the building of the Temple, every one could not offer gold and silver and precious stones, but some came and offered badgers-skins, and some women did spin and offered coats-hair to the building of the Temple, and so God accepted of that being the most they could do. 2. In the second place, when we do not only offer unto God the most we can, but when we add to this the grief of our souls that we can do no more, when the soul shall strive to the uttermost it can, and when it has done all, says, ‘I am an unprofitable servant; Oh that I could do more!’ This is suitable to God. 3. Thirdly, the people of God though they be weak, yet the weakest servant of God is able to offer up to God somewhat that is suitable to the infinite majesty of God, upon this third ground, because that there is a kind of impression of God’s infiniteness in those services that a gracious heart does tender unto God, and therefore [it is] suitable unto God.</p></blockquote>

er+unto+God+the+most+we+can%2C+but+when+we+add+to+this+the+grief+of+our+souls+that+we+can+do+no+more%2C+when+the+soul+shall+strive+to+the+uttermost+it+can%2C+and+when+it+has+done+all%2C+says%2C+%E2%80%98I+am+an+unprofitable+servant%3B+Oh+that+I+could+do+more%21%E2%80%99+This+is+suitable+to+God.+3.+Thirdly%2C+the+people+of+God+though+they+be+weak%2C+yet+the+weakest+servant+of+God+is+able+to+offer+up+to+God+somewhat+that+is+suitable+to+the+infinite+majesty+of+God%2C+upon+this+third+ground%2C+because+that+there+is+a+kind+of+impression+of+God%E2%80%99s+infiniteness+in+those+services+that+a+gracious+heart+does+tender+unto+God%2C+and+therefore+%5Bit+is%5D+suitable+unto+God.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Worship...+%28London%3A+1647%29+%7C+Sermon+4%2C+on+Lev.+10%3A3%2C+%E2%80%9CI+will+be+sanctified+in+them+that+come+nigh+Me.%E2%80%9D%2C+pp.+63-64&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5948798c27.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5948798c27.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=First%2C%20if%20we%20tender%20up%20to,therefore%20%5Bit%20is%5D%20suitable%20unto%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5b76ba6123" data-kw="">
<blockquote><p>And the reason why there must be this sanctifying of the heart is: 1. First, because the Lord does first accept of the person before He does accept of the action: Men indeed do accept of the persons of men because they do good actions, but God accepts of the actions of men because their persons are good. If indeed we see a man do good, then we love him and accept of the person of the man; but God first will accept of the person before the action: As the Lord accepted of Abel first, and then He accepted his offering [Gen. 4:4; Heb. 11:4]… you must first look after means of acceptation of your persons, which is through the righteousness of Jesus Christ, and through the sanctification of his Spirit, whereby you come to have his image and life, and so are accepted, and then all that proceeds from you comes to be accepted… 2. Secondly, our hearts must be sanctified because the Lord does look more to the principle from whence a thing comes than at the thing itself… So God is not pleased with anything that comes from us except He knows that it comes from a principle of love, grace, and holiness in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”</cite>, pp. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

lank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Bodily worship without soul-worship is nothing; but soul-worship may be accepted without bodily worship; therefore it is the soul that God does principally look at in holy duties: If you be not able to worship God in your bodies, you may worship Him in your souls, and God regards that bodily exercise in holy duties is little worth… but it is nothing in comparison: the great work is the work of the soul, for God is a Spirit and must be worshipped in spirit. And God is said to be a Spirit… it notes the simplicity of God… but in the simplicity of your hearts you must come to worship God, and thus you shall worship Him with such worship as is some way suitable to him as he is a Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship... (London: 1647) | Sermon 6</cite>, pp. 93-94</span></figcaption>

</figure><figure class="quote" id="q-955cd44f5b" data-kw="">
<blockquote><p>It should make me come with expectation of great things from God; do not come unto God as unto an empty vine, but as unto a full vine, and the more thy faith is raised to expect great things from God, the more acceptable art thou to God: Certainly the higher anyone’s faith is raised when they come into his presence, to expect the greatest things, the more acceptable;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship... (London: 1647) | Sermon 6</cite>, p. 101</span></figcaption>

</figure><figure class="quote" id="q-77cb6c9ed1" data-kw="">
<blockquote><p>…if so be that thou makest conscience of sanctifying God’s name in duties, then He will sanctify his name in a way of mercy; that is, He will manifest how He does accept of the least degree of holiness though there be much mixture: God has a way to take away the mixture by the blood of his Son, and then to accept of any holiness He sees in thee, He will sanctify his name by meeting with thee and revealing his glory to thee when thou art worshiping of Him: There is an excellent scripture for this, Ex. 29:43, ‘There I will meet with the children of Israel and the Tabernacle shall be sanctified by my glory.’ Thou that hast a gracious heart and art worshiping of God in sincerity, thou art as a tabernacle of God, and God has his service and worship from thee; thou art as the temple of God, and ‘There will I meet with thee’ (says God) ‘and I will sanctify my Tabernacle by my glory.’ God will sanctify thy heart by his glory if thou doest sanctify his name.</p></blockquote>

<blockquote><p>…hereafter at the great Day of Judgment it will be a part of the glory of God to manifest before men and angels how He did accept of those holy services that thou didst tender up to Him; when hypocrites shall be cast away and abhorred, and thou who hadst an upright, sincere heart shall be owned before God, and before men and angels at that great Day; and God shall say, ‘Well, it is a part of the glory of my holiness to make it appear that I have accepted of these holy things that these my poor servants have tendered up to Me.&#x27;</p></blockquote>

<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament... (London: 1653), on 2 Samuel, ch. 7</cite>, p. 390</span></figcaption>

<blockquote><p>V. 11. Where it is told David that in respect he intended to build a house to God, the Lord likewise should make him a house. We see that the Lord will not suffer the good and laudable intentions of the godly to be unrewarded: much more their pious and commendable actions, no, not a cup of cold water given to one of his, which shall want its reward. Which should be a great encouragement to pious and good works.</p></blockquote>

</figure><figure class="quote" id="q-a03a02f258" data-kw="">
<blockquote><p>I confess their Common-Prayer is my burden, by reason of its defects and disorder, and the rudeness of the ministerial method. I stand convinced it ought to be altered; yea, abolished… yet I must confess I find in it no matter to which (on a charitable interpretation) a sober serious Christian may not say, nay, can deny his ‘Amen’. And though I distaste the ministerial method, I cannot disown in it the essential form of prayer, (viz.) A calling upon God in the Name of Christ… nor do I see on what ground I can deny, or refuse my ‘Amen’ to what is prayed for… because they are rudely and unfittingly expressed, whilst the irregularity of that common order is no bar to God’s acceptance of my more regular ‘Amen’ thereunto given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), p. 25 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-60d84d2a26" data-kw="">
<blockquote><p>But, lest any honest Christian should by his frequent distractions be discouraged from his duties, or in his holy duties, I shall… prevent such a temptation by laying down some encouragements: … The fifth encouragement is that our God can gather some sense out of a distracted duty, and do us some good by it. Rom. 8:27, ‘He that searcheth the hearts, knoweth what is the mind of the Spirit;’ ’tis true of our spirit as well as of God’s. The great searcher of hearts knows what you came pregnant with, what you meant, though you missed it in the delivery. He can tell what was written in the letter, though it did miscarry, and will answer your godly meaning, and overlook your unwilling failing, Ps. 103:13, ‘As a father pitieth his children, so the Lord…’ Why, the child comes sometimes full of a suit to the Father, and he is quite out in his tale, has forgotten what he would have, but the Father knows what he wants and what he would have said, and grants the whole. And so, provided thou be a child, and art heartily sensible of thy wants, and comest panting to the Throne of Grace; thy heavenly Father will accept thy meaning, and grant thy petition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote against Distractions, or an Endeavor to Serve the Church in the Daily Case of Wanderings in the Worship of God (London: 1667), ch. 9</cite>, pp. 204, 213-14</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“But, lest any honest Christian should by his frequent distractions be discouraged from his duties, or in his holy duties, I shall… prevent such a temptation by laying down some encouragements: … The fifth encouragement is that our God can gather some sense out of a distracted duty, and do us some good by it. Rom. 8:27, ‘He that searcheth the hearts, knoweth what is the mind of the Spirit;’ ’tis true of our spirit as well as of God’s. The great searcher of hearts knows what you came pregnant with, what you meant, though you missed it in the delivery. He can tell what was written in the letter, though it did miscarry, and will answer your godly meaning, and overlook your unwilling failing, Ps. 103:13, ‘As a father pitieth his children, so the Lord…’ Why, the child comes sometimes full of a suit to the Father, and he is quite out in his tale, has forgotten what he would have, but the Father knows what he wants and what he would have said, and grants the whole. And so, provided thou be a child, and art heartily sensible of thy wants, and comest panting to the Throne of Grace; thy heavenly Father will accept thy meaning, and grant thy petition…”

— Richard Steele, An Antidote against Distractions, or an Endeavor to Serve the Church in the Daily Case of Wanderings in the Worship of God (London: 1667), ch. 9, pp. 204, 213-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+lest+any+honest+Christian+should+by+his+frequent+distractions+be+discouraged+from+his+duties%2C+or+in+his+holy+duties%2C+I+shall%E2%80%A6+prevent+such+a+temptation+by+laying+down+some+encouragements%3A+%E2%80%A6+The+fifth+encouragement+is+that+our+God+can+gather+some+sense+out+of+a+distracted+duty%2C+and+do+us+some+good+by+it.+Rom.+8%3A27%2C+%E2%80%98He+that+searcheth+the+hearts%2C+knoweth+what+is+the+mind+of+the+Spirit%3B%E2%80%99+%E2%80%99tis+true+of+our+spirit+as+well+as+of+God%E2%80%99s.+The+great+searcher+of+hearts+knows+what+you+came+pregnant+with%2C+what+you+meant%2C+though+you+missed+it+in+the+delivery.+He+can+tell+what+was+written+in+the+letter%2C+though+it+did+miscarry%2C+and+will+answer+your+godly+meaning%2C+and+overlook+your+unwilling+failing%2C+Ps.+103%3A13%2C+%E2%80%98As+a+father+pitieth+his+children%2C+so+the+Lord%E2%80%A6%E2%80%99+Why%2C+the+child+comes+sometimes+full+of+a+suit+to+the+Father%2C+and+he+is+quite+out+in+his+tale%2C+has+forgotten+what+he+would+have%2C+but+the+Father+knows+what+he+wants+and+what+he+would+have+said%2C+and+grants+the+whole.+And+so%2C+provided+thou+be+a+child%2C+and+art+heartily+sensible+of+thy+wants%2C+and+comest+panting+to+the+Throne+of+Grace%3B+thy+heavenly+Father+will+accept+thy+meaning%2C+and+grant+thy+petition%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Steele%2C+An+Antidote+against+Distractions%2C+or+an+Endeavor+to+Serve+the+Church+in+the+Daily+Case+of+Wanderings+in+the+Worship+of+God+%28London%3A+1667%29%2C+ch.+9%2C+pp.+204%2C+213-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60d84d2a26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/60d84d2a26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=But%2C%20lest%20any%20honest%20Christian%20should,thy%20meaning%2C%20and%20grant%20thy%20petition%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-29283f1287" data-kw="">
<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 3, pp. 84-86</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 5, pp. 212-13</span></figcaption>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-510eb4232c" data-kw="">
<blockquote><p>For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer (London: 1682), ch. 11</cite>, pp. 232-33</span></figcaption>

<blockquote><p>As the goodness of outward acts consists not in the acts themselves, so the acceptableness of them results not from the acts themselves but from the inward frame animating and quickning those acts, as blood and spirits running through the veins of a duty to make it a living service in the sight of God. Imperfections in worship hinder not God’s acceptation of it, if the heart spirited by grace be there to make it a sweet savour. The stench of burning flesh and fat in the legal sacrifices might render them noisome to the outward senses; but God smelt a sweet savour in them, as they respected Christ. When the heart and spirit are offered up to God, it may be a savory duty, though attended with unsavory imperfections.</p></blockquote>

<blockquote><p>6. The goodness of God is seen in bearing with the infirmities of his people and accepting imperfect obedience. Though Asa had many blots in his escutcheon [a coat of arms as an emblem], yet they are over-looked, and this note set upon record by divine goodness, that his heart was perfect towards the Lord all his days: ‘But the high places were not removed, nevertheless Asa’s heart was perfect with the Lord all his days.’ (1 Kings 15:14) He takes notice of a sincere, though chequered obedience, to reward it, which could claim nothing but a slight from Him if he were extreme to mark what is done amiss. When there is not an opportunity to work, but only to will, He accepts the will, as if it had passed into work and act. He sees ‘no iniquity in Jacob,’ (Num. 23:21) i.e. He sees it not so as to cast off a respect to their persons and the acceptance of their services: His omniscience knows their sins, but his goodness does not reject their persons. He is of so good a disposition that He delights in a weak obedience of his servants, not in the imperfection but in the obedience: ‘He delights in the way of a good man,’ (Ps. 37:23) though he sometimes slips in it: He accepts a poor man’s pigeon as well as a rich man’s ox; He has a bottle for the tears and a book for the services of the upright (Ps. 56:8), as well as for the most perfect obedience of angels. He preserves their tears as if they were a rich and generous wine, as the vine-dresser does the expressions [pressed out flowings] of the grape.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God (London, 1682) | ‘On the Goodness of God’</cite>, pp. 656-57</span></figcaption>

</figure><figure class="quote" id="q-cde84f7fbd" data-kw="">
<blockquote><p>For my part I have often truly professed, that I look at many liturgies which I have read as I do at the prayers of some honest men who use little method, nor very meet words and often toss God’s name through weakness; who put that last which should be first, and that first which should be last, but yet the matter is honest and good. I would not prefer such a man in a congregation before an abler man who will speak more composedly and agreeable to the matter: But yet I would not be so peevish as utterly to refuse to join with such a one. But as God does not reject his prayers notwithstanding all his weakness, no more would I. And I had rather have such prayers than none at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions (London: Symmons, 1670), pt. 1 | Direction 32</cite>, p. 186</span></figcaption>

</figure><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions (London: Symmons, 1670), pt. 1 | Direction 58</cite>, p. 284</span></figcaption>

<blockquote><p>For the benefit of Christian love and concord may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They [nonconfomrits] prefer their own manner of worshipping God as better than the [Anglican] Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacrilegious Desertion of the Holy Ministry Rebuked &amp; Tolerated Preaching of the Gospel Vindicated (1672), ch. 2</cite>, pp. 16-17</span></figcaption>

<blockquote><p>3… Christ does not disown all imperfect worship that has some superstition: And we must receive one another as Christ receives us. 4. It was superstitious persons that Paul commands Christians to receive to communion, Rom. 14:5. Thus he [the separatist opponent] condemns the apostles and the Churches then, and the Scripture itself.</p></blockquote>

</figure><figure class="quote" id="q-cbced76d48" data-kw="">
<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.”

— Richard Baxter, Schism Detected in both Extremes… (London: 1684), pt. 2, p. 15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C11.+He+%5Ba+schismatic%5D+condemns+as+idolaters+all+the+Churches+on+earth+for+six+hundred%2C+if+not+one+thousand+years+after+the+apostles%3B+not+one+Church%2C+Christian+or+heretic+%28as+far+as+any+history+tells+us+that+I+have+found%29%2C+did+ever+deny+such+things+as+he+calls+false+worship+or+idolatry.+They+all+went+further+than+our+%5BAnglican%5D+parish+churches+do.+At+baptism+they+used+the+white+garment%2C+tasting+milk+and+honey%2C+chrism+or+anointing+the+forehead%2C+crossing%3B+they+adored+only+standing%2C+and+not+kneeling%2C+every+Lord%E2%80%99s+Day%2C+all+as+significant+ceremonies%3A+No+one+Church+or+person+is+said+to+scruple+these%3B+I+think+they+did+not+%5Bdo%5D+well%3A+but+God+rejected+not+their+worship.+12.+He+makes+all+or+near+all+the+Churches+on+earth+idolaters+at+this+day%3A+All+on+earth+save+the+Protestants+are+far+grosser+in+their+liturgies+and+ceremonies+than+the+English%3A+Of+the+Protesants%2C+Sweden%2C+Denmark%2C+Saxony+and+all+the+Lutherans+have+liturgies%2C+crossing%2C+ceremonies%2C+church-images%2C+consubstantiation.+The+Helvetians+%5BSwiss%5D+are+such+as+are+called+Erastians%2C+making+the+magistrate+the+only+ruler%2C+and+%5Bmaking%5D+sacraments+common+%5Bto+all%2C+having+no+excommunication%5D.+Geneva+and+France%2C+yea+and+Holland%2C+have+their+liturgies+and+some+rites.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Schism+Detected+in+both+Extremes%E2%80%A6+%28London%3A+1684%29%2C+pt.+2%2C+p.+15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbced76d48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/cbced76d48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=11.%20He%20%5Ba%20schismatic%5D%20condemns%20as,have%20their%20liturgies%20and%20some%20rites." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-171b50607d" data-kw="">
<blockquote><p>”28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable. … 37. To hold that any congregations are such whose worship is faulty, but such as God forgives and accepts, but that it is unlawful for us to join with them, lest it make us guilty of their sin, this (though it should be erroneous, and uncharitable and sinful) yet is not to excommunicate that congregation as no Church or no Christians. But to say of any congregation that they want [lack] anything essential to Christianity or to make them capable to be loved as Christians, or that their worship of God is idolatry, or so bad as that God accepts it not, the evil of it being greater than the good (as poison in our food), and on this reason to declare that no good Christian should communicate with them, this is to excommunicate such [a] congregation, as far as one Church may excommunicate another, which is but by such renouncing their communion.² ² [An equivalent example of this is in 1 Kings 13:1-10.] 38. There is no history that I have seen or heard that tells us of any Churches on earth that for many hundred years together did worship God without a liturgy as faulty as ours: To make them all idolaters, and such whose worship God cursed and accepted not, is to make them no true Churches… and if Christ had no Church, He was no Head and King of it, and so no Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2</cite>, pp. 9-14</span></figcaption>

<blockquote><p>(2) There is dignitas convenientiae [worthiness of fitness], which consists, though not in a perfect and exact proportion, yet in some fitness and meetness unto that which is required. Thus, in scripture, are we commanded ‘to walk worthy of the Lord,’ worthy of our profession, worthy of the gospel… And thus must we come worthily: that is, so fitted and prepared as may bear some resemblance and agreement to the solemnity of the work that we go about. And in this sense, this worthiness follows that worthiness which is called by divines dignitas dignationis — ‘a worth of acceptance’, or a desiring of God to take our actions in good part for Christ’s sake, and to pardon the many failings that accompany them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 15 | ‘A Preparative Sermon for Receiving the Sacrament’</cite>, p. 336</span></figcaption>

</figure><figure class="quote" id="q-c240066799" data-kw="">
<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 15 | ‘First Sermon’ of Sermons on the Sacraments</cite>, pp. 351-52</span></figcaption>

<blockquote><p>…for when we see the strictness of the institution, and how far we come short of it, we are ready to doubt that we do too little, less than God requires… the true soul can comfort itself in the sincerity of its desires; for though God accounts nothing little that springs from an upright heart… Though they cannot be perfect in their services, yet they will make a right choice, serve God after his own manner; not make it up in the pomp, what is wanting in the power of religion, as many do; but look principally to the inward part, to the truth of religion.</p></blockquote>

<blockquote><p>We have here a full revelation of God’s favour to David and the kind intentions of that favour, the notices and assurances of which God sent him by Nathan the prophet… David’s purpose to build God a house is superseded. God took notice of that purpose, for he knows what is in man; and He was well pleased with it, as appears 1 Kings 8:18, Thou didst well that it was in thy heart; yet he forbade him to go on with his purpose (2 Sam. 7:5): “Shalt thou build me a house? No, thou shalt not (as it is explained in the parallel place, 1 Chron. 17:4)… That worship only is acceptable which is instituted; why should David therefore design what God never ordained? Let him wait for a warrant, and then let him do it. Better a tent of God’s appointing than a temple of his own inventing… God was not indebted to him for his good intentions, but, whatever he did for God’s honour, God was beforehand with him, 2 Samuel 7:8, 9… Blessings are entailed upon the family and posterity of David. David had purposed to build God a house, and, in requital, God promises to ‘build him a house,’2 Samuel 7:11. Whatever we do for God, or sincerely design to do though Providence prevents our doing it, we ‘shall in no wise lose our reward.’ He had promised to make him a name (2 Sam. 7:9); here he promises to make him a house, which should bear up that name… Though David came short of making good his purpose to build God a house, yet God did not come short of making good his promise to build him a house. Such is the tenour of the covenant we are under; though there are many failures in our performances, there are none in God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible | on 2 Samuel, ch. 7, vv. 4-17</cite></span></figcaption>

</figure><figure class="quote" id="q-1eb5a2a357" data-kw="">
<blockquote><p>But the reformation was not complete; the high places were not all taken away, though many of them were, 2 Chron. 15:3, 5. Those in the cities were removed, but not those in the cities of Judah, but not those in the cities of Israel which were reduced to the house of David; or those that were used in the service of false gods, but not those that were used in the service of the God of Israel. These he connived at, and yet his heart was perfect. There may be defects in some particular duties where yet the heart, in the man, is upright with God. Sincerity is something less than sinless perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible | on 2 Chron. 15, vv. 8-19</cite></span></figcaption>

</figure><figure class="quote" id="q-76e3df8a2d" data-kw="">
<blockquote><p>The irregularities they were guilty of in this solemnity. The substance was well managed, and with a great deal of devotion… 2. Many were permitted to eat the passover who were not purified according to the strictness of the law, 2 Chron. 30:18. This was the second month, and there was not warrant to put them off further to the third month… And they were loth to forbid them communicating at all, lest they should discourage new converts, and send those away complaining whom they desired to send away rejoicing. [Hugo] Grotius observes from this that ritual institutions must give way, not only to a public necessity, but to a public benefit and advantage… ‘The good Lord pardon every one’ in the congregation that has fixed, engaged, or ‘prepared, his heart’ to those services, though the ceremonial preparation be wanting. Note: (1) The great thing required in our attendance upon God in solemn ordinances is that we prepare our hearts to seek Him, that we be sincere and upright in all we do, that the inward man be engaged and employed in it, and that we make heart-work of it, it is all nothing without this. ‘Behold, thou desirest truth in the inward part.’… For this is the ‘one thing needful,’ that we ‘seek God,’ his favour, his honour, and that we set our hearts to do it. (2) Where this sincerity and fixedness of heart are there may still be many defects and infirmities, both the frame of the spirit and the performance of the service may be short of ‘the purification of the sanctuary.’ Corruptions may not be so fully conquered, thoughts not so closely fixed, affections not so lively, faith not so operative, as they should be. Here is a defect in sanctuary purification. There is nothing perfect under the sun, nor ‘a just man that doeth good, and sinneth not.’ (3) These defects need pardoning healing grace; for omissions in duty are sins as well as omissions of duty. If God should deal with us in strict justice according to the best of our performances, we should be undone. (4) The way to obtain pardon for our deficiencies in duty, and all the iniquities of our holy things, is to seek it of God by prayer; it is not so a pardon of course but that it must be obtained by petition through the blood of Christ. (5) In this prayer we must take encouragement from the goodness of God: ‘The good Lord pardon;’ for, when He proclaimed his goodness, He insisted most upon this branch of it, ‘forgiving iniquity, transgression, and sin.’… 2. A successful prayer… not only [He] did not lay their sin to their charge, but graciously accepted their services notwithstanding; for healing denotes not only forgiveness (Isa. 6:10; Ps. 103:3), but comfort and peace, Isa. 57:18; Mal. 4:2.</p></blockquote>

</figure><figure class="quote" id="q-4f0321b442" data-kw="">
<blockquote><p>For, 2. This would be acceptable to God. This ‘willing’ mind is accepted (2 Cor. 8:12), when accompanied with sincere endeavors. When men purpose that which is good, and endeavour according to their ability to perform also, God will accept of what they have, or can do, and not reject them for what they have not, and what is not in their power to do: and this is true as to other things besides the work of charity… It is accepted, indeed, where there is a performance as far as we are able, and when providence hinders the performance, as in David’s case concerning building a house for the Lord, 2 Sam. 7:1-29.</p></blockquote>

<blockquote><p>Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. [Joseph] Truman’s book of Natural and Moral Impotency. As if I were in a country where I could have liberty to read and pray, but not to preach, or to preach only once a month and no more: It is my duty to do so much as I can do, as being much better than nothing, and not to forbear all because I cannot do all. Objection: But you must forbear no part of your duty. Answer: True, but nothing is my duty which is naturally impossible for me to do. Either I can do it, or I cannot: If I can, I must (supposing it a duty in all other respects); but if I cannot, I am not bound to it. … Direction 14. Remember that no material duty is formally a duty at all times: that which is a duty in its season is no duty out of season. Affirmative precepts bind not to all times (except only to habits [inward dispositions] or the secret intention of our ultimate end, so far as is sufficient to animate and actuate the means while we are waking and have the use of reason.. Praying and preaching, that are very great duties, may be so unseasonably performed as to be sins: If forbearing a prayer or sermon or sacrament one day or month be rationally like to procure your help or liberty to do it afterward, when that once or few times doing it were like to hinder you from doing it anymore, it would be your duty then to forbear it for that time (unless in some extraordinary case): For even for the life of an ox or an ass, and for mercy to men’s bodies, the rest and holy work of a Sabbath might be interrupted: much more for the souls of many. Again I warn you, as you must not pretend the interest of the end against a peremptory absolute command of God, so must you not easily conclude a command to be absolute and peremptory to that which certainly contradicts the end: nor easily take that for a duty which certainly is no means to that good which is the end of duty or which is against it. Though yet no seeming aptitude as a means must make that seem a duty which the prohibition of God has made a sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: White, 1673), pt. 3, ch. 2, sect. 24, direction 13</cite>, pp. 685-86</span></figcaption>

</figure><figure class="quote" id="q-cf825e5b2a" data-kw="">

<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), bk. 8, ch. 2, sect. 25</cite></span></figcaption>

</figure><figure class="quote" id="q-5623f461a7" data-kw="">
<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863)</cite>, pp. 278-79</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+not+enough+to+justify+such+a+choice+and+practice%2C+that+it+be+in+itself+or+simply+best%2C+but+that+it+be+best+in+present+circumstances+and+all+things+considered+that+ought+to+be+considered+in+the+present+juncture%E2%80%A6.+The+most+sacred%2C+external+act+of+duty+becomes+a+sin+when+it+excludes+that+which+is+more+a+duty+at+that+time%E2%80%A6+How+long+was+sacramental+obsignation+%5Bby+circumcision+and+the+Passover%2C+Josh.+5%3A1-12%5D+in+the+wilderness+omitted%21+How+much+more+may+attending+upon+such+an+institution+in+what+some+may+think+a+more+eligible+manner%2C+if+there+be+a+reason+that+outweighs%2C+when+not+the+substance+of+the+ordinance+is+wanting%2C+but+what+is+counted+%28perhaps+by+you%29+a+fitter+modus+%5Bmode%2C+or+way%5D%3F%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+%26+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+pp.+278-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5623f461a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5623f461a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=It%20is%20not%20enough%20to%20justify,a%20fitter%20modus%20%5Bmode%2C%20or%20way%5D%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9db19e5262" data-kw="">
<blockquote><p>As to [John Brown of Wamphray’s charge of the partially conforming Scottish ministers] being robbed of the key of discipline, Wamphray, exaggerating, means partially so, so far as the presbyteries were restricted in certain ways by the bishops, and that externally, whereas much of the spiritual discipline of Christ could still be fulfilled through the pastors’ ministries (as our [English puritan] authors below will profoundly show) and presbyteries. All Church order and discipline, be reminded, as to being performed in specific circumstances, is a matter of decency, order and edification, and is limited thereto (1 Cor. 14:26, 40).¹ ¹ See ‘How All Church Governing May be Practically Done unto Edification’ and ‘On How Church Discipline is Limited to Edification in its Time &amp; Place, etc.’ at ‘On the Ordinances, Order &amp; Policy of the Church’ (RBO) In a passage the puritans often commented on to our purpose, Dt. 12:8–11, God’s people were to put off their enjoined, stated worship ordinances while they were in the wilderness (in that broken and declining Church-state) till they came “to the rest and to the inheritance,” when God would give “you rest from all your enemies round about, so that ye dwell in safety. Then… shall ye bring all that I command you, your burnt offering, and your sacrifices…” One key factor, the passage says, for legitimately omitting whole swaths of public discipline and worship is ‘that ye dwell in safety.’… … Heb. 3:2 says, in a comparison with Christ, “Moses was faithful in all his house.” Yet Moses and the Israelites in Ex. 8:25–26 (in that broken and declining Church-state) were not sacrificing to God in Egypt so as not to scandalize the Egyptians and for their physical safety, for “will they not stone us?” Thus Moses (the prophetic mouthpiece here before Pharoah) reasoned regarding sacrificing animals before their enemies: “It is not meet so to do.” Yet God heard the Israelites’ prayers and accepted their moral obedience unto Him (Ex. 1:21; 2:24; 3:7; 4:31; 6:5; 9:20; 14:13, 31), which they did not transgress even when in danger of their lives (Ex. 1:17), in contrast to omitting public worship ordinances.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

yers and accepted their moral obedience unto Him (Ex. 1:21; 2:24; 3:7; 4:31; 6:5; 9:20; 14:13, 31), which they did not transgress even when in danger of their lives (Ex. 1:17), in contrast to omitting public worship ordinances.”

<blockquote><p>…the minister who is to preach is to… to call upon the Lord to this effect: ‘To acknowledge our great sinfulness, First, by reason of original sin, which… doth defile our best actions… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed. And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord…&#x27;</p></blockquote>

<blockquote><p>Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them.</p></blockquote>

</figure><figure class="quote" id="q-20727f9d68" data-kw="">
<blockquote><p>For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…”

— Peter Martyr Vermigli, Gorham, Gleanings of a few scattered ears during the period of the Reformation in England (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550, pp. 189-90, 92, 94-96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+although%2C+as+I+said%2C+I+little+approve+it%2C+yet+I+see+that+sometimes+in+these+indifferent+matters+some+things%2C+although+they+be+grievous+and+burdensome%2C+are+to+be+born+so+long+as+it+is+not+permitted+by+law+to+deviate+from+them%3B+lest%2C+if+we+contend+for+them+more+bitterly+than+we+ought%2C+this+may+be+a+hindrance+to+the+advancement+of+the+Gospel%2C+and+those+things+which+are+in+their+nature+indifferent+may%2C+by+our+vehement+contention%2C+be+represented+as+ungodly.+Now+these+things%2C+unless+I+am+deceived%2C+bring+with+them+two+most+heavy+inconveniences.+For%2C+if+we+should+first+suffer+the+Gospel+both+to+be+spread+abroad+and+to+take+deep+root%2C+men+would+perhaps+be+better+and+more+easily+persuaded+to+remove+these+outward+appurtenances.+While+any+one+is+sick%2C+and+is+by+little+and+little+amending%2C+he+takes+it+very+ill+that+certain+slight+and+trifling+things%2C+as+well+in+food+as+in+drink%2C+should+be+removed+from+him.+But+the+same+person%2C+having+recovered+his+health%2C+rejects+those+things+of+his+own+accord+as+disagreeable+and+of+little+use.+If+England+were+first+well+and+diligently+instructed+and+confirmed+in+the+most+necessary+heads+of+religion%2C+she+would+not%2C+in+my+opinion%2C+at+length+take+it+in+ill+part+that+these+things%2C+however+superfluous%2C+should+be+removed.+But+at+this+time%2C+since+a+change+is+being+introduced+in+necessary+points+of+religion%2C+and+that+with+so+great+difficulty%2C+if+we+should+also+speak+of+those+things+as+ungodly+which+are+indifferent%2C+the+minds+of+almost+all+men+would+be+so+turned+away+from+us%2C+that+they+would+no+longer+show+themselves+to+be+attentive+and+patient+hearers+of+sound+doctrine+and+necessary+sermons%E2%80%A6+Do+not+however+gather+from+hence+that+I+think+a+minister+of+the+Gospel+should+never+strive+to+assert+the+truth+of+the+Scriptures+and+of+doctrines.+This+I+do+not+affirm%3A+%5Bthose%5D+who+daily+come+forward%2C+both+in+public+and+private+disputations%2C+in+the+most+weighty+controversies+for+religion.+But+this+I+say%2C+that+these+things+which+are+of+less+moment+ought+not+to+be+a+hindrance+through+our+contention%E2%80%A6+Further%2C+if+we+proceed+to+oppose+these+indifferent+things+as+destructive+and+ungodly%2C+we+condemn+very+many+Churches+that+are+not+alien+from+the+Gospel%2C+and+we+too+bitterly+reprove+innumerable+Churches+which+are+of+old+distinguished+as+most+worthy+of+praise.+I+do+not+forget+that+the+authority+of+Churches%2C+whether+present+or+past%2C+ought+not+to+be+of+such+force%2C+that+by+them+the+truth+of+God%E2%80%99s+Word+should+be+overborne%3A+for+that+ought+to+remain+unshaken+and+unmoved%E2%80%A6+But+I+contend+that+on+account+of+things+indifferent%2C+this+ought+by+no+means+to+come+to+pass+that+churches+should+be+condemned%2C+or+that+we+should+speak+unfavourably+of+them%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Gorham%2C+Gleanings+of+a+few+scattered+ears+during+the+period+of+the+Reformation+in+England+%28London%2C+1857%29%2C+Letter+53%2C+%E2%80%98Martyr+to+Bishop+%5BJohn%5D+Hooper%E2%80%99%2C+Nov.+4%2C+1550%2C+pp.+189-90%2C+92%2C+94-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20727f9d68.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/20727f9d68.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=For%20although%2C%20as%20I%20said%2C%20I,we%20should%20speak%20unfavourably%20of%20them%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But we ought to tolerate things which are of this sort with the understanding that, when they appear less profitable, they be laid aside… for, in truth, I had rather that [they] were set aside: but, since that could not be done, I have resolved to bear it until better times be given</p></blockquote>

</figure><figure class="quote" id="q-c2d3663182" data-kw="">
<blockquote><p>I now come to that which you yourself also acknowledge, that all human inventions are not at once to be condemned. For it was clearly a human invention that we communicate [in the Lord’s Supper] in the morning, rather than after dinner: and it was a human invention that the prices of things that were sold in the primitive Church were laid at the apostles’ feet… I pass over that they who defend these things will be able to put forward some honest and just meaning not alien from the Scripture… But, if by this there is given occasion of error to the weak, let them be advised to regard these things as indifferent; let them be taught by sermons, not to judge the worship of God as placed in these things… Neither do I think that tyranny is instantly brought in if any indifferent thing be appointed to be done in the Church and be constantly performed by many. At this day we so administer the Eucharist in the morning time, that after dinner we will not have the communion in the sacred assembly [In the New Testament the Eucharist was always administered in the evening]. But who will say, that this, which we all do with the like will and consent is tyrannical? To myself truly, as I have now often mentioned, it would be more agreeable that we should only do what Christ did and delivered to his apostles. But, if any indifferent things have been added, I would not now sharply strive on this account; especially when we see that they by whom the light of the Gospel has been greatly promoted in England, and can be yet more promoted, oppose themselves to us. I acknowledge indeed with you that ‘whatsoever is not of faith is sin.’ (Rom. 14:23). But what the apostle wrote to Titus seems, above all things, to promote our having a quiet conscience in our actions: ‘Unto the pure all things are pure;” and to Timothy, “Every creature of God is good.” But it is not necessarily required that we should show express mention in holy Scripture of the particular things which we use: this is enough to know by faith, on the whole— that indifferent things cannot defile those who live with a pure and sincere mind and conscience… but I yet thought that the use of these differences was not in itself or its own nature ungodly or of fatal consequence, provided other things which are prescribed to us by the Word of God remain sound.</p></blockquote>

<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>

lves%3A+especially%2C+since+there+remains+the+liberty+of+preaching%2C+and+care+may+be+taken+that+no+greater+bondage+shall+be+imposed%3B+with+many+other+things+of+this+kind%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Zurich+Letters%E2%80%A6+ed.+Hastings+Robinson+for+the+Parker+Society%2C+2nd+ed.+%28Cambridge+Univ.+Press%2C+1846%29%2C+Letter+104%2C+Bullinger+to+L.+Humphrey+%26+T.+Sampson+%281566%29%2C+pp.+222-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5b9c684e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b5b9c684e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=9.%20Whether%20any%20constitutions%20may%20be,other%20things%20of%20this%20kind%2C%20etc." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For even if images can be retained [in churches] without offense to God, in which are represented sacred matters and histories, and which are extant throughout holy Scripture, and call to mind for the illiterate the stories of the deeds… Luther in fact, of pious memory, cleansed Churches in those locations by means of the Word of the Lord alone from the beginning, and through this one instrument of the Holy Spirit dragged away all idols from the hearts of his hearers… before he ever removed even the smallest ones from their eyes. For an idol in the world is nothing, as the apostle testifies, 1 Corinthians 8[:4], but instead they reside in the hearts of people… Thus Luther for many years [after the Reformation] wore the monastic hood or habit [clothing]… We experienced the same thing in the Dukedom of Wurttemberg, where in the first year after the light of the Gospel was introduced and lit, and Papal idolatry abrogated, images were removed throughout all the temples before the imagination of their worship was pulled away from the minds of men. This is why it has come about that very many people were so offended by this unseasonable reformation undertaken with a two-edged sword… that neither listened to evangelical assemblies nor approached their sacraments any longer, but rather clung to their Papist idolatry till their final breath, despising the teaching of the Gospel and the true use of the sacraments. This was the fruit of the unseasonable reformation in which everything was destroyed with no regard given to the weak in faith… But there is less danger when pure and genuine doctrine is heard, by which all people are called away from idolatry to the true worship of God in daily meetings, should they be retained, than if they should be abolished rashly and unthoughtfully. Because of this, we think that the magistrate of each place sins less, and takes counsel to the advantage of the salvation of souls far better, if they have endured them longer than if they have unseasonably abrogated them… If in fact they are matters of indifference [adiaphora], as is the consensus between us… Beza: This whole business can best be described as resting on two points, namely, the prudence of pastors and the consideration of circumstances… The custom was observed in certain places that images of this kind were retained for four years after reformation. But I do not want to fight with anyone about these things or reprove the deeds of other people; let us just be on guard against all opportunities for idolatry, as much as possible.</p></blockquote>

</figure><figure class="quote" id="q-4ecf20077e" data-kw="">
<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons… upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon</cite>, pp. 298-99</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-79ece82320" data-kw="">
<blockquote><p>God is not only a spirit or spiritual substance, but He is every way infinite and has sufficiency of all perfection in Himself. And therfore He takes no delight in any good thing that the creature can communicate to Him: but his delight is in the communication of his own goodness to us, and in all such duties whereby we conform ourselves to Him and magnify his goodness. Thus Paul, Acts 17:25, that ‘God needs nothing,’ and therefore He is not worshipped with anything made by the hands of man. And the Lord says by the Psalmist (Ps. 50; 8; 14) that He does not principally respect our gifts and our sacrifices, because all things are his, but He respects praise and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (d. 1602; London: Legatt, 1626), vol. 1</cite>, p. 703</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-e7d89572bd" data-kw="">
<blockquote><p>Doctrine 1. Albeit the Lord have made creatures which are excellent above man, especially as he is now fallen by sin, yet none of these are so perfect as that they can boast of purity before Him. For it is here again inculcated that saints and the heavens are not clean. So that whatever perfections there be in some creatures above others, yet all of them must be sensible of imperfection before God. … 3. The best sight will be got of the emptiness of the creatures perfections when we look to God, how perfect He is, and what his thoughts are of the creatures; for they are not clean in his sight, says He, whatever others may think of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the book of Job being the Sum of 316 Lectures (1657), sermon on Job 15:15-16</cite>, p. 213</span></figcaption>

<blockquote><p>He contains the holiness of all creatures put together and infinitely more. As all the wisdom, excellency and power of the creatures, if compared with the wisdom, excellency and power of God, is but folly, vileness and weakness; so the highest created purity, if set in parallel with God, is but impurity and uncleaness. Rev. 15:4, ‘Thou only art Holy:’ ‘Tis like the light of a glow-worm to that of the Sun; ‘The heavens are not pure in his sight, and his angels He charged with folly,’ Job 4:18; 15:15. Though God has crowned the angels with an unspotted sanctity and placed them in a habitation of glory, yet as illustrious as they are, they have an unworthiness in their own nature to appear before the throne of so holy a God; Their holiness grows dim and pale in his presence. ‘Tis but a weak shadow of that divine purity, whose light is so glorious that it makes them cover their faces out of weakness to behold it, and cover their feet out of shame in themselves [Isa. 6]. They are not ‘pure in his sight’ because though they love God (which is a principle of holiness) as much as they can, yet not so much as He deserves: They love Him with the intensest degree, according to their power, but not with the intensest degree, according to his own amiableness: For they cannot infinitely love God, unless they were as infinite as God, and had an understanding of his perfections equal with Himself, and as immense as his own knowledge. God having an infinite knowledge of Himself, can only have an infinite love to Himself, and consequently an infinite holiness without any defect; because He loves Himself according to the vastness of his own amiableness, which no finite being can. Therefore, though the angels be exempt from corruption and soil, they cannot enter into comparison with the purity of God, without acknowledgment of a dimness in themselves. Besides, ‘He charges them with folly,’ and ‘puts no trust in them,’ because they have the power of sinning, though not the act of sinning: They have a possible folly in their own nature to be charged with. Holiness is a quality separable from them, but it is inseparable from God. Had they not at first a mutability in their nature, none of them could have sinned, there had been no devils; but because some of them sinned, the rest might have sinned: And though the standing angels shall never be changed, yet they are still changeable in their own nature, and their standing is due to grace, not to nature; and though they shall be forever preserved, yet they are not, nor ever can be immutable by nature, for then they should stand upon the same bottom with God Himself; but they are supported by grace against that changeableness of nature which is essential to a creature: The Creator ‘only hath immortality,’ that is, immutability (1 Tim. 3:16).</p></blockquote>

<blockquote><p>Furthermore that must be observed: what kind of idolatry that is which saint Paul says may fall into a brother and yet he retain the name of ‘brother’. (1 Cor. 8, 10) This appears upon the discourse he makes in that epistle to have been only a sitting down to eat at the feast of idolaters, made in honor of their idols, without any honor done to idols by sacrifice or bodily worship, and without any conscience of that meat more than of other. Which although he prove a species of idolatry: yet was that one of the least and lightest kinds, and such as holding still the foundation of Christianity, could not without obstinacy in it, cut [him] from the church. Whereby [it] falls out that the papists, which in their idolatry raze the foundations of true religion, cannot, by that place, come into any account of the church of God.</p></blockquote>

<blockquote><p>Assertion Two. Yet in other things there ought to be great respect had to offense, and men ought to be swayed accordingly in their practice, as the former reasons clear. As (1), if the matter is of light concernment in itself, as how men’s gestures are in their walking (suppose in walking softly, or quickly, with cloak or without) men ought to do, or abstain, as may prevent the construction of pride, lightness, etc., or give occasion to others in any of these. Of such sort was womens’ praying with their heads uncovered amongst the Corinthians, it being then taken for an evil sign. Yet if it is necessary, there is nothing little, as Moses will not leave a hoof (Ex. 10)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament of the Church of Scotland or, A Treatise concerning Scandal (Edinburgh, 1659), pt. 1</cite>, ch. 6, pp. 25-26</span></figcaption>

</figure><figure class="quote" id="q-688bda96f3" data-kw="">
<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas: 1. There is no man that has not some error and some sin. 2. There is no man that does all that ever he was able to do to understand all the truth. 3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful. 4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt. 3, Christian Ecclesiastics</cite>, p. 895</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>

<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions… 1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) … 2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>

</figure><figure class="quote" id="q-6867dcfd5e" data-kw="">
<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>

</figure><figure class="quote" id="q-a79e38bdde" data-kw="">
<blockquote><p>If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.</p></blockquote>

gs%20were%20by%20a%20sovereign%2C,nature%E2%80%99s%20light%20and%20society%2C%20arising%20therefrom." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bf87252aa8" data-kw="">
<blockquote><p>…we might find much matter, both of rejoicing and mourning, in the wonderful commencement and advancement of this work of reformation [in 1689-1690]. As at the Jews’ return from Babylon to Jerusalem, the priests and Levites, and all the people shouted with a great shout when they praised the Lord because the foundation of the House of the Lord was laid; Yet some of them that had seen the first House wept with a loud voice so that the people could not discern the noise of the shout of joy from the noise of weeping. So at this time we are called to rejoice with thanksgiving for, and we should indeed be very ungrate and unworthy if we did not acknowledge with praise and admiration, the mercy of God which endures forever, manifested and magnified in the progress of this work hitherto… But though for these things we be called to rejoice, yet we are no less obliged to mourn when we observe this House of the Lord, so unlike the former, wanting many things the former had, and pestered with many things the former wanted [lacked]. As at the building of the second House, after the captivity of Babylon, they that had seen the first House wept with a loud voice when they observed its constitution and structure, so far short of the former, for order and beauty, and wanting some glorious prerogatives the other had, as the Urim and Thummim, the fire from Heaven, the ark of the testimony, etc. So, they that have seen our former reformation in its integrity [in 1638-1650], before the late deformation, can hardly refrain from weeping at the sight of the sad disproportion between this and the former. In the former, as the constitution was calculated in the nearest conformity to the divine pattern;</p></blockquote>

</figure><figure class="quote" id="q-363697ea87" data-kw="">
<blockquote><p>In which case the Church cannot be settled all in one day, or in one year, but must crave time, as the building of Solomon’s Temple, and of the second Temple after the Babylonian Captivity, which was not accomplished in several years. Nor can it be planted over again all at once, no more than it could be in Joshua’s days, or the Judges, or in the time of the reforming kings of Judah, until the Canaanites and other enemies be subdued. Nor can it be purged totally altogether, but gradually, least it be in hazard of a superpurgation.</p></blockquote>

<blockquote><p>Moreover, when a magistrate is not able to do some part of his office, as for example, being able to do the duties which are to be performed in peace, is insufficient for martial affair, yet no man refuses that which he is able to give because he is not able to do all that is required: Even so, endeavoring to our uttermost a sufficient ministry, I would think in the mean season that the good things they are able to give us may be taken at their hands.</p></blockquote>

</figure><figure class="quote" id="q-7e9215f958" data-kw="">
<blockquote><p>Neither may they forbid a communion with them in good because all communion in evil is denied us. Neither to hear them preach evil or untruth is to communicate with them in evil, except we yield to, believe, or obey their evil. And so those Scriptures forbidding to hear are to be understood. For Jeremiah did hear the false prophet Hananiah and said ‘amen’ to his prayer (Jer. 28:6). That is, to that good, or to those words of his prayer which might be taken well, he answered ‘so be it, the Lord ratify they words,’ but yet he reproved the evil.</p></blockquote>

</figure><figure class="quote" id="q-6e7dc48603" data-kw="">
<blockquote><p>That which is lawful for them to do… that is lawful for others to join with them in: for that which is no sin in the principal is none in the accessory, ceteris paribus [other things being equal]. And it cannot be simply unlawful to join in any action that is lawful, quatenus talis [so far as it is such].</p></blockquote>

<blockquote><p>5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church.</p></blockquote>

</figure><figure class="quote" id="q-265ec4233d" data-kw="">
<blockquote><p>Which refusal [of church communion] may be either partial or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brinsley-jr.html">John Brinsley Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Araignment of the Present Schism of New Separation in Old England… (London: John Field, 1646) Brinsley (1600-1665) was an English nonconforming presbyterian clergyman and an ejected minister in 1662.</cite>, p. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>2. Rash [Schisms]. 1. Where a ground and cause is pretended, but it is but a light cause. Possibly… some corruptions in or about the worship of God, but those not destructive to the ordinances, being not in substance, but in ceremony; and those such as the person offended is not enforced to be active in… Now in this case to separate, it is a rash separation, because it is upon a ground not sufficient, a light ground.</p></blockquote>

</figure><figure class="quote" id="q-33a1038d43" data-kw="">
<blockquote><p>…as to the preaching of the Word, we grant that the people are not obliged to give blind and implicit obedience to what is delivered by the ministers, as if they ought to receive as the Word of God whatsoever is delivered by them, but that they have power and ought by the judgment of discretion to search the Scriptures whether the things delivered by the ministers be so, to try the spirits whether they be of God or not, to prove all things and hold fast that which is good, Acts 17:11; 1 Jn. 4:1; 1 Thess. 5:18; and the like judgment of discretion we grant to them in relation to other parts of worship.</p></blockquote>

</figure><figure class="quote" id="q-3f78daab63" data-kw="">
<blockquote><p>…all corruptions in God’s Church and worship are displeasing to God and distastful to his people embracing the simplicity of the Gospel; but all corruptions are not alike in operation, quality and extent, nor of a like influence on God’s Church and worship: Consider therefore, some corruptions are substantial and intrinsical, vitiating the very subject, and so universally spread through the worship of God, that it cannot be used without sin; others are circumstantial and extrinsical to the same, vain, needless appendants, superadded by man’s will, but which notwithstanding God’s ordinances remain entire and exactly his, and may be used without participation in the affixed corruption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), p. 16 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-b194faad89" data-kw="">
<blockquote><p>10th Problem, ‘Where from bishops or the magistrate certain new and [previously] unused ceremonies, but called ‘indifferent’, are obtruded, whether a Church or the ministers ought to receive them in order to avoid a greater evil, for instance persecution or a major change in doctrine, or schism, etc.? I respond: 1st Conclusion: If the reception may note approbation, it is denied. For none ought to exert force to bear on the conscience or the power of the Church and the cause of truth for this reason. 2. If indeed the reception may note ecclesiastical connivance or permission, or toleration: of the common members it is able to be distinguished…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics (Amsterdam, 1663-1676), vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’, ch. 7, ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, Section 2, “Problems surrounding the causes of the ceremonies are these”</cite>, p. 431</span></figcaption>

<div class="actions"><button class="copy" data-copy="“10th Problem, ‘Where from bishops or the magistrate certain new and [previously] unused ceremonies, but called ‘indifferent’, are obtruded, whether a Church or the ministers ought to receive them in order to avoid a greater evil, for instance persecution or a major change in doctrine, or schism, etc.? I respond: 1st Conclusion: If the reception may note approbation, it is denied. For none ought to exert force to bear on the conscience or the power of the Church and the cause of truth for this reason. 2. If indeed the reception may note ecclesiastical connivance or permission, or toleration: of the common members it is able to be distinguished…”

— Gisbertus Voetius, Ecclesiastical Politics (Amsterdam, 1663-1676), vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’, ch. 7, ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, Section 2, “Problems surrounding the causes of the ceremonies are these”, p. 431">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C10th+Problem%2C+%E2%80%98Where+from+bishops+or+the+magistrate+certain+new+and+%5Bpreviously%5D+unused+ceremonies%2C+but+called+%E2%80%98indifferent%E2%80%99%2C+are+obtruded%2C+whether+a+Church+or+the+ministers+ought+to+receive+them+in+order+to+avoid+a+greater+evil%2C+for+instance+persecution+or+a+major+change+in+doctrine%2C+or+schism%2C+etc.%3F+I+respond%3A+1st+Conclusion%3A+If+the+reception+may+note+approbation%2C+it+is+denied.+For+none+ought+to+exert+force+to+bear+on+the+conscience+or+the+power+of+the+Church+and+the+cause+of+truth+for+this+reason.+2.+If+indeed+the+reception+may+note+ecclesiastical+connivance+or+permission%2C+or+toleration%3A+of+the+common+members+it+is+able+to+be+distinguished%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Ecclesiastical+Politics+%28Amsterdam%2C+1663-1676%29%2C+vol.+1%2C+pt+1%2C+bk.+2%2C+%E2%80%98Of+Ecclesiastical+Things%2C+or+Acts+%26+Exercises%E2%80%99%2C+Tract+1%2C+%E2%80%98Of+Formularies%2C+or+Liturgies+%26+Rituals%E2%80%99%2C+ch.+7%2C+%E2%80%98Questions+Further+Explained+on+the+Nature%2C+Causes+%26+Properties+of+the+Ceremonies%E2%80%99%2C+Section+2%2C+%E2%80%9CProblems+surrounding+the+causes+of+the+ceremonies+are+these%E2%80%9D%2C+p.+431&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb194faad89.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b194faad89.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=10th%20Problem%2C%20%E2%80%98Where%20from%20bishops%20or,it%2 <blockquote><p>Objection 2. Ordination and conformity, and common-prayers and ceremonies are connected with preaching, as one entire service; by partaking therefore of the one we contract the pollution of the other. Answer 1: What God Himself in a moral way joins together, no man may separate, only God Himself: But what God in nature has joined together, He gives us leave to separate, as chaff from wheat, etc. And so likewise for what man joins together, especially in the service of God and such matters thereof as God has not required; A set liturgy or stinted form of prayer for matter and words to be used (much less to be inseparably joined with preaching) is not required by the Lord, nor indeed is there any such necessary dependance by our laws… Answer 2… Nor are they so inseparably joined by our laws: But if they were, it is sufficient to my conscience that God has not so joined them. Our actings, and the reasons or grounds of them, are not to be interpreted in Church-matters by human laws; If they were, it would be difficult to inhabit in some commonwealths with a good conscience. Our living within the precincts of such a parish, our laws interpret as being of the same particular church with them for all Church-ordinances: but this being man’s law only, we judge ourselves not so necessarily involved by our habitation. A Church according to Scripture is a spiritual body: The limits are part of the essence and constitution of such a body, and therefore ought to be spiritual and of the same nature, and not merely human, as is the division of parishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3</cite>, pp. 20-22</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>3. It is an untrue supposition and but a begging of the question that our presence with anything obtruded unlawfully is a prejudice to that fundamental of the sovereignty of Christ. All men that sin do sin against his soveraignty: And all that obtrude anything unlawfully sin against it by that obtrusion. But if you obtrude a rash and passionate prayer on the people, or an erroneous or disorderly prayer, or an ill-composed hymn or psalm, their presence is no approbation of your error, nor denying of Christ’s sovereignty. Do you, or can you believe and make all your followers believe that the synagogue-worship and the Temple-worship were kept so pure by the priests, Levites and Pharisees in Christ’s days, as that there was nothing of human tradition obtruded? Or nothing but what God commanded? Can you believe this? Or can you believe that Christ was not usually or often present there? See Luke 4:16. At Nazareth where he had been brought up, as his custom was, he went into the synagogue on the Sabbath day—And of Paul its said, Acts 17:2. As his manner was, he went in to them, and three Sabbath dayes reasoned—Or do you believe, that Christ was a sinner? and that He contradicted his own sovereignty? What! and yet be a perfect Saviour? Who is it now that prejudices fundamentals?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671)</cite>, pp. 116-17</span></figcaption>

<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>

<blockquote><p>There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;”

</figure><figure class="quote" id="q-2b43c99223" data-kw="">
<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>

</figure><figure class="quote" id="q-682ade5ace" data-kw="">
<blockquote><p>… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this [singing of a human-composed doxology]… It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially, and to our edification, joined with them, and yet partake in none of these: nor is so much of these among them as he [the episcopal opponent] would make us believe.</p></blockquote>

</figure><figure class="quote" id="q-7dec54371f" data-kw="">
<blockquote><p>v. 16, ‘And Moses diligently sought the goat of the sin-offering;’… in such serious matters Moses had not spared labor and care, whereas the sons of Aaron, as if they had neither heard nor seen anything of the sort, pervert the whole order of them, although they had been just before reminded that they had been appointed to keep the charge of God. Perhaps they were impelled to this error by the trouble arising from their grief… Further from the anger of Moses, which is mentioned in his praise, we may infer that the transgression was no light one, although it was not so severely punished as the presumption of Nadab and Abihu… But the reason why God was more merciful to them than to their brethren is only known to Himself. Conjectures may, indeed, be advanced; but at last we must come to this, that because God’s judgments are hidden, they are not therefore unjust; but that we must humbly adore their depth into which the minds of men cannot penetrate. v. 19, ‘And Aaron said unto Moses, Behold, this day;’ Aaron replies that it arose from pious fear that they had not feasted before God, because they would in a manner have defiled the sanctuary by their tears and melancholy… but it was not a just defense; for he ought rather to have striven against the feelings of the flesh so that his domestic calamity should not withhold him from the service of God. But, inasmuch as in his perplexity his fear was deserving of pity, Moses forgives him; and it is said that he was appeased, because he finds less of evil than he supposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-b150bf6217" data-kw="">
<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments (1614; London: 1868), bk. 6, Contemplation 2</cite>, pp. 66-67</span></figcaption>

<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. … 2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse. 3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity. 4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’ 5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>

iv>

<blockquote><p>42nd Question, How Moses was contented with Aaron’s Answer. 1. He did not absolutely approve of his reason, as though he had done it intuita divino, by divine direction, as Cajetan: for Moses was better acquainted with God’s mind than Aaron, and there was a direct commandment, which should not have been omitted. 2. But Moses rather in human commiseration bears with Aaron’s infirmity: 1. because he saw him forced by a kind of necessity… 2. and afflication was not to be added to affliction, Osiander: and Moses found it to be of less fault than he supposed, Calvin: he did it not willingly, but of human frailty and of perplexity through grief, and therefore was to be pitied. 3. And it may be Moses deferred his further admonishing of Aaron till another time because he saw now he was in grief…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus… (London, 1631), on Lev. 10</cite>, pp. 197-98</span></figcaption>

<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-b0723d8425" data-kw="">
<blockquote><p>V. 3… this being the first violation of the law newly given, and committed by those who should have been the strictest observers and assertors of it, did deserve a very severe punishment.” … V. 12… Moses repeats and reinforces the former command… partly to encourage them to go on in their holy services and not to be dejected for the late severity, as if God would no more accept them or their sacrifices. … V. 16. ‘The goat of the sin-offering,’… which he [Moses] inquired into more than into the other sacrifices, because a mistake there was easy and probable, because that matter might seem something doubtful, by reason of two laws concerning it seemingly contrary, the one Lev. 4:21, where it is to be burned, the other Lev. 6:26, where it was to be eaten. But they are thus reconciled: It was to be burnt when the blood of this sacrifice was brought into the holy place, Lev. 4:16, 17; and when that was not done, which Aaron this first time could not do, for the reason expressed in Lev. 10:18, it was to be eaten, and here lay their mistake… he spares Aaron at this time, as overwhelmed with sorrow, and because the rebuking of him before his sons might have exposed him to some contempt. … V. 19. ‘This day have they offered;’ they have done the substance of the thing though they have mistaken this one circumstance. ‘Such things have befallen me;’ whereby, having been oppressed with grief, and almost bereft of my reason, it is not strange nor unpardonable if I have mistaken. ‘Should it have been accepted?’ because it was not to be eaten with sorrow, but with rejoicing and thanksgiving, as appears from Dt. 12:7; Dt. 26:14; Hos. 9:4; and I thought it fitter to burn it, as I did other sacred relics, than to profane it by eating it unworthily. V. 20. He [Moses] rested satisfied with his answer, either because he thought it reasonable, seeing the letter of the law ofttimes yields to necessities or great accidents, 2 Chron. 30:18; Mt. 12:3,Mt. 12:4; or at least because the things alleged were mitigations of his fault, and he would not add affliction to the afflicted, but rather defer the debate of it to a fitter opportunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations, on Lev. 10</cite></span></figcaption>

</figure><figure class="quote" id="q-dd7b17c97f" data-kw="">
<blockquote><p>Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, on Lev. 10 in The Exegetical Labors of the Reverend Matthew Poole, vol. 6 (VA: Master Poole Publishing, 2011)</cite>, pp. 152-54</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).”

<blockquote><p>This distinction the priests must carefully observe, and take heed of making any blunders… He enquires concerning one deviation from the appointment… Now observe here: 1. The gentle reproof Moses gives to Aaron and his sons for this irregularity… Yet observe how very mildly he deals with Aaron and his sons, considering their present affliction. He only tells them they should indeed have eaten it in the holy place, but is willing to hear what they have to say for themselves, being loth to speak to the grief of those whom God had wounded… 2. The plausible excuse which Aaron makes for this mistake. Moses charged the fault upon Eleazar and Ithamar (Lev. 10:16), but it is probable that what they did was by Aaron direction, and therefore he apologized for it… (2) How he makes this an excuse for his varying from the appointment about the sin-offering… He does not plead that his heart was so full of grief that he had no appetite for it, but that he feared it would not be accepted. Note: [1] Acceptance with God is the great thing we should desire and aim at in all our religious services… 3. The acquiescence of Moses in this excuse: He was content, Lev. 10:20. Perhaps he thought it justified what they had done. God had provided that what could not be eaten might be burnt. Our unfitness for duty, when it is natural and not sinful, will have great allowances made for it; and God will have mercy and not sacrifice. At least he thought it did very much extenuate the fault; the spirit indeed was willing, but the flesh was weak [Mt. 26:41]. God by Moses showed that he considered his frame. It appeared that Aaron sincerely aimed at God’s acceptance; and those that do so with an upright heart shall find He is not extreme to mark what they do amiss. Nor must we be severe in our animadversions upon every mistake, considering ourselves, lest we also be tempted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10, vv. 12-20</cite></span></figcaption>

<blockquote><p>…the king [David] said unto Nathan the prophet, ‘See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains.’ And Nathan said to the king, ‘Go, do all that is in thine heart; for the Lord is with thee.’ And it came to pass that night, that the word of the Lord came unto Nathan, saying, ‘Go and tell my servant David, ‘Thus saith the Lord, Shalt thou build Me an house for Me to dwell in?… And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom. He shall build an house for my name…’… Then went king David in, and sat before the Lord, and he said, ‘…now, O Lord God, thou art that God, and thy words be true, and thou hast promised this goodness unto thy servant: Therefore now let it please thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Lord God, hast spoken it: and with thy blessing let the house of thy servant be blessed for ever.&#x27;</p></blockquote>

<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>

<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>

</figure><figure class="quote" id="q-c112d7d3a3" data-kw="">
<blockquote><p>Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes: 1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son. 2. Because he was careful to confirm his faith by the experience of them which had received greater graces. 3. Because his joy did break out into an open profession of sacrifice. 4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means. 2. We take joy in them. 3. We express the fruits of it in our life. 4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes: 1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son. 2. Because he was careful to confirm his faith by the experience of them which had received greater graces. 3. Because his joy did break out into an open profession of sacrifice. 4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means. 2. We take joy in them. 3. We express the fruits of it in our life. 4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.”

— Richard Greenham, The Works of… Richard Greenham… (d. 1594?; London: Welby, 1612), pt. 4, ‘Godly Instructions’, ch. 66, ‘Of God’s Worship, &amp; of Religion True &amp; False’, p. 803">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoses+was+not+so+well+when+he+was+in+Midian%2C+as+if+he+had+been+in+Canaan%2C+yet+better+than+when+he+was+in+Egypt%3A+for+though+Jethro+had+not+the+worship+of+God+pure+in+every+respect%2C+yet+was+not+he+an+idolater.+For+then+Moses+would+not+have+dwelt+with+him%2C+nor+yet+have+sacrificed+with+him%2C+if+he+had+offered+to+a+strange+God.+Whence+we+learn+two+things%3A+The+first%2C+that+if+we+have+the+chief+and+principal+points+of+religion+with+us+although+there+may+be+some+wants+and+defects%2C+yet+that+we+make+much+of+God%E2%80%99s+great+blessing+therein%2C+and+labor+carefully+and+diligently+to+use+them%2C+showing+ourselves+thankful+to+God+for+them%3A+so+will+the+Lord+in+his+due+time+bestow+more+blessings+upon+us%2C+and+minister+that+which+is+wanting+unto+us.+Secondly%2C+that+the+Lord+will+always+have+some+to+keep+his+truth%2C+to+the+glory+of+his+own+name%2C+and+the+condemnation+of+the+wicked.+Jethro%E2%80%99s+religion+may+be+tried+by+these+notes%3A+1.+That+he+rejoiced+more+for+the+deliverance+of+God%E2%80%99s+people+than+for+the+promotion+of+his+son.+2.+Because+he+was+careful+to+confirm+his+faith+by+the+experience+of+them+which+had+received+greater+graces.+3.+Because+his+joy+did+break+out+into+an+open+profession+of+sacrifice.+4.+His+divine+speech+and+good+counsel+which+he+gave+to+Moses+does+testify+that+he+was+a+pure+worshipper+of+God%3A+at+the+least+he+held+the+chiefest%2C+and+was+not+a+novice+in+religion.+By+Jethro%E2%80%99s+example+we+may+learn+to+try+our+religion%2C+if+it+be+pure%2C+then%3A+%5B1.%5D+It+works+in+us+a+care+to+use+all+the+means.+2.+We+take+joy+in+them.+3.+We+express+the+fruits+of+it+in+our+life.+4.+We+rejoice+more+at+the+prosperity+of+God%E2%80%99s+people+than+at+our+own+preferments+or+commodity.%E2%80%9D%0A%0A%E2%80%94+Richard+Greenham%2C+The+Works+of%E2%80%A6+Richard+Greenham%E2%80%A6+%28d.+1594%3F%3B+London%3A+Welby%2C+1612%29%2C+pt.+4%2C+%E2%80%98Godly+Instructions%E2%80%99%2C+ch.+66%2C+%E2%80%98Of+God%E2%80%99s+Worship%2C+%26+of+Religion+True+%26+False%E2%80%99%2C+p.+803&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc112d7d3a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c112d7d3a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Moses%20was%20not%20so%20well%20when,at%20our%20own%20preferments%20or%20commodity." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c920bd6d5a" data-kw="">
<blockquote><p>…the spiritual worship of the inward man, and [that is] the very ground and foundation of all true worship of God: for God is a spirit and therfore must be worshipped in spirit [Jn. 4:24], that is, in the the mind, conscience, will, and affections. Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22… Now we cleave unto God by four things: by faith, hope, love and inward invocation… we are to lift up our hearts unto God, upon every occasion, that by inward and holy motions and affections they may be (as it were) knit unto Him. Now to conclude this point touching inward worship, we must remember that it alone is properly, simply, and of itself the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it. For God is a Spirit, and therefore the true worship that is done unto Him must be performed in spirit and truth, Jn. 4:24.</p></blockquote>

<blockquote><p>…God took notice of the sacrifice: but now they see the fire coming out from the presence of God, they are convinced both of the power and acceptation of the Almighty; They are at once amazed, and satisfied to see the same God answer by fire, which before had spoken by fire: God does no less approve our evangelical sacrifices than theirs under the [Mosaic] Law; But as our sacrifices are spiritual, so are the signs of his acceptation: Faith is our guide, as sense was theirs. Yea even still does God testify his approbation by sensible evidences: when by a lively faith, and fervent zeal, our hearts are consecrated to God, then does his heavenly fire come down upon our sacrifices; Then are they holy, living, acceptable. [Rom. 12:1-2]</p></blockquote>

<blockquote><p>[Gen. 22] Verse 12: ‘Seeing for my sake thou hast not spared thine only son.’ God accepts the resolute purpose and will of Abraham for the done deed. An obedient will then is accepted before God as the work itself: as the Apostle says, ‘If first there be a willing mind, God accepts it according to that a man has, not according to that he has not, 2 Cor. 8:12. [So Wolfgang] Musculus.</p></blockquote>

</figure><figure class="quote" id="q-9faa36859e" data-kw="">
<blockquote><p>3rd Doctrine. Temporary obedience does often turn aside a temporary punishment. Verse 26. ‘So He departed from him, etc.’ Zipporah here not of any devotion, but of necessity, circumcised her son, yet it pleased God so to accept of this forced obedience that he spared Moses: So many times a temporary and external obedience does turn away a temporal punishment: as Ahab’s sackcloth put off the punishment threatened, that it came not in his days. So the Samaritans’ corrupt worship of God delivered them from the lions, 2 Kings 17 (vv. 24-33). [So Josias] Simler. [Johannes] Piscator. If God be so pleased sometime with outward service, accepting the small beginnings of those that are coming unto Him: how much more acceptable unto Him is the true spiritual worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum… (d. 1621; London: 1633) | on Ex. 4, 4. Places of Doctrine</cite></span></figcaption>

</figure><figure class="quote" id="q-198ed5c4e6" data-kw="">
<blockquote><p>This regeneration and inchoate obedience, being wrought in the faithful by the Spirit of God, though it do not wolly extirpate and root out sin, yet it keeps it so under, that it reign not in them: and it so renews them that they labour to resist sin, and to live according to the Law of God: which obedience though it be in itself imperfect, yet is it accepted of God by faith in Christ, in whose perfect righteousness, whatsoever is imperfect in our obedience, is perfected, and our imperfections pardoned; [So Erasmus] Marbach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum… (d. 1621; London: 1633) | on Ex. 20, 10th Commandment, 5th Confutation</cite>, p. 1875</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“This regeneration and inchoate obedience, being wrought in the faithful by the Spirit of God, though it do not wolly extirpate and root out sin, yet it keeps it so under, that it reign not in them: and it so renews them that they labour to resist sin, and to live according to the Law of God: which obedience though it be in itself imperfect, yet is it accepted of God by faith in Christ, in whose perfect righteousness, whatsoever is imperfect in our obedience, is perfected, and our imperfections pardoned; [So Erasmus] Marbach.”

</figure><figure class="quote" id="q-ad2710556d" data-kw="">
<blockquote><p>This may move us to embrace integrity and sincerity, because the Lord so highly esteems it, that He accepts of our obedience as perfect which springs from it, though it be stained with much corruption, and joined with many imperfections. …those are said to have been perfect before God who in simplicity and uprightness of heart laboured after perfection, and served God in sincerity and truth, as Noah, Abraham, Job, David, Asa, Zachary and Elizabeth, though they had many corruptions and imperfections which in the Scriptures are recorded of them… And therefore David uses his sincerity in praying, as an argument to persuade the Lord to give him audience: ‘Give ear’ (says he) ‘unto my prayers, which go not out of feigned lips.’ (Ps. 17:1) And Hezekiah’s integrity of life, as a reason to move Him for the repealing of the sentence of death and prolonging of his days. ‘Remember now, O Lord,’ (says he) ‘I beseech thee, how I have walked before thee in truth, and with a perfect heart, etc.’ (Isa. 29:13)</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-cfca42e4d8" data-kw="">
<blockquote><p>But by reason of the short warning that they had, a multitude of the people of Ephraim, and Manasseh, Issachar and Zabulun had not cleansed themselves according to the Law in that behalf provided, Ex. 12; Num. 9, and therefore were in danger to be cut off, Lev. 7:20. In this regard they were in great distress, and in a sore strait, yet they thought it better to receive the sacrament, though they failed in some circumstances of their preparation, than to omit it until the next year, having wanted it so long before, whereupon they adventured to eat the Passover; …Hezekiah, in fear of God’s displeasure and in commiseration of the people that stood in danger of God’s plagues and punishments, falls to prayer for them and is instant with the Lord in that behalf: He saw their great desire to be made partakers of it; the pains that they had taken to come unto Jerusalem for that very purpose; and perceived a strange hand of God inclining their hearts so far… And thus he prayed unto God for them… The word that is translated ‘be merciful’ signifies thus much in effect, as if he had said, ‘The good Lord pardon and supply that which is wanting [lacking] in him that prepares his whole heart.’ And now they wanted not so much willingness, as time to prepare themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20</cite>, p. 111</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-2c61c9312a" data-kw="">
<blockquote><p>Another argument there is taken from them, that ‘they sought the Lord, etc.’ Which seeking of theirs is set out by the manner of it, that they prepared their whole heart to seek Him: Not as if their hearts were so free from sin, or so full of grace as they should have been; but that they were true and plain, and sincere: Not such as had no sin, for it is said, ‘they were not cleansed according to the purification of the sanctuary,’ but that did love no sin: Not such hearts as wanted no grace, or preparation for God’s ordinance: But such as were humbled for the want of grace and of that preparation that they should have made… For it is said, ‘He healed the people,’ that is, gave them that which God does offer unto his people in the sacrament: They received the seal of the Covenant, and He made good the Covenant unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20</cite>, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-f85c9e6781" data-kw="">
<blockquote><p>But what is that good and honest heart which they are commended for? it is a heart that does fully purpose to do well, though it fail much in that which it performs: that resolves beforehand to avoid the evil that shall be reproved, and to do the good duties that shall be commanded, and to believe and rest upon the promises that shall be pronounced, as far as God shall give ability, etc. Now wheresoever there is such a ready inclination unto goodness, there will be a bringing forth of fruit; though not in all alike, yet every one will do somewhat: and God will acknowledge them for good ground, and honest-hearted Christians, that yield Him but a thirty-fold, as well as those that yield Him sixty-fold,or an hundred-fold: for a less measure of fruitfulness is an argument of truth, as well as a greater measure, and therefore shall be respected and rewarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20</cite>, p. 119</span></figcaption>

</figure><figure class="quote" id="q-3820906d0c" data-kw="">
<blockquote><p>The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20</cite>, pp. 122-23</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…”

— John Dod, Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, pp. 122-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+doctrine+hence+arising+is+this%2C+that+so+long+as+we+labor+to+keep+the+substance+of+God%E2%80%99s+worship%2C+though+we+fail+in+some+circumstances+thereof%2C+He+will+be+merciful+to+us.+If+we+embrace+the+substance+thereof+willingly%2C+and+fail+in+the+circumstances+unwillingly%2C+God+will+never+lay+it+to+out+charge.+Examples+will+prove+this+more+fully+unto+us%3A+%E2%80%98Ye+have+heard+of+the+patience+of+God%E2%80%99+%28says+the+apostle+James%29+%E2%80%98and+ye+know+what+end+God+made+with+him.%E2%80%99+%28James+5%3A11%3B+Job+3%29%E2%80%A6+there+was+in+him+a+great+deal+of+passion+and+distemper%3A+and+that+he+held+out+but+very+weakly+in+a+great+part+of+the+conflict%E2%80%A6+yet+because+he+held+out+in+the+substance+of+godliness%2C+in+the+midst+of+all+his+woes+and+miseries%E2%80%A6+and+in+the+end+acknowledged+his+fault+and+desired+to+lay+his+hand+upon+his+mouth%3A+because+%28I+say%29+these+good+things+were+found+in+him%2C+God+passes+by+his+infirmities+and+takes+notice+of+his+patience%2C+with+high+commendation+thereof%E2%80%A6+For+the+Lord+in+his+wisdom+considered+that+it+was+not+through+any+stubbornness%2C+or+rebellious+disposition+that+he+brake+out+in+that+manner%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Dod%2C+Ten+Sermons%2C+Tending+Chiefly+to+the+Fitting+of+Men+for+the+Worthy+Receiving+of+the+Lord%E2%80%99s+Supper+%281634%29%2C+The+Fourth+Sermon+of+the+Lord%E2%80%99s+Supper%2C+on+2+Chron.+30%3A18-20%2C+pp.+122-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3820906d0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3820906d0c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=The%20doctrine%20hence%20arising%20is%20this%2C,he%20brake%20out%20in%20that%20manner%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ae1b34237" data-kw="">
<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon</cite>, pp. 125-28</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

+imputation+upon+Him%2C+as+who+should+say+that+He+were+such+an+extreme+and+rigorous+Judge+as+will+accept+of+none+but+of+those+that+have+attained+to+a+great+measure+of+perfection.+Besides%2C+%5B3.%5D%E2%80%A6+they+have+a+calling+to+partake+of+the+sacrament%2C+as+appears+in+this+text%E2%80%A6+all+such+as+prepared+their+whole+hearts+%28that+is%2C+did+their+best+endeauour+with+a+true+and+sincere+heart%29+to+seek+the+Lord.%E2%80%9D%0A%0A%E2%80%94+John+Dod%2C+Ten+Sermons%2C+Tending+Chiefly+to+the+Fitting+of+Men+for+the+Worthy+Receiving+of+the+Lord%E2%80%99s+Supper+%281634%29%2C+The+Fourth+Sermon+of+the+Lord%E2%80%99s+Supper%2C+on+2+Chron.+30%3A18-20+%7C+%28London%2C+1610%29%2C+4th+Sermon%2C+pp.+125-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ae1b34237.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2ae1b34237.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=In%20like%20manner%20is%20Rahab%20commended,sincere%20heart%29%20to%20seek%20the%20Lord." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

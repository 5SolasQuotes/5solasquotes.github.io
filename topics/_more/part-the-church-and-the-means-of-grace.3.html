<blockquote><p>2. [John] Robinson [a Separatist] says, ‘fundamental truths are holden and professed by as vile heretics as ever were since Christ’s days; a company of excommunicates may hold, teach and defend fundamental truths, yet are they not a true Church of God?’ [Rutherford’s] Answer. Papists hold fundamentals, and so do Jews hold all the Old Testament, and Papists hold both New and Old, but we know they so hold fundamentals that by their doctrine they overturn them; and though there be fundamentals taught in the Popish Church which may save if they were believed, yet they are not a true and ministerial Church simply, because, though they teach that there is one God, they teach also there is a thousand Gods whom they adore, and though they teach [that] there is one Mediator, yet do they substitute infinite Mediators with and besides Christ, so that the truth is, not a formal, ministerial and visible active external calling is in the Church of Rome, as it is a visible Church, in the which we can safely remain, though fundamentals be safe in Rome, and the books of the Old and New Testament be there, yet are they not there ministerially as in a mother whose breasts we can suck; for fundamental points falsely exponed, cease to be fundamental points; yea as they be ministerially in Rome, they be destructive of the foundation, though there be some ministerial acts valid in that Church, for the which the Church of Rome is called a true Church, [in Greek], in some respect, according to something essential to the true Church, yet never sine adjecto [without the adjunct], as if it were a true Church where we can worship God. Fundamentals are safe in Rome materially in themselves, so as some may be saved who believe these fundamentals; but fundamentals are not safe in Rome, Ecclesiastice, Ministeraliter, Pastoraliter [ecclesiastically, ministerially, pastorally], in a Church way, so as by believing these from their chairs so exponed, they can be saved who do believe them.</p></blockquote>

<blockquote><p>Answer:

1. The word ‘Church’ usually signifies among Christians a Christian society, or a company of Christians associated for God’s worship and mutual edification; sometime any company of Christians whether so associated or not; sometime those are called ‘Christians’—as distinct from infidels—who profess most of the substance of Christianity but deny some part, or who profess the whole substance or the fundamentals, though they contradict it again by plain consequence in other superadded points, though these, as compared with the orthodox, are wont to be called heretics. We deny not but that the greatest Papists are such Christians, and that as the word ‘Church’ is applicable to combinations or companies consisting of such materials, so far the Romanists are a true Church, supposing that we only speak of metaphysical truth. But as the word ‘Christian’ is taken for one that so holds the fundamentals of Christian faith as not to subvert them by plain consequence after he has professed them, so it is yet under dispute whether the Romanists be a true Church, and therefore not to be taken as granted. However, those Protestant divines that grant them to be a true Church do say that it is but by a metaphysical verity, convertible with the essence; but that morally it is a false Church and not a true one, as a thief is a true man, that is, truly a man, but he is not a true man, that is, not an honest faithful man.

2. The thing called ‘The Church of Rome’ does not consist of homogeneous parts, or at least that word signifies several sorts of persons. There are some that with the Pope and his cardinals entertain the full body of Popery and enslave the rest. There are multitudes of the people that silently live under them and let them alone, and are defiled by them in many things, but receive not the great and most dangerous part of their corruption. These are not equally to be called the ‘Church,’ nor are they equally in danger of damnation.

3. I deny the consequence of the major proposition. For if the Church of Rome be a ‘true Church,’ it is because they are true Christians, and not because they are Papists: so that to argue, ‘The Church of Rome is a true Church, therefore Popery is a safe way to salvation,’ is as unsound as to argue: Gehazi the leper is a living man, therefore the leprosy is a thing safe or profitable to man’s life. Popery is the disease of their Church, and Christianity is what makes them a Church. You may well therefore conclude that Christianity is a safe way to heaven, but not that Popery is so. To the confirmation I answer that the religion of Papists has two parts: the Christian religion, as they are Christians, and that makes them a true Church if they be one; and the Popish corruptions, which denominate them Papists, and that makes them not a true Church, nor is a safe way to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself</cite>, ... (London: Miller, 1657), ‘Query: Whether Popery be a safe way to salvation?’, p. 177</span></figcaption>

<blockquote><p>…when we call this Roman Church apostate, we mean not a full and entire defection from the Christian profession, such as we perceive in those who follow Mahomet; but a departure from the truth and purity of the Christian religion, which the Apostle [Paul] charges upon some among the Galatians and Corinthians (Gal. 3:1; 1 Cor. 15:12). [see also Gal. 5:4; Heb. 3:12] Nor must this word apostate be thought too severe, which Paul in 1 Tim. 4:1, uses in the same sense. Some (to adopt the words of Cyprian) shall apostatize from the faith; and yet they had not renounced Christianity, but mingled heresies with the Christian faith. We, therefore, say that the Roman Church is apostate, both because the Prelates of the Papacy have infected the doctrine of the Gospel with their poisoned errors, and more especially, because the people of the Papacy, through that blind obedience which they yield to their pastors, have eagerly imbibed the same errors.</p></blockquote>

<blockquote><p>Fourthly. [Romanist objection:] Yea, but there is no baptism but in the Church, and when you separate yourselves from us, you then separate yourselves from the Church. The answer: There is no baptism but in the Church, and we deny not also, that the Church of Rome is a Church. For in that we affirm that Antichrist rules there, we consequently hold that it is the Church, inasmuch as he cannot sit anywhere but in the Church [2 Thess. 2:4]. But it is one thing to separate ourselves from the Church of Rome defiled by Antichrist, and another thing to depart from the communion of the universal Church, as we have already declared. Again we depart not from the temple, but from the idolatry committed in the temple, nor from the commonwealth, but from the tyranny which oppresses the commonwealth, nor from the city, but from the pestilence which infects the city, nor from the communion and fellowship of the people (to whom we wish all happiness and salvation) but from the conspiracy of Antichrist and of his maintainers: we therefore renounce not their baptism, but we ratify it. By the same we are bound to serve God, and to renounce the devil: and following the same, we seek to serve God according to his Word, and renounce all idols. By these letters of natural birth, we are bound to maintain the laws of the ancient Christian commonwealth, which is the Church: and folowing them, we set up again before us the law of God, the only lawgiver of the Church, and would deliver the Church from all new impositions and burdens, which Antichrist has laid upon their consciences. By baptism we haue made an oath unto Christ, and the pope would turn our service from Christ, to his idols and to himself: we therefore set Christ against Antichrist, and the Church against his conspiracy. And this is that for which by the grace of God, we have been baptized into the Church, how tyrannical and disordered soever it has been. ‘But the ministers thereof, whom you pretense to be of Antichrist, they have baptized you.’ Indeed they have put water on my head, but Christ has baptized me. The tyranny or his officers, which he has established after his fashion, have made me lift up my hand and give him an oath: but they have made me to make it to the commonwealth, and not to the tyranny, in the name of Christ, and not in the name of Antichrist. The form of the oath has remained entire and sound, albeit the estate were changed. To follow therefore the tenor of mine oath, I will retire myself into the army of true citizens, and I will seek out the true Church in the place wherunto it has withdrawn itself, and I will renounce the communion of Antichrist, who under color of mine oath, makes me to break mine oath.</p></blockquote>

<blockquote><p>Whether may that baptism be allowed which is administered by heretics or Papists? If it be meant of such heretics as deny the principles of heavenly doctrine and utterly corrupt the essential form of baptism (as the Arians, Samosatians, Manichaeans and Macedonians) which are not sincere in the doctrine of the Trinity, baptizing so in the name of the Father, of the Son and of the Holy Ghost, that they deny nevertheless that the Son and Holy Ghost are coeternal, coessential and of equal honor with the Father, or that the Son of God did truly assume the human nature; then such baptism is not to be ratified, but to be accursed. For the essential form being once taken away, the matter itself is also taken away. And therefore it is to be thought that such are not so much to be rebaptized, but as that indeed they should rather be first consecrated with true baptism, who being converted to the knowledge of the truth, desire to be engrafted into the orthodox Church. And this agrees with the decree of the Nicene Council. But we must judge otherwise of the baptism of some other heretics: as the Novatians and Donatists, who delivered the true doctrine of the Trinity, or of Papists (who are out of the way of truth in some part of doctrine, and who possess the place of pastors and use the public ministery, either by common error, by long sufferance or by force, though they be not to be accounted as truly called). Wherein, although there be many things needless and superstitious, yet still Christ is retained and held, at least in title, to be the matter itself, the chief head and essential form of the institution, and the native meaning (without idolatry) of the words of baptism, “I baptize thee in the name of the Father, and of the Son and of the Holy Ghost,” is retained. Moreover it pleased God in mercy to conserve a remnant of his Church in the midst of Popery itself, even as the Israelites continued the use of circumcision though they embraced a false and impious service of God; and the vows are made in the name of Christ and not of Antichrist, or of any idol. Therefore that baptism is not void, but of value and force: for it is the ministry of those person, but of the Church as yet covered or hidden in Popery. They, I grant, did sprinkle the head or body, but Christ baptized inwardly. And therefore such baptism [is] neither to be annihilated, neither does it require Anabaptistical rebaptizing. But, forasmuch as they teach wickedly in other matters, they give just cause why the faithful should necessarily depart from them, as it is written, 1 John 5:21, “Flee idols.</p></blockquote>

<blockquote><p>…at least we yield to them [Romanism] that they have baptism, that they have the substance of Christian religion… First concerning baptism, they confess that we have it, and that it may be amongst heretics: Antiquity believed it, and we believe it with antiquity. They reiterate [perform again] not the baptism administred by us, we reiterate not the baptism administered by them… The true circumcision was in the Church of the ten tribes, it was not for all that the true Church: [but] an heretical Church shall have baptism, and yet for all that not cease to be a false Church; not in respect of the baptism, but of her heresy: not in regard of that which is pure in her and of the Lord’s institution, but in regard of her rebellion against the Lord and her own impurity. That they haue baptism then we grant, but so we say have all heretics, so the ten tribes after their apostasy received circumcision; this exception then is frivolous when they pretend that we confess that they have the baptism, and craftily dissemble that which we add, that they have adulterated and depraved it as much as in them lies.</p></blockquote>

uotes.github.io%2Fquote%2Fc0b41dd003.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0b41dd003.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=at%20least%20we%20yield%20to%20them,as%20much%20as%20in%20them%20lies&amp;text=at%20least%20we%20yield%20to%20them%20%5BRomanism%5D%20that&amp;text=depraved%20it%20as%20much%20as%20in%20them%20lies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. [John] Robinson [a Separatist] and our [Independent] Brethren acknowledge that the Church of Rome hath true baptism, for ‘they retain the essential causes of baptism, even as the vessels of the Lord’s house profaned in Babylon may be carried back to the Temple, but if these vessels were broken and mingled with brass and iron, and cast in another mold, they could not obtain their former place in the Temple. Baptism is a vessel profaned in Babel, but not broken; but the ministry and priesthood of Rome is like the new melted and mingled vessel, and essentially degenerated from the office of pastorship.’ But I answer, [1.] if baptism be valid in Rome so are the ministers baptizers, for if the ministers and priests be essentially no ministers, the baptism administrated by the Romish priests is no ministry, and [that would be] all one as [if it were] administrated by midwives and private persons, who therefore cannot administrate the sacraments validly in the essential causes, because they are essentially no ministers. If therefore Robinson will have the Romish priesthood essentially no ministry, by that same reason he must say, baptism administrated by Romish priests is no baptism, the contrary whereof he confesses: otherwise he must say baptism administrated, a non habente potestatem [by one not having the power], even by women and private men, is valid, and cannot be but esteemed lawful in the substance of the act. 2. These have a ministry essentially entire who have power under Christ to preach the Gospel and administrate the sacraments, Mt. 28:19. The Romish priests have this, and are called to this by the Church. … I answer, [1.] England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, in so far, as they be essentially the ordinances of Christ… 2. A ministry true in the essence may make a Church true, insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>

</figure><figure class="quote" id="q-ecb7aa4c29" data-kw="">
<blockquote><p>Mr. Hooker: ‘It shall follow that the Church of Rome is a true Church, for all the members of that Church have true baptism, which is the formal cause of a true Church: but that is false, that that Church is a true Church.’ [Rutherford’s] Answer: [1.] The conclusion of the connex proposition is nothing against me, who deny Baptism to be the formal cause of Membership. 2. Such a Baptism that is valid, as touching the substance of the seal, as is in Rome: such a Church according to the metaphysic entity and being of a Church, is Rome a Ministerial Church, teaching necessary fundamentals, though darkening and contradicting all; but it is not morally a true Church, but leprous and unclean. See what Junius, Whitaker, Calvin and Rivetus say hereupon: Mr. Hooker is far from their sound expressions…</p></blockquote>

your%20consequence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9c339dc602" data-kw="">
<blockquote><p>Some choose to refer this [Acts 14:23] to laying on of hands, as if it also were altogether necessary, and under this pretense say, Our calling is null, because the Ordinaries [in the RCC] (as they call them) have not laid hands on us, or because we are not consecrated in the Church of Rome. I answer, by those canons which they boast of, the consecration is null, where there was not first a lawful choice, or which was done by one who is excommunicated: Let them show but one in all their hierarchy who is lawfully chosen, yea who is not by the very law a hundred times excommunicate[d], if they will stand to their own synods. Why should we therefore desire hands to be laid on us by them? Or by what law can they do it? But we have by the blessing of God certain marks of our calling, being (through the grace of God) adorned with the lawful testimony of our life and doctrine from our Churches, and after that by calling upon the name of God confirmed in our ministry, which God I hope will bless, and cast out both the thieves and hirelings.</p></blockquote>

</figure><figure class="quote" id="q-c422225f03" data-kw="">
<blockquote><p>But the question yet remains from from whence had these before them their calling? Our divines tilen, Bucan, professors Leiden, Wallaeus, distinguish here three things:

1. Something in the calling of our reformers was from God: so authoritatively, they were called of god, the ministry being of god.

2. The Christian Church lying under Popery, called, designed, and ordained the men to be Pastors; so their calling according to the substance of the act was from God, and the Roman Church as a Chriftian Church.

3. There was corruption in the way and manner of their vocation, as the Antichristian ceremonies, and an oath to maintain the doctrine of the Church of Rome, not only as a Christian Church, but also as Romish; if any of them did swear to defend the corruptions of the church, this latter was taken away by God’s illumination of their minds: A called minister swears to defend the truth, and this truth of this Church; but aye under the notion of truth; and if he see it be error he still holds the substance of his oath, in as far as it is obligatory and ties him in conscience. It is objected: An Antichristian Church cannot ordain Christian ministers; rome was then an Antichristian Church; therefore. Answer: That which is wholly, as touching its whole essence Antichristian, cannot ordain Christian ministers: True, a dead man cannot beget a living barne [child]: the Roman Church was not wholly Antichristian, but kept some of Christ’s truth. that which is Antichristian in part only, may ordain ministers, who have the true essence of a ministerial calling…</p></blockquote>

<blockquote><p>‘But’ says [John] Robinson [the Separatist], ‘How can England forsake the Church of Rome and forsake the ministry, which is in the Church as in the subject, especially seeing you teach that a true ministry makes essentially a true Church?’ I answer, England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, insofar as they be essentially the ordinances of Christ: and I retort this argument: How can Separatists separate from both us and Rome, and yet retain the baptism in both our Church and Rome? 2. A ministry true in the essence may make a Church true [in Greek], insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>

<blockquote><p>The ordinary [call] is that which is wont to be made by ordinary means; such as was the call of the priests in the Old Testament and of pastors in the New. And this again is either good (inasmuch as it is instituted by God) or evil and corrupt (inasmuch as it has been vitiated by the depraved morals and customs of men), which either absolutely and in every part is so bad that it cannot be reformed, but must be wholly abolished (such as is the call of the Pope and of his cardinals); or only partly, which although somewhat depraved from the fault of men, yet still retains something good from the first institution of God (such as is the call of the Roman bishops).</p></blockquote>

<blockquote><p>IV. From this concord sought and sometimes achieved by the Reformed with the Churches of the Augsburg Confession, Roman Catholic scholars infer and believe that the Reformed can and should also unite with the Roman Church and not reject its communion. As if, in their view, there were no reason to secede from the Roman Church more than from the Churches of the Augsburg Confession, with which they also have significant controversies. Therefore, it will be useful to explain the reason for this distinction and to show why Protestants, despite the controversies between them, can and should seek unity among themselves, while such a union with the Roman Church is neither lawful nor possible.</p></blockquote>

<blockquote><p>3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Ahab’s time, Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micah, Obadiah and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; The godly in England who refused the Popish ceremonies and Antichristian Bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part [in the Roman fold], which cannot be denied to be a ministerial Church. … 5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church.

6. We may well hold that Ambrose says well that a Church wanting the foundation of the apostles is to be forsaken.

7. There is a forced separation through tyranny from personal communion, and a voluntary separation; David was forced to leave Israel and was cast out of the Inheritance of the Lord; the former is not our sin, and our separation from Rome has something of the former, the latter would be wisely considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644) | pt. 2, pp. 253-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

</figure><figure class="quote" id="q-6af922f56b" data-kw="">
<blockquote><p>Papists hold fundamentals, and so do Jews hold all the Old Testament, and Papists hold both New and Old, but we know they so hold fundamentals that by their doctrine they overturn them; and though there be fundamentals taught in the Popish Church which may save if they were believed, yet they are not a true and ministerial Church simply, because, though they teach that there is one God, they teach also there is a thousand Gods whom they adore, and though they teach [that] there is one Mediator, yet do they substitute infinite Mediators with and besides Christ, so that the truth is, not a formal, ministerial and visible active external calling is in the Church of Rome, as it is a visible Church, in the which we can safely remain, though fundamentals be safe in Rome, and the books of the Old and New Testament be there, yet are they not there ministerially as in a mother whose breasts we can suck; for fundamental points falsely exponed, cease to be fundamental points; yea as they be ministerially in Rome, they be destructive of the foundation, though there be some ministerial acts valid in that Church, for the which the Church of Rome is called a true Church, [in Greek], in some respect, according to something essential to the true Church, yet never sine adjecto [without the adjunct], as if it were a true Church where we can worship God. Fundamentals are safe in Rome materially in themselves, so as some may be saved who believe these fundamentals; but fundamentals are not safe in Rome, Ecclesiastice, Ministeraliter, Pastoraliter [ecclesiastically, ministerially, pastorally], in a Church way, so as by believing these from their chairs so exponed, they can be saved who do believe them.</p></blockquote>

<blockquote><p>Question 2. May a Papist or a heretic by his knowledge be a lover of God as God? Answer: What is said to the former question is here to be reviewed. And further:

1. A Papist and such heretic as positively holds all the essentials of Christianity, and sees not the opposition of his false opinions hereto, and holds Christianity more practically than those false opinions, may be saved in that state, for he is a lover of God: But no other Papists or heretics can be saved but by a true conversion.

2. There is a sufficiency in the doctrine of Christianity which they hold, to save them, as to objective sufficiency. And that God gives not subjective grace (of sanctification) to any such, notwithstanding their errors, is a thing that no man can prove, nor any sober charitable Christian easily believe: And experience of the piety of many makes it utterly improbable, though we know not certainly the heart of another. There are many murmurings against me in this city (behind my back: for never one man of them to my remembrance to this day, did ever use any charitable endeavor to my face to convince me of my supposed error) as one that holds that a Papist may be saved, yea, that we are not certain that none in the world are saved besides Christians; and the sectaries whisper me to one another to be like Origen, a person in these dangerous opinions, forsaken of God, in comparison of them: What really I assert about these questions, I have here briefly hinted, but more largely opened in my Catholick Theology: But I will confess that I find no inclination in my soul to desire that their doctrine may prove true, who hide the glorified love of God, and would contract his mercy and man’s salvation into so narrow a room as to make it hardly discernable by man, and the Church to be next to no Church, and a Savior to save so very few, as seem scarce considerable among the rest that are left remediless. And who would make us believe that the way appointed to bring men to the love of God is to believe that He has elected that particular person, and left almost all the world (many score or hundreds to one) unredeemed, and without any promise or possibility of salvation: I am sure that the Covenant of Innocency [of Works] is ceased; and I am sure that all the world was brought under a Law of Grace made after the fall to Adam and Noah: and that this Law is still in force to those that have not the more perfect edition in the Gospel. And that Christ came not to bring the world that never hear of Him, nor can do, into a worse condition than Jews and Gentiles were in before: nor has He repealed that Law of Grace which He before made them; nor has God changed that gracious Name which he proclaimed even to Moses, Ex. 34:6-7. And I am sure that Abraham, the father of the faithful, conjectured once, even when God told him that Sodom was ripe for destruction, that yet there might be fifty righteous persons in it; by which we may conjecture what he thought of all the world (read Mal. 1:14 with all the old translations in the polyglot Bible, and consider it). And I know that in every nation he that fears God and works righteousness is accepted of Him [Acts 10:35]; and that he that comes to God must believe that God is, and that He is the rewarder of them that diligently seek Him, and therefore without faith none can please God: And that men shall be judged by that same law which they were under and obliged by, whatever it be. And they that have sinned under the Law (of Moses) shall be judged by it; and they that sinned without that Law shall be judged without it. And I know that God is love itself and infinitely good; and will show us his goodness in such glorious effects to all eternity as shall satisfy us and fill us with joyful praise: And as for the Papists, I know that they are seduced by a worldly clergy, and that by consequence many of the errors in that Church do subvert the fundamentals; and so do many errors of the antinomians and others among us that are taken for religious persons; yea and as notoriously as any doctrines of the Popish councils do: But I know that as a logical faith or orthodoxness, which consists in holding right notions and words, deceives thousands that have no sound belief of the things themselves expressed by these words; So also logical errors about words, notions and sentences, may in unskilful men consist with a sound belief of the things which must necessarily be believed. And that Christ and grace may be thankfully received by many that have false names and notions, and sayings about Christ and grace. And I know the great power of education and converse, and what advantage an opinion has even with the upright, which is commonly extolled by learned, godly, religious men, especially if by almost all. Therefore I make no doubt but God has many among the Papists and the Antinomians (to name no others) who are truly godly, though they logically or notionally hold such errors as if practically held would be their damnation, and if the consequents were known and held: Much more when thousands of the common people, hold not the errors of the Church which they abide in. And it shall not be my way of persuading my own soul or others to love God, by first persuading them that He loves but few besides them. And when such have narrowed God’s love and mercy to all save their own party, and made themselves easily believe that He will damn the rest of the world, even such as are desirous to please God as they are, they have but prepared a snare for their own consciences, which may perhaps, when it is awakened, as easily believe that He will damn themselves. Let us give all diligence to make our own calling and election sure, and leave others to the righteous God, to whose judgment they and we must stand or fall. Who art thou that judgest anothers servant [Rom. 14]? As the [Mosaic] Covenant of Peculiarity was made only with the Israelites, though the Common Law of Grace (made to Adam and Noah) was in force to other nations of the world; So the more excellent Covenant of Peculiarity is since Christ’s incarnation made only with the Christian Church, though the foresaid Common Law of Grace be not repealed to all others: Nor can it be said that they sin not against a Law of Grace; or mercy leading to repentance. And as the Covenant of Peculiarity was not repealed to the ten [Northern] tribes (though the benefits were much forfeited by their violation), but God had still thousands among them in Elijah’s time that bowed not the knee to Baal, and such as Obadiah to hide the prophets; though yet the Jews were the more orthodox: Even so though the Reformed Churches, as the two tribes, stick closer to the truth, the kingdoms where Popery prevails, have yet many thousands that God will save; and notwithstanding their errors and corrupt additions, they have the same articles of Faith and Baptismal Covenant as we. And if any man think himself the wiser or the happier man than I, for holding the contrary, and thinking so many are hated of God more than I do (and consequently rendering Him less lovely to them), I envy not such the honor nor comfort of their wisdom.</p></blockquote>

ned%2C+as+easily+believe+that+He+will+damn+themselves.+Let+us+give+all+diligence+to+make+our+own+calling+and+election+sure%2C+and+leave+others+to+the+righteous+God%2C+to+whose+judgment+they+and+we+must+stand+or+fall.+Who+art+thou+that+judgest+anothers+servant+%5BRom.+14%5D%3F+As+the+%5BMosaic%5D+Covenant+of+Peculiarity+was+made+only+with+the+Israelites%2C+though+the+Common+Law+of+Grace+%28made+to+Adam+and+Noah%29+was+in+force+to+other+nations+of+the+world%3B+So+the+more+excellent+Covenant+of+Peculiarity+is+since+Christ%E2%80%99s+incarnation+made+only+with+the+Christian+Church%2C+though+the+foresaid+Common+Law+of+Grace+be+not+repealed+to+all+others%3A+Nor+can+it+be+said+that+they+sin+not+against+a+Law+of+Grace%3B+or+mercy+leading+to+repentance.+And+as+the+Covenant+of+Peculiarity+was+not+repealed+to+the+ten+%5BNorthern%5D+tribes+%28though+the+benefits+were+much+forfeited+by+their+violation%29%2C+but+God+had+still+thousands+among+them+in+Elijah%E2%80%99s+time+that+bowed+not+the+knee+to+Baal%2C+and+such+as+Obadiah+to+hide+the+prophets%3B+though+yet+the+Jews+were+the+more+orthodox%3A+Even+so+though+the+Reformed+Churches%2C+as+the+two+tribes%2C+stick+closer+to+the+truth%2C+the+kingdoms+where+Popery+prevails%2C+have+yet+many+thousands+that+God+will+save%3B+and+notwithstanding+their+errors+and+corrupt+additions%2C+they+have+the+same+articles+of+Faith+and+Baptismal+Covenant+as+we.+And+if+any+man+think+himself+the+wiser+or+the+happier+man+than+I%2C+for+holding+the+contrary%2C+and+thinking+so+many+are+hated+of+God+more+than+I+do+%28and+consequently+rendering+Him+less+lovely+to+them%29%2C+I+envy+not+such+the+honor+nor+comfort+of+their+wisdom.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Treatise+of+Knowledge+%26+Love%2C+%E2%80%A6+%28London%3A+Parkhurst%2C+1689%29%2C+pt.+2%2C+ch.+14%2C+pp.+267-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3068990442.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3068990442.html">Perma <blockquote><p>If anyone comes to you and does not bring this doctrine, do not receive him into your house, nor say greeting to him,” etc. Since therefore from apostolic tradition it is clear that certain persons who differ in doctrine are altogether to be rejected and avoided, and again that certain others are to be received and held in the place of brothers, one must consider what diversity of doctrine breaks the Christian bond of peace, and what does not. This Paul, as in all things, teaches excellently. For in the First [Letter] to Timothy, chapter 1, after he had commanded him to warn certain persons not to follow a different doctrine which gave no edification [1 Tim. 1:3-4], he immediately added: “Now the end of the commandment is love from a pure heart, a good conscience, and unfeigned faith.” [v. 5] By which he taught plainly enough wherein the approved and genuine doctrine of our religion is to be placed and recognized—namely, in love that is alien to fraud in conscience and to deceit in faith, which love is altogether inimitable by all destitute of the Spirit of Christ. Therefore, whoever displays this love in such manner that his life does not disprove it is clearly to be regarded as a member of Christ, whatever errors he may be subject to, and is worthy of being cherished by the duties of Christian brotherhood. Thus in chapter 6, after he had set forth the doctrines of faith in Christ along with the commands of genuine love, he wrote in this manner: “These things teach and exhort…” [v. 2] How then will these people justify their judgment before Him who commanded these things through Paul—these people who dare immediately to hand over to Satan, and, as far as lies in them, to cast out of the kingdom of God, men who are truly good, who knowingly resist no sound doctrine, who listen with ready minds to every admonition in which the Spirit of God breathes and his Word is expressed—men who reject only a few things, and these of no great moment, which they cannot yet recognize as having proceeded from God? . Peter Martyr Vermigli Latin On 1 Corinthians, ch. 10, verse 11 It is a pitiable thing that, although we have so many clear and open statements in the sacred writings concerning faith, hope, love, and the duties of the other virtues—things in which there is nothing obscure—we altogether leave these neglected, and wish, with such great superstition, to pursue matters which are uncertain and contribute less to salvation. This the Devil is intent upon: that men should labor strenuously in endless and useless questions, while casting aside those things which are necessary to be kept. . King James I of Great Britain as reported by Isaac Casaubon, Epistle 710, to Cardinal Perron Latin But the King judges it to be most truly written, in the explanation of [the Greek phrase] “the things simply necessary,” that the number of things absolutely necessary for salvation is not great. Therefore His Majesty considers that there will be no shorter way to enter into concord than if the necessary things are carefully separated from the non-necessary, and that every effort be expended so that agreement may be reached concerning the necessary; in the non-necessary, room should be given to Christian liberty. The King calls those things “simply necessary” which either the Word of God expressly commands to be believed or done, or which the ancient Church drew out from the Word of God by necessary consequence. But the things which, apart from the Word of God, have been received into the use of the Church by human institution—although piously and prudently, according to the circumstances of the time—His Majesty considers can be changed, softened, or antiquated; and what Pius II said concerning clerical celibacy, that although it had once been rightly enacted, it would now be better abolished, the King believes that this, in general, may be applied to most ecclesiastical observances introduced apart from the Word of God. If, for deciding the controversies of the present day, this distinction were applied, and divine law were candidly separated from positive law, it appears that there would not be, among pious and moderate men, a long or bitter contention concerning those things which are absolutely necessary. For these things are few, as we just said, and are approved almost equally by all who claim to be called Christians. And the Most Serene King considers this distinction to be of such great weight for diminishing the controversies which today so greatly trouble the Church of God, that he judges it the duty of all who are devoted to peace to explain, teach, and press this distinction with the utmost diligence. . Francis Junius Latin Eirenicum, pt. 2, on Psalm 133 Therefore I can hardly express my astonishment at the audacity—or rather the madness—of those men who esteem so lightly this right of kinship, established by God Himself, founded upon divine power and constituted by means that are altogether divine, that they judge others not to be their brothers; or even if, in general terms, they acknowledge that we are brothers to one another, yet when it comes to particulars—this or that individual, this or that church—they think that such a person or such a church has nothing at all in common with them in respect of fellowship and brotherhood. But now—good God—what do I hear? A man cannot abolish the obligation of nature; nor can one man, by any private or individual act of his own, remove a human bond of kinship. And shall that bond which the divine institution of grace has established be dissolved at the will of man? O pitiable madness! Whoever allows himself to be carried away into such a state must, of necessity, already have torn himself away from God and from Christ before he can, even in thought, tear another away. For who hates his own flesh? What member devotes its efforts to mutilating its own body? He is no longer of the body of Christ who plans to cut off a member of Christ. And yet this disease (if I may speak so) is epidemic in our age: in which we are, nearly all of us, most daring in noticing, weighing, judging, condemning and exploding the deeds of our brethren, and in insolently deposing them; nor do we hesitate to assail men, churches, whole regions and authorities appointed by God with curses and anathemas, as though by some sovereign right—merely because they do not agree with us in all things, although they hold the mind of Christ. Our union remains, my brother, it remains; but the estrangement is yours (for which I feel pity). If you are willing to estrange yourself from me, you cannot avoid first estranging yourself from Christ, in whom we are brothers. I neither will nor can do this; for Christ has joined me to Himself as a brother, and has made me a brother to you. If you break the bond of brotherhood, I shall knit it again; if you unsew it, I shall labor to mend it; if you overturn it, I shall raise it anew; if you deny it, Christ affirms it—and I with Christ. If you will not listen, yet good men hear, and the Lord hears, before whom I grieve from the heart over your powerlessness. Led by mercy, I shall bear whatever I cannot cure; but in bearing it, I shall carefully maintain these two things: first, that I steadfastly await from the Lord the healing of this wretched infirmity of yours; second, that I myself watch for just opportunities to assist you in love and to lift you up again, if perchance God may at some time be pleased to use this my endeavor for your salvation. For why should we not bear with those who are disturbed in mind—even in matters of religion—just as readily as we bear with those whom anger, hatred or other such passions have driven out of the state of a sound mind? If such things arise among brothers, they are nonetheless brothers, and do not cease to be such. I shall therefore act unjustly if, because you deny that you are my brother, or deny the duty of a brother, I fall into the same fault. I am unwilling to heap my own wrongdoing upon your folly; but whatever wisdom I have received from the Lord, that I intend to preserve unimpaired, and by duty to procure your restoration—or at least, if nothing else, to testify before God and men to the obligation which is mine. What then do we suppose, poor wretches that we are? What do we imagine, when with such loftiness of brow we thrust one another out, as with a pitchfork, and apply a kind of censor’s rod indiscriminately to these and to those, as though we alone possessed the nose for judgment, or as though Christ had transferred to us this faculty, to be abused according to the caprice of our own spirits? Let such things indeed be done by the grooms of Satan; but it is not fitting for the sheep of Christ—least of all for pastors. Rather, let us yield to Christ, who most graciously admits both us and them into the communion of His body and Spirit. . David Pareus Latin Irenicum ch. 4 The first question will be: Which articles are fundamental, that is, in which heads of faith does the foundation of salvation truly consist? Here there must prudently be distinguished the articles of the catholic faith—which no Christian of adult age, whether learned or unlearned, may, without loss of salvation, either be ignorant of or fail to believe—from other questions that come into controversy among some theologians because of differing understandings of some particular passage of Scripture; and also from scholastic or ecclesiastical conclusions, the knowledge and assent of which, one way or the other, are indeed necessary for theologians for the sake of the scientific character of their theological profession, and for transmitting or defending a fuller knowledge of divine matters, but which can be unknown by Christians in general without danger to salvation. For most of these either do not touch fundamental articles directly, or not even indirectly; rather, they are such that they will not benefit those who know them, if they do not possess true faith in Christ, nor will they harm those who are ignorant of them, if they truly believe in Christ. For I would venture to affirm that the greater part of both the ancient heresies and the present dissensions in the Church has arisen, and still arises, chiefly from this: that councils, bishops, and doctors of the Church, without any distinction, have put forth whatever doctrines of the schools and whatever opinions of the chairs as articles of the catholic faith, and have imposed them upon consciences as to be believed with the same necessity for salvation; and that from every discrepancy in the interpretation of the Scriptures they have far too easily fashioned heresies or schisms. . ch. 29 A foundation, properly speaking, is that which is laid in the lowest place beneath for the support of a building, and without which the house cannot stand. Thus the foundation of our faith and salvation will be that which all Christians must strictly believe as necessary for salvation, and without faith in which none obtain salvation. This foundation, in one word, is Jesus Christ, according to the apostle, etc. But the foundation of the prophets and apostles is the sum of the doctrine of the prophets and apostles, etc. In the Church the “elements of the Christian faith,” containing the sum of the Law and the Gospel, are accustomed to be so called; and all these appear able to be reduced to four heads: The first head is the Decalogue, etc. The second is the Apostles’ Creed, etc. The third is the Lord’s Prayer, etc. The fourth, finally, is concerning the sacraments, etc. In these heads, in our judgment indeed—if one should speak popularly—the foundation of the Christian faith and salvation, taken in the widest sense, consists. For he who shall have held these by faith and shall have practiced them will undoubtedly be saved, although he may be ignorant of the remaining debates of the theologians… Yet in these very heads we have freely conceded that some distinction may exist. For some things are more or less necessary to salvation than others. . Georg Calixtus Latin Of the Judge of Theological Controversies, sect. 1 &amp; 3 Let it be far from us, therefore, to hate, avoid or abhor any Christian who has not ceased to be a Christian, who has not ceased to be a son of God, and therefore is our brother, and together with us a member of the body of Christ and a co-heir of eternal salvation. Far be it, I say, that we should abominate the fellowship of anyone whom Christ has received into communion. Far be it that to him to whom He will say, “Come, blessed of my Father,” we should say, “Depart, cursed Satan…</p></blockquote>

now them, if they do not possess true faith in Christ, nor will they harm those who are ignorant of them, if they truly believe in Christ. For I would venture to affirm that the greater part of both the ancient heresies and the present dissensions in the Church has arisen, and still arises, chiefly from this: that councils, bishops, and doctors of the Church, without any distinction, have put forth whatever doctrines of the schools and whatever opinions of the chairs as articles of the catholic faith, and have imposed them upon consciences as to be believed with the same necessity for salvation; and that from every discrepancy in the interpretation of the Scriptures they have far too easily fashioned heresies or schisms. . ch. 29 A foundation, properly speaking, is that which is laid in the lowest place beneath for the support of a building, and without which the house cannot stand. Thus the foundation of our faith and salvation will be that which all Christians must strictly believe as necessary for salvation, and without faith in which none obtain salvation. This foundation, in one word, is Jesus Christ, according to the apostle, etc. But the foundation of the prophets and apostles is the sum of the doctrine of the prophets and apostles, etc. In the Church the “elements of the Christian faith,” containing the sum of the Law and the Gospel, are accustomed to be so called; and all these appear able to be reduced to four heads: The first head is the Decalogue, etc. The second is the Apostles’ Creed, etc. The third is the Lord’s Prayer, etc. The fourth, finally, is concerning the sacraments, etc. In these heads, in our judgment indeed—if one should speak popularly—the foundation of the Christian faith and salvation, taken in the widest sense, consists. For he who shall have held these by faith and shall have practiced them will undoubtedly be saved, although he may be ignorant of the remaining debates of the theologians… Yet in these very heads we have freely conceded that some distinction may exist. For some things are more or less necessary to salvation than others. . Georg Calixtus Latin Of the Judge of Theological Controversies, sect. 1 &amp; 3 Let it be far from us, therefore, to hate, avoid or abhor any Christian who has not ceased to be a Christian, who has not ceased to be a son of God, and therefore is our brother, and together with us a member of the body of Christ and a co-heir of eternal salvation. Far be it, I say, that we should abominate the fellowship of anyone whom Christ has received into communion. Far be it that to him to whom He will say, “Come, blessed of my Father,” we should say, “Depart, cursed Satan…”

— Martin Bucer, Letter to the Academy of Marburg, Yet it must be determined how far those who differ in doctrines of Christian teaching are to be granted the right of holy communion and fraternity preserved. | Certainly blessed Paul relates that he “handed over Hymenaeus and Alexander to Satan,” [1 Tim. 1:20; 2 Tim. 4:14] although they were blasphemers; but at the end of the same epistle he commands separation also from those who follow a different doctrine and do not adhere to the sound words of our Lord Jesus. [1 Tim. 6:3; 2 Tim. 4:3] And the presbyter John wrote:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+anyone+comes+to+you+and+does+not+bring+this+doctrine%2C+do+not+receive+him+into+your+house%2C+nor+say+greeting+to+him%2C%E2%80%9D+etc.+Since+therefore+from+apostolic+tradition+it+is+clear+that+certain+persons+who+differ+in+doctrine+are+altogether+to+be+rejected+and+avoided%2C+and+again+that+certain+others+are+to+be+received+and+held+in+the+place+of+brothers%2C+one+must+consider+what+diversity+of+doctrine+breaks+the+Christian+bond+of+peace%2C+and+what+does+not.+This+Paul%2C+as+in+all+things%2C+teaches+excellently.+For+in+the+First+%5BLetter%5D+to+Timothy%2C+chapter+1%2C+after+he+had+commanded+him+to+warn+certain+persons+not+to+follow+a+different+doctrine+which+gave+no+edification+%5B1+Tim.+1%3A3-4%5D%2C+he+immediately+added%3A+%E2%80%9CNow+the+end+of+the+commandment+is+love+from+a+pure+heart%2C+a+good+conscience%2C+and+unfeigned+faith.%E2%80%9D+%5Bv.+5%5D+By+which+he+taught+plainly+enough+wherein+the+approved+and+genuine+doctrine+of+our+religion+is+to+be+placed+and+recognized%E2%80%94namely%2C+in+love+that+is+alien+to+fraud+in+conscience+and+to+deceit+in+faith%2C+which+love+is+altogether+inimitable+by+all+destitute+of+the+Spirit+of+Christ.+Therefore%2C+whoever+displays+this+love+in+such+manner+that+his+life+does+not+disprove+it+is+clearly+to+be+regarded+as+a+member+of+Christ%2C+whatever+errors+he+may+be+subject+to%2C+and+is+worthy+of+being+cherished+by+the+duties+of+Christian+brotherhood.+Thus+in+chapter+6%2C+after+he+had+set+forth+the+doctrines+of+faith+in+Christ+along+with+the+commands+of+genuine+love%2C+he+wrote+in+this+manner%3A+%E2%80%9CThese+things+teach+and+exhort%E2%80%A6%E2%80%9D+%5Bv.+2%5D+How+then+will+these+people+justify+their+judgment+before+Him+who+commanded+these+things+through+Paul%E2%80%94these+people+who+dare+immediately+to+hand+over+to+Satan%2C+and%2C+as+far+as+lies+in+them%2C+to+cast+out+of+the+kingdom+of+God%2C+men+who+are+truly+good%2C+who+knowingly+resist+no+sound+doctrine%2C+who+listen+with+ready+minds+to+every+admonition+in+which+the+Spirit+of+God+breathes+and+his+Word+is+expressed%E2%80%94men+who+reject+only+a+few+things%2C+and+these+of+no+great+moment%2C+which+they+cannot+yet+recognize+as+having+proceeded+from+God%3F+.+Peter+Martyr+Vermigli+Latin+On+1+Corinthians%2C+ch.+10%2C+verse+11+It+is+a+pitiable+thing+that%2C+although+we+have+so+many+clear+and+open+statements+in+the+sacred+writings+concerning+faith%2C+hope%2C+love%2C+and+the+duties+of+the+other+virtues%E2%80%94things+in+which+there+is+nothing+obscure%E2%80%94we+altogether+leave+these+neglected%2C+and+wish%2C+with+such+great+superstition%2C+to+pursue+matters+which+are+uncertain+and+contribute+less+to+salvation.+This+the+Devil+is+intent+upon%3A+that+men+should+labor+strenuously+in+endless+and+useless+questions%2C+while+casting+aside+those+things+which+are+necessary+to+be+kept.+.+King+James+I+of+Great+Britain+as+reported+by+Isaac+Casaubon%2C+Epistle+710%2C+to+Cardinal+Perron+Latin+But+the+King+judges+it+to+be+most+truly+written%2C+in+the+explanation+of+%5Bthe+Greek+phrase%5D+%E2%80%9Cthe+things+simply+necessary%2C%E2%80%9D+that+the+number+of+things+absolutely+necessary+for+salvation+is+not+great.+Therefore+His+Majesty+considers+that+there+will+be+no+shorter+way+to+enter+into+concord+than+if+the+necessary+things+are+carefully+separated+from+the+non-necessary%2C+and+that+every+effort+be+expended+so+that+agreement+may+be+reached+concerning+the+necessary%3B+in+the+non-necessary%2C+room+should+be+given+to+Christian+liberty.+The+King+calls+those+things+%E2%80%9Csimply+necessary%E2%80%9D+which+either+the+Word+of+God+expressly+commands+to+be+believed+or+done%2C+or+which+the+ancient+Church+drew+out+from+the+Word+of+God+by+necessary+consequence.+But+the+things+which%2C+apart+from+the+Word+of+God%2C+have+been+received+into+the+use+of+the+Church+by+human+institution%E2%80%94although+piously+and+prudently%2C+according+to+the+circumstances+of+the+time%E2%80%94His+Majesty+considers+can+be+changed%2C+softened%2C+or+antiquated%3B+and+what+Pius+II+said+concerning+clerical+celibacy%2C+that+although+it+had+once+been+rightly+enacted%2C+it+would+now+be+better+abolished%2C+the+King+believes+that+this%2C+in+general%2C+may+be+applied+to+most+ecclesiastical+observances+introduced+apart+from+the+Word+of+God.+If%2C+for+deciding+the+controversies+of+the+present+day%2C+this+distinction+were+applied%2C+and+divine+law+were+candidly+separated+from+positive+law%2C+it+appears+that+there+would+not+be%2C+among+pious+and+moderate+men%2C+a+long+or+bitter+contention+concerning+those+things+which+are+absolutely+necessary.+For+these+things+are+few%2C+as+we+just+said%2C+and+are+approved+almost+equally+by+all+who+claim+to+be+called+Christians.+And+the+Most+Serene+King+considers+this+distinction+to+be+of+such+great+weight+for+diminishing+the+controversies+which+today+so+greatly+trouble+the+Church+of+God%2C+that+he+judges+it+the+duty+of+all+who+are+devoted+to+peace+to+explain%2C+teach%2C+and+press+this+distinction+with+the+utmost+diligence.+.+Francis+Junius+Latin+Eirenicum%2C+pt.+2%2C+on+Psalm+133+Therefore+I+can+hardly+express+my+astonishment+at+the+audacity%E2%80%94or+rather+the+madness%E2%80%94of+those+men+who+esteem+so+lightly+this+right+of+kinship%2C+established+by+God+Himself%2C+founded+upon+divine+power+and+constituted+by+means+that+are+altogether+divine%2C+that+they+judge+others+not+to+be+their+brothers%3B+or+even+if%2C+in+general+terms%2C+they+acknowledge+that+we+are+brothers+to+one+another%2C+yet+when+it+comes+to+particulars%E2%80%94this+or+that+individual%2C+this+or+that+church%E2%80%94they+think+that+such+a+person+or+such+a+church+has+nothing+at+all+in+common+with+them+in+respect+of+fellowship+and+brotherhood.+But+now%E2%80%94good+God%E2%80%94what+do+I+hear%3F+A+man+cannot+abolish+the+obligation+of+nature%3B+nor+can+one+man%2C+by+any+private+or+individual+act+of+his+own%2C+remove+a+human+bond+of+kinship.+And+shall+that+bond+which+the+divine+institution+of+grace+has+established+be+dissolved+at+the+will+of+man%3F+O+pitiable+madness%21+Whoever+allows+himself+to+be+carried+away+into+such+a+state+must%2C+of+necessity%2C+already+have+torn+himself+away+from+God+and+from+Christ+before+he+can%2C+even+in+thought%2C+tear+another+away.+For+who+hates+his+own+flesh%3F+What+member+devotes+its+efforts+to+mutilating+its+own+body%3F+He+is+no+longer+of+the+body+of+Christ+who+plans+to+cut+off+a+member+of+Christ.+And+yet+this+disease+%28if+I+may+speak+so%29+is+epidemic+in+our+age%3A+in+which+we+are%2C+nearly+all+of+us%2C+most+daring+in+noticing%2C+weighing%2C+judging%2C+condemning+and+exploding+the+deeds+of+our+brethren%2C+and+in+insolently+deposing+them%3B+nor+do+we+hesitate+to+assail+men%2C+churches%2C+whole+regions+and+authorities+appointed+by+God+with+curses+and+anathemas%2C+as+though+by+some+sovereign+right%E2%80%94merely+because+they+do+not+agree+with+us+in+all+things%2C+although+they+hold+the+mind+of+Christ.+Our+union+remains%2C+my+brother%2C+it+remains%3B+but+the+estrangement+is+yours+%28for+which+I+feel+pity%29.+If+you+are+willing+to+estrange+yourself+from+me%2C+you+cannot+avoid+first+estranging+yourself+from+Christ%2C+in+whom+we+are+brothers.+I+neither+will+nor+can+do+this%3B+for+Christ+has+joined+me+to+Himself+as+a+brother%2C+and+has+made+me+a+brother+to+you.+If+you+break+the+bond+of+brotherhood%2C+I+shall+knit+it+again%3B+if+you+unsew+it%2C+I+shall+labor+to+mend+it%3B+if+you+overturn+it%2C+I+shall+raise+it+anew%3B+if+you+deny+it%2C+Christ+affirms+it%E2%80%94and+I+with+Christ.+If+you+will+not+listen%2C+yet+good+men+hear%2C+and+the+Lord+hears%2C+before+whom+I+grieve+from+the+heart+over+your+powerlessness.+Led+by+mercy%2C+I+shall+bear+whatever+I+cannot+cure%3B+but+in+bearing+it%2C+I+shall+carefully+maintain+these+two+things%3A+first%2C+that+I+steadfastly+await+from+the+Lord+the+healing+of+this+wretched+infirmity+of+yours%3B+second%2C+that+I+myself+watch+for+just+opportunities+to+assist+you+in+love+and+to+lift+you+up+again%2C+if+perchance+God+may+at+some+time+be+pleased+to+use+this+my+endeavor+for+your+salvation.+For+why+should+we+not+bear+with+those+who+are+disturbed+in+mind%E2%80%94even+in+matters+of+religion%E2%80%94just+as+readily+as+we+bear+with+those+whom+anger%2C+hatred+or+other+such+passions+have+driven+out+of+the+state+of+a+sound+mind%3F+If+such+things+arise+among+brothers%2C+they+are+nonetheless+brothers%2C+and+do+not+cease+to+be+such.+I+shall+therefore+act+unjustly+if%2C+because+you+deny+that+you+are+my+brother%2C+or+deny+the+duty+of+a+brother%2C+I+fall+into+the+same+fault.+I+am+unwilling+to+heap+my+own+wrongdoing+upon+your+folly%3B+but+whatever+wisdom+I+have+received+from+the+Lord%2C+that+I+intend+to+preserve+unimpaired%2C+and+by+duty+to+procure+your+restoration%E2%80%94or+at+least%2C+if+nothing+else%2C+to+testify+before+God+and+men+to+the+obligation+which+is+mine.+What+then+do+we+suppose%2C+poor+wretches+that+we+are%3F+What+do+we+imagine%2C+when+with+such+loftiness+of+brow+we+thrust+one+another+out%2C+as+with+a+pitchfork%2C+and+apply+a+kind+of+censor%E2%80%99s+rod+indiscriminately+to+these+and+to+those%2C+as+though+we+alone+possessed+the+nose+for+judgment%2C+or+as+though+Christ+had+transferred+to+us+this+faculty%2C+to+be+abused+according+to+the+caprice+of+our+own+spirits%3F+Let+such+things+indeed+be+done+by+the+grooms+of+Satan%3B+but+it+is+not+fitting+for+the+sheep+of+Christ%E2%80%94least+of+all+for+pastors.+Rather%2C+let+us+yield+to+Christ%2C+who+most+graciously+admits+both+us+and+them+into+the+communion+of+His+body+and+Spirit.+.+David+Pareus+Latin+Irenicum+ch.+4+The+first+question+will+be%3A+Which+articles+are+fundamental%2C+that+is%2C+in+which+heads+of+faith+does+the+foundation+of+salvation+truly+consist%3F+Here+there+must+prudently+be+distinguished+the+articles+of+the+catholic+faith%E2%80%94which+no+Christian+of+adult+age%2C+whether+learned+or+unlearned%2C+may%2C+without+loss+of+salvation%2C+either+be+ignorant+of+or+fail+to+believe%E2%80%94from+other+questions+that+come+into+controversy+among+some+theologians+because+of+differing+understandings+of+some+particular+passage+of+Scripture%3B+and+also+from+scholastic+or+ecclesiastical+conclusions%2C+the+knowledge+and+assent+of+which%2C+one+way+or+the+other%2C+are+indeed+necessary+for+theologians+for+the+sake+of+the+scientific+character+of+their+theological+profession%2C+and+for+transmitting+or+defending+a+fuller+knowledge+of+divine+matters%2C+but+which+can+be+unknown+by+Christians+in+general+without+danger+to+salvation.+For+most+of+these+either+do+not+touch+fundamental+articles+directly%2C+or+not+even+indirectly%3B+rather%2C+they+are+such+that+they+will+not+benefit+those+who+know+them%2C+if+they+do+not+possess+true+faith+in+Christ%2C+nor+will+they+harm+those+who+are+ignorant+of+them%2C+if+they+truly+believe+in+Christ.+For+I+would+venture+to+affirm+that+the+greater+part+of+both+the+ancient+heresies+and+the+present+dissensions+in+the+Church+has+arisen%2C+and+still+arises%2C+chiefly+from+this%3A+that+councils%2C+bishops%2C+and+doctors+of+the+Church%2C+without+any+distinction%2C+have+put+forth+whatever+doctrines+of+the+schools+and+whatever+opinions+of+the+chairs+as+articles+of+the+catholic+faith%2C+and+have+imposed+them+upon+consciences+as+to+be+believed+with+the+same+necessity+for+salvation%3B+and+that+from+every+discrepancy+in+the+interpretation+of+the+Scriptures+they+have+far+too+easily+fashioned+heresies+or+schisms.+.+ch.+29+A+foundation%2C+properly+speaking%2C+is+that+which+is+laid+in+the+lowest+place+beneath+for+the+support+of+a+building%2C+and+without+which+the+house+cannot+stand.+Thus+the+foundation+of+our+faith+and+salvation+will+be+that+which+all+Christians+must+strictly+believe+as+necessary+for+salvation%2C+and+without+faith+in+which+none+obtain+salvation.+This+foundation%2C+in+one+word%2C+is+Jesus+Christ%2C+according+to+the+apostle%2C+etc.+But+the+foundation+of+the+prophets+and+apostles+is+the+sum+of+the+doctrine+of+the+prophets+and+apostles%2C+etc.+In+the+Church+the+%E2%80%9Celements+of+the+Christian+faith%2C%E2%80%9D+containing+the+sum+of+the+Law+and+the+Gospel%2C+are+accustomed+to+be+so+called%3B+and+all+these+appear+able+to+be+reduced+to+four+heads%3A+The+first+head+is+the+Decalogue%2C+etc.+The+second+is+the+Apostles%E2%80%99+Creed%2C+etc.+The+third+is+the+Lord%E2%80%99s+Prayer%2C+etc.+The+fourth%2C+finally%2C+is+concerning+the+sacraments%2C+etc.+In+these+heads%2C+in+our+judgment+indeed%E2%80%94if+one+should+speak+popularly%E2%80%94the+foundation+of+the+Christian+faith+and+salvation%2C+taken+in+the+widest+sense%2C+consists.+For+he+who+shall+have+held+these+by+faith+and+shall+have+practiced+them+will+undoubtedly+be+saved%2C+although+he+may+be+ignorant+of+the+remaining+debates+of+the+theologians%E2%80%A6+Yet+in+these+very+heads+we+have+freely+conceded+that+some+distinction+may+exist.+For+some+things+are+more+or+less+necessary+to+salvation+than+others.+.+Georg+Calixtus+Latin+Of+the+Judge+of+Theological+Controversies%2C+sect.+1+%26+3+Let+it+be+far+from+us%2C+therefore%2C+to+hate%2C+avoid+or+abhor+any+Christian+who+has+not+ceased+to+be+a+Christian%2C+who+has+not+ceased+to+be+a+son+of+God%2C+and+therefore+is+our+brother%2C+and+together+with+us+a+member+of+the+body+of+Christ+and+a+co-heir+of+eternal+salvation.+Far+be+it%2C+I+say%2C+that+we+should+abominate+the+fellowship+of+anyone+whom+Christ+has+received+into+communion.+Far+be+it+that+to+him+to+whom+He+will+say%2C+%E2%80%9CCome%2C+blessed+of+my+Father%2C%E2%80%9D+we+should+say%2C+%E2%80%9CDepart%2C+cursed+Satan%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Letter+to+the+Academy+of+Marburg%2C+Yet+it+must+be+determined+how+far+those+who+differ+in+doctrines+of+Christian+teaching+are+to+be+granted+the+right+of+holy+communion+and+fraternity+preserved.+%7C+Certainly+blessed+Paul+relates+that+he+%E2%80%9Chanded+over+Hymenaeus+and+Alexander+to+Satan%2C%E2%80%9D+%5B1+Tim.+1%3A20%3B+2+Tim.+4%3A14%5D+although+they+were+blasphemers%3B+but+at+the+end+of+the+same+epistle+he+commands+separation+also+from+those+who+follow+a+different+doctrine+and+do+not+adhere+to+the+sound+words+of+our+Lord+Jesus.+%5B1+Tim.+6%3A3%3B+2+Tim.+4%3A3%5D+And+the+presbyter+John+wrote%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0f21606d93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0f21606d93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/j-a-turretin-discourse-concerning-fundamental-articles/#:~:text=If%20anyone%20comes%20to%20you%20and,we%20should%20say%2C%20%E2%80%9CDepart%2C%20cursed%20Satan&amp;text=If%20anyone%20comes%20to%20you%20and%20does%20not&amp;text=my%20Father%2C%E2%80%9D%20we%20should%20say%2C%20%E2%80%9CDepart%2C%20cursed%20Satan" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fdc8c12921" data-kw="">
<blockquote><p>The Gospel proclaimed by Jesus Christ and his apostles, presented in its simplicity and without so many additional things, provides sufficient knowledge to convert a man to God and thereby to place him within His Church. It was this simplicity of doctrine, received with an honest heart, that incorporated in a single day into the Church those three thousand souls of whom we spoke above, as is reported in Acts, ch. 2. Now, they would have needed—not one day, but several months, indeed several years—to know all the controversies that both pagans and Jews raised against the Christians, and to have the solution to all the arguments and all the objections made on the points concerning the incarnation of Jesus Christ, his divinity, and that of the Holy Spirit, the expiation of sins, and the satisfaction of the justice of God by His blood, the resurrection of the dead, and the immortality of the soul, which were contested by the Sadducees and others. The eunuch of the Queen of Ethiopia could not (according to the cardinal’s reckoning) have entered the Church and received baptism through knowledge of the Faith in the space of a few hours, upon the preaching of St. Philip, as he did. For it is said that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning, would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian; not to ascend a chair of the schools and of controversies, but to learn the Law of God, which gives wisdom to the simple; and not so much to dispute against all errors, as to learn to combat one’s vices through the knowledge of the death and resurrection of Jesus Christ, according to the declaration of the apostle, who proposed to himself nothing else (1 Cor. 2). Therefore this measure of knowledge was restricted by the Church of the first centuries to the understanding of the Apostles’ Creed, which the Church required for receiving someone into the Church and for administering baptism. And although this measure of knowledge is perhaps not sufficient to convince others, it is sufficient to sanctify the one in whom it is found and to edify him in Jesus Christ. Moreover (just as what is straight makes known of itself what is crooked), the simplicity of the doctrine of the Gospel contained in this Creed suffices to cause one to reject everything that is not conformable to it, and consequently to avoid errors, insofar as is necessary for salvation.</p></blockquote>

<blockquote><p>Sin is a sweet morsal that makes God’s elect sick souls ere they get it vomited up; it leaves a sting behind it, which some one time or other will create them no little pain. Elihu shows us both the case and cure, Job 33. Behold the case one may be in whom God has thoughts of love to: He darts convictions into his conscience, and makes them stick so fast, that he cannot rid himself of them, v. 16; his very body sickens, v.

19. He is chastened also with pain upon his bed, and the multitude of his bones with strong pain: He loses his stomach, v.

20. His life abhors bread, and his soul dainty meat. His body pines away, so that there is nothing on him but skin and bone; He is looking every moment when devils, those destroyers, Heb. 9:11, those murderers or manslayers, Jn. 8:44, will comeand carry away his soul to Hell. O dreadful case! yet there is hope. Now, see how the sick man is cured: The phsician’s art cannot prevail here; ‘Tis soul-trouble that has brought the body into this disorder.</p></blockquote>

<blockquote><p>It is one thing most requisite, that the true Kirk is discerned from the filthy synagogues by clear and perfect notes, lest we, being deceived, receive and embrace to our condmenation the one for the other. The notes therefore of the true Church of God, we believe, confess and avow to be: First, the true preaching of the Word of God, wherein God has revealed Himself to us, as the writings of the prophets and apostles do declare. Secondly, the right administration of the sacraments of Jesus Christ, which must be annexed unto the Word and promise of God, to seal and confirm the same in our hearts. Lastly, ecclesiastical discipline uprightly administered as God’s Word prescribes, whereby vice is repressed and virtue nourished. Wheresoever then these former notes are seen, and of any time continue (be the number never so few, about two or three) there, without all doubt, is the true Church of Christ, who, according to his promise, is in the midst of them.</p></blockquote>

<blockquote><p>When men may unite without personal guilt or accession to the defects or guilt of others, there may and ought to be union, even though there be failings and defects of several kinds in a Church; because men are to reckon not for other men’s carriages, but their own: And no such Church-state is to be expected as is free of defects. Beside, can it warrand a man to abstain from his duty because others do not theirs, while as there is no sinful impediment lying in the way of his access thereto?</p></blockquote>

<blockquote><p>Separation is one thing, and not hearing such or such a man is a far other thing. There may be many just grounds of exception against a particular person, why people may refuse to countenance him, without any hazard of separation, or joining with separatists in their principles. Separation is one thing, and refusing to attend the ministry of such a man is another thing; for a man may join with ordinances in another congregation, and so testify that he has no prejudice at the ministry, but only against such a man in particular.</p></blockquote>

<blockquote><p>But though all this were true of some ministers, does this justify your separation from all? How many worthy ministers are there in the congregations where you dwell, who are grave and edifying, and preach and practice godliness in the power of it, and yet you withdraw from them?</p></blockquote>

</figure><figure class="quote" id="q-796a2944fa" data-kw="">
<blockquote><p>Though in some cases as we are warranted, so we are necessitated to withdraw, yet neither do we allow it upon slight or slender grounds; nor can any tender soul be forced to discountenance the ministers of Christ (I do not speak here of the prelatic curates) without great reluctancy and grief of heart, even when the grounds of it are solid and valid, and the necessity unavoidable: Therefore we reject these as insufficient grounds, besides what are given already:

1. We cannot withdraw from a minister for his infirmities and weaknesses, natural, spiritual or moral.

2. Neither for personal faults and escapes; we expect a faithful but not a sinless ministry.

3. Nor for every defect in faithfulness through ignorance, want of courage, misinformation, or being biased with affection for particular persons. We do not hold that faults in members, or defects in ministers do pollute the ordinances, and so necessitate a separation; but agree with what Mr. Durham says on Revelation, ch. 2, lect. 6, ‘Sincerity discovered will cover many faults.’

4. Nor for every discovery of hypocrisy: Though we may have ground to suspect a man’s principle and motive be not right, yet if he be following duty unblameably, and have a lawful call, what then? “Notwithstanding every way, whether in pretense or in truth, Christ is preached; therein we may rejoice,” Phil. 1:18.

5. Nor yet for real scandals not attended with obstinacy, if ministers will take reproof and admonition, and at least by doctrinal confessing, and practical forsaking them, satisfy the offended, etc.</p></blockquote>

<blockquote><p>Although a Church be defective in purging out of corrupt members, yet that does not pollute the ordinances to others, or necessitate them to separate from them. These Churches continue to be Churches, and the ordinances to be ordinances of Christ, although such were continued in communion with them; and, notwithstanding thereof, these who were free of those corruptions are approven and commended by Jesus Christ: And if it were not so, that a person’s endeavoring in his station to amend such a fault, and to have such scandals censured, did not exempt him from guiltiness so as to continue in Church communion, although the plurality of officers should be short of their duty in that respect; then there might be still separation after separation in infinitum [to infinity].</p></blockquote>

<blockquote><p>This is a very uncertain rule; for he may give his presence where he does not approve of the minister, and he may approve of the minister where he does not give his presence; and if he be absent, it is uncertain whether it be the minister’s fault or our own. And upon that ground the other party may be justified in dividing from us, because they may miss his presence among us and in our meetings; his presence in communion is the end of our meetings, and not the rule: The meeting is always lawful, and may have the expectation of his presence, that is gathered ‘in his name’; and none can say the meeting of presbyterian ministers in Scotland at this time, in these circumstances, are gathered in any other name. However, if we would expect a blessing, let us endeavor unity; for that is “as the dew of Hermon, and there the Lord commands the blessing,” Ps. 133 last.</p></blockquote>

</figure><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>

<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>

</figure><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>

<blockquote><p>Beware of separating new lights; to separate from, or gather Churches out of the true reformed or reforming Churches, has not the least warrant from the Word of God: When we see this or that amiss in a Church we are bidden exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwingli conferred amicably with the Anabaptists in Zurich as with dissenting brethren; and no course was taken to suppress or restrain them by the secular power, till they grew to gather Churches out of the true reformed Churches: But when it came to that, they could not be suffered or forborne, it was thought necessary to restrain them.</p></blockquote>

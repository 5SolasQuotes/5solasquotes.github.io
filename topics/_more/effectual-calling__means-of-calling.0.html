<blockquote><p>A crucified Christ, with all his purchase, is offered to all the hearers of the gospel: for Christ in his Word, and by his ministers in the gospel-offer, speaks to all and every one of them; yea, speaks to every sinner, man and woman in particular, as though He called them by name and surname. And every man is bound to take the call and offer home to himself, as if he were so named, and believe that Christ stands at his door and knocks, saying, ‘If you, or any man, will open to me, I will come in.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-5dacacd08e" data-kw="">
<blockquote><p>’If any man hear my voice, and open the door, I will come in and sup with him.’ Rev. 3:20 Great and precious are the promises which Christ makes to them who hearken to his voice in the gospel-offers, and open their heart to receive Him as offered to them in all his offices: I will come in, and bring all the benefits of my purchase with Me, to entertain and feast that soul, even pardon, peace, light, life, grace and glory. 1. Observe, the duty called for is to hear Christ’s voice, and open the door to Him; that is, to accept and embrace the free gospel-offers, and heartily to acquiesce in the gospel-method of a sinner’s reconciliation and sanctification through the righteousness of our glorious Immanuel, and willingly receive and submit to Him as our Prophet, Priest, and King. What is the preaching of the gospel, but Christ’s charming voice calling lost sinners home to Himself? What is it, but Christ’s following them with invitations and entreaties to come to Him and live? This is Christ’s voice which He would have sinners to hear, Come and live; though they generally refuse to hear the voice of his sovereign offering him his life, as condemned sinners do? Jn. 5:40, “Ye will not come to Me that ye may have life.” Yet behold, after many refusals, He follows his offers with arguments, strong arguments, to prevail with sinners; and after the greatest obstinancy He is loth to break off his treaty with them, Hos. 11:8, “How shall I give thee up, Ephraim? Why will ye die?” What reason can you give for refusing life, or for choosing death? 2. Observe who it is that Christ calls to hear his voice and open their doors to Him: It is not this or that man only, or any particular sort of men, it is any man, every man that sits under the gospel. “If any man will hear my voice and open the door, (says Christ), I will come in.” “If any man will open (be he old man or young man), I will come in.” If the greatest sinner, the most crimson-colored sinner, will open, I will come in. “Any man,” if the swearer will open, if the sabbath-breaker, if the murderer, if the drunkard, if the unclean, if the thief, if the cheat, if the liar, if the mocker, if the prayerless man, if the man that hates God and godliness, will open to Me, “I will come in and sup with him.” O what encouragement does this word, “if any man,” give to ever sinner to flee to Christ! If any man, whoever he be, whatever he has done, if he will welcome Me, receive Me in the gospel-offers, I will come in to him. 3. Observe, Christ requires sinners to open the door, that He may come in to teach them; however unable they be, this is their duty; they must mint, and use all means to do it, and look up to Him for strength. He will have the sinner’s consent, and the soul made willing to receive Him. O then cast open the door, open it wide, receive Christ wholly, receive Him without reserve, open before him the “two-leaved gates,” not the wicker, or one leaf only, but both leaves of the door! Let Christ have the full and free consent of the soul, an abundant entrance into it. There are some resolving to open the door to Christ, others perhaps are beginning to open it: O let them not halt in doing it! With some the door is half open, and there they stop. They are almost, but not altogether Christians. O almost Christian! why do you halt? Why would you lose all the pains you have been at? A little more would cast the door wide open, and make you an altogether Christian. Go then a little further, O sinner! to save your soul. Open to Christ all the powers and faculties of your soul. Open to Him fully here, as you would have Him to open freely to you hereafter. Oh! what mean you to open to Christ by halves? Alas! the half open door will be ready to go to again, and if so, it may never open for the future. Let this be your concern then to go a little further than the almost Christian, and rest not in fair beginnings. 4. Observe, how great the advantage is of opening the door to Christ: Why? I will come into the house, says He; even the friend of sinners, the King of glory will come in, the best guest that ever came into a poor man’s house: How honorable, how profitable, how happy and blessed, must such a visit be! Question: For what end will Christ come in? Answer: He will come in to enlighten the house; for the soul is a dark dungeon while Christ is shut out: He will come in to adorn and enrich the soul with the ornaments and treasures of his grace: He will come in to reign in the soul, and pull down the tyrant that has long oppressed you: As in the text, He will come in and sup with you, and cause you to sup with Him: And, because you have no fitting provision in the house, He will bring it with Him. And O how rare are Christ’s dainties, his hidden manna, the fruits of the tree of life, the grapes of Canaan, the bread that comes down from heaven! How excellent is the water of life! One drop of it would be an everlasting spring in your soul, that would keep you from thirsting after the creature anymore. What a rich feast are the graces of the Spirit quickened to a lively exercise! What a blessed feast is pardon of sin, peace with justice, peace with the law, an interest in Christ’s purchase, intimations of Christ’s love, gospel-promises applied, communion with God, views of eternal life, well-grounded hopes of immortal glory! etc. O how precious and delicate are those gospel-rarities which are set before you on the communion-table, and freely tendered to everyone that opens the door to Christ! Who would not welcome such a Guest, that brings such glorious provision with Him? Had poor sinners spiritual appetites sharpened for Christ’s feast, there would not be so many shut doors against Him. 5. Observe, how solemnly Christ offers these gospel-blessings to you, with a Behold I stand, etc. Christ takes witnesses upon it, witnesses against the refusers: Behold, ye angels, and witness for me how kind and bountiful my offers are to Adam’s rebellious children! Behold, ye ministers, and witness against those who shut Me out! Behold, ye stones and timber of the house, ye elements and communion-tables, bear witness for me and against them! Behold, ye fellow-communicants and hearers, bear witness one against another, that I knocked, I called, I knocked loud, I knocked long, but ye kept your doors bolted against Me. \ It is a melancholy thought for those who are ministers to entertain, that they will one day be brought in as witnesses against those who shut out their Savior; but when called, they must witness against such, though never so dear to them now, that Christ called, but they refused; He made kind and large offers, but they regarded them not. O, then, let every soul set about sweeping and washing all the rooms, and case open all the doors, as wide as they can, to the King of Glory, and receive Him with acclamations and praise! Take the crown off the head of self, and put it on the head of Christ, ascribing all the glory of your salvation to Him, and nothing to free-will, or your own doings.</p></blockquote>

on+with+God%2C+views+of+eternal+life%2C+well-grounded+hopes+of+immortal+glory%21+etc.+O+how+precious+and+delicate+are+those+gospel-rarities+which+are+set+before+you+on+the+communion-table%2C+and+freely+tendered+to+everyone+that+opens+the+door+to+Christ%21+Who+would+not+welcome+such+a+Guest%2C+that+brings+such+glorious+provision+with+Him%3F+Had+poor+sinners+spiritual+appetites+sharpened+for+Christ%E2%80%99s+feast%2C+there+would+not+be+so+many+shut+doors+against+Him.+5.+Observe%2C+how+solemnly+Christ+offers+these+gospel-blessings+to+you%2C+with+a+Behold+I+stand%2C+etc.+Christ+takes+witnesses+upon+it%2C+witnesses+against+the+refusers%3A+Behold%2C+ye+angels%2C+and+witness+for+me+how+kind+and+bountiful+my+offers+are+to+Adam%E2%80%99s+rebellious+children%21+Behold%2C+ye+ministers%2C+and+witness+against+those+who+shut+Me+out%21+Behold%2C+ye+stones+and+timber+of+the+house%2C+ye+elements+and+communion-tables%2C+bear+witness+for+me+and+against+them%21+Behold%2C+ye+fellow-communicants+and+hearers%2C+bear+witness+one+against+another%2C+that+I+knocked%2C+I+called%2C+I+knocked+loud%2C+I+knocked+long%2C+but+ye+kept+your+doors+bolted+against+Me.+%5C+It+is+a+melancholy+thought+for+those+who+are+ministers+to+entertain%2C+that+they+will+one+day+be+brought+in+as+witnesses+against+those+who+shut+out+their+Savior%3B+but+when+called%2C+they+must+witness+against+such%2C+though+never+so+dear+to+them+now%2C+that+Christ+called%2C+but+they+refused%3B+He+made+kind+and+large+offers%2C+but+they+regarded+them+not.+O%2C+then%2C+let+every+soul+set+about+sweeping+and+washing+all+the+rooms%2C+and+case+open+all+the+doors%2C+as+wide+as+they+can%2C+to+the+King+of+Glory%2C+and+receive+Him+with+acclamations+and+praise%21+Take+the+crown+off+the+head+of+self%2C+and+put+it+on+the+head+of+Christ%2C+ascribing+all+the+glory+of+your+salvation+to+Him%2C+and+nothing+to+free-will%2C+or+your+own+doings.%E2%80%9D%0A%0A%E2%80%94+John+Willison%2C+Sacramental+Meditations%2C+in+The+Whole+Works+of+John+Willison%2C+1816%2C+ <blockquote><p>2. He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle[-dove]; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?”… Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>

<blockquote><p>With what different emotions of heart may we suppose Zaccheus received this invitation? Think you not that he was surprised to hear Jesus Christ call him by name, and not only so, but invite Himself to his house? Surely, thinks Zaccheus, I dream: it cannot be; how should He know me? I never saw Him before: besides, I shall undergo much contempt, if I receive Him under my roof. Thus, I say, we may suppose Zaccheus thought within himself. But what says the Scripture? “I will make a willing people in the day of my power.” [Ps. 110:3] With this outward call, there went an efficacious power from God, which sweetly over-ruled his natural will: and therefore, verse 6, “He made haste, and came down, and received him joyfully;” not only into his house, but also into his heart. … And thus it is with all, that, like Zaccheus, receive Jesus Christ by faith into their hearts: the very moment they find rest in Him, they are freely justified from all things from which they could not be justified by the law of Moses; “for by grace are we saved, through faith, and that not of ourselves, it is the gift of God. … You say you have faith; but how do you prove it? Did you ever hear the Lord Jesus call you by name? Were you ever made to obey the call? Did you ever, like Zaccheus, receive Jesus Christ joyfully into your hearts? Are you influenced by the faith you say you have, to stand up and confess the Lord Jesus before men? Were you ever made willing to own, and humble yourselves for, your past offenses? … He came not only to save, but to seek and to save that which was lost. He came to Jericho to seek and save Zaccheus; for otherwise Zaccheus would never have been saved by Him. But from whence came He? Even from Heaven, his dwelling-place, to this lower earth, this vale of tears, to seek and save that which was lost; or all that feel themselves lost, and are willing, like Zaccheus, to receive Him into their hearts to save them; with how great a salvation? … The power of his death and resurrection is as great now as formerly. Make haste therefore, make haste, O ye publicans and sinners, and give the dear Lord Jesus your hearts, your whole hearts. If you refuse to hearken to this call of the Lord, remember your damnation will be just: I am free from the blood of you all… Let all that love the Lord Jesus Christ in sincerity say, Amen.</p></blockquote>

<blockquote><p>‘Behold, I stand at the door’ of your heart and ‘knock: Open to Me, my sister, my love, my undefiled; for my head is filled with the dew, and my locks with the drops of the night.’… ‘When He waits to be gracious, and exalts Himself to show mercy.’ why tire out his patience till He ‘shut up all his tender mercies in his wrath?’ ‘Is it a small thing for you to weary men,’ weary parents, and ministers? ‘But will ye weary my God also?‘</p></blockquote>

</figure><figure class="quote" id="q-6858a106bb" data-kw="">
<blockquote><p>He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you… ‘My son, my child, give me your heart.’ Open to Me, your God, your Savior; for my head has been ‘filled with the dew’ of divine wrath, ‘and my locks with the drops’ of fearful affronts ‘for thy sake:’…</p></blockquote>

</figure><figure class="quote" id="q-ee56563c5a" data-kw="">
<blockquote><p>Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’</cite>, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-1cfa5d17ab" data-kw="">
<blockquote><p>He does not knock at the door of his friends merely, but at the door of his enemies. He knocks at the door of the vilest of sinners… 3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing. Nor is this all—you may say, I am such a great sinner—I have rejected him so long, that He will not receive me now. But what says the Savior? ‘If any man hear my voice’—vile as he may be, if he is on the side of hell—‘if any man hear my voice and open the door, I will come in to him, and sup with him, and he with Me.’ If you are not now a Christian, permit me to say that you have never heard his voice, nor opened the door, nor been willing to receive Him. You have never complied with the invitation in the text. The Savior is ready and willing, but you will not come to Him that you might have life. [Jn. 5:40] 4. Behold your danger. The Savior stands at your door. He does not sit. He stands ready to enter or ready to depart… He may say, as he once said to the Jews, ‘I go my way. Ye shall see me, and shall die in your sins.’ How often ‘I would,’ and ‘ye would not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’</cite>, pp. 300-302</span></figcaption>

</figure><figure class="quote" id="q-9268fb1e60" data-kw="">
<blockquote><p>The mighty God who fills all space and reigns in majesty over all worlds, standing at the door of the sinner’s heart, humbling Himself to the language of entreaty, beseeching the sinner to come and be reconciled to Him, begging for admittance, and protesting that if you only come unto Him through Christ, He is willing to forgive all, and to forget all. Oh! my brethren, ought not this to encourage you? Yes! and if you refuse the encouragement, it ought also to fill you with terror.</p></blockquote>

<blockquote><p>(2) Believing is the soul’s receiving Christ. St. Paul says, “Ye have received Christ Jesus the Lord.” (Col. 2:6) Christ offers to come into man’s heart with pardon, mercy, and grace, and to dwell there as its Peace-maker and King. He says, ‘I stand at the door and knock.’ (Rev. 3:20) The believer hears his voice, opens the door and admits Christ as his Master, Priest and King.</p></blockquote>

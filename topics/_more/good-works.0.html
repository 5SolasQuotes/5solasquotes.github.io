</figure><figure class="quote" id="q-8136242b39" data-kw="">
<blockquote><p>We acknowledge that obedience is required in a son before he come to possess his inheritance; yet that obedience, though antecedent to his possessing that inheritance, is only the way in which he is to come to it, and the means whereby he is to be fitted for it; but is not meritorious of it. There is no right to the inheritance acquired by his obedience which before he had not; though farther fitness for, and suitableness to, it there may be. The Israelites were to fight, and subdue their enemies, ere they possessed the promised land; but their right to the possession of it they had before by the promise. And who can say that they were worthy of it merely because they fought for it?</p></blockquote>

<blockquote><p>Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.</p></blockquote>

</figure><figure class="quote" id="q-d7f9c695a0" data-kw="">
<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>

<blockquote><p>for as much as final infidelity and impenitency are the meritorious causes of damnation; but faith, repentance and good works are but the disposing causes of salvation. Yet like as God inflicts not damnation but by way of punishment, so he doth not bestow salvation, on any of ripe years, but by way of reward. Yet here also is a difference; for damnation is inflicted by way of punishment for the evil works’ sake which are committed: but salvation is not conferred by way of reward for the good works’ sake which are performed, but merely for Christ’s sake.</p></blockquote>

</figure><figure class="quote" id="q-d62514d3a9" data-kw="">
<blockquote><p>Now this object of his [Paul’s] praying, and praising [in Col. 1:12], was not for their justification only, but verse 10, their walking worthy of the Lord unto all well-pleasing, being fruitful in every good work, verse 11, strengthened unto all patience. This was a part of their fitness, and that holy walking conferreth a fitness and disposition for salvation to me is clear, because no unclean thing can enter within the gates of that higher City, and because that love which we have here in our way, being the same in nature, though not in degree, with that which in our country shall remain, as a part of our garland, and crown, the one must be a fit disposition to the other; and when the apostle saith “Follow peace with all men, and holiness, without which no man shall see the Lord.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, opening the secrets of Familism and Antinomianism (London, 1648), Part 2, Ch. 48, ‘Antinomians hold that the believer cannot sin against God…’</cite>, pp. 64-65</span></figcaption>

ne</a></div>

<blockquote><p>(7.) Sanctification fits for heaven: ‘Who hath called us to glory and virtue.’ 2 Pet i 3. Glory is the throne, and sanctification is the step by which we ascend to it. As you first cleanse the vessel, and then pour in the wine; so God first cleanses us by sanctification, and then pours in the wine of glory. Solomon was first anointed with oil, and then was a king. 1 Kings i 39. First God anoints us with the holy oil of his Spirit, and then sets the crown of happiness upon our head. Pureness of heart and seeing God are linked together. Matt v 8.</p></blockquote>

— Thomas Watson, Body of Divinity, ‘Of Sanctification’, p. 166 in The Select Works of the Rev. Thomas Watson… (New York, 1855)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%287.%29+Sanctification+fits+for+heaven%3A+%E2%80%98Who+hath+called+us+to+glory+and+virtue.%E2%80%99+2+Pet+i+3.+Glory+is+the+throne%2C+and+sanctification+is+the+step+by+which+we+ascend+to+it.+As+you+first+cleanse+the+vessel%2C+and+then+pour+in+the+wine%3B+so+God+first+cleanses+us+by+sanctification%2C+and+then+pours+in+the+wine+of+glory.+Solomon+was+first+anointed+with+oil%2C+and+then+was+a+king.+1+Kings+i+39.+First+God+anoints+us+with+the+holy+oil+of+his+Spirit%2C+and+then+sets+the+crown+of+happiness+upon+our+head.+Pureness+of+heart+and+seeing+God+are+linked+together.+Matt+v+8.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+Body+of+Divinity%2C+%E2%80%98Of+Sanctification%E2%80%99%2C+p.+166+in+The+Select+Works+of+the+Rev.+Thomas+Watson%E2%80%A6+%28New+York%2C+1855%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66e25f8396.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66e25f8396.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=7.%29%20Sanctification%20fits%20for%20heaven%3A%20%E2%80%98Who,are%20linked%20together.%20Matt%20v%208&amp;text=7.%29%20Sanctification%20fits%20for%20heaven%3A%20%E2%80%98Who%20hath%20called&amp;text=seeing%20God%20are%20linked%20together.%20Matt%20v%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a7ce2b2a2" data-kw="">
<blockquote><p>None is in the way to heaven but he who, by a life of faith and the practice of those good works which are the fruits of faith, is advancing toward perfection of holiness. It is the order immutably fixed in the everlasting covenant that a man be made holy in heart and in life before he is admitted to see and enjoy God in His holy place on high. The love and practice of good works, then, in one who has an opportunity of performing them, are necessary as appointed means of disposing or preparing him for the holy enjoyments and employments of the heavenly sanctuary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 327 of Section 2, ‘Of the Necessity of Good Works’ in Ch. 12, ‘Of the Nature, Necessity and Desert of Good Works’, in A Treatise on the Law and the Gospel (Edinburgh, 1819)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-6806e030aa" data-kw="">
<blockquote><p>On the one hand, it was stated that grace only serves to restore human willpower for good and to put humans themselves to work. Good works, in that case, were definitely necessary for salvation, whether by a necessity of merit (Rome) or by a necessity of causality and effectiveness (Remonstrants). And from the antinomian side it was said objectively that the righteousness and holiness of Christ remained completely external to a person, not only in justification but also in sanctification, so that repentance, conversion, prayer for forgiveness, and good works were totally unnecessary, bore a legalistic character, and failed to do justice to the perfect sacrifice of Christ. Lutherans tried to avoid both extremes and conducted a long-lasting and vehement debate on the appropriateness or inappropriateness of the proposition ‘Good works are necessary to salvation.’… The Reformed were more moderate in their judgment, regarded the Lutheran debate as a dispute over words, and could not see the big difference between the rejected formula ‘Good works are necessary to salvation’ and another that some Lutherans (like Quenstedt and Buddeus) had approved: ‘It is impossible to be saved without good works.’ They had no objection to calling good works necessary to salvation provided this did not imply a ‘necessity of causality or merit or effectiveness’ but implied a necessity of presence of the means and ways to obtain eternal salvation. Voetius even believed that in a sense good works can be called ‘the cause of eternal life,’ that is, not a ‘meritorious’ but a ‘preparatory’ and ‘dispositional’ cause. (G. Voetius, Select Disputations, vol 5, 675 ff.) Speaking along these lines, they undoubtedly had Scripture on their side… . Good Works Sanctification manifests itself in good works, which according to the Heidelberg Catechism arise from the principle of a true faith, conform to the law of God, and are done for his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics (Baker, 2008), vol. 4, Part 1, ch. 4, ‘Passive and Active Sanctification’, pp. 254-256 Some footnotes have been omitted.</cite></span></figcaption>

</figure><figure class="quote" id="q-6ec13e2958" data-kw="">
<blockquote><p>Id circo Apostolus aperte ait, vitam aeternam esse donum Dei. Praeterea, etiam si detur, bona opera aliquo modo causas esse, propter quas recipiamur in possessionem aeternae vitae ex Dei liberalitate, quatenus scilicet unum Dei donum causa est alterius, praecedens insequentis (quemadmodum alias declarauimus) ut vocatio iustificationis, iustificatio glorificationis: tamen nullo modo dici possunt causa electionis ac praedestinationis ad aeternam vita: cum sint eius effecta, et cum nullam posterius causa esse possit efficiens prioris.</p></blockquote>

<blockquote><p>Very many passages of Holy Scriptures (of which some are adduced by Bellarmine; but almost numberless others might be added to them, Heb. 10:36; 1 Tim. 2:15; Phil. 2:12… 2 Cor. 7:10 &amp; 4:17… Rom. 8:13,17 &amp; 10:10; Mt. 25:34-35… and in verse 21 of the same chapter according to the vulgate translation… James 1:25 &amp; 2:14; Gal. 6:8… Rev. 7:14-15… most clearly demonstrate that in adult persons good works have to salvation not merely the relation ‘of order’ (as besides others, Paraeus frigidly answers)… but also a causal relation, such as is the relation of a cause efficient or aiding, after its own manner and place, to its effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 309 of Book 4, ‘Of the Justice of Works’, ch. 1, ‘Of the Necessity of Good Works to Salvation, and the Coincident Questions…’ in A Fair &amp; Calm Consideration of the Modern Controversy Concerning Justification, as it is Explained in the Five Books of Cardinal Bellarmine in Modest &amp; Pacifying Considerations of Controversies, vol. 1 (Oxford, 1850)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-935f45ba52" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.”

— Jerome Zanchi, p. 670 of ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+absolutely+deny%2C+that+good+works+are+a+cause+of+salvation%2C+viz.%2C+an+instrumental+rather+than+an+efficient+one%E2%80%A6+Good+works+are+an+instrumental+cause+of+the+possession+of+life+eternal%2C+for+by+these+as+by+media+and+by+the+legitimate+path+God+leads+us+into+the+possession+of+eternal+life%E2%80%A6+The+same+truly+are+rightly+able+to+be+said+to+be+an+instrumental+cause+of+eternal+life%2C+insofar+as+God+leads+us+by+them+into+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+p.+670+of+%E2%80%98Whether+Good+Works+are+the+Cause+of+Eternal+Salvation%3F%E2%80%99+in+Of+the+Nature+of+God%2C+or+of+the+Divine+Attributes+%28Neustadt%2C+1593%29%2C+Book+5%2C+ch.+2%2C+after+Of+Predestination+in+General%2C+Question+6%2C+Other+Part%2C+Of+the+Predestination+of+the+Saints%2C+Question+3%2C+after+the+Thesis%2C+pp.+670-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F935f45ba52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/935f45ba52.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20do%20not%20absolutely%20deny%2C%20that,us%20by%20them%20into%20eternal%20life&amp;text=We%20do%20not%20absolutely%20deny%2C%20that%20good%20works&amp;text=God%20leads%20us%20by%20them%20into%20eternal%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 5: Good works are understood to have a causative power for eternal life in three ways. 1. As strictly meritorious, which we reject against the papists as blasphemous, as we proved in another place. 2. That they may have an inferior and causal instrumental power conferred upon them by the grace of God, as Gisbertus Voetius says in Thersite Heautontemerumeno, section. 1, ch. 2, just as running is the cause of the attaining of a crown which is received, contending the cause of the victory, and diet is a cause of health [1 Cor. 9:24-25; Heb. 12:1]. Neither may one be said to distinguish accurately here between a means and a cause, or between a way and a cause: for while good works are means, they are not passive, but active: a means here is an inferior cause. Therefore it is said, “For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory”. Κατεργάζεται ἡμῖν, they work, they bring about a cause for us, as the Holy Spirit speaks, 2 Cor. 4:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 532 of ’10. Whether good works are necessary as causes of justification, and therefore also of salvation? in Ch. 12, ‘On the Justification of Sinners’ in Examination of Arminianism (Utrecht, 1668)</cite></span></figcaption>

<blockquote><p>When therefore, we say that the faithful are esteemed just even in their deeds this is not stated as a cause of their salvation, and we must diligently notice that the cause of salvation is excluded from this doctrine; for, when we discuss the cause, we must look nowhere else but to the mercy of God, and there we must stop. But although works tend in no way to the cause of justification, yet, when the elect sons of God were justified freely by faith, at the same time their works are esteemed righteous by the same gratuitous liberality. Thus it still remains true, that faith without works justifies, although this needs prudence and a sound interpretation; for this proposition, that faith without works justifies is true and yet false, according to the different senses which it bears. The proposition, that faith without works justifies by itself, is false, because faith without works is void. But if the clause “without works” is joined with the word “justifies,” the proposition will be true. Therefore faith cannot justify when it is without works, because it is dead, and a mere fiction. He who is born of God is just, as John says. (1 John v. 18.) Thus faith can be no more separated from works than the sun from his heat: yet faith justifies without works, because works form no reason for our justification; but faith alone reconciles us to God, and causes him to love us, not in ourselves, but in his only-begotten Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin on Eze. 18:14-17 in Commentaries on the Prophet Ezekiel, Vol. II (Grand Rapids: Baker Book House, 1979)</cite>, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>Concerning this faith and trust, it is earnestly pleaded by many that obedience is included in it [such as Socinians and Papists]… But to suppose that a dead faith, or that faith which is dead, is that faith which is required of us in the gospel in the way of duty, is a monstrous imagination… For how impossible it is, according unto their principles who believe justification by faith alone, that justifying faith should be without a sincere purpose of heart to obey God in all things, I shall briefly declare. For, First… to suppose such a grace dead, inactive, unfruitful, not operative unto the great end of the glory of God, and the transforming of the souls of them that receive it into his image, is a reflection on the wisdom, goodness, and love of God Himself. Secondly, That this grace is in them a principle of spiritual life, which in the habit of it, as resident in the heart, is not really distinguished from that of all other grace whereby we live to God. So, that there should be faith habitually in the heart,–I mean that evangelical faith we inquire after,–or actually exercised, where there is not a habit of all other graces, is utterly impossible. Neither is it possible that there should be any exercise of this faith unto justification, but where the mind is prepared, disposed, and determined unto universal obedience. And therefore, Thirdly, It is denied that any faith, trust, or confidence, which may be imagined, so as to be absolutely separable from, and have its whole nature consistent with, the absence of all other graces, is that faith which is the especial gift of God, and which in the gospel is required of us in a way of duty… Wherefore we say, the faith whereby we are justified, is such as it not found in any but those who are made partakers of the Holy Ghost, and by him united unto Christ; whose nature is renewed, and in whom there is a principle of all grace, and purpose of obedience. Only we say, it is not any other grace, as charity and the like, nor any obedience, that gives life and form unto this faith; but it is this faith that gives life and efficacy unto all other graces, and form unto all evangelical obedience. Neither doth any thing hence accrue unto our adversaries, who would have all those graces which are, in their root and principle, at least, present in all that are to be justified, to have the same influence unto our justification as faith hath… the nature of no other grace is capable of that office which is assigned unto faith in our justification, nor can be assumed into a society in operation with it,–namely, to receive Christ, and the promises of life by him, and to give glory unto God on their account… And this, in particular, is to be affirmed of repentance; concerning which it is most vehemently urged, that it is of the same necessity unto our justification as faith is. For this they say is easily proved, from testimonies of Scripture innumerable, which call all men to repentance that will be saved… But that which they have to prove is not that it is of the same necessity with faith unto them that are to be justified, but that it is of the same use with faith in their justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification by Faith, ch. 2, ‘The Nature of Justifying Faith’</cite>, pp. 103-5 in Works, vol. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

ith+whereby+we+are+justified%2C+is+such+as+it+not+found+in+any+but+those+who+are+made+partakers+of+the+Holy+Ghost%2C+and+by+him+united+unto+Christ%3B+whose+nature+is+renewed%2C+and+in+whom+there+is+a+principle+of+all+grace%2C+and+purpose+of+obedience.+Only+we+say%2C+it+is+not+any+other+grace%2C+as+charity+and+the+like%2C+nor+any+obedience%2C+that+gives+life+and+form+unto+this+faith%3B+but+it+is+this+faith+that+gives+life+and+efficacy+unto+all+other+graces%2C+and+form+unto+all+evangelical+obedience.+Neither+doth+any+thing+hence+accrue+unto+our+adversaries%2C+who+would+have+all+those+graces+which+are%2C+in+their+root+and+principle%2C+at+least%2C+present+in+all+that+are+to+be+justified%2C+to+have+the+same+influence+unto+our+justification+as+faith+hath%E2%80%A6+the+nature+of+no+other+grace+is+capable+of+that+office+which+is+assigned+unto+faith+in+our+justification%2C+nor+can+be+assumed+into+a+society+in+operation+with+it%2C%E2%80%93namely%2C+to+receive+Christ%2C+and+the+promises+of+life+by+him%2C+and+to+give+glory+unto+God+on+their+account%E2%80%A6+And+this%2C+in+particular%2C+is+to+be+affirmed+of+repentance%3B+concerning+which+it+is+most+vehemently+urged%2C+that+it+is+of+the+same+necessity+unto+our+justification+as+faith+is.+For+this+they+say+is+easily+proved%2C+from+testimonies+of+Scripture+innumerable%2C+which+call+all+men+to+repentance+that+will+be+saved%E2%80%A6+But+that+which+they+have+to+prove+is+not+that+it+is+of+the+same+necessity+with+faith+unto+them+that+are+to+be+justified%2C+but+that+it+is+of+the+same+use+with+faith+in+their+justification.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Justification+by+Faith%2C+ch.+2%2C+%E2%80%98The+Nature+of+Justifying+Faith%E2%80%99%2C+pp.+103-5+in+Works%2C+vol.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F458f992fb8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/458f992fb8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Concerning%20this%20faith%20and%20trust%2C%20it,use%20with%20faith%20in%20their%20justification&amp;text=Concerning%20this%20faith%20and%20trust%2C%20it%20is%20earnestly&amp;text=the%20same%20use%20with%20faith%20in%20their%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…we will prove that subsequent grace exists and that it is necessary for every good work. We presuppose: 1. That grace is a supernatural gift, operation, and work of God. So that it may be distinguished from nature and from natural operation and gift as the author, preserver, and governor of all nature, especially human nature; to which He gives being, which He preserves in being, which He governs by His concurrence and precursive assistance in operating, as the prime cause of all motions and operations. Acts 27:28 “For in Him we live and move and have our being.” And verse 25 “He himself gives to all life and breath and everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on Subsequent Grace, pt. 1-5 tr. by AI by Onku in Select Theological Disputations, vol. 5 (1669)</cite>, pp. 716-63 Latin</span></figcaption>

<blockquote><p>First therefore take notice what we mean by good works. We take not good works strictly, for the works of charity or liberality; nor for any external actions of religion, which may be done where the heart is not cleansed; much less for the Popish good works of supererogation: but for the graces of God’s Spirit in us, and the actions flowing from them: For, usually, with the Papists and Popish persons, good works are commonly called those superstitious and supererogant works, which God never commanded: or, if God has commanded them, they mean them as external and sensible; such as coming to church and receiving of sacraments; not internal and spiritual faith, and a contrite spirit, which are the soul of all duties: and if these be not there, the outward duties are like clothes upon a dead man, that cannot warm him, because there is no life within. Therefore much is required even to the essence of a godly work, though it be not perfect in degrees: As: 1. It must be commanded by God. 2. It must be wrought in us by the Spirit of God. All the unregenerate man’s actions, his prayers, and services are sins. 3. It must flow from an inward principle of grace, or a supernatural being in the soul, whereby a man is a new creature. 4. The end must be God’s glory. That which the most refined man can do is but a glow-worm, not a star: So that then only is the work good, when, being answerable to the rule, it’s from God, and through God, and to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants… (London: Young, 1647), Lecture 4</cite>, p. 39</span></figcaption>

d93e854d06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d93e854d06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-good-works/#:~:text=First%20therefore%20take%20notice%20what%20we,and%20through%20God%2C%20and%20to%20God&amp;text=First%20therefore%20take%20notice%20what%20we%20mean%20by&amp;text=from%20God%2C%20and%20through%20God%2C%20and%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As for the state to which sanctification brings us, we thought meet 1. To put down the manner and nature of the inclination itself, in the apostle’s words, ‘zealous of good works,’ lest any should think that the external work is all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-757e8a0bda" data-kw="">
<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith… 1st ed. (Oxford, 1625), section 3, ch. 1</cite>, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— William Pemble, Vindiciae fidei, or A Treatise of Justification by Faith… 1st ed. (Oxford, 1625), section 3, ch. 1, pp. 66-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+righteousness+required+by+the+Moral+Law+is+of+two+sorts%3A+1.+Habitual+%5Ban+abiding+inward+disposition%5D%2C+in+the+inherent+holiness+of+man%E2%80%99s+whole+person%2C+when+such+gracious+qualities+are+fixed+and+planted+in+every+faculty+of+soul+and+body%3A+as+do+dispose+and+incline+the+motions+of+both+only+unto+that+which+is+conformable+to+the+righteousness+of+the+Law.+That+such+righteousness+is+required+by+the+Law+is+a+plain+case+and+confessed%3B+That+which+commands+the+good+or+forbids+the+evil+action+does+command+the+virtuous+and+forbid+the+vicious+habit+too.+He+that+looks+for+purity+in+the+stream+cannot+but+dislike+poison+in+the+fountain%3A+and+God+that+commands+us+to+do+good%2C+bids+us+also+to+be+holy%3B+nor+can+we+do+the+one%2C+unless+we+do+the+other.+And+therefore+the+apostle+joins+both+together.+The+end+of+the+commandment+is+love%2C+%28but+where%3F%29+out+of+a+pure+heart%2C+1+Tim.+1%3A5.+2.+Actual%2C+in+the+exercise+of+all+good+works+enjoined+by+the+Law%2C+and+forbearing+the+contrary+evil+works.+Whether+these+good+or+evil+works+be+inward+in+that+spiritual+obedience+which+the+Law+required%3B+%28viz.%29+in+the+right+ordering+of+all+the+motions+of+our+souls%2C+that+every+one+of+our+thoughts%2C+imaginations%2C+purposes+of+our+mind%2C+and+all+the+secret+workings+and+stirrings+of+our+affections%2C+be+altogether+employed+upon+piety+and+charity%2C+not+so+much+as+touching+upon+any+thing+that+is+contrary+to+the+love+of+God+or+our+neighbor.+Or%2C+whether+these+good+and+evil+works+be+outward+in+the+bodily+obedience+unto+the+Law%2C+in+doing+all+and+every+external+duty+of+religion+towards+God%3A+of+justice+and+mercy+towards+man%3B+and+in+leaving+undone+the+contrary.+Further+this+actual+righteousnesse+of+the+Law+is+to+be+considered+two+ways%3A+1.+As+it+respects+all+the+ <blockquote><p>…you must know therefore that righteousness is no proper real being, but a modus entis, ‘the modification of a being’. The subject of it is: 1. an action, 2. or a person. An action is the primary subject, and so the disposition; and the person secondary, as being therefore righteous, because his disposition and actions are so. Righteousness is the conformity of dispositions and actions, and consequently the person to the rule prescribed. It is not a being distinct therefore from the dispositions and actions, but their just and well being. This [de]finition is only of the creatures’ righteousness. God is the Primum Iustum, and so the rule of righteousness to the creature, and has no rule but Himself for the measuring of his actions. Yet his essence is too far above us, remote and unknown to be this rule to the creature, therefore has He given us his laws, which flow from his perfection, and they are the immediate rule of our dispositions and actions and so of our righteousness. Here carefully observe, that this law has two parts: 1. The precept and prohibition prescribing and requiring duty: 2. The promise and commination [threatening] determining of the reward of obedience, and penalty of disobedience. As the precept is the principal part, and the penalty annexed but for the precept’s sake; so the primary intent of the lawgiver is the obeying of his precepts, and our suffering of the penalty is but a secondary for the attaining of the former. So is there accordingly a two-fold Righteousness or fulfilling of this law, (which is the thing I would have observed): the primary, most excellent and most proper Righteousness lies in the conformity of our actions to the precept: The secondary, less excellent righteousness) yet fitly enough so called) (see Pemble, Of Justification, p. 2) is, when though we have broke the precepts, yet we have satisfied for our breach, either by our own suffering, or some other way.</p></blockquote>

</figure><figure class="quote" id="q-e7761df9a8" data-kw="">
<blockquote><p>But 2. let us understand that according to works signifies an analogy or measure of good works and of evil, as it may fitly be understood, and we also have elsewhere interpreted. There is then an ambiguity in the word ‘analogy,’ or ‘proportion,’ and we must distinguish between a proportion causal, meritorious, and a proportion-conditional. A causal, meritorious proportion of works and reward is when greater or lesser works are the cause or merit of a greater or lesser reward. A conditional proportion is when greater or lesser works are not the cause or merit, but only the position of the condition under which a greater or lesser reward is to be had. In evil works or sins, there are both proportions, causal or meritorious, and conditional of the works to the reward. Of good works, this proposition is false: ‘According to whose proportion eternal life is promised, that is meritorious of eternal life.’ For here is understood not a causal, but a conditional proportion, etc. For they have not the conditions of merit properly so called; but they are the position (or performing) of the condition on which God does promise and distribute the rewards of eternal life and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Castigated, ‘On Justification’, bk. 5, ch. 3, pp. 1245-46 in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3</cite>, p. 405</span></figcaption>

<blockquote><p>Controversy XIV: Do good works truly merit eternal salvation? Orthodox Position: No one can be saved without merits; but the root, source, and origin of these merits is Christ. Although God adorns and rewards our works, both in this life and the next, with the most abundant rewards, not only by His mercy but also by justice, due to the previous promise or covenant, however, speaking properly, we do not merit eternal life with them. [Romanist] Position of Bellarmine: Good works are properly meritorious, and this by merit of congruence or condign. The merit of congruence is in relation to moral works performed before justification. For these, by their nature, do not merit salvation, except concerning what is promised to them by God’s goodness. The merit of condign is that by which the reward is entirely due. And this is attributed to good works after justification. The works of the righteous merit eternal life by condign in two ways: first, in reason of the covenant or justice, which makes God our debtor; second, in reason of the intrinsic dignity of these works; for they are proportional to the reward in an arithmetical proportion, as seen in commutative justice. Confirmation of the Thesis: 1. God’s grace and our merit are contrary (Romans 4, 11). 2. Christ merited for us the beginning, middle, and end of salvation (John 2; Acts 3, 4). 3. Good works do not meet the conditions of proper merit, which are contained in this verse: Gratia, si non debes, est gratia. Good works are the fruits of the Holy Spirit, and for that reason, we owe them to God. There is no proportion between our works and eternal life, for here everything is perfect and infinite, there everything is imperfect, as admitted by Scotus and Durandus. 4. The Church Fathers teach this. Bernard says that our merits, that is, our works, are the way to the kingdom, not the cause of the kingdom. And Augustine: “In your justice, Lord, not in mine. Not because I deserved it, but because you had mercy.” And also: “All my hope is in the death of my Lord. His death is my merit, my life, and resurrection. My merit is the mercy of the Lord. I will not lack merit as long as the Lord of mercies does not lack me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>

e I deserved it, but because you had mercy.” And also: “All my hope is in the death of my Lord. His death is my merit, my life, and resurrection. My merit is the mercy of the Lord. I will not lack merit as long as the Lord of mercies does not lack me.”

between+our+works+and+eternal+life%2C+for+here+everything+is+perfect+and+infinite%2C+there+everything+is+imperfect%2C+as+admitted+by+Scotus+and+Durandus.+4.+The+Church+Fathers+teach+this.+Bernard+says+that+our+merits%2C+that+is%2C+our+works%2C+are+the+way+to+the+kingdom%2C+not+the+cause+of+the+kingdom.+And+Augustine%3A+%E2%80%9CIn+your+justice%2C+Lord%2C+not+in+mine.+Not+because+I+deserved+it%2C+but+because+you+had+mercy.%E2%80%9D+And+also%3A+%E2%80%9CAll+my+hope+is+in+the+death+of+my+Lord.+His+death+is+my+merit%2C+my+life%2C+and+resurrection.+My+merit+is+the+mercy+of+the+Lord.+I+will+not+lack+merit+as+long+as+the+Lord+of+mercies+does+not+lack+me.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alsted%2C+%E2%80%98On+Justification+%26+Good+Works+in+General%E2%80%99+in+Theologia+polemica%2C+exhibens+praecipuas+huius+aeui+in+religionis+negotio+controuersias+sex+in+partes+tributa+studio+%28d.+1638%29+at+Nosferatu%E2%80%99s+Substack+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e68777508.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e68777508.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-merit/#:~:text=Controversy%20XIV%3A%20Do%20good%20works%20truly,of%20mercies%20does%20not%20lack%20me&amp;text=Controversy%20XIV%3A%20Do%20good%20works%20truly%20merit%20eternal&amp;text=the%20Lord%20of%20mercies%20does%20not%20lack%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Nay more than this, we deny not but in some sense this reward may be said to proceed of justice. For howsoever originally and in itself we hold it comes from God’s free bounty and mercy, who might have required the work of us without all promise of reward (for, as I said, we are his creatures and owe our being unto Him), yet in regard He has covenanted with us, and tied Himself by his Word and promise to confer such a reward, the reward now in a sort proves to be an act of justice, namely of justitia promissi [justice of promise] on God’s part, not of merit on ours: even as in forgiving our sins (which in itself all men know to be an act of mercy) He is said to be ‘faithful and just’, 1 Jn. 1:9, namely in the faithful performance of his promise; for promise (we know) once made, among honest men is accounted a due debt. But this argues no more any worthiness of equality in the work toward the obtaining of the reward than if a promise of a kingdom were made to one if he should take up a straw, it would follow thence that the lifting up of a straw were a labor or a work worth a kingdom; howsoever, he that should so promise were bound to give it. Thus was Moses careful to put the children of Israel in mind touching the land of Canaan (Dt. 9:5, which was a type of our eternal habitation in Heaven), that it was a land of promise, and not of merit, which God gave them to possess, not for their righteousness, or for their upright heart, but that He might perform the word which He swore unto their fathers, Abraham, Isaac, and Jacob. Whereupon the Levites, in the Book of Nehemiah, say in their prayer to God: ‘Thou madest a covenant with Abraham, to give to his seed the land of the Canaanites, and hast performed thy words, because Thou art just,’ (Neh. 9:8) that is, true and faithful in keeping thy promise. Now because the Lord has made a like promise of the crown of life to them that love Him, St. Paul sticks not in like manner to attribute this also to God’s justice; ‘Henceforth’ (says he, 2 Tim. 4:8) ‘is laid up for me a crown of righteousness, which the Lord the righteous Judge shall give me at that day; and not to me only, but to all them that love his appearing.’ Upon which St. Bernard most sweetly, as he is wont: Est ergo quam Paulus expectat corona iustitiae; sed iustitiae Dei, non suae: iustum quippe est, ut reddat quod debet; debet autem quod pollicitus est. ‘There is therefore a crown of righteousness which Paul looks for; but it is of God’s righteousness, not his own: it being a righteous thing with God to give what he owes; now he owes what he has engaged himself to by promise.’ Lastly, for the word ‘merit’, it is not the name we so much scruple at, as the thing now-a-days to be understood thereby: otherwise we confess the name might be admitted, if taken in the large and more general sense, for any work having relation to a reward to follow it, or whereby a reward is quocunque modo [in whatever way] obtained; in a word, as the correlate indifferent either to merces gratiae or iustitiae, ‘the reward of grace or of justice’. For thus the Fathers used it; and so might we have done still, if some of us had not grown too proud, and mistaken it. Since we think it better and safer to disuse it, even as physicians are wont to prescribe their patients recovered of some desperate disease, not to use any more [of] that meat or diet which they find to have caused it.</p></blockquote>

</figure><figure class="quote" id="q-72c1ecd2d8" data-kw="">
<blockquote><p>Things commanded, in the unregenerate are sins, because although the actions and doings of those things are commanded, yet the person, from whom those actions proceed, pleases not God, neither is reconciled unto God. Further, that which the unregenerate do, they do it not to that end, whereunto they ought, that is, to the glory of God, neither is their action grounded of faith. For they know not whether or no they have God favorable to them, or whether that be pleasing unto Him which they do. But these conditions and circumstances are necessarily required to a good work: for it suffices not to do good works after a civil manner. Those civil works indeed are good, as they proceed from God: but as they are in unregenerate men, they are evil: even as it is sin, when a wicked man gives alms: because it proceeds not from the love of God and therefore not from faith, neither is referred unto God’s glory. But yet those things which men do being forbidden in the Law of God are of themselves and properly sins, because the nature or definition of sin doth properly agree unto them: which is, that they are done against the express commandment of God. And therefore in the Scripture things which are so done of men, are ever called evil, but never good. But those things which are commanded of God, when they are done by the unregenerate, or in hypocrisy, they are so discommended, as yet nevertheless they are counted and praised for good: and that not only in respect of God, who is the efficient of those things in men, in respect of whom all the actions of the wicked are just: but also in respect of the men themselves by whom they are done, so that they also are said to have done well, as 1 Kings 21, ‘Seest thou how Ahab is humbled before me? Because he submits himself before Me, I will not bring that evil in his days. And 2 Kn. 10, ‘The Lord said unto Jehu: Behold, because thou hast diligently executed that which was right in my eyes etc.</p></blockquote>

— Zachary Ursinus, The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), Of Sin, 3. How many kinds of sin there are, 5. Sinful in itself or Not, pp. 94-95">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThings+commanded%2C+in+the+unregenerate+are+sins%2C+because+although+the+actions+and+doings+of+those+things+are+commanded%2C+yet+the+person%2C+from+whom+those+actions+proceed%2C+pleases+not+God%2C+neither+is+reconciled+unto+God.+Further%2C+that+which+the+unregenerate+do%2C+they+do+it+not+to+that+end%2C+whereunto+they+ought%2C+that+is%2C+to+the+glory+of+God%2C+neither+is+their+action+grounded+of+faith.+For+they+know+not+whether+or+no+they+have+God+favorable+to+them%2C+or+whether+that+be+pleasing+unto+Him+which+they+do.+But+these+conditions+and+circumstances+are+necessarily+required+to+a+good+work%3A+for+it+suffices+not+to+do+good+works+after+a+civil+manner.+Those+civil+works+indeed+are+good%2C+as+they+proceed+from+God%3A+but+as+they+are+in+unregenerate+men%2C+they+are+evil%3A+even+as+it+is+sin%2C+when+a+wicked+man+gives+alms%3A+because+it+proceeds+not+from+the+love+of+God+and+therefore+not+from+faith%2C+neither+is+referred+unto+God%E2%80%99s+glory.+But+yet+those+things+which+men+do+being+forbidden+in+the+Law+of+God+are+of+themselves+and+properly+sins%2C+because+the+nature+or+definition+of+sin+doth+properly+agree+unto+them%3A+which+is%2C+that+they+are+done+against+the+express+commandment+of+God.+And+therefore+in+the+Scripture+things+which+are+so+done+of+men%2C+are+ever+called+evil%2C+but+never+good.+But+those+things+which+are+commanded+of+God%2C+when+they+are+done+by+the+unregenerate%2C+or+in+hypocrisy%2C+they+are+so+discommended%2C+as+yet+nevertheless+they+are+counted+and+praised+for+good%3A+and+that+not+only+in+respect+of+God%2C+who+is+the+efficient+of+those+things+in+men%2C+in+respect+of+whom+all+the+actions+of+the+wicked+are+just%3A+but+also+in+respect+of+the+men+themselves+by+whom+they+are+done%2C+so+that+they+also+are+said+to+have+done+well%2C+as+1+Kings+21%2C+%E2%80%98Seest+thou+how+Ahab+is+humbled+before+me%3F+Because+he+submits+himself+before+Me%2C+I+will+not+bring+that+evil+in+his+days.+And+2+Kn.+10%2C+%E2%80%98The+Lord+said+unto+Jehu%3A+Behold%2C+because+thou+hast+diligently+executed+that+which+was+right+in+my+eyes+etc.%E2%80%9D%0A%0A%E2%80%94+Zachary+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+Of+Sin%2C+3.+How+many+kinds+of+sin+there+are%2C+5.+Sinful+in+itself+or+Not%2C+pp.+94-95&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72c1ecd2d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72c1ecd2d8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-virtues-good-works-of-unbelievers/#:~:text=Things%20commanded%2C%20in%20the%20unregenerate%20are,was%20right%20in%20my%20eyes%20etc&amp;text=Things%20commanded%2C%20in%20the%20unregenerate%20are%20sins%2C%20because&amp;text=that%20which%20was%20right%20in%20my%20eyes%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special. 20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3. 21. Special help is called the particular grace that moves, strengthens, and advances unto action. 22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10. 23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters. 24. I call earthly matters those things which pertain only to earthly life. 25. And these are either natural or moral. 26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc. 27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc. 28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. … 38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God. 39. Much less is it able to choose and pursue political matters without the general help of God. 40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.</p></blockquote>

<blockquote><p>§V. As to liberty itself; there remained in the will of lapsed man: 1. Immunity from the necessity of coaction, or external violence, by reason of elicited acts. 2. Immunity from internal physical necessity. 3. The liberty of exercise or of contradiction, which is between willing or not willing; loving or not loving; acting or not acting. 4. The liberty of specification, by which the will, from two or more things or species which can be recalled to the sphere of doable things in the state of corruption, can choose one and neglect another. §VI. The objects which pertain to the sphere of doable things in the state of reigning corruption, before conversion, are all those things which are subject to the senses and to natural reason, and do not surpass human grasp. And they are: 1. Actions merely natural and animal, e.g., to eat, to drink, to be awake, to sleep, to be moved from a place, to rest. 2. The inventions or apprehensions of sciences and arts, concerning which see Calvin, Institutes, bk. 2, ch. 2, §14. 3. Civil and economic actions, such as to care for a family and the commonwealth, and in them to do or omit one’s duty. 4. Moral actions of the natural order, and those which pertain to common ethics, Rom. 2:14-15… Hence the virtues of the gentiles, produced by the general aid of God, as to their substance, are true moral virtues of the natural order, consisting of the same internal form, object, means and acts; although by reason of their mode, adjuncts, circumstances, and also their end, they often had notable defects, in respect of which Augustine calls them, by a broad signification, ‘sins’, although elsewhere he commends the virtues of the gentiles, as in Of the Spirit &amp; the Letter, ch. 27; Epistle 99 to Evodius; also Epistle 130; and the book, On the Grace of Christ, ch. 24. See Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 7, §5; D. Johann Fabricius, Systema Theologicum, locus 3, aphorism 2, p. 277. Nor does the passage Rom. 14:23 stand in the way, for there Paul by ‘faith’ does not understand saving faith, but the dictate of conscience, by which something is judged to be licit or illicit. §VII. But to this sphere in no way pertain spiritual actions, which cannot be elicited and performed except by the Spirit of God vivifying, illuminating, acting, operating, regenerating and sanctifying in certain degrees. In respect of these, we rightly teach that the natural powers of free will are not only bound, attenuated, impeded, wounded and broken, but plainly lost, destroyed, extinguished, and null, against the Pelagians, Semi-Pelagians, Socinians, Remonstrants, Mennonites; and in part also the Greeks, Synergists and Pontificists, of whom see Bellarmine, bk. 6 of On the Loss of Grace &amp; the State of Sin, ch. 16; Coster, Enchiridion, ch. 5, p. 190. §VIII. Against whom we assert that unregenerate man in the state of dominant corruption, or before his conversion, has from himself no natural powers, whether in the intellect or in the will, for… keep[ing] the precepts of God, and do[ing] good works, pleasing to God and saving for himself.</p></blockquote>

%E2%80%98sins%E2%80%99%2C+although+elsewhere+he+commends+the+virtues+of+the+gentiles%2C+as+in+Of+the+Spirit+%26+the+Letter%2C+ch.+27%3B+Epistle+99+to+Evodius%3B+also+Epistle+130%3B+and+the+book%2C+On+the+Grace+of+Christ%2C+ch.+24.+See+Dn.+D.+Samuel+Strimesius%2C+Praxiologia+Apodictica%2C+ch.+7%2C+%C2%A75%3B+D.+Johann+Fabricius%2C+Systema+Theologicum%2C+locus+3%2C+aphorism+2%2C+p.+277.+Nor+does+the+passage+Rom.+14%3A23+stand+in+the+way%2C+for+there+Paul+by+%E2%80%98faith%E2%80%99+does+not+understand+saving+faith%2C+but+the+dictate+of+conscience%2C+by+which+something+is+judged+to+be+licit+or+illicit.+%C2%A7VII.+But+to+this+sphere+in+no+way+pertain+spiritual+actions%2C+which+cannot+be+elicited+and+performed+except+by+the+Spirit+of+God+vivifying%2C+illuminating%2C+acting%2C+operating%2C+regenerating+and+sanctifying+in+certain+degrees.+In+respect+of+these%2C+we+rightly+teach+that+the+natural+powers+of+free+will+are+not+only+bound%2C+attenuated%2C+impeded%2C+wounded+and+broken%2C+but+plainly+lost%2C+destroyed%2C+extinguished%2C+and+null%2C+against+the+Pelagians%2C+Semi-Pelagians%2C+Socinians%2C+Remonstrants%2C+Mennonites%3B+and+in+part+also+the+Greeks%2C+Synergists+and+Pontificists%2C+of+whom+see+Bellarmine%2C+bk.+6+of+On+the+Loss+of+Grace+%26+the+State+of+Sin%2C+ch.+16%3B+Coster%2C+Enchiridion%2C+ch.+5%2C+p.+190.+%C2%A7VIII.+Against+whom+we+assert+that+unregenerate+man+in+the+state+of+dominant+corruption%2C+or+before+his+conversion%2C+has+from+himself+no+natural+powers%2C+whether+in+the+intellect+or+in+the+will%2C+for%E2%80%A6+keep%5Bing%5D+the+precepts+of+God%2C+and+do%5Bing%5D+good+works%2C+pleasing+to+God+and+saving+for+himself.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29%2C+ch.+2%2C+pp.+20-22+Latin+Holtzfus+was+a+German+reformed+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F48366ee3a0.html&amp;via=5Solas" target="_blank" rel=" <blockquote><p>Righteousness, in the fallen state, is twofold according to the demands of the law. Hence, Christ’s vicarious righteousness also needs to be twofold. He merits for us both deliverance from punishment and right to eternal life. None can be to Him alone for He is not liable to the first and [He is] entitled to the second due to the hypostatical union. Covenantally, however, he assumes the role of representative viator [wayfarer] in order to obtain the covenant promises for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/de-campos-junior-heber-carlos.html">de Campos, Junior, Heber Carlos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Piscator (1546-1625) and the Consequent Development of the Doctrine of the Imputation of Christ’s Active Obedience PhD diss. (Calvin Theological Seminary, 2009)</cite>, p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-db6e52eb0d" data-kw="">
<blockquote><p>The question also arises, whether it was strictly speaking through his passion and death that Christ merited this glory for his human nature. And whereas we really do not wish to enter into a dispute with those who make this claim,† since Christ certainly did obtain it for us by the worthiness of what He merited, yet we are of the opinion that the opposite point of view, which is shared by many Reformed writers, rests upon arguments that are stronger. The chief one of these is that the glory was owed to Christ by the right of his hypostatic union, and as the Son’s, and as the Son’s rightful inheritance (Ps. 2:7-8; Heb. 1:2). And so, by the consensus of all theologians, that hypostatic union does not follow upon any merit, nor the things which necessarily and by God’s decree followed it–which is why the apostle Paul also uses the word [karisasthai] ‘to bestow as gift’ in this context (Phil. 2:9 [‘and given Him’]).</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-691315a473" data-kw="">
<blockquote><p>XV. The Fruits of the Obedience, Passion, Death and Resurrection of Christ And we believe that Christ by his perfect obedience deserved eternal life, not only for Himself but also for us: by his passion and death He satisfied for our sins in his flesh… and by his resurrection and ascension into heaven He obtained also for us both the resurrections, (as John speaketh, Rev. 20:5) the first and the latter: and that in our name He took unto Himself possession of the heavenly inheritance: and sitteth at the right hand of God (Eph. 1:20), that is, hath taken to Himself power over all things in heaven and in earth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 11, Section 15, pp. 70-71 of Confession of Christian Religion (Cambridge, 1599) This may be found in the Latin in his Works, vol. 8, cols. 502-503. Voet and others say that Zanchi makes reference to this same teaching in the Preface to this work (on p. 477 in the Latin), though we have been unable to locate that reference.</cite></span></figcaption>

blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bac036e02d" data-kw="">
<blockquote><p>Christ complains, Isa. 49:4, “Then I said, I have laboured in vain, I have spent my strength for nought, and in vain”: there’s work. Shall He have nothing for his work? He adds, “Yet surely my judgement is with the Lord, and my work with my God.” v. 6. He receives an answer of a full reward for his work… And as One who laboured for us, so He craves his wages, though the Jews pay him unworthily. Zech. 11.12, “Then I said, if ye think good, give (Me) my price, and if not, forbear; pay Me, or pay Me not: Yet the Lord paid Him. Phil. 2:7, “He made Himself of no reputation, and took upon Him the form of a servant,–and became obedient to the death, the death of the cross.” Here is work: followeth his wages, call it merit, or what else, it’s a reward and the end of his suffering, which Christ both desired and intended, as the fruit of his labours. v. 9, dio [??], “Therefore God highly exalted Him, and gave Him a Name above every name”… Isa. 53:10, “When He shall make his soul an offering for sin (which was work hard enough) He shall see his seed (which was his soul’s desired wages) He shall prolong his days, the pleasure of the Lord shall prosper in hand: 11. He shall see of the travail of his soul, and be satisfied. 12. Therefore will I divide him (a portion) with the great, and he shall divide the spoil with the strong”: that is an ample reward. Follows his work, because “he hath poured out his soul unto death, and he was numbered with the transgressors, and bare the sins of many, and made intercession for the transgressors.” Hence, his care to finish the work of Him that sent Him, and to do his will, Jn. 4:34; Jn. 17:4; Jn. 8:29, and as the Father loved, so He rewarded the obedience of his Son, not by necessity of nature, but by a voluntary compact, but He loves his obedience, Jn. 10:17, “Therefore doth my Father love me, because I lay down my life, that I might take it again.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Part 2, ch. 6, Argument 10: ‘From the Work of Christ, and the wages, which a Covenant Calls for’ in The Covenant of Life Opened (Edinburgh, 1655), pp. 299-300 Rutherford is arguing that there is an eternal Covenant (of Redemption), because there is work as the condition, and a promise to that work.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-3e29601ba6" data-kw="">
<blockquote><p>And He suffered from the Father, as one whose demerits were infinite, by reason of our demerits that were laid upon Him. And yet it was especially by that act of his subjecting Himself to those sufferings, that He merited, and on the account of which chiefly He was accounted worthy of, the glory of his exaltation. Philippians 2:8–9, “He humbled Himself, and became obedient unto death; …wherefore God hath highly exalted Him.” And we see that ’tis on this account chiefly, that He is extolled as worthy by saints and angels in the context; “Worthy,” say they, “is the Lamb that was slain.…” This shows an admirable conjunction in him of infinite dignity, and infinite condescension and love to the infinitely unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Excellency of Christ’ [1734], point 5, p. 579 in Sermons and Discourses, 1734-1738 (WJE Online, vol. 19)</cite></span></figcaption>

</figure><figure class="quote" id="q-5323243335" data-kw="">
<blockquote><p>…given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10-12; Mt. 23:12; Lk. 24:26; Jn. 10:17; 17:4-5; Phil. 2:9; Heb. 2:10; 12:2)… Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9-10; 5:7-10; 10:12; 12:2)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics (Baker, 2006), 3:432-436</cite>, p. 434</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“…given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10-12; Mt. 23:12; Lk. 24:26; Jn. 10:17; 17:4-5; Phil. 2:9; Heb. 2:10; 12:2)… Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9-10; 5:7-10; 10:12; 12:2)…”

</figure><figure class="quote" id="q-f16acd9be1" data-kw="">
<blockquote><p>It is able to be conceded that Christ merited immortality, that is, He exhibited such obedience as deserved such remuneration. It is asked whether Christ merited for us in all of his works equally?…</p></blockquote>

</figure><figure class="quote" id="q-77047bdab6" data-kw="">
<blockquote><p>…the Lutherans could not speak of any reward and exaltation for Christ. For according to them, the human nature of Christ shared in the divine attributes of omnipresence, omniscience, and omnipotence already from the moment of the incarnation. It therefore first received these attributes not as a reward for the mediatorial work done in the state of humiliation but already before hand, in virtue or its union with the divine nature, and also kept them throughout, be it that in his humiliation Christ did not make use of them, at least no public use. The exaltation was not a true and real exaltation, but only a matter of using, or publicly using, that which He already possessed from the beginning. It was not the outcome of an antecedent human development but merely a glorious manifestation of what He already was and possessed in secret.ª ª J. Gerhard, Loci theologici, ed. E. Preuss, 9 vols. (Berlin: G. Schlawitz, 1863-75), IV, 329; J. Quenstedt, Theologia, III, 324; D. Hollaz, Examen, 748; J.F. Buddeus, Inst. theol., 787.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 3.433</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-652eea1381" data-kw="">
<blockquote><p>The eighth question is, whether Christ by his obedience merited anything for Himself. Here Quenstedt attacks Lombard, Thomas, Socinus, and others, That Christ merited only for us follows not only from the dignity of his Person, but from the communicatio idiomatum, whereby his human nature (except so far as our redemption required) lacked nothing. Besides, if He merited worship for Himself, how then could He have been worshipped in his earthly life? Moreover, as his merit and satisfaction are really one, if He merited for Himself, then He also satisfied for Himself. As to the name above every name, He had it already by right. Quenstedt repeats against the Romanists the argument of Calvin, that they confound the relation of antecedent and consequent with that of cause and effect. To the Socinian argument, that if Christ did not merit for Himself He could not merit for us, he replies that He could do this, just because He was not mere man, but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/english.html">English</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Quenstedt | As quoted in Robert Franks, A History of the Doctrine of the Work of Christ (Wipf &amp; Stock, 2001), Part 3, ch. 6</cite>, p. 425</span></figcaption>

</figure><figure class="quote" id="q-81e5a4dbbd" data-kw="">
<blockquote><p>Calvin rules out this interpretation with sufficient clarity when he denies that Christ gained merit for Himself, and censured the Scholastics who taught that He did. Calvin’s censure would have been completely unwarranted if Christ could have merited reward for Himself in any way at all. He felt that it was enough to show that Christ could not merit reward for Himself as God for God, or as man for man. Calvin just takes it for granted that one nature could not merit reward for the other. And rightfully so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/faustus-socinus.html">Faustus Socinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in J.V. Fesko, ‘Socinus &amp; the Racovian Catechism on Justification’ being ch. 13 in Michael Parsons, Aspects of Reforming: Theology &amp; Practice in Sixteenth Century Europe (Paternoster, 2013)</cite></span></figcaption>

<blockquote><p>I grant that the works of regeneration are necessary unto eternal life promised in the gospel, but not as merits or meritorious causes, but as the means and way wherein we are to proceed on from justification and regeneration unto glory and life eternal. They may also be said to be causes, after a sort, for they please God in Christ, and in some respects move Him, but not as merits, but as effects of the only merit of Jesus Christ, whereof they testify.</p></blockquote>

</figure><figure class="quote" id="q-2d653748b1" data-kw="">
<blockquote><p>Answer 2. Necessary, though not necessitate efficientiae as causes; yet necessitate presentiae, as necessary consequents of justification, and as necessary antecedents of glorification. They are necessary, I say, by a necessity not only privative (if I may so speak) but also positive… Answer 3. They are necessary also by a positive necessity, and that manifold. As first by the necessity of infallibility, in respect of God’s decree, Word, oath. … Answer 6. Secondly, they are necessary necessitate pracepti, imposing a necessity of duty, towards God, our neighbor, ourselves. … Argument 8. Thirdly, they are necessary, necessitate signi, as necessary signs and evidences, whereby we are to gather assurance to ourselves of our justification, whereby our faith is to be demonstrated, whereby we are to make our calling, and our election sure. … Argument 9. Lastly, they are necessary necessitate medii, and as that, which, though it be no cause, is called causa sine qua non. And thus they are necessary: First, as the way, which leadeth to life eternal, via qua nos perducturus est ad finem itsum quem promisit (Aug. in Ps. 109), the way by which He will bring us unto that end which He hath promised, saith Augustine. For those that are justified, and by justification entitled to the Kingdom of Heaven, they are to go in the way of sanctification towards their glorification, Eph. 2:10; good works therefore, though they be not the cause of reigning yet they are the way to the Kingdom. Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14. I conclude with Bernard (De Gratia et Libero Arbitrio) that good works are… of our secret predestination, presages of our future happiness, the way to the Kingdom, but not the cause of our obtaining that Kingdom. For howsoever good works are necessary in many respects, as I have showed, necessitate presentiae; yet they are not necessary necessitate efficientiae, as causes of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London, 1633) Book 7, ‘Concerning Good Works’ | Ch. 1 – To avoid Popish calumniations, it is shewed, that we doe hold the necessity of good works, and do urge the same by better arguments than the Popish religion doth afford.</span></figcaption>

</figure><figure class="quote" id="q-fd25df2ef3" data-kw="">
<blockquote><p>For the Papists charge us, that we place Christian liberty in this, that we are subject to no law in our conscience, and before God; and that we are free from all necessity of doing good works… We profess that good works are necessary to salvation, though not necessitate efficientiae, as causing it as the Papists teach; yet necessitate praesentiae, as necessary fruits of our faith, whereby we are to glorify God, and to testify our thankfulness, to do good to our brethren, and to make sure our election, calling and justification unto ourselves; as necessary forerunners of salvation, being the undoubted badges of them that shall bee saved; being the way wherein we are to walk to everlasting life, being the evidence according to which God will judge us at the last day. And lastly, that as by justification God doth entitle us unto his kingdom; so by sanctification He doth sit and prepare us thereto.</p></blockquote>

</figure><figure class="quote" id="q-a106ea2af5" data-kw="">
<blockquote><p>It followeth not, that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more then the apple goeth before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>

<blockquote><p>…the necessity of good works… These distinctions are necessary. 1. There is a jus and right to Gospel life eternal. And 2. there is actual possession of life eternal. 2. There is a twofold jus, One by the purchase of merit, and the paid ransom of blood; There is a right secondary by promise; every promise giveth a right in a manner, but its unproper. 3. There is promise of life formally federal. 2. There is a promise of life consequenter federal. 4. There is an order of things, one going before the other as the antecedent and the consequent, and in order of cause and effect. 5. Law-obedience doth much differ from Gospel-obedience, as Law-commands from Gospel-commands. 6. God sent his Son to justify persons, but not to justify works, not to make inherent obedience perfect or our righteousness before God.</p></blockquote>

<blockquote><p>5. They are a condition, without which a man cannot be saved. So that although a man cannot by the presence of them gather a cause of his salvation; yet by the absence of them he may conclude his damnation: so that it is an inexcusable speech of the Antinomian, Good works do not profit us, nor bad hinder us; thus Islebius. Now the Scripture, how full is it to the contrary? Rom. 8:13, ‘If ye live after the flesh, ye shall die.’ So, ‘Except ye repent, ye shall all likewise perish.’ Such places are so frequent, that it’s a wonder an Antinomian can pass them all over, and always speak of those places which declare God’s grace to us, but not our duty to Him. Without holiness no man can see God: now, by the Antinomians’ argument, as a man may be justified while he is wicked, and does abide so; so also he may be glorified and saved: for this is their principle, that, Christ has purchased justification, glory, and salvation for us, even though sinners and enemies.</p></blockquote>

<blockquote><p>XIV. Works can be considered three ways: either with reference to justification or sanctification or glorification. They are related to justification not antecedently, efficiently and meritoriously, but consequently and declaratively. They are related to sanctification constitutively because they constitute and promote it. They are related to glorification antecedently and ordinatively because they are related to it as the means to the end; yea, as the beginning to the complement because grace is glory begun, as glory is grace consummated.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XIV. Works can be considered three ways: either with reference to justification or sanctification or glorification. They are related to justification not antecedently, efficiently and meritoriously, but consequently and declaratively. They are related to sanctification constitutively because they constitute and promote it. They are related to glorification antecedently and ordinatively because they are related to it as the means to the end; yea, as the beginning to the complement because grace is glory begun, as glory is grace consummated.”

</figure><figure class="quote" id="q-af730605b1" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes</cite>, (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Jerome Zanchi, ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes, (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+absolutely+deny%2C+that+good+works+are+a+cause+of+salvation%2C+viz.%2C+an+instrumental+rather+than+an+efficient+one%E2%80%A6+and+as+the+cause+which+is+called+a+sine+qua+non+%5Bwithout+which%3A+none%5D%E2%80%A6+Good+works+are+an+instrumental+cause+of+the+possession+of+life+eternal%2C+for+by+these+as+by+media+and+by+the+legitimate+path+God+leads+us+into+the+possession+of+eternal+life%E2%80%A6+The+same+truly+are+rightly+able+to+be+said+to+be+an+instrumental+cause+of+eternal+life%2C+insofar+as+God+leads+us+by+them+into+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+%E2%80%98Whether+Good+Works+are+the+Cause+of+Eternal+Salvation%3F%E2%80%99+in+Of+the+Nature+of+God%2C+or+of+the+Divine+Attributes%2C+%28Neustadt%2C+1593%29%2C+Book+5%2C+ch.+2%2C+after+Of+Predestination+in+General%2C+Question+6%2C+Other+Part%2C+Of+the+Predestination+of+the+Saints%2C+Question+3%2C+after+the+Thesis%2C+pp.+670-71%2C+begins+bottom+of+left+column+on%2C+p.+670&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf730605b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af730605b1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20do%20not%20absolutely%20deny%2C%20that,us%20by%20them%20into%20eternal%20life&amp;text=We%20do%20not%20absolutely%20deny%2C%20that%20good%20works&amp;text=God%20leads%20us%20by%20them%20into%20eternal%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8453849f30" data-kw="">
<blockquote><p>Observe this yet, that more is required to salvation and eternal life than to justification. We are justified, that is we are absolved from sins, insofar as by it we are not condemned; not therefore because we give anything to God, but because from it is given righteousness, an acquisition we receive by the death of his son. Eternal life, truly, requires good works before it. By life eternal we mean the joy of conscience and glory; that good works confers something to those both is most plain. Nor therefore is it posited that a meritorious cause is in any way due to them, for the term ’cause’ broadly connotes something of merit. So the use of the sacraments, the study of the divine Word, the holy ministry are something of organic causes of salvation, even efficiently: yet not according to a principle of merit…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-martinius.html">Matthew Martinius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 435-36 in Notes to ch. 5, ‘Of the Fulfillment of the Covenant Respecting the Means’ in ‘Notes to the Method’ in A Sum of the Chapters of Christian Doctrine which are Contained in the Apostles’ Creed, the Decalogue, the Lord’s Prayer, the Institution of Church Discipline, of Holy Baptism &amp; of the Holy Supper, Briefly, Clearly, Popularly &amp; Distinctly Explained, even a Method of Holy Theology in Four Books Distributed… (Herborn, 1603), pp. 435-36</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-7b606e38e1" data-kw="">
<blockquote><p>Evangelicals are falsely accused by Bellarmine as denying that good works are necessary. For although good works are to be denied as causes of salvation, yet the same are not to be denied as necessary to demonstrating living faith, by which we are saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Period 1</cite>, Disputation 38, ‘Of the Necessity of Good Works &amp; of Christian Liberty’, Thesis 1 in A Collection of Three Whole Periods of Private Disputations Against Bellarmine (Basil, 1613), pp. 101-108, p. 101</span></figcaption>

— Amandus Polanus, Period 1, Disputation 38, ‘Of the Necessity of Good Works &amp; of Christian Liberty’, Thesis 1 in A Collection of Three Whole Periods of Private Disputations Against Bellarmine (Basil, 1613), pp. 101-108, p. 101">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvangelicals+are+falsely+accused+by+Bellarmine+as+denying+that+good+works+are+necessary.+For+although+good+works+are+to+be+denied+as+causes+of+salvation%2C+yet+the+same+are+not+to+be+denied+as+necessary+to+demonstrating+living+faith%2C+by+which+we+are+saved.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+Period+1%2C+Disputation+38%2C+%E2%80%98Of+the+Necessity+of+Good+Works+%26+of+Christian+Liberty%E2%80%99%2C+Thesis+1+in+A+Collection+of+Three+Whole+Periods+of+Private+Disputations+Against+Bellarmine+%28Basil%2C+1613%29%2C+pp.+101-108%2C+p.+101&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b606e38e1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b606e38e1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Evangelicals%20are%20falsely%20accused%20by%20Bellarmine,faith%2C%20by%20which%20we%20are%20saved&amp;text=Evangelicals%20are%20falsely%20accused%20by%20Bellarmine%20as%20denying&amp;text=demonstrating%20living%20faith%2C%20by%20which%20we%20are%20saved" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5757b1131c" data-kw="">
<blockquote><p>Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/festus-hommius.html">Festus Hommius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 67, ‘Of Good Works’, ‘Whether Good Works are Necessary to Salvation?’ in 70 Theological Disputations Against Papists</cite>, … in a Collection Against Bellarmine (Leiden, 1614), pp. 454-55</span></figcaption>

— Festus Hommius, Disputation 67, ‘Of Good Works’, ‘Whether Good Works are Necessary to Salvation?’ in 70 Theological Disputations Against Papists, … in a Collection Against Bellarmine (Leiden, 1614), pp. 454-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWherefore+good+works+are+necessary+to+salvation%2C+certainly+not+as+an+efficient+or+meritorious+cause%2C+by+an+efficient+principle%3B+yet+they+are+necessary+by+a+principle+of+being+present%2C+and+so+a+testimony+of+our+living+faith%2C+without+which+faith+is+dead%3B+and+they+are+required+to+salvation%2C+not+as+a+cause+of+ruling%2C+but+as+a+way+to+the+kingdom.%E2%80%9D%0A%0A%E2%80%94+Festus+Hommius%2C+Disputation+67%2C+%E2%80%98Of+Good+Works%E2%80%99%2C+%E2%80%98Whether+Good+Works+are+Necessary+to+Salvation%3F%E2%80%99+in+70+Theological+Disputations+Against+Papists%2C+%E2%80%A6+in+a+Collection+Against+Bellarmine+%28Leiden%2C+1614%29%2C+pp.+454-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5757b1131c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5757b1131c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Wherefore%20good%20works%20are%20necessary%20to,as%20a%20way%20to%20the%20kingdom&amp;text=Wherefore%20good%20works%20are%20necessary%20to%20salvation%2C%20certainly&amp;text=ruling%2C%20but%20as%20a%20way%20to%20the%20kingdom" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7f5dd95c2e" data-kw="">
<blockquote><p>Bellarmine: Good works are necessary not only by a necessity of presence, but also by efficiency, so Scripture, the Fathers and sane reason teaches. The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing]. If therefore by the term ‘efficiency’ Bellarmine does not mean some form of merit, or properly the virtue and worth of them in comparison to salvation, that saying is able to be admitted. Good works certainly work unto eternal life following, but not by meriting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology</cite>, … in Seven Parts (Hanau, Germany, 1620), p. 496</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

not%20by%20meriting" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-658bc426d4" data-kw="">
<blockquote><p>Bellarmine: 1. The adversaries in this bring things together so that good works are not necessary to salvation, except for a necessity of presence, so that they do not have any relation to salvation as they are merits, causes, conditions, etc. We speak against them that just good works are necessary to salvation, even as an efficient principle, even as they bring about [efficiunt] salvation. Protestants: We do not deny that good works have some relation to salvation, namely that they have a relation of being joined as a consequence, as a fitting effect to salvation (so to speak), being joined as an antecedent, namely as a fitting disposition unto salvation, and also as an argument confirming trust and hope in salvation; but we deny that our works are able to be some meritorious cause of justification and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Necessity of Works unto Salvation’ in Bellarmine Enervated, or Anti-Bellarmine Disputations</cite>, vol. 4 (London, 1632), pp. 367-369, p. 367</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-126564ab71" data-kw="">
<blockquote><p>We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.</p></blockquote>

</figure><figure class="quote" id="q-6a3ce0384e" data-kw="">
<blockquote><p>The Reformed–deny the necessity of good works for obtaining the right to eternal life. Indeed if done with this intention they say that in consequence they are actually evil and pernicious. But they declare that they are necessary by divine prescript for receiving possession of life, as conditions without which God refuses to bestow salvation upon us.” – trans. Heinrich Heppe, Reformed Dogmatics (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580 Vitringa, Sr., Campegius – ‘Of the Necessity of Good Works’, theses 20-24, pp. 358-73 in Ch. 17, ‘Of Sanctification, Good Works &amp; the Perseverance of the Saints’ in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 3 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘It is asked thirdly whether the endeavoring unto good works is necessary to salvation?’ in Theoretical and Practical Theology</cite>, (Utrecht, 1724), Book 6, ch. 8, section 27, pp. 844-45</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed–deny the necessity of good works for obtaining the right to eternal life. Indeed if done with this intention they say that in consequence they are actually evil and pernicious. But they declare that they are necessary by divine prescript for receiving possession of life, as conditions without which God refuses to bestow salvation upon us.” – trans. Heinrich Heppe, Reformed Dogmatics (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580 Vitringa, Sr., Campegius – ‘Of the Necessity of Good Works’, theses 20-24, pp. 358-73 in Ch. 17, ‘Of Sanctification, Good Works &amp; the Perseverance of the Saints’ in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 3 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition…”

hers%20of%20the%20earlier%20tradition&amp;text=The%20Reformed%E2%80%93deny%20the%20necessity%20of%20good%20works%20for&amp;text=as%20codifiers%20and%20bibliographers%20of%20the%20earlier%20tradition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-996d64bd75" data-kw="">
<blockquote><p>A few theologians [of the Augsburg Confession] also maintained that good works are not necessary but spontaneous, since they are not extorted by fear and punishment of the law but flow from a spontaneous spirit and joyful heart. Another party took the contrary view that good works are necessary. At first this latter controversy arose about the words ‘necessary’ and ‘free’, especially the word ‘necessary’. This word may refer to the immutable order which obligates and binds all men to be obedient to God, but at times it implies the coercion with which the law forces men to do good works. In the course of time, however, the issue ceased to be only a semantic problem and became a vehemently argued theological controversy when some contended that, because of the divine order referred to above, new obedience is not necessary in the regenerated.¹ ¹ The so-called Second Antinomian Controversy, chiefly between Andrew Musculus [who denied the ‘necessity’ of good works] and Obadiah Praetorius [who upheld the ‘necessity’ of good works]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abdias-praetorius.html">Abdias Praetorius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Necessity of Good Works &amp; New Obedience, out of the Sacred Letters, Luther, Melancthon, Confessions, Fathers, Recent Writings, &amp; some other Recent Items (Frankfurt, German, 1562) | Solid Declaration, Article 4, ‘Good Works’ (tr. Theodore Tappert, 1959)</span></figcaption>

<blockquote><p>Q. 153. What doth God require of us, that we may escape his wrath and curse due to us by reason of the transgression of the law? A. That we may escape the wrath and curse of God due to us by reason of the transgression of the law, he requireth of us repentance toward God, and faith toward our Lord Jesus Christ,[i] and the diligent use of the outward means whereby Christ communicates to us the benefits of his mediation.[k] [i] Acts 20:21. Matt. 3:7,8. Luke 13:3,5. Acts 16:30,31. John 3:16,18. [k] Prov. 2:1-5. Prov. 8:33-36. Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47.</p></blockquote>

<blockquote><p>Are good works necessary to salvation? The question is ambiguous, for if it be taken in this sense, that our good works are so necessary to salvation that they are the cause or merit of righteousness, salvation and life eternal, it is false. But if it be understood, that new obedience is necessary, so as it be a duty which we owe and an effect necessarily following reconciliation, it is true. 2. Because God will save no man without repentance, and the gift of the Holy Ghost is necessary to life eternal, as Christ says, Jn. 3:3, “Unless a man be born again…</p></blockquote>

<blockquote><p>As to the causal ‘for’ [in Mt. 25:42], I say that it does indeed signify a cause, but not meritorious of the Kingdom, but declaratory of the righteous sentence passed by the Judge; that of right the Kingdom is adjudged to the sheep, because by works they declared themselves truly sheep, that is, believers. Some there be that grant (which I would not do) that works are an efficient cause of the Kingdom, but not by way of merit, but as a way and means, etc.</p></blockquote>

</figure><figure class="quote" id="q-6cae4a7dae" data-kw="">
<blockquote><p>But this fruit (of Christ’s death) the apostle says belongs not promiscuously to all, but to them only who obey Him; For only these do accept the offered benefit. The rest by their own fault are deprived of it, because they obstinately refuse it: To obey Christ is not only to profess the name of Christ, but it is to acknowledge Christ the only perfect Redeemer, by true affiance to adhere to him and to live worthy the Gospel. This condition is in the whole Gospel required in them that must be saved.</p></blockquote>

<blockquote><p>XII. The Adjuncts of good works are, their imperfection and their necessity nevertheless. … XV. Good works are necessary by the necessity of precept and of the means, but not by the necessity of the cause or merit. By the necessity of precept they are necessary, because the study of good works through all the Scriptures is most severely enjoined to us: They are necessary in regard of the means, because they are sure marks of Vocation, Election, and true Faith; and because they are the way and means to attain heavenly bliss: As if a man should make a journey from York to London to obtain an inheritance, the way or journey is them medium or means, but not the meriting cause or the inheritance; even so it is in this matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (d. 1629; London, 1660), Book 2, ‘Concerning the Worship of God’, Ch. 1, ‘Of the Nature of Good Works’, sections 12 &amp; 15, pp. 315-317</span></figcaption>

</figure><figure class="quote" id="q-9d95ad2e21" data-kw="">
<blockquote><p>2. We are mere patients in the causes of blessedness; but in respect of conditions we are not so: for as we said of faith, we may also say of good works: God enables to them, but man works them, and walks in the way of them to blessedness: not that our works are causes, but conditions without which blessedness is not attained. See Mt. 25:35. 3. This assertion [previously objected] bewrays great ignorance of the proper and present use of sanctification, and the duties of it; which they conceive as legally urged to help the believer in his title and right to the blessed inheritance purchased in heaven: whereas only Christ’s righteousness and merits give right and title unto heaven; but yet the grace of sanctification gives us an aptitude and fitness unto it: for, ‘without holiness none shall see God,’ Heb. 12:14, and, no unclean thing shall enter into the gates of that City. (Rev. 21:27) Yea it is proceeding in sanctification to the measure and stature of Christ that fits us to the vision and fruition of the glorious presence of God, and for the full possession of that heavenly inheritance.</p></blockquote>

<blockquote><p>Controversy V: Are good works necessary? Position of [the Romanist Robert] Bellarmine: Good works are necessary not only by necessity of presence but also of efficiency, as Scripture, the Church Fathers, and sound reason teach. Orthodox Position: Good works do not precede the justified but necessarily follow him and precede the one who will be saved. They are necessary for adults in an orderly manner, by hypothesis or necessity: 1. Of presence, as signs and effects of faith. 2. Of divine commandment. 3. Of means, for they are the way to salvation, condition, and sine qua non cause. Therefore, if Bellarmine does not understand efficiency as some merit or inherent force and dignity of good works in obtaining salvation, this phrase can be admitted. Good works contribute to attaining eternal life, but not by merit. Therefore, the apparatus of arguments reported here is useless.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy V: Are good works necessary? Position of [the Romanist Robert] Bellarmine: Good works are necessary not only by necessity of presence but also of efficiency, as Scripture, the Church Fathers, and sound reason teach. Orthodox Position: Good works do not precede the justified but necessarily follow him and precede the one who will be saved. They are necessary for adults in an orderly manner, by hypothesis or necessity: 1. Of presence, as signs and effects of faith. 2. Of divine commandment. 3. Of means, for they are the way to salvation, condition, and sine qua non cause. Therefore, if Bellarmine does not understand efficiency as some merit or inherent force and dignity of good works in obtaining salvation, this phrase can be admitted. Good works contribute to attaining eternal life, but not by merit. Therefore, the apparatus of arguments reported here is useless.”

</figure><figure class="quote" id="q-3bd0cf9000" data-kw="">
<blockquote><p>The necessity of repentance, as a means, we here also acknowledge, seeing that to the impenitent there can be neither salvation nor remission of sin, etc. Remission of sin belongs to it, neither formally, nor meritoriously, nor satisfactorily, but at most: 1. Conditionally, as this is offered to us in the gospel, on the condition of repentance and faith. 2. Dispositively, etc. 3. Judicatively and ostensively, etc. Far be it from us therefore to make that remission with the Papists to be an effect properly so called of repentance; when that is due only to God’s grace by Christ, etc. But it’s partly a necessary consequent adjunct of it, in as much as under that condition, as also of new obedience (though not for it), remission of sins is propounded and offered to us, seeing it is inconvenient to remit sin to him that perseveres in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collegium theologicum</cite>, ... (1649) trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 407-8 | locus 13, p. 337</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The necessity of repentance, as a means, we here also acknowledge, seeing that to the impenitent there can be neither salvation nor remission of sin, etc. Remission of sin belongs to it, neither formally, nor meritoriously, nor satisfactorily, but at most: 1. Conditionally, as this is offered to us in the gospel, on the condition of repentance and faith. 2. Dispositively, etc. 3. Judicatively and ostensively, etc. Far be it from us therefore to make that remission with the Papists to be an effect properly so called of repentance; when that is due only to God’s grace by Christ, etc. But it’s partly a necessary consequent adjunct of it, in as much as under that condition, as also of new obedience (though not for it), remission of sins is propounded and offered to us, seeing it is inconvenient to remit sin to him that perseveres in sin.”

</figure><figure class="quote" id="q-ddc852ad7f" data-kw="">
<blockquote><p>Doctrine: Sound knowledge and belief joined with sovereign fear and love, and both these crowned with sincere repentance and obedience, guided by the light and line of true religion, is the only way to true happiness. They are all of them in their places of absolute necessity, and without any one of them a man cannot attain to that happiness that we aim at, etc. 2. All these are required absolutely; take them divisively, by themselves, etc. Knowledge and faith are necessary as the very foundation and groundwork of the whole building; repentance and obedience, they are necessary too, as the very issue and product of all, as the evident demonstration of the other. Love and fear, those holy affections of the soul, they are necessary too as the very vital things, wherein I conceive grace does principally consist, etc. But yet if we speak comparatively, which of all these were the most necessary, and wherein lies the principality of these; I conceive in this former respect every one of them may claim a principality, and go for a principal. But yet simply and absolutely the most characteristical of all these is the qualification of the heart and soul, the changing and turning of the affections, when the bias of them is set Godward and heavenward, there lies the principal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-stoughton.html">John Stoughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 397-98 Stoughton (1593?–1639) | Sermon 7, p. 51</span></figcaption>

</figure><figure class="quote" id="q-f19f85dc6a" data-kw="">
<blockquote><p>It is asked whether a reward is promised to works as signs of faith. We judge that those say too much who think it is promised to works as a meritorious cause; nor do we think they say enough who suppose the promise is made only to them as signs of faith. For there are many passages of Scripture by which it is plainly established that our works, in the matter of salvation, are regarded as a cause without which not, or as a preceding condition, which has the reward of eternal life inseparably connected with it (Mt. 25:34; Rev. 7:14, etc.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam. | Thesis 10, p. 79</span></figcaption>

</figure><figure class="quote" id="q-71b550412f" data-kw="">
<blockquote><p>We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.</p></blockquote>

— Gerhard J. Vossius, Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam., p. 76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+conclude+that+Holy+Scripture+does+not+speak+of+a+reward+such+as+is+owed%2C+by+a+right+of+hire%2C+on+account+of+worthiness+corresponding+to+the+reward%3B+but+rather+of+that+which+is+conferred+not+upon+the+idle+but+upon+those+who+labor%2C+by+virtue+of+covenant+and+of+a+gratuitous+promise.+Hence+it+is+elsewhere+also+called+an+inheritance.+Nor+ought+the+name+%E2%80%9Cinheritance%E2%80%9D+to+be+thought+to+prevent+its+being+called+a+%E2%80%9Creward%E2%80%9D%3B+for+even+to+an+adopted+son%2C+who+has+diligently+obeyed+his+adopter+and+endured+many+things+for+his+sake%2C+the+inheritance+comes+by+filial+right%2C+and+yet%2C+in+respect+of+the+works+he+has+performed+and+the+afflictions+he+has+undergone%2C+it+may+be+called+a+reward.%E2%80%9D%0A%0A%E2%80%94+Gerhard+J.+Vossius%2C+Theses+on+the+Merit+of+Good+Works+as+the+Latin+is+in+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%2C+%E2%80%A6+%28London%3A+1655%29%2C+ch.+3%2C+pp.+375-76%2C+trans.+ChatGPT-5+Vossius+%281577-1649%29+was+an+Arminian+professor+of+history+and+politics+at+Amsterdam.%2C+p.+76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71b550412f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71b550412f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20conclude%20that%20Holy%20Scripture%20does,it%20may%20be%20called%20a%20reward&amp;text=We%20conclude%20that%20Holy%20Scripture%20does%20not%20speak&amp;text=has%20undergone%2C%20it%20may%20be%20called%20a%20reward" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ce0902a683" data-kw="">
<blockquote><p>Finally, if in all adults (works) have the character of a way, a means, a condition, a cause without which not [sine qua non], or a necessary antecedent to blessedness, how shall they not be necessary to salvation?</p></blockquote>

</figure><figure class="quote" id="q-62e8cd8c1d" data-kw="">
<blockquote><p>Question: But why is God pleased to promise to give unto his people in Covenant spiritual blessings as well as temporal? … …Spiritual blessings are necessary for them in relation unto that eternal life… Heb. 12:13… Lo, here is a necessity of holiness and regenertion for salvation, and they are congruous, and fitting us for salvation, or eternal life… It is meet to enjoy grace before we come to enjoy glory; it is meet to have a conformity to Christ on his cross before we come to have a conformity to Christ in his crown, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant</cite>, ... (London, 1660), Part 2, ch. 1, p. 337</span></figcaption>

</figure><figure class="quote" id="q-94fef87e96" data-kw="">
<blockquote><p>But are not works required in the covenant of grace? Yes. “This is a faithful saying, that those who believe in God, should be careful to maintain good works.” But the covenant of grace does not require works in the same manner as the covenant of works did. In the first covenant, works were required as the condition of life; in the second covenant, they are required only as the signs of life. In the first covenant, works were required as grounds of salvation; in the new covenant, they are required as evidences of our love to God. In the first covenant, they were required to the justification of our persons; in the new covenant, to the manifestation of our grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, Question 20, ‘Of the Covenant of Grace’, p. 106 in The Select Works of the Rev. Thomas Watson… (New York, 1855) See also Question 22, ‘Of the Covenant of Works’, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“But are not works required in the covenant of grace? Yes. “This is a faithful saying, that those who believe in God, should be careful to maintain good works.” But the covenant of grace does not require works in the same manner as the covenant of works did. In the first covenant, works were required as the condition of life; in the second covenant, they are required only as the signs of life. In the first covenant, works were required as grounds of salvation; in the new covenant, they are required as evidences of our love to God. In the first covenant, they were required to the justification of our persons; in the new covenant, to the manifestation of our grace.”

</figure><figure class="quote" id="q-e8bda638ce" data-kw="">
<blockquote><p>And, therefore, I take it for granted, that obedience is required under the Covenant of Grace as strictly as ever it was under the Covenant of Works; and required, not only to show our gratitude and thankfulness, but necessarily and indispensably in order to the obtaining of heaven and eternal life.</p></blockquote>

<blockquote><p>14. Christians having sorrow or serious regret for sin in them, and being in earnest conflict with the law in their members, with the lusts, and irregular passions, and inordinate affections of the flesh, their way of walking cannot (as to their ordinary and habitual course) be after the flesh; nor can they be the slaves of sin; but being made free from sin, and become servants to God ([Rom.] ch. 6:22), they walk after the Spirit, have their fruit unto holiness (which is the necessary and certain characteristic of the true Christian), and the end everlasting life; to which end and final issue holiness is indispensably necessary–though, however necessary, yet eternal life is not proper wages which men win by their holiness, but is the gift of God through Jesus Christ.</p></blockquote>

<blockquote><p>Good works are essentially prerequisite to an admission into heaven. Though they do not merit everlasting life, yet they are indispensably necessary in all who are ‘heirs of the grace of life.’ Believers, ‘being made free from sin, have their fruit unto holiness, and the end everlasting life.’ – Rom. 6:22</p></blockquote>

</figure><figure class="quote" id="q-868d1869e5" data-kw="">
<blockquote><p>When the doctrine of the Reformers began to be abused by the Antinomians, the Puritans were raised up, in the good providence of God, to give the same prominence to Sanctification as Luther had given to Justification; to insist as as strenuously on the the work of the Spirit in applying salvation as he had done on the work of Christ in procuring it: for though both doctrines were taught at an earlier period… it was reserved for their successors, when controversy arose, to expound them more fully in their necessary connection and mutual relations. Such writers as Owen, and Goodwin, and Charnock, and Howe, and Trail adhered firmly to the doctrine of Justification as proclaimed by Luther and Calvin, while they checked every tendency to Antinomian licence by the firm assertion of the indispensable necessity of personal holiness as one of the essential parts of the great salvation… Considered as fruits of our sanctification, and as evidences of our ‘MEETNESS for the inheritance of the saints in light,’ they cannot be too highly commended; but considered as the ground of our Justification, or as forming any part of our TITLE to that inheritance, they are to be utterly rejected, and treated as ‘dung’ and ‘filthy rags’ with reference to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture.(Edinburgh: T&amp;T Clark</cite>, (Grand Rapids: Baker, 1955), pp. 363-64</span></figcaption>

<blockquote><p>(6) They [good works] are necessary to the attainment of salvation, not in any sense as a prerequisite to justification, nor in any stage of the believer’s progress meriting the divine favor, but as essential elements of that salvation, the consubstantial fruits and means of sanctification and glorification. A saved soul is a holy soul, and a holy soul is one whose faculties are all engaged in works of loving obedience. Grace in the heart cannot exist without good works as their consequent. Good works cannot exist without the increase of the graces which are exercised in them. Heaven could not exist except as a society of holy souls mutually obeying the law of love in all the good works that law requires. Eph. v. 25 — 27; 1 Thess. iv. 6, 7; Rev. xxi. 27.</p></blockquote>

</figure><figure class="quote" id="q-3889c8ecc7" data-kw="">
<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons</cite>, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-da08aaf6da" data-kw="">
<blockquote><p>Many things are necessary to us either as causes, or as conditions, or as means, as instruments, as helps, as props, by which we may be brought to eternal life: by which either the bars and impediments may be taken away, which block up to us the way and passage to eternal life, or the necessary stairs are laid under, for our ascending to the height of that sublimity; or else necessary strength is afforded us to go that hard journey, and bear that hard conflict; or that the strength and force of our enemies may be broken and foiled. We have need of knowledge, constancy, charity, sanctity, prayers, good works, etc. But above all these we must seek faith as a certain epitome and compendium of them all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 4, vv. 12-13, p. 521 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 410</span></figcaption>

</figure><figure class="quote" id="q-286f8950c6" data-kw="">
<blockquote><p>Hence it is plain, that a certain sure way is laid down to the kingdom of heaven by God himself, and that the same is a narrow way, namely, that of virtue and holiness: not the broad way of iniquity and lust. As therefore, if there is a certain, only, and prescribed way, which leads to any city, it is necessary to all who wish to enter that city, to take this way; so, since by the Divine appointment the way of good works leads to the goal of eternal glory, he must inevitably enter upon and hold this way, who desires to arrive thither,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification</cite>, 1:302-3, on Mt., 7:14</span></figcaption>

<blockquote><p>Some of the passages show the quality or condition required of those who are promised eternal life (Heb. 10:36, etc.). Other passages show the mark and way of faith whereby one reaches eternal life (as in Mt. 25:35; James 1:25 and 2:14). And other places point out the fruit and effect of the salvation that has begun and that consists in the forgiveness of sins (as in Lk. 7:47, etc.).</p></blockquote>

</figure><figure class="quote" id="q-2ab5bb4321" data-kw="">
<blockquote><p>In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, Faith is required as the instrumental cause of Remission and Salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness.</p></blockquote>

<blockquote><p>‘Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.’ And lest we should think the commands are all but one only precept of believing, he addeth “for without are dogs and sorcerers, and whoremongers, and murderers, etc.” “He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest myself to him.</p></blockquote>

</figure><figure class="quote" id="q-5b1c9b4acd" data-kw="">
<blockquote><p>…but certainly the way of holiness is the good old way, Jer. 6:16; it is the King of kings’ highway to heaven and happiness: Isa. 35:8, ‘And a highway shall be there, and a way, and it shall be called, The Way of Holiness; the unclean shall not pass over it;</p></blockquote>

</figure><figure class="quote" id="q-4689b0b30b" data-kw="">
<blockquote><p>So a holy person rejoiceth that the way of holiness is the appointed way to Heaven… he delights in the Gospel-constitution, because it requires universal holiness… This is solid rational religion, fit to be depended upon, in opposition to the antinomian licentiousness, the freaks of enthusiasm, and the irrational flights of passion and imagination on the one hand; and in opposition to formality, mere morality, and the self-sprung religion of nature on the other… Men are naturally averse to this Gospel method of salvation… they will endeavor to widen the way to Heaven, and persuade themselves they shall attain it, notwithstanding their continuance in some known iniquity, and though their hearts have never been thoroughly sanctified… How many give up their hopes of Heaven rather than part with sin… and must not such degenerate creatures be renewed ere they can be holy, or see the Lord!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, (Philadelphia, 1864), vol. 1, Sermon 9, ‘The Connection Between Present Holiness and Future Felicity’, on Heb. 12:14, pp. 277-78</span></figcaption>

<blockquote><p>5. Good works are no less necessary as they are our walking in the way which leads to heaven. Jesus Christ is the way (John 14:6). Faith and holiness are our walking in Him as the way. This way, accordingly, is called “the way of holiness,” or “the holy way” (Isaiah 35:8), inasmuch as none can walk in Christ other than by faith, and by that holiness of heart and life which is “the obedience of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 327 of Section 2, ‘Of the Necessity of Good Works’ in ch. 12, ‘Of the Nature, Necessity &amp; Desert of Good Works’, in A Treatise on the Law and the Gospel (Edinburgh, 1819)</span></figcaption>

</figure><figure class="quote" id="q-a5de6d2b83" data-kw="">
<blockquote><p>Moreover, when Scripture intimates that the good works of believers are causes why the Lord does them good, we must still understand the meaning so as to hold unshaken what has previously been said—viz. that the efficient cause of our salvation is placed in the love of God the Father; the material cause in the obedience of the Son; the instrumental cause in the illumination of the Spirit, that is, in faith; and the final cause in the praise of the divine goodness. In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30); he makes the prior grace to be a kind of cause, because it is a kind of step to that which follows. But whenever the true cause is to be assigned, he enjoins us not to take refuge in works, but to keep our thoughts entirely fixed on the mercy of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, Book 3, ch. 14, section 21 tr. Beveridge</span></figcaption>

</figure><figure class="quote" id="q-cff6cf681d" data-kw="">
<blockquote><p>Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>

<blockquote><p>Upon believing, or with believing (I shall explain it by and by) the whole right of salvation is given us; but all the holiness and works we have do not serve for the right, but only we are led through them to the possession of it. You have it said in 2 Thess. 2:13 that we are saved through faith and sanctification. But the Apostle here [in Eph. 2:8-10] orders them, how through faith, and how through sanctification. He speaks in common of both there; here, so through faith as not through sanctification. ‘Not of works,’ saith he. How shall we solve that? This is the clear distinction of it. We are saved through faith, as that which gives us the present right, or that which God doth then give as a judge, when we believe, before faith hath done a whit of work else; but we are led through sanctification and good works to the possession of salvation. Distinguish the right and the possession, and you have clearly the Apostle’s meaning; for, saith he, ‘he hath ordained good works, that we should walk in them,’ as being already ‘saved through faith,’ which he speaks before that.</p></blockquote>

<blockquote><p>Assertion 4. Nothing keeps us from calling good works an inferior cause of the actual possession of eternal life. Thus says our Calvin Institutes, book 3, ch. 14, section 21. ‘In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation: Negatum Est</cite>, [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-24a4706bdb" data-kw="">
<blockquote><p>From this come three periods of justification that should be diligently observed here, namely 1: The period of establishment, by which man is first justified: in this occasion not only is efficacy of works excluded for acquiring justification, but so is the very presence of these works in so far as God justifies the sinner and the wicked. 2: The period of continuation: in this occasion, although no efficacy of good works is granted for justification, the presence of these same works, nevertheless, is required. And it is probably in this sense that James denies that we are justified by faith along but he requires works in addition. And lastly 3: The period of consummation in which the right unto eternal life, granted under the first period and continued under the second, is advanced even to the possession of eternal life: in this occasion not only is the presence of good works required, but also, in a certain sense, their efficacy, in so far as God, whose law we attain just now through the merit alone of Christ, does not want to grant possession of eternal life, unless [it is] beyond faith with good works previously performed. We received once before the right unto eternal life through the merit of Christ alone. But God does not want to grant possession of eternal life, unless there are, next to faith, also good works which precede this possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in Mark Jones, Antinomianism: Reformed Theology’s Unwelcome Guest</cite>, (P&amp;R, 2013)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>II. There are three principal opinions about the necessity of good works…; The third is that of those who (holding the middle ground between these two extremes) neither simply deny, nor simply assert; yet they recognize a certain necessity for them against the Libertines, but uniformly reject the necessity of merit against the Romanists. This is the opinion of the orthodox. III. Hence it is evident that the question here does not concern the necessity of merit, causality, and efficiency—whether good works are necessary to effect salvation or to acquire it by right. (For this belongs to another controversy, of which hereafter). Rather the question concerns the necessity of means, of presence and of connection or order—Are they required as the means and way for possessing salvation? This we hold. IV. Although the proposition concerning the necessity of good works to salvation (which was thrust forward in a former century by the Romanists under the show of a reconciliation in the Intermistic formula, but really that imperceptibly the purity of the doctrine concerning justification might be corrupted) was rejected by various Lutheran theologians as less suitable and dangerous; nay, even by some of our theologians; still we think with others that it can be retained without danger if properly explained. We also hold that it should be pressed against the license of the Epicureans so that although works may be said to contribute nothing to the acquisition of our salvation, still they should be considered necessary to the obtainment of it, so that no one can be saved without them–that thus our religion may be freed from those most foul calumnies everywhere cast mot unjustly upon it by the Romanists (as if it were the mistress of impiety and the cushion of carnal licentiousness and security)… VII. And as to the covenant, everyone knows that it consists of two parts: on the one hand the promise on the part of God; on the other the stipulation of obedience on the part of man…</p></blockquote>

<blockquote><p>We must accurately distinguish between a right to life, and the possession of life. The former must so be assigned to the obedience of Christ, that all the value of our holiness may be entirely excluded. But certainly our works, or rather these, which the Spirit of Christ worketh in us, and by us, contribute something to the latter… III. 1st, Scripture teacheth that man must do something, that he may obtain the possession of the salvation purchased by Christ. “Labour, (said he) for the meat which endureth unto everlasting life,” which indeed he interprets afterwards of faith, but so, that there he plainly reduces it to the catalogue of works; for justification is not the subject, John 6:27-29. And Paul expressly says, “Work out your own salvation with fear and trembling,” Phil. 2:12. And again, “Therefore my beloved brethren, be ye stedfast, immoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.” 1 Cor. 15:58 IV. Neither because Christ is the way to life, is the practice of Christian piety therefore not the way to life. Christ is the way to life, because he purchased us a right to life. The practice of Christian piety is the way to life, because thereby we go to the possession of the right obtained by Christ. For it is more than a hundred times designed by the name of life: again the way of righteousness, the good way, the way of peace; yea, that nothing might be wanting, it is called the way of life and salvation. Prov. 6:23, “The commandment is a lamp, and the law is light, and reproofs of instruction are the way of life.” And 10:17, “He is in the way unto life who keepeth instruction.” 15:24, “The way of life is above to the wise.” Ps. 50:23, “Whoso ordereth his way, I will cause him to enjoy the salvation of God.” And what does Christ himself understand by that narrow way which leadeth unto life, Mt. 7:14, but the strict practice of Christian religion? which is called the way of salvation, Acts 16:17.</p></blockquote>

</figure><figure class="quote" id="q-d21cecd958" data-kw="">
<blockquote><p>But of course good works are necessary as the God-appointed road, on which by grace we are to attain to the possession of eternal life. This naturally can hold not for those elect who die at an age of minority or at the beginning of their rebirth, but only for those who have time and opportunity for good works.</p></blockquote>

<blockquote><p>…Good works are necessary to salvation, not as a cause to an effect, or as if they merited a reward, but as a part of salvation itself, or as an antecedent to a consequent, or as a means without which we cannot obtain the end. In the same way we may also say, that good works are necessary to righteousness or justification, or in them that are to be justified, viz.: as a consequence of justification, with which regeneration is inseparably connected…. We may more safely and correctly say, That good works are necessary in them that are justified, and that are to be saved…. Augustine has correctly said: Good works do not precede them that are to be justified, but follow them that are justified.</p></blockquote>

<blockquote><p>just as the other acts signified under faith, as it were materially and by synecdoche, are not of themselves and directly ordered to the properly effecting of friendship with God and salvation, but either to faith (to which they in some way contribute), or at least to the not-losing of friendship with God or salvation; so neither do they properly and directly justify or save. They are useful, however, insofar as by them we exclude and avoid sins and ingratitude, which would altogether be the true cause of losing righteousness and salvation—such a cause as they are accustomed to refer to as a removing or prohibiting cause, and among causes per accidens.</p></blockquote>

</figure><figure class="quote" id="q-3eddfe8052" data-kw="">
<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, trans. AI (1634), p. 9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.”

— Joshua Placeus, ‘Theological Theses on the Justification of Man before God’, trans. AI (1634), p. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXL.+Are+good+works+therefore+unnecessary+for+our+justification%3F+To+become+righteous+from+being+guilty+and+liable+to+punishment%E2%80%94that+is%2C+to+receive+the+abundance+of+grace+and+the+gift+of+righteousness%E2%80%94they+are+not+necessary+as+antecedents.+But+they+are+absolutely+necessary+as+consequences.+They+are+the+fruits+and+ends+of+justification%2C+from+which+justification+ought+not+and+cannot+be+separated.+For+in+the+New+Covenant%2C+God+has+first+promised+us+the+forgiveness+of+sins%2C+and+then+sanctification.+Christ+has+been+made+for+us+not+only+righteousness%2C+but+also+sanctification.+Faith+embraces+both+promises%2C+and+draws+both+benefits+from+the+fullness+of+Christ%2C+into+whom+it+inserts+us.+Thus%2C+a+faith+that+does+not+produce+good+works+as+its+fruits+reveals+itself+not+to+be+true+faith+at+all%2C+but+a+rotten+corpse+of+faith%2C+which+mimics+the+outward+appearance+of+faith+but+has+no+power%2C+movement%2C+or+activity.+Therefore%2C+in+order+that+we+may+be+declared+righteous%2C+and+that+it+may+be+shown+%28whether+in+the+court+of+our+conscience+or+in+the+final+judgment%29+that+God+has+truly+granted+us+forgiveness+of+sins%2C+good+works+are+necessary+as+posterior+evidences%2C+as+they+say.+For+faith+is+known+by+its+works%2C+just+as+a+tree+is+known+by+its+fruits.+References%3A+Heb.+10%3A16%3B+2+Cor.+1%3A30%3B+Jm.+1%3A11.%E2%80%9D%0A%0A%E2%80%94+Joshua+Placeus%2C+%E2%80%98Theological+Theses+on+the+Justification+of+Man+before+God%E2%80%99%2C+trans.+AI+%281634%29%2C+p.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eddfe8052.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eddfe8052.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=XL.%20Are%20good%20works%20therefore%20unnecessary,10% <blockquote><p>3. Good works are necessary as a consequent that follows from its antecedent, not as an effect that follows from its cause. The Holy Spirit teaches this everywhere, because He denies that eternal life is attained by means of our good works. At the same time, He also teaches that it is impossible to see God without holiness, Heb. 12,14. 4. Eternal life will be given to those who are performing good works, but it is not given unto them because of their good works. This is evident from Mt 25,35, where it is said: ‘For I was hungry and you gave me food’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. van Asselt, Bell, Brink, Ferwerda – Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn) Ch. 16, ‘On Good Works’, p. 136</span></figcaption>

</figure><figure class="quote" id="q-8136242b39" data-kw="">
<blockquote><p>We acknowledge that obedience is required in a son before he come to possess his inheritance; yet that obedience, though antecedent to his possessing that inheritance, is only the way in which he is to come to it, and the means whereby he is to be fitted for it; but is not meritorious of it. There is no right to the inheritance acquired by his obedience which before he had not; though farther fitness for, and suitableness to, it there may be. The Israelites were to fight, and subdue their enemies, ere they possessed the promised land; but their right to the possession of it they had before by the promise. And who can say that they were worthy of it merely because they fought for it?</p></blockquote>

</figure><figure class="quote" id="q-d7f9c695a0" data-kw="">
<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>

<blockquote><p>for as much as final infidelity and impenitency are the meritorious causes of damnation; but faith, repentance and good works are but the disposing causes of salvation. Yet like as God inflicts not damnation but by way of punishment, so he doth not bestow salvation, on any of ripe years, but by way of reward. Yet here also is a difference; for damnation is inflicted by way of punishment for the evil works’ sake which are committed: but salvation is not conferred by way of reward for the good works’ sake which are performed, but merely for Christ’s sake.</p></blockquote>

</figure><figure class="quote" id="q-d62514d3a9" data-kw="">
<blockquote><p>Now this object of his [Paul’s] praying, and praising [in Col. 1:12], was not for their justification only, but verse 10, their walking worthy of the Lord unto all well-pleasing, being fruitful in every good work, verse 11, strengthened unto all patience. This was a part of their fitness, and that holy walking conferreth a fitness and disposition for salvation to me is clear, because no unclean thing can enter within the gates of that higher City, and because that love which we have here in our way, being the same in nature, though not in degree, with that which in our country shall remain, as a part of our garland, and crown, the one must be a fit disposition to the other; and when the apostle saith “Follow peace with all men, and holiness, without which no man shall see the Lord.”</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>(7.) Sanctification fits for heaven: ‘Who hath called us to glory and virtue.’ 2 Pet i 3. Glory is the throne, and sanctification is the step by which we ascend to it. As you first cleanse the vessel, and then pour in the wine; so God first cleanses us by sanctification, and then pours in the wine of glory. Solomon was first anointed with oil, and then was a king. 1 Kings i 39. First God anoints us with the holy oil of his Spirit, and then sets the crown of happiness upon our head. Pureness of heart and seeing God are linked together. Matt v 8.</p></blockquote>

<blockquote><p>None is in the way to heaven but he who, by a life of faith and the practice of those good works which are the fruits of faith, is advancing toward perfection of holiness. It is the order immutably fixed in the everlasting covenant that a man be made holy in heart and in life before he is admitted to see and enjoy God in His holy place on high. The love and practice of good works, then, in one who has an opportunity of performing them, are necessary as appointed means of disposing or preparing him for the holy enjoyments and employments of the heavenly sanctuary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 327 of Section 2, ‘Of the Necessity of Good Works’ in Ch. 12, ‘Of the Nature, Necessity and Desert of Good Works’, in A Treatise on the Law and the Gospel (Edinburgh, 1819)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

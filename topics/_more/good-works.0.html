<blockquote><p>VIII. New Obedience; Good Works New obedience is exercised through good works. Moreover, there are good works, voluntary actions of the sanctified, which come from a pure heart, love of God, true faith in Christ, according to the law of God, for His glory, one’s own salvation, and the usefulness of neighbor. For in order that a work be good, concursus of all causes is required. This includes its beginning which is the disposition of the will or the “treasure of a good heart” (Matt. 12:35), “a good tree” (Matt. 12:7, 17), a “pure heart” (1 Tim. 1:5), conformity with the law of God because those things “must be done” which “God commands” (Deut. 12:32), and also rectitude of circumstances because goods are necessary to be conducted well. Moreover, love of God is introduced because “love is the fulfillment of the law” (Rom. 13:10) and the root of good works (1 Cor. 13:4). Faith is also introduced because “whatever is not from faith is sin” (Rom. 14:23), and “love from faith is not feigned” (1 Tim. 1:5). The end is intention of right which the person who wills orders to the glory of God and salvation of neighbor, according to His Word. “If your eye is simple, the whole body will be lucid” (Matt. 6:22). But the good works noted in the latter are distinguished from the works of the unregenerate, Gentiles, and hypocrites. Moreover, the works exacted even of the regenerate for the rigor of the same bring forth their imperfection in this life, so that none can be found without adhering vice. (XXII–XXX). IX. The Necessity of Those Good works of adults and of those who can produce them are in a sense as necessary as sanctification itself. For although they do not justify, they are nevertheless fruits of justifying faith. They do not indeed serve the interests of meriting salvation, but taking possession of it. They are a consequence of the adjoined antecedent, faith. “Let your light so shine before men, that they may see your good works, and glorify your Father, who is in heaven” (Matt. 5:16). (XXX). X. They Do Not Effect or Merit Salvation Yet good works neither effect nor merit eternal life. For “eternal life” is “a gift of God” (Rom. 6:23), opposed “to debt” (ὀφειλήματι) (Rom. 4:4). Moreover, it depends on Christ alone and faith in Him (John 17:3, Acts 4:12), and it is given as “an inheritance” (Matt. 25:34, Rom. 8:17, Eph. 1:18). For all boasting must be excluded from salvation. “Where is boasting? It is excluded through the law of faith” (Rom. 3:27). But the one who merits can boast. Yet it is “not from works, lest anyone boast” (Eph. 2:9). Finally, works merit neither from condignity, nor from pact, nor from congruency. They do not merit from condignity because not even “our sufferings,” still less actions, “are worthy of the glory of God to be revealed in us” (Rom. 8:18), and we are debtors of doing those things for God by right of creation and redemption. God has no profit when “we render our ways perfect” (Job 22:2, 3), and “we are the workmanship of God, created in Christ Jesus for good works” (Eph. 2:10). They do not merit from pact because God nowhere promised life to one meriting it, and legal sin cannot be entered from pact. They do not merit from congruity because God promised the reward of merit not apart from perfect obedience, as from merit. (XXXI–XXXVII).</p></blockquote>

<blockquote><p>These fruits, when they are brought forth, God approveth of, accepteth, and further blesseth them that bear them; which is the last thing in the words. Some think there is no use of these fruits, unless they are meritorious of grace and glory. But God’s acceptation of them here is called his benediction, his blessing of them that bring them forth. Now a blessing cannot be merited; it is an act of bounty and authority, and hath the nature of a free gift, that cannot be deserved. What doth a field merit of him by whom it is watered and tilled, when it bringeth forth herbs meet for his use? they are all but the fruits of his own labour, cost, and pains. The field is only the subject that he hath wrought upon, and it is his own. All the fruits of our obedience are but the effects of his grace in us. We are a subject that he hath graciously been pleased to work upon. Only he is pleased, in a way of infinite condescension, to own in us what is his own, and to pardon what is ours. Wherefore the blessing of God on fruit-bearing believers consists in three things:—[1.] His approbation and gracious acceptance of them. So it is said that “he had respect unto Abel and to his offering,” Gen. 4:4. He graciously accepted both of his person and of his sacrifice, owning and approving of him, when Cain and his were rejected. So “he smelled a savour of rest” from the sacrifice of Noah, Gen. 8:21. And to testify his being well pleased therewith, he thence took occasion to renew and establish his covenant with him and his seed. [2.] It is by increasing their fruitfulness. “Every branch” in the vine “that beareth fruit, he purgeth it, that it may bring forth more fruit,” John 15:2. He “multiplieth the seed that is sown,” and “increaseth the fruits of their righteousness,” 2 Cor. 9:10. This is the constant way of God in his covenant-dealings with thriving, fruitful Christians; he so blesseth them as that their graces and fruits shall more and more abound, so as that they shall be flourishing even in old age, and bring forth more fruit unto the end. [3.] He blesseth them in the preparation he hath made for to give them an everlasting reward. A reward it is, indeed, of grace and bounty, but it is still a reward, “a recompence of reward.” For although it be no way merited or deserved, and although there be no proportion between our works, duties, or fruits, and it, yet, because they shall be owned in it, shall not be lost nor forgotten, and God therein testifies his acceptance of them, it is their reward.</p></blockquote>

<blockquote><p>Objection 4. Faith does not justify without that which is required in those who are justified. Good works are required in those who are justified. Therefore, faith is not without good works, and so does not justify alone. Answer: There is here the same fallacy to which reference has just been made, on account of the doubtful construction of the particle without. Faith does not, indeed, justify without those things which are required in those who are justified. But although it never exists alone, and is always joined with love, by which it works, yet it alone justifies—is the act of embracing and applying to itself the merits of Christ. The minor also must be more fully explained; for faith and good works are not required in the same sense in those who are justified. Faith, with its own peculiar act, (without which it cannot be considered) is required as the necessary instrument, by which we apply to ourselves the merits of Christ. Good works, on the other hand, are not required that by them we may apprehend the merits of Christ, much less that we may be justified on account of them; but that we may thereby prove our faith, which without good works is dead, and can only be known by their presence. Good works are required as the fruits of our faith, and as the evidences of our gratitude to God. That is not always necessary for the accomplishment of a certain result, which is necessarily connected with the cause of the same thing. So good works, although they are necessarily connected with faith, are nevertheless not necessary for the apprehension of the merits of Christ.</p></blockquote>

<blockquote><p>Q. 154 Therefore, you say that good works are necessary to salvation? A: If faith is necessary to salvation, and works necessarily flow out of true faith, (as that which cannot be idle), certainly also it follows, that good works are necessary to salvation, yet not as the cause of salvation (for we are justified, and thus live, by faith alone in Christ), but as something necessarily attached to true faith. Just as Paul says, they are God’s children, who are led by the Spirit of God; and John, that he is righteous who works righteousness; and James also, explaining not by what method we are justified, but, from whence true faith and justification are known, proves by the example of Abraham that they are not justified who demonstrate no works of faith. For in this way James is reconciled with Paul, so that it is plain that they are contentious who condemn the necessity of good works as a false doctrine.</p></blockquote>

— Theodore Beza, A Little Book of Christian Questions and Responses, ed. Dikran Y. Hadidian, trans. Kirk M. Summers, vol. 9, Princeton Theological Monograph Series (Eugene, OR: Pickwick Publications, 2009), 61.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+154+Therefore%2C+you+say+that+good+works+are+necessary+to+salvation%3F+A%3A+If+faith+is+necessary+to+salvation%2C+and+works+necessarily+flow+out+of+true+faith%2C+%28as+that+which+cannot+be+idle%29%2C+certainly+also+it+follows%2C+that+good+works+are+necessary+to+salvation%2C+yet+not+as+the+cause+of+salvation+%28for+we+are+justified%2C+and+thus+live%2C+by+faith+alone+in+Christ%29%2C+but+as+something+necessarily+attached+to+true+faith.+Just+as+Paul+says%2C+they+are+God%E2%80%99s+children%2C+who+are+led+by+the+Spirit+of+God%3B+and+John%2C+that+he+is+righteous+who+works+righteousness%3B+and+James+also%2C+explaining+not+by+what+method+we+are+justified%2C+but%2C+from+whence+true+faith+and+justification+are+known%2C+proves+by+the+example+of+Abraham+that+they+are+not+justified+who+demonstrate+no+works+of+faith.+For+in+this+way+James+is+reconciled+with+Paul%2C+so+that+it+is+plain+that+they+are+contentious+who+condemn+the+necessity+of+good+works+as+a+false+doctrine.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Little+Book+of+Christian+Questions+and+Responses%2C+ed.+Dikran+Y.+Hadidian%2C+trans.+Kirk+M.+Summers%2C+vol.+9%2C+Princeton+Theological+Monograph+Series+%28Eugene%2C+OR%3A+Pickwick+Publications%2C+2009%29%2C+61.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd87f55c427.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d87f55c427.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/04/beza-on-the-evidentiary-necessity-of-good-works-for-salvation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ea9846d89b" data-kw="">
<blockquote><p>3. THE NECESSITY OF GOOD WORKS. There can be no doubt about the necessity of good works properly understood. They cannot be regarded as necessary to merit salvation, nor as a means to retain a hold on salvation, nor even as the only way along which to proceed to eternal glory, for children enter salvation without having done any good works. The Bible does not teach that no one can be saved apart from good works. At the same time good works necessarily follow from the union of believers with Christ. “He that abideth in me and I in him, the same beareth much fruit,” John 15:5. They are also necessary as required by God, Rom. 7:4; 8:12, 13; Gal. 6:2, as the fruits of faith, Jas. 2:14, 17, 20–22. as expressions of gratitude, 1 Cor. 6:20 unto the assurance of faith, 2 Peter 1:5–10, and to the glory of God, John 15:8; 1 Cor. 10:31. The necessity of good works must be maintained over against the Antinomians, who claim that, since Christ not only bore the penalty of sin but, also met the positive demands of the law, the believer is free from the obligation to observe it, an error that is still with us to-day in some of the forms of dispensationalism. This is a thoroughly false position, for it is only the law as a system of penalty and as a method of salvation that is abolished in the death of Christ. The law as the standard of our moral life is a transcript of the holiness of God and is therefore of permanent validity also for the believer, though his attitude to the law has undergone a radical change. He has received the Spirit of God, which is the Spirit of obedience, so that, without any constraint, he willingly obeys the law. Strong sums it up well, when he says: Christ frees us “(1) from the law as a system of curse and penalty; this He does by bearing the curse and penalty Himself …; (2) from the law with its claims as a method of salvation; this He does by making His obedience and merits ours …; (3) from the law as an outward and foreign compulsion; this He does by giving us the spirit of obedience and sonship, by which the law is progressively realized within.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 543.</span></figcaption>

</figure><figure class="quote" id="q-530a83e50a" data-kw="">
<blockquote><p>Works will come into consideration as a manifestation of genuine saving faith. Work in the scriptural sense also means not just an external display but the expression of one’s life that flows out of the depth of the heart…. Scripture also speaks of reward for believers (“their works follow them,” Rev 14:13; Matt 5:12, 16; 6:1; Luke 6:23; Heb 10:34–38). This reward comes as compensation for the cross, as restitution for what was robbed, as recompense for love shown to the servants of the Lord, etc….</p></blockquote>

<blockquote><p>1. The first thing to know is that there are no good works except those works God has commanded, just as there is no sin except that which God has forbidden. Therefore, whoever wants to know what good works are as well as doing them needs to know nothing more than God’s commandments. Thus in Matthew 19[:17] Christ says, “If you would enter life, keep the commandments.” And when the young man in Matthew 19[:16–22] asks what he should do to inherit eternal life, Christ sets before him nothing else but the Ten Commandments. Accordingly, we have to learn to recognize good works from the commandments of God, and not from the appearance, size, or number of the works themselves, nor from the opinion of men or of human law or custom, as we see has happened and still happens because of our blindness and disregard of the divine commandments.</p></blockquote>

<blockquote><p>XV. Although we acknowledge the necessity of good works against the Epicureans, we do not on this account confound the law and the gospel and interfere with gratuitous justification by faith alone. Good works are required not for living according to the law, but because we live by the gospel; not as the causes on account of which life is given to us, but as effects which testify that life has been given to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 705. (17.3.15)</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 705. (17.3.15)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXV.+Although+we+acknowledge+the+necessity+of+good+works+against+the+Epicureans%2C+we+do+not+on+this+account+confound+the+law+and+the+gospel+and+interfere+with+gratuitous+justification+by+faith+alone.+Good+works+are+required+not+for+living+according+to+the+law%2C+but+because+we+live+by+the+gospel%3B+not+as+the+causes+on+account+of+which+life+is+given+to+us%2C+but+as+effects+which+testify+that+life+has+been+given+to+us.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+705.+%2817.3.15%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f7d5f0070.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f7d5f0070.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/turretin-we-do-good-works-because-we-live-by-the-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ad601a4a8b" data-kw="">
<blockquote><p>Disputing in his Panstrat. vol. iii. book xv. chap. iii. against Bellarmine, [Chamier] teaches that the true and determinate difference between the law of works and that of faith, is the condition of works and of faith; that is, that the law of works proposes salvation, upon condition of performing the law. But the law of faith proposes it, upon condition only of believing in Christ. Lest, however he should leave any thing unexplained, he observes, that conditions in contracts are of two kinds; some of which may be called antecedent, others consequent. He calls these antecedent, which give rise to the contract, according to the maxim, I give, that thou mayest give, as when one sells a field for a certain sum of money. But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only: so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete. This distinction that very learned divine applies to the present purpose, in the following manner: The law of works requires the fulfilling of the law as an antecedent condition, without which, not only no man can enter upon the possession of eternal life, but cannot so much as have a right to it. But the law of faith does not admit of works as a condition p 151 in this sense, but only in the other: viz. that by virtue of the life already given through faith, works are necessary, so that he who shows no works, falls from every right which he had, or rather seemed to have, on account of his external vocation; although otherwise, works are not the causes of the life to be given. Thus far Chamier: compare Tuckney in his Theological Prelections, p. 233.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain, trans. Thomas Bell (Glasgow: W. Lang, 1807), 149–51.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDisputing+in+his+Panstrat.+vol.+iii.+book+xv.+chap.+iii.+against+Bellarmine%2C+%5BChamier%5D+teaches+that+the+true+and+determinate+difference+between+the+law+of+works+and+that+of+faith%2C+is+the+condition+of+works+and+of+faith%3B+that+is%2C+that+the+law+of+works+proposes+salvation%2C+upon+condition+of+performing+the+law.+But+the+law+of+faith+proposes+it%2C+upon+condition+only+of+believing+in+Christ.+Lest%2C+however+he+should+leave+any+thing+unexplained%2C+he+observes%2C+that+conditions+in+contracts+are+of+two+kinds%3B+some+of+which+may+be+called+antecedent%2C+others+consequent.+He+calls+these+antecedent%2C+which+give+rise+to+the+contract%2C+according+to+the+maxim%2C+I+give%2C+that+thou+mayest+give%2C+as+when+one+sells+a+field+for+a+certain+sum+of+money.+But+the+consequent+conditions+are+added+to+the+antecedent%2C+as+following+from+them%3A+which+indeed+are+mutual+between+the+parties%2C+but+oblige+the+one+only%3A+so+that+the+other+is+bound+to+do+no+more+on+their+account%3A+As+if+one+having+given+or+sold+a+plot+of+ground%2C+should+assign+an+annuity+to+be+laid+out+upon+the+poor.+Now+conditions+of+that+kind%2C+when+not+performed%2C+usually+disannul+the+contract%3A+and+yet+they+do+not+constitute+it.+Nay%2C+there+would+be+no+annuity%2C+except+the+sale+were+already+full+and+complete.+This+distinction+that+very+learned+divine+applies+to+the+present+purpose%2C+in+the+following+manner%3A+The+law+of+works+requires+the+fulfilling+of+the+law+as+an+antecedent+condition%2C+without+which%2C+not+only+no+man+can+enter+upon+the+possession+of+eternal+life%2C+but+cannot+so+much+as+have+a+right+to+it.+But+the+law+of+faith+does+not+admit+of+works+as+a+condition+p+151+in+this+sense%2C+but+only+in+the+other%3A+viz.+that+by+virtue+of+the+life+already+given+through+faith%2C+works+are+necessary%2C+so+that+he+who+shows+no+works%2C+falls+from+every+right+which+he+had%2C+or+rather+seemed+to+have%2C+on+account+of+his+external+vocation%3B+although+otherwise%2C+works+are+not+the+causes+of+the+life+to+be+given.+Thus+far+Chamier%3A+compare+Tuckney+in+his+Theological+Prelections%2C+p.+233.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Conciliatory+or+Irenical+Animadversions+on+the+Controversies+Agitated+in+Britain%2C+trans.+Thomas+Bell+%28Glasgow%3A+W.+Lang%2C+1807%29%2C+149%E2%80%9351.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fad601a4a8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ad601a4a8b.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/09/witsius-law-works-law-faith-antecedent-consequent-conditions/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>God requires humiliation indeed afore, because men will not believe else; and he requires obedience after, as that which necessarily follows upon faith, so as a man cannot truly believe but it will follow, as heat follows light. Yet, upon believing, the bargain is struck up; and though faith be the great instrument, yet we say withal, that works are necessary to be in the person justified, yet not to justify. Thus heat is as necessarily in the sun as light; yet it makes not day by its heat, but by its light. Works of new obedience are required as necessary to the possession of salvation, but faith is that alone which puts us into a condition of having the title and right to it, by the blood and righteousness of Christ. Obedience is necessarily required in all that are made sons, and so cry, ‘Abba, Father;’ for if he be a father, where is his honour? But it is faith alone that makes us sons, Gal. 3:26. And though we are as necessarily ordained to sanctification, as to faith and to salvation through both, 2 Thes. 2:13, by which, as the necessary way, we come and are brought to salvation as the goal, yet it is by faith alone that we are put into that estate: Eph. 2:8, 9, ‘By grace ye are saved through faith, and that not of works,’ etc. Then might some say, works are not required; yes, says the apostle, as a necessary means you are ordained to come to salvation by, which is the end of your faith, and which are a necessary condition of that estate, though faith alone puts us into it; for he adds, ver. 10, ‘We are his workmanship, created to good works, which God hath ordained we should walk in.’ They are the condition of the subject that shall be saved, who must be made meet, not the condition of the promise of salvation itself. They are the condition of faith, or of the person believing; but as sight is that which saves us in heaven, by which we have all our happiness communicated to us, so is it faith that saves us here.</p></blockquote>

<blockquote><p>I. Just as the passion of Christ it Is necessary for the expiation of sin, so his active obedience and righteousness are necessary for the gaining of eternal life. The reasons are: (1) The law binds us both to punishment and to obedience. To punishment, because it places a curse on anyone who does not perform all the words of the law (Deut 27:6). To obedience because it promises life only to those who keep it completely (Lev. 18:5: “Whosever does these things shall live by them”; Lk 10:28: “Do this and live”). The distinction between legal and evangelical righteousness does not invalidate the statement, for the gospel, in Christ, exhibits the same righteousness that the law demands. (2) This twofold satisfaction corresponds to our twofold misery; namely, the guilt of sin and damnation, and the absence of righteousness (Rom. 3:23; “All have sinned and fall short of the glory of God”). (3) Righteousness, in the true and accurate meaning of the word, consists of actual obedience (Deut. 6:25; “it will be righteousness for us, if we observe these precepts in their entirety before Jehovah”). (4) Christ fulfilled this actual obedience either for himself or in our place [nostro loco]. But it was not for himself; Therefore, it was in our place. This is evident from Christ’s relation to us. Whatever he was or did in the course of his complete obedience, he was an did in our place. [Some theologians] object to this statement on the ground that only Christ’s passive obedience contributes to satisfaction and merit. They grant that the active obedience has a place in our redemption and salvation, but only as something required [of Christ] and necessary for his work. It was required for two reasons: the law of creation, and the need for his sacrifice to be acceptable to God and for him to be a holy priest. The first element in this conception is false because at this point Christ is not to be compared to other men, life, just as the Son of God was made a creature not for his sake but for ours, So also he was subjected to the law not for his own sake but for ours. The second element in the above conception confuses holiness or innocence with obedience or actual righteousness, which differ no less than do privation [privatio] and [positive] disposition [habitus]. Innocence is indeed a necessary condition for Christ sacrifice, but actual obedience is not only a necessary condition of the Christ as priest, but also a part of his satisfaction and marriage. If the actual disobedience of Adam is a cause of meriting damnation, why is not the actual obedience of the second Adam a cause of meriting salvation? The conclusion that we reject would only be possible if we were willing to say that the first Adam is more important for our damnation than is the second for our salvation. II. The commandment of the Father, which Christ obeyed, was both special and general. It was special with respect to its purpose, in that he obeyed not for himself but for us. It was general with respect to the object: he was subject to the same law which was prescribed for us, and in all those matters to which the law bound us. Those who teach that only the passive obedience of Christ has merit, maintained that his obedience was only to a special commandment of the Father to die for us. However, this was not a special commandment, but part of the commandment; in fact the obedience of Christ extends to all the requirements of the law. Therefore, since the law bound us to both punishment and obedience he satisfied each of its requirements.</p></blockquote>

<blockquote><p>The Testament is no Testament, nor valid in Law, except the Testatator be dead. No man can sue by Law tested goods, if the Testator himself be living. Nor can we have right to a new heart, forgiveness, perseverance, eternal life, to grace and glory, except Christ our Testator had died. But because the Tested goods are more then goods left to us in Testament; they are left to us by such a Testament as is both a Testament and a death perfectly meritorious (this is superadded to the nature of a Testament, and beyond all Testaments) yea a death which is a price to ransom us from the wrath to come; Therefore Christ so dying in our stead, of justice meriteth that the friends should have these goods, though they belong by mere grace and free promise, to the friends. Now this is a most clear ground: Christ hath a well purchased right, by giving a condign price for the goods, and blessings promised in the Covenant of Grace to us: This right he hath by paying a price, laying down his life for us. This buying is not by necessity of nature, of justice but by a voluntary, free and uncompessed agreement and Covenant, John 10. 18. Isaiah 53. 6. No man can exact upon him Psal. 89. 22. (2.) If the Old Testament was confirmed by the blood of beasts, then must the New Testament be confirmed by the blood of Christ prefigured in these. But the Old Testament was so confirmed, Heb. 9. v. 18, 19 20 21, 22, [23.] Ergo now neither Testament nor Covenant was confirmed by blood simply, but by the blood of a living creature slain. 3. Hence the making of a Covenant was by cutting a calf or a beast in twain, and passing between the parts thereof, Jer. 34. 18. and so they entered into a curse, Nehem. 10. 29. devoted themselves to destruction, wishing they might be cut in twain (which is a strange kind of death, Mat. 24. 51. if they should break the Covenant. Hence the Phrase of striking a Covenant. So the Romans slew a Sow: So the Romans and Albani made a Covenant, as Livius. A Herald or Officer at Arms slew the beast, and prayed a curse on the people of Rome, that they might the same way be stricken, if they should break the Covenant. Its like they had it from the Jews. So Christ died to ratify and confirm the Covenant, Exod. 24. 6. This is the blood of the Covenant. Now the Covenant hath no blood, this blood of slain beasts (for it is a figurative speech) is a sign confirming the Covenant that believers shall have remission of sins in that blood of Christ which is shaddowed forth by the blood of these beasts. So Christ the great Shepherd of the flock Heb. 10. 13. is said to be brought from the dead, ἐν αἵματι by the blood of the everlasting Covenant. Junius the Article is understood: Or as the Hebrew Phrase, ב is put for ἐν, as Calvin and Piscator. The question may be, How did God bring Christ again from the death by the blood of the everlasting Covenant, had the blood of Christ any influence to bring himself back from the dead? Or did he, by dying, merit his own resurrection? Ans. Some read the word thus, and shun the Question, The God of peace who brought again from the dead the great sheepherd of the sheep: Understanding, ὀντα, being the great sheepherd or feeder, by the blood of the everlasting Covenant. So Beza, who makes these words ἐν ἅιματι, to be referred to ποιμένα: So as Christs right to be Pastor is in, and by his blood and suffering. And the words, ἐν ἅιματι, so is not to be constructed with the particle, ἀναγαγὼν: But Beza confesseth, that he changed the situation of the words. But if Christ be made a Pastor and feeder of the sheep by the blood of the eternal Covenant: then is he called to be a Pastor by Covenant. And what influence hath his death in his Pastoral Office? Is it by way of merit? Or did Christ merit to himself? Hardly, if not curiously can we say that, though I nothing doubt but Christ gave perfect obedience as man to the Covenant of Works, and he did merit as man, iure operum [by the law of works], life eternal, the way that Adam should have merited life eternal, so he had never fallen….</p></blockquote>

<blockquote><p>As to the relation of good works to rewards, it may be observed—(1.) The word merit, in the strict sense of the term, means that common quality of all actions or services to which a reward is due in strict justice on account of their intrinsic value or worthiness. It is evident that, in this strict sense, no work of any creature can in itself merit any reward from God, because (a) all the faculties he possesses were originally granted and are continuously sustained by God, so that he is already so far in debt to God that he can never bring God in debt to him. (b.) Nothing the creature can do can be a just equivalent for the incomparable favour of God and its consequences. There is another sense of the word, however, in which it may be affirmed that if Adam had in his original probation yielded the obedience required, he would have “merited” the reward conditioned upon it, not because of the intrinsic value of that obedience, but because of the terms of the covenant which God had graciously condescended to form with him. By nature, the creature owed the Creator obedience, while the Creator owed the creature nothing. But by covenant the Creator voluntarily bound himself to owe the creature eternal life, upon the condition of perfect obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publication and Sabbath-School Work, 1869), 307–08.</span></figcaption>

<blockquote><p>The condition of the covenant of grace, so far as adults are concerned, is faith in Christ. That is, in order to partake of the benefits of this covenant we must receive the Lord Jesus Christ as the Son of God in whom and for whose sake its blessings are vouchsafed to the children of men. Until we thus believe we are aliens and strangers from the covenant of promise, without God and without Christ. We must acquiesce in this covenant, renouncing all other methods of salvation, and consenting to be saved on the terms which it proposes, before we are made partakers of its benefits. The word “condition,” however, is used in two senses. Sometimes it means the meritorious consideration on the ground of which certain benefits are bestowed. In this sense perfect obedience was the condition of the covenant originally made with Adam. Had he retained his integrity he would have merited the promised blessing. For to him that worketh the reward is not of grace but of debt. In the same sense the work of Christ is the condition of the covenant of redemption. It was the meritorious ground, laying a foundation in justice for the fulfillment of the promises made to Him by the Father. But in other cases, by condition we merely mean a sine qua non. A blessing may be promised on condition that it is asked for; or that there is a willingness to receive it. There is no merit in the asking or in the willingness, which is the ground of the gift. It remains a gratuitous favour; but it is, nevertheless, suspended upon the act of asking. It is in this last sense only that faith is the condition of the covenant of grace. There is no merit in believing. It is only the act of receiving a proffered favour. In either case the necessity is equally absolute. Without the work of Christ there would be no salvation; and without faith there is no salvation. He that believeth on the Son hath everlasting life. He that believeth not, shall not see life, but the wrath of God abideth on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.364–65.</span></figcaption>

— Charles Hodge, Systematic Theology, (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.364–65.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+condition+of+the+covenant+of+grace%2C+so+far+as+adults+are+concerned%2C+is+faith+in+Christ.+That+is%2C+in+order+to+partake+of+the+benefits+of+this+covenant+we+must+receive+the+Lord+Jesus+Christ+as+the+Son+of+God+in+whom+and+for+whose+sake+its+blessings+are+vouchsafed+to+the+children+of+men.+Until+we+thus+believe+we+are+aliens+and+strangers+from+the+covenant+of+promise%2C+without+God+and+without+Christ.+We+must+acquiesce+in+this+covenant%2C+renouncing+all+other+methods+of+salvation%2C+and+consenting+to+be+saved+on+the+terms+which+it+proposes%2C+before+we+are+made+partakers+of+its+benefits.+The+word+%E2%80%9Ccondition%2C%E2%80%9D+however%2C+is+used+in+two+senses.+Sometimes+it+means+the+meritorious+consideration+on+the+ground+of+which+certain+benefits+are+bestowed.+In+this+sense+perfect+obedience+was+the+condition+of+the+covenant+originally+made+with+Adam.+Had+he+retained+his+integrity+he+would+have+merited+the+promised+blessing.+For+to+him+that+worketh+the+reward+is+not+of+grace+but+of+debt.+In+the+same+sense+the+work+of+Christ+is+the+condition+of+the+covenant+of+redemption.+It+was+the+meritorious+ground%2C+laying+a+foundation+in+justice+for+the+fulfillment+of+the+promises+made+to+Him+by+the+Father.+But+in+other+cases%2C+by+condition+we+merely+mean+a+sine+qua+non.+A+blessing+may+be+promised+on+condition+that+it+is+asked+for%3B+or+that+there+is+a+willingness+to+receive+it.+There+is+no+merit+in+the+asking+or+in+the+willingness%2C+which+is+the+ground+of+the+gift.+It+remains+a+gratuitous+favour%3B+but+it+is%2C+nevertheless%2C+suspended+upon+the+act+of+asking.+It+is+in+this+last+sense+only+that+faith+is+the+condition+of+the+covenant+of+grace.+There+is+no+merit+in+believing.+It+is+only+the+act+of+receiving+a+proffered+favour.+In+either+case+the+necessity+is+equally+absolute.+Without+the+work+of <blockquote><p>9.3 The Covenant Of Works The covenant of works is the pact of God initiated with the uncorrupted Adam, as head of the whole human race, in which He stipulated from man perfect obedience to the law, promised eternal, heavenly life for the same obedience, but threatened eternal death for transgression, and in turn man promised perfect obedience to God who stipulated, which having furnished, he could expect eternal, heavenly life. Scripture testifies that such a covenant existed with Adam. “They…(like Adam) transgressed the covenant” (Hos. 6:7). And God established the sacrament of the same covenant, “the tree of life” (Gen. 2:9). (VII). 9.4. God And Adam Covenanted They were covenanted, God as the Creator, Law-giver, and Rewarder, and Adam as the first man, uncorrupt, and head of the human race. For Adam was the “one blood” in which the whole posterity lay hidden (Acts 17:26), and he was “the first Adam,” equally representing those to be born from his blood, and “the second Adam” represents the faithful; indeed, he is a “type of” the one “to come” (Rom. 5:14). And since the remaining words concern the whole human race, the human race cannot be secluded from the covenant initiated with him. (VIII). 9.10. The Promise Of Heavenly And Eternal Life The promise of the covenant of works was eternal and heavenly life. This sacrament of it, “the tree of life,” by all means true and…(eternal) (Gen. 2:9), sanctioned not only for animals, and the earthly blessings that he already possessed, in which there was no διαθήκη (covenant), but there was προσθήκη (an accession) to the covenant. And when Christ, fulfilling the law in our place, merited eternal and heavenly life for us, He obtained the fulfillment of the same law by merit for us. Indeed, God promised something more in the covenant of works than that of whom could be a sharer outside of that. And it was not other than the translation into heavenly Paradise. (XXIII–XXVI). 10.4. The Stipulation Of God And The Promise Of The Son In this singular pact God the Father demanded from the Son, as Mediator, vicarious obedience to the law for man the sinner, and the Son promised it in turn. “Behold, I come. In the scroll of the book it has been written about me, that I shall do Your will” (Ps. 40:8–9). “Where He placed His soul as sacrifice, He will see a seed” (Isa. 53:10). “This commandment I have received from the Father, that I may place My soul” (John 10:17, 18). “He was born from a woman, gενόμενος ὑπὸ νόμον (born under the law) (Gal. 4:4). Therefore, everywhere Christ comes in the name br[ ἐγτύου and παρακλήτου (of advocate, guarantor), by guaranteeing and promising for another, of the one who receives Him in his faith (Job 33:23, Jer. 30:21, Isa. 38:14, Heb. 7:22). This Sponsor is at the same time is called “Mediator” (1 Tim. 2:5, Heb. 8:6), “Testator” (Heb. 9:15, 16), “High Priest” (Heb. 7:26), “Vindicator” (Job 19:25, Heb 2:16), etc. (VII–XIV). 10.5. The Demand Of The Son The demand of the same Son follows the promise. For as God the Father demanded payment from the Son and promised inheritance for paying, so the Son by promising and furnishing it, acquired the right to claim an inheritance, church, people of His own possession. “Demand from Me, and I will give you the nations as Your inheritance, and the ends of the earth as Your possession” (Ps. 2:8). “Surely My judgment is before the Lord, and…(My works) are a price before My God” (Isa. 49:4). For the promise and obedience of the Son had reason of true merit, even from condignity, for which nothing could be lacking (XIV).</p></blockquote>

<blockquote><p>If Adam had remained upright and done everything which God required of him, he would indeed have merited his reward, but not condignly, as if either his own person or his works were equal in value to the reward. For no creature, no matter how perfect, can merit anything from God in that sense. […] Rather he would have merited ex pacto, according to the stipulation of the covenant—that is, according to God’s good pleasure.*</p></blockquote>

<blockquote><p>[399] But a great many Reformed theologians believed otherwise and answered the above question in the affirmative. In their opinion, the answer to Christ’s prayer (John 11:42; Heb. 5:7) and especially the entire state of exaltation from the resurrection to his coming again for judgment is a reward for the work that he accomplished as the Servant of the Lord in the days of his humiliation. And, given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10–12; Matt. 23:12; Luke 24:26; John 10:17; 17:4–5; Phil. 2:9; Heb. 2:10; 12:2). The preposition διο (therefore) in Philippians 2:9 refers not to the order and logic but specifically to the meritorious cause of the exaltation. Because Christ humbled himself so deeply, therefore God has so highly exalted him. Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9–10; 5:7–10; 10:12; 12:2). Christ himself was “sanctified” by suffering. This does not mean that he was consecrated to God or made morally perfect; it means “perfected, brought to full wisdom and maturity,” made τελειος, which consists in his now being crowned with honor and glory (2:9), being seated as high priest at the right hand of Majesty in the highest heaven (8:1), having attained the joy for which he endured the cross and despised the shame (12:2), and becoming the source of eternal salvation to all who obey him (5:9).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[399] But a great many Reformed theologians believed otherwise and answered the above question in the affirmative. In their opinion, the answer to Christ’s prayer (John 11:42; Heb. 5:7) and especially the entire state of exaltation from the resurrection to his coming again for judgment is a reward for the work that he accomplished as the Servant of the Lord in the days of his humiliation. And, given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10–12; Matt. 23:12; Luke 24:26; John 10:17; 17:4–5; Phil. 2:9; Heb. 2:10; 12:2). The preposition διο (therefore) in Philippians 2:9 refers not to the order and logic but specifically to the meritorious cause of the exaltation. Because Christ humbled himself so deeply, therefore God has so highly exalted him. Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9–10; 5:7–10; 10:12; 12:2). Christ himself was “sanctified” by suffering. This does not mean that he was consecrated to God or made morally perfect; it means “perfected, brought to full wisdom and maturity,” made τελειος, which consists in his now being crowned with honor and glory (2:9), being seated as high priest at the right hand of Majesty in the highest heaven (8:1), having attained the joy for which he endured the cross and despised the shame (12:2), and becoming the source of eternal salvation to all who obey him (5:9).”

<blockquote><p>Vs. 8, 9. These verses confirm the preceding declaration. The manifestation of the grace of God is the great end of redemption. This is plain, for salvation is entirely of grace. Ye are saved by grace; ye are saved by faith and not by works; and even faith is not of yourselves, it is the gift of God. We have then here a manifold assertion, affirmative and negative, of the gratuitous nature of salvation. It is not only said in general, ‘ye are saved by grace,’ but further that salvation is by faith, i. e. by simply receiving or apprehending the offered blessing. From the very nature of faith, as an act of assent and trust, it excludes the idea of merit. If by faith, it is of grace; if of works, it is of debt; as the apostle argues in Rom. 4:4, 5. Faith, therefore, is the mere causa apprehendens, the simple act of accepting, and not the ground on which salvation is bestowed. Not of works. The apostle says works, without qualification or limitation. It is not, therefore, ceremonial, as distinguished from good works; or legal, as distinguished from evangelical or gracious works; but works of all kinds as distinguished from faith, which are excluded. Salvation is in no sense, and in no degree, of works; for to him that worketh the reward is a matter of debt. But salvation is of grace and therefore not of works lest any man should boast. That the guilty should stand before God with self-complacency, and refer his salvation in any measure to his own merit, is so abhorrent to all right feeling that Paul assumes it (Rom. 4:2) as an intuitive truth, that no man can boast before God. And to all who have any proper sense of the heavens of God and of the evil of sin, it is an introduction and therefore a gratuitous salvation, a salvation which excludes with works all ground of boasting, is the only salvation suited to the relation of guilty men to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, (New York: Robert Carter and Brothers, 1858), 117–19.</span></figcaption>

<blockquote><p>16. For God so loved the world. Christ opens up the first cause, and, as it were, the source of our salvation, and he does so, that no doubt may remain; for our minds cannot find calm repose, until we arrive at the unmerited love of God. As the whole matter of our salvation must not be sought any where else than in Christ, so we must see whence Christ came to us, and why he was offered to be our Saviour. Both points are distinctly stated to us: namely, that faith in Christ brings life to all, and that Christ brought life, because the Heavenly Father loves the human race, and wishes that they should not perish. And this order ought to be carefully observed; for such is the wicked ambition which belongs to our nature, that when the question relates to the origin of our salvation, we quickly form diabolical imaginations about our own merits. Accordingly, we imagine that God is reconciled to us, because he has reckoned us worthy that he should look upon us. But Scripture everywhere extols his pure and unmingled mercy, which sets aside all merits.</p></blockquote>

<blockquote><p>XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who since he has been most fully satisfied for us and now intercedes for us in heaven, will then come as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works (Matt 25:31–40). The pious will not hear the publication of their sins, but the reward of their love and benevolence. (3) The gratuitous mercy of Christ does not wish our sins to be remembered anymore, but casts them behind it’s back. Now what God has once wish to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious, from which they ought to be free. For Christ will return for this end—that he may be glorious in his saints and be admired in all believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, question six.</span></figcaption>

</figure><figure class="quote" id="q-dcc5968ccd" data-kw="">
<blockquote><p>I do not want to pursue the individual testimonies that the stupid Sorbonnists of today have groundlessly torn from Scripture—whatever first came to hand—to fling at us. For some are so ridiculous that I could not mention them unless I wished to be justly accounted foolish. I shall terminate this matter after I have explained a statement of Christ’s, in which they take marvelous pleasure. For he answers the lawyer who asks him what is needed for salvation, “If you would enter into life, keep the commandments.” What more do we want, they ask, when we are bidden by the Author of grace to attain God’s Kingdom by observing the commandments? As if it were not evident that Christ did not accommodate his replies to those with whom he saw that he had to deal! Here a doctor of law asks about the manner of obtaining blessedness—and not simply that but by what deeds men may arrive at it. And the person of the speaker and the question itself prompted the Lord to answer thus. The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.9 (Battles edition)</span></figcaption>

andments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls.”

— John Calvin, Institutes of the Christian Religion, 3.18.9 (Battles edition)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+do+not+want+to+pursue+the+individual+testimonies+that+the+stupid+Sorbonnists+of+today+have+groundlessly+torn+from+Scripture%E2%80%94whatever+first+came+to+hand%E2%80%94to+fling+at+us.+For+some+are+so+ridiculous+that+I+could+not+mention+them+unless+I+wished+to+be+justly+accounted+foolish.+I+shall+terminate+this+matter+after+I+have+explained+a+statement+of+Christ%E2%80%99s%2C+in+which+they+take+marvelous+pleasure.+For+he+answers+the+lawyer+who+asks+him+what+is+needed+for+salvation%2C+%E2%80%9CIf+you+would+enter+into+life%2C+keep+the+commandments.%E2%80%9D+What+more+do+we+want%2C+they+ask%2C+when+we+are+bidden+by+the+Author+of+grace+to+attain+God%E2%80%99s+Kingdom+by+observing+the+commandments%3F+As+if+it+were+not+evident+that+Christ+did+not+accommodate+his+replies+to+those+with+whom+he+saw+that+he+had+to+deal%21+Here+a+doctor+of+law+asks+about+the+manner+of+obtaining+blessedness%E2%80%94and+not+simply+that+but+by+what+deeds+men+may+arrive+at+it.+And+the+person+of+the+speaker+and+the+question+itself+prompted+the+Lord+to+answer+thus.+The+lawyer%2C+accustomed+to+the+persuasion+of+law+righteousness%2C+blinded+himself+with+confidence+in+works.+Then+he+sought+only+what+were+works+of+righteousness+whereby+salvation+is+acquired.+Therefore+he+is+rightly+sent+back+to+the+law+wherein+there+is+a+perfect+mirror+of+righteousness.+With+a+clear+voice+we+too+proclaim+that+these+commandments+are+to+be+kept+if+one+seeks+life+in+works.+And+Christians+must+know+this+doctrine%2C+for+how+could+they+flee+to+Christ+unless+they+recognized+that+they+had+plunged+from+the+way+of+life+over+the+brink+of+death%3F+How+could+they+realize+how+far+they+had+wandered+from+the+way+of+life+unless+they+first+understood+what+that+way+is+like%3F+Only%2C+therefore%2C+when+they+distinguish+how+great+is+the+difference+between+their+life+and+divine+righteousne <blockquote><p>I.I.XV. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore man’s glorying is not excluded, but he may glory as a faithful servant may do upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man in himself ungodly is considered in the covenant, as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. I.IX.XVI. The second thing, which we said, § II. was immutable in the covenant of works, was this; that eternal life was not obtainable on any other condition but that of perfect obedience: as may thus be invincibly proved: for, by virtue of this general rule, it was necessary for Christ to be made under the law, Gal. iv. 4. and fulfil all righteousness, and that for this end, that the righteousness of the law might be fulfilled, Rom. viii. 4. But if this righteousness had not been sacred and inviolable, Christ would have been under no necessity to submit to the covenant of the law, in order to merit eternal life for his people. This therefore is evident, that there ought to be a merit of perfect obedience on which a right to eternal life may be founded. Nor is it material whether that perfect obedience be performed by man himself, or by his surety.</p></blockquote>

<blockquote><p>6. What condition is attached to the covenant of grace? The condition attached to the covenant of grace is faith in Jesus Christ. 13. Why Should a Christian want to obey the law of God as an evidence of the truth of his faith and thankfulness to God. A Christian should want to obey the law of God as an evidence of the truth of his faith and thankfulness to God. 14. What other reason is there why a Christian should want to obey the law of God? A Christian should want to obey because that is “the way which God hath appointed to salvation.” This does not mean that obeying God’s law is any part of the ground of our salvation, but that being saved from sin unto righteousness, obedience to the law is the way that God has appointed for a saved person to walk in, and the person who is saved will want to forsake sin and follow righteousness more and more.</p></blockquote>

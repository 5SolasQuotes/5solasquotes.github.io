<figure class="quote" id="q-21798dc6c8" data-kw="">
<blockquote><p>Let us then endeavour to open up the nature, grounds, and effects of a scriptural assurance of complete and final salvation. I begin with premising that this assurance is no apostolical gift, or extraordinary attainment, confined to the first age of the gospel, or to a favoured class of Christians. Judas, though an apostle, did not possess it: and Paul never speaks of it as a privilege of office, or an effect of inspiration.

He does not say on this as he says on another subject, “Am I not an apostle? have not I seen the Lord?” He does not “come to visions and revelations of the Lord,” he does not speak as one “caught up to the third heavens;” for he knew that he might have enjoyed all these privileges, and yet “be a castaway.” It was as a sinner—the “chief of sinners,” that he committed his soul to Christ: and it is as a believer, and on grounds common to all believers in every age, that he expresses the persuasion in the text.

What he here avows as an individual he elsewhere expresses in the name of all believers —”We rejoice in the hope of the glory of God.” And all the saints at Rome he associates with himself in that triumphant passage, “Who shall separate us from the love of Christ? I am persuaded that neither life nor death, nor any other creature shall be able to separate us from the love of God which is in Christ Jesus our Lord.”

God forbid, that we should cut off the streams of Christian consolation, and dry up the most fertile source of Christian holiness, by confining this attainment either to apostolical men, or to the primitive Christians. This were not to “follow their faith, considering the end of their conversation, Jesus Christ, the same yesterday, and to-day, and for ever.” Their minds might be more deeply imbued with the Spirit of truth; but we having the same Spirit of faith, according as it is written, “I have believed and therefore have I spoken,” we may believe and so speak. Every believer in Christ possesses this persuasion in some degree, and may attain to the full assurance of understanding, and faith, and hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assurance in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><figure class="quote" id="q-e52658df6f" data-kw="">
<blockquote><p>For if the man be a back-slider in heart, and a servant of sin, Christ never touched his pulse. He hath as yet sure grounds to question, whether he be loved of God, or be in Christ, or no; for except you prove the man to be loved with an everlasting love, you can prove nothing: And your argument will not conclude any thing for the man’s peace, except you will prove him to be chosen of God; which is his only question.

But say that he is loved from everlasting, and that he is in Christ, by faith, it’s easy to prove, that his sins cannot change everlasting love, nor make him less beloved of God nor separate him from the love of God. You must then either remove the man’s doubting, from signs inherent in the man, (and if he be a back-slider in heart, you fetch fire and water from beyond the Moon to cure him;) or you must fetch warrants to convince him, from the mind, eternal counsels of love and free grace within God; and that is all the question between the poor man and you.

You cannot prove God hath loved him from everlasting, because he hath loved him from everlasting. If Libertines in this Argument intend to prove, that a chosen convert in Christ hath no ground to question, that he is not beloved of God, and not in Christ 1. That is nothing to the Thesis of Antinomians, maintained by all, that sinners, as sinners, are to believe God’s eternal love in Christ to them; and so all sinners, elect or reprobate, are to believe the same.

2. Its nothing to the universal commandment, that all and every one in the visible Church, wearied and loaden with sin, or not wearied and loaden, are immediately to come to Christ and rest on him, as made of God to them their righteousness, sanctification, and redemption, without any inherent qualification in them.

3. It’s nothing to the point of freeing all, and building a golden bridge to deliver all who are obliged to believe, elect or reprobate, from doubting whether they be in Christ or not, that they may easily come to Christ, and believe his eternal love and redemption in him, though they be in the gall of bitterness, and bonds of iniquity, and that immediately. Which golden Paradise to heaven and Christ, Antinomians liberally promise to all sinners, as sinners. I cannot believe that it’s so easy a step to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself</cite>, (London: Andrew Crooke, 1647), I., pp 73-74.</span></figcaption>

</figure><figure class="quote" id="q-600f2829ab" data-kw="">
<blockquote><p>Faith and assurance are then still found as it pertains to the root, the ground, the state, and the possession of it, as well as to some of the activities that flow from that possession, but not as it pertains to the outflow and influence of the manifestation and assurance, the emotions, the consolation, the joy and serenity, as it was experienced earlier. …

[T]his assurance of faith is not always present. For it can happen and often does, either as a consequence of impaired judgment or of various temptations and disturbances of the mind, that the one who truly believes and is justified before God by faith nevertheless thinks for a time – in keeping with what he feels – that he does not truly believe and is not reconciled with God.</p></blockquote>

<blockquote><p>3. The Holy Spirit specially seals each particular believer, and makes him sure of his adoption, by a certain wonderful and secret testimony: for he is given to every believer as a pledge of divine love; and he, finally, pronounces in the hearts of the godly, that they are in favour with God: which testimony they both may and ought to believe. Therefore they do believe in particular that they are in the grace of God, and that their sins are remitted them.

The authorities from which all this is proved are well known: Rom. viii. 16, The Spirit beareth witness with our spirits that we are the children of God; Gal. iv. 6, Because ye are sons, God hath sent forth the Spirit of his Sort into your hearts, crying, Abba, Father; and Ephes. i. 13, 14, Ye were sealed with that Holy Spirit, after that ye believed, which is the earnest of your inheritance. Nor is this testimony fallacious or conjectural, but certain and infallible in all in whom it is found.

For the word is the ministration of the Spirit, 2 Cor. iii.; and faith conceived by the ministration of the word, is always joined with the witness of the Spirit itself. Therefore the impression of faith by the Holy Spirit, in the heart of a particular man, is, as it were, a particular testimony that he is in grace, and that he is a child of God. So Bernard, Serm. 5, De dedicat. ecclesise. Who can tell whether he is worthy of love or hatred? Who hath known the mind of the Lord? Here it is necessary that faith should come to our aid; that what is concealed concerning us in the heart of the Father, may be revealed to us by his Spirit; and his Spirit bearing witness may persuade our spirits that we are the children of God. But he persuades by calling and justifying us freely through faith.

[Cardinal Robert] Bellarmin[e] replies, that the Holy Spirit witnesses to our spirits only by some experience of an internal suavity and peace which produces nothing better than a conjectural certainty. De justif. lib. iii. cap. 9.

But Bernard rejects this Jesuitical comment: for he says this testimony is received by the act of faith; and that the Holy Spirit persuades our spirit that we are the children of God, by faith, not by fallible conjectures. So Chrysostom in viii. ad Rom. When the Spirit testifies can any doubt remain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39-40.</span></figcaption>

</figure><figure class="quote" id="q-21aebcefb8" data-kw="">
<blockquote><p>2. From the nature of the promises. The promises of gospel grace and the remission of sins, through the reconciliation of Christ, are to be so believed by us as to afford firm and solid consolation: but unless I in particular believe that I am reconciled, and that I am absolved from sins, they cannot yield this consolation. The former is evident, because the very end of gospel grace and of the divine promises is, that we may have strong consolation, Heb. vi. 18.

But that general faith of the Papists, that every one who believes truly and lives piously, hath remission of sins; or that conditional faith, I, if I am faithful, am in the grace of God, does not yield strong consolation, because it may consist with despair. It is necessary, says Bernard, to believe that you cannot have forgiveness, unless by the mercy of God; but at the same time believe this, that your own sins are forgiven you through him. Bernard, De annunt. Serm. 2.

And the reason is because promises of God do not take effect until they have been accepted by us; although, therefore, remission of sins, upon condition of faith, be offered to all, yet it must of necessity be accepted by men individually and singly, that it may be useful and salutary to each one. Promises are not accepted by those who do not, but by those who do know, and understand, and feel, that they apprehend and accept them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39.</span></figcaption>

</figure><figure class="quote" id="q-103b17c7c3" data-kw="">
<blockquote><p>From the consideration of which arises an important controversy between us and the Papists, which we shall briefly touch upon. The Apostle, as you have heard, desires for the faithful grace and peace from God, and from the Lord Jesus Christ; i. e. gratuitous acceptance for Christ’s sake, adoption among the children of God, and assurance of the remission of sins: Hence it is enquired Whether the faithful can or cannot assuredly determine with themselves that they are in favour with God, and that their sins are remitted them for Christ’s sake, in whom they have believed ? Our opinion is that every faithful and truly justified man may, and ought, infallibly to believe, that his sins are remitted to him as an individual, and that God is reconciled to him; i. e. that he hath this grace and peace, which the Apostle desired for the Colossians.

The opinion of the Papists is. That they who are truly justified and in favour with God, yet neither can nor ought to believe that they are reconciled to God and justified; but to hope and conjecture only that they are in a state of grace, and have obtained remission.

We establish our opinion by these arguments :

1. From the nature of faith. He who is endued with true faith sees, by the very light of that faith kindled in his heart through the Holy Spirit, that he believes in Christ, and is justified by faith: but he who sees this, at the same time is able to conclude that he is in favour with God, and that his sins are remitted him. For Scripture plainly states. Being justified by faith we have peace, Rom. v. 1 . He that believeth on the Son hath everlasting life, John iii, 16 and 36. Therefore the whole difficulty lies in this. To shew that a believer is authorised to say, not from conjecture and opinion, but from conviction, I believe in Christ. This is proved from Augustine, De Trin. xiii. 1, That which we are commanded to believe we are not able to see ; yet faith itself when it is wrought in us, we know to be in us. So Thomas [Aquinas], Whosoever hath knowledge or faith, is sure that he hath it; became it is of the nature of faith, that a man should be certain of those things of which he hath faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 36-38.</span></figcaption>

<blockquote><p>[I]n this present life there is no greater joy or contentment, nothing more certain or necessary for rising above all the difficulties we face, than to know and feel that we are children of God. When this foundation is laid, we can be sure that all that happens to us in some way a blessing of the heavenly Father. It is a means, an aid, a path that in his providence he has prepared either to lead us toward eternal life or to increase our glory in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), p. 35.</span></figcaption>

</figure><figure class="quote" id="q-2c3f0e6b60" data-kw="">
<blockquote><p>Some confine faith to the understanding, and make it no more but a firm assent of the understanding to the truth of God. It is the faint and languid definition which Bellarmine and too many with him give to faith — a definition which barreth confidence and personal application from the nature of faith.

Others will acknowledge no other faith but a certain confidence, without the least wavering that Christ is ours and his merits, and exclude from the number of the faithful all such as doubt. Both are in fault and run to opposite extremes.

As for that faith confined to the assent of the understanding, if we must only believe that St. Luke and St. John have truly related the history of Christ’s passion, and must not attempt to lay our whole trust on the merit of it, nor apply it to ourselves for fear of presumption, certainly we are in an ill case—in no better case than the devil, for he believeth the truth of God’s promises, but dares not apply them to himself.

And as for the full confidence in God’s mercy through Jesus Christ without any doubting, it is indeed the highest degree of faith, if it be upon good ground. Blessed and holy is he that hath that right confidence. And then it will be right when it worketh love, humility and repentance in the heart. That full confidence we must all aim unto and never leave till we obtain it. But as handsomeness and strength are not the essence but the perfection of man’s body, likewise a full confidence of our salvation upon good ground is not the essence but the perfection of faith.

So that as you would not deny a child or a lame man to be a true man; likewise you must not deny a trembling or a halting faith to be a true faith when a good soul saith, “Lord, I believe, help thou my unbelief” [Mark 9:24]. For observe that he that spake so, obtained of the Lord what he would have. To teach us that the humble penitent soul that can but take his recourse unto Christ hath faith enough to obtain his mercy.

These two acts of faith must be distinguished: the direct act, which embraceth the mercy of God through Jesus Christ; and the reflected act, which is the assurance and comfort that the soul feeleth by embracing the mercy of God in Jesus Christ.

The justifying act of faith is the direct act, not the reflected. For it is evident that we are justified before God because we embrace the mercy of God through the merits of Jesus Christ, not by the assurance and comfort arising out of it in our consciences. Wherefore it is a very ill consequence to say, I have no comfort, therefore I have no faith; for you are not justified by your comfort in God’s mercy through Jesus Christ but by our recourse to it. Were this well apprehended, it would ease many troubled consciences. “Come unto me,” saith Christ, “all ye that labour and are heavy laden” Matth. 11:28. Coming to Christ with a contrite heart, labouring and heavy laden, is believing on him; and many believe to salvation that believe not yet to comfort.

In effect coming to Christ in the style of Christ is believing on him. “Him that cometh to me, I will in no wise cast out,” saith he, John 6:37. And two verses before, “He that cometh to me shall never hunger, and he that believeth in me shall never thirst.” So in the sense of the Lord Jesus, coming to him and believing on him are all one. And they that come to him as the true and sole object of their faith are certainly justified, though they be not presently comforted. They are justified by faith when they believe not their own faith.

Let us be disciples of the disciples of Christ, learning of them to pray to him: “Lord increase our faith” [Luke 17:5]—there being no essential want in the world (either for the spiritual or the temporal) but comes for want of faith. Let him that mistrusteth God’s mercy have recourse nevertheless unto that mercy. Let him hope against hope. Let him wrestle, as Jacob, by a holy obstinacy, and not let the Lord go till he hath got a blessing</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Some confine faith to the understanding, and make it no more but a firm assent of the understanding to the truth of God. It is the faint and languid definition which Bellarmine and too many with him give to faith — a definition which barreth confidence and personal application from the nature of faith.

Others will acknowledge no other faith but a certain confidence, without the least wavering that Christ is ours and his merits, and exclude from the number of the faithful all such as doubt. Both are in fault and run to opposite extremes.

As for that faith confined to the assent of the understanding, if we must only believe that St. Luke and St. John have truly related the history of Christ’s passion, and must not attempt to lay our whole trust on the merit of it, nor apply it to ourselves for fear of presumption, certainly we are in an ill case—in no better case than the devil, for he believeth the truth of God’s promises, but dares not apply them to himself.

And as for the full confidence in God’s mercy through Jesus Christ without any doubting, it is indeed the highest degree of faith, if it be upon good ground. Blessed and holy is he that hath that right confidence. And then it will be right when it worketh love, humility and repentance in the heart. That full confidence we must all aim unto and never leave till we obtain it. But as handsomeness and strength are not the essence but the perfection of man’s body, likewise a full confidence of our salvation upon good ground is not the essence but the perfection of faith.

So that as you would not deny a child or a lame man to be a true man; likewise you must not deny a trembling or a halting faith to be a true faith when a good soul saith, “Lord, I believe, help thou my unbelief” [Mark 9:24]. For observe that he that spake so, obtained of the Lord what he would have. To teach us that the humble penitent soul that can but take his recourse unto Christ hath faith enough to obtain his mercy.

These two acts of faith must be distinguished: the direct act, which embraceth the mercy of God through Jesus Christ; and the reflected act, which is the assurance and comfort that the soul feeleth by embracing the mercy of God in Jesus Christ.

The justifying act of faith is the direct act, not the reflected. For it is evident that we are justified before God because we embrace the mercy of God through the merits of Jesus Christ, not by the assurance and comfort arising out of it in our consciences. Wherefore it is a very ill consequence to say, I have no comfort, therefore I have no faith; for you are not justified by your comfort in God’s mercy through Jesus Christ but by our recourse to it. Were this well apprehended, it would ease many troubled consciences. “Come unto me,” saith Christ, “all ye that labour and are heavy laden” Matth. 11:28. Coming to Christ with a contrite heart, labouring and heavy laden, is believing on him; and many believe to salvation that believe not yet to comfort.

In effect coming to Christ in the style of Christ is believing on him. “Him that cometh to me, I will in no wise cast out,” saith he, John 6:37. And two verses before, “He that cometh to me shall never hunger, and he that believeth in me shall never thirst.” So in the sense of the Lord Jesus, coming to him and believing on him are all one. And they that come to him as the true and sole object of their faith are certainly justified, though they be not presently comforted. They are justified by faith when they believe not their own faith.

Let us be disciples of the disciples of Christ, learning of them to pray to him: “Lord increase our faith” [Luke 17:5]—there being no essential want in the world (either for the spiritual or the temporal) but comes for want of faith. Let him that mistrusteth God’s mercy have recourse nevertheless unto that mercy. Let him hope against hope. Let him wrestle, as Jacob, by a holy obstinacy, and not let the Lord go till he hath got a blessing”

C+learning+of+them+to+pray+to+him%3A+%E2%80%9CLord+increase+our+faith%E2%80%9D+%5BLuke+17%3A5%5D%E2%80%94there+being+no+essential+want+in+the+world+%28either+for+the+spiritual+or+the+temporal%29+but+comes+for+want+of+faith.+Let+him+that+mistrusteth+God%E2%80%99s+mercy+have+recourse+nevertheless+unto+that+mercy.+Let+him+hope+against+hope.+Let+him+wrestle%2C+as+Jacob%2C+by+a+holy+obstinacy%2C+and+not+let+the+Lord+go+till+he+hath+got+a+blessing%E2%80%9D%0A%0A%E2%80%94+Peter+Du+Moulin%2C+Add+to+Your+Faith+Virtue+%281684%29+in+Mid-American+Journal+of+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c3f0e6b60.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c3f0e6b60.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/04/peter-du-moulin-on-avoiding-extreme-views-of-faith-and-assurance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>How can a man have affiance in CHRIST, and rest upon him for salvation, who is not by Faith persuaded, and in some measure assured, that he is his Saviour? How can he hope and wait for the performance of the promises, that doth not believe that they belong unto him? Faith being the substance of things hoped for. How can a man have true peace of conscience, who is not persuaded, that God is reconciled to him? How can a man rejoice in God, who is not assured of Gods favour towards him? How can a man trust in God, that is not persuaded of Gods goodness towards him? How can a man be thankful unto God, who is not persuaded of Gods love and bounty towards him?

How shall they fear God as sons, that is, fearing to offend so merciful a Father, who are not persuaded that he is their Father in CHRIST? or when they have sinned, how shall they be encouraged to return unto him, if they be not persuaded of his fatherly respect to them? how shall they perform voluntary and cheerful obedience, who are not persuaded that their endeavours are accepted of him? How shall they pray, who doe not believe they shall be heard? Or as the Apostle speaketh, how shall they call upon him in whom they have not believed? Rom. 10.14. How shall they patiently and comfortably bear afflictions, who are not persuaded they be fatherly chastisements or trials proceeding from Gods love, and tending to their good? Finally, with what heart can men worship God, who are not persuaded, that their service is accepted of him? …

For the more a man is persuaded of Gods love and favour towards him in CHRIST, (that is, by how much the greater is a mans special Faith) so much the more he loveth God, and his neighbour for God’s sake; so much the more is he inflamed with the zeal of God: so much the more confidently doth he rest upon CHRIST for salvation: so much the more he hopeth for, and expecteth the good things promised: so much the more he rejoiceth, and glorieth in God: so much the more he is thankful to God for his goodness: so much the more he trusteth in GOD, so much the more he feareth to offend so gracious a GOD, and so merciful a Father: or having offended, he will so much the sooner return unto GOD: so much the more patiently and comfortably he beareth afflictions, saying with Job: though he kill me, yet will I put my trust in him: so much the more willingly and cheerfully will he obey and serve the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 79-81.</span></figcaption>

</figure><figure class="quote" id="q-98297db55d" data-kw="">
<blockquote><p>But is it not really selfish to pay so much attention to personal assurance? There are some well-meaning Christians who, in spite of themselves, are inclined to think that the charge is true, and are therefore rather hesitant to speak about this assurance. But the objection is really absurd. The underlying assumption would seem to be that all attention to self with a view to its welfare, is selfish. It is a patent fact, however, that the Modernist himself does not believe that, for then he would also have to consider eating and drinking, hygienic measures, physical exercise, the cultivation of moral purity, etc., as thoroughly selfish, and yet these are the very things that are stressed by the social gospel. It is certainly no more selfish to cultivate spiritual, than it is to promote physical well-being. …

But seeking personal assurance is not in itself an evidence of selfishness. We may be seeking our spiritual well-being in this respect, in order that we may be more able to help others, to promote the cause of God, to reveal the glory of his grace, and to magnify Him for the riches of the inheritance which He has prepared for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assurance of Faith</cite>, (1928; Monergism Books, Kindle Edition, 2018), Kindle Locations 73-83.</span></figcaption>

<blockquote><p>This [lack of spiritual comfort] may arise from the prevalence of a natural melancholy [depression] in the body, whereby the understanding may be darkened, the fancy troubled, reason perverted, and the soul saddened. Melancholy is the mother of discomfort and the nurse of doubting. It was (as some think) depth of melancholy that prevailed upon Nebuchadnezzar, so that he did not know, he was a man or a beast. And in the like manner this bodily melancholy may so far distemper your soul that you who have grace yet may not know whether you are a child of God or a child of the devil. It is not more wonder to see a melancholy man doubt and question his spiritual condition than it is to see a child cry when beaten or to hear a sick man groan.

You may silence a melancholy man when you are not able to comfort him; and though you may resolve his doubts and scruples by evident and convincing answers and arguments, yet let such a man retire alone and brood over his melancholy thoughts, and by the prevalence of this perturbing humour all is forgotten, and he is as unsatisfied as if you had said nothing to him.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This [lack of spiritual comfort] may arise from the prevalence of a natural melancholy [depression] in the body, whereby the understanding may be darkened, the fancy troubled, reason perverted, and the soul saddened. Melancholy is the mother of discomfort and the nurse of doubting. It was (as some think) depth of melancholy that prevailed upon Nebuchadnezzar, so that he did not know, he was a man or a beast. And in the like manner this bodily melancholy may so far distemper your soul that you who have grace yet may not know whether you are a child of God or a child of the devil. It is not more wonder to see a melancholy man doubt and question his spiritual condition than it is to see a child cry when beaten or to hear a sick man groan.

You may silence a melancholy man when you are not able to comfort him; and though you may resolve his doubts and scruples by evident and convincing answers and arguments, yet let such a man retire alone and brood over his melancholy thoughts, and by the prevalence of this perturbing humour all is forgotten, and he is as unsatisfied as if you had said nothing to him.”

<blockquote><p>For as it is in nature: first we are babes, &amp; then as we increase in years, so we grow in strength: so it is in the life of a Christian; first ordinarily he hath a weak faith, and after grows from grace to grace, till he come to stronger faith: and at the last he be able to say, he is fully assured in his heart and conscience of the pardon of his sins &amp; of reconciliation to God in Christ. And this assurance ariseth from many experiences and other blessings, which being deeply and duly considered bring a man to be fully persuaded, that God is his God, and God the father, his father, and Jesus Christ his redeemer, and the Holy Ghost his sanctifier.</p></blockquote>

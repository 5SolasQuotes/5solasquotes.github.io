<blockquote><p>359. XI. The next distinction of God’s will is into effectual and uneffectual. And here he that would see a great deal said on the question, Whether God have any uneffectual will, and whether man’s will can frustrate it, may see too much in a multitude of Schoolmen on [Lombard] Sentences, dist. 1, quest. 45 &amp; 46.¹ ¹ Aquinas, art. 1; Scotus, quest. unica; Durandus, quest. 1; Bonaventura, art. 1; Gregory Ariminiensis, quest. unica, art. 3; Pennot. bk. 4, ch. 22; Alvarez, De Auxiliis, disp. 32; Ruiz, De Voluntate, disp. 18; Granada, Of the Will of God, tract. 4, disp. 3; Suarez, bk. 4, Of Predestination, ch. 8; Gregory Valencia, disp. 1, quest. 19, p. 6; Cajetan; Nazar. Ban. Zum. Navar. Gonzal. Molina; Vasquez, etc. in [Aquinas, Summa] pt. 1, quest. 19, art. 6; Ripa. Arrub. Fasol. ibid.; Nic. D’Orbel., pt. 1, dist. 46 and many other Scotists, etc. Some answer (as D’Orbellis, etc.) that the voluntas beneplaciti [will of good-pleasure] is ever effectual, but not the voluntas signi; which yet seeing he well explains to be only the making of duty, he might well have said is still effectual to its proper primary effect. Gregory Ariminiensis (and many others) distinguish of the will of complacency and displicency, and that prosecutionis et fugae; and say the latter is effectual and not the former: which others say of the absolute will as distinct from the conditional. The plain truth I have oft opened before: God’s will is the first efficient, the chief dirigent and the final cause (in which the three principles, power, wisdom and goodness are eminent). 1. His efficient will is ever effectual and never frustrated. ‘Whatsoever pleased the Lord (to do) that He did in heaven and in earth, in the sea and in the depths.’ Ps. 135:6. ‘And who has resisted (this) his will?’ Rom. 9:19. 2. His directing will is ever effectual as to the making of the Law or rule, and of due or right thereby: For so far it is efficient of that effect: But it is too oft violated by our sin. 3. His final will or complacency, is God’s being pleased with the being, or action, or relation of the creature, and supposing it, [it] is not efficient [because it is an end, final goal], and therefore [it is] not effectual. And I know no need of more upon this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology... (London: White, 1675), pt. 1, sect. 14, Of Several Distinctions of God’s Will</cite>, p. 56</span></figcaption>

ll+is+ever+effectual+and+never+frustrated.+%E2%80%98Whatsoever+pleased+the+Lord+%28to+do%29+that+He+did+in+heaven+and+in+earth%2C+in+the+sea+and+in+the+depths.%E2%80%99+Ps.+135%3A6.+%E2%80%98And+who+has+resisted+%28this%29+his+will%3F%E2%80%99+Rom.+9%3A19.+2.+His+directing+will+is+ever+effectual+as+to+the+making+of+the+Law+or+rule%2C+and+of+due+or+right+thereby%3A+For+so+far+it+is+efficient+of+that+effect%3A+But+it+is+too+oft+violated+by+our+sin.+3.+His+final+will+or+complacency%2C+is+God%E2%80%99s+being+pleased+with+the+being%2C+or+action%2C+or+relation+of+the+creature%2C+and+supposing+it%2C+%5Bit%5D+is+not+efficient+%5Bbecause+it+is+an+end%2C+final+goal%5D%2C+and+therefore+%5Bit+is%5D+not+effectual.+And+I+know+no+need+of+more+upon+this+question.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Catholic+Theology...+%28London%3A+White%2C+1675%29%2C+pt.+1%2C+sect.+14%2C+Of+Several+Distinctions+of+God%E2%80%99s+Will%2C+p.+56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F968e4cfc58.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/968e4cfc58.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=359.%20XI.%20The%20next%20distinction%20of,need%20of%20more%20upon%20this%20question." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

enying+The+Possibility+Of+Assurance+Is+False%2C+And+Has+A+Dangerous+Tendency+To+Destroy+The+True+Place+And+Comfort+Of+Souls+In+The+Certain+Hopes+Of+Everlasting+Happiness.+%E2%80%93+2+Peter+1%3A10%E2%80%99%2C+p.+377-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6255e86111.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6255e86111.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=God%E2%80%99s%20call%20sometimes%20is%20ineffectual%2C%20and,the%20outward%20call%20of%20the%20Word%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c394ca331" data-kw="">
<blockquote><p>Three things are to be observed in this speech: 1. God’s resolution not always to strive with man by his Spirit. My Spirit has striven a great while; it shall strive yet a little longer; but it shall not strive always. The Holy Spirit is a striving Spirit with the children of men; striving them away from sin, and to bring them to God; striving by the checks of their own consciences, but the ministry of the Word, by the rebukes of Providence; striving by one fair warning after another to reclaim the sinner. Have not we ourselves experienced these strivings?—something within us that has whispered in an hour of temptation, “Do not this abominable thing which the Lord hates?” ‘Twill be our wisdom to hearken to such whispers, and to close with them, striving against sin. Heb 12:4. If the Spirit of God be resisted in its strivings, and quenched in its motions, though it may strive long, yet it will not strive always. ‘Tis a principle with men not to be always persuading those with whom they cannot prevail; neither will the blessed Spirit do so. If Ephraim be joined to idols, is it not a righteous thing with God to say, Strive no more with him, let him alone? Hosea 4:17. What guest will stay long there where he is not welcome? Is it not wisdom then to improve these strivings while we have them? 2. The reason of that resolution: For that he also is flesh; carnal, earthly, sensual, corrupted, depraved, defiled; and therefore ‘tis to no purpose to strive with him; ‘tis but labor lost. It is as good to go about to change the Ethiopian’s skin or the leopard’s spots, as to reclaim and reform these impenitent sinners. Flesh, in scripture, is frequently opposed to spirit. It is the corrupt nature that renders the strivings of the blessed Spirit ineffectual. ‘Tis the law in the members that wars against the law of the mind. Rom. 7:23. The flesh and the spirit are sworn enemies one to another, and between them there is a constant conflict. Gal. 5:17. Now where the flesh, the carnal part, is so far suffered to prevail, as that the man may be denominated flesh, there the Spirit will not always, will not long strive. Those therefore that would enjoy the Spirit’s strivings, must curb and restrain, and not gratify and encourage, the corrupt motions and carnal desires of the flesh and of the mind. Eph. 2:3.</p></blockquote>

<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible, on Gen.</cite>, 6:3</span></figcaption>

<blockquote><p>13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.</p></blockquote>

<blockquote><p>(2) We have found that God Himself expresses an ardent desire for the fulfilment of certain things which He has not decreed in his inscrutable counsel to come to pass. This means that there is a will to the realization of what He has not decretively willed, a pleasure towards that which He has not been pleased to decree. This is indeed mysterious, and why He has not brought to pass, in the exercise of his omnipotent power and grace, what is his ardent pleasure lies hid in the sovereign counsel of his will. We should not entertain, however, any prejudice against the notion that God desires or has pleasure in the accomplishment of what he does not decretively will. (3) Our Lord Himself in the exercise of his messianic prerogative provides us with an example of the foregoing as it applies to the matter of salvation. He says expressly [in Mt. 23:37] that He willed the bestowal of his saving and protecting grace upon those whom neither the Father nor he decreed thus to save and protect.</p></blockquote>

<blockquote><p>voluntas Dei, ‘the will of God’ … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary, ed. 1</cite></span></figcaption>

<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>

<blockquote><p>As for the divine commiseration of sinners, it shows that their death and damnation are not things primarily well-pleasing unto God: but it shows not that God must become an hypocrite and a dissembler if He have eternally decreed to permit them to incur death and damnation by their own default. For God’s mercy being actio sublevantis [an act of taking away] and not passio condolentis [a passion of suffering with], it ties Him not to do all He can for redeeming any man out of his misery; but his action is ordered and limited by his own free-will. It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind… (Cambridge, 1641), ‘Whether absolute reprobation oppugn the truth and sincerity of God’</cite>, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>4. This turning the grace of God into lasciviousness argues the grossest folly; it is a forsaking of our own mercy, a receiving the grace of God in vain. What is, if this be not to neglect great salvation; to be prodigal of blessedness; to ravel out and to wanton away the offers of Christ Himself? Who would not heartily chide himself that by toying, trifling, or unnecessary lingering in the way to the exchange, misses of a bargain by which he might have gained a thousand pounds?… 4. Grace turned into lasciviousness is the top of all ingratitude. What greater unkindness than to be evil because God is good?… To be lascivious because God is gracious is to fight against God with his own weapons, to wound God with that arm which He has cured (Hos. 7:15), to kill and crucify Him who has freed us from death: In a word, to make that a pillow for presumption which God appointed for an antidote against despair.</p></blockquote>

</figure><figure class="quote" id="q-65547cb8c6" data-kw="">
<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>

</figure><figure class="quote" id="q-c81dac9740" data-kw="">
<blockquote><p>§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel… with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman.</cite>, pp. 152-53</span></figcaption>

</figure><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>

<blockquote><p>From these [Mt. 23:27; Lk. 13:34; Mk. 7:24; 14:35-36; Mt. 26:39] and other like passages, the Fathers in the Sixth General Council concluded against the heresy of the Monothelites [that Christ has only one will], and established the true doctrine of a twofold will in Christ, not contrary to themselves, but still subordinate the one unto the other, at least in the final issue.</p></blockquote>

</figure><figure class="quote" id="q-908f580768" data-kw="">
<blockquote><p>I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.”

— William Creed, paragraphs 61-73, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), pp. 237-38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+shall+not+now+enquire+whether+these+acts+of+Christ%E2%80%99s+will+and+holy+love+did+issue+and+proceed+from+Him+per+modum+naturae+%5Bthrough+the+mode+of+nature%2C+as+Rutherford+held%3B+see+below%5D%2C+or+per+modum+rationis+%5Bthrough+the+mode+of+reason%5D%2C+as+they+speak+in+the+Schools%2C+or+both%3B+that+is%2C+whether+they+were+only+the+natural+weights+and+inclinations%2C+and+desires+of+the+will+and+habit+of+charity+to+his+own+self-preservation%2C+without+any+deliberation%2C+such+as+is+to+be+found+in+children+before+the+use+of+reason%3B+or+whether+they+proceeded+from+Him+out+of+a+deliberate+consideration+and+pondering%2C+not+so+much+of+the+now-impending+evils+and+the+fury+of+his+Father%E2%80%99s+wrath%2C+as+the+love+He+bore+to+his+own+people+the+Jews%2C+whose+destruction+and+casting+off+He+foresaw+would+be+the+consequents+of+his+death%3A+though+Suarez+seems+to+me+to+have+proved+the+latter+as+well+as+the+former.%E2%80%9D%0A%0A%E2%80%94+William+Creed%2C+paragraphs+61-73%2C+pp.+236-43+in+sect.+13+in+The+Refuter+Refuted%2C+or+Dr.+%5BHenry%5D+Hammond%E2%80%99s+Ektenesteron+Defended%2C+against+the+impertinent+cavils+of+Mr.+Henry+Jeanes...+%28London%3A+Royston%2C+1660%29%2C+pp.+237-38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F908f580768.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/908f580768.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=I%20shall%20not%20now%20enquire%20whether,latter%20as%20well%20as%20the%20former." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XXV. Thirdly, it is asked how Christ could offer such prayers to God as openly appear to be repugnant to the divine counsel and will, and thus to the piety and obedience which he most constantly exhibited to the Father? For what? Was he not born and made mediator for this very reason, that he might drink this cup for our salvation? Did he not know that this was the decree of the Father, as he himself testified more than once, that he must suffer many things and be killed? Mt. 16:21. Indeed, when he was being seized by the soldiers, he rebukes Peter for resisting them: “Shall I not drink the cup which my Father hath given me?” How, therefore, is he contrary to himself and to the Father, by requesting with such effort that the cup be transferred from him? Here, indeed, there are many things that can be replied. 1st, We suppose, against the Monothelites, that there was a twofold will in Christ, just as there was a divine and a human nature; these were not indeed adverse and repugnant to one another, but were nevertheless diverse insofar as they were directed toward diverse objects. The divine [will] willed death because it had been so ordained by the Father for our redemption; the human, however, shuddered and prayed against it, because it viewed it as the destruction of nature and the most dire of all evils that could exist; yet the human will is not rightly said to have been repugnant to the divine, because it petitioned not absolutely, but conditionally; not with a deliberate and elective will, but rather with an inefficacious and natural velleity. Therefore, it is to be observed 2nd, that the will can be divided in many ways; for one is called efficacious, another inefficacious; that is called efficacious which is the principle of acting, and which moves and impels a man to execute those things which it wills and to remove, as much as it can, any impediments to operation; [Ineffectual] which is not brought into effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.</p></blockquote>

<blockquote><p>XXXII. Finally, it is asked here how Christ can be said to have been heard in that prayer from fear, as the apostle testifies, Heb. V:7 [“Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;”], and elsewhere Christ professes that he is always heard by the Father, Jn. XI:42, when nevertheless death had necessarily to be undergone by him. That which Christ willed simply and absolutely, in that he never suffered a refusal; but that which he willed only under a condition, it is no wonder if he did not obtain it, since that was not so much a will as it was velleity, and that was not so much to be reckoned a rational desire, which ought always to hold the primary place, as a natural inclination and sensitive appetite, which never has the principal role in prayer. 2. Christ was heard from the fear of death, not indeed absolutely, as if He had been freed from the necessity of undergoing death, but in a certain respect, namely, insofar as God, who heard Him, so shook off that fear that He received death most steadfastly and submitted Himself wholly to the divine will, and was thus strengthened so that He laid aside all dread of death. For Christ feared two things above all: 1. Lest He should succumb, overwhelmed by the evils which He saw to be most grievous. 2. Lest He should be swallowed up by death, so that no exit from it would be open. But God heard Him, that is, freed Him from both those fears: 1. Because He so corroborated Him by the power of His Spirit in the midst of the struggle that He most steadfastly and invincibly sustained that most grievous contest. 2. Because He freed Him from death, having loosed the pains of hell by His glorious resurrection; and thus, most truly, in this respect He was heard—not, indeed, that He might not pay the penalty of death, but that He might not be swallowed up by it; not that He might not taste it, but that He might not perish in it; not in the subterfuge of punishments, but in the constant toleration of the same and in a strong and invincible liberation and victory.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXXII. Finally, it is asked here how Christ can be said to have been heard in that prayer from fear, as the apostle testifies, Heb. V:7 [“Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;”], and elsewhere Christ professes that he is always heard by the Father, Jn. XI:42, when nevertheless death had necessarily to be undergone by him. That which Christ willed simply and absolutely, in that he never suffered a refusal; but that which he willed only under a condition, it is no wonder if he did not obtain it, since that was not so much a will as it was velleity, and that was not so much to be reckoned a rational desire, which ought always to hold the primary place, as a natural inclination and sensitive appetite, which never has the principal role in prayer. 2. Christ was heard from the fear of death, not indeed absolutely, as if He had been freed from the necessity of undergoing death, but in a certain respect, namely, insofar as God, who heard Him, so shook off that fear that He received death most steadfastly and submitted Himself wholly to the divine will, and was thus strengthened so that He laid aside all dread of death. For Christ feared two things above all: 1. Lest He should succumb, overwhelmed by the evils which He saw to be most grievous. 2. Lest He should be swallowed up by death, so that no exit from it would be open. But God heard Him, that is, freed Him from both those fears: 1. Because He so corroborated Him by the power of His Spirit in the midst of the struggle that He most steadfastly and invincibly sustained that most grievous contest. 2. Because He freed Him from death, having loosed the pains of hell by His glorious resurrection; and thus, most truly, in this respect He was heard—not, indeed, that He might not pay the penalty of death, but that He might not be swallowed up by it; not that He might not taste it, but that He might not perish in it; not in the subterfuge of punishments, but in the constant toleration of the same and in a strong and invincible liberation and victory.”

— Francis Turretin, Disputations on the Satisfaction of Christ… (Geneva, 1666), 6th Disputation, which is the Fourth on the Truth of Christ’s Satisfaction, Asserted from his Agony and Desertion tr. AI by The Received Faith, sect. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXXII.+Finally%2C+it+is+asked+here+how+Christ+can+be+said+to+have+been+heard+in+that+prayer+from+fear%2C+as+the+apostle+testifies%2C+Heb.+V%3A7+%5B%E2%80%9CWho+in+the+days+of+his+flesh%2C+when+he+had+offered+up+prayers+and+supplications+with+strong+crying+and+tears+unto+him+that+was+able+to+save+him+from+death%2C+and+was+heard+in+that+he+feared%3B%E2%80%9D%5D%2C+and+elsewhere+Christ+professes+that+he+is+always+heard+by+the+Father%2C+Jn.+XI%3A42%2C+when+nevertheless+death+had+necessarily+to+be+undergone+by+him.+That+which+Christ+willed+simply+and+absolutely%2C+in+that+he+never+suffered+a+refusal%3B+but+that+which+he+willed+only+under+a+condition%2C+it+is+no+wonder+if+he+did+not+obtain+it%2C+since+that+was+not+so+much+a+will+as+it+was+velleity%2C+and+that+was+not+so+much+to+be+reckoned+a+rational+desire%2C+which+ought+always+to+hold+the+primary+place%2C+as+a+natural+inclination+and+sensitive+appetite%2C+which+never+has+the+principal+role+in+prayer.+2.+Christ+was+heard+from+the+fear+of+death%2C+not+indeed+absolutely%2C+as+if+He+had+been+freed+from+the+necessity+of+undergoing+death%2C+but+in+a+certain+respect%2C+namely%2C+insofar+as+God%2C+who+heard+Him%2C+so+shook+off+that+fear+that+He+received+death+most+steadfastly+and+submitted+Himself+wholly+to+the+divine+will%2C+and+was+thus+strengthened+so+that+He+laid+aside+all+dread+of+death.+For+Christ+feared+two+things+above+all%3A+1.+Lest+He+should+succumb%2C+overwhelmed+by+the+evils+which+He+saw+to+be+most+grievous.+2.+Lest+He+should+be+swallowed+up+by+death%2C+so+that+no+exit+from+it+would+be+open.+But+God+heard+Him%2C+that+is%2C+freed+Him+from+both+those+fears%3A+1.+Because+He+so+corroborated+Him+by+the+power+of+His+Spirit+in+the+midst+of+the+struggle+that+He+most+steadfastly+and+invincibly+sustained+that+most+grievous+contest.+2.+Because+He+freed+Him+from+death%2C+having+loosed+the+pains+of+hell+by+His+glorious+resurrection%3B+and+thus%2C+most+truly%2C+in+this+respect+He+was+heard%E2%80%94not%2C+indeed%2C+that+He+might+not+pay+the+penalty+of+death%2C+but+that+He+might+not+be+swallowed+up+by+it%3B+not+that+He+might+not+taste+it%2C+but+that+He+might+not+perish+in+it%3B+not+in+the+subterfuge+of+punishments%2C+but+in+the+constant+toleration+of+the+same+and+in+a+strong+and+invincible+liberation+and+victory.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%E2%80%A6+%28Geneva%2C+1666%29%2C+6th+Disputation%2C+which+is+the+Fourth+on+the+Truth+of+Christ%E2%80%99s+Satisfaction%2C+Asserted+from+his+Agony+and+Desertion+tr.+AI+by+The+Received+Faith%2C+sect.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d58f9f9b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8d58f9f9b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=XXXII.%20Finally%2C%20it%20is%20asked%20here,strong%20and%20invincible%20liberation%20and%20victory." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As God may by metaphor be said to will what by His will, properly speaking, He wills not; so He may by metaphor be said to will what He does will, properly speaking. Hence there is nothing to prevent the same thing being the object of the will of good pleasure and of the will of expression [sign]. But operation is always the same as the will of good pleasure; while precept and counsel are not; both because the former regards the present, and the two latter the future; and because the former is of itself the effect of the will; the latter its effect as fulfilled by means of another.</p></blockquote>

<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ . 1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following. 2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing. 3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation. 4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

C+effectively+obtain+any+object+whatsoever%2C+and+yet+does+not+will+to+obtain+it+effectively%2C+but+only+to+desire+it+ineffectively%3B+then+rather+it+is+a+perfection+of+the+will%2C+and+a+dominion+over+itself+and+over+its+power.+It+is+confirmed%2C+since+to+will+not+to+produce+other+worlds+is+not+an+imperfection%2C+but+rather+a+perfection%3B+therefore+likewise+to+will+not+to+produce+effectively+free+actions%2C+but+only+to+supply+to+them+a+sufficient+concurrence%2C+will+not+be+an+imperfection.+To+the+confirmation+it+is+answered%3A+if+the+desired+thing+is+not+obtained+on+account+of+a+defect+of+power%2C+or+if+the+desired+thing+increases+in+some+way+the+happiness+of+the+desiring+will%3B+then+not+to+obtain+that+thing+can+of+itself+sadden+and+afflict.+But+to+God+neither+is+there+lacking+power+to+obtain%2C+nor+is+the+happiness+of+God+increased+in+anyway+by+the+obtaining+of+the+desired+thing.+3.+The+second+objection+is%2C+that%3A+A+conditional+volition+is+proper+to+a+will+which+cannot+obtain+that+good+without+the+condition+appended%3A+just+as+a+conditional+will+of+retaining+wares+in+a+storm+%5Bon+the+sea%5D+is+proper+to+a+will+which+cannot+avoid+shipwreck+unless+a+jettison+of+the+wares+be+made.+It+is+confirmed%2C+because+that+will+of+the+merchant+would+effectively+preserve+the+wares%2C+if+he+could+without+danger%2C+or+inconvenience%2C+and+difficulty.+But+God%2C+without+danger%2C+inconvenience%2C+and+difficulty%2C+could+have+saved+all+men%2C+if+He+willed.+Therefore+neither+by+a+conditional+will+does+He+will+their+salvation.+4.+It+is+answered%3A+By+denying+the+first+antecedent.+For+although+the+will+be+omnipotent%2C+and+can+without+an+appended+condition+obtain+such+a+good%2C+nonetheless+most+wisely+and+most+powerfully+it+uses+a+conditioned+volition%2C+when+another+greater+good%2C+incompatible%2C+is+loved+by+an+efficacious+volition%2C+which+depends+on+the+aforesaid+condition.+But+the+%5Bproposed%5D+greater+good+is+a+better+administration+of+the+universe%2C+and+a+more+illustrious </figure><figure class="quote" id="q-3781e40148" data-kw="">
<blockquote><p>Prestige finds Christological perichoresis is no more than a“verbal formality,” adding nothing, and positively tending to monophysitism. My purpose hereis to propose the opposite view: Contra Prestige, Christology in the Damascene is actually anti-monophysite by design. Prestige on perichoresis is no longer tenable on three crucial points: 1) the meaning of perichoresis, 2) the philosophic background of perichoresis, and 3) the provenance of trinitarian perichoresis. None of these contentions is new, yet the implications of them taken together have not been fully realized in regards to the Damascene’s Christology. Contra Prestige, 1) the meaning “interpenetration” is early, not late, 2) the philosophic milieu is predominantly Stoic, not Aristotelian, and 3) the progenitor of trinitarian perichoresis is John of Damascus, not Pseudo-Cyril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/scott-ables.html">Scott Ables</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Anti-Monophysite Trinitarian Christology of John of Damascus’ a paper read at NAPS, Annual Meeting, Chicago (2010)</cite>, pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-persons.html">The Persons</a></span></div>
<div class="actions"><button class="copy" data-copy="“Prestige finds Christological perichoresis is no more than a“verbal formality,” adding nothing, and positively tending to monophysitism. My purpose hereis to propose the opposite view: Contra Prestige, Christology in the Damascene is actually anti-monophysite by design. Prestige on perichoresis is no longer tenable on three crucial points: 1) the meaning of perichoresis, 2) the philosophic background of perichoresis, and 3) the provenance of trinitarian perichoresis. None of these contentions is new, yet the implications of them taken together have not been fully realized in regards to the Damascene’s Christology. Contra Prestige, 1) the meaning “interpenetration” is early, not late, 2) the philosophic milieu is predominantly Stoic, not Aristotelian, and 3) the progenitor of trinitarian perichoresis is John of Damascus, not Pseudo-Cyril.”

<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

<blockquote><p>I. Should the root of all possibility and impossibility be rightly established in God Himself? Affirmative.</p></blockquote>

— Andreas Essenius, ‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653), Appendix Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Should+the+root+of+all+possibility+and+impossibility+be+rightly+established+in+God+Himself%3F+Affirmative.%E2%80%9D%0A%0A%E2%80%94+Andreas+Essenius%2C+%E2%80%98Theological+Disputation+on+the+Image+of+God+in+Man%E2%80%99+Download+tr.+Jonathan+Tomes+%28Utrecht%3A+Johannes+Waesberg%2C+1653%29%2C+Appendix+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1439f7a282.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1439f7a282.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-possibilities-hypotheticals/#:~:text=I.%20Should%20the%20root%20of%20all,rightly%20established%20in%20God%20Himself%3F%20Affirmative." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6df0d8e330" data-kw="">
<blockquote><p>1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio… (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0fece944ba" data-kw="">
<blockquote><p>potentia absoluta: absolute power; the omnipotence of God limited only be the law of noncontradiction. According to his potentia absoluta, God can effect all possibility, constrained only by his own nature. Things which are by nature evil and either impossible or noncompossible things (like square circles) fall outside of the realm of God’s power. The term emphasizes the transcendence and omnipotence of God by setting God even above and beyond the laws he has ordained for the operation of his universe…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms (Baker, 1985)</cite>, p. 231</span></figcaption>

</figure><figure class="quote" id="q-e9cfb29190" data-kw="">
<blockquote><p>While Rutherford in questions one to seven of his ‘Disuisitiones metaphysicae’ quoted Bradwardine without expressing any criticism, Leydekker distanced himself from what he considered to be Bradwardine’s voluntarism. According to Leydekker, Bradwardine grounded impossibility in the will of God. Leydekker preferred instead to view the power of God, not His will, as the foundation of possibility and impossibility… Voetius had been more cautious about ascribing a voluntarist position to Bradwardine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-bradwardine.html">Thomas Bradwardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Cause of God</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“While Rutherford in questions one to seven of his ‘Disuisitiones metaphysicae’ quoted Bradwardine without expressing any criticism, Leydekker distanced himself from what he considered to be Bradwardine’s voluntarism. According to Leydekker, Bradwardine grounded impossibility in the will of God. Leydekker preferred instead to view the power of God, not His will, as the foundation of possibility and impossibility… Voetius had been more cautious about ascribing a voluntarist position to Bradwardine.”

</figure><figure class="quote" id="q-e53b90bc25" data-kw="">
<blockquote><p>But this negative will in God is nothing other than that act of the will by which, most perfectly willing himself, he is averse to everything adverse to him and to his glory, which is the only end of all things… He does this so thoroughly, that by most perfectly willing his own goodness, he is also most perfectly averse to whatever is adverse to him… Thus, God’s negative will is occupied with what is evil in its own nature, not only because it is adverse to the norm of acting set before it by God, but also [insofar as it has not been decreed] because it could not be directed by the power of the creatures to a truly good end… Even if an evil does not exist, or never will, God is still adverse to it, as it is inimical to his nature, since he would abolish and destroy it if it existed, just as he loves a good that will never exist, because, as it is congruent to his own goodness, if it existed he would conserve it, cherish it, and so forth.</p></blockquote>

</figure><figure class="quote" id="q-759465c850" data-kw="">
<blockquote><p>Other affections which are given to God metaphorically, and by an anthropopathy are 1. Anger, and its contrary, complacency or gentleness, which are improperly in God, for He is neither pleased nor displeased; neither can a sudden either pertubation or tranquillity agree to God; but by these the actions of God are declared, which are such as those of offended and pleased men are wont to be; viz. God by an eternal and constant act of his will approves obedience, and the purity of the creature, and witnessses that by some sign of his favor, but abhors the iniquity and sin of the same creature and shows the same, by inflicting a punishment, not less severe, but far more just than men are wont to do when they are hot with anger, Ex. 32:10, ‘Now therefore, let Me alone, that my wrath may wax hot against them, and that I may consume them…&#x27;</p></blockquote>

</figure><figure class="quote" id="q-860e8e6f5a" data-kw="">
<blockquote><p>…his virtues follow; which as they have their seat in man, in the will and affections, so it is not inconvenient for method’s sake to refer them to the same in God. Gods virtues are his essence considered, as it always works orderly, fitly and agreeably to perfect reason. They are not things differing from his essence as in us, but we must conceive of them according to our capacity, and handle them distinctly. By virtues we understand first in general the idea of virtue, or the chiefest moral perfection, by which God is in Himself absolutely the best, and in respect of which all the virtues of angels and men are only slender shadows and representations.</p></blockquote>

<blockquote><p>…according to the common saying of Gregory of Nazianzus, since these affections are attributed to God in a human way, they must be understood in a way worthy of God, according to the effective operation rather than the affection. … XXI. …Second, the virtues, so different in us, denote in God a single readiness in acting, which readiness coincides with his essence… And fourth, those virtues that remain and involve no imperfection are to be left for God in such a way that we conceive of them with the highest eminence of perfection.</p></blockquote>

</figure><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions</cite>, p. 454</span></figcaption>

</figure><figure class="quote" id="q-156de09ab1" data-kw="">
<blockquote><p>Now it is usual to understand it [grace] principally in two ways: either affectively (as they say), i.e., with respect to the ‘internal act’ in God; or effectively, with regard to the effects which it produces outwardly in the creatures. The former is toward us, and we stand objectively related to it; the latter is in us, and we stand subjectively related to it.</p></blockquote>

</figure><figure class="quote" id="q-05df01efa5" data-kw="">
<blockquote><p>We may be reminded that the [Westminster] Confession declares God to be ‘without passions.’ So the theologians tell us that we must ascribe to Him no ‘passive powers’; for then He would not be immutable. He acts on everything, but is acted on by none. He is the source, but not the recipient of effects. This is indisputable. But we should not so overstrain the truth as to reject two other truths. One is, that while God has no passions, while He has no mere susceptibility such that his creature can cause an effect upon it irrespective to God’s own will and freedom, yet He has active principles. These are not passions, in the sense of fluctuations or agitations, but none the less are they affections of his will, actively distinguished from the cognitions in his intelligence. They are true optative functions of the divine Spirit. However anthropopathic may be the statements made concerning God’s repentings, wrath, pity, pleasure, love, jealousy, hatred, in the Scriptures, we should do violence to them if we denied that He here meant to ascribe to Himself active affections in some mode suitable to his nature. And it is impossible for us to suppose an agent without active principles, as well as cognitive, as we could not believe that the compass could move the ship without any motive power. The other truth is, that objective beings and events are the real occasions, though not efficient causes, of the action both of the divine affections and will. Are not many divines so much afraid of ascribing to God any ‘passive powers,’ or any phase of dependence on the creature, that they hesitate even to admit that scriptural fact? But why should they recoil from the simple statements of his Word on this point, unless they were confused or misled by the old sensualistic view, which regarded the objective impression as somehow the efficient, instead of the mere occasion, of the following activities of the percipient soul: “God is angry with the wicked every day” (Ps. 7:11); “But the thing that David had done displeased the Lord;” “My delight is in her” (Is. 62:4); “In these things I delight, saith the Lord” (Jer. 9:24). Is all this so anthropopathic as not even to mean that God’s active principles here have an objective? Why not let the Scriptures mean what they so plainly strive to declare? But some seem so afraid of recognizing in God any susceptibility of a passive nature that they virtually set Scripture aside, and paint a God whose whole activities of intelligence and will are so exclusively from Himself that even the relation of objective occasion to Him is made unreal, and no other is allowed than a species of coincidence or preëstablished harmony. They are chary of conceding (what the Bible seems so plainly to say) that God is angry because men sin; and would go no farther than to admit that somehow He is angry when men sin, yet, because absolutely independent, angry only of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions, vol 1, ‘God’s Indiscriminate Proposals of Mercy’</cite></span></figcaption>

<blockquote><p>The second part of the division, however, that between ‘proper’ and ‘figurative,’ is the point of distinction between the affections and all of the attributes discussed previously [life, intellect, will, righteousness, truth, pwer, glory, etc.]. For the affections of the divine will or, as they are sometimes called, divine virtues, are attributed to God, not properly, but figuratively… The affections are, therefore, either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. … …the [reformed] orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions… …This, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept… A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.433 433. [William] Ames, Marrow, I.iv.63… the point of the theological argument is that God act[s] but is not acted upon. The Reformed orthodox understanding of God, in accord with the greater part of the Christian tradition, assumes the divine immutability, and, typically, denies change and, certainly, acquired qualities to God. … The divine affections… are divine perfections that have some analogy to the dispositions or habits of the human will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post Reformation Reformed Dogmatics 2nd ed. (Baker Academic, 2003), vol. 3</cite>, ch. 6.3, ‘The Divine Affections &amp; Virtues’, pp. 551-89; pp. 552-7</span></figcaption>

</figure><figure class="quote" id="q-33ef8d9b22" data-kw="">
<blockquote><p>For if a lord also is not so called unless when he begins to have a slave, that appellation likewise is relative and in time to God; for the creature is not from all eternity, of which He is the Lord. How then shall we make it good that relative terms themselves are not accidental, since nothing happens accidentally to God in time, because He is incapable of change, as we have argued in the beginning of this discussion? Behold! To be the Lord is not eternal to God; otherwise we should be compelled to say that the creature also is from eternity, since He would not be a lord from all eternity unless the creature also was a servant from all eternity… Certainly to be the Lord of man happened to God in time. And that all dispute may seem to be taken away, certainly to be your Lord, or mine, who have only lately begun to be, happened to God in time. How then shall we make it good that nothing is said of God according to accident, except because nothing happens to His nature by which He may be changed, so that those things are relative accidents which happen in connection with some change of the things of which they are spoken. As a friend is so called relatively… how much more easily ought we to admit, concerning that unchangeable substance of God, that something may be so predicated relatively in respect to the creature, that although it begin to be so predicated in time, yet nothing shall be understood to have happened to the substance itself of God, but only to that creature in respect to which it is predicated? Lord, it is said, ‘You have been made our refuge.’ God, therefore, is said to be our refuge relatively, for He is referred to us, and He then becomes our refuge when we flee to Him; pray does anything come to pass then in His nature, which, before we fled to Him, was not? In us therefore some change does take place; for we were worse before we fled to Him, and we become better by fleeing to Him: but in Him there is no change… Therefore that which begins to be spoken of God in time, and which was not spoken of Him before, is manifestly spoken of Him relatively; yet not according to any accident of God, so that anything should have happened to Him, but clearly according to some accident of that [thing or person], in respect to which God begins to be called something relatively… that what is said may be said in that way in which it can be comprehended by human affections. So also, when He is said to be angry with the unrighteous, and gentle with the good, they are changed, not He: just as the light is troublesome to weak eyes, pleasant to those that are strong; namely, by their change, not its own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity, bk. 5, ch. 16, ‘What is Said of God in Time, is Said Relatively, Not Accidentally’</cite></span></figcaption>

</figure><figure class="quote" id="q-a40b1cfd32" data-kw="">
<blockquote><p>…It is evident that power is in truth attributed to God in relation to things made, not in relation to action, except according to our way of understanding…</p></blockquote>

</figure><figure class="quote" id="q-baff700da8" data-kw="">
<blockquote><p>Now, since power is proper to God in relation to His effects, and since power, as was said, has the character of a principle, and since principle expresses relationship to that which proceeds from it, it is evident that something can be said of God relatively, with regard to His effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Gentiles, Bk. 2, On Creation | 11. ‘That Something is Said of God in Relation to Creatures’</cite></span></figcaption>

</figure><figure class="quote" id="q-d0708031ae" data-kw="">
<blockquote><p>Now, these relations which refer to God’s effects cannot possibly exist in Him really. [2] For they cannot exist in Him as accidents in a subject, since there is no accident in Him… Neither can they be God’s very substance… so that God’s substance would then have to be referred to something else. But that which is essentially referred to another depends upon it in a certain way, since it can neither be nor be understood without it. Hence, it would follow that God’s substance would depend on something else extrinsic to it, so that He would not be, of Himself, the necessary being… Therefore, such relations do not really exist in God. Furthermore, we observe that whatever receives something anew must be changed, either essentially or accidentally. Now, certain relations are predicated of God anew; for example, that He is Lord or Governor of this thing which begins to exist anew. Hence, if a relation were predicated of God as really existing in Him, it would follow that something accrues to God anew, and thus that He is changed either essentially or accidentally;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Gentiles, Bk. 2, On Creation | 12. ‘That relations predicated of God in reference to creatures do not really exist in Him’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now, these relations which refer to God’s effects cannot possibly exist in Him really. [2] For they cannot exist in Him as accidents in a subject, since there is no accident in Him… Neither can they be God’s very substance… so that God’s substance would then have to be referred to something else. But that which is essentially referred to another depends upon it in a certain way, since it can neither be nor be understood without it. Hence, it would follow that God’s substance would depend on something else extrinsic to it, so that He would not be, of Himself, the necessary being… Therefore, such relations do not really exist in God. Furthermore, we observe that whatever receives something anew must be changed, either essentially or accidentally. Now, certain relations are predicated of God anew; for example, that He is Lord or Governor of this thing which begins to exist anew. Hence, if a relation were predicated of God as really existing in Him, it would follow that something accrues to God anew, and thus that He is changed either essentially or accidentally;”

"_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[4] Having proved that these relations have no real existence in God, and yet are predicated of Him, it follows that they are attributed to Him solely in accordance with our manner of understanding, from the fact that other things are referred to Him. For in understanding one thing to be referred to another, our intellect simultaneously grasps the relation of the latter to it, although sometimes that thing is not really related. [5] And so it is evident, also, that such relations are not said of God in the same way as other things predicated of Him. For all other things, such as wisdom and will, express His essence; the aforesaid relations by no means do so really, but only as regards our way of understanding. Nevertheless, our understanding is not fallacious. For, from the very fact that our intellect understands that the relations of the divine effects are terminated in God Himself, it predicates certain things of Him relatively; so also do we understand and express the knowable relatively, from the fact that knowledge is referred to it.</p></blockquote>

<blockquote><p>[Attributes of God are classified] Into Absolute and Relative, which imply a Relation to the creatures with Himself, and are founded in Absolutes. Thus an Absolute Attribute of God is Goodness, but a Relative Attribute is Mercy, which pertains to the Goodness of God, but additionally involves a regard to a miserable creature. Immensity is an Absolute Attribute, but Omnipresence is Relative, because it indicates a relation to created things, in all which it asserts the presence of God. Vindictive Justice is a Relative Attribute, indicating a relation to a creature, sinful and worthy of punishment; but it is founded in an Absolute Attribute, divine Holiness. And so, although that relation did not obtain before the things were created, nevertheless the Relative Attributes are able truly to be said to be Essential to God, because they are always applicable to God with respect to their foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/berhardinus-de-moor.html">Berhardinus De Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuous Commentary on Johannes a Marck (1761-1772), IV:19, ‘Classification of God’s Attributes: Absolute &amp; Relative’</cite></span></figcaption>

</figure><figure class="quote" id="q-dee57a070d" data-kw="">
<blockquote><p>Some [attributes] are said absolutely concerning God, as all the preceding attributes. Others relatively, which relation is two-fold: either with respect to the persons among themselves, as the Father, the Son, and the Holy Spirit, or with respect of the creatures to God, as Creator, Savior, Lord, King, etc. Here it is asked, whether all these things were in God from eternity past. Response: All those things that are attributed to God absolutely are eternal, even those that are spoken relative to the very persons, as shall be proven afterwards against the heretics – Arians, Samosatensians, etc. The difficulty, therefore, remains only in those which are spoken concerning God with respect to the creatures, concerning which we respond, if we consider the foundation of the relation, such as the power to create, to conserve, to reign, etc, this also is eternal, because it is referred to the absolute: but if we consider the formal relation, that is added in time: for God was not an actual creator until he had created things. Objection: But then it is stated that something was added to God; and therefore, some change was also done in Him. Response: That relation, with respect to God, is not real; but it is only so with respect to the creature. For to the creature, something real is added, and not to God; but only some notional concept. Augustine compares it to a coin: when it becomes a pledge, nothing is really added to the coin; but to the man who accepts it, something is really added. Thomas compares it to a column, which is to my right: when I turn to that side, still nothing is really added to the column; but only to the man, who turns himself toward it in this or that way, does any change take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Johannes Hornbeek, Institutes 3.9 trans. Charles Johnson</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-95fb5874b7" data-kw="">
<blockquote><p>The more principal Relative Attributes are in number seven: 1. Creation. 2. Providence. 3. Lordship. 4. Benignity. 5. Mercy. 6. Redemption. 7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, Of the Divine Essence</cite>, pp. 10-11</span></figcaption>

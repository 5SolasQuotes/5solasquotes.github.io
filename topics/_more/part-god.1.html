<div class="actions"><button class="copy" data-copy="“The more principal Relative Attributes are in number seven: 1. Creation. 2. Providence. 3. Lordship. 4. Benignity. 5. Mercy. 6. Redemption. 7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.”

— John Norton, The Orthodox Evangelist… (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 10-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+more+principal+Relative+Attributes+are+in+number+seven%3A+1.+Creation.+2.+Providence.+3.+Lordship.+4.+Benignity.+5.+Mercy.+6.+Redemption.+7.+Justice.+To+which%2C+or+some+of+which%2C+the+rest+of+like+nature+may+conveniently+be+referred.+Though+the+terms+Creator%2C+Governor%2C+Redeemer+and+Lord+do+more+clearly+hold+forth+the+relation+between+God+and+the+creature%2C+yet+%28after+others%29+the+fore-named+terms+are+here+made+use+of%3A+both+as+sufficiently+containing+the+relation+and+better+conducing+to+teach+the+doctrine+intended.+A+new+Relative+Attribute+or+praedication+does+not+always+presuppose+a+change+in+that+thing+unto+which+that+new+relation+is+given%2C+though+it+always+presupposes+a+change+in+that+whereunto+such+relation+does+really+belong%3A+for+example+sake%3A+Peter+may+sit+at+the+right+hand+of+John+without+any+change+in+Peter%2C+the+change+being+only+in+John+who+places+himself+at+Peter%E2%80%99s+left+hand.+The+princes+are+said+to+stand+on+the+right+hand+of+the+wall%2C+Neh.+12%3A31%2C+without+any+change+in+the+wall%3B+the+change+was+only+in+them+so+placing+themselves.+So+God+who+was+not+a+Creator+from+eternity%2C+is+a+Creator+in+time%3A+yet+this+new+appellation+puts+no+change+in+God%2C+but+only+in+the+creature.+The+Second+Person+who+was+not+incarnate+from+eternity%2C+becomes+incarnate+in+the+fulness+of+time%2C+yet+without+any+change%3A+the+change+was%2C+and+is+only+in+the+human+nature+assumed%2C+not+in+the+divine+nature+assuming.+In+these+Relative+Attributes+%28the+Creator+being+above+the+order+of+the+creature%29%2C+the+extremes+not+being+alike%2C+the+relation+is+not+alike.+The+relation+on+Gods+part+is+only+a+relation+of+reason%3A+that+is%2C+such+a+respect+of+the+Creator+to+the+creature%2C+as+is+without+any+change+in+Him%3A+but+on+the+creature%E2%80%99s+part%2C+it+is+a+real+relation%3A+that+is%2C+such+a+relation+as+infers+a+change+in+it.+Relative+Attributes+add+a+new+predication+or+title+to%2C+but+cause+no+real+mutation+or+change+in+God%3A+as+concerning+the+creature%2C+they+both+add+a+new+predication+to+it+and+cause+a+real+mutation+in+it.+In+all+Relative+Attributes+there+are+considerable+%28but+especially+in+Creation%2C+Providence+and+Redemption%29+an+eternal+immanent+act%2C+whereby+God+wills+such+a+thing+to+be%3B+and+a+transient+temporal+act%2C+whereby+He+works+the+thing+according+to+his+will.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+Of+the+Divine+Essence%2C+pp.+10-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95fb5874b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95fb5874b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=The%20more%20principal%20Relative%20Attributes%20are,the%20thing%20according%20to%20his%20will." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-9997402f31" data-kw="">
<blockquote><p>The properties of God are either absolute or relative. The absolute properties of God are such as may be considered without the supposition of any thing else whatever, towards which their energy and efficacy should be exerted. His relative are such as, in their egress and exercise, respect some things in the creatures, though they naturally and eternally reside in God. Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined, ch. 2, ‘Of the Nature of God’</cite>, p. 93 in Works, vol. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>The absolute goodness of God, as it is the excellency of his nature, is the object of praise: the relative goodness of God, as He is our benefactor, is the object of thankfulness.</p></blockquote>

</figure><figure class="quote" id="q-4fcad14e0a" data-kw="">
<blockquote><p>Besides, creation is the only first discovery of his dominion. Before the world was framed there was nothing but God Himself, and, properly, nothing is said to have dominion over itself; this is a relative attribute, reflecting on the works of God; He had a right of dominion in his nature from eternity, but before creation He was actually Lord only of a nullity; where there is nothing it can have no relation; nothing is not the subject of possession nor of dominion. There could be no exercise of this dominion without creation: what exercise can a sovereign have without subjects? Sovereignty speaks a relation to subjects, and none is properly a sovereign without subjects. To conclude: from hence does result God’s universal dominion; for being Maker of all, He is the ruler of all, and his perpetual dominion; for as long as God continues in the relation of Creator, the right of his sovereignty as Creator cannot be abolished.</p></blockquote>

</figure><figure class="quote" id="q-c7a35ec843" data-kw="">
<blockquote><p>Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (Baker, 2003), pt. 2, ch. 6.3, 3. ‘Doctrinal Conclusions’</cite>, pp. 559-60</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.”

</figure><figure class="quote" id="q-6f12ebe81a" data-kw="">
<blockquote><p>First, in general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that He is God. He that is not perfect in Himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and has no farther desire for supply. He who is blessed in Himself is all-sufficient for Himself. If God want or desire any thing for Himself, He is neither perfect nor blessed. To ascribe, then, affections to God properly [as his Socinian opponent does]… is to deprive Him of his perfection and blessedness. 1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose.^ The proper actings of affections lie between these two ; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. ‘He worketh all things after the counsel of his own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12</cite>, p. 109</span></figcaption>

ism+Examined+in+Works%2C+vol.+12%2C+p.+109&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f12ebe81a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f12ebe81a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=First%2C%20in%20general%2C%20that%20God%20is,the%20counsel%20of%20his%20own%20will.%27" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-51e13b3efd" data-kw="">
<blockquote><p>To the love of God belong what may be called his desires or wishes, etc. Now it is the absence of good which excites desire; but since God enjoys all good, it is plain that desire cannot properly apply to Him; yet it is frequently attributed to Him in scripture, and to this may be referred all those passages in which God is introduced speaking to this effect: “O that my people had hearkened unto me.” (Ps. 81:14; Isa. 48:14; Lk. 19:42) Therefore this desire in God denotes, that man’s obedience is highly pleasing to him, and that He will not pass it by unrewarded; at the same time it points out man’s duty, and his great wickedness in not discharging this duty. To this desire is opposed aversion, by which God is said to loathe sin, and to have no pleasure in the destruction of the creature. From what has been said, we clearly see what ideas we ought to have of the hope of God, of his joy, sorrow, jealousy, etc. Hope or expectation in God, intimates that the thing is due to Him. Thus when He said that He “looked that his vineyard should bring forth grapes,” (Isa. 5:2) He meant that the vineyard owed him fruit, and could not be fruitless without sin. God is said to rejoice when anything is pleasing to Him; and also when He performs anything which displays his glory, as when He does good to his people, or when He punishes the rebellious and ungodly. (Deut. 28:63; 30:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology (d. 1724), bk. 2, ch. 5</cite>, p. 87</span></figcaption>

</figure><figure class="quote" id="q-a2ed7839fd" data-kw="">
<blockquote><p>The passions of the [human] soul are perfections in those, in which it is a perfection to seek what is lacking, and to flee what is hurtful: they are not perfections in Him, whose Will is satisfied only with His own Sufficiency; and who is not able to receive from another source any good that He might desire, and whom no evil is able to threaten, that He should fear; therefore, nothing is able to be presented to Him, by the impulse of which His Will might be moved from its immovable state.</p></blockquote>

<blockquote><p>…love consists in a certain agreement of the lover with the object loved, while hatred consists in a certain disagreement or dissonance. Now we should consider in each thing, what agrees with it, before that which disagrees: since a thing disagrees with another, through destroying or hindering that which agrees with it. Consequently love must needs precede hatred; and nothing is hated, save through being contrary to a suitable thing which is loved. And hence it is that every hatred is caused by love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1 | Question 29, ‘Of Hatred’ | Article 2, ‘Whether Love is a Cause of Hatred? [Yes]’</cite></span></figcaption>

<blockquote><p>It is impossible for an effect to be stronger than its cause. Now every hatred arises from some love as its cause… Therefore it is impossible for hatred to be stronger than love absolutely. But furthermore, love must needs be, absolutely speaking, stronger than hatred. Because a thing is moved to the end more strongly than to the means.</p></blockquote>

</figure><figure class="quote" id="q-3c63f3338a" data-kw="">
<blockquote><p>Hence the movement of anger has a twofold tendency: viz. to vengeance itself, which it desires and hopes for as being a good, wherefore it takes pleasure in it; and to the person on whom it seeks vengeance, as to something contrary and hurtful, which bears the character of evil.</p></blockquote>

</figure><figure class="quote" id="q-5f2f93fce0" data-kw="">
<blockquote><p>We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa (d. 1274), pt. 1, quest. 20, art. 1, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-c1d9e3c658" data-kw="">
<blockquote><p>Again, it is asked about what is said, “And God is called angry; but there is no anger in Him.” For He seems to speak wrongly, because in God there is a rational and a concupiscible power: therefore by equal reason an irascible power must be posited in God: therefore just as the act of cognition and love is truly in Him, so properly is the act of fury. I answer: It must be said that the irascible [power] in some way sounds of imperfection by the definition of its name; and therefore some say that it is in no way received in God, not even transumptively. However, since the acts of this power in us are to glory and to dominate, and these are in God; why not similarly this power? And it must be said therefore that in God there is truly this power of glorying and dominating, which is the divine substance itself. However, because anger has a passion conjoined to it by the definition of its name, therefore neither the irascible [power] nor anger is received in God, except transumptively and in tropical speech. And it is to be noted that God has signs of anger, not which signify anger in Him, but which signify anger in us and truly, when they are in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences (d. 1274), bk. 1, dist. 45, Doubt 10 tr. AI by The Faith Received</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

iv>
</figure><figure class="quote" id="q-eb652065a8" data-kw="">
<blockquote><p>Scripture attributes wrath to God throughout, and other passions also. It will be queried therefore in this place whether it pertains to God, and in what way. And first, the philosophers denied wrath to occur in God, as Epicurus denied and the Stoics, which we so grant, though we only minimally demonstrate [in what follows]. … True, therefore, is this judgment: Wrath does not properly occur in God by his nature, but concerning that, it is said in a human fashion. … We define, therefore, the wrath of God to be the eternal judgment, always like unto Himself, against a sinner.</p></blockquote>

<blockquote><p>18. Wrath signifies in God the just will to avenge an injury done or thought to Himself or his Church, Jn. 3:36; Rom. 1:18; 2:5. 19. It is attributed to Him not except as an anthropopathism to Himself; it denotes merely an effect, not an affection. … 24. Hatred also is in no way in God as a passion [or as something suffered], but rather this signifies three things: 1. a negation, or subtraction of the grace and benevolence of Himself by which He is compassionate on others and loves them unto eternal life; 2. the detestation of the hateful thing; 3. the decree to punish, and its execution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-tilenus.html">Daniel Tilenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Ordered Arrangement of Theological Disputations held in the Academy of Sedan, vol. 1 (1607)</cite>, p. 119-20</span></figcaption>

<blockquote><p>Whether hatred may properly pertain [competat] to God? It is denied. Whether wrath may properly pertain to God? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), pt. 1, tract 2, Attributes of God in Specific, 2nd Kind, subtitle 9, Appendix</cite></span></figcaption>

</figure><figure class="quote" id="q-f55f6f4391" data-kw="">
<blockquote><p>Properly, in the sense by him [Mr. Biddle] pointed to, anger, wrath, etc., are not in God… If He be properly and literally angry and furious, and wrathful, He is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. 4. Mr. Biddle [a Socinian] has given us a rule in his preface, that when any thing is ascribed to God in one place which is denied of Him in another, then it is not properly ascribed to Him. Now, God says expressly that ‘fury’ or anger ‘is not in Him,’ Isa. 27:4; and therefore it is not properly ascribed to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, pp. 111-12, 114-5</cite>, p. 112</span></figcaption>

</figure><figure class="quote" id="q-c2a28cfe76" data-kw="">
<blockquote><p>Of love, mercy, and grace, the condition is something otherwise: principally they denote God’s essential goodness and kindness, which is eminent amongst his infinite perfections; and secondarily the effects thereof… The apostle tells us that God is “blessed forever,” Rom. 9:5; “He is the blessed and only Potentate,” 1 Tim. 6:15; ‘God all-sufficient’ Gen. 17:1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can He be blessed, is He all-sufficient who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, pp. 111-12, 114-5</cite>, pp. 114-5</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of love, mercy, and grace, the condition is something otherwise: principally they denote God’s essential goodness and kindness, which is eminent amongst his infinite perfections; and secondarily the effects thereof… The apostle tells us that God is “blessed forever,” Rom. 9:5; “He is the blessed and only Potentate,” 1 Tim. 6:15; ‘God all-sufficient’ Gen. 17:1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can He be blessed, is He all-sufficient who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like?”

</figure><figure class="quote" id="q-c54d9e9900" data-kw="">
<blockquote><p>As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God, vol. 2 (Robert Carter, 1853), Discourse 11, ‘On the Holiness of God’</cite>, pp. 115-16</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…”

</figure><figure class="quote" id="q-b8f4313300" data-kw="">
<blockquote><p>The general notion of the divine holiness is, that it is that attribute whereby God loves, and is pleased with, and delighted in his own native purity and goodness, and loves all holiness and purity in his rational creatures, and perfectly hates and abhors all sin… The very first apprehension we have of God’s being holy, is that… there is no impurity, stain or fault in Him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologia Reformata: or, The Body and Substance of the Christian Religion, vol. 1 (1713), On the First Article of the Creed, Discourse 2, ‘The Divine Attributes’</cite>, p. 78</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The general notion of the divine holiness is, that it is that attribute whereby God loves, and is pleased with, and delighted in his own native purity and goodness, and loves all holiness and purity in his rational creatures, and perfectly hates and abhors all sin… The very first apprehension we have of God’s being holy, is that… there is no impurity, stain or fault in Him…”

<blockquote><p>Immutability is God without any alteration in respect of being, will or any accidents, Ps. 102:27-28; Mal. 3:6; Jam. 1:17, ‘With whom is no variableness, nor shadow of turning.’ Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: The liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed forever, though the creature had never been. Objection 2: God’s will in his decree and his will in the command are often contrary one unto another; therefore He is not immutable. Answer: No such thing. The decree determines what shall be; the command shows what ought to be. God’s willing the futurition of the betraying of Christ by Judas, and yet willing it to be Judas’s duty not to betray Christ, have not the least appearance of two wills in God. Objection 3: God sometime[s] promises and performs not: threatens and executes not; therefore He may seem not to be immutable. Answer: Such promises and threatnings are to be understood conditionally, not absolutely. See Jer. 18:7, 10. Objection 4: God in Scripture is often said to repent; He that repents is not immutable. Answer: Such speeches, though spoken after the manner of men for the help of our understanding, yet are to be understood as becomes the nature of God. God is therefore said to repent because He does as men do when they repent, that is, He changes his deeds: yet without any change of his will. Nay, those changes of his deeds are the executions of his unchangeable will.</p></blockquote>

</figure><figure class="quote" id="q-121e5da622" data-kw="">
<blockquote><p>Indeed, God is the idea of all things, both created and to be created, as He manifests His simple and perfect essence in them, though not equally or in the same degree. Just as this essence shines more brightly in animate beings than in inanimate ones, so it is most perfectly reflected in man. While other creatures were given only a trace or shadow of His being, in which His eternal power and divine nature can be read (ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης), as Romans 1:20 states, man was endowed with His image, reflecting His most perfect nature, and with faculties and qualities that are somewhat shared with God but not with other creatures. This is why, concerning man’s creation, it is said that not merely a general notion of God was involved, but a deliberate consultation and agreement of the entire Holy Trinity, as Genesis 1:27 indicates. I. …the phrases “man created in the image of God” and “the image of God in man” essentially mean the same thing. The former suggests that the Divine Essence, which knows the nature of man as a species that can be expressed or imitated, serves as the model or objective image. The latter indicates something consequent to that model, which will be called the subjective image, in which the Creator willed His glory to be seen as in a mirror, as Calvin states in his Institutes (Book 2, Chapter 12, Sections 5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653)</cite></span></figcaption>

</figure><figure class="quote" id="q-5605f5b4f9" data-kw="">
<blockquote><p>O you who are the framer of the lands and sky, who bid time to go forth from eternity, and, remaining stable, give all things to be moved; whom no external causes compelled to fashion the work of fluctuating matter, but the form of the highest good, inherent and without envy. You draw all things from a supernal example, yourself most beautiful, bearing a beautiful world in your mind, and forming it in a similar image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin | For just as an artisan acting outside himself looks at some exemplar, according to which he operates, and which he expresses in his work, conformably to that which is read in Ex. 25:40; Heb. 8:5, “Look that you make them after their pattern, which was showed you in the mount”: so God, beholding his own essence, the exemplar and fount of all perfections, and beholding the ideas or reasons of all things, expresses them as He pleases; which Boethius, On the Consolation of Philosophy, 3, metro 9, elegantly explains, saying:</cite></span></figcaption>

</figure><figure class="quote" id="q-c92c072847" data-kw="">
<blockquote><p>You produce all things from a supernal example, i.e., from a perpetual exemplar: You Yourself most beautiful, elongated from all deformity, bearing in mind, i.e., in full memory, a beautiful world, namely, the archetype, forming it; and producing the sensible world itself in a similar image, as it was present in your mind.</p></blockquote>

<blockquote><p>Are there ideas? It is affirmed. Whether by necessity there are posited ideas in God? It is affirmed. Whether they are in God, or rather outside God? The prior is affirmed. Whether they are things themselves produced by God, so far by the divine intellect, is objected, that is, whether they have the rule of an object, in which, as it were, they are things known in the imagination by a creature? It is denied. Whether they are the effective causes of things, and indeed are first things and principles simply in their genus? It is affirmed. Whether every knowing or cognition of God indicates an idea? It is denied. Whether ideas are rightly divided into speculative and practical? It is denied. Whether ideas pertain to the speculative or rather to practical knowledge? The latter is affirmed. Whether the distinction of ideas into act and potential rightly explained is possible? It is affirmed. Whether all ideas in God are one and really the same with God? It is affirmed. Whether they are really the same amongst themselves or are really and intrinsically one idea? Affirm with a distinction. Whether ideas in God and in themselves are able and ought to be understood or investigated by us? It is denied. Whether ideas which are in the divine mind, through the first thing respect, so far, the singular nature, or the nature of the species? The latter is affirmed. Whether ideas are all which are known by God? It is denied. Whether evil may maintain an idea in God? It is denied with a distinction. [The reason is because evil is not a thing, or the form, species or genus of a thing, but a deficiency therefrom.] Whether impossibilities have ideas in God? It is denied. Whether prime matter [matter without form] has an idea in God? It is affirmed. Whether in God may be the idea of things which neither are, nor were, nor will be? It is affirmed. Whether accidents have an idea in God? It is distinguished. Whether singulars have an idea in God? It is affirmed.</p></blockquo </figure><figure class="quote" id="q-6c645220a5" data-kw="">
<blockquote><p>Controversies of the 1st Kind Whether the name ‘Jehova’ is predicated even of creatures? It is denied conta the Jews and Socinians. Whether this name may have known efficacy in performing miracles? It is denied against the Jews and magicians. Controversies of the 2nd Kind Whether this term [‘Jehova’] is plainly fictitious? It is denied. … Whether God is nameable by us? It is affirmed with a distinction. Whether any name has been imposed immediately by God? It is affirmed. Whether any spoken names of God are predicated of Him substantially? It is affirmed. Whether any names of God are properly spoken of Him or rather all are attributed metaphorically to Him? The prior is affirmed and the latter denied. Whether all the names of God are synonyms? It is affirmed with a distinction. Whether any names are spoken of God and the creatures univocally? It is distinguished. Whether on the supposition that they are spoken analogically, are they spoken first of God or of creatures? It is distingsuished. Whether any names are spoken of God in time? It is affirmed. Whether this name, ‘God’, is a name of nature or of operation? The prior is affirmed. Whether this term ‘God’ signifies his essence and nature or more his office, dignity and power? The prior is affirmed. Whether the name ‘God’ is attributed to God properly or appellatively? The prior is affirmed. Whether this name ‘God’ is incommunicable? It is denied with a distinction. … Whether Jehova is properly translated by the Greek [Septuagint] translators by the term Kurios [Lord]? It is denied with a distinction.</p></blockquote>

<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>

</div>
</figure><figure class="quote" id="q-f824daeec8" data-kw="">
<blockquote><p>The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews, II.88</cite></span></figcaption>

</figure><figure class="quote" id="q-8823651c54" data-kw="">
<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>

</figure><figure class="quote" id="q-adf6c5457c" data-kw="">
<blockquote><p>4. Benignity is God willing freely to communicate his grace and goodness unto his creatures proportionably to their several capacities, Ex. 33:19; Mt. 5:45; Ps. 33:5. Goodness according to some admits of a threefold consideration: Of nature, which is called perfection. Of manners, called holiness. Of beneficence, id est, a disposition to do good to others; this is properly called benignity: ‘Thou art good and doest good,’ Ps. 119:68. Goodness is either essential or by participation. God is essentially good: He is good of Himself, He is goodness itself: the creature is good by participation, i.e. by a goodness received of God. The sun, if compared with other creatures, you may say (in that respect) it has light of itself, but the moon and stars are light by participation: that is, they receive their light from the sun. God is a full fountain, or rather a fountain which is fulness itself; willing to communicate, as the sun sends forth its light, a fountain its streams and the prolifical virtue in plants, inclines them to fruitfulness; as the seminal virtue in living creatures disposes them to generation: the peculiar affection in parents towards their children renders them propense to do them good: and the soul full of matter (like wine which has no vent) propends to pour out itself; so is the Lord affected to do good according as He has willed concerning the creature. The goodness communicated from God unto the creature is either special, bestowed upon angels and men: Or common, bestowed upon the rest of the creation: ‘The earth is full of the goodness of the Lord,’ Ps. 33:5. The impression of his image is upon the reasonable, the impression of his footsteps is upon the unreasonable creature. God, who is the increated good, communicates Himself without division, effusion, or multiplication of Himself: all that He communicates, notwithstanding, He remains infinite and the same. God were God blessed forever though He had never willed of his goodness unto any, but if He were not a God of benignity, He were not our God. Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature: or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved; as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega, from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

<blockquote><p>Objection 1: Isa. 5:3, ‘O Inhabitants of Jerusalem, and ye men of Judah, judge between Me and my vineyard: what could I have done any more unto my vineyard that I have not done unto it? Why have I looked that it should bring forth grapes, and it bringeth forth wild grapes?’ These Jews therefore had the help of God which was thoroughly sufficient unto conversion and the leading of a life acceptable to God. Answer: God speaks in this place of the sufficiency of outward means, that is, of the preaching of his Word, of his benefits, and chastisements whereby they were sufficiently invited and led unto salvation, but that they were of such peevish and perverse dispositions. God therefore did that to this wicked vineyard, which if He had done in a good vineyard, it would have brought forth the fruit of obedience. And here He speaks not of the sufficiency of inward grace, whereby an evil vineyard be changed into a good vineyard.</p></blockquote>

<blockquote><p>Mercy is, God willing, to succor the creature in misery. Mercy in God is either essential: namely that which is in Him by necessity of nature, and had been in Him though He had never willed the manifestation thereof by showing mercy to any; this is God’s sufficiency to show mercy. Or, Relative, namely, that which is in Him with respect to the creature, and is his will to manifest mercy to whom He pleases; Ex. 33:19; Rom. 9:18. Mercy is increated, viz. the attribute of God: or created, viz. a transient act of God in time, or the effects of such transient acts: so vocation is said to be an act of mercy, Rom. 11:30, 32; 1 Pet. 2:10. Remission of sin, Lk. 1:78; Mt. 18:33; Salvation, Jud. 21. Increated mercy is God’s will to show mercy. Created mercy is God’s actual showing mercy according to his will. The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>

<blockquote><p>But, on account of the impossibility of a fully adequate comprehension of God, nevertheless all conception of God is not to be denied to man, as if finite man is in no way able to form a concept of the infinite, as [Thomas] Hobbes [d. 1679] maintains, against whom Cocquius¹ disputes concerning this matter, in his Anatome Hobbesianismi, locus VI, chapter XII, pages 114-118… ¹ Gisbertus Cocquius (1630-1708) of Utrecht was a Reformed thinker and doctor of philosophy; he opposed Hobbes. Compare also Heidanus² in his Consideratien, etc., pages 134-138, upon occasion of this thesis, proscribed by the curators of the Academy of Leiden, that ‘Men have an adequate idea of God.’ ² Abraham Heidanus (1597-1678) was a Dutch Reformed minister and Cocceian theologian. He served as professor of theology at Leiden from 1648 to 1676, but he was ultimately dismissed for his Cartesianism.</p></blockquote>

</figure><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General</cite>, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-3e53347a13" data-kw="">
<blockquote><p>… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …</p></blockquote>

<div class="actions"><button class="copy" data-copy="“… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …”

— Gisbertus Voetius, (8) ‘Invisibility &amp; Incomprehensibility’ in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 4. Attributes of God in Specific, 1st Kind Abbr.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6+Whether+God+is+imaginable%3F+It+is+denied.+%E2%80%A6+Whether+we+know+God+immediately%2C+whether+in+this+life+or+in+the+future%3F+It+is+denied.+Whether+we+may+know+him+through+intelligible+species%3F+It+is+affirmed.+Whether+through+proper+species+or+indeed+through+species+of+creatures%3F+It+is+distinguished.+From+whence+are+those+species%3F+It+is+explained.+Whether+the+created+intellect+is+able+clearly+and+intuitively+to+see+the+essence+of+God%3F+It+is+denied.+Whether+the+created+intellect+is+able+to+comprehend+the+essence+of+God%3F+It+is+denied.+Whether+the+essence+of+God+is+seen+by+any+created+intellect+according+to+any+created+species%3F+It+is+denied.+%E2%80%A6+Whether+the+created+intellect+needs+an+intelligible+species+to+see+God%3F+It+is+affirmed.+Whether+the+created+intellect+needs+the+light+of+glory+to+see+God%3F+It+is+distinguished.+Whether+God+is+able+to+supply+the+activity+of+the+light+of+glory%3F+A+curious+question+Whether+above+natural+cognition+in+the+present+life+another+cognition+of+God+may+hold+through+grace%3F+It+is+affirmed.+Whether+all+beatific+visions+are+equally+perfect+essentially%3F+It+is+affirmed.+Whether+all+beatific+visions+are+equally+perfect+accidentally%3F+It+is+denied.+Whether+it+may+prove+that+one+vision+is+more+perfect+than+another%3F+It+is+explained+and+the+question+is+curious.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%288%29+%E2%80%98Invisibility+%26+Incomprehensibility%E2%80%99+in+Syllabus+of+Theological+Problems+%28Utrecht%2C+1643%29%2C+pt.+1%2C+section+1%2C+tract+2%2C+I.+%E2%80%98Of+God%E2%80%99%2C+4.+Attributes+of+God+in+Specific%2C+1st+Kind+Abbr.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e53347a13.html&amp;via=5 <blockquote><p>LIII. But though nothing from without be the cause of God’s volition, yet, since He wills that there should be order in things (which order is placed principally in this, that [iliae] some things be the causes of others) just so far as God’s volition is borne towards those objects, it is as if it were the cause of itself as it is borne towards others: (Hos. 2:21-22) Thus the cause why He wills the condemnation of anyone, is this, because He wills the order of his justice to be observed throughout the universe. (Jn 6:40; Dt. 7:8)… … LVI. 1. The Divine Will is borne towards its object, either according to the mode of Nature, or according to the mode of Liberty. According to the mode of Nature, it tends towards a primary and proper object, one that is suitable and adequate to its nature. According to the mode of Liberty, it tends towards all other things. Thus, God by a natural necessity wills Himself; but He wills freely all other things; (2 Tim. 2:13; Rev. 4:11) though the act which is posterior in order may be bound by a free act which is prior in order. This may be called “hypothetical necessity,” having its origin partly from the free volition and act of God, partly from the immutability of his nature. “For God is not unrighteous,” says the apostle,” to forget the work and labor of love” of the pious; because He has promised them a remuneration, and the immutability of his nature does not suffer Him to rescind his promises. (Heb. 6:10, 18) … LVIII… when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28)… … LXIII. 8. Lastly. God wills some things per se or [per accidens] accidentally. He wills per se, those things which are simply and relatively good; (2 Pet. 3:9; accidentally, those which are in some respect evil, but which have such good tbings united with them as He wills in preference to be respective good things which are opposed to those evil ones: thus, He wills the evils of punisbnient, because He would rather have the order of justice preserved in punishment, than suffer an offending creature to go unpunished. (Jer. 9:9; Ps. 50:21; Jer. 15:6) … LXVII. Love is an affection of union in God, the objects of which are God Himself and the good of justice or righteousness, the creature and its felicity. (Prov. 16:4; Ps. 11:7; Jn. 3:16; Wisdom 11:24-26) Hatred is an affection of separation in God, the object of which are the unrighteusness and misery of the creature. (Ps. 5:5; Eze. 25:11; Dt. 25:15-16, etc.; Isa. 1:24) But since God primarily loves Himself and the good of justice, and at the same moment hates iniquity; and since He loves the creature and its happiness only secondarily, and at the same moment [odio habet] dislikes the misery of the creature; (Ps. 11:5; Dt. 28:63) hence it comes to pass, that He hates a creature that pertinaciously perseveres in unrighteousness, and He loves its misery. (Isa. 66:4) LXVIII. Goodness in God is an affection of communicating his own good. (Rev. 4:11; Gen. 1:31) Its first object [ad extra] outwards is nothing; and thus necessarily the first, that, [illo sublato] on its removal, there can be no [ad extra] outward communication. The first [progressus] advance of this goodness is towards the creature as it is a creature; the second is towards the creature as it performs its duty, to communicate good to it beyond the remuneration promised. Both these procedures of the Divine goodness may appropriately receive the appellation of “Benignity.” The third advance is towards a creature that has sinned, and that has by such transgression rendered itself liable to misery. This advance is called Mercy, that is, an affection for affording succor to a person in misery, sin itself presenting no obstacle to its exercise. (Rom. 5:8; Eze. 16:6). … LXXV. Righteousness or Justice in God, is an eternal and constant will to render to every one his own: (Ps. 11:7) To God Himself that which is his, and to the creature what belongs to it. We consider this righteousness in its Words and in its Acts. In all its Words are found veracity and constancy; and in its Promises, fidelity. (2 Tim. 2:13; Num. 23:19; Rom. 3:4; 1 Thess. 5:24) With regard to its Acts, it is twofold, Disposing and Remunerative. The former is that according to which God disposes all the things in his actions through his own wisdom, according to the rule of equity which has either been prescribed or pointed out by his wisdom. The latter, [remunerative righteousness] is that by which God renders to his creatures that which belongs to it, according to his work through an agreement into which He has entered with it. (Heb. 6:10, 17-18; Ps. 145:17; 2 Thess. 1:6; Rev. 2:23)</p></blockquote>

<blockquote><p>…God, if we speak of his absolute power, without respect to his free decree, He could have pardoned sin without a ransom, and gifted all mankind and fallen angels with heaven, without any satisfaction of either the sinner or his Surety; for He neither punishes sin, nor tenders heaven to men or angels by necessity of nature–as the fire casts out heat, and the sun light—but freely:</p></blockquote>

</figure><figure class="quote" id="q-fa14bbf94e" data-kw="">
<blockquote><p>Redemption is that whereby God gave his Son; and Jesus Christ God-man gave Himself, and accordingly in due time became a ransom for the elect: whence it comes to pass that justice is no hinderance to the application of mercy, Jn. 3:16; Gal. 2:20; Rom. 3:26. … Though God by his absolute power might have saved man without redemption wrought by Christ, yet having constituted that rule of relative justice, ‘In the day that thou eatest thereof, thou shalt surely die,’ Gen. 2:17. He could not in respect of his power now limited to proceed by this rule, so that man having sinned, man must die and satisfy the Law that man may live. Justice requires the surety should die, that the debtor may live: That He might be just and the justifier of Him which believes in Jesus, Rom. 3:26. Justice is, God willing, to render unto the reasonable creature what is due thereunto according to his Word: whether by way of grace or punishment, Dt. 32:4; Dan. 9:16; 1 Jn. 1:9; Ps. 62:11-12. Justice in God is either essential, of the absolute nature of God; whence it is that God can do no wrong. To be in God essentially is to be in God by necessity of nature: that is, it is of the necessary Being of God, so as: if God is, that is; and if that were not, God were not. Or Relative: viz. the justice of God in respect of the creature: that is in God necessarily; this is in Him freely and is nothing else but God’s constant will to give unto the creature what is its due. The will of God is the rule of justice. That which God’s Law is unto man, that is God’s will unto Himself. Justice, consisting in rendering to every one their due; and God’s will being the rule of justice, it follows that and only that to be due unto man which God has willed concerning Him. The Moral Law itself, the Rule of Manners, the recompence contained in the promise in case of obedience, the punishment contained in the curse in case of disobedience: are all the effects of God’s free pleasure. It being a truth that God’s will is the rule of justice between Him and the creature: and consequently, that the desert and punishment of sin determined by Him is therefore just, because He has so determined. It follows that in case God had appointed a greater punishment, it had been just the damned should have suffered more: And in case He had appointed a lesser punishment, it had been just they should have suffered less. Though the rule of relative justice be a free constitution, yet God having constituted this rule, has freely obliged Himself to the observation thereof; and can now no more fail to execute justice according to this rule than He can be unjust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 14-15</span></figcaption>

<blockquote><p>30. It is said by some very learned and reverend men, that God freely made the world, though He necessarily made it good; He freely made positive laws, though He necessarily made them wisely and just; He freely annexes threatenings to his laws, though necessarily they are just threatenings; He freely sentences or judges, though He necessarily judge justly; He freely executes his sentence by punishing, though He necessarily punish justly. And the reasons given, are: 1. Because God executes his sentence as Dominus [Lord]. 2. Because his threatenings bind Him not to punish, but man to suffer.</p></blockquote>

</figure><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification… (Hague, 1655), thesis 5</cite>, pp. 12-13</span></figcaption>

<blockquote><p>13. Again (2) The Scripture every where points out the end of Christ’s coming and dying to have been to procure and obtain some good to man; it were endless to cite the Scriptures speaking this out plainly: But if it had been only to have procured a possibility, then the proper and immediate end of his dying had been only to have procured something to God, viz. a power to Him, that He might, without hurt to his justice, prescribe a possible way of salvation. Now, not to discuss that question agitated among orthodox divines, viz. whether it was impossible for God to have pardoned the sins of man without a satisfaction made by his Son, or not; meaning antecedently to a decree, determining this way of manifestation of the justice of God; only I must say that as yet I can see nothing from Scripture determining the egresses of the relative justice of God to be more essential to God, and less subject to the free determinations of his good will and pleasure, than are the egresses of his mercy; nor do I see any necessity for asserting this against the Socinians, seing our ground, walking upon a decree, is proof against all their assaults; far less see I any necessity of founding our whole debate with the Socinians upon that ground; yea I cannot but judge it the result of great imprudence so to do, seeing the Socinians may reply that the sole ground of that opposition to them is not only questioned, but plainly denied by such as we account orthodox and learned; and may hence gather that we have no other solid ground whereupon to debate with them but such as the learned of our own side overthrow. The depth’s of God’s Counsel are beyond our fathoming and it is hard for us to say hithertil the omnipotent can come, but not one ince further. I dare not be wise above what is writen and I would gladly see one passage of Scripture declaring this to have been in itself utterly impossible and inconsistent with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number... (Edinburgh: Cairns, 1678), ch. 8, ‘Of Universal Redemption’, p. 163 Brown was a disciple of Rutherford.</cite></span></figcaption>

h+as+the+learned+of+our+own+side+overthrow.+The+depth%E2%80%99s+of+God%E2%80%99s+Counsel+are+beyond+our+fathoming+and+it+is+hard+for+us+to+say+hithertil+the+omnipotent+can+come%2C+but+not+one+ince+further.+I+dare+not+be+wise+above+what+is+writen+and+I+would+gladly+see+one+passage+of+Scripture+declaring+this+to+have+been+in+itself+utterly+impossible+and+inconsistent+with+God.%E2%80%9D%0A%0A%E2%80%94+John+Brown+of+Wamphray%2C+Quakerism%3A+the+Pathway+to+Paganism%2C+or+a+View+of+the+Quakers%E2%80%99+Religion%2C+being+an+Examination+of+the+Theses+%26+Apology+of+Robert+Barclay%2C+one+of+their+Number...+%28Edinburgh%3A+Cairns%2C+1678%29%2C+ch.+8%2C+%E2%80%98Of+Universal+Redemption%E2%80%99%2C+p.+163+Brown+was+a+disciple+of+Rutherford.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F28a89c8f51.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/28a89c8f51.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-justice-of-god/#:~:text=13.%20Again%20%282%29%20The%20Scripture%20every,utterly%20impossible%20and%20inconsistent%20with%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally: 1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20). 2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment. 3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis). III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall: 1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.). 2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)? 3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God. 4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.</p></blockquote>

<blockquote><p>Immensity is God present everywhere, neither included in, nor excluded from any place or thing (Deus est sphaera, cujus centrum est ubique, circumferentia nusquam. Enter proesenter Deus hic et ubi{que} potenter), Ps. 139:7; Isa. 60:1. God is a sphere whose center is everywhere, the circumference nowhere. God is nowhere and God is everywhere: He is nowhere in that He is not contained anywhere; He is everywhere in that He contains all. Hence God in respect of his omnipresence is compared to an infinite point. God is in every place by his essence as the universal cause of the being and operation of all things, by his presence, beholding all things; and by his power upholding all things. Besides that omnipresence of God whereby He is always present with all creatures, there are certain peculiar ways of his presence with diverse creatures. In Christ He dwells bodily, that is, personally, Col. 2:9, and fills the manhood with the Spirit out of measure, Jn. 3:34. In the saints He dwells as in his temple by the presence of his indwelling Spirit, the effect of his special grace, 1 Cor. 3:16. He is said to dwell in Heaven because it is the place wherein He is pleased to manifest his glory immediately and in most excellent manner unto the blessed. God is said to come to us and depart from us, not in respect of his universal presence or change of place, but in respect of the degrees of his indwelling Spirit, assisting grace and other special effects of his favor towards his people. The same also holds true in respect of the common effects of the Spirit in regard of others. Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>

ions+of+height%2C+breadth+and+depth%2C+as+bodies%2C+yet+they+are+not+in+two+places+at+once%3B+whilst+they+are+in+this+place%2C+they+are+not+in+another.+God+is+in+every+place+always.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+Of+the+Divine+Essence%2C+p.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F249daec26d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/249daec26d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-omnipresence-immensity-of-god/#:~:text=Immensity%20is%20God%20present%20everywhere%2C%20neither,God%20is%20in%20every%20place%20always." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-613556ca5a" data-kw="">
<blockquote><p>Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed will of God are excluded in this proposition: God is omnipotent, or God can do all things. That things which imply a contradiction, as namely: for the same thing to be and not to be; and impossibilities, as namely, for a man not to be a reasonable creature and the like: fall not under the compass of omnipotency, is not from any defect (it is indeed from the perfection) of power in God, but from the impossibility of the things: so that concerning matters of this nature, it is more convenient to say that they cannot be, which shows their non-possibility to be, than that God cannot do them, which seems to touch upon omnipotency (Unde convenientius dicitur, Ea non possunt fieri, quam quod Deus ea non possit facere [Therefore, it is more fitting to say that these things cannot be done than that God is unable to do them]. Thomas, pt. 1, quest. 25, art. 3). So likewise that God cannot sin, lie or deny Himself, is not from defect, but from the eminency of his power and absolute perfection, whence He is uncapable of being touched with any imperfection. Objection: God cannot destroy Sodom until Lot be gone out of it, Gen. 19:22. Like speeches whereunto are used elsewhere, it seems therefore God is not omnipotent. Answer: The power of God is either absolute and unlimited; by it He is able to do all things that are possible, though He never do them: or ordinate and limited by his decree and revealed Will: according to which God having freely bounded Himself, changes not, being immutable. These words, and the like spoken elsewhere, are to be understood of his limited, not of his unlimited power. Though God be omnipotent, yet He is not omnivolent [all-willing]; that is, though God can do whatsoever He pleases, yet God is not pleased to do whatsoever He can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 19</span></figcaption>

<blockquote><p>36. The three divine essential principles [Life of God, his intellect and will], related to the creature, ad extra, are denominated: 1. His Omnipotence, 2. His Omniscience or knowledge of them, 3. His Volition and love of them. He who is Potentissimus [most powerful], perfectly powerful in act, in Himself, is denominated omnipotent, because He can do all things ad extra which belong to power. And he who is Intellectus se intelligens [the intellect understanding Himself] ad intra, is denominated omniscient or knowing all creatures, from the exterior objects. And he who is Voluntas se volens [the will willing itself], or Amor se amans [love loving itself] ad intra, is also denominated willing of exterior things.</p></blockquote>

<blockquote><p>That God’s power is infinite, quia est ipsa infinita essentia [because He Himself is an infinite essence], is past doubt: But whether it may be called infinite as respecting outward objects, is disputed: And some prove the affirmative by asserting infinite objects, but Gregory of Rimini, n. 1, d. 43, q. 2. has reasons too subtle to be here recited: One of them Vasquez uses in 1. Tho. q. 25, d. 103, ch. 2 &amp; disp. 104. See the opinions of Gabriel, Scotus and Thomas on the rule of the name of divine omnipotentce.</p></blockquote>

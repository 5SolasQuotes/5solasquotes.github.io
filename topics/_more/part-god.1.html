<blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>section 15 in The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory, pp. 11-12</cite>, p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.”

</figure><figure class="quote" id="q-9c3b0121fb" data-kw="">
<blockquote><p>The power of a univocal agent is wholly manifested in its effect. The generative power of man, for example, is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect: as, for example, the power of the sun does not wholly manifest itself in the production of an animal generated from putrefaction. Now it is clear that God is not a univocal agent. For nothing agrees with Him either in species or in genus, as was shown above (Q. 3, A. 5; Q. 4, A. 3). Whence it follows that His effect is always less than His power. It is not necessary, therefore, that the infinite power of God should be manifested so as to produce an infinite effect. Yet even if it were to produce no effect, the power of God would not be ineffectual; because a thing is ineffectual which is ordained towards an end to which it does not attain. But the power of God is not ordered toward its effect as towards an end; rather, it is the end of the effect produced by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 25, art. 2, reply to obj. 2</cite></span></figcaption>

— Thomas Aquinas, Summa, pt. 1 | quest. 105 | art. 5, I answer that">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+less+perfect+is+always+for+the+sake+of+the+more+perfect%3A%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1+%7C+quest.+105+%7C+art.+5%2C+I+answer+that&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e3d274d8c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e3d274d8c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-will-of-god/#:~:text=For%20the%20less%20perfect%20is%20always,the%20sake%20of%20the%20more%20perfect%3A" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e33d02e0fa" data-kw="">
<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’</cite>, pp. 398-99</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

.%2013%3A9%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3f80f93133" data-kw="">
<blockquote><p>Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature, or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature. (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved, as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 13</span></figcaption>

</figure><figure class="quote" id="q-05bfcc2fdb" data-kw="">
<blockquote><p>Question 13: Whether God wills Himself as the end, and creatures as means? Distinguished. Answer: As the ultimate end He always wills Himself, Prov. 16:4. Creatures, and their actions, He sometimes wills as means in respect of others, sometimes as ends; but those ends are always subordinated, in respect of God, who is the universal and ultimate end of all things, Rom. 11, last verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-b5b07bba5c" data-kw="">
<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2</cite>, p. 357</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.”

<blockquote><p>7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation. 8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>

a1012.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-will-of-god/#:~:text=To%20bring%20forward%20greater%20things%2C%20the,fallen%20by%20the%20tree%20of%20ignominy." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>

<blockquote><p>They ought not to have despaired, for whom the Lord, hanging on the cross, deigned to pray. He saw some of His own among many strangers. He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ All of which seems to be referred to some of His own, not to the many strangers. 17. Nevertheless, I judge, according to the mind of St. Augustine it is to be carried to each man of the whole collection in which Christ the Lord saw some of his own among many strangers, so that the salvation of certain ones was especially and efficaciously intended, and this was the principal motive on account of which the prayer and redemption were extended to the whole collection, in which many strangers were mixed in. For thus are received universally and without restriction those sentences: ‘He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ [Ruiz continues to section 26 with further, similar quotes from Augustine and the fathers on the subject.]</p></blockquote>

<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd ed. (Baker Academic, 2003), vol. 3</cite>, p. 453</span></figcaption>

</figure><figure class="quote" id="q-5fb269979f" data-kw="">
<blockquote><p>Beings of reason strictly speaking, they [Scholastics] say, are divided into founded and non-founded, insofar as some foundation of understanding for forming them is found in things or insofar as they are fashioned without such foundation by the mind. Time and space, they say, are beings of reason with a foundation in reality; but a chimaera lacks such a foundation in reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotist.</cite>, Ch. 1, p. 20</span></figcaption>

</figure><figure class="quote" id="q-3627cb522a" data-kw="">
<blockquote><p>Our own personal experience teaches us the reality of transient being; for experience the fact that many things that once did not exist now exist, as, for example, our present thoughts, sensations, and their objects. Further, we have experience of continuity from one moment of time to another, for our conscious life is not a mere succession of discrete instants but is something flowing and truly continuous, so that the last part of the past coincides with the first part of the future. However, this fact of continuity that we experience cannot be explained unless something from prior experience remains or endures in present experience. In other words our conscious life, although it is a whole that is continually changing and flowing, nevertheless contains within the whole certain elements or parts that are constant. But such constant things, even if their endurance is brief, have a true relative permanence… It also seems that the reality of the relatively permanent can be directly inferred from the essence itself of the transient. For if the transient were not also relatively permanent, it ought to begin and cease to be without any interval of duration. That which begins to be and that which ceases to be are simply opposed as to existence, so that a contradiction would be involved if they existed simultaneously. Therefore, in order to have something truly transient, there must be at least two instants of time one after the other. But these two instants are either separated by an interval or are so immediate to each other that there is no interval between them. But no instants of time are so united that one exists after the other without interval, and if there is some interval of time between the beginning to be of some being and its ceasing to be, then we have got something relatively permanent. Now whatever may be said about this argument, it certainly seems that a being which begins to be from nothing and then immediately afterwards altogether ceases to be, without any interval at all of duration, if it does not simply involve a contradiction, cannot exist in time at any rate and cannot naturally be known by us. Moreover, if such instants of immediate annihilation after production be multiplied even endlessly, they can never explain the experience of continuity that we in fact have. For just as a line is not the mere addition of points infinite in number, so neither is a continuous period of time the mere addition or sum of instants that lack, in themselves, all duration in time. This reasoning is confirmed by the fact that existence or being, namely the being we experience and which is the starting point for our metaphysical speculations cannot be conceived without duration. On the basis of this concession I argue as follows: although beginning to be or ceasing to be are said to happen in an instant or a moment, one may not argue that therefore we can have creation followed immediately afterwards without any duration by annihilation, just as neither may one argue: a point is the end of a line and as such lacks all dimension, so there can be two points so close together that no distance intervenes between them. Accordingly we can say that beginning to be cannot be had without duration, not precisely because a beginning directly includes duration (for it happens in an instant), but because beginning to be is impossible without existence and because existence involves duration. The like must be said of ceasing to be, or ceasing to be thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotist.</cite>, Ch. 3, pp. 33-34</span></figcaption>

— Allan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotist., Ch. 3, pp. 33-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+own+personal+experience+teaches+us+the+reality+of+transient+being%3B+for+experience+the+fact+that+many+things+that+once+did+not+exist+now+exist%2C+as%2C+for+example%2C+our+present+thoughts%2C+sensations%2C+and+their+objects.+Further%2C+we+have+experience+of+continuity+from+one+moment+of+time+to+another%2C+for+our+conscious+life+is+not+a+mere+succession+of+discrete+instants+but+is+something+flowing+and+truly+continuous%2C+so+that+the+last+part+of+the+past+coincides+with+the+first+part+of+the+future.+However%2C+this+fact+of+continuity+that+we+experience+cannot+be+explained+unless+something+from+prior+experience+remains+or+endures+in+present+experience.+In+other+words+our+conscious+life%2C+although+it+is+a+whole+that+is+continually+changing+and+flowing%2C+nevertheless+contains+within+the+whole+certain+elements+or+parts+that+are+constant.+But+such+constant+things%2C+even+if+their+endurance+is+brief%2C+have+a+true+relative+permanence%E2%80%A6+It+also+seems+that+the+reality+of+the+relatively+permanent+can+be+directly+inferred+from+the+essence+itself+of+the+transient.+For+if+the+transient+were+not+also+relatively+permanent%2C+it+ought+to+begin+and+cease+to+be+without+any+interval+of+duration.+That+which+begins+to+be+and+that+which+ceases+to+be+are+simply+opposed+as+to+existence%2C+so+that+a+contradiction+would+be+involved+if+they+existed+simultaneously.+Therefore%2C+in+order+to+have+something+truly+transient%2C+there+must+be+at+least+two+instants+of+time+one+after+the+other.+But+these+two+instants+are+either+separated+by+an+interval+or+are+so+immediate+to+each+other+that+there+is+no+interval+between+them.+But+no+instants+of+time+are+so+united+that+one+exists+after+the+other+without+interval%2C+and+if+there+is+some+interval+of+time+between+the+beginning+to+be+of+some+being+and+its+ceasing+to+be%2C+then+we+have+got+something+relatively+permanent.+Now+whatever+may+be+said+about+this+argument%2C+it+certainly+seems+that+a+being+which+begins+to+be+from+nothing+and+then+immediately+afterwards+altogether+ceases+to+be%2C+without+any+interval+at+all+of+duration%2C+if+it+does+not+simply+involve+a+contradiction%2C+cannot+exist+in+time+at+any+rate+and+cannot+naturally+be+known+by+us.+Moreover%2C+if+such+instants+of+immediate+annihilation+after+production+be+multiplied+even+endlessly%2C+they+can+never+explain+the+experience+of+continuity+that+we+in+fact+have.+For+just+as+a+line+is+not+the+mere+addition+of+points+infinite+in+number%2C+so+neither+is+a+continuous+period+of+time+the+mere+addition+or+sum+of+instants+that+lack%2C+in+themselves%2C+all+duration+in+time.+This+reasoning+is+confirmed+by+the+fact+that+existence+or+being%2C+namely+the+being+we+experience+and+which+is+the+starting+point+for+our+metaphysical+speculations+cannot+be+conceived+without+duration.+On+the+basis+of+this+concession+I+argue+as+follows%3A+although+beginning+to+be+or+ceasing+to+be+are+said+to+happen+in+an+instant+or+a+moment%2C+one+may+not+argue+that+therefore+we+can+have+creation+followed+immediately+afterwards+without+any+duration+by+annihilation%2C+just+as+neither+may+one+argue%3A+a+point+is+the+end+of+a+line+and+as+such+lacks+all+dimension%2C+so+there+can+be+two+points+so+close+together+that+no+distance+intervenes+between+them.+Accordingly+we+can+say+that+beginning+to+be+cannot+be+had+without+duration%2C+not+precisely+because+a+beginning+directly+includes+duration+%28for+it+happens+in+an+instant%29%2C+but+because+beginning+to+be+is+impossible+without+existence+and+because+existence+involves+duration.+The+like+must+be+said+of+ceasing+to+be%2C+or+ceasing+to+be+thus.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29+Wolter+was+a+Scotist.%2C+Ch.+3%2C+pp.+33-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3627cb522a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3627cb522a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-time-eternity-gods-eternity/#:~:text=Our%20own%20personal%20experience%20teaches%20us,be%2C%20or%20ceasing%20to%20be%20thus." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d4512deee0" data-kw="">
<blockquote><p>We spoke above about the transient as to existence; the transient as to essence, on the contrary, is present if the quiddity or essence of the thing is a process or something flowing and becoming, for example time, a melody, organic life, the action of solving a mathematical problem. The permanent, by contrast, has its whole essence at once and not successively, as Peter, a tree, a table, the human soul.</p></blockquote>

</figure><figure class="quote" id="q-c9bfee1636" data-kw="">
<blockquote><p>When was time created? It is explained. Whether the day was first or night? The latter is affirmed. Whether the foreknowing of times and similar natural things are able to be predicted from the stars? It is distinguished. Whether through the inspection of an astrolabe and through an index of the stars it may be sinful to investigate future things? It is distinguished. Whether an event and actions which depend on the free will of men and are merely contingent by their nature, may be able to be certainly predicted from the stars? It is denied. Since there may be a twofold distinction for the year of the Old Testament, because there is a twofold entrance and twofold exit, which is better and older? It is explained. Whether time may be some precise thing understood from every operation? It is distinguished. Whether time may differ from motion in reality? It is denied with a distinction.</p></blockquote>

</figure><figure class="quote" id="q-f09f8805cf" data-kw="">
<blockquote><p>Eternity is God without beginning, without end and without all manner of succession; there is nothing past, nor to come. It was well said of him, who unto the question, ‘What was eternity?’ answered by that word of modesty, ‘I know not: It is the measure (without measure) of the duration of God, according to our apprehension.’ (Quid autem sit aeternitas, quaerat aliquis? Hîc si respondeam per verbum modestiae nescio recta ingenia per se intelligent, a byssum esse.) Three things are requisite thereunto, viz. to be without beginning, without end, and without all change: An unalterable and independing duration: It is all at once, where there is nothing past, nor to come; A remaining NOW. Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>

</figure><figure class="quote" id="q-b00ccbfa62" data-kw="">
<blockquote><p>According to Boethius “eternity is the total and perfect possession of unending life simultaneously” (Consolation of Philosophy 5.6). He expounds this definition as follows: “Whatever lives in time, proceeds in the present from the past to the future; for nothing is constituted in time that can embrace the whole extent of its life, but it does not yet grasp tomorrow and has already lost yesterday. That then which comprehends and as equally possesses the total fullness of unending life, and for which nothing of the future is absent and nothing of the past slipped away, is rightly held to be eternal.” In this definition are found the terms: a) ‘unending’, so that not only are beginning and ending excluded but their possibility too; b) ‘life’, so that the most perfect way of existing, namely as living, is expressed; c) ‘total and perfect possession simultaneously’, so that all succession and change are excluded and so that an eternal being is should to possess simultaneously the fullness of life. Such enduring existence, as will be seen later, belongs to God alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 3, article 2</cite>, p. 36</span></figcaption>

<blockquote><p>But God’s eternity… is not mere longevity, but strict timelessness… not merely that God has existed throughout all past time, and will continue to exist throughout all future time. Rather, He exists outside of time altogether. This follows from both his immutability and his simplicity. If God existed within time, He would constantly be adding new seconds, days, and years to his life; would be acting at one moment in a way that differs from the way He acts at another moment; and… would constantly be acquiring new pieces of knowledge, such as the knowledge that it is now time t1, the knowledge that it is now time t2, and so forth. But all of this would involve change, and God is immutable. Hence, He does not exist within time, but rather timelessly. Furthermore, if God were in time, then there would be different stages of his life, each of which would be distinct from the others. In that case, He would have distinct parts. But God is simple or noncomposite, and thus without parts. Hence, He is timeless. Now, I have argued in earlier chapters that the existence of anything at any moment is ultimately caused by God. It might seem that that claim is incompatible with the claim that God is timeless. For if the existence of something at time t1, is caused by God, and the existence of something at time t2, is caused by God, doesn’t that entail that God is acting at time t1, and also acting at the later time t2? And doesn’t that in turn entail that God is in time? However, this does not follow. In particular, from the proposition that God causes it to be the case that such-and-such exists at time t1, it does not follow that at time t2, God causes it to be the case that such-and-such exists. It is not that at time t1, God causes some object to exist, then at a later time t2, carries out a second action of causing that thing to remain in existence, then at some yet later time t3, carries out a third action of causing it to remain in existence for a while longer, and so forth. It is rather that God, from outside of time, in a single act causes to exist a temporal world in which the object exists at times t1, t2, t3, and so on. You might compare his action to that of an author who comes up with an entire story in a single flash of insight. He determines, all at the same moment, what the beginning, middle, and end of the story will be. From the point of view of the characters in the story, what happens in the middle of the story follows what happened at the beginning and precedes what happens at the end. But the author himself did not first come up with the beginning, and then later the middle, and then later still the ending. Rather, he did it all at once.</p></blockquote>

<blockquote><p>Whether God is able to be proved and demonstrated from the light of nature? It is affirmed against the Socinians. Whether one is able to prove the deity most fullly, expeditiously, sufficiently and by a sole rule against atheists and amidst all men whoever they may ultimately be, provided they are not devoid of a reasoning and sane mind, by the revealed facts in the Old and New Testament? It is denied against the Remonstrants. … Whether it is lawful and expedient unto edification to dispute to prove God exists? It is distinguished.</p></blockquote>

</figure><figure class="quote" id="q-5c43472dd8" data-kw="">
<blockquote><p>Whether the existence of God may be proved by disputation… (1) Where there is danger form the frenzies of atheists, this must be done sparingly, cautiously, compendiously and clearly. Where there is none it may be avoided, especially before the ruder and weaker and in catechetical institutions. There is will as a rule be sufficient to assume and adopt the principle [that God exists]. (2) The treatment must be taught kataskeuastikos rather than anaskeustikos, i.e., proofs must rather be brought forward for the truth than adversaries’ objections refuted… lest such things be taught by the very mention of them, and the devil take occassion of corrupt flesh to confuse men’s minds with horrible thoughts of the kind. (3) But the way with books that are published differs from that of instructions given by word of mouth. In the former, especially if dogmatic or argumentative, this proof can scarcely be passed over. In the latter it may, according to the matter under discussion. (4) One method is that of academic instructions and disputations, another that of the ecclesiastical. In the former theologians should be armed against antagonists of every kind. But this should be done with such care and circumspection, that it does not appear to be an airing of a dialectical problem. These distinctions being applied, we agree that (since the importunity of the ungodly does not create the necessity for us) there should be no dispute among Christians as to ‘whether there be a God’.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-ebdb026542" data-kw="">
<blockquote><p>But if besides the testimonies of conscience which appear in very many, although they cannot appear in individuals, whence there is no need to dispute about the conscience of individuals–if, I say, besides these we also want to seek other testimonies, by which God is never destitute, and through which He can be found by groping, soon they will occur so infinitely that he who does not apprehend Him from any of them will have degenerated from man into a beast, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | “11th Problem: Whether the most excellent, most expeditious, most sufficient and only rule of proving the deity against atheists and among men, whoever they may at last be, provided that they are not devoid of judgment and a sane mind, is from the revelations made in the Old and New Testaments. | I respond: | And later, p. 188:</cite>, pp. 70-78</span></figcaption>

</figure><figure class="quote" id="q-3b0789b865" data-kw="">
<blockquote><p>Can the existence of God be irrefutably demonstrated against atheists? We affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 1, 3rd topic, question 1</cite>, p. 169</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Can the existence of God be irrefutably demonstrated against atheists? We affirm.”

— Francis Turretin, Institutes, vol. 1, 3rd topic, question 1, p. 169">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCan+the+existence+of+God+be+irrefutably+demonstrated+against+atheists%3F+We+affirm.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%2C+vol.+1%2C+3rd+topic%2C+question+1%2C+p.+169&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b0789b865.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b0789b865.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Can%20the%20existence%20of%20God%20be%20irrefutably%20demonstrated%20against%20atheists%3F%20We%20affirm." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26a3d50a53" data-kw="">
<blockquote><p>Conviction [of atheists] involves assertion and confutation. Here only the method or titles and classes of arguments of the former are to be indicated. Leaving all others aside, I will exhibit here only those of [Marin] Mersenne [d. 1648, a Romanist] (who embraces all): One is that all creatures in some way affirm the existence of deity; 2. That all men have that thought; 3. Because it is necessary that something be from itself; 4. From the eternity of truth; 5. From the best entity and goodness; 6. From the axiom ‘Whatever has the power of moving has it from another’; 7. From the grades of beings; 8. Because God is the light manifesting the rest, and it is known through itself that God exists; 9. Because a creature is a being produced by another from nothing; 10. From the beauty of each creature; 11. From the immutable natural law; 12. From our appetite [desire for something greater, best and satisfying]; 13. From the concord of dissonant things; 14. From the government of things; 15. From metaphysical science, its object, etc.; 16. From arithmetic and algebra, namely from the monad, the principle of number, and other admirable things of numbers; 17. From geometry, namely from the abstruse and admirable things of figures and dimensions; 18. From music, where he discusses the harmony of the macrocosm and microcosm and the comparison of mundane music with human; 19. From astrology, namely from the ordered revolution of the stars, especially the swiftness of the diurnal motion from east to west; 20. From mechanics, especially the crane which lifts the greatest weight by the least force; 21. From any sciences and arts; 22. From other inferior sciences; 23. From all species of divinations; 24. From the six determinations of things which are indeterminate by their own nature–they are of (1) quantity, (2) disposition and parts, (3) duration, (4) figure, (5) multitude of individuals and species, (6) intension of grades, and existence; 25. From moral matters; 26. From all artifacts and from the stars; 27. From the collection of all beings; 28. From geography and hydrography; 29. From poverty, from the diversity of faces, voice, writing, states, gaits; 30. From the end to which all things tend; 31. From this, that an object ought to be assigned which can terminate and satiate our love; 32. From various absurdities and disadvantages and from the advantages which follow from the opposite or varying opinion; 33. From optics; 34. From gnomonics [using dials]; 35. From architecture; 36. From nautical science. And this is a most diffuse assertion. Its confutation occupied in the solution and attack of atheistic exceptions, twenty-six in number, I do not exhibit here because the reason of the theses does not bear refuting them. Let Mersenne himself be consulted, p. 234, and Valesius, Mornay, and others cited above in part 1. You have the marrow of them in Mornay and those who defend the Providence of God. In the course and repetition of the common topics which we complete in this Academy about every year and a half, we have hitherto set forth those classes of arguments to our students and to the best of our ability deduced and defended them. The arguments [against atheists] are either intrinsic or extrinsic. The former are more as if a priori [from first things] or more a posteriori [from things following]. The former are drawn from certain principles and axioms of the light of nature: 1. There is not given an infinite regress in causes; 2. Nothing is from itself, or nothing is the cause of itself; 3. Whatever is moved is moved by another, and so finally one must come to an unmoved mover; 4. In order there is something first. The latter arguments are drawn: 1. From the adornment, perfection, order, actions, powers of the creatures or universe, Ps. 8 &amp; 19; Isa. 40; Rom. 1; 2. From the intellectual nature of angels, devils and their appearances, operations, ἐνεργήματα; 3. From man, the microcosm, considered both in his nature and essential, integral parts, etc., and in the symbiotic, economic, political, ecclesiastical, scholastic order, with the changes and rewards and punishments in this life: Ps. 8 collated with Isa. 40 and the Ecclesiastes of Solomon; 4. From miracles and prophecies, Isa. 64. The extrinsic arguments or testimonies are: 1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions; 2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian. But if anyone having been advised persists in playing the fool and involving himself and the truth in mere begging of the question or obscure or uncertain consequences, such as [Descartes’s] ‘I think, therefore I am’, and ‘That of which the idea is in me, that very thing, etc.’–skepticism having first been inducted and all natural, innate and acquired knowledge having been erased or sequestered by doubt, and also all principles and demonstrations hitherto customary to all of Christendom, and indeed agreeably to the Scriptures, having been denied and snatched away, certainly to those proud betrayers or corrupters of the cause it must be suggested what Tertullian said, “Evidently the truth was waiting to be liberated by the Valentinians and Marcionites.” To the same men and their favorers all students and masters of all sciences, especially of theology, could say, “Render the legions. For easy is the descent to Avernus, but to retrace one’s steps, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1</cite>, pp. 206-9 Latin</span></figcaption>

s%3B+23.+From+all+species+of+divinations%3B+24.+From+the+six+determinations+of+things+which+are+indeterminate+by+their+own+nature%E2%80%93they+are+of+%281%29+quantity%2C+%282%29+disposition+and+parts%2C+%283%29+duration%2C+%284%29+figure%2C+%285%29+multitude+of+individuals+and+species%2C+%286%29+intension+of+grades%2C+and+existence%3B+25.+From+moral+matters%3B+26.+From+all+artifacts+and+from+the+stars%3B+27.+From+the+collection+of+all+beings%3B+28.+From+geography+and+hydrography%3B+29.+From+poverty%2C+from+the+diversity+of+faces%2C+voice%2C+writing%2C+states%2C+gaits%3B+30.+From+the+end+to+which+all+things+tend%3B+31.+From+this%2C+that+an+object+ought+to+be+assigned+which+can+terminate+and+satiate+our+love%3B+32.+From+various+absurdities+and+disadvantages+and+from+the+advantages+which+follow+from+the+opposite+or+varying+opinion%3B+33.+From+optics%3B+34.+From+gnomonics+%5Busing+dials%5D%3B+35.+From+architecture%3B+36.+From+nautical+science.+And+this+is+a+most+diffuse+assertion.+Its+confutation+occupied+in+the+solution+and+attack+of+atheistic+exceptions%2C+twenty-six+in+number%2C+I+do+not+exhibit+here+because+the+reason+of+the+theses+does+not+bear+refuting+them.+Let+Mersenne+himself+be+consulted%2C+p.+234%2C+and+Valesius%2C+Mornay%2C+and+others+cited+above+in+part+1.+You+have+the+marrow+of+them+in+Mornay+and+those+who+defend+the+Providence+of+God.+In+the+course+and+repetition+of+the+common+topics+which+we+complete+in+this+Academy+about+every+year+and+a+half%2C+we+have+hitherto+set+forth+those+classes+of+arguments+to+our+students+and+to+the+best+of+our+ability+deduced+and+defended+them.+The+arguments+%5Bagainst+atheists%5D+are+either+intrinsic+or+extrinsic.+The+former+are+more+as+if+a+priori+%5Bfrom+first+things%5D+or+more+a+posteriori+%5Bfrom+things+following%5D.+The+former+are+drawn+from+certain+principles+and+axioms+of+the+light+of+nature%3A+1.+There+is+not+given+an+infinite+regress+in+causes%3B+2.+Nothing+is+from+itself%2C+or+nothing+is+the+cause+of+itself%3B+3.+Whatever+is+moved+is+moved+by+another%2C+and+so+finally+one+must+come+to+an+unmoved+mover%3B+4.+In+order+there+is+something+first.+The+latter+arguments+are+drawn%3A+1.+From+the+adornment%2C+perfection%2C+order%2C+actions%2C+powers+of+the+creatures+or+universe%2C+Ps.+8+%26+19%3B+Isa.+40%3B+Rom.+1%3B+2.+From+the+intellectual+nature+of+angels%2C+devils+and+their+appearances%2C+operations%2C+%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%AE%CE%BC%CE%B1%CF%84%CE%B1%3B+3.+From+man%2C+the+microcosm%2C+considered+both+in+his+nature+and+essential%2C+integral+parts%2C+etc.%2C+and+in+the+symbiotic%2C+economic%2C+political%2C+ecclesiastical%2C+scholastic+order%2C+with+the+changes+and+rewards+and+punishments+in+this+life%3A+Ps.+8+collated+with+Isa.+40+and+the+Ecclesiastes+of+Solomon%3B+4.+From+miracles+and+prophecies%2C+Isa.+64.+The+extrinsic+arguments+or+testimonies+are%3A+1.+Internal%2C+of+synteresis+and+conscience%2C+Rom.+2%2C+and+here+about+the+common+notions%3B+2.+External%2C+the+consensus+of+all+nations%2C+and+the+doctrine+of+all+sages.+But+with+all+reasons+having+been+subtracted+and+repeated+thoughts+more+often+recurring%2C+we+have+found+that+the+order+both+of+nature+and+of+our+better+knowledge+is+rather+to+be+observed+and+more+safely+served+in+this+way%2C+that+the+demonstration+from+effects+to+cause%2C+from+works+to+maker+and+governor%2C+be+put+first+as+preeminent+and+universal%2C+which+embraces+all+others+in+itself+since+indeed+all+others+depend+on+it+and+are+derived+from+it%2C+and+all+presuppose+it.+For+no+one+doubts+that+the+law+of+nature+and+of+implanted+common+notion%2C+and+hence+the+acknowledgment+and+profession+of+deity%2C+in+addition+miracles%2C+prophecies+and+political+order%2C+are+to+be+referred+to+the+works+of+God.+As+for+those+axioms+about+causes%2C+about+motion%2C+about+order%2C+those+complex+principles+would+not+exist+unless+those+things+from+which+induction+and+finally+complex+theses+and+principles+arise+had+been+observed+in+the+works+of+God+or+creatures%3B+there+would+not+be+observation+nor+induction+about+and+from+creatures+unless+there+were+creatures.+But+that+this+method+is+safest%2C+most+expeditious%2C+and+most+evident%2C+the+doctrine+and+example+of+the+Holy+Spirit+persuade+Christians%2C+Rom.+1%2C+Ps.+19%2C+Acts+17%2C+Isa.+40%2C+etc.+To+accuse+Him+of+ignorance+or+pseudography+is+atheism+lurking+under+the+cloak+of+a+Christian.+But+if+anyone+having+been+advised+persists+in+playing+the+fool+and+involving+himself+and+the+truth+in+mere+begging+of+the+question+or+obscure+or+uncertain+consequences%2C+such+as+%5BDescartes%E2%80%99s%5D+%E2%80%98I+think%2C+therefore+I+am%E2%80%99%2C+and+%E2%80%98That+of+which+the+idea+is+in+me%2C+that+very+thing%2C+etc.%E2%80%99%E2%80%93skepticism+having+first+been+inducted+and+all+natural%2C+innate+and+acquired+knowledge+having+been+erased+or+sequestered+by+doubt%2C+and+also+all+principles+and+demonstrations+hitherto+customary+to+all+of+Christendom%2C+and+indeed+agreeably+to+the+Scriptures%2C+having+been+denied+and+snatched+away%2C+certainly+to+those+proud+betrayers+or+corrupters+of+the+cause+it+must+be+suggested+what+Tertullian+said%2C+%E2%80%9CEvidently+the+truth+was+waiting+to+be+liberated+by+the+Valentinians+and+Marcionites.%E2%80%9D+To+the+same+men+and+their+favorers+all+students+and+masters+of+all+sciences%2C+especially+of+theology%2C+could+say%2C+%E2%80%9CRender+the+legions.+For+easy+is+the+descent+to+Avernus%2C+but+to+retrace+one%E2%80%99s+steps%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1%2C+pp.+206-9+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26a3d50a53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26a3d50a53.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Conviction%20%5Bof%20atheists%5D%20involves%20assertion%20and,but%20to%20retrace%20one%E2 <blockquote><p>Many other arguments for the existence of God have been worked out in the course of time, among which the following come to mind: Aristotle’s argument from motion (Physics 8.5), St. Augustine’s proof from truth (On Free Choice 2.12-15), the famous argument of St. Anselm, the triple way of St. Bonaventure (Disputed Question on the Mystery of the Trinity q.1 a.1), the five ways of St. Thomas, the very fine demonstration of Scotus, Ockham’s proof from conservation (see Boehner, ‘Zu Ockhams Beweis der Existenz Gottes’, Franz. Stud. 32, 1950, 50ff), and the argument of Peter Auriol (see Schmücker, ‘Propositio per se nota, Gottesbeweis und ihr Verhältnis nach Petrus Aureoli, Franz. Forsch., Heft 8, Werl i., Westf., 1941).</p></blockquote>

<blockquote><p>In his Proslogion, Anselm switches to Boethius’ axiom [from Augustine’s], and suggests filling out the concept of God by many arguments of this form: (10) Nothing greater than God is conceivable. (11) If God is not F, something greater than God is conceivable. (12) So God is F.” – Leftow, ‘3. Perfect-being theology’ Anselm: “…this very fool, when he hears of this being of which I speak–a being than which nothing greater can be conceived–understands what he hears, and what he understands is in his understanding; although he does not understand it to exist. For it is one thing for an object to be in the understanding, and another to understand that the object exists… And assuredly that, than which nothing greater can be conceived, cannot exist in the understanding alone. For, suppose it exists in the understanding alone: then it can be conceived to exist in reality; which is greater. Therefore, if that, than which nothing greater can be conceived, exists in the understanding alone, the very being, than which nothing greater can be conceived, is one, than which a greater can be conceived. But obviously this is impossible. Hence, there is no doubt that there exists a being, than which nothing greater can be conceived, and it exists both in the understanding and in reality.</p></blockquote>

<blockquote><p>And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.”

— Anselm, Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon… tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34, ch. 3, pp. 8-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+it+assuredly+exists+so+truly%2C+that+it+cannot+be+conceived+not+to+exist.+For+it+is+possible+to+conceive+of+a+being+which+cannot+be+conceived+not+to+exist%3B+and+this+is+greater+than+one+which+can+be+conceived+not+to+exist%E2%80%A6+There+is%2C+then%2C+so+truly+a+being+than+which+nothing+greater+can+be+conceived+to+exist%2C+that+it+cannot+even+be+conceived+not+to+exist%3B+and+this+being+thou+art%2C+O+Lord%2C+our+God%E2%80%A6+For%2C+if+a+mind+could+conceive+of+a+being+better+than+thee%2C+the+creature+would+rise+about+the+Creator%3B+and+this+is+most+absurd.+And%2C+indeed%2C+whatever+else+there+is%2C+except+thee+alone%2C+can+be+conceived+not+to+exist.+To+thee+alone%2C+therefore%2C+it+belongs+to+exist+more+truly+than+all+other+beings%2C+and+hence+in+a+higher+degree+than+all+others.+For%2C+whatever+else+exists+does+not+exist+so+truly%2C+and+hence+in+a+less+degree+it+belongs+to+it+to+exist.%E2%80%9D%0A%0A%E2%80%94+Anselm%2C+Proslogium%2C+or+%E2%80%98Discourse%E2%80%99+on+the+Existence+of+God+ToC+in+St.+Anselm%3A+Proslogium%3B+Monologium%3B+an+Appendix+in+behalf+of+the+Fool+by+Gaunilon%E2%80%A6+tr.+Sidney+N.+Deane+%28Chicago%3A+Open+Court+Publishing+Co.%2C+1903%29%2C+pp.+1-34%2C+ch.+3%2C+pp.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a8ade0fe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a8ade0fe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=And%20it%20assuredly%20exists%20so%20truly%2C,it%20belongs%20to%20it%20to%20exist." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-03eeb588c0" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways. The first and more manifest way is the argument from motion. It is certain, and evident to our senses, that in the world some things are in motion. Now whatever is in motion is put in motion by another, for nothing can be in motion except as it is in potentiality to that towards which it is in motion; whereas a thing moves inasmuch as it is in act. For motion is nothing else than the reduction of something from potentiality to actuality. But nothing can be reduced from potentiality to actuality, except by something in a state of actuality. Thus that which is actually hot, as fire, makes wood, which is potentially hot, to be actually hot, and thereby moves and changes it. Now it is not possible that the same thing should be at once in actuality and potentiality in the same respect, but only in different respects. For what is actually hot cannot simultaneously be potentially hot; but it is simultaneously potentially cold. It is therefore impossible that in the same respect and in the same way a thing should be both mover and moved, i.e., that it should move itself. Therefore, whatever is in motion must be put in motion by another. If that by which it is put in motion be itself put in motion, then this also must needs be put in motion by another, and that by another again. But this cannot go on to infinity, because then there would be no first mover, and, consequently, no other mover; seeing that subsequent movers move only inasmuch as they are put in motion by the first mover; as the staff moves only because it is put in motion by the hand. Therefore it is necessary to arrive at a first mover, put in motion by no other; and this everyone understands to be God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-db2b631032" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The second way is from the nature of the efficient cause. In the world of sense we find there is an order of efficient causes. There is no case known (neither is it, indeed, possible) in which a thing is found to be the efficient cause of itself; for so it would be prior to itself, which is impossible. Now in efficient causes it is not possible to go on to infinity, because in all efficient causes following in order, the first is the cause of the intermediate cause, and the intermediate is the cause of the ultimate cause, whether the intermediate cause be several, or only one. Now to take away the cause is to take away the effect. Therefore, if there be no first cause among efficient causes, there will be no ultimate, nor any intermediate cause. But if in efficient causes it is possible to go on to infinity, there will be no first efficient cause, neither will there be an ultimate effect, nor any intermediate efficient causes; all of which is plainly false. Therefore it is necessary to admit a first efficient cause, to which everyone gives the name of God.</p></blockquote>

— Aquinas, Summa Theologiae, pt. 1, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer+that%2C+The+existence+of+God+can+be+proved+in+five+ways%E2%80%A6+The+second+way+is+from+the+nature+of+the+efficient+cause.+In+the+world+of+sense+we+find+there+is+an+order+of+efficient+causes.+There+is+no+case+known+%28neither+is+it%2C+indeed%2C+possible%29+in+which+a+thing+is+found+to+be+the+efficient+cause+of+itself%3B+for+so+it+would+be+prior+to+itself%2C+which+is+impossible.+Now+in+efficient+causes+it+is+not+possible+to+go+on+to+infinity%2C+because+in+all+efficient+causes+following+in+order%2C+the+first+is+the+cause+of+the+intermediate+cause%2C+and+the+intermediate+is+the+cause+of+the+ultimate+cause%2C+whether+the+intermediate+cause+be+several%2C+or+only+one.+Now+to+take+away+the+cause+is+to+take+away+the+effect.+Therefore%2C+if+there+be+no+first+cause+among+efficient+causes%2C+there+will+be+no+ultimate%2C+nor+any+intermediate+cause.+But+if+in+efficient+causes+it+is+possible+to+go+on+to+infinity%2C+there+will+be+no+first+efficient+cause%2C+neither+will+there+be+an+ultimate+effect%2C+nor+any+intermediate+efficient+causes%3B+all+of+which+is+plainly+false.+Therefore+it+is+necessary+to+admit+a+first+efficient+cause%2C+to+which+everyone+gives+the+name+of+God.%E2%80%9D%0A%0A%E2%80%94+Aquinas%2C+Summa+Theologiae%2C+pt.+1%2C+q.+2%2C+article+3%2C+%E2%80%98Whether+God+Exists%E2%80%99%2C+%E2%80%98I+answer+that%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb2b631032.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db2b631032.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=I%20answer%20that%2C%20The%20existence%20of,everyone%20gives%20the%20name%20of%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Although I, by divine testimony, and by the truth and merit of the thing itself, and by invincible reasons am persuaded that God exists, and I think it to be a most grievous and destructive sin to suspend judgment concerning it; yet because you suspend judgment concerning the existence of God, you hold in contempt all the authority of divine testimony, in which you certainly sin most grievously: yet, about to deal with you according to your capacity; having set aside divine testimony, likewise also the merit of the truth, I will convince you with invincible natural reasons; then what you can allege to the contrary, I will dispatch: You assent, for example, that you exist, he will grant it; nor will he be able, if he wished ever so much, to suspend judgment on this with the Cartesians. You assent that you are not from yourself, but from another, and this one similarly; he will grant it, and this willy-nilly. I will proceed therefore: One of these therefore will have to be chosen by you: [1] That in this series of causes one must ascend either to infinity; [2] Or that things in this series are mutually causes and effects of each other, with circular efficacy; by which e.g. the father produced you; the grandfather the father; the great-grandfather the grandfather; the great-great-grandfather the great-grandfather, etc. and you finally the great-great-grandfather: [3] Or that at some point in this series one must stop at some first, which is that very thing, which we wish to be designated by the Word God. If he chooses the first; I will say that he contradicts himself in this reasoning, inasmuch as thus, he himself cannot exist, which however he has already acknowledged before, willy-nilly: he cannot, I say, exist; because that infinite series of causes, which is presupposed to have to precede his production, and existence, would never have been completed, so that the next to produce, could have succeeded: If he chooses the second, the circular series, by which e.g. the great-great-grandfather through the great-grandfather, the grandfather, the father produced himself; but he himself the great-great-grandfather; I will say that he also thus contradicts himself, inasmuch as by this reasoning he states, that he is at the same time and is not, for inasmuch as he was produced by the great-great-grandfather, he certainly was not: but inasmuch as he produced the great-great-grandfather; he certainly was: Therefore there remains nothing, but that the third be acknowledged in this subordination, that there is some first, which produced all things, and was produced by none, and that this is infinitely perfect, hence I will proceed to demonstrate, that nothing is believed to finish or limit its own perfection; nor is there anything else for this first which may finish it: necessarily that thing remains infinite.</p></blockquote>

</figure><figure class="quote" id="q-4eae98ce2e" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The third way is taken from possibility and necessity, and runs thus. We find in nature things that are possible to be and not to be, since they are found to be generated, and to corrupt, and consequently, they are possible to be and not to be. But it is impossible for these always to exist, for that which is possible not to be, at some time is not. Therefore, if everything is possible not to be, then at one time there could have been nothing in existence. Now if this were true, even now there would be nothing in existence, because that which does not exist only begins to exist by something already existing. Therefore, if at one time nothing was in existence, it would have been impossible for anything to have begun to exist; and thus even now nothing would be in existence—which is absurd. Therefore, not all beings are merely possible, but there must exist something the existence of which is necessary. But every necessary thing either has its necessity caused by another, or not. Now it is impossible to go on to infinity in necessary things which have their necessity caused by another, as has been already proved in regard to efficient causes [see on Causation above]. Therefore we cannot but postulate the existence of some being having of itself its own necessity, and not receiving it from another, but rather causing in others their necessity. This all men speak of as God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I answer that, The existence of God can be proved in five ways… The third way is taken from possibility and necessity, and runs thus. We find in nature things that are possible to be and not to be, since they are found to be generated, and to corrupt, and consequently, they are possible to be and not to be. But it is impossible for these always to exist, for that which is possible not to be, at some time is not. Therefore, if everything is possible not to be, then at one time there could have been nothing in existence. Now if this were true, even now there would be nothing in existence, because that which does not exist only begins to exist by something already existing. Therefore, if at one time nothing was in existence, it would have been impossible for anything to have begun to exist; and thus even now nothing would be in existence—which is absurd. Therefore, not all beings are merely possible, but there must exist something the existence of which is necessary. But every necessary thing either has its necessity caused by another, or not. Now it is impossible to go on to infinity in necessary things which have their necessity caused by another, as has been already proved in regard to efficient causes [see on Causation above]. Therefore we cannot but postulate the existence of some being having of itself its own necessity, and not receiving it from another, but rather causing in others their necessity. This all men speak of as God.”

— Aquinas, Summa Theologiae, pt. 1, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer+that%2C+The+existence+of+God+can+be+proved+in+five+ways%E2%80%A6+The+third+way+is+taken+from+possibility+and+necessity%2C+and+runs+thus.+We+find+in+nature+things+that+are+possible+to+be+and+not+to+be%2C+since+they+are+found+to+be+generated%2C+and+to+corrupt%2C+and+consequently%2C+they+are+possible+to+be+and+not+to+be.+But+it+is+impossible+for+these+always+to+exist%2C+for+that+which+is+possible+not+to+be%2C+at+some+time+is+not.+Therefore%2C+if+everything+is+possible+not+to+be%2C+then+at+one+time+there+could+have+been+nothing+in+existence.+Now+if+this+were+true%2C+even+now+there+would+be+nothing+in+existence%2C+because+that+which+does+not+exist+only+begins+to+exist+by+something+already+existing.+Therefore%2C+if+at+one+time+nothing+was+in+existence%2C+it+would+have+been+impossible+for+anything+to+have+begun+to+exist%3B+and+thus+even+now+nothing+would+be+in+existence%E2%80%94which+is+absurd.+Therefore%2C+not+all+beings+are+merely+possible%2C+but+there+must+exist+something+the+existence+of+which+is+necessary.+But+every+necessary+thing+either+has+its+necessity+caused+by+another%2C+or+not.+Now+it+is+impossible+to+go+on+to+infinity+in+necessary+things+which+have+their+necessity+caused+by+another%2C+as+has+been+already+proved+in+regard+to+efficient+causes+%5Bsee+on+Causation+above%5D.+Therefore+we+cannot+but+postulate+the+existence+of+some+being+having+of+itself+its+own+necessity%2C+and+not+receiving+it+from+another%2C+but+rather+causing+in+others+their+necessity.+This+all+men+speak+of+as+God.%E2%80%9D%0A%0A%E2%80%94+Aquinas%2C+Summa+Theologiae%2C+pt.+1%2C+q.+2%2C+article+3%2C+%E2%80%98Whether+God+Exists%E2%80%99%2C+%E2%80%98I+answer+that%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4eae98ce2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href=". <blockquote><p>I answer that, The existence of God can be proved in five ways… The fourth way is taken from the gradation to be found in things. Among beings there are some more and some less good, true, noble and the like. But more and less are predicated of different things, according as they resemble in their different ways something which is the maximum, as a thing is said to be hotter according as it more nearly resembles that which is hottest; so that there is something which is truest, something best, something noblest and, consequently, something which is uttermost being; for those things that are greatest in truth are greatest in being, as it is written [by Aristotle] in Metaphysics, 2[.1]. Now the maximum in any genus is the cause of all in that genus; as fire, which is the maximum heat, is the cause of all hot things. Therefore there must also be something which is to all beings the cause of their being, goodness, and every other perfection; and this we call God.</p></blockquote>

</figure><figure class="quote" id="q-f604592be6" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The fifth way is taken from the governance of the world. We see that things which lack intelligence, such as natural bodies, act for an end, and this is evident from their acting always, or nearly always, in the same way, so as to obtain the best result. Hence it is plain that not fortuitously, but designedly, do they achieve their end. Now whatever lacks intelligence cannot move towards an end, unless it be directed by some being endowed with knowledge and intelligence; as the arrow is shot to its mark by the archer. Therefore some intelligent being exists by whom all natural things are directed to their end; and this being we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</cite></span></figcaption>

</figure><figure class="quote" id="q-a6cd675ff2" data-kw="">
<blockquote><p>68. When being is divided through contradictory attributes opposite to each other with respect to being [such as permanent vs. transient; eternal vs. temporal; uncaused vs. caused; necessary vs. contingent; act vs. potency; substantial vs. accidental being; absolute vs. relative being; simple vs. composite being; infinite vs. finite], one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections because, from conclusion 62,¹ pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65).² But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection). ¹ [62. No pure perfection is incompatible with another pure perfection. This is plain from the definition of pure perfection; for a pure perfection or a perfection simply is that whose formal idea does not involve limitation or imperfection. Therefore of itself such a perfection cannot limit the being-ness of the subject in which it is, and so neither can it exclude from its subject other perfections simply.] ² [64. Conversely, no being that is altogether independent and uncausable can be finite, either intensively or extensively. 65. If there is something finite, there is something infinite. I prove it as follows: a finite being, because it is also a caused being, involves the existence of another being, namely an uncaused being (from conclusion 23 and following [on pp. 45-46]). But from conclusion 64, an uncaused being is both intensively and extensively infinite.] 69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus ibid. [Oxon. 1 d.39 q.un n.13]). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958) Wolter (d. 2006) was a Scotus scholar. | pt. 2, ch. 8, article 3, ‘On Infinite &amp; Finite’</cite>, p. 76</span></figcaption>

<blockquote><p>1. There is something which exists 2. Something has existed eternally. 3. Something has been eternally self-existent. 4. What is self-existent must have all the perfections that anywhere exist, or in any subject. 5. What is self-existent must have all possible perfections, and every perfection in an infinite measure. 6. What has all possible perfection, and every perfection in an infinite measure, is God. If I can show that these propositions are founded on certain and evident truth, and that there is a necessary connection between them, the inference I would draw from them is clear and undeniable. … 2. Something has existed eternally… For if something had not always existed, nothing could ever have existed. To suppose any being to begin to exist antecedentaly to all other beings is to suppose it the cause of its own existence, and by necessary consequence to act before it is; but since there can be no operation either in order of time, or of human conception, previous to the subject of it, to say, a thing may act before it is, is in other words to say that a thing may be and may not be at the same time… there cannot be a more express and flaming contradiction.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. There is something which exists 2. Something has existed eternally. 3. Something has been eternally self-existent. 4. What is self-existent must have all the perfections that anywhere exist, or in any subject. 5. What is self-existent must have all possible perfections, and every perfection in an infinite measure. 6. What has all possible perfection, and every perfection in an infinite measure, is God. If I can show that these propositions are founded on certain and evident truth, and that there is a necessary connection between them, the inference I would draw from them is clear and undeniable. … 2. Something has existed eternally… For if something had not always existed, nothing could ever have existed. To suppose any being to begin to exist antecedentaly to all other beings is to suppose it the cause of its own existence, and by necessary consequence to act before it is; but since there can be no operation either in order of time, or of human conception, previous to the subject of it, to say, a thing may act before it is, is in other words to say that a thing may be and may not be at the same time… there cannot be a more express and flaming contradiction.”

— Richard Fiddes, 2. ‘The first proof of a God deduced from the following propositions’ in Theologia Speculativa, or the First Part of a Body of Divinity… wherein are Explained the Principles of Natural &amp; Revealed Religion (London, 1718), vol. 1, bk. 1, ‘Of the Existence &amp; Attributes of God’, pt. 1, ‘Of the Existence of God’, pp. 11-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+There+is+something+which+exists+2.+Something+has+existed+eternally.+3.+Something+has+been+eternally+self-existent.+4.+What+is+self-existent+must+have+all+the+perfections+that+anywhere+exist%2C+or+in+any+subject.+5.+What+is+self-existent+must+have+all+possible+perfections%2C+and+every+perfection+in+an+infinite+measure.+6.+What+has+all+possible+perfection%2C+and+every+perfection+in+an+infinite+measure%2C+is+God.+If+I+can+show+that+these+propositions+are+founded+on+certain+and+evident+truth%2C+and+that+there+is+a+necessary+connection+between+them%2C+the+inference+I+would+draw+from+them+is+clear+and+undeniable.+%E2%80%A6+2.+Something+has+existed+eternally%E2%80%A6+For+if+something+had+not+always+existed%2C+nothing+could+ever+have+existed.+To+suppose+any+being+to+begin+to+exist+antecedentaly+to+all+other+beings+is+to+suppose+it+the+cause+of+its+own+existence%2C+and+by+necessary+consequence+to+act+before+it+is%3B+but+since+there+can+be+no+operation+either+in+order+of+time%2C+or+of+human+conception%2C+previous+to+the+subject+of+it%2C+to+say%2C+a+thing+may+act+before+it+is%2C+is+in+other+words+to+say+that+a+thing+may+be+and+may+not+be+at+the+same+time%E2%80%A6+there+cannot+be+a+more+express+and+flaming+contradiction.%E2%80%9D%0A%0A%E2%80%94+Richard+Fiddes%2C+2.+%E2%80%98The+first+proof+of+a+God+deduced+from+the+following+propositions%E2%80%99+in+Theologia+Speculativa%2C+or+the+First+Part+of+a+Body+of+Divinity%E2%80%A6+wherein+are+Explained+the+Principles+of+Natural+%26+Revealed+Religion+%28London%2C+1718%29%2C+vol.+1%2C+bk.+1%2C+%E2%80%98Of+the+Existence+%

<figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st ed. (Baker, 1985), voluntas Dei</cite>, pp. 332-33</span></figcaption>

<blockquote><p>Reply to Objection 4: Nothing prevents one and the same thing being loved under one aspect, while it is hated under another. God loves sinners insofar as they are existing natures; for they have existence and have it from Him. In so far as they are sinners, they have not existence at all, but fall short of it; and this in them is not from God. Hence under this aspect, they are hated by Him.</p></blockquote>

— Thomas Aquinas, Summa, pt. 1, quest. 25, art. 2, reply to obj. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6a+thing+is+ineffectual+which+is+ordained+towards+an+end+to+which+it+does+not+attain.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1%2C+quest.+25%2C+art.+2%2C+reply+to+obj.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff7807c32c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff7807c32c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=%E2%80%A6a%20thing%20is%20ineffectual%20which%20is,to%20which%20it%20does%20not%20attain." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians… some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-b14151e551" data-kw="">
<blockquote><p>Question: Seeing God purposed to destroy them, and did it not, is not his will alterable and inefficacious? Answer: The counsels, purposes, decrees of God are unalterable and do take place, Ps. 33:11; Isa. 14:27; 43:13; 46:10; Mal. 3:6; Heb. 6:17. For that said and done here, it’s more humano [by a human custom]: God saw cause-sufficient to move Him to their destruction, but seeing what evil was like to come about, He would not destroy them; had the Lord decreed it before the world, it must have taken place, no change or alteration could have been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the 20th-29th chapters of the prophet Ezekiel... (London: Chapman, 1658), on ch. 20, v. 8</cite>, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-2f386bf031" data-kw="">
<blockquote><p>Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions: 1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’. 2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary. 3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-pitcarne.html">Alexander Pitcarne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Sacrifice, or a Treatise wherein several Weighty Questions and Cases concerning the saints’ communion with God in prayer are propounded and practically improved (Edinburgh: Brown, 1664), pt. 1, pp. 146-47 Pitcarne (1622?–1695) was a partially conforming Scottish minister and academic.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions: 1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’. 2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary. 3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.”

— Alexander Pitcarne, The Spiritual Sacrifice, or a Treatise wherein several Weighty Questions and Cases concerning the saints’ communion with God in prayer are propounded and practically improved (Edinburgh: Brown, 1664), pt. 1, pp. 146-47 Pitcarne (1622?–1695) was a partially conforming Scottish minister and academic.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+then+the+morality+of+our+actions+must+not+be+measured+by+any+decree+concerning+the+futurition+of+events%2C+but+by+some+other+rule%2C+in+which+must+concur+God%E2%80%99s+will+and+appointment%2C+setting+bounds+unto+us+and+designing+our+duty%2C+and+discovering+what+is+well-pleasing+and+acceptable+to+God%2C+honest+and+laudable+in+itself%2C+and+profitable+and+comfortable+to+us+in+the+issue%3B+and+thus+we+have+the+Word+of+God+for+our+direction+and+have+his+laws+and+testimonies+to+be+our+rule%3A+Dt.+29%3A29%3B+Isa.+8%3A20%3B+Dt.+30%3A10-12%3B+Dt.+5%3A29%3B+Ps.+147%3A19%3B+Rom%2C+12%3A2%3B+1+Thess.+4%3A2%3B+1+Pet.+4%3A2%2C+etc.+and+we+may+take+notice+of+these+three+things+as+necessarily+requisite+and+concurring+in+that+which+is+a+warrant+unto+and+rule+of+our+actions+and+petitions%3A+1.+The+good-pleasure+and+decree+of+God%2C+not+concerning+what+shall+come+to+pass%2C+but+concerning+the+quality+and+moral+goodness+of+human+actions%2C+and+which+does+limit+and+set+bounds+to+reasonable+creatures+and+prescribes+unto+them+their+duty%3B+and+this+is+the+fountain+and+first+spring+%28yea+and+by+many+judicious+and+sober+divines+is+judged+to+be+the+supreme+adequate+and+first+rule%29+of+moral+rectitude.+Hence+we+may+conceive+that+God%E2%80%99s+laws+in+Scripture+are+called+%E2%80%98decrees%2C%E2%80%99+%E2%80%98statutes%E2%80%99+and+%E2%80%98ordinances%E2%80%99.+2.+From+this+decree+and+appointment%2C+does+%28to+our+apprehension%29+flow+divine+approbation%2C+complacency+and+delight+in+what+is+thus+appointed+to+be+our+work+and+duty%3A+hence+that+appointment+is+called+the+good%2C+acceptable+and+perfect+will+of+God%2C+Rom.+12%3A2%2C+and+our+actions+when+conform%5Bed%5D+to+that+rule%2C+are+said+to+be+well-pleasing+in+his+sight%2C+Heb.+13%3A2%3B+yea+the+Lord+does+not+only+declare+his+love+of+his+complacency%2C+and+delight+in+these+when+they+are+performed%2C+but+also+He+is+said+to+will+and+desire+%28though+not+according+to+the+Jesuitical+and+Arminian+gloss%29%C2%B9+those+works+while+He+is+speaking+to+the+rebellious+and+disobedient+who+have+slighted+his+laws+and+casten+all+his+statutes+behind+their+backs%3A+Eze.+18%3A23%2C+32%3B+33%3A11%3B+Hos.+6%3A6%3B+1+Sam.+15%3A22%3B+Isa.+61%3A8%3B+Mt.+9%3A13%3B+2+Pet.+3%3A9%2C+etc.+%C2%B9+Arminians%2C+Socinians+and+Jesuits+from+thence+would+collect+a+frustratable+and+inefficacious+will+and+desire+in+God%2C+but+this+phrase+does+only+import+God%E2%80%99s+serious+approbation+of+the+works+of+righteousness+and+detestation+of+the+contrary.+3.+There+must+be+an+intimation+and+promulgation+of+this+decree+and+appointment%2C+and+a+declaration+of+those+things+that+would+be+well+pleasing%2C+and+acceptable+to+God.%E2%80%9D%0A%0A%E2%80%94+Alexander+Pitcarne%2C+The+Spiritual+Sacrifice%2C+or+a+Treatise+wherein+several+Weighty+Questions+and+Cases+concerning+the+saints%E2%80%99+communion+with+God+in+prayer+are+propounded+and+practically+improved+%28Edinburgh%3A+Brown%2C+1664%29%2C+pt.+1%2C+pp.+146-47+Pitcarne+%281622%3F%E2%80%931695%29+was+a+partially+conforming+Scottish+minister+and+academic.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f386bf031.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f386bf031.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=Thus%20then%20the%20morality%20of%20our,well%20pleasing%2C%20and%20acceptable%20to%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-e054536f86" data-kw="">
<blockquote><p>But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.</p></blockquote>

</figure><figure class="quote" id="q-a1648add43" data-kw="">
<blockquote><p>This question is not proposed without cause by us: for on the one hand, if God’s simplicity and immutability are regarded, it will not seem in any way admissible in God that wills be contrary to one another; which also will always be done according to that saying: ‘My will shall be done: and whatsoever He hath willed He hath done.’ Yet if many passages which are handed down in Scripture be considered, we should confess: there is no one who would not say that the will of God is not one only but in a manner manifold: and very often contrary. For He commands many things which do not happen either because He cannot effect them to be, or because He does not will them to be. The former cannot be said without denying God’s omnipotence, and thus deity. Some distinguish between an antecedent will and a consequent will: as [John] Damascus, bk. 2, ch. 46. Others between the will of good-pleasure and the will of sign: as Lombard and the scholastics: Sentences, bk. 1, dist. 45. Others between a will not revealed and a will revealed. Others between absolute volition and conditional volition. Others what God wills to be done respecting us, and into the will which He wills to be from us. Some distinguish in the will of the Almighty a will efficacious and an inefficacious will, as Augustine in the Enchiridion, chs. 102-3. These divisions seem various, but if they be weighed diligently and rightly understood, they reduce to the same. … Efficacious &amp; Inefficacious Will Thirdly, that former and absolute will is also called by Augustine, just as it is most certain, so also most omnipotent, efficacious and invincible: and this is because it is always fulfilled, as much in heaven as on earth. But the other, namely the conditional, is called by the same Augustine the inefficacious will: because, clearly, it is not always fulfilled. For since it depends on conditions which God demands of us, and we do not perform them, it happens that it is not always nor in all things fulfilled, and therefore it is deservedly called inefficacious, namely by itself alone. Let Augustine be read in volume 3, in the Enchiridion to Laurentius, chs. 102-3. Some things also in volume 5, On the City of God, bk. 22, chs. 1-2. … IV. From those things which I have said, it appears, first, why, although there is only one will of God—that is, one decree concerning all things, as has been demonstrated, and that immutable—it is nevertheless said to be manifold: namely, both on account of the diverse kinds of things which God wills, and on account of the diverse manner of willing, as it seems to us: because, namely, he wills some things simply and absolutely, while other things seem to us to be willed conditionally. Then it is also clear that, although there seem to be many partitions of the divine will, all are nevertheless reduced to one partition: namely, to the absolute and secret will, which is also called the will of Good Pleasure; and to the revealed and conditional will, which is not undeservedly named the will of the sign. And thus, in the third place, it appears that, although in reality there is only one will in God, as has been declared and confirmed, it can nevertheless be said to be manifold by different respects. And conversely, although on account of the diverse reasons by which he seems to will, and by which he explains his will, many wills of his are said to exist: it does not therefore hinder that there is in reality only one will of God, and that constant and eternal: which is the head of this our thesis. For although He wills many things, and indeed willed some things, for example, in the Old Testament, but wills other things in the New: yet He willed both those and these by the same will and decree. He willed those at one time, namely, until the time of correction, as the Apostle says: he wills these at another time, until the end of the world. Behold how the diverse kinds of things which he wills do not in the least cause there to be in reality many wills of God: but one and the same will always remains in God. And although he seems to will many things absolutely, but others conditionally: in reality, however, if one must speak properly, all things whatsoever God wills, He wills absolutely and simply. And consequently, all things which He wills also come to pass. For the fact that he is said to will certain things conditionally: this is to be referred only to the manifestation of that will. For there is no conditional will in God, because this fights against his eternal wisdom: but only in the law. And this also, that He signifies in the law that He wills conditionally: He had decreed by his absolute will to do—namely, not to manifest his will concerning the saving or damning of men without a condition; and this because this would be both useful to us and would conduce to the manifesting of his justice. For it was and is useful to us the elect to know that God does not will that anyone be saved without living faith in Christ: and consequently, if we wish to be saved, that we must believe in Christ. Likewise, this conduced to rendering the reprobate inexcusable. For they know what things are necessary for salvation: and consequently, it served to vindicate the justice of God from all accusations and calumnies. Therefore, because it was expedient, He revealed his will with a condition. And in this respect, the will of God seems to be twofold: which, however, is in reality only one, and that firm and constant. For by one and constant will he absolutely wills only the elect to be saved: and consequently He wills only also by true faith, which can be kept, are given: but the reprobate, are absolutely excluded from this salvation: and therefore, are not given the faith by which they can be blessed in heaven. See how the different modes, by which God seems to will, do not remove the fact that there remains but one, eternal and absolute and immutable will of God, on account of which different modes, different wills also seem to exist. V. But that He also commands many things to be done, which are not done: it does not follow from this, however, either that He is impotent: as if He could not cause that what He commands, be done: or that there is truly a manifold will in God: one, which He signifies by word, another, which He does not will to be done in His presence, that which He commands. For there are two kinds of God’s commandments: some are simply absolute: and without any condition at all, either expressed or tacit. These are the most certain, absolute and simple testimonies of the divine will, which is called good pleasure. Such was that to Moses, do all things according to the pattern which you saw on the mountain. Likewise, Thus you shall say to the children of Israel: go into Egypt: and other commands of that kind made both to Moses himself and to the prophets. Because these are the very will of God: therefore He who gives these commands, also brings it about that they are done. And of these is that in Isaiah 46, ‘My counsel shall stand: and my will shall be done;’ and Pm. 115, ‘Whatsoever He willed, He did.’ Therefore, as far as this kind of God’s commandments is concerned: it appears that there is one and the same will: that, namely, which is revealed in the Word: and that, which was hidden in the secret counsel of God. Whence does this appear? From the fact that what God commands happens. There are other commandments, which He promulgated with a condition, if not expressed, at least tacit: such as those which we have in the law. Namely, if we wish to enter into life: that this and that is commanded to us, and that these commandments are to be kept, as Christ explained, saying: If you wish to enter into life, keep the commandments. All these things indeed, are proposed conditionally both to the elect and to the reprobate: meanwhile, however, these commandments have a far different reason, insofar as they are made to the elect: and another, insofar as they are made to the reprobate. Insofar as they are made to the elect: although they are proposed with a condition: yet the will of God in them is absolute. For God simply wills: that they be kept by the elect, if not always, at least at length sometime. And for this reason, because they cannot perform these things by their own strength: He gives them the strength of the Spirit, by which they can; just as He promises through Ezekiel: I will cause that you walk in my commandments. And because even with the strength which the Lord supplies, they cannot perfectly keep the commandments in themselves: He brings it about that they keep them perfectly in Christ: insofar as namely: And through Christ their transgressions are not imputed to them: and on account of Christ, their begun obedience, serving as most perfect, is accepted: and on the contrary, Christ’s justice and obedience are imputed to them: and because finally, at the end in heaven most perfectly, even in themselves, they will complete the sum of the law. In this way also it appears, that the will of God, which is revealed in the commandments: is one and the same in reality with the secret will and will of good pleasure. Therefore, neither here are there two different wills, but one. God acts in giving the law to the elect, as a parent in prescribing laws to his children. He not only teaches what He requires of them: but also signifies that He altogether wills that they keep them, whether they want to or not. But towards the reprobate, He acts as a Lord towards his servants. He will promulgate merely conditional laws: if they want to be with Him, [He wills] altogether that they conduct themselves thus: if not, let them depart. Thus God. Therefore, insofar as these commandments are given to the reprobate, and likewise promises are added to them: all are truly conditional. For the will of God is not absolute, that the reprobate keep them: or attain the promises. This is clear, both from the one example of ‘Pharaoh, I will harden, lest he let the people go:’ and from the fact that they do not keep them, neither in themselves, nor in Christ: in whom they are not: nor ever will keep them. But those things which God properly wills: He brings it about that all of them be accomplished: according to that, All things, whatsoever He willed, He did: And that in Isa. 46, ‘My counsel shall stand, and my will shall be done.’ Wherefore there is not here a double will of God in reality: one in the law, another in the mind and essence of God: for it is not the will of God that the impious should keep the law, as has been said. No one, therefore, will be able to infer in any way from the precepts of God that there is a double will in reality. I will speak more briefly and clearly. The Law can be considered in two ways: either insofar as it is Torah (doctrine), by which it is taught what is pleasing to God, and what must be done by us, or not done, if we wish to be saved: in this way the Law is taught as pertaining to all, both the reprobate and the elect. And because it reveals and teaches what is right and pleasing to God: that is therefore said to be the will of God, because it reflects the nature of God, and what God loves and approves. Or it is considered insofar as it is Torah (commandment): that is, the true testimony of the secret will, or what He wills to be done by us at all. In this way it pertains only to the elect. This will of God, revealed in the law, is fulfilled by the elect: in the way that was mentioned above: and as God wills it to be done by them. The impious, however, the reprobate, while they act against the doctrine of the law, and thereby against their own duty: they do not act against the absolute, true, and properly so-called will of God: but they are said to act against the will of God for this reason, because they act against that which they know to be pleasing to God, and to be approved by God. But if you object that they therefore do not properly sin, because they do not act against the will of God, which is properly the will of God: that exception is easily refuted. For sin is defined, not as what is a transgression of the secret will and divine good pleasure: but as what is a transgression of the divine law: and what is 1 Jn. 3:4, lawlessness (anomia). For we sin for this reason, because we do not perform the things that are good and pleasing to God, and commanded and owed by us, but the contrary. In the law, however, are manifested: what all men owe to God by duty, and what they do not owe. Therefore, they sin more gravely who act against these things, and are therefore said to sin against the will of God: because they sin against that doctrine by which we are taught what is consistent with the nature of God, and what we owe Him by duty: and what is in itself pleasing and acceptable to God. But if you object again: but God therefore mocks the reprobate: when He commands that they do this or that: if this is not His certain and definite will. He does not mock them at all: because by His law, although He does not reveal what He absolutely wills to be done by them (for this is properly the will of God), yet He clearly teaches what is the duty of Him and of every man. Therefore, the law is deservedly called by Moses, Torah (doctrine): because it teaches everyone what his duty is: adding moreover, that whoever has acted against this duty of his, sins gravely and becomes liable to death. On the contrary, he who has done his duty: him [He rewards]. Lest this seem insufficient to you? Or is this mocking? Tell me, I pray: In the parable of the Gospel, those who were first invited to the wedding, and did not come: was it therefore a mockery to them by the king: because he only signified to them what would be pleasing to him, and what was their duty: and did not command them to be compelled, as the second ones, to come to the wedding? Not at all. Yet meanwhile, the will of the king in inviting the first was not that which it was in the second. For in calling these latter, the will of the king was absolute: that they should come at all, and therefore he also brought it about that they should come at all. To the former, however, he only signified: and that candidly and ingenuously: what would be pleasing to Him. As therefore it cannot be said that He called the first to the wedding with an invitation: although the will of the King was not absolute and simple that they come, as it was in calling the second: so neither can it be said that God mocks the reprobate when He gives them the law and calls them: although it is not His will that they come and obey the law. For it is enough to render them inexcusable: that they understand what things are pleasing to God, and what is their duty what things are pleasing to God, and what is their duty: they would have taken and thought that they were doing it by their own virtue, from God, who has absolute right over them and over all, to be commanded. To that point, that God commanded Abraham to kill his son, when nevertheless He did not want him killed: and to Pharaoh, to let the people go, when nevertheless He did not want them to be let go: and from this many try to gather that there were two, and those contrary, wills in God: one expressed by word, the other hidden in His own mind: We answer that this does not follow at all. For there was only one, and that a constant will: namely, that Abraham’s son was not to be killed: nor was the people to be let go by Pharaoh: and thus both were fulfilled. But as for the command given to Pharaoh, it was a doctrine by which He signified what was to be done by Pharaoh if he did not want to be afflicted by so many plagues: and what was his duty, and in itself just and owed: but it was not a testimony of His absolute will. Wherefore it does not follow from that that there were two wills of God. In the command also given to Abraham, it was not a simple will of God that he should kill his son: but only that he should take the sword, with the intention of killing and sacrificing, and that for the sake of God: and thus show his piety towards God, and his promptness in obeying: which was also entirely done: because this was the will of God. But the will of God did not extend as far as the killing. Therefore, when Abraham, having finished all other things, had extended the sword with which he might slaughter his son: the Lord forbade him to do it. To which will also Abraham complied. Thus neither here was there a double will of God: but one. And the Lord said: offer your son as a burnt offering: this therefore was the will of God: and yet afterwards, He signified another will. It was not another: for He did not first want that it should come to the actual slaughter. Therefore Moses premises, The Lord tempted Abraham: but He only wanted that, with other things actually performed, he should also slaughter him with the promptness of his mind, not with the sword. For this is that which, first and properly, the Lord requires in His precepts: that is, that we should be prompt in mind for His obedience, and by this promptness of our mind of ours, the commandments are properly fulfilled before God. The sum in almost all these arguments is admitted as a parable: for the will of God, properly accepted, is the absolute, certain, and firm decree of God, concerning things to be done, either by Himself or by others: and that this is always fulfilled, and is immutable, we do not doubt to affirm. But the Law and all commandments are called the will of God: because by them it is signified and taught what is in itself just, and pleasing to God: and what is required of us, if we wish to be saved. But alone, it is not properly the will of God: but the Torah, the doctrine of the just: and the command of doing it. But if with this doctrine and command there is joined the decree of God, by which He absolutely wills that what He requires be performed: then it will be said to be properly the will of God: as it is, in so far as it is given to the elect. Wherefore not undeservedly they have distinguished in the schools, not indeed the will of God itself: but the signification of the name of the will of God: in so far as it sometimes signifies the decree of God itself, and the good-pleasure: which is properly called will: whence it is also called the will of good-pleasure, and absolute will, because it is without condition: and most omnipotent, because it is always done. But sometimes it signifies that which is in itself pleasing to God, and just: and which the nature of the divine genius refers to: and which is required of us, if we wish to be saved: which is properly called law, and Torah: whence also will is signified: because by this doctrine it is signified what is pleasing to God, and what is of our duty: And conditional will, because these things are required of us, if we wish to obtain eternal salvation. In truth, however, the will of God, properly accepted, is only one, and that perpetual, and firm: as has now been sufficiently and abundantly declared.</p></blockquote>

m the one example of ‘Pharaoh, I will harden, lest he let the people go:’ and from the fact that they do not keep them, neither in themselves, nor in Christ: in whom they are not: nor ever will keep them. But those things which God properly wills: He brings it about that all of them be accomplished: according to that, All things, whatsoever He willed, He did: And that in Isa. 46, ‘My counsel shall stand, and my will shall be done.’ Wherefore there is not here a double will of God in reality: one in the law, another in the mind and essence of God: for it is not the will of God that the impious should keep the law, as has been said. No one, therefore, will be able to infer in any way from the precepts of God that there is a double will in reality. I will speak more briefly and clearly. The Law can be considered in two ways: either insofar as it is Torah (doctrine), by which it is taught what is pleasing to God, and what must be done by us, or not done, if we wish to be saved: in this way the Law is taught as pertaining to all, both the reprobate and the elect. And because it reveals and teaches what is right and pleasing to God: that is therefore said to be the will of God, because it reflects the nature of God, and what God loves and approves. Or it is considered insofar as it is Torah (commandment): that is, the true testimony of the secret will, or what He wills to be done by us at all. In this way it pertains only to the elect. This will of God, revealed in the law, is fulfilled by the elect: in the way that was mentioned above: and as God wills it to be done by them. The impious, however, the reprobate, while they act against the doctrine of the law, and thereby against their own duty: they do not act against the absolute, true, and properly so-called will of God: but they are said to act against the will of God for this reason, because they act against that which they know to be pleasing to God, and to be approved by God. But if you object that they therefore do not properly sin, because they do not act against the will of God, which is properly the will of God: that exception is easily refuted. For sin is defined, not as what is a transgression of the secret will and divine good pleasure: but as what is a transgression of the divine law: and what is 1 Jn. 3:4, lawlessness (anomia). For we sin for this reason, because we do not perform the things that are good and pleasing to God, and commanded and owed by us, but the contrary. In the law, however, are manifested: what all men owe to God by duty, and what they do not owe. Therefore, they sin more gravely who act against these things, and are therefore said to sin against the will of God: because they sin against that doctrine by which we are taught what is consistent with the nature of God, and what we owe Him by duty: and what is in itself pleasing and acceptable to God. But if you object again: but God therefore mocks the reprobate: when He commands that they do this or that: if this is not His certain and definite will. He does not mock them at all: because by His law, although He does not reveal what He absolutely wills to be done by them (for this is properly the will of God), yet He clearly teaches what is the duty of Him and of every man. Therefore, the law is deservedly called by Moses, Torah (doctrine): because it teaches everyone what his duty is: adding moreover, that whoever has acted against this duty of his, sins gravely and becomes liable to death. On the contrary, he who has done his duty: him [He rewards]. Lest this seem insufficient to you? Or is this mocking? Tell me, I pray: In the parable of the Gospel, those who were first invited to the wedding, and did not come: was it therefore a mockery to them by the king: because he only signified to them what would be pleasing to him, and what was their duty: and did not command them to be compelled, as the second ones, to come to the wedding? Not at all. Yet meanwhile, the will of the king in inviting the first was not that which it was in the second. For in calling these latter, the will of the king was absolute: that they should come at all, and therefore he also brought it about that they should come at all. To the former, however, he only signified: and that candidly and ingenuously: what would be pleasing to Him. As therefore it cannot be said that He called the first to the wedding with an invitation: although the will of the King was not absolute and simple that they come, as it was in calling the second: so neither can it be said that God mocks the reprobate when He gives them the law and calls them: although it is not His will that they come and obey the law. For it is enough to render them inexcusable: that they understand what things are pleasing to God, and what is their duty what things are pleasing to God, and what is their duty: they would have taken and thought that they were doing it by their own virtue, from God, who has absolute right over them and over all, to be commanded. To that point, that God commanded Abraham to kill his son, when nevertheless He did not want him killed: and to Pharaoh, to let the people go, when nevertheless He did not want them to be let go: and from this many try to gather that there were two, and those contrary, wills in God: one expressed by word, the other hidden in His own mind: We answer that this does not follow at all. For there was only one, and that a constant will: namely, that Abraham’s son was not to be killed: nor was the people to be let go by Pharaoh: and thus both were fulfilled. But as for the command given to Pharaoh, it was a doctrine by which He signified what was to be done by Pharaoh if he did not want to be afflicted by so many plagues: and what was his duty, and in itself just and owed: but it was not a testimony of His absolute will. Wherefore it does not follow from that that there were two wills of God. In the command also given to Abraham, it was not a simple will of God that he should kill his son: but only that he should take the sword, with the intention of killing and sacrificing, and that for the sake of God: and thus show his piety towards God, and his promptness in obeying: which was also entirely done: because this was the will of God. But the will of God did not extend as far as the killing. Therefore, when Abraham, having finished all other things, had extended the sword with which he might slaughter his son: the Lord forbade him to do it. To which will also Abraham complied. Thus neither here was there a double will of God: but one. And the Lord said: offer your son as a burnt offering: this therefore was the will of God: and yet afterwards, He signified another will. It was not another: for He did not first want that it should come to the actual slaughter. Therefore Moses premises, The Lord tempted Abraham: but He only wanted that, with other things actually performed, he should also slaughter him with the promptness of his mind, not with the sword. For this is that which, first and properly, the Lord requires in His precepts: that is, that we should be prompt in mind for His obedience, and by this promptness of our mind of ours, the commandments are properly fulfilled before God. The sum in almost all these arguments is admitted as a parable: for the will of God, properly accepted, is the absolute, certain, and firm decree of God, concerning things to be done, either by Himself or by others: and that this is always fulfilled, and is immutable, we do not doubt to affirm. But the Law and all commandments are called the will of God: because by them it is signified and taught what is in itself just, and pleasing to God: and what is required of us, if we wish to be saved. But alone, it is not properly the will of God: but the Torah, the doctrine of the just: and the command of doing it. But if with this doctrine and command there is joined the decree of God, by which He absolutely wills that what He requires be performed: then it will be said to be properly the will of God: as it is, in so far as it is given to the elect. Wherefore not undeservedly they have distinguished in the schools, not indeed the will of God itself: but the signification of the name of the will of God: in so far as it sometimes signifies the decree of God itself, and the good-pleasure: which is properly called will: whence it is also called the will of good-pleasure, and absolute will, because it is without condition: and most omnipotent, because it is always done. But sometimes it signifies that which is in itself pleasing to God, and just: and which the nature of the divine genius refers to: and which is required of us, if we wish to be saved: which is properly called law, and Torah: whence also will is signified: because by this doctrine it is signified what is pleasing to God, and what is of our duty: And conditional will, because these things are required of us, if we wish to obtain eternal salvation. In truth, however, the will of God, properly accepted, is only one, and that perpetual, and firm: as has now been sufficiently and abundantly declared.”

— Jerome Zanchi, On the Nature of God... (Heidelberg: Wiener Neustadt, 1577), bk. 3 tr. AI by The Faith Received | ch. 4, quest. 3, ‘Whether the will of God is one and simple, or rather manifold: and if manifold, how many those wills are?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+question+is+not+proposed+without+cause+by+us%3A+for+on+the+one+hand%2C+if+God%E2%80%99s+simplicity+and+immutability+are+regarded%2C+it+will+not+seem+in+any+way+admissible+in+God+that+wills+be+contrary+to+one+another%3B+which+also+will+always+be+done+according+to+that+saying%3A+%E2%80%98My+will+shall+be+done%3A+and+whatsoever+He+hath+willed+He+hath+done.%E2%80%99+Yet+if+many+passages+which+are+handed+down+in+Scripture+be+considered%2C+we+should+confess%3A+there+is+no+one+who+would+not+say+that+the+will+of+God+is+not+one+only+but+in+a+manner+manifold%3A+and+very+often+contrary.+For+He+commands+many+things+which+do+not+happen+either+because+He+cannot+effect+them+to+be%2C+or+because+He+does+not+will+them+to+be.+The+former+cannot+be+said+without+denying+God%E2%80%99s+omnipotence%2C+and+thus+deity.+Some+distinguish+between+an+antecedent+will+and+a+consequent+will%3A+as+%5BJohn%5D+Damascus%2C+bk.+2%2C+ch.+46.+Others+between+the+will+of+good-pleasure+and+the+will+of+sign%3A+as+Lombard+and+the+scholastics%3A+Sentences%2C+bk.+1%2C+dist.+45.+Others+between+a+will+not+revealed+and+a+will+revealed.+Others+between+absolute+volition+and+conditional+volition.+Others+what+God+wills+to+be+done+respecting+us%2C+and+into+the+will+which+He+wills+to+be+from+us.+Some+distinguish+in+the+will+of+the+Almighty+a+will+efficacious+and+an+inefficacious+will%2C+as+Augustine+in+the+Enchiridion%2C+chs.+102-3.+These+divisions+seem+various%2C+but+if+they+be+weighed+diligently+and+rightly+understood%2C+they+reduce+to+the+same.+%E2%80%A6+Efficacious+%26+Inefficacious+Will+Thirdly%2C+that+former+and+absolute+will+is+also+called+by+Augustine%2C+just+as+it+is+most+certain%2C+so+also+most+omnipotent%2C+efficacious+and+invincible%3A+and+this+is+because+it+is+always+fulfilled%2C+as+much+in+heaven+as+on+earth.+But+the+other%2C+namely+the+conditional%2C+is+called+by+the+same+Augustine+the+inefficacious+will%3A+because%2C+clearly%2C+it+is+not+always+fulfilled.+For+since+it+depends+on+conditions+which+God+demands+of+us%2C+and+we+do+not+perform+them%2C+it+happens+that+it+is+not+always+nor+in+all+things+fulfilled%2C+and+therefore+it+is+deservedly+called+inefficacious%2C+namely+by+itself+alone.+Let+Augustine+be+read+in+volume+3%2C+in+the+Enchiridion+to+Laurentius%2C+chs.+102-3.+Some+things+also+in+volume+5%2C+On+the+City+of+God%2C+bk.+22%2C+chs.+1-2.+%E2%80%A6+IV.+From+those+things+which+I+have+said%2C+it+appears%2C+first%2C+why%2C+although+there+is+only+one+will+of+God%E2%80%94that+is%2C+one+decree+concerning+all+things%2C+as+has+been+demonstrated%2C+and+that+immutable%E2%80%94it+is+nevertheless+said+to+be+manifold%3A+namely%2C+both+on+account+of+the+diverse+kinds+of+things+which+God+wills%2C+and+on+account+of+the+diverse+manner+of+willing%2C+as+it+seems+to+us%3A+because%2C+namely%2C+he+wills+some+things+simply+and+absolutely%2C+while+other+things+seem+to+us+to+be+willed+conditionally.+Then+it+is+also+clear+that%2C+although+there+seem+to+be+many+partitions+of+the+divine+will%2C+all+are+nevertheless+reduced+to+one+partition%3A+namely%2C+to+the+absolute+and+secret+will%2C+which+is+also+called+the+will+of+Good+Pleasure%3B+and+to+the+revealed+and+conditional+will%2C+which+is+not+undeservedly+named+the+will+of+the+sign.+And+thus%2C+in+the+third+place%2C+it+appears+that%2C+although+in+reality+there+is+only+one+will+in+God%2C+as+has+been+declared+and+confirmed%2C+it+can+nevertheless+be+said+to+be+manifold+by+different+respects.+And+conversely%2C+although+on+account+of+the+diverse+reasons+by+which+he+seems+to+will%2C+and+by+which+he+explains+his+will%2C+many+wills+of+his+are+said+to+exist%3A+it+does+not+therefore+hinder+that+there+is+in+reality+only+one+will+of+God%2C+and+that+constant+and+eternal%3A+which+is+the+head+of+this+our+thesis.+For+although+He+wills+many+things%2C+and+indeed+willed+some+things%2C+for+example%2C+in+the+Old+Testament%2C+but+wills+other+things+in+the+New%3A+yet+He+willed+both+those+and+these+by+the+same+will+and+decree.+He+willed+those+at+one+time%2C+namely%2C+until+the+time+of+correction%2C+as+the+Apostle+says%3A+he+wills+these+at+another+time%2C+until+the+end+of+the+world.+Behold+how+the+diverse+kinds+of+things+which+he+wills+do+not+in+the+least+cause+there+to+be+in+reality+many+wills+of+God%3A+but+one+and+the+same+will+always+remains+in+God.+And+although+he+seems+to+will+many+things+absolutely%2C+but+others+conditionally%3A+in+reality%2C+however%2C+if+one+must+speak+properly%2C+all+things+whatsoever+God+wills%2C+He+wills+absolutely+and+simply.+And+consequently%2C+all+things+which+He+wills+also+come+to+pass.+For+the+fact+that+he+is+said+to+will+certain+things+conditionally%3A+this+is+to+be+referred+only+to+the+manifestation+of+that+will.+For+there+is+no+conditional+will+in+God%2C+because+this+fights+against+his+eternal+wisdom%3A+but+only+in+the+law.+And+this+also%2C+that+He+signifies+in+the+law+that+He+wills+conditionally%3A+He+had+decreed+by+his+absolute+will+to+do%E2%80%94namely%2C+not+to+manifest+his+will+concerning+the+saving+or+damning+of+men+without+a+condition%3B+and+this+because+this+would+be+both+useful+to+us+and+would+conduce+to+the+manifesting+of+his+justice.+For+it+was+and+is+useful+to+us+the+elect+to+know+that+God+does+not+will+that+anyone+be+saved+without+living+faith+in+Christ%3A+and+consequently%2C+if+we+wish+to+be+saved%2C+that+we+must+believe+in+Christ.+Likewise%2C+this+conduced+to+rendering+the+reprobate+inexcusable.+For+they+know+what+things+are+necessary+for+salvation%3A+and+consequently%2C+it+served+to+vindicate+the+justice+of+God+from+all+accusations+and+calumnies.+Therefore%2C+because+it+was+expedient%2C+He+revealed+his+will+with+a+condition.+And+in+this+respect%2C+the+will+of+God+seems+to+be+twofold%3A+which%2C+however%2C+is+in+reality+only+one%2C+and+that+firm+and+constant.+For+by+one+and+constant+will+he+absolutely+wills+only+the+elect+to+be+saved%3A+and+consequently+He+wills+only+also+by+true+faith%2C+which+can+be+kept%2C+are+given%3A+but+the+reprobate%2C+are+absolutely+excluded+from+this+salvation%3A+and+therefore%2C+are+not+given+the+faith+by+which+they+can+be+blessed+in+heaven.+See+how+the+different+modes%2C+by+which+God+seems+to+will%2C+do+not+remove+the+fact+that+there+remains+but+one%2C+eternal+and+absolute+and+immutable+will+of+God%2C+on+account+of+which+different+modes%2C+different+wills+also+seem+to+exist.+V.+But+that+He+also+commands+many+things+to+be+done%2C+which+are+not+done%3A+it+does+not+follow+from+this%2C+however%2C+either+that+He+is+impotent%3A+as+if+He+could+not+cause+that+what+He+commands%2C+be+done%3A+or+that+there+is+truly+a+manifold+will+in+God%3A+one%2C+which+He+signifies+by+word%2C+another%2C+which+He+does+not+will+to+be+done+in+His+presence%2C+that+which+He+commands.+For+there+are+two+kinds+of+God%E2%80%99s+commandments%3A+some+are+simply+absolute%3A+and+without+any+condition+at+all%2C+either+expressed+or+tacit.+These+are+the+most+certain%2C+absolute+and+simple+testimonies+of+the+divine+will%2C+which+is+called+good+pleasure.+Such+was+that+to+Moses%2C+do+all+things+according+to+the+pattern+which+you+saw+on+the+mountain.+Likewise%2C+Thus+you+shall+say+to+the+children+of+Israel%3A+go+into+Egypt%3A+and+other+commands+of+that+kind+made+both+to+Moses+himself+and+to+the+prophets.+Because+these+are+the+very+will+of+God%3A+therefore+He+who+gives+these+commands%2C+also+brings+it+about+that+they+are+done.+And+of+these+is+that+in+Isaiah+46%2C+%E2%80%98My+counsel+shall+stand%3A+and+my+will+shall+be+done%3B%E2%80%99+and+Pm.+115%2C+%E2%80%98Whatsoever+He+willed%2C+He+did.%E2%80%99+Therefore%2C+as+far+as+this+kind+of+God%E2%80%99s+commandments+is+concerned%3A+it+appears+that+there+is+one+and+the+same+will%3A+that%2C+namely%2C+which+is+revealed+in+the+Word%3A+and+that%2C+which+was+hidden+in+the+secret+counsel+of+God.+Whence+does+this+appear%3F+From+the+fact+that+what+God+commands+happens.+There+are+other+commandments%2C+which+He+promulgated+with+a+condition%2C+if+not+expressed%2C+at+least+tacit%3A+such+as+those+which+we+have+in+the+law.+Namely%2C+if+we+wish+to+enter+into+life%3A+that+this+and+that+is+commanded+to+us%2C+and+that+these+commandments+are+to+be+kept%2C+as+Christ+explained%2C+saying%3A+If+you+wish+to+enter+into+life%2C+keep+the+commandments.+All+these+things+indeed%2C+are+proposed+conditionally+both+to+the+elect+and+to+the+reprobate%3A+meanwhile%2C+however%2C+these+commandments+have+a+far+different+reason%2C+insofar+as+they+are+made+to+the+elect%3A+and+another%2C+insofar+as+they+are+made+to+the+reprobate.+Insofar+as+they+are+made+to+the+elect%3A+although+they+are+proposed+with+a+condition%3A+yet+the+will+of+God+in+them+is+absolute.+For+God+simply+wills%3A+that+they+be+kept+by+the+elect%2C+if+not+always%2C+at+least+at+length+sometime.+And+for+this+reason%2C+because+they+cannot+perform+these+things+by+their+own+strength%3A+He+gives+them+the+strength+of+the+Spirit%2C+by+which+they+can%3B+just+as+He+promises+through+Ezekiel%3A+I+will+cause+that+you+walk+in+my+commandments.+And+because+even+with+the+strength+which+the+Lord+supplies%2C+they+cannot+perfectly+keep+the+commandments+in+themselves%3A+He+brings+it+about+that+they+keep+them+perfectly+in+Christ%3A+insofar+as+namely%3A+And+through+Christ+their+transgressions+are+not+imputed+to+them%3A+and+on+account+of+Christ%2C+their+begun+obedience%2C+serving+as+most+perfect%2C+is+accepted%3A+and+on+the+contrary%2C+Christ%E2%80%99s+justice+and+obedience+are+imputed+to+them%3A+and+because+finally%2C+at+the+end+in+heaven+most+perfectly%2C+even+in+themselves%2C+they+will+complete+the+sum+of+the+law.+In+this+way+also+it+appears%2C+that+the+will+of+God%2C+which+is+revealed+in+the+commandments%3A+is+one+and+the+same+in+reality+with+the+secret+will+and+will+of+good+pleasure.+Therefore%2C+neither+here+are+there+two+different+wills%2C+but+one.+God+acts+in+giving+the+law+to+the+elect%2C+as+a+parent+in+prescribing+laws+to+his+children.+He+not+only+teaches+what+He+requires+of+them%3A+but+also+signifies+that+He+altogether+wills+that+they+keep+them%2C+whether+they+want+to+or+not.+But+towards+the+reprobate%2C+He+acts+as+a+Lord+towards+his+servants.+He+will+promulgate+merely+conditional+laws%3A+if+they+want+to+be+with+Him%2C+%5BHe+wills%5D+altogether+that+they+conduct+themselves+thus%3A+if+not%2C+let+them+depart.+Thus+God.+Therefore%2C+insofar+as+these+commandments+are+given+to+the+reprobate%2C+and+likewise+promises+are+added+to+them%3A+all+are+truly+conditional.+For+the+will+of+God+is+not+absolute%2C+that+the+reprobate+keep+them%3A+or+attain+the+promises.+This+is+clear%2C+both+from+the+one+example+of+%E2%80%98Pharaoh%2C+I+will+harden%2C+lest+he+let+the+people+go%3A%E2%80%99+and+from+the+fact+that+they+do+not+keep+them%2C+neither+in+themselves%2C+nor+in+Christ%3A+in+whom+they+are+not%3A+nor+ever+will+keep+them.+But+those+things+which+God+properly+wills%3A+He+brings+it+about+that+all+of+them+be+accomplished%3A+according+to+that%2C+All+things%2C+whatsoever+He+willed%2C+He+did%3A+And+that+in+Isa.+46%2C+%E2%80%98My+counsel+shall+stand%2C+and+my+will+shall+be+done.%E2%80%99+Wherefore+there+is+not+here+a+double+will+of+God+in+reality%3A+one+in+the+law%2C+another+in+the+mind+and+essence+of+God%3A+for+it+is+not+the+will+of+God+that+the+impious+should+keep+the+law%2C+as+has+been+said.+No+one%2C+therefore%2C+will+be+able+to+infer+in+any+way+from+the+precepts+of+God+that+there+is+a+double+will+in+reality.+I+will+speak+more+briefly+and+clearly.+The+Law+can+be+considered+in+two+ways%3A+either+insofar+as+it+is+Torah+%28doctrine%29%2C+by+which+it+is+taught+what+is+pleasing+to+God%2C+and+what+must+be+done+by+us%2C+or+not+done%2C+if+we+wish+to+be+saved%3A+in+this+way+the+Law+is+taught+as+pertaining+to+all%2C+both+the+reprobate+and+the+elect.+And+because+it+reveals+and+teaches+what+is+right+and+pleasing+to+God%3A+that+is+therefore+said+to+be+the+will+of+God%2C+because+it+reflects+the+nature+of+God%2C+and+what+God+loves+and+approves.+Or+it+is+considered+insofar+as+it+is+Torah+%28commandment%29%3A+that+is%2C+the+true+testimony+of+the+secret+will%2C+or+what+He+wills+to+be+done+by+us+at+all.+In+this+way+it+pertains+only+to+the+elect.+This+will+of+God%2C+revealed+in+the+law%2C+is+fulfilled+by+the+elect%3A+in+the+way+that+was+mentioned+above%3A+and+as+God+wills+it+to+be+done+by+them.+The+impious%2C+however%2C+the+reprobate%2C+while+they+act+against+the+doctrine+of+the+law%2C+and+thereby+against+their+own+duty%3A+they+do+not+act+against+the+absolute%2C+true%2C+and+properly+so-called+will+of+God%3A+but+they+are+said+to+act+against+the+will+of+God+for+this+reason%2C+because+they+act+against+that+which+they+know+to+be+pleasing+to+God%2C+and+to+be+approved+by+God.+But+if+you+object+that+they+therefore+do+not+properly+sin%2C+because+they+do+not+act+against+the+will+of+God%2C+which+is+properly+the+will+of+God%3A+that+exception+is+easily+refuted.+For+sin+is+defined%2C+not+as+what+is+a+transgression+of+the+secret+will+and+divine+good+pleasure%3A+but+as+what+is+a+transgression+of+the+divine+law%3A+and+what+is+1+Jn.+3%3A4%2C+lawlessness+%28anomia%29.+For+we+sin+for+this+reason%2C+because+we+do+not+perform+the+things+that+are+good+and+pleasing+to+God%2C+and+commanded+and+owed+by+us%2C+but+the+contrary.+In+the+law%2C+however%2C+are+manifested%3A+what+all+men+owe+to+God+by+duty%2C+and+what+they+do+not+owe.+Therefore%2C+they+sin+more+gravely+who+act+against+these+things%2C+and+are+therefore+said+to+sin+against+the+will+of+God%3A+because+they+sin+against+that+doctrine+by+which+we+are+taught+what+is+consistent+with+the+nature+of+God%2C+and+what+we+owe+Him+by+duty%3A+and+what+is+in+itself+pleasing+and+acceptable+to+God.+But+if+you+object+again%3A+but+God+therefore+mocks+the+reprobate%3A+when+He+commands+that+they+do+this+or+that%3A+if+this+is+not+His+certain+and+definite+will.+He+does+not+mock+them+at+all%3A+because+by+His+law%2C+although+He+does+not+reveal+what+He+absolutely+wills+to+be+done+by+them+%28for+this+is+properly+the+will+of+God%29%2C+yet+He+clearly+teaches+what+is+the+duty+of+Him+and+of+every+man.+Therefore%2C+the+law+is+deservedly+called+by+Moses%2C+Torah+%28doctrine%29%3A+because+it+teaches+everyone+what+his+duty+is%3A+adding+moreover%2C+that+whoever+has+acted+against+this+duty+of+his%2C+sins+gravely+and+becomes+liable+to+death.+On+the+contrary%2C+he+who+has+done+his+duty%3A+him+%5BHe+rewards%5D.+Lest+this+seem+insufficient+to+you%3F+Or+is+this+mocking%3F+Tell+me%2C+I+pray%3A+In+the+parable+of+the+Gospel%2C+those+who+were+first+invited+to+the+wedding%2C+and+did+not+come%3A+was+it+therefore+a+mockery+to+them+by+the+king%3A+because+he+only+signified+to+them+what+would+be+pleasing+to+him%2C+and+what+was+their+duty%3A+and+did+not+command+them+to+be+compelled%2C+as+the+second+ones%2C+to+come+to+the+wedding%3F+Not+at+all.+Yet+meanwhile%2C+the+will+of+the+king+in+inviting+the+first+was+not+that+which+it+was+in+the+second.+For+in+calling+these+latter%2C+the+will+of+the+king+was+absolute%3A+that+they+should+come+at+all%2C+and+therefore+he+also+brought+it+about+that+they+should+come+at+all.+To+the+former%2C+however%2C+he+only+signified%3A+and+that+candidly+and+ingenuously%3A+what+would+be+pleasing+to+Him.+As+therefore+it+cannot+be+said+that+He+called+the+first+to+the+wedding+with+an+invitation%3A+although+the+will+of+the+King+was+not+absolute+and+simple+that+they+come%2C+as+it+was+in+calling+the+second%3A+so+neither+can+it+be+said+that+God+mocks+the+reprobate+when+He+gives+them+the+law+and+calls+them%3A+although+it+is+not+His+will+that+they+come+and+obey+the+law.+For+it+is+enough+to+render+them+inexcusable%3A+that+they+understand+what+things+are+pleasing+to+God%2C+and+what+is+their+duty+what+things+are+pleasing+to+God%2C+and+what+is+their+duty%3A+they+would+have+taken+and+thought+that+they+were+doing+it+by+their+own+virtue%2C+from+God%2C+who+has+absolute+right+over+them+and+over+all%2C+to+be+commanded.+To+that+point%2C+that+God+commanded+Abraham+to+kill+his+son%2C+when+nevertheless+He+did+not+want+him+killed%3A+and+to+Pharaoh%2C+to+let+the+people+go%2C+when+nevertheless+He+did+not+want+them+to+be+let+go%3A+and+from+this+many+try+to+gather+that+there+were+two%2C+and+those+contrary%2C+wills+in+God%3A+one+expressed+by+word%2C+the+other+hidden+in+His+own+mind%3A+We+answer+that+this+does+not+follow+at+all.+For+there+was+only+one%2C+and+that+a+constant+will%3A+namely%2C+that+Abraham%E2%80%99s+son+was+not+to+be+killed%3A+nor+was+the+people+to+be+let+go+by+Pharaoh%3A+and+thus+both+were+fulfilled.+But+as+for+the+command+given+to+Pharaoh%2C+it+was+a+doctrine+by+which+He+signified+what+was+to+be+done+by+Pharaoh+if+he+did+not+want+to+be+afflicted+by+so+many+plagues%3A+and+what+was+his+duty%2C+and+in+itself+just+and+owed%3A+but+it+was+not+a+testimony+of+His+absolute+will.+Wherefore+it+does+not+follow+from+that+that+there+were+two+wills+of+God.+In+the+command+also+given+to+Abraham%2C+it+was+not+a+simple+will+of+God+that+he+should+kill+his+son%3A+but+only+that+he+should+take+the+sword%2C+with+the+intention+of+killing+and+sacrificing%2C+and+that+for+the+sake+of+God%3A+and+thus+show+his+piety+towards+God%2C+and+his+promptness+in+obeying%3A+which+was+also+entirely+done%3A+because+this+was+the+will+of+God.+But+the+will+of+God+did+not+extend+as+far+as+the+killing.+Therefore%2C+when+Abraham%2C+having+finished+all+other+things%2C+had+extended+the+sword+with+which+he+might+slaughter+his+son%3A+the+Lord+forbade+him+to+do+it.+To+which+will+also+Abraham+complied.+Thus+neither+here+was+there+a+double+will+of+God%3A+but+one.+And+the+Lord+said%3A+offer+your+son+as+a+burnt+offering%3A+this+therefore+was+the+will+of+God%3A+and+yet+afterwards%2C+He+signified+another+will.+It+was+not+another%3A+for+He+did+not+first+want+that+it+should+come+to+the+actual+slaughter.+Therefore+Moses+premises%2C+The+Lord+tempted+Abraham%3A+but+He+only+wanted+that%2C+with+other+things+actually+performed%2C+he+should+also+slaughter+him+with+the+promptness+of+his+mind%2C+not+with+the+sword.+For+this+is+that+which%2C+first+and+properly%2C+the+Lord+requires+in+His+precepts%3A+that+is%2C+that+we+should+be+prompt+in+mind+for+His+obedience%2C+and+by+this+promptness+of+our+mind+of+ours%2C+the+commandments+are+properly+fulfilled+before+God.+The+sum+in+almost+all+these+arguments+is+admitted+as+a+parable%3A+for+the+will+of+God%2C+properly+accepted%2C+is+the+absolute%2C+certain%2C+and+firm+decree+of+God%2C+concerning+things+to+be+done%2C+either+by+Himself+or+by+others%3A+and+that+this+is+always+fulfilled%2C+and+is+immutable%2C+we+do+not+doubt+to+affirm.+But+the+Law+and+all+commandments+are+called+the+will+of+God%3A+because+by+them+it+is+signified+and+taught+what+is+in+itself+just%2C+and+pleasing+to+God%3A+and+what+is+required+of+us%2C+if+we+wish+to+be+saved.+But+alone%2C+it+is+not+properly+the+will+of+God%3A+but+the+Torah%2C+the+doctrine+of+the+just%3A+and+the+command+of+doing+it.+But+if+with+this+doctrine+and+command+there+is+joined+the+decree+of+God%2C+by+which+He+absolutely+wills+that+what+He+requires+be+performed%3A+then+it+will+be+said+to+be+properly+the+will+of+God%3A+as+it+is%2C+in+so+far+as+it+is+given+to+the+elect.+Wherefore+not+undeservedly+they+have+distinguished+in+the+schools%2C+not+indeed+the+will+of+God+itself%3A+but+the+signification+of+the+name+of+the+will+of+God%3A+in+so+far+as+it+sometimes+signifies+the+decree+of+God+itself%2C+and+the+good-pleasure%3A+which+is+properly+called+will%3A+whence+it+is+also+called+the+will+of+good-pleasure%2C+and+absolute+will%2C+because+it+is+without+condition%3A+and+most+omnipotent%2C+because+it+is+always+done.+But+sometimes+it+signifies+that+which+is+in+itself+pleasing+to+God%2C+and+just%3A+and+which+the+nature+of+the+divine+genius+refers+to%3A+and+which+is+required+of+us%2C+if+we+wish+to+be+saved%3A+which+is+properly+called+law%2C+and+Torah%3A+whence+also+will+is+signified%3A+because+by+this+doctrine+it+is+signified+what+is+pleasing+to+God%2C+and+what+is+of+our+duty%3A+And+conditional+will%2C+because+these+things+are+required+of+us%2C+if+we+wish+to+obtain+eternal+salvation.+In+truth%2C+however%2C+the+will+of+God%2C+properly+accepted%2C+is+only+one%2C+and+that+perpetual%2C+and+firm%3A+as+has+now+been+sufficiently+and+abundantly+declared.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+On+the+Nature+of+God...+%28Heidelberg%3A+Wiener+Neustadt%2C+1577%29%2C+bk.+3+tr.+AI+by+The+Faith+Received+%7C+ch.+4%2C+quest.+3%2C+%E2%80%98Whether+the+will+of+God+is+one+and+simple%2C+or+rather+manifold%3A+and+if+manifold%2C+how+many+those+wills+are%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1648add43.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1648add43.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=This%20question%20is%20not%20proposed%20without,now%20been%20sufficiently%20and%20abundantly%20declared." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But against this it may be objected what St. Peter [and Timothy] says: that He would have all men to be saved and to come to the knowledge of his will. (2 Pet. 3 [v. 9]; 1 Tim. 2:4) And therefore either there are diverse and contrary wills in God, or it is his will that all should be saved, but yet are not, because they will not believe. I answer: That the will of God is diversely distinguished by the doctors, as [John] Damascene (The will of God is not diverse, Damascene, bk. 2, ch. 46), into an: 1. Antecedent will 2. Consequent will Lombard and the Schoolmen (bk. 1, ch. 45) into his: 1. Signified will 2. Well-pleasing will Tertullian (Lib. Exhort. ad castitatem.), into his: 1. Efficient will 2. Permissive will Whereof he calls the first voluntas pura and the other voluntas indulgentiae. St. Augustine (Enchiridion, ch. 102 &amp; 103), into his: 1. Effectual working and omnipotent will 2. Not working, or not efficient will Others into his: Absolute will Conditional will Others into his Secret will Revealed will All which, and all such like distinctions of God’s will, if they be diligently observed and well understood, do fall into the same end and do no ways prove either diverse wills to be in God or any contradiction to be in the will of God. For it is most certain that as the essence of God is most simple, without composition or division, so the will of God, which is nothing else but his eternal decree concerning all things, is one and the selfsame immutable and unresistible: in so much that the wicked, who as much as in them lies, do resist the will of God revealed and commanded unto us in his Word, yet notwithstanding, will they, nill they, they fulfill the will of God decreed in Himself from all eternity; as you may see most plainly in the example of Pilate, Herod and the wicked Jews, who in crucifying Christ, rebelled and resisted the will of God revealed in his word, yet herein they did perform the secret will of God, which before all worlds He had determined should be done, as St. Peter shows (Acts 2:23; Augustine in Enchiridion, ch. 98), Et sic in hoc ipso quod contra voluntatem Dei fecerunt, de ipsis facta est voluntas eius: And so in this very thing wherein they did against God’s will, God effected his own will. (Idem, de cor. et gratia) Et de his qui faciunt quod non vult, facit ipse, quae vult: And touching these men which do against his will, He does whatsoever He will.</p></blockquote>

<blockquote><p>Again, revelation is either uncreated or created. There is an uncreated revelation which is infinite, and such is that which the Father reveals to the Son from all eternity. The created revelation hath three degrees, 1. Imperfect, 2. Perfect, 3. And most perfect. The most perfect revelation is in Christ-man, in whom are all the treasures of wisdom and knowledge. The perfect revelation is in angels and blessed souls in heaven: the imperfect is in men on earth. The revelation vouchsafed to men on earth is either ineffectual or effectual. The ineffectual is a revelation not available to salvation, such is that revelation which may befall wicked men. For they may prophesy, as is granted, Mt. 7. But I call this revelation ineffectual because they may be castaways for all this. But properly, revelation is the heritage of the saints. For in them only it is effectual, and thus the Lord does grant revelation in two degrees: 1. Sometimes it is such an illumination as works a full assurance: sometimes it is an illumination that works only a persuasion. In weak Christians the work of the Spirit of revelation is persuasion, but in strong Christians it is full assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Three First Chapters of the First Epistle General of St. Peter… (London: Miles, 1637), on 1 Pet. 1:12</cite>, p. 86</span></figcaption>

%20full%20assurance." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>A second question is, How far the Law can draw a sinner to Christ? Antinomians tell us of a legal drawing and conversion, and of an evangelic drawing; the legal drawing they say is ours [that of the reformed]; the latter theirs. Assertion 1. The difference between the letter of the Law and the Gospel is not in the manner of working, for the letter of either Law or Gospel is alike ineffectual and fruitless to draw any to Christ. Christ preached the Gospel to hard-hearted Pharisees; it moved them not. Moses preached the Law and the curses thereof to the stiffnecked Jews and they were as little humbled. Sounds and syllables of ten hells, of twenty heavens and Gospels, without the Spirit’s working, are alike fruitless. And we grant the Law is a sleepy keeper of a captive sinner; he may either steal away from his keeper or if he be awed with his keeper, he is not kept from any spiritual, internal breach of the Law, nor moved thereby to sincere and spiritual walking. But the difference between Law and Gospel is not in the internal manner of working, but in two other things: 1. In the matter contained in Law and Gospel: because nature is refractory to violence and the Law can do nothing but curse sinners; therefore it can draw no man to Christ. The Gospel again contains sweet and glorious promises of giving a new heart to the elect, of admitting to the Prince of peace laden and broken-hearted mourners in Zion and in conferring on them a free imputed righteousness; and this is in itself a taking-way, but without the Gospel-spirit [it is] utterly ineffectual. 2. To the Gospel there is a Spirit added, which works as God does with an omnipotent pull; and this Spirit does also use the Law to prepare and humble; though this be by a higher power than goes along with the Law as the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself… (London: 1647)</cite>, pp. 272-318</span></figcaption>

<blockquote><p>(2) In this Sinai-Covenant Jesus Christ is frequently tendered unto Israel, and that in variety of notions and considerations as has been abundantly manifested: The Tabernacle, the veil, the ark, the mercy-seat over the ark, the high priest with his consecration, garments, office, etc. the sacrifices of all sorts, the altar of incense, the altar of burnt-offering, etc. they all typed out and tendered Christ to Israel. Consequently true faith in Christ must herein be necessarily implied and required of Israel for discerning Christ in these mysteries, for apprehending and applying Him unto themselves for righteousness and salvation accordingly. For without such faith to apprehend and apply Christ, all these manifestations of Christ to Israel had been vain, useless and ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum: the Mystery &amp; Marrow of the Bible, viz. God’s Covenant with Man… (London: R.W., 1657)</cite>, bk. 3, ch. 4, p. 865</span></figcaption>

<div class="actions"><button class="copy" data-copy="“(2) In this Sinai-Covenant Jesus Christ is frequently tendered unto Israel, and that in variety of notions and considerations as has been abundantly manifested: The Tabernacle, the veil, the ark, the mercy-seat over the ark, the high priest with his consecration, garments, office, etc. the sacrifices of all sorts, the altar of incense, the altar of burnt-offering, etc. they all typed out and tendered Christ to Israel. Consequently true faith in Christ must herein be necessarily implied and required of Israel for discerning Christ in these mysteries, for apprehending and applying Him unto themselves for righteousness and salvation accordingly. For without such faith to apprehend and apply Christ, all these manifestations of Christ to Israel had been vain, useless and ineffectual.”

<blockquote><p>Question 9. Whether every will of God is fulfilled? Denied with a distinction. Answer: Concerning the will properly taken, or of good-pleasure [beneplaciti]: affirmed, Isa. 46:10. Concerning the will taken metonymically, or of command [mandati]: denied. And this opinion is insinuated by Thomas, in [Summa] pt. 1, question 19, article 6, where he disputes that every will of God is always fulfilled, together with article 11, where he distinguishes the will into [the will] of the sign and [the will] of good-pleasure. … Question 11. By what will can anyone justly will that which God does not will? Explained. Answer: We thus explain it: by a right will, which is conformable to the law and general command of God, one can will that which God does not will by the will of good-pleasure, or the hidden [will]. See Gen. 22, compared with Heb. 11:17 and 2 Sam. 7:2-3, 13. Question 12, Whether the precepts of God sometimes differ from his will? Affirmed with a distinction. Answer: In the proximate object they differ: for of the precept, or command, there can be another object—and indeed an opposite one—than [that] of the will or good-pleasure. As is manifest, Gen. 22, where the proximate object of the divine command given to Abraham was the slaying [mactatio] of Isaac; and the object of the good-pleasure, or of the divine will properly so called, was the non-slaying of the same. But although the objects of the will of command and of good-pleasure are opposed among themselves, yet the acts of command and of will are not opposed, but the former is subordinated to the latter. For God, by the will of good-pleasure, willed the command, or to command Abraham; but He did not will the thing commanded to Abraham, or the fulfillment of the commanded thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

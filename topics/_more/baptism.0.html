<figure class="quote" id="q-529d8f82c6" data-kw="">
<blockquote><p>Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain… (Cambridge, 1600)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/529d8f82c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba,the%20son%20of%20God%20by%20adoption." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1946aa0d79" data-kw="">
<blockquote><p>But if anyone either on the testimony of the church, or parents, or witnesses, or of others cannot be sure about the baptism that he had received in infancy, or if it happened that he was moistened by no other baptism than that of the midwives or private individuals, we are of the opinion that such a man may be baptized without any scruple. For the baptism applied by the last-mentioned people is not baptism at all, and the baptism of the first mentioned people is worthless, as the Council of Carthage [AD 418] has rightly decided (5.3): ‘Concerning infants it has been decided that whenever no very certain witnesses are found who testify without a doubt that they were baptized, and whenever they themselves are not, on account of their age, in a position to give an answer about the sacraments that were given to them, they should be baptized without any scruple, lest that doubt should cause them to be bereft of the cleansing of the sacraments.’ For as Leo [AD 400-461] rightly added, ‘what is not known to have been done cannot be said to have been repeated.’ And consequently we should not approve of a conditional baptism that the papal teachers are used to observing in such cases, according to this formula: ‘If you have not been baptized, then I baptize you.’ For a baptism of this kind lacks any precedent in Scripture and changes the form for baptism that Christ had taught, and it also leaves the one who has been baptized in doubt as to which baptism is the real one–which goes against the purpose of baptism that does not make the promises of God ambiguous but establishes and seals them.</p></blockquote>

<blockquote><p>The most probable explanation [of 1 Cor. 15:29] is, that the apostle here refers to the Levitical rule of Numbers 19:14-19. Were there no resurrection, a corpse would be like any other clod; and there would be no reason for treating it as a symbol of moral defilement, or for bestowing on it so religiously the rites of sepulture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 760</span></figcaption>

</figure><figure class="quote" id="q-e2fe3ccfb3" data-kw="">
<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Testament… with brief summaries and expositions upon the hard places, on 1 Cor. 15:29 (1599)</cite></span></figcaption>

</figure><figure class="quote" id="q-3d51583404" data-kw="">
<blockquote><p>Minister: The sixth point of our non-conformity is a new article of faith in these words, in a rubric which we must profess, assent and consent to: ‘It is certain by the Word of God that children which are baptized and dying before they commit actual sin are undoubtedly saved.’ Lawyer: And what have you against assenting to this? Minister: 1. That it is a new article of faith. 2. That it is arrogant and divisive, making a grand controversy [of] one article of faith. 3. It is certainly false in most if not every one that declares such assent. 4. It is a dangerous adding to the Word of God. … Lawyer: What be those opinions about it? Minister: 1. Some hold that the Covenant being the same pardoning saving Covenant that is made to the faithful and their seed, and their children, expressly called ‘holy’ [1 Cor. 7:14], they are all in a state of pardon and salvation before baptism, and baptism does but celebrate and invest them in it before the Church; and solemnly seal their Covenant right. And that this saving right is given only to the seed of the sincerely faithful, or at most to those that have such pro-parents [predecessors?], though the seed of hypocrites must be received by the Church, that know not men’s hearts. And this I take to be the truth. … 14. Many think that God has a certain number of infants-elect whom He will save and will cast away the rest, but that no man can know who they be, though the faithful may have some uncertain hopes for their children more than others, but no promise.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Minister: The sixth point of our non-conformity is a new article of faith in these words, in a rubric which we must profess, assent and consent to: ‘It is certain by the Word of God that children which are baptized and dying before they commit actual sin are undoubtedly saved.’ Lawyer: And what have you against assenting to this? Minister: 1. That it is a new article of faith. 2. That it is arrogant and divisive, making a grand controversy [of] one article of faith. 3. It is certainly false in most if not every one that declares such assent. 4. It is a dangerous adding to the Word of God. … Lawyer: What be those opinions about it? Minister: 1. Some hold that the Covenant being the same pardoning saving Covenant that is made to the faithful and their seed, and their children, expressly called ‘holy’ [1 Cor. 7:14], they are all in a state of pardon and salvation before baptism, and baptism does but celebrate and invest them in it before the Church; and solemnly seal their Covenant right. And that this saving right is given only to the seed of the sincerely faithful, or at most to those that have such pro-parents [predecessors?], though the seed of hypocrites must be received by the Church, that know not men’s hearts. And this I take to be the truth. … 14. Many think that God has a certain number of infants-elect whom He will save and will cast away the rest, but that no man can know who they be, though the faithful may have some uncertain hopes for their children more than others, but no promise.”

— Richard Baxter, ch. 9, ‘Of the Article of Baptized Infants’ Salvation’ in The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), pp. 48-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMinister%3A+The+sixth+point+of+our+non-conformity+is+a+new+article+of+faith+in+these+words%2C+in+a+rubric+which+we+must+profess%2C+assent+and+consent+to%3A+%E2%80%98It+is+certain+by+the+Word+of+God+that+children+which+are+baptized+and+dying+before+they+commit+actual+sin+are+undoubtedly+saved.%E2%80%99+Lawyer%3A+And+what+have+you+against+assenting+to+this%3F+Minister%3A+1.+That+it+is+a+new+article+of+faith.+2.+That+it+is+arrogant+and+divisive%2C+making+a+grand+controversy+%5Bof%5D+one+article+of+faith.+3.+It+is+certainly+false+in+most+if+not+every+one+that+declares+such+assent.+4.+It+is+a+dangerous+adding+to+the+Word+of+God.+%E2%80%A6+Lawyer%3A+What+be+those+opinions+about+it%3F+Minister%3A+1.+Some+hold+that+the+Covenant+being+the+same+pardoning+saving+Covenant+that+is+made+to+the+faithful+and+their+seed%2C+and+their+children%2C+expressly+called+%E2%80%98holy%E2%80%99+%5B1+Cor.+7%3A14%5D%2C+they+are+all+in+a+state+of+pardon+and+salvation+before+baptism%2C+and+baptism+does+but+celebrate+and+invest+them+in+it+before+the+Church%3B+and+solemnly+seal+their+Covenant+right.+And+that+this+saving+right+is+given+only+to+the+seed+of+the+sincerely+faithful%2C+or+at+most+to+those+that+have+such+pro-parents+%5Bpredecessors%3F%5D%2C+though+the+seed+of+hypocrites+must+be+received+by+the+Church%2C+that+know+not+men%E2%80%99s+hearts.+And+this+I+take+to+be+the+truth.+%E2%80%A6+14.+Many+think+that+God+has+a+certain+number+of+infants-elect+whom+He+will+save+and+will+cast+away+the+rest%2C+but+that+no+man+can+know+who+they+be%2C+though+the+faithful+may+have+some+uncertain+hopes+for+their+children+more+than+others%2C+but+no+promise.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+ch.+9%2C+%E2%80%98Of+the+Article+of+Baptized+Infants%E2%80%99+Salvation%E2%80%99+in+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued+%281683%3B+London%3A+Parkhurst%2C+1689%29%2C+pp.+48-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3d51583404.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3d51583404.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/baptismal-regeneration#:~:text=Minister%3A%20The%20sixth%20point%20of%20our,more%20than%20others%2C%20but%20no%20promise." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c4c9f87ef0" data-kw="">
<blockquote><p>The prophet, in short, teaches us here what Paul has more clearly explained (Rom. 2:29), even this— that the letter is of no value before God, but that the spirit is what He requires: for Paul in these words means that the external sign is worthless, except accompanied by the reality within; for the literal circumcision mentioned by Paul is merely the external rite; in the same manner baptism with us may be called the letter, when there is no repentance and faith. But the spirit, or spiritual circumcision, is the denial of self; it is renovation, and in a word, that true conversion to God, of which the prophet speaks here. …It is yet certain that men do not bestow on themselves what God signifies by the sign of baptism; but He counsels them to seek from God the grace of his Spirit, that they might not in vain be sealed by the external rite of baptism, while destitute of its reality. When therefore the prophet bids the Israelites to take away the foreskin of their heart, it is the same as though he had said, that they were indeed liberal enough with regard to ceremonies and outward worship, but that these were empty masks unless preceded by a right disposition within.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah, ch. 4, verse 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/efficacy.html">Baptism: Efficacy</a></span></div>

</figure><figure class="quote" id="q-8a8d885834" data-kw="">
<blockquote><p>Numbers may be found who have enjoyed the sacrament of baptism for a long time without any benefit, and yet afterwards being converted to God, have profited much through it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans, ch. 3, p. 175 in John Davenant, Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of… Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864)</cite>, p. 10</span></figcaption>

</figure><figure class="quote" id="q-d575ae87c3" data-kw="">
<blockquote><p>Regarding the baptism of infants, we have stated our case sufficiently and more: we consider it nothing else than the holy washing of regeneration. Yet at the same time, we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the covenantal formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise why is a confession of faith required of adults before they are baptized?… …those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism. Thus we leave the hidden judgments to God, just as we should.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear and Simple Treatise on the Lord’s Supper (1559, RHB, 2016)</cite>, p. 146-7</span></figcaption>

<blockquote><p>Baptism is the sacrament of new birth, wherein wherein our adoption by Christ is sealed unto us and we are made the sons of God, as many as believer both sacramentally and spiritually, the unbelievers only sacramentally. Wherefore this is not to be understood as though whosoever is baptized shall therefore be sure to have eternal life.</p></blockquote>

</figure><figure class="quote" id="q-ed3192f969" data-kw="">
<blockquote><p>The Fathers never even dreamt of that habitual faith of the Papists, which they would have to be infused into infants by the mere act of baptism.</p></blockquote>

</figure><figure class="quote" id="q-0f23f8851e" data-kw="">
<blockquote><p>We reject the opinion of certain Ubiquitarians [Lutherans], who connect the regenerating power of the Holy Spirit in such a way with the external water in baptism that either it must exist in the water itself or at least can inchoate [begin] regeneration only in the very act of baptism, for this opinion is at variance with all those passages of Scripture in which faith and repentance, and therefore both the root and seed of regeneration, are demanded as a prerequisite in those who are to be baptized.</p></blockquote>

</figure><figure class="quote" id="q-69dd01d77c" data-kw="">
<blockquote><p>Nor do I know any one of our [Reformed] divines who would pronounce that the regeneration which exists in the creation of qualities (which we call sanctification—the Papal writer’s formal justification) is produced at the very moment of baptism. Nay, they all refer this regeneration or spiritual nativity to the period of adult age, in which true and living faith is implanted in the heart of a baptized person from the immortal seed of the Word, and by the operation of the Spirit. … Since, therefore, neither Arminians, nor Papists, nor Protestants acknowledge that infants, by the mere reception of Baptism itself, become partakers of those habitual endowments or spiritual qualities which are properly supposed to constitute a man just and inherently holy, no one can prove the loss of their faith or righteousness, or the apostasy of the saints by any argument derived from the case of infants.</p></blockquote>

</figure><figure class="quote" id="q-c3ce2747fb" data-kw="">
<blockquote><p>…a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant… III. This however by no means implies that all the children of pious parents should be regarded as ordained to salvation by the divine appointment. For it is manifest, both from the indubitable records of the sacred volume and the examples there placed beyond controversy, and from the experience of everyday life, that not infrequently the offspring of the best of men grow up with the worst dispositions, wickedly bent upon their own destruction. Still God has given that pledge to pious parents that they may regard their little ones as the children of God by gracious adoption, until, when further advanced, they betray themselves by indications to the contrary, and that they may feel not less secure regarding their children dying in infancy than did Abraham and Isaac of old. … LXXVI. (2) If God usually bestows his grace at the same time as it is exhibited in the sacrament, and in the very administration of baptism both regenerates infants and delivers them from the guilt of original sin, the forwardness of parents in speedily presenting their children for baptism will accelerate their regeneration, with all its consequences, while their negligence will retard it; and thus the influences of divine grace upon the souls of some persons will be usually determined by the activity or the slothfulness of others. … LXXVII. (3) If infants, up to the period of baptism, are the children of wrath, and by receiving baptism pass immediately into a state of grace; and if the salvation of baptized persons dying in infancy is certain, while we have only the judgment of charity regarding the salvation of those not baptized, I repeat, there must be a most inexcusable want of Christian parental love (storges) and of paternal piety, when parents do not, at the very instant of birth, procure that baptism on which so much depends. Nor can those ecclesiastical constitutions be defended with the slightest show of reason, which impose the smallest delay upon the administration of the rite. … LXXIX. In like manner, I profess myself unable to reconcile with these doctrines such things as the following: that baptism is as necessary to salvation as food to the sustenance of life, or medicine to the restoration of health; that it is something approaching to a miracle if anyone is saved without baptism; that since we are not to presume too rashly upon the performance of miracles, the judgment of charity respecting the salvation of those dying without baptism rests upon a very doubtful foundation; and that, in the meanwhile, death supplies the want of baptism in infants, as, according to the Papists, martyrdom does in adults. These things seem to me mutually to refute each other, for if death procures for infants what, according to the Papists, martyrdom procures for adults, the salvation of infants dying without baptism will be as certain as that of those who are baptized. For who in the Romish church has any doubt of the salvation of the martyrs? But where did this great man [Pierre Jurieu] learn that death supplies the want of baptism? Has he been taught it by any testimony of Scripture? Is there otherwise any argument in mere assertion, however emphatic?</p></blockquote>

<blockquote><p>…for no doubt God in his decree and secret intention may intend, by the ministry of his servants, the true and real conversion of many hypocrites, such as are no less unconverted, then [Simon] Magus and Demas; for He hath mercy, on whom He will, Rom. 9:17, but according to this way, ‘these who are converts in the judgment of charity’ (he [Hooker] should say only converts in that judgment) are not according to God’s revealed intention and approving will or command taken in by pastors, that they may be really converted: for God giveth, in no sort, this command to pastors in his revealed intention. [Hooker:] ‘See that ye admit no fools to wisdom’s table or within wisdom’s house, but such only as you believe in charity are real converts, and both called and chosen,’ contrary to Prov. 9:1-4; Mt. 22:8-9,14. Therefore [it would follow on Hooker’s terms], by my revealed intention and command you are not to intend their conversion, but to presuppose that they were already converted: otherwise, if the Lord by his revealed intention and command will have such hypocrites who are but nominal saints, brought in that they may be truly converted, there must follow two contradictory intentions revealed in God: for the Lord’s command to pastors is [would be] ‘I command you to preach to these who are converts in the judgment of charity, that upon my intention, they may be truly converted’; and also: ‘I command you, my pastors, preach to no Church members, that upon my intention, they may be converted, because you are not to preach to any as pastors, but to such as ye know are already converted, according to my revealed intention and will.’ M. Hooker seeing this addeth: ‘But if M. Rutherford mean that the Church doeth of purpose receive them into the Church to be converted, then it is cross to his own tenet, and a person may be received to the seals of the covenant, who doeth not notify that he hath faith, nay the Church may receive them to the seals, whom she knoweth hath no right to the seals, for she knoweth they are not invisible members, which in Mr. Rutherford’s judgment only giveth them right.’ [Rutherford’s] Answer: It is not cross to my tenet, that a person, such as Demas and Magus may be received to the seals, and yet they doe not notify [that] they have saving faith and internal conversion, for my tenet is that the Church can only judge of visible walking and profession in point of admission or not admission to seals, and in that point the Church hath nothing to do to judge whether they have faith-saving or not; none can partake savingly of the seals for their own personal salvation and without sin, but these only who have saving faith, but the Church may admit without sin multitudes, who eat and drink their own damnation, 1 Cor. 11:26-27, and yet pass no sentence of signs notifying faith or no faith, internal conversion or no internal conversion upon them.</p></blockquote>

<blockquote><p>Hence let this query be answered by our [Independent] brethren, whether they think that profession doth notify to a charitable judgement that all infants of Church-members, because born of Church-members, are real converts. If so: [1.] birth must give conversion, and David must give to Absalom conversion by birth. 2. All infants so born must be regenerate; but experience and Scriptures teach that many so born turn apostates, and prove sons of perdition. How our brethren shall free themselves of some baptismal regeneration, and of the apostasy of the justified and truly sanctified, let them consider, and the sound Reader judge; for our brethren tell us, it is not lawful to put the seal upon a blank [in that baptism, they say, presupposes regeneration].</p></blockquote>

<blockquote><p>In the next session, S259 TU 16.7.44, the divines debated the proposed words “they are Christians &amp; holy” in relation to infants presented for baptism. A lengthy dispute pertained to what Paul had in mind. Are those baptized holy in reality or are they to be considered holy merely in federal terms, by being in a covenantal relationship with God, which may or may not involve the regenerating presence of the Holy Spirit? Thomas Goodwin claimed that the holiness in view is such that if they die they will be saved. He was uncertain whether they have the holiness of election or regeneration, but he thought they have the Holy Ghost. In short, Goodwin thought that those baptized are to be regarded as really holy, rather than simply federally holy. Lazarus Seaman countered by pointing out that this is to make a different ground for baptism. Goodwin replied by denying that infants are actually saved, but affirming that we are to judge them so. This was too much for Stephen Marshall, who said that Goodwin was wrong: our judgment of charity must not determine whom we admit to the sacrament. We have no warrant to judge that they are saved. It is sufficient that the infants of believing parents are federally holy. Rutherford agreed, pointing out that real and federal holiness are different. The Lord has election and reprobation among infants; if they are in a state of salvation, how can any be lost? To this barrage of opposition, Goodwin insisted that the question is not about the reality (whether or not the infant is regenerate) but “how I am to judge of them. I cannot judge that all are holy &amp; saved, I judge so of this child &amp; that child.” Marshall pointed to a clear mistake in Goodwin’s interpretation and application: the minister is to judge and believe that they are holy with the holiness Paul speaks of, not with any real holiness. While for Goodwin, the holiness in 1 Corinthians 7:14 is the holiness of salvation, Marshall’s rebuttal was that saving holiness infallibly saves. His underlying assumption was that since not all who are baptized will be saved, Paul cannot be referring to saving holiness. Goodwin did not give up. He agreed that an infallible judgment about an infant’s salvation was impossible, but what Paul had in view was a judgment compatible with the promise—an indefinite faith grounded on an indefinite promise. Vines countered Goodwin by denying that the text had anything to do with the judgment of the minister about the child. It applied to each and every child in relation to the parents from whom they proceed. The holiness must be present in each one who comes into the category described in the text. If the infants were really holy, there would be a passing down of such holiness from the parents, and so they would be born regenerate and really holy. Moreover, whatever the kind of holiness intended in the text, it is altogether different from the judgment of the minister. Walker then underlined the distinction between federal and real holiness—many are called holy who are yet wicked and profane. Seaman pointed out that “federall holnesse is the true ground of administration of sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly: Reading Its Theology in Historical Context’ in ed. Carl R. Trueman, The Westminster Assembly and the Reformed Faith (Phillipsburg, NJ: P&amp;R Publishing, 2009)</cite>, pp. 329–331</span></figcaption>

<blockquote><p>With some relief, we turn to some contested exegesis. In one of his letters from Westminster Robert Baillie wrote home as follows: ‘We have ended our Directorie for baptisme. Thomas Goodwin one day was exceedinglie confounded: He has undertaken a publicke lecture against the Anabaptists: it was said, under pretence of refuting them, he betrayed our cause to them: that of the Corinthians, our chief ground for the baptisme of infants, ‘Your children are holy’, he exponed of a reall holiness, and preached down our ordinare and necessare distinction of reall and federall holiness. Being posed hereupon, he could no wayes cleare himselfe, and no man took his part.’ The Directory ended up with the statement that the children of believers ‘are Christians, and federally holy before baptism, and therefore are they baptized’. John Lightfoot was unfortunately absent from the Assembly on 16 July 1644, when the meaning and implications of 1 Corinthians 7:14 were rehearsed at length and in depth. We may judge it one of the company’s better days. The minutes are ample but not clear at every point. Goodwin kept up his end from first to last. ‘It is such a holynesse as if they dy they should be saved/whether a holynesse of election or regeneration I know not; but I thinke it is they have the holy ghost.’ Lazarus Seaman spelt out the alarm that others showed: ‘all agree that this holynesse is the ground of baptisme … except he can make out this, the baptizing of infants is gone as toutching his judgment’. Goodwin in effect denied any distinction between real and federal holiness: the holiness predicated of the children of a single Christian parent by Paul is the same as that of ‘I will be your God and you shall be my people. Therefore be holy.’ If 1 Corinthians 7:14 speaks of any other holiness, then baptism is the seal of some other holiness than the holiness of salvation. But saving holiness is what infallibly saves, commented Stephen Marshall anxiously. As Rutherford put it, ‘wher ther is reall and inherent holynesse ther must be a seeing of god, and being in the state of salvation’. But ‘the Lord hath election and reprobation amongst Infants noe lesse than those of age’.65 This emerged as the main objection to Goodwin’s interpretation, which was alleged to imply that all such infants would indubitably be saved (so Marshall) and that the decrees of election and reprobation could not stand (Rutherford). So argument ensued on the difference between an indefinite proposition and a universal proposition. Goodwin’s case rested on the former: ‘an indefinite faith founded upon an indefinite promise’. Herbert Palmer could not concur: Paul’s answer to the ‘inconvenience’ to a child from one parent’s infidelity must be ‘a universal proposition and de fide we are bound to believe it de omnibus et singulis’. To be sure, Goodwin did not entertain every notion that some divines read into his position. He denied that he was speaking of a holiness received by the child by traduction from the parent, as Richard Vines had supposed (‘and so they shall be borne regenerate and really holy’),69 but only of a holiness by way of designation. Calamy came back at Goodwin: ‘he judges of the reall holynesse of the infant by the reall holynesse of the parent’. But this is how we all proceed, rejoined Goodwin; it is the children of believers that we baptize.71 The combined learning and piety of the Westminster theologians did not resolve the exegesis of 1 Corinthians 7:14. The verse had inevitably engaged the attention of previous generations of expositors, and had found the early Fathers and the Reformers of the sixteenth century espousing a variety of theories that, if not universally comprehensive, was at least indefinite. But whereas earlier exegetes had been especially preoccupied with avoiding the attribution to the children of a holiness which they could not comfortably credit also of the unbelieving partner, the dominant concerns of the divines at Westminster led in other directions. The irony lay in their very captivity to this verse in the first instance, for at least one thing can be incontrovertibly deduced from it—that the children in question who are declared ‘holy’ had not been baptized, nor, if the parallel with the unbelieving spouse extends this far, is their imminent baptism implied. This is, I think, the only place in the New Testament where children are in view of whom we know for certain whether they have or have not been baptized. They have not—but are said to be already ‘holy’.</p></blockquote>

</figure><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>

<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what He meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise [Gen. 15], made him partaker of the sacrament [Gen. 17]. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly: If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to him, (Eze. 16:20; 23:37). For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and flillacious. In that view, Paul says that the Gentiles, so long as they were plunged in idolatry, were strangers to the covenant, (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellow- ship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism.</p></blockquote>

f+Christ%2C+having+hitherto+been+aliens+from+the+covenant%2C+are+not+to+receive+the+sign+of+baptism+without+previous+faith+and+repentance.+These+alone+can+give+them+access+to+the+fellow-+ship+of+the+covenant%2C+whereas+children%2C+deriving+their+origin+from+Christians%2C+as+they+are+immediately+on+their+birth+received+by+God+as+heirs+of+the+covenant%2C+are+also+to+be+admitted+to+baptism.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes%2C+Book+4%2C+ch.+16%2C+section+24%2C+trans.+Beveridge&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c0130c89d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c0130c89d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-because-they-are-in-the-covenant/#:~:text=24.%20Thus%20the%20Lord%2C%20when%20he,also%20to%20be%20admitted%20to%20baptism." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f55322314" data-kw="">
<blockquote><p>But that all doubt may be better cleared away, this principle should ever be kept in mind, that baptism is not conferred on children in order that they may become sons and heirs of God, but, because they are already considered by God as occupying that place and rank, the grace of adoption is sealed in their flesh by the rite of baptism. Otherwise the Anabaptists are in the right in excluding them from baptism. For unless the thing signified by the external sign can be predicated of them, it will be a mere profanation to call them to a participation of the sign itself. But if any one were inclined to refuse them baptism, we have a ready answer; they are already of the flock of Christ, of the family of God, since the covenant of salvation which God enters into with believers is common also to their children. As the words import ‘I will be thy God and the God of thy seed after thee.’ Unless this promise had preceded, certainly it would have been wrong to confer on them baptism. Now I ask whether the Word of God is sufficient by its intrinsic value for our salvation, or whether some aid must be borrowed elsewhere to supply its defect, or help its infirmity? If this promise is not believed to be efficacious in itself, not only the virtue of God, but also his grace and truth will be attached to the external sign. Thus those men, while they strive to honor baptism, cast serious ignominy on God.</p></blockquote>

<blockquote><p>…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.</p></blockquote>

<blockquote><p>But the cause why our adversaries are so loathe to allow of this opinion is for that they attribute unto the Sacraments more than they ought to do. For they think that by the power and efficacy of the work of baptism, sin is forgiven. Neither do they acknowledge [that] by the Sacraments, forgiveness is rather sealed, which they of perfect age obtain by believing, and the young children of the faithful, which belong unto election, have it already by the Holy Ghost and by grace. … And that it may the better appear that young children which are baptized (and not only they which have been baptized) do pertain unto the Church, we will declare it evidently enough by the epistle to the Ephesians where it is said (5:25), ‘Ye men love your wives, even as Christ loved the Church and gave Himself for it, that He might sanctify it, being cleansed by the washing of water through the Word, etc.’ By this place thou seest, that it is the Church which is washed and baptized. So then, so long as young children be baptized, it is manifest that they belong unto the Church, and they cannot truly be parts of the Church unless they be adorned with the Spirit of Christ. Wherefore young children which verily belong unto the election of God, before they can be baptized are instructed by the Spirit of the Lord…</p></blockquote>

e.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-because-they-are-in-the-covenant/#:~:text=But%20the%20cause%20why%20our%20adversaries,by%20the%20Spirit%20of%20the%20Lord%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cfefc8c245" data-kw="">
<blockquote><p>This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.</p></blockquote>

</figure><figure class="quote" id="q-a35366c560" data-kw="">
<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures… (London, 1659), The 26-27th Lord’s Days</cite>, p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>

</figure><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth</cite>, p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— Peter van Hoeke, Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth, p. 33.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+no+question+between+us+and+the+Mennonites+as+to+whether+the+infants+of+unbelievers%2C+or+of+those+who+are+outside+of+the+covenant+of+God%2C+are+to+be+baptized%3F+For+to+these%2C+both+we+and+they+deny+baptism.+But+the+question+is%2C+whether+the+infants+of+those+who+are+in+the+covenant%2C+or+one+of+whose+parents+is+in+the+covenant%2C+are+to+be+baptized%3F%E2%80%9D%0A%0A%E2%80%94+Peter+van+Hoeke%2C+Lord%E2%80%99s+Day+27%2C+Inquiry+74%2C+%E2%80%98Whether+Infants+are+to+be+Baptized+Also%3F%E2%80%99%2C+p.+310+in+Studies+in+the+Palatinate+Catechism+%28Leiden%2C+1711%29+See+also+the+first+of+the+three+arguments+on+the+same+page+that+he+gives+to+prove+the+reformed+position.+As+translated+in+Krauth%2C+p.+33.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4c1b32671.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4c1b32671.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-because-they-are-in-the-covenant/#:~:text=There%20is%20no%20question%20between%20us,the%20covenant%2C%20are%20to%20be%20baptized%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3087bd07b3" data-kw="">
<blockquote><p>The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.”

— Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformation+was+united+in+seeking+the+essence+of+the+church+in+the+invisible%2C+in+union+with+Christ%2C+and+not+in+an+external%2C+visible+bond%2C+as+Rome+does%E2%80%A6+In+order+to+check+this+danger+%5Bof+losing+the+historical+progress+of+the+Church+through+individualism%5D+Luther+moved+a+long+way+back+to+Rome.+In+a+certain+sense+he+again+imprisoned+the+supernatural%2C+invisible+grace+which+maintained+the+church+within+something+external%E2%80%A6+Where+the+church+is+found+with+the+ministry+of+the+Word+and+sacraments%2C+it+is+self-sustaining.+God%2C+as+it+were%2C+has+let+go+of+the+grace+which+sustains+the+church+and+placed+it+in+the+means+of+grace.+The+Reformed+believer+cannot+be+satisfied+with+this+presentation.+Certainly+he+believes+in+the+continuity+of+the+church%2C+but+he+believes+in+it+and+therefore+does+not+need+to+support+it+by+instruments+of+salvation%2C+into+which+grace+is+poured.+For+him+that+continuity+is+assured+by+the+faithful+promise+of+God.+Hence%2C+in+back+of+Word+and+sacrament+he+places+the+covenant+as+the+strongest+expression+of+how+the+unbroken+work+of+grace+from+generation+to+generation+rests%2C+as+all+grace%2C+on+the+sovereign+pleasure+of+God.+The+church+does+not+abide+because+we+baptize+or+work+regeneration+by+baptism%3B+rather+because+God+establishes+his+covenant+from+generation+to+generation%2C+therefore+the+church+remains+and+we+baptize.+Since+it+is+God%E2%80%99s+covenant+an+not+man%E2%80%99s%2C+it+is+appropriate+for+the+Christian+to+recognize+this+goodness+of+God+in+quiet+gratitude+and+in+faith+and+to+be+strengthened+by+its+sealing.+Here+again+the+concept+of+the+covenant+requires+that+faith+will+react+freely+and+actively+to+this+pronouncement+of+God%E2%80%A6+It+is+evident+how+strongly+the+idea+of+the+covenant+makes+itself+felt+here%2C+and+how+it+elevates+itself+above+all+idolatrous+worship+of+the+sacraments.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99%2C+pp.+261-2+in+Redemptive+History+and+Biblical+Interpretation%3A+The+Shorter+Writings+of+Geerhardus+Vos+ed.+Gaffin+%28P%26R%2C+1980%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3087bd07b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3087bd07b3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-because-they-are-in-the-covenant/#:~:text=The%20Reformation%20was%20united%20in%20seeking,all%20idolatrous%20worship%20of%20the%20sacraments." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-cf024ff49e" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, ch. 21, ‘Whether Baptism gives formality, or makes a Member of a visible Church?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), pp. 115-122 | Hooker, a congregationalist, had misunderstood Rutherford, thinking that Rutherford had said that baptism was the formal principle that made someone a member of the visible Church. However, what Rutherford actually said, and what he defends here, distinguishing, is only that:</cite></span></figcaption>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/girolamo-zanchi.html">Girolamo Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians, p. 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6</cite>, pp. 139-140</span></figcaption>

</figure><figure class="quote" id="q-1b1779d358" data-kw="">
<blockquote><p>The children of unwilling Jews and Turks cannot be baptized, but if the parents consent, they can be admitted to baptism… [Their children] can be baptized, upheld, and instructed in the Church, if the parents consent, because it does no harm to them. Indeed, such parents, by consenting in this way, give some sign of their piety, even if they do not profess it publicly. Then, therefore, the Church is established as a mother of such children, and therefore can baptize them.</p></blockquote>

<blockquote><p>…ye [Separatists] are full Donatists [Eary Church heretics]… you do agree with them in the sum and substance of all the fowlest things…: … 16. That ye deny baptism to the children of open sinners which yet remain in the Church… 17. That ye make the stableness of God’s Covenant towards his Church to depend upon the works of men… 18. That ye hold circumcision among the Ten Tribes, or in Judah in time of idolatry, was no true seal of the Covenant, and yet ye say that concerning the outward cutting it was true circumcision: the like ye say of baptism administered in Popery.</p></blockquote>

</figure><figure class="quote" id="q-576f4001d4" data-kw="">
<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>

</figure><figure class="quote" id="q-a8d35535aa" data-kw="">
<blockquote><p>The Word of God, Gen. 17:23, acknowledges that one may have a right to the first seal of the covenant, and that coram Deo, that has no saving grace. Ishmael was thirteen years old, verse 25, when he was circumcised, and therefore of age to answer for himself; yet Ishmael had no saving grace, neither was he within the covenant of Isaac–the covenant of absolute and certain salvation, from which he was excluded, verse 19. Yet Ishmael has a right to the first seal of the covenant coram Deo, as is most most evident from the immediate command of God, that he that was born in Abraham’s house, must needs be circumcised, verse 12, and accordingly Abraham understood it. He proceeds upon the command of God to circumcise Ishmael first of all. Now what is it that giveth one right to any ordinance but the command, or at least more evidently than the command of God Himself? And that right which we have from God’s command, is doubtless a right coram Deo, and in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Visible Church… (1658) as quoted by Thomas Boston, Works</cite>, 6:130</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>

<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>

</figure><figure class="quote" id="q-001aea63ff" data-kw="">
<blockquote><p>Baptism is a seal of the whole covenant of grace; but it is by way of initiation. Hence it belongs to all that are within the covenant or have the first entrance thereinto. And is there no danger of corruption by overstraining the subject of baptism? Certainly, it is a corruption to take from the rule, as well as add to it. Moses found danger in not applying the initiating seal, to such for whom it was appointed. Is there no danger of putting those out of the visible Church, whom our Lord would have kept in?… If we do not keep in the way of a converting, grace-giving covenant, and keep persons under those church dispensations, wherein grace is given, the Church will die of a lingering, though not violent, death. The Lord has not set up churches only that a few old Christians may keep one another warm while they live, and then carry away the Church into the cold grave with them when they die; no, but that they might with all care, and with all the obligations and advantages to that care that may be, nurse up still successively another generation of subjects to our Lord, that may stand up in his kingdom when they are gone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Works of Christ in America, vol. 2</cite>, p. 309</span></figcaption>

</figure><figure class="quote" id="q-b427a2928c" data-kw="">
<blockquote><p>They of the south [of Scotland, such as William Cunningham and others] maintain, that both the sacraments, being seals of the same covenant, and imposing the self-same obligations, ought to be administered on the same footing, the same kind and measure of profession and of qualification being required, on the part of applicants for either; that no adult should be admitted to the one, without being admitted also to the other; and that the Christian profession required of a parent, in order to the baptism of his child, cannot be complete, without his being a communicant. The result of these views being carried into practice in the Lowlands, or rather the result of their mode of reducing them to practice, is, that with rare exceptions, all the members of a congregation, above a certain age, go to the table of the Lord, and that any parent, who is a communicant, receives, as a matter of course, baptism for his child. The Ross-shire fathers [in the highlands of Northern Scotland] held, that though in general, the two sacraments were equally seals of the covenant of grace, they do in some respects differ, even as sealing ordinances; that baptism, being the door of admission into the visible Church, a larger exercise of charity is required in dealing with applicants for that sacrament, than is called for in administering the other, which implies a confirmation of those who were members before; that the lessons of baptism are more elementary than those of the sacrament of the Supper; that the connection of the child, and of both the parents, with an ordinary case of infant baptism, calls for peculiar tenderness on the part of church rulers; and that the rule of Scripture requires baptism to be given, on an uncontradicted profession of faith, while an accredited profession is required to justify the church, in granting admission to the table of the Lord. The result of carrying these views into practice is well known; the number of members in full communion is comparatively small, and parents who have never communicated, receive baptism for their children.</p></blockquote>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>

</figure><figure class="quote" id="q-dae5e88ec1" data-kw="">
<blockquote><p>All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.”

— Scottish First Book of Discipline, The Ninth Head, Concerning the Policy of the Church">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+ministers+must+be+admonished+to+be+more+careful+to+instruct+the+ignorant+than+ready+to+satisfy+their+appetites%3B+and+more+sharp+in+examination+than+indulgent%2C+in+admitting+to+that+great+mystery+such+as+are+ignorant+of+the+use+and+virtue+of+the+same.+And+therefore+we+think+that+the+administration+of+the+Table+ought+never+to+be+without+that+examination+pass+before%2C+especially+of+those+whose+knowledge+is+suspect.+We+think+that+none+are+apt+to+be+admitted+to+that+mystery+who+cannot+formally+say+the+Lord%E2%80%99s+Prayer%2C+the+articles+of+the+belief%2C+and+declare+the+sum+of+the+law%E2%80%A6+Every+master+of+household+must+be+commanded+either+to+instruct%2C+or+else+cause+%5Bto%5D+be+instructed%2C+his+children%2C+servants%2C+and+family%2C+in+the+principles+of+the+Christian+religion%3B+without+the+knowledge+whereof+ought+none+to+be+admitted+to+the+Table+of+the+Lord+Jesus.+For+such+as+are+so+dull+and+so+ignorant%2C+that+they+can+neither+try+themselves%2C+neither+yet+know+the+dignity+and+mystery+of+that+action%2C+cannot+eat+and+drink+of+that+Table+worthily.+And+therefore+of+necessity+we+judge+it%2C+that+every+year+at+least%2C+public+examination+be+had+by+the+ministers+and+elders+of+the+knowledge+of+every+person+within+the+church%3A+to+wit%2C+that+every+master+and+mistress+of+household+come+themselves%2C+and+their+family+%28so+many+as+are+come+to+maturity%29%2C+before+the+ministers+and+elders%2C+to+give+confession+of+their+faith%2C+and+to+answer+to+such+chief+points+of+religion+as+the+ministers+shall+demand.+Such+as+are+ignorant+in+the+articles+of+their+faith%3B+understand+not%2C+nor+cannot+rehearse+the+commandments+of+God%3B+know+not+how+to+pray%2C+neither+whereinto+their+righteousness+consists%2C+ought+not+to+be+admitted+to+the+Lord%E2%80%99s+Table.%E2%80%9D%0A%0A%E2%80%94+Scottish+First+Book+of+Discipline%2C+The+Ninth+Head%2C+Concerning+the+Policy+of+the+Church&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdae5e88ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dae5e88ec1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/paedocommunion/#:~:text=All%20ministers%20must%20be%20admonished%20to,be%20admitted%20to%20the%20Lord%E2%80%99s%20Table." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-31b20949f7" data-kw="">
<blockquote><p>The Reformed churches observe the same order in admitting to the Lord’s table, either the children of Christians, or strangers from other parts: they admit them not but with prayers and after due examination of their knowledge, and personal profession of the known truth. The Church of Scotland at the first reformation ordained that children should be examined for the first time at the ninth year of their age; for the second, at the twelfth, for the third at the fourteenth, and since has practiced continual examination in the catechetical doctrine with prayers reiterate, for their growth in knowledge and sanctification; and without sufficient trial they were not admitted to the Lord’s Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perth Assembly… (1619)</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-655a1793c9" data-kw="">
<blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’</cite>, pp. 720-1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-d4a248405c" data-kw="">
<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</cite></span></figcaption>

</figure><figure class="quote" id="q-3f9f3b0b84" data-kw="">
<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>6th Question, ‘Is the Supper to be Granted to Infants, or to Children?’ [No] in Ecclesiastical Politics, vol. 1, book 2, tract 2, section 4, ch. 3, pp. 757-58 trans. Charles Johnson</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>VI. To no purpose is the reply: (1) “Hence it would follow that the Lord’s Supper should also be administered to infants because the thing signified belongs to them.” Although the same thing is signified in both, still there is a difference in the manner of signifying. In the Supper, the grace of Christ is sealed by way of solid food, which infants are not capable of receiving; but in baptism, it is signified by way of the washing of regeneration, which they are (Jn. 3:5). Again, the Supper demands a twofold condition: a preceding in examination; a concomitant in a commemoration of the death of Christ, both of which presuppose the use of reason. Neither is required in baptism; thus formerly the Passover was distinguished from circumcision—that the latter was administered to infants and the former to adults alone. (2) “It is added that infants are not capacious of the grace of regeneration, nor of the other blessings of the covenant which are accustomed to be conferred by the Spirit through the word.” But it is gratuitously supposed that they are not capacious of the blessing of the covenant. For who denies that they are capacious of the remission of sins and of Christ’s redemption, and of the other benefits which depend upon the covenant into which infants are received? Who can doubt that baptism (with respect to these) is able to be a distinctive sign (introducing into the visible church) and a seal both of the divine truth in the federal promises and of our obligation to mutual duty? For if they are not capable of obligation in the present, they can be in the future. As to regeneration, however, why should infants not be capable of regeneration as they are of sin (unless we say that guilt has more power than grace)? And as they are rational (although they do not put forth an act of reason), what hinders them from being called holy and believers by the Holy Spirit given to them, although they cannot as yet exert an act of faith?</p></blockquote>

<blockquote><p>IV. Nor ought it to be objected that Christ puts instruction before baptism and so speaks of adults, who can be instructed, and not of infants (“teach [μαθητεύσατε],” he says). Although Christ placed teaching before baptism, this must be referred to the baptism of adults, of which first and especially he was speaking in reference to the state of the primeval church to be constituted of adults. Therefore, here we must distinguish between the church to be constituted and constituted. In the former, adults were to be taught before they were baptized; but in the constituted, infants were to be baptized before they were taught. The predicates are such as they are permitted to be by their subjects; infants are not capable of instruction, therefore it does not pertain to them. In the meantime, the command of Christ is to be understood analogically of infants from the nature of the covenant and the perpetual use of the church from Abraham (Gen. 17:19*). The verb μαθητευειν (used by Christ) properly is not so much to teach by preaching as “to make disciples.” This is done also by the administration of baptism, which is a sacrament of initiation and the first entrance into the church and family of Christ. Thus μαθητας ποιειν (Jn. 4:1) is not simply to teach, but to make disciples and to receive into a profession of discipline; as among the Jews disciples were often made, not who were already taught, but that they might be taught. Hence the heathen to Hillelm (?Hillel): “Make me a proselyte that you may teach me.” That this is to be so understood is proved by the verb διδασκειν (which is added), which would seem to be tautological unless to μαθητευειν is referred to something else than simple instruction and doctrine.</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.4 (p. 415). [modified]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+Nor+ought+it+to+be+objected+that+Christ+puts+instruction+before+baptism+and+so+speaks+of+adults%2C+who+can+be+instructed%2C+and+not+of+infants+%28%E2%80%9Cteach+%5B%CE%BC%CE%B1%CE%B8%CE%B7%CF%84%CE%B5%E1%BD%BB%CF%83%CE%B1%CF%84%CE%B5%5D%2C%E2%80%9D+he+says%29.+Although+Christ+placed+teaching+before+baptism%2C+this+must+be+referred+to+the+baptism+of+adults%2C+of+which+first+and+especially+he+was+speaking+in+reference+to+the+state+of+the+primeval+church+to+be+constituted+of+adults.+Therefore%2C+here+we+must+distinguish+between+the+church+to+be+constituted+and+constituted.+In+the+former%2C+adults+were+to+be+taught+before+they+were+baptized%3B+but+in+the+constituted%2C+infants+were+to+be+baptized+before+they+were+taught.+The+predicates+are+such+as+they+are+permitted+to+be+by+their+subjects%3B+infants+are+not+capable+of+instruction%2C+therefore+it+does+not+pertain+to+them.+In+the+meantime%2C+the+command+of+Christ+is+to+be+understood+analogically+of+infants+from+the+nature+of+the+covenant+and+the+perpetual+use+of+the+church+from+Abraham+%28Gen.+17%3A19%2A%29.+The+verb+%CE%BC%CE%B1%CE%B8%CE%B7%CF%84%CE%B5%CF%85%CE%B5%CE%B9%CE%BD+%28used+by+Christ%29+properly+is+not+so+much+to+teach+by+preaching+as+%E2%80%9Cto+make+disciples.%E2%80%9D+This+is+done+also+by+the+administration+of+baptism%2C+which+is+a+sacrament+of+initiation+and+the+first+entrance+into+the+church+and+family+of+Christ.+Thus+%CE%BC%CE%B1%CE%B8%CE%B7%CF%84%CE%B1%CF%82+%CF%80%CE%BF%CE%B9%CE%B5%CE%B9%CE%BD+%28Jn.+4%3A1%29+is+not+simply+to+teach%2C+but+to+make+disciples+and+to+receive+into+a+profession+of+discipline%3B+as+among+the+Jews+disciples+were+often+made%2C+not+who+were+already+taught%2C+but+that+they+might+be+taught.+Hence+the+heathen+t <blockquote><p>Q. What warrant is there, Act. 2. 39. for Infant Baptism? Ans. I shall not contend for the actual baptizing of them at that instant. But every one of you be baptized ἕκαστος father and sons. Why? the promise is to you and to your children, break the Text into an hundred pieces, and blood it as men please, the Genuine Thesis which cannot be neglected, is, These to whom the promise of the Covenant does belong, these should be baptized, ἐπαγγελία. But the promise of the Covenant is to you and to your children. Ergo, you and your children should be baptized. The assumption is the express words of Peter and the Proposition is Peters. Every one of you be baptized, ὑμῖν γὰρ ἐστιν for to you is the promise of the Covenant. Calvin, Bullinger, Brentius, Gualther clear it.

2. Who they are, who are in the nearest capacity to be baptized, he explains, when he showeth, that the Covenant promise is made to those who are far off, to the Gentiles, who the Lord shall call, then all that are under the call and offer of Christ in the preached Gospel, as Prov. 9. 1, 2, 3, 4. Matth. 22. bid them come to the wedding, Luke 14. 16, 17, 18. &amp;c. are externally in Covenant, and such to whom the Covenant is made, and should be baptized, its presumed they give some professed consent to the call and do not right down deny to come, else they should be baptized against their will.

3. Calvin shows Acts 2. 39. that the Anabaptists in his time, said, the promise was made to Believers only, but the Text saith, it is made to you and to your children, to infants, to the children of the Prophets and of the Covenant made with the fathers, Acts 3. 25. Now what ground do Anabaptists give that all infants believe, or that some believe, since to them, their children were as Pagans without Christ, without the Covenant? if to the children when they come to age and shall believe? but what need to add, and to your believing Children? for these are not children but men of age, their fathers and they both being believers. Now Peter sets down two ranks, the aged who heard the word with gladness, and were pricked in heart, v. 37. 41. and the children, and to both the promise is made, and what ground is there to exclude sucking children? for the word, Acts 2. 39. is Matth. 2. 18. 1 Cor. 7. 14. where sure the word is taken for sucking children of whose actual faith the Scripture speaks not. 2. The promise is to you and to your children, can have no other sense then, the promise and word of the Covenant is preached to you and to your children in you, and this is to be externally in Covenant, both under the Old and New Testament. If it have another sense it must be this, the Lord hath internally Covenanted with you the 3000. who have heard the word and with your children, and you are the spiritual seed, and sons of promise, predestinate to life eternal: as Rom. 9. they expone the seed in Covenant: But 1. Were all the 3000. Ananias and Sapphira and their children the spiritual and chosen seed? for he commands all, whom he exhorts to repent, to be baptized: And 2. Now to Simon Magus and Demas, and numbers of such, Peter could not have said, the promise is made to you and to your children, if it be only made to real and actual believers, as they say, Peter therefore must own them all whom he exhorts to repent, as the chosen seed. But if the former sense be intended (as how can it be denied?) to wit, the word of the Covenant is preached to you, an offer of Christ is made in the preached Gospel to you. Then it cannot be denied, but the promises to all the Reprobate in the Visible Church whether they believe or not, for Christ is preached; and promises of the Covenant are Preached to Simon Magus, to Judas and all the Hypocrites who stumble at the word, to all the Pharisees, as is clear, Math. 13. 20, 21, 22, 23. Acts 13. 44, 45. Acts 18. 5, 6. Math. 21. 43. 1 Pet. 2. 7, 8. (3.) The promise, I will be your God, and ye shall be my people, must be one way expounded in the Old Testament, to wit, you are externally only in Covenant with God. But in the New Testament, it must have this meaning, I will be your God, 2. Cor. 6. 16. that is, you are all predestinate to life, and the sons, by promise, and the spiritual seed, to whom I say, I will be your God: But so it may well be said, there were no internal Covenanters in the Old Testament, and there be none but only internal Covenanters in the New Testament, so that when the Lord sayeth, Rev. 11. 15. The Kingdoms of the earth are mine, and my sons. He must say, the Kingdoms, Egypt, Assyria, Tyrus, Ethiopia, &amp;c. are chosen and the spiritual seed, and these Covenanted Nations and the Kingdoms of the Gentiles are all internally and effectually called, and there are no Visible Churches in the New Test. but only all invisible and saved.

4. If these words, The promise is to you, and to your Children, be limited, to as many as the Lord shall effectually call, either fathers or children: But Mr. Stev. Marshall judiciously observes; there is no more a Covenant-favour holden forth to their children, then to the children of Pagans; for the children of Pagans, if God effectually call them, have the promises made to them.

5. Its clear that external Covenant-holiness, is to these men ceremonial holiness now out of date; and then external calling the only means of internal and effectual calling, Math. 22. 14. 1 Cor. 1. 18. 23. 24. Luke 15. 1, 2. and the fixed Church-hearing of the Preached Gospel is a ceremony. 2. That God should be the God of Infants of the seed of the Jews, a mercy to fathers and sons coming from free love, Deut. 10. 15. Gen. 17. 7. Deut. 7. 6, 7, 8. and Prophesied as a mercy to the Gentiles by all the Prophets was a ceremony removed now in Christ. Yea 3. External covenanting and adopting, and choosing of Israel is no mercy, except that a Pedagogue of the Law is a mercy for a time.

4. The promise is to you and to your Children, must be in a contradictory way expounded, to wit, the promise is no more made to your Children so long as they are Infants, then to Devils. Yea Fathers and Children not believing, though chosen to life, are excommunicated from visible Adoption, calling, hearing the Gospel-promises, for there is no covenanting now under the New Testament, but only internal covenanting of the Elect.

5. Young Timothy and children of believing Parents, and all the aged within the visible Church, have no right to hear the preached Gospel, before they believe and be the holy seed, more then Pagans. Yea 6. They can have no command of God, to hear the Gospel, nor any covenant or Gospel warrant, until they be believers, for if there were no promise made to hearing and considering the word, if they shall believe, while as yet they believe not, and until they be effectually called, there can be no command, and no Law, to hear the Gospel and the covenant offer made in Christ. It shall then be no more sin for unconverted persons to turn away their ears from the Law, and not to hear the Gospel. 7. It were non-sense to say to men under the externally proposed covenant, repent, hear the Gospel, use the means, receive the seals, and yet you have no right to hear, nor have we any warrant to baptize you, until ye believe; for there is no promise made to you, nor to your seed and Children, until first you believe. And it must say there was no threatening to Adam. Gen. 2. 17. before he sinned, and no promise to Adam nor to any now, do this and live, until Adam first sinned, and first obeyed the covenant; and so, if John covenant to labour in Peters Vineyard, and Peter promise to him four pence, so he work twelve hours, otherwise he shall not pay him 4. pence, though John accept of the covenant, and work but one hour, whereas his covenant is to work for twelve hours, then no man can say to John (work, for there is a promise made of four pence to you) the other might deny; no such promise was made to me, except I work twelve hours. It were, sure, unfaithful dealing to John to say so. For the four pence ought not, by this Covenant, to be given to him except he work twelve hours: but he cannot without palpable falshood, say, I have broken no Covenant, in not working twelve hours: For though I consented to the covenant, and began to work an hour, yet the promise was not to me simply, but to me as working twelve hours; but there is neither face nor faith in this Answer: For the fulfilling of the covenant is only to give four pence to John, if he work 12. hours; but the promise and covenant was made to him and he hath foully broken. Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled, a covenant or threatening, is a covenant and threatening obliging Adam, fit shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2. 17. by silence, and Professors within the visible Church, by their professing of the Doctrine of the Gospel or covenant of grace, their receiving of the Seals and professed hearing of the Word, are under the covenant of Grace, and engage themselves to obey commands, promises, threatenings, and therefore promises are as properly made to them, Act. 2. 39. As commands, and threatenings, exhortations, invitations, and Gospel-requests are made to them. But though the Anabaptists ignorantly confound the promise, and the thing promised; the covenant, and benefits covenanted. The promise is to you, and so are the commands, and threatenings, whether ye believe or not, the command is to you, and lays an obligation on you, whether ye obey, or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life is not given to you until you first believe. Object. Is not the promise made the same way to the aged as to the children; and the same thing required of both: The promise is to you and to your Children. But the promise is made to the aged only, if they actually believe. Ergo, the promise is made to the Children only, if they actually believe, and so not to Infants. Answ. Neither proposition nor assumption can bear weight. For the proposition when God saith, I will be thy God O Abraham, and the God of thy seed. Is it needful that God require the same conditions, that is actual believing that he may save Father Abraham, &amp; also actual believing from hearing the word of the covenant preached from all Infants born of Abraham and dying in Infancy, or then all these Infants so dying must be eternally damned? nay, we believe many Infants (we reserve to the holy and glorious Lord his liberty of election &amp; reprobation, Rom. 9. 11. 12) among the Jews were saved by the covenant of grace, though they died Infants. And this we condemn in Anabaptists, that they show no revealed way of God of saving Infants of believing Parents dying in Infancy, more then of saving Pagans and their Infants, for to them both are alike without the covenant of grace and without Christ; and therefore believing Parents have no word of faith, or of the Gospel to pray for the salvation of their children dying in Infancy, for such prayers have neither warrant in the covenant of Works, nor in the covenant of grace by their way. And yet that we are to pray, is to be gathered from Gen. 19. 18. 2 Sam. 12. 16. Job. 1. 5. Mark 10. 16. Psal. 28. 9, and if we pray for their salvation, they must be saved by either Law or Gospel Its not enough, to say that we may pray for savages that never heard of the Gospel, nor of the covenant of grace, that they may be saved. For seeing there is no name under Heaven by which men may be saved, but by the name of Jesus, Acts 4. 12. John 14. 6. There is no other warrant of praying for such, then that God would send them the Gospel, and since Christ prayed for Infants and blessed them, which is a praying for them, Gen. 48. 15, 16 Deut. 33. 1. 6, 7, 8. &amp;c. Eph. 1.

2. Gal. 1. 3. 1 Cor. 1. 3. 1 Tim. 1. 2. 2 Tim. 1.

3. See Mar. 10. 16. he must own them as blessed in Christ, in whom all the Nations of the earth are blessed, and so covenanted with God in Christ. 2. It is false that the promise is made only to the aged, upon condition of actual believing. 1. It is made to their children expressly in the Text, and for the way of their believing, we leave it to the Lord. Nor is it true, that the promise is made to the aged, upon condition of believing. The promise is made to them absolutely, whether they believe or not. But the blessing of the promise and covenant of grace is given and bestowed only conditionally, if they believe. The promise is absolutely made: its called conditional from the thing conditionally given. Obj. But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Ergo, such as are externally within the Covenant, are not really and indeed within the covenant of grace. Ans. The Adverb (really) relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant, are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them? but they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation, upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement &amp; obligation upon such to believe the promise, but sometimes, we say the promises of the covenant of grace are not really made to the Reprobate within the visible Church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe. And therefore these words are figurative, Heb. 8. 10. This is the Covenant that I will make with the house of Israel, I will write my Law in their minds, &amp;c. that is, this is the special and principal covenanted blessing, I will give them a new heart: which must not be called a simple prediction, though a prediction it is, but it is also a real promise made absolutely to the Elect, which the Lord fulfills in them: And this is called the Covenant. Because 1. They are no better then nonCovenanters upon whom the Lord bestows not this part and blessing of the covenant. 2. The truth is, the promise of a new heart is not made to the visible Church, which is only visible: but to the Elect &amp; invisible Church. And if Anabaptists shall expone these words, Acts 2. 39. The promise of a new heart is made to you and to your Children, upon condition that you and your Children believe, which they cannot do until first they have a new heart, its as good as Peter had said, God promiseth to you and to your Children grace to believe, and a new heart to obey him, upon condition that you first believe. And that is, Gods promise to you to believe upon condition that ye believe, which is ridiculous, and therefore we cannot say that this promise of a new heart is made to all that are commanded to believe and repent and be baptized. For Elect and Reprobate, and all are under these commands, if they be members of the visible Church. But the promise of a new heart is not made to all within the visible Church.</p></blockquote>

but to me as working twelve hours; but there is neither face nor faith in this Answer: For the fulfilling of the covenant is only to give four pence to John, if he work 12. hours; but the promise and covenant was made to him and he hath foully broken. Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled, a covenant or threatening, is a covenant and threatening obliging Adam, fit shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2. 17. by silence, and Professors within the visible Church, by their professing of the Doctrine of the Gospel or covenant of grace, their receiving of the Seals and professed hearing of the Word, are under the covenant of Grace, and engage themselves to obey commands, promises, threatenings, and therefore promises are as properly made to them, Act. 2. 39. As commands, and threatenings, exhortations, invitations, and Gospel-requests are made to them. But though the Anabaptists ignorantly confound the promise, and the thing promised; the covenant, and benefits covenanted. The promise is to you, and so are the commands, and threatenings, whether ye believe or not, the command is to you, and lays an obligation on you, whether ye obey, or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life is not given to you until you first believe. Object. Is not the promise made the same way to the aged as to the children; and the same thing required of both: The promise is to you and to your Children. But the promise is made to the aged only, if they actually believe. Ergo, the promise is made to the Children only, if they actually believe, and so not to Infants. Answ. Neither proposition nor assumption can bear weight. For the proposition when God saith, I will be thy God O Abraham, and the God of thy seed. Is it needful that God require the same conditions, that is actual believing that he may save Father Abraham, &amp; also actual believing from hearing the word of the covenant preached from all Infants born of Abraham and dying in Infancy, or then all these Infants so dying must be eternally damned? nay, we believe many Infants (we reserve to the holy and glorious Lord his liberty of election &amp; reprobation, Rom. 9. 11. 12) among the Jews were saved by the covenant of grace, though they died Infants. And this we condemn in Anabaptists, that they show no revealed way of God of saving Infants of believing Parents dying in Infancy, more then of saving Pagans and their Infants, for to them both are alike without the covenant of grace and without Christ; and therefore believing Parents have no word of faith, or of the Gospel to pray for the salvation of their children dying in Infancy, for such prayers have neither warrant in the covenant of Works, nor in the covenant of grace by their way. And yet that we are to pray, is to be gathered from Gen. 19. 18. 2 Sam. 12. 16. Job. 1. 5. Mark 10. 16. Psal. 28. 9, and if we pray for their salvation, they must be saved by either Law or Gospel Its not enough, to say that we may pray for savages that never heard of the Gospel, nor of the covenant of grace, that they may be saved. For seeing there is no name under Heaven by which men may be saved, but by the name of Jesus, Acts 4. 12. John 14. 6. There is no other warrant of praying for such, then that God would send them the Gospel, and since Christ prayed for Infants and blessed them, which is a praying for them, Gen. 48. 15, 16 Deut. 33. 1. 6, 7, 8. &amp;c. Eph. 1.

2. Gal. 1. 3. 1 Cor. 1. 3. 1 Tim. 1. 2. 2 Tim. 1.

3. See Mar. 10. 16. he must own them as blessed in Christ, in whom all the Nations of the earth are blessed, and so covenanted with God in Christ. 2. It is false that the promise is made only to the aged, upon condition of actual believing. 1. It is made to their children expressly in the Text, and for the way of their believing, we leave it to the Lord. Nor is it true, that the promise is made to the aged, upon condition of believing. The promise is made to them absolutely, whether they believe or not. But the blessing of the promise and covenant of grace is given and bestowed only conditionally, if they believe. The promise is absolutely made: its called conditional from the thing conditionally given. Obj. But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Ergo, such as are externally within the Covenant, are not really and indeed within the covenant of grace. Ans. The Adverb (really) relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant, are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them? but they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation, upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement &amp; obligation upon such to believe the promise, but sometimes, we say the promises of the covenant of grace are not really made to the Reprobate within the visible Church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe. And therefore these words are figurative, Heb. 8. 10. This is the Covenant that I will make with the house of Israel, I will write my Law in their minds, &amp;c. that is, this is the special and principal covenanted blessing, I will give them a new heart: which must not be called a simple prediction, though a prediction it is, but it is also a real promise made absolutely to the Elect, which the Lord fulfills in them: And this is called the Covenant. Because 1. They are no better then nonCovenanters upon whom the Lord bestows not this part and blessing of the covenant. 2. The truth is, the promise of a new heart is not made to the visible Church, which is only visible: but to the Elect &amp; invisible Church. And if Anabaptists shall expone these words, Acts 2. 39. The promise of a new heart is made to you and to your Children, upon condition that you and your Children believe, which they cannot do until first they have a new heart, its as good as Peter had said, God promiseth to you and to your Children grace to believe, and a new heart to obey him, upon condition that you first believe. And that is, Gods promise to you to believe upon condition that ye believe, which is ridiculous, and therefore we cannot say that this promise of a new heart is made to all that are commanded to believe and repent and be baptized. For Elect and Reprobate, and all are under these commands, if they be members of the visible Church. But the promise of a new heart is not made to all within the visible Church.”

of+the+Prophets+and+of+the+Covenant+made+with+the+fathers%2C+Acts+3.+25.+Now+what+ground+do+Anabaptists+give+that+all+infants+believe%2C+or+that+some+believe%2C+since+to+them%2C+their+children+were+as+Pagans+without+Christ%2C+without+the+Covenant%3F+if+to+the+children+when+they+come+to+age+and+shall+believe%3F+but+what+need+to+add%2C+and+to+your+believing+Children%3F+for+these+are+not+children+but+men+of+age%2C+their+fathers+and+they+both+being+believers.+Now+Peter+sets+down+two+ranks%2C+the+aged+who+heard+the+word+with+gladness%2C+and+were+pricked+in+heart%2C+v.+37.+41.+and+the+children%2C+and+to+both+the+promise+is+made%2C+and+what+ground+is+there+to+exclude+sucking+children%3F+for+the+word%2C+Acts+2.+39.+is+Matth.+2.+18.+1+Cor.+7.+14.+where+sure+the+word+is+taken+for+sucking+children+of+whose+actual+faith+the+Scripture+speaks+not.+2.+The+promise+is+to+you+and+to+your+children%2C+can+have+no+other+sense+then%2C+the+promise+and+word+of+the+Covenant+is+preached+to+you+and+to+your+children+in+you%2C+and+this+is+to+be+externally+in+Covenant%2C+both+under+the+Old+and+New+Testament.+If+it+have+another+sense+it+must+be+this%2C+the+Lord+hath+internally+Covenanted+with+you+the+3000.+who+have+heard+the+word+and+with+your+children%2C+and+you+are+the+spiritual+seed%2C+and+sons+of+promise%2C+predestinate+to+life+eternal%3A+as+Rom.+9.+they+expone+the+seed+in+Covenant%3A+But+1.+Were+all+the+3000.+Ananias+and+Sapphira+and+their+children+the+spiritual+and+chosen+seed%3F+for+he+commands+all%2C+whom+he+exhorts+to+repent%2C+to+be+baptized%3A+And+2.+Now+to+Simon+Magus+and+Demas%2C+and+numbers+of+such%2C+Peter+could+not+have+said%2C+the+promise+is+made+to+you+and+to+your+children%2C+if+it+be+only+made+to+real+and+actual+believers%2C+as+they+say%2C+Peter+therefore+must+own+them+all+whom+he+exhorts+to+repent%2C+as+the+chosen+seed.+But+if+the+former+sense+be+intended+%28as+how+can+it+be+denied%3F%29+to+wit%2C+the+word+of+the+Covenant+is+preached+to+you%2C+an+offer+of+Christ+is+made+in+the+preached+Gospel+to+you.+Then+it+cannot+be+denied%2C+but+the+promises+to+all+the+Reprobate+in+the+Visible+Church+whether+they+believe+or+not%2C+for+Christ+is+preached%3B+and+promises+of+the+Covenant+are+Preached+to+Simon+Magus%2C+to+Judas+and+all+the+Hypocrites+who+stumble+at+the+word%2C+to+all+the+Pharisees%2C+as+is+clear%2C+Math.+13.+20%2C+21%2C+22%2C+23.+Acts+13.+44%2C+45.+Acts+18.+5%2C+6.+Math.+21.+43.+1+Pet.+2.+7%2C+8.+%283.%29+The+promise%2C+I+will+be+your+God%2C+and+ye+shall+be+my+people%2C+must+be+one+way+expounded+in+the+Old+Testament%2C+to+wit%2C+you+are+externally+only+in+Covenant+with+God.+But+in+the+New+Testament%2C+it+must+have+this+meaning%2C+I+will+be+your+God%2C+2.+Cor.+6.+16.+that+is%2C+you+are+all+predestinate+to+life%2C+and+the+sons%2C+by+promise%2C+and+the+spiritual+seed%2C+to+whom+I+say%2C+I+will+be+your+God%3A+But+so+it+may+well+be+said%2C+there+were+no+internal+Covenanters+in+the+Old+Testament%2C+and+there+be+none+but+only+internal+Covenanters+in+the+New+Testament%2C+so+that+when+the+Lord+sayeth%2C+Rev.+11.+15.+The+Kingdoms+of+the+earth+are+mine%2C+and+my+sons.+He+must+say%2C+the+Kingdoms%2C+Egypt%2C+Assyria%2C+Tyrus%2C+Ethiopia%2C+%26c.+are+chosen+and+the+spiritual+seed%2C+and+these+Covenanted+Nations+and+the+Kingdoms+of+the+Gentiles+are+all+internally+and+effectually+called%2C+and+there+are+no+Visible+Churches+in+the+New+Test.+but+only+all+invisible+and+saved.+4.+If+these+words%2C+The+promise+is+to+you%2C+and+to+your+Children%2C+be+limited%2C+to+as+many+as+the+Lord+shall+effectually+call%2C+either+fathers+or+children%3A+But+Mr.+Stev.+Marshall+judiciously+observes%3B+there+is+no+more+a+Covenant-favour+holden+forth+to+their+children%2C+then+to+the+children+of+Pagans%3B+for+the+children+of+Pagans%2C+if+God+effectually+call+them%2C+have+the+promises+made+to+them.+5.+Its+clear+that+external+Covenant-holiness%2C+is+to+these+men+ceremonial+holiness+now+out+of+date%3B+and+then+external+calling+the+only+means+of+internal+and+effectual+calling%2C+Math.+22.+14.+1+Cor.+1.+18.+23.+24.+Luke+15.+1%2C+2.+and+the+fixed+Church-hearing+of+the+Preached+Gospel+is+a+ceremony.+2.+That+God+should+be+the+God+of+Infants+of+the+seed+of+the+Jews%2C+a+mercy+to+fathers+and+sons+coming+from+free+love%2C+Deut.+10.+15.+Gen.+17.+7.+Deut.+7.+6%2C+7%2C+8.+and+Prophesied+as+a+mercy+to+the+Gentiles+by+all+the+Prophets+was+a+ceremony+removed+now+in+Christ.+Yea+3.+External+covenanting+and+adopting%2C+and+choosing+of+Israel+is+no+mercy%2C+except+that+a+Pedagogue+of+the+Law+is+a+mercy+for+a+time.+4.+The+promise+is+to+you+and+to+your+Children%2C+must+be+in+a+contradictory+way+expounded%2C+to+wit%2C+the+promise+is+no+more+made+to+your+Children+so+long+as+they+are+Infants%2C+then+to+Devils.+Yea+Fathers+and+Children+not+believing%2C+though+chosen+to+life%2C+are+excommunicated+from+visible+Adoption%2C+calling%2C+hearing+the+Gospel-promises%2C+for+there+is+no+covenanting+now+under+the+New+Testament%2C+but+only+internal+covenanting+of+the+Elect.+5.+Young+Timothy+and+children+of+believing+Parents%2C+and+all+the+aged+within+the+visible+Church%2C+have+no+right+to+hear+the+preached+Gospel%2C+before+they+believe+and+be+the+holy+seed%2C+more+then+Pagans.+Yea+6.+They+can+have+no+command+of+God%2C+to+hear+the+Gospel%2C+nor+any+covenant+or+Gospel+warrant%2C+until+they+be+believers%2C+for+if+there+were+no+promise+made+to+hearing+and+considering+the+word%2C+if+they+shall+believe%2C+while+as+yet+they+believe+not%2C+and+until+they+be+effectually+called%2C+there+can+be+no+command%2C+and+no+Law%2C+to+hear+the+Gospel+and+the+covenant+offer+made+in+Christ.+It+shall+then+be+no+more+sin+for+unconverted+persons+to+turn+away+their+ears+from+the+Law%2C+and+not+to+hear+the+Gospel.+7.+It+were+non-sense+to+say+to+men+under+the+externally+proposed+covenant%2C+repent%2C+hear+the+Gospel%2C+use+the+means%2C+receive+the+seals%2C+and+yet+you+have+no+right+to+hear%2C+nor+have+we+any+warrant+to+baptize+you%2C+until+ye+believe%3B+for+there+is+no+promise+made+to+you%2C+nor+to+your+seed+and+Children%2C+until+first+you+believe.+And+it+must+say+there+was+no+threatening+to+Adam.+Gen.+2.+17.+before+he+sinned%2C+and+no+promise+to+Adam+nor+to+any+now%2C+do+this+and+live%2C+until+Adam+first+sinned%2C+and+first+obeyed+the+covenant%3B+and+so%2C+if+John+covenant+to+labour+in+Peters+Vineyard%2C+and+Peter+promise+to+him+four+pence%2C+so+he+work+twelve+hours%2C+otherwise+he+shall+not+pay+him+4.+pence%2C+though+John+accept+of+the+covenant%2C+and+work+but+one+hour%2C+whereas+his+covenant+is+to+work+for+twelve+hours%2C+then+no+man+can+say+to+John+%28work%2C+for+there+is+a+promise+made+of+four+pence+to+you%29+the+other+might+deny%3B+no+such+promise+was+made+to+me%2C+except+I+work+twelve+hours.+It+were%2C+sure%2C+unfaithful+dealing+to+John+to+say+so.+For+the+four+pence+ought+not%2C+by+this+Covenant%2C+to+be+given+to+him+except+he+work+twelve+hours%3A+but+he+cannot+without+palpable+falshood%2C+say%2C+I+have+broken+no+Covenant%2C+in+not+working+twelve+hours%3A+For+though+I+consented+to+the+covenant%2C+and+began+to+work+an+hour%2C+yet+the+promise+was+not+to+me+simply%2C+but+to+me+as+working+twelve+hours%3B+but+there+is+neither+face+nor+faith+in+this+Answer%3A+For+the+fulfilling+of+the+covenant+is+only+to+give+four+pence+to+John%2C+if+he+work+12.+hours%3B+but+the+promise+and+covenant+was+made+to+him+and+he+hath+foully+broken.+Yea+a+conditional+covenant+agreed+unto+and+accepted%2C+is+a+covenant%2C+if+we+shall+%28as+in+reason+we+ought%29+distinguish+between+a+covenant%2C+in+its+essence+and+nature%2C+and+a+covenant+broken+or+fulfilled%2C+a+covenant+or+threatening%2C+is+a+covenant+and+threatening+obliging+Adam%2C+fit+shall+be+agreed+unto+by+silence%2C+as+Adam+accepted+the+threatening%2C+Gen.+2.+17.+by+silence%2C+and+Professors+within+the+visible+Church%2C+by+their+professing+of+the+Doctrine+of+the+Gospel+or+covenant+of+grace%2C+their+receiving+of+the+Seals+and+professed+hearing+of+the+Word%2C+are+under+the+covenant+of+Grace%2C+and+engage+themselves+to+obey+commands%2C+promises%2C+threatenings%2C+and+therefore+promises+are+as+properly+made+to+them%2C+Act.+2.+39.+As+commands%2C+and+threatenings%2C+exhortations%2C+invitations%2C+and+Gospel-requests+are+made+to+them.+But+though+the+Anabaptists+ignorantly+confound+the+promise%2C+and+the+thing+promised%3B+the+covenant%2C+and+benefits+covenanted.+The+promise+is+to+you%2C+and+so+are+the+commands%2C+and+threatenings%2C+whether+ye+believe+or+not%2C+the+command+is+to+you%2C+and+lays+an+obligation+on+you%2C+whether+ye+obey%2C+or+obey+not%2C+and+the+threatenings+are+to+you%2C+whether+ye+transgress+or+transgress+not.+It+is+true+indeed%2C+the+promise%2C+that+is%2C+the+blessing+promised%2C+righteousness+and+eternal+life+is+not+given+to+you+until+you+first+believe.+Object.+Is+not+the+promise+made+the+same+way+to+the+aged+as+to+the+children%3B+and+the+same+thing+required+of+both%3A+The+promise+is+to+you+and+to+your+Children.+But+the+promise+is+made+to+the+aged+only%2C+if+they+actually+believe.+Ergo%2C+the+promise+is+made+to+the+Children+only%2C+if+they+actually+believe%2C+and+so+not+to+Infants.+Answ.+Neither+proposition+nor+assumption+can+bear+weight.+For+the+proposition+when+God+saith%2C+I+will+be+thy+God+O+Abraham%2C+and+the+God+of+thy+seed.+Is+it+needful+that+God+require+the+same+conditions%2C+that+is+actual+believing+that+he+may+save+Father+Abraham%2C+%26+also+actual+believing+from+hearing+the+word+of+the+covenant+preached+from+all+Infants+born+of+Abraham+and+dying+in+Infancy%2C+or+then+all+these+Infants+so+dying+must+be+eternally+damned%3F+nay%2C+we+believe+many+Infants+%28we+reserve+to+the+holy+and+glorious+Lord+his+liberty+of+election+%26+reprobation%2C+Rom.+9.+11.+12%29+among+the+Jews+were+saved+by+the+covenant+of+grace%2C+though+they+died+Infants.+And+this+we+condemn+in+Anabaptists%2C+that+they+show+no+revealed+way+of+God+of+saving+Infants+of+believing+Parents+dying+in+Infancy%2C+more+then+of+saving+Pagans+and+their+Infants%2C+for+to+them+both+are+alike+without+the+covenant+of+grace+and+without+Christ%3B+and+therefore+believing+Parents+have+no+word+of+faith%2C+or+of+the+Gospel+to+pray+for+the+salvation+of+their+children+dying+in+Infancy%2C+for+such+prayers+have+neither+warrant+in+the+covenant+of+Works%2C+nor+in+the+covenant+of+grace+by+their+way.+And+yet+that+we+are+to+pray%2C+is+to+be+gathered+from+Gen.+19.+18.+2+Sam.+12.+16.+Job.+1.+5.+Mark+10.+16.+Psal.+28.+9%2C+and+if+we+pray+for+their+salvation%2C+they+must+be+saved+by+either+Law+or+Gospel+Its+not+enough%2C+to+say+that+we+may+pray+for+savages+that+never+heard+of+the+Gospel%2C+nor+of+the+covenant+of+grace%2C+that+they+may+be+saved.+For+seeing+there+is+no+name+under+Heaven+by+which+men+may+be+saved%2C+but+by+the+name+of+Jesus%2C+Acts+4.+12.+John+14.+6.+There+is+no+other+warrant+of+praying+for+such%2C+then+that+God+would+send+them+the+Gospel%2C+and+since+Christ+prayed+for+Infants+and+blessed+them%2C+which+is+a+praying+for+them%2C+Gen.+48.+15%2C+16+Deut.+33.+1.+6%2C+7%2C+8.+%26c.+Eph.+1.+2.+Gal.+1.+3.+1+Cor.+1.+3.+1+Tim.+1.+2.+2+Tim.+1.+3.+See+Mar.+10.+16.+he+must+own+them+as+blessed+in+Christ%2C+in+whom+all+the+Nations+of+the+earth+are+blessed%2C+and+so+covenanted+with+God+in+Christ.+2.+It+is+false+that+the+promise+is+made+only+to+the+aged%2C+upon+condition+of+actual+believing.+1.+It+is+made+to+their+children+expressly+in+the+Text%2C+and+for+the+way+of+their+believing%2C+we+leave+it+to+the+Lord.+Nor+is+it+true%2C+that+the+promise+is+made+to+the+aged%2C+upon+condition+of+believing.+The+promise+is+made+to+them+absolutely%2C+whether+they+believe+or+not.+But+the+blessing+of+the+promise+and+covenant+of+grace+is+given+and+bestowed+only+conditionally%2C+if+they+believe.+The+promise+is+absolutely+made%3A+its+called+conditional+from+the+thing+conditionally+given.+Obj.+But+is+not+this+an+approven+distinction%2C+that+persons+are+within+the+Covenant%2C+either+externally%2C+professedly%2C+visibly%2C+or+internally%2C+really%2C+or+according+to+the+intention+of+God%3F+Ergo%2C+such+as+are+externally+within+the+Covenant%2C+are+not+really+and+indeed+within+the+covenant+of+grace.+Ans.+The+Adverb+%28really%29+relates+to+the+real+fruit+of+the+fulfilled+covenant%2C+and+so+such+as+are+only+externally+within+the+covenant%2C+are+not+really+within+the+covenant%2C+for+God+never+directed%2C+nor+intended+to+bestow+the+blessing+covenanted%2C+nor+grace+to+perform+the+condition+of+the+covenant+upon+them%3F+but+they+are+really+covenanted+and+engaged+by+their+consented+profession+to+fulfill+the+covenant.+And+as+the+commands+and+threatenings+of+the+covenant+of+grace+lay+on+a+real+obligation%2C+upon+such+as+are+only+externally+in+covenant%2C+either+to+obey+or+suffer%2C+so+the+promise+of+the+covenant+imposes+an+engagement+%26+obligation+upon+such+to+believe+the+promise%2C+but+sometimes%2C+we+say+the+promises+of+the+covenant+of+grace+are+not+really+made+to+the+Reprobate+within+the+visible+Church%2C+because+God+intends+and+decrees+to%2C+and+for+them%2C+neither+the+blessing+promised%2C+nor+the+saving+grace+to+fulfill+the+condition+or+to+believe.+And+therefore+these+words+are+figurative%2C+Heb.+8.+10.+This+is+the+Covenant+that+I+will+make+with+the+house+of+Israel%2C+I+will+write+my+Law+in+their+minds%2C+%26c.+that+is%2C+this+is+the+special+and+principal+covenanted+blessing%2C+I+will+give+them+a+new+heart%3A+which+must+not+be+called+a+simple+prediction%2C+though+a+prediction+it+is%2C+but+it+is+also+a+real+promise+made+absolutely+to+the+Elect%2C+which+the+Lord+fulfills+in+them%3A+And+this+is+called+the+Covenant.+Because+1.+They+are+no+better+then+nonCovenanters+upon+whom+the+Lord+bestows+not+this+part+and+blessing+of+the+covenant.+2.+The+truth+is%2C+the+promise+of+a+new+heart+is+not+made+to+the+visible+Church%2C+which+is+only+visible%3A+but+to+the+Elect+%26+invisible+Church.+And+if+Anabaptists+shall+expone+these+words%2C+Acts+2.+39.+The+promise+of+a+new+heart+is+made+to+you+and+to+your+Children%2C+upon+condition+that+you+and+your+Children+believe%2C+which+they+cannot+do+until+first+they+have+a+new+heart%2C+its+as+good+as+Peter+had+said%2C+God+promiseth+to+you+and+to+your+Children+grace+to+believe%2C+and+a+new+heart+to+obey+him%2C+upon+condition+that+you+first+believe.+And+that+is%2C+Gods+promise+to+you+to+believe+upon+condition+that+ye+believe%2C+which+is+ridiculous%2C+and+therefore+we+cannot+say+that+this+promise+of+a+new+heart+is+made+to+all+that+are+commanded+to+believe+and+repent+and+be+baptized.+For+Elect+and+Reprobate%2C+and+all+are+under+these+commands%2C+if+they+be+members+of+the+visible+Church.+But+the+promise+of+a+new+heart+is+not+made+to+all+within+the+visible+Church.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+or+A+Treatise+of+the+Covenant+of+Grace%2C+%28Edinburgh%2C+1655%29%2C+86%E2%80%9393.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78fe44a197.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78fe44a197.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/samuel-rutherford-on-acts-239-in-defense-of-infant-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-aa9fa3eea1" data-kw="">
<blockquote><p>And we must note these three degrees, that the promise was first made to the Jews, and then to their children, and last of all, that it is also to be imparted to the Gentiles. We know the reason why the Jews are preferred before other people; for they are, as it were, the first begotten in God’s family, yea, they were then separated from other people by a singular privilege. Therefore Peter observeth a good order, when he giveth the Jews the pre-eminence. Whereas he adjoineth their children unto them, it dependeth upon the words of the promise: I will be thy God, and the God of thy seed after thee, (Gen. 17:7,) where God doth reckon the children with the fathers in the grace of adoption. This place, therefore, doth abundantly refute the manifest error of the Anabaptists, which will not have infants, which are the children of the faithful, to be baptized, as if they were not members of the Church. They espy a starting hole in the allegorical sense, and they expound it thus, that by children are meant those which are spiritually begotten. But this gross impudency doth nothing help them. It is plain and evident that Peter spake thus because God did adopt one nation peculiarly. And circumcision did declare that the right of adoption was common even unto infants. Therefore, even as God made his covenant with Isaac, being as yet unborn, because he was the seed of Abraham, so Peter teacheth, that all the children of the Jews are contained in the same covenant, because this promise is always in force, I will be the God of your seed.</p></blockquote>

<blockquote><p>20. It is also pertinent here to know that it is wrong for private individuals to assume the administration of baptism; for this as well as the serving of the Supper is a function of the ecclesiastical ministry. For Christ did not command women, or men of every sort, to baptize, but gave this command to those whom he had appointed apostles. And when he ordered his disciples to do in the ministering of the Supper [Matt. 28:19] what they had seen him do—while he was performing the function of a lawful steward [Luke 22:19]—he doubtless willed that they should follow his example in it. For many ages past and almost from the beginning of the church, it was a custom for laymen to baptize those in danger of death if a minister was not present at the time. I do not see, however, how this can be defended with sound reasoning. Not even the ancient writers themselves, who either followed this practice or condoned it, were certain whether it was right to do it. Now Augustine displays this doubt when he says: “Even if a layman compelled by necessity should give baptism, I do not know whether anyone might piously say that it should be repeated. For if no necessity compels it to be done, it is a usurping of another’s office; but if necessity urges it, it is either no sin at all or a venial one.” 37xConcerning women, it was decreed without exception in the Council of Carthage that they should not presume to baptize at all. Yet (you say) there is danger lest he who is ill, if he die without baptism, be deprived of the grace of regeneration. Not at all. God declares that he adopts our babies as his own before they are born, when he promises that he will be our God and the God of our descendants after us [Gen. 17:7]. Their salvation is embraced in this word. No one will dare be so insolent toward God as to deny that his promise of itself suffices for its effect. Few realize how much injury the dogma that baptism is necessary for salvation, badly expounded, has entailed. As a consequence, they are less cautious. For, where the opinion has prevailed that all are lost who have not happened to be baptized with water, our condition is worse than that of God’s ancient people—as if the grace of God were now more restricted than under the law! For men will think that Christ has come not to fulfill the promises but to abolish them [cf. Matt. 5:17], seeing that the promise (which was then effective enough of itself to confer salvation before the eighth day) [Gen. 17:7; cf. v. 12] now would not be valid without the aid of a sign.

21. The practice before Augustine was born is first of all inferred from Tertullian, who held that a woman was not allowed to speak in the church, and also not to teach, to baptize, or to offer. This was that she might not claim for herself the function of any man, much less that of a priest. Epiphanius also is a trustworthy witness of this matter when he upbraids Marcion for having given women permission to baptize. And I am well aware of the answer of those who think otherwise: that there is a great difference between common usage and an extraordinary remedy required by dire necessity. But since Epiphanius declares that it is a mockery to give women the right to baptize and makes no exception, it is clear enough that he condemns this corrupt practice as inexcusable under any pretext. Also in the third book, where he teaches that permission was not even given to the holy mother of Christ, he adds no reservation.</p></blockquote>

n%2C+when+he+promises+that+he+will+be+our+God+and+the+God+of+our+descendants+after+us+%5BGen.+17%3A7%5D.+Their+salvation+is+embraced+in+this+word.+No+one+will+dare+be+so+insolent+toward+God+as+to+deny+that+his+promise+of+itself+suffices+for+its+effect.+Few+realize+how+much+injury+the+dogma+that+baptism+is+necessary+for+salvation%2C+badly+expounded%2C+has+entailed.+As+a+consequence%2C+they+are+less+cautious.+For%2C+where+the+opinion+has+prevailed+that+all+are+lost+who+have+not+happened+to+be+baptized+with+water%2C+our+condition+is+worse+than+that+of+God%E2%80%99s+ancient+people%E2%80%94as+if+the+grace+of+God+were+now+more+restricted+than+under+the+law%21+For+men+will+think+that+Christ+has+come+not+to+fulfill+the+promises+but+to+abolish+them+%5Bcf.+Matt.+5%3A17%5D%2C+seeing+that+the+promise+%28which+was+then+effective+enough+of+itself+to+confer+salvation+before+the+eighth+day%29+%5BGen.+17%3A7%3B+cf.+v.+12%5D+now+would+not+be+valid+without+the+aid+of+a+sign.+21.+The+practice+before+Augustine+was+born+is+first+of+all+inferred+from+Tertullian%2C+who+held+that+a+woman+was+not+allowed+to+speak+in+the+church%2C+and+also+not+to+teach%2C+to+baptize%2C+or+to+offer.+This+was+that+she+might+not+claim+for+herself+the+function+of+any+man%2C+much+less+that+of+a+priest.+Epiphanius+also+is+a+trustworthy+witness+of+this+matter+when+he+upbraids+Marcion+for+having+given+women+permission+to+baptize.+And+I+am+well+aware+of+the+answer+of+those+who+think+otherwise%3A+that+there+is+a+great+difference+between+common+usage+and+an+extraordinary+remedy+required+by+dire+necessity.+But+since+Epiphanius+declares+that+it+is+a+mockery+to+give+women+the+right+to+baptize+and+makes+no+exception%2C+it+is+clear+enough+that+he+condemns+this+corrupt+practice+as+inexcusable+under+any+pretext.+Also+in+the+third+book%2C+where+he+teaches+that+permission+was+not+even+given+to+the+holy+mother+of+Christ%2C+he+adds+no+reservation.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+trans.+Ford+Lewis+Battles.+The+Library+of+Christian+Classics+%28Louisville%2C+KY%3A+Westminster+John+Knox+Press%2C+2011%29%2C+4.15.20%E2%80%9321.+%28More+on+lay+baptism.%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd692b33c4f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d692b33c4f.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/calvin-against-baptism-by-the-laity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.</p></blockquote>

<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>

<blockquote><p>From this influx, it is not surprising that the doctrines of faith and, most especially, that of the new birth became so rapidly corrupted in the churches. With separation from the world spurned, there is no wonder that the sanctity and glory of the gospel was overshadowed, and superstitious practices flooded in along with the unconverted pagans, until, at length, Christian church discipline was remodeled on the fashion of the pagan secular state. Once hypocrites and other unregenerate people began, as it were, to swamp and overwhelm the believers, there soon emerged leaders who were pleased enough to accommodate spiritual doctrines to the prevailing systems of philosophy. And so it came about that faith was neglected, doctrine no longer studied, regeneration equated to the mechanical performance of the rite of baptism, truth and piety no longer defended by any great efforts in the assemblies and councils, the majorities at best indifferent, at worst bitterly hostile, to the total over-shadowing of these essential things. By that time, most of the world had taken up the Christian profession so, at most, everything that had been instituted by Christ had been basely transmuted into another gospel. Strange to tell, it was done without a protest or major split in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Theology</cite>, (Soli Deo Gloria 1994), 660 | HT: Gary Johnson.</span></figcaption>

<blockquote><p>2.1 As far as concerns the case of infants, you expressed your view that they ought not to be baptised within the second or third day of their birth; rather, the ancient law on circumcision ought to be respected and you therefore concluded that the newly-born should not be baptised and sanctified before the eighth day. Our Council adopted an entirely different conclusion. No one agreed with your opinion on the matter; instead, without exception we all formed the judgment that it is not right to deny the mercy and grace of God to any man that is born. 2.2 But seeing that the Lord says in His own Gospel: The Son of man has come not to destroy the souls of men but to save them, we must do everything we possibly can to prevent the destruction of any soul. We need to ask, what can be lacking to one who has been already formed by the hands of God in his mother’s womb? To our way of thinking, indeed, and to our eyes infants after their birth appear to grow and increase as the earthly days go by; but as far as God their Maker is concerned, whatever has been made by Him is perfect and complete thanks to His handiwork and almighty power. 6.1 And so, dearest brother, our verdict at the Council was this: we ought not to be the cause for debarring anyone from access to baptism and the grace of God, for He is merciful, kind, and loving towards all men. 6.2 And whilst this is a rule which ought to be observed and maintained concerning the whole of mankind, it is our view that it should be observed most particularly in the very case of newborn infants; they have all the more claim upon our assistance and God’s mercy for the reason that, right from the very first moment they are born, in their crying and wailing they are doing nothing else but imploring for our help</p></blockquote>

— Cyprian of Carthage, The Letters of St. Cyprian of Carthage, Letters 55–66, ed. Johannes Quasten, Walter J. Burghardt, and Thomas Comerford Lawler, trans. G. W. Clarke, vol. III, Ancient Christian Writers (New York; Mahwah, NJ: Newman Press, 1986), 110, 112.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.1+As+far+as+concerns+the+case+of+infants%2C+you+expressed+your+view+that+they+ought+not+to+be+baptised+within+the+second+or+third+day+of+their+birth%3B+rather%2C+the+ancient+law+on+circumcision+ought+to+be+respected+and+you+therefore+concluded+that+the+newly-born+should+not+be+baptised+and+sanctified+before+the+eighth+day.+Our+Council+adopted+an+entirely+different+conclusion.+No+one+agreed+with+your+opinion+on+the+matter%3B+instead%2C+without+exception+we+all+formed+the+judgment+that+it+is+not+right+to+deny+the+mercy+and+grace+of+God+to+any+man+that+is+born.+2.2+But+seeing+that+the+Lord+says+in+His+own+Gospel%3A+The+Son+of+man+has+come+not+to+destroy+the+souls+of+men+but+to+save+them%2C+we+must+do+everything+we+possibly+can+to+prevent+the+destruction+of+any+soul.+We+need+to+ask%2C+what+can+be+lacking+to+one+who+has+been+already+formed+by+the+hands+of+God+in+his+mother%E2%80%99s+womb%3F+To+our+way+of+thinking%2C+indeed%2C+and+to+our+eyes+infants+after+their+birth+appear+to+grow+and+increase+as+the+earthly+days+go+by%3B+but+as+far+as+God+their+Maker+is+concerned%2C+whatever+has+been+made+by+Him+is+perfect+and+complete+thanks+to+His+handiwork+and+almighty+power.+6.1+And+so%2C+dearest+brother%2C+our+verdict+at+the+Council+was+this%3A+we+ought+not+to+be+the+cause+for+debarring+anyone+from+access+to+baptism+and+the+grace+of+God%2C+for+He+is+merciful%2C+kind%2C+and+loving+towards+all+men.+6.2+And+whilst+this+is+a+rule+which+ought+to+be+observed+and+maintained+concerning+the+whole+of+mankind%2C+it+is+our+view+that+it+should+be+observed+most+particularly+in+the+very+case+of+newborn+infants%3B+they+have+all+the+more+claim+upon+our+assistance+ <blockquote><p>But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.</p></blockquote>

</figure><figure class="quote" id="q-b0378d1e32" data-kw="">
<blockquote><p>For in respect of the observance of the eighth day in the Jewish circumcision of the flesh, a sacrament was given beforehand in shadow and in usage; but when Christ came, it was fulfilled in truth. For because the eighth day, that is, the first day after the Sabbath, was to be that on which the Lord should rise again, and should quicken us, and give us circumcision of the spirit, the eighth day, that is, the first day after the Sabbath, and the Lord’s day, went before in the figure; which figure ceased when by and by the truth came, and spiritual circumcision was given to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter</cite>, 58.4 in Ante-Nicene Fathers vol. 5.</span></figcaption>

</figure><figure class="quote" id="q-ab803be0d5" data-kw="">
<blockquote><p>Others, like the sacramentarians, (those are justly called sacramentarians, who attribute to the sacraments what they do not contain, and by high-sounding but false and made-up promises, lead men away from simple trust in the one God to belief in the power of symbols. Therefore if any one hereafter finds “sacramentarians” in my writings, I want him to understand that class of men who attribute to symbols what belongs only to Divine Power and to the Holy Spirit, personally working in our souls, which symbols and the external word only proclaim and represent), the sacramentarians, I say, either not understanding or not wishing to understand the usage and meaning of our Lord’s words, twist this language so far as to venture to assert that the things themselves are really and materially conveyed by the sacraments by virtue of the words joined with the elements, and they defend their error by saying, “Faith is of things invisible.” “You do not see grace in baptism,” they say, “but it is certainly conveyed by virtue of the words, as soon as the clergyman has said, ‘I baptize thee in the name of the Father and of the Son and of the Holy Ghost.’ ” When you demand proof this proposition, they say: “Faith is of things invisible.” They fail to notice that baptism is not given to any one unless he first confesses that he has faith, if he is a grown person, or unless he has the promise in virtue of which he is counted a member of the Church, if he is a child. Thus this thing which the sacramentarians maintain is conveyed invisibly by the sacrament was actually conveyed before. For he who confesses faith had it before he confessed it and, therefore, before he was baptized. For confession precedes immersion. Thus the faith which was given by the light and gift of the Spirit was there before the candidate was admitted to the sacrament, or if he did not have faith, it is certainly not brought to him by baptism. For neither Judas nor Simon the sorcerer, who were without faith when they were baptized, received faith by baptism. But if an infant is to be baptized, since he cannot himself confess faith, he must have the promise which counts him within the Church. The promise is, that the Gentiles, when they have obtained the knowledge of God, and true religion, shall be just as much of the church and people of God as the Hebrews. This all the prophets heralded and Christ Himself most plainly promises. “They shall come from the east and from the west, and shall recline with the God of Abraham and Isaac and Jacob.”* And “The last shall be first,” and “The vineyard shall be given to other husbandmen,” and “There shall be one shepherd and one fold.” Since, therefore, the children of the Hebrews have always been counted with the Church with their parents, and the divine promise is sure, it is clear that the children of Christians belong to the Church of Christ just as much as their parents. This promise is not conveyed in baptism, but he to whom it has been previously given is baptized, that by a visible sign he may bear witness that he is of the number of those who through the goodness of God are called the people of God. Here surely nothing new is brought in, but that which has been previously given is recognized by a religious rite, and the name is given when the symbol and pledge have been received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>𝘛𝘩𝘦 𝘓𝘢𝘵𝘪𝘯 𝘞𝘰𝘳𝘬𝘴 𝘰𝘧 𝘏𝘶𝘭𝘥𝘳𝘦𝘪𝘤𝘩 𝘡𝘸𝘪𝘯𝘨𝘭𝘪</cite>, ed. William John Hinke (Philadelphia: Heidelberg Press, 1922), 2.194–95.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

nor Simon the sorcerer, who were without faith when they were baptized, received faith by baptism. But if an infant is to be baptized, since he cannot himself confess faith, he must have the promise which counts him within the Church. The promise is, that the Gentiles, when they have obtained the knowledge of God, and true religion, shall be just as much of the church and people of God as the Hebrews. This all the prophets heralded and Christ Himself most plainly promises. “They shall come from the east and from the west, and shall recline with the God of Abraham and Isaac and Jacob.”* And “The last shall be first,” and “The vineyard shall be given to other husbandmen,” and “There shall be one shepherd and one fold.” Since, therefore, the children of the Hebrews have always been counted with the Church with their parents, and the divine promise is sure, it is clear that the children of Christians belong to the Church of Christ just as much as their parents. This promise is not conveyed in baptism, but he to whom it has been previously given is baptized, that by a visible sign he may bear witness that he is of the number of those who through the goodness of God are called the people of God. Here surely nothing new is brought in, but that which has been previously given is recognized by a religious rite, and the name is given when the symbol and pledge have been received.”

fessed+it+and%2C+therefore%2C+before+he+was+baptized.+For+confession+precedes+immersion.+Thus+the+faith+which+was+given+by+the+light+and+gift+of+the+Spirit+was+there+before+the+candidate+was+admitted+to+the+sacrament%2C+or+if+he+did+not+have+faith%2C+it+is+certainly+not+brought+to+him+by+baptism.+For+neither+Judas+nor+Simon+the+sorcerer%2C+who+were+without+faith+when+they+were+baptized%2C+received+faith+by+baptism.+But+if+an+infant+is+to+be+baptized%2C+since+he+cannot+himself+confess+faith%2C+he+must+have+the+promise+which+counts+him+within+the+Church.+The+promise+is%2C+that+the+Gentiles%2C+when+they+have+obtained+the+knowledge+of+God%2C+and+true+religion%2C+shall+be+just+as+much+of+the+church+and+people+of+God+as+the+Hebrews.+This+all+the+prophets+heralded+and+Christ+Himself+most+plainly+promises.+%E2%80%9CThey+shall+come+from+the+east+and+from+the+west%2C+and+shall+recline+with+the+God+of+Abraham+and+Isaac+and+Jacob.%E2%80%9D%2A+And+%E2%80%9CThe+last+shall+be+first%2C%E2%80%9D+and+%E2%80%9CThe+vineyard+shall+be+given+to+other+husbandmen%2C%E2%80%9D+and+%E2%80%9CThere+shall+be+one+shepherd+and+one+fold.%E2%80%9D+Since%2C+therefore%2C+the+children+of+the+Hebrews+have+always+been+counted+with+the+Church+with+their+parents%2C+and+the+divine+promise+is+sure%2C+it+is+clear+that+the+children+of+Christians+belong+to+the+Church+of+Christ+just+as+much+as+their+parents.+This+promise+is+not+conveyed+in+baptism%2C+but+he+to+whom+it+has+been+previously+given+is+baptized%2C+that+by+a+visible+sign+he+may+bear+witness+that+he+is+of+the+number+of+those+who+through+the+goodness+of+God+are+called+the+people+of+God.+Here+surely+nothing+new+is+brought+in%2C+but+that+which+has+been+previously+given+is+recognized+by+a+religious+rite%2C+and+the+name+is+given+when+the+symbol+and+pledge+have+been+received.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+%F0%9D%98%9B%F0%9D%98%A9%F0%9D%98%A6+%F0%9D%98%93%F0%9D%98%A2%F0%9D%98%B5%F0%9D%98%AA%F0%9D%98%AF+%F0%9D%98%9E%F0%9D%98%B0%F0%9D%98%B3%F0%9D%98%AC%F0%9D%98%B4+%F0%9D%98%B0%F0%9D%98%A7+%F0%9D%98%8F%F0%9D%98%B6%F0%9D%98%AD%F0%9D%98%A5%F0%9D%98%B3%F0%9D%98%A6%F0%9D%98%AA%F0%9D%98%A4%F0%9D%98%A9+%F0%9D%98%A1%F0%9D%98%B8%F0%9D%98%AA%F0%9D%98%AF%F0%9D%98%A8%F0%9D%98%AD%F0%9D%98%AA%2C+ed.+William+John+Hinke+%28Philadelphia%3A+Heidelberg+Press%2C+1922%29%2C+2.194%E2%80%9395.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab803be0d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab803be0d5.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/zwingli-on-sacramentarians-and-infant-baptism-1529/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Now concerning baptism, baptize as follows: after you have reviewed all these things, baptize in the name of the Father and of the Son and of the Holy Spirit in running water. But if you have no running water, then baptize in some other water; and if you are not able to baptize in cold water, then do so in warm. But if you have neither, then pour water on the head three times in the name of the Father and Son and Holy Spirit. And before the baptism let the one baptizing and the who is to be baptized fast, as well as any others who are able. Also, you must instruct the one who is to be baptized to fast for one or two days beforehand.</p></blockquote>

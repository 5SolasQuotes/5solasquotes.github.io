<div class="actions"><button class="copy" data-copy="“The passages are these:— He was thirty years old when he came up to be baptized. Then, when he had the mature age of a teacher, he came to Jerusalem, so that all would reasonably accept him as a teacher. For he did not appear to be one thing while he was another, as those say who introduce him as a man only in appearance. He actually was what he appeared to be. So, when he was teacher, he also had the age of a teacher. He did not reject human nature or exalt himself above it, nor did he abrogate in himself his own law [given in behalf] of the human race; but he sanctified every age by a likeness to himself. Surely, he came to save all people through himself; I say all who would again be born to God—infants, children, youth, young adults, elderly. Therefore, he passed through every age. Becoming an infant among infants, he sanctified infants; becoming a child among children, he sanctified those having this age and at the same time became for them an example of piety and righteousness and obedience; becoming a young adult among young adults, he was an example for young adults and sanctified them to the Lord. In the same way, he became also an elderly person among the elderly, so that he might be a mature teacher for all, not merely by explaining the truth but also by his age, that is, by at the same time sanctifying the elderly and being an example for them. Lastly, he came even to death so that he might be the Firstborn from the dead, himself holding the primacy in all things, the Author of life, prior to all and going before all.1 [Book. 1. ch. 21. sect. 1]: The tradition about their redemption turns out to be invisible and incomprehensible, inasmuch as this is the mother of the incomprehensible and invisible beings.1 And so it is unstable and cannot be told simply or in one word, because each one of them hands it down just as he wishes. For there are as many redemptions as there are mystery-teachers of this doctrine. When in the proper place we shall expose them, we shall tell how this false picture was injected by Satan in order to deny the baptism of rebirth unto God, and to destroy the entire faith.2 Mr Tombs tells us, “This proves not infant baptism, because though it be granted that in Justin Martyr, and others of the ancients, to be regenerated is to be baptized, yet it doth not appear that Irenæus meant it so in this place, unless it were proved it is so only meant by him and the ancients. Nor doth Irenæus, lib. i. cap. xviii., term baptism ‘regeneration;’ but saith thus, ‘To the denying of baptism of that regeneration which is unto God.’ But that indeed the word ‘renascuntur,’ ‘are born again,’ is not meant of baptism is proved from the words and the scope of them; for,— “1. The words are, ‘Per eum renascuntur,’ ‘By him,’ that is, Christ, ‘are born again.’ And it is clear, from the scope of the speech about the fulness of his age, as a perfect master, that ‘By him’ notes his person according to his human nature. Now, if then, ‘By him are born again,’ be as much as ‘By him are baptized,’ this should be Irenæus assertion, that by Christ himself, in his human body, infants, and little ones, and boys, and young men, and elder men, are baptized unto God. But this speech is most manifestly false; for neither did Christ baptize any at all in his own person, (John 4:1, 2, ‘Jesus himself baptized not, but his disciples,’) nor did the disciples baptize any infant at all, as may be gathered from the whole New Testament. “2. The word which Irenæus expresseth whereby persons are born again to God by Christ is applied to the example of his age, as the words and scope show. But he was not in his age an example of every age by his baptism, as if he did by it sanctify every age, for then he should have been baptized in every age; but in respect of the holiness of his human nature, which did remain each age, and so exemplarily sanctify each age to God, so as that there was no age but was capable of holiness by conformity to his example. “3. Irenæus’ words are, ‘Omnes enim venit per semetipsum salvare, omnes, inquam, qui per eum renascuntur in Deum, infantes, et parvulos,’ etc. Now, if the meaning were, that Christ came to save all that were baptized by him or by his appointment, then he came to save Simon Magus, or whoever are or have been baptized rightly. But in that sense the proposition is most palpably false; and therefore that sense is not to be attributed to his words. “4. Christ is by Irenæus said to sanctify as ‘a perfect master,—not only according to the exposition of truth, but also as an example to them of piety, justice, and subjection.’ But this is to be understood not in respect of his baptism only, but his whole life, in which he was an example; even as an infant, for then he did willingly empty himself,—‘Took upon him the form of a servant,’ etc., Phil. 2:7, 8. “By all which reasons,” saith Mr Tombs, “I presume the readers who are willing to see truth will perceive this passage of Irenæus to be wrested by Pedobaptists against its meaning, to prove a use of pedobaptism in his time.” Ans.

1. The phrase of “Renascuntur in Deum” is so constantly I used by the ancients for baptism that it may be referred to the conscience of Mr Tombs or any one who hath been conversant in their writings, whether they would not have judged and granted that it was here intended, if mention had not been made of infants and little ones. The ensuing exceptions, therefore, are an endeavour to stifle light in favour of an opinion;—which is not unusual with some. Ans.

2. “Per eum” is the same with “Per semetipsum,” in the words immediately foregoing; that is, “By himself,” in his mediation, grace, and ordinances. And to suppose that if baptism be intended, he must baptize them in his own person, is a mere cavil; for all that are born to God by baptism to this day are so by him. Ans.

3. The words, Εἰς ἐξάρνησιν τοῦ βαπτίσματος τῆς εἰς Θεὸν ἀναγεννήσεως, “Unto the denial of the baptism of regeneration unto God,” do plainly declare that by “renascuntur” he intends the baptism of regeneration, as being the means and pledge of it, in allusion to that of the apostle, Λούτρον παλιγγενεσίας, Tit. 3:5. Ans.

4. It is remarkable in the words of Irenæus, that in expressing the way and means of the renascency of infants, he mentions nothing of the example of Christ, which he adds unto that of all other ages. Ans.

5. The example of Christ is mentioned as one outward means of the regeneration of them who were capable of its use and improvement. Of his being an example of baptism nothing is spoken. Nor was Christ in his own person an example of regeneration unto any; for as he was not baptized in all ages, so he was never regenerated in any, for he needed no regeneration. Ans.

6. It is well that it is so positively granted that Christ doth sanctify infants; which, seeing he doth not do so to all universally, must be those of believing parents; which is enough to end this controversy. Ans.

7. The meaning of Irenæus is no more but that Christ, passing through all ages, evidenced his design to exclude no age, to communicate his grace unto all sorts and ages; and he mentioneth old men, because his judgment was that Christ was fifty years old when he died. Ans.

8. It was the constant opinion of the ancients that Christ came to save all that were baptized; not intending his purpose and intention with respect unto individuals, but his approbation of the state of baptism, and his grant of the means of grace.”

— John Owen, The Works of John Owen, ed. William H. Goold, vol. 16 (Edinburgh: T&amp;T Clark, n.d.), 263–65.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+passages+are+these%3A%E2%80%94+He+was+thirty+years+old+when+he+came+up+to+be+baptized.+Then%2C+when+he+had+the+mature+age+of+a+teacher%2C+he+came+to+Jerusalem%2C+so+that+all+would+reasonably+accept+him+as+a+teacher.+For+he+did+not+appear+to+be+one+thing+while+he+was+another%2C+as+those+say+who+introduce+him+as+a+man+only+in+appearance.+He+actually+was+what+he+appeared+to+be.+So%2C+when+he+was+teacher%2C+he+also+had+the+age+of+a+teacher.+He+did+not+reject+human+nature+or+exalt+himself+above+it%2C+nor+did+he+abrogate+in+himself+his+own+law+%5Bgiven+in+behalf%5D+of+the+human+race%3B+but+he+sanctified+every+age+by+a+likeness+to+himself.+Surely%2C+he+came+to+save+all+people+through+himself%3B+I+say+all+who+would+again+be+born+to+God%E2%80%94infants%2C+children%2C+youth%2C+young+adults%2C+elderly.+Therefore%2C+he+passed+through+every+age.+Becoming+an+infant+among+infants%2C+he+sanctified+infants%3B+becoming+a+child+among+children%2C+he+sanctified+those+having+this+age+and+at+the+same+time+became+for+them+an+example+of+piety+and+righteousness+and+obedience%3B+becoming+a+young+adult+among+young+adults%2C+he+was+an+example+for+young+adults+and+sanctified+them+to+the+Lord.+In+the+same+way%2C+he+became+also+an+elderly+person+among+the+elderly%2C+so+that+he+might+be+a+mature+teacher+for+all%2C+not+merely+by+explaining+the+truth+but+also+by+his+age%2C+that+is%2C+by+at+the+same+time+sanctifying+the+elderly+and+being+an+example+for+them.+Lastly%2C+he+came+even+to+death+so+that+he+might+be+the+Firstborn+from+the+dead%2C+himself+holding+the+primacy+in+all+things%2C+the+Author+of+life%2C+prior+to+all+and+going+before+all.1+%5BBook.+1.+ch.+21.+sect.+1%5D%3A+The+tradition+about+their+redemption+turns+out+to+be+invisible+and+incomprehensible%2C+inasmuch+as+this+is+the+mother+of+the+incomprehensible+and+invisible+beings.1+And+so+it+is+unstable+and+cannot+be+told+simply+or+in+one+word%2C+because+each+one+of+them+hands+it+down+just+as+he+wishes.+For+there+are+as+many+redemptions+as+there+are+mystery-teachers+of+this+doctrine.+When+in+the+proper+place+we+shall+expose+them%2C+we+shall+tell+how+this+false+picture+was+injected+by+Satan+in+order+to+deny+the+baptism+of+rebirth+unto+God%2C+and+to+destroy+the+entire+faith.2+Mr+Tombs+tells+us%2C+%E2%80%9CThis+proves+not+infant+baptism%2C+because+though+it+be+granted+that+in+Justin+Martyr%2C+and+others+of+the+ancients%2C+to+be+regenerated+is+to+be+baptized%2C+yet+it+doth+not+appear+that+Iren%C3%A6us+meant+it+so+in+this+place%2C+unless+it+were+proved+it+is+so+only+meant+by+him+and+the+ancients.+Nor+doth+Iren%C3%A6us%2C+lib.+i.+cap.+xviii.%2C+term+baptism+%E2%80%98regeneration%3B%E2%80%99+but+saith+thus%2C+%E2%80%98To+the+denying+of+baptism+of+that+regeneration+which+is+unto+God.%E2%80%99+But+that+indeed+the+word+%E2%80%98renascuntur%2C%E2%80%99+%E2%80%98are+born+again%2C%E2%80%99+is+not+meant+of+baptism+is+proved+from+the+words+and+the+scope+of+them%3B+for%2C%E2%80%94+%E2%80%9C1.+The+words+are%2C+%E2%80%98Per+eum+renascuntur%2C%E2%80%99+%E2%80%98By+him%2C%E2%80%99+that+is%2C+Christ%2C+%E2%80%98are+born+again.%E2%80%99+And+it+is+clear%2C+from+the+scope+of+the+speech+about+the+fulness+of+his+age%2C+as+a+perfect+master%2C+that+%E2%80%98By+him%E2%80%99+notes+his+person+according+to+his+human+nature.+Now%2C+if+then%2C+%E2%80%98By+him+are+born+again%2C%E2%80%99+be+as+much+as+%E2%80%98By+him+are+baptized%2C%E2%80%99+this+should+be+Iren%C3%A6us+assertion%2C+that+by+Christ+himself%2C+in+his+human+body%2C+infants%2C+and+little+ones%2C+and+boys%2C+and+young+men%2C+and+elder+men%2C+are+baptized+unto+God.+But+this+speech+is+most+manifestly+false%3B+for+neither+did+Christ+baptize+any+at+all+in+his+own+person%2C+%28John+4%3A1%2C+2%2C+%E2%80%98Jesus+himself+baptized+not%2C+but+his+disciples%2C%E2%80%99%29+nor+did+the+disciples+baptize+any+infant+at+all%2C+as+may+be+gathered+from+the+whole+New+Testament.+%E2%80%9C2.+The+word+which+Iren%C3%A6us+expresseth+whereby+persons+are+born+again+to+God+by+Christ+is+applied+to+the+example+of+his+age%2C+as+the+words+and+scope+show.+But+he+was+not+in+his+age+an+example+of+every+age+by+his+baptism%2C+as+if+he+did+by+it+sanctify+every+age%2C+for+then+he+should+have+been+baptized+in+every+age%3B+but+in+respect+of+the+holiness+of+his+human+nature%2C+which+did+remain+each+age%2C+and+so+exemplarily+sanctify+each+age+to+God%2C+so+as+that+there+was+no+age+but+was+capable+of+holiness+by+conformity+to+his+example.+%E2%80%9C3.+Iren%C3%A6us%E2%80%99+words+are%2C+%E2%80%98Omnes+enim+venit+per+semetipsum+salvare%2C+omnes%2C+inquam%2C+qui+per+eum+renascuntur+in+Deum%2C+infantes%2C+et+parvulos%2C%E2%80%99+etc.+Now%2C+if+the+meaning+were%2C+that+Christ+came+to+save+all+that+were+baptized+by+him+or+by+his+appointment%2C+then+he+came+to+save+Simon+Magus%2C+or+whoever+are+or+have+been+baptized+rightly.+But+in+that+sense+the+proposition+is+most+palpably+false%3B+and+therefore+that+sense+is+not+to+be+attributed+to+his+words.+%E2%80%9C4.+Christ+is+by+Iren%C3%A6us+said+to+sanctify+as+%E2%80%98a+perfect+master%2C%E2%80%94not+only+according+to+the+exposition+of+truth%2C+but+also+as+an+example+to+them+of+piety%2C+justice%2C+and+subjection.%E2%80%99+But+this+is+to+be+understood+not+in+respect+of+his+baptism+only%2C+but+his+whole+life%2C+in+which+he+was+an+example%3B+even+as+an+infant%2C+for+then+he+did+willingly+empty+himself%2C%E2%80%94%E2%80%98Took+upon+him+the+form+of+a+servant%2C%E2%80%99+etc.%2C+Phil.+2%3A7%2C+8.+%E2%80%9CBy+all+which+reasons%2C%E2%80%9D+saith+Mr+Tombs%2C+%E2%80%9CI+presume+the+readers+who+are+willing+to+see+truth+will+perceive+this+passage+of+Iren%C3%A6us+to+be+wrested+by+Pedobaptists+against+its+meaning%2C+to+prove+a+use+of+pedobaptism+in+his+time.%E2%80%9D+Ans.+1.+The+phrase+of+%E2%80%9CRenascuntur+in+Deum%E2%80%9D+is+so+constantly+I+used+by+the+ancients+for+baptism+that+it+may+be+referred+to+the+conscience+of+Mr+Tombs+or+any+one+who+hath+been+conversant+in+their+writings%2C+whether+they+would+not+have+judged+and+granted+that+it+was+here+intended%2C+if+mention+had+not+been+made+of+infants+and+little+ones.+The+ensuing+exceptions%2C+therefore%2C+are+an+endeavour+to+stifle+light+in+favour+of+an+opinion%3B%E2%80%94which+is+not+unusual+with+some.+Ans.+2.+%E2%80%9CPer+eum%E2%80%9D+is+the+same+with+%E2%80%9CPer+semetipsum%2C%E2%80%9D+in+the+words+immediately+foregoing%3B+that+is%2C+%E2%80%9CBy+himself%2C%E2%80%9D+in+his+mediation%2C+grace%2C+and+ordinances.+And+to+suppose+that+if+baptism+be+intended%2C+he+must+baptize+them+in+his+own+person%2C+is+a+mere+cavil%3B+for+all+that+are+born+to+God+by+baptism+to+this+day+are+so+by+him.+Ans.+3.+The+words%2C+%CE%95%E1%BC%B0%CF%82+%E1%BC%90%CE%BE%CE%AC%CF%81%CE%BD%CE%B7%CF%83%CE%B9%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%B2%CE%B1%CF%80%CF%84%CE%AF%CF%83%CE%BC%CE%B1%CF%84%CE%BF%CF%82+%CF%84%E1%BF%86%CF%82+%CE%B5%E1%BC%B0%CF%82+%CE%98%CE%B5%E1%BD%B8%CE%BD+%E1%BC%80%CE%BD%CE%B1%CE%B3%CE%B5%CE%BD%CE%BD%CE%AE%CF%83%CE%B5%CF%89%CF%82%2C+%E2%80%9CUnto+the+denial+of+the+baptism+of+regeneration+unto+God%2C%E2%80%9D+do+plainly+declare+that+by+%E2%80%9Crenascuntur%E2%80%9D+he+intends+the+baptism+of+regeneration%2C+as+being+the+means+and+pledge+of+it%2C+in+allusion+to+that+of+the+apostle%2C+%CE%9B%CE%BF%CF%8D%CF%84%CF%81%CE%BF%CE%BD+%CF%80%CE%B1%CE%BB%CE%B9%CE%B3%CE%B3%CE%B5%CE%BD%CE%B5%CF%83%CE%AF%CE%B1%CF%82%2C+Tit.+3%3A5.+Ans.+4.+It+is+remarkable+in+the+words+of+Iren%C3%A6us%2C+that+in+expressing+the+way+and+means+of+the+renascency+of+infants%2C+he+mentions+nothing+of+the+example+of+Christ%2C+which+he+adds+unto+that+of+all+other+ages.+Ans.+5.+The+example+of+Christ+is+mentioned+as+one+outward+means+of+the+regeneration+of+them+who+were+capable+of+its+use+and+improvement.+Of+his+being+an+example+of+baptism+nothing+is+spoken.+Nor+was+Christ+in+his+own+person+an+example+of+regeneration+unto+any%3B+for+as+he+was+not+baptized+in+all+ages%2C+so+he+was+never+regenerated+in+any%2C+for+he+needed+no+regeneration.+Ans.+6.+It+is+well+that+it+is+so+positively+granted+that+Christ+doth+sanctify+infants%3B+which%2C+seeing+he+doth+not+do+so+to+all+universally%2C+must+be+those+of+believing+parents%3B+which+is+enough+to+end+this+controversy.+Ans.+7.+The+meaning+of+Iren%C3%A6us+is+no+more+but+that+Christ%2C+passing+through+all+ages%2C+evidenced+his+design+to+exclude+no+age%2C+to+communicate+his+grace+unto+all+sorts+and+ages%3B+and+he+mentioneth+old+men%2C+because+his+judgment+was+that+Christ+was+fifty+years+old+when+he+died.+Ans.+8.+It+was+the+constant+opinion+of+the+ancients+that+Christ+came+to+save+all+that+were+baptized%3B+not+intending+his+purpose+and+intention+with+respect+unto+individuals%2C+but+his+approbation+of+the+state+of+baptism%2C+and+his+grant+of+the+means+of+grace.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+16+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+263%E2%80%9365.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a758129da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a758129da.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/owen-versus-toombes-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Thus, some would have baptism to be regeneration itself, and that there is no other evangelical regeneration but that alone, with the profession which is made thereon. Every one who is baptized is thereby regenerated. The sign and figure of grace, they would have to be the grace itself. Nothing can be invented more pernicious unto the souls of men; for all sorts of persons may be brought to a ruinous security about their spiritual condition by it, and diverted from endeavours after that real internal work, in the change of their hearts and natures, without which none shall see God. This is to put that into it which God never placed there. Some suppose it to be such a distinguishing, or rather separating ordinance, that the administration of it in such a way or at such a season, is the fundamental rule of all church fellowship and communion; whereas God never designed it unto any such end.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thus, some would have baptism to be regeneration itself, and that there is no other evangelical regeneration but that alone, with the profession which is made thereon. Every one who is baptized is thereby regenerated. The sign and figure of grace, they would have to be the grace itself. Nothing can be invented more pernicious unto the souls of men; for all sorts of persons may be brought to a ruinous security about their spiritual condition by it, and diverted from endeavours after that real internal work, in the change of their hearts and natures, without which none shall see God. This is to put that into it which God never placed there. Some suppose it to be such a distinguishing, or rather separating ordinance, that the administration of it in such a way or at such a season, is the fundamental rule of all church fellowship and communion; whereas God never designed it unto any such end.”

— John Owen, An Exposition of the Epistle to the Hebrews, (Edinburg: The Banner of Truth Trust, 1991), 22:39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%2C+some+would+have+baptism+to+be+regeneration+itself%2C+and+that+there+is+no+other+evangelical+regeneration+but+that+alone%2C+with+the+profession+which+is+made+thereon.+Every+one+who+is+baptized+is+thereby+regenerated.+The+sign+and+figure+of+grace%2C+they+would+have+to+be+the+grace+itself.+Nothing+can+be+invented+more+pernicious+unto+the+souls+of+men%3B+for+all+sorts+of+persons+may+be+brought+to+a+ruinous+security+about+their+spiritual+condition+by+it%2C+and+diverted+from+endeavours+after+that+real+internal+work%2C+in+the+change+of+their+hearts+and+natures%2C+without+which+none+shall+see+God.+This+is+to+put+that+into+it+which+God+never+placed+there.+Some+suppose+it+to+be+such+a+distinguishing%2C+or+rather+separating+ordinance%2C+that+the+administration+of+it+in+such+a+way+or+at+such+a+season%2C+is+the+fundamental+rule+of+all+church+fellowship+and+communion%3B+whereas+God+never+designed+it+unto+any+such+end.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+%28Edinburg%3A+The+Banner+of+Truth+Trust%2C+1991%29%2C+22%3A39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf89eeafae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df89eeafae.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/07/owen-contra-baptismal-regeneration/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-be8d7af92f" data-kw="">
<blockquote><p>The Baptists, especially those of the time of the Reformation, do not hold the common doctrine on this subject. The Anabaptists not only spoke in very disparaging terms of the old economy and of the state of the Jews under that dispensation, but it was necessary to their peculiar system, that they should deny that the covenant made with Abraham included the covenant of grace. Baptists hold that infants cannot be church members, and that the sign of such membership cannot properly be administered to any who have not knowledge and faith. But it cannot be denied that infants were included in the covenant made with Abraham, and that they received circumcision, its appointed seal and sign. It is therefore essential to their theory that the Abrahamic covenant should be regarded as a merely national covenant entirely distinct from the covenant of grace. The Romanists assuming that saving grace is communicated through the sacraments, and seeing that the mass of the ancient Israelites, on many occasions at least, were rejected of God, notwithstanding their participation of the sacraments then ordained, were driven to assume a radical difference between the sacraments of the Old Testament and those of the New. The former only signified grace, the latter actually conveyed it. From this it follows that those living before the institution of the Christian sacraments were not actually saved. Their sins were not remitted, but pretermitted, passed over. At death they were not admitted into heaven, but passed into a place and state called the limbus patrum, where they remained in a negative condition until the coming of Christ, who after his death descended to hell, sheol, for their deliverance. In opposition to these different views the common doctrine of the Church has ever been, that the plan of salvation has been the same from the beginning. There is the same promise of deliverance from the evils of the apostasy, the same Redeemer, the same condition required for participation in the blessings of redemption, and the same complete salvation for all who embrace the offers of divine mercy.</p></blockquote>

</figure><figure class="quote" id="q-1c2b9b6033" data-kw="">
<blockquote><p>First, all that belong to the covenant and church of God are to be baptized. But the children of christians, as well as adults, belong to the covenant and church of God. Therefore they are to be baptized as well as adults. The major proposition is proven from the command of Christ, which requires the whole church to be baptized. “Go, and teach all nations, baptizing them,” &amp;c. And Paul says: “By one Spirit are we all baptized into one body.” (1 Cor. 12:13.) The minor proposition is clear from the covenant itself in which God declares, “I will be a God unto thee and thy seed after thee:” and from what Christ says: “Suffer little children to come unto me; for of such is the kingdom of heaven.” (Gen. 17:7. Matt. 19:14.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 366.</span></figcaption>

</figure><figure class="quote" id="q-1273808112" data-kw="">
<blockquote><p>Nothing of ourselves. For remission of sins and adoption and unspeakable glory are given to us by Him. For he exhorts them no longer from the things to come only, but even from those now present. For consider. He said, that we shall be raised again, and go on unto incorruption, and have an eternal house; but since present things have more force to persuade than things to come, with those who believe not in these as they ought to believe, he shows how great things they have even already received, and being themselves what. What then being, received they them? Dead all; (for he saith, “all died;” and, “He died for all;” so loved He all alike;) inveterate all, and grown old in their vices. But behold, both a new soul, (for it was cleansed,) and a new body, and a new worship, and promises new, and covenant, and life, and table, and dress, and all things new absolutely. For instead of the Jerusalem below we have received that mother city which is above (Gal. 4:26); and instead of a material temple have seen a spiritual temple; instead of tables of stone, fleshy ones; instead of circumcision, baptism; instead of the manna, the Lord’s body; instead of water from a rock, blood from His side; instead of Moses’ or Aaron’s rod, the Cross; instead of the promised [land], the kingdom of heaven; instead of a thousand priests, one High Priest; instead of a lamb without reason, a Spiritual Lamb. With these and such like things in his thought he said, “all things are new.” But “all” these “things are of God,” by Christ, and His free gift. Wherefore also he added, “Who reconciled us to Himself through Christ, and gave unto us the ministry of reconciliation.” For from Him are all the good things. For He that made us friends is Himself also the cause of the other things which God hath given to His friends. For He rendered not these things unto us, allowing us to continue enemies, but having made us friends unto Himself. But when I say that Christ is the cause of our reconciliation, I say the Father is so also: when I say that the Father gave, I say the Son gave also. “For all things were made by Him;” (John 1:3) and of this too He is the Author. For we ran not unto Him, but He Himself called us. How called He us? By the sacrifice of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Homilies of St. John Chrysostom, Archbishop of Constantinople, on the Epistle of St. Paul to the Romans,” in Saint Chrysostom</cite>, ed. Philip Schaff, trans. J. Ashworth and Talbot B. Chambers, vol. 12, A Select Libra</span></figcaption>

</figure><figure class="quote" id="q-06d265aa9f" data-kw="">
<blockquote><p>To deny that the children of believing, professing parents…have the same right and interest with their parents in the covenant, is plainly to deny the fidelity of Christ in the discharge of his office.</p></blockquote>

</figure><figure class="quote" id="q-5c51c841fc" data-kw="">
<blockquote><p>For that reason we detest the error of the Anabaptists who are not content with a single baptism once received and also condemn the baptism of the children of believers. We believe our children ought to be baptized and sealed with the sign of the covenant, as little children were circumcised in Israel on the basis of the same promises made to our children. And truly, Christ has shed his blood no less for washing the little children of believers than he did for adults. Therefore they ought to receive the sign and sacrament of what Christ has done for them, just as the Lord commanded in the law that by offering a lamb for them the sacrament of the suffering and death of Christ would be granted them shortly after their birth. This was the sacrament of Jesus Christ. Furthermore, baptism does for our children what circumcision did for the Jewish people. That is why Paul calls baptism the “circumcision of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, 1561</span></figcaption>

</figure><figure class="quote" id="q-e57afa0d81" data-kw="">
<blockquote><p>But, to insist still more stoutly upon this point, they add that baptism is a sacrament of repentance and of faith. Accordingly, since neither of these can come about in tender infancy, we must guard against admitting infants into the fellowship of baptism, lest its meaning be made empty and fleeting. But these darts are aimed more at God than at us. For it is very clear from many testimonies of Scripture that circumcision was also a sign of repentance [Jer. 4:4; 9:25; cf. Deut. 10:16; 30:6]. Then Paul calls it the seal of the righteousness of faith [Rom. 4:11]. Therefore, let a reason be required of God himself why he commanded it to be impressed on the bodies of infants. For since baptism and circumcision are in the same case, our opponents cannot give anything to one without conceding it to the other. If they have recourse to their usual way out, that the age of infancy then symbolized spiritual infants, their path is already blocked. We therefore say that, since God communicated circumcision to infants as a sacrament of repentance and of faith, it does not seem absurd if they are now made participants in baptism—unless men choose to rage openly at God’s institution. But as in all God’s acts, so in this very act also there shines enough wisdom and righteousness to repel the detractions of the impious. For although infants, at the very moment they were circumcised, did not comprehend with their understanding what that sign meant, they were truly circumcised to the mortification of their corrupt and defiled nature, a mortification that they would afterward practice in mature years. To sum up, this objection can be solved without difficulty: infants are baptized into future repentance and faith, and even though these have not yet been formed in them, the seed of both lies hidden within them by the secret working of the Spirit. With this answer everything gleaned from the meaning of baptism that they twist against us is once for all overthrown. Such is the label with which Paul marks it when he calls it the washing of regeneration and of renewal [Titus 3:5]. From this they reason that it is to be conferred only on persons capable of experiencing these things. But we are free to counter this by saying: neither was circumcision, which designated regeneration, to be conferred upon any but the regenerate. And thus a thing instituted by God will be condemned by us. Accordingly (as we have already suggested at various times), all the arguments that tend to shake circumcision are without force in assailing baptism. And they do not escape by saying that what rests upon God’s sure authority is established and fixed, even though there is no reason for it, but that such reverence is not due either infant baptism or other like things that are not commended to us by God’s express word; when once they are caught and held in this dilemma, they are held forever. God’s command concerning circumcision of infants was either lawful and not to be trifled with, or it was deserving of censure. If there was in it nothing incongruous or absurd, neither can anything absurd be found in the observance of infant baptism.</p></blockquote>

<blockquote><p>[The Reformed Churches] have generally recognized the baptism of other Churches, not excluding the Roman Catholics, and also of the various sects, except in the case of Churches and sects which denied the Trinity. Thus they refused to honour the baptism of the Socinians and of the Unitarians. In general, they considered a baptism as valid which was administered by a duly accredited minister and in the name of the triune God.</p></blockquote>

<blockquote><p>Infants of believing parents are likewise to be baptized. The grounds of their baptism are these. First, the commandment of God, “Baptize all nations” (Matt. 28:19), in which words the baptism of infants is prescribed. For the apostles by virtue of this commission baptized whole families (Acts 16:15, 31–33). Again, circumcision of infants was commanded by God (Gen. 17:14), and baptism in the New Testament succeeds in the room of circumcision (Col. 2:11–12); therefore baptism of infants is likewise commanded. The second ground is this. Infants of believing parents are in the covenant of grace. For this is the tenor of the covenant: “I will be thy God, and the God of thy seed” (Gen. 17:7). It may be said that this promise was made in this sort only to Abraham, because he was to be the father of the faithful. Answer. It pertains to all believing parents. God promises “to show mercy to thousands of them that love Him” (Ex. 20). Peter says to the Jews that heard him preach, “The promises belong to you, and to your children” (Acts 2:39). Paul says, “If the parents believe, the children are holy” (1 Cor. 7:14). If holy, then are they in the covenant. Now they are holy because we are in the judgment of Christian charity to esteem them all as regenerate and sanctified, secret judgments (in the mean season) left to God. Now then because infants are in the covenant, they are to be baptized. For this is the reason of St. Peter. To whom the promises belong, to them belongs baptism. But to you and your children belong the promises. Therefore you and your children are to be baptized (Acts 2:38–39).</p></blockquote>

the+promises.+Therefore+you+and+your+children+are+to+be+baptized+%28Acts+2%3A38%E2%80%9339%29.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+The+Works+of+William+Perkins%3A+vol.+2%3A+Commentary+on+Galatians%2C+ed.+Paul+M.+Smalley%2C+Joel+R.+Beeke%2C+and+Derek+W.+H.+Thomas%2C+vol.+2+%28Grand+Rapids%2C+MI%3A+Reformation+Heritage+Books%2C+2015%29%2C+230%E2%80%9331.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2cb6f80744.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2cb6f80744.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/05/perkins-defense-of-infant-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-05c1da16f9" data-kw="">
<blockquote><p>In Baptism, the external minister baptizes with an external element, that is water, which is received bodily. The internal minister, the Holy Spirit, baptizes with the blood of the spotless Lamb, so that he that is baptized is endowed with the whole Christ, true God and true man (Gal. 3:27); thus it is not necessary to receive Christ by the organs of the body, in order that our souls be washed by his blood; but the secret and most potent operation of the Holy Spirit suffices.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-8c57d32764" data-kw="">
<blockquote><p>The third point is, how baptism confers grace? Answer. It confers grace because it is a means to give and exhibit to the believing mind Christ with His benefits, and this it does by His signification. For it serves as a particular and infallible certificate to assure the party baptized of the forgiveness of his sins and of His eternal salvation. And whereas the minister in the name of God applies the promise of mercy to him that is baptized, it is indeed as much as if God should have made a particular promise to him. In this regard, baptism may well be said to confer grace, as the king’s letters are said to save the life of the malefactor when they do but signify to him and others that the king’s pleasure is to show favor. Again, baptism may be said to confer grace because the outward washing of the body is a token or pledge of the grace of God. And by this pledge faith is confirmed, which is an instrument to apprehend or receive the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 224–25.</span></figcaption>

</figure><figure class="quote" id="q-2395b2fe0c" data-kw="">
<blockquote><p>God’s approbation sends sure premonitory tokens before it; every “petition”4 may both deceive and be deceived. And so, according to the circumstances and disposition, and even age, of each individual, the delay of baptism is preferable; principally, however, in the case of little children [parvulos]. For why is it necessary—if (baptism itself) is not so necessary5—that the sponsors likewise should be thrust into danger? Who both themselves, by reason of mortality, may fail to fulfil their promises, and may be disappointed by the development of an evil disposition, in those for whom they stood? The Lord does indeed say, “Forbid them not to come unto me.”6 Let them “come,” then, while they are growing up; let them “come” while they are learning, while they are learning whither to come;7 let them become Christians8 when they have become able to know Christ. Why does the innocent period of life [innocens aetas] hasten to the “remission of sins?” More caution will be exercised in worldly9 matters: so that one who is not trusted with earthly substance is trusted with divine! Let them know how to “ask” for salvation, that you may seem (at least) to have given “to him that asketh.</p></blockquote>

e-Nicene+Fathers+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+1885%29%2C+678.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2395b2fe0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2395b2fe0c.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/03/tertullian-acknowledged-the-existence-of-infant-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-98e749d745" data-kw="">
<blockquote><p>Naturally, therefore, this sign and seal belongs only to those who are the Lord’s. Or, to put it rather in the positive form, this sign and seal belongs to all those who are the Lord’s. There are no distinctions of race or station, sex or age; there is but one prerequisite—that we are the Lord’s. What it means is just this and nothing else: that we are the Lord’s. What it pledges is just this and nothing else: that the Lord will keep us as his own. We need not raise the question, then, whether infants are to be baptized. Of course they are, if infants, too, may be the Lord’s. Naturally, as with adults, it is only the infants who are the Lord’s who are to be baptized; but equally naturally as with adults, all infants that are the Lord’s are to be baptized. Being the Lord’s they have a right to the sign that they are the Lord’s and to the pledge of the Lord’s holy keeping. Circumcision, which held the place in the old covenant that baptism holds in the new, was to be given to all infants born within the covenant. Baptism must follow the same rule. This and this only can determine its conference: Is the recipient a child of the covenant, with a right therefore to the sign and seal of the covenant? We cannot withhold the sign and seal of the covenant from those who are of the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1920 | (HT: Kim Riddlebarger)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>III. The question is not whether all infants are to be baptized or not; for, according to the will of God, some are not to be baptized, even such whose parents are strangers from the covenant. But hence it will follow that some are to be baptized, seeing an exception confirms both rule and right.

IV. The question is only concerning the children or infant seed of professing believers who are themselves baptized. And,— First, They by whom this is denied can produce no testimony of Scripture wherein their negation is formally or in terms included, nor any one asserting what is inconsistent with the affirmative; for it is weak beneath consideration to suppose that the requiring of the baptism of believers is inconsistent with that of their seed. But this is to be required of them who oppose infant baptism, that they produce such a testimony. Secondly, No instance can be given from the Old or New Testament since the days of Abraham, none from the approved practice of the primitive church, of any person or persons born of professing, believing parents, who were themselves made partakers of the initial seal of the covenant, being then infancy and designed to be brought up in the knowledge of God, who were not made partakers with them of the same sign and seal of the covenant. Thirdly, A spiritual privilege once granted by God unto any cannot be changed, disannulled, or abrogated, without an especial divine revocation of it, or the substitution of a greater privilege and mercy in the room of it; for,— 1. Who shall disannul what God hath granted? What he hath put together who shall put asunder? To abolish or take away any grant of privilege made by him to the church, without his own express revocation of it, is to deny his sovereign authority.

      2. To say a privilege so granted may be revoked, even by God himself, without the substitution of a greater privilege and mercy in the room of it, is contrary to the goodness of God, his love and care unto his church, [and] contrary to his constant course of proceeding with it from the foundation of the world, wherein he went on in the enlargement and increase of its privileges until the coming of Christ. And to suppose it under the gospel is contrary to all his promises, the honour of Christ, and a multitude of express testimonies of Scripture. Thus was it with the privileges of the temple and the worship of it granted to the Jews; they were not, they could not be, taken away without an express revocation, and the substitution of a more glorious spiritual temple and worship in their room. But now the spiritual privilege of a right unto and a participation of the initial seal of the covenant was granted by God unto the infant seed of Abraham, Gen. 17:10, 12. This grant, therefore, must stand firm for ever, unless men can prove or produce,— 1. An express revocation of it by God himself; which none can do either directly or indirectly, in terms or any pretence of consequence.

      2. An instance of a greater privilege or mercy granted unto them in the room of it; which they do not once pretend unto, but leave the seed of believers, whilst in their infant state, in the same condition with those of pagans and infidels; expressly contrary to God’s covenant. All this contest, therefore, is to deprive the children of believers of a privilege once granted to them by God, never revoked, as to the substance of it, assigning nothing in its room; which is contrary to the goodness, love, and covenant of God, especially derogatory to the honour of Jesus Christ and the gospel. Fourthly, They that have the thing signified have right unto the sign of it, or those who are partakers of the grace of baptism have a right to the administration of it: so Acts 10:47. But the children of believers are all of them capable of the grace signified in baptism, and some of them are certainly partakers of it, namely, such as die in their infancy (which is all that can be said of professors): therefore they may and ought to be baptized. For,— 1. Infants are made for and are capable of eternal glory or misery, and must fall, dying infants, into one of these estates for ever.

      2. All infants are born in a state of sin, wherein they are spiritually dead and under the curse.

      3. Unless they are regenerated or born again, they must all perish inevitably, John 3:3. Their regeneration is the grace whereof baptism is a sign or token. Wherever this is, there baptism ought to be administered. Fifthly, God having appointed baptism as the sign and seal of regeneration, unto whom he denies it, he denies the grace signified by it. Why is it the will of God that unbelievers and impenitent sinners should not be baptized? It is because, not granting them the grace, he will not grant them the sign. If, therefore, God denies the sign unto the infant seed of believers, it must be because he denies them the grace of it; and then all the children of believing parents dying in their infancy must, without hope, be eternally damned. I do not say that all must be so who are not baptized, but all must be so whom God would have not baptized. But this is contrary to the goodness and law [love?] of God, the nature and promises of the covenant, the testimony of Christ reckoning them to the kingdom of God, the faith of godly parents, and the belief of the church in all ages. It follows hence unavoidably that infants who die in their infancy have the grace of regeneration, and consequently as good a right unto baptism as believers themselves. Sixthly, All children in their infancy are reckoned unto the covenant of their parents, by virtue of the law of their creation. For they are all made capable of eternal rewards and punishments, as hath been declared.</p></blockquote>

<blockquote><p>But since before baptism was instituted God’s people had circumcision instead, let us examine how these two signs differ from each other, and in what respects they are alike. From this will appear the anagogic relationship of the one to the other. When the Lord commands Abraham to observe circumcision, he previously states that he will be God to him and his descendants [Gen. 17:7, 10], adding that he possesses the abundance and sufficiency of all things [Gen. 17:1, 6, 8]. This he does in order that Abraham may regard His hand as the source of every good. The promise of eternal life is contained in these words as Christ interprets them, drawing an argument from them for the immortality and resurrection of believers. For Christ says, “He is not the God of the dead but of the living” [Luke 20:38; Matt. 22:32]. Paul also, therefore, when he shows to the Ephesians out of what destruction the Lord has delivered them, from the fact that they had not been admitted into the covenant of circumcision infers that they were without Christ, without God, without hope, strangers to the testaments of promise [Eph. 2:12]—all of which the covenant itself contained. But the first access to God, the first entry into immortal life, is the forgiveness of sins. Accordingly, this corresponds to the promise of baptism that we shall be cleansed. Afterward, the Lord covenants with Abraham that he should walk before him in uprightness and innocence of heart [Gen. 17:1]. This applies to mortification, or regeneration.1 And lest anyone be in doubt, Moses more clearly explains elsewhere, when exhorting the Israelite people to circumcise the foreskin of their heart for the Lord [Deut. 10:16], that circumcision is the sign of mortification; on this account Israel has been chosen as the people of God out of all the nations of the earth [Deut. 10:15]. As God, when he adopts the posterity of Abraham as his people, commands them to be circumcised, so Moses declares that they ought to be circumcised in heart, explaining the true meaning of this carnal circumcision [Deut. 30:6]. Again, that no man should strive after it by his own strength, Moses teaches that it is a work of God’s grace. All these things are so often reiterated by the prophets that there is no need to heap up here the many texts, as they occur repeatedly [Jer. 4:4; Ezek. 16:30]. We have, therefore, a spiritual promise given to the patriarchs in circumcision such as is given us in baptism, since it represented for them forgiveness of sins and mortification of flesh. Moreover, as we have taught that Christ is the foundation of baptism, in whom both of these reside, so it is also evident that he is the foundation of circumcision. For he is promised to Abraham, and in him the blessing of all nations [Gen. 12:2–3]. To seal this grace, the sign of circumcision is added.</p></blockquote>

— John Calvin, Institutes of the Christian Religion, (Battles edition), 4.16.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+since+before+baptism+was+instituted+God%E2%80%99s+people+had+circumcision+instead%2C+let+us+examine+how+these+two+signs+differ+from+each+other%2C+and+in+what+respects+they+are+alike.+From+this+will+appear+the+anagogic+relationship+of+the+one+to+the+other.+When+the+Lord+commands+Abraham+to+observe+circumcision%2C+he+previously+states+that+he+will+be+God+to+him+and+his+descendants+%5BGen.+17%3A7%2C+10%5D%2C+adding+that+he+possesses+the+abundance+and+sufficiency+of+all+things+%5BGen.+17%3A1%2C+6%2C+8%5D.+This+he+does+in+order+that+Abraham+may+regard+His+hand+as+the+source+of+every+good.+The+promise+of+eternal+life+is+contained+in+these+words+as+Christ+interprets+them%2C+drawing+an+argument+from+them+for+the+immortality+and+resurrection+of+believers.+For+Christ+says%2C+%E2%80%9CHe+is+not+the+God+of+the+dead+but+of+the+living%E2%80%9D+%5BLuke+20%3A38%3B+Matt.+22%3A32%5D.+Paul+also%2C+therefore%2C+when+he+shows+to+the+Ephesians+out+of+what+destruction+the+Lord+has+delivered+them%2C+from+the+fact+that+they+had+not+been+admitted+into+the+covenant+of+circumcision+infers+that+they+were+without+Christ%2C+without+God%2C+without+hope%2C+strangers+to+the+testaments+of+promise+%5BEph.+2%3A12%5D%E2%80%94all+of+which+the+covenant+itself+contained.+But+the+first+access+to+God%2C+the+first+entry+into+immortal+life%2C+is+the+forgiveness+of+sins.+Accordingly%2C+this+corresponds+to+the+promise+of+baptism+that+we+shall+be+cleansed.+Afterward%2C+the+Lord+covenants+with+Abraham+that+he+should+walk+before+him+in+uprightness+and+innocence+of+heart+%5BGen.+17%3A1%5D.+This+applies+to+mortification%2C+or+regeneration.1+And+lest+anyone+be+in+doubt%2C+Moses+more+clearly+explains+elsewhere%2C+when+exhorting+the+Israelite+people+to+circumcise+the+foreskin+of+their+heart+for+the+Lord+%5BDeut.+10%3A16%5D%2C+that+circumcision+is+the+sign+of+mortification%3B+on+this+account+Israel+has+been+chosen+as+the+people+of+God+out+of+all+the+nations+of+the+earth+%5BDeut.+10%3A15%5D.+As+God%2C+when+he+adopts+the+posterity+of+Abraham+as+his+people%2C+commands+them+to+be+circumcised%2C+so+Moses+declares+that+they+ought+to+be+circumcised+in+heart%2C+explaining+the+true+meaning+of+this+carnal+circumcision+%5BDeut.+30%3A6%5D.+Again%2C+that+no+man+should+strive+after+it+by+his+own+strength%2C+Moses+teaches+that+it+is+a+work+of+God%E2%80%99s+grace.+All+these+things+are+so+often+reiterated+by+the+prophets+that+there+is+no+need+to+heap+up+here+the+many+texts%2C+as+they+occur+repeatedly+%5BJer.+4%3A4%3B+Ezek.+16%3A30%5D.+We+have%2C+therefore%2C+a+spiritual+promise+given+to+the+patriarchs+in+circumcision+such+as+is+given+us+in+baptism%2C+since+it+represented+for+them+forgiveness+of+sins+and+mortification+of+flesh.+Moreover%2C+as+we+have+taught+that+Christ+is+the+foundation+of+baptism%2C+in+whom+both+of+these+reside%2C+so+it+is+also+evident+that+he+is+the+foundation+of+circumcision.+For+he+is+promised+to+Abraham%2C+and+in+him+the+blessing+of+all+nations+%5BGen.+12%3A2%E2%80%933%5D.+To+seal+this+grace%2C+the+sign+of+circumcision+is+added.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+%28Battles+edition%29%2C+4.16.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb066cda5ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b066cda5ea.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/calvin-circumcision-was-spiritual-and-substantially-identical-to-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>2. But in respect of the case of the infants, which you say ought not to be baptized within the second or third day after their birth, and that the law of ancient circumcision should be regarded, so that you think that one who is just born should not be baptized and sanctified within the eighth day, we all thought very differently in our council. For in this course which you thought was to be taken, no one agreed; but we all rather judge that the mercy and grace of God is not to be refused to any one born of man. For as the Lord says in His Gospel, “The Son of man is not come to destroy men’s lives, but to save them,” as far as we can, we must strive that, if possible, no soul be lost. For what is wanting to him who has once been formed in the womb by the hand of God? To us, indeed, and to our eyes, according to the worldly course of days, they who are born appear to receive an increase. But whatever things are made by God, are completed by the majesty and work of God their Maker.</p></blockquote>

<blockquote><p>And this is the firm tradition of the universal Church, in respect of the baptism of infants, who certainly are as yet unable “with the heart to believe unto righteousness, and with the mouth to make confession unto salvation,” as the thief could do; nay, who even, by crying and moaning when the mystery is performed upon them, raise their voices in opposition to the mysterious words, and yet no Christian will say that they are baptized to no purpose. 32. And if any one seek for divine authority in this matter, though what is held by the whole Church, and that not as instituted by Councils, but as a matter of invariable custom, is rightly held to have been handed down by apostolical authority, still we can form a true conjecture of the value of the sacrament of baptism in the case of infants, from the parallel of circumcision, which was received by God’s earlier people, and before receiving which Abraham was justified, as Cornelius also was enriched with the gift of the Holy Spirit before he was baptized.</p></blockquote>

<blockquote><p>[responding to Art. 1 of the Schleitheim Confession]…But I reply, first of all, that infant baptism is not a recent introduction, nor are its origins traceable to the papal church. For I say that it has always been a holy ordinance observed in the Christian church. There is no doctor, however ancient, who does not attest that it has always been observed since the time of the apostles. I wanted to touch on this point in passing for the sole reason of informing the simple that it is an impudent slander for these fanatics [the Anabaptists] to make others believe that this ancient practice is a recently forged superstition and to feign that it derives from the pope. For the whole ancient church held to infant baptism long before one ever knew about the papacy or had ever heard of the pope. Besides, I do not ask antiquity to legitimate anything for us unless it is founded on the Word of God. I know that it is not human custom that gives authority to the sacrament, nor does its efficacy depend on how men regulate it. Let us come, therefore, to the true rule of God, of which we have spoken, that is to say, his Word, which alone ought to hold here. Their view is that one ought to administer baptism only to those who request it, to those who have made a profession of faith and repented. And thus infant baptism is the invention of man, opposed to the word of God. In order to prove this they cite the passage from Saint Matthew’s last chapter, where Jesus Christ says to his apostles,”Go and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit.” To which they add this sentence from the 16th chapter of Mark: “Whoever believes and is baptized will be saved.” That to them seems an invincible foundation. … We see that our Lord acted the same way toward Abraham with regard to circumcision. For before he conferred this sign on him he received him into his covenant and instructed him in his Word. But we must now note that when a man is received of God into the fellowship of the faithful, the promise of salvation which is given to him is not for him alone but also for his children. For it is said to him: “I am thy God, and the God of thy children after thee.” Therefore the man who has not been received into the covenant of God from his childhood is as a stranger to the church until such time as he is led into faith and repentance by the doctrine of salvation. But at the same time his posterity is also made a part of the family of the church. And for this reason infants of believers are baptized by virtue of this covenant, made with their fathers in their name and to their benefit. Herein, thus, lies the mistake of the poor Anabaptists. For since this doctrine must precede the sacrament, we do not resist it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Instruction for Arming All the Good Faithful Against the Errors of the Common Sect of the Anabaptists in John Calvin</cite>, trans., Benjamin Wirt Farley (Grand Rapids: Baker, 1982), 44–47.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

rom+the+16th+chapter+of+Mark%3A+%E2%80%9CWhoever+believes+and+is+baptized+will+be+saved.%E2%80%9D+That+to+them+seems+an+invincible+foundation.+%E2%80%A6+We+see+that+our+Lord+acted+the+same+way+toward+Abraham+with+regard+to+circumcision.+For+before+he+conferred+this+sign+on+him+he+received+him+into+his+covenant+and+instructed+him+in+his+Word.+But+we+must+now+note+that+when+a+man+is+received+of+God+into+the+fellowship+of+the+faithful%2C+the+promise+of+salvation+which+is+given+to+him+is+not+for+him+alone+but+also+for+his+children.+For+it+is+said+to+him%3A+%E2%80%9CI+am+thy+God%2C+and+the+God+of+thy+children+after+thee.%E2%80%9D+Therefore+the+man+who+has+not+been+received+into+the+covenant+of+God+from+his+childhood+is+as+a+stranger+to+the+church+until+such+time+as+he+is+led+into+faith+and+repentance+by+the+doctrine+of+salvation.+But+at+the+same+time+his+posterity+is+also+made+a+part+of+the+family+of+the+church.+And+for+this+reason+infants+of+believers+are+baptized+by+virtue+of+this+covenant%2C+made+with+their+fathers+in+their+name+and+to+their+benefit.+Herein%2C+thus%2C+lies+the+mistake+of+the+poor+Anabaptists.+For+since+this+doctrine+must+precede+the+sacrament%2C+we+do+not+resist+it.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Brief+Instruction+for+Arming+All+the+Good+Faithful+Against+the+Errors+of+the+Common+Sect+of+the+Anabaptists+in+John+Calvin%2C+trans.%2C+Benjamin+Wirt+Farley+%28Grand+Rapids%3A+Baker%2C+1982%29%2C+44%E2%80%9347.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F98803b87ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/98803b87ac.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/04/calvin-addressed-the-same-objections-to-infant-baptism-that-we-hear-today/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-fea8c552e5" data-kw="">
<blockquote><p>But if your meaning be, (as I strongly suspect it is) that we must not expect to be owned by Christ, except we give up infants baptism; then, I say, it is the most uncharitable, as well as unwarrantable, and dangerous censure that ever dropt from the pen of a sober Christian. It is certainly your great evil to lay salvation itself on such a point as the proper subject of baptism, and to make it articulus stantis vel cadentis religionis [the article of the standing or falling of the church], the very basis on which the whole Christian religion, audits professors salvation must stand. I hope the rest of your brethren are more charitable than yourself; but however it be, I do openly profess, that I ever have, and still do own you, and many more of your persuasion, for my brethren in Christ, and am persuaded Christ will own you too, notwithstanding your many errors and mistakes about the lesser and lower matters of religion. Nor need your censure much to affect us, as long as we are satisfied you have neither a faculty nor commission thus solemnly to pronounce it upon us. But what is the condition upon which this dreadful sentence depends? why, it is our attendance or non-attendance to the primitive purity of the gospel-doctrine. Sir, I hope we do attend it, and, in some respects, better than some great pretenders to primitive purity, who have cast off not only the initiating sign of God’s covenant, (this did not Abraham) but also that most comfortable and ancient ordinance of singing Psalms: and what other primitive ordinance of God may be cashiered next, who can tell? We have a witness in our bosom, that the defence of Christ’s pure worship and institution hath cost us something; and as for me, were I convinced by all that you have here said, or any of your friends, that in baptizing the infants of believers, we did really depart from the primitive purity, I would renounce it, and turn Anabaptist the same day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Reverend John Flavel</cite>, vol. 6 (London; Edinburgh; Dublin: W. Baynes and Son; Waugh and Innes; M. Keene, 1820), 328.</span></figcaption>

</figure><figure class="quote" id="q-093986bd25" data-kw="">
<blockquote><p>I do not, however, concede to [Rome] that Paedobaptism had its origin the Tradition of the Church. It certainly appears to be founded on the institution of God, and to have derived its origin from circumcision. It would have little foundation if it depended only on the will of man. Accordingly, we must hold it as an universal rule, that no Sacrament is legitimate, unless it be of God and not of men. But to return to the present subject; not only the Blessing of the Pascal taper, the Exorcism of Water, and similar follies, which are of endless number, but the ritual of the Mass, and all the impious worship of this description, they make perfectly pure by a simple process, by merely giving them the name of Traditions, so that everything to which time has given a kind of prescriptive right is, as it were, placed beyond controversy, and holds up its head among the commandments of God. Will no man oppose this? Nay, rather a thousand times incur the obloquy of disturbing the peace, than by perfidious dissimulation betray the essential truth which is here endangered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, On The Truth Method of Giving Peace to Christendom in Tracts Relating to the Reformation, vol. 3, trans. Henry Beveridge (Edinburgh: Calvin Translation Society, 1851), 269.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

aptism-sola-scriptura/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>XXVI. What is said by some (“Infants are baptized in the faith of their parents”) does not mean that what is in adults is imputed to infants or answers for infants; both because each one lives by his own faith and because if the parents should be hypocrites, their infants would be excluded from salvation. But the faith of parents bears this relation—that they bring their children to be baptized from the faith by which they believe that the gospel promises belong to them and to their children; again, that by it they obtain the grace of God for their children (?Mk. 7:19).</p></blockquote>

<blockquote><p>XXI. Baptism (with respect to true believers) seals saving grace because it is connected with the internal baptism of the Spirit. But with respect to hypocrites, it does not have the accompanying grace of the Spirit, but is only a badge of profession by which they are distinguished from Jews, Turks and other unbelievers. And then it is administered, not from the force of election, but by reason of the general dispensation by which God determined by the word of the gospel and the administration of the sacraments to gather to himself a church, and by certain signs and marks to distinguish it from other and profane assemblies. Thus the doctrine of perseverance is not at all endangered here, which remains constant with respect to the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.21 (p. 420).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXI. Baptism (with respect to true believers) seals saving grace because it is connected with the internal baptism of the Spirit. But with respect to hypocrites, it does not have the accompanying grace of the Spirit, but is only a badge of profession by which they are distinguished from Jews, Turks and other unbelievers. And then it is administered, not from the force of election, but by reason of the general dispensation by which God determined by the word of the gospel and the administration of the sacraments to gather to himself a church, and by certain signs and marks to distinguish it from other and profane assemblies. Thus the doctrine of perseverance is not at all endangered here, which remains constant with respect to the elect.”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.21 (p. 420).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXI.+Baptism+%28with+respect+to+true+believers%29+seals+saving+grace+because+it+is+connected+with+the+internal+baptism+of+the+Spirit.+But+with+respect+to+hypocrites%2C+it+does+not+have+the+accompanying+grace+of+the+Spirit%2C+but+is+only+a+badge+of+profession+by+which+they+are+distinguished+from+Jews%2C+Turks+and+other+unbelievers.+And+then+it+is+administered%2C+not+from+the+force+of+election%2C+but+by+reason+of+the+general+dispensation+by+which+God+determined+by+the+word+of+the+gospel+and+the+administration+of+the+sacraments+to+gather+to+himself+a+church%2C+and+by+certain+signs+and+marks+to+distinguish+it+from+other+and+profane+assemblies.+Thus+the+doctrine+of+perseverance+is+not+at+all+endangered+here%2C+which+remains+constant+with+respect+to+the+elect.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+19.20.21+%28p.+420%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ddaa83444.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ddaa83444.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/12/turretin-answers-objections-to-infant-baptism-8/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>XVIII. The cause of infant baptism is not the actual faith of infants, of which they are no more capable than of that instruction by which the disciples of Christ are taught (Mt. 28:19). But it is both the universal command to baptize all the members of the church and the promise of the covenant made to parents and to their children equally (Acts 2:38, 39; Gen. 17*:7). The same thing must be said of the faith of covenanted infants as of their reason. Each is in them in the first act, not in the second; in the sowing, not in the harvest; in the root, not in the fruit; in the internal power of the Spirit, not in the external demonstration of work.</p></blockquote>

</figure><figure class="quote" id="q-41222c9eb2" data-kw="">
<blockquote><p>XII. There was no need that a particular precept concerning the baptism of infants should be given because it was known to the disciples that infants were circumcised. It therefore sufficed that there was a general command to baptize all nations, under which the particular is contained.

XIII. The baptism of Christ (performed when he was in his thirtieth year) cannot overthrow infant baptism. All the acts of Christ (which do not pertain to doctrine) are not forthwith to be imitated; otherwise baptism would have to be received only in the thirtieth year (which however our opponents do not say). There was a peculiar reason for his waiting until that time; not only because only in the preceding year was the baptism of John instituted, but also on account of the type of the Levitical priests (who although received in their twenty-fifth year into the priestly college, before their thirtieth year were not admitted to the exercise of their office). Christ (not needing baptism) could safely put it off. But our case is different, we being conceived and born in sin.

XIV. John admitted no one to baptism unless he confessed his sins because he was dealing with the baptism of adults and those called to the Christian church. But it does not follow that the same should be done with infants who are already in the church.

XV. A sign whose virtue depends on the disposition of the receiving subject differs from one whose virtue depends on the promise of the institutor. The former sign is to no purpose applied to one not understanding it; but it is not so with the latter (such as baptism and circumcision). Again, a subject receptive of the sign differs from one perceptive of it also; infants can be the former, although not the latter. Third, a sign is useless applied to one not understanding, or about to understand (which cannot be said of an infant). XVI. Baptism is called the sacrament of repentance; not because it requires that beforehand in everyone to be baptized, but because it binds the baptized to the desire of it, whether in the present (when they are capable of it) or in the future. XVII. Sacraments without faith in the user are said to be empty ceremonies with regard to adults; not with regard to infants, in whom (for a salutary use of baptism) the promise is sufficient and the grace of the covenant (which is sealed on the part of God), even though as yet there is not an answer and restipulation on the part of the baptized (as is evident in circumcision, Gen. 17:7).</p></blockquote>

<blockquote><p>XI. (7) Because the fathers acknowledged the necessity of infant baptism and approved its propriety by their practice. Justin Martyr mentions it (“Quaestiones et Responsiones ad Orthodoxos,” Q. 56 in Opera quae feruntur omnia [ed. J.C.T. de Otto, 1881], v. 3, Pt. 2, p. 81); cf. Origen (Commentariorum in Epistolam … ad Romanos 5.8 [PG 14.1037–42]), Cyprian (Letter 58, “To Fidus” [ANF 5:353–54]), Jerome (Against the Pelagians 3.18 [NPNF2, 6:482]), Cyril of Alexandria (Glaphyrorum in Leviticum [PG 69.558–62]). Augustine, often, where he relates that the Pelagians had not dared to deny the baptism of infants because they saw too clearly that this would place them in opposition to the whole church (The Literal Meaning of Genesis 10.23 [ACW 42:127]; On Original Sin 2.44 [40] [NPNF1, 5:253–54]; On Forgiveness of Sins and Baptism 1.35 [25*] [NPNF1, 5:30]). The same thing was confirmed also by many decrees of Synods: of Carthage, in the year 418* (Hefele, 2:458); of Mileve, in the year 402* (cf. Canon 5, Hefele, 2:429); of Gerunda in the year 517* (cf. Canon 5, Hefele, 4:105) and of others which Pamelius in his notes to Cyprian notices (“Epistola LXIV,” Opera [1682], pp. 158–60).</p></blockquote>

<blockquote><p>IX. (5) Because the children of believers are holy; therefore they ought to be baptized. For since they have the thing signified, they cannot and ought not to be deprived of the sign (Acts 10:47). “The unbelieving wife,” says the apostle, “is sanctified by the husband: else were your children unclean; but now are they holy” (1 Cor. 7:14). They are called holy, however, not because they are legitimate (as some suppose), because he was not speaking of that and nothing would thus be ascribed to them above the children of unbelievers, who can also be legitimate. But they are said to be holy by a federal holiness (i.e., Christians and belonging to the church). Therefore ἀκάθαρτον and ἅγιον here designate heathen and Christian (in which sense the word קדושה is often used by the Talmudists). “Offspring” is said to be “begotten in holiness” or “out of holiness” (i.e., when the parents were made proselytes or while they were still heathen). The children (τέκνα) of the Gentiles were unclean (ἀκίθαρτα) to them (from Acts 10:28) and of the Jews holy (ἅγιά), to which meaning (well known to the nation) allusion is made.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IX. (5) Because the children of believers are holy; therefore they ought to be baptized. For since they have the thing signified, they cannot and ought not to be deprived of the sign (Acts 10:47). “The unbelieving wife,” says the apostle, “is sanctified by the husband: else were your children unclean; but now are they holy” (1 Cor. 7:14). They are called holy, however, not because they are legitimate (as some suppose), because he was not speaking of that and nothing would thus be ascribed to them above the children of unbelievers, who can also be legitimate. But they are said to be holy by a federal holiness (i.e., Christians and belonging to the church). Therefore ἀκάθαρτον and ἅγιον here designate heathen and Christian (in which sense the word קדושה is often used by the Talmudists). “Offspring” is said to be “begotten in holiness” or “out of holiness” (i.e., when the parents were made proselytes or while they were still heathen). The children (τέκνα) of the Gentiles were unclean (ἀκίθαρτα) to them (from Acts 10:28) and of the Jews holy (ἅγιά), to which meaning (well known to the nation) allusion is made.”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P &amp; R Publishing, 1992–1997), 19.20.9 (p. 417–18). [modified according to the 1688 Latin text by the substitution of Greek and Hebrew words for the transliteration in the Dennison edit">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+%285%29+Because+the+children+of+believers+are+holy%3B+therefore+they+ought+to+be+baptized.+For+since+they+have+the+thing+signified%2C+they+cannot+and+ought+not+to+be+deprived+of+the+sign+%28Acts+10%3A47%29.+%E2%80%9CThe+unbelieving+wife%2C%E2%80%9D+says+the+apostle%2C+%E2%80%9Cis+sanctified+by+the+husband%3A+else+were+your+children+unclean%3B+but+now+are+they+holy%E2%80%9D+%281+Cor.+7%3A14%29.+They+are+called+holy%2C+however%2C+not+because+they+are+legitimate+%28as+some+suppose%29%2C+because+he+was+not+speaking+of+that+and+nothing+would+thus+be+ascribed+to+them+above+the+children+of+unbelievers%2C+who+can+also+be+legitimate.+But+they+are+said+to+be+holy+by+a+federal+holiness+%28i.e.%2C+Christians+and+belonging+to+the+church%29.+Therefore+%E1%BC%80%CE%BA%E1%BD%B1%CE%B8%CE%B1%CF%81%CF%84%CE%BF%CE%BD+and+%E1%BC%85%CE%B3%CE%B9%CE%BF%CE%BD+here+designate+heathen+and+Christian+%28in+which+sense+the+word+%D7%A7%D7%93%D7%95%D7%A9%D7%94+is+often+used+by+the+Talmudists%29.+%E2%80%9COffspring%E2%80%9D+is+said+to+be+%E2%80%9Cbegotten+in+holiness%E2%80%9D+or+%E2%80%9Cout+of+holiness%E2%80%9D+%28i.e.%2C+when+the+parents+were+made+proselytes+or+while+they+were+still+heathen%29.+The+children+%28%CF%84%E1%BD%B3%CE%BA%CE%BD%CE%B1%29+of+the+Gentiles+were+unclean+%28%E1%BC%80%CE%BA%E1%BD%B7%CE%B8%CE%B1%CF%81%CF%84%CE%B1%29+to+them+%28from+Acts+10%3A28%29+and+of+the+Jews+holy+%28%E1%BC%85%CE%B3%CE%B9%E1%BD%B1%29%2C+to+which+meaning+%28well+known+to+the+nation%29+allusion+is+made.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P+%26+R+Publishing%2C+1992%E2%80%931997%29%2C+19.20.9+%28p.+417%E2%80%9318%29.+%5Bmodified+according+to+the+1688+Latin+text+by+the+substitution+of+Greek+and+Hebrew+words+for+the+transliteration+in+the+Dennison+edit&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58300845ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58300845ed.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/11/turretin-answers-objections-to-infant-baptism-4/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>VII. (3) By parity, the necessity of baptism is the same as that of circumcision. Now circumcision was to be administered to infants according to the command of God. Therefore also infant baptism. The truth of the major is proved (a) because baptism is put in the place of circumcision and succeeds it in the New Testament (from Col. 2:12, where Paul discovers circumcision in baptism). (b) From the end of each—circumcision was a sacrament of initiation that they might be received into the covenant; baptism is the same. (c) From the thing signified by each, which is the internal circumcision of the heart and the grace of regeneration. (d) The grace of God is not diminished and restricted in the New Testament, but rather enlarged. If therefore the infantile age is an obstacle in baptism on account of the defect of reason, there was the same impediment in circumcision. For if the blessings of God were not even then fruitlessly offered by circumcision, why should the same not be thought of baptism? Nor is it to be said either that “the circumcision of infants was expressly commanded, but not infant baptism.” It is one thing to be contained expressly; another implicitly in a general command (as we said before). Or that “the argument does not proceed rightly because there are various differences between circumcision and baptism.” The analogy of both sacraments ought to be attended to not in all, but in the principal condition related to the confirmation of the gratuitous covenant and declared in the New Testament (to wit, that both sacraments were a sign of the covenant, a symbol of initiation and a badge of profession, by which anciently the Jews were distinguished from the Gentiles and now Christians are distinguished from unbelievers). The differences (usually adduced) are of another kind which do not touch the very essence of the sacrament and its end.</p></blockquote>

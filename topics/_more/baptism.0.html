</figure><figure class="quote" id="q-655a1793c9" data-kw="">
<blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’, pp. 720-1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’”

ctions+belong+to+the+external+rite%2C+to+wit%2C+to+eat+and+to+drink%2C+which+are+not+fit+for+little+children.+So+under+the+Old+Testament+circumcision+was+appointed+for+infants+but+the+Passover+to+them+only+which+by+reason+of+their+age+were+able+to+ask+of+the+signification+thereof.+Hereupon+came+those+vulgar+verses%3A+%E2%80%98Ebrius%2C+infamis%2C+erroneus%2C+atque+furentes%2C+Cum+pueris%2C+Domini+non+debent+sumere+corpus.%E2%80%99+%E2%80%98To+drunkards+and+thin-famous+sort%2C+to+men+misled+and+mad%3A+To+children%2C+Christ%E2%80%99s+body+to+give%2C+it+were+an+action+bad.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+Framed+out+of+God%E2%80%99s+Word%2C+%26+the+Writings+of+the+Best+Divines%2C+trans.+Robert+Hill+%28London%2C+1606%29%2C+Locus+47%2C+%E2%80%98Who+are+to+be+Baptized%3F%E2%80%99%2C+pp.+720-1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F655a1793c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/655a1793c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/paedocommunion/#:~:text=Then%2C%20because%20to%20whomsoever%20the%20promise,give%2C%20it%20were%20an%20action%20bad&amp;text=Then%2C%20because%20to%20whomsoever%20the%20promise%20appertains%2C%20to&amp;text=body%20to%20give%2C%20it%20were%20an%20action%20bad" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</span></figcaption>

</figure><figure class="quote" id="q-3f9f3b0b84" data-kw="">
<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (Edinburgh, 1770), bk. 2, Title 4, ‘Of the Lord’s Supper’, section 2, p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>Baptism saves, therefore, no salvation without baptism, so do Anabaptists reason, as says [John] Gerhardus (Common Places, tome 6, Of the Ecclesiastical Ministry, n. 64, p. 71)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, p. 31</span></figcaption>

</figure><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London, 1645), pp. 25 &amp; 27</span></figcaption>

<blockquote><p>First, their ecclesiasticall errors, such as peculiarly concern the doctrine or discipline of the Church are: First, that Christ took not flesh from the Virgin Mary, but that he passed through her as the sun beams do through glass, or rain through a spout. Secondly, that there is no original sin. Thirdly, that children ought not to be baptized. Fourthly, that such as have been baptized in their infancy ought to be re-baptized when they come to years of discretion. Fifthly, that lay-people may preach and administer the sacraments… Sixthly, that men have free will, not only in natural and moral, but also in spiritual actions. Seventhly, that absolution and the church-peace ought to be denied to such who are fallen into any grievous sin; yea, though they repent of it. Eighthly, that Luther’s doctrine is worse than the Pope’s. Secondly, their politicall errors, or in matter of state, are: First, that the people may depose their magistrates and chief rulers… Secondly, that a Christian with a good conscience may not take upon him, or bear the office of a magistrate, or keep any court of justice. Thirdly, that none may administer an oath to another. Fourthly, that no malefactors ought to be put to death. Thirdly, their economical errors [about the family] are: First, that no man has a propriety in his goods, but that all things ought to be held in common. Secondly, that it is lawful to have more wives than one at once. Thirdly, that a man may put away his wife if she differ from him in point of religion, and be not of their sect. … All the errors of the Anabaptists are of two sorts: First, such as they hold in common with other heretics. Secondly, such as are peculiar to their sect. First, concerning the common errors [not mentioned above]… First, with the Millenaries and their joint issue is, that Christ before the day of judgement shall come down from Heaven, and reign with the saints upon earth a thousand years; in which time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…</p></blockquote>

<blockquote><p>Conclusion I: None have a right to baptism before the Lord, but those who have actually a saving interest in the Lord Jesus Christ… Conclusion II: Visible believers, and such as have a profession of religion, probably signifying their having a saving interest in Christ, have a right to baptism before the church, so that they may be admitted thereto, though indeed they have no saving grace, yea or never shall have it… Conclusion III: None but visible believers, or such as appear to have a saving interest in Christ, have right to baptism before the Church… Conclusion IV: All infants descended of parents whereof one only is a visible believer, has right to baptism before the church… Such are in covenant with God visibly; we are to look on them as probably within the covenant, as to the saving benefits thereof, so that none can forbid water.</p></blockquote>

</figure><figure class="quote" id="q-003d5b33a5" data-kw="">
<blockquote><p>According to God’s promise (Gen. 17:7; Acts 2:39), the children of believing parents are included in the covenant of grace and must be received as members of the church by baptism. This promise is precious, and the privileges it confers on our children are great indeed. But they afford us no ground to presume that our children are regenerate and no reason to treat them as such before they come to saving faith and repentance. We baptize infants based on many points, but not on account of ‘presumptive regeneration.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joel-beeke.html">Joel Beeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Praying for our Children’s Salvation’ 11 paragraphs</cite></span></figcaption>

</figure><figure class="quote" id="q-f553b78a87" data-kw="">
<blockquote><p>We seek the ninth argument from Galatians 3:27, “Whoever among you who has been baptized into Christ, has been clothed with Christ.” The meaning is that the church is necessary for Christ as to be covered with clothes, and under it to take refuge, that it may be absolutely holy and above reproach. Just as Jacob did not merit the right of first born by himself, hidden in the style of his brother, and wearing his clothes, which breathed the best odor, he made his way to his father, so that for his own advantage he might receive the blessing under a foreign person, so it is necessary that we take refuge under the precious purity of our firstborn brother Christ, that we may bring back the testimony of righteousness in the sight of God. In order that we may make ourselves ready in salvation before the face of God, it is necessary that we emit His sweet smell, and that our vices be covered up by and buried in His perfection. Christ is put on by us first and principally, because His satisfaction having been imputed to us, He covers us and adorns us as a garment in the sight of God. Then also Christ is put on by us, because we begin in this life to become conformed to Him. But here Paul speaks especially about imputation of righteousness and reconciliation through Christ, the testimony of which baptism alleges. Hence, we argue thus: whoever have put on Christ, to them that most perfect obedience of Christ, whereby He fulfilled the whole law, is imputed for righteousness. But we, as many as have been baptized into Christ, have put on Christ. Therefore, that most perfect obedience, whereby He fulfilled the whole Law, is imputed for righteousness to us, as many as have been baptized into Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Justification of Man the Sinner Before God</cite>, (1615) in Justification By Faith Alone: Selected Writings From Theodore Beza (1519–1605), Amandus Polanus (1561–1610), Francis Turretin (1623–1687), trans. Casey Carmichael, Volume 6: Classic Reformed Theology Theology (Reformation Heritage Books</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-5c0ff4ccae" data-kw="">
<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-05519a6851" data-kw="">
<blockquote><p>Secondly, You affirm with like confidence, That the covenant of circumcision is also the same; viz. the covenant of works made with Adam in paradise. This I utterly deny; and will try whether you have any better success in the proof your second, than you had in your first position. And to convince you of your mistake, let us consider what the general nature of this ordinance of circumcision was; what its ends were; and then prove, That it cannot be what you affirm it to be, the very same covenant God made with Adam before the fall, but must needs be a covenant of grace. (1.) Circumcision, in its general nature, was, (1.) An ordinance of God’s own institution, in the 99th year of Abraham’s age; at which time of its institution, God renewed the covenant with him, Gen. 17:9, 10. (2). That it consisted (as all sacraments do) of an external sign, and a spiritual mystery signified thereby. The external part of it (which we call the sign) was the cutting off the foreskin of the genital part of the Hebrew males, on the eighth day from their birth. The spiritual mystery thereby signified and represented, was the cutting off the filth and guilt of sin from their souls, by regeneration and justification, called “the circumcision of the heart,” Deut. 10:16. And though this was laid upon them by the command, as their duty, yet a gracious promise of power from God to perform that duty, was added to the command; Deut. 30:6. “The Lord thy God will circumcise thy heart to love him,” &amp;c. just as promises of grace in the New Testament are added to commands of duty. (3.) Betwixt this visible outward sign, and spiritual mystery, there was a sacramental relation; from which revelation it is called the “token of the covenant,” Gen. 17:12. “The sign and seal of the covenant,” Rom. 4:11. Yea, “the covenant itself,” Acts 7:8. (2.) Next, let us consider the ends for which circumcision was instituted and ordained of God: Of which these were the principal. (1.) It was instituted to be a convictive sign of their natural corruption, propagated by the way of natural generation: For which reason, this natural corruption goes in scripture under the name of the uncircumcision of the heart, Jer. 9:26. (2.) It also signified the putting off of this body of sin, in the virtue of Christ’s death, Col. 2:11. (3.) It was appointed to be the initiating sign of the covenant, or a token of their matriculation, and admission into the church and covenant of God, Gen. 17:9, 10, 11. (4.) It was ordained to be a discriminating mark betwixt God’s covenanted people, and the Pagan world, who were strangers to the covenant, and without God in the world. And accordingly both parties were, from this ordinance, denominated the circumcision and the uncircumcision, Col. 3:11. (5.) It was also an obliging sign to Abraham and his seed, to walk with God in the uprightness and sincerity of their hearts, in the performance of all covenanted duties; in which duties, Abraham, and the faithful, walked obediently, with God, looking to Christ for righteousness: but the carnal Jews resting in, and trusting to those duties and ordinances for righteousness and justification, made it a covenant of works to themselves, and circumcision itself a bond of that covenant. (6) Now, forasmuch as circumcision prefigured Christ, who was to come of this holy circumcised seed of Abraham, and his death also was pointed at therein, Heb. 2:16. Col. 2:11. of necessity this ordinance must vanish at the death of Christ: and accordingly did so. These things duly pondered, how irrational is it to imagine this covenant of circumcision to be the very same with the paradisical covenant? Did that covenant discover native corruption, and direct to its remedy in Christ, as this did? Surely it gave not the least glimpse of any such thing. Did that covenant separate and distinguish one person from another, as this did? No, no; it left all under equal and common misery, Eph. 2:3. Had Adam’s covenant a seal of the righteousness of faith annexed to it, as this had? Rom. 4:11. “He received circumcision, a seal of the righteousness of faith.” The righteousness of faith is evangelical righteousness; and this circumcision sealed. Say not it was to Abraham only that it sealed it; for it is an injurious restriction put upon the seal of a covenant, which extended to the fathers as well as to Abraham, Luke 1:72. But you admit, however, that it sealed evangelical righteousness to Abraham: but I hope you will not say, that a seal of the covenant of works ever did, or could, seal evangelical righteousness to any individual person in the world. So then, turn which way you will, this truth still follows you, and will fasten upon you, that the covenant of circumcision was not a pure covenant of works, but a gospel-covenant. Which I thus prove: Arguments Argument I If circumcision be a part of the cermonial law, and the ceremonial law was dedicated by blood, and whatsoever is so dedicated, is by you confessed to be ho part of the covenant of works; then circumcision is no part of the covenant of works, even by your own confession. But it is: ergo, That it is a part of the ceremonial law, was never doubted, or denied by any man: that it was dedicated by blood, and therefore no part of the moral law, you yourself not only acknowledge, but vehemently plead for it, page 148, where you blame Mr. Sedgwick with some sharpness, and unbecoming reflection, for making no distinction betwixt the ceremonial covenant, which was dedicated by blood, and the law written in tables of stone; which was not so dedicated, and therefore could not be the same with the moral law, which you make the covenant of works; telling him, that this dedication by blood ought to distinguish it from the moral law, or Sinai covenant of works, as you say it doth, and ought to do; how then can circumcision be the same with, and yet quite another thing from the Sinai covenant? Was the ceremonial law dedicated by blood? Yes, the apostle plainly asserts it, (Heb. 9:18, 19.) from Exod. 24:7, 8. ‘Moses took the book of the covenant, and read it in the audience of the people; and took the blood, and sprinkled it upon the people, and said, Behold the blood of the covenant, which the Lord hath made with you, concerning these things.’ But what kind of covenant then was this covenant that was sprinkled with blood? You tell us, p. 147, it could not possibly be the law written in stones, (which you make the covenant of works;) but was indeed another covenant, delivered at a distinct season, and in a distinct method. What covenant then must this be, seeing it could not possibly (as you say) be the Sinai covenant written in stones? It must either be the covenant of grace, or none. No, say you, that it was not, neither; for it was of the same nature with, and is no other than a covenant of works, p. 151. It was the same, and yet could not possibly be the same. Mr. Sedgwick, that learned and grave divine, is checked, p. 148. for confounding the ceremonial law that was sprinkled with blood, with the moral law (which you call the covenant of works) that was not sprinkled with blood; and say you, p.

147. It could not possibly be the same. And then, p. 151, you say, It is clear, these two, viz. the moral and ceremonial law, were both of the same nature; that is, no other than a covenant of works. How doth this hang together? Pray reconcile it if you can. You say, It is an ungrounded supposition of Mr. Sedgwick’s, that covenant which was so confirmed by blood, must of necessity be confirmed by the blood of Christ also: p.

148. But, sir, the truth you oppose, viz. That the book of the ceremonial law was sprinkled by typical blood, and therefore confirmed by the blood of Christ, for the time it was to continue, shines like a bright sun-beam in your own eyes, from Heb. 9:14, 23. Was not the blood that sprinkled this law, the figure or type of Christ’s own blood? Whose blood was it then, if not Christ’s? How dare you call this an ungrounded supposition? Was not that blood typical blood? And what, I pray you, was the antitype, but Christ’s blood? And did not the Holy Ghost signify the one by the other? Heb. 9:8. I stand amazed at these things! You distinguish, and confound all again. You say, it could not possibly be the same with the law written in stone; and you say, it is clear both were of the same nature, no other than a covenant of works. At this rate you may say what you please; for I see contradiction is no crime in your book. Argument II If circumcision was the seal of the righteousness of faith, it did not pertain to the covenant of works; for the righteousness of faith and works are opposites, and belong to the two contrary covenants. But circumcision was the seal of the righteousness of faith; Rom. 4:11. “He (i.e. Abraham) received the sign of circumcision, a seal of the righteousness of faith.” Therefore it pertains not to the covenant of works, but grace. A man would think it impossible to evade so clear and scriptural an argument as this is. The major proposition is even self-evident and undeniable; the minor, the plain words of the apostle. And what is your reply to this? Certainly as strange a one as ever I met with; p. 105. you say, It is true, circumcision was a seal of the righteousness of faith to Abraham; but it was so to him only in his extraordinary circumstances; but it was not so to any of his natural seed in its ordinary use. I cannot deny but I have met with such an assertion before in Mr. Tombes; and I can tell you too, that Bellarmine invented it before Mr. Tombes was born, and that Dr. Ames fully confuted it in his third tome, p. 27. proving, that there was no extraordinary cause on Abraham’s account, why God should justify or seal him more than any other believer; and that Abraham had nothing to glory in before God. But to restrain as you do, the public seal of a covenant, that comprehended and equally concerned the whole church and people of God, to one single person; so that neither Isaac nor Jacob, who were by name enrolled in that great charter, should have any right to the seal of it, is such a conceit as amazes an intelligent reader. We know Abraham was the first that received it, but utterly deny that he received it only for himself; but he received it as the father of all them that believe, whither Jews or Gentiles, as the very next words tell us, “He received it, that he might be the father of all them that believe;” that is, for himself, and all his spiritual children. One half of this sacrament of circumcision you allow, p. 205. to the rest that were under it, viz. to be a sign of the covenant; but the other half you cut off, and say, it was only a seal to him. What good vouchers have you for this exposition of the text? Have you the concurrence of orthodox expositors? Or is it the rash and bold adventure of your own head? I am sure it no way agrees with the drift and scope of the apostle’s argument, which evidently is to prove, that both Jews and Gentiles are justified by faith, as Abraham was; and that the ground of justification and blessedness is common both to the uncircumcised Gentiles, and circumcised Jews; and that Abraham and all other believers, have but one way of justification, and salvation, and that how great soever Abraham was, in this case he hath found nothing whereof to glory, ver. 1, 2. And is not your exposition a notable one, to prove the community of the privilege of justification, because the seal of it was peculiar to Abraham alone? Rectify it, and better consider it. Argument III In the covenant of circumcision, Gen. 17 God makes over himself to Abraham and his seed to be their God, or give them a special interest in himself. But in the covenant of works, God doth not, since the fall, make over himself to any, to be their God by way of special interest. Therefore the covenant of circumcision cannot be the covenant of works. This is so plain and clear, that none can doubt or deny it, that understands the nature of the two covenants. And now, sir, what course do you take to avoid this argument? Such a one sure as no man that ever I met with took before you, and that is this; you boldly cut Abraham’s covenant, Gen. 17 into two parts, and make the first to be the pure covenant of grace, which is the promissory part, to the ninth verse; and the restipulation (as you call it, p. 205.) to be as pure a covenant of works. What hard shift will some men make to maintain their opinion! You say truly, p. 205, that at the seventh and eighth verses was their restipulation: why then do you say, p. 224, that at ver. 7th he proceeds to speak of another covenant than what he had been speaking of before? Does the promise and the restipulation make two covenants; or are they just and necessary parts of one and the same covenant? You also tell us, that the covenant, Gen. 17:1, 2, 3, 4 was a plain transcript of several free promises of the gospel under the denomination of a covenant. But why then don’t you take the restipulation, ver. 7, 8, 9, 10 to be a part of it? O no; there is something required on Abraham’s and his posterity’s part; they must be circumcised, and that spoils all. Why but, sir, if the requiring of circumcision alters the case so greatly, as to make it a quite contrary covenant; how comes it to pass, that in the covenant to Abraham, he himself was first required to be circumcised? Why, this is the reason; here is somewhat required on their part as a condition; and a condition quite alters the nature of the covenant. Very well; but tell me then why you say, p. 223, and in many other places, that the covenant made with Abraham, in Gen. 12 was a gospel-covenant; and yet there Abraham is obliged to walk before God, and be perfect? Does not that also there alter the nature of the covenant, as well as here in the seventeenth chapter? You also grant, the covenant made with Abraham, Gen. 22 was a pure gospel-covenant; or if you deny it, the apostle proves it, Heb. 6:13. And yet there is more appearance of respect to Abraham’s obedience in that covenant, than is in submitting to circumcision: see Gen. 22:16, 17. “By myself have I sworn, saith the Lord; for because thou hast done this thing, &amp;c. That in blessing, I will bless thee; and in multiplying, I will multiply thee.” I will trouble you, on this head, but with one query more: if the four first verses of the 17 of Genesis contain a pure gospel-covenant, as you say, and the restipulation in the following verses make a covenant of works, because it thereby becomes conditional; then tell me, if you please, whether what God graciously granted to Abraham in the former verses be not all nulled, and made void again by their restipulation? Does not this seem harsh? Here you have brought Abraham, Isaac, and Jacob, and all the believers of Abraham’s race, just into the same case you brought Moses and all the Israelites before, under two opposite covenants, where one cuts off all that the other granted. But there is a stronger reason urged than the conditionality of the covenant, to prove it a covenant of works; and that is, circumcision is made the condition of Abraham’s covenant; and that is the worst of all conditions, for it obliges a man to keep the whole law, Gal. 5:3 it is the yoke of bondage, and to whatsoever covenant it be so annexed, it makes it become a bondage legal covenant. “If we be circumcised, Christ shall profit us nothing.” Thus it was in the covenant, Gen. 17. Great use is made of this in many parts of your discourse. But, sir, you are greatly mistaken in applying these texts to the purposes you do; for the apostle all along in that epistle to the Galatians, argues against the false teachers, who taught and pressed the necessity of circumcision, as a bond obliging them to the strict and perfect obedience of the law, in order to their justification thereby, or at least to join it with the righteousness of Christ, as a con-cause of justification; see Gal. 2:4, 5 and 3:1. Now against this abuse of circumcision, it is that the apostle argues thus, and tells them, that in submitting to it on that account, they made the death of Christ of no effect, and obliged themselves by it to the whole law; for circumcision did not simply and absolutely in the nature of the work or action, oblige men to the whole law in the way of justification by it, but it did so from the intention of the worker, and the supposition of such an opinion of it, and design in it; for in itself, and with respect to God’s design in the institution of it, it was to be a seal of the righteousness of faith, Rom. 4:11 and so it was an excellent, useful, instructive ordinance to all believers, as long as the ceremonial law stood: and even when it was expiring, as the gospel began to open more and more clearly, there was yet some kind of toleration of it to such as were born of Jewish parents: Thus Paul himself circumcised Timothy, his mother being a Jewess, Acts 16:1, 3 but Titus, being a Greek, was not circumcised, and that because of these false teachers, that would make an ill use of that their liberty, Gal. 2:3, 4. This Paul could never have done, in case circumcision, in the nature of the act, had bound Timothy to keep the law for justification. By which it appears, that the action in its own nature did not oblige to the keeping of the whole law, but from the intention of the agent; and therefore, as the apostle rightly argues, if a man be circumcised with a design to be justified by it, he would thereby bind himself to the whole law, and frustrate the death of Christ to himself; but it was now to have its funeral with all other parts of the ceremonial law, which vanished, and were accomplished in the death of Christ; and it falling out that such a vile use was made of it at that time, the apostle thus thunders against it. Had this been observed, as also the like abuse of the moral law, you would have known how to have reconciled the apostle’s encomiums of them both, with his sharp invectives against the one and the other. But being ignorant of these two great and necessary distinctions of the law, according to God’s intention in the promulgation of it at Sinai, and the carnal Jews sense of it, as a pure covenant of works, against which the apostle so sharply inveighs in the places by you cited, all your 23 arguments from page 183, to page 187, fall to the ground at one stroke; your medius terminus having one sense in your major proposition, and another in your minor; and so every argument had four terms in it, as will easily be evinced by the particular consideration of the respective places from whence you draw them. So in like manner, in your arguing here against circumcision, as a bond to keep the whole law, and as such vacating the death of Christ, is a stumble at the same stone, not distinguishing as you ought to have done, betwixt an obligation arising out of the nature of the work, and out of the end and intention of the workers; and this every learned and judicious eye will easily discern.</p></blockquote>

 the covenant of circumcision, Gen. 17 God makes over himself to Abraham and his seed to be their God, or give them a special interest in himself. But in the covenant of works, God doth not, since the fall, make over himself to any, to be their God by way of special interest. Therefore the covenant of circumcision cannot be the covenant of works. This is so plain and clear, that none can doubt or deny it, that understands the nature of the two covenants. And now, sir, what course do you take to avoid this argument? Such a one sure as no man that ever I met with took before you, and that is this; you boldly cut Abraham’s covenant, Gen. 17 into two parts, and make the first to be the pure covenant of grace, which is the promissory part, to the ninth verse; and the restipulation (as you call it, p. 205.) to be as pure a covenant of works. What hard shift will some men make to maintain their opinion! You say truly, p. 205, that at the seventh and eighth verses was their restipulation: why then do you say, p. 224, that at ver. 7th he proceeds to speak of another covenant than what he had been speaking of before? Does the promise and the restipulation make two covenants; or are they just and necessary parts of one and the same covenant? You also tell us, that the covenant, Gen. 17:1, 2, 3, 4 was a plain transcript of several free promises of the gospel under the denomination of a covenant. But why then don’t you take the restipulation, ver. 7, 8, 9, 10 to be a part of it? O no; there is something required on Abraham’s and his posterity’s part; they must be circumcised, and that spoils all. Why but, sir, if the requiring of circumcision alters the case so greatly, as to make it a quite contrary covenant; how comes it to pass, that in the covenant to Abraham, he himself was first required to be circumcised? Why, this is the reason; here is somewhat required on their part as a condition; and a condition quite alters the nature of the covenant. Very well; but tell me then why you say, p. 223, and in many other places, that the covenant made with Abraham, in Gen. 12 was a gospel-covenant; and yet there Abraham is obliged to walk before God, and be perfect? Does not that also there alter the nature of the covenant, as well as here in the seventeenth chapter? You also grant, the covenant made with Abraham, Gen. 22 was a pure gospel-covenant; or if you deny it, the apostle proves it, Heb. 6:13. And yet there is more appearance of respect to Abraham’s obedience in that covenant, than is in submitting to circumcision: see Gen. 22:16, 17. “By myself have I sworn, saith the Lord; for because thou hast done this thing, &amp;c. That in blessing, I will bless thee; and in multiplying, I will multiply thee.” I will trouble you, on this head, but with one query more: if the four first verses of the 17 of Genesis contain a pure gospel-covenant, as you say, and the restipulation in the following verses make a covenant of works, because it thereby becomes conditional; then tell me, if you please, whether what God graciously granted to Abraham in the former verses be not all nulled, and made void again by their restipulation? Does not this seem harsh? Here you have brought Abraham, Isaac, and Jacob, and all the believers of Abraham’s race, just into the same case you brought Moses and all the Israelites before, under two opposite covenants, where one cuts off all that the other granted. But there is a stronger reason urged than the conditionality of the covenant, to prove it a covenant of works; and that is, circumcision is made the condition of Abraham’s covenant; and that is the worst of all conditions, for it obliges a man to keep the whole law, Gal. 5:3 it is the yoke of bondage, and to whatsoever covenant it be so annexed, it makes it become a bondage legal covenant. “If we be circumcised, Christ shall profit us nothing.” Thus it was in the covenant, Gen. 17. Great use is made of this in many parts of your discourse. But, sir, you are greatly mistaken in applying these texts to the purposes you do; for the apostle all along in that epistle to the Galatians, argues against the false teachers, who taught and pressed the necessity of circumcision, as a bond obliging them to the strict and perfect obedience of the law, in order to their justification thereby, or at least to join it with the righteousness of Christ, as a con-cause of justification; see Gal. 2:4, 5 and 3:1. Now against this abuse of circumcision, it is that the apostle argues thus, and tells them, that in submitting to it on that account, they made the death of Christ of no effect, and obliged themselves by it to the whole law; for circumcision did not simply and absolutely in the nature of the work or action, oblige men to the whole law in the way of justification by it, but it did so from the intention of the worker, and the supposition of such an opinion of it, and design in it; for in itself, and with respect to God’s design in the institution of it, it was to be a seal of the righteousness of faith, Rom. 4:11 and so it was an excellent, useful, instructive ordinance to all believers, as long as the ceremonial law stood: and even when it was expiring, as the gospel began to open more and more clearly, there was yet some kind of toleration of it to such as were born of Jewish parents: Thus Paul himself circumcised Timothy, his mother being a Jewess, Acts 16:1, 3 but Titus, being a Greek, was not circumcised, and that because of these false teachers, that would make an ill use of that their liberty, Gal. 2:3, 4. This Paul could never have done, in case circumcision, in the nature of the act, had bound Timothy to keep the law for justification. By which it appears, that the action in its own nature did not oblige to the keeping of the whole law, but from the intention of the agent; and therefore, as the apostle rightly argues, if a man be circumcised with a design to be justified by it, he would thereby bind himself to the whole law, and frustrate the death of Christ to himself; but it was now to have its funeral with all other parts of the ceremonial law, which vanished, and were accomplished in the death of Christ; and it falling out that such a vile use was made of it at that time, the apostle thus thunders against it. Had this been observed, as also the like abuse of the moral law, you would have known how to have reconciled the apostle’s encomiums of them both, with his sharp invectives against the one and the other. But being ignorant of these two great and necessary distinctions of the law, according to God’s intention in the promulgation of it at Sinai, and the carnal Jews sense of it, as a pure covenant of works, against which the apostle so sharply inveighs in the places by you cited, all your 23 arguments from page 183, to page 187, fall to the ground at one stroke; your medius terminus having one sense in your major proposition, and another in your minor; and so every argument had four terms in it, as will easily be evinced by the particular consideration of the respective places from whence you draw them. So in like manner, in your arguing here against circumcision, as a bond to keep the whole law, and as such vacating the death of Christ, is a stumble at the same stone, not distinguishing as you ought to have done, betwixt an obligation arising out of the nature of the work, and out of the end and intention of the workers; and this every learned and judicious eye will easily discern.”

— John Flavel, The Whole Works of the Reverend John Flavel, vol. 6 (London; Edinburgh; Dublin: W. Baynes and Son; Waugh and Innes; M. Keene, 1820), 340–46.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+You+affirm+with+like+confidence%2C+That+the+covenant+of+circumcision+is+also+the+same%3B+viz.+the+covenant+of+works+made+with+Adam+in+paradise.+This+I+utterly+deny%3B+and+will+try+whether+you+have+any+better+success+in+the+proof+your+second%2C+than+you+had+in+your+first+position.+And+to+convince+you+of+your+mistake%2C+let+us+consider+what+the+general+nature+of+this+ordinance+of+circumcision+was%3B+what+its+ends+were%3B+and+then+prove%2C+That+it+cannot+be+what+you+affirm+it+to+be%2C+the+very+same+covenant+God+made+with+Adam+before+the+fall%2C+but+must+needs+be+a+covenant+of+grace.+%281.%29+Circumcision%2C+in+its+general+nature%2C+was%2C+%281.%29+An+ordinance+of+God%E2%80%99s+own+institution%2C+in+the+99th+year+of+Abraham%E2%80%99s+age%3B+at+which+time+of+its+institution%2C+God+renewed+the+covenant+with+him%2C+Gen.+17%3A9%2C+10.+%282%29.+That+it+consisted+%28as+all+sacraments+do%29+of+an+external+sign%2C+and+a+spiritual+mystery+signified+thereby.+The+external+part+of+it+%28which+we+call+the+sign%29+was+the+cutting+off+the+foreskin+of+the+genital+part+of+the+Hebrew+males%2C+on+the+eighth+day+from+their+birth.+The+spiritual+mystery+thereby+signified+and+represented%2C+was+the+cutting+off+the+filth+and+guilt+of+sin+from+their+souls%2C+by+regeneration+and+justification%2C+called+%E2%80%9Cthe+circumcision+of+the+heart%2C%E2%80%9D+Deut.+10%3A16.+And+though+this+was+laid+upon+them+by+the+command%2C+as+their+duty%2C+yet+a+gracious+promise+of+power+from+God+to+perform+that+duty%2C+was+added+to+the+command%3B+Deut.+30%3A6.+%E2%80%9CThe+Lord+thy+God+will+circumcise+thy+heart+to+love+him%2C%E2%80%9D+%26c.+just+as+promises+of+grace+in+the+New+Testament+are+added+to+commands+of+duty.+%283.%29+Betwixt+this+visible+outward+sign%2C+and+spiritual+mystery%2C+there+was+a+sacramental+relation%3B+from+which+revelation+it+is+called+the+%E2%80%9Ctoken+of+the+covenant%2C%E2%80%9D+Gen.+17%3A12.+%E2%80%9CThe+sign+and+seal+of+the+covenant%2C%E2%80%9D+Rom.+4%3A11.+Yea%2C+%E2%80%9Cthe+covenant+itself%2C%E2%80%9D+Acts+7%3A8.+%282.%29+Next%2C+let+us+consider+the+ends+for+which+circumcision+was+instituted+and+ordained+of+God%3A+Of+which+these+were+the+principal.+%281.%29+It+was+instituted+to+be+a+convictive+sign+of+their+natural+corruption%2C+propagated+by+the+way+of+natural+generation%3A+For+which+reason%2C+this+natural+corruption+goes+in+scripture+under+the+name+of+the+uncircumcision+of+the+heart%2C+Jer.+9%3A26.+%282.%29+It+also+signified+the+putting+off+of+this+body+of+sin%2C+in+the+virtue+of+Christ%E2%80%99s+death%2C+Col.+2%3A11.+%283.%29+It+was+appointed+to+be+the+initiating+sign+of+the+covenant%2C+or+a+token+of+their+matriculation%2C+and+admission+into+the+church+and+covenant+of+God%2C+Gen.+17%3A9%2C+10%2C+11.+%284.%29+It+was+ordained+to+be+a+discriminating+mark+betwixt+God%E2%80%99s+covenanted+people%2C+and+the+Pagan+world%2C+who+were+strangers+to+the+covenant%2C+and+without+God+in+the+world.+And+accordingly+both+parties+were%2C+from+this+ordinance%2C+denominated+the+circumcision+and+the+uncircumcision%2C+Col.+3%3A11.+%285.%29+It+was+also+an+obliging+sign+to+Abraham+and+his+seed%2C+to+walk+with+God+in+the+uprightness+and+sincerity+of+their+hearts%2C+in+the+performance+of+all+covenanted+duties%3B+in+which+duties%2C+Abraham%2C+and+the+faithful%2C+walked+obediently%2C+with+God%2C+looking+to+Christ+for+righteousness%3A+but+the+carnal+Jews+resting+in%2C+and+trusting+to+those+duties+and+ordinances+for+righteousness+and+justification%2C+made+it+a+covenant+of+works+to+themselves%2C+and+circumcision+itself+a+bond+of+that+covenant.+%286%29+Now%2C+forasmuch+as+circumcision+prefigured+Christ%2C+who+was+to+come+of+this+holy+circumcised+seed+of+Abraham%2C+and+his+death+also+was+pointed+at+therein%2C+Heb.+2%3A16.+Col.+2%3A11.+of+necessity+this+ordinance+must+vanish+at+the+death+of+Christ%3A+and+accordingly+did+so.+These+things+duly+pondered%2C+how+irrational+is+it+to+imagine+this+covenant+of+circumcision+to+be+the+very+same+with+the+paradisical+covenant%3F+Did+that+covenant+discover+native+corruption%2C+and+direct+to+its+remedy+in+Christ%2C+as+this+did%3F+Surely+it+gave+not+the+least+glimpse+of+any+such+thing.+Did+that+covenant+separate+and+distinguish+one+person+from+another%2C+as+this+did%3F+No%2C+no%3B+it+left+all+under+equal+and+common+misery%2C+Eph.+2%3A3.+Had+Adam%E2%80%99s+covenant+a+seal+of+the+righteousness+of+faith+annexed+to+it%2C+as+this+had%3F+Rom.+4%3A11.+%E2%80%9CHe+received+circumcision%2C+a+seal+of+the+righteousness+of+faith.%E2%80%9D+The+righteousness+of+faith+is+evangelical+righteousness%3B+and+this+circumcision+sealed.+Say+not+it+was+to+Abraham+only+that+it+sealed+it%3B+for+it+is+an+injurious+restriction+put+upon+the+seal+of+a+covenant%2C+which+extended+to+the+fathers+as+well+as+to+Abraham%2C+Luke+1%3A72.+But+you+admit%2C+however%2C+that+it+sealed+evangelical+righteousness+to+Abraham%3A+but+I+hope+you+will+not+say%2C+that+a+seal+of+the+covenant+of+works+ever+did%2C+or+could%2C+seal+evangelical+righteousness+to+any+individual+person+in+the+world.+So+then%2C+turn+which+way+you+will%2C+this+truth+still+follows+you%2C+and+will+fasten+upon+you%2C+that+the+covenant+of+circumcision+was+not+a+pure+covenant+of+works%2C+but+a+gospel-covenant.+Which+I+thus+prove%3A+Arguments+Argument+I+If+circumcision+be+a+part+of+the+cermonial+law%2C+and+the+ceremonial+law+was+dedicated+by+blood%2C+and+whatsoever+is+so+dedicated%2C+is+by+you+confessed+to+be+ho+part+of+the+covenant+of+works%3B+then+circumcision+is+no+part+of+the+covenant+of+works%2C+even+by+your+own+confession.+But+it+is%3A+ergo%2C+That+it+is+a+part+of+the+ceremonial+law%2C+was+never+doubted%2C+or+denied+by+any+man%3A+that+it+was+dedicated+by+blood%2C+and+therefore+no+part+of+the+moral+law%2C+you+yourself+not+only+acknowledge%2C+but+vehemently+plead+for+it%2C+page+148%2C+where+you+blame+Mr.+Sedgwick+with+some+sharpness%2C+and+unbecoming+reflection%2C+for+making+no+distinction+betwixt+the+ceremonial+covenant%2C+which+was+dedicated+by+blood%2C+and+the+law+written+in+tables+of+stone%3B+which+was+not+so+dedicated%2C+and+therefore+could+not+be+the+same+with+the+moral+law%2C+which+you+make+the+covenant+of+works%3B+telling+him%2C+that+this+dedication+by+blood+ought+to+distinguish+it+from+the+moral+law%2C+or+Sinai+covenant+of+works%2C+as+you+say+it+doth%2C+and+ought+to+do%3B+how+then+can+circumcision+be+the+same+with%2C+and+yet+quite+another+thing+from+the+Sinai+covenant%3F+Was+the+ceremonial+law+dedicated+by+blood%3F+Yes%2C+the+apostle+plainly+asserts+it%2C+%28Heb.+9%3A18%2C+19.%29+from+Exod.+24%3A7%2C+8.+%E2%80%98Moses+took+the+book+of+the+covenant%2C+and+read+it+in+the+audience+of+the+people%3B+and+took+the+blood%2C+and+sprinkled+it+upon+the+people%2C+and+said%2C+Behold+the+blood+of+the+covenant%2C+which+the+Lord+hath+made+with+you%2C+concerning+these+things.%E2%80%99+But+what+kind+of+covenant+then+was+this+covenant+that+was+sprinkled+with+blood%3F+You+tell+us%2C+p.+147%2C+it+could+not+possibly+be+the+law+written+in+stones%2C+%28which+you+make+the+covenant+of+works%3B%29+but+was+indeed+another+covenant%2C+delivered+at+a+distinct+season%2C+and+in+a+distinct+method.+What+covenant+then+must+this+be%2C+seeing+it+could+not+possibly+%28as+you+say%29+be+the+Sinai+covenant+written+in+stones%3F+It+must+either+be+the+covenant+of+grace%2C+or+none.+No%2C+say+you%2C+that+it+was+not%2C+neither%3B+for+it+was+of+the+same+nature+with%2C+and+is+no+other+than+a+covenant+of+works%2C+p.+151.+It+was+the+same%2C+and+yet+could+not+possibly+be+the+same.+Mr.+Sedgwick%2C+that+learned+and+grave+divine%2C+is+checked%2C+p.+148.+for+confounding+the+ceremonial+law+that+was+sprinkled+with+blood%2C+with+the+moral+law+%28which+you+call+the+covenant+of+works%29+that+was+not+sprinkled+with+blood%3B+and+say+you%2C+p.+147.+It+could+not+possibly+be+the+same.+And+then%2C+p.+151%2C+you+say%2C+It+is+clear%2C+these+two%2C+viz.+the+moral+and+ceremonial+law%2C+were+both+of+the+same+nature%3B+that+is%2C+no+other+than+a+covenant+of+works.+How+doth+this+hang+together%3F+Pray+reconcile+it+if+you+can.+You+say%2C+It+is+an+ungrounded+supposition+of+Mr.+Sedgwick%E2%80%99s%2C+that+covenant+which+was+so+confirmed+by+blood%2C+must+of+necessity+be+confirmed+by+the+blood+of+Christ+also%3A+p.+148.+But%2C+sir%2C+the+truth+you+oppose%2C+viz.+That+the+book+of+the+ceremonial+law+was+sprinkled+by+typical+blood%2C+and+therefore+confirmed+by+the+blood+of+Christ%2C+for+the+time+it+was+to+continue%2C+shines+like+a+bright+sun-beam+in+your+own+eyes%2C+from+Heb.+9%3A14%2C+23.+Was+not+the+blood+that+sprinkled+this+law%2C+the+figure+or+type+of+Christ%E2%80%99s+own+blood%3F+Whose+blood+was+it+then%2C+if+not+Christ%E2%80%99s%3F+How+dare+you+call+this+an+ungrounded+supposition%3F+Was+not+that+blood+typical+blood%3F+And+what%2C+I+pray+you%2C+was+the+antitype%2C+but+Christ%E2%80%99s+blood%3F+And+did+not+the+Holy+Ghost+signify+the+one+by+the+other%3F+Heb.+9%3A8.+I+stand+amazed+at+these+things%21+You+distinguish%2C+and+confound+all+again.+You+say%2C+it+could+not+possibly+be+the+same+with+the+law+written+in+stone%3B+and+you+say%2C+it+is+clear+both+were+of+the+same+nature%2C+no+other+than+a+covenant+of+works.+At+this+rate+you+may+say+what+you+please%3B+for+I+see+contradiction+is+no+crime+in+your+book.+Argument+II+If+circumcision+was+the+seal+of+the+righteousness+of+faith%2C+it+did+not+pertain+to+the+covenant+of+works%3B+for+the+righteousness+of+faith+and+works+are+opposites%2C+and+belong+to+the+two+contrary+covenants.+But+circumcision+was+the+seal+of+the+righteousness+of+faith%3B+Rom.+4%3A11.+%E2%80%9CHe+%28i.e.+Abraham%29+received+the+sign+of+circumcision%2C+a+seal+of+the+righteousness+of+faith.%E2%80%9D+Therefore+it+pertains+not+to+the+covenant+of+works%2C+but+grace.+A+man+would+think+it+impossible+to+evade+so+clear+and+scriptural+an+argument+as+this+is.+The+major+proposition+is+even+self-evident+and+undeniable%3B+the+minor%2C+the+plain+words+of+the+apostle.+And+what+is+your+reply+to+this%3F+Certainly+as+strange+a+one+as+ever+I+met+with%3B+p.+105.+you+say%2C+It+is+true%2C+circumcision+was+a+seal+of+the+righteousness+of+faith+to+Abraham%3B+but+it+was+so+to+him+only+in+his+extraordinary+circumstances%3B+but+it+was+not+so+to+any+of+his+natural+seed+in+its+ordinary+use.+I+cannot+deny+but+I+have+met+with+such+an+assertion+before+in+Mr.+Tombes%3B+and+I+can+tell+you+too%2C+that+Bellarmine+invented+it+before+Mr.+Tombes+was+born%2C+and+that+Dr.+Ames+fully+confuted+it+in+his+third+tome%2C+p.+27.+proving%2C+that+there+was+no+extraordinary+cause+on+Abraham%E2%80%99s+account%2C+why+God+should+justify+or+seal+him+more+than+any+other+believer%3B+and+that+Abraham+had+nothing+to+glory+in+before+God.+But+to+restrain+as+you+do%2C+the+public+seal+of+a+covenant%2C+that+comprehended+and+equally+concerned+the+whole+church+and+people+of+God%2C+to+one+single+person%3B+so+that+neither+Isaac+nor+Jacob%2C+who+were+by+name+enrolled+in+that+great+charter%2C+should+have+any+right+to+the+seal+of+it%2C+is+such+a+conceit+as+amazes+an+intelligent+reader.+We+know+Abraham+was+the+first+that+received+it%2C+but+utterly+deny+that+he+received+it+only+for+himself%3B+but+he+received+it+as+the+father+of+all+them+that+believe%2C+whither+Jews+or+Gentiles%2C+as+the+very+next+words+tell+us%2C+%E2%80%9CHe+received+it%2C+that+he+might+be+the+father+of+all+them+that+believe%3B%E2%80%9D+that+is%2C+for+himself%2C+and+all+his+spiritual+children.+One+half+of+this+sacrament+of+circumcision+you+allow%2C+p.+205.+to+the+rest+that+were+under+it%2C+viz.+to+be+a+sign+of+the+covenant%3B+but+the+other+half+you+cut+off%2C+and+say%2C+it+was+only+a+seal+to+him.+What+good+vouchers+have+you+for+this+exposition+of+the+text%3F+Have+you+the+concurrence+of+orthodox+expositors%3F+Or+is+it+the+rash+and+bold+adventure+of+your+own+head%3F+I+am+sure+it+no+way+agrees+with+the+drift+and+scope+of+the+apostle%E2%80%99s+argument%2C+which+evidently+is+to+prove%2C+that+both+Jews+and+Gentiles+are+justified+by+faith%2C+as+Abraham+was%3B+and+that+the+ground+of+justification+and+blessedness+is+common+both+to+the+uncircumcised+Gentiles%2C+and+circumcised+Jews%3B+and+that+Abraham+and+all+other+believers%2C+have+but+one+way+of+justification%2C+and+salvation%2C+and+that+how+great+soever+Abraham+was%2C+in+this+case+he+hath+found+nothing+whereof+to+glory%2C+ver.+1%2C+2.+And+is+not+your+exposition+a+notable+one%2C+to+prove+the+community+of+the+privilege+of+justification%2C+because+the+seal+of+it+was+peculiar+to+Abraham+alone%3F+Rectify+it%2C+and+better+consider+it.+Argument+III+In+the+covenant+of+circumcision%2C+Gen.+17+God+makes+over+himself+to+Abraham+and+his+seed+to+be+their+God%2C+or+give+them+a+special+interest+in+himself.+But+in+the+covenant+of+works%2C+God+doth+not%2C+since+the+fall%2C+make+over+himself+to+any%2C+to+be+their+God+by+way+of+special+interest.+Therefore+the+covenant+of+circumcision+cannot+be+the+covenant+of+works.+This+is+so+plain+and+clear%2C+that+none+can+doubt+or+deny+it%2C+that+understands+the+nature+of+the+two+covenants.+And+now%2C+sir%2C+what+course+do+you+take+to+avoid+this+argument%3F+Such+a+one+sure+as+no+man+that+ever+I+met+with+took+before+you%2C+and+that+is+this%3B+you+boldly+cut+Abraham%E2%80%99s+covenant%2C+Gen.+17+into+two+parts%2C+and+make+the+first+to+be+the+pure+covenant+of+grace%2C+which+is+the+promissory+part%2C+to+the+ninth+verse%3B+and+the+restipulation+%28as+you+call+it%2C+p.+205.%29+to+be+as+pure+a+covenant+of+works.+What+hard+shift+will+some+men+make+to+maintain+their+opinion%21+You+say+truly%2C+p.+205%2C+that+at+the+seventh+and+eighth+verses+was+their+restipulation%3A+why+then+do+you+say%2C+p.+224%2C+that+at+ver.+7th+he+proceeds+to+speak+of+another+covenant+than+what+he+had+been+speaking+of+before%3F+Does+the+promise+and+the+restipulation+make+two+covenants%3B+or+are+they+just+and+necessary+parts+of+one+and+the+same+covenant%3F+You+also+tell+us%2C+that+the+covenant%2C+Gen.+17%3A1%2C+2%2C+3%2C+4+was+a+plain+transcript+of+several+free+promises+of+the+gospel+under+the+denomination+of+a+covenant.+But+why+then+don%E2%80%99t+you+take+the+restipulation%2C+ver.+7%2C+8%2C+9%2C+10+to+be+a+part+of+it%3F+O+no%3B+there+is+something+required+on+Abraham%E2%80%99s+and+his+posterity%E2%80%99s+part%3B+they+must+be+circumcised%2C+and+that+spoils+all.+Why+but%2C+sir%2C+if+the+requiring+of+circumcision+alters+the+case+so+greatly%2C+as+to+make+it+a+quite+contrary+covenant%3B+how+comes+it+to+pass%2C+that+in+the+covenant+to+Abraham%2C+he+himself+was+first+required+to+be+circumcised%3F+Why%2C+this+is+the+reason%3B+here+is+somewhat+required+on+their+part+as+a+condition%3B+and+a+condition+quite+alters+the+nature+of+the+covenant.+Very+well%3B+but+tell+me+then+why+you+say%2C+p.+223%2C+and+in+many+other+places%2C+that+the+covenant+made+with+Abraham%2C+in+Gen.+12+was+a+gospel-covenant%3B+and+yet+there+Abraham+is+obliged+to+walk+before+God%2C+and+be+perfect%3F+Does+not+that+also+there+alter+the+nature+of+the+covenant%2C+as+well+as+here+in+the+seventeenth+chapter%3F+You+also+grant%2C+the+covenant+made+with+Abraham%2C+Gen.+22+was+a+pure+gospel-covenant%3B+or+if+you+deny+it%2C+the+apostle+proves+it%2C+Heb.+6%3A13.+And+yet+there+is+more+appearance+of+respect+to+Abraham%E2%80%99s+obedience+in+that+covenant%2C+than+is+in+submitting+to+circumcision%3A+see+Gen.+22%3A16%2C+17.+%E2%80%9CBy+myself+have+I+sworn%2C+saith+the+Lord%3B+for+because+thou+hast+done+this+thing%2C+%26c.+That+in+blessing%2C+I+will+bless+thee%3B+and+in+multiplying%2C+I+will+multiply+thee.%E2%80%9D+I+will+trouble+you%2C+on+this+head%2C+but+with+one+query+more%3A+if+the+four+first+verses+of+the+17+of+Genesis+contain+a+pure+gospel-covenant%2C+as+you+say%2C+and+the+restipulation+in+the+following+verses+make+a+covenant+of+works%2C+because+it+thereby+becomes+conditional%3B+then+tell+me%2C+if+you+please%2C+whether+what+God+graciously+granted+to+Abraham+in+the+former+verses+be+not+all+nulled%2C+and+made+void+again+by+their+restipulation%3F+Does+not+this+seem+harsh%3F+Here+you+have+brought+Abraham%2C+Isaac%2C+and+Jacob%2C+and+all+the+believers+of+Abraham%E2%80%99s+race%2C+just+into+the+same+case+you+brought+Moses+and+all+the+Israelites+before%2C+under+two+opposite+covenants%2C+where+one+cuts+off+all+that+the+other+granted.+But+there+is+a+stronger+reason+urged+than+the+conditionality+of+the+covenant%2C+to+prove+it+a+covenant+of+works%3B+and+that+is%2C+circumcision+is+made+the+condition+of+Abraham%E2%80%99s+covenant%3B+and+that+is+the+worst+of+all+conditions%2C+for+it+obliges+a+man+to+keep+the+whole+law%2C+Gal.+5%3A3+it+is+the+yoke+of+bondage%2C+and+to+whatsoever+covenant+it+be+so+annexed%2C+it+makes+it+become+a+bondage+legal+covenant.+%E2%80%9CIf+we+be+circumcised%2C+Christ+shall+profit+us+nothing.%E2%80%9D+Thus+it+was+in+the+covenant%2C+Gen.+17.+Great+use+is+made+of+this+in+many+parts+of+your+discourse.+But%2C+sir%2C+you+are+greatly+mistaken+in+applying+these+texts+to+the+purposes+you+do%3B+for+the+apostle+all+along+in+that+epistle+to+the+Galatians%2C+argues+against+the+false+teachers%2C+who+taught+and+pressed+the+necessity+of+circumcision%2C+as+a+bond+obliging+them+to+the+strict+and+perfect+obedience+of+the+law%2C+in+order+to+their+justification+thereby%2C+or+at+least+to+join+it+with+the+righteousness+of+Christ%2C+as+a+con-cause+of+justification%3B+see+Gal.+2%3A4%2C+5+and+3%3A1.+Now+against+this+abuse+of+circumcision%2C+it+is+that+the+apostle+argues+thus%2C+and+tells+them%2C+that+in+submitting+to+it+on+that+account%2C+they+made+the+death+of+Christ+of+no+effect%2C+and+obliged+themselves+by+it+to+the+whole+law%3B+for+circumcision+did+not+simply+and+absolutely+in+the+nature+of+the+work+or+action%2C+oblige+men+to+the+whole+law+in+the+way+of+justification+by+it%2C+but+it+did+so+from+the+intention+of+the+worker%2C+and+the+supposition+of+such+an+opinion+of+it%2C+and+design+in+it%3B+for+in+itself%2C+and+with+respect+to+God%E2%80%99s+design+in+the+institution+of+it%2C+it+was+to+be+a+seal+of+the+righteousness+of+faith%2C+Rom.+4%3A11+and+so+it+was+an+excellent%2C+useful%2C+instructive+ordinance+to+all+believers%2C+as+long+as+the+ceremonial+law+stood%3A+and+even+when+it+was+expiring%2C+as+the+gospel+began+to+open+more+and+more+clearly%2C+there+was+yet+some+kind+of+toleration+of+it+to+such+as+were+born+of+Jewish+parents%3A+Thus+Paul+himself+circumcised+Timothy%2C+his+mother+being+a+Jewess%2C+Acts+16%3A1%2C+3+but+Titus%2C+being+a+Greek%2C+was+not+circumcised%2C+and+that+because+of+these+false+teachers%2C+that+would+make+an+ill+use+of+that+their+liberty%2C+Gal.+2%3A3%2C+4.+This+Paul+could+never+have+done%2C+in+case+circumcision%2C+in+the+nature+of+the+act%2C+had+bound+Timothy+to+keep+the+law+for+justification.+By+which+it+appears%2C+that+the+action+in+its+own+nature+did+not+oblige+to+the+keeping+of+the+whole+law%2C+but+from+the+intention+of+the+agent%3B+and+therefore%2C+as+the+apostle+rightly+argues%2C+if+a+man+be+circumcised+with+a+design+to+be+justified+by+it%2C+he+would+thereby+bind+himself+to+the+whole+law%2C+and+frustrate+the+death+of+Christ+to+himself%3B+but+it+was+now+to+have+its+funeral+with+all+other+parts+of+the+ceremonial+law%2C+which+vanished%2C+and+were+accomplished+in+the+death+of+Christ%3B+and+it+falling+out+that+such+a+vile+use+was+made+of+it+at+that+time%2C+the+apostle+thus+thunders+against+it.+Had+this+been+observed%2C+as+also+the+like+abuse+of+the+moral+law%2C+you+would+have+known+how+to+have+reconciled+the+apostle%E2%80%99s+encomiums+of+them+both%2C+with+his+sharp+invectives+against+the+one+and+the+other.+But+being+ignorant+of+these+two+great+and+necessary+distinctions+of+the+law%2C+according+to+God%E2%80%99s+intention+in+the+promulgation+of+it+at+Sinai%2C+and+the+carnal+Jews+sense+of+it%2C+as+a+pure+covenant+of+works%2C+against+which+the+apostle+so+sharply+inveighs+in+the+places+by+you+cited%2C+all+your+23+arguments+from+page+183%2C+to+page+187%2C+fall+to+the+ground+at+one+stroke%3B+your+medius+terminus+having+one+sense+in+your+major+proposition%2C+and+another+in+your+minor%3B+and+so+every+argument+had+four+terms+in+it%2C+as+will+easily+be+evinced+by+the+particular+consideration+of+the+respective+places+from+whence+you+draw+them.+So+in+like+manner%2C+in+your+arguing+here+against+circumcision%2C+as+a+bond+to+keep+the+whole+law%2C+and+as+such+vacating+the+death+of+Christ%2C+is+a+stumble+at+the+same+stone%2C+not+distinguishing+as+you+ought+to+have+done%2C+betwixt+an+obligation+arising+out+of+the+nature+of+the+work%2C+and+out+of+the+end+and+intention+of+the+workers%3B+and+this+every+learned+and+judicious+eye+will+easily+discern.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+The+Whole+Works+of+the+Reverend+John+Flavel%2C+vol.+6+%28London%3B+Edinburgh%3B+Dublin%3A+W.+Baynes+and+Son%3B+Waugh+and+Innes%3B+M.+Keene%2C+1820%29%2C+340%E2%80%9346.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F05519a6851.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/05519a6851.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/flavel-to-cary-abraham-is-not-moses/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The passages are these:— He was thirty years old when he came up to be baptized. Then, when he had the mature age of a teacher, he came to Jerusalem, so that all would reasonably accept him as a teacher. For he did not appear to be one thing while he was another, as those say who introduce him as a man only in appearance. He actually was what he appeared to be. So, when he was teacher, he also had the age of a teacher. He did not reject human nature or exalt himself above it, nor did he abrogate in himself his own law [given in behalf] of the human race; but he sanctified every age by a likeness to himself. Surely, he came to save all people through himself; I say all who would again be born to God—infants, children, youth, young adults, elderly. Therefore, he passed through every age. Becoming an infant among infants, he sanctified infants; becoming a child among children, he sanctified those having this age and at the same time became for them an example of piety and righteousness and obedience; becoming a young adult among young adults, he was an example for young adults and sanctified them to the Lord. In the same way, he became also an elderly person among the elderly, so that he might be a mature teacher for all, not merely by explaining the truth but also by his age, that is, by at the same time sanctifying the elderly and being an example for them. Lastly, he came even to death so that he might be the Firstborn from the dead, himself holding the primacy in all things, the Author of life, prior to all and going before all.1 [Book. 1. ch. 21. sect. 1]: The tradition about their redemption turns out to be invisible and incomprehensible, inasmuch as this is the mother of the incomprehensible and invisible beings.1 And so it is unstable and cannot be told simply or in one word, because each one of them hands it down just as he wishes. For there are as many redemptions as there are mystery-teachers of this doctrine. When in the proper place we shall expose them, we shall tell how this false picture was injected by Satan in order to deny the baptism of rebirth unto God, and to destroy the entire faith.2 Mr Tombs tells us, “This proves not infant baptism, because though it be granted that in Justin Martyr, and others of the ancients, to be regenerated is to be baptized, yet it doth not appear that Irenæus meant it so in this place, unless it were proved it is so only meant by him and the ancients. Nor doth Irenæus, lib. i. cap. xviii., term baptism ‘regeneration;’ but saith thus, ‘To the denying of baptism of that regeneration which is unto God.’ But that indeed the word ‘renascuntur,’ ‘are born again,’ is not meant of baptism is proved from the words and the scope of them; for,— “1. The words are, ‘Per eum renascuntur,’ ‘By him,’ that is, Christ, ‘are born again.’ And it is clear, from the scope of the speech about the fulness of his age, as a perfect master, that ‘By him’ notes his person according to his human nature. Now, if then, ‘By him are born again,’ be as much as ‘By him are baptized,’ this should be Irenæus assertion, that by Christ himself, in his human body, infants, and little ones, and boys, and young men, and elder men, are baptized unto God. But this speech is most manifestly false; for neither did Christ baptize any at all in his own person, (John 4:1, 2, ‘Jesus himself baptized not, but his disciples,’) nor did the disciples baptize any infant at all, as may be gathered from the whole New Testament. “2. The word which Irenæus expresseth whereby persons are born again to God by Christ is applied to the example of his age, as the words and scope show. But he was not in his age an example of every age by his baptism, as if he did by it sanctify every age, for then he should have been baptized in every age; but in respect of the holiness of his human nature, which did remain each age, and so exemplarily sanctify each age to God, so as that there was no age but was capable of holiness by conformity to his example. “3. Irenæus’ words are, ‘Omnes enim venit per semetipsum salvare, omnes, inquam, qui per eum renascuntur in Deum, infantes, et parvulos,’ etc. Now, if the meaning were, that Christ came to save all that were baptized by him or by his appointment, then he came to save Simon Magus, or whoever are or have been baptized rightly. But in that sense the proposition is most palpably false; and therefore that sense is not to be attributed to his words. “4. Christ is by Irenæus said to sanctify as ‘a perfect master,—not only according to the exposition of truth, but also as an example to them of piety, justice, and subjection.’ But this is to be understood not in respect of his baptism only, but his whole life, in which he was an example; even as an infant, for then he did willingly empty himself,—‘Took upon him the form of a servant,’ etc., Phil. 2:7, 8. “By all which reasons,” saith Mr Tombs, “I presume the readers who are willing to see truth will perceive this passage of Irenæus to be wrested by Pedobaptists against its meaning, to prove a use of pedobaptism in his time.” Ans.

1. The phrase of “Renascuntur in Deum” is so constantly I used by the ancients for baptism that it may be referred to the conscience of Mr Tombs or any one who hath been conversant in their writings, whether they would not have judged and granted that it was here intended, if mention had not been made of infants and little ones. The ensuing exceptions, therefore, are an endeavour to stifle light in favour of an opinion;—which is not unusual with some. Ans.

2. “Per eum” is the same with “Per semetipsum,” in the words immediately foregoing; that is, “By himself,” in his mediation, grace, and ordinances. And to suppose that if baptism be intended, he must baptize them in his own person, is a mere cavil; for all that are born to God by baptism to this day are so by him. Ans.

3. The words, Εἰς ἐξάρνησιν τοῦ βαπτίσματος τῆς εἰς Θεὸν ἀναγεννήσεως, “Unto the denial of the baptism of regeneration unto God,” do plainly declare that by “renascuntur” he intends the baptism of regeneration, as being the means and pledge of it, in allusion to that of the apostle, Λούτρον παλιγγενεσίας, Tit. 3:5. Ans.

4. It is remarkable in the words of Irenæus, that in expressing the way and means of the renascency of infants, he mentions nothing of the example of Christ, which he adds unto that of all other ages. Ans.

5. The example of Christ is mentioned as one outward means of the regeneration of them who were capable of its use and improvement. Of his being an example of baptism nothing is spoken. Nor was Christ in his own person an example of regeneration unto any; for as he was not baptized in all ages, so he was never regenerated in any, for he needed no regeneration. Ans.

6. It is well that it is so positively granted that Christ doth sanctify infants; which, seeing he doth not do so to all universally, must be those of believing parents; which is enough to end this controversy. Ans.

7. The meaning of Irenæus is no more but that Christ, passing through all ages, evidenced his design to exclude no age, to communicate his grace unto all sorts and ages; and he mentioneth old men, because his judgment was that Christ was fifty years old when he died. Ans.

8. It was the constant opinion of the ancients that Christ came to save all that were baptized; not intending his purpose and intention with respect unto individuals, but his approbation of the state of baptism, and his grant of the means of grace.</p></blockquote>

0%9CA+lawful+oath%2C+being+imposed+by+lawful+authority%2C+in+such+matters+ought+to+be+taken%3B%E2%80%9D+and+%C2%A73%2C+of+the+same+chapter%2C+%E2%80%9CYet+it+is+a+sin+to+refuse+an+oath%2C+touching+any+thing+that+is+good+and+just%2C+being+imposed+by+lawful+authority%3F%E2%80%9D+It+is+true%2C+they+reckon+her+no+lawful+Queen%3B+but+one+error+will+not+atone+for+another.%0A%0AThe+famous+author+of+the+Apologetical+Relation+%5BJohn+Brown+of+Wamphray%5D+was+not+of+our+dissenters%E2%80%99+mind+%28nay%2C+he+thought+there+had+been+no+Christian+of+their+mind%2C+and+for+ought+I+know+there+were+none+in+these+days%29%2C+for%2C+speaking+of+the+reasons+why+the+oath+of+Supremacy%2C+called+then%2C+tho%E2%80%99+falsely%2C+the+oath+of+allegiance%2C+should+be+refused%2C+and+answering+this+objection%2C+viz.+such+as+refuse+this+oath+of+Allegiance%2C+declare+that+they+are+not+dutiful+and+loyal+subjects%2C+he+saith%2C+%E2%80%9CIt+hath+been+shown+what+difference+there+is+betwixt+this+oath+and+the+oath+of+allegiance%3B+and+there+is+no+minister+or+Christian+should+scruple+at+the+taking+the+pure+oath+of+allegiance%2C%E2%80%9D+Apol.+Rel.+p.+259.+If+it+was+this+author%E2%80%99s+mind%2C+that+no+minister+or+Christian+should+have+scrupled+the+oath+of+Allegiance+to+King+Charles+II.+when+he+had+taken+the+Covenant%2C+broken+it%2C+and+overturned+the+work+of+Reformation%2C+sure%2C+he+would+far+less+have+thought+it+a+sin+to+take+the+oath+of+allegiance+to+the+present+Queen.%0A%0A3.+How+doth+their+separating+from+this+Church%2C+lest+they+be+involved+in+the+guilt+of+the+corruptions+amongst+us%2C+by+keeping+communion+with+us%2C+agree+with+Conf.+chap.+26%2C+%C2%A72%2C+%E2%80%9CSaints%2C+by+profession%2C+are+bound+to+maintain+an+holy+fellowship+and+communion+in+the+worship+of+God%3B+%E2%80%94+which+communion%2C+as+God+offereth+opportunity%2C+is+to+be+extended+to+all+those+who+in+every+place+call+upon+the+name+of+the+Lord+Jesus%3F%E2%80%9D%0A%0A4.+How+doth+that+principle+of+theirs%2C+sometime+at+least+owned+by+them%2C+though+left+out+in+their+last+paper%2C+against+the+power+of+the+magistrate+to+call+assemblies%2C+agree+with+Conf.+chap.+31+%C2%A72%2C+%E2%80%9CAs+magistrates+may+lawfully+call+a+synod+of+ministers%2C+and+other+fit+persons+to+consult+and+advise+with+about+matters+of+religion%3F%E2%80%9D+and+with+Act+of+Assembly+1638%2C+sess.+26%2C+concerning+yearly+General+Assemblies%2C+where+they+say%2C+%E2%80%9CIf%2C+in+the+meantime%2C+it+shall+please+the+king%E2%80%99s+majesty+to+indite+a+General+Assembly%2C+ordaineth+all+presbyteries%2C+universities%2C+and+burghs%2C+to+send+their+commissioners%2C+for+keeping+the+time+and+place+which+shall+be+appointed+by+his+majesty%E2%80%99s+proclamation%3F%E2%80%9D+They+cry+out+on+the+encroachment+of+the+magistrates+in+dissolving+Assemblies%3B+but+as+our+Assemblies+are+constituted+in+the+name+of+Christ%2C+so+are+they+dissolved+in+his+name.%0A%0AWhat+dissolution+the+magistrate+makes%2C+is+looked+upon+as+the+dismissing+of+the+members.+There+have+indeed+been+encroachments+made+by+the+magistrate+in+dissolving+Assemblies+before+they+had+done+their+business%2C+and+there+have+been+protestations+made+against+this.+And+though%2C+in+the+late+paper%2C+they+charge+the+Church+for+not+protesting+against+the+encroachments%2C+and+recording+the+same%3B+yet+that+protestations+have+not+been+made+against+them%2C+is+an+untruth%3A+but+where+the+magistrate%E2%80%99s+deed+is+not+recorded%2C+neither+are+the+protestations+recorded.%0A%0AI+was+eye+and+ear-witness+to+the+magistrate%E2%80%99s+dissolving+the+Assembly+in+the+midst+of+business%3B+and+protestations+were+made+against+it%2C+and+for+the+Church%E2%80%99s+intrinsic+power%3B+and%2C+from+every+corner+of+the+house%2C+members+adhering+thereto.+And+this+protesting+is+recorded+in+the+Acts+of+Assembly%3B+so+that%2C+from+my+certain+knowledge%2C+I+can+say+they+speak+an+untruth+in+that+charge+in+the+declinature%3B+yea%2C+I+have+the+Acts+of+the+Assembly+by+me%2C+where+they%2C+or+any+that+question+the+truth+of+what+I+say%2C+may+read+it+with+their+own+eyes.%0A%0A5.+How+doth+their+rejecting+and+despising+the+testimony+of+the+Commission+of+the+General+Assembly+against+the+Union%2C+and+reproaching+them+for+it%2C+because+it+was+given+into+the+Parliament+by+way+of+humble+address%2C+and+not+by+way+of+protestation%2C+agree+with+Confession%2C+chap.+31%2C+%C2%A75%2C+%E2%80%9CSynods+and+councils+are+to+handle+and+conclude+nothing+but+that+which+is+ecclesiastical%2C+and+are+not+to+intermeddle+with+civil+affairs%2C+which+concern+the+commonwealth%2C+unless%2C+by+way+of+humble+petition%2C+in+cases+extraordinary%2C+or+by+way+of+advice%2C+for+satisfaction+of+conscience%2C+if+they+be+thereunto+required+by+the+civil+magistrate%3F%E2%80%9D%0A%0ALastly%2C+How+does+their+crying+out+on+the+magistrate%E2%80%99s+occasionally+appointing+fasts+and+thanksgivings%2C+agree+with+the+Confession+of+Faith%2C+allowing+the+magistrate+to+call+Assemblies%3F+This+I+spoke+to+formerly+in+another+sermon.+And+further%2C+how+agrees+it+with+the+last+paragraph+of+the+Directory+concerning+public+solemn+fasting%2C+where+we+have+these+words%2C+%E2%80%9CBesides+solemn+and+general+fasts+enjoined+by+authority%2C+we+judge%2C%E2%80%9D+etc.+It+may+be+observed+how+frequently+the+apostles+enjoin+obedience+to+magistrates%2C+and+honouring+of+them%2C+as+1+Tim.+ii.+1%2C+2%2C+%E2%80%9CI+exhort+therefore%2C+that+prayers+be+made+for+kings%2C+and+for+all+that+are+in+authority.%E2%80%9D+Rom.+xiii.+1%2C+%E2%80%9CLet%2C+every+soul+be+subject+unto+the+higher+powers%2C%E2%80%9D+etc.+Tit.+iii.+1%2C+%E2%80%9CPut+them+in+mind+to+be+subject+to+principalities+and+powers%2C+to+obey+magistrates.%E2%80%9D+1+Pet.+ii.+13%2C+and+downwards.%0A%0AAll+which+may+shew+us%2C+that+we+have+no+more+right+to+take+away+the+fifth+command+out+of+the+decalogue%2C+that+requires+obedience+to+magistrates%2C+than+the+Papists+have+to+take+away+the+second%2C+which+condemns+their+idolatry.+I+think+there+is+a+strange+inclination+amongst+some+that+profess+religion%2C+not+only+amongst+dissenters%2C+but+others%2C+to+speak+evil+of+dignities%2C+and+to+embrace+every+thing+that+may+make+against+the+magistrate%3B+so+that+the+murdering+of+King+Charles+I%2C+wherewith+Presbyterians+are+slandered+by+Papists+and+malignants%2C+is+owned+and+adopted+by+some%2C+as+if+it+had+been+a+laudable+action.%0A%0AWo+is+me%21+that+ignorance%2C+and+an+inclination+to+vilify+magistrates%2C+should+give+such+an+handle+to+the+enemy+against+us.+If+it+was+such+a+glorious+action%2C+the+sectaries+must+have+the+glory+of+it%3B+for+it+was+they%2C+and+not+Presbyterians%2C+that+did+the+deed%2C+and+it+was+protested+against+by+the+commissioners+both+from+the+Church+and+state+of+Scotland%2C+for+which+they+were+hardly+used+at+London%3B+for+which+see+Apol.+Rel.+p.+64.%0A%0AYea%2C+the+General+Assembly+of+the+Church+of+Scotland%2C+1649%2C+gave+their+testimony+against+it+in+their+seasonable+warning%2C+sess.+27%2C+they+say%2C+%E2%80%9CThat+prevailing+party+of+societies+in+England%2C+who+have+broken+the+covenant+%E2%80%94+and+taken+away+the+king%E2%80%99s+life%2C+look+upon+us+with+an+evil+eye.%E2%80%9D+And+in+their+exhortation+to+their+brethren+in+England%2C+%E2%80%9CWe+have+obtained+this+mercy%2C+to+be+steadfast+to+our+old+principles%2C+in+bearing+free+and+faithful+testimony+against+their+proceedings%2C+both+in+reference+to+the+toleration+and+government%2C+and+the+taking+away+the+king%E2%80%99s+life.%E2%80%9D+And+in+their+letter+to+the+king%2C+%E2%80%9CWe+do+from+our+hearts+abominate+and+detest+that+horrid+fact+of+the+sectaries%2C+against+the+life+of+your+royal+father+our+sovereign.%E2%80%9D+Both+which+are+to+be+found+in+the+last+session+of+that+Assembly.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Evil+and+Danger+of+Schism.+A+Sermon%2C+by+the+late+Learned+and+Pious+Mr.+Thomas+Boston%2C+Minister+of+the+Gospel+at+Etterick%2C+%281708%3B+3rd+edn%2C+Oxnam%2C+1753%29%2C+pp+24-29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff115948af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f115948af2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/24/thomas-boston-on-the-westminster-confession-and-the-hyper-covenanter-error-of-political-dissent/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-33c24143a8" data-kw="">
<blockquote><p>But here it is requisite, that we make a difference betwixt the office which is the good ordinance of God, and the evil person that doth not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that cometh of other causes, and the fault thereof is the men of persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupteth the ways of God, and by his own fault and naughtiness transgresseth God’s ordinance, so far, that he doth worthily deserve the name of devilish power, and not divine authority[.]

[W]e have an example of this in the magistrate of Jerusalem. For although he was able to refer the beginning of his power by degrees to Moses, and so to God himself who ordained it — yet, because he arrests the Saviour in the garden and binds him, it is said to his servants, “Ye are come out as it were to a thief with swords and staves; when I was with you daily in the temple, ye stretched not forth your hands against me. But this is even your hour, and the power of darkness.” Lo, here he calleth the ordinary magistrate the power of the devil, when he abuseth his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office.

Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil: for whereas he hung up and beheaded the apostles of Christ, moving a bloody persecution against the church, that sprang not from elsewhere than from the devil, the father of murder. So then, verily, we ought not at any time to defend the tyrannical power, and say that it is of God: for tyranny is not a divine, but a devilish, kind of government; and tyrants themselves are properly the servants of the devil, and not of God.</p></blockquote>

<blockquote><p>And as the Prince hath no more power then what is communicated from the community; so the people or community cannot give away from themselves the power of self-preservation. Because the same Commandment that faith, Thou shalt not kill: doth also say, Thou shalt preserve.

Precepts that forbid evil, do command the contrary good. Now the moral natural Law of God forbids a man to kill himself, and therefore commands him to preserve himself: and as by a positive act men cannot make a Law to kill themselves, no more can they not to preserve themselves; the one being as strongly commanded by the moral Law, and as deeply seated in Nature as the other. Secondly, because if the community should give away the power of self-preservation, the state should not be in a better but in a worser condition then before.

The King and Prince is taken into Office for the good of the people, therefore called Pater patriae, &amp; Pastor gregis: not because he may arbitrarily rule in the Common wealth as a Father doth in his family; but because of his tender care that he is to have over his people; and that the people might live more secure and peaceably in all godliness and honesty: But if the community should give such a trust to any one that they might not at all defend themselves beyond his actual appointment, they should be infinitely in a worser condition then before, because before such trust they should be freemen; but after the trust they should be slaves, unless it pleases the King through his own gracious condescension to let them be free still: for what is a slave but such a one who is so absolutely at the power of another’s command, that he may be spoiled, or sold, or put under the Galleys, and there beaten daily, having no power to make any resistance or self-defence.

Thirdly, it is agreeable to the Law of Nations and Reason, that no inferior Court can undo what a superior Court hath done, As where an estate is settled upon children by Act of Parliament, no inferior Court of Justice can cut off the intayle. Now self-preservation is enacted in the Court of Nature, as he that hath read but Magirus unbound, I mean common natural principles, will grant, and therefore no act of a community can cut off this intayle from their posterity, or make such a deed of Conveyance whereby themselves and their children should be spoiled of self-preservation.</p></blockquote>

</figure><figure class="quote" id="q-e10b7d2277" data-kw="">
<blockquote><p>When he [Thomas Hobbes] saith, [That whatsoever the Prince doth, can be no injury to the subject, nor ought he to be accused by any of them of injustice; for he that doth any thing by authority from another, doth therein no injury to him by whose authority he acteth.] This doctrine will hardly down with free born people, who choose to themselves Princes, not to tyrannise over them, but like good shepherds, or fathers of their Country, to rule them; the people were not mad to give their power so to Princes, as to be their slaves; or to think that tyrannical cruelties and oppressions are not injuries to the subject, or that tyrants must not be accused of injustice, for although the Prince acteth by the peoples authority in things lawful, yet in his lawless exorbitancies, he acteth by his own tyrannising power, not by the peoples’ authority; for they be authors of his lawful power, yet they are no ways authors of his exorbitancies: and it is ridiculous when he saith, [No man can do injury to himself, and that the Prince may commit iniquity but not injustice or injury.]

For its too apparent, that most men are too injurious to themselves, nemo laeditur nisi à seipso, O, Israel, thy destruction is of thy self: And I would fain know what true difference there is between injustice and iniquity, or injury, for jus and aequum signi∣fie the same thing in Latin, whence we borrow the words injustice, injury, iniquity: I know some put a difference between jus and aequum, but to little purpose; for doubtless, every injury is unjust, and each unjust act is an injury, and an iniquity either against God or man; he is also injurious to good Princes, when he makes no difference between them and tyrants, Part 2. cap. 20. [between despotical and paternal dominions, making tyrants and Sovereigns by institution all one in rights and consequences.]

This is to put no difference between the Father and Butcher of his Country, between the Shepherd and the wolf, between sharing and fleeing of the sheep. A King governs, and is governed by laws; a tyrant hath no law but his will; jus est in armis, opprimit leges timor. This his absurd assertion he would patronise by Scripture, which describeth to us, 1 Sam. 8. 11, 12. verses, the manner of Kings; namely, to take your sons and daughters to drive his chariot, &amp;c. To take your fields and Vineyards, &amp;c. But in that he mistakes himself; for in that chapter the Scriptures describes unto us, not the qualities of Kings, but of tyrants, such as the neighbouring Nations had, which dwelt about Judea: but if he will see the qualities of a good King, and such as the Lord would choose; let him read the 17. chapter of Deuteronomy, there he shall find a King that must be regulated by the law of God, and not by his own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), pp 21-22 (emphasis added).</span></figcaption>

</figure><figure class="quote" id="q-60d951ee5b" data-kw="">
<blockquote><p>There’s a difference between a Tyrant that cometh violently to force men to submit to him, or one that comes with a sudden surprise, or with any cunning ways to persuade men to come in to submit to him, and a Prince that is upon his Throne reigning, and having his Subjects acknowledging themselves to be as Subjects to him …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gat</cite>, e (London, 1668), p. 68.</span></figcaption>

— Jeremiah Burroughs, The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gat, e (London, 1668), p. 68.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%E2%80%99s+a+difference+between+a+Tyrant+that+cometh+violently+to+force+men+to+submit+to+him%2C+or+one+that+comes+with+a+sudden+surprise%2C+or+with+any+cunning+ways+to+persuade+men+to+come+in+to+submit+to+him%2C+and+a+Prince+that+is+upon+his+Throne+reigning%2C+and+having+his+Subjects+acknowledging+themselves+to+be+as+Subjects+to+him+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+The+difference+between+the+spots+of+the+godly+and+of+the+wicked+preached+by+Mr.+Jeremiah+Burroughs+at+Cripple+Gat%2C+e+%28London%2C+1668%29%2C+p.+68.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60d951ee5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/60d951ee5b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/21/jeremiah-burroughs-on-the-difference-between-a-lawful-prince-and-a-tyrant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-dc37d1a88e" data-kw="">
<blockquote><p>Having, in the first verse, described the origin of civil authority, and shown the conscientious submission due to it, the Apostle proceeds to draw this natural and important conclusion, that “whosoever, therefore, resisteth the power, resisteth the ordinance of God; and they that resist shall receive to themselves damnation.” By destroying the necessary distinction between the office and the right to hold it, and confounding power with the person invested with it, it has been asserted, that all who resist magistrates in the exercise of their authority, incur damnation.

Were this doctrine true, our Covenanting forefathers who refused obedience to many mandates of the reigning prince, took up arms against him, and resisted unto blood in opposing his unlawful authority, must have placed themselves in a most awful predicament. The doctrine, however, is utterly false, and contrary to Scripture, reason, and the practice of good men in all ages of the world. The devil and his agents are identified in nature, disposition, and employment.

So says the Saviour in his dialogue with the Scribes and Pharisees, in the 8th chapter of the Gospel by John; “I speak that which I have seen with my Father: and ye do that which ye have seen with your father. Ye are of your father the devil, and the lusts of your father ye will do.” Regarding the authority of this infernal tyrant, the precept is general and direct. – “Resist the devil and he will flee from you.” Solomon says, “As a roaring lion and a raging bear, so is a wicked ruler over the poor people.” – (Prov. xxviii. 15.) Are lions and bears not to be resisted?

Wicked rulers are actually instigated by the devil, as we read in Rev. ii. 10. “Fear none of these things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried, and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life.” That tyrannical rulers are, in this passage, proved to be actuated by him, is evident, since the devil casts nobody into prison but by the instrumentality of human agents.

Resistance to these, therefore, must be considered as lawful resistance to the devil himself – that is to say, laudable, rational, and praiseworthy in all who would obey God rather than men. The saints, indeed, being the subjects of that enmity which was put between the seed of the woman and the seed of the or would not submit to Pharaoh’s authority, requiring them to destroy their son, but hid him for a number of months, in order that his life might be preserved – and in doing this we are told, that they were not afraid of the king’s commandment. The same firmness was found in Daniel and his companions in Babylon. They would neither worship Nebuchadnezzar’s golden image, nor cease to pray to God at the mandate of Darius.

New Testament believers were also actuated by the same principle. When Peter and John were imprisoned for teaching the people, and preaching through Jesus the resurrection from the dead, and were commanded not to speak at all, nor teach in the name of Jesus, they boldly remonstrated and refused to obey in the following spirited terms. – “Whether it be right in the sight of God to hearken unto you more than unto God, judge ye. For we cannot be speak the things which we have seen and heard.” (Acts iv. 19, 20.)

If the Apostle Paul inculcates unqualified submission to Caesar, in the passage before us, as has been by some alleged, he must have been a consummate hypocrite and deceiver, utterly unworthy of attention, and refusing to do himself what he imposed upon others. The civil powers under which he lived, had prohibited, under the severest penalties, the publication of the Gospel: yet he says, “necessity is laid upon me; yea, woe is unto me if I preach not the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/the-belfast-covenanter.html">The Belfast Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Dissertation on Rom. xiii. 1-6.’ Covenanter</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Having, in the first verse, described the origin of civil authority, and shown the conscientious submission due to it, the Apostle proceeds to draw this natural and important conclusion, that “whosoever, therefore, resisteth the power, resisteth the ordinance of God; and they that resist shall receive to themselves damnation.” By destroying the necessary distinction between the office and the right to hold it, and confounding power with the person invested with it, it has been asserted, that all who resist magistrates in the exercise of their authority, incur damnation.

Were this doctrine true, our Covenanting forefathers who refused obedience to many mandates of the reigning prince, took up arms against him, and resisted unto blood in opposing his unlawful authority, must have placed themselves in a most awful predicament. The doctrine, however, is utterly false, and contrary to Scripture, reason, and the practice of good men in all ages of the world. The devil and his agents are identified in nature, disposition, and employment.

So says the Saviour in his dialogue with the Scribes and Pharisees, in the 8th chapter of the Gospel by John; “I speak that which I have seen with my Father: and ye do that which ye have seen with your father. Ye are of your father the devil, and the lusts of your father ye will do.” Regarding the authority of this infernal tyrant, the precept is general and direct. – “Resist the devil and he will flee from you.” Solomon says, “As a roaring lion and a raging bear, so is a wicked ruler over the poor people.” – (Prov. xxviii. 15.) Are lions and bears not to be resisted?

Wicked rulers are actually instigated by the devil, as we read in Rev. ii. 10. “Fear none of these things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried, and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life.” That tyrannical rulers are, in this passage, proved to be actuated by him, is evident, since the devil casts nobody into prison but by the instrumentality of human agents.

Resistance to these, therefore, must be considered as lawful resistance to the devil himself – that is to say, laudable, rational, and praiseworthy in all who would obey God rather than men. The saints, indeed, being the subjects of that enmity which was put between the seed of the woman and the seed of the or would not submit to Pharaoh’s authority, requiring them to destroy their son, but hid him for a number of months, in order that his life might be preserved – and in doing this we are told, that they were not afraid of the king’s commandment. The same firmness was found in Daniel and his companions in Babylon. They would neither worship Nebuchadnezzar’s golden image, nor cease to pray to God at the mandate of Darius.

New Testament believers were also actuated by the same principle. When Peter and John were imprisoned for teaching the people, and preaching through Jesus the resurrection from the dead, and were commanded not to speak at all, nor teach in the name of Jesus, they boldly remonstrated and refused to obey in the following spirited terms. – “Whether it be right in the sight of God to hearken unto you more than unto God, judge ye. For we cannot be speak the things which we have seen and heard.” (Acts iv. 19, 20.)

If the Apostle Paul inculcates unqualified submission to Caesar, in the passage before us, as has been by some alleged, he must have been a consummate hypocrite and deceiver, utterly unworthy of attention, and refusing to do himself what he imposed upon others. The civil powers under which he lived, had prohibited, under the severest penalties, the publication of the Gospel: yet he says, “necessity is laid upon me; yea, woe is unto me if I preach not the Gospel.”

iver%2C+utterly+unworthy+of+attention%2C+and+refusing+to+do+himself+what+he+imposed+upon+others.+The+civil+powers+under+which+he+lived%2C+had+prohibited%2C+under+the+severest+penalties%2C+the+publication+of+the+Gospel%3A+yet+he+says%2C+%E2%80%9Cnecessity+is+laid+upon+me%3B+yea%2C+woe+is+unto+me+if+I+preach+not+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+The+Belfast+Covenanter%2C+%E2%80%98A+Dissertation+on+Rom.+xiii.+1-6.%E2%80%99+Covenanter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc37d1a88e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/dc37d1a88e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/01/the-belfast-covenanter-resisting-the-devil-means-resisting-tyranny/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>And now that so much as I have said is required, active Obedience to legal, civil Authority to all Magistrates in their legal commands in civil matters; or at least passive yielding to the penalty of the Laws, in case of not obeying actively; and neither further then to legal commands of legal Authority, appears by the Apostle’s reason in this 1. verse. For there is no power but of God; which he redoubles in a second phrase, The powers that be are ordained of God, or under God … Every soul must be under their order … because they all are ordered by God under him, his deputies and vicegerents in their order and degree, higher and highest.

This is true of all powers, and therefore to all must subjection be performed. And to none hath God ordered or ordained any Authority but legal. Which as none will deny (no not the Doctor himself) of other Governors besides the supreme: So can none with reason affirm, that any hath more authority then the Laws, whether special or general, written or unwritten, have allotted them. Which Laws God ratifies (being not against his) and so the Authority according to them.

And this our Doctor also confesses (in sense) in more places then one of his Book, for active Obedience, that no more is due, but according to the Laws of God, and the established laws of the Land. Only he argues for passive obedience beyond this, every where. 1. Because he argues against resistance even of Tyranny. But in a word to refute this from the Apostle’s reason in the first verse.

If I be bound to be subject to tyranny, (or to suffer violence of a tyrant) by virtue of the commandment here. Then tyranny is the Ordinance of God, or Magistrates have power ordained of God to use tyrannous violence (for thus the Apostle argues for subjection from God’s ordaining the power) But this is false. Ergo, so is that, that I should be bound to suffer tyrannous violence. …

But I say again, that by all the foregoing context, and the reason from God’s Ordinance in the second verse: The prohibition of blaming of resistance, goes no further, then, of legal commands of legal authority. The Doctor will not (doth not) say that the most peremptory, or obstinate refusing to obey actively tyrannous and illegal commands is resistance. By what authority then of the Text or context will he stretch the prohibition to refusing to suffer tyrannous violence?

Or how does any resist unlawfully (though by Arms) when unlawful violence is offered him? which God no where gave authority to use to him, nor ever commanded him to yield unto? In a word, till God’s Ordinance can be proved allowing tyranny (which can never be) or undeniably ordaining a man to suffer it, which is no where in his word (I mean the extremity of tyranny depriving of life, or so) though often it is so in his providence, when he affords no means of resistance: This Text of the Apostle will no way condemn the resisting by Arms tyrannous and illegal outrageous violences. Besides all that, the context following refuses this sense of the Doctor, as I have already shewed. …

Then besides all that hath been said on the Text and context, I only add this: That then every meanest Officer (if wicked) may ruin the whole neighbourhood, because he may not be resisted by Arms, who yet will bring Arms to act his villanies. And so the blessed Ordinance of God in Magistracy shall turn to the greatest curse to Mankind (the best and most conscientious of them) that can be imagined, in regard of outward sufferings, and general confusion.

It remains therefore that as the Apostle in the following verses, banishes tyranny out of the context, describing every where a righteous Magistrate, and not a tyrant: So tyranny is to be banished out of the interpretation of this Text, which allows him that is a tyrant, no security, that he shall be endured, and not resisted even with Arms. Though it doth (and that most justly and necessarily) secure a just ruling Prince or Magistrate from all resistance, even when he punishes most severely according to Law and justice, upon the heaviest guilt of being found resisters against God (that resist such a rule) and the heaviest penalty of damnation.</p></blockquote>

<blockquote><p>Very great surely is the light of the truth in this our age, which through God’s singular gift hath been found out in the holy scriptures by some faithful servants of Christ, and spreading abroad far and wide hath shined forth unto us as the sun in the firmament. But I pray, what and how many mists of errors, how divers and black clouds of heresies have been stirred up and raked out of the depth of hell by no small number of verletts and ministers of the devil to cast a darkness over this heavenly light?

I speak not now of tyrants, which ever have and yet doe employ and bend all their swords, all their power and the very force and might of their authority to this: that these candlesticks (of brittle earth I confess) wherein any of this light remaineth and shineth being bruised and broken by their iron-blows, the whole light of the divine wisdom (if God so pleased) might be utterly put out and extinguished and in place thereof that infernal darkness fetcht again from hell might succeed and bear the whole sway.

For this very cause, what in these our wretched times hath been done, what and what manner of slaughters of an infinite number of men, in many places committed, and in many other places attempted more then once, we have yet in fresh memory. And what and by whom the devil lately assayed in those valleys of yours. Though by God’s mighty hand defending you, the slaughter succeeded not to the wish of those ungodly wretches, your self know better then we do.

And now also what that ever-busy Satan is for the same intent continually attempting, what devises he purposeth, what treacheries he studies, what weapons he prepareth, what wars he brocheth against godly princes and magistrates, who desire to have this heavenly light to shine in their dominions and labour to spread the same far and wide into the whole world, the Lord himself knoweth, who dwelleth in the heavens, who also is wont to scatter the wicked counsels of the ungodly and to disperse them as vain smokes through his incredible love and mercy towards us, when it is most expedient for his church and when tyrants do look for nothing less then a disappointment of their intents which they so long and watchfully provided for.</p></blockquote>

</figure><figure class="quote" id="q-c06009f30e" data-kw="">
<blockquote><p>Assuredly, [it is clear] that peoples did not in the first instance originate from rulers, but whatever peoples desired to be ruled by a single monarch or by chief men elected by them were anterior to their rulers. Hence it follows that peoples were not created for the sake of rulers, but on the contrary the rulers for the sake of the people, even as the guardian is appointed for the ward, not the ward for the guardian, and the shepherd on account of the flock, not the flock on account of the shepherd.

This proposition is not merely obvious in itself but may be corroborated by the history of nearly all nations, So much so that God Himself, although he had elected Saul to substitute him for Samuel in accordance with the desires of the people, yet willed that he should be chosen and accepted as King by the suffrages of the people. Thus David, although he had first been chosen as king by God Himself, yet would not undertake the administration of the Kingdom except he had first been confirmed by the suffrages and unfettered concord of the tribes of Israel.

On similar grounds it happened even afterwards that though the kingship had by the will of God been granted to the family of David, yet in the last resort that one from the descendants of David should rule whom the people had approved and none other (unless perchance something irregular befell to prevent it as when now the Egyptian and then the Syrian kings ruled as tyrants over the people of God).

So much so that this kingship was hereditary as far as the family was concerned, but elective as regards the individual incumbent, i.e. dependent upon the election of the people. This may be seen from the histories of Solomon, Rehoboam, Joas, Ocias and Jehoahaz. For this reason also Absalom grasped the occasion of usurping his father’s throne. For thus Hushai the friend of David answered him: “Nay, but whom the LORD, and this people, and all the men of Israel have chosen, his will I be, and with him will I abide.”

… [T]he people existed before there was any magistrate and that the magistrates were made for the sake of the people and not vice versa, the people for the sake of the magistrate.</p></blockquote>

</figure><figure class="quote" id="q-d62591d9b1" data-kw="">
<blockquote><p>Since these principles which were demonstrated above concerning the origin of kings and other rulers have been established, it follows that they are not legitimate rulers who by force or deceit usurp that authority which by no right belongs to them. Of such tyrants there are two kinds: for some, in violation of the laws laid down and received, usurp tyranny over their fellow-citizens, as Julius Caesar under the feigned title of perpetual dictator took possession of the Roman commonwealth; and many other tyrants, particularly in Greece, crushed the liberty of their country.

Others however, not content with that absolute power which they rightfully acquire over their own people, extend their dominions at the cost of their neighbours’ liberty and increase them by means of fortified boundary-lines; for this reason have monarchies ever since the origin of the world achieved such wide dominions; of this the sacred writings offers us an example in Nimrod, as we also see that in this way the Israelites were generally oppressed by the neighbouring peoples.

Hence since those tyrants had no lawful right over the people of God, I maintain that the Israelites were free not merely to disobey the sinful commands of these peoples but even to set a just defense against their unjust violence, and that therefore the leaders of the tribes (of Israel) did a grievous wrong whenever they omitted to oppose the foreign foe with united courage and strength in defense of the liberty of their country, provided that the occasion for opposing him presented itself; for it admits of no doubt that even private individuals are bound by the law of both God and men to succour with all their power their country when oppressed and in distress, especially however when its religion and liberty are simultaneously endangered. For it was a true remark which the captive pirate dared to utter when he was dragged before Alexander; he declared that he differed in no way from (the king) but that the latter plundered the world with a multitude of ships whereas he did so with but a single vessel.</p></blockquote>

<blockquote><p>I. The first thing I have to show is the general excellence of freedom.

On this point some readers may think it needless to say anything: they imagine that all men know the value of freedom, and that to dwell on it is a mere waste of time. I do not agree with such people at all. I believe that myriads of Englishmen know nothing of the blessings which they enjoy in their own land: they have grown up from infancy to manhood in the midst of free institutions. They have not the least idea of the state of things in other countries: they are ignorant alike of those two worst forms of tyranny,—the crushing tyranny of a cruel military despot, and the intolerant tyranny of an unreasoning mob. In short, many Englishmen know nothing of the value of liberty, just because they have been born in the middle of it, and have never been for a moment without it.

I call then on every one who reads this paper to remember that liberty is one of the greatest temporal blessings that man can have on this side the grave. We live in a land where our bodies are free. So long as we hurt nobody’s person, or property, or character, no one can touch us: the poorest man’s house is his castle. We live in a land where our actions are free. So long as we support ourselves, we are free to choose what we will do, where we will go, and how we will spend our time. We live in a land where our consciences are free. So long as we hold quietly on our own way, and do not interfere with others, we are free to worship God as we please, and no man can compel us to take his way to heaven. We live in a land where no foreigner rules over us. Our laws are made and altered by Englishmen like ourselves, and our Governors dwell by our side, bone of our bone and flesh of our flesh.

In short, we have every kind of freedom to an extent which no other nation on earth can equal. We have personal freedom, civil freedom, religious freedom, and national freedom. We have free bodies, free consciences, free speech, free thought, free action, free Bibles, a free press, and free homes. How vast is this list of privileges! How endless the comforts which it contains! The full value of them can never perhaps be known. Well said the Jewish Rabbins in ancient days: ‘If the sea were ink and the world parchment, it would never serve to describe the praises of liberty.’

The want of this freedom has been the most fertile cause of misery to nations in every age of the world. What reader of the Bible can fail to remember the sorrows of the children of Israel, when they were bondmen under Pharaoh in Egypt, or under Philistines in Canaan? What student of history needs to be reminded of the woes inflicted on the Netherlands, Poland, Spain, and Italy by the hand of foreign oppressors, or the Inquisition? Who, even in our own time, has not heard of that enormous fountain of wretchedness, the slavery of the Negro race? No misery certainly is so great as the misery of slavery.

To win and preserve freedom has been the aim of many national struggles which have deluged the earth with blood. Liberty has been the cause in which myriads of Greeks, and Romans, and Germans, and Poles, and Swiss, and Englishmen, and Americans have willingly laid down their lives. No price has been thought too great to pay in order that nations might be free.

The champions of freedom in every age have been justly esteemed among the greatest benefactors of mankind. Such names as Moses and Gideon in Jewish history, such names as the Spartan Leonidas, the Roman Horatius, the German Martin Luther, the Swedish Gustavus Vasa, the Swiss William Tell, the Scotch Robert Bruce and John Knox, the English Alfred and Hampden and the Puritans, the American George Washington, are deservedly embalmed in history, and will never be forgotten. To be the mother of many patriots is the highest praise of a nation.

The enemies of freedom in every age have been rightly regarded as the pests and nuisances of their times. Such names as Pharaoh in Egypt, Dionysius at Syracuse, Nero at Rome, Charles IX. in France, bloody Mary in England, are names which will never be rescued from disgrace. The public opinion of mankind will never cease to condemn them, on the one ground that they would not let people be free.</p></blockquote>

<blockquote><p>2. SCRIPTURE prophecies evidently referring to New Testament times, mention its [social covenanting’s] approbation, Isaiah xix. 18. “In that day,” (viz the gospel day or New Testament times) “shall five cities in the land of Egypt speak the language of Canaan, and swear to the LORD of hosts.” And in the 21 verse, we are told, “The LORD shall be known to Egypt, and the Egyptians shall know the LORD – and shall do sacrifice and oblation.” A collateral or, at least, a consequential part of their character is, that, “they shall vow a vow unto the LORD, and perform it.” This is predicated as a national deed, done in a collective, social or corporate capacity.

Its general practice among the Christianized Gentiles, their mutual co-operation in the cause of God, and the smile of divine approbation which they shall enjoy in so doing, are beautifully painted out in the 23, 24, &amp; 25 verses, “In that day shall there be a high-way out of Egypt to Assyria; and the Egyptian into Assyria: and the Egyptians shall serve with the Assyrians. In that day shall Israel be the third with Egypt and with Assyria, even a blessing in the midst of the land. Whom the LORD of hosts shall bless, saying, Blessed be Egypt my people, and Assyria the work of my hands, and Israel mine inheritance.</p></blockquote>

<blockquote><p>1. IT [social covenanting] was expressly commanded under the Old Testament dispensation, Psalm lxxvi. 11. “Vow, and pay unto the LORD your God.” It behoves those, who deny its obligation in New Testament times, to prove that it was not, in its nature, a moral duty, but belonged to the ceremonial law, or judicial policy of the Jews. But this I presume, will not be easily done. If it was a type, where is its antitype? What peculiarity was there, in the circumstances of the Jews, rendering it expedient for them, to bind themselves to serve the Lord, while Christians are exempted from every such obligation?

IT seems to be the bent of the present generation, to get rid of all the obligations contained in the Old Testament. These deistical Christians (if I may be allowed the expression) resemble the children of old, who spoke half in the language of Canaan, and half in the language of Ashdod. But the Old and New Testament ought to be considered as the two Statute-books of heaven. All the Statutes contained in the former book, remain binding upon the conscience, if not repealed in the latter, either by express precept, necessary deduction, or approved example. Therefore, before the doctrine of covenanting be rejected, it ought to be proved, that it has been abrogated by the authority of that divine Legislator who first appointed it. It would be but reasonable to allow us the same privilege, in quoting the statutes of heaven, that every lawyer has in referring to acts of Parliament. Though these were made in the reign of Alfred the Great, and thirty folio volumes intervened between that in which these acts are contained, and the one in which those of the present age are recorded, yet, if they are not repealed by some subsequent act, they remain obligatory on the nation. By these the most important suits will be decided. Why should we deny the same authority to the unrepealed statutes of the King of nations?</p></blockquote>

<blockquote><p>7. The Fugitive Slave Law. — The following preamble and resolutions were adopted:

Whereas, It is our duty as witnesses for Christ to bear testimony against the evils that prevail — and

Whereas, We should “Open our mouth for the dumb in the cause of all such as are appointed to destruction” — and to “Open our mouth, judge righteously, and plead the cause of the poor and needy, to remember those that are in bonds as bound with them.” Therefore—

1. Resolved, That we regard slavery with abhorrence, as a most heinous sin and an unmitigated political and social evil. We are convinced that depriving men of their right to themselves — the power of abrogating the marriage relation — of separating parents and their youthful offspring — and possessing an absolute power over the bodies and souls of men, can never exist without heinous criminality, and no conceivable circumstances can excuse any in the practice of this God defying sin. — Hence we regard immediate emancipation upon the soil as the only mode of bringing slavery to a peaceful end and of complying with the requisitions of God’s law.

2. Resolved, That the fugitive slave law is utterly repugnant lo every principle of justice and in direct opposition to God’s express law.—Its accordance in its main elements with the Constitution of the United States renders it the more worthy of our detestation, and more clearly shows that its passage and enforcement will bring desolating judgments upon our land. Those officers who are commissioned to carry out its provisions are not employed in promoting the legitimate ends of civil government, the glory of God nor the good of men, but are acting in disobedience to God, and are entitled to no respect or obedience, but ought to be resisted by all means that accord with the law of God.

3. Resolved, That to inculcate obedience or conscientious submission to this law or respect for the officers of law in enforcing it, encourages men in their callous heartlessness respecting fugitives from bondage — countenances oppression — brings disgrace upon the church and gospel of Christ, and leads men to disregard the plainest provisions of God’s law, which commands all to “relieve the oppressed,” and forbids to bewray him that wandereth; and we warn all under our charge to beware of complying with the provisions of this law, or of giving assistance to those who would return to cruel bondage those who have escaped from their oppressors.

4. Resolved, That every minister who would not be false to his vows, false to the poor and needy, and false to the claims of the King of nations, should, especially in these times of opposition to the rights of God and of man, be careful to pray in public for the enslaved, preach against slavery, and warn against the sins of exercising the elective franchise and holding office under a slaveholding constitution and Government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1851, pp 118-19</span></figcaption>

<blockquote><p>146. What is a COVENANT?

A Covenant is an agreement between two parties, on certain conditions.

<blockquote><p>III. Nations are bound to provide for the support of religion because they are moral persons.

There are duties peculiar to individuals, and which societies are incapable of performing; but all duties which societies arc capable of performing are as obligatory upon them as upon individuals. It is the duty of individuals to promote the interests of religion by every proper and accessible means. To furnish pecuniary aid is one of the most obvious means of supporting religion. The ordinances of the gospel cannot be maintained without such means; and nations being moral persons are bound to see that such means arc provided. “If all men” says Vattel, “are bound to serve God, the entire nation in her national capacity is doubtless obliged to serve and honor him.” It is unquestionably the duty of individuals to give, and that liberally, for the maintenance of the ordinances of religion; but certainly it is not for the advantage of religion that its support be wholly dependent upon spontaneous individual liberality. This is too uncertain, and often too capriciously furnished to be safely relied on. Hence the necessity of a national supervision to provide means for the regular administration of the ordinances of religion. This national supervision does not interfere with individual obligation. The former from the nature of the case must be a general provision: this leaves ample scope in the best supposable case, for the exercise of individual liberality. An analogous case illustrates this. A general provision is made by law for the support of the poor; but sufficient room is left notwithstanding for the promptings of individual charity, enough still to excite the emotions of human sympathy. So is it in the case of religion, while a general provision is made by a nation for its support there will still remain sufficient opportunity for individual obligation.</p></blockquote>

<blockquote><p>Covenanters held, and still hold, that in lands enjoying the light of Divine Revelation, nations, as nations, are to be guided by the supreme standard of right and wrong […] and Covenanters hold that whatever regulation made in Church or State, which is not based on a “thus saith the Lord,” is not, properly speaking, a law at all, but a tyranny! Of course, whatever is in flat opposition to the will of the Great and the only Legislator of the Universe, cannot be a rule of conduct – it must be, and it is, a tyranny […]</p></blockquote>

<blockquote><p>No more baseless fantasy ever entered the mind of man than that the Church and State can be completely separate! […] In good sooth, I can look upon it as little less than a species of infatuation, to teach that Church and State must be entirely separated – because, if the Church cannot reform and Christianize the State, then, undoubtedly, the State will tyrannise over and persecute the Church! Does the British Constitution let the United Secession Church alone? Indeed it does no such thing! That Constitution binds down every minister and member of that Church to swear, if called upon, that Christ is not the Head of the Church, but that a man, a woman, or a child, is the Head of the Church! Does the constitution and government of the United States of America – where there is no Established Church – let the Church alone? Indeed it does not; for, in America the Sabbath is systematically profaned, so that ministers and church-goers can scarcely “hear their ears,” in some cases, so loud is the unholy din of the freebooters on the domain of the Fourth Commandment, who, intent on business or pleasure, tramp along the streets and highways!</p></blockquote>

<blockquote><p>Back in the early days of this blog, I was deeply committed to Libertarian Theology (a Christianized form of small government political ideology), which restricts the state largely to crime and defence. This position is the one held by most theonomists today, hence they write against the civil magistrate funding the church, welfare, healthcare, and education. Those of you who read the first edition of my book, A Conquered Kingdom, will know that this was the position that I defended and that I argued that this was compatible with the establishment principle as enshrined in the original Westminster Confession of Faith.

Over time, however, I began to increasingly see that this position was totally untenable. This post will reveal that Libertarian Theology is incongruous with the Scottish theory of the establishment principle, and, consequently, with the Westminster Confession of Faith that enshrines this principle as part of our subordinate standards. Whether or not Libertarian Theology is biblical is a debate for another day; our present objective is only to highlight the reality that it is contra-confessional and in opposition to the Covenanted Reformation. The sources used here are all available on the internet, so the readers can examine the documents for themselves.

Although the Scottish Reformers and Covenanters were theonomists, in the sense that they believed in the abiding validity of the majority of the penal sanctions, they did not preach a gospel of small government. First, the Second Book of Discipline of the Church of Scotland, which was approved by the General Assembly in 1578 (when Andrew Melville was moderator), makes it clear that the civil magistrate is to fund the church and the provision of social services: ‘To see that sufficient provision be made for the ministerie, the schooles, and the poore: and if they have not sufficient to awaite upon their charges, to supply their indigence even with their own rents, if need require.’ [1]

This teaching was upheld in the National Covenant of Scotland (1580, later reaffirmed in 1638), in which the Covenanters swore to ‘join ourselves willingly, in doctrine, faith, religion, discipline, and use of the holy sacraments, as lively members of the same in Christ our head: promising and swearing, by the great name of the LORD our GOD, that we shall continue in the obedience of the doctrine and discipline of this kirk’. [2] It was also upheld in the Solemn League and Covenant of England, Scotland, and Ireland in 1643; in the first article of this covenant they swore to labour for ‘the preservation of the reformed religion in the Church of Scotland, in doctrine, worship, discipline, and government, against our common enemies’. [3]

Obviously, common sense should tell us that when the Covenanters’ swore to uphold the discipline of the kirk, they meant the system enshrined in the Second Book of Discipline. Since this document stipulates that the civil magistrate is to fund the church, education, and works of mercy then we are forced to conclude that Libertarian Theology, which denies that the Christian magistrate is commanded or even permitted to do such things, is contrary to the Covenanted Reformation. Ergo, it is inconsistent for a Covenanter to be a Libertarian.

For further confirmation of the claim that the National Covenant is upholding the Second Book of Discipline, we find Thomas Houston arguing that the Church of Scotland’s First and Second Books of Discipline ‘have always been regarded with approbation in the Covenanting Church, and the latter of which, as Dr [Thomas] McCrie testifies, was sworn to in the National Covenant, and is to be considered of standing authority in the church’.[3] Modern Reformed Presbyterians need to take note of this, because if we are going to continue to claim to be the Church of the covenants, then we better make sure we know what precisely it is that the covenants teach. For my part, I only found out that the covenants upheld the Second Book of Discipline a few weeks ago. This is despite the fact that I have been reading Covenanter history and literature for nine years.

However, this raises another question, namely, ‘can one subscribe to the original Westminster Confession and believe in small government?’ Without presently going into too much detail, the answer to this should be pretty obvious to those familiar with the theoretical framework within which the Westminster Confession was written. It must be pointed out that the Westminster Confession is a direct product of the covenants, National and Solemn League. The first article of the latter covenant binds the Covenanters to compile a uniform confession of faith. Are we seriously to believe that the Confession which was subsequently produced by the Westminster Assembly and adopted by the General Assembly of the Church of Scotland was designed to accommodate views which the Covenanters had rejected in the covenants? To affirm this makes no sense at all. Conversely, we find that when the Scottish General Assembly adopted the Westminster Assembly’s Form of presbyterial church government, they continued to profess their adherence to the ‘books of Discipline’ of their church. [5] Instead, the reality must be faced: Libertarianism is unconfessional error and to embrace it is a violation of the covenants. In light of this, we must conclude that the Scottish Covenants and the Westminster Standards are Social Theocratic documents, which advocate a more interventionist state than the small government views of many conservatives and Libertarians. We could make other arguments to further substantiate this point, but these are sufficient for the time being. [6]

[1] The Second Book of Discipline of the Church of Scotland (1578), From the True Covenanter website (http://www.truecovenanter.com/kirkgovt/scotland_kirk_books_of_discipline_1621.phtml?scotland_kirk_books_of_discipline_1621=book2) (accessed 10 Dec. 2011).

[2] National Covenant of Scotland (1580; 1638), From the Covenanter website (http://www.covenanter.org/Westminster/nationalcovenant.htm) (accessed 10 Dec. 2011).

[3] Solemn League and Covenant (1643), From the Covenanter website (http://www.covenanter.org/Westminster/solemnleague.htm) (accessed 10 Dec. 2011).</p></blockquote>

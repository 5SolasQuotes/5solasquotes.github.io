<div class="actions"><button class="copy" data-copy="“§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.”

— Richard Baxter, Christian Directory (London, 1673), pt. 4, ch. 19, title 2, p. 116-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A713.+Question+8%3A+May+I+give+money+to+a+judge+or+justice+or+court-officer+to+hire+him+to+do+me+justice+or+to+keep+him+from+doing+me+wrong+or+to+avoid+persecution%3F+Answer%3A+You+may+not%2C+in+case+your+cause+be+bad%2C+give+anything+to+procure+injustice+against+another%3B+no+nor+speak+a+word+for+it+nor+desire+it%3A+This+I+take+as+presupposed.+You+may+not+give+money+to+procure+justice+when+the+law+of+the+land+forbids+it+and+when+it+will+do+more+hurt+accidentally+to+others+than+good+to+you%3A+when+it+will+harden+men+in+the+sin+of+bribery+and+cause+them+to+expect+the+like+from+others.+But+except+it+be+when+some+such+accidental+greater+hurt+does+make+it+evil%2C+it+is+as+lawful+as+to+hire+a+thief+not+to+kill+me%3B+when+you+cannot+have+your+right+by+other+means%2C+you+may+part+with+a+smaller+matter+for+a+greater.+%C2%A714.+Question+9.+But+if+I+make+such+a+contract%2C+may+the+other+lawfully+take+it+of+me%3F+Answer%3A+No%3A+for+it+is+now+supposed+that+it+is+unlawful+on+his+part.+%C2%A715.+Question+10.+But+if+under+necessity+or+force+I+promise+money+to+a+robber+or+a+judge+or+officer%2C+am+I+bound+to+perform+it+when+necessity+is+over%3F+Answer%3A+You+have+lost+your+own+propriety+by+your+covenant+and+therefore+must+not+retain+it.+But+he+can+acquire+no+right+by+his+sin%3B+and+therefore+some+say+that+in+point+of+justice+you+are+not+bound+to+give+it+him%2C+but+to+give+it+to+the+magistrate+for+the+poor.+But+yet+prudence+may+tell+you+of+other+reasons+a+fine+to+give+it+the+man+himself%2C+though+justice+bind+you+not+to+it%3A+as+in+case+that+else+he+may+be+revenged+and+do+you+some+greater+hurt%2C+or+some+greater+hurt+is+any+other+way+likely+to+be+the+consequent%2C+which+it+is+lawful+by+money+to+prevent.+But+many+think+that+you+are+bound+to+deliver+the+money+to+the+thief+or+officer+himself%2C+because+it+is+a+lawful+thing+to+do+it%2C+though+he+have+no+just+title+to+it%3B+and+because+it+was+your+meaning%2C+or+the+signification+of+your+words+in+your+covenant+with+him.+And+if+it+were+not+lawful+to+do+it%2C+it+could+not+be+lawful+to+promise+to+do+it%3A+otherwise+your+promise+is+a+lie.+To+this%2C+those+of+the+other+opinion+say+that+as+a+man+who+is+discharged+of+his+promise+by+him+that+it+was+made+to+is+not+to+be+accounted+false+if+he+perform+it+not%2C+so+is+it+as+to+the+thief+or+officer+in+question%2C+because+he+having+no+right%2C+is+to+you+as+the+other+that+has+quit+his+right.+And+this+answer+indeed+will+prove+that+it+is+not+strict+injustice+not+to+pay+the+money+promised%3A+but+it+will+not+prove+that+it+is+not+a+lie+to+make+such+a+promise+with+an+intent+of+not-performing+it%2C+or+that+it+is+not+a+lie+to+make+it+with+an+intent+of+performing+it%2C+and+not+to+do+it+when+you+may.+Though+here+a+Jesuit+will+tell+you+that+you+may+say+the+words+of+a+promise+with+an+equivocation+or+mental+reservation%2C+to+a+thief+or+persecuting+magistrate+%28of+which+see+more+in+the+chapters+of+lying%2C+vows+and+perjury%29.+I+am+therefore+of+opinion+that+your+promise+must+be+sincerely+made+and+according+to+the+true+intent+of+it%2C+you+must+offer+the+money+to+the+thief+or+officer%3B+except+in+case+the+magistrate+forbid+you%2C+or+some+greater+reason+lie+against+it%2C+which+you+foresaw+not+when+you+made+the+promise.+But+the+offender+is+undoubtedly+obliged+not+to+take+the+money.+%C2%A716.+The+same+determination+holds+as+to+all+contracts+and+promises+made+to+such+persons+who+by+injurious+force+constrained+us+to+make+them.+There+is+on+us+an+obligation+to+veracity%2C+though+none+to+them+in+point+of+justice%2C+because+they+have+no+proper+right%3B+nor+may+they+lawfully+take+our+payment+or+service+promised+them.+And+in+case+that+the+public+good+unexpectedly+cross+our+performance%2C+we+must+not+perform+it%3A+Such+like+is+the+case+of+conquerors%2C+and+those+that+upon+conquest+become+their+vassals+or+subjects+upon+unrighteous+terms.+But+still+remember%2C+that+if+it+be+not+only+a+covenant+with+man%2C+but+a+vow+to+God%2C+which+makes+him+a+party%2C+the+case+is+altered%2C+and+we+remain+obliged.+%C2%A717.+Question+11.+But+may+I+promise+the+thief+or+bribe-taker+to+conceal+his+fault%3F+and+am+I+obliged+to+the+performance+of+such+a+promise%3F+Answer%3A+This+is+a+promise+of+omitting+that+which+else+would+be+a+duty.+It+is+ordinarily+a+duty+to+reveal+a+thief+and+bribe-taker+that+he+may+be+punished.+But+affirmatives+bind+not+ad+semper+%5Bto+all+times%5D%3A+no+act+%28especially+external%29+is+a+duty+at+all+times%3A+therefore+not+this+of+revealing+an+offender%E2%80%99s+fault.+And+if+it+be+not+always+a+duty%2C+then+it+must+be+none+when+it+is+inconsistent+with+some+greater+benefit+or+duty%3A+For+when+two+goods+come+together%2C+the+greater+is+to+be+preferred.+Therefore+in+case+that+you+see+in+just+probability+that+the+concealment+of+the+sinner+will+do+more+hurt+to+the+commonwealth+or+the+souls+of+men+than+the+saving+of+your+life+is+like+to+do+good%2C+you+may+not+promise+to+conceal+him%3A+or+if+you+sinfully+promise+it%2C+you+may+not+perform+it.+But+in+case+that+your+life+is+likely+to+be+a+greater+good+than+the+not+promising+to+conceal+him%2C+then+such+a+promise+is+no+fault%3B+because+the+disclosing+him+is+no+duty.+But+to+judge+rightly+of+this+is+a+matter+of+great+difficulty.+If+it+be+less+than+life+which+you+save+by+such+a+promise%2C+it+oft+falls+out+that+it+is+a+lesser+good+than+the+detecting+of+the+offence.+%C2%A718.+But+it+will+here+be+said%2C+%E2%80%98If+I+promise+not+to+conceal+a+robber%2C+I+must+conceal+him+nevertheless%3B+for+when+he+has+killed+me%2C+I+cannot+reveal+him%3B+and+I+must+conceal+the+bribe-taker%2C+for+till+I+have+promised+secrecy%2C+I+cannot+prove+him+guilty.+And+he+that+promises+to+forbear+a+particular+good+action+whilst+he+lives%2C+does+yet+reserve+his+life+for+all+other+good+works%3A+whereas+if+he+die%2C+he+will+neither+do+that+nor+any+other.%E2%80%99+But+this+case+is+not+so+easily+determined%3A+If+Daniel+die%2C+he+can+neither+pray+nor+do+any+other+good+on+earth.+And+if+he+live%2C+he+may+do+much+other+good+though+he+never+pray%3A+and+yet+he+might+not+promise+to+give+over+praying+to+save+his+life.+I+conceive+that+we+must+distinguish+of+duties+essential+to+the+outward+part+of+Christianity%2C+or+of+constant+indispensable+necessity%2C+and+duties+which+are+alterable+and+belong+only+to+some+persons%2C+times+and+places%3A+Also+between+the+various+consequents+of+omissions.+And+I+conceive+that+ordinarily+a+man+may+promise+for+the+saving+of+his+life+that+he+will+forbear+a+particular+alterable+duty+or+relation%3A+as+to+read+such+a+commentary%2C+to+speak+with+such+a+minister%2C+to+be+a+magistrate+or+a+minister%2C+etc.+in+case+we+have+not+before+bound+ourselves+never+to+give+over+our+calling+till+death%3A+and+in+case+that+the+good+which+will+follow+our+forbearance+is+likely+%28to+a+judicious+person%29+to+be+greater+than+the+evil.+But+no+man+may+promise+to+omit+such+a+duty+as+God+has+made+necessary+during+life%3A+as+not+to+love+God+or+fear+or+trust+Him%3A+not+to+worship+Him+and+call+upon+Him+and+praise+Him%3A+nor+to+do+good+to+men%E2%80%99s+souls+or+bodies+in+the+general%3A+or+not+to+preach+or+pray+while+I+am+a+minister+of+Christ%2C+or+not+at+all+to+govern+while+you+are+a+governor.+For+all+these+contradict+some+former+and+greater+promises+or+duties.+Nor+may+you+omit+the+smallest+duty+to+save+your+life+at+such+a+time+when+your+death+is+likely+to+do+more+good+than+your+life+would+do+without+that+one+duty.+Apply+this+to+the+present+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Directory+%28London%2C+1673%29%2C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+116-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca12e1cddd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ca12e1cddd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=%C2%A713.%20Question%208%3A%20May%20I%20give,Apply%20this%20to%20the%20present%20case." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>

<blockquote><p>If it be just to do, which thou through constraint hast promised, it is just also for thee to promise by oath to do it. For what we may lawfully do, the same also we may lawfully promise by an oath to do. As, if a man falling into the hands of a thief, should be required by the thief to give a piece of money for the redeeming of his life; verily he not only may, but also ought, if he be able, to perform that which the thief requires. And if this be lawfully performed unto a thief, it is lawfully also performed unto him by an oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion… tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. ‘Whether all oaths are to be kept’</cite>, p. 919</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If it be just to do, which thou through constraint hast promised, it is just also for thee to promise by oath to do it. For what we may lawfully do, the same also we may lawfully promise by an oath to do. As, if a man falling into the hands of a thief, should be required by the thief to give a piece of money for the redeeming of his life; verily he not only may, but also ought, if he be able, to perform that which the thief requires. And if this be lawfully performed unto a thief, it is lawfully also performed unto him by an oath.”

<blockquote><p>Upon mature deliberation we did perceive that the wise and holy providence of God… has… disabled that [former] way of government and all that depends thereon, from affording any protection and preservation to any of the inhabitants of this land; and has enabled another form of government to afford it; Wherefore we did conclude from the light of nature, from the judgement of the learned, from the practice of Christians in former ages, from our own principles and from our former engagements that it was the will of God we should quietly and peaceably set ourselves in our places and callings to live under this government and to submit to it in such things as are imposed upon or required of us [such as the oath of Engagement] by the powers which are in actual possession, being things in themselves lawful and necessary, or expedient to the preservation of ourselves and others… Fourthly, because we clearly conceive that there is no difference at all between the submission which the authors of the Proposals themselves rightly acknowledge to be due to the powers which are in actual possession and that which is required by the subscription to this Engagement: for seeing the express words of the Engagement give no ground to interpret the act of subscription beyond that which is a clear and known duty: therefore we think it not (as to our consciences) warrantable to interpret it otherwise; but we rather think it contrary to a known duty to make of a thing in itself lawful and necessary at this time, any scrupulous interpretation beyond what the words import; or to suspend obedience from a duty upon the conjecture of something which may be thought undutiful, when that which is to our conscience a known duty is apparent: Upon which ground we declare that we trouble not ourselves, nor do we think it lawful to stagger others in their thoughts with the inferences which the proposers make upon the subscription of the Engagement with reference to these queries [of theirs]: As how far it does imply an approbation of the manner of the present establishment, whether as effected by a full and free authority yea or no? whether yea or no, it does imply an active concurrence and a ratifying consent of the people thereunto further than what has been already acknowledged to be due to the powers in actual possession by all that are in subjection under them and depend upon their protection? and whether yea or no, and how far it fastens an obligation to act to the strengthening and promoting of the government which is at present or may be hereafter established by the advantage of possible power? We say that to trouble our own or other men’s weaker consciences with these or such like doubtful conjectures to color the suspension of our own, or occasion the aversion of other men’s affections from yielding obedience to a clear and confessed duty, is not only preposterous and contrary to the aim of healing breaches, and of advancing a public good in this time of distraction, but inconsistent (as to our reason) with the obvious meaning of the words which are to be subscribed and disagreeing (as to our affections) with the charity due no less to superiors than to other men, which is not to think evil when good may be thought of them. And lastly, it is opposite (as to our spirits) unto that wisdom which is from above (the rule of our walking) teaching us to have pure and peaceable thoughts in all our actings, to perform duties in godly simplicity and without worldly wisdom, to be gentle and easily intreated, to do good works without partial scrupulosity and without hypocrisy. And upon these principles of true wisdom (which we humbly conceive are not laid to heart by our brethren in the third paragraph of their Proposals) we professedly wave all those scruples and the stumbling-blocks which they have laid to themselves and wherewith they have puzzled others, upon this clear account: that whenever the consideration of these things, which are said to be implied in the subscription (which we see not) shall come before us, to be circumstantially considered for the edification of others, or the clearing of our own way, we then shall be most ready to declare our sense therein, according to known principles and the circumstances, which God shall offer…</p></blockquote>

<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear. 2. Between the obvious usual sense of the words and an unusual forced sense. 3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense. 4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow. 5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause. 6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is: 1. That I have no obligation to fit my words to his personal private sense. 2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words. 3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense. 4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

<blockquote><p>The state of the controversy: Whether in order to public obedience in civil government, the consideration of the things commanded (as they are not in themselves bad) be above the circumstantial qualification of the persons commanding? As to do the do the offices of a judge or justice of the peace by virtue of commission derived from any governor whatever.</p></blockquote>

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

stood+and+supposed+that+every+rational+man+does+consent%2C+that+there+should+be+order%2C+property+and+right+given+to+every+member+of+a+commonwealth+under+a+tyrant%2C+rather+than+all+to+be+under+confusion+oppression%2C+robberies+and+murders.+Fifthly%2C+how+could+Ezra+and+Nehemiah+justify+their+acting+under+the+Persian+monarch%2C+who+had+no+right+to+the+crown+of+Judah+either+by+blood+or+just+conquest+%28Ezra+7%3A25%29%3F+Yet+Ezra+was+authorized+by+him+to+set+magistrates%2C+fine+and+imprison+and+put+to+death+%28Ezra+10%3A7-8%29%3B+And+he+exercises+authority%2C+in+making+the+people+of+Israel+to+swear+and+to+enter+into+a+covenant%2C+and+in+sending+forth+a+proclamation+to+all+the+children+of+the+captivity%2C+that+they+should+gather+themselves+together+to+Jerusalem%3B+And+that+whosoever+would+not+come+within+three+days%2C+all+his+substance+should+be+forfeited.+Nehemiah+also+acts+as+governor%2C+and+rebukes+the+nobles+and+rulers+and+sets+a+great+assembly+against+them+because+of+their+usury.+He+also+called+the+priests+and+took+an+oath+to+perform+the+promise+of+leaving+that+usury+%28Neh.+5.+%E2%80%A2.+etc.%29.+He+acknowledges+also+that+he+was+governor+there+about+twelve+years%2C+and+he+gave+his+brother+Hanani+and+Hanaiah+ruler+of+the+palace+charge+over+Jerusalem+%28Neh.+7%3A2%29.+So+he+did+both+act+himself+and+others+acted+under+him.+We+find+also+that+at+that+time+there+were+rulers+of+the+people+that+dwelt+at+Jerusalem%2C+and+Nehemiah+contended+with+the+rulers+and+nobles%2C+made+treasurers%2C+commanded+the+gates+to+be+shut+before+the+Sabbath%2C+threatened+to+lay+hands+on+the+merchants+that+lay+at+the+gates%2C+smote+certain+of+the+Jews+and+plucked+off+their+hair+because+having+married+wives+of+Ashdod%2C+their+children+spake+half+in+the+language+of+Ashdod+%28Neh.+13%29.+Sixthly%2C+let+us+hear+what+before+these+times+and+before+our+case+was+in+being+hath+been+taught+in+point+of+acting%3B+and+upon+what+grounds+it+has+been+approved.+An+author+eminently+learned+and+skillful+in+the+doctrine+of+lawgiving+says+thus%3A+%E2%80%98No+man+may+punish+or+condemn+another+even+with+a+just+punishment%2C+except+he+have+public+power%2C+which+a+tyrant+cannot+give.+But+in+this+there+must+be+a+consideration+or+subdistinction.+For+in+rigor+this+is+true+as+to+the+tyrant%E2%80%99s+part%3B+yet+it+so+happens+that+the+commonwealth+because+it+cannot+resist+him%2C+does+tolerate+him%2C+and+suffers+itself+to+be+governed+by+him%3B+and+does+tacitly+consent%2C+and+will+that+justice+be+administered+by+him%2C+for+the+reason+already+touched%2C+because+it+is+a+less+evil+to+be+governed+by+him%2C+than+altogether+to+want+just+coaction+and+direction%3B+and+then+it+shall+not+be+a+sin+to+obey+even+in+the+things+aforesaid%2C+because+the+consent+of+the+commonwealth+does+supply+the+defect+of+the+tyrant%E2%80%99s+power.%E2%80%99+%28Suarez%2C+De+Leg.%2C+bk.+3%2C+ch.+10%29+Another+thus%3A+%E2%80%98That+his+sentences+are+valid%2C+is+proved.+Because+his+sentences%2C+and+just+commands+although+they+have+not+force+from+a+tyrannical+power%2C+yet+they+have+it+from+elsewhere.+First%2C+and+inchoatively+from+the+law+of+nature%2C+which+such+a+state+of+things+being+supposed%2C+does+dictate+that+obedience+must+be+given+for+the+common+good%2C+otherwise+all+will+be+full+of+thefts+and+robberies.+Secondly%2C+and+completely+from+the+commonwealth%3B+and+that+either+because+while+that+state+endures%2C+it+gives+authority+to+him+by+a+tacit+consent%2C+while+it+will%E2%80%99s+that+he+administer+justice%2C+and+use+his+usurped+office+in+a+due+manner%2C+or+rather+because+it+does+tacitly+approve+his+commands%2C+and+acts+being+agreeable+to+the+laws+and+common+good%2C+and+will%E2%80%99s+that+his+just+sentences%2C+whereby+the+suites+of+the+people+are+decided%2C+and+the+guilty+are+punished%2C+shall+be+valid+and+bind+the+subjects%3B+for+except+they+were+valid+and+did+bind%2C+no+man+would+obey%2C+but+only+in+show+but+every+man+would+secretly+do+the+contrary+with+a+great+inconvenience+to+the+commonwealth.+Now+the+commonwealth+may+give+this+force+to+the+sentences%2C+and+acts+of+a+tyrant%2C+because+it+is+superior+to+all+single+persons%2C+though+it+be+oppressed+with+tyranny%2C+and+may+account+the+just+sentence+of+a+tyrant+as+its+own.%E2%80%99+%28Lessius%2C+De+Justitia+%26+Jure%2C+bk.+2%2C+ch.+25%2C+Dubitat.+9%29+Thou+wilt+ask+whether+a+tyrant+do+sin+the+sin+of+murder%2C+and+be+bound+to+restitution%2C+if+he+put+to+death+guilty+persons%2C+or+deprive+them+of+their+goods+according+to+law%3F+I+answer+negatively%3B+because+the+commonwealth+does+tacitly+give+him+authority+hereunto%2C+while+it+does+consent+and+desire+that+this+should+be+done+by+him.+Thus+is+the+authority+of+acting+in+this+case+grounded+upon+a+tacit+or+implied+consent%2C+which+consent+is+the+very+dictate+of+nature+or+common+reason%2C+because+it+is+better+to+have+some+justice+than+none+at+all%2C+some+coercive+power+and+government+than+that+all+be+left+to+disorder%2C+violence+and+confusion.%E2%80%9D%0A%0A%E2%80%94+Francis+Rouse%2C+The+Lawfulness+of+Obeying+the+Present+Government%E2%80%A6+%28London%2C+1649%29%2C+pp.+16-19+Rouse+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a06baff06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8a06baff06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Thirdly%2C%20it%20is%20cleared%20in%20this,left%20to%20disorder%2C%20violence%20and%20confusion." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

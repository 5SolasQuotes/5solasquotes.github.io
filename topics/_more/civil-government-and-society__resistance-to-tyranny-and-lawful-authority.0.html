<blockquote><p>The state of the controversy: Whether in order to public obedience in civil government, the consideration of the things commanded (as they are not in themselves bad) be above the circumstantial qualification of the persons commanding? As to do the offices of a judge or justice of the peace by virtue of commission derived from any governor whatever.</p></blockquote>

— Anthony Ascham, A Reply to a Paper of Dr. Sanderson’s, containing a censure of Mr. A.A. his book of the Confusions and Revolution of Government (London: 1650) 22 pp., p. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+state+of+the+controversy%3A+Whether+in+order+to+public+obedience+in+civil+government%2C+the+consideration+of+the+things+commanded+%28as+they+are+not+in+themselves+bad%29+be+above+the+circumstantial+qualification+of+the+persons+commanding%3F+As+to+do+the+offices+of+a+judge+or+justice+of+the+peace+by+virtue+of+commission+derived+from+any+governor+whatever.%E2%80%9D%0A%0A%E2%80%94+Anthony+Ascham%2C+A+Reply+to+a+Paper+of+Dr.+Sanderson%E2%80%99s%2C+containing+a+censure+of+Mr.+A.A.+his+book+of+the+Confusions+and+Revolution+of+Government+%28London%3A+1650%29+22+pp.%2C+p.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc80d058755.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c80d058755.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=The%20state%20of%20the%20controversy%3A%20Whether,commission%20derived%20from%20any%20governor%20whatever." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c81f8ffed3" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto. 4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right. 5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these: 1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place. 2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Resolution of Conscience (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power. Out of which men may satisfy their scruples concerning the present Subscription and Engagement [to Cromwell’s regime] (London: 1649) 6 pp.</cite></span></figcaption>

</figure><figure class="quote" id="q-599f28c8c6" data-kw="">
<blockquote><p>Usurpation is an intrusion into the seat of authority, a presuming to possess and manage the place and power thereof without a lawful calling, right, or title thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC</cite>, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“Usurpation is an intrusion into the seat of authority, a presuming to possess and manage the place and power thereof without a lawful calling, right, or title thereunto.”

— Edward Gee, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, p. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUsurpation+is+an+intrusion+into+the+seat+of+authority%2C+a+presuming+to+possess+and+manage+the+place+and+power+thereof+without+a+lawful+calling%2C+right%2C+or+title+thereunto.%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+p.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F599f28c8c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/599f28c8c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Usurpation%20is%20an%20intrusion%20into%20the,lawful%20calling%2C%20right%2C%20or%20title%20thereunto." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ece79072f1" data-kw="">
<blockquote><p>When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…</p></blockquote>

<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: 1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it. 2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less… 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>

verse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.”

<blockquote><p>And when having attained their ungodly desires (whether ambitious kings by bringing any country into their subjection, or disloyal subjects by their rebellious rising against their natural sovereigns), they have established any of the same degenerate forms of government among their people, the authority, either so unjustly gotten, or wrung by force from the true and lawful possessor, being always God’s authority (and therefore receiving no impeachment by the wickedness of those that have it), is ever (when any such alterations are thoroughly settled) to be reverenced and obeyed, and the people of all sorts (as well of the clergy as of the laity) are to be subject unto it, not only for wrath, but also for conscience sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-sherlock.html">William Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of The Case of Allegiance due to Sovereign Powers, in Reply to An Answer to a late Pamphlet… (London: Rogers, 1691) 80 pp.</cite>, p. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And when having attained their ungodly desires (whether ambitious kings by bringing any country into their subjection, or disloyal subjects by their rebellious rising against their natural sovereigns), they have established any of the same degenerate forms of government among their people, the authority, either so unjustly gotten, or wrung by force from the true and lawful possessor, being always God’s authority (and therefore receiving no impeachment by the wickedness of those that have it), is ever (when any such alterations are thoroughly settled) to be reverenced and obeyed, and the people of all sorts (as well of the clergy as of the laity) are to be subject unto it, not only for wrath, but also for conscience sake.”

<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz: 1. If a prince abandon. 2. If he alienate. 3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers… (London, 1650), ch. 4</cite>, pp. 47-48</span></figcaption>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

</figure><figure class="quote" id="q-9a966c6390" data-kw="">
<blockquote><p>And these were the Halcionian days which Ambrose himself declares and magnifies, even when Maximus had suppressed the Arrians, En tempus acceptabile! quo non hiemalibus perfidiae caligantis pruinas annus riget, nec altis nivis, etc. ibid. Reader was not that time more strange than ours? that Ambrose must be so loyal as to save his prince and country from a usurper; and yet so pious as to be persecuted by his prince, and he and his brethren saved by that same usurper, and openly give praise to God for the great felicity of the Church which it received by that same usurper whom he so resisted?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy… (London: Simmons, 1681) | pt. 2, ch. 22</cite>, p. 210</span></figcaption>

<blockquote><p>§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.”

— Richard Baxter, Reliquiæ Baxterianæ (London: Parkhurst, 1696), pp. 64-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A798.+If+you+ask+what+did+the+ministers+all+this+while%2C+I+answer%3A+they+preached+and+prayed+against+disloyalty.+They+drew+up+a+writing+to+the+Lord+General+declaring+their+abhorrence+of+all+violence+against+the+person+of+the+king+%5BCharles+I%5D%2C+and+urging+him+and+his+army+to+take+heed+of+such+an+unlawful+act.+They+present+it+to+the+General+when+they+saw+the+king+in+danger%3A+But+Pride+prevailed+against+their+counsels.+%C2%A799.+The+king+being+thus+taken+out+of+the+way%2C+Cromwell+takes+on+him+to+be+for+a+commonwealth+%28but+all+in+order+to+the+security+of+the+good+people%29+till+he+had+removed+the+other+impediments+which+were+yet+to+be+removed%3A+so+that+the+Rump+%5BParliament%5D+presently+drew+up+a+form+of+Engagement%2C+to+be+put+upon+all+men%2C+viz.+%E2%80%98I+do+promise+to+be+true+and+faithful+to+the+commonwealth+as+it+is+now+established+without+a+king+or+House+of+Lords.%E2%80%99+So+we+must+take+the+Rump+for+an+established+commonwealth+and+promise+fidelity+to+them.+This+the+sectarian+party+%5Bof+Independents+and+sects%5D+swallowed+easily%2C+and+so+did+the+king%E2%80%99s+old+cavaliers%2C+so+far+as+I+was+acquainted+with+them+or+could+hear+of+them+%28not+heartily%2C+no+doubt%2C+but+there+were+very+few+of+them+sick+of+the+disease+called+tenderness+of+conscience+or+scrupulosity%3A+But+the+presbyterians+and+the+moderate+episcopal+men+refused+it+%28and+I+believe+so+did+the+prelatical+divines+of+the+king%E2%80%99s+party+for+the+most+part%3B+though+the+gentlemen+had+greater+necessities+%5Bto+preserve+by+the+Engagement%5D%29.+Without+this+Engagement+no+man+must+have+the+benefit+of+suing+another+at+law+%28which+kept+men+a+little+from+contention+and+would+have+marred+the+lawyers%E2%80%99+trade%29%3B+nor+must+they+have+any+masterships+in+the+universities%2C+nor+travel+above+so+many+miles+from+their+houses%2C+and+more+such+penalties%2C+which+I+remember+not+%28so+short+lived+a+commonwealth+deserved+no+long+remembrance%29%3A+Mr.+%5BRichard%5D+Vines+and+Dr.+Rainbow+and+many+more+were+hereupon+put+out+of+their+headships+in+the+universities%2C+and+Mr.+Sidrach+Sympson%2C+and+Mr.+John+Sadler+and+such+others+put+in%3B+yea%2C+such+a+man+as+Mr.+Dell%2C+the+chaplain+of+the+army%2C+who%2C+I+think%2C+neither+understood+himself+nor+was+understood+by+others+any+farther+than+to+be+one+who+took+reason%2C+sound+doctrine%2C+order+and+concord+to+be+the+intolerable+maladies+of+Church+and+State%2C+because+they+were+the+greatest+strangers+to+his+mind.+But+poor+Dr.+Edward+Reynolds+had+the+hardest+measure%3B+for+when+he+refused+to+take+the+Engagement%2C+his+place+was+forfeited%3B+and+afterwards+they+drew+him+to+take+it%2C+in+hopes+to+keep+his+place+%28which+was+no+less+than+the+deanery+of+Christ%E2%80%99s-Church%29+and+then+turned+him+out+of+all%2C+and+offered+his+place+to+Mr.+Joseph+Caryl%3B+but+he+refusing+it%2C+it+was+conferred+on+Dr.+%5BJohn%5D+Owen%2C+to+whom+it+was+continued+from+year+to+year.+And+because+the+presbyterians+still+urged+the+%5BSolemn+League+and%5D+Covenant+against+killing+the+king%2C+and+pulling+down+the+parliament%2C+and+setting+up+a+commonwealth%2C+and+taking+the+Engagement%2C+some+of+the+Independent+brethren+maintained+that+its+obligation+ceased%2C+because+it+was+a+league%2C+and+the+occasion+of+it+ceased%3A+And+some+of+the+Rump+said+it+was+like+an+almanac+out+of+date%3B+and+some+of+the+soldiers+said+they+never+took+it%3B+and+others+of+them+railed+at+it+as+a+Scottish+snare%3A+So+that+when+their+interest+would+not+suffer+them+to+keep+so+solemn+a+vow%2C+their+wills+would+not+suffer+their+judgments+to+confess+it+to+be+obligatory%2C+at+least+as+to+the+part+which+they+must+violate.+%C2%A7100.+For+my+own+part%2C+though+I+kept+the+town+and+parish+of+Kidderminster+from+taking+the+Covenant+%28and+seeing+how+it+might+become+a+snare+to+their+consciences%29+yea%2C+and+most+of+Worcestershire+besides%2C+by+keeping+the+ministers+from+offering+it+in+any+of+the+congregations+to+the+people+%28except+in+Worcester+City%2C+where+I+had+no+great+interest+and+know+not+what+they+did%29%3B+yet+I+could+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%2C+as+if+the+bonds+of+national+and+personal+vows+were+as+easily+shaked+off+as+Sampson%E2%80%98s+cords.+Therefore+I+spake+and+preached+against+the+Engagement+and+dissuaded+men+from+taking+it.+The+first+hour+that+I+heard+of+it%2C+being+in+company+with+some+gentlemen+of+Worcestershire%2C+I+presently+wrote+down+above+twenty+queries+against+it%2C+intending+as+many+more+almost+against+the+obligation+as+those+were+about+the+sense+and+circumstances.+And+one+that+was+present+got+the+copy+of+them%2C+and+shortly+after+I+met+with+them+verbatim+in+a+book+of+Mr.+Henry+Hall%E2%80%98s+as+his+own+%28one+that+was+long+imprisoned+for+writing+against+Cromwell%29.+Some+episcopal+divines+that+were+not+so+scrupulous+it+seems+as+we%2C+did+write+for+it+%28private+manuscripts+which+I+have+seen%29+and+plead+the+irresistibility+of+the+imposers%2C+and+they+found+starting+holes+in+the+terms%2C+viz.+that+by+%E2%80%9Cthe+commonwealth%E2%80%9D+they+will+mean+the+present+commonwealth+in+genere%2C+and+by+%E2%80%9Cestablished%E2%80%9D+they+will+mean+only+de+facto+and+not+de+jure%2C+and+by+%E2%80%9Cwithout+a+king%2C+etc.%E2%80%9D+they+mean+not+quatenus+%5Bas+far+as%5D+but+etsi+%5Balthough%5D%2C+and+that+only+de+facto+pro+tempore+%5Bin+point+of+fact+for+the+time%5D%2C+quasi+dicat+%5B%E2%80%9Cas+if+to+say%E2%80%9D%5D%3A+%E2%80%98I+will+be+true+to+the+government+of+England%2C+though+at+the+present+the+king+and+House+of+Lords+are+put+out+of+the+exercise+of+their+power.%E2%80%99+These+were+the+expositions+of+many+episcopal+men%2C+and+others+that+took+it%3A+But+I+endeavored+to+evince+that+this+is+mere+juggling+and+jesting+with+matters+too+great+to+be+jested+with%3A+And+that+as+they+might+easily+know+that+the+imposers+had+another+sense%2C+so+as+easily+might+they+know+that+the+words+in+their+own+obvious+usual+sense+among+men+must+be+taken+as+the+promise+or+engagement+of+a+subject+as+such+to+a+form+of+government+now+pretended+to+be+established%3A+And+that+the+subjects%E2%80%99+allegiance+or+fidelity+to+his+rulers+can+be+acknowledged+and+given+in+no+plainer+words%3A+And+that+by+such+interpretations+and+stretchings+of+conscience%2C+any+treasonable+oath+or+promise+may+be+taken%2C+and+no+bonds+of+society+can+signify+much+with+such+interpreters.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reliqui%C3%A6+Baxterian%C3%A6+%28London%3A+Parkhurst%2C+1696%29%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7d4c7a910.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c7d4c7a910.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=%C2%A798.%20If%20you%20ask%20what%20did,can%20signify%20much%20with%20such%20interpreters." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

</figure><figure class="quote" id="q-5f89c9779a" data-kw="">
<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 27</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.”

Except%5Bion%5D%20against%20this,having%20an%20equal%20right%20to%20everything." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fdf1d500b0" data-kw="">
<blockquote><p>And yet we conceive another case… wherein this submission to a new power may be called legal. For the end of all law and government is to preserve our persons and estates; and they who are in supremacy of power have power to preserve or destroy both if they please; and therefore have as great a power over our laws, which are less then our lives. So soon as one supreme power is expelled by another, law, life and estate fall all into the hands of the succeeding power; and what it does not actually take away, stands in effect as deriving from it; and if that supreme power make a sanction for our obedience to it (as always is immediately done) then we may say our submission is legal, or else the supreme power cannot make a law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 31</span></figcaption>

</figure><figure class="quote" id="q-8ca0d5ad12" data-kw="">
<blockquote><p>For lest we of the people should bogle at coming on the stage to act our late tragedy over again, he [the opponent] would impose it on our beliefs that we are still in the middle act of it and that we ought to finish it. It is high time for him to consider whether if we run along with him in this we should not shut up compassion from our brethren and shut out a great part of our gratitude towards God; although I confess some scars and haltings may remain yet, after the war itself is ended. Methinks he should find everything both in Nature and Christianity more favourable for our present peace than for our third war, especially seeing all our former wars have ended very contrary to the expectation of those who were hottest to begin them. But I consider that passion is the last hold out of which we are beaten, of which the fuller men are, the less do they (through a great judgement on their spirits) perceive into what deformities they do transport them, it being the nature of all intoxications that their defects are better perceived by any than by those who are oppressed by them.</p></blockquote>

=For%20lest%20we%20of%20the%20people,those%20who%20are%20oppressed%20by%20them." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d27615bfc7" data-kw="">
<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-rouse.html">Francis Rouse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawfulness of Obeying the Present Government &amp; Acting Under it… (London, 1649)</cite>, p. 6</span></figcaption>

201%E2%80%A2%2C%20n.%2041." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a2ed7eb824" data-kw="">
<blockquote><p>We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: … 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate [see others who are better on the issue of giving titles]). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Thomas Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me…</p></blockquote>

ught not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me…”

<blockquote><p>…things at which offence is taken, first my petitioning for my life to the [usurped] parliament (so called)… to both which I shall give full satisfaction. About my petitioning, a double offence is taken, first at the titles of my petitions… I shall speak briefly to both, to take away any stumbling block out of the way of any. Touching the titles of my four petitions, they run in this form: ‘To the Supreme Authority, the Parliament of the Commonwealth of England’. Although I am far from going about to justify their right to this title to whom I give it, yet I shall justify the lawfulness of my practice in giving them this title which they assume to themselves, especially in a case of life [or death] as mine is: for in trivial matters I had rather lose my own right which belongs to me than give them this title which belongs not to them. The reasons which sway with me why I gave them this title (though I am not satisfied they have a right to it) are these: 1. They would not receive my petitions without giving them their assumed titles; yea to my knowledge they have rejected petitions which have not had these titles. 2. I am upon sure and clear grounds persuaded that giving to men titles they assume to themselves is not a real owning that they have a right to those titles. Titular and real are usually distinguished; by giving them the title of ‘Supreme Authority’ and ‘Parliament,’ I do acknowledge them a titular authority and a titular parliament, but by engaging [by an oath of allegiance] to them (which I have never done and I hope shall never do), I do acknowledge them a real authority and a real parliament. That I may further evince the truth of this second reason, viz. that giving of titles to men they assume to themselves, is not a real owning that they have a real right to those titles, I shall give sundry instances in Scripture to make it good: 2 Sam. 16, Hushai did call Absalom, that notorious usurper, ‘king,’ saying, ‘God save the king, God save the king,’ (an expression the people gave him), yet Hushai knew that David only was (even then) the lawful king of Israel set over him by God, and Absalom only an intruder, and made king by the tumults of the people; yea David himself did bid Hushai call Absalom (that usurper) ‘king,’ 2 Sam. 15:34, ‘Say to Absalom, ‘I will be thy servant O King.’ Yea further, David himself did call Absalom ‘king,’ 2 Sam. 15:19. David said to Hushai, ‘Return to thy place and abide with the king’ (that is with Absalom), yet he knew himself to be the lawful king and did not acknowledge that his son Absalom had any right to the kingdom, though he did give him the title of a king. So Athaliah’s usurping is called by the Spirit of God ‘reigning,’ yet the Spirit of God owns not her right to reign, but approved of the killing of her and the setting up [of] Jehoash, the true and lawful heir in her room. Yea Christ Himself called the Devil ‘the Prince of this World,’ Jn. 12:13 and 16 and 11, yet is it imaginable that Christ thought this title of right belonged to the Devil? Certainly no; Musculus on Jn. 12:31 well observes, non est ille (viz. Satan) Princeps mundi legitimus, sed per rapinam [‘He is not the legitimate prince of the world, but a robber’]. Paul called the devils ‘principalities and power,’ Eph. 6:12, yet none will be so shameless as to say that Paul thought this their rule, dominion and power of right belonged to them, but is merely usurped and intruded into. See annotations on the Bible on Eph. 6:12. 3. Titles are not always approbative, but distinctive; my meaning is that giving of titles to persons or things argues not one’s approving of a just right to those titles, but seems merely to distinguish those persons or things from others that are called by other names or titles, as I call them at Whitehall a ‘Council of State’ to distinguish them from a ‘Council of War’; I call those at Westminster the ‘Parliament of the Commonwealth,’ to distinguish them from the Lords and Commons assembled in Parliament. 4. Titles are giving to things or persons sometimes merely by allusion, not approbation, as in Scripture-phrase sin is said to ‘reign’ and the devils are said to ‘rule’, not that either the one or the other has an approved right to rule over man as a lawful prince has to rule over his subjects, but they are said to reign or rule by way of allusion to the reign of princes in their dominions. 5. Titles may be given without sin to persons or things, though of right they belong not to them, where they are generally received or mentioned by such titles by the people where I live. About names and titles much indulgence is to be given to the common usages and customs of the people; I may call things or persons by such names or titles as I know belongs not of right unto them, because they are ordinarily known and generally received by such names and titles. I could give manifold instances out of Scripture to prove this: David called Absalom ‘king’, not that he thought him so of right, but because he was commonly known and generally received by that title among the people. So Herod was called by the evangelist ‘King of the Jews’, so did the Jews generally call him by that title, yet none but that sect or sort of people called the Herodians did own it as Herod’s right to be the king of the Jews, who were so called because they pleaded for Herod to be the lawful king of the Jews, which the Pharisees and others withstood because he was not one of the Jewish nation as he ought to be, Dt. 17:15. Yet all the Jews called Herod ‘king’, though they did not acknowledge him to be their lawful king; tis manifest giving of titles are but titular acknowledgments and no more. 6. If names may without sin be given to places and things (which belong not to them), I see no reason why they may not be given to persons. There are names and titles given to many places both upon superstitious and idolatrous grounds, yet may without sin be used (I speak not of the first imposers) when those places are so called and commonly known by such names: Luke that writ the Acts of the Apostles, calls a place in Athens ‘Mars-hill’ (as it was commonly called) and this he might do without sin, though this name was originally imposed on that place in honor of Mars, yet he calls the place as it was commonly called, though called so upon an idolatrous ground, Acts 17:22. So for things also we may without sin call them by those names which others give them, though they may deal superstitiously or sinfully in the first imposition of such names. Thus Paul mentions a ship of Alexandria whose sign was Castor and Pollux, names originally imposed by the gentiles upon an idolatrous ground, yet being generally received, Paul calls the ship after this name. 7. It was a matter of absolute necessity (as to my life) for me to petition them, I being condemned to die; tis true for a trivial or ordinary occasion I should never petition them, but in an extraordinary case I might lawfully do it: David in a case of extreme necessity did eat the Show-bread, which in an ordinary case he might not do. Tis true indeed, Cato would not petition Caesar for his life, he had rather die than petition, but that I conceive was rather out of some animosity or height of spirit, or petty discontent, than out of a rectified judgment; for my part I am fully satisfied that I have not sinned in giving them their assumed titles; names and titles do not determine rights, conveniunt rebus nomina saepe suis [‘names often correspond to their things], it is true sometimes, but not always. 8. Titles men assume to themselves, or are generally given by others, may be given them by me without sin or without owning a right to those titles; this I may make appear by sundry late instances: Henry VIII [initially] had this title given him, ‘Defender of the Faith’, yet he had no right to this title, for he [at the beginning of his reign] defended only the Popish religion; he opposed the Faith rather than defended the Faith, and the true reason why the Pope gave him this title, ‘Defender of the Faith’, was because he opposed the doctrine of Luther and wrote against him [in 1521]; yet none scrupled to call him and the succeeding kings of England ‘the Defenders of the Faith’. So the king of Spain is called ‘the Catholic King’, yet he has no true right to this title, for he is not a catholic or universal monarch, yet our new State have lately sent to the king of Spain under this title, ‘The Catholic King’; so the king of France is called ‘the most Christian King’; so the Duke of Bavaria having by arms ejected the Palsgrave writes himself ‘Prince Elector Palatine of the Rhine’; so the King of Poland takes this title to himself, ‘King of Sweden’, yet has no right to that kingdom; yet none that ever I heard of scrupled to give these titles to them, considering that titles do not determine rights, and considering also that no addresses to them will be received by them unless the titles they assume to themselves be given them by those who make applications to them.</p></blockquote>

e+them+a+real+authority+and+a+real+parliament.+That+I+may+further+evince+the+truth+of+this+second+reason%2C+viz.+that+giving+of+titles+to+men+they+assume+to+themselves%2C+is+not+a+real+owning+that+they+have+a+real+right+to+those+titles%2C+I+shall+give+sundry+instances+in+Scripture+to+make+it+good%3A+2+Sam.+16%2C+Hushai+did+call+Absalom%2C+that+notorious+usurper%2C+%E2%80%98king%2C%E2%80%99+saying%2C+%E2%80%98God+save+the+king%2C+God+save+the+king%2C%E2%80%99+%28an+expression+the+people+gave+him%29%2C+yet+Hushai+knew+that+David+only+was+%28even+then%29+the+lawful+king+of+Israel+set+over+him+by+God%2C+and+Absalom+only+an+intruder%2C+and+made+king+by+the+tumults+of+the+people%3B+yea+David+himself+did+bid+Hushai+call+Absalom+%28that+usurper%29+%E2%80%98king%2C%E2%80%99+2+Sam.+15%3A34%2C+%E2%80%98Say+to+Absalom%2C+%E2%80%98I+will+be+thy+servant+O+King.%E2%80%99+Yea+further%2C+David+himself+did+call+Absalom+%E2%80%98king%2C%E2%80%99+2+Sam.+15%3A19.+David+said+to+Hushai%2C+%E2%80%98Return+to+thy+place+and+abide+with+the+king%E2%80%99+%28that+is+with+Absalom%29%2C+yet+he+knew+himself+to+be+the+lawful+king+and+did+not+acknowledge+that+his+son+Absalom+had+any+right+to+the+kingdom%2C+though+he+did+give+him+the+title+of+a+king.+So+Athaliah%E2%80%99s+usurping+is+called+by+the+Spirit+of+God+%E2%80%98reigning%2C%E2%80%99+yet+the+Spirit+of+God+owns+not+her+right+to+reign%2C+but+approved+of+the+killing+of+her+and+the+setting+up+%5Bof%5D+Jehoash%2C+the+true+and+lawful+heir+in+her+room.+Yea+Christ+Himself+called+the+Devil+%E2%80%98the+Prince+of+this+World%2C%E2%80%99+Jn.+12%3A13+and+16+and+11%2C+yet+is+it+imaginable+that+Christ+thought+this+title+of+right+belonged+to+the+Devil%3F+Certainly+no%3B+Musculus+on+Jn.+12%3A31+well+observes%2C+non+est+ille+%28viz.+Satan%29+Princeps+mundi+legitimus%2C+sed+per+rapinam+%5B%E2%80%98He+is+not+the+legitimate+prince+of+the+world%2C+but+a+robber%E2%80%99%5D.+Paul+called+the+devils+%E2%80%98principalities+and+power%2C%E2%80%99+Eph.+6%3A12%2C+yet+none+will+be+so+shameless+as+to+say+that+Paul+thought+this+their+rule%2C+dominion+and+power+of+right+belonged+to+them%2C+but+is+merely+usurped+and+intruded+into.+See+annotations+on+the+Bible+on+Eph.+6%3A12.+3.+Titles+are+not+always+approbative%2C+but+distinctive%3B+my+meaning+is+that+giving+of+titles+to+persons+or+things+argues+not+one%E2%80%99s+approving+of+a+just+right+to+those+titles%2C+but+seems+merely+to+distinguish+those+persons+or+things+from+others+that+are+called+by+other+names+or+titles%2C+as+I+call+them+at+Whitehall+a+%E2%80%98Council+of+State%E2%80%99+to+distinguish+them+from+a+%E2%80%98Council+of+War%E2%80%99%3B+I+call+those+at+Westminster+the+%E2%80%98Parliament+of+the+Commonwealth%2C%E2%80%99+to+distinguish+them+from+the+Lords+and+Commons+assembled+in+Parliament.+4.+Titles+are+giving+to+things+or+persons+sometimes+merely+by+allusion%2C+not+approbation%2C+as+in+Scripture-phrase+sin+is+said+to+%E2%80%98reign%E2%80%99+and+the+devils+are+said+to+%E2%80%98rule%E2%80%99%2C+not+that+either+the+one+or+the+other+has+an+approved+right+to+rule+over+man+as+a+lawful+prince+has+to+rule+over+his+subjects%2C+but+they+are+said+to+reign+or+rule+by+way+of+allusion+to+the+reign+of+princes+in+their+dominions.+5.+Titles+may+be+given+without+sin+to+persons+or+things%2C+though+of+right+they+belong+not+to+them%2C+where+they+are+generally+received+or+mentioned+by+such+titles+by+the+people+where+I+live.+About+names+and+titles+much+indulgence+is+to+be+given+to+the+common+usages+and+customs+of+the+people%3B+I+may+call+things+or+persons+by+such+names+or+titles+as+I+know+belongs+not+of+right+unto+them%2C+because+they+are+ordinarily+known+and+generally+received+by+such+names+and+titles.+I+could+give+manifold+instances+out+of+Scripture+to+prove+this%3A+David+called+Absalom+%E2%80%98king%E2%80%99%2C+not+that+he+thought+him+so+of+right%2C+but+because+he+was+commonly+known+and+generally+received+by+that+title+among+the+people.+So+Herod+was+called+by+the+evangelist+%E2%80%98King+of+the+Jews%E2%80%99%2C+so+did+the+Jews+generally+call+him+by+that+title%2C+yet+none+but+that+sect+or+sort+of+people+called+the+Herodians+did+own+it+as+Herod%E2%80%99s+right+to+be+the+king+of+the+Jews%2C+who+were+so+called+because+they+pleaded+for+Herod+to+be+the+lawful+king+of+the+Jews%2C+which+the+Pharisees+and+others+withstood+because+he+was+not+one+of+the+Jewish+nation+as+he+ought+to+be%2C+Dt.+17%3A15.+Yet+all+the+Jews+called+Herod+%E2%80%98king%E2%80%99%2C+though+they+did+not+acknowledge+him+to+be+their+lawful+king%3B+tis+manifest+giving+of+titles+are+but+titular+acknowledgments+and+no+more.+6.+If+names+may+without+sin+be+given+to+places+and+things+%28which+belong+not+to+them%29%2C+I+see+no+reason+why+they+may+not+be+given+to+persons.+There+are+names+and+titles+given+to+many+places+both+upon+superstitious+and+idolatrous+grounds%2C+yet+may+without+sin+be+used+%28I+speak+not+of+the+first+imposers%29+when+those+places+are+so+called+and+commonly+known+by+such+names%3A+Luke+that+writ+the+Acts+of+the+Apostles%2C+calls+a+place+in+Athens+%E2%80%98Mars-hill%E2%80%99+%28as+it+was+commonly+called%29+and+this+he+might+do+without+sin%2C+though+this+name+was+originally+imposed+on+that+place+in+honor+of+Mars%2C+yet+he+calls+the+place+as+it+was+commonly+called%2C+though+called+so+upon+an+idolatrous+ground%2C+Acts+17%3A22.+So+for+things+also+we+may+without+sin+call+them+by+those+names+which+others+give+them%2C+though+they+may+deal+superstitiously+or+sinfully+in+the+first+imposition+of+such+names.+Thus+Paul+mentions+a+ship+of+Alexandria+whose+sign+was+Castor+and+Pollux%2C+names+originally+imposed+by+the+gentiles+upon+an+idolatrous+ground%2C+yet+being+generally+received%2C+Paul+calls+the+ship+after+this+name.+7.+It+was+a+matter+of+absolute+necessity+%28as+to+my+life%29+for+me+to+petition+them%2C+I+being+condemned+to+die%3B+tis+true+for+a+trivial+or+ordinary+occasion+I+should+never+petition+them%2C+but+in+an+extraordinary+case+I+might+lawfully+do+it%3A+David+in+a+case+of+extreme+necessity+did+eat+the+Show-bread%2C+which+in+an+ordinary+case+he+might+not+do.+Tis+true+indeed%2C+Cato+would+not+petition+Caesar+for+his+life%2C+he+had+rather+die+than+petition%2C+but+that+I+conceive+was+rather+out+of+some+animosity+or+height+of+spirit%2C+or+petty+discontent%2C+than+out+of+a+rectified+judgment%3B+for+my+part+I+am+fully+satisfied+that+I+have+not+sinned+in+giving+them+their+assumed+titles%3B+names+and+titles+do+not+determine+rights%2C+conveniunt+rebus+nomina+saepe+suis+%5B%E2%80%98names+often+correspond+to+their+things%5D%2C+it+is+true+sometimes%2C+but+not+always.+8.+Titles+men+assume+to+themselves%2C+or+are+generally+given+by+others%2C+may+be+given+them+by+me+without+sin+or+without+owning+a+right+to+those+titles%3B+this+I+may+make+appear+by+sundry+late+instances%3A+Henry+VIII+%5Binitially%5D+had+this+title+given+him%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+yet+he+had+no+right+to+this+title%2C+for+he+%5Bat+the+beginning+of+his+reign%5D+defended+only+the+Popish+religion%3B+he+opposed+the+Faith+rather+than+defended+the+Faith%2C+and+the+true+reason+why+the+Pope+gave+him+this+title%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+was+because+he+opposed+the+doctrine+of+Luther+and+wrote+against+him+%5Bin+1521%5D%3B+yet+none+scrupled+to+call+him+and+the+succeeding+kings+of+England+%E2%80%98the+Defenders+of+the+Faith%E2%80%99.+So+the+king+of+Spain+is+called+%E2%80%98the+Catholic+King%E2%80%99%2C+yet+he+has+no+true+right+to+this+title%2C+for+he+is+not+a+catholic+or+universal+monarch%2C+yet+our+new+State+have+lately+sent+to+the+king+of+Spain+under+this+title%2C+%E2%80%98The+Catholic+King%E2%80%99%3B+so+the+king+of+France+is+called+%E2%80%98the+most+Christian+King%E2%80%99%3B+so+the+Duke+of+Bavaria+having+by+arms+ejected+the+Palsgrave+writes+himself+%E2%80%98Prince+Elector+Palatine+of+the+Rhine%E2%80%99%3B+so+the+King+of+Poland+takes+this+title+to+himself%2C+%E2%80%98King+of+Sweden%E2%80%99%2C+yet+has+no+right+to+that+kingdom%3B+yet+none+that+ever+I+heard+of+scrupled+to+give+these+titles+to+them%2C+considering+that+titles+do+not+determine+rights%2C+and+considering+also+that+no+addresses+to+them+will+be+received+by+them+unless+the+titles+they+assume+to+themselves+be+given+them+by+those+who+make+applications+to+them.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+A+Clear+%26+Necessary+Vindication+of+the+Principles+%26+Practices+of+me%2C+Christopher+Love%2C+since+my+trial+before%2C+and+condemnation+by+the+High+Court+of+Justice+%28London%2C+1651%29%2C+pp.+1-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F781bb5691f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/781bb5691f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=%E2%80%A6things%20at%20which%20offence%20is%20taken%2C,those%20who%20make%20applications%20to%20them." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

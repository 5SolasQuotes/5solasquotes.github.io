<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear.

2. Between the obvious usual sense of the words and an unusual forced sense.

3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense.

4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow.

5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause.

6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is:

1. That I have no obligation to fit my words to his personal private sense.

2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words.

3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense.

4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

<blockquote><p>The state of the controversy: Whether in order to public obedience in civil government, the consideration of the things commanded (as they are not in themselves bad) be above the circumstantial qualification of the persons commanding? As to do the do the offices of a judge or justice of the peace by virtue of commission derived from any governor whatever.</p></blockquote>

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

<blockquote><p>[O]bserve the explanation, the origin, of persecution. It originates in the world’s hatred to Christ, and is directed against him. It must be so, seeing that Christ liveth in his people. Saul, Saul, wasting the Church, why persecutest thou me? And it is no extenuation of the world’s guilt in hating the saints, that they do not believe that Christ liveth in them—that they do not know or recognise Christ in them. Their rejection of those that are his stands exactly on the same footing with their rejection of him: “Henceforth the world knoweth us not, because it knew him not.”

Depravity blinded the world to the glory of Christ when he came in his own person, and blinds them to the measure of his glory in which he comes in the persons of his people. The bitter Ishmaelitish laugh and jest with which you, the worldling, scorn the Isaac of God, the promised seed; the hard words or hard deeds with which you, born after the flesh, persecute him that is born after the Spirit, will bear no excuse from your assertion that you did not know, you did not think, you did not see, that Christ was living in him—that it was really the promised Seed of the woman, Messiah himself, you were persecuting. For it is only your hatred and bitter prejudice that blind you. If you feared God and loved Christ, you would see him in his people: They that fear thee shall rejoice when they see me trusting in thy word; — “they shall glorify Christ in me.”

Ah ! consider, in your dislike of those that are Christ’s; in your suspicion of them; your hard thoughts and hard speeches concerning them; your discomfort in their presence when their godliness, their Christliness, comes out; your scornful joy over their infirmities and failures; —consider what a proof you have in all this of your deadly enmity to that Christ who liveth in them. You cannot but know that as yet Christ liveth in them only partially. If Christ is in them, the body is dead because of sin, though the Spirit is life because of righteousness. A body of sin and death is in them, as well as a living Christ. And that body of sin and death is a drawback on the completeness of the life and likeness of Christ in his people. They profess to give no more than a partial, though still a real, representation of Christ. They profess no more, though they long that it were far more, yea, long that it were unbroken and complete.

But were it so,—were their infirmities removed, their remaining corruption finally suppressed and extinguished; were there absolutely nothing seen or extant in them any more save Christ living in them in the unabated fulness and energy of his Holy grace and life; ah! you know that their society would be unspeakably more painful to you still; their Christliness would rebuke you more powerfully than now; your withdrawal from them, if withdrawal were possible, would be more complete: or if you could not escape their presence and their intercourse—if you found yourself in relations to them which you could not set aside—if you found them a people with whom, in their perfect righteousness, and holiness, and likeness to Christ, you could not but have to do,—ah! would not your dislike to them, your rejection of them, your resentment against them and their piety, break out in manifold strength and bitterness?

And what is this but just a proof that the more clearly Christ is revealed to you, the nearer Christ is brought to you, so much the more do you dislike him; and that were Christ, therefore, to come to you, not only in his own personal perfection in his people, but in himself, in his own perfect person, you would fully and finally reject Aim, and say, Depart from us, for we desire not thee, nor the knowledge of thy ways?” Ah! forget not that it is this, indeed, you do say, when now you reject his people. You reject, you persecute, him in them; for Christ liveth in them.

But let believers know what they are to expect at the world’s hands, and why. “Christ living in you” will not fare any better at the world’s hands than Christ sojourning in the world in the days of his flesh. The world is the same now as then. Christ in you is the same Christ as then. If they have kept his sayings, they will keep yours also; if they have persecuted him, they will persecute you. The servant is not greater than his Lord; it is enough if the servant be as his Lord. And it must be so, if his Lord liveth in him. Christ in his own person was the object of the world’s malice. Christ living in you will be so still.</p></blockquote>

<blockquote><p>If the ministers of the civil power command thee to honour and glorify God, as God will be honoured, to defend (with thy person and goods) thy country against the enemies, to do such things as be for the wealth and benefit of thy country: thou art bounden to do it: for it is good, and God will have thee to do it. And if thou do it not, thou sinnest against God, and justly deservest the punishment not only of the power, but of everlasting damnation.

But if the ministers of the civil power command thee to dishonour God, to commit idolatry, to kill an innocent, to fight against thy country, to give or lend that thou hast, to such as mind the subversion and destruction of thy country, or to maintain them in their Wickedness, thou oughtest not to do it, but to leave it undone: for it is evil, and God (the supreme and highest power) will not that thou shouldest do it. The apostles in time of persecution did not only give us an example so to do, when the worldly powers would have had them to follow their proceedings, but also left us a lesson so to do.

God must be obeyed (say they) rather than men. And this lesson even from the beginning before it was written, was by the holy Ghost printed in man’s heart. When Pharaoh the tyranny commanded the midwives of the Egyptians, to kill all the male children that should be borne of the Israelites wives: think ye, he did only command them? No without doubt. Ye may be sure, he commanded not only upon threatened pains, but also promised them largely: and perchance as largely as those do, that being desirous of children, procure the midwives to say, they be with child, when their belly is puffed up with the dropsy or mole, and having bleared the common peoples’ eyes with processioning, Te deum singing, and bonfire blanketing, use all ceremonies and crying out, whilst an other bird’s egg is laid in the nest. But these good midwives fearing God (the high power) who had commanded them, not to kill, would not obey this tyrannical Pharaoh’s commandment, but left it undone.</p></blockquote>

<blockquote><p>From Rom. xiii. 1. “Let every soul be subject unto the higher powers. Whosoever resisteth the power, resisteth the ordinance of God. Rulers are not a terror to good works, but to the evil. He is the minister of God for good, wherefore we must needs be subject, not only for wrath, but also for conscience sake.” But, on the contrary, tyranny and unjust violence is not the ordinance of God. He that resisteth it, resisteth not the ordinance of God.

Such rulers are a terror to good works, not to evil; they are not the ministers of God for our good; neither in this can we be subject to them for conscience sake. The whole course of the apostle’s argument runneth against the resistance of lawful power commanding things good and lawful. We must either acknowledge tyranny to be the ordinance of God, and for our good, or exclude it from the apostle’s argument, admitting the resistance thereof to be lawful, at least by the shield for defence, if not by the sword for invasion.</p></blockquote>

<blockquote><p>It may be asked, how came these obnoxious and oppressive laws [concerning mandatory vaccination] to be placed upon our statute books? Did the people desire them or ask for them? No! Never. Without the knowledge or consent of the public these laws were clandestinely smuggled through indifferent, ignorant and incompetent Legislatures at the instance of a fraction of mercenary “lymph” manufacturers and politician-doctors, i. e., medicine-men who combine politics with physic in their business, men who have a stake in vaccination and are pecuniarily and professionally interested in the dissemination of disease among the people, men who regard the acquisition of the almighty “plunker” as of paramount importance to all considerations for the public health.

This language may sound harsh, but it is not too harsh to be literally true. Through the persistence of these medical factions and their accomplices (the “lymph” purveyors), these odious laws were lobbied through our various Legislatures without the knowledge or consent of the public. The members of politico-medical factions at whose instigation and for whose special benefit and pecuniary advantage these monopolitic laws were passed have the shield of the State thrown over them while they brazenly pose as benefactors of mankind.

These assassins of the public health have the assurance to ask the people to believe that these disease-prescribing laws were framed and passed in the interest of the public health. The pretext that these statutes were enacted in the interest of the public health is a hypocritical pretense. While that was the ostensible purpose of the law, they were actually passed for the selfish interest of and at the persistent solicitation of the venal clique of fee-hungry medical politicians and mercenary “lymph” manufacturers, who live and thrive at the expense of the public health.

Like many other pernicious practices which infest society, this State-supported practice has its pecuniary incentives. That the money-value is the principal motive which actuates many doctors in their advocacy of this ruinous practice cannot be doubted by any observer who has given the subject serious attention. Pecuniary interest, professional pride, reluctance to admit professional error are just as likely to lead astray members of the medical profession as those of any other business or profession by which men gain a livelihood.

If it were possible to eliminate the commercial feature from the vaccination enterprise, the solicitude of the vaccinating doctors and the “lymph” manufacturers for the welfare of “the dear people” would soon be found drooping. We all know how prone human nature is in this age of ultra-commercialism to nurse and cherish opinions so long as they favour our self-interest. Doctors are no exception to the general rule in this respect. They are human beings, no better and no worse than the members of other professions. Were it not that their pecuniary interests and professional credit are so intimately interwoven with the Jennerian delusion, they would gladly abandon the dreadful practice.</p></blockquote>

<blockquote><p>M.—Though we should admit the justness of your reasonings upon that ancient example, we are still more closely pressed by a more modern instance in Paul, who commands us to pray for the life of sovereigns, and is far from allowing us to renounce their authority, much less to dethrone, and, when dethroned, to murder them. And what princes does he thus recommend to our prayers? Of all that ever existed the most cruel, Tiberius, Caligula, Claudius, and Nero; for these were co-eval with the epistles of Paul.

B.—In comparing the writings of all the philosophers and lawyers with Paul’s, you seem to me to act rightly, in allowing to his authority so much preponderance in the balance. But you should consider whether you have sufficiently weighed his opinions; for you ought to examine, not only his words, but also at what times, to what persons, and for what purposes, he wrote. First, then, let us see what Paul wrote. In the third chapter of his letter to Titus, he writes, “Put subjects in mind to be obedient to principalities and powers, and to be ready for every good work.” Here you see, I presume, what end he assigns to obedience. In the second chapter of his epistle to Timothy, the same apostle writes, “That we should pray for all men, even for kings and other magistrates, that we may lead a peaceable life, in all godliness and purity.” Here, also, you see that he proposes, as the end of prayer, not the security of kings, but the tranquillity of the church; and, hence, it will be no difficult matter to comprehend his form of prayer.

In his epistle to the Romans, his definition of a king is accurate, even to logical subtlety; for he says that “a king is God’s minister, wielding the sword of the law for the punishment of the bad, and for the support and aid of the good.” “For these passages of Paul’s,” says Chrysostom, “relate not to a tyrant, but to a real and legitimate sovereign, who personates a genuine god upon earth, and to whom resistance is certainly resistance to the ordinance of God.” Yet, though we should pray for bad princes, we ought not, therefore, to infer directly that their vices should not be punished like the crimes of robbers, for whom also we are ordered to pray; nor, if we are bound to obey a good, does it follow that we should not resist a bad prince?

Besides, if you attend to the cause which induced Paul to commit these ideas to writing, you will find, I fear, that this passage is greatly against you; since he wrote them to chastise the temerity of certain persons, who maintained that Christians ought not to be under the control of magistrates. For, since the magistrates were invested with authority on purpose to restrain wicked men, to enable us all to live under equal laws, and to exhibit a living example of divine justice, they contended that he was of no use among persons so uncontaminated by the contagion of vice as to be a law to themselves. Paul, therefore, does not here treat of the magistrate, but of the magistracy—that is, of the function and duty of the person who presides over others, nor of this nor of that species of magistracy, but of every possible form of government.

Nor does he contend against those who maintained that bad magistrates ought not to be punished, but against persons who renounced every kind of authority; who, by an absurd interpretation of Christian liberty, affirmed that it was an indignity to men emancipated by the Son of God, and directed by God’s Spirit, to be controlled by any human power. To refute this erroneous opinion, Paul shows that magistracy is not only a good, but a sacred and divine ordinance, and instituted expressly for connecting assemblages and communities of men, and to enable them, conjointly, to acknowledge God’s blessings, and to abstain from mutual injuries.

Persons raised to the rank of magistrates God has ordered to be the conservators of his laws; and, therefore, if we acknowledge laws to be, as they certainly are, good things, we must also acknowledge that their conservators are entitled to honour, and that their office is a good and useful institution. But the magistrate is terrible. To whom, I beseech you? To the good, or to the bad? To the good he cannot be a terror, as he secures them from injury; but, if he is a terror to the bad, it is nothing to you, who are directed by the Spirit of God. What occasion, then, is there, you will say, for subjecting me to the magistrate, since I am God’s freeman? Much. To prove yourself God’s freeman, obey his laws; for the Spirit of God, of whose direction you boast, framed the laws, approves of magistracy and authorises obedience to the magistrate.

On this head, therefore, we shall easily come to an agreement, that a magistrate is necessary in the best-constituted societies, and that he ought to be treated with every kind of respect. Hence, if any person entertains contrary sentiments, we deem him insane, intestable, and worthy of the severest punishment; since he openly resists God’s will communicated to us in the Scriptures. For, supposing that no punishment for the violation of all laws, human and divine, should be inflicted on a Caligula, a Nero, a Domitian, and other tyrants of that sort, you have here no countenance from Paul, who is discoursing of the power of magistrates and of bad men by whom it is badly exercised. Indeed, if you examine that kind of tyrants by Paul’s rule, they will not at all be magistrates.

Again, if you should contend that even bad princes are ordained by God, take care lest your language should be charged with captiousness. For God, to counteract poison by poison, as an antidote, sometimes sets a bad man over bad men for their punishment; and yet, that God is the author of human wickedness, no man in his senses will dare to affirm, as none can be ignorant that the same God is the author of the punishments inflicted on the wicked. Even a good magistrate generally chooses a bad man to be the executioner in punishing the guilty. This executioner, though thus appointed by the magistrate to that office, is not, in consequence, indulged with impunity for every crime, nor raised so high as not to be amenable to the laws.

On this comparison I shall dwell no longer, lest the sycophants of the court should cry out that I speak with too little reverence of the supreme magistrate. But, let their outcries be ever so loud, certainly they will never be able to deny that the function of the executioner is a part of public, and perhaps also of kingly duty, even by the confession of kings themselves; since, when violence is offered to any public minister, they complain that their own person and majesty are violated. Now, if any thing can, certainly the punishment of the wicked must constitute a part of the king’s executive duty.

In what predicament stand the governors of cities, the commandants of camps, the mayors of corporations, and other superior officers? Does Paul order us to be obedient also to them? or does he hold them private persons? But not only all inferior magistrates, but even those who are upon an equality with kings, it is customary to call to an account for mal-administration. I could wish, therefore, that those who dream of this mighty power conferred on kings by Paul’s words would either show, from the same Paul, that kings alone are to be understood in the name powers, and, therefore, to be alone exempted from legal animadversion; or, if the word powers mean also other magistrates appointed by the authority of the same God for the same purpose, that they would also show where all magistrates are pronounced to be independent of law, and released from the fear of punishment; or, where that immunity has been granted only to kings, and denied to others invested with public authority.

M.—But to the higher powers he commands all to be obedient.

B.—He does so; but under the name of powers he must necessarily comprehend other magistrates also, unless you should, perhaps, imagine that he thought states not under a regal government to be without powers, and therefore mere anarchies. … Paul does not, in the least, refer to tyrants; as they accommodate the whole plan of their government, not to the utility of the people, but to the gratification of their own lusts.</p></blockquote>

Nor does he contend against those who maintained that bad magistrates ought not to be punished, but against persons who renounced every kind of authority; who, by an absurd interpretation of Christian liberty, affirmed that it was an indignity to men emancipated by the Son of God, and directed by God’s Spirit, to be controlled by any human power. To refute this erroneous opinion, Paul shows that magistracy is not only a good, but a sacred and divine ordinance, and instituted expressly for connecting assemblages and communities of men, and to enable them, conjointly, to acknowledge God’s blessings, and to abstain from mutual injuries.

Persons raised to the rank of magistrates God has ordered to be the conservators of his laws; and, therefore, if we acknowledge laws to be, as they certainly are, good things, we must also acknowledge that their conservators are entitled to honour, and that their office is a good and useful institution. But the magistrate is terrible. To whom, I beseech you? To the good, or to the bad? To the good he cannot be a terror, as he secures them from injury; but, if he is a terror to the bad, it is nothing to you, who are directed by the Spirit of God. What occasion, then, is there, you will say, for subjecting me to the magistrate, since I am God’s freeman? Much. To prove yourself God’s freeman, obey his laws; for the Spirit of God, of whose direction you boast, framed the laws, approves of magistracy and authorises obedience to the magistrate.

On this head, therefore, we shall easily come to an agreement, that a magistrate is necessary in the best-constituted societies, and that he ought to be treated with every kind of respect. Hence, if any person entertains contrary sentiments, we deem him insane, intestable, and worthy of the severest punishment; since he openly resists God’s will communicated to us in the Scriptures. For, supposing that no punishment for the violation of all laws, human and divine, should be inflicted on a Caligula, a Nero, a Domitian, and other tyrants of that sort, you have here no countenance from Paul, who is discoursing of the power of magistrates and of bad men by whom it is badly exercised. Indeed, if you examine that kind of tyrants by Paul’s rule, they will not at all be magistrates.

Again, if you should contend that even bad princes are ordained by God, take care lest your language should be charged with captiousness. For God, to counteract poison by poison, as an antidote, sometimes sets a bad man over bad men for their punishment; and yet, that God is the author of human wickedness, no man in his senses will dare to affirm, as none can be ignorant that the same God is the author of the punishments inflicted on the wicked. Even a good magistrate generally chooses a bad man to be the executioner in punishing the guilty. This executioner, though thus appointed by the magistrate to that office, is not, in consequence, indulged with impunity for every crime, nor raised so high as not to be amenable to the laws.

On this comparison I shall dwell no longer, lest the sycophants of the court should cry out that I speak with too little reverence of the supreme magistrate. But, let their outcries be ever so loud, certainly they will never be able to deny that the function of the executioner is a part of public, and perhaps also of kingly duty, even by the confession of kings themselves; since, when violence is offered to any public minister, they complain that their own person and majesty are violated. Now, if any thing can, certainly the punishment of the wicked must constitute a part of the king’s executive duty.

In what predicament stand the governors of cities, the commandants of camps, the mayors of corporations, and other superior officers? Does Paul order us to be obedient also to them? or does he hold them private persons? But not only all inferior magistrates, but even those who are upon an equality with kings, it is customary to call to an account for mal-administration. I could wish, therefore, that those who dream of this mighty power conferred on kings by Paul’s words would either show, from the same Paul, that kings alone are to be understood in the name powers, and, therefore, to be alone exempted from legal animadversion; or, if the word powers mean also other magistrates appointed by the authority of the same God for the same purpose, that they would also show where all magistrates are pronounced to be independent of law, and released from the fear of punishment; or, where that immunity has been granted only to kings, and denied to others invested with public authority.

M.—But to the higher powers he commands all to be obedient.

B.—He does so; but under the name of powers he must necessarily comprehend other magistrates also, unless you should, perhaps, imagine that he thought states not under a regal government to be without powers, and therefore mere anarchies. … Paul does not, in the least, refer to tyrants; as they accommodate the whole plan of their government, not to the utility of the people, but to the gratification of their own lusts.”

— George Buchanan, De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 55-57, 58-59.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CM.%E2%80%94Though+we+should+admit+the+justness+of+your+reasonings+upon+that+ancient+example%2C+we+are+still+more+closely+pressed+by+a+more+modern+instance+in+Paul%2C+who+commands+us+to+pray+for+the+life+of+sovereigns%2C+and+is+far+from+allowing+us+to+renounce+their+authority%2C+much+less+to+dethrone%2C+and%2C+when+dethroned%2C+to+murder+them.+And+what+princes+does+he+thus+recommend+to+our+prayers%3F+Of+all+that+ever+existed+the+most+cruel%2C+Tiberius%2C+Caligula%2C+Claudius%2C+and+Nero%3B+for+these+were+co-eval+with+the+epistles+of+Paul.%0A%0AB.%E2%80%94In+comparing+the+writings+of+all+the+philosophers+and+lawyers+with+Paul%E2%80%99s%2C+you+seem+to+me+to+act+rightly%2C+in+allowing+to+his+authority+so+much+preponderance+in+the+balance.+But+you+should+consider+whether+you+have+sufficiently+weighed+his+opinions%3B+for+you+ought+to+examine%2C+not+only+his+words%2C+but+also+at+what+times%2C+to+what+persons%2C+and+for+what+purposes%2C+he+wrote.+First%2C+then%2C+let+us+see+what+Paul+wrote.+In+the+third+chapter+of+his+letter+to+Titus%2C+he+writes%2C+%E2%80%9CPut+subjects+in+mind+to+be+obedient+to+principalities+and+powers%2C+and+to+be+ready+for+every+good+work.%E2%80%9D+Here+you+see%2C+I+presume%2C+what+end+he+assigns+to+obedience.+In+the+second+chapter+of+his+epistle+to+Timothy%2C+the+same+apostle+writes%2C+%E2%80%9CThat+we+should+pray+for+all+men%2C+even+for+kings+and+other+magistrates%2C+that+we+may+lead+a+peaceable+life%2C+in+all+godliness+and+purity.%E2%80%9D+Here%2C+also%2C+you+see+that+he+proposes%2C+as+the+end+of+prayer%2C+not+the+security+of+kings%2C+but+the+tranquillity+of+the+church%3B+and%2C+hence%2C+it+will+be+no+difficult+matter+to+comprehend+his+form+of+prayer.%0A%0AIn+his+epistle+to+the ursing+of+the+power+of+magistrates+and+of+bad+men+by+whom+it+is+badly+exercised.+Indeed%2C+if+you+examine+that+kind+of+tyrants+by+Paul%E2%80%99s+rule%2C+they+will+not+at+all+be+magistrates.%0A%0AAgain%2C+if+you+should+contend+that+even+bad+princes+are+ordained+by+God%2C+take+care+lest+your+language+should+be+charged+with+captiousness.+For+God%2C+to+counteract+poison+by+poison%2C+as+an+antidote%2C+sometimes+sets+a+bad+man+over+bad+men+for+their+punishment%3B+and+yet%2C+that+God+is+the+author+of+human+wickedness%2C+no+man+in+his+senses+will+dare+to+affirm%2C+as+none+can+be+ignorant+that+the+same+God+is+the+author+of+the+punishments+inflicted+on+the+wicked.+Even+a+good+magistrate+generally+chooses+a+bad+man+to+be+the+executioner+in+punishing+the+guilty.+This+executioner%2C+though+thus+appointed+by+the+magistrate+to+that+office%2C+is+not%2C+in+consequence%2C+indulged+with+impunity+for+every+crime%2C+nor+raised+so+high+as+not+to+be+amenable+to+the+laws.%0A%0AOn+this+comparison+I+shall+dwell+no+longer%2C+lest+the+sycophants+of+the+court+should+cry+out+that+I+speak+with+too+little+reverence+of+the+supreme+magistrate.+But%2C+let+their+outcries+be+ever+so+loud%2C+certainly+they+will+never+be+able+to+deny+that+the+function+of+the+executioner+is+a+part+of+public%2C+and+perhaps+also+of+kingly+duty%2C+even+by+the+confession+of+kings+themselves%3B+since%2C+when+violence+is+offered+to+any+public+minister%2C+they+complain+that+their+own+person+and+majesty+are+violated.+Now%2C+if+any+thing+can%2C+certainly+the+punishment+of+the+wicked+must+constitute+a+part+of+the+king%E2%80%99s+executive+duty.%0A%0AIn+what+predicament+stand+the+governors+of+cities%2C+the+commandants+of+camps%2C+the+mayors+of+corporations%2C+and+other+superior+officers%3F+Does+Paul+order+us+to+be+obedient+also+to+them%3F+or+does+he+hold+them+private+persons%3F+But+not+only+all+inferior+magistrates%2C+but+even+those+who+are+upon+an+equality+with+kings%2C+it+is+customary+to+call+to+an+account+for+mal-administration.+I+could+wish%2C+therefore%2C+that+those+who+dream+of+this+mighty+power+conferred+on+kings+by+Paul%E2%80%99s+words+would+either+show%2C+from+the+same+Paul%2C+that+kings+alone+are+to+be+understood+in+the+name+powers%2C+and%2C+therefore%2C+to+be+alone+exempted+from+legal+animadversion%3B+or%2C+if+the+word+powers+mean+also+other+magistrates+appointed+by+the+authority+of+the+same+God+for+the+same+purpose%2C+that+they+would+also+show+where+all+magistrates+are+pronounced+to+be+independent+of+law%2C+and+released+from+the+fear+of+punishment%3B+or%2C+where+that+immunity+has+been+granted+only+to+kings%2C+and+denied+to+others+invested+with+public+authority.%0A%0AM.%E2%80%94But+to+the+higher+powers+he+commands+all+to+be+obedient.%0A%0AB.%E2%80%94He+does+so%3B+but+under+the+name+of+powers+he+must+necessarily+comprehend+other+magistrates+also%2C+unless+you+should%2C+perhaps%2C+imagine+that+he+thought+states+not+under+a+regal+government+to+be+without+powers%2C+and+therefore+mere+anarchies.+%E2%80%A6+Paul+does+not%2C+in+the+least%2C+refer+to+tyrants%3B+as+they+accommodate+the+whole+plan+of+their+government%2C+not+to+the+utility+of+the+people%2C+but+to+the+gratification+of+their+own+lusts.%E2%80%9D%0A%0A%E2%80%94+George+Buchanan%2C+De+Jure+Regni+Apud+Scotos%3B+A+Dialogue+Concerning+the+Rights+of+the+Crown+in+Scotland%2C+trans.+Robert+MacFarlan+%281579%3B+Colorado+Springs%3A+Portage+Publications%2C+2016%29%2C+pp+55-57%2C+58-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffafdcbf39.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ffafdcbf39.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/28/george-buchanan-does-paul-endorse-tyranny/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Having set the understanding of the main Text [Romans 13] right, I come now to those examples that are alleged to prove, That it is lawful to resist in some cases.

1. The example of the peoples resisting Saul’s illegal and tyrannical attempt to have put Jonathan to death without cause.

If this were lawful in them in a particular man’s case (against whom also there was some seeming cause) How much more to resist one that is bent to subvert Religion, Laws and Liberties, and so to take away the life of many at his own pleasure.

To this is answered, not, that it was unlawful in the people to make this resistance (which yet if he deny not, he plainly yields his cause in his first Proposition, and Rom. 13.2. forbids not all Resistance) but only that the people drew not into Arms themselves, but being there at Saul’s command did by a loving violence and importunity hinder the execution of a particular and passionate unlawful command.

To this I reply.

1. If it were lawful now; what hinders but they might have come together to prevent such a mischief as Jonathan’s unjust Death? Sure Saul called them not together to resist himself in any thing. Neither did his calling them together to fight against the Philistines authorize them to fight against him, if it were not lawful of it self.

Our King called the Parliament together, yet he allows not them to resist upon that pretence, though they are undeniably, not the great Council only, but the great Court of Judicature in the Kingdom.

This peace then of his Answer is nothing but words and pretence.

2. As for his loving violence and importunity wherewith he would blanch their Resistance.

Grant they shewed a love to Saul, because Jonathan was Saul’s son. But had Saul counted him his Enemy, (as he did David afterward) It would have sounded harsh violence, and outrageous enough, and it was plainly a great deal beyond a loving violence. For Saul swore his death, and they swore his life, that not a hair of him should, &amp;c.

This was Resistance then with an Oath, as it were, to make Saul forsworn.

After this Example then our people may swear an Association, that not one of the Parliament shall be put to death (unless proved guilty according to Law) notwithstanding any Proclamation of them to be Traitors, or condemning them to death illegally.

3. And thirdly, as it cannot be thought, but if Saul had further attempted by himself, or any of his followers to assault Jonathan, the people would have actively resisted him and them even with arms in Jonathan’s defence.

The second Example is David’s resisting of Saul, sc. by gathering a band of 600. men, and offering to have kept Keilah against Saul, but that God told him the Kilties would have betrayed him.

That he sinned not in it appears.

1. By his own pleading his innocence even to God in his Prayers and Psalms, as far as concerned the business between him and Saul.

2. Himself after this pleads it to Saul, 1 Sam. 24 &amp; 26. and calls God to witness that he had not transgressed at all against him.

3. God himself discharged David from all notorious sin, excepting the matter of Uriah, 1 Kin. 1.5.

Now had not his Resistance been lawful, it had been most notorious Rebellion and Treason.

4. Fourthly, even our Doctor condemns it not, and therefore, all resistance is not unlawful, much less damnable, as he often thunders.

But this Example sticks with him, and therefore he makes a four-fold answer.

1. David’s guard that he had about him was only to secure his person against the cut-throats of Saul, if sent to take away his life.

Reply. But this could not have been done without killing divers of them, if they had assaulted him, which had then been no murder, but a just defence and execution of Justice. So far himself grants lawful.

2. But he says it was a mere defence without any violence offered to Saul. Therefore he still gave place as Saul pursued, and did no act of hostility to him, or any of his Army, when they were in his power, 1 Sam. 26.

Reply. He was not strong enough to encounter Saul in the field, who had divers thousands (3000 mentioned 1 Sam. 13.) against his 600. Wisdom bids him fly as long as he could, rather then fight.

2. Conscience forbids him to kill Saul: so I grant it doth any Subject, though having the King at any such advantage. But that he hurt none of his followers, 1 Sam. 26. was again an act of wisdom, and we need not go to conscience for a reason of it. He had only one man with him, Abishai, and had he offered to kill any of the Army, how soon might this in all likelihood have wakened the rest, and so he had endangered his own life to little purpose. For he could not in probability have killed many, and what had that done to his cause and defence afterward.

Yet also, I hold not that in cold blood, one or many that are upon the defensive, may lawfully kill sleeping enemies, or such waking farther then appears, at least in some sort necessary, or much advantageous to the defence, and prejudicial to the opposites. But if killing, as many as David could have killed that night, himself and Abishai would have given hopes of ending Saul’s pursuit of him, and have made peace; I doubt not, but he would and might have done it, as well as keep Keilah against him.</p></blockquote>

The second Example is David’s resisting of Saul, sc. by gathering a band of 600. men, and offering to have kept Keilah against Saul, but that God told him the Kilties would have betrayed him.

That he sinned not in it appears.

1. By his own pleading his innocence even to God in his Prayers and Psalms, as far as concerned the business between him and Saul.

2. Himself after this pleads it to Saul, 1 Sam. 24 &amp; 26. and calls God to witness that he had not transgressed at all against him.

3. God himself discharged David from all notorious sin, excepting the matter of Uriah, 1 Kin. 1.5.

Now had not his Resistance been lawful, it had been most notorious Rebellion and Treason.

4. Fourthly, even our Doctor condemns it not, and therefore, all resistance is not unlawful, much less damnable, as he often thunders.

But this Example sticks with him, and therefore he makes a four-fold answer.

1. David’s guard that he had about him was only to secure his person against the cut-throats of Saul, if sent to take away his life.

Reply. But this could not have been done without killing divers of them, if they had assaulted him, which had then been no murder, but a just defence and execution of Justice. So far himself grants lawful.

2. But he says it was a mere defence without any violence offered to Saul. Therefore he still gave place as Saul pursued, and did no act of hostility to him, or any of his Army, when they were in his power, 1 Sam. 26.

Reply. He was not strong enough to encounter Saul in the field, who had divers thousands (3000 mentioned 1 Sam. 13.) against his 600. Wisdom bids him fly as long as he could, rather then fight.

2. Conscience forbids him to kill Saul: so I grant it doth any Subject, though having the King at any such advantage. But that he hurt none of his followers, 1 Sam. 26. was again an act of wisdom, and we need not go to conscience for a reason of it. He had only one man with him, Abishai, and had he offered to kill any of the Army, how soon might this in all likelihood have wakened the rest, and so he had endangered his own life to little purpose. For he could not in probability have killed many, and what had that done to his cause and defence afterward.

Yet also, I hold not that in cold blood, one or many that are upon the defensive, may lawfully kill sleeping enemies, or such waking farther then appears, at least in some sort necessary, or much advantageous to the defence, and prejudicial to the opposites. But if killing, as many as David could have killed that night, himself and Abishai would have given hopes of ending Saul’s pursuit of him, and have made peace; I doubt not, but he would and might have done it, as well as keep Keilah against him.”

— Herbert Palmer, Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar, (London: John White, 1643), pp 10-12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHaving+set+the+understanding+of+the+main+Text+%5BRomans+13%5D+right%2C+I+come+now+to+those+examples+that+are+alleged+to+prove%2C+That+it+is+lawful+to+resist+in+some+cases.%0A%0A1.+The+example+of+the+peoples+resisting+Saul%E2%80%99s+illegal+and+tyrannical+attempt+to+have+put+Jonathan+to+death+without+cause.%0A%0AIf+this+were+lawful+in+them+in+a+particular+man%E2%80%99s+case+%28against+whom+also+there+was+some+seeming+cause%29+How+much+more+to+resist+one+that+is+bent+to+subvert+Religion%2C+Laws+and+Liberties%2C+and+so+to+take+away+the+life+of+many+at+his+own+pleasure.%0A%0ATo+this+is+answered%2C+not%2C+that+it+was+unlawful+in+the+people+to+make+this+resistance+%28which+yet+if+he+deny+not%2C+he+plainly+yields+his+cause+in+his+first+Proposition%2C+and+Rom.+13.2.+forbids+not+all+Resistance%29+but+only+that+the+people+drew+not+into+Arms+themselves%2C+but+being+there+at+Saul%E2%80%99s+command+did+by+a+loving+violence+and+importunity+hinder+the+execution+of+a+particular+and+passionate+unlawful+command.%0A%0ATo+this+I+reply.%0A%0A1.+If+it+were+lawful+now%3B+what+hinders+but+they+might+have+come+together+to+prevent+such+a+mischief+as+Jonathan%E2%80%99s+unjust+Death%3F+Sure+Saul+called+them+not+together+to+resist+himself+in+any+thing.+Neither+did+his+calling+them+together+to+fight+against+the+Philistines+authorize+them+to+fight+against+him%2C+if+it+were+not+lawful+of+it+self.%0A%0AOur+King+called+the+Parliament+together%2C+yet+he+allows+not+them+to+resist+upon+that+pretence%2C+though+they+are+undeniably%2C+not+the+great+Council+only%2C+but+the+gr <blockquote><p>I. The first thing is, to take notice of some of those pernicious winds wherewith the church of Christ is infested while here in a militant state.

1. Then, There is the wind of open violence, persecution, and bloodshed. The roaring lion he delights in blood, especially the blood of the saints, who are the true seed of the woman, and therefore commonly this is the first thing that he essays in order to ruin the church of Christ. Hence he instigated Cain to slay his brother Abel. He instigated the Jews to crucify the Lord of glory, and to persecute his apostles: and the Romans, by ten several persecutions, to raze the Christian church if possible from the face of the earth.

And it is well known how he did instigate malignant men in power under some reigns before the late revolution, to essay, by persecution and bloodshed, to raze a covenanted reformation, and all that owned it, from off the face of the earth. And we see the same spirit of enmity at this day raging against that same work and cause under another denomination; only the great Angel of the covenant does not allow as yet that wind to blow; but how soon the permission is given, I make no doubt but we may see the Grassmarket, and other places through Scotland, reeking as fast as ever with the blood of the saints.</p></blockquote>

<blockquote><p>Seeing therefore that God will not princes commandments should be obeyed in all things, but will have his rather suffer a thousand deaths, than do any thing that is evil: and sense also so many evils and mischiefs may follow in this life, where wicked princes wills may stand for laws, men ought both for God’s sake and commandment abstain to obey such commandments, and cleave unto this Maxim: we must obey God rather than man, for whose sake if we lose both goods and life, we ought to rejoice, that we be called to serve him, and not doubt, but as he is able to recompense it, so will he (according to his promise) reward it.

And besides also they ought to consider, that princes be ordained for the wealth and benefit of the people, and not to their destruction: to maintain common wealths, and not to subvert them: which rather than any man should consent unto, he ought (being a faithful man to his country) to abide all losses, both of body and goods. For next after God, men be borne to love, honour, and maintain their country.</p></blockquote>

<blockquote><p>To be taken without consent from my home and friends; to lose my liberty; to undergo all those assaults on my personality which modern psychotherapy knows how to deliver; to be re-made after some pattern of “normality” hatched in a Viennese laboratory to which I never professed allegiance; to know that this process will never end until either my captors have succeeded or I grown wise enough to cheat them with apparent success – who cares whether this is called Punishment or not? That it includes most of the elements for which any punishment is feared – shame, exile, bondage, and years eaten by the locust – is obvious. …

Of all tyrannies a tyranny sincerely exercised for the good of its victims may be the most oppressive. It may be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth.

Their very kindness stings with intolerable insult. To be “cured” against one’s will and cured of states which we may not regard as disease is to be put on a level with those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals. But to be punished, however severely, because we have deserved it, because we “ought to have known better”, is to be treated as a human person made in God’s image.

In reality, however, we must face the possibility of bad rulers armed with a Humanitarian theory of punishment. … And when they are wicked· the Humanitarian theory of punishment will put in their hands a finer instrument of tyranny than wickedness ever had before. For if crime and disease are to be regarded as the same thing, it follows that any state of mind which our masters choose to call “disease” can be treated as crime; and compulsorily cured. It will be vain to plead that states of mind which displease government need not always involve moral turpitude and do not therefore always deserve forfeiture of liberty.

For our masters will not be using the concepts of Desert and Punishment but those of disease and cure. We know that one school of psychology already regards religion as a neurosis. When this particular neurosis becomes inconvenient to government, what is to hinder government from proceeding to “cure” it? Such “cure” will, of course, be compulsory; but under the Humanitarian theory it will not be called by the shocking name of Persecution. No one will blame us for being Christian, no one will hate us, no one will revile us.

The new Nero will approach us with the silky manners of a doctor, and though all will be in fact as compulsory as the tunica molesta or Smithfield or Tyburn, all will go on within the unemotional therapeutic sphere where words like “right” and “wrong” or “freedom” and “slavery” are never heard. And thus when the command is given, every prominent Christian in the land may vanish overnight into Institutions for the Treatment of the Ideologically Unsound, and it will rest with the expert gaolers to say when (if ever) they are to re-emerge. But it will not be persecution. Even if the treatment is painful, even if it is life-long, even if it is fatal, that will be only a regrettable accident; the intention was purely therapeutic.</p></blockquote>

Of all tyrannies a tyranny sincerely exercised for the good of its victims may be the most oppressive. It may be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth.

</figure><figure class="quote" id="q-5a557e53a6" data-kw="">
<blockquote><p>Let us now look at the position which the original Covenanters occupied among the great parties that were in the land. From the representations frequently given of them, one would suppose that they were the most extreme among all the fanatics of the country. But, when we appeal, from the servile cant of modern liberality, and from the current slang of high church sycophancy, to the tribunal of sober history, it appears undeniable, that of all the parties in the country, the Covenanters alone maintained the principles of the British constitution.

Their opinions were equally opposed to those of the cavaliers, who urged Charles forward in the path of usurpation; and to those of the sectarians, who overthrew the monarchy, and brought the king to the scaffold. Thus opposed, and equally opposed, to arbitrary power, and to sectarian anarchy, the original Covenanters, of all parties then in the land, were most undeserving of the name of bigots. The cavaliers were bigots, though they wanted religion, for they urged on the king to his ruin, and plunged the nation into all the horrors of a civil war, without any wise, or even plausible pretence. The sectarians may, with much justice, be accused of bigotry, for they sacrificed the interests of their country for the miserable object of party aggrandisement.

But it can with no plausibility be brought as a charge against the original Covenanters, who were equally sworn to maintain authority, and to resist its encroachments. If the king had been of their principles, the civil war would have been prevented. If the sectaries had been of their principles, the civil war would have settled the contest for British freedom, while the latter, by their anarchy, postponed its settlement until the revolution.</p></blockquote>

<blockquote><p>Times of persecution press severely on the weak and timid; but experience has decisively proved, that so far from these being the circumstances from which true religion has the most to apprehend, the very contrary is undeniable. The constancy with which the victims of bigotry bore their bodily sufferings, though heightened by all the ingenious devices which the most devilish malignity could invent, and the divine support which they manifestly experienced under the severest tortures, operated more powerfully in favour of Christianity, than all the terrors of a cruel death against it; so that it even passed into an axiom, “The blood of the martyrs was the seed of the church.” In seasons of persecution men are naturally driven to fundamentals. They are necessarily prompted to examine their own hearts, and to endeavour to ascertain their title to the blessed hopes and privileges of true Christians.</p></blockquote>

</figure><figure class="quote" id="q-2b807bfe23" data-kw="">
<blockquote><p>It is rebellion to break the law of the land, when it is not contrary to the word of God; but when the law commands to do what God has forbidden, to refuse obedience is not to infringe the rights of sovereigns, but to maintain the rights of God, to maintain his sole supremacy over the conscience, which can only be maintained, by obeying God rather than man, in all cases where their commands come into collision. This principle of obeying God rather than man, has been the guardian of freedom and religion in the days that are past; and woe to the land, to the church, to the human race, when it shall generally be accounted right to obey man rather than God. Allowing therefore, it could be shown, that the conduct of the Covenanters was in some respects contrary to the law of the land, this will not prove them to be guilty of rebellion, until all those laws to which their conduct was opposed, are proved to be agreeable to the word of God.

Had the Covenanters possessed no rights but such as belong to every individual, these statements would have vindicated them from the charge of rebellion. But it ought not to be forgotten that the Covenanters at this time were THE SCOTTISH Nation; they were the body politic in which all power is radically inherent, from which all authority emanates, – which is superior to kings and parliaments, and which in the proper sense of the word, never can be guilty of rebellion. And if all national power and authority be inherent in the nation, if rulers are merely the organs of the community, then, when they set aside the laws and constitutions of the kingdom, when they cease to answer the ends for which they have been raised to the thrones of justice, when they oppose and oppress not merely a minority of their subjects, but oppose and oppress the majority of the nation from whom all their authority is derived, in such circumstances a nation has the right, and it is its duty, to resume into its own hands that authority which is used against the public interests.

On these principles, the covenanting nation of Scotland would have been warranted in suspending their monarch, until he learned to respect the liberties of his subjects, and the laws of the kingdom, and therefore, they were more than justified in the comparatively mild course which they adopted. To maintain that a nation so unanimous as Scotland then was, is chargeable with rebellion for resisting a king who was undermining the constitutional freedom of the country, would be to lay down a doctrine sufficient to enslave the whole world, and which must be opposed by every one who respects her Majesty’s title to the British throne; her predecessors having been called to that exalted station, only in consequence of our fathers having deposed James the Seventh.</p></blockquote>

On these principles, the covenanting nation of Scotland would have been warranted in suspending their monarch, until he learned to respect the liberties of his subjects, and the laws of the kingdom, and therefore, they were more than justified in the comparatively mild course which they adopted. To maintain that a nation so unanimous as Scotland then was, is chargeable with rebellion for resisting a king who was undermining the constitutional freedom of the country, would be to lay down a doctrine sufficient to enslave the whole world, and which must be opposed by every one who respects her Majesty’s title to the British throne; her predecessors having been called to that exalted station, only in consequence of our fathers having deposed James the Seventh.”

<blockquote><p>As to the Confession of Faith,

1. How does their refusing to pray for the queen, to pay her cess, and to own her authority, because she is not a covenanted Queen, agree with the Confession of Faith, chap. 23, § 4, “It is the duty of people to pray for magistrates, to pay them tribute and other dues, and to be subject to their authority for conscience sake: infidelity, or difference in religion, doth not make void the magistrate’s just and legal authority?”

I know they will say, that article is meant of lands not covenanted: there had been some shadow of force in this perhaps, if this Confession of Faith had been framed before the Covenant: but upon the contrary it was long after, and was the product of the Solemn League and Covenant, as appears from the first article of the Covenant, in these words, “And shall endeavour to bring the churches of God in the three kingdoms to the nearest conjunction and uniformity in religion, confession of faith,” etc. The Solemn League and Covenant was sworn in the year 1643, the Confession of Faith was sent hither and approven by the Assembly not till the year 1647, for which see the Act of assembly, printed before the Confession. And can we think, that those who, in pursuance of the covenant, framed this Confession of Faith, to declare to the world the faith of covenanters, would so juggle, as to put in articles of faith which would bind others, but not themselves?

2. How does their reckoning the taking the oath of allegiance to the Queen, one of the steps of the Church’s defection, consist with Confession, chap. 22, §2, “A lawful oath, being imposed by lawful authority, in such matters ought to be taken;” and §3, of the same chapter, “Yet it is a sin to refuse an oath, touching any thing that is good and just, being imposed by lawful authority?” It is true, they reckon her no lawful Queen; but one error will not atone for another.

The famous author of the Apologetical Relation [John Brown of Wamphray] was not of our dissenters’ mind (nay, he thought there had been no Christian of their mind, and for ought I know there were none in these days), for, speaking of the reasons why the oath of Supremacy, called then, tho’ falsely, the oath of allegiance, should be refused, and answering this objection, viz. such as refuse this oath of Allegiance, declare that they are not dutiful and loyal subjects, he saith, “It hath been shown what difference there is betwixt this oath and the oath of allegiance; and there is no minister or Christian should scruple at the taking the pure oath of allegiance,” Apol. Rel. p. 259. If it was this author’s mind, that no minister or Christian should have scrupled the oath of Allegiance to King Charles II. when he had taken the Covenant, broken it, and overturned the work of Reformation, sure, he would far less have thought it a sin to take the oath of allegiance to the present Queen.

3. How doth their separating from this Church, lest they be involved in the guilt of the corruptions amongst us, by keeping communion with us, agree with Conf. chap. 26, §2, “Saints, by profession, are bound to maintain an holy fellowship and communion in the worship of God; — which communion, as God offereth opportunity, is to be extended to all those who in every place call upon the name of the Lord Jesus?”

4. How doth that principle of theirs, sometime at least owned by them, though left out in their last paper, against the power of the magistrate to call assemblies, agree with Conf. chap. 31 §2, “As magistrates may lawfully call a synod of ministers, and other fit persons to consult and advise with about matters of religion?” and with Act of Assembly 1638, sess. 26, concerning yearly General Assemblies, where they say, “If, in the meantime, it shall please the king’s majesty to indite a General Assembly, ordaineth all presbyteries, universities, and burghs, to send their commissioners, for keeping the time and place which shall be appointed by his majesty’s proclamation?” They cry out on the encroachment of the magistrates in dissolving Assemblies; but as our Assemblies are constituted in the name of Christ, so are they dissolved in his name.

What dissolution the magistrate makes, is looked upon as the dismissing of the members. There have indeed been encroachments made by the magistrate in dissolving Assemblies before they had done their business, and there have been protestations made against this. And though, in the late paper, they charge the Church for not protesting against the encroachments, and recording the same; yet that protestations have not been made against them, is an untruth: but where the magistrate’s deed is not recorded, neither are the protestations recorded.

I was eye and ear-witness to the magistrate’s dissolving the Assembly in the midst of business; and protestations were made against it, and for the Church’s intrinsic power; and, from every corner of the house, members adhering thereto. And this protesting is recorded in the Acts of Assembly; so that, from my certain knowledge, I can say they speak an untruth in that charge in the declinature; yea, I have the Acts of the Assembly by me, where they, or any that question the truth of what I say, may read it with their own eyes.

5. How doth their rejecting and despising the testimony of the Commission of the General Assembly against the Union, and reproaching them for it, because it was given into the Parliament by way of humble address, and not by way of protestation, agree with Confession, chap. 31, §5, “Synods and councils are to handle and conclude nothing but that which is ecclesiastical, and are not to intermeddle with civil affairs, which concern the commonwealth, unless, by way of humble petition, in cases extraordinary, or by way of advice, for satisfaction of conscience, if they be thereunto required by the civil magistrate?”

Lastly, How does their crying out on the magistrate’s occasionally appointing fasts and thanksgivings, agree with the Confession of Faith, allowing the magistrate to call Assemblies? This I spoke to formerly in another sermon. And further, how agrees it with the last paragraph of the Directory concerning public solemn fasting, where we have these words, “Besides solemn and general fasts enjoined by authority, we judge,” etc. It may be observed how frequently the apostles enjoin obedience to magistrates, and honouring of them, as 1 Tim. ii. 1, 2, “I exhort therefore, that prayers be made for kings, and for all that are in authority.” Rom. xiii. 1, “Let, every soul be subject unto the higher powers,” etc. Tit. iii. 1, “Put them in mind to be subject to principalities and powers, to obey magistrates.” 1 Pet. ii. 13, and downwards.

All which may shew us, that we have no more right to take away the fifth command out of the decalogue, that requires obedience to magistrates, than the Papists have to take away the second, which condemns their idolatry. I think there is a strange inclination amongst some that profess religion, not only amongst dissenters, but others, to speak evil of dignities, and to embrace every thing that may make against the magistrate; so that the murdering of King Charles I, wherewith Presbyterians are slandered by Papists and malignants, is owned and adopted by some, as if it had been a laudable action.

Wo is me! that ignorance, and an inclination to vilify magistrates, should give such an handle to the enemy against us. If it was such a glorious action, the sectaries must have the glory of it; for it was they, and not Presbyterians, that did the deed, and it was protested against by the commissioners both from the Church and state of Scotland, for which they were hardly used at London; for which see Apol. Rel. p. 64.

Yea, the General Assembly of the Church of Scotland, 1649, gave their testimony against it in their seasonable warning, sess. 27, they say, “That prevailing party of societies in England, who have broken the covenant — and taken away the king’s life, look upon us with an evil eye.” And in their exhortation to their brethren in England, “We have obtained this mercy, to be steadfast to our old principles, in bearing free and faithful testimony against their proceedings, both in reference to the toleration and government, and the taking away the king’s life.” And in their letter to the king, “We do from our hearts abominate and detest that horrid fact of the sectaries, against the life of your royal father our sovereign.” Both which are to be found in the last session of that Assembly.</p></blockquote>

</figure><figure class="quote" id="q-c80d058755" data-kw="">
<blockquote><p>The state of the controversy: Whether in order to public obedience in civil government, the consideration of the things commanded (as they are not in themselves bad) be above the circumstantial qualification of the persons commanding? As to do the offices of a judge or justice of the peace by virtue of commission derived from any governor whatever.</p></blockquote>

— Anthony Ascham, A Reply to a Paper of Dr. Sanderson’s, (London: 1650) 22 pp., p. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+state+of+the+controversy%3A+Whether+in+order+to+public+obedience+in+civil+government%2C+the+consideration+of+the+things+commanded+%28as+they+are+not+in+themselves+bad%29+be+above+the+circumstantial+qualification+of+the+persons+commanding%3F+As+to+do+the+offices+of+a+judge+or+justice+of+the+peace+by+virtue+of+commission+derived+from+any+governor+whatever.%E2%80%9D%0A%0A%E2%80%94+Anthony+Ascham%2C+A+Reply+to+a+Paper+of+Dr.+Sanderson%E2%80%99s%2C+%28London%3A+1650%29+22+pp.%2C+p.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc80d058755.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c80d058755.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=The%20state%20of%20the%20controversy%3A%20Whether,commission%20derived%20from%20any%20governor%20whatever&amp;text=The%20state%20of%20the%20controversy%3A%20Whether%20in%20order&amp;text=virtue%20of%20commission%20derived%20from%20any%20governor%20whatever" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c81f8ffed3" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Resolution of Conscience</cite>, (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power. Out of which men may satisfy their scruples concerning the present Subscription and Engagement [to Cromwell’s regime] (London: 1649) 6 pp.</span></figcaption>

<blockquote><p>Usurpation is an intrusion into the seat of authority, a presuming to possess and manage the place and power thereof without a lawful calling, right, or title thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers</cite>, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, p. 1</span></figcaption>

<blockquote><p>When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…</p></blockquote>

<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend:

1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it.

2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less…

3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>

C+were+there+no+authority%3B+or+if+a+just+authority+were+in+being%2C+yet+if+it+could+not%2C+or+did+not%2C+maturely+enough+call+us+forth+to+it.%0A%0A2.+Payment+of+taxes+and+bearing+other+impositions+for+the+usurping+power%2C+where%2C+and+while+we+are+under+his+compulsive+power%2C+because+such+contributions+may%2C+and+will+be+taken+whether+I+will+pay+them+or+not%3B+and+I+yield+them+under+his+enforcement%2C+as+a+ransom+for+my+life%2C+or+liberty%2C+or+somewhat+else+that+is+better+to+me+than+the+payment%3B+and+consequently+I+am+to+choose+the+parting+with+it+as+the+less+evil%2C+rather+than+with+that+which+is+better%2C+which+to+loose+is+to+incur+a+greater+evil+for+the+avoidance+of+a+less%E2%80%A6%0A%0A3.+Complaining%2C+petitioning+or+going+to+law+before+the+magistrates+or+courts+authorized+by+the+usurpers+provided+you+give+not+the+usurpers+to+whom+you+petition+such+titles+as+you+give+to+the+lawful+magistrate%29.+%28%E2%80%9C%E2%80%A6excusantur+%C3%A0+peccato+inducendi+tyrannum+ad+actum%2C+et+opus+illicitum+petentes+ab+illo+iustitiam%2C+quia+non+petunt+actum+illicitum%2C+sed+justitiam+illius+actus+illiciti%E2%80%A6+pie+interpretandae+sunt+petitiones+tam+iustitiae+quam+honestae+gratiae+quae+offeruntur+tyrannis%2C+s.+si+vis%2C+seu+ex+quo+vis+detinere%2C+et+exercere+hoc+dominium%2C+utere+illo+iuste%2C+utere+honeste%2C+utere+pie%2C+utere+ad+utilitatem+publicam%2C+et+privatorum%2C+prout+deceret+dominium%E2%80%A6+nec+intendunt%2C+nec+petunt+actum+usurpatum%2C+sed+qualitatem+sanctam+inactu+usurpato+exercendo.%E2%80%9D+Cajetan%2C+Summula+%5BVenice%3A+Carampellum%2C+1596%5D%2C+title%3A+Rempublicam+tyrannice+occupare%E2%80%A6+%5Bpp.+411-12%5D%29+In+thus+doing%2C+I+seek+my+necessary+self-preservation%3B+neither+do+I+yield+or+ascribe+to+them+to+whom+I+have+recourse+any+just+power+of+judicature+or+participate+in+their+sin+of+usurping+it%3B+only+I+acknowledge+they+have+might+and+ability+in+their+hand+to+right+me%3B+which%2C+though+they+ought+not+to+assume%2C+yet+I+may+take+the+benefit+of+their+unjust+use+of+it%3B+as+a+poor+man+may+receive+relief+at+the+hands+of+him+that+has+gotten+those+goods+he+distributes+unjustly%3B+and+I+may+receive+my+money%2C+with+a+good+conscience%2C+from+the+hands+of+a+thief+that+is+willing+to+return+it+to+me+though+he+took+it+by+robbery+from+another+thief+that+robbed+me+of+it%3B+and+if+the+party%2C+with+whom+I+have+a+controversy+for+my+right+will+agree+to+refer+the+matter+betwixt+us+to+a+private+person+as+an+arbitrator%2C+and+stand+to+his+arbitrement%3B+that+is+a+lawful+means+of+coming+by+my+own%2C+though+by+his+help+and+award+that+has+not+claim+of+authority+over+me%E2%80%A6+But%2C+in+granting+liberty+of+concurrence+with+some+commands+of+an+usurped+authority%2C+we+neither+yield+any+obedience+at+all+to+be+due%2C+or+performable+to+it%3B+nor+can+we+allow+a+correspondence+with+it+in+diverse+things%2C+and+therefore+we+are+to+put+a+difference%3A+First%2C+betwixt+things+that+are+in+themselves+necessary%2C+and+those+that+are+of+a+middle+or+an+indifferent+nature+in+themselves+considered%E2%80%A6+2.+Betwixt+moral%2C+or+prudential+acts+competible+%5Bcompetent%5D+to+private+men+or+subjects%2C+and+political+acts+or+judicial+proceedings+that+flow+from+power+and+authority+inherent+in+the+person+that+acts+them%2C+or+are+the+issues+of+distributive+justice%2C+and+either+come+forth+from+a+person+clothed+with+government%2C+or+unto+which+is+requisite+a+stamp+of+authority+to+make+them+lawful%2C+and+justifiable%3A+as+to+bear+the+office+of+a+magistrate%2C+or+commander+in+civil+or+military+affairs%2C+or+to+be+any+under+agent%2C+or+servant+in+carrying+on%2C+or+assisting+the+government.%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+pp.+22-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67937c6a69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/67937c6a69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=In%20regard%20of%20the%20justness%20and,carrying%20on%2C%20or%20assisting%20the%20government&amp;text=In%20regard%20of%20the%20justness%20and%20necessity%20of&amp;text=servant%20in%20carrying%20on%2C%20or%20assisting%20the%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And when having attained their ungodly desires (whether ambitious kings by bringing any country into their subjection, or disloyal subjects by their rebellious rising against their natural sovereigns), they have established any of the same degenerate forms of government among their people, the authority, either so unjustly gotten, or wrung by force from the true and lawful possessor, being always God’s authority (and therefore receiving no impeachment by the wickedness of those that have it), is ever (when any such alterations are thoroughly settled) to be reverenced and obeyed, and the people of all sorts (as well of the clergy as of the laity) are to be subject unto it, not only for wrath, but also for conscience sake.</p></blockquote>

<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz:

1. If a prince abandon.

2. If he alienate.

3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>

<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

<blockquote><p>And these were the Halcionian days which Ambrose himself declares and magnifies, even when Maximus had suppressed the Arrians, En tempus acceptabile! quo non hiemalibus perfidiae caligantis pruinas annus riget, nec altis nivis, etc. ibid. Reader was not that time more strange than ours? that Ambrose must be so loyal as to save his prince and country from a usurper; and yet so pious as to be persecuted by his prince, and he and his brethren saved by that same usurper, and openly give praise to God for the great felicity of the Church which it received by that same usurper whom he so resisted?</p></blockquote>

<blockquote><p>§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.</p></blockquote>

osers+had+another+sense%2C+so+as+easily+might+they+know+that+the+words+in+their+own+obvious+usual+sense+among+men+must+be+taken+as+the+promise+or+engagement+of+a+subject+as+such+to+a+form+of+government+now+pretended+to+be+established%3A+And+that+the+subjects%E2%80%99+allegiance+or+fidelity+to+his+rulers+can+be+acknowledged+and+given+in+no+plainer+words%3A+And+that+by+such+interpretations+and+stretchings+of+conscience%2C+any+treasonable+oath+or+promise+may+be+taken%2C+and+no+bonds+of+society+can+signify+much+with+such+interpreters.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reliqui%C3%A6+Baxterian%C3%A6%2C+%28London%3A+Parkhurst%2C+1696%29%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7d4c7a910.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c7d4c7a910.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=98.%20If%20you%20ask%20what%20did,can%20signify%20much%20with%20such%20interpreters&amp;text=98.%20If%20you%20ask%20what%20did%20the%20ministers&amp;text=of%20society%20can%20signify%20much%20with%20such%20interpreters" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 27</span></figcaption>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fdf1d500b0" data-kw="">
<blockquote><p>And yet we conceive another case… wherein this submission to a new power may be called legal. For the end of all law and government is to preserve our persons and estates; and they who are in supremacy of power have power to preserve or destroy both if they please; and therefore have as great a power over our laws, which are less then our lives. So soon as one supreme power is expelled by another, law, life and estate fall all into the hands of the succeeding power; and what it does not actually take away, stands in effect as deriving from it; and if that supreme power make a sanction for our obedience to it (as always is immediately done) then we may say our submission is legal, or else the supreme power cannot make a law.</p></blockquote>

</figure><figure class="quote" id="q-25a73203b7" data-kw="">
<blockquote><p>But I pray you what do people get when wars for recoveries of dubious rights are long and calamitous? What are the people of France or the people of Spain better for the long and hereditary anger of their two kings? Or what was the world better for Alexander’s conquering it? The [English Parliament] Houses which are burnt and the millions of bodies left dead in the field are the peoples; and princes scorning to derive from them [the people] still trample them to dung.</p></blockquote>

</figure><figure class="quote" id="q-8ca0d5ad12" data-kw="">
<blockquote><p>For lest we of the people should bogle at coming on the stage to act our late tragedy over again, he [the opponent] would impose it on our beliefs that we are still in the middle act of it and that we ought to finish it. It is high time for him to consider whether if we run along with him in this we should not shut up compassion from our brethren and shut out a great part of our gratitude towards God; although I confess some scars and haltings may remain yet, after the war itself is ended. Methinks he should find everything both in Nature and Christianity more favourable for our present peace than for our third war, especially seeing all our former wars have ended very contrary to the expectation of those who were hottest to begin them. But I consider that passion is the last hold out of which we are beaten, of which the fuller men are, the less do they (through a great judgement on their spirits) perceive into what deformities they do transport them, it being the nature of all intoxications that their defects are better perceived by any than by those who are oppressed by them.</p></blockquote>

0bogle&amp;text=than%20by%20those%20who%20are%20oppressed%20by%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d27615bfc7" data-kw="">
<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawfulness of Obeying the Present Government</cite>, … (London, 1649), p. 6</span></figcaption>

hereunto%20divines%20and%20casuists%20give%20their%20concurrence&amp;text=de%20Confessores%20%5Bc.%201557%5D%2C%20ch.%201%E2%80%A2%2C%20n.%2041" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a2ed7eb824" data-kw="">
<blockquote><p>We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: … 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate [see others who are better on the issue of giving titles]). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Thomas Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me…</p></blockquote>

</figure><figure class="quote" id="q-781bb5691f" data-kw="">
<blockquote><p>…things at which offence is taken, first my petitioning for my life to the [usurped] parliament (so called)… to both which I shall give full satisfaction. About my petitioning, a double offence is taken, first at the titles of my petitions… I shall speak briefly to both, to take away any stumbling block out of the way of any. Touching the titles of my four petitions, they run in this form: ‘To the Supreme Authority, the Parliament of the Commonwealth of England’. Although I am far from going about to justify their right to this title to whom I give it, yet I shall justify the lawfulness of my practice in giving them this title which they assume to themselves, especially in a case of life [or death] as mine is: for in trivial matters I had rather lose my own right which belongs to me than give them this title which belongs not to them. The reasons which sway with me why I gave them this title (though I am not satisfied they have a right to it) are these:

1. They would not receive my petitions without giving them their assumed titles; yea to my knowledge they have rejected petitions which have not had these titles.

2. I am upon sure and clear grounds persuaded that giving to men titles they assume to themselves is not a real owning that they have a right to those titles. Titular and real are usually distinguished; by giving them the title of ‘Supreme Authority’ and ‘Parliament,’ I do acknowledge them a titular authority and a titular parliament, but by engaging [by an oath of allegiance] to them (which I have never done and I hope shall never do), I do acknowledge them a real authority and a real parliament. That I may further evince the truth of this second reason, viz. that giving of titles to men they assume to themselves, is not a real owning that they have a real right to those titles, I shall give sundry instances in Scripture to make it good: 2 Sam. 16, Hushai did call Absalom, that notorious usurper, ‘king,’ saying, ‘God save the king, God save the king,’ (an expression the people gave him), yet Hushai knew that David only was (even then) the lawful king of Israel set over him by God, and Absalom only an intruder, and made king by the tumults of the people; yea David himself did bid Hushai call Absalom (that usurper) ‘king,’ 2 Sam. 15:34, ‘Say to Absalom, ‘I will be thy servant O King.’ Yea further, David himself did call Absalom ‘king,’ 2 Sam. 15:19. David said to Hushai, ‘Return to thy place and abide with the king’ (that is with Absalom), yet he knew himself to be the lawful king and did not acknowledge that his son Absalom had any right to the kingdom, though he did give him the title of a king. So Athaliah’s usurping is called by the Spirit of God ‘reigning,’ yet the Spirit of God owns not her right to reign, but approved of the killing of her and the setting up [of] Jehoash, the true and lawful heir in her room. Yea Christ Himself called the Devil ‘the Prince of this World,’ Jn. 12:13 and 16 and 11, yet is it imaginable that Christ thought this title of right belonged to the Devil? Certainly no; Musculus on Jn. 12:31 well observes, non est ille (viz. Satan) Princeps mundi legitimus, sed per rapinam [‘He is not the legitimate prince of the world, but a robber’]. Paul called the devils ‘principalities and power,’ Eph. 6:12, yet none will be so shameless as to say that Paul thought this their rule, dominion and power of right belonged to them, but is merely usurped and intruded into. See annotations on the Bible on Eph. 6:12.

3. Titles are not always approbative, but distinctive; my meaning is that giving of titles to persons or things argues not one’s approving of a just right to those titles, but seems merely to distinguish those persons or things from others that are called by other names or titles, as I call them at Whitehall a ‘Council of State’ to distinguish them from a ‘Council of War’; I call those at Westminster the ‘Parliament of the Commonwealth,’ to distinguish them from the Lords and Commons assembled in Parliament.

4. Titles are giving to things or persons sometimes merely by allusion, not approbation, as in Scripture-phrase sin is said to ‘reign’ and the devils are said to ‘rule’, not that either the one or the other has an approved right to rule over man as a lawful prince has to rule over his subjects, but they are said to reign or rule by way of allusion to the reign of princes in their dominions.

5. Titles may be given without sin to persons or things, though of right they belong not to them, where they are generally received or mentioned by such titles by the people where I live. About names and titles much indulgence is to be given to the common usages and customs of the people; I may call things or persons by such names or titles as I know belongs not of right unto them, because they are ordinarily known and generally received by such names and titles. I could give manifold instances out of Scripture to prove this: David called Absalom ‘king’, not that he thought him so of right, but because he was commonly known and generally received by that title among the people. So Herod was called by the evangelist ‘King of the Jews’, so did the Jews generally call him by that title, yet none but that sect or sort of people called the Herodians did own it as Herod’s right to be the king of the Jews, who were so called because they pleaded for Herod to be the lawful king of the Jews, which the Pharisees and others withstood because he was not one of the Jewish nation as he ought to be, Dt. 17:15. Yet all the Jews called Herod ‘king’, though they did not acknowledge him to be their lawful king; tis manifest giving of titles are but titular acknowledgments and no more.

6. If names may without sin be given to places and things (which belong not to them), I see no reason why they may not be given to persons. There are names and titles given to many places both upon superstitious and idolatrous grounds, yet may without sin be used (I speak not of the first imposers) when those places are so called and commonly known by such names: Luke that writ the Acts of the Apostles, calls a place in Athens ‘Mars-hill’ (as it was commonly called) and this he might do without sin, though this name was originally imposed on that place in honor of Mars, yet he calls the place as it was commonly called, though called so upon an idolatrous ground, Acts 17:22. So for things also we may without sin call them by those names which others give them, though they may deal superstitiously or sinfully in the first imposition of such names. Thus Paul mentions a ship of Alexandria whose sign was Castor and Pollux, names originally imposed by the gentiles upon an idolatrous ground, yet being generally received, Paul calls the ship after this name.

7. It was a matter of absolute necessity (as to my life) for me to petition them, I being condemned to die; tis true for a trivial or ordinary occasion I should never petition them, but in an extraordinary case I might lawfully do it: David in a case of extreme necessity did eat the Show-bread, which in an ordinary case he might not do. Tis true indeed, Cato would not petition Caesar for his life, he had rather die than petition, but that I conceive was rather out of some animosity or height of spirit, or petty discontent, than out of a rectified judgment; for my part I am fully satisfied that I have not sinned in giving them their assumed titles; names and titles do not determine rights, conveniunt rebus nomina saepe suis [‘names often correspond to their things], it is true sometimes, but not always.

8. Titles men assume to themselves, or are generally given by others, may be given them by me without sin or without owning a right to those titles; this I may make appear by sundry late instances: Henry VIII [initially] had this title given him, ‘Defender of the Faith’, yet he had no right to this title, for he [at the beginning of his reign] defended only the Popish religion; he opposed the Faith rather than defended the Faith, and the true reason why the Pope gave him this title, ‘Defender of the Faith’, was because he opposed the doctrine of Luther and wrote against him [in 1521]; yet none scrupled to call him and the succeeding kings of England ‘the Defenders of the Faith’. So the king of Spain is called ‘the Catholic King’, yet he has no true right to this title, for he is not a catholic or universal monarch, yet our new State have lately sent to the king of Spain under this title, ‘The Catholic King’; so the king of France is called ‘the most Christian King’; so the Duke of Bavaria having by arms ejected the Palsgrave writes himself ‘Prince Elector Palatine of the Rhine’; so the King of Poland takes this title to himself, ‘King of Sweden’, yet has no right to that kingdom; yet none that ever I heard of scrupled to give these titles to them, considering that titles do not determine rights, and considering also that no addresses to them will be received by them unless the titles they assume to themselves be given them by those who make applications to them.</p></blockquote>

+eat+the+Show-bread%2C+which+in+an+ordinary+case+he+might+not+do.+Tis+true+indeed%2C+Cato+would+not+petition+Caesar+for+his+life%2C+he+had+rather+die+than+petition%2C+but+that+I+conceive+was+rather+out+of+some+animosity+or+height+of+spirit%2C+or+petty+discontent%2C+than+out+of+a+rectified+judgment%3B+for+my+part+I+am+fully+satisfied+that+I+have+not+sinned+in+giving+them+their+assumed+titles%3B+names+and+titles+do+not+determine+rights%2C+conveniunt+rebus+nomina+saepe+suis+%5B%E2%80%98names+often+correspond+to+their+things%5D%2C+it+is+true+sometimes%2C+but+not+always.+8.+Titles+men+assume+to+themselves%2C+or+are+generally+given+by+others%2C+may+be+given+them+by+me+without+sin+or+without+owning+a+right+to+those+titles%3B+this+I+may+make+appear+by+sundry+late+instances%3A+Henry+VIII+%5Binitially%5D+had+this+title+given+him%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+yet+he+had+no+right+to+this+title%2C+for+he+%5Bat+the+beginning+of+his+reign%5D+defended+only+the+Popish+religion%3B+he+opposed+the+Faith+rather+than+defended+the+Faith%2C+and+the+true+reason+why+the+Pope+gave+him+this+title%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+was+because+he+opposed+the+doctrine+of+Luther+and+wrote+against+him+%5Bin+1521%5D%3B+yet+none+scrupled+to+call+him+and+the+succeeding+kings+of+England+%E2%80%98the+Defenders+of+the+Faith%E2%80%99.+So+the+king+of+Spain+is+called+%E2%80%98the+Catholic+King%E2%80%99%2C+yet+he+has+no+true+right+to+this+title%2C+for+he+is+not+a+catholic+or+universal+monarch%2C+yet+our+new+State+have+lately+sent+to+the+king+of+Spain+under+this+title%2C+%E2%80%98The+Catholic+King%E2%80%99%3B+so+the+king+of+France+is+called+%E2%80%98the+most+Christian+King%E2%80%99%3B+so+the+Duke+of+Bavaria+having+by+arms+ejected+the+Palsgrave+writes+himself+%E2%80%98Prince+Elector+Palatine+of+the+Rhine%E2%80%99%3B+so+the+King+of+Poland+takes+this+title+to+himself%2C+%E2%80%98King+of+Sweden%E2%80%99%2C+yet+has+no+right+to+that+kingdom%3B+yet+none+that+ever+I+heard+of+scrupled+to+give+these+titles+to+them%2C+considering+that+titles+do+not+determine+rights%2C+and+considering+also+that+no+addresses+to+them+will+be+received+by+them+unless+the+titles+they+assume+to+themselves+be+given+them+by+those+who+make+applications+to+them.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+A+Clear+%26+Necessary+Vindication+of+the+Principles+%26+Practices+of+me%2C+Christopher+Love%2C+since+my+trial+before%2C+and+condemnation+by+the+High+Court+of+Justice%2C+%28London%2C+1651%29%2C+pp.+1-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F781bb5691f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/781bb5691f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=things%20at%20which%20offence%20is%20taken,those%20who%20make%20applications%20to%20them&amp;text=things%20at%20which%20offence%20is%20taken%2C%20first%20my&amp;text=them%20by%20those%20who%20make%20applications%20to%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

sable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.”

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, (London, 1673), pt. 4, ch. 19, title 2, p. 116-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A713.+Question+8%3A+May+I+give+money+to+a+judge+or+justice+or+court-officer+to+hire+him+to+do+me+justice+or+to+keep+him+from+doing+me+wrong+or+to+avoid+persecution%3F+Answer%3A+You+may+not%2C+in+case+your+cause+be+bad%2C+give+anything+to+procure+injustice+against+another%3B+no+nor+speak+a+word+for+it+nor+desire+it%3A+This+I+take+as+presupposed.+You+may+not+give+money+to+procure+justice+when+the+law+of+the+land+forbids+it+and+when+it+will+do+more+hurt+accidentally+to+others+than+good+to+you%3A+when+it+will+harden+men+in+the+sin+of+bribery+and+cause+them+to+expect+the+like+from+others.+But+except+it+be+when+some+such+accidental+greater+hurt+does+make+it+evil%2C+it+is+as+lawful+as+to+hire+a+thief+not+to+kill+me%3B+when+you+cannot+have+your+right+by+other+means%2C+you+may+part+with+a+smaller+matter+for+a+greater.+%C2%A714.+Question+9.+But+if+I+make+such+a+contract%2C+may+the+other+lawfully+take+it+of+me%3F+Answer%3A+No%3A+for+it+is+now+supposed+that+it+is+unlawful+on+his+part.+%C2%A715.+Question+10.+But+if+under+necessity+or+force+I+promise+money+to+a+robber+or+a+judge+or+officer%2C+am+I+bound+to+perform+it+when+necessity+is+over%3F+Answer%3A+You+have+lost+your+own+propriety+by+your+covenant+and+therefore+must+not+retain+it.+But+he+can+acquire+no+right+by+his+sin%3B+and+therefore+some+say+that+in+point+of+justice+you+are+not+bound+to+give+it+him%2C+but+to+give+it+to+the+magistrate+for+the+poor.+But+yet+prudence+may+tell+you+of+other+reasons+a+fine+to+give+it+the+man+himself%2C+though+justice+bind+you+not+to+it%3A+as+in+case+that+else+he+may+be+revenged+and+do+you+some+greater+hurt%2C+or+some+greater+hurt+is+any+other+way+likely+to+be+the+consequent%2C+which+it+is+lawful+by+money+to+prevent.+But+many+think+that+you+are+bound+to+deliver+the+money+to+the+thief+or+officer+himself%2C+because+it+is+a+lawful+thing+to+do+it%2C+though+he+have+no+just+title+to+it%3B+and+because+it+was+your+meaning%2C+or+the+signification+of+your+words+in+your+covenant+with+him.+And+if+it+were+not+lawful+to+do+it%2C+it+could+not+be+lawful+to+promise+to+do+it%3A+otherwise+your+promise+is+a+lie.+To+this%2C+those+of+the+other+opinion+say+that+as+a+man+who+is+discharged+of+his+promise+by+him+that+it+was+made+to+is+not+to+be+accounted+false+if+he+perform+it+not%2C+so+is+it+as+to+the+thief+or+officer+in+question%2C+because+he+having+no+right%2C+is+to+you+as+the+other+that+has+quit+his+right.+And+this+answer+indeed+will+prove+that+it+is+not+strict+injustice+not+to+pay+the+money+promised%3A+but+it+will+not+prove+that+it+is+not+a+lie+to+make+such+a+promise+with+an+intent+of+not-performing+it%2C+or+that+it+is+not+a+lie+to+make+it+with+an+intent+of+performing+it%2C+and+not+to+do+it+when+you+may.+Though+here+a+Jesuit+will+tell+you+that+you+may+say+the+words+of+a+promise+with+an+equivocation+or+mental+reservation%2C+to+a+thief+or+persecuting+magistrate+%28of+which+see+more+in+the+chapters+of+lying%2C+vows+and+perjury%29.+I+am+therefore+of+opinion+that+your+promise+must+be+sincerely+made+and+according+to+the+true+intent+of+it%2C+you+must+offer+the+money+to+the+thief+or+officer%3B+except+in+case+the+magistrate+forbid+you%2C+or+some+greater+reason+lie+against+it%2C+which+you+foresaw+not+when+you+made+the+promise.+But+the+offender+is+undoubtedly+obliged+not+to+take+the+money.+%C2%A716.+The+same+determination+holds+as+to+all+contracts+and+promises+made+to+such+persons+who+by+injurious+force+constrained+us+to+make+them.+There+is+on+us+an+obligation+to+veracity%2C+though+none+to+them+in+point+of+justice%2C+because+they+have+no+proper+right%3B+nor+may+they+lawfully+take+our+payment+or+service+promised+them.+And+in+case+that+the+public+good+unexpectedly+cross+our+performance%2C+we+must+not+perform+it%3A+Such+like+is+the+case+of+conquerors%2C+and+those+that+upon+conquest+become+their+vassals+or+subjects+upon+unrighteous+terms.+But+still+remember%2C+that+if+it+be+not+only+a+covenant+with+man%2C+but+a+vow+to+God%2C+which+makes+him+a+party%2C+the+case+is+altered%2C+and+we+remain+obliged.+%C2%A717.+Question+11.+But+may+I+promise+the+thief+or+bribe-taker+to+conceal+his+fault%3F+and+am+I+obliged+to+the+performance+of+such+a+promise%3F+Answer%3A+This+is+a+promise+of+omitting+that+which+else+would+be+a+duty.+It+is+ordinarily+a+duty+to+reveal+a+thief+and+bribe-taker+that+he+may+be+punished.+But+affirmatives+bind+not+ad+semper+%5Bto+all+times%5D%3A+no+act+%28especially+external%29+is+a+duty+at+all+times%3A+therefore+not+this+of+revealing+an+offender%E2%80%99s+fault.+And+if+it+be+not+always+a+duty%2C+then+it+must+be+none+when+it+is+inconsistent+with+some+greater+benefit+or+duty%3A+For+when+two+goods+come+together%2C+the+greater+is+to+be+preferred.+Therefore+in+case+that+you+see+in+just+probability+that+the+concealment+of+the+sinner+will+do+more+hurt+to+the+commonwealth+or+the+souls+of+men+than+the+saving+of+your+life+is+like+to+do+good%2C+you+may+not+promise+to+conceal+him%3A+or+if+you+sinfully+promise+it%2C+you+may+not+perform+it.+But+in+case+that+your+life+is+likely+to+be+a+greater+good+than+the+not+promising+to+conceal+him%2C+then+such+a+promise+is+no+fault%3B+because+the+disclosing+him+is+no+duty.+But+to+judge+rightly+of+this+is+a+matter+of+great+difficulty.+If+it+be+less+than+life+which+you+save+by+such+a+promise%2C+it+oft+falls+out+that+it+is+a+lesser+good+than+the+detecting+of+the+offence.+%C2%A718.+But+it+will+here+be+said%2C+%E2%80%98If+I+promise+not+to+conceal+a+robber%2C+I+must+conceal+him+nevertheless%3B+for+when+he+has+killed+me%2C+I+cannot+reveal+him%3B+and+I+must+conceal+the+bribe-taker%2C+for+till+I+have+promised+secrecy%2C+I+cannot+prove+him+guilty.+And+he+that+promises+to+forbear+a+particular+good+action+whilst+he+lives%2C+does+yet+reserve+his+life+for+all+other+good+works%3A+whereas+if+he+die%2C+he+will+neither+do+that+nor+any+other.%E2%80%99+But+this+case+is+not+so+easily+determined%3A+If+Daniel+die%2C+he+can+neither+pray+nor+do+any+other+good+on+earth.+And+if+he+live%2C+he+may+do+much+other+good+though+he+never+pray%3A+and+yet+he+might+not+promise+to+give+over+praying+to+save+his+life.+I+conceive+that+we+must+distinguish+of+duties+essential+to+the+outward+part+of+Christianity%2C+or+of+constant+indispensable+necessity%2C+and+duties+which+are+alterable+and+belong+only+to+some+persons%2C+times+and+places%3A+Also+between+the+various+consequents+of+omissions.+And+I+conceive+that+ordinarily+a+man+may+promise+for+the+saving+of+his+life+that+he+will+forbear+a+particular+alterable+duty+or+relation%3A+as+to+read+such+a+commentary%2C+to+speak+with+such+a+minister%2C+to+be+a+magistrate+or+a+minister%2C+etc.+in+case+we+have+not+before+bound+ourselves+never+to+give+over+our+calling+till+death%3A+and+in+case+that+the+good+which+will+follow+our+forbearance+is+likely+%28to+a+judicious+person%29+to+be+greater+than+the+evil.+But+no+man+may+promise+to+omit+such+a+duty+as+God+has+made+necessary+during+life%3A+as+not+to+love+God+or+fear+or+trust+Him%3A+not+to+worship+Him+and+call+upon+Him+and+praise+Him%3A+nor+to+do+good+to+men%E2%80%99s+souls+or+bodies+in+the+general%3A+or+not+to+preach+or+pray+while+I+am+a+minister+of+Christ%2C+or+not+at+all+to+govern+while+you+are+a+governor.+For+all+these+contradict+some+former+and+greater+promises+or+duties.+Nor+may+you+omit+the+smallest+duty+to+save+your+life+at+such+a+time+when+your+death+is+likely+to+do+more+good+than+your+life+would+do+without+that+one+duty.+Apply+this+to+the+present+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+%28London%2C+1673%29%2C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+116-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca12e1cddd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ca12e1cddd.html">Permalink</a><a class="src" href="https: <blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If it be just to do, which thou through constraint hast promised, it is just also for thee to promise by oath to do it. For what we may lawfully do, the same also we may lawfully promise by an oath to do. As, if a man falling into the hands of a thief, should be required by the thief to give a piece of money for the redeeming of his life; verily he not only may, but also ought, if he be able, to perform that which the thief requires. And if this be lawfully performed unto a thief, it is lawfully also performed unto him by an oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. ‘Whether all oaths are to be kept’, p. 919</span></figcaption>

</figure><figure class="quote" id="q-658bc3431b" data-kw="">
<blockquote><p>Upon mature deliberation we did perceive that the wise and holy providence of God… has… disabled that [former] way of government and all that depends thereon, from affording any protection and preservation to any of the inhabitants of this land; and has enabled another form of government to afford it; Wherefore we did conclude from the light of nature, from the judgement of the learned, from the practice of Christians in former ages, from our own principles and from our former engagements that it was the will of God we should quietly and peaceably set ourselves in our places and callings to live under this government and to submit to it in such things as are imposed upon or required of us [such as the oath of Engagement] by the powers which are in actual possession, being things in themselves lawful and necessary, or expedient to the preservation of ourselves and others… Fourthly, because we clearly conceive that there is no difference at all between the submission which the authors of the Proposals themselves rightly acknowledge to be due to the powers which are in actual possession and that which is required by the subscription to this Engagement: for seeing the express words of the Engagement give no ground to interpret the act of subscription beyond that which is a clear and known duty: therefore we think it not (as to our consciences) warrantable to interpret it otherwise; but we rather think it contrary to a known duty to make of a thing in itself lawful and necessary at this time, any scrupulous interpretation beyond what the words import; or to suspend obedience from a duty upon the conjecture of something which may be thought undutiful, when that which is to our conscience a known duty is apparent: Upon which ground we declare that we trouble not ourselves, nor do we think it lawful to stagger others in their thoughts with the inferences which the proposers make upon the subscription of the Engagement with reference to these queries [of theirs]: As how far it does imply an approbation of the manner of the present establishment, whether as effected by a full and free authority yea or no? whether yea or no, it does imply an active concurrence and a ratifying consent of the people thereunto further than what has been already acknowledged to be due to the powers in actual possession by all that are in subjection under them and depend upon their protection? and whether yea or no, and how far it fastens an obligation to act to the strengthening and promoting of the government which is at present or may be hereafter established by the advantage of possible power? We say that to trouble our own or other men’s weaker consciences with these or such like doubtful conjectures to color the suspension of our own, or occasion the aversion of other men’s affections from yielding obedience to a clear and confessed duty, is not only preposterous and contrary to the aim of healing breaches, and of advancing a public good in this time of distraction, but inconsistent (as to our reason) with the obvious meaning of the words which are to be subscribed and disagreeing (as to our affections) with the charity due no less to superiors than to other men, which is not to think evil when good may be thought of them. And lastly, it is opposite (as to our spirits) unto that wisdom which is from above (the rule of our walking) teaching us to have pure and peaceable thoughts in all our actings, to perform duties in godly simplicity and without worldly wisdom, to be gentle and easily intreated, to do good works without partial scrupulosity and without hypocrisy. And upon these principles of true wisdom (which we humbly conceive are not laid to heart by our brethren in the third paragraph of their Proposals) we professedly wave all those scruples and the stumbling-blocks which they have laid to themselves and wherewith they have puzzled others, upon this clear account: that whenever the consideration of these things, which are said to be implied in the subscription (which we see not) shall come before us, to be circumstantially considered for the edification of others, or the clearing of our own way, we then shall be most ready to declare our sense therein, according to known principles and the circumstances, which God shall offer…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Upon mature deliberation we did perceive that the wise and holy providence of God… has… disabled that [former] way of government and all that depends thereon, from affording any protection and preservation to any of the inhabitants of this land; and has enabled another form of government to afford it; Wherefore we did conclude from the light of nature, from the judgement of the learned, from the practice of Christians in former ages, from our own principles and from our former engagements that it was the will of God we should quietly and peaceably set ourselves in our places and callings to live under this government and to submit to it in such things as are imposed upon or required of us [such as the oath of Engagement] by the powers which are in actual possession, being things in themselves lawful and necessary, or expedient to the preservation of ourselves and others… Fourthly, because we clearly conceive that there is no difference at all between the submission which the authors of the Proposals themselves rightly acknowledge to be due to the powers which are in actual possession and that which is required by the subscription to this Engagement: for seeing the express words of the Engagement give no ground to interpret the act of subscription beyond that which is a clear and known duty: therefore we think it not (as to our consciences) warrantable to interpret it otherwise; but we rather think it contrary to a known duty to make of a thing in itself lawful and necessary at this time, any scrupulous interpretation beyond what the words import; or to suspend obedience from a duty upon the conjecture of something which may be thought undutiful, when that which is to our conscience a known duty is apparent: Upon which ground we declare that we trouble not ourselves, nor do we think it lawful to stagger others in their thoughts with the inferences which the proposers make upon the subscription of the Engagement with reference to these queries [of theirs]: As how far it does imply an approbation of the manner of the present establishment, whether as effected by a full and free authority yea or no? whether yea or no, it does imply an active concurrence and a ratifying consent of the people thereunto further than what has been already acknowledged to be due to the powers in actual possession by all that are in subjection under them and depend upon their protection? and whether yea or no, and how far it fastens an obligation to act to the strengthening and promoting of the government which is at present or may be hereafter established by the advantage of possible power? We say that to trouble our own or other men’s weaker consciences with these or such like doubtful conjectures to color the suspension of our own, or occasion the aversion of other men’s affections from yielding obedience to a clear and confessed duty, is not only preposterous and contrary to the aim of healing breaches, and of advancing a public good in this time of distraction, but inconsistent (as to our reason) with the obvious meaning of the words which are to be subscribed and disagreeing (as to our affections) with the charity due no less to superiors than to other men, which is not to think evil when good may be thought of them. And lastly, it is opposite (as to our spirits) unto that wisdom which is from above (the rule of our walking) teaching us to have pure and peaceable thoughts in all our actings, to perform duties in godly simplicity and without worldly wisdom, to be gentle and easily intreated, to do good works without partial scrupulosity and without hypocrisy. And upon these principles of true wisdom (which we humbly conceive are not laid to heart by our brethren in the third paragraph of their Proposals) we professedly wave all those scruples and the stumbling-blocks which they have laid to themselves and wherewith they have puzzled others, upon this clear account: that whenever the consideration of these things, which are said to be implied in the subscription (which we see not) shall come before us, to be circumstantially considered for the edification of others, or the clearing of our own way, we then shall be most ready to declare our sense therein, according to known principles and the circumstances, which God shall offer…”

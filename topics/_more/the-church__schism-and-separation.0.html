<figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’ 15 pp. (1584) in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</cite></span></figcaption>

</figure><figure class="quote" id="q-2f016b59e9" data-kw="">
<blockquote><p>But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.</p></blockquote>

</figure><figure class="quote" id="q-b6985c9e44" data-kw="">
<blockquote><p>Some object that the fifth, sixth, seventh and eighth [Anglican] canons have excommunicated us [nonconformists] already. Therefore we separate not, but they cast us out. Answer: Let them that are concerned in those canons defend them if they can and justify themselves, for it’s past my skill; but we are not bound (though excommunicated) to execute them on ourselves: Let others do it if it must be done.</p></blockquote>

</figure><figure class="quote" id="q-a4d4e363f2" data-kw="">
<blockquote><p>There are some diseases that are called opprobria medicorum, ‘the disgraces of physicians’, because they know not what to say or do to them; or if they do anything it is to little purpose. If there be any soul-disease that be opprobrium theologorum, the disgrace of divines, it is this: of contention and division. How little has all that they have studied and endeavored to do prevailed with the hearts of men? What shall we do? Shall we but join in this one thing, to sit down together, and mourn one over another, one for another, till we have dissolved our hearts into tears, and see if we can thus get them to run one into another? Oh that it might be, what sorrow soever it costs us!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum (1653) | ch. 31, ‘The Cure of our Divisions’, with 14 Joining Principles</cite>, pp. 252-3</span></figcaption>

<blockquote><p>The Brownists did not difler from the Church of England in any articles of faith, but were very rigid and narrow in points of discipline. They denied the Church of England to be a true Church and her ministers to be rightly ordained. They maintained the discipline of the Church of England to be Popish and antichristian, and all her ordinances and sacraments invalid. Hence they forbade their people to join with them in prayer, in hearing, or in any part of public worship; nay, they not only renounced communion with the Church of England, but with all other reformed Churches, except such as should be of their own model. They apprehended, according to Scripture, that every church ought to be confined within the limits of a single congregation and that the government should be democratical. When a church was to be gathered, such as desired to be members made a confession of their faith in the presence of each other, and signed a covenant, obliging themselves to walk together in the order of the gospel, according to certain rules and agreements therein contained. The whole power of admitting and excluding members, with the deciding of all controversies, was in the brotherhood. Their church-officers, for preaching the Word and taking care of the poor, were chosen from among themselves, and separated to their several offices by fasting and prayer and imposition of the hands of some of the brethren. They did not allow the priesthood to be a distinct order, or to give a man an indelible character; but as the vote of the brotherhood made him an officer and gave him authority to preach and administer the sacraments among them, so the same power could discharge him from his office and reduce him to the state of a private member. When the number of communicants was larger than could meet in one place, the church divided and chose new officers from among themselves as before, living together as sister-churches and giving each other the right hand of fellowship, or the privilege of communion with either. One church might not exercise jurisdiction or authority over another, but each might give the other counsel, advice, or admonition if they walked disorderly or abandoned the capital truths of religion; and if the offending church did not receive the admonition, the others were to withdraw and publicly disown them as a church of Christ. The powers of their church-officers were confined within the narrow limits of their own society; the pastor of one church might not administer the sacrament of baptism or the Lord’s supper to any but those of his own communion and their immediate children. They declared against all prescribed forms of prayer. Any lay-brother had the liberty of prophesying or giving a word of exhortation in their church assemblies; and it was usual after sermon for some of the members to ask questions and confer with each other upon the doctrines that had been delivered; but as for church-censures, they were for an entire separation of the ecclesiastical and civil sword. In short, every church, or society of Christians meeting in one place, was, according to the Brownists, a body corporate, having full power within itself to admit and exclude members, to choose and ordain officers; and, when the good of the society required it, to depose them, without being accountable to classes, convocations, synods, councils or any jurisdiction whatsoever. Some of their reasons for withdrawing from the Church are not easily answered: they alleged that the laws of the realm and the queen’s injunctions had made several unwarrantable additions to the institutions of Christ. That there were several gross errors in the Church-service. That these additions and errors were imposed and made necessary to communion. That if persecution for conscience’ sake was the mark of a false church, they could not believe the Church of England to be a true one. They apprehended farther that the constitution of the hierarchy was too bad to be mended; that the very pillars of it were rotten and that the structure must be begun anew. Since therefore all Christians are obliged to preserve the ordinances of Christ pure and undefiled, they resolved to lay a new foundation and keep as near as they could to the primitive pattern, though it were with the hazard of all that was dear to them in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/about-separatists.html">About Separatists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tenets of the English Brownists | Daniel Neal, The History of the Puritans… (London, 1822), vol. 1, ch. 6, From Parker to Grindal</cite>, pp. 303-5</span></figcaption>

to+the+state+of+a+private+member.+When+the+number+of+communicants+was+larger+than+could+meet+in+one+place%2C+the+church+divided+and+chose+new+officers+from+among+themselves+as+before%2C+living+together+as+sister-churches+and+giving+each+other+the+right+hand+of+fellowship%2C+or+the+privilege+of+communion+with+either.+One+church+might+not+exercise+jurisdiction+or+authority+over+another%2C+but+each+might+give+the+other+counsel%2C+advice%2C+or+admonition+if+they+walked+disorderly+or+abandoned+the+capital+truths+of+religion%3B+and+if+the+offending+church+did+not+receive+the+admonition%2C+the+others+were+to+withdraw+and+publicly+disown+them+as+a+church+of+Christ.+The+powers+of+their+church-officers+were+confined+within+the+narrow+limits+of+their+own+society%3B+the+pastor+of+one+church+might+not+administer+the+sacrament+of+baptism+or+the+Lord%E2%80%99s+supper+to+any+but+those+of+his+own+communion+and+their+immediate+children.+They+declared+against+all+prescribed+forms+of+prayer.+Any+lay-brother+had+the+liberty+of+prophesying+or+giving+a+word+of+exhortation+in+their+church+assemblies%3B+and+it+was+usual+after+sermon+for+some+of+the+members+to+ask+questions+and+confer+with+each+other+upon+the+doctrines+that+had+been+delivered%3B+but+as+for+church-censures%2C+they+were+for+an+entire+separation+of+the+ecclesiastical+and+civil+sword.+In+short%2C+every+church%2C+or+society+of+Christians+meeting+in+one+place%2C+was%2C+according+to+the+Brownists%2C+a+body+corporate%2C+having+full+power+within+itself+to+admit+and+exclude+members%2C+to+choose+and+ordain+officers%3B+and%2C+when+the+good+of+the+society+required+it%2C+to+depose+them%2C+without+being+accountable+to+classes%2C+convocations%2C+synods%2C+councils+or+any+jurisdiction+whatsoever.+Some+of+their+reasons+for+withdrawing+from+the+Church+are+not+easily+answered%3A+they+alleged+that+the+laws+of+the+realm+and+the+queen%E2%80%99s+injunctions+had+made+several+unwarrantable+additions+to+the+institutions+of+Christ.+That+there+were+several+gross+errors+in+the+Church-service.+That+these+additions+and+errors+were+imposed+and+made+necessary+to+communion.+That+if+persecution+for+conscience%E2%80%99+sake+was+the+mark+of+a+false+church%2C+they+could+not+believe+the+Church+of+England+to+be+a+true+one.+They+apprehended+farther+that+the+constitution+of+the+hierarchy+was+too+bad+to+be+mended%3B+that+the+very+pillars+of+it+were+rotten+and+that+the+structure+must+be+begun+anew.+Since+therefore+all+Christians+are+obliged+to+preserve+the+ordinances+of+Christ+pure+and+undefiled%2C+they+resolved+to+lay+a+new+foundation+and+keep+as+near+as+they+could+to+the+primitive+pattern%2C+though+it+were+with+the+hazard+of+all+that+was+dear+to+them+in+the+world.%E2%80%9D%0A%0A%E2%80%94+About+Separatists%2C+The+Tenets+of+the+English+Brownists+%7C+Daniel+Neal%2C+The+History+of+the+Puritans%E2%80%A6+%28London%2C+1822%29%2C+vol.+1%2C+ch.+6%2C+From+Parker+to+Grindal%2C+pp.+303-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5105eb4e3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5105eb4e3e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=The%20Brownists%20did%20not%20difler%20from,dear%20to%20them%20in%20the%20world&amp;text=The%20Brownists%20did%20not%20difler%20from%20the%20Church&amp;text=that%20was%20dear%20to%20them%20in%20the%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>

<blockquote><p>…they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one when they are necessarily called to give a testimony against the other; Yea, the duty and care they owe to the preservation of the government constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt national Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honoured amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government itself;</p></blockquote>

</figure><figure class="quote" id="q-666c16c43d" data-kw="">
<blockquote><p>They who truly fear the name of God are indeed scandalized by the Prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified… Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will, provoked Pharaoh the more to oppress them; or than Christ’s preaching of the truth, and his abstaining from the superstitious ceremonies of the Pharisees, provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“They who truly fear the name of God are indeed scandalized by the Prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified… Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will, provoked Pharaoh the more to oppress them; or than Christ’s preaching of the truth, and his abstaining from the superstitious ceremonies of the Pharisees, provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.”

— George Gillespie, English Popish Ceremonies (1637), pt. 2, ch. 1, p. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+who+truly+fear+the+name+of+God+are+indeed+scandalized+by+the+Prelates%2C+their+depriving+of+ministers+for+refusing+to+conform%3A+but+by+the+ministers%2C+their+suffering+of+deprivation+for+this+cause%2C+they+are+not+scandalized%2C+but+edified%E2%80%A6+Our+refusal+to+conform+to+inconvenient+ceremonies%2C+being+a+necessary+duty%2C+if+the+magistrate+be+provoked+therewith%2C+we+are+blameless%3A+neither+can+it+any+otherwise+provoke+him+to+disgrace+those+well+deserving+ministers+than+Moses+his+seeking+of+liberty+for+Israel+to+go+and+serve+God+according+to+his+will%2C+provoked+Pharaoh+the+more+to+oppress+them%3B+or+than+Christ%E2%80%99s+preaching+of+the+truth%2C+and+his+abstaining+from+the+superstitious+ceremonies+of+the+Pharisees%2C+provoked+them+to+disgrace+Him+and+plot+his+hurt.+Howbeit+we+are+not+ignorant+that+the+magistrate+is+not+provoked+by+our+refusing+to+conform%2C+except+as+it+is+misreported%2C+misdeemed+and+misconstructed+to+him+by+the+false+calumnies+of+our+adversaries%3A+which+being+so%2C+he+is+not+incited+by+our+deed%2C+but+by+theirs.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+2%2C+ch.+1%2C+p.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F666c16c43d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/666c16c43d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=They%20who%20truly%20fear%20the%20name,by%20our%20deed%2C%20but%20by%20theirs&amp;text=They%20who%20truly%20fear%20the%20name%20of%20God&amp;text=not%20incited%20by%20our%20deed%2C%20but%20by%20theirs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a37aba1432" data-kw="">
<blockquote><p>Now, the ceremonies are the bane of our churches’ peace and the unhappy instruments of lamentable discord among bretheren who should dwell together in unity. I know that the refusers of the ceremonies are blamed as if they were the troublers of the peace of the Church and the tumultuating contentious spirits who make so much ado about matters of rite and ceremony. But I know also that none have been more ordinarily and commonly blamed for troubling the peace of the Church than they who least deserved to be blamed for it. So was Elijah himself thought to be he that troubled Israel when he contended against the corruptions of the Church in his time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 7, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-e15e1b5f18" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 8, p. 32-33</span></figcaption>

</figure><figure class="quote" id="q-5f0db8f381" data-kw="">
<blockquote><p>The Dr. proceeds to throw back the argument of scandal upon our own heads, and to charge us with scandalizing both the Church and commonwealth by our refusing the ceremonies… That some are displeased at our non-conformity, we understand to our great grief: but that thereby any are scandalized, we understand not; and if we did, yet that which is necessary, such as non-conformity is, can be taken away by no scandal.</p></blockquote>

<blockquote><p>3. Our refusal is necessary because of the unlawfulness of the ceremonies which we refuse, so that we may not receive them, but must refuse them, notwithstanding of any scandal which can follow upon our refusal. If he [the conformist opponent] had ought to say against this answer, why is he silent? He might have found it at home. ‘Our forbearance of conformity,’ says Parker, ‘is a necessary duty, there is therein no fault of any scandal in us.&#x27;</p></blockquote>

<blockquote><p>It is known that many take offence at tolling of bells, at a minister’s [civilly appropriate] gown while he preaches, at the naming of the days of the week, after the Heathen style from the seven planets… It is true, bells are abused by Papists… But these be scandals taken, and not given, for we read not of scandals culpable in God’s word, but there be some apparent moral reason in them. 2. The object scandalizing has no necessity, why it should be. … Things that fall under an affirmative precept, and these cannot be totally omitted, for eschewing scandal: for whatever God has commanded, is some way necessary. Therefore, it some ways, and in some cases may be done, though offence be taken at it; but branches, or parts of affirmative precepts may be omitted for eschewing of scandal, as such a particular kneeling in prayer, in such a place¹…</p></blockquote>

nline · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-de3a7d083a" data-kw="">
<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and complaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it…</p></blockquote>

<blockquote><p>3. Nor does it belong to the essence of Presbyterial Government, that all members of this Church, and inferior judicatures, should so submit to the superior respective judicatures, that if they be grieved with the sentence, they ought to acquiesce thereunto, and not to contra-act, but only appeal, until there shall be a general assembly to determine the matter. This never was, and I trust, nor shall ever be their mind who are for presbyterial government; nor do our brethren justly father it upon the general Assembly, 1648, Session 30. For our Church acknowledges no subjection nor subordination of inferior judicatures unto superiors, but in the Lord, and so to submit to any sentence, and to forbear a duty of preaching the Gospel, praying, visiting, exhorting, catechizing pastorally in families, to abstain from the Lord’s Supper, and from acts of due censure necessary for the flock upon the known unjust sentence of a synod, until a general Assembly (which possibly cannot be convened in an age to determine) is to: 1. Obey men unjustly forbidding a called minister of Christ to preach in season, and out of season, rather than God; for they unjustly forbid, and the Lord justly commands; therefore the called minister must act and contra-act to their unjust sentence, and not forbear for an hour, as the Scripture clears, 2 Tim. 4:1-2; Acts 20:17-20; 1 Cor. 9:16; Isa. 58:1; Jer. 1:17; Eze. 2:3-5 &amp; 3:10,17; Acts 5:28-29; and so this is unjust. 2. It is to make synods and ecclesiastical judicatures lords of our faith, which the Reformed Churches detest in popish councils; for all men and councils most lawful can challenge only limited obedience and submission in the Lord to their determinations, if they speak and command ‘according to the Law and the Testimony’, Isa. 8:20, ‘otherwise there is no sight in them.’ And so it is popish. 3. We conceive in performing acts of that government which Christ owns in his Word, we do not sin; for no authority of a judicature can make that to be the word of God, and obedience to God, which was not, as to the matter, obedience to God before that authority, nor on the contrary. Now to abstain from preaching, praying, eating and drinking as the Lord’s Supper in a called minister, and in a visible professor, duly called and fitted, is sin; then cannot the authority of the Church, far less their known unjust sentence make it lawful. 4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>

<blockquote><p>2. As we desire not presbyterial government to be reproached for such judging, so neither are prelatical acts of synods for debarring from the holy ministry men of an holy and unblameable conversation, and for the grace of God in them, and their knowledge and utterance, able and fit to preach the Gospel, upon this account, because they are unpeaceable and hold up debates, that is, because they will not be satisfied with the public resolutions for taking into places in the Church, Parliament, Army, Committee of Estates, all the malignant party in the land, or will not promise silence in their matters.</p></blockquote>

<blockquote><p>It has been ordinary for righteous men, whose consciences could not suffer them to be silent and to couch under public corruptions without bearing testimony against the same, and endeavoring a remedy thereof, to meet with such reproaches from oppressing and loose parties and persons that have stood in the way of Reformation…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It has been ordinary for righteous men, whose consciences could not suffer them to be silent and to couch under public corruptions without bearing testimony against the same, and endeavoring a remedy thereof, to meet with such reproaches from oppressing and loose parties and persons that have stood in the way of Reformation…”

<blockquote><p>4. This [absolute] submission concludes a man under a necessity of sinning against God, by omitting those necessary duties that are commanded him of God, upon a non-relevant reason, to wit, the mere will and pleasure of men, to whom God has given no power against the Truth, but for the Truth; no power to destruction, but to edification.</p></blockquote>

</figure><figure class="quote" id="q-b14db17948" data-kw="">
<blockquote><p>Will not such submission to these sentences as excludes all counteracting, unless it be to appeal, necessarily infer submission to the decrees themselves, so as the person censured must be silenced, and not profess, nor preach, nor plead any more for the one Truth, nor against the other Error?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbytery no papacy; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 106-7</span></figcaption>

</figure><figure class="quote" id="q-b2ae994528" data-kw="">
<blockquote><p>And shall we now set up a Church-tyranny, the mere will and abitriment, yea, the unjust sentences of Church-judicatories for laws, and require absolute submission thereunto, not only of private and single persons, but of all inferior judicatories, not allowing the congregational-eldership once to whisper against what is resolved by the presbytery, or the presbytery against what is resolved by the synod, or the synod against what is resolved by the General Assembly. If then the superior judicatories will tyrannize, what remedy is there? or if they become corrupt, how shall the ruin of religion, or the persecution and oppression of these who desire to keep faith and a good conscience, be avoided? Have the Ministers and saints and courts of Jesus Christ received religion and His ordinances upon these terms, that if a superior Court will have it so, they shall all crouch down as asses under the burden, and let them, without gainsaying (they being now cudgeled into silence by a sentence of suspension from the sacrament, or deposition or excommunication) ruin Church, and Ministers, and ordinances, and professors, and all the precious interests of Jesus Christ; And shall we say that such a submission is required in this case, as though they ought to do nothing but weep and pray in secret? How great tyranny is this, and how remedy-less a way to ruin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbytery no papacy; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-ab7a949e00" data-kw="">
<blockquote><p>The question (so far as we can understand them in it) is, ‘Whether such a submission be due from all the members of this Kirk, ministers and people, to the judicatories of the Kirk, and from the inferior to the superior Kirk-judicatories in matters of government and discipline, as ought upon the sentence (whether just or unjust) of these judicatories to sist [stop or delay] the proceedings of the person or party grieved therewith, and make them acquiesce thereunto, until the determination of the respective superior judicatory therein, without any counteracting to the same, unless it be to appeal unto, and follow their appeal before the superior judicatory?’ Upon this question we find the Brethren for the Protestation in their last paper at the conference, Nov. 25, 1655, expressing their judgment thus: ‘We are willing to subject ourselves to all the just sentences of the lawful assemblies of this Kirk; and if the case were only of a few particular persons, in things of more private interest and personal concernment, and of judicatories employing their power to edification in the current of their actings, we should not much contend about it; but when it is of a great number of godly ministers and elders and professors throughout the land, who do desire to stand in the breach, and to oppose the present course of defection, and of judicatories, the plurality whereof in many places do not act unto edification and for promoving the power of godliness, but to the contrary, it alters the case.’ .. It is to us, and we believe will be to all sober and unbiased men, who understand the principles of Church-government, new and strange doctrine [that of the Resolutioners], that an absolute and unlimited subjection to all sentences (whether just or unjust, or agreeable or repugnant to the Word of God) should be asserted to be at all of kin or alliance to the divine ordinance of presbyterial government, which is a part of the sweet and gentle yoke of Jesus Christ, that is far from tyranny and oppression. … If presbyterial government has (as we do believe and assert it to have) its foundation in the Testament of Jesus Christ, upon whose shoulder the Government is, then whatsoever is of the essence and being thereof, must derive itself from the fountain of Christ’s Revealed Will about the constitution and essentials of that government? But we know no tittle in his Book that says as our [Resolutioner] Brethren say, or from which, what they say in this matter, can be deduced by good and necessary consequence, to wit, that it is essential to the government which He has appointed His House to be ruled by, that all the children of the House should submit unto, and acquiesce in the determination of the governors, without any counteracting, though their sentence be contrary to the Law and the Testimony; and therefore till our [Resolutioner] Brethren prove this, they will give us leave to deny it. We acknowledge that power and authority, and subjection and submission are co-relatives, and that the power and authority of the superior can no more actually subsist without the subjection and submission of the inferior, than one relative can subsist without its co-relative: But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; And when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this submission which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny; because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, but being for matter, God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin, by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: A Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do. Their [the Resolutioners’] second reason is, that without this submission and subordination they do not see how unity and order can be continued in the Kirk, it being in vain to think of a remedy by superior judicatories without this, the refusing thereof being the way to make all union void… Answer [of Guthrie]: This is the very argument and language of the advocates of the Sea of Rome, whilst they plead the Pope’s visible headship and irrefragable authority and jurisdiction over the Church, to which all ought to submit without gainsaying, or counteracting, the very thing that has set up the Man of Sin to sit as God in the Temple of God, unto the enslaving both of the Word of God and the consciences of men, by requiring of them subjection and blind obedience to his dictates, without examining the same according to the light of the Word. If, according to the revealed Will of God, there ought to be such a submission in all cases, without counteracting, what shall we say of the practices of the prophets and apostles, and others of the servants of God who have lived before us in corrupt times? Must all their preachings and other actings, though most agreeable to the Word of God, be condemned, because they were contrary to the [will?] of the Church wherein they lived? [That?] were indeed to set up a power over the Word of God, a power for destruction and not for [edification?]; that would indeed make a sinful unity and order, and teach a way to avoid persecution, and readily to obtain peace with men, but with a loss of truth and a good conscience. The way to preserve unity and order in the House of God is, not to hearken to the counsels of flesh and blood, by setting up the will of man for a law and establishing an arbitrary and tyrannical power over consciences, to which they shall be tied to submit to iniquity and injustice; for, God has said, that the throne of iniquity that frames mischief into a law shall have no fellowship with Him [Ps. 94:20]; And therefore that may destroy unity and order, it will not preserve it. But to let the worship of God (which is both the rule and bond of unity and order) have place, Gal. 6:16, and judicatories proceeding according to this, is an effectual remedy actu primo [by the first act, or source] and objective, as in every ordinance of Christ; albeit actu secundo [by the following act] there is no efficacious remedy in either Word, sacraments, admonitions, suspension, deposition, excommunications, presbyteries, synods, or any ordinance the Church does enjoy or can exercise without the effectual blessing and influence of the Spirit of God, who is the author and appointer of these, and concurs therewith upon the consciences of men according to the pleasure of His own will. Shall persons sentenced unjustly, submit? Yes, say our Brethren, for preserving Unity and Order. What remedy then, say we [the Protesters], for preserving the truth? They may appeal, say they. But, say we, they have appealed, and have therein succumbed. What remedy now? No remedy, but that at one stroke the precious truths of God and interests of Jesus Christ must be born down and buried in oblivion; And the saints and ministers of the Gospel be buried under the rubbish thereof, because one assembly will have it so. But say our [Resolutioner] Brethren, how shall unity and order otherways be preserved in the Church of God? We answer, very well; because if the sentence be unjust, it ought to be recognized and repealed: If it be just, and of an inferior nature; If the persons will not submit, they are, after due procedure, to be cast out, as those that will not hear the Church, and so both unity and purity, both order and truth are preserved. Will our Brethren under a pretext of order, destroy Christian-liberty, and bring-in Popish-tyranny? It is Christ’s order and the King of Saints’ peace that every believer have the judgment of discretion, whether the judicatories of the Kirk speak according to the Scriptures, or whether they ought to obey or submit, or gainsay or counteract; and what Christ has given them, no man can take from them. … As to the judgment of our Church [of Scotland] and of her general assemblies, we do deny that ever they were of this judgment, or have declared any such thing; but upon the contrary, let the Confession of Faith, presented unto the Parliament, and ratified by them in the year 1567 bear witness, Article 21, concerning the power and authority of councils lawfully gathered; the words are these: ‘So far as the council proves the determination and commandment that it gives by the plain Word of God, so soo[n?] do we reverence and embrace the same: But if men, under the name of a council, pretend to forge unto us new articles of our faith, or to make constitutions repugning to the Word of God, then utterly we must refuse the same, as the doctrine of devils, which draws our souls from the voice of our only God, to follow the doctrines and constitutions of men.’ In the beginning of the Reformation, 1562, it is concluded by the whole ministry, in the assembly held that year, session 2, ‘That ministers shall be subject in all lawful admonitions, as is prescribed in the Book of Discipline.’ Likewise, it is provided in the articles agreed upon by the general assembly held at Edinburgh, in March, 1570, session 2, concerning the jurisdiction of the Kirk: ‘That the suspension and deprivation of ministers and others, admitted to functions in the Kirk, charge of souls, etc. shall be for lawful causes.’ In the Book of Discipline, agreed upon in diverse preceding general assemblies, and recorded in the year, 1581, by order of the assembly held in April, session 9, to the defense of which discipline the King and subjects of all ranks did then subscribe and swear; which was also renewed in the year, 1638, it is expressly declared, ch. 7, concerning elderships, assemblies, and discipline, that ‘Office-bearers are to be deposed for good and just causes deserving deprivation.’ If it were needful, we could cite more of this kind: We shall only add [an]other two testimonies from very late assemblies of this Kirk. The Assembly convened at St. Andrews, in Anno 1642, session 8, in the overture for transplantation of ministers, do declare: ‘That no presbytery or assembly should pass a sentence for transportation of any minister, till they give reasons for the expediency of the same, both to him and his congregation, and to the presbytery whereof he is a member; That if they acquiesce to the reasons given, it is so much the better; if they do not acquiesce, yet the presbytery, or assembly, by giving such reasons before the passing of their sentence, shall make it manifest that what they do, is not pro arbitratu vel imperio [for the judgment or command] only, but upon grounds of reason.’ And the Assembly convened at Edinburgh, in anno 1647, in their brotherly exhortation to their Brethren of England, do declare as follows; ‘We would not’ (say they) ‘have our zeal for presbyterial government misunderstood, as if it tended to any rigor or domineering over the flock, or to hinder and exclude that instructing in meekness, them that oppose themselves, which the apostolical rule holds forth; or, as if we would have any such to be entrusted with that government, as are found not yet purged, either from their old profaneness, or from the prelatical principles and practices: which were to put a piece of new cloth into an old garment, and so to make the rent worse; or to put new wine into old bottles, and so to lose both wine and bottles.’ From these passages, impartially considered, it is manifest, that the general assemblies have judged, that as it is rigor and a domineering over the Lord’s flock, for the judicatories of the Kirk to determine, or do anything pro arbitratu vel imperio [for the judgment or the command], or without giving a reason thereof from the Word; so when they do thus determine and judge, there is no reason to submit thereunto, or acquiesce therein. … Our [Resolutioner] Brethren overshoot when they say that thus to submit, has been the constant practice of all the members and judicatories of this Kirk ever since the late Reformation; If they mean of the Reformation of this Church from Popery [in 1560], they cannot but know that there was nothing more ordinary for the members and judicatories of this Kirk than not to submit unto, but to counteract the determinations and sentences of the prelates and their synods and assemblies, not only in matters of doctrine and worship, but also of discipline and government. It was ordinary for godly men, who were deposed by them and their courts, to preach and continue in the exercise of their ministry, notwithstanding of their sentences. Some of our [Resolutioner] Brethren themselves did it. It’s true that the prelates were not a lawful authority, nor Church-officers agreeable to the Word of God: but our Brethren do very well know that as the prelates, according to the act of their assembly at Glasgow, did sometimes in the suspension and deposition of ministers, associate to themselves the ministry of those bounds, where the supposed delinquent served, that is, the presbytery, whereof he was a member, which was a lawfully authority; and that as they did plead for such a submission to their decrees and sentences, as these Brethren do now plead for, and upon the same grounds of its being essential to government and preserving of unity and order, and shunning of confusion, etc. so also that those who did refuse and decline that submission, did it not only upon the ground of their want [lack] of lawful authority, but also upon this ground, that no obedience nor subjection is due to ecclesiastic laws that are unjust and contrary to the Word of God; as will appear to any that shall read the treatises that were published by the defenders of the truth in that hour of temptation, concerning the binding power of ecclesiastical laws. Their citation from the act of the general assembly, in anno 1647, concerning the Hundred and Eleven Propositions [by George Gillespie], and the seventh head of doctrine therein contained, does make against our [Resolutioner] Brethren, and not for them: 1. Because the foregoing words of that act do clear, that the Assembly speaks of ecclesiastical government, committed and entrusted by Christ to the assemblies of the Kirk: but Christ has committed no power to any assembly to tyrannize, nor has He commanded any Church-member, or any inferior Church-judicatory to subject themselves to ecclesiastical tyranny. 2. Because the propositions themselves to which that act do relate, do confine the obedience and subjection that is to be given to the ordinances and decrees of classes and synods, to lawful ordinances and decrees; ‘It is not lawful,’ say they: ‘to particular churches, or (as commonly they are called) parochial, either to decline the authority of classes or synods where they are lawfully settled, or may be had (much less to withdraw themselves from that authority if they have once acknowledged it) or to refuse such lawful ordinances and decrees of the classes or synods, as being agreeable to the Word of God, are with authority imposed upon them, Acts 15:2, 6, 22-24, 28-29; 16:4; Prop. 32.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The question (so far as we can understand them in it) is, ‘Whether such a submission be due from all the members of this Kirk, ministers and people, to the judicatories of the Kirk, and from the inferior to the superior Kirk-judicatories in matters of government and discipline, as ought upon the sentence (whether just or unjust) of these judicatories to sist [stop or delay] the proceedings of the person or party grieved therewith, and make them acquiesce thereunto, until the determination of the respective superior judicatory therein, without any counteracting to the same, unless it be to appeal unto, and follow their appeal before the superior judicatory?’ Upon this question we find the Brethren for the Protestation in their last paper at the conference, Nov. 25, 1655, expressing their judgment thus: ‘We are willing to subject ourselves to all the just sentences of the lawful assemblies of this Kirk; and if the case were only of a few particular persons, in things of more private interest and personal concernment, and of judicatories employing their power to edification in the current of their actings, we should not much contend about it; but when it is of a great number of godly ministers and elders and professors throughout the land, who do desire to stand in the breach, and to oppose the present course of defection, and of judicatories, the plurality whereof in many places do not act unto edification and for promoving the power of godliness, but to the contrary, it alters the case.’ .. It is to us, and we believe will be to all sober and unbiased men, who understand the principles of Church-government, new and strange doctrine [that of the Resolutioners], that an absolute and unlimited subjection to all sentences (whether just or unjust, or agreeable or repugnant to the Word of God) should be asserted to be at all of kin or alliance to the divine ordinance of presbyterial government, which is a part of the sweet and gentle yoke of Jesus Christ, that is far from tyranny and oppression. … If presbyterial government has (as we do believe and assert it to have) its foundation in the Testament of Jesus Christ, upon whose shoulder the Government is, then whatsoever is of the essence and being thereof, must derive itself from the fountain of Christ’s Revealed Will about the constitution and essentials of that government? But we know no tittle in his Book that says as our [Resolutioner] Brethren say, or from which, what they say in this matter, can be deduced by good and necessary consequence, to wit, that it is essential to the government which He has appointed His House to be ruled by, that all the children of the House should submit unto, and acquiesce in the determination of the governors, without any counteracting, though their sentence be contrary to the Law and the Testimony; and therefore till our [Resolutioner] Brethren prove this, they will give us leave to deny it. We acknowledge that power and authority, and subjection and submission are co-relatives, and that the power and authority of the superior can no more actually subsist without the subjection and submission of the inferior, than one relative can subsist without its co-relative: But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; And when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this submission which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny; because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, but being for matter, God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin, by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: A Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do. Their [the Resolutioners’] second reason is, that without this submission and subordination they do not see how unity and order can be continued in the Kirk, it being in vain to think of a remedy by superior judicatories without this, the refusing thereof being the way to make all union void… Answer [of Guthrie]: This is the very argument and language of the advocates of the Sea of Rome, whilst they plead the Pope’s visible headship and irrefragable authority and jurisdiction over the Church, to which all ought to submit without gainsaying, or counteracting, the very thing that has set up the Man of Sin to sit as God in the Temple of God, unto the enslaving both of the Word of God and the consciences of men, by requiring of them subjection and blind obedience to his dictates, without examining the same according to the light of the Word. If, according to the revealed Will of God, there ought to be such a submission in all cases, without counteracting, what shall we say of the practices of the prophets and apostles, and others of the servants of God who have lived before us in corrupt times? Must all their preachings and other actings, though most agreeable to the Word of God, be condemned, because they were contrary to the [will?] of the Church wherein they lived? [That?] were indeed to set up a power over the Word of God, a power for destruction and not for [edification?]; that would indeed make a sinful unity and order, and teach a way to avoid persecution, and readily to obtain peace with men, but with a loss of truth and a good conscience. The way to preserve unity and order in the House of God is, not to hearken to the counsels of flesh and blood, by setting up the will of man for a law and establishing an arbitrary and tyrannical power over consciences, to which they shall be tied to submit to iniquity and injustice; for, God has said, that the throne of iniquity that frames mischief into a law shall have no fellowship with Him [Ps. 94:20]; And therefore that may destroy unity and order, it will not preserve it. But to let the worship of God (which is both the rule and bond of unity and order) have place, Gal. 6:16, and judicatories proceeding according to this, is an effectual remedy actu primo [by the first act, or source] and objective, as in every ordinance of Christ; albeit actu secundo [by the following act] there is no efficacious remedy in either Word, sacraments, admonitions, suspension, deposition, excommunications, presbyteries, synods, or any ordinance the Church does enjoy or can exercise without the effectual blessing and influence of the Spirit of God, who is the author and appointer of these, and concurs therewith upon the consciences of men according to the pleasure of His own will. Shall persons sentenced unjustly, submit? Yes, say our Brethren, for preserving Unity and Order. What remedy then, say we [the Protesters], for preserving the truth? They may appeal, say they. But, say we, they have appealed, and have therein succumbed. What remedy now? No remedy, but that at one stroke the precious truths of God and interests of Jesus Christ must be born down and buried in oblivion; And the saints and ministers of the Gospel be buried under the rubbish thereof, because one assembly will have it so. But say our [Resolutioner] Brethren, how shall unity and order otherways be preserved in the Church of God? We answer, very well; because if the sentence be unjust, it ought to be recognized and repealed: If it be just, and of an inferior nature; If the persons will not submit, they are, after due procedure, to be cast out, as those that will not hear the Church, and so both unity and purity, both order and truth are preserved. Will our Brethren under a pretext of order, destroy Christian-liberty, and bring-in Popish-tyranny? It is Christ’s order and the King of Saints’ peace that every believer have the judgment of discretion, whether the judicatories of the Kirk speak according to the Scriptures, or whether they ought to obey or submit, or gainsay or counteract; and what Christ has given them, no man can take from them. … As to the judgment of our Church [of Scotland] and of her general assemblies, we do deny that ever they were of this judgment, or have declared any such thing; but upon the contrary, let the Confession of Faith, presented unto the Parliament, and ratified by them in the year 1567 bear witness, Article 21, concerning the power and authority of councils lawfully gathered; the words are these: ‘So far as the council proves the determination and commandment that it gives by the plain Word of God, so soo[n?] do we reverence and embrace the same: But if men, under the name of a council, pretend to forge unto us new articles of our faith, or to make constitutions repugning to the Word of God, then utterly we must refuse the same, as the doctrine of devils, which draws our souls from the voice of our only God, to follow the doctrines and constitutions of men.’ In the beginning of the Reformation, 1562, it is concluded by the whole ministry, in the assembly held that year, session 2, ‘That ministers shall be subject in all lawful admonitions, as is prescribed in the Book of Discipline.’ Likewise, it is provided in the articles agreed upon by the general assembly held at Edinburgh, in March, 1570, session 2, concerning the jurisdiction of the Kirk: ‘That the suspension and deprivation of ministers and others, admitted to functions in the Kirk, charge of souls, etc. shall be for lawful causes.’ In the Book of Discipline, agreed upon in diverse preceding general assemblies, and recorded in the year, 1581, by order of the assembly held in April, session 9, to the defense of which discipline the King and subjects of all ranks did then subscribe and swear; which was also renewed in the year, 1638, it is expressly declared, ch. 7, concerning elderships, assemblies, and discipline, that ‘Office-bearers are to be deposed for good and just causes deserving deprivation.’ If it were needful, we could cite more of this kind: We shall only add [an]other two testimonies from very late assemblies of this Kirk. The Assembly convened at St. Andrews, in Anno 1642, session 8, in the overture for transplantation of ministers, do declare: ‘That no presbytery or assembly should pass a sentence for transportation of any minister, till they give reasons for the expediency of the same, both to him and his congregation, and to the presbytery whereof he is a member; That if they acquiesce to the reasons given, it is so much the better; if they do not acquiesce, yet the presbytery, or assembly, by giving such reasons before the passing of their sentence, shall make it manifest that what they do, is not pro arbitratu vel imperio [for the judgment or command] only, but upon grounds of reason.’ And the Assembly convened at Edinburgh, in anno 164

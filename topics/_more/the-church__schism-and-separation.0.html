</figure><figure class="quote" id="q-97d15e8c3b" data-kw="">
<blockquote><p>Thus, dear sir, I have traced your separating project through diverse periods of the Church under the Old and New Testament: And, having given you touches at the good old way of our Lord Himself, the prophets and apostles, I have pondered these matters again and again, and have had the occasion to know the thoughts of the brightest lights of this and other reformed Churches, who all are of the same sentiments on this weighty head, and do jointly express their high detestation of schisms, which yet never came up the length of your new project. Pardon me to say it, I love to live and die with the cloud of witnesses, and especially with such great and eminent worthies; and have often been put to say it solemnly before the Lord, Let not my soul enter into the secret of your schismatical courses.</p></blockquote>

<blockquote><p>In these events there is no warrant from the Lord to the purer part to sever themselves from the impure, though more numerous, and to constitute a distinct body; nay, they ought to endeavor reformation, continuing in communion, and testifying regularly against what is wrong, without turning aside to any crooked way, Ps. 125:5.</p></blockquote>

<blockquote><p>As there is an itching after new doctrine in some, so is there for division in others. Gal. 5:19-20, ‘Now the works of the flesh are manifest; which are these, hatred, variance, emulations, wrath, strife, seditions.’ The Greek word dicostasias [***], there rendered “seditions,” signifies a renting of those who ought to be united in one common society. Jude 19, there says the apostle, ‘These are they who separate themselves, sensual, not having the Spirit.’ Sometimes separatists have made high pretenses to the Spirit, and yet been sensual. And the Assembly 1641, in their act against impiety and schism in meetings for mutual edification, having advised to eschew all such meetings as are apt to bread error, scandal and schism, they expressly say, “These are works of the flesh, but not of the Spirit, and are contrary to truth and peace.</p></blockquote>

<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>

</figure><figure class="quote" id="q-05764539d7" data-kw="">
<blockquote><p>In our Assemblies we were more to set up a state opposite to a state, more upon forms, citations, leading of witnesses, suspensions from benefices, than spiritually to persuade and work upon the conscience, with the meekness and gentleness of Christ; the glory and royalty of our princely Redeemer and King, was trampled on, as any might have seen in our Assemblies. What way the army and the sword, and the countenance of nobles and officers seemed to sway, that way were the censures carried: It had been better had there been more days of humiliation and fastings in Assemblies, synods, presbyteries, congregations, families, and far lass adjourning commissions, new peremptory summonses, and new drawn-up processes, and if the meekness and gentleness of our Master had got so much place in our hearts that we might have waited on gainsayers and parties contrary-minded, and we might have driven gently, as our Master Christ who loves not to overdrive, but carries the lambs in his bosom.</p></blockquote>

<blockquote><p>Though I differ from my reverend Brethren who have taken the oaths, yet I look upon myself as obliged to receive their testimony concerning the principles they adhere to; and few of them I know do approve the incorporating Union, and far less do any of them approve Erastian prelacy, supremacy and the English-Popish ceremonies. I owe them the charity or justice to believe that they sincerely disown these evils. Touching strainings for extracting perjury, scandal, error, heresy, and other such abominable crimes, from the different sentiments and practices of ministers, who otherwise are one in principle; such measures, I say, tend natively to confound all Christian societies, and are, amongst the inventions of Satan, mostly reserved till these last and perilous days, wherein our lot is fallen. No sound divine, nor any other fair antagonist (for what I know did ever charge his adversary with controverted consequences, as his direct and received opinion.</p></blockquote>

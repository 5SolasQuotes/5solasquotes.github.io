the+principles+of+Church-government%2C+new+and+strange+doctrine+%5Bthat+of+the+Resolutioners%5D%2C+that+an+absolute+and+unlimited+subjection+to+all+sentences+%28whether+just+or+unjust%2C+or+agreeable+or+repugnant+to+the+Word+of+God%29+should+be+asserted+to+be+at+all+of+kin+or+alliance+to+the+divine+ordinance+of+presbyterial+government%2C+which+is+a+part+of+the+sweet+and+gentle+yoke+of+Jesus+Christ%2C+that+is+far+from+tyranny+and+oppression.+%E2%80%A6+If+presbyterial+government+has+%28as+we+do+believe+and+assert+it+to+have%29+its+foundation+in+the+Testament+of+Jesus+Christ%2C+upon+whose+shoulder+the+Government+is%2C+then+whatsoever+is+of+the+essence+and+being+thereof%2C+must+derive+itself+from+the+fountain+of+Christ%E2%80%99s+Revealed+Will+about+the+constitution+and+essentials+of+that+government%3F+But+we+know+no+tittle+in+his+Book+that+says+as+our+%5BResolutioner%5D+Brethren+say%2C+or+from+which%2C+what+they+say+in+this+matter%2C+can+be+deduced+by+good+and+necessary+consequence%2C+to+wit%2C+that+it+is+essential+to+the+government+which+He+has+appointed+His+House+to+be+ruled+by%2C+that+all+the+children+of+the+House+should+submit+unto%2C+and+acquiesce+in+the+determination+of+the+governors%2C+without+any+counteracting%2C+though+their+sentence+be+contrary+to+the+Law+and+the+Testimony%3B+and+therefore+till+our+%5BResolutioner%5D+Brethren+prove+this%2C+they+will+give+us+leave+to+deny+it.+We+acknowledge+that+power+and+authority%2C+and+subjection+and+submission+are+co-relatives%2C+and+that+the+power+and+authority+of+the+superior+can+no+more+actually+subsist+without+the+subjection+and+submission+of+the+inferior%2C+than+one+relative+can+subsist+without+its+co-relative%3A+But+all+Church-power+and+authority+is+bounded+by+the+Word+of+God%2C+and+is+for+edification+only%3B+And+therefore+all+the+subjection+that+is+due+thereunto%2C+is+in+the+Lord+only%3B+And+when+we+are+thus+subject%2C+the+power+and+authority+is+sufficiently+acknowledged+and+preserved.+But%2C+say+our+%5BResolutioner%5D+Brethren%2C+without+this+submission+which+they+plead+for%2C+our+established+judicatories+would+be+nothing+but+consultative+meetings.+But+this+we+also+deny%3B+because+what+is+resolved+and+determined+by+Kirk-judicatories+in+a+right+way%2C+does+not+only+bind+by+virtue+of+the+intrinsic+lawfulness+thereof%2C+but+being+for+matter%2C+God%E2%80%99s+Word%2C+and+by+virtue+of+the+reverence+that+is+due+to+the+gifts+and+endowments+of+brethren+and+friends+counselling+right+things%2C+which+is+all+that+can+be+attributed+to+a+consultative+meeting%2C+but+also+by+virtue+of+a+positive+law+of+God%2C+by+which+He+has+commanded+us+to+hear+the+Church%2C+and+those+that+sit+in+Moses%E2%80%99+chair%2C+and+to+be+subject+in+the+Lord+to+Church-Governors%2C+to+whom+He+has+given+a+ministerial+and+official+authority+and+power+to+assemble+in+His+Name+in+the+respective+courts+appointed+by+Himself+for+governing+His+House+according+to+the+rule+of+His+Word%3B+And+therefore+as+they+have+authority+or+a+superiority+of+jurisdiction%2C+which+no+consultative+meeting+has%3B+So+whosoever+resists+their+power%2C+when+put+forth+to+edification%2C+and+not+to+destruction%2C+does+not+only+sin%2C+by+despising+that+Word+of+God+which+is+the+matter+of+their+decree%2C+and+by+despising+the+gifts+and+graces+of+their+brethren+that+are+exercised+in+holding+forth+light+unto+them%2C+but+does+also+sin+by+resisting+the+ordinance+of+God%3A+A+Kirk-judicatory+modeled+according+to+the+pattern+showed+in+the+mount%2C+and+clothed+with+authority+from+Jesus+Christ%2C+and+proceeding+according+to+the+Law+and+to+the+Testimony%2C+to+which+they+ought+to+be+subject%2C+God+having+commanded+us+so+to+do.+Their+%5Bthe+Resolutioners%E2%80%99%5D+second+reason+is%2C+that+without+this+submission+and+subordination+they+do+not+see+how+unity+and+order+can+be+continued+in+the+Kirk%2C+it+being+in+vain+to+think+of+a+remedy+by+superior+judicatories+without+this%2C+the+refusing+thereof+being+the+way+to+make+all+union+void%E2%80%A6+Answer+%5Bof+Guthrie%5D%3A+This+is+the+very+argument+and+language+of+the+advocates+of+the+Sea+of+Rome%2C+whilst+they+plead+the+Pope%E2%80%99s+visible+headship+and+irrefragable+authority+and+jurisdiction+over+the+Church%2C+to+which+all+ought+to+submit+without+gainsaying%2C+or+counteracting%2C+the+very+thing+that+has+set+up+the+Man+of+Sin+to+sit+as+God+in+the+Temple+of+God%2C+unto+the+enslaving+both+of+the+Word+of+God+and+the+consciences+of+men%2C+by+requiring+of+them+subjection+and+blind+obedience+to+his+dictates%2C+without+examining+the+same+according+to+the+light+of+the+Word.+If%2C+according+to+the+revealed+Will+of+God%2C+there+ought+to+be+such+a+submission+in+all+cases%2C+without+counteracting%2C+what+shall+we+say+of+the+practices+of+the+prophets+and+apostles%2C+and+others+of+the+servants+of+God+who+have+lived+before+us+in+corrupt+times%3F+Must+all+their+preachings+and+other+actings%2C+though+most+agreeable+to+the+Word+of+God%2C+be+condemned%2C+because+they+were+contrary+to+the+%5Bwill%3F%5D+of+the+Church+wherein+they+lived%3F+%5BThat%3F%5D+were+indeed+to+set+up+a+power+over+the+Word+of+God%2C+a+power+for+destruction+and+not+for+%5Bedification%3F%5D%3B+that+would+indeed+make+a+sinful+unity+and+order%2C+and+teach+a+way+to+avoid+persecution%2C+and+readily+to+obtain+peace+with+men%2C+but+with+a+loss+of+truth+and+a+good+conscience.+The+way+to+preserve+unity+and+order+in+the+House+of+God+is%2C+not+to+hearken+to+the+counsels+of+flesh+and+blood%2C+by+setting+up+the+will+of+man+for+a+law+and+establishing+an+arbitrary+and+tyrannical+power+over+consciences%2C+to+which+they+shall+be+tied+to+submit+to+iniquity+and+injustice%3B+for%2C+God+has+said%2C+that+the+throne+of+iniquity+that+frames+mischief+into+a+law+shall+have+no+fellowship+with+Him+%5BPs.+94%3A20%5D%3B+And+therefore+that+may+destroy+unity+and+order%2C+it+will+not+preserve+it.+But+to+let+the+worship+of+God+%28which+is+both+the+rule+and+bond+of+unity+and+order%29+have+place%2C+Gal.+6%3A16%2C+and+judicatories+proceeding+according+to+this%2C+is+an+effectual+remedy+actu+primo+%5Bby+the+first+act%2C+or+source%5D+and+objective%2C+as+in+every+ordinance+of+Christ%3B+albeit+actu+secundo+%5Bby+the+following+act%5D+there+is+no+efficacious+remedy+in+either+Word%2C+sacraments%2C+admonitions%2C+suspension%2C+deposition%2C+excommunications%2C+presbyteries%2C+synods%2C+or+any+ordinance+the+Church+does+enjoy+or+can+exercise+without+the+effectual+blessing+and+influence+of+the+Spirit+of+God%2C+who+is+the+author+and+appointer+of+these%2C+and+concurs+therewith+upon+the+consciences+of+men+according+to+the+pleasure+of+His+own+will.+Shall+persons+sentenced+unjustly%2C+submit%3F+Yes%2C+say+our+Brethren%2C+for+preserving+Unity+and+Order.+What+remedy+then%2C+say+we+%5Bthe+Protesters%5D%2C+for+preserving+the+truth%3F+They+may+appeal%2C+say+they.+But%2C+say+we%2C+they+have+appealed%2C+and+have+therein+succumbed.+What+remedy+now%3F+No+remedy%2C+but+that+at+one+stroke+the+precious+truths+of+God+and+interests+of+Jesus+Christ+must+be+born+down+and+buried+in+oblivion%3B+And+the+saints+and+ministers+of+the+Gospel+be+buried+under+the+rubbish+thereof%2C+because+one+assembly+will+have+it+so.+But+say+our+%5BResolutioner%5D+Brethren%2C+how+shall+unity+and+order+otherways+be+preserved+in+the+Church+of+God%3F+We+answer%2C+very+well%3B+because+if+the+sentence+be+unjust%2C+it+ought+to+be+recognized+and+repealed%3A+If+it+be+just%2C+and+of+an+inferior+nature%3B+If+the+persons+will+not+submit%2C+they+are%2C+after+due+procedure%2C+to+be+cast+out%2C+as+those+that+will+not+hear+the+Church%2C+and+so+both+unity+and+purity%2C+both+order+and+truth+are+preserved.+Will+our+Brethren+under+a+pretext+of+order%2C+destroy+Christian-liberty%2C+and+bring-in+Popish-tyranny%3F+It+is+Christ%E2%80%99s+order+and+the+King+of+Saints%E2%80%99+peace+that+every+believer+have+the+judgment+of+discretion%2C+whether+the+judicatories+of+the+Kirk+speak+according+to+the+Scriptures%2C+or+whether+they+ought+to+obey+or+submit%2C+or+gainsay+or+counteract%3B+and+what+Christ+has+given+them%2C+no+man+can+take+from+them.+%E2%80%A6+As+to+the+judgment+of+our+Church+%5Bof+Scotland%5D+and+of+her+general+assemblies%2C+we+do+deny+that+ever+they+were+of+this+judgment%2C+or+have+declared+any+such+thing%3B+but+upon+the+contrary%2C+let+the+Confession+of+Faith%2C+presented+unto+the+Parliament%2C+and+ratified+by+them+in+the+year+1567+bear+witness%2C+Article+21%2C+concerning+the+power+and+authority+of+councils+lawfully+gathered%3B+the+words+are+these%3A+%E2%80%98So+far+as+the+council+proves+the+determination+and+commandment+that+it+gives+by+the+plain+Word+of+God%2C+so+soo%5Bn%3F%5D+do+we+reverence+and+embrace+the+same%3A+But+if+men%2C+under+the+name+of+a+council%2C+pretend+to+forge+unto+us+new+articles+of+our+faith%2C+or+to+make+constitutions+repugning+to+the+Word+of+God%2C+then+utterly+we+must+refuse+the+same%2C+as+the+doctrine+of+devils%2C+which+draws+our+souls+from+the+voice+of+our+only+God%2C+to+follow+the+doctrines+and+constitutions+of+men.%E2%80%99+In+the+beginning+of+the+Reformation%2C+1562%2C+it+is+concluded+by+the+whole+ministry%2C+in+the+assembly+held+that+year%2C+session+2%2C+%E2%80%98That+ministers+shall+be+subject+in+all+lawful+admonitions%2C+as+is+prescribed+in+the+Book+of+Discipline.%E2%80%99+Likewise%2C+it+is+provided+in+the+articles+agreed+upon+by+the+general+assembly+held+at+Edinburgh%2C+in+March%2C+1570%2C+session+2%2C+concerning+the+jurisdiction+of+the+Kirk%3A+%E2%80%98That+the+suspension+and+deprivation+of+ministers+and+others%2C+admitted+to+functions+in+the+Kirk%2C+charge+of+souls%2C+etc.+shall+be+for+lawful+causes.%E2%80%99+In+the+Book+of+Discipline%2C+agreed+upon+in+diverse+preceding+general+assemblies%2C+and+recorded+in+the+year%2C+1581%2C+by+order+of+the+assembly+held+in+April%2C+session+9%2C+to+the+defense+of+which+discipline+the+King+and+subjects+of+all+ranks+did+then+subscribe+and+swear%3B+which+was+also+renewed+in+the+year%2C+1638%2C+it+is+expressly+declared%2C+ch.+7%2C+concerning+elderships%2C+assemblies%2C+and+discipline%2C+that+%E2%80%98Office-bearers+are+to+be+deposed+for+good+and+just+causes+deserving+deprivation.%E2%80%99+If+it+were+needful%2C+we+could+cite+more+of+this+kind%3A+We+shall+only+add+%5Ban%5Dother+two+testimonies+from+very+late+assemblies+of+this+Kirk.+The+Assembly+convened+at+St.+Andrews%2C+in+Anno+1642%2C+session+8%2C+in+the+overture+for+transplantation+of+ministers%2C+do+declare%3A+%E2%80%98That+no+presbytery+or+assembly+should+pass+a+sentence+for+transportation+of+any+minister%2C+till+they+give+reasons+for+the+expediency+of+the+same%2C+both+to+him+and+his+congregation%2C+and+to+the+presbytery+whereof+he+is+a+member%3B+That+if+they+acquiesce+to+the+reasons+given%2C+it+is+so+much+the+better%3B+if+they+do+not+acquiesce%2C+yet+the+presbytery%2C+or+assembly%2C+by+giving+such+reasons+before+the+passing+of+their+sentence%2C+shall+make+it+manifest+that+what+they+do%2C+is+not+pro+arbitratu+vel+imperio+%5Bfor+the+judgment+or+command%5D+only%2C+but+upon+grounds+of+reason.%E2%80%99+And+the+Assembly+convened+at+Edinburgh%2C+in+anno+1647%2C+in+their+brotherly+exhortation+to+their+Brethren+of+England%2C+do+declare+as+follows%3B+%E2%80%98We+would+not%E2%80%99+%28say+they%29+%E2%80%98have+our+zeal+for+presbyterial+government+misunderstood%2C+as+if+it+tended+to+any+rigor+or+domineering+over+the+flock%2C+or+to+hinder+and+exclude+that+instructing+in+meekness%2C+them+that+oppose+themselves%2C+which+the+apostolical+rule+holds+forth%3B+or%2C+as+if+we+would+have+any+such+to+be+entrusted+with+that+government%2C+as+are+found+not+yet+purged%2C+either+from+their+old+profaneness%2C+or+from+the+prelatical+principles+and+practices%3A+which+were+to+put+a+piece+of+new+cloth+into+an+old+garment%2C+and+so+to+make+the+rent+worse%3B+or+to+put+new+wine+into+old+bottles%2C+and+so+to+lose+both+wine+and+bottles.%E2%80%99+From+these+passages%2C+impartially+considered%2C+it+is+manifest%2C+that+the+general+assemblies+have+judged%2C+that+as+it+is+rigor+and+a+domineering+over+the+Lord%E2%80%99s+flock%2C+for+the+judicatories+of+the+Kirk+to+determine%2C+or+do+anything+pro+arbitratu+vel+imperio+%5Bfor+the+judgment+or+the+command%5D%2C+or+without+giving+a+reason+thereof+from+the+Word%3B+so+when+they+do+thus+determine+and+judge%2C+there+is+no+reason+to+submit+thereunto%2C+or+acquiesce+therein.+%E2%80%A6+Our+%5BResolutioner%5D+Brethren+overshoot+when+they+say+that+thus+to+submit%2C+has+been+the+constant+practice+of+all+the+members+and+judicatories+of+this+Kirk+ever+since+the+late+Reformation%3B+If+they+mean+of+the+Reformation+of+this+Church+from+Popery+%5Bin+1560%5D%2C+they+cannot+but+know+that+there+was+nothing+more+ordinary+for+the+members+and+judicatories+of+this+Kirk+than+not+to+submit+unto%2C+but+to+counteract+the+determinations+and+sentences+of+the+prelates+and+their+synods+and+assemblies%2C+not+only+in+matters+of+doctrine+and+worship%2C+but+also+of+discipline+and+government.+It+was+ordinary+for+godly+men%2C+who+were+deposed+by+them+and+their+courts%2C+to+preach+and+continue+in+the+exercise+of+their+ministry%2C+notwithstanding+of+their+sentences.+Some+of+our+%5BResolutioner%5D+Brethren+themselves+did+it.+It%E2%80%99s+true+that+the+prelates+were+not+a+lawful+authority%2C+nor+Church-officers+agreeable+to+the+Word+of+God%3A+but+our+Brethren+do+very+well+know+that+as+the+prelates%2C+according+to+the+act+of+their+assembly+at+Glasgow%2C+did+sometimes+in+the+suspension+and+deposition+of+ministers%2C+associate+to+themselves+the+ministry+of+those+bounds%2C+where+the+supposed+delinquent+served%2C+that+is%2C+the+presbytery%2C+whereof+he+was+a+member%2C+which+was+a+lawfully+authority%3B+and+that+as+they+did+plead+for+such+a+submission+to+their+decrees+and+sentences%2C+as+these+Brethren+do+now+plead+for%2C+and+upon+the+same+grounds+of+its+being+essential+to+government+and+preserving+of+unity+and+order%2C+and+shunning+of+confusion%2C+etc.+so+also+that+those+who+did+refuse+and+decline+that+submission%2C+did+it+not+only+upon+the+ground+of+their+want+%5Black%5D+of+lawful+authority%2C+but+also+upon+this+ground%2C+that+no+obedience+nor+subjection+is+due+to+ecclesiastic+laws+that+are+unjust+and+contrary+to+the+Word+of+God%3B+as+will+appear+to+any+that+shall+read+the+treatises+that+were+published+by+the+defenders+of+the+truth+in+that+hour+of+temptation%2C+concerning+the+binding+power+of+ecclesiastical+laws.+Their+citation+from+the+act+of+the+general+assembly%2C+in+anno+1647%2C+concerning+the+Hundred+and+Eleven+Propositions+%5Bby+George+Gillespie%5D%2C+and+the+seventh+head+of+doctrine+therein+contained%2C+does+make+against+our+%5BResolutioner%5D+Brethren%2C+and+not+for+them%3A+1.+Because+the+foregoing+words+of+that+act+do+clear%2C+that+the+Assembly+speaks+of+ecclesiastical+government%2C+committed+and+entrusted+by+Christ+to+the+assemblies+of+the+Kirk%3A+but+Christ+has+committed+no+power+to+any+assembly+to+tyrannize%2C+nor+has+He+commanded+any+Church-member%2C+or+any+inferior+Church-judicatory+to+subject+themselves+to+ecclesiastical+tyranny.+2.+Because+the+propositions+themselves+to+which+that+act+do+relate%2C+do+confine+the+obedience+and+subjection+that+is+to+be+given+to+the+ordinances+and+decrees+of+classes+and+synods%2C+to+lawful+ordinances+and+decrees%3B+%E2%80%98It+is+not+lawful%2C%E2%80%99+say+they%3A+%E2%80%98to+particular+churches%2C+or+%28as+commonly+they+are+called%29+parochial%2C+either+to+decline+the+authority+of+classes+or+synods+where+they+are+lawfully+settled%2C+or+may+be+had+%28much+less+to+withdraw+themselves+from+that+authority+if+they+have+once+acknowledged+it%29+or+to+refuse+such+lawful+ordinances+and+decrees+of+the+classes+or+synods%2C+as+being+agreeable+to+the+Word+of+God%2C+are+with+authority+imposed+upon+them%2C+Acts+15%3A2%2C+6%2C+22-24%2C+28-29%3B+16%3A4%3B+Prop.+32.%E2%80%9D%0A%0A%E2%80%94+James+Guthrie%2C+Protesters+no+Subverters%2C+and+presbyterie+no+papacie%3B+or%2C+A+vindication+of+the+protesting+brethren%2C+and+of+the+government+of+the+kirk+of+Scotland+from+the+aspersions+unjustly+cast+upon+them%E2%80%A6+%281658%29%2C+pp.+42-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab7a949e00.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ab7a949e00.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=The%20question%20%28so%20far%20as%20we,6%2C%2022%2D24%2C%2028%2D29%3B%2016%3A4%3B%20Prop.%2032&amp;text=The%20question%20%28so%20far%20as%20we%20can%20understand&amp;text=Acts%2015%3A2%2C%206%2C%2022%2D24%2C%2028%2D29%3B%2016%3A4%3B%20Prop.%2032" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. We must distinguish betwixt a dependance ‘absolute’, and ‘in some respect’; a congregation does absolutely depend upon the holy Scriptures alone, as the perfect rule of faith, and manners, of worship and of Church-Government; for we accurse the tyranny of prelates, who claimed to themselves autocratoric power over congregations to whom they gave their naked-will for a law: one of themselves told a whole synod that they ought to esteem that best which seems so to superiors; and that this is a sufficient ground to the conscience for obeying, though the thing be inconvenient. We say that congregations ought indeed to be subject to presbyteries and synods, yet not absolutely, but in the Lord, and in things lawful: and to this purpose the constitutions of presbyteries and synods are to be examined by the judgement of Christian discretion; for a synod is judex judicandus [a judge which ought to be judged], and regula regulata [a rule having been regulated], so that it ought not to be blindly obeyed, whether the ordinances be convenient or inconvenient.</p></blockquote>

</figure><figure class="quote" id="q-9f1e6a1d66" data-kw="">
<blockquote><p>The first particular is (as they [the Resolutioners] call it) “The declining the authority of the supreme Church-judicatories of this nation once and again”; They mean the protestations [by the Protesters] against the two late pretended Assemblies at St. Andrews, and Dundee, and Edinburgh… …they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one [the former] when they are necessarily called to give a testimony against the other [the latter]; Yea, the duty and care they owe to the preservation of the government [of the Church] constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt National Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honored amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government it self;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 17-18</span></figcaption>

<blockquote><p>7. To wave a little that which concerns private and particular persons, we offer it to consideration whether inferior Kirk-judicatories are subordinate to the greater and superior simply and absolutely, because they are greater and superior, or, because the inferior have no intrinsical power given them by Jesus Christ, but in, and with subordination to the greater, because greater. If so, it would seem that all the inferior Judicatories of the Kirk, Congregational-Elderships, Presbyteries, and Provincial Synods must be fenced and act in the name, and by virtue of the authority derived from the General Assembly, as all those Civil Courts that have no intrinsic power in themselves, but in, and with subordination to the supreme Civil Magistrate are fenced in his name and act by virtue of his authority. Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto. 8. What is denied jure to ecomenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecomenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an Angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>

<blockquote><p>4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.”

<blockquote><p>Some of the special advocates of liberty of speech and opinion, are apt, when in the majority, to find out that it is very heinous to express any dissent from the decision of the General Assembly. This is not Protestantism; nor is it Christianity. It is perfectly consistent with all due deference and obedience, for any member of the Church to express without reserve his opinions as to the wisdom or justice of any decision of our ecclesiastical courts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, b. ‘Review of a Decision that Appeals cannot lie except in Judicial Cases’</cite>, p. 489</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-fb363377bd" data-kw="">
<blockquote><p>…simply a question of law in our own church, ‘the Presbyterian Church in the United States,’ the question of whether the Assembly has the power ‘to make law for the church in the matter of ‘offences,’ or to give its deliverances in thesi the force the force of judicial decisions. It had been contended by some that the deliverances of the Assemblies of 1865, 1869, and 1877 obliged the courts of original jurisdiction to discipline for dancing, that is, to exclude every church member convicted of dancing from the privileges of the church; that these courts had no discretion; that they were not allowed to interpret the law of the church for themselves, but must accept the interpretation of the Assembly, albeit that interpretation had not been given in the investigation of a judicial case regularly brought up (that is, in hypothesi), but as an abstract and general proceeding (in thesi)… Before proceeding to vindicate the action of the Assembly [which later said that its theses were ‘only didactic, advisory and monitory’], we beg leave to remind our readers that the principle here involved is one of immense importance. It lies at the root of all the struggles between the advocates of a constitutional government and the advocates of an ‘absolutism’… the essence of the struggle has always been the same… the question has always been, whether the power of the whole is over every part, or only over the power of the part; whether the whole is simply a great wheel, of which the parts are only spokes, or whether it be a wheel of which the parts are also wheels, each having a sphere and movement of its own, yet moving in subordination to the movement of the great wheel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Powers of the Several Church Courts: The Action of the Assembly of 1879 on Worldly Amusements, or the Powers of our Several Church Courts’ in Miscellanies of Rev. Thomas E. Peck... (Richmond, 1896), vol. 2, pp. 331-360. Originally published in The Southern Presbyterian Review (April, 1880). Also with an introduction in ed. Hall &amp; Hall, Paradigms in Polity… (Eerdmans, 1994), pp. 585-602. | Peck:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-5b76cd05d2" data-kw="">
<blockquote><p>The subject matter of these debates [surrounding the public Resolutions] is not so far removed out of the way as our [Resolutioner] Brethren do talk, but do still continue in many respects: 1. In regard of the sin and guilt thereof, which has not been taken-with, nor repented-of till this day. And as the resolution Brethren judge it hard for the protesting Brethren to be satisfied with nothing, unless they do repent of that, as a sin which in their consciences they judge to be a duty; So they must give leave to the protesting Brethren to judge it hard, that the Church, of which they are members and ministers, should lie under the guilt of a public transgression, and under great and sore wrath, because thereof, and they in the meanwhile not be permitted to discover her iniquity therein, that her captivity may be turned away, especially when they are engaged by Covenant so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters... (1658)</cite>, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-83bee89ed8" data-kw="">
<blockquote><p>And when the diet of the General Assembly came, having first done what they could for incapacitating all Brethren of differing judgment from these Resolutions, to sit in the Assembly, by citing them to the Assembly as guilty persons… did also make acts appointing and ordaining censures against all persons in this Church, whether Ministers or professors [professing Christians], that did not acknowledge the authority, and submit to the acts and constitutions of that Assembly concerning those Resolutions, and barring all such expectants [those training for the ministry] from entrance to the Ministry as should not acknowledge that authority, and submit to those constitutions; And in their Assembly of the next year at Edinburgh, do provide and ordain presbyteries to take special care, that upon the calling of any expectant to a particular charge of the ministry, before they admit him to his trials, they require him under his hand to pass from the Protestations and Declinators against this and the preceding General Assembly, if he has been accessory to the same; and to promise and give assurance that he shall abstain from holding up debates and controversies about matters of differences in this Kirk since the Assembly, 1650, in preaching, writing, or otherwise; upon the performance whereof, the presbytery shall proceed to his trials; If not, in that case the presbytery shall forbear to proceed, until the next General Assembly; leaving liberty to the presbytery or congregation for planting of the place otherwise: …By these proceedings and practices, the most unjust and irregular that we have known in this Church since we did begin to look at reformation in the year 1638, and which were indeed the great cause of the distempers and distractions that have since followed, malignant and disaffected men in congregations and presbyteries have got up the head, and having the advantage of the acts already mentioned, they do make a bar thereof to shut the door against the calling of able and godly men to the work of the Ministry, who cannot bring their consciences in bondage to these things;… …though yet the protesting Brethren have been tender even of these things [of order in due process], and have made conscience as to do nothing evil and sinful in itself, so to do nothing from contempt or disrespect to the least point of order; yea, they have been careful to keep within the bounds, warranted and allowed unto them of God; And, if it be fit to compare, we may truly say, that for all the noise our Brethren make against them, for the violation of order, and taking irregular courses, they have been more careful than themselves have been, and that they have more just and weighty grievance against them, even upon this accompt [account], than they have against the protesting Brethren:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 20-23</span></figcaption>

n+this+Church+since+we+did+begin+to+look+at+reformation+in+the+year+1638%2C+and+which+were+indeed+the+great+cause+of+the+distempers+and+distractions+that+have+since+followed%2C+malignant+and+disaffected+men+in+congregations+and+presbyteries+have+got+up+the+head%2C+and+having+the+advantage+of+the+acts+already+mentioned%2C+they+do+make+a+bar+thereof+to+shut+the+door+against+the+calling+of+able+and+godly+men+to+the+work+of+the+Ministry%2C+who+cannot+bring+their+consciences+in+bondage+to+these+things%3B%E2%80%A6+%E2%80%A6though+yet+the+protesting+Brethren+have+been+tender+even+of+these+things+%5Bof+order+in+due+process%5D%2C+and+have+made+conscience+as+to+do+nothing+evil+and+sinful+in+itself%2C+so+to+do+nothing+from+contempt+or+disrespect+to+the+least+point+of+order%3B+yea%2C+they+have+been+careful+to+keep+within+the+bounds%2C+warranted+and+allowed+unto+them+of+God%3B+And%2C+if+it+be+fit+to+compare%2C+we+may+truly+say%2C+that+for+all+the+noise+our+Brethren+make+against+them%2C+for+the+violation+of+order%2C+and+taking+irregular+courses%2C+they+have+been+more+careful+than+themselves+have+been%2C+and+that+they+have+more+just+and+weighty+grievance+against+them%2C+even+upon+this+accompt+%5Baccount%5D%2C+than+they+have+against+the+protesting+Brethren%3A%E2%80%9D%0A%0A%E2%80%94+James+Guthrie%2C+Protesters+no+Subverters%2C+and+presbyterie+no+papacie%3B+or%2C+A+vindication+of+the+protesting+brethren%2C+and+of+the+government+of+the+kirk+of+Scotland+from+the+aspersions+unjustly+cast+upon+them%E2%80%A6+%281658%29%2C+pp.+20-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83bee89ed8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/83bee89ed8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=And%20when%20the%20diet%20of%20the,they%20have%20against%20the%20protesting%20Brethren&amp;text=And%20when%20the%20diet%20 <blockquote><p>…yet has there been too much mischief done by these acts, to wit… the barring of hopeful young-men from trials, in order to public preaching, and of able and godly expectants from being called and tried, in order to their entrance in the ministry, because they had no freedom in their consciences to take upon them the bonds required, which we have already set down: for, this act, as it has kept sundry congregations from calling expectants of that judgment, because there was no probable way how they could be tried or admitted to the ministry; So have sundry expectants, being called, been thereby barred from proceeding to their trials…; and sundry hopeful young-men have been necessitated to remove from the presbyteries and provinces wherein they do live, before they could be admitted to give any proof of their gifts for preaching…</p></blockquote>

</figure><figure class="quote" id="q-0e46a7aa42" data-kw="">
<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>

eformed Books Online</a></div>
</figure><figure class="quote" id="q-a3129fa969" data-kw="">
<blockquote><p>Yea and the injunctions and statutes do permit and give leave to speak against all abuses in all things (but with these exceptions), that we speak not reproachfully, willfully and obstinately, but in humility as we ought, and as being under correction and judgment of magistrates if we speak amiss; read the statute and you shall find such like words; yea and experience will teach you that of late and also long ago both at Paul’s Cross and in the Court some preachers have boldly condemned abuses in the state, and speaking under correction of the magistrate, have not only been suffered but commended of the Queen Majesty herself.</p></blockquote>

<blockquote><p>Controversy in religion is a hateful thing. It is hard enough to fight the devil, the world, and the flesh without private differences in our own camp. But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace, we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling! There are times when controversy is not only a duty but a benefit. Give me the mighty thunderstorm rather than the pestilential malaria. The one walks in darkness and poisons us in silence, and we are never safe. The other frightens and alarms for a little season. But it is soon over, and it clears the air. It is a plain Scriptural duty to “contend (Jude 3). I am quite aware that the things I have said are exceedingly distasteful to many minds. I believe many are content with teaching which is not the whole truth and fancy it will be “all the same” in the end. I am sorry for them. I am convinced that nothing but the whole truth is likely, as a general rule, to do good to souls. I am satisfied that those who willfully put up with anything short of the whole truth will find at last that their souls have received much damage. Three things there are which men never ought to trifle with—a little poison, a little false doctrine, and a little sin. I am quite aware that when a man expresses such opinions as those I have just brought forward there are many ready to say, “He is no Churchman.” I hear such accusations unmoved. The day of judgment will show who were the true friends of the Church of England and who were not. I have learned in the last thirty-two years that if a clergyman leads a quiet life, lets alone the unconverted part of the world, and preaches so as to offend none and edify none, he will be called by many “a good Churchman.” And I have also learned that if a man studies the Articles and Homilies, labors continually for the conversion of souls, adheres closely to the great principles of the Reformation, bears a faithful testimony against popery, and preaches as Jewell and Latimer used to preach, he will probably be thought a firebrand and “troubler of Israel,” and called no Churchman at all! But I can see plainly that they are not the best Churchmen who talk most loudly about Churchmanship. I remember that none cried “Treason” so loudly as Athaliah (2 Kings 11:14). Yet she was a traitor herself. I have observed that many who once talked most about Churchmanship have ended by forsaking the Church of England and going over to Rome. Let men say what they will. They are the truest friends of the Church of England who labor most for the preservation of truth. I lay these things before the readers of this paper and invite their serious attention to them. I charge them never to forget that truth is of more importance to a Church than peace. I ask them to be ready to carry out the principles I have laid down, and to contend zealously, if needs be, for the truth. If we do this we shall have learned something from Antioch [Acts 15].</p></blockquote>

<blockquote><p>Whatsoever worship is offered up to God by the minister, whether in prayer conceived by himself or devised by others, it is in the name of the congregation: but every phrase, petition or branch of petition is not approved by their presence, silence, or saying ‘Amen’ to the prayers in general… The presence of the people was never deemed interpretatively a consent to every thing that was there done. The prayers which for matter God disallows we ought to disallow, but as God disallows them, and as He calls us forth to bear witness to his truth. But it is one thing to tolerate, another to approve; one thing to disallow the method or form, another the matter; one thing privately to dislike, another openly to witness against a thing as in no wise to be born withal; one thing to speak when we are called forth, another to thrust ourselves forth unadvisedly. Some things are to be born with in brethren whereof we are not bound so much as to admonish them, unless we be entirely familiar and of intimate acquaintance: Some things we must bear with though upon admonition they be not amended. The people must bear with some infirmities in their minister, both in preaching and prayer, as he must with some wants in them, without so much as taking notice of them to admonish by way of censure.¹ ¹ “Sins are either controvertable or manifest: If controvertable and doubtful, men ought to bear one with another’s different judgment; if they do not, but any for this make a breach of Separation, they sin.” Henry Ainsworth, Against Mr. Bern. Reas. Removed, p. 17 And if upon admonition he cannot be of their minds in everything, they must not reject and cast him off, no more than he is to cut them off because in every point they conform not to his pleasure. If the parties be stubborn, and will not hear admonitions, but rather grow more perverse and desperate, even to rent and tear in pieces such as seek to reclaim them, we are not bound to make known our judgment and profession unto them, unless we be lawfully called of God thereunto. And if the greater part be in errour and so stiff that they would sooner persecute the better than reform, if it be not in matters fundamental or bordering thereupon, or noxious and pernicious to be concealed, I know not that either that innocent [person] is allowed to separate from the exercises of religion for that cause, or bound to admonish them of their error. He that taught to suffer the tares rather then to pluck up the wheat with them (Mt. 13:29), has showed a reason for this judgement. (See Calvin, Epistle 117) ‘This I do infinitely grieve at’ (said Augustine): ‘that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.’ That every private Christian should in public manner question the doctrine of his minister or the prayers of the congregation, and declare his dislike in whatsoever is not agreeable to his particular opinion, in such manner as is mentioned, is neither commanded of God, nor consonant to right reason, is not agreeable to order, peace, love, or Christian moderation, and of necessity must fill the church with confusion, disorder, rents and schisms.</p></blockquote>

7+And+if+upon+admonition+he+cannot+be+of+their+minds+in+everything%2C+they+must+not+reject+and+cast+him+off%2C+no+more+than+he+is+to+cut+them+off+because+in+every+point+they+conform+not+to+his+pleasure.+If+the+parties+be+stubborn%2C+and+will+not+hear+admonitions%2C+but+rather+grow+more+perverse+and+desperate%2C+even+to+rent+and+tear+in+pieces+such+as+seek+to+reclaim+them%2C+we+are+not+bound+to+make+known+our+judgment+and+profession+unto+them%2C+unless+we+be+lawfully+called+of+God+thereunto.+And+if+the+greater+part+be+in+errour+and+so+stiff+that+they+would+sooner+persecute+the+better+than+reform%2C+if+it+be+not+in+matters+fundamental+or+bordering+thereupon%2C+or+noxious+and+pernicious+to+be+concealed%2C+I+know+not+that+either+that+innocent+%5Bperson%5D+is+allowed+to+separate+from+the+exercises+of+religion+for+that+cause%2C+or+bound+to+admonish+them+of+their+error.+He+that+taught+to+suffer+the+tares+rather+then+to+pluck+up+the+wheat+with+them+%28Mt.+13%3A29%29%2C+has+showed+a+reason+for+this+judgement.+%28See+Calvin%2C+Epistle+117%29+%E2%80%98This+I+do+infinitely+grieve+at%E2%80%99+%28said+Augustine%29%3A+%E2%80%98that+many+most+wholesome+precepts+of+divine+Scripture+are+little+regarded%2C+and+in+the+meantime+all+is+so+full+of+many+presumption%2C+that+he+is+more+grievously+found+fault+with+who+during+this+octaves+touches+the+earth+with+his+naked+foot+than+he+that+shall+bury+his+soul+in+drunkenness.+And+after%2C+I+cannot+approve+them%2C+and+I+think+they+are+to+be+cut+off+wheresoever+we+have+power.+Many+of+these+things%2C+for+fear+of+scandalizing+many+holy+persons%2C+or+provoking+those+that+are+turbulent%2C+I+dare+not+freely+disallow.%E2%80%99+That+every+private+Christian+should+in+public+manner+question+the+doctrine+of+his+minister+or+the+prayers+of+the+congregation%2C+and+declare+his+dislike+in+whatsoever+is+not+agreeable+to+his+particular+opinion%2C+in+such+manner+as+is+mentioned%2C+is+neither+commanded+of+God%2C+nor+consonant+to+right+reason%2C+is+not+agreeable+to+order%2C+peace%2C+love%2C+or+Christian+moderation%2C+and+of+necessity+must+fill+the+church+with+confusion%2C+disorder%2C+rents+and+schisms.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Friendly+Trial+of+the+Grounds+tending+to+Separation...+%28Cambridge%3A+Daniel%2C+1640%29%2C+ch.+9%2C+%E2%80%9CIt+is+lawful+for+a+Christian+to+be+present+at+that+service+which+is+read+out+of+a+book+in+some+things+faulty+both+for+form+and+matter%E2%80%9D%2C+pp.+161-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56c628c96a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/56c628c96a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=Whatsoever%20worship%20is%20offered%20up%20to,with%20confusion%2C%20disorder%2C%20rents%20and%20schisms&amp;text=Whatsoever%20worship%20is%20offered%20up%20to%20God%20by&amp;text=the%20church%20with%20confusion%2C%20disorder%2C%20rents%20and%20schisms" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fourthly, it is objected, that what concerns all, ought to be done with the consent of all. Answer: We hold the same, but the consent of all is one thing, the exercise of jurisdiction by all, another thing. Ainsworth, in one of his epistles to Paget, condemns the elderships sitting and judging matters apart from the congregation. Paget answers, that though the eldership sit apart to judge, yet before any sentence be given for the cutting off of any offender, or for any other thing which concerneth all, matters are first propounded to the whole church, and their prayers and consent required. And surely this form of proceeding shines forth to us in that apostolical synod at Jerusalem…</p></blockquote>

lank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.</p></blockquote>

<blockquote><p>2. The second assembly is a classis [presbytery] of many pastors and elders from sundry congregations who have power of excommunication, (1) in respect [case] that the person excommunicated does keep company with many consociated [associated] churches and so as a leaven may infect many (1 Cor. 5:4; Matt 26:59; John 11:47; Acts 20:17,18); (2) and for this cause, one pastor of a single congregation, is not able to ordain a pastor (because it wants example in the Word of God). Therefore a college of presbyters, or a presbytery of pastors and elders, who have power larger than a session, even to excommunicate and ordain pastors, is necessary in the church, which ordains Timothy to be a pastor, and so may deprive and excommunicate him (1 Tim. 4:14, Acts 20:17,18,28,29). … In church censures we proceed thus: In private faults if a brother offend a brother, he is admonished alone by the offended. If that gain him not, he is admonished before two or three; if that prevail not, the matter is brought before the church, which has power of the keys; if he obey not the church, he is excommunicated (Matt 18:15-20). … 3. Our third censure is the greater excommunication, which is done by the whole congregation, as all other censures, but in diverse ways: (1) by the presbytery or eldership judicially and authoritatively, (2) by Paul his pastoral spirit (1 Cor. 5:4), the minister in the church’s name pronouncing the sentence (1 Tim. 1:20), (3) and by the people…</p></blockquote>

nd+the+Power+of+Censures%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2649e160f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2649e160f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church/independent-churches-do-not-have-the-authority-for-greater-excommunication/#:~:text=2.%20The%20second%20assembly%20is%20a,1%3A20%29%2C%20%283%29%20and%20by%20the%20people&amp;text=2.%20The%20second%20assembly%20is%20a%20classis%20%5Bpresbytery&amp;text=1%20Tim.%201%3A20%29%2C%20%283%29%20and%20by%20the%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-44c82e3ab4" data-kw="">
<blockquote><p>First, then, we shall take into consideration the bounds of the power of particular [local] elderships, and how the same may be said to be independent, and how not… The first distinction is, between things which are proper and peculiar to one congregation, and things which are common to many: the former pertains to the particular eldership, the latter to the common eldership. Whence it comes that, in Scotland, the cases of ordination, suspension, deposition and excommunication, are determined in the greater presbyteries, because it does not concern one congregation alone, but many, who be taken into the common presbytery, and who be put out of the same; neither does the excommunication of a sinner concern only one congregation, but the neighboring congregations also, among whom, as it is to be commonly supposed, the sinner does often haunt and converse. Cyprian [A.D. 200-258], speaking of the admission of some who had fallen, and who had no recommendation from the martyrs [witnesses] to be received again, refers the matter to a common meeting, and his reason is, because it was a common cause, ‘and did not concern a few, nor one church only,’ see Book 2, Epistle 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, p. 43.</span></figcaption>

— George Gillespie, An Assertion of the Government of the Church of Scotland, p. 43.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+then%2C+we+shall+take+into+consideration+the+bounds+of+the+power+of+particular+%5Blocal%5D+elderships%2C+and+how+the+same+may+be+said+to+be+independent%2C+and+how+not%E2%80%A6+The+first+distinction+is%2C+between+things+which+are+proper+and+peculiar+to+one+congregation%2C+and+things+which+are+common+to+many%3A+the+former+pertains+to+the+particular+eldership%2C+the+latter+to+the+common+eldership.+Whence+it+comes+that%2C+in+Scotland%2C+the+cases+of+ordination%2C+suspension%2C+deposition+and+excommunication%2C+are+determined+in+the+greater+presbyteries%2C+because+it+does+not+concern+one+congregation+alone%2C+but+many%2C+who+be+taken+into+the+common+presbytery%2C+and+who+be+put+out+of+the+same%3B+neither+does+the+excommunication+of+a+sinner+concern+only+one+congregation%2C+but+the+neighboring+congregations+also%2C+among+whom%2C+as+it+is+to+be+commonly+supposed%2C+the+sinner+does+often+haunt+and+converse.+Cyprian+%5BA.D.+200-258%5D%2C+speaking+of+the+admission+of+some+who+had+fallen%2C+and+who+had+no+recommendation+from+the+martyrs+%5Bwitnesses%5D+to+be+received+again%2C+refers+the+matter+to+a+common+meeting%2C+and+his+reason+is%2C+because+it+was+a+common+cause%2C+%E2%80%98and+did+not+concern+a+few%2C+nor+one+church+only%2C%E2%80%99+see+Book+2%2C+Epistle+14.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland%2C+p.+43.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44c82e3ab4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/44c82e3ab4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church/independent-churches-do-not-have-the-authority-for-greater-excommunication/#:~:text=First%2C%20then%2C%20we%20shall%20take%20in </figure><figure class="quote" id="q-bf446c742e" data-kw="">
<blockquote><p>If any person walk unworthy of the Gospel or commit any trespass, he is (unless the scandal be public and notorious) admonished first: secretly by one, next by two or three more. And thirdly, if he contemn both, then according to the order prescribed by our Savior (Matt 18), the matter is brought before the minister and elders where he is accused both of the trespass and of the contempt. If he cannot yet be brought to repentance, then is the matter in some measure made known unto the congregation and he is called before the greater presbytery, where, if he give signs of his repentance, he is remitted to satisfy his own session. But if he persist in his obstinacy, then by the ordinance of the presbytery, the particular eldership is to proceed against him with the censures of the church even to excommunication. The matter being thus heard, known and judged, and the whole process revised by the greater presbytery, the next Sabbath (without delay) the trespass and order of admonitions are declared to the congregation and the person (without specification of his name) is admonished yet to satisfy. Which, if he still refuse to do, the next Sabbath his name, with his offence and contempt, are published. If he yet continue obstinate, then on the next Sabbath (which is the third), he is charged publicly to satisfy for his offence and contempt under the pain of excommunication. If now he offer himself to the particular presbytery, then do they (at the appointment of the presbytery) give order for his public repentance, the removing of the scandal, and his reconcilement to the church. Otherwise the minister proceeds in this order: … As the presbytery excommunicates profane professors, so does it also depose preachers… … The subject and matters treated in the presbytery are all the ecclesiastical matters of weight which concern the particular churches there represented, as: the examination, ordination, suspension and deposition of ministers, scandals of ministers in doctrine, life, or any part of their calling, the decerning [decreeing] of excommunication…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite></span></figcaption>

</figure><figure class="quote" id="q-e7a6408d05" data-kw="">
<blockquote><p>By which meanes it shall moreover come to pass (which is the other caution to be given) that not every pastor (no not with the elders of his congregation) shall be permitted to have full liberty of binding and loosing, but shall in those matters receive counsell and advice from other pastors. Howbeit for this latter purpose, the Church of Scotland has profitably provided another remedy also, namely, that in certain chief places, all the pastors in the adjacent bounds, shall at set and ordinary times assemble themselves (which assemblies in this nation we call Presbyteries) that so the Churches may be governed Communi Presbyterorum consilio [by the common counsel of presbyters], as Hierome speaks of the primitive times of the Church. 3. Though the execution of the discipline of excommunication and absolution pertain to the consistory [local session] of the pastor and elders in every Church, yet this discipline is to be by them executed in name of the whole Church (Zanchi, in 4 Praec., col. 756; D. Fulke on 1 Cor. 5:4).</p></blockquote>

</figure><figure class="quote" id="q-3e19bd711b" data-kw="">
<blockquote><p>Sin is a sweet morsal that makes God’s elect sick souls ere they get it vomited up; it leaves a sting behind it, which some one time or other will create them no little pain. Elihu shows us both the case and cure, Job 33. Behold the case one may be in whom God has thoughts of love to: He darts convictions into his conscience, and makes them stick so fast, that he cannot rid himself of them, v. 16; his very body sickens, v. 19. He is chastened also with pain upon his bed, and the multitude of his bones with strong pain: He loses his stomach, v. 20. His life abhors bread, and his soul dainty meat. His body pines away, so that there is nothing on him but skin and bone; He is looking every moment when devils, those destroyers, Heb. 9:11, those murderers or manslayers, Jn. 8:44, will comeand carry away his soul to Hell. O dreadful case! yet there is hope. Now, see how the sick man is cured: The phsician’s art cannot prevail here; ‘Tis soul-trouble that has brought the body into this disorder.</p></blockquote>

<blockquote><p>It is one thing most requisite, that the true Kirk is discerned from the filthy synagogues by clear and perfect notes, lest we, being deceived, receive and embrace to our condmenation the one for the other. The notes therefore of the true Church of God, we believe, confess and avow to be: First, the true preaching of the Word of God, wherein God has revealed Himself to us, as the writings of the prophets and apostles do declare. Secondly, the right administration of the sacraments of Jesus Christ, which must be annexed unto the Word and promise of God, to seal and confirm the same in our hearts. Lastly, ecclesiastical discipline uprightly administered as God’s Word prescribes, whereby vice is repressed and virtue nourished. Wheresoever then these former notes are seen, and of any time continue (be the number never so few, about two or three) there, without all doubt, is the true Church of Christ, who, according to his promise, is in the midst of them.</p></blockquote>

<blockquote><p>Separation is one thing, and not hearing such or such a man is a far other thing. There may be many just grounds of exception against a particular person, why people may refuse to countenance him, without any hazard of separation, or joining with separatists in their principles. Separation is one thing, and refusing to attend the ministry of such a man is another thing; for a man may join with ordinances in another congregation, and so testify that he has no prejudice at the ministry, but only against such a man in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>But though all this were true of some ministers, does this justify your separation from all? How many worthy ministers are there in the congregations where you dwell, who are grave and edifying, and preach and practice godliness in the power of it, and yet you withdraw from them?</p></blockquote>

</figure><figure class="quote" id="q-796a2944fa" data-kw="">
<blockquote><p>Though in some cases as we are warranted, so we are necessitated to withdraw, yet neither do we allow it upon slight or slender grounds; nor can any tender soul be forced to discountenance the ministers of Christ (I do not speak here of the prelatic curates) without great reluctancy and grief of heart, even when the grounds of it are solid and valid, and the necessity unavoidable: Therefore we reject these as insufficient grounds, besides what are given already: 1. We cannot withdraw from a minister for his infirmities and weaknesses, natural, spiritual or moral. 2. Neither for personal faults and escapes; we expect a faithful but not a sinless ministry. 3. Nor for every defect in faithfulness through ignorance, want of courage, misinformation, or being biased with affection for particular persons. We do not hold that faults in members, or defects in ministers do pollute the ordinances, and so necessitate a separation; but agree with what Mr. Durham says on Revelation, ch. 2, lect. 6, ‘Sincerity discovered will cover many faults.’ 4. Nor for every discovery of hypocrisy: Though we may have ground to suspect a man’s principle and motive be not right, yet if he be following duty unblameably, and have a lawful call, what then? “Notwithstanding every way, whether in pretense or in truth, Christ is preached; therein we may rejoice,” Phil. 1:18. 5. Nor yet for real scandals not attended with obstinacy, if ministers will take reproof and admonition, and at least by doctrinal confessing, and practical forsaking them, satisfy the offended, etc.</p></blockquote>

<blockquote><p>Although a Church be defective in purging out of corrupt members, yet that does not pollute the ordinances to others, or necessitate them to separate from them. These Churches continue to be Churches, and the ordinances to be ordinances of Christ, although such were continued in communion with them; and, notwithstanding thereof, these who were free of those corruptions are approven and commended by Jesus Christ: And if it were not so, that a person’s endeavoring in his station to amend such a fault, and to have such scandals censured, did not exempt him from guiltiness so as to continue in Church communion, although the plurality of officers should be short of their duty in that respect; then there might be still separation after separation in infinitum [to infinity].</p></blockquote>

<blockquote><p>This is a very uncertain rule; for he may give his presence where he does not approve of the minister, and he may approve of the minister where he does not give his presence; and if he be absent, it is uncertain whether it be the minister’s fault or our own. And upon that ground the other party may be justified in dividing from us, because they may miss his presence among us and in our meetings; his presence in communion is the end of our meetings, and not the rule: The meeting is always lawful, and may have the expectation of his presence, that is gathered ‘in his name’; and none can say the meeting of presbyterian ministers in Scotland at this time, in these circumstances, are gathered in any other name. However, if we would expect a blessing, let us endeavor unity; for that is “as the dew of Hermon, and there the Lord commands the blessing,” Ps. 133 last.</p></blockquote>

<blockquote><p>as in the case of famous Mr. Alexander Henderson, who, at his first entry to the ministry at Leuchars, was prelatic, and by the bishop of St. Andrews brought in against the parish’s consent, so that, the day of his admission, the Church-doors being shut by the people, they were forced to break in by a window to get him entrance: But a little after, upon the report of a communion where Mr. Bruce was to help, he would needs, from a longing he had for to hear and see such a man, go secretly there, and placed himself in a dark place of the church where he might not be known. When Mr. Bruce was come to the pulpit, he did for a considerable time keep silence, as his manner was; which did some way astonish Mr. Henderson, but much more when he heard the first words wherewith he began, which were these, ‘He that comes not in by the door, but climbs up any other way, the same is a thief and a robber,’ which did, by the Lord’s blessing, at the very present take him by the heart, and had so great an impression on him, that it was the mean of his conversion.</p></blockquote>

</figure><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>

<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>

</figure><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>

<blockquote><p>Beware of separating new lights; to separate from, or gather Churches out of the true reformed or reforming Churches, has not the least warrant from the Word of God: When we see this or that amiss in a Church we are bidden exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwingli conferred amicably with the Anabaptists in Zurich as with dissenting brethren; and no course was taken to suppress or restrain them by the secular power, till they grew to gather Churches out of the true reformed Churches: But when it came to that, they could not be suffered or forborne, it was thought necessary to restrain them.</p></blockquote>

</figure><figure class="quote" id="q-6e67728399" data-kw="">
<blockquote><p>Our Lord Jesus is no approver nor countenancer of separation from a true Church for the faults of some members in it; neither do faults in some members, and defects in ministers and officers in executing discipline, pollute the ordinances in themselves, or to others who are free of that guilt; and so do not necessitate a separation from such a Church, or any ordinance thereof: For, this and the former epistle being compared together, these things are clear, that there were gross members in the Church, adulterers, Nicolaitans, seducers, etc. that they are continued in Church-communion, ‘thou hast them and sufferest them,’ clearly import this; for that angel no otherwise had them but as Church-members under his charge. 3. That this angel sinfully permitted them to continue Church-members, and therefore is reproved.</p></blockquote>

<blockquote><p>Schism has ever proven exceeding hurtful to the Church, and has been an inlet and nursery to the greatest errors: It is most pressingly condemned in the Scriptures, even with as great weight as corrupt doctrine and heresy are; and it is attributed to that same original, to wit, the flesh, with witchcraft, idolatry, heresy, etc. Gal. 5:20. It has also proven most dangerous to those who have been engaged therein, and often has been a snare to bring on spiritual desertion, deadness of spirit, security, self-confidence, or some other spiritual evils of that kind.</p></blockquote>

</figure><figure class="quote" id="q-e16d53b188" data-kw="">
<blockquote><p>Testimonies for the Lord are necessary, lovely and singularly useful, when according to the rule: But, when these prescribed bounds are exceeded, and our misguided zeal for a pretended respect to the Lord’s honor hurries to a taxing the commissions of his choicest ambassadors, and trampling such as are eminently beautified with Christ’s image, who can tell how far this gangrene may reach? My heart trembles at the mischiefs which any one unsound and unsafe position does lead to, especially in matters of this nature; and have often admired the judicious observe of a great man, against whom our friends, especially the more exercised, are not much, if at all, prejudiced, viz. ‘He that sheds man’s blood, by man shall his blood be shed; but whoso sheds the blood of Churches, his blood shall be shed by the Lord.’ (These are said to be the words of Mr. Shepherd.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-236068a358" data-kw="">
<blockquote><p>Consider that a separation, when not upon clear and just grounds, is a greater sin before God, and more piercing to the heart of Christ, than either murder or adultery, etc. because this is to dissolve the union of his Church and to divide Christian societies. Whosoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood. My dear friends, weigh seriously, as before the Lord, how Jesus Christ will take it at any man or woman’s hand to tear the commission of any of his ambassadors, whom he will still own as an ambassador, and as negotiating a peace between God and sinners: Sure I need neither tell you that withdrawing from hearing such is a tearing their commission; nor need I tell you that this will be found a sin more hateful and heinous in the sight of Jesus Christ than many others that appear more black.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>And to complete the dismal scene of our misery, we have had for a long time among us one of the most scandalous, pernicious and most unaccountable schisms that perhaps ever was in any age of the Church; a schism carried on by three weak men, supported by a poor people, and both are equally ignorant of the nature of union with, and separation from, a Church, and of what will justify the one or other; they cannot, in a consistency with their principles, hold communion with any Church this day on earth. We confess to our shame there are many things wrong with us, and that there are errors in the administration, against which we are, with the help of grace, still struggling and contending; and we resolve ever to plead against such corruptions: But no man of common understanding will think this national Church should be cast off, and that we should separate from her; we have a good constitution; we have a standard of doctrine without error; Westminster Confession of Faith, which we own as the confession of our faith; we have subscribed and preach the doctrine therein contained; our worship is pure, without men’s additions; our discipline and government, in their constitution, are agreeable unto, founded on, and appointed in the Word of God; and there are no sinful terms of communion imposed. As we cannot, and hope never shall, justify the measures some take, and for which they shall answer to God; so we will not despise the dust of Zion: What of the covenanted work of reformation is remaining among us, we must favor that dust, and look on it as precious, and pray and wrestle, by the help of grace, that our Lord would return to build his own House (for men have not courage to do it) and take a new infeftment[?] thereof by a cloud of his glory. There are a set of faithful ministers in this Church who are troubled for the many offenses that are given, and for laying so many stumbling blocks before the blind: And as they mourn for these in secret, so they give frequent testimony against them.</p></blockquote>

<blockquote><p>But for the separation, or as they would term it, the withdrawing from presbyterian ministers, which was set on foot in the times of persecution, and continues to this day, he was utterly against it.</p></blockquote>

</figure><figure class="quote" id="q-3067d18b5d" data-kw="">
<blockquote><p>Touching the principles and practices of sundry, who during the persecution and afterwards did abstract from hearing presbyterian ministers and confined their attendance to some few, though he pitied a poor oppressed and harassed company, considering that oppression will make even a wise man mad, yet he utterly disapproved and detested their singular opinions, and was at pains to reclaim such of them as he had occasion to see. He was then a prisoner, but found favor to get out upon bail at certain times, and had the fairer occasion to commune with several persons of that set, who, by his converse, were brought to a better mind, though some relapsed and smarted for it as he had foretold them. The bulk of that separating people was filled with indignation and the keenest hatred against him, which they expressed by names and in way I love not to repeat: Many of these went to extravagant heights. As to the separating principles about hearing, etc. their native tendency to subvert all Church-communion, even in the purest times, was and is manifest to any who with judgment and without bias consider the matter. He took special notice on these occasions of that memorable and awful fence which the Lord Jesus was pleased to set about his servants whom He has sent forth to speak in his name, viz. ‘He that heareth you,’ says He, ‘heareth Me; and he that despiseth you, despiseth Me; and he that despiseth Me, despiseth Him that sent me,’ Lk. 10:11-16; Mk. 10:11-13, etc. The guilt inwrapped here reaches far. He judiciously remarked that ’tis no small matter at once to despise and reject God, Father, Son and Holy Ghost; and yet a rejecting these whom the Lord has sent imports so much, being upon the matter a tearing the commissions of Christ’s Ambassadors. I think it most observable, for confirmation of this remark, that the body of these separatists had, and expressed the greatest aversion from the most eminent and faithful ministers of Christ, who were not of their mind, whereas they could have been more easily persuaded to comport with others. All centers here, namely, a sameness of sentiment with them as to the extremes to which they declined, was made the necessary condition of Church-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-28a183f89f" data-kw="">
<blockquote><p>These differences were a sad trial and temptation to the Church, and occasioned many sad animosities and alienations in affection both amongst ministers and people, obstructed greatly the power of godliness and edification amongst all, and did beget much prejudice, envy and emulation, that many looked more at their own image in others than the image of God in them, and accordingly rejected them; which always falls in in differences amongst the godly. But after king Charles in the 1660 returned from his exile, then their eyes were opened to see the evil of division, etc.</p></blockquote>

<blockquote><p>Some more zealous than knowing and considerate did aggravate the acceptance of the indulgence to a great height, and ground of separation, and so wrought their enemies’ work for them better than they could do it for themselves: And so that division proved fatal at Bothwell, where they had a fair game, and opportunity to have defeated all their enemies, and brought prelacy down to the dust. It is observable there was this difference in the two appearances: Pentland had love, harmony and sympathy, wanting nothing but men and arms; Bothwell had both, and wanted harmony, but plagued with division.</p></blockquote>

</figure><figure class="quote" id="q-43526bfa17" data-kw="">
<blockquote><p>Be tender of the unity of the body, Eph. 4:3-4; 1 Cor. 12:25. Schisms, rents and divisions are like wounds, cuts and breaking of bones in the natural body, which exceedingly weakens it, and mars its beauty; they are the sin and judgment of a Church, bringing dishonor to the Lord Jesus, marring the success of the Gospel, and ruining the Church at length; they bring much grief to tender souls, and expose religion to the mocking of enemies. The renting of the body of Christ has so much of horror about it, as may make it frightful to serious members: We must separate from none further than they separate from Christ: We must not go in to sin with the members of the mystical body more than with the world, under the pain of the displeasure of the Head; but we may lawfully serve the Lord in his own ordinances with sinful members: Even as, when one foot is in the mire, the other must not go into the mire with it; yet there is no necessity of renting the one leg from the other, but the one must still walk with the other on clean ground.</p></blockquote>

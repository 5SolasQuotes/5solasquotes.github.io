<blockquote><p>It is a contradiction that an action-individual should be indifferent, and so neither good nor evil, and yet done in faith and referred to God’s glory: For the ground of doing, which is faith, and the end, which is God’s glory, are individual properties necessarily concurring to the individuation of the action-moral. 2. An action-individual that is merely indifferent, and so without sin, may be performed without sin or omitted without sin, cannot be an action of faith referred to God’s glory: For what may be done without sin and may not be done without sin, is a will-action, and wants all necessity of reason, and so is an idle and sinful action; but a sinful action may be done in fancy, but in faith it cannot be done; it may in the vain intention of the doer be referred to God’s glory, in intentione erronea operantis, but ex conditione operis, according to the nature of the work, it serves not for God’s glory. This way to cast stones in the water [for example], should be of faith, and referred to God’s glory: But shall I believe I am doing in faith and glorifying God when I am casting stones in the water, and I have as good reason not to cast at all? If one will-action that may be done, and may not be done, may be of faith and referred to God’s glory, then may they all be of faith and referred to God’s glory: This is a laughter, rather than divinity. 3. I cannot believe that an action that has as good reason to be omitted as to be done, can be acceptable to God, because I have no ground for my faith; for my faith here leans neither on Scripture nor on Reason; but there is no reason why the action should rather be, nor not be, because it is indifferent; yea, crossing and kneeling [as worship] of themselves shall be of faith, because I believe them to be of faith: But it is a vain thing to say that faith makes its object. 4. There are no actions in the world but they have all their moral necessity from their intrinsic goodness: For from whence is it necessary to love God, but from the intrinsic goodness that the love of God has from God’s command? For there is no necessity an action to be at all; yea, it is idle and superfluous if there be no goodness in it at all. If then crossing and kneeling (laying aside the respect of humane laws commanding them) have no necessity-moral from any commandment of God why they should be at all, their necessity must be all from man’s will: this is tyranny in rulers for their sole pleasure to command under the heaviest pain things that have no necessity at all but their will. 5. Neither is it any yoke to men’s conscience, to square all their moral-action by God’s Word and so to see (‘according as it is written’) before they venture upon any action-moral. It is liberty to keep God’s way accurately.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is a contradiction that an action-individual should be indifferent, and so neither good nor evil, and yet done in faith and referred to God’s glory: For the ground of doing, which is faith, and the end, which is God’s glory, are individual properties necessarily concurring to the individuation of the action-moral. 2. An action-individual that is merely indifferent, and so without sin, may be performed without sin or omitted without sin, cannot be an action of faith referred to God’s glory: For what may be done without sin and may not be done without sin, is a will-action, and wants all necessity of reason, and so is an idle and sinful action; but a sinful action may be done in fancy, but in faith it cannot be done; it may in the vain intention of the doer be referred to God’s glory, in intentione erronea operantis, but ex conditione operis, according to the nature of the work, it serves not for God’s glory. This way to cast stones in the water [for example], should be of faith, and referred to God’s glory: But shall I believe I am doing in faith and glorifying God when I am casting stones in the water, and I have as good reason not to cast at all? If one will-action that may be done, and may not be done, may be of faith and referred to God’s glory, then may they all be of faith and referred to God’s glory: This is a laughter, rather than divinity. 3. I cannot believe that an action that has as good reason to be omitted as to be done, can be acceptable to God, because I have no ground for my faith; for my faith here leans neither on Scripture nor on Reason; but there is no reason why the action should rather be, nor not be, because it is indifferent; yea, crossing and kneeling [as worship] of themselves shall be of faith, because I believe them to be of faith: But it is a vain thing to say that faith makes its object. 4. There are no actions in the world but they have all their moral necessity from their intrinsic goodness: For from whence is it necessary to love God, but from the intrinsic goodness that the love of God has from God’s command? For there is no necessity an action to be at all; yea, it is idle and superfluous if there be no goodness in it at all. If then crossing and kneeling (laying aside the respect of humane laws commanding them) have no necessity-moral from any commandment of God why they should be at all, their necessity must be all from man’s will: this is tyranny in rulers for their sole pleasure to command under the heaviest pain things that have no necessity at all but their will. 5. Neither is it any yoke to men’s conscience, to square all their moral-action by God’s Word and so to see (‘according as it is written’) before they venture upon any action-moral. It is liberty to keep God’s way accurately.”

— Samuel Rutherford, ‘An Introduction to the Doctrine of Scandal’ in The Divine Right of Church Government... (1646), p. 653">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+contradiction+that+an+action-individual+should+be+indifferent%2C+and+so+neither+good+nor+evil%2C+and+yet+done+in+faith+and+referred+to+God%E2%80%99s+glory%3A+For+the+ground+of+doing%2C+which+is+faith%2C+and+the+end%2C+which+is+God%E2%80%99s+glory%2C+are+individual+properties+necessarily+concurring+to+the+individuation+of+the+action-moral.+2.+An+action-individual+that+is+merely+indifferent%2C+and+so+without+sin%2C+may+be+performed+without+sin+or+omitted+without+sin%2C+cannot+be+an+action+of+faith+referred+to+God%E2%80%99s+glory%3A+For+what+may+be+done+without+sin+and+may+not+be+done+without+sin%2C+is+a+will-action%2C+and+wants+all+necessity+of+reason%2C+and+so+is+an+idle+and+sinful+action%3B+but+a+sinful+action+may+be+done+in+fancy%2C+but+in+faith+it+cannot+be+done%3B+it+may+in+the+vain+intention+of+the+doer+be+referred+to+God%E2%80%99s+glory%2C+in+intentione+erronea+operantis%2C+but+ex+conditione+operis%2C+according+to+the+nature+of+the+work%2C+it+serves+not+for+God%E2%80%99s+glory.+This+way+to+cast+stones+in+the+water+%5Bfor+example%5D%2C+should+be+of+faith%2C+and+referred+to+God%E2%80%99s+glory%3A+But+shall+I+believe+I+am+doing+in+faith+and+glorifying+God+when+I+am+casting+stones+in+the+water%2C+and+I+have+as+good+reason+not+to+cast+at+all%3F+If+one+will-action+that+may+be+done%2C+and+may+not+be+done%2C+may+be+of+faith+and+referred+to+God%E2%80%99s+glory%2C+then+may+they+all+be+of+faith+and+referred+to+God%E2%80%99s+glory%3A+This+is+a+laughter%2C+rather+than+divinity.+3.+I+cannot+believe+that+an+action+that+has+as+good+reason+to+be+omitted+as+to+be+done%2C+can+be+acceptable+to+God%2C+because+I+have+no+ground+for+my+faith%3B+for+my+faith+here+leans+neither+on+Scripture+nor+on+Reason%3B+but+there+is+no+reason+why+the+action+should+rather+be%2C+nor+not+be%2C+because+it+is+indifferent%3B+yea%2C+crossing+and+kneeling+%5Bas+worship%5D+of+themselves+shall+be+of+faith%2C+because+I+believe+them+to+be+of+faith%3A+But+it+is+a+vain+thing+to+say+that+faith+makes+its+object.+4.+There+are+no+actions+in+the+world+but+they+have+all+their+moral+necessity+from+their+intrinsic+goodness%3A+For+from+whence+is+it+necessary+to+love+God%2C+but+from+the+intrinsic+goodness+that+the+love+of+God+has+from+God%E2%80%99s+command%3F+For+there+is+no+necessity+an+action+to+be+at+all%3B+yea%2C+it+is+idle+and+superfluous+if+there+be+no+goodness+in+it+at+all.+If+then+crossing+and+kneeling+%28laying+aside+the+respect+of+humane+laws+commanding+them%29+have+no+necessity-moral+from+any+commandment+of+God+why+they+should+be+at+all%2C+their+necessity+must+be+all+from+man%E2%80%99s+will%3A+this+is+tyranny+in+rulers+for+their+sole+pleasure+to+command+under+the+heaviest+pain+things+that+have+no+necessity+at+all+but+their+will.+5.+Neither+is+it+any+yoke+to+men%E2%80%99s+conscience%2C+to+square+all+their+moral-action+by+God%E2%80%99s+Word+and+so+to+see+%28%E2%80%98according+as+it+is+written%E2%80%99%29+before+they+venture+upon+any+action-moral.+It+is+liberty+to+keep+God%E2%80%99s+way+accurately.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+%E2%80%98An+Introduction+to+the+Doctrine+of+Scandal%E2%80%99+in+The+Divine+Right+of+Church+Government...+%281646%29%2C+p.+653&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf17dd8e89.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/bf17dd8e89.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=It%20is%20a%20contradiction%20that%20an,liberty%20to%20keep%20God%E2%80%99s%20way%20accurately&amp;text=It%20is%20a%20contradiction%20that%20an%20action%2Dindividual%20should&amp;text=It%20is%20liberty%20to%20keep%20God%E2%80%99s%20way%20accurately" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26f04c7fb2" data-kw="">
<blockquote><p>Objection [of opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side, nor for the other, what rulers think good, is to be followed, there being no evil nor impiety in that which they command. Answer 1: This is to make rulers in matters of salvation liable to the Scriptures of God; but in matters which men call indifferent to make them Popes, and to hang our consciences upon their sleeve, which is most absurd: 1. Because Paul in matters most indifferent, of days and meats, would not have the Romans to hang upon his judgment, but will rule both their practice and his own by the Law of nature: ‘Murder not,’ ‘Scandalize not.’ 2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if in matters that they call of salvation, not thoughts, but the Word of God should rule and square canon-makers, but in matters indifferent, their thoughts should be a law. 3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is conventent in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters, which they call fundamental; yea, the Scripture shall be imperfect in the duties of the Second Table, if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), Appendix, Intro, ‘Whether or no things indifferent can be commanded because indifferent?’</cite>, p. 656</span></figcaption>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>

<blockquote><p>2. I have also proven in the first part of this Dispute, that an Ecclesiastical constitution cannot bind us nor take away our liberty in the using or not using of a thing indifferent in itself, except some other reason be showed us than the bare authority of the Church.</p></blockquote>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>

</figure><figure class="quote" id="q-544f7ad273" data-kw="">
<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

</figure><figure class="quote" id="q-56305cc00c" data-kw="">
<blockquote><p>All things and rites which have been notriously abused to idolatry, if they be not such as either God or nature has made to be of a necessary use, should be utterly abolished and purged away from divine worship, in such sort that they may not be accounted nor used by us as sacred things or rites pertaining to the same.</p></blockquote>

</figure><figure class="quote" id="q-8c1dedb343" data-kw="">
<blockquote><p>3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.”

— Thomas Hodges, The Creature’s Goodness, as they came out of God’s Hands, &amp; the good man’s mercy to the brute creatures, which God has put under his feet in Two Sermons (London, 1675), sermon 2, pp. 40-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Much+less+must+we+prefer+them+%5Banimals%5D+before+men%3A+We+must+not+be+cruel+to+men+pretending+to+show+mercy+to+the+brute+creatures.+The+life+of+a+beast+must+go+still+to+save+or+preserve+the+life+of+a+man.+I+cannot+but+condemn+the+Turks%2C+who+set+birds+at+liberty+out+of+their+cages%2C+redeeming+with+money+these+captives%2C+and+yet+make+no+conscience+of+chaining+Christians+to+their+galleys%3B+as+also+the+hypocrisy+%5Bof+those%5D+that+cheat+amongst+the+Romanists%2C+whose+clergy+are+forbid+to+hunt+beasts%2C+and+yet+some+made+Lords+Inquisitors+on+purpose+to+hunt+down%2C+tear+and+devour+the+harmless+sheep+and+lambs+of+Christ.+Surely+the+good%2C+the+great%2C+and+the+chief+Shepherd+of+the+flock+and+the+Bishop+of+our+souls+will+count+them+but+little+thanks+for+their+so+doing+when+He+shall+come+to+hold+his+general+Visitation+and+to+judge+the+world.+These+things+notwithstanding%2C+I+dare+not+condemn+those+%28if+necessitated+to+save+and+defend+their+own+lives%29+which+in+the+civil+wars+of+France+cut+off+their+horse-legs+and+so+made+themselves+a+breast-work+of+their+bodies.+Nor+dare+I+judge+king+David+for+houghing+his+enemies%E2%80%99+horses%2C+thereby+to+make+them+unserviceable+for+the+wars%2C+2+Sam.+8%3A4.+Let%E2%80%99s+not+be+superstitiously+afraid+to+use+these+creatures%2C+either+for+food%2C+physic+or+service%2C+no+nor+for+our+honest+delight+and+recreation.+See+your+charter+for+so+doing%2C+if+not+implicitly+given+to+Adam%2C+yet+expressly+to+Noah%3B+and+again+renewed%2C+Acts+10%2C+under+the+Gospel%2C+in+the+vision+and+voice+to+Peter%2C+%E2%80%98Arise+Peter%2C+kill%2C+and+eat.%E2%80%99+And+though+%E2%80%99tis+said+the+disciples+of+the+Nazarites+may+be+known+by+their+abstinence+from+the+flesh+of+all+living+creatures%2C+yet+our+Lord+Jesus+Christ+of+Nazareth%2C+and+He+that+in+substance+though+not+in+vow+and+ceremony+was+the+true+Nazarite%2C+gave+his+disciples+no+such+commandment.+Those+who+refuse+altogether+to+eat+the+flesh+of+living+creatures%2C+when+duly+killed%2C+deserve+the+name+of+Pythagoreans%2C+followers+of+Pythagoras+the+philosopher%2C+rather+than+to+be+called+Christians+or+disciples+of+Christ+our+Saviour.+So+then%2C+use+these+creatures+we+may%2C+we+must%2C+without+scruple+for+our+meat%3B+yea+and+we+may+use+these+creatures+for+our+work%2C+to+plow+and+harrow+the+ground%2C+and+to+carry+our+corn+into+the+barn%2C+and+for+any+other+necessary+use.+And+although+many+condemn+those+persons+who+promote+the+generation+of+mules+%5Bwhich+are+a+mix+of+species%5D%2C+so+does+Maimonides+in+his+More+Nev.+p.+3%2C+ch.+4+and+our+own+writers+on+Gen.+36%3A24%2C+yet+we+may+use+them+lawfully%3B+for+we+find+them+brought+to+Solomon%2C+1+Kings+10%3A25%3B+2+Chron.+9%3A24%2C+and+amongst+the+Israelites+at+their+return+from+captivity%2C+Ezra+2%3A66+and+Neh.+7%3A68.+And+we+nowhere+find+that+ever+they+were+commanded+to+put+these+away%2C+though+monsters+in+nature%2C+as+they+were+to+put+away+their+outlandish+wives.%E2%80%9D%0A%0A%E2%80%94+Thomas+Hodges%2C+The+Creature%E2%80%99s+Goodness%2C+as+they+came+out+of+God%E2%80%99s+Hands%2C+%26+the+good+man%E2%80%99s+mercy+to+the+brute+creatures%2C+which+God+has+put+under+his+feet+in+Two+Sermons+%28London%2C+1675%29%2C+sermon+2%2C+pp.+40-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c1dedb343.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8c1dedb343.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=3.%20Much%20less%20must%20we%20prefer,to%20put%20away%20their%20outlandish%20wives&amp;text=3.%20Much%20less%20must%20we%20prefer%20them%20%5Banimals&amp;text=they%20were%20to%20put%20away%20their%20outlandish%20wives" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively. 8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object. 9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light. 10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary. 11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected. 12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them. 13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church. 14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true. 15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

</figure><figure class="quote" id="q-0bc8c102ca" data-kw="">
<blockquote><p>I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-ab6f29151c" data-kw="">
<blockquote><p>But I hope the parliament will observe this great principle you were first acted by, and still are in all your Church-way, and will see how dangerous the tolerating of your way will be; for though you should for present hold nothing much different from the established rule, yet being allowed what may you not come to; according to this principle, how shall any State be sure of you long what you will hold: What if you should bring in community of goods, baptizing in rivers, the holy kiss into your assemblies at the beginning and ending of your ordinances, anointing sick persons with oil? It is but according to your principle: And we see you make so much of this principle and are so in love with it, that you wish it next to your first principle, enacted as the most sacred Law of all other[s], to live and walk by it in Christian States and Churches throughout the world;</p></blockquote>

</figure><figure class="quote" id="q-fde2d15b26" data-kw="">
<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/explication.html">Explication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mention is made in the Scriptures of sundry things practiced by the Lord Christ and his Apostles, which being then in common use amongst men, were occasionally made by them symbolical instructions in moral duties. Such were washing of feet by one another, the holy kiss, and the like; but there being no more in them, but a sanctified use directed unto the present civil customs and usages, the commands given concerning them, respect not the outward action, nor appointed any continuance of them, being peculiarly suited unto the state of things and persons in those countries; as John 13:12-15</cite></span></figcaption>

<blockquote><p>As for your [Gilbert Burnet’s] demand, why in your worship [that of the Scottish non-cponformists] do you not kiss one another with a holy kiss? Seing it is nowhere commanded in worship, as you seem boldly and ignorantly to suppose, and the Christian manner of the thing, in customary civility, is only recommended by the apostle, as an allay of chastity and kindnesse in civil rencounters, the question is but a petulant extravagancy of your vain imagination.</p></blockquote>

<blockquote><p>6. Wherefore concerning this use, it was only of those times: referendum est ad illius temporis morem, ‘it must be referred to the manner of those times’, Beza: it is not necessary either to retain it or any other outward ceremony or usage instead of it: St. Paul exacts not the outward gesture, but the inward affection, and so as Clemens Alexandria says well, dilectio non sensetur in osculo, sed in benevolentia, ‘love is not measured by the kiss, but by the goodwill.&#x27;</p></blockquote>

<blockquote><p>I respond: It was a common rite, in species and form, from custom or practice then and there received; it was accustomed to be used as a sign of love, friendship, familiarity, even of subjection, etc. On this rite: the Philology &amp; Antiquary of [John de] Pineda [1558–1637, a Jesuit] on Job 31:27 has informed. Out of theologians other than Pineda: Aretius, pt. 3, [Jean de] Lorinus [1559-1634, a Jesuit] and [Andrew] Rivet on Ps. 2; and Lorinus in the same has cited Joseph Stephanus in the Tractate on Kissing the Feet of the Pontiff.”, p. 466 Gyongyosi, Paul – Kisses of Love &amp; Hate, on Song 1:2 &amp; 6:3 &amp; Prov. 27:6; a Dissertation on the Holy Kiss (Rom. 16:17) &amp; its Opposite, the Kiss of Jude (Lk. 22:48) &amp; of the Mysteries of them Illustrated by the Sacred Scriptures, by Christ the Lord of Love, Grace &amp; Eternal Wrath… (Frankfurt, 1738) 18 pp. Gyongyosi (1668-1743) was a German reformed professor of theology at Frankfurt, Germany. . Lutheran Willemer, Johann Helvicus – Out of the Words of Ps. 2:12, ‘Kiss the Son’, Against Some of the Borne Distortions of the Jews (Wittenburg, 1704) 35 pp. Mayer, Johann Friedrich – A Tract on Kissing the Feet of the Roman Pointiff 2nd ed. (Leipzig, 1714) Mayer (1650-1712) was a German, Lutheran professor of theology at Wittenberg, Kiel and Greifswald. . . On Foot Washing &amp; Shaking the Dust Off of One’s Feet Bible Verses Dust of the Feet Isa. 49:23 “And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet;</p></blockquote>

<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>

<blockquote><p>This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top.</p></blockquote>

<blockquote><p>His [Christ’s] non-sitting and washing their feet, being a moral, not a sacramental, teaching them humility… Christ teaches lessons of humility, not to learn us not to seek the spiritual honor of communion with Christ, that were to teach us to be proud…</p></blockquote>

<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 117-19</span></figcaption>

<blockquote><p>There is no cause why any man should deny this epistle, as maintaining the popish sacrament of extreme unction, for that it does not, but speaks of the use of the gift of healing which was in the primitive church in the elders of the congregation, expressed by the outward sign of anointing with oil, as it is manifest, Mk. 6:13. Whereof, as Bede thinks, came the custom of anointing them that were possessed with devils, and the sick with oil, which he confesses might be done not only of the priests, but also of every Christian in their necessity, as Innocent teaches. Therefore, although he allow the ceremony, yet he allows not your sacrament, which may be ministered by none but by a priest, and unto none, but them that be in extremity of sickness, when health is despaired: yea, Bede understands it to pertain not only to them that are sick in body, but also to them that are weak in faith, though they be whole in body. “Commanding,” says he, “him that is weak in body, or in faith, that he which has sustained a greater wound, should remember to cure himself with the aid of more men, and them of the elder sort, neither should refer the cause of his weakness to the younger sort, and less learned, lest he receive by them, any hurtful speech or counsel.” You see therefore, that even the custom and use of the ceremony is greatly changed from the days of Bede, which is but seven or eight hundred years ago. For in the popish church one priest is sufficient, young or old, who comes not to give any ghostly counsel, but commonly when a man is past his senses. It is certain therefore, that in Bede’s time, this anointing was not taken for a sacrament. But you say, what dishonor is it to God that a sacrament should be instituted in oil more than in water, etc. Verily if God had instituted any such perpetual sacrament in oil, as He does in water, we would nothing doubt of it. But this sign of anointing was temporal, as the gift of healing whereunto it was annexed was but for a season, and that does this Scripture tell us sufficiently, seeing experience testifies that the gift of healing does not now remain. Where you say the church of God has always used it, it is false: for the Greek church never received it to this day as a sacrament, and for many hundred years it was counted a free ceremony in the Latin church, as appears by the epistle of Innocent and that which Bede writes, that it was lawful for all Christians to use it. But when we say it pertained to the gift of healing, you ask, “whether Christ appointed any certain creature or external element unto the apostles generally to work miracles by.” I answer no: for with external sign and without, they did miracles. Yet it appears, Mk. 6:13, that He appointed them to anoint the sick with oil that they might recover health, though it were not necessary so to do at all times, when they healed the sick. Where you say, “that Christ would have miracles in the beginning wrought by sundry sacraments which remain, the miracles ceasing,” we find no such matter, which it were so, the institution and commandment of the perpetuity of them were sufficient for their continuance. You demand, “whether ever we read or heard that men were generally commanded to seek for their health by miraculous means?” We read that men were commanded generally to seek all spiritual and miraculous gilts, as long at God gave them, and not health only, but the gift of healing also, 1 Cor. 12:31; ch. 14:1, under the general rule of submitting all our requests and whole will to God’s will. You demand, whether all priests or elders had the gift of miracles in the primitive church. We answer, it is not necessary that every one had the gift of healing, yet among the company of elders that were in every church, some doubtless had when others had which were not elders of the church. Or the gift might be given to the whole number, which every one had not, as Paul speaks of the gift of prophecy, given by laying on of the hands of the elders, 1 Tim. 4:14. Neither would the apostle promise health, if the gift of healing had not been general in every congregation. But though the apostles had the gift to cure men and revive them, yet there was no such general precept to call for the apostles, to heal men or restore them: so long as that gift continued in the church, it was all men’s duty to seek the use of it, so far as it would stand with God’s pleasure. Therefore as Paul sets down an order for the right use of the gifts of tongues, 1 Cor. 14:27, so does James here for the gift of healing. You ask if any external element, or miraculous practice unless it were a sacrament, had promise of the remission of all kind of actual sins joined to it? But neither has the element of oil any such promise annexed unto it, but the prayers of the faithful, as 1 John 5:6. You ask whether James could institute such a ceremony of himself? etc. We say he did not institute any such ceremony as you speak of, nor mentions any such, but wills the gift of healing, to be used according as God had appointed. As for the promise of remission of sins, he annexes it not to the element, but out of the general doctrine of prayer, he shows the fruit thereof to be the obtaining of remission of sins. But at “other times,” you say, “we rail at the popish church, for annexing of remission of sins, to the element of water. Here we are driven to hold that James prescribed a miraculous oil, which had much more power and efficacy.” Concerning your popish holy water, although it be conjured to be health of body and soul, which includes not only venial but all sins: yet even your doctrine of venial sins is intolerable. For who gave you authority to annex any remission of sins to that or any other creature? But that you say, we are driven to hold, is false, for we hold no such thing, either that James of his own authority prescribed a miraculous oil, or that any such power or efficacy to remit sins, was in the oil, or annexed to it. Therefore you are driven to the straits, that without shame feign a sacrament of a ceremony used only for health of body, and are bold to slander the universal church of Christ, with such a practice as never was received in the church of Christ, for a sacrament. How the ceremony was used in Bede’s time I have showed before. The testimony of Innocent and De visitat. infirm. I have answered before, Gal. 4, sect. 2. Bernard writes no more but that Malachi was anointed according to the ceremony used in his time. The other councils that follow, being of later years, are according to the epistle of Innocent. Who because, he says, that this anointing may be used, not only of the priests, but also of all Christians, you are driven to a poor shift, in saying they used it not in that sacramental sort which the apostle prescribes; but Innocent says plainly they might use it lawfully, without any distinction of sacramental sort, as his words are manifest, which with small learning, may easily be understood. But where you say, “they use it as Christians do now the water of baptism, to take it home with them after it was hallowed, and to give it to their diseased to drink,” no doubt it was a vile superstitious abusing of the sacrament of baptism, as there have been many by conjurers and idolaters, but never used of well instructed Christians.</p></blockquote>

— William Fulke, Confutation of the Rhemish Testament (d. 1589; NY: Leavitt, 1834), p. 361, on James 5:14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+no+cause+why+any+man+should+deny+this+epistle%2C+as+maintaining+the+popish+sacrament+of+extreme+unction%2C+for+that+it+does+not%2C+but+speaks+of+the+use+of+the+gift+of+healing+which+was+in+the+primitive+church+in+the+elders+of+the+congregation%2C+expressed+by+the+outward+sign+of+anointing+with+oil%2C+as+it+is+manifest%2C+Mk.+6%3A13.+Whereof%2C+as+Bede+thinks%2C+came+the+custom+of+anointing+them+that+were+possessed+with+devils%2C+and+the+sick+with+oil%2C+which+he+confesses+might+be+done+not+only+of+the+priests%2C+but+also+of+every+Christian+in+their+necessity%2C+as+Innocent+teaches.+Therefore%2C+although+he+allow+the+ceremony%2C+yet+he+allows+not+your+sacrament%2C+which+may+be+ministered+by+none+but+by+a+priest%2C+and+unto+none%2C+but+them+that+be+in+extremity+of+sickness%2C+when+health+is+despaired%3A+yea%2C+Bede+understands+it+to+pertain+not+only+to+them+that+are+sick+in+body%2C+but+also+to+them+that+are+weak+in+faith%2C+though+they+be+whole+in+body.+%E2%80%9CCommanding%2C%E2%80%9D+says+he%2C+%E2%80%9Chim+that+is+weak+in+body%2C+or+in+faith%2C+that+he+which+has+sustained+a+greater+wound%2C+should+remember+to+cure+himself+with+the+aid+of+more+men%2C+and+them+of+the+elder+sort%2C+neither+should+refer+the+cause+of+his+weakness+to+the+younger+sort%2C+and+less+learned%2C+lest+he+receive+by+them%2C+any+hurtful+speech+or+counsel.%E2%80%9D+You+see+therefore%2C+that+even+the+custom+and+use+of+the+ceremony+is+greatly+changed+from+the+days+of+Bede%2C+which+is+but+seven+or+eight+hundred+years+ago.+For+in+the+popish+church+one+priest+is+sufficient%2C+young+or+old%2C+who+comes+not+to+give+any+ghostly+counsel%2C+but+commonly+when+a+man+is+past+his+senses.+It+is+certain+therefore%2C+that+in+Bede%E2%80%99s+time%2C+this+anointing+was+not+taken+for+a+sacrament.+But+you+say%2C+what+dishonor+is+it ther+all+priests+or+elders+had+the+gift+of+miracles+in+the+primitive+church.+We+answer%2C+it+is+not+necessary+that+every+one+had+the+gift+of+healing%2C+yet+among+the+company+of+elders+that+were+in+every+church%2C+some+doubtless+had+when+others+had+which+were+not+elders+of+the+church.+Or+the+gift+might+be+given+to+the+whole+number%2C+which+every+one+had+not%2C+as+Paul+speaks+of+the+gift+of+prophecy%2C+given+by+laying+on+of+the+hands+of+the+elders%2C+1+Tim.+4%3A14.+Neither+would+the+apostle+promise+health%2C+if+the+gift+of+healing+had+not+been+general+in+every+congregation.+But+though+the+apostles+had+the+gift+to+cure+men+and+revive+them%2C+yet+there+was+no+such+general+precept+to+call+for+the+apostles%2C+to+heal+men+or+restore+them%3A+so+long+as+that+gift+continued+in+the+church%2C+it+was+all+men%E2%80%99s+duty+to+seek+the+use+of+it%2C+so+far+as+it+would+stand+with+God%E2%80%99s+pleasure.+Therefore+as+Paul+sets+down+an+order+for+the+right+use+of+the+gifts+of+tongues%2C+1+Cor.+14%3A27%2C+so+does+James+here+for+the+gift+of+healing.+You+ask+if+any+external+element%2C+or+miraculous+practice+unless+it+were+a+sacrament%2C+had+promise+of+the+remission+of+all+kind+of+actual+sins+joined+to+it%3F+But+neither+has+the+element+of+oil+any+such+promise+annexed+unto+it%2C+but+the+prayers+of+the+faithful%2C+as+1+John+5%3A6.+You+ask+whether+James+could+institute+such+a+ceremony+of+himself%3F+etc.+We+say+he+did+not+institute+any+such+ceremony+as+you+speak+of%2C+nor+mentions+any+such%2C+but+wills+the+gift+of+healing%2C+to+be+used+according+as+God+had+appointed.+As+for+the+promise+of+remission+of+sins%2C+he+annexes+it+not+to+the+element%2C+but+out+of+the+general+doctrine+of+prayer%2C+he+shows+the+fruit+thereof+to+be+the+obtaining+of+remission+of+sins.+But+at+%E2%80%9Cother+times%2C%E2%80%9D+you+say%2C+%E2%80%9Cwe+rail+at+the+popish+church%2C+for+annexing+of+remission+of+sins%2C+to+the+element+of+water.+Here+we+are+driven+to+hold+that+James+prescribed+a+miraculous+oil%2C+which+had+much+more+power+and+efficacy.%E2%80%9D+Concerning+your+popish+holy+water%2C+although+it+be+conjured+to+be+health+of+body+and+soul%2C+which+includes+not+only+venial+but+all+sins%3A+yet+even+your+doctrine+of+venial+sins+is+intolerable.+For+who+gave+you+authority+to+annex+any+remission+of+sins+to+that+or+any+other+creature%3F+But+that+you+say%2C+we+are+driven+to+hold%2C+is+false%2C+for+we+hold+no+such+thing%2C+either+that+James+of+his+own+authority+prescribed+a+miraculous+oil%2C+or+that+any+such+power+or+efficacy+to+remit+sins%2C+was+in+the+oil%2C+or+annexed+to+it.+Therefore+you+are+driven+to+the+straits%2C+that+without+shame+feign+a+sacrament+of+a+ceremony+used+only+for+health+of+body%2C+and+are+bold+to+slander+the+universal+church+of+Christ%2C+with+such+a+practice+as+never+was+received+in+the+church+of+Christ%2C+for+a+sacrament.+How+the+ceremony+was+used+in+Bede%E2%80%99s+time+I+have+showed+before.+The+testimony+of+Innocent+and+De+visitat.+infirm.+I+have+answered+before%2C+Gal.+4%2C+sect.+2.+Bernard+writes+no+more+but+that+Malachi+was+anointed+according+to+the+ceremony+used+in+his+time.+The+other+councils+that+follow%2C+being+of+later+years%2C+are+according+to+the+epistle+of+Innocent.+Who+because%2C+he+says%2C+that+this+anointing+may+be+used%2C+not+only+of+the+priests%2C+but+also+of+all+Christians%2C+you+are+driven+to+a+poor+shift%2C+in+saying+they+used+it+not+in+that+sacramental+sort+which+the+apostle+prescribes%3B+but+Innocent+says+plainly+they+might+use+it+lawfully%2C+without+any+distinction+of+sacramental+sort%2C+as+his+words+are+manifest%2C+which+with+small+learning%2C+may+easily+be+understood.+But+where+you+say%2C+%E2%80%9Cthey+use+it+as+Christians+do+now+the+water+of+baptism%2C+to+take+it+home+with+them+after+it+was+hallowed%2C+and+to+give+it+to+their+diseased+to+drink%2C%E2%80%9D+no+doubt+it+was+a+vile+superstitious+abusing+of+the+sacrament+of+baptism%2C+as+there+have+been+many+by+conjurers+and+idolaters%2C+but+never+used+of+well+instructed+Christians.%E2%80%9D%0A%0A%E2%80%94+William+Fulke%2C+Confutation+of+the+Rhemish+Testament+%28d.+1589%3B+NY%3A+Leavitt%2C+1834%29%2C+p.+361%2C+on+James+5%3A14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7b6c67296.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a7b6c67296.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=There%20is%20no%20cause%20why%20any,never%20used%20of%20well%20instructed%20Christians&amp;text=There%20is%20no%20cause%20why%20any%20man%20should&amp;text=idolaters%2C%20but%20never%20used%20of%20well%20instructed%20Christians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Anointing the sick with oil was held in that [flagship Independent] Church of Arnheim [Netherlands], as a standing ordinance for church members, (for others [of other churches] had no right to that ordinance), as laying on of hands was a standing ordinance for church officers: There was a writing amongst them in many hands, proving it to be so, and there were some cases propounded, with what oil the sick members of the Church were to be anointed, and there was a resolution of the case, namely with olive oil. A copy of this writing some ministers of the [Westminster] Assembly have perused, and one of them has it amongst his papers in the country. [Thomas] Mr. Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it (they say).</p></blockquote>

</figure><figure class="quote" id="q-ebc7ade868" data-kw="">
<blockquote><p>Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 117-19</span></figcaption>

+having+made+your+non-conformist+say+that+the+apostle+promises+recovery+upon+the+anointing%2C+you+turn+to+fight+with+your+own+shadow%2C+and+tell+him+there+is+no+such+matter%2C+that+the+recovery+is+promised+to+prayer%2C+and+also+forgiveness%3B+and+seing+we+pray+by+all+for+their+raising+up%2C+and+that+they+may+be+forgiven%2C+why+do+we+not+as+well+anoint%3F+But%2C+what+logic+can+make+out+this+consequence+inasmuch+as+anointing%2C+being+there+only+spoken+of+as+the+concomitant+rite+used+in+the+application+of+the+gift+of+healing%2C+it+is+manifest+that+without+the+existence+and+exercise+of+the+gift+itself%2C+it+is+not+now+to+be+repeated%3B+and+therefore+though+prayer+be+principally+commanded+as+the+special+mean%2C+by+which+even+the+gift+of+miracles+was+actuate%5Bd%5D+and+made+effectual%2C+and+to+this+day+does+remain+as+the+great+one+by+which+all+the+promises+either+for+raising+up+or+remission+are+drawn+out+unto+effect%3B+yet+thence+to+infer+that+anointing%2C+a+peculiar+solemnity+in+the+gift+of+healing%2C+should+still+continue%2C+notwitstanding+the+gift+itself+be+ceased%2C+is+very+absurd%3A+Now%2C+that+anointing+was+an+ordinary+observance+in+the+exercise+of+the+gift+of+healing%2C+you+may+read+it+clearly+in+the+disciples%E2%80%99+practice%2C+Mk.+6%3A13.+And+they+anointed+with+oil+many+that+were+sick+and+healed+them.+This+being+then+the+just+and+true+account%2C+not+only+of+our+practice%2C+but+also+of+that+of+the+whole+reformed+Churches%2C+how+vain+and+ridiculous+are+you+to+tell+us%2C+that+our+pretence+of+Scripture+is+but+to+impose+on+women+and+simple+people%2C+and+all+our+persuasion%2C+grave+nods+and+big+words%3A+but+leaving+you+to+puff+petulantly+where+you+can+prove+nothing.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%E2%80%A6+%281671%29%2C+3rd+Dialogue%2C+pp.+117-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Febc7ade868.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ebc7ade868.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=Next%20you%20%5BGilbert%20Burnet%5D%20inquire%2C%20Why,petulantly%20where%20you%20can%20prove%20nothing&amp;text=Next%20you%20%5BGilbert%20Burnet%5D%20inquire%2C%20Why%20do%20you&amp;text=to%20puff%20petulantly%20where%20you%20can%20prove%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e7983f8bfd" data-kw="">
<blockquote><p>Besides, there were in the first churches continued for a while certain extraordinary gifts, that had their effects visibly on the outward senses of men, and tended not immediately unto the edification of the church in their faith, but unto the conviction of others, and vindication of the authority of them by whom the gospel was preached and propagated. Such was that gift of healing the sick, which being an especial effect of the Holy-Ghost for the advantage of the Church in those days, in some places it was accompanied by anointing with oil; but this being no universal practice, and used only in the exercise of a gift extraordinary, whose use and being are long since ceased, it never was appointed nor intended to be of continuance in the Church, which is not tied by the Lord Christ to the empty signs and shadows of things whose substance is not enjoyed: besides, no spiritual grace of the Covenant was ever intimated, sealed, or exhibited by that usage of anointing with oil. The first mention of it is, Mark 6:13 where its practice is reckoned among the effects of that extraordinary power which the Lord Christ committed unto his twelve disciples on their first sending out, and is referred unto the same series of miracles which they wrought in pursuit, and by virtue thereof, they cast out many devils, and anointed with oil many that were sick, and healed them. And by what is there recorded, the subsequent mention of it, James 5:14 is to be regulated, but now unto a real evangelical institution of worship, it is required: (1.) That it be a command of Christ manifested by his Word, or example proposed unto our imitation, Mt. 28:20. (2.) That it be given and enjoined unto the whole Church with the limitation of its administration expressed in the Word, 1 Cor. 11:25. (3.) That unto the due performance of it, Gospel grace be required in them that attend unto it. (4.) That it teach, or represent, or seal, or improve some grace of the Covenant, and have a promise of acceptation annexed unto it, and whatever is thus appointed, the Church is indispensably to continue in the observation of, unto the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Short Catechism on Worship: Dr. Owen’s Instruction in the Worship of God, by Way of Question and Answer; with an Explication and Confirmation of those Answers’, Question #13 1667 For the fuller context, see Owen above on the holy kiss, which section immediately precedes this section.</cite></span></figcaption>

<blockquote><p>They [congregationalists] count it necessary that all the church officers should live upon the charge of the congregation, the ruling elders and deacons as well as the pastors and doctors; but all they will have them to receive, is a mere alms, a voluntary contribution, laid down as an offering at the deacons’ feet every Lords Day, and by him distributed to all the officers and the poor of the congregation according as they have need. This is their doctrine, but it seems they are weary long ago of its practice.</p></blockquote>

<blockquote><p>23rd Question. After the ministry of the Word and the seals thereof, how is the collection for the saints to be administered? Answer. The collection for the saints was by the apostles’ ordinance, to be made: for the time, every Lord’s Day; for the measure, as God has prospered every man; for the manner, not of constraint, but freely and willingly, brought by the givers as an offering to the Lord, and laid down, as at first before the apostles, so afterwards by their appointment before the deacons of the Church as into a common treasury, by them to be distributed to the supply of the ministry, and of the poor saints, according to their need, and of outward service of the Church.</p></blockquote>

<blockquote><p>Question. After the ministry of the Word and the seals, how is the freewill-offering, or collection for the saints, to be administered? Answer: 1. For the time, it is to be made every Lord’s Day, which is the first day of the week. 2. For the measure, as God hath prospered every man. 3 For the manner; not of constraint, but freely, and to be presented, as an offering to the Lord, and laid down, as at first before the apostles, so afterward, by their appointment, before the deacons of church, as into a common treasury.</p></blockquote>

</figure><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church: 1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’ 2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>

<blockquote><p>That which no law of God or valid law of man forbids, is not unlawful: but the use of the things forementioned, no law of God or valid law of man forbids: Therefore the use of the things forementioned, is not unlawful. He that will say that there is any such law must show that law and prove his affirmative: But let him take heed of adding to God’s law: A false prophet that fathered a false message from God was an heinous sinner. Is it not worse falsely to father a law on Him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 10</span></figcaption>

</figure><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</cite></span></figcaption>

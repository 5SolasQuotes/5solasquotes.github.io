</figure><figure class="quote" id="q-ef42a8d959" data-kw="">
<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom (Edinburgh: Tyler, 1662)</cite>, p. 9</span></figcaption>

<blockquote><p>That which I first meet withal directly unto this purpose is, part 2, p. 157, the forbearance of communion with the Church of England in its parochial assemblies (that is in the way and manner before described) he opposes with two arguments. The first respects those who allow occasional communion with parochial churches but will not comply with them in that which is constant and absolute. For he says, if the first be lawful, the latter is necessary from the commands we have to preserve the peace and unity of the Church. And the not doing it, he says, is one of the provoking sins of the non-conformists; but whether it be a sin or no is sub Judice [under judgment]; that it is provoking unto some is sufficiently evident. I shall not make this any part of my contest… And it will be hard to prove that on a concession of the lawfulness of communion in some acts of divine worship, it will be necessary for men to oblige themselves unto total constant communion, with a renunciation and condemnation of all other ways and means of joint edification. It may also be lawful to do a thing with some respects and limitations, at some times, which it, may not be lawful to do absolutely and always. It may be necessary from outward circumstances to do that sometimes which is lawful in itself, though not necessary from itself; it can never be necessary to do that which is unlawful. Of the first sort they esteem occasional communion, and the other of the latter. Some time is spent [by the opponent] in taking off an exception unto this inference from the practise of our Saviour, who had occasional communion with the Jews in the Temple and ynagogues, which he proves to have been constant and perpetual, and not occasional only, and that He prescribed the same practise unto his disciples. But I think this labour might have been spared. For there is nothing more clear and certain than that our Lord Jesus Christ did join with the Jews in the observance of God’s institutions among them, on the one hand; and on the other, that he never joined with them in the observance of their own traditions and Pharasaical impositions, but warned all his disciples to avoid them and refuse them [Mt. 15], whose example we desire to follow; for concerning all such observances in the Church, he pronounced that sentence, ‘Every plant that my Heavenly Father has not planted shall be rooted up.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That which I first meet withal directly unto this purpose is, part 2, p. 157, the forbearance of communion with the Church of England in its parochial assemblies (that is in the way and manner before described) he opposes with two arguments. The first respects those who allow occasional communion with parochial churches but will not comply with them in that which is constant and absolute. For he says, if the first be lawful, the latter is necessary from the commands we have to preserve the peace and unity of the Church. And the not doing it, he says, is one of the provoking sins of the non-conformists; but whether it be a sin or no is sub Judice [under judgment]; that it is provoking unto some is sufficiently evident. I shall not make this any part of my contest… And it will be hard to prove that on a concession of the lawfulness of communion in some acts of divine worship, it will be necessary for men to oblige themselves unto total constant communion, with a renunciation and condemnation of all other ways and means of joint edification. It may also be lawful to do a thing with some respects and limitations, at some times, which it, may not be lawful to do absolutely and always. It may be necessary from outward circumstances to do that sometimes which is lawful in itself, though not necessary from itself; it can never be necessary to do that which is unlawful. Of the first sort they esteem occasional communion, and the other of the latter. Some time is spent [by the opponent] in taking off an exception unto this inference from the practise of our Saviour, who had occasional communion with the Jews in the Temple and ynagogues, which he proves to have been constant and perpetual, and not occasional only, and that He prescribed the same practise unto his disciples. But I think this labour might have been spared. For there is nothing more clear and certain than that our Lord Jesus Christ did join with the Jews in the observance of God’s institutions among them, on the one hand; and on the other, that he never joined with them in the observance of their own traditions and Pharasaical impositions, but warned all his disciples to avoid them and refuse them [Mt. 15], whose example we desire to follow; for concerning all such observances in the Church, he pronounced that sentence, ‘Every plant that my Heavenly Father has not planted shall be rooted up.&#x27;”

ual%2C+and+not+occasional+only%2C+and+that+He+prescribed+the+same+practise+unto+his+disciples.+But+I+think+this+labour+might+have+been+spared.+For+there+is+nothing+more+clear+and+certain+than+that+our+Lord+Jesus+Christ+did+join+with+the+Jews+in+the+observance+of+God%E2%80%99s+institutions+among+them%2C+on+the+one+hand%3B+and+on+the+other%2C+that+he+never+joined+with+them+in+the+observance+of+their+own+traditions+and+Pharasaical+impositions%2C+but+warned+all+his+disciples+to+avoid+them+and+refuse+them+%5BMt.+15%5D%2C+whose+example+we+desire+to+follow%3B+for+concerning+all+such+observances+in+the+Church%2C+he+pronounced+that+sentence%2C+%E2%80%98Every+plant+that+my+Heavenly+Father+has+not+planted+shall+be+rooted+up.%27%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Enquiry+into+the+Original%2C+Nature%2C+Institution%2C+Power%2C+Order+%26+Communion+of+Evangelical+Churches+%28London%2C+1681%29%2C+polemic%2C+section%2C+pp.+252-53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67fe2bc755.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/67fe2bc755.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-occasional-partial-conformity-or-moderate-puritanism/#:~:text=That%20which%20I%20first%20meet%20withal,not%20planted%20shall%20be%20rooted%20up&amp;text=That%20which%20I%20first%20meet%20withal%20directly%20unto&amp;text=Father%20has%20not%20planted%20shall%20be%20rooted%20up" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer: 1. We desire each church may have a presbytery, and then we are agreed. 2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice? 3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?</p></blockquote>

<blockquote><p>…judge now whether all the ill effects have come from one extreme [side of the parties, and not the other]. The truth is, having impartially observed the mischiefs of the age in which I have lived, I have found that both the extremes have been the chief causes and the peacemakers both the most understanding and the most innocent; and the nearer any of the several parties have come to them, the more innocent they have been. It is not mere episcopacy or liturgies that have done the mischief, for such excellent men as Cranmer, Ridley, Hooper, Farrar, Parker, Jewel, Grindal, Davenant, Ussher, etc. could use both profitably. It’s not mere presbytery, for such as Calvin, Beza, Daneau, Sadeel, Rivet, Chamier, Daille, Blondel have been excellent lights in the Church. It is not mere Independency, for Ramus, Ames, Henry Jacob, Jeremiah Burroughs and many others of that mind have been excellent, peaceable men. It is not mere Anabaptistry [baptists], for there have been many peaceable worthy men against infant baptism (and some bishops thought it not of divine institution); and when they were rebaptized, continued in love and communion with others. But it is proud ignorance and lack of Christian love causing excommunicating, persecuting, Separation or schism in some, and withdrawing censorious Separation in others, who (neither party) understand the truth nor ever loved their neighbors as themselves, nor learned to do as they would be done by. The worldly PR. IGs.¹ and the unruly PR. IGs. by persecution and by causeless Separation and alienation have done the hurt. ¹ [This may likely mean “Proud Ignorants”, as a contemporary critic of Baxter, who was unsure, so inferred… This is confirmed by Baxter’s anti-party spirit and morally adjudged perspective in the immediate context. Another option is “Presbyterians and Independents” as “G” may stand for “Gatherers”, as Independents were sometimes called; yet much of the persecution was done by bishops, prelates and Formalists, as Baxter notes, so this alternative seems less likely. Baxter though may have meant both, or left his meaning ambiguous so as not to be able to be blamed for it by the named parties (note that he was reckoned an Independent by some, though he called himself a presbyterian at times). It is not to be missed that the abbreviations spell “prigs”, which word was current in that era with its current meaning.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, pp. 59-60</span></figcaption>

<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all or most Churches, and so on the catholic Church, yet it properly respected neighbour Churches, either, which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered; acquainting one another with their affairs, so far as it was of any advantage: admitting the members of other Churches to communion with them, on occasion, refusing communion with such members of other Churches as were by them excommunicated. And this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shunned by them who so joined in another Church, or denied to such sojourners if they desired it: or, when one Church showed rage, fury and bitterness against another because of what they differed about [though it was non-fundamental].</p></blockquote>

<blockquote><p>It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially and to our edification joined with them, and yet partake in none of these: nor is [there] so much of these [human ceremonies] among them as he would make us believe.</p></blockquote>

<blockquote><p>I. I was born and bred of parents piously affected, but of no such knowledge or acquaintance as might engage them in any controversies, or disaffect them to the present government of the Church, or cause them to scruple conformity to its doctrine, worship or discipline: In this way I was bred myself, but taught by my parents and God Himself to make conscience of sin and to fear God, and to discern between the godly and the notoriously wicked: For which my parents and I were commonly derided as puritans, the spirit of the vulgar being commonly then fired with hatred and scorn of serious godliness, and using that name as their instrument of reproach, which was first forged against the nonconformists only; And the clergy where I lived, being mostly only readers of the liturgy, and some others that rather countenanced than reproved this course, I soon confined my reverence to a very few among them that were learned and godly (but conformists), and for going out of my parish to hear them, my reproach increased: About eighteen or nineteen years of age I fell acquainted with some persons, half conformists and half nonconformists, who for fear of severities against private meetings, met with great secresy only to repeat the public sermons, and pray, and by pious conference edify each other. Their spirits and practice was so savoury to me, that it kindled in me a distaste of the prelates as persecutors, who troubled and ruined such persons, while ignorant drunkards and worldlings were tolerated in so many churches, yea, and countenanced for crying down such persons, and crying up bishops, liturgie and conformity: Before I was aware, my affections began to solicit my understanding to judge of the things and causes by the persons (where the difference was very great). But yet my first teachers kept my judgement for conformity as lawful, though not desirable had we liberty, till I was ordained. But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgy and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640, the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacie (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was that I settled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government. My genius was inquisitive, and earnestly desirous to know the truth: my helps for piety were greater than my helps for learning, of which I had not much besides books: sickness helped my seriousness, keeping me still in expectation of death. All my reverenced acquaintances (save one) cried down Arminianism as the Pelagian heresy, and the enemy of grace: I quickly plunged myself into the study of Dr. [William] Twisse and [William] Amesius, and [John] Camero, and [William] Pemble, and others on that subject: By which my mind was settled in prejudice against Arminianism, without a clear understanding of the case: whereupon I felt presently in my mind a judgment of those that were for Arminianism, as bad or dangerous adversaries to the Church; and specially of the then ruling bishops: which yet I think I had not-entertained, had I not taken them withal for the great persecutors of godly able ministers, and serious Christians, not only for ceremonies, but for holy practices of life. Being under these apprehensions, when the wars began [early-1640’s], though the cause itself lay in civil controversies between king and parliament, yet the thoughts that the Church and godliness itself was deeply in danger by persecution and Arminianism did much more to bias me to the parliament’s side than the civil interest (which at the heart I little regarded)…</p></blockquote>

<blockquote><p>The picture of a church much more concerned with carrying out its routine functions than with controversy is confirmed by W. R. Foster… Such studies, concentrating on the day to day life of the church and the extent of compromise, co-operation and continuity, undoubtedly provide a more accurate picture of the church as contemporaries saw it, and worked and worshipped in it, than sectarian histories which imply constant and bitter controversy at all levels. But it is worth suggesting that this tendency to concentrate on the positive elements of the church and on its routine functioning has gone too far; from too much emphasis on controversy the pendulum has swung so far that there is a tendency to ignore the controversy, that undoubtedly did exist. Foster’s “church before the covenants” seems so placid and united that the reader is left bewildered; the covenants evidently explode like a great storm suddenly appearing when the sky is clear and blue, and no attempt is made to explain the explosion. Controversial topics are played down or ignored; little is said about worship, almost nothing about theology. The new prayer book of 1637 which sparked off revolt is not mentioned in a book purporting to cover the period up to 1638; nor is the emergence of Arminianism in Scotland, undermining Calvinist orthodoxy and producing new tensions. Thus Foster’s book really only deals with some aspects of the church; what it does do, it does very well, but though it tells the truth it does not attempt to tell the whole truth.” – David Stevenson, “Scottish Church History, 1600-1660, a Select Critical Bibliography” (1982), p. 211 . On the Late-1600’s Articles Raffe, Alexander – pp. 180-188 of The Culture of Controversy: Religious Arguments in Scotland, 1660-1714 (Boydell Press, 2012) ToC McDougall: “Raffe outlined three tenets of partial conformity [for laymen]: avoidance of regular attendance at services given by conformist ministers; hearing sermons in parishes in other towns; and refusal to receive the sacraments from a conformist minister. This chapter will reveal a broader range of ways in which ministers and the laity could avoid conforming to Episcopacy without separating from the church entirely.</p></blockquote>

<blockquote><p>All these upon my own knowledge were the true causes why so great a number of those persons who were counted most religious, fell in with the parliament in England; insomuch that the generality of the stricter diligent sort of preachers joined with them, though not in meddling with arms, yet in judgment, and in flying to their garrisons; and almost all those afterwards called presbyterians were before conformists: Very few of all that learned and pious synod at Westminster were nonconformists before, and yet were for the parliament, supposing that the interest of religion lay on that side. Yet did they still keep up an honorable esteem of all that they thought religious on the other side, such as Bishop Davenant, Bishop Hall, Bishop Morton, Archbishop Ussher, etc.</p></blockquote>

<blockquote><p>§50. And whereas the king’s party usually say that it was the seditious preachers that stirred up the people, and were the cause of all this, I answer: 1. It is partly true and partly not: It is not true that they stirred them up to war (except an inconsiderable number of them, one perhaps in a county, if so much). But it is true that they discovered their dislike of the Book of Sports and bowing to altars, and diminishing preaching, and silencing ministers and such like; and were glad that the parliament attempted a reformation of them. 2. But then it is as true that almost all these were conformable ministers, the laws and bishops having cast out the nonconformists long enough before; insomuch that I know not of two nonconformists in a county. But those that made up the Assembly at Westminster, and that through the land were the honor of the parliament’s party, were almost all such as had till then conformed and took those things to be lawful in case of necessity, but longed to have that necessity removed.</p></blockquote>

<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience… (London, 1647), 17th thesis</cite>, p. 76</span></figcaption>

<blockquote><p>The very many questions that the [Medieval] Scholastics usually raise on this point are foolish ones: whether it is permitted to use for baptism anything other than every-day water, or whether it is permitted to use lye [a liquor made from ashes of wood], urine, boiled or distilled water, or also wine, vinegar, or even sand or mud. For as they rashly identify many materials on the assumption that baptism is absolutely necessary, so we read that Christ and the apostles consecrated and used for this sacrament nothing other than every-day water, and therefore, and therefore since these materials lack any commandment or promise, they cannot be used in faith. Accordingly we see that also John preached in Aenon because there was much water there (John 3:23), and that Philip did not baptize the already believing Ethiopian until they came to a place where there was water (Acts 8:36). And since there is obviously nothing more common than water (so that it has even become a proverb), instances of that sort can arise very rarely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology (Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 17</cite>, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>‘Whether water is to be used for baptizing? It is affirmed. Whether by urgent necessity, in the place of water some other liquor may be allowed, yet such as by which the body is washed, so whether by wine, rose water, milk, etc.? An absurd question. … Whether, if an infant is languishing and water is not present, it may be allowed to baptize with body lotion [etc.]… not differing much from water? An absurd question. For the rest, see in the Ecclesiastical Politics.</p></blockquote>

<blockquote><p>…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof: 1. For the natural analogy or likeness, which Christs body and the bread have between themselves. 2. For the certainty or confirmation of the joint-exhibition of the sign, and the thing signified in the true use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion… (London, 1645), 2nd Part, ‘Of the Lord’s Supper’, Question 79, ‘Why then does Christ call bread his body…’</cite>, p. 456</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof: 1. For the natural analogy or likeness, which Christs body and the bread have between themselves. 2. For the certainty or confirmation of the joint-exhibition of the sign, and the thing signified in the true use.”

</figure><figure class="quote" id="q-7447cdd86e" data-kw="">
<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in John Foxe, Acts &amp; Monuments… (London, 1583), ‘The Ninth Book Containing the Acts &amp; Things Done in the Reign of King Edward VI’, ‘Arguments of Peter Martyr…’</cite>, p. 1374</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-99bff9c65a" data-kw="">
<blockquote><p>First, whereas you say, It suffices that it is bread and wine before consecration, by which substances we be nourished, it proves not but that in the sacrament itself the conveniency is by you taken away. For we speak not of the sacrament when it is now a sacrament, where also we affirm that the analogy must be kept. You appoint the same to be before the sacrament; and when ye come to the sacrament, you take it away, and so ye sin against the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vermigli, The Common Places… with a Large Addition of Many Theological &amp; Necessary Discourses… (London, 1583), ‘The Disputation of the Second Day’</cite>, p. 196</span></figcaption>

</figure><figure class="quote" id="q-6f9ea7331c" data-kw="">
<blockquote><p>Answer 1 [to the Papists’s practice of keeping the cup from the people]: As in some countries there is no wine to be had, so we find that in certain places and regions of the world there is no bread, such as Christ used, made of wheat or the like grain: as in some places amongst the West Indians they have a certain kind of bread made of roots called Cazabi, as Benzo witnesses. Wherefore by this reason [of the Papists] of uniformity, we should not communicate at all, either in bread or wine, seeing that as some countries are destitute of wine, so other are of bread: But all this not withstanding, the sacrament may be duly administered in all places in both kinds: and where they have neither bread nor wine, neither can possibly provide them, they may safely use such other elements, as do stand them in the like stead: as in the place of bread, that which comes nearest to the use thereof: and for wine, some other precious liquor, that is to be had, as in Russia instead of wine they use a certain drink like unto that which we call Metheglen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi... (London, 1592), 13th Controversy, 8th Question, ‘Of Receiving the Sacrament in One Kind’</cite>, p. 470</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>5. They [papists] likewise say that some countries have no wine [in order to justify their witholding the cup from lay-persons]. I answer also that there are countries that have no bread; and that if men can carry the one thither, they may carry the other also: or if that be impossible, it is better in such a country to use that which serves there instead of bread and wine, rather than to be wholly or in part deprived of the sacrament… Add hereunto that if some countries cannot have wine for the sacrament, it follows not but that they may be furnished from an infinite number of other provinces where they may have wine.</p></blockquote>

</figure><figure class="quote" id="q-74c8053055" data-kw="">
<blockquote><p>I.: Why did our Savior Christ, of all other things in the world, select and consecrate bread and wine to be the symbols and representations of his body and blood? B.: In regard of the excellent analogy and likeness that is between the one and the other, in their several properties and effects.</p></blockquote>

</figure><figure class="quote" id="q-145c9fbbfd" data-kw="">
<blockquote><p>Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations… (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, Title VII, ‘Of the Sacraments’, subtitle 5, ‘Of the Lord’s Supper’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

v>
</figure><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Right Institution, Administration &amp; Receiving of the Sacrament of the Lord’s Supper… (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</cite></span></figcaption>

<blockquote><p>3. Touching the material parts of the sacrament, what elements He appointed: even such as of all other are of most general use among all nations, bread and wine, those which most befit a common salvation, Jude verse 2, and a common Savior, 1 John 2:1. 4. Touching the formal part of it, which consists in his manner of consecration, and the analogy between the outward elements and spiritual and heavenly things signified under them, that it may be known to be a spiritual meat [food], even the Word, the bread of life, and spiritual drink, even the quickening and enlivening Spirit.</p></blockquote>

</figure><figure class="quote" id="q-9bc7b9831b" data-kw="">
<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrine of the Covenants, or a System of Didactic &amp; Elenchtic Theology (Amsterdam, 1688), p. 593 as trans. in Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer tr. G.T. Thomson (Wipf &amp; Stock, 2007)</cite>, p. 631</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-fb9b120c8b" data-kw="">
<blockquote><p>XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>section 12 of ch. 17, ‘Of the Lord’s Supper’ in bk. 4 of The Economy of the Covenants Between God &amp; Man… (NY: George Forman, 1798), vol. 3</cite>, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.”

ine.com/on-the-sacraments-in-extra-ordinary-circumstances/#:~:text=XII.%20But%20as%20it%20is%20possible,nourished%20and%20the%20heart%20made%20glad&amp;text=XII.%20But%20as%20it%20is%20possible%2C%20nay%2C%20frequently&amp;text=be%20properly%20nourished%20and%20the%20heart%20made%20glad" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Wheras the Rejoinder makes sitting at a table in the Lord’s Supper and kneeling at prayer to be such things as the Lord could not command, but as snares, because sometime a table may be wanting [lacking], or something to sit on, or ability to sit, and so of kneeling: this is as poor a snare to catch any man of understanding in, as one shall lightly see made. For 1. many affirmative commandments of God there are, which in extraordinary cases cannot be fullfilled and cease to bind: as praying unto and praising of God with our voice: which is no snare, to him that cannot speak.</p></blockquote>

</figure><figure class="quote" id="q-36bca76b8d" data-kw="">
<blockquote><p>We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Examination of Two of the Articles Abridged: to wit, of the Communicants’ Gesture in the Act of Receiving, Eating &amp; Drinking… ([Holland?] 1636), ‘Of the Communicants’ Gesture in the Act of Receiving’, p. 14 Calderwood was an arch-Scottish presbyterian minister and theologian, who was the major mouthpiece for them between 1618-1637.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Solution of Doctor Resolutus, his Resolutions for Kneeling ([Amsterdam, 1619]), ch. 1, ‘A Table Gesture is Necessary’</cite>, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-9b54f2e462" data-kw="">
<blockquote><p>In every comparison there must be some dissimilitude. …‘Proportions are alike, but not the same.’ Christ’s body is not divided in parts as the bread; therefore there is no analogy betwixt Christ crucified and the bread? It follows not, for similitudes disagree in some things. Similitudes are not to be taken from things altogether different: as an ancient writer makes a comparison betwixt the ten plagues of Egypt and the Ten Commandments: so those who make the comparison betwixt the 70 disciples and the 70 palm trees; the 12 fountains and the 12 apostles: here the comparison is far sought. The comparison must agree in the main point, else it is not a comparison;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue… (London, 1623), 3rd bk., ch. 2, ‘Of the Illustration of Doctrine by Comparisons’</cite>, p. 281</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In every comparison there must be some dissimilitude. …‘Proportions are alike, but not the same.’ Christ’s body is not divided in parts as the bread; therefore there is no analogy betwixt Christ crucified and the bread? It follows not, for similitudes disagree in some things. Similitudes are not to be taken from things altogether different: as an ancient writer makes a comparison betwixt the ten plagues of Egypt and the Ten Commandments: so those who make the comparison betwixt the 70 disciples and the 70 palm trees; the 12 fountains and the 12 apostles: here the comparison is far sought. The comparison must agree in the main point, else it is not a comparison;”

</figure><figure class="quote" id="q-6857e8c576" data-kw="">
<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: … 2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance: 1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’ 2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace. 3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>

<blockquote><p>XXXV. The argument drawn from ‘the abstemious,’ who commune only under one kind, cannot favor our opponents. The insuperable exception of a few ought not to overthrow a general rule. Their abstaining from the cup is not voluntary and free (which would be altogether culpable), but involuntary and invincible on account of a natural and unavoidable inability. Therefore, if they do not use the cup, they are not on that account to be considered as violators of the divine command, because the precept has reference only to those who can use wine and not to those in whom God has placed such an invincible impediment (and whom on that account He wished to dispense [dispensare] from this precept). But so far is this from infringing the command of Christ that it rather strengthens it the more, as an exception added to a rule is wont to bind it more strongly. For since they only are excused from taking the cup who have a disgust for wine, by that very thing all others are determined to be bound to receive it. This is illustrated by the example of the deaf; for although the command to hear the Word is given to all, it binds only those who can hear and not the deaf. And if the deaf are exempted from it, falsely would anyone infer from this that it was also lawful for others to be excepted. XXXVI. The article of discipline of our churches by which the abstemious are excused from the use of the cup, provided they show reverence only by the movement of the cup to the mouth (by which they follow the institution of Christ and do not abstain from it through contempt but from inability), cannot help the Romanists (cf. ‘The Discipline of the Reformed Churches of France,’ 12, Canon 7 in Quick, Synodicon [1692], 1:xlviii). (1) Our practice differs widely from the Roman. It is one thing to bear with the weakness of those who cannot use wine; another to takw away from and prohibit the cup to those who are without such weakness. The former is done by us; the latter by Romanists. (2) The article of discipline is a work of charity and accommodation (synkatabaseos) towards a few out of unavoidable necessity. But the dogma of the Romanists is an absolute and simple interdiction towards all without necessity and against the express command of Christ. (3) The discipline does not intend that the species of the sacrament should be divided; nay, it intends that the sacrament should be retained entire and be conjointly extended and distributed to the people by the ministers (although both species cannot be received by the abstemious, but only one). But the Roman doctrine and practice wishes the sacrament to be divided and the communion mutilated by the priests. According to us the abstemious ought not only to desire the cup, but also to do everything to overcome their weakness; but the Romanists so take away the cup from the people that it is wrong for them to ask for it or to touch it. In one word, while according to our opinion nobody is kept from the use of the cup; nay, pastors are commanded to offer both kinds and believers to do all they can for its reception; by the Romanists the use of the cup is expressly forbidden to the people. It is evident that there is a great and wide difference between our opinion and theirs. XXXVII. Now although the abstemious receive the sacrament only under one kind, their communion is not on that account to be considered wholly profitless (illusoria). (1) The entire sacrament is extended to them by the minister and if they are compelled to abstain from one kind, it is not done spontaneously and contemptuously, but from sheer weakness and unavoidable necessity. (2) Although the species in the sacrament are indivisible by the ordination of God, this has respect to those only who can use them and not to others (whom He Himself dispenses by the obstacle placed in their way). For as He made the law, so He alone can dispense from it whom He pleases; and separate the species in certain cases, who joined them and willed them to be joined. (3) The defect of use (or of either species through the taste) can in some measure be supplied both by the wish and from the sight, touch, smell and other sensations. (4) Although both signs are not received, they do not cease to be made partakers of the whole thing signified, which is indivisible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 19th Topic, Question 25, ‘Communion under Both Kinds’, sections 35-37, pp. 463-4 This is contra Rome withholding the cup from the laity.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

tain cases, who joined them and willed them to be joined. (3) The defect of use (or of either species through the taste) can in some measure be supplied both by the wish and from the sight, touch, smell and other sensations. (4) Although both signs are not received, they do not cease to be made partakers of the whole thing signified, which is indivisible.”

r+weakness+and+unavoidable+necessity.+%282%29+Although+the+species+in+the+sacrament+are+indivisible+by+the+ordination+of+God%2C+this+has+respect+to+those+only+who+can+use+them+and+not+to+others+%28whom+He+Himself+dispenses+by+the+obstacle+placed+in+their+way%29.+For+as+He+made+the+law%2C+so+He+alone+can+dispense+from+it+whom+He+pleases%3B+and+separate+the+species+in+certain+cases%2C+who+joined+them+and+willed+them+to+be+joined.+%283%29+The+defect+of+use+%28or+of+either+species+through+the+taste%29+can+in+some+measure+be+supplied+both+by+the+wish+and+from+the+sight%2C+touch%2C+smell+and+other+sensations.+%284%29+Although+both+signs+are+not+received%2C+they+do+not+cease+to+be+made+partakers+of+the+whole+thing+signified%2C+which+is+indivisible.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+%28P%26R%29%2C+vol.+3%2C+19th+Topic%2C+Question+25%2C+%E2%80%98Communion+under+Both+Kinds%E2%80%99%2C+sections+35-37%2C+pp.+463-4+This+is+contra+Rome+withholding+the+cup+from+the+laity.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44fb257ea6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/44fb257ea6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sacraments-in-extra-ordinary-circumstances/#:~:text=XXXV.%20The%20argument%20drawn%20from%20%E2%80%98the,whole%20thing%20signified%2C%20which%20is%20indivisible&amp;text=XXXV.%20The%20argument%20drawn%20from%20%E2%80%98the%20abstemious%2C%E2%80%99%20who&amp;text=of%20the%20whole%20thing%20signified%2C%20which%20is%20indivisible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>

<blockquote><p>Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.”

— Martin Bucer, pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYouth+could+also+perform+comedies+and+tragedies%2C+and+by+such+means+a+useful+form+of+entertainment%2C+honorable+and+contributing+toward+an+increase+of+piety%2C+may+be+staged+for+the+people%3B+but+it+will+be+necessary+that+devout+and+wise+men+experienced+in+the+Kingdom+of+Christ+compose+these+comedies+and+tragedies%2C+in+which+there+may+be+presented+on+the+stage+the+plans%2C+actions+and+events+of+mankind%2C+whether+common+and+ordinary+as+it+occurs+in+compedies+or+unique+and+eliciting+admiration+as+it+is+characteristic+of+tragedies.+All+this+will+contribute+toward+a+correction+of+morals+and+a+pious+orientation+to+life+%28Aristotle%2C+Poetics+II%2C+1448a%29.+%E2%80%A6+It+must+be+observed%2C+however%2C+that+when+in+both+kinds+of+poetic+material%2C+comic+and+tragic%2C+the+activities+and+sins+of+men+are+described+and+actively+presented+to+be+seen+with+the+eyes%2C+it+should+be+done+in+such+a+way+that+although+the+crimes+of+reprobate+men+are+related%2C+yet+a+certain+terror+of+divine+judgment+and+horror+of+sin+should+appear+in+these+things%2C+and+a+shameless+daring+and+an+exultant+delight+in+crimes+should+not+be+expressed.+It+is+better+here+to+take+something+away+from+poetic+fitness+rather+than+from+the+concern+for+edifying+the+piety+of+the+spectators%2C+which+demands+that+in+every+representation+of+sin+there+be+felt+the+condemnation+of+one%E2%80%99s+conscience+and+the+horrible+fear+of+God%E2%80%99s+judgment.+But+when+pious+and+good+actions+are+shown%2C+they+should+express+as+clearly+as+possible+a+happy%2C+secure+and+confident+sense+of+the+divine+mercy%2C+but+moderate+and+diffident+as+regards+the+self%2C+and+a+joyful+trust+in+God+and+his+promises%2C+with+holy+and+spiritual+pleasure+in+doing+good.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+pp.+349-52+of+ch.+54%2C+%E2%80%98Honest+Games%E2%80%99+in+On+the+Reign+of+Christ%2C+bk.+2+in+Melanchthon+%26+Bucer%2C+ed.+Wilhelm+Pauck+%28Philadelphia%3A+Westminster+Press%2C+1969%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb3a3ffc529.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b3a3ffc529.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-theater-stage-plays-movies-acting-etc/#:~:text=Youth%20could%20also%20perform%20comedies%20and,and%20spiritual%20pleasure%20in%20doing%20good&amp;text=Youth%20could%20also%20perform%20comedies%20and%20tragedies%2C%20and&amp;text=with%20holy%20and%20spiritual%20pleasure%20in%20doing%20good" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Yet in spite of Shakspere’s awareness of the social, political and religious movements of Elizabethan England and his knowledge of the feelings of the populace, it has been alleged that he knew nothing of the popular tendencies of Puritans… it is possible to discover his attitude toward the impending religious and political strife.</p></blockquote>

<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903)</cite>, pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-5f508fedcc" data-kw="">
<blockquote><p>1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living Images in this extent. I pass by the instance of the woman of Tekoah, 2 Sam. 14, because the bare history proves not the lawfulness. But Paul’s speaking as of himself and Apollos the things which concerned others, was approvable: And as Christ frequently taught by parables, so his parables were a description of good and evil, by the way of feigned history, as if such and such things had been done by such persons as never were. And this fiction is no falsehood; For the hearer knows that it is not meant as an historical narrative, but a parable; And it is but an image in words, or a painted doctrine. And if a person and action may be feigned by words, I know not where it is forbidden to feign them by personal representation. Therefore to personate another is not simply a sin. 2. To personate good men in good actions is not simply unlawful: because: 1. It is not unlawful as it is personating, as is showed: 2. Nor as lying: Because it is not an asserting, but a representing; nor so taken. 3. To personate a bad man in a bad action, is more dubious; but seems not to be in all cases unlawful. To pass by David’s feigning himself mad (as of uncertain quality) it is common with preachers to speak oft the words of wicked men, as in their names or persons, to disgrace them: And Prov. 5:11-12, etc. comes near it. And whether Job be a history, or a dialogue personating such speakers, is doubted by the most learned expositors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes]</cite>, p. 877</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…nothing which is evil in the use of it [though it be otherwise indifferent] may be done for any good whatsoever. 2. The difference betwixt that which is simply evil, and that which is evil in use and by accident [though it is otherwise indifferent], is in that the one may never be done, the other is unlawful only pro tempore [for the time]: but in this they agree, that both are unlawful; for that which is evil by accident, whiles it is such, is unlawful to be done, no less than that which is in nature evil. (Paraeus on 1 Cor. 10:23)</p></blockquote>

<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>

<blockquote><p>Question 6. Whether any singular and individual action be indifferent? 10th Answer. First, there be some actions which though they be actions of a man, yet they are not human actions; such are those which proceed from imagination only, and not from deliberate reason, as the rubbings of men’s hands, to scratch the head or beard, to take up a straw, etc. while we are thinking of something else: these actions are not morally good or evil, they want that which is required to make them so, namely counsel and deliberation. For although a man may sin by those actions, as if in time of prayer he suffer his imagination to wander, and do give way to such toyings as those. Yet these actions considered in themselves are neither good nor evil. It is true these motions are subject to the command of man’s will, but yet they are so subject that they may be exercised without any precedent act of reason: Neither are we bound any further by reason to prevent them; but only so far that they hinder not the duties we are about. So for moving of the eyelids, reason and the will have power to moderate them, but it is not worth the while to take notice how often we wink, if so be we take heed that in such things nothing be done which is indecent, or against our duty. 11. Secondly, every action which proceeds from deliberate reason and is properly called human, considered singularly and in the individual, as it is an exercised action, is either good or evil. For such a kind of action is either ordered to a good end, or it is not; If it be, then it has the nature of a good action, if other circumstances be correspondent; if it be not ordered to a good end, it is an evil action because it wants the perfection which ought to be in it, and is not according to its rule. 12. Yet is not required to the goodness of natural action that it be always actually and explicitly referred to the due end, so that this [at least] be done implicity and virtually; because reason in that exercise of such kind of actions, may often with more profit be conversant about those objects. 13. Thirdly, some one or two circumstances of an human action may be indifferent, as if one scholar be speaking with another, it is sometimes indifferent whether they use the Latin tongue, or any other. But their talk taken with all the circumstances is necessarily either good or bad: the reason is, because the determination of an action does not depend upon one circumstance apart, but upon all jointly together. 14. Fourthly, there may be some singular action in which there is no goodness-special to be found, which may not be found in another, and so, that at this time we do this or that, rather than another thing, therein is ofttimes neither good nor evil. Opportunity, or the suggestion of our minds, without any respect of moral goodness, may be of weight sufficient to make the determination. 15. Fifthly, although therefore there be no singular actions-human, that is neither good, nor evil; yet there are diverse, which singularly and in comparison of others, are neither necessary nor unlawful. For as the carver oftentimes has no certain reason why he rather makes this image than that: yet if he make any, it is necessary that he either follow the rules of his art and make a good one, or fail and so make a bad one. So it is in many singular actions of men, which in respect of the exercise, have no proper reason beside the inclination of the mind, but in the doing they are either good or bad.</p></blockquote>

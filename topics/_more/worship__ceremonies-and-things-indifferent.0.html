<blockquote><p>We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 2, ‘Some Questions on Liturgies &amp; Liturgical Actions Determined’, pp. 360-374 “We come now to the problems, which are either of sacred [Scriptural] history and are didactic, or of Church history.” | 1st Problem, ‘Whether ‘liturgy’ may designate a sacrifice properly so-called, it even being propitiating, or be a rule or order to be accomplished as like a sacrifice?’</cite>, p. 360</span></figcaption>

<blockquote><p>Indeed, nothing like the example of a ceremony has been exhibited thus far. On the laying on of hands and of the holy kiss, we speak below.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 7. ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, pp. 422-460 “On the public controversies [previously] explicated, we respond to various problems and questions on the ceremonies, by which the nature and properties of them may be the better laid open. I divide them into problems on ceremonies in general and on ceremonies in particular. The first classes [on ceremonies in general] pertain to what it is, or the definition, or the causes or properties.” | On the definition of a ceremony: | 11th Problem, ‘Whether in the time of the N.T. there were instiuted, or observed by the apostles ceremonies properly called sacred and mystical, whether in their signifying or working, which however were not parts of divine worship, nor instituted by divine law, nor consequently necessary by the necessity of a precept? I respond: No.’</cite>, p. 425</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Indeed, nothing like the example of a ceremony has been exhibited thus far. On the laying on of hands and of the holy kiss, we speak below.”

— Gisbertus Voetius, Ecclesiastical Politics (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 7. ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, pp. 422-460 “On the public controversies [previously] explicated, we respond to various problems and questions on the ceremonies, by which the nature and properties of them may be the better laid open. I divide them into problems on ceremonies in general and on ceremonies in particular. The first classes [on ceremonies in general] pertain to what it is, or the definition, or the causes or properties.” | On the definition of a ceremony: | 11th Problem, ‘Whether in the time of the N.T. there were instiuted, or observed by the apostles ceremonies properly called sacred and mystical, whether in their signifying or working, which however were not parts of divine worship, nor instituted by divine law, nor consequently necessary by the necessity of a precept? I respond: No.’, p. 425">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIndeed%2C+nothing+like+the+example+of+a+ceremony+has+been+exhibited+thus+far.+On+the+laying+on+of+hands+and+of+the+holy+kiss%2C+we+speak+below.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Ecclesiastical+Politics+%28Amsterdam%2C+1663-1676%29+%7C+vol.+1%2C+pt+1%2C+bk.+2%2C+%E2%80%98Of+Ecclesiastical+Things%2C+or+Acts+%26+Exercises%E2%80%99%2C+Tract+1%2C+%E2%80%98Of+Formularies%2C+or+Liturgies+%26+Rituals%E2%80%99+%7C+ch.+7.+%E2%80%98Questions+Further+Explained+on+the+Nature%2C+Causes+%26+Properties+of+the+Ceremonies%E2%80%99%2C+pp.+422-460+%E2%80%9COn+the+public+controversies+%5Bpreviously%5D+explicated%2C+we+respond+to+various+problems+and+questions+on+the+ceremonies%2C+by+which+the+nature+and+properties+of+them+may+be+the+better+laid+open.+I+divide+them+into+problems+on+ceremonies+in+general+and+on+ceremonies+in+particular.+The+first+classes+%5Bon+ceremonies+in+general%5D+pertain+to+what+it+is%2C+or+the+definition%2C+or+the+causes+or+properties.%E2%80%9D+%7C+On+the+definition+of+a+ceremony%3A+%7C+11th+Problem%2C+%E2%80%98Whether+in+the+time+of+the+N.T.+there+were+instiuted%2C+or+observed+by+the+apostles+ceremonies+properly+called+sacred+and+mystical%2C+whether+in+their+signifying+or+working%2C+which+however+were+not+parts+of+divine+worship%2C+nor+instituted+by+divine+law%2C+nor+consequently+necessary+by+the+necessity+of+a+precept%3F+I+respond%3A+No.%E2%80%99%2C+p.+425&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59d7b78d34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/59d7b78d34.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Indeed%2C%20nothing%20like%20the%20example%20of,the%20holy%20kiss%2C%20we%20speak%20below&amp;text=Indeed%2C%20nothing%20like%20the%20example%20of%20a%20ceremony&amp;text=and%20of%20the%20holy%20kiss%2C%20we%20speak%20below" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I respond: The Papists make ordination a sacrament, and this the material of it, the laying on of hands (see Cornelius a Lapide, Commentary in location). This opinion has been refuted, see their antagonists. The Lutherans however reckon it according to the indifferent rites (see Eckhardt in location cited); however they are seen to discover something in it mystical and necessary however often they knowingly touch upon our indifferent things on this rite. We, however varied in locations and possibly in however many churches this right is used, yet adjudge it to be merely indifferent. See Piscator, Daneus and other commentators in 1 Timothy and Acts 6 &amp; 13; and Alting in the Exegesis of the Augsburg Confession, p. 90. This right was commonly used in synagogues, schools and the polity of the Jews, from where it is seen the apostles took it, which is the opinion of Calvin in his Commentary on Acts 6 &amp; 13, and Institutes, bk. 4, ch. 3, section 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 1, p. 460 “Problems on rites follow, certainly not all, but only some select ones in particular that the Scripture has mentioned. Those remaining are nearly innumerable which occur in the books of the Old and New Testament or ecclesiastical writings, whether ancient, medieval, modern or recent…” | 4th Problem, ‘What is to be decided about the laying on of hands in ordination or the constituting of ministers (on which see 1 Tim. 4 &amp; 5)?’</cite>, pp. 461-66</span></figcaption>

<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.”

— William Perkins, A Reformed Catholike: or, A Declaration showing how near we may come to the present Church of Rome in sundry points of religion: and wherein we must forever depart from them… ([Cambridge,] 1598), 7th Point, ‘Of Traditions’, pp. 136-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConclusion+3.+We+hold+that+the+Church+of+God+has+power+to+prescribe+ordinances+rules%2C+or+traditions%2C+touching+time+and+place+of+God%E2%80%99s+worship%2C+and+touching+order+and+comeliness+to+be+used+in+the+same%3A+and+in+this+regard%2C+Paul%2C+1+Cor.+11%3A2%2C+commends+the+Church+of+Corinth+for+keeping+his+traditions%2C+and+Acts+15%2C+the+Council+at+Jerusalem+decreed+that+the+Churches+of+the+Gentiles+should+abstain+from+blood+and+from+things+strangled.+This+decree+is+termed+a+tradition%2C+and+it+was+in+force+among+them+so+long+as+the+offence+of+the+Jews+remained.+And+this+kind+of+traditions%2C+whether+made+by+general+councils+or+particular+synods%2C+we+have+care+to+maintain+and+observe%3B+these+caveats+being+remembered%3A+First%2C+that+they+prescribe+nothing+childish+or+absurd+to+be+done%3A+Secondly%2C+that+they+be+not+imposed+as+any+parts+of+God%E2%80%99s+worship%3A+Thirdly%2C+that+they+be+severed+from+superstition+or+opinion+of+merit%3A+Lastly%2C+that+the+Church+of+God+be+not+burdened+with+the+multitude+of+them.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholike%3A+or%2C+A+Declaration+showing+how+near+we+may+come+to+the+present+Church+of+Rome+in+sundry+points+of+religion%3A+and+wherein+we+must+forever+depart+from+them%E2%80%A6+%28%5BCambridge%2C%5D+1598%29%2C+7th+Point%2C+%E2%80%98Of+Traditions%E2%80%99%2C+pp.+136-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88821cf794.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/88821cf794.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=Conclusion%203.%20We%20hold%20that%20the,burdened%20with%20the%20multitude%20of%20them&amp;text=Conclusion%203.%20We%20hold%20that%20the%20Church%20of&amp;text=be%20not%20burdened%20with%20the%20multitude%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-86e0d15ddc" data-kw="">
<blockquote><p>In natural things, it is to be noted that the whole fulness of perfection due to a thing, is not from the mere substantial form that gives it its species since a thing derives much from supervening accidents, as man does from shape, color and the like; and if any one of these accidents be out of due proportion, evil is the result. So it is with action. For the plenitude of its goodness does not consist wholly in its species, but also in certain additions which accrue to it by reason of certain accidents: and such are its due circumstances. Wherefore if something be wanting that is requisite as a due circumstance the action will be evil. … Circumstances are outside an action inasmuch as they are not part of its essence; but they are in an action as accidents thereof… Every accident is not accidentally in its subject, for some are proper accidents; and of these every art takes notice. And thus it is that the circumstances of actions are considered in the doctrine of morals… Since good and being are convertible, according as being is predicated of substance and of accident, so is good predicated of a thing both in respect of its essential being, and in respect of its accidental being; and this, both in natural things and in moral actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 3. ‘Whether man’s action may be good or evil from a circumstance?’ [Yes]</cite></span></figcaption>

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=In%20natural%20things%2C%20it%20is%20to,natural%20things%20and%20in%20moral%20actions&amp;text=In%20natural%20things%2C%20it%20is%20to%20be%20noted&amp;text=both%20in%20natural%20things%20and%20in%20moral%20actions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…every action takes its species from its object; while human action, which is called moral, takes its species from the object, in relation to the principle of human actions, which is the reason. Wherefore if the object of an action includes something in accord with the order of reason, it will be a good action according to its species; for instance, to give alms to a person in want. On the other hand, if it includes something repugnant to the order of reason, it will be an evil act according to its species; for instance, to steal, which is to appropriate what belongs to another. But it may happen that the object of an action does not include something pertaining to the order of reason; for instance, to pick up a straw from the ground, to walk in the fields, and the like: and such actions are indifferent according to their species.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 8. ‘Whether any action may be indifferent in its species?’ [Yes]</cite></span></figcaption>

</figure><figure class="quote" id="q-548c34f841" data-kw="">
<blockquote><p>Gregory says in a homily (vi in Evang.): ‘An idle word is one that lacks either the usefulness of rectitude or the motive of just necessity or pious utility.’ But an idle word is an evil, because ‘men… shall render an account of it in the day of judgment’ (Mt. 12:36): while if it does not lack the motive of just necessity or pious utility, it is good. Therefore every word is either good or bad. For the same reason every other action is either good or bad. Therefore no individual action is indifferent. …It sometimes happens that an action is indifferent in its species, but considered in the individual it is good or evil. And the reason of this is because a moral action… derives its goodness not only from its object, whence it takes its species; but also from the circumstances, which are its accidents, as it were; just as something belongs to a man by reason of his individual accidents, which does not belong to him by reason of his species. And every individual action must needs have some circumstance that makes it good or bad, at least in respect of the intention of the end. For since it belongs to the reason to direct; if an action that proceeds from deliberate reason be not directed to the due end, it is, by that fact alone, repugnant to reason, and has the character of evil. But if it be directed to a due end, it is in accord with reason; wherefore it has the character of good. Now it must needs be either directed or not directed to a due end. Consequently every human action that proceeds from deliberate reason, if it be considered in the individual, must be good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 9. ‘Whether an individual action can be indifferent?’ [No]</cite></span></figcaption>

<blockquote><p>Place is a circumstance. But place makes a moral action to be in a certain species of evil; for theft of a thing from a holy place is a sacrilege. Therefore a circumstance makes a moral action to be specifically good or bad. … And in this way, whenever a circumstance has a special relation to reason, either for or against, it must needs specify the moral action whether good or bad. … It is not every circumstance that places the moral action in the species of good or evil, since not every circumstance implies accord or disaccord with reason.</p></blockquote>

<blockquote><p>First of all, I hold that it is proper for the ceremonies in the church to be absolutely as few and as pure as possible. For besides the fact that we must now worship the Lord in Spirit and truth, even plain experience, that teacher of fools, ought to warn us not to imitate the example of those who–while setting no limit on their ceremonies–do not increase the worship of God, but completely undermine it. And so we determined that we should take thought how to do away with ceremonies rather than establishing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016)</cite>, p. 143</span></figcaption>

<blockquote><p>To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

><a class="perma" href="../../quote/ee65977391.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=To%20the%20proposition%2C%20%E2%80%98What%20things%20are,stand%20with%20the%20Will%20of%20God&amp;text=To%20the%20proposition%2C%20%E2%80%98What%20things%20are%20done%20for&amp;text=agree%20and%20stand%20with%20the%20Will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-60cf19bccc" data-kw="">
<blockquote><p>When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies ([1637]), pt. 4, ch. 3</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

C%20by%20what%20means%2C%20why%2C%20what%20way%2C%20when" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e6788e1cfe" data-kw="">
<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Liturgies &amp; their Imposition (London, 1662), ch. 7</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c270919e61" data-kw="">
<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.”

</figure><figure class="quote" id="q-389d830e47" data-kw="">
<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended… (Edinburgh: 1697), section 12</cite>, p. 276</span></figcaption>

</figure><figure class="quote" id="q-cb1630fbc8" data-kw="">
<blockquote><p>Though these [circumstances of worship] also, when they have a religious respect put on them, are made essential, and come under the things our Saviour here refers to [Mat. 15:9]. But a thing may then be said to be made a part of worship, when it hath such an holiness put upon it, as to be reputed a medium of our communion with God. And this is not to be judged of by what men say of it, but by the necessary consequence of the usage of it.</p></blockquote>

</figure><figure class="quote" id="q-a968a6d7ea" data-kw="">
<blockquote><p>The classical and confessional understanding of this principle [the RPW] led the Reformed churches to distinguish between two aspects of worship: elements and circumstances. This distinction was a corollary to the distinction between a substance and an accident. A substance is that which makes a thing what it is. An accident is something that is temporarily connected or related to the substance but such that it can be changed without changing the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Recovering the Reformed Confession (P&amp;R, 2008)</cite>, pp. 229-30</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“The classical and confessional understanding of this principle [the RPW] led the Reformed churches to distinguish between two aspects of worship: elements and circumstances. This distinction was a corollary to the distinction between a substance and an accident. A substance is that which makes a thing what it is. An accident is something that is temporarily connected or related to the substance but such that it can be changed without changing the substance.”

— R. Scott Clark, Recovering the Reformed Confession (P&amp;R, 2008), pp. 229-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+classical+and+confessional+understanding+of+this+principle+%5Bthe+RPW%5D+led+the+Reformed+churches+to+distinguish+between+two+aspects+of+worship%3A+elements+and+circumstances.+This+distinction+was+a+corollary+to+the+distinction+between+a+substance+and+an+accident.+A+substance+is+that+which+makes+a+thing+what+it+is.+An+accident+is+something+that+is+temporarily+connected+or+related+to+the+substance+but+such+that+it+can+be+changed+without+changing+the+substance.%E2%80%9D%0A%0A%E2%80%94+R.+Scott+Clark%2C+Recovering+the+Reformed+Confession+%28P%26R%2C+2008%29%2C+pp.+229-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa968a6d7ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a968a6d7ea.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=The%20classical%20and%20confessional%20understanding%20of,be%20changed%20without%20changing%20the%20substance&amp;text=The%20classical%20and%20confessional%20understanding%20of%20this%20principle&amp;text=it%20can%20be%20changed%20without%20changing%20the%20substance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2bcb8c6370" data-kw="">
<blockquote><p>This comprehensive application of the [Scriptural] rule [articulated by Rutherford] was necessitated because the advocates for human ceremonies had argued that such things might be justified as circumstances of worship. It was maintained that circumstances which were not forbidden were lawful if they were edifying. Their reformed opponents quickly saw that this argument effectively created a class of religious actions which were beside the Word in matters of faith and worship. Their response was clear and concise: any action which served as a means of worship was a moral action and required the warrant of God’s Word. To the point, Rutherford asserted, “In actions or religious means of worship, and actions moral, whatever is beside the Word of God is against the Word of God”. (Divine Right of Church Government, 1646, [Intro, section 2], pp. 19-20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Constitutional Principle of the Scottish Reformation: 1547-1648’ in Scottish Reformation Society Historical Journal, 2012, vol. 2</cite>, pp. 1-42</span></figcaption>

 · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3eb42af139" data-kw="">
<blockquote><p>The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.”

— Aquinas, Summa, pt. 2, pt. 1, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Divine+worship+includes+not+only+sacrifices+and+the+like%2C+which+seem+to+be+directed+to+God+immediately%2C+but+also+those+things+whereby+His+worshippers+are+duly+prepared+to+worship+Him%3A+thus+too+in+other+matters%2C+whatever+is+preparatory+to+the+end+comes+under+the+science+whose+object+is+the+end.+Accordingly+those+precepts+of+the+Law+which+regard+the+clothing+and+food+of+God%E2%80%99s+worshippers%2C+and+other+such+matters%2C+pertain+to+a+certain+preparation+of+the+ministers%2C+with+the+view+of+fitting+them+for+the+Divine+worship%3A+just+as+those+who+administer+to+a+king+make+use+of+certain+special+observances.+Consequently+such+are+contained+under+the+ceremonial+precepts.%E2%80%9D%0A%0A%E2%80%94+Aquinas%2C+Summa%2C+pt.+2%2C+pt.+1%2C+Question+101%2C+%E2%80%98Of+the+Ceremonial+Precepts+in+Themselves%E2%80%99%2C+Article+1%2C+%E2%80%98Whether+the+nature+of+the+ceremonial+precepts+consists+in+their+pertaining+to+the+worship+of+God%3F%E2%80%99%2C+Reply+to+Objection+1.+While+Aquinas%E2%80%99s+teaching+can+be+taken+too+far%2C+as+Romanists+have+taken+it+in+setting+apart+as+holy+the+many+various+instruments+involved+with+the+mass%2C+yet+there+is+an+aspect+of+truth+in+the+teaching.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eb42af139.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3eb42af139.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=The%20Divine%20worship% <blockquote><p>2. They [indifferent things] are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands… so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion, yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil. 3. Of the same account is that εὐσχημονία, or decency of religious actions, required by God before Himself… of which the apostle discourses: ‘Every man praying with his head uncovered, dishonoureth his head’ [1 Cor. 11:4]… such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-beverley.html">Thomas Beverley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises (London, 1683), ‘The Woe of Scandal’</cite>, pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. They [indifferent things] are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands… so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion, yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil. 3. Of the same account is that εὐσχημονία, or decency of religious actions, required by God before Himself… of which the apostle discourses: ‘Every man praying with his head uncovered, dishonoureth his head’ [1 Cor. 11:4]… such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.”

</figure><figure class="quote" id="q-035d8f0bf3" data-kw="">
<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet (London, 1684), Of Divine Worship, pt. 1, §16. ‘Of Time &amp; Place considered as Adjuncts, or as Matter of Worship’</cite>, pp. 184-85.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

>Read it online · Reformed Books Online</a></div>

<blockquote><p>those constitutions and ceremonies which… strive to direct the worship constituted by God with respect to circumstantial matters of places and times, for εὐταξία καὶ εὐσχημονία, ‘good order and decency’… they acknowledge [in these] something divine and something human: they are divine with respect to the foundation, insofar as God generally prescribes that all things be done in good order and decently (1 Cor. 14:40), and human with respect to the particular determination, whereby this or that is said to aim at good order and decency.</p></blockquote>

</figure><figure class="quote" id="q-a531f12cdc" data-kw="">
<blockquote><p>There is nothing accidental in the worship of God. Every thing that belongs to it, is part of it. Some things are of more weight, use and importance than others (Mt. 23:27), but all things duly belonging to it, are parts of it, or of its subsistence; outward circumstances are natural and occasional, no accidental parts of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 36-38 &amp; 41-43 in Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen ed. Travis Fentiman (RBO, 2024) 87 pp. | Owen claims:</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is nothing accidental in the worship of God. Every thing that belongs to it, is part of it. Some things are of more weight, use and importance than others (Mt. 23:27), but all things duly belonging to it, are parts of it, or of its subsistence; outward circumstances are natural and occasional, no accidental parts of worship.”

<blockquote><p>Outward rites and modes of worship divinely instituted and determined do become the necessary parts of divine worship. See the instance, Lev. 1:16. Therefore such as are humanly instituted, appointed and determined are thereby made parts of worship, namely that which is false, for lack of divine institution.</p></blockquote>

<blockquote><p>The women’s preparation, verse 20, ‘And Miriam the prophetess the sister of Aaron, took a timbrel in her hand, and all the women went out after her with timbrels and dances’… Question. Is this practice now imitable in the Church? Answer: No, for: 1. This was done by a prophetical and extraordinary instinct. 2. It was a service suitable to that legal constitution at that time. 3. The Gospel only requires spiritual sacrifices of praise and singing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-hughes.html">George Hughes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of the Whole First Book of Moses, called Genesis… (1672), on Ex. 15, verse 20</cite></span></figcaption>

</figure><figure class="quote" id="q-7e1d13a20e" data-kw="">
<blockquote><p>Let God be ‘praised in the dance with timbrel and harp,’ according to the usage of the Old-Testament church very early (Ex. 15:20), where we find God praised with timbrels and dances. Those who from this urge the use of [instrumental] music in religious worship must by the same rule introduce dancing, for they went together, as in David’s dancing before the ark, and Judg. 21:21. But, whereas many scriptures in the New Testament keep up singing as a gospel-ordinance, none provide for the keeping up of [instrumental] music and dancing; the gospel-canon for psalmody is to sing with the spirit and with the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ps. 149, verse 4</cite></span></figcaption>

</figure><figure class="quote" id="q-765ea3c2b5" data-kw="">
<blockquote><p>…the Rejoinder [of an opponent] brings abundance of instances [for human ceremonies in worship though they had been idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which are a form of natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>

+to+dance+a+certain+round%2C+or+galliard+after+every+fiddle%3F+It+is+natural+for+a+child+to+signify+his+discerning+of+those+that+it+is+used+to+by+some+such+sound+as+dad+and+mam%2C+but+not+to+make+verses+in+a+certain+number.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%E2%80%A6+%281633%29%2C+pp.+495-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F765ea3c2b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/765ea3c2b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-dance-and-drama-in-worship/#:~:text=the%20Rejoinder%20%5Bof%20an%20opponent%5D%20brings,make%20verses%20in%20a%20certain%20number&amp;text=the%20Rejoinder%20%5Bof%20an%20opponent%5D%20brings%20abundance%20of&amp;text=not%20to%20make%20verses%20in%20a%20certain%20number" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ca812e071" data-kw="">
<blockquote><p>To these may be added dances (but the dances of pious girls must be separate from the dances of young boys) which may be danced to pure and holy songs (Plato, Laws II, 654 ff.), with chaste and modest motion befitting those who profess piety, as Miriam, the sister of Moses, danced and the matrons of Israel when they had crossed the Red Sea and sang the praises of God for such a wonderful delivery of their nation from the slavery of Egypt (Ex. 15:20-21). Such was the dance of the holy girls who celebrated David and Saul in a song of victory when they returned from the slaughter of the Philistines (1 Sam. 18:6), the kind of dance the Holy Spirit requires in Ps. 149:3 and 150:4 when he says, ‘Praise the Lord with timbrel and dance.’ … In pious singing, therefore, we are reminded of these gifts from such an immense goodness of God. And should the spirit not rightly leap with joy and gladness and excite the body to bear witness to this joy and impel it to express this gladness, by action, however, becoming to every age and nation? Certainly a deeper recollection of divine blessings strongly moved David, although he was a king, when he was bringing in the Ark of the Lord, so that he danced before it (II Sam. 6:12-15). He was a Palestinian, I admit, of a nation far more emotional and uninhibited than our European people. But since our young people delight in dancing, why are such dances not introduced among us too, who have become citizens of heaven through the blood of Christ, so that they spring forth from a pious and holy exultation of the mind over the goodness of God and strengthen and increase that exultation and inflame the spirit with a desire for all piety? … For this reason, no singing nor any kind of dancing should be allowed, either privately or publicly, which has not been approved by wise and religious men to whom this responsibility will be referred by Your Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reign of Christ, bk. 2, ch. 54, ‘Honest Games’ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)</cite>, pp. 347-48</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-263fe89a98" data-kw="">
<blockquote><p>Q. What else is condemned [in the 7th Commandment]? A. The occasions of uncleaneness, as idlenes, pride and fulness of bread, prattling and gadding from house to house, lascivious dancings, books, songs, pictures, and stage-plays, the companying with fornicators, the resorting to lewd houses, the maintaining of stews [whore-houses], the making light of others’ fornication, and the not marrying when we have not the gift of continency.</p></blockquote>

<blockquote><p>…let them who commend them [dances] to the Church, see where those sober and modest dances which they speak of can find any place: and to those that expound choreas ducere [to conduct dances], only of lascivious dances, we will in a form of speech commodious enough interpret these dances to be meant of all dancings whatsoever: otherwise St. Cyprian had not affirmed that David danced before God, unless any should think that the Blessed [Peter] Martyr (which never came into his mind) would brand the royal prophet with a mark of lascivious and obscene dancing. And if there be any that think that dancing be sober and modest, they are at their liberty for me to abound in their own sense: at least, with Octavius, that good defender of the Christian religion, and other lights of Reformed Christianity, it seems meet for me to repute them as obscene and evil pleasures. Lastly, let the patrons of those dances which they call sober…</p></blockquote>

<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 193</span></figcaption>

<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 1, ‘That the Ceremonies are Unlawful, because superstitious…’</cite>, pp. 11-12</span></figcaption>

<blockquote><p>Most false it is that the Tabernacle and Temple were nothing but a meeting place of the people for worship, as our churches or chapels, are: 1. Because it is to argue the Holy Ghost of want [lack] of wisdom, to spend so much canonic Scripture in setting down things idly, not tending, at all to edification, and teaching us nothing of God, and in specifying the form, height, length, breadth, curtains, candlesticks, sockets, rings of natural places that contained their bodies… Now certain it is, ‘Whatsoever things were written aforetime, were written for our learning, Rom. 15:4. 2. Many things in the Tabernacle, as candles in daylight, rings, sockets, showbread, belonged nothing to a natural place, as our chapels, or meeting houses do. 3. Expressly the Scripture makes them more than places; to wit, holy, religious, and typical signs of divine institution; as the Tabernacle was a type, Heb. 8:2,5; 9:1,2 etc.; 10:1-3. And the Temple a type of Christ’s body, Jn. 2:19; 1:14-15. And all these were types and shadows of heavenly things, Heb. chapters 8-10; Gal. 4:1-2, etc.; Col. 2:16,17. Which our churches and chapels are not, being only places common to sacred and civil actions. … 3. Yea, because the Tabernacle and Temple and their implements were teaching shadows of good things to come, and our Churches and Chapels are not so, nor have they any moral or religious use or influence on our spirits as the Tabernacle and Temple had; therefore the Lord, who is express in all morals, which of their own nature do teach and edify; he behoved to name Bezaliel, and Aholiah, and the form and color of the priests’ garments, which also are typical, and could not name our elders, or the color or form of their garments. 4. All these weak retortions [of Rutherford’s Anglican opponents] suppose that the Tabernacle and Temple were types of our meeting houses for worship, which is a mere conjecture; they were no more types of our chapels than of the Jewish synagogues;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Intro, section 3</cite>, pp. 48-49</span></figcaption>

<blockquote><p>2. How names are to be given to places, we cannot better learn than of those ancient founders of names, the holy Patriarchs: As Abraham Gen. 22:14 calls the mountain Jehovah-jireh, ‘The Lord hath seen.’ So Jacob gives holy names to the place where he met the angels, Gen. 32:2, and where he wrestled with the angel, v. 31. They, as we see, gave holy and reverent names unto places, not made peculiar for God’s service, but only for civil use for the places to be called and known by: how much more ought churches and houses of God to be called by his name? We therefore conclude that churches ought not to be erected in saints’ names, to worship them thereby and make them our patrons, mediators, and presenters of our prayers [as Romanists]: for this were great idolatry: Even like as the heathen called their temples by the names of their idols, Venus, Jupiter, Diana and the like: Yet we refuse not to call our churches by the names of saints, as they have been called of old, because we are not inventors of names; and terms inured by continual custom can hardly be left. We use them only as civil terms to distinguish places by: if any otherwise use them, for any religious purpose, they do amiss. And yet we deny not but that the names of holy men may be safely remembered by thanksgiving unto God for such excellent instruments, and setting before our eyes their good example. And concerning the names which have been superstitiously given in times past unto churches and other places (though it were to be wished that they never had been so given) yet now we use them (setting apart all superstition) as civil names of difference, as St. Luke [the author of Acts] describes the ship of Alexandria wherein they were carried, whose badge (says he) was Castor &amp; Pollux, Acts 28:11. In a civil matter of description, he refuses not to use the names of the heathen gods. Augustine also gives a good rule concerning such names. He speaks of the names of days, which were called after the names of heathenish idols, as the fourth day in the week, which we call Wednesday, was then called and is yet in the Latin tongue,Dies Mercurij, Mercury, his day. ‘Sic dicitur, a paganis, &amp; a multis Christianis, sed nolumus vt dicant, et vtinam corrigātur: melius de ore Christiano ritus loquendi ecclesiasticus procedit.’ So it is called of the heathen, and of many Christians, but I would not have them called so, and I wish they were amended: for a Christian kind of speaking best becomes a Christian. Sed si quem forte cōsuetudo traxerit, etc. sciat illos omnes homines fuisse. ‘But if custom prevail with a man so to speak, let him understand that all they were but men,’ whom the heathen take for gods. So say we, it were to be wished that we had names void of all show of superstition: but seeing for our speaking we must be ruled by custom, let us know that those saints by whose names places are called, are no gods, nor God’s fellows, nor patrons or mediators for us, nor any way to be worshipped: But they are the fellow servants of all.</p></blockquote>

all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Consecrating of churches is taken two ways: 1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches: 1. That the end being sacred, to wit, the habitual worshipping of God in that place. 2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple. 2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place. 3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>

<blockquote><p>And the Houshold of Onesiphorus. …As the apostle before, [2 Tim.] Ch. 1:16, prayed for the house of Onesiphorus, so here [2 Tim. 4:19] he salutes them. By ‘house’ here is meant (by a metonymy of the subject very frequent in Scripture) the people in the house, as wife, children, servants; which may serve as an answer to that cavil of the sottish illiterate Quakers who revile us for calling the place where the Church meets, ‘The Church’; when this metonymy is so frequent in Scripture, ‘The house’ for the people in the house, and ‘the Church’ for the people that meet in the church. The Apostle uses the very word Church in this very sense, 1 Cor. 14:28,35, ‘It is a shame for a woman to speak in the Church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 55, ‘Whether we may call the Meeting-Place a Church?’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 4:19, p. 460. Hall (1610–1665) was an English, presbyterian puritan who was ejected at the Great Ejection of 1662.</cite></span></figcaption>

orship/#:~:text=And%20the%20Houshold%20of%20Onesiphorus,woman%20to%20speak%20in%20the%20Church&amp;text=And%20the%20Houshold%20of%20Onesiphorus&amp;text=for%20a%20woman%20to%20speak%20in%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law; but at other times he held separate assemblies in the wilderness of Judea at Jordan, and at Enon, where he taught and baptized… Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One while we find them in the Temple at public worship and teaching there. (Acts 3:1; 4:1) Another while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel, and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows, 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703)</cite>, pp. 7-9</span></figcaption>

<blockquote><p>In 1662, the same spirit and sentiment afresh appeared; when most of the considerable ejected London ministers met, and agreed to hold occasional communion with the now re-established Church—not quitting their own ministry, or declining the exercise of it as they could have opportunity. And as far as I could by inquiry learn, I can little doubt this to have been the judgment of their fellow sufferers through the nation, in great part, ever since… any one of common sense can see through it; such as that: ‘How can a man dissent and conform at the same time?’ when all the world knows, or may, conformity consists of numerous parts; and is it such a miracle for a man to conform in some part and not in every part? Conscientiously to scruple constant entire conformity, and not scruple some part of it, at some time?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (Religious Tract Society, 1863), pp. 261-90</cite>, p. 289</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In 1662, the same spirit and sentiment afresh appeared; when most of the considerable ejected London ministers met, and agreed to hold occasional communion with the now re-established Church—not quitting their own ministry, or declining the exercise of it as they could have opportunity. And as far as I could by inquiry learn, I can little doubt this to have been the judgment of their fellow sufferers through the nation, in great part, ever since… any one of common sense can see through it; such as that: ‘How can a man dissent and conform at the same time?’ when all the world knows, or may, conformity consists of numerous parts; and is it such a miracle for a man to conform in some part and not in every part? Conscientiously to scruple constant entire conformity, and not scruple some part of it, at some time?”

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (Religious Tract Society, 1863), pp. 261-90, p. 289">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+1662%2C+the+same+spirit+and+sentiment+afresh+appeared%3B+when+most+of+the+considerable+ejected+London+ministers+met%2C+and+agreed+to+hold+occasional+communion+with+the+now+re-established+Church%E2%80%94not+quitting+their+own+ministry%2C+or+declining+the+exercise+of+it+as+they+could+have+opportunity.+And+as+far+as+I+could+by+inquiry+learn%2C+I+can+little+doubt+this+to+have+been+the+judgment+of+their+fellow+sufferers+through+the+nation%2C+in+great+part%2C+ever+since%E2%80%A6+any+one+of+common+sense+can+see+through+it%3B+such+as+that%3A+%E2%80%98How+can+a+man+dissent+and+conform+at+the+same+time%3F%E2%80%99+when+all+the+world+knows%2C+or+may%2C+conformity+consists+of+numerous+parts%3B+and+is+it+such+a+miracle+for+a+man+to+conform+in+some+part+and+not+in+every+part%3F+Conscientiously+to+scruple+constant+entire+conformity%2C+and+not+scruple+some+part+of+it%2C+at+some+time%3F%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+and+the+Trinity%E2%80%A6+%28Religious+Tract+Society%2C+1863%29%2C+pp.+261-90%2C+p.+289&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facb1ada085.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/acb1ada085.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-occasional-partial-conformity-or-moderate-puritanism/#:~:text=In%201662%2C%20the%20same%20spirit%20and,part%20of%20it%2C%20at%20some%20time&amp;text=In%201662%2C%20the%20same%20spi <blockquote><p>As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>

<blockquote><p>13. The points upon which the Lutheran Churches disagree with us are of two kinds. There are some upon which it is easier to reach agreement: such are the ceremonies of the Lutheran Churches, which may be excused and tolerated, because they concern decorum rather than necessity. Of the same sort also are certain opinions respecting the point of Predestination, upon which, I judge, one might easily draw up an article of the common confession that all would approve without difficulty, provided that curiosity be avoided—which, I believe, has already been done by the Confession of Augsburg [1530], which speaks of it soberly and expressly declines that question. There is also some difference concerning the necessity of baptism, which may rightly and reasonably be affirmed to be necessary to salvation — that is to say, that it is necessary for each person not to despise it — without pressing the question of necessity any further.</p></blockquote>

<blockquote><p>XVI. They are deceived then who make parallel distinctions of the Old and New Testament; of the Covenant of Works, and of Grace; of the Law, and Gospel: for in both, the Testament of Covenant is the Covenant of Grace; in both, the Law and Gospel are urged.

XVII. But the administration of the Old and New Testament differ first in time; because the Old Testament was exhibited before Christ; but the New is administered, Christ being now exhibition; that was to continue only till Christ, this forever. 2. In the place or amplitude, for that was proffered to the people of Israel only, this extends it self through all the world. 3. In clearness; because the free promises of Christ are more clearly preached in the New Testament, and confirmed, the shadows of Types and Ceremonies being abolished. 4. In facility; because the administration in the Old Testament, was more laborious than in the New. 5. In sweetness; for in the Old Testament, the perfect obedience of the Law is oftener urged, yet not excluding the promises of the Gospel; yet to that end, that they might be compelled to seek Christ by that rigorous exaction of obedience, as it were by a School-master: but in the new Testament, the promises of the Gospel are more frequent, yet not excluding the Law, which drives us to new obedience, to be performed by the grace of Regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 173-4.</span></figcaption>

</figure><figure class="quote" id="q-389a805b39" data-kw="">
<blockquote><p>Of Admonition, to take heed how we vilifie or contemne this Law of God, either doctrinally, or practically. Doctrinally, so the Marcionites, and the Manichees, and Basilides; whereof some have said, it was carnall, yea that it was from a Devil, and that it was given to the Jews for their destruction because it’s said to work wrath, and to be the instrument of death. And those opinions and expressions of the Antinomians about it are very dangerous. What, shall we revile that which is God’s great mercy to a people? Because the Jews and Papists do abuse the Law, and the works of it to justification, shall it not therefore have its proper place and dignity?

Take heed therefore of such phrases, An Old-Testament-spirit, and, His Sermon is nothing but an explication of the Law: For it ought much to rejoyce thee, to hear that pure and excellent image of Gods holiness opened. How mayest thou delight to have that purity enjoyned, which will make thee loath thy self, prize Christ and Grace more, and be a quick goad to all holiness? And if you say, Here is nothing of Christ all this while: I answer That is false, as is to be proved, if the Law be not taken very strictly: And besides, the Law and the Gospel are not to be severed, but they mutually put a fresh relish and taste upon each other. And shall no mercy be esteemed, but what is the Gospel? Thou art thankfull for temporall mercies, and yet they are not the Gospel; but this is a spiritual mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians</cite>, (London, 1647), pp 152-3 emphasis added.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-e111c0082b" data-kw="">
<blockquote><p>God is the just Judge of crimes, and if he did not exercise this justice, he would not be God. […] Third, the moral and ceremonial law itself establishes the same thing. Since the precepts of the former (as to a great part) are indispensable and founded upon the eternal and natural right of God, it is necessary that the penal sanction added to them should be of the same nature; also because (as has been shown before) there is a natural and necessary connection between sin and punishment, moral and physical evil, just as moral and physical good are mutually connected by an indissoluble bond. […]

Thus a magistrate would err, if by a too great indulgence he would dispense with the right of punishment as this would give impunity to crimes. Now the penal right of which we speak is not a positive but a natural right, founded on the very holiness and justice of God. It springs from the essential dependence of the creature (subjecting it to its Creator) both as to obedience by reason of precepts and as to punishment by reason of their sanction. It is not the private right of a creditor; for although sins are sometimes compared to debts, yet they are also crimes which cannot remain unpunished without prejudice to the laws. Rather it is the public right of a ruler because God does not punish as the offended part, but as Judge and the supreme ruler of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 238-9.</span></figcaption>

11c0082b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/08/23/francis-turretin-on-penal-sanctions-and-the-moral-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[B]y reason of despising salvation in this daylight of the gospel, we are in a most dangerous condition.

(1) Because sodomy is not so heinous a sin as unbelief, and the despising of the gospel (Matt. 10:15).

For evangelical unbelief is against the flower and garland (to speak so) of the excellency of God, not only against a Creator, but against a Saviour, and against those most lovely and soul ravishing attributes of God, His mercy, goodness, free grace, loganimity [long suffering], patience, bowels of compassion, and therefore an unbelieving covenanter with God in England and Scotland, is to look for a hotter furnace in the lake of fire and brimstone, than one of Sodom and Gomorrah.</p></blockquote>

<blockquote><p>Q. Of how many sorts is this Covenant?

A. In substance it is but one, but in regard of circumstance it is two: the Old Testament, and the New.

Q. What is the Old Testament?

A. It is the covenant of God, which (under types, figures, and shadows) did set forth Christ before his coming in the flesh; and by virtue whereof life everlasting was given by faith in Christ that was to come.

Q. What is the new Testament?

A. It is the covenant of God, which (since the coming of Christ in the flesh) hath abolished those shadows, &amp; giveth life everlasting by faith in Christ, that is come; by means whereof it is in a special respect called the Gospel. Coloss. 2.16.17.20. Hebr. 9.1.2.3. &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 168.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-645ce6a9aa" data-kw="">
<blockquote><p>But the Lord is not slack, or, delays not. He checks extreme and unreasonable haste by another reason, that is, that the Lord defers his coming that he might invite all mankind to repentance. For our minds are always prurient, and a doubt often creeps in, why he does not come sooner. But when we hear that the Lord, in delaying, shews a concern for our salvation, and that he defers the time because he has a care for us, there is no reason why we should any longer complain of tardiness. He is tardy who allows an occasion to pass by through slothfulness: there is nothing like this in God, who in the best manner regulates time to promote our salvation. And as to the duration of the whole world, we must think exactly the same as of the life of every individual; for God by prolonging time to each, sustains him that he may repent. In the like manner he does not hasten the end of the world, in order to give to all time to repent.

This is a very necessary admonition, so that we may learn to employ time aright, as we shall otherwise suffer a just punishment for our idleness.

Not willing that any should perish. So wonderful is his love towards mankind, that he would have them all to be saved, and is of his own self prepared to bestow salvation on the lost. But the order is to be noticed, that God is ready to receive all to repentance, so that none may perish; for in these words the way and manner of obtaining salvation is pointed out. Every one of us, therefore, who is desirous of salvation, must learn to enter in by this way.

But it may be asked, If God wishes none to perish, why is it that so many do perish? To this my answer is, that no mention is here made of the hidden purpose of God, according to which the reprobate are doomed to their own ruin, but only of his will as made known to us in the gospel. For God there stretches forth his hand without a difference to all, but lays hold only of those, to lead them to himself, whom he has chosen before the foundation of the world.

But as the verb χωρὢσαι is often taken passively by the Greeks, no less suitable to this passage is the verb which I have put in the margin, that God would have all, who had been before wandering and scattered, to be gathered or come together to repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 419-20.</span></figcaption>

</figure><figure class="quote" id="q-a6a1ba2e42" data-kw="">
<blockquote><p>Q. What is this new Covenant?

A. A free contract or Covenant between God and a sinner, concerning the pardon of sin, and life everlasting, through faith in Christ Jesus.

Q. When did this Covenant begin?

A. Immediately after the Fall. Gen. 3.15.

Q. What is specially to be considered in this Covenant?

A. First, the parts and sorts thereof: secondly, the ground and foundation.

Q. What are the parts thereof?

A. The mutual acts between God, and a sinner.

Q. What is the act on God’s part?

A. A free offer of salvation unto a sinner, upon this condition, that he will believe in Christ.

Q. What is the act on the sinners part?

A. An acceptance of this offer, by submitting to the condition.</p></blockquote>

</figure><figure class="quote" id="q-dddded87d4" data-kw="">
<blockquote><p>The indenture that the Son of God entered into with his Father, from eternity, in the counsel of peace, secures this spiritual kingdom. When God the Father gave a company of the lost race of Adam unto Christ, he engaged that he would set up his kingdom within them, repair his image, carry on the work of sanctification in them, till he had made them meet for glory; and that at the last day he would deliver up the kingdom to his Father, and say, Here am I, and the children thou hast given me; here I present them without spot, or wrinkle, or any such thing. And God the Father, upon this engagement and undertaking of his Son, promised that he should “prolong his days, and the pleasure of the Lord should prosper in his hand.” So that the counsel of peace between the Father and Son must come to nought, before this kingdom of God can be destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifth sermon on Luke 17:21 in The works of Ebenezer Erskine</cite></span></figcaption>

<blockquote><p>Q. What is the third rule?

A. When the Law forbiddeth or commandeth any thing, it forbiddeth and commandeth all means, occasions, and provocations thereunton.

Q. What is the fourth rule?

A. Whatsoever the Law commands, it forbids the contrary; whatsoever it forbids, it commandeth the contrary. […]

Q. Why are all the Commandments (except two) set down negatively?

A. Because the Negative bindeth more strongly: for the Negative precept bindeth always, and to all moments of time; the Affirmative bindeth always, but not to all moments of time.</p></blockquote>

<blockquote><p>In Psalm 68:31 we read, “Ethiopia [or Cush] shall soon stretch out her hands unto God.” The early Seceder, Ebenezer Erskine, interpreted this text as a prediction that the Gentile nations, including those in Africa, would enter into covenant with God:

The words read … are a declaration of the success of the gospel among the Gentile nations. Ethiopia, Egypt, and other places of the world, would submit unto his royal sceptre, when it should be swayed among them in the dispensation of the gospel, Princes shall come out of Egypt, Ethiopia shall soon stretch out her hands unto God. …

From which it appears, that Ethiopia, Scotland, and all the Gentile nations, and every individual among them is, by nature, in a most dismal and deplorable condition, without God, the chief good, without Christ, the only Saviour, without hope of salvation, without the true church, where life and immortality alone is brought to light; without God’s covenant of promise, which is the only charter of salvation; under the power of sin and Satan, the great enemy of their salvation; and, consequently, in a state of hostility against God. …

Lastly, This phrase of stretching out the hand to God implies an open profession of the faith in Christ, before the world, angels, men, and devils, which is sometimes called in Scripture an avouching of the Lord to be our God; and is sometimes done there by a person or people, with the solemnity of lifting up the hand, an ancient form of swearing, Rev. x. 5, 6, when the angel swore by him that liveth for ever and ever, he doth it with his hand lifted up to heaven.

So here, Ethiopia shall soon stretch out her hands unto God, that is, the inhabitants of Ethiopia, and of the Gentile nations, shall openly profess the God and Father of our Lord Jesus Christ to be their God, and they shall do it with the solemnity of an oath or covenant, as Israel they shall do it with the solemnity of an oath or covenant, as Israel did, Josh. xxiv. 22. When Joshua told them, “Ye are witnesses against yourselves, that ye have chosen you the Lord, to serve him.” And in this manner have we, in this land, and neighbouring nations, lifted up our hand to God, declaring him to be our God, and ourselves to be his people, although, alas! these covenants have been scandalously broken, burnt, and in a great measure buried. …

See from this doctrine, wherein the essence either of personal or national covenanting with God doth consist. Why, it just lies in following the example of Ethiopia, which stretched out the hand unto God, in a way of faith and solemn profession, that the God of Christ shall be their God, and that the Father of Christ shall be their Father; and that in the strength of the grace that is in Jesus, promised in a new covenant of grace, they will cleave unto him by a personal holy walk and conversation; and that, through grace, they will cleave unto the doctrine, discipline, worship, and government, that he has appointed in his house, in his holy oracles.

It must be a strange kind of spirit, that either sets his people on edge against such covenants, or turns them to an indifferency about the public work and cause of Christ, as if it were not worth the contending for, or suffering for. When God commands us to “contend for the faith delivered to the saints,” Jude iii., and to “stand fast in the liberty wherewith Christ hath made us free,” Gal. v. 1. It appears evidently to be a plot of hell for burying a testimony for our solemn covenants, and for the reformation of Scotland, and for our encouraging judicatories to go on in their course of backsliding from the Lord, and his work and way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ethiopia Stretching out Her Hands to God in The Works of Ebenezer Erskine</cite></span></figcaption>

<blockquote><p>Q. What is the Moral Law?

A. It is a Doctrine commanding the perfection of Godliness, and Righteousness, binding us to eternal death for our least defect therein; which Law is handled at large throughout the whole Scripture, but is summarily contained, first into ten words, or ten Commandments, written by God’s own finger at the first, in Tables of stone: to signify thereby, not only the hardness of our hearts, in which they ought to be imprinted; but also the perpetual use of them, to the very end of the world. And after, further abridged into two Commandments by our Saviour Christ, containing the sum of the whole Law.</p></blockquote>

<blockquote><p>What the Moral Law is, I will describe in three points: First, it is that part of God’s Word concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature: in regard whereof it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection; and outward in speech and action. Thirdly, it binds to the curse and punishment, every one that fails in the least duty thereof, though but once, and that in thought only: Gal. 3:10 Cursed is everyone that continues not in all things that are written in the Law, to do them. The sum of the Moral Law is propounded in the Decalogue, or Ten Commandments, which many can repeat, but few do understand.</p></blockquote>

<blockquote><p>Nowadays, it is a little understood fact that the orthodox Covenanter position is that most of the penal sanctions of the Old Testament are part of the moral law, and thus forever bind all people (Westminster Confession 19:5). Those who appeal to Westminster Confession 19:4 in an attempt to prove that such laws have expired have seriously misunderstood what the Confession is referring to. As Samuel B. Wylie explains below, there is a section of the judicial laws that were unique to Israel; these laws have expired so as not to bind us any further than there general equity may require. However, other judicial laws do not fall under this category but are simply conceived as being part of natural/moral law:

Whatsoever the law of God commands to be punished, ought to be punished with the penalties therein made and provided; but God has commanded gross heretics, blasphemers, and idolaters, to be punished with certain specified penalties. Therefore, such ought to be punished. These commands could not belong to the ceremonial law, for then they would have flowed entirely from the arbitrary will of God, and been mere signs between him and Israel. Who would dare to think so of gross heresy, &amp;c.? Neither could they belong to that part of the judicial law which respected the Jews peculiarly. Who would dare to say that none but the Jews were, or are, under obligation to worship God in purity, or abstain from blaspheming his nature and dignity? They must, therefore, belong to the moral law, and flow from the moral nature of Jehovah, who has declared he will not give his glory to another, nor his praise to graven images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 66.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Nowadays, it is a little understood fact that the orthodox Covenanter position is that most of the penal sanctions of the Old Testament are part of the moral law, and thus forever bind all people (Westminster Confession 19:5). Those who appeal to Westminster Confession 19:4 in an attempt to prove that such laws have expired have seriously misunderstood what the Confession is referring to. As Samuel B. Wylie explains below, there is a section of the judicial laws that were unique to Israel; these laws have expired so as not to bind us any further than there general equity may require. However, other judicial laws do not fall under this category but are simply conceived as being part of natural/moral law:

Whatsoever the law of God commands to be punished, ought to be punished with the penalties therein made and provided; but God has commanded gross heretics, blasphemers, and idolaters, to be punished with certain specified penalties. Therefore, such ought to be punished. These commands could not belong to the ceremonial law, for then they would have flowed entirely from the arbitrary will of God, and been mere signs between him and Israel. Who would dare to think so of gross heresy, &amp;c.? Neither could they belong to that part of the judicial law which respected the Jews peculiarly. Who would dare to say that none but the Jews were, or are, under obligation to worship God in purity, or abstain from blaspheming his nature and dignity? They must, therefore, belong to the moral law, and flow from the moral nature of Jehovah, who has declared he will not give his glory to another, nor his praise to graven images.”

— S. B. Wylie, The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis, (1803; York PA, 2002), p. 66.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNowadays%2C+it+is+a+little+understood+fact+that+the+orthodox+Covenanter+position+is+that+most+of+the+penal+sanctions+of+the+Old+Testament+are+part+of+the+moral+law%2C+and+thus+forever+bind+all+people+%28Westminster+Confession+19%3A5%29.+Those+who+appeal+to+Westminster+Confession+19%3A4+in+an+attempt+to+prove+that+such+laws+have+expired+have+seriously+misunderstood+what+the+Confession+is+referring+to.+As+Samuel+B.+Wylie+explains+below%2C+there+is+a+section+of+the+judicial+laws+that+were+unique+to+Israel%3B+these+laws+have+expired+so+as+not+to+bind+us+any+further+than+there+general+equity+may+require.+However%2C+other+judicial+laws+do+not+fall+under+this+category+but+are+simply+conceived+as+being+part+of+natural%2Fmoral+law%3A%0A%0AWhatsoever+the+law+of+God+commands+to+be+punished%2C+ought+to+be+punished+with+the+penalties+therein+made+and+provided%3B+but+God+has+commanded+gross+heretics%2C+blasphemers%2C+and+idolaters%2C+to+be+punished+with+certain+specified+penalties.+Therefore%2C+such+ought+to+be+punished.+These+commands+could+not+belong+to+the+ceremonial+law%2C+for+then+they+would+have+flowed+entirely+from+the+arbitrary+will+of+God%2C+and+been+mere+signs+between+him+and+Israel.+Who+would+dare+to+think+so+of+gross+heresy%2C+%26c.%3F+Neither+could+they+belong+to+that+part+of+the+judicial+law+which+respected+the+Jews+peculiarly.+Who+would+dare+to+say+that+none+but+the+Jews+were%2C+or+are%2C+under+obligation+to+worship+God+in+purity%2C+or+abstain+from+blaspheming+his+nature+and+dignity%3F+They+must%2C+therefore%2C+belong+to+the+moral+law%2C+and+flow+from+the+moral+nature+of+Jehovah%2C+who+has+declared+he+will+not+give+his+glory+to+another%2C+nor+his+praise+to+graven+images.%E2%80%9D%0A%0A%E2%80%94+S.+B.+Wylie%2C+The+two+sons+of+oil%3B+or%2C+the+faithf

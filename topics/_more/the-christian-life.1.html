<blockquote><p>Some had thought that your Love and Charity extended a little to[o] far beyond the Scripture-Rule in some Instances, such as Journal last p. 59. when you say, “The Quakers’ Notions about walking and being led by the Spirit, you think are right and good;” unless they be Quakers of another Stamp than the rest, whose dangerous Tenets are inconsistent with the right Notion of walking and being led by the Spirit, while, beside other Things, they deny Justification by the imputed Righteousness of CHRIST, or his active and passive Obedience received by Faith, to be the only Ground of Justification before GOD; and while thus they cannot receive CHRIST JESUS, they consequently cannot walk in him, nor be led by his Spirit, who is the Spirit of Truth, testifying of CHRIST, according to the Revelation made of him in the Word, which they contradict. Whatever Duties of Love you perform toward these Men, yet I’ll never believe you mean or intend to justify their Principles and delusive Notions, nor think well of them, till once the LORD convince and convert them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), p. 8.</span></figcaption>

</figure><figure class="quote" id="q-6509acec35" data-kw="">
<blockquote><p>Lastly, If ye have gotten Christ ye will be much employed about the work of mortification and self-denial. When Jesus comes unto a soul, He works in that soul much self-loathing and self-abhorrence. The soul that hath gotten Christ will say with the apostle, “Those things that I counted gain, I now count loss for Christ.”

This leads me to another point of doctrine, which is this: That the soul that is beloved of God, and for whom Christ hath given Himself, is much engaged in the exercise of self-denial. The apostle says not, “That the Lord loved me, and gave Himself for me, on account of anything that was in me;” but, “Christ loved me, and gave Himself for me, even me, who was a persecutor; for me, who was a blasphemer; for me, who was such and such.” How much, then, was this minister, Paul, engaged in the exercise of self-denial?

Again, you may observe that the soul that is loved of God, and for whom Christ hath given Himself, will be much in the exercise of mortification; or it is a duty lying on all those who are loved of God, and for whom Christ hath given Himself, to be much engaged in this work of mortification and self-denial. Ye must not think that this is only the work of ministers and men in eminent stations, to deny themselves; no, you have Jesus Christ Himself saying, “If any man will come after me, let him deny himself, and take up his cross, and follow me.” But that we may come to speak more particularly to the words, there is a threefold self that must be denied.

First, Natural self. Secondly, Sinful self. And, Thirdly, Regenerated and renewed self.

1. Natural self is the man consisting of the soul and body united. This a man must deny comparatively, or when it comes in competition with the glory of God and your own soul’s edification.

2. There is a sinful self, which is the old man, and unrenewed heart, with the affections and lusts. This sinful self we are to deny wholly and absolutely. We must not rest till we get all crucified and nailed to the cross of Christ. And,

3. There is a regenerate and renewed self—that is, the new man. This believers are to deny as to any merit in it. Indeed, believers should be seeking after more of the new man as their treasure; and they should make use of all means whereby they may be enabled so to hold it, that Satan and lust prevail not against it. There are some folk that deny the grace of the Spirit of God in this; but that which we press upon you hath these few things in it. And,

(1.) A knowledge of themselves. The man that would deny himself, must know himself. But,

(2.) As he must know himself, so he must loathe himself. And,

(3.) He sees vanity and emptiness in self. He sees that he is altogether insufficient of himself to do anything that is really good. The person that denies himself, as he is one who knows himself, and one who loathes himself, is a person that sees nothing in himself but emptiness, and has nothing in himself to trust unto in the matter of salvation. Therefore he must be denied to himself, and must lay the weight of his salvation upon another, even upon Christ. And there is this in self-denial, that as the man sees his own emptiness, so he is still emptying himself of all the old stuff. Old things must pass away, that all things may become new. So that if ye would know what self-denial is, it is even to throw all Satan’s household stuff out at the door, and have no more to do with it.

(4.) As ye must labour to cast out Satan’s stuff; so ye must labour to have these things of God’s providing brought in. Ye must have furniture brought from a far country; and ye must have it from home. Think not, Sirs, that these souls are denying themselves aright, that are crying down all that they have; unless they be also seeking the graces of God’s Spirit to replenish their souls.

In a word, to deny yourselves is to forsake all things in yourselves, when they come in competition with the glory of God; and to be still seeking furniture from above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-guthrie.html">William Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon XII in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

3. There is a regenerate and renewed self—that is, the new man. This believers are to deny as to any merit in it. Indeed, believers should be seeking after more of the new man as their treasure; and they should make use of all means whereby they may be enabled so to hold it, that Satan and lust prevail not against it. There are some folk that deny the grace of the Spirit of God in this; but that which we press upon you hath these few things in it. And,

(1.) A knowledge of themselves. The man that would deny himself, must know himself. But,

(2.) As he must know himself, so he must loathe himself. And,

(3.) He sees vanity and emptiness in self. He sees that he is altogether insufficient of himself to do anything that is really good. The person that denies himself, as he is one who knows himself, and one who loathes himself, is a person that sees nothing in himself but emptiness, and has nothing in himself to trust unto in the matter of salvation. Therefore he must be denied to himself, and must lay the weight of his salvation upon another, even upon Christ. And there is this in self-denial, that as the man sees his own emptiness, so he is still emptying himself of all the old stuff. Old things must pass away, that all things may become new. So that if ye would know what self-denial is, it is even to throw all Satan’s household stuff out at the door, and have no more to do with it.

(4.) As ye must labour to cast out Satan’s stuff; so ye must labour to have these things of God’s providing brought in. Ye must have furniture brought from a far country; and ye must have it from home. Think not, Sirs, that these souls are denying themselves aright, that are crying down all that they have; unless they be also seeking the graces of God’s Spirit to replenish their souls.

In a word, to deny yourselves is to forsake all things in yourselves, when they come in competition with the glory of God; and to be still seeking furniture from above.”

<blockquote><p>I believe that whatsoever is sin, and so called, whether it be original, or by birth, as transgression in the loins of Adam, &amp; the corruption that followed of it, which I bear about in my flesh: or whether it be actual sin, as thoughts, words, and wicked deeds, which spring from thence: I believe I say, that all that through faith, whereby I am engrafted and dwell in Christ, in the free and undeserved goodness of God, is freely forgiven me, and so freely, that all memory, as well of the fault, as of the punishment, like as if I had never sinned, or had no sin, is taken away from before God: and therefore I trust that I am now already blessed.</p></blockquote>

</figure><figure class="quote" id="q-0d4febb587" data-kw="">
<blockquote><p>Anyone would think that the deceased has been given enough praises, after we have celebrated his country, lineage, age, honours, and erudition, but these are merely disgraces and splendid vices if to them is not added an unfeigned love of God and neighbour. What good is proven argument concerning secret and obscure matters, the ignorance of which will not harm us in the last judgment? What good is it to be most diligent in asking questions but most negligent in rooting out vices and cultivating virtues? What good is arduous disputation about the Trinity if we lack submission and displease the Trinity?

One day before the divine tribunal the doctor of theology will not be asked so much what he read and how elegantly and neatly he spoke and wrote, but what he did and how he lived. O how greatly on that fearful day will he excel in understanding the penalty due to sinners, how well will he grasp its most accurate definition!

All those who are swollen with the vanity of knowledge and seek to be called doctors, magistrates, and great, illustrious, and honoured men, but are devoid of Christian charity, are the most foolish of all mortals and will be rejected and mocked by God and the inhabitants of heaven. That man alone is great who thinks often of his own smallness, and has great charity. That man is truly learned who pursues the will of God and neglects his own. The only knowledge worthy of love is to know and esteem Christ and him crucified, and to condemn all earthly things as loss and dung. To fear Jehovah, that alone is wisdom, and to depart from evil, that alone is understanding.</p></blockquote>

<blockquote><p>2. The anger, then, which in the Scripture is assigned to God, we say denotes two things:—

(1.) His vindictive justice, or constant and immutable will of rendering vengeance for sin. So God’s purpose of the demonstration of his justice is called his being “willing to show his wrath” or anger, Rom. ix. 22; so God’s anger and his judgments are placed together, Ps. vii. 6; and in that anger he judgeth, verse 8. And in this sense is the “wrath of God” said to be “revealed from heaven,” Rom. i. 18; that is, the vindictive justice of God against sin to be manifested in the effects of it, or the judgments sent and punishments inflicted on and throughout the world.

(2.) By anger, wrath, zeal, fury, the effects of anger are denoted: Rom. iii. 5, “Is God unrighteous who taketh vengeance?” … We say, then, anger is not properly ascribed to God, but metaphorically, denoting partly his vindictive justice, whence all punishments flow, partly the effects of it in the punishments themselves, either threatened or inflicted, in their terror and bitterness, upon the account of what is analogous therein to our proceeding under the power of that passion …

3. Properly, in the sense by him pointed to, anger, wrath, etc., are not in God. Anger is defined by the philosopher to be … “desire joined with grief of that which appears to be revenge, for an appearing neglect or contempt.” To this grief, he tells you, there is a kind of pleasure annexed, arising from the vehement fancy which an angry person hath of the revenge he apprehends as future, — which, saith he, “is like the fancy of them that dream,” — and he ascribes this passion mostly to weak, impotent persons. Ascribe this to God, and you leave him nothing else. There is not one property of his nature wherewith it is consistent. If he be properly and literally angry, and furious, and wrathful, he is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. …

(2.) The apostle tells us that God is “blessed for ever,” Rom. ix. 5; “He is the blessed and only Potentate” 1 Tim. vi. 15; “God all-sufficient,” Gen. xvii. 1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can he be blessed, is he all-sufficient, who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like? …

When we speak of the anger of God, his wrath, and his being appeased towards us, we speak after the manner of men; but yet by the allowance of God himself. Not that God is properly angry, and properly altered from that state and appeased, whereby he should properly be mutable and be actually changed; — but by the anger of God, which sometimes in Scripture signifieth his justice, from whence punishment proceeds, sometimes the effects of anger, or punishment itself, the obstacles before mentioned on the part of God, from his nature, justice, law, and truth, are intended; and by his being appeased towards us, his being satisfied as to all the bars so laid in the way of receiving us to favour, without the least alteration in him, his nature, will, or justice.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. The anger, then, which in the Scripture is assigned to God, we say denotes two things:—

(1.) His vindictive justice, or constant and immutable will of rendering vengeance for sin. So God’s purpose of the demonstration of his justice is called his being “willing to show his wrath” or anger, Rom. ix. 22; so God’s anger and his judgments are placed together, Ps. vii. 6; and in that anger he judgeth, verse 8. And in this sense is the “wrath of God” said to be “revealed from heaven,” Rom. i. 18; that is, the vindictive justice of God against sin to be manifested in the effects of it, or the judgments sent and punishments inflicted on and throughout the world.

(2.) By anger, wrath, zeal, fury, the effects of anger are denoted: Rom. iii. 5, “Is God unrighteous who taketh vengeance?” … We say, then, anger is not properly ascribed to God, but metaphorically, denoting partly his vindictive justice, whence all punishments flow, partly the effects of it in the punishments themselves, either threatened or inflicted, in their terror and bitterness, upon the account of what is analogous therein to our proceeding under the power of that passion …

3. Properly, in the sense by him pointed to, anger, wrath, etc., are not in God. Anger is defined by the philosopher to be … “desire joined with grief of that which appears to be revenge, for an appearing neglect or contempt.” To this grief, he tells you, there is a kind of pleasure annexed, arising from the vehement fancy which an angry person hath of the revenge he apprehends as future, — which, saith he, “is like the fancy of them that dream,” — and he ascribes this passion mostly to weak, impotent persons. Ascribe this to God, and you leave him nothing else. There is not one property of his nature wherewith it is consistent. If he be properly and literally angry, and furious, and wrathful, he is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. …

(2.) The apostle tells us that God is “blessed for ever,” Rom. ix. 5; “He is the blessed and only Potentate” 1 Tim. vi. 15; “God all-sufficient,” Gen. xvii. 1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can he be blessed, is he all-sufficient, who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like? …

When we speak of the anger of God, his wrath, and his being appeased towards us, we speak after the manner of men; but yet by the allowance of God himself. Not that God is properly angry, and properly altered from that state and appeased, whereby he should properly be mutable and be actually changed; — but by the anger of God, which sometimes in Scripture signifieth his justice, from whence punishment proceeds, sometimes the effects of anger, or punishment itself, the obstacles before mentioned on the part of God, from his nature, justice, law, and truth, are intended; and by his being appeased towards us, his being satisfied as to all the bars so laid in the way of receiving us to favour, without the least alteration in him, his nature, will, or justice.”

— John Owen, Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 111-12, 114-15, 533.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+anger%2C+then%2C+which+in+the+Scripture+is+assigned+to+God%2C+we+say+denotes+two+things%3A%E2%80%94%0A%0A%281.%29+His+vindictive+justice%2C+or+constant+and+immutable+will+of+rendering+vengeance+for+sin.+So+God%E2%80%99s+purpose+of+the+demonstration+of+his+justice+is+called+his+being+%E2%80%9Cwilling+to+show+his+wrath%E2%80%9D+or+anger%2C+Rom.+ix.+22%3B+so+God%E2%80%99s+anger+and+his+judgments+are+placed+together%2C+Ps.+vii.+6%3B+and+in+that+anger+he+judgeth%2C+verse+8.+And+in+this+sense+is+the+%E2%80%9Cwrath+of+God%E2%80%9D+said+to+be+%E2%80%9Crevealed+from+heaven%2C%E2%80%9D+Rom.+i.+18%3B+that+is%2C+the+vindictive+justice+of+God+against+sin+to+be+manifested+in+the+effects+of+it%2C+or+the+judgments+sent+and+punishments+inflicted+on+and+throughout+the+world.%0A%0A%282.%29+By+anger%2C+wrath%2C+zeal%2C+fury%2C+the+effects+of+anger+are+denoted%3A+Rom.+iii.+5%2C+%E2%80%9CIs+God+unrighteous+who+taketh+vengeance%3F%E2%80%9D+%E2%80%A6+We+say%2C+then%2C+anger+is+not+properly+ascribed+to+God%2C+but+metaphorically%2C+denoting+partly+his+vindictive+justice%2C+whence+all+punishments+flow%2C+partly+the+effects+of+it+in+the+punishments+themselves%2C+either+threatened+or+inflicted%2C+in+their+terror+and+bitterness%2C+upon+the+account+of+what+is+analogous+therein+to+our+proceeding+under+the+power+of+that+passion+%E2%80%A6%0A%0A3.+Properly%2C+in+the+sense+by+him+pointed+to%2C+anger%2C+wrath%2C+etc.%2C+are+not+in+God.+Anger+is+defined+by+the+philosopher+to+be+%E2%80%A6+%E2%80%9Cdesire+joined+with+grief+of+that+which+appears+to+be+revenge%2C+for+an+appearing+neglect+or+contempt.%E2%80%9D+To+this+grief%2C+he+tells+you%2C+there+is+a+kind+of+pleasure+annexed%2C+ari <blockquote><p>Thou sayest that amongst us there is respect of persons, that we prefer the wealthy; which, if they be liberal, although they be drowned in many vices, yet we use to heal up their sores, &amp;c.

I am assured that thy own conscience doth convict thee of a malicious lie, in thus writing; for thou canst not be ignorant what the city of Geneva hath of late years sustained for rooting our pestilent persons, who laboured to destroy the Lord’s vineyard planted in the same. And what was the cause that so they conjured against the liberty of Christ’s Evangel? The hatred, wilt thou and they say, which they did bear against strangers? I answer, But no mo[re] strangers were then in Geneva than were before, when the chief captains of that faction were most earnest professors of the Evangel, (in mouth I mean.) And in very deed, if they would have laboured to have expelled the strangers they had been enemies to their own commodity; for by the multitude of strangers their commonwealth doth flourish: and none did receive such benefits of strangers, as those that required Christ’s doctrine to be overthrown. …

The preachers called for reformation of manners. They boldly and sharply rebuked even those that were in highest authority. One of the chiefest of the band was excommunicated, and so did remain mo[re] years than one. The Consistory called for justice to be executed, and for the penalties to be appointed, for the inobedient and open contemners. But nothing could prevail; the multitude of the wicked was so great, that in votes and voices they did prevail. And so was great, that in votes and voices they did prevail.

And so was the iniquity of the wicked maintained for a long season. Which being considered, the godly as well that are native born, as also the strangers, consulted upon the next and surest remedy, and after that not only the most part of strangers were determined to depart, but that also faithful servant of Christ Jesus had in public sermon commended his flock, with the weeping eyes of many, to the protection and providence of God, and had publicly pronounced, that he would be no Minister in that church were vice could not be punished according to God’s word, where the wicked should triumph and make laws at their pleasure.

After this consultation, it was concluded that a reasonable number of strangers, whose fidelity and honest conversation had long been tried and well known, should be made burgesses, and free to have voice in Counsel, and in making civil statutes. Which being understand, the wicked began more manifestly to utter themselves: they opposed themselves to the magistrates, they plainly denied that any strangers should be free, they appealed to the greater Counsel; which being gathered, did justify the decree of the Sindiques (so the chief magistrates called.) Shortly after did the whole venom burst out: for after feasting and banqueting of all sorts of villains, was the conspiracy concluded and put in execution.

For with one consent they invade upon the night one of the chief magistrates: they cried victory and triumph, but God suddenly repressed that fury, so assisting, without the arm of man, his servant and lieutenant for that time appointed in that City, that first he recovered the ensign of his just and lawful office again; and thereafter so put to flight that rebellious and great multitude, that some being apprehended and committed to prison, the rest were disposed by the only power of God. For that is a thing most evident and plain, that the number of the one did in twenty degrees surmount the other.

This do I write, to let the simple reader understand, although thou be blinded, what was the original of the trouble which Geneva did after suffer. What did the strangers, I pray thee, gain by their liberty? As touching the world, I say nothing, for no kind of commodity they lacked before which after they did obtain, only this excepted, that in counsel they should have voices and place to speak: which thing also did only offend those oppressors of justice and maintainers of iniquity; for thereby did they perceive, that their enterprises should be broken, and that statutes should be made to reform their insolencie. To proceed, just being executed without respect of person upon those that were apprehended, the rest who did escape, to great number, were pronounced rebels.</p></blockquote>

<blockquote><p>That direction, in this kind, which with me is instar omnium, is for a diligent endeavour to have the power of the truths professed and contended for abiding upon our hearts, that we may not contend for notions, but what we have a practical acquaintance with in our own souls. When the heart is cast indeed into the mould of the doctrine that the mind embraceth; when the evidence and necessity of the truth abides in us; when not the sense of the words only is in our heads, but the sense of the things abides in our hearts; when we have communion with God in the doctrine we contend for, — then shall we be garrisoned, by the grace of God, against all the assaults of men.

And without this all our contending is, as to ourselves, of no value. What am I the better if I can dispute that Christ is God, but have no sense or sweetness in my heart from hence that he is a God in covenant with my soul? What will it avail me to evince, by testimonies and arguments, that he hath made satisfaction for sin, if, through my unbelief, the wrath of God abideth on me, and I have no experience of my own being made the righteousness of God in him, — if I find not, in my standing before God, the excellency of having my sins imputed to him and his righteousness imputed to me?

Will it be any advantage to me, in the issue, to profess and dispute that God works the conversion of a sinner by the irresistible grace of his Spirit, if I was never acquainted experimentally with the deadness and utter impotency to good, that opposition to the law of God, which is in my own soul by nature, with the efficacy of the exceeding greatness of the power of God in quickening, enlightening, and bringing forth the fruits of obedience in me? It is the power of truth in the heart alone that will make us cleave unto it indeed in an hour of temptation.

Let us, then, not think that we are any thing the better for our conviction of the truths of the great doctrines of the gospel, for which we contend with those men, unless we find the power of the truths abiding in our own hearts, and have a continual experience of their necessity and excellency in our standing before God and our communion with him.</p></blockquote>

</figure><figure class="quote" id="q-990982ce43" data-kw="">
<blockquote><p>They [true believers] had some knowledge of these things before by the teachings of men, but it was a bare, speculative, notional knowledge which they had in their heads; but now they are taught by the Spirit and attain to a spiritual, practical, experimental and heart-affecting knowledge of these things. Now they perceive a marvellous excellency in those things which before seemed foolishness to them (1 Corinthians 2:14).

They have a new eye, being anointed with the spiritual eyesalve, and all things now appear with a new face. Before, sin, with its paint and bait, appeared beautiful and desirable; and Christ, with His cross and yoke, seemed an enemy rather than a friend. They could not discern His form or comeliness, and therefore they undervalued and neglected Him. But now they have a discovery of the hook through the bait, and a discovery of the ugliness through the paint of sin. It now appears most dangerous and odious to them, and they have a discovery of the loveliness of Christ’s face and the ease of His yoke. He appears to them now as most precious and desirable.</p></blockquote>

ter</a></div>

<blockquote><p>Why should I deny that I fear for the Netherlands, and for the Church and Reformed truth, if we embrace a common principium with the Socinians, indeed, if we commend it more than those. Our interests have fallen to such an extent that Reason, as an Oracle, infallible, to be heard and adored with a humble and obsequious mind not otherwise than as the word of God Himself, is set forth openly, which it is not far from blasphemy to argue is of a lie; and at the same time are ridiculed those that admonish out of Clement that Hagar ought to be made subject to Sarah or to be ejected.

We have come to such a point that there are those that defend that those things that by reason are indubitable to us are not to be denied, even if we are not able to reconcile those things with Scripture; that those that, with their reason captivated, believe the Scripture are become beasts; that Theologians that, finding themselves to be no match for reasons, invoke the Scripture for help act incorrectly; that reason is not to be reconciled with Scripture, but Scripture with reason; that untroubled philosophizing is a must, and concerning the rest one must sleep idly upon either ear; that the infallibility of Reason is to be embraced, so that the authority of Scripture might be certain, because this is not able to be constructed from any other source than Reason.

The Doctors have advanced to such a point that they hold Reason to be the sole principium of all truth; that all love of God, reverence, obedience, and faith is derived from this source, and ought to be reduced to it; that here, and not elsewhere, the hope of blessedness finds its sacred anchor; that in fact, if even a bit be added to or subtracted from the dictate of Reason, its authority is injured. Why are you astonished, as if you have not confidence in the one narrating? You have undoubtedly read, or you all are able to read, almost all the words which I have recited, very recently written, and have known those that foster these hypotheses in their souls, and from time to time speak similar things.

But it is better that you be astonished at me, than that Socinian principia be heard in the Reformed Schools without restraint, the hurt of which the Church shall hereafter lament sooner or later. For you will not be able to give to me, nor I to name, anyone from the impure flock, who might not speak more reverently concerning Revelation, and more modestly concerning Reason. But even now the pious and true lovers are able to understand, indeed, all that do not close their eyes in the midst of light, what unwholesome fruit that bitter root of Reason will bear.

The Christian Religion, before its truth is made evident by particular and most certain arguments (how many and who, I ask, of children, foolish women, and private men, arrive at that?),is said to be held in no better position that the Turkish, or Pagan, or Jewish. The single Omnipresence of God is learned from chimeras of the Scholastics, and is a fictitious attribute; the simplicity of God is called into doubt; the liberty of God and the eternity of the Decrees of God are set against each other; arguments for Deity, if they be disjoined from our idea of God, are invalid; miracles are attributed to natural causes; rational creatures are judged to be masters of their own actions; nothing ought to be placed outside of the will that might determine it; the working of God is not to be understood as through the mode of predetermination; the mysteries of the Trinity and of the Incarnation are to be removed from the fundamentals; the corruption of the human nature does not pertain to the mind or its faculties, but unto its use, act and habit; the activities of angels, by which their existence most forcefully demonstrated from the earliest times, are fabricated fables; the state of souls is changed in death, but they do not exchange the dwelling of earth with heaven; a disputation is brought against the infernal region, neither from any appearance of truth is it thought to be unsuitable that after the day of judgment the impious are going to dwell on this earth, and perhaps are going to abound in external goods.

Rejoice, ye impious, and let Epicurus be held as vile among you, who did not promise such things. But what do these and all similar things elicit from me and from all good men, except the most ardent sighings after God, that He might be willing to take pity on Zion, and to attend upon His own glorious name; except supplications to you, Most Distinguished Nobles, that you from your chairs of authority might prevent the dictate of proud reason; except fraternal rousing to you, Most Illustrious Colleagues and Reverend Co-laborers in the Lord, that we might together oppose the advancing madness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-marck.html">Johannes Marckius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oratione quarta post Exercitationes Miscellaneas</cite>, held at Groningen in 1688, pp 474-77. Quoted in Bernardinus de Moor, Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 32, pp 226-28.</span></figcaption>

ll+truth%3B+that+all+love+of+God%2C+reverence%2C+obedience%2C+and+faith+is+derived+from+this+source%2C+and+ought+to+be+reduced+to+it%3B+that+here%2C+and+not+elsewhere%2C+the+hope+of+blessedness+finds+its+sacred+anchor%3B+that+in+fact%2C+if+even+a+bit+be+added+to+or+subtracted+from+the+dictate+of+Reason%2C+its+authority+is+injured.+Why+are+you+astonished%2C+as+if+you+have+not+confidence+in+the+one+narrating%3F+You+have+undoubtedly+read%2C+or+you+all+are+able+to+read%2C+almost+all+the+words+which+I+have+recited%2C+very+recently+written%2C+and+have+known+those+that+foster+these+hypotheses+in+their+souls%2C+and+from+time+to+time+speak+similar+things.%0A%0ABut+it+is+better+that+you+be+astonished+at+me%2C+than+that+Socinian+principia+be+heard+in+the+Reformed+Schools+without+restraint%2C+the+hurt+of+which+the+Church+shall+hereafter+lament+sooner+or+later.+For+you+will+not+be+able+to+give+to+me%2C+nor+I+to+name%2C+anyone+from+the+impure+flock%2C+who+might+not+speak+more+reverently+concerning+Revelation%2C+and+more+modestly+concerning+Reason.+But+even+now+the+pious+and+true+lovers+are+able+to+understand%2C+indeed%2C+all+that+do+not+close+their+eyes+in+the+midst+of+light%2C+what+unwholesome+fruit+that+bitter+root+of+Reason+will+bear.%0A%0AThe+Christian+Religion%2C+before+its+truth+is+made+evident+by+particular+and+most+certain+arguments+%28how+many+and+who%2C+I+ask%2C+of+children%2C+foolish+women%2C+and+private+men%2C+arrive+at+that%3F%29%2Cis+said+to+be+held+in+no+better+position+that+the+Turkish%2C+or+Pagan%2C+or+Jewish.+The+single+Omnipresence+of+God+is+learned+from+chimeras+of+the+Scholastics%2C+and+is+a+fictitious+attribute%3B+the+simplicity+of+God+is+called+into+doubt%3B+the+liberty+of+God+and+the+eternity+of+the+Decrees+of+God+are+set+against+each+other%3B+arguments+for+Deity%2C+if+they+be+disjoined+from+our+idea+of+God%2C+are+invalid%3B+miracles+are+attributed+to+natural+causes%3B+rational+creatures+are+judged+to+be+masters+of+their+own+actions%3B+nothing+ought+to+be+placed+outside+of+the+will+that+might+determine+it%3B+the+working+of+God+is+not+to+be+understood+as+through+the+mode+of+predetermination%3B+the+mysteries+of+the+Trinity+and+of+the+Incarnation+are+to+be+removed+from+the+fundamentals%3B+the+corruption+of+the+human+nature+does+not+pertain+to+the+mind+or+its+faculties%2C+but+unto+its+use%2C+act+and+habit%3B+the+activities+of+angels%2C+by+which+their+existence+most+forcefully+demonstrated+from+the+earliest+times%2C+are+fabricated+fables%3B+the+state+of+souls+is+changed+in+death%2C+but+they+do+not+exchange+the+dwelling+of+earth+with+heaven%3B+a+disputation+is+brought+against+the+infernal+region%2C+neither+from+any+appearance+of+truth+is+it+thought+to+be+unsuitable+that+after+the+day+of+judgment+the+impious+are+going+to+dwell+on+this+earth%2C+and+perhaps+are+going+to+abound+in+external+goods.%0A%0ARejoice%2C+ye+impious%2C+and+let+Epicurus+be+held+as+vile+among+you%2C+who+did+not+promise+such+things.+But+what+do+these+and+all+similar+things+elicit+from+me+and+from+all+good+men%2C+except+the+most+ardent+sighings+after+God%2C+that+He+might+be+willing+to+take+pity+on+Zion%2C+and+to+attend+upon+His+own+glorious+name%3B+except+supplications+to+you%2C+Most+Distinguished+Nobles%2C+that+you+from+your+chairs+of+authority+might+prevent+the+dictate+of+proud+reason%3B+except+fraternal+rousing+to+you%2C+Most+Illustrious+Colleagues+and+Reverend+Co-laborers+in+the+Lord%2C+that+we+might+together+oppose+the+advancing+madness%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Johannes+Marckius%2C+Oratione+quarta+post+Exercitationes+Miscellaneas%2C+held+at+Groningen+in+1688%2C+pp+474-77.+Quoted+in+Bernardinus+de+Moor%2C+Continuous+Commentary+on+Johannes+Marckius%E2%80%99+Didactico-Elenctic+Compendium+of+Christian+Theology.+Volume+1%3A+Concerning+the+Word+and+Definition+of+Theology%2C+trans.+Steven+Dilday+%281761%3B+Central+SC%3A+From+Reformation+to+Reformation+Translations%2C+2017%29%2C+Ch.+1%2C+%C2%A7+32%2C+pp+226-28.&amp;url=https%3A%2F%2F5solasquotes.github. </figure><figure class="quote" id="q-de0d21dee6" data-kw="">
<blockquote><p>1st, An invitation to all persons in all places, to come and receive Jesus Christ, the King of kings, Lord of lords, and Prince of peace, who is even among our hands in the gospel, wherein He manifests Himself. Now that He offers Himself, take Him, and you are welcome to Him. Any person who hath anything ado with Him, come; for He is now seeking employment to be given Him. He hath balms for all wounds, salves for all sores, and cures for all sorts of diseases. And,

2ndly, There are some objections against this coming, and these He solves, and uses various motives and invitations to encourage souls to come unto Him and buy. Such are the following:—

1. The market is free. He is seeking nothing from you, but hath all glorious things to give you. Therefore, ye are fools if ye will not come and take when ye have nothing to give.

2. If ye will not come, your well-doing is over. Your doom is, “Depart for ever;” and do what ye can, ye shall not prosper, nor get any soul-satisfaction any other way. And,

3. If ye will come, ye need not be afraid of wrath and justice. Ye shall not have that to say that ye dare not come for fear He execute justice upon you. The Father took Christ Jesus to be your Cautioner or Surety. Christ shall stand for you and manage in your room or stead. He will manage all that concerns you, both with regard to the guilt and the pollution of sin; for the punishment of sin, if ye will but accept of Him to be your Cautioner or Surety, He shall answer for all your wrongs, as if they had been done in His own person, and He shall stand for them, and ye shall go free. And,

4. Ye may think it a great honour and prerogative that ever the like of you is allowed to come near Christ, instead of saying ye will not come unto Him. For God hath a mind to make Him unspeakably honourable in His kingdom, think ye of Him what ye will. For many shall come out of all kindreds, kingdoms, and nations, like flocks of sheep, and shall cast down their crowns at His footstool, even those that have never yet heard of Him; and what a shame will it be for you to be the last of all in paying your respects to Him?

5. If ye will not come and close with Him now in the offers of the gospel, wherein He is offered unto you, take care that ye sit not your time of the market; for there is but a set time of His offers, wherein He will be found of you.</p></blockquote>

<blockquote><p>The Son of God manifested in the flesh is named Jesus, because he hath saved us, through his desert, and yet still saveth us by his power from all our sins. Matt. 1. Acts 4. Hebr. 7. … As often as I hear therefore the name of Jesus, I ought to remember the promise of the Gospel that lieth hid in it: that he through his merit, hath saved me from my sins, and by his power, mortifieth the remnants of sin in me, until he fully deliver me from them: that he also quickeneth me through his holy spirit, and that he everlastingly keepeth for me that same salvation purchased with so great a price, 1 Pet. 1. And so he beareth that worthy name for my sake, which was given unto him by the father from heaven, that he might shew the truth of his name, in truth and effectually as well in my salvation, as in the salvation of all believers. He is faithful that beareth that notable name of saviour, and he that hath promised, shall do it.</p></blockquote>

<blockquote><p>If Christ be, by the gift of the Father, King of nations, then are nations, then are nations bound by the highest obligations to acknowledge him as their Lord. If nations have been given to Jesus Christ to be ruled by him, then are they bound to assent to the gift, and surrender themselves to him as voluntary subjects. To refuse, is to rebel against the express command, Ps. ii. 12, “kiss ye the Son.” It dishonours the Father; for it is a refusal to serve him in that way in which he has commanded service to be rendered. It dishonours the Son; for it is a rejecting of his just authority. Such conduct involves in it a stubborn refusal to repent and turn from sin (for there is no “repentance toward God” without “faith toward Jesus Christ;”) excludes a nation from any interest in the Covenant protection and favour of God; and subjects it to the infliction of the threatenings denounced against impenitent nations. The wrath of the Lord Jesus Christ will be kindled, and he will inevitably cause that nation to “perish from the way.” He will vindicate his own righteous claims.

Nor can the threatening be evaded by an acknowledgment, however sincere, of allegiance to an absolute God. “No man,” says Christ himself, “cometh to the Father but by me.” Any attempt to honour the Father, while the Son is neglected, is an abomination in his sight. However lightly men may esteem the royal prerogatives of the Messiah, they are not held of little value by him “by whom actions are weighed.” Nothing short of an open acknowledgment of Jesus Christ will meet his claims. This must be rendered under pain of God Almighty’s sore displeasure. “The kingdoms of this world must become” not only “kingdoms of our Lord,” but also “of his Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia, 1842), pp 46-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-28472d13d7" data-kw="">
<blockquote><p>To have a scrupulous conscience about matters of indifference argues a weak Christian; for so the Apostle calls them “weak in the faith,” such as bound conscience when Scripture left it free. One believer thought he might eat anything, and another doubted the lawfulness of eating sundry things. Now those who doubted, the Apostle called weak; and the weak conscience is apt to be defiled. Not to know our liberty, and to abuse our liberty, is an argument we have but little grace. Young converts call more things sins than ever God did; they perplex and entangle themselves merely in indifferent things. It is true, there ought to be a conscientious tenderness in all Christians; tenderness of conscience is our duty, but a tormenting, entangling scrupulosity is our infirmity. And yet, as a weak Christian is better than no Christian, a weak faith is better than a seared conscience.</p></blockquote>

<blockquote><p>(6) The secrecy of the lodge is inimical to the Church.

The Church is an open society, and the formation of secret fraternities within her ranks is destructive of the glorious liberty wherewith Christ has made her free. It sets up false and unchristian distinctions between those of whom Jesus says, “All ye are brethren,” and it takes away that mutual confidence and trust which are essential to true Christian brotherhood, but which cannot flourish in the atmosphere of secrecy. The secrecy of the lodge is opposed to the communion of saints. The lodge-bound Christian is compelled to favour a brother in the lodge who may be an unbeliever, even to the injury of a brother in Christ. There are many other ways in which secret orders antagonize the Church, but we are now speaking only of secrecy. Secrecy is a principle of evil which belongs to the kingdom of darkness, and is renounced by Him who says: “I am the light of the world.” … “Ye are the light of the world.” … “Walk as children of light.” As our Church Covenant says, all such organizations are “ensnaring in their nature, pernicious in their tendency, and perilous to the liberties of both Church and State.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/r-j-george.html">R. J. George</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures in pastoral theology</cite>, (3 vols, New York, 1917), iii, 277.</span></figcaption>

<blockquote><p>Although Covenanters have traditionally dissented from recognising immoral civil governments as the ordinance of God for our good, nevertheless, they have always sought the prosperity of their nations. For this reason the American Covenanter, R. J. George, reasoned that secret societies should be avoided by Christians partly because they are a danger to the good of the state. His comments are very relevant to organisations such as the Freemasons and the Orange Order:

(5) The secrecy of the lodge is prejudicial to the State.

It is frequently said in defense of secretism that the State itself has secrets: that there could be no diplomacy without secrecy: that it would be impossible to conduct a successful war without secrecy. So far as the privacy is that of true statesmanship, dealing with genuine State secrets, it is inherent in the State as a divine institution, and, just as in the case of the family, the secrecy of the lodge is its deadly enemy, because it invades that privacy and, for sinister ends, betrays it. The argument from the secret councils of war is an unfortunate one for the advocates of the lodge, because it calls attention to the fact that they are at war with human society and are using against their unoffending fellow citizens the stratagem which war justifies only against an enemy. But the secrecy of the lodge is perilous to the State. Scarcely a government of the old world but has been shaken by them. At the present time they endanger the stability of our own government. They manipulate our elections; they tamper with our courts of justice; they invade the jury box and turn aside righteous judgment; they engender strikes and riots and endanger life; and are a constant menace to the peace and good order of society. In time of war their ramifications may bind them by oath to citizens of our enemy country.</p></blockquote>

<blockquote><p>If we consider the position of the Christian man we can have no difficulty admitting that Christ has a right to rule over him, for he is Christ’s by the right of creation, of the Father’s covenant gift, of redemption, and of the new creation. And in this case, as in all other cases, the authority is over the whole man without any limitation or modification whatsoever. The man is literally not his own – his own master or his own property. Above him and around him, to meet him in every upward and outward movement of his life, there are the union, was called non-essential, and that is now treated as non-existent. Thus there is a species of unity secured, but it is a unity with diminished attachment to the Saviour’s truth. Probably this thought about non-essential doctrines is connected in men’s minds or in their professions with the intention of advancing more effectually some doctrine or principle that is called essential. But Christ does not require any individual under heaven to let go one doctrine of the Christian system in order the better to promote the acceptance of another. It is not true thought but sentimental blundering that makes any one suppose such a thing possible. And it is not true morality or true obedience which can call any part of Christ’s truth non-essential: it is disobedience and immorality.

The folly of it and the presumption of it can be discerned at once if we lay it bare by simply supposing the sinner presenting the distinction to Christ Himself. Christ gives His word, and says to the sinner, “This is My will. If a man love Me he will keep My words.” And the sinner replies, “Yes, Lord, this is Thy word, I admit; but there are many things in it that I need not profess or hold; there are doctrines that will greatly hinder Evangelistic work; they are not essential. I will hold all the essential doctrines, and it will be far better to say nothing at all about the rest; Thy work will go on much more successfully if I select the most popular doctrines and so avoid exciting prejudice.” We can hardly suppose any man daring enough to speak to Christ in this way. And yet precisely in this way, though, of course, in a different form, many a man speaks of Christ’s truth to his fellow-men, and they agree among themselves to the deliberate mutilation of that body of truth which the Saviour authoritatively reveals, and which He has commanded His servants to maintain and defend even unto death.

He has revealed no truth that is not essential for His purpose; and His purpose in giving the truth must be our purpose in receiving and professing it. There is not a trace of hint or suggestion in His Word itself that any man in any age of the world may for any purpose profess and maintain one truth less than Christ has revealed. Such a hint would be on Christ’s part the virtual renunciation of His authority. And no man can adopt such a distinction among the doctrines of Christ without first renouncing Christ’s authority in general, and then renouncing the authority that is behind the particular doctrines rejected. Christ requires authoritatively the acceptance and maintenance of all the doctrines of His revealed will, and all His authority is in every single doctrine. The duty of every individual Christian is to listen reverently to every word that Christ speaks, to learn, and to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life.html">The Christian Life</a></span></div>

</figure><figure class="quote" id="q-6207670160" data-kw="">
<blockquote><p>Even in Evangelical Churches at this moment men professing subjection to Christ are madly thrusting aside His authority, and subjecting the Church to human caprice. Doctrines and rites and practices for which no Divine warrant can be pleaded are multiplying in the Visible Church. Some so-called Protestant Churches are almost as Ritualistic and idolatrous and disobedient to Christ as Rome itself. And other Protestant Churches are following. There is a kind of procession – Rome leading the way, then Prelatic ritualism close behind, but rapidly shortening their distance, and then other Presbyterian Churches being drawn in because they admire the glitter and pomp of the precession without waiting to consider what is the beginning of it all and what is the end of it all. And while all this is going on Christ is standing by and saying, “Who hath believed our report? And to whom is the arm of the Lord revealed?” “All day long I stretched forth My hands unto a disobedient and gainsaying people.</p></blockquote>

</figure><figure class="quote" id="q-3824a8e368" data-kw="">
<blockquote><p>Now, brethren, concerning the coming of our Lord Jesus Christ and our gathering together to Him, we ask you, not to be soon shaken in mind or troubled, either by spirit or by word or by letter, as if from us, as though the day of Christ had come. 2 Thessalonians 2:1-2.

The opposite to this [doctrinal stability] is levity and inconstancy of mind, that soon quitteth truth without difficulty, or without much hesitancy and resistance yields to the temptation. The scripture often taketh notice of this sudden embracing of error: Gal. i. 6, ‘I marvel that ye are so soon removed from him that called you into the grace of Christ unto another gospel;’ and in the text, ‘soon shaken in mind.’ Credulity is a lightness in believing, when we are like reeds shaken with every wind, Mat. xi. 7, and have a faulty easiness, ready to be carried away with every doctrine which pretendeth to truth: ‘The simple believeth every word,’ Prov. xiv. 15. There is a readiness of mind which is good, but it goeth on sufficient evidence; so ‘the wisdom that is from above is gentle, and easy to be entreated,’ James iii. 17; and the Bereans were πρόθυμοι: Acts xvii. 11, ‘They received the word with all readiness of mind, and searched the scriptures, whether these things were so or no.’ But a readiness of mind differs from a weakness of mind, or a lightness in believing upon slender and insufficient grounds: they never receive the truth with thorough efficacy, and are prone to error.

4. The causes of this instability and inconstancy of mind are these:—

[1.] Lack of solid rooting in the truth; they receive it hand-over-head, as the stony ground forthwith sprang up: Mat. xiii. 5, 20, ‘Anon they receive it with joy;’ they do not so soon receive the word, but they as soon quit it.

[2.] Lack of mortification: 2 Tim. iv. 10, ‘Demas hath forsaken us, having loved this present world.’ Lusts are uncertain; fear of men, favour of men, carnal hopes will easily prevail.

[3.] A certain readiness of mind which disposeth men to conform and comply with their company, as the looking-glass representeth every face that looketh on it; so they are very changeable, and unstable as water; as Zedekiah, Jer. xxxviii. 5, ‘The king is not he that can say you nay;’ soon turned this way and that way.

[4.] Want of a thorough inclination to God, so that they are right for a while, or in some things, yet they are not universally true to his interest: 1 Kings ii. 28, ‘Joab turned after Adonijah, though he turned not after Absolom;’ Hosea vii. 8, ‘Ephraim is a cake not turned.’

[5.] Want of holiness and living up to the truths we know: 1 Tim. iii. 9, ‘Holding the mystery of faith in a pure conscience.’ Choice liquors are best kept in a clean vessel; men provoke God to desert them and leave them to a giddy spirit.

[6.] Libertinism. Men think they may run from one sect of Christians to another, as the wind of interest bloweth. If they were to turn to Ethnicism, Turcism, or Judaism, they would die rather than change their religion; but they think the differences among Christians are not of such moment as to venture anything upon that account. Every truth is precious, and must be owned in its season, and it is damnable in itself to do anything against conscience, and he that giveth way to a small temptation will entertain a greater; as a man that hangeth over a precipice, when he lets go his hold, will sink further and further till he come to the bottom; therefore, it is good to be faithful in a little.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 20-1.</span></figcaption>

<blockquote><p>It matters not that many will judge us too precise for doing so. What? Do they think this preciseness any other than that which the law of God requireth, even observing of the commandment of God, without adding to it, or diminishing from it, Deut. xii. 32; and keeping the straight path, without declining to the right hand or to the left? Deut. xxviii. 14 […] Are we more precise than Daniel, who would not close his window when he was praying, no, not for the king’s edict, knowing, that because he had used to do so aforetime, his doing otherwise had been both a denying of his former profession, and an ensnaring of himself by yielding in small things, to yield in greater, and after an inch to take an ell? Dan. vi. 10. Are we more precise than that Apostle Paul who gave no place to the adversaries of Christian liberty, no, not for an hour? Gal. ii. 5.</p></blockquote>

<blockquote><p>For if there were no God, no republic, no society in the world would be safe. Without virtue, without religion, nothing can be safe. If there were no God, there would be neither virtue nor religion. What would the world be but a mere den of robbers in which license would be each one’s law, no such thing as right or wrong, no right of government, no necessity of obedience – the most abandoned, the superior and the most powerful, the master? No check would be placed upon the oppression of rulers and the rebellion of subjects. Each one would follow the bent of his own inclination. Again, if there were no God, no mortals would even for a moment be safe or secure from violence, fraud, perjury, slaughter of blood. Every hour everything would have to be feared. Take away the barriers of divinity and what would become of the confidence and innocence? What licence or violence would not be witnessed? As to human edicts (besides the fact that they cannot change the mind for the better, but on the contrary make it artful and intent upon all the arts of deception), what place would there be for human laws, if (the sense of deity being removed) the conscience would shake off all relations of justice and injustice?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For if there were no God, no republic, no society in the world would be safe. Without virtue, without religion, nothing can be safe. If there were no God, there would be neither virtue nor religion. What would the world be but a mere den of robbers in which license would be each one’s law, no such thing as right or wrong, no right of government, no necessity of obedience – the most abandoned, the superior and the most powerful, the master? No check would be placed upon the oppression of rulers and the rebellion of subjects. Each one would follow the bent of his own inclination. Again, if there were no God, no mortals would even for a moment be safe or secure from violence, fraud, perjury, slaughter of blood. Every hour everything would have to be feared. Take away the barriers of divinity and what would become of the confidence and innocence? What licence or violence would not be witnessed? As to human edicts (besides the fact that they cannot change the mind for the better, but on the contrary make it artful and intent upon all the arts of deception), what place would there be for human laws, if (the sense of deity being removed) the conscience would shake off all relations of justice and injustice?”

— Francis Turretin, Institutes of elenctic theology, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 176.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+if+there+were+no+God%2C+no+republic%2C+no+society+in+the+world+would+be+safe.+Without+virtue%2C+without+religion%2C+nothing+can+be+safe.+If+there+were+no+God%2C+there+would+be+neither+virtue+nor+religion.+What+would+the+world+be+but+a+mere+den+of+robbers+in+which+license+would+be+each+one%E2%80%99s+law%2C+no+such+thing+as+right+or+wrong%2C+no+right+of+government%2C+no+necessity+of+obedience+%E2%80%93+the+most+abandoned%2C+the+superior+and+the+most+powerful%2C+the+master%3F+No+check+would+be+placed+upon+the+oppression+of+rulers+and+the+rebellion+of+subjects.+Each+one+would+follow+the+bent+of+his+own+inclination.+Again%2C+if+there+were+no+God%2C+no+mortals+would+even+for+a+moment+be+safe+or+secure+from+violence%2C+fraud%2C+perjury%2C+slaughter+of+blood.+Every+hour+everything+would+have+to+be+feared.+Take+away+the+barriers+of+divinity+and+what+would+become+of+the+confidence+and+innocence%3F+What+licence+or+violence+would+not+be+witnessed%3F+As+to+human+edicts+%28besides+the+fact+that+they+cannot+change+the+mind+for+the+better%2C+but+on+the+contrary+make+it+artful+and+intent+upon+all+the+arts+of+deception%29%2C+what+place+would+there+be+for+human+laws%2C+if+%28the+sense+of+deity+being+removed%29+the+conscience+would+shake+off+all+relations+of+justice+and+injustice%3F%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+elenctic+theology%2C+trans.+G.+M.+Giger%2C+ed.+J.+T.+Dennison+%281679%3B+3+vols%2C+Philipsburgh%2C+1992%29%2C+i%2C+176.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb17f48408f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b17f48408f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/05/31/francis-turretin-on-libertarian-atheism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-747f77bf98" data-kw="">
<blockquote><p>Here followeth now the second part of the magistrates’ ordinance, which consisteth in making good laws for the preservation of honesty, justice, and public peace; which is likewise accomplished in good and upright laws. But some there are who think it mere tyranny to lay laws on free men’s backs, as it were a yoke upon necks not used to labour; supposing that every one ought rather to be left to his own will and discretion. The apostle indeed did say, “The law is not given for the just, but for the unjust:” but the cause, why the law is not given to the just, is because he is just; for the just worketh justice, and doth of his own accord the thing which the law exacteth of every mortal man. Wherefore the law is not troublesome to the just man, because it is agreeable to the mind and thoughts of upright livers, who do embrace it with all their hearts. But the unjust desireth nothing more than to live as he lusteth: he is not conformable in any point to the law, and therefore must he by the law be kept under, and bridled from marring himself and hurting other.

So then, since to good men the laws are no troublesome burden but an acceptable pleasure, which are also necessary for the unjust, as ordained for the bridling of lawless and unruly people; it followeth consequently, that they are good and profitable for all men, and not to be rejected of any man. What may be said of that, moreover, that God himself, who did forsee the disposition of us men, what we would be, and hath still favoured the true liberty which he desired always to have preserved among his people, as one that ever meant them good, and never did ordain the thing that should turn to their hinderance or discommodity; that God himself (I say) was their lawgiver, and hath not suffered any age at any time to live as people without a law? Yea too, those commonweals have been happy always, that have admitted laws, and submitted themselves to be governed by laws; when as, contrarily, those kingdoms have of all other been most miserable, and torn in pieces by civil dissensions and foreign enemies, which, having banished upright laws, did strive to maintain their own kind of freedom, their uncontrolled dealing and licentious liberty, that is, their beastly lust and uncivil rudeness. Good laws therefore are for the health and preservation of the people, and necessary for the peace and safeguard of commonweals and kingdoms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 337-8.</span></figcaption>

<blockquote><p>Seventhly, that a community or whole society is more to beloved than any member of it, because the conjunction of a part with the whole is greater than with another party; and therefore, that a prince whose life and safety is necessary or most profitable for the common good, is more to beloved then any or divers of the common people, nay more then our selves in temporal things. 2 Sam. 21.17.</p></blockquote>

</figure><figure class="quote" id="q-44144bd6cf" data-kw="">
<blockquote><p>For that, I shall desire you to consider that Jesus Christ is the only Head and King of his Church, that the government of his Church is a part of his Kingly office; that the government is committed into his hand, and the key of the house of David is laid upon his shoulders (Isa. 22:21-22); that the Father has set him as King upon his holy hill of Zion (Ps. 2:6), to reign over the house of Jacob for ever, and of his kingdom there shall be no end (Luke 1:33). As therefore he has fully and faithfully exercised his Priestly office in making atonement for our sins by the sacrifice of himself, and still making intercession in heaven for us; and his Prophetical office in revealing the whole counsel of God, and teaching his people by his word and Spirit, what he would have them to do; so he has no less fully and faithfully executed his Kingly office and legislative power, in providing statutes and ordinances for all the necessities of his Church; and appointing by whom and after what manner he will have his house governed, what spiritual courts and judicatories he would have erected, how he would have them constituted, by what rules to proceed, how to censure offenses. It is an old observation – they are the best laws, which leave the least to the power of the judge to do as he list [will]. It were a bad administration of the supreme power in any kingdom, if no certain kinds of subordinate officers, nor no certain kind of government were appointed, but all this left to the liberty of every country and city. Now Jesus Christ is more wise, and provident, and faithful, in the government of his whole Church, than ever King or Parliament was in the government of an earthly kingdom; and has therefore appointed officers, courts, censures, and laws, for the right ordering thereof; and has not left these things to be determined by this or that state at their pleasure. I should wish you and all that are of your mind, to study better the Kingly office and royal prerogative of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 117-18.</span></figcaption>

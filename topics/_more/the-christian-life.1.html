<figure class="quote" id="q-68c87a6049" data-kw="">
<blockquote><p>I am afraid of a controversy on this subject [instrumental music], or of its issue, so far as the merits of the question are concerned. I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the Temple destroyed? Is the Temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the Temple or the Synagogue the model on which the Church of the New Testament is formed?

Does the Old Testament itself point to anything but “the fruit of the lips” as the peace-offering or thank-offering of Gospel times? Is there a trace in the New Testament of any other mode of praise? For my part, I am persuaded that if the Organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fulness,—against the substitution again, in our whole religion, of the formal for the spiritual, the symbolical for the real.

I do not judge others. The case is very different with those who never reached our measure of reformation from what it is with us. A Church which, stopping short in the process of its emancipation from a false system, retains certain of the usages of that false system, is in a very different position from a Church which, having advanced farther in the direction of purity and simplicity, voluntarily retrogrades and returns to these usages.

To the one they may be comparatively harmless, while to the other they may prove deeply hazardous. In the former instance, the continuance of them indicates no new leaning towards ritualism, no decline from what is more pure and spiritual. In the latter instance, the adoption of them may have a significancy, and may exert an influence, of a very serious character indeed. A landing-place which is tolerable for those who are going forward, may be the reverse of tolerable for those who are retreating.</p></blockquote>

</figure><figure class="quote" id="q-dec4427a0b" data-kw="">
<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, Dr Thomas Chalmers claimed that the principles of the non-intrusionists during the Ten Years’ Conflict were those of their covenanting forefathers:

It is, in a season of unexampled difficulty, to declare what we hold to be clear and incumbent duty. It is to rally and reassure the Church’s friends, in this hour of danger and menace to the Church’s liberties. It is to tell the country that, though perplexed, we are not in despair; and that whatever the threats, or whatever the demonstrations of power may be, we are resolved to abide by the good old principles which we believe to be in the Word of God – (Cheers) – principles bequeathed to us by the founders of Scottish Presbytery, and sealed by the martyrdom of our Scottish forefathers. …

Persecution may change its forms from one age to another – from the boots, and the thumb-screws, and the scaffolds of the seventeenth, to the fines and imprisonments of the nineteenth century. May the spirit of our ancestors descend to their children, that if the contest must be entered on between the Church’s subjugation and the Church’s spiritual independence, we, on the glorious retrospect of their sufferings and their triumphs, may give back to our adversaries their own watchword, return their own battle cry that “what firmness has done before, it will do again.” …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-5c397c9996" data-kw="">
<blockquote><p>Two great miscarriages moreover I was prone to fear the most would be guilty of, which I have especially consulted against. The first, of being swallowed up so much with a sense of their Suffering, as to be indisposed for all profitable Reflections; and therefore fain would I turn men’s eyes and thoughts from off this, to the sin that brought it; and have them only to consider the former, so much as to inform themselves more clearly of the evil of the latter.

Oh what Out-cries we may hear up and down, what doleful times these are! So many Thousands dead this Week, so many another! The Plague got to this Town, and then to that! All Trading, as well as Persons, dead and gone! But were People formerly thus affected, whilst we were bringing this upon our selves? Did they cry out then, Oh how many Thousand Oaths are sworn in a Week? And how many Lies told? How many Thousands Drunk, and how many commit Lewdness?

Had we had Weekly Bills of such Sins brought in, they would far have exceeded the largest Sums that ever yet the Mortality made. But alas! these with the most were light matters. Not half so many groans and tears for these, nor any such complaints of them; nor did the consideration of them make any sensible alteration amongst us. Now this I would fain obtain, to have those days thought as much worse than these; and those actions as much worse than these sufferings, as the Disease is worse than Physick; and a Child’s disobedience to his Parents, worse than his being Whipped: And he that should weep out of pity to the Child, when he sees it lashed; and yet could be content to hear him revile and abuse his father, I should think to be a person of more Fondness, than Discretion; and for him to be more concerned for the Child’s Smart, than the Parent’s Honour, argues him to have no true love for either.

And here by the way let me give a Caution, viz. That no man bewray so much folly as to argue, That because in mercy God may abate and remove his heavy Judgments, before many, or perhaps any of these sins I have mentioned are put away from amongst us; and because we may have our former health and plenty restored, whilst there is no such Reformation of disorders as I have exhorted to, that therefore our Sufferings were not intended to chastise us for those sins, nor to bring us to this Reformation.

If thou be an Atheist or Infidel that makest this Argument, who believest not there is a God, or that he concerns not himself with our Affairs, but that all things come by Nature or Chance, or I know not what, I shall then leave thee to receive satisfaction (if nothing sooner will give it) there, where all such as thou, by the feeling of Divine Vengeance, are at once convinced what the sin is which hath deserved it, and that there is a God who inflicts it; but if thou be a Christian, then I would wish thee well to examine the nature of the thing, (that I mean, which thou thinkest God hath not punished us for, because it is yet continued) and upon the issue of that examination, pass thy judgment. It’s much to be feared thou wilt see Drunkards, and hear Swearers, after the Plague may be ceased; and wilt thou think therefore that these, and the like Wickednesses, did not provoke God to afflict us?

But rather stay, if thou art in doubt, till the great reckoning day, till thou hast heard all men’s Accounts cast up, and those Actions which are then approved confidently pronounce no sins; but not all those that survive the heaviest Judgments here on earth, which may be sent to punish and reform those that were guilty of them; since hardened sinners may frustrate some ends of an Affliction, and all are not followed here, as Pharaoh was. No, I say, do not justify all such Actions, though thou shouldst hear them openly defended, and applauded, and those men punished that dare to oppose and contradict them, and that opposition made the only sin. This lower world is full of such mad mistakes and confusions, but all will shortly be set strait.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solomon’s prescription for the removal of the pestilence, or, The discovery of the plague of our hearts, in order to the healing of that in our flesh</cite>, (London, 1665), preface to the reader.</span></figcaption>

<blockquote><p>It is a school for acquiring practical wisdom. When we are in eager pursuit of this world’s enjoyments we have no leisure for serious reflection—when we have obtained these our minds are unfitted for it, and, though the price is in our hands, we have no heart to buy wisdom. Adversity has a tendency to sober the mind, disperses the illusions which prosperity had created, and induces thoughtfulness and meditation. He who bears the yoke in his youth sitteth alone and is silent, searches and tries his ways, and applies his heart to wisdom.

Practical wisdom comprehends two things—the knowledge of ourselves and of others, and both of these are most advantageously acquired in adversity.

How ignorant are even good men of themselves before they are put to the trial! How ready to mistake their character, to be deceived as to the motives by which they are actuated, and to overrate their talents and the strength of their principles! How apt to think they are something when they are nothing, and to expose themselves rashly to temptation! Happy was it for Peter that his grand trial was over, and that the secrets of his heart were revealed to him before he was called to take a leading part in the propagation of the gospel, and to appear before kings and rulers for the name of Christ!

It is true we would not be such strangers to ourselves if we listened to faithful counsel, and subjected our hearts to the test of an impartial and rigid self-examination. But still there is no knowledge like to that which is gained by experience, and no experience like that which is the result of tribulation. By encountering hardships we discover where our weakness lies, and in what quarter we are most vulnerable by the shafts of temptation—whether we are in greater danger of failing, in the hour of trial, from love to the world, timidity, a sense of shame, impatience, anger, unbelief, pride, or vainglory.</p></blockquote>

</figure><figure class="quote" id="q-77d9fbd74d" data-kw="">
<blockquote><p>This is the promise: The Spirit shall lead you into all truth. You are now searching into the deep things of God, which concern Religion; Live in the Spirit, and the Spirit shall bring all into your mind, and shew you the things of Jesus Christ. It behoves you to know the method of Satan; the stratagems and dark deeps of the Devil himself, in mysteries of State and Religion. Walk in the Spirit; he shall lead you into their chambers, as he did Ezekiel; and let you see what mischiefs they are there contriving in secret.

This is the promise: The Spirit of God and of glory shall rest on his servants, in their conflicts and sufferings. Sit still in all humble resignation of your selves, to the working of this Spirit; that he may rest on you: so shall he manage your counsels, finish your wars; and end all your sufferings with glory.

I shall conclude my Epistle with an humble Petition to your Honours: an hearty Prayer for you.

My humble Petition is, that You would ever remember to converse as Doves, among Doves; with this Dove; He is a tender Spirit, take heed of grieving this Spirit, where ever he dwells: For by him alone can your hopes be sealed to a day of full accomplishment.

My hearty Prayer is, that, as you sit debating in Parliament, the appearances of the Holy Ghost may be among you; as he was with the Apostles, sitting over them in the form of fiery tongues: that when you fight in the field, the Holy Ghost may be as a two-edged sword going forth from the mouth of the Lord Jesus into your enemy’s hearts: that you may never see upon the walls of your house, that hand-writing which made Belshazzer tremble; Your kingdom is divided; but in stead of this, that uniting and building Principle; Not by might, nor by power, but by my Spirit, saith the Lord. This is the fervent, constant prayer of

Your Honours humble servant in Christ, Peter Sterry.</p></blockquote>

</figure><figure class="quote" id="q-1dfb7813cf" data-kw="">
<blockquote><p>Especially let us look unto this in matters betwixt God and us: let us not play the hypocrites with him, pretending a love unto the Church of God, and to the word of God, when there is no such matter; and drawing near unto him with our lips, when our hearts are far from him: for in so doing we shall offer great injury unto the Lord, and do more hurt at length then those that are professed Papists or Atheists:

[F]or such as flatter with their lips, and dissemble with a double heart in things that concern the holy religion of God, if any persecution come, will quite renounce their profession, and betray the cause of God, and grieve the servants of God, and harden the hearts, and open the blasphemous mouths of the enemies of God, and make many to fall by their revolting and backsliding. Therefore let every one that taketh upon him the profession of Christianity, be a true, &amp; not a feigned friend of the same; and bring a faithful, and not a guileful heart thereunto; that the Lord may witness for him, that he doth heartily and unfeignedly seek him.</p></blockquote>

— John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal, (London: William Welbie, 1611), pp 69-70.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEspecially+let+us+look+unto+this+in+matters+betwixt+God+and+us%3A+let+us+not+play+the+hypocrites+with+him%2C+pretending+a+love+unto+the+Church+of+God%2C+and+to+the+word+of+God%2C+when+there+is+no+such+matter%3B+and+drawing+near+unto+him+with+our+lips%2C+when+our+hearts+are+far+from+him%3A+for+in+so+doing+we+shall+offer+great+injury+unto+the+Lord%2C+and+do+more+hurt+at+length+then+those+that+are+professed+Papists+or+Atheists%3A%0A%0A%5BF%5Dor+such+as+flatter+with+their+lips%2C+and+dissemble+with+a+double+heart+in+things+that+concern+the+holy+religion+of+God%2C+if+any+persecution+come%2C+will+quite+renounce+their+profession%2C+and+betray+the+cause+of+God%2C+and+grieve+the+servants+of+God%2C+and+harden+the+hearts%2C+and+open+the+blasphemous+mouths+of+the+enemies+of+God%2C+and+make+many+to+fall+by+their+revolting+and+backsliding.+Therefore+let+every+one+that+taketh+upon+him+the+profession+of+Christianity%2C+be+a+true%2C+%26+not+a+feigned+friend+of+the+same%3B+and+bring+a+faithful%2C+and+not+a+guileful+heart+thereunto%3B+that+the+Lord+may+witness+for+him%2C+that+he+doth+heartily+and+unfeignedly+seek+him.%E2%80%9D%0A%0A%E2%80%94+John+Dod%2C+Four+godly+and+fruitful+sermons+two+preached+at+Drayton+in+Oxford-shire%2C+at+a+fast%2C+enjoined+by+authority%2C+by+occasion+of+the+pestilence+then+dangerously+dispersed.+Likewise+two+other+sermons+on+the+twelfth+Psalm.+Whereunto+is+annexed+a+brief+tract+of+zeal%2C+%28London%3A+William+Welbie%2C+1611%29%2C+pp+69-70.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1dfb7813cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class <blockquote><p>What meaneth that joy that the faithful find in their hearts, accompanying the benefits that cometh from Him, but that the Lord giveth His benefits cheerfully? for if the LORD gave thee them not cheerfully, but in anger and wrath, and threw them to thee as to a reprobate, thou wouldest never have joy in the receiving of them. There is not such a thing, as a reprobate can have joy in the giver, or ever have his mouth open with true thanksgiving to the Lord to say once, I thank thee: Why? Because the Lord giveth him not His benefits in love, but in anger.</p></blockquote>

</figure><figure class="quote" id="q-b159df79e1" data-kw="">
<blockquote><p>I challenge all men to shew me a nation that, till Christianity appeared to bless this world, enjoyed a constitution like our own. God be thanked for it, thanked for the Sovereign that fills the throne, thanked for the loyalty of her people, and thanked for our calm but resolute determination — as this city lately saw — to stand by the liberties and protect the privileges which came down to us from battles which our fathers fought, and scaffolds where they fell …

It is our freedom, our mental, social, political, religious freedom — which has made us great; and these, with God’s blessing, we owe to his word. The Bible has been the source of our liberties. The Bible and the Shorter Catechism, read and studied by Scotchmen, these have toughened their intellects, and set all the wheels of their minds in motion.

Talk of Liberty! liberty without the Bible is either dead or delirious. Look at France, where they would have liberty divorced from religion! …

No political regeneration has ever stood, or will ever stand, unless it is preceded, accompanied, or followed by a spiritual awakening. In our case, there was no failure. The Argyles, and Guthries, and Cargills of other days — Knox, with his indomitable spirit and bold endurance, the martyrs who sleep in the Greyfriars’ churchyard, and those who lie on Scotland’s hills, with nothing to mark their graves but a weathered stone, with its rude sketch of an open Bible, and a naked sword, they neither prayed, nor laboured, nor bled, nor died in vain.

And why? Why, but because they laid the foundations of our liberties deep in the Word of God. Therefore, we have a sovereign, but no slaves in this land; we have authority, but no oppression; we have rulers, but no tyrants; we have liberty without license, and religion without superstition: free trade, a free parliament, free justice, free thought; liberty, not the false, which is every man doing what he will, but the true, which is every man doing what he ought.</p></blockquote>

</figure><figure class="quote" id="q-a7f49b5678" data-kw="">
<blockquote><p>Second, love moves us to help our neighbours when they are physically oppressed. Hebrew believers exhibited that kind of love in ministering to the oppressed saints of Christ (Heb. 6:10). All works of mercy flow from love. Our faith will be judged on the last day by whether we fed the hungry, gave water to the thirsty, clothed the naked, offered hospitality to the poor, and comforted to the sick and people in prison.

If our hearts are motivated by love for each other (Rom. 12:10), we will gladly give to needy saints and he inclined to offer them hospitality (Rom. 12:13). Love is the spice that adds zest to our alms before God and man. Without love, our works mean nothing, even if we give all our goods to feed the poor (1 Cor. 13:3). We find examples of loveless giving in the Pharisees, as well as in Ananias and Sapphira (Acts 5:3).

On the other hand, a donation of one penny would be suitable to God, if it were given sacrificially and with a believing heart (Luke 21:3), for “God loveth a cheerful giver” (2 Cor. 9:7). Love is so powerful that we seek to do good to all, even our enemies (Matt. 5:44) and unbelievers (Gal. 6:10). A true sign of Christian love is that we do good to our enemies from the heart in obedience to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), pp 42-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life.html">The Christian Life</a></span></div>

</figure><figure class="quote" id="q-996cdeb453" data-kw="">
<blockquote><p>He [the religious hypocrite] is one that is partial in his goodness; zealous in lesser things, and remiss in greater. As Luther complained of some in his time, and our Saviour in his time, which strain at a gnat, and swallow a Camel. He is one that sweats only in some part, but is cool in all the rest, which is a sign his zeal is distempered.

He is zealous against a Ceremony, a Relique or painted Glass, (not that I plead for these) but in the mean time lives in known sin; Lying, Cozening, Extortion, &amp;c. Just as the High Priests, It is not lawful, say they, to put the money into the Treasury, because it is the price of blood.

They speak like conscientious men. Oh do not defile the treasury! But let me ask the question, Why did they shed that blood it was innocent blood. They will not take the price of blood into the treasury, but they never scruple to take the guilt of blood into their souls. They were zealous for the Temple, but in the mean time murderers of the Son of God. And we have a parallel Scripture to this, Rom. 2. 22. Thou that abhorrest idols, dost thou commit sacrilege?

Who at the first blush would not have taken these for very holy, devout men; they were zealous against idolatry? But see a root of hypocrisy! They were partially good, they hated one sin, but not another; idolatry, but not sacrilege. Though it was an abominable sin, and there was an express Law of God against it, yet these seeming Zealots make no conscience of robbing God of his tithes.

And here as in a Scripture looking-glass, we may see our own faces; have we not many now adays seemingly zealous against Popery? if they see a Cross, though it be in a Coat of Arms, they are much offended, and are in a kind of convulsion: but in the mean time make no conscience of sacrilege, starving out the Ministry, they put out the fire on God’s Altar, shut the doors of his Temple; is not this visible hypocrisy?

There are some it may be will not be heard to swear, it will not stand with their Saintship, that were to call the devil father aloud, but they will defraud and defame, which is a sin they can never satisfy for; take away a man’s name, what amends can you make him? ’tis no better then murder; and if these be Saints, there are as good Saints in hell?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 39-41.</span></figcaption>

There are some it may be will not be heard to swear, it will not stand with their Saintship, that were to call the devil father aloud, but they will defraud and defame, which is a sin they can never satisfy for; take away a man’s name, what amends can you make him? ’tis no better then murder; and if these be Saints, there are as good Saints in hell?”

<blockquote><p>We may only advert farther on this head, to the wonder that the friends of truth and reformation should be so divided in sentiment and communion.

Considering that these are so feeble in point of numbers, and that the force of their public testimony depends so much on their united exertions, it is truly surprising that so little of a spirit of enlightened and scriptural union should exist among them; and that so generally they should be on the watch to increase their own little parties, by fishing in disturbed waters, and picking up treasures from the wreck of ruined establishments.</p></blockquote>

</figure><figure class="quote" id="q-d6ff824e4b" data-kw="">
<blockquote><p>For as it is not enough for those who are chosen to say in excuse for themselves, “I did not summon myself to this office, nor could I avoid what I did not see beforehand;” so neither will it be a sufficient plea for those who ordain them to say that they did not know him who was ordained. The charge against them becomes greater on account of their ignorance of him whom they brought forward, and what seems to excuse them only serves to accuse them the more.

For how absurd a thing, is it not? that they who want to buy a slave, show him to the physician, and require sureties for the sale, and information about him from their neighbours, and after all this do not yet venture on his purchase without asking for some time for a trial of him; while they who are going to admit any one to so great an office as this, give their testimonial and their sanction loosely and carelessly, without further investigation, just because some one wishes it, or to court the favour, or to avoid the displeasure of some one else.

Who shall then successfully intercede for us in that day, when they who ought to defend us stand themselves in need of defenders? He who is going to ordain, therefore, ought to make diligent inquiry, and much more he who is to be ordained. For though they who ordain him share his punishment, for any sins which he may commit in his office, yet so far from escaping vengeance he will even pay a greater penalty than they — save only if they who chose him acted from some worldly motive contrary to what seemed justifiable to themselves.

For if they should be detected so doing, and knowing a man to be unworthy have brought him forward on some pretext or other, the amount of their punishment shall be equivalent to his, nay perhaps the punishment shall be even greater for them who appointed the unfit man. For he who gives authority to any one who is minded to destroy the Church, would be certainly to blame for the outrages which that person commits.

But if he is guilty of no such thing, and says that he has been misled by the opinions of others, even then he shall not altogether remain unpunished, but his punishment shall be a little lighter than his who has been ordained. What then? It is possible that they who elect may come to the election deceived by a false report. But he who is elected could not say, “I am ignorant of myself,” as others were of him.

As one who will receive therefore a sorer punishment than they who put him forward, so should he make his scrutiny of himself more careful than that which they make of him; and if they in ignorance drag him on, he ought to come forward and instruct them carefully about any matters whereby he may stop their being misled; and so having shown himself unworthy of trial may escape the burden of so high an office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Priesthood</cite>, (c. 381-85), 4.2 in Nicene and Post Nicene Fathers 1, 9: 63.</span></figcaption>

<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.”

— Thomas Manton, Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 80-81.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+in+all+deceivableness+of+unrighteousness%2C+among+them+that+perish%2C+because+they+received+not+the+love+of+the+truth%2C+that+they+might+be+saved+%282+Thessalonians+2%3A10+Geneva+Bible%29%0A%0AIt+is+not+enough+to+receive+the+truth+in+the+light+of+it%2C+but+we+must+also+receive+it+in+the+love+of+it%2C+or+it+will+do+us+no+good.+To+make+the+truth+operative%3A%E2%80%94%281.%29+Knowledge+is+necessary%2C+and+also+faith%2C+and+then+love.+Knowledge%2C+for+%E2%80%98without+knowledge+the+heart+is+not+good%2C%E2%80%99+Prov.+xix.+2.+Nothing+can+come+to+the+heart+but+by+the+mind%3B+the+will+is+%E1%BD%84%CF%81%CE%B5%CE%BE%CE%B9%CF%82+%CE%BC%CE%B5%CF%84%E1%BD%B0+%CE%BB%CF%8C%CE%B3%CE%BF%CE%BD%E2%80%94a+choice+or+desire%2C+guided+by+reason%2C+and+the+gospel+doth+not+work+as+a+charm%2C+whether+it+be+or+be+not+understood.+No%3B+the+purport+or+drift+of+it+must+be+known%2C+or+how+can+it+have+any+effect+upon+us%3F%0A%0ANext+to+knowledge%2C+to+make+it+work%2C+there+must+be+faith.+When+we+apprehend+a+thing%2C+we+must+judge+of+it%2C+whether+it+be+true+or+false%3B+how+else+can+it+make+any+challenge%2C+or+lay+claim+to+our+respect%3F+1+Thes.+ii.+13%2C+%E2%80%98Ye+received+it+not+as+the+word+of+men%2C+but+%28as+it+is+in+truth%29+the+word+of+God%2C+which+worketh+effectually+in+you%2C+as+it+doth+in+all+them+that+believe.%E2%80%99+Faith+doth+enliven+our+actions+about+religion%3B+to+hear+of+God%2C+and+Christ%2C+and+heaven%2C+doth+not+stir+us+unless+we+believe+these+things.%0A%0AWell%2C+next+to+faith+there+must+be+love%2C+for+apprehension+and+dijudication+%5Bsic%5D+are+ <blockquote><p>10. Her watchmen are blind. He now assigns the reason why the people must be destroyed. It is because they are governed by wicked princes and pastors; not that he wishes to throw the blame on them alone, and thinks that the people are innocent, but because this was the beginning of the evil. We are not exempted from blame, if we follow blind guides, but, on the contrary, are justly punished for our transgressions; for the Lord takes away good guides from those whom he intends to punish for their ingratitude.

By the word “Watchmen” he means not only the prophets, to whom was committed the office of teaching, but likewise judges, princes, and kings, who ought to have governed everything in a proper manner. He includes both kinds of government, that of princes, and that of the ministers of the word, whom the Lord has placed, as the two eyes in the body, to govern the Church. Consequently, if they are wicked or unfaithful, there cannot arise a more destructive plague to a commonwealth.

All are ignorant. First, he reproaches them with want of knowledge; for, as it is the chief excellence of a good shepherd to know his duty, that he may judge what is profitable and what is pernicious to the flock, and to watch laboriously, and to stand, as it were, on a watch­tower, that he may promote their safety in every respect, so nothing is more inconsistent with that office than ignorance and blindness. No man, therefore, will be a good shepherd, unless he understands the right method of governing the people. And hence we see what we ought to think of the idols of our time, who haughtily and insolently boast of the name of shepherds or pastors; for they are untaught and ignorant beasts.

All are dumb dogs. By calling them, secondly, “dumb dogs,” he charges them with slothfulness and indifference; for, since it is the duty of a good shepherd to be industrious and careful, when he calls them slothful and indifferent, he shows that they had nothing about them that ought to belong to a shepherd. Thus, when we are deprived of good shepherds, and when lazy or even savage beasts come in their room, let us acknowledge God’s wrath, and let us know that destruction is not far off; for the Prophet threatens and foretells the ruin of the people, when shepherds are “dumb.”

Hence also it follows, that God appoints them to discharge the office of “dogs,” that is, to keep watch, to drive away robbers and thieves, and not to permit them to enter into the fold. And if dogs are so faithful guardians and so warmly attached to their masters, that they continually watch for their safety, and do not cease to drive away, by barking, those from whom danger is apprehended, shepherds, when they give themselves up to sloth and drowsiness, ought to be ashamed of being surpassed by a brute beast.

11. And those dogs strong of appetite. The third vice which he remarks in wicked pastors is insatiable avarice. Though they are lazy in all that relates to good government, yet they have a strong and ravenous appetite for food. Some view the Prophet’s words as still more extensive, and as meaning that they rule tyrannically. Ezekiel expressly reproves them for this vice; for false prophets are commonly fierce, and act cruelly and barbarously towards the people of God. (Ezekiel 34:4) But if any person examine the matter carefully, he will perceive that the Prophet speaks of their insatiable avarice, which he afterwards describes by a variety of expressions. They look to their ways. That is, “They attend eagerly to their own affairs; every person consults his own advantage.” In short, he means that there is no man who does not wish to be preferred to others, as if every man had been born for himself.

Every one to his gain from his end. מקצהו (mikkatzehu) has received various expositions. Some render it, “In his end,” that is, “In his affairs;” as if the reading had been, בקצהו, (bekatzehu) But this does not agree with the Prophet’s meaning. Others render it, “From the end of his avarice.” I think that a more simple interpretation is, “From his end,” that is, “On his part;“ or as we commonly say, (Chacun en son endroict,) “Every one in his place.” Thus every one is bent on avarice, and draws and appropriates everything to himself, and consults his own advantage, without attending to the duties of his office.

Hence we learn, that no man can serve God who is given up to wicked desires; and he who shall labour to amass wealth, will not apply his mind to build up the Church of the Lord. No kind of blindness can be more dangerous than avarice; and so much the more ought it to be avoided by pastors, if they wish to be faithful servants of God. When we see the Prophet complaining of the bad pastors of his time, let us not be alarmed if we meet with the same thing in the present day, and let us not look upon it as an unusual occurrence that so few are earnestly employed in the work of the Lord.</p></blockquote>

ays.+That+is%2C+%E2%80%9CThey+attend+eagerly+to+their+own+affairs%3B+every+person+consults+his+own+advantage.%E2%80%9D+In+short%2C+he+means+that+there+is+no+man+who+does+not+wish+to+be+preferred+to+others%2C+as+if+every+man+had+been+born+for+himself.%0A%0AEvery+one+to+his+gain+from+his+end.+%D7%9E%D7%A7%D7%A6%D7%94%D7%95+%28mikkatzehu%29+has+received+various+expositions.+Some+render+it%2C+%E2%80%9CIn+his+end%2C%E2%80%9D+that+is%2C+%E2%80%9CIn+his+affairs%3B%E2%80%9D+as+if+the+reading+had+been%2C+%D7%91%D7%A7%D7%A6%D7%94%D7%95%2C+%28bekatzehu%29+But+this+does+not+agree+with+the+Prophet%E2%80%99s+meaning.+Others+render+it%2C+%E2%80%9CFrom+the+end+of+his+avarice.%E2%80%9D+I+think+that+a+more+simple+interpretation+is%2C+%E2%80%9CFrom+his+end%2C%E2%80%9D+that+is%2C+%E2%80%9COn+his+part%3B%E2%80%9C+or+as+we+commonly+say%2C+%28Chacun+en+son+endroict%2C%29+%E2%80%9CEvery+one+in+his+place.%E2%80%9D+Thus+every+one+is+bent+on+avarice%2C+and+draws+and+appropriates+everything+to+himself%2C+and+consults+his+own+advantage%2C+without+attending+to+the+duties+of+his+office.%0A%0AHence+we+learn%2C+that+no+man+can+serve+God+who+is+given+up+to+wicked+desires%3B+and+he+who+shall+labour+to+amass+wealth%2C+will+not+apply+his+mind+to+build+up+the+Church+of+the+Lord.+No+kind+of+blindness+can+be+more+dangerous+than+avarice%3B+and+so+much+the+more+ought+it+to+be+avoided+by+pastors%2C+if+they+wish+to+be+faithful+servants+of+God.+When+we+see+the+Prophet+complaining+of+the+bad+pastors+of+his+time%2C+let+us+not+be+alarmed+if+we+meet+with+the+same+thing+in+the+present+day%2C+and+let+us+not+look+upon+it+as+an+unusual+occurrence+that+so+few+are+earnestly+employed+in+the+work+of+the+Lord.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+the+Prophet+Isaiah%3A+Volume+Fourth%2C+trans.+William+Pringle+%28Geneva%2C+1551%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+8a%3A+188-91.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e13bed21f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e13bed21f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/23/john-calvin-on-the-danger-of-following-blind-guides/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>OUR Lord and King JESUS CHRIST, when he was now about to go unto his Father, and desirous to leave unto those whom he loved, some excellent benefit, (a benefit then which the earth cannot yield a greater,) he left them Peace: Peace at his death as a Legacy, he bequeathed them: My Peace (saith he) I leave unto you, my Peace I give unto you; for neither could men wish from heaven a greater blessing, neither could the Angels declare unto men from heaven a more welcome message, then Glory in heaven, and Peace in earth.

This Bond, by which heaven unto earth, and earth unto heaven reciprocally is united, hath so straitly bound the heart of the King’s Majesty of great Britain [James I], that according to the exceeding care which he hath evermore had of the safe-guard and defence of true Religion, of settling Peace and Concord amongst Christian Princes throughout the world; but especially, Most Illustrious, Noble, and Magnificent Lords, of procuring the good and tranquillity of this your State, to which he acknowledges his Kingdom to be linked by the Tie of an ancienter and straiter League: He hath sent us hither with this especial charge, that as much as in us lies, we procure your prosperity, and your Churches Peace.

Certainly, an exceeding desire of Peace &amp; the public good, possest his Princely heart, when he commended unto your Lordships the care of Religion.

This his Majesty’s provident care can never be unwelcome, if it may please your Lordships, according to your Wisdom and Piety, to recount the benefit of the reformed Religion, and the blessings of God’s favour, which like showers from heaven, have watered your Provinces far &amp; near. I suppose, it cannot be unknown unto your Lordships, what &amp; how much you owe to true Religion.

Religion it was, which from blood and tempest reduced your State to these flourishing days of quietness and Sun-shine. Religion it was, which first begat, then enlarged, and finally established your prosperity. Let your Lordships now consider with your selves, what you will repay unto Christ for all these blessings. Of your Lordships, Christ, who is King of Kings, and Lord of Lords, requires this, that for and above all his other benefits, you preserve the Peace which he bequeathed you.</p></blockquote>

</figure><figure class="quote" id="q-eb1e59e51a" data-kw="">
<blockquote><p>What does the success of this false Plymouthistic and Arminian teaching amount to? There is first, a false faith, a mere belief of a supposed fact. Then there is a false conception of the atonement, a conception which robs Christ’s death of all its unfailing efficacy as an actual saving atonement for every one for whom it was offered, and so takes away the glory of its saving power, and places that glory on the head of man’s faith, – the “Evangelistic” doctrine in effect being that Christ could not make His atonement saving, but that the sinner while simply a sinner does make it saving by a faith which is wholly in his own power. Then, as the result of this false faith in a false doctrine, there is so-called peace, and there is “assurance” never to be disturbed in this world, unless God in the Sovereignty of His grace, which they despise, reveal to the self-righteous “converts” the grossness of their self-deception and presumption.

It is true that the doctrines of grace, being profoundly humbling doctrines, will cause many sinners to go away. So sinners went away from the Saviour Himself, when He taught them the doctrines of His gospel. But He never thought on that account of modifying His doctrines to conciliate gain-sayers or to meet their self-righteousness tastes. He never softened down a single hard saying so as to keep objectors from going away. If He had adopted another course, and appealed to the self-complacency of sinners He might have made many more converts of a kind. But He wished not false conversions or mere apparent and showy successes, and so He declared the whole counsel of God.

His apostles and prophets followed a similar course. They preached the preaching that He bade them, and left all results to Him. Those who wish to follow the course of a true evangelism must fearlessly and faithfully deliver Christ’s message. They must have sufficient faith in the wisdom of their Lord and Master, to believe that His truth, without any modification or any flattering concession to the carnal mind, is the great need of the world. And they must have sufficient spiritual perception to understand that one genuine convert made by the truth and Spirit of God is better than a million spurious converts made by the preaching of error. God’s truth, they may be sure, will be successful in accomplishing all His purposes; and error, they may be equally sure, however plausible the reason may be for its use, will prove a disastrous and eternal failure.</p></blockquote>

<blockquote><p>James Dick, who, at the time of writing, was the minister of Trinity Street Reformed Presbyterian Church in north Belfast, wrote the following about what he considered to be the spurious theology of those leading evangelistic campaigns. While we could criticise Dick for not being mindful of the hypothetical universalism that was held by many Reformed divines in the era of confessional formulation (although such an opinion was held alongside the Canons of Dort’s assertion of a definite atonement for the sins of the elect), he was probably correct to conclude that the later use of universalistic terminology in relation to the atonement had more to do with the influence of Wesleyan Arminianism:

Leaders in the “work” may profess to believe in Calvinistic doctrine, but their evangelism is to all intents and purposes Arminian. Of course a main theme of evangelism, whether true or false, is the death of Christ. The “evangelistic” teaching of this time preaches Christ’s death for all men, universal atonement, atonement for every human being in all time the world over, atonement for every man alike, for Judas as for John. But this is so obviously atonement that does not atone. The most noted evangelists of the time tell an audience, Christ died for you. So they say, also, to an individual sinner in that audience. Take this doctrine away from them and they have nothing left to preach.

The doctrine of universal atonement is essential to the “success” of such evangelists, because of their peculiar doctrine of faith. They gravely tell sinners that they have only to believe that Christ died for them in particular in order to be saved. They tell them, moreover, that God has done already all that He can do for every man, and that He cannot proceed a step further with the work of salvation till the sinner proceeds. The will tell sinners, God cannot save you except you believe. What is this all but appealing to the sinner complete himself, by a faith that is quite in his own power, the incomplete and otherwise unfinishable work of God?

Modern “evangelism” may profess to believe that the Holy Spirit’s special grace is needed to make the sinner believe. But the “Evangelists” do not teach this. They prefer to make the sinner plainly that he is dead in trespasses and sins and can make no spiritual movement whatever of himself would hinder “success.” Conversions can be secured only by leaving sinners under the false impressions as to their own power to believe.

A false evangelism considers it imprudent to put any doctrine of spiritual inability before sinners, lest they should be offended and go away. To avoid such a contingency as this it assures them that if they believe they will thereby be born again, and so teaches them to put their first dependence on themselves. It does not teach them that they must be born again by the Almighty Spirit of God before they believe, which is the teaching of Scripture, and which directs men to place all their dependence upon God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Evangelism: With Criticism of some Prevalent Errors</cite>, (Belfast, 1898), pp 11-13.</span></figcaption>

<blockquote><p>This Scripture man will be accounted nice and scrupulous. If you do regard his conscience, which attends God’s Word only, it must needs be nice and scrupulous in the World’s account, That as they wonder you run not into the same excess of riot with them, so also that you cannot use all such Worship and receive all such Traditions as they do[.]

A tender constitution feels the least blast of wind, so also doth a tender heart; Look upon the carriage of our Saviour’s not washing his hands, it was but a civil. thing, he knew how much the neglect of this would prejudice him, and yet he would not do it. For as he will have a liberty of conscience where some are superstitiously fearful; so again he will have an holy fear of conscience, where others are desperately bold; never then let Reformers startle at this, to be thought more strict then needs.

5. He will be judged singular from others: This ariseth from the other, for seeing his conscience is so tender, thence also his life will be disagreeing to the most, as the Apostles rule, Rom. 13. 2. Not to fashion our selves according to this world; and so Jam. 1. 27. pure Religion is to keep our selves unspotted from the world: it is true on the other side, if there be any irregularity, it is in the most men of the world that they conform not unto the Word of God which is the rule, for the godly doe as they should do; as in a pasture where a flock of sheep is, if all but two or three break the hedges and run into the high-ways, who are wanderers? the multitude? no, those two or three that abide in the pastures.</p></blockquote>

</figure><figure class="quote" id="q-f4ce369237" data-kw="">
<blockquote><p>But when, in this corrupt disordered State of Things, where the Lusts of Men are perpetually embroiling the World with Wars and Fightings, and throwing all into Confusion; when Ambition and Avarice would rob us of our Property, for which we have toiled, and on which we subsist; when they would enslave the free-born Mind, and compel us meanly to cringe to Usurpation and Arbitrary Power; when they would tear from our eager Grasp the most valuable Blessing of Heaven, I mean our RELIGION: when they invade our Country, formerly the Region of Tranquillity, ravage our Frontiers, butcher our Fellow-Subjects, or confine them in a barbarous Captivity in the Dens of Savages; when our earthly All is ready to be seized by rapacious Hands, and even our Eternal All is in Danger by the Loss of our Religion: when this is the Case, what is then the Will of God?

Must Peace then be maintained? maintained with our perfidious and cruel Invaders? maintained at the Expense of Property, Liberty, Life, and every Thing dear and valuable? maintained, when it is in our Power to vindicate our Right, and do ourselves Justice? Is the Work of Peace then our only Business? No; in such a Time even the God of Peace proclaims by his Providence, “To ARMS!” Then the Sword is, as it were, consecrated to God; and the Art of WAR becomes a Part of our Religion. Then happy is he that shall reward our Enemies, as they have served us. Blessed is the brave Soldier: blessed is the Defender of his Country, and the Destroyer of its Enemies. Blessed are they who offer themselves willingly in this Service, and who faithfully discharge it.</p></blockquote>

— Samuel Davies, The curse of cowardice. A sermon preached to the militia of Hanover County, in Virginia, at a general muster, May 8, 1758. With a view to raise a company for Captain Samuel Meredith, (Boston: Z. Fowle and S. Draper, 1759), pp 3-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+when%2C+in+this+corrupt+disordered+State+of+Things%2C+where+the+Lusts+of+Men+are+perpetually+embroiling+the+World+with+Wars+and+Fightings%2C+and+throwing+all+into+Confusion%3B+when+Ambition+and+Avarice+would+rob+us+of+our+Property%2C+for+which+we+have+toiled%2C+and+on+which+we+subsist%3B+when+they+would+enslave+the+free-born+Mind%2C+and+compel+us+meanly+to+cringe+to+Usurpation+and+Arbitrary+Power%3B+when+they+would+tear+from+our+eager+Grasp+the+most+valuable+Blessing+of+Heaven%2C+I+mean+our+RELIGION%3A+when+they+invade+our+Country%2C+formerly+the+Region+of+Tranquillity%2C+ravage+our+Frontiers%2C+butcher+our+Fellow-Subjects%2C+or+confine+them+in+a+barbarous+Captivity+in+the+Dens+of+Savages%3B+when+our+earthly+All+is+ready+to+be+seized+by+rapacious+Hands%2C+and+even+our+Eternal+All+is+in+Danger+by+the+Loss+of+our+Religion%3A+when+this+is+the+Case%2C+what+is+then+the+Will+of+God%3F%0A%0AMust+Peace+then+be+maintained%3F+maintained+with+our+perfidious+and+cruel+Invaders%3F+maintained+at+the+Expense+of+Property%2C+Liberty%2C+Life%2C+and+every+Thing+dear+and+valuable%3F+maintained%2C+when+it+is+in+our+Power+to+vindicate+our+Right%2C+and+do+ourselves+Justice%3F+Is+the+Work+of+Peace+then+our+only+Business%3F+No%3B+in+such+a+Time+even+the+God+of+Peace+proclaims+by+his+Providence%2C+%E2%80%9CTo+ARMS%21%E2%80%9D+Then+the+Sword+is%2C+as+it+were%2C+consecrated+to+God%3B+and+the+Art+of+WAR+becomes+a+Part+of+our+Religion.+Then+happy+is+he+that+shall+reward+our+Enemies%2C+as+they+have+served+us.+Blessed+is+the+brave+Soldier%3A+blessed+is+the+Defender+of+his+Country%2C+and+the+Destroyer+of+its+Enemies.+Blessed+are+they+who+offer+themselves+willingly+in+this+Service%2C+and+who+faithfully+discharge+it.%E2%80%9D%0A%0A%E2%80%94+Samuel+Davies%2C+The+curse+of+cowardice.+A+sermon+preached+to+the+militia+of+Hanover+County%2C+in+Virginia%2C+at+a+general+muster%2C+May+8%2C+1758.+With+a+view+to+raise+a+company+for+Captain+Samuel+Meredith%2C+%28Boston%3A+Z.+Fowle+and+S.+Draper%2C+1759%29%2C+pp+3-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4ce369237.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4ce369237.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/26/samuel-davies-on-the-need-to-take-up-arms-in-defence-of-religion-and-liberty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b5f73bdc49" data-kw="">
<blockquote><p>That which is the sum of religion, sincerity, and a correspondency between profession and practice, is confirmed by reason, and much strengthened by nature itself; so that religion, reason, and nature, conspire in one, to hold out the beauty and comeliness of sincerity, and to put a note and character of infamy and deformity upon all hypocrisy and deceit, especially in the matters of religion.

There is nothing so contrary to religion, as a false appearance, a shew of that which is not: for religion is a most entire and equable thing, like itself, harmonious in all parts of it, the same within and without, in expression and action, all correspondent together. Now, to mar this harmony, and to make it up of unequal, dissimilar parts, and to make one part give the lie to the other, the course of a man’s life, in ignorance, negligence, and sin, proclaiming contrary to the profession of Christianity: this is to make religion a monstrous thing, to deny the nature of it, and in our imaginations to contrive an impossible union of inconsistent things.

It is a creature made up of contradictions, which can have no subsistence in the truth, but only in the fancies of deluded souls; one professing Christianity, and so by consequence fellowship with the original light, the Sun of Righteousness, and yet darkness of ignorance possessing the mind, and the heart carried away in the ways of the lusts of ignorance, and walking in that darkness.

This is a monster in Christianity, one so far misshapen, that the very outward form and visage of it doth not remain. But I told you, reason confirms this; for what more suitable to the very natural frame and constitution of a reasonable being, than that the outward man should be the image and expression of the inward, and that they should answer one another, as face answers face in the water; that the tongue should be the interpreter of the mind, and the actions of a man’s life the interpreter of his tongue ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 258-60.</span></figcaption>

</figure><figure class="quote" id="q-1896ed22ae" data-kw="">
<blockquote><p>When preaching on 1 Peter 4:11, the English Reformer, John Jewel reminded his hearers of the early Christians’ emphasis on practical godliness:

That godliness is placed, not in outward shew and titles, but in soundness of life, and innocency of manners. That it is an ill thing with mouth and tongue only to worship GOD, and to give our mind and soul to (worship) the Devil, and to disagree from Idolaters, not in life and manners, but in words and profession (only.)

And because they had departed from the most ancient Ordinances and laws of their forefathers, and that they being but a few had stirred all kind of men against them, he warneth them that they yet would in all kind of duties practise charity among themselves, one toward another, lest they should be deluded at any time by any dissension of minds or studies.

That this is only the token of Jesus Christ, whereby the bondslaves of the Devil may be known from the Children of GOD. That so it shall come to pass shortly, that all the whole world shall embrace the Gospel and the heavenly doctrine, and that the enemies and the haters of the cross of Christ, whom godliness could not move, may through shame be overcome, and return to themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon made in Latin in Oxford in the reign of King Edward the sixth, by the learned and godly father John Jewel, late Bishop of Salisbury, and translated into English, by R.V. Dedicated unto the Bishop of London, as appeareth in the Commentary of Ma. Caluine, upon the Galatians, in English</cite>, (London, [1581]), unpaginated.</span></figcaption>

<blockquote><p>Love to Christ delights in his ordinances, and leads the person in whom it dwells to observe them regularly and conscientiously. These are the places where he meets with his people, and holds communion with them. True love will fly with eagerness to seek its object wherever it is to be found, and will linger fondly about the spot where it expects to meet him. …

If a person is careless in waiting on public ordinances, if he can absent himself from them on the most trifling account, if he has more pleasure in loitering at home, in traversing the fields, or in visiting his friends, how dwelleth the love of Christ in that man?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love to Christ in Sermons</cite></span></figcaption>

<blockquote><p>2. Meditate on the omnipotency of God, who made all these creatures of nothing (Heb. xi. 3)—of his wisdom (Psal. cxlv. 15, 16), who feedeth so many infinite creatures through the universal world, maintaining all their lives, which he has given them, which surpasseth the wisdom of all the angels in heaven—and of his clemency and goodness, in feeding also his very enemies (Matt. v. 45, &amp;c.; Acts xiv. 17.)

3. Meditate how many sorts of creatures, as beasts, fish, and fowl, have lost their lives, to become food to nourish thee; and how God’s providence from remote places has brought all these portions together on thy table for thy nourishment; and how by these dead creatures he maintains thee in health and life.

4. Meditate that seeing thou hast so many pledges of God’s fatherly bounty, goodness, and mercy towards thee, as there are dishes of meat on thy table, O suffer not in such a place, so gracious a God to be abused by scurrility, ribaldry, or swearing; or thy fellow-brother, by disgraceful backbiting, taunting, or slandering.</p></blockquote>

<blockquote><p>Alas, we deceive ourselves with the noise of a covenant, and a cause of God; we cry it up as an antidote against all evils, use it as a charm, even as the Jews did their temple; and, in the mean time, we do not care how we walk before God, or with our neighbours: well, thus saith the Lord, “trust ye not in lying words,” &amp;c. Jer. vii. 4, 5, 6. If drunkenness reign among you, if filthiness, swearing, oppression, cruelty reign among you, your covenant is but a lie, all your professions are but lying words, and shall never keep you in your inheritance and dwellings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heart-Humiliation: or, Miscellany Sermons, Preached upon some choice texts, at several solemn occasions</cite>, (1676) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 33.</span></figcaption>

<blockquote><p>There is great need of faithfulness and prudence, in defending the truths of Christ, against the errors of the times. Our faithfulness indeed will oblige us to do it; but prudence must direct us how to do it.

The establishment of our people in the truth, is one special end of the institution of the ministry, Eph. iv. 11. But without the assistance of both these graces, that end is never like to be attained. A faithful minister dares not be silent, where the souls of his people are concerned; yet all his endeavours to secure them, will be to little purpose, if prudence be wanting in the management of that design.

Prudence must both time our contentions, and regulate the manner of them. It will never suffer us to appear too soon, nor too late: Not too soon, because errors are sometimes best cured by neglect, and in a little time grow weary of themselves; not too late, lest they get head, and be past retrieve: Hasty contenders, like young faulconers, let fly the hawk with her hood on. Upon the other side, if friendship, or relation to seducers, stop our mouths too long, we may in a few days be entertained by them, (as Thyestes was by his brother Atreus) with the limbs of our own (spiritual) children.

Prudence will not suffer our pulpits to ring with invectives against seducers, till the more private and gentle methods have been tried in vain; and then neither prudence nor faithfulness will admit of longer delay.

But yet when they both advise us to engage, prudence must regulate the manner of the contention, and commands us to urge hard arguments, with mild and soft language.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Character of a Complete Evangelical Pastor Drawn by Christ</cite>, in The Works of John Flavel (6 vols, London, 1820), 6: 576-77.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Q. 17. May not rich men, that have no need, forbear the six days’ labour?

A. No; if they are able. It is part of God’s service, and riches are his gift: and to whom he giveth much, from them he expecteth not less, but more. Shall servants work less because they have more wages?

It is not only for their own supplies that God commandeth men to labour, but also for the public good, and the benefit or relief of others, and the health of their bodies, and the suitable employment of their minds, and that none of their short, precious time be lost in sinful idleness.

Q. 18. But it will seem sordid for lords, and knights, and ladies to labour?

A. It is swinish and sinful not to labour; but they must do it in works that are suitable to their places. As physicians, schoolmasters, and church ministers labour not in the same kind of employment as ploughmen and tradesmen do; so magistrates have their proper labour in government, and rich persons have families, children, and servants to oversee, their poor neighbours and tenants to visit, encourage, and relieve, and their equals so to converse with as tendeth to the greatest good; but none must live idly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life.html">The Christian Life</a></span></div>

formedcovenanter.wordpress.com/2019/05/23/richard-baxter-on-the-sins-of-the-idle-rich/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>There were 3 things (most Honourable Sirs!) which Luther did fear would prove to be the Ruin of Religion.

1. Oblivion.

2. Security.

3. Carnal policy: The good God overthrow these in our Land, lest our land be overthrown by these: Though Ministers discover all sorts of sins, and though a Parliament discovers all sorts of plots and dangers, yet people are settled on their Lee’s, they will not see, nor fear, nor humble themselves, nor turn to the Lord at all; O pray, (said a dying man in the beginning of the German reformation) that God would preserve the Gospel … For the Pope and the Council of Trent are hatching of strange things: Ministers say as much and more to people, pray, be humbled, reform; For you see what the bloody Papists have done in Ireland, and you hear what they are plotting against England, we do thus speak and weep, but man will not hearken and obey; They who will not easily see their sins, will as hardly believe their dangers … O that God’s advises (so frequent, so earnest, so and more safe) to humbling and reforming might once be regarded and followed: we shall be safe, if we ever remain impenitent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Preservation or, A Sermon Discovering the only way to prevent Destroying Judgements: Preached to the Honourable House of Commons at their last Solemn Fast, being on May, 25, 1642</cite>, (London: Samuel Gellibrand, 1642), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>He that would read to profit must read and meditate. Meditation is the food of your souls, it is the very stomach and natural heat whereby spiritual truths are digested. A man shall as soon live without his heart, as he shall be able to get good by what he reads, without meditation.

Prayer, saith Bernard, without meditation, is dry and formal, and reading without meditation is useless and unprofitable. He that would be a wise, a prudent, and an able experienced statesman, must not hastily ramble and run over many cities, countries, customs, laws, and manners of people, without serious musing and pondering upon such things as may make him an expert statesman; so he that would get good by reading, that would complete his knowledge, and perfect his experience in spiritual things, must not slightly and hastily ramble and run over this book or that, but ponder upon what he reads, as Mary pondered the saying of the angel in her heart.

Lord! saith Austin [Augustine], the more I meditate on thee, the sweeter thou art to me; so the more you shall meditate on the following matter, the sweeter it will be to you. They usually thrive best who meditate most. Meditation is a soul-fattening duty; it is a grace-strengthening duty, it is a duty-crowning duty. Gerson calls meditation the nurse of prayer; Jerome calls it his paradise; Basil calls it the treasury where all the graces are locked up; Theophylact calls it the very gate and portal by which we enter into glory; and Aristotle, though a heathen, placeth felicity in the contemplation of the mind. You may read much and hear much, yet without meditation you will never be excellent, you will never be eminent Christians.</p></blockquote>

</figure><figure class="quote" id="q-aa8e5e103a" data-kw="">
<blockquote><p>None will pretend to deny that there is not great risk to the riders in the steeple-chase, from the nature of the ground, and for impediments in the course. And surely he who perils the life of a human being, without any adequate cause, should not be held guiltless.

The fact is, that the death of riders in steeple-chases is a matter of frequent occurrence. In October last, a man was killed at once in a race of this kind in the south of Ireland, and he left behind him a wife and family to bewail his untimely end. If the annals of racing are carefully inspected, it will be found that throughout these three kingdoms, at an average, several deaths – sometimes as many as six or eight – take place every year from this cruel punishment.

Surely the public authorities should interfere to prevent this prodigal waste of human life. If the same number of murders were annually committed by persons associated for this purpose, it would excite a thrill of horror throughout the whole community, and the most stringent measures would be demanded to put an end to such crimes. The only difference here is that the direct object of the steeple-chase is not the taking away of human life; but as it manifestly puts it in jeopardy, and as when followed it will inevitably cause the death of numbers, it is to be justly held chargeable with murder, and should therefore be put down, as opposed to the law of God, and an offence of the highest kind against society.

Where riders are not killed in the steeple-chase, numbers of them, by falls and sometimes by blows from the horses thrown, are often injured and greatly disabled. Were not horse-racing a fashionable amusement, countenanced and supported by those who, from their station, too often regard themselves, or are regarded as not amenable to the laws of morality, we are persuaded that the barbarous practice of the steeple-chase would not be tolerated in civilized society. Let the one be discontinued, and the other will disappear, only to be hereafter mentioned as a relic of savage life, or as the sport of madmen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 394.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-72c588861e" data-kw="">
<blockquote><p>The chief practical argument in favour of Universalism is, doubtless, the sinful callousness of Christians towards this tremendous destiny of their sinful fellow-creatures. Can we contemplate the exposure of our friends, neighbours, and children to a fate so terrible [as hell], and feel so little sensibility, and make efforts so few and weak for their deliverance! And yet, we profess to have faith! How can our unbelieving friends be made to credit the sincerity of our convictions? Here, doubtless, is the best argument of Satan for their scepticism. And the best refutation of this heresy is the exhibition by God’s people of a holy, humble, yet burning zeal to pluck men as brands from the burning.</p></blockquote>

</figure><figure class="quote" id="q-f0d502f708" data-kw="">
<blockquote><p>Is it of no importance whether the Son of God actually came in the flesh? Is it of no importance whether he actually died on the tree for our sins? Whether he actually rose again for our justification? Whether he actually ascended to heaven and sits there on his throne, the Lord of the world? Beautiful dreams these! But if only beautiful dreams! How dreadful to have only an imaginary Saviour and an imaginary salvation. But this is precisely what we must come to on the principle that it is the ideal, not the real that counts in the religious life.

It makes no difference what actually happened so only prophets and sages and apostles have risen to these great conceptions – if the independence of the ideal on the real is the most important lesson of religious thinking – why, then, we must be prepared to satisfy ourselves with a Christianity innocent of a real Redeemer and a real Redemption. Are we content to be saved from sin only an idea – to “go to heaven” only in imagination?

And this leads us to a right estimate of the assertion that is now so constantly made all about us, that Christianity has nothing to fear from the criticism which is evaporating (to its own satisfaction) the historicity of the Bible narratives. That depends on what Christianity is. If it is a religion that is founded on the actual – if it is a religion of fact – if it has any historical content – it is evaporated with its history. If it is a religion of “ideas,” it is of course unaffected by the destruction of any history that may have become accidentally associated with it.

But in that case, it is not Christianity in any intelligible sense; it is nothing but a natural religion – a religion of “eternal verities” – as inoperative as all the rest of its fellows actually to save, though it may be infinitely superior to its fellows in the loftiness of its conceptions. A God who is only an idea, and who never intervenes in the world of fact, can never actually save a soul that is read from sin that is real.

For the actual salvation of an actual sin-stricken soul we require an actual Redeemer who has actually intervened in the actual course of history. … Christianity is a historical religion, all of whose doctrines are facts. He who assaults the trustworthiness of the record of the intervention of God for the redemption of the world, is simply assaulting the heart of Christianity.</p></blockquote>

<blockquote><p>It is necessary that theological topics be blended in our discourses on the gospel with the rules of practical godliness; that the doctrines should lead to the precepts, and that precepts should always flow from the doctrines, that the former may enlighten, and that the latter may stir up, and so quicken the heart, or to speak more correctly, these two must be so commingled as every where to pervade our preaching.

As the precious stones in the breastplate of the great high priest were distinct and separate, and so arranged that the one could easily be distinguished from the other, but nevertheless, as they all at once, threw out one common light, in which their individual lustre and brilliancy were confounded, so in the sermons of the ministers of Jesus Christ, the subjects which are introduced, however different, and however arranged in the order which distinguishes them, ought to constitute one blaze of light in which the truth of the doctrines is so completely mixed with the holiness of the virtues, that they may come into view at the same time, and that there may be found at one point the shining of the Urim and Thummim, (i.e.,) the splendour of instruction with the soundness of good regulations.

As the lightning and the thunder accompany each other in such a way that you cannot tell which goes first, the eye supposing the lightning, and reason, on the contrary, (in the opinion of many) the thunder, so ought it to be with the doctrines and the precepts in sermons, — they should be so arranged that one hardly knows to which of the two to give his attention, that when you notice them, almost at the same time, and in the same instant, if possible, the eye may be struck with the lightning of the one, and the ear with the noise and thunder of the other.</p></blockquote>

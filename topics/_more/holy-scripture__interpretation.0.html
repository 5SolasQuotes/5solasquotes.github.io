<blockquote><p>accommodation occurs specifically in the use of human words and concepts for the communication of the law and gospel, but it in no way implies the loss of truth or the lessening of Scriptural authority. The accommodation or condescension refers to the manner or mode of revelation, the gift of the wisdom of infinite God in finite form, not to the quality of the revelation or to the matter revealed.</p></blockquote>

<blockquote><p>It must be observed, however, that the teachings and prescriptions of Scripture are not confined by the Confession to what is “expressly set down in Scripture.” Men are required to believe and to obey not only what is “expressly set down in Scripture,” but also what “by good and necessary consequence may be deduced from Scripture.” This is the strenuous and universal contention of the Reformed theology against Socinians and Arminians, who desired to confine the authority of Scripture to its literal asseverations; and it involves a characteristic honoring of reason as the instrument for the ascertainment of truth. We must depend upon our human faculties to ascertain what Scripture says; we cannot suddenly abnegate them and refuse their guidance in determining what Scripture means. This is not, of course, to make reason the ground of the authority of inferred doctrines and duties. Reason is the instrument of discovery of all doctrines and duties, whether “expressly set down in Scripture” or “by good and necessary consequence deduced from Scripture”: but their authority, when once discovered, is derived from God, who reveals and prescribes them in Scripture, either by literal assertion or by necessary implication. The Confession is only zealous, as it declares that only Scripture is the authoritative rule of faith and practice, so to declare that the whole of Scripture is authoritative, in the whole stretch of its involved meaning. It is the Reformed contention, reflected here by the Confession, that the sense of Scripture is Scripture, and that men are bound by its whole sense in all its implications. The reëmergence in recent controversies of the plea that the authority of Scripture is to be confined to its expressed declarations, and that human logic is not to be trusted in divine things, is, therefore, a direct denial of a fundamental position of Reformed theology, explicitly affirmed in the Confession, as well as an abnegation of fundamental reason, which would not only render thinking in a system impossible, but would discredit at a stroke many of the fundamentals of the faith, such e.g. as the doctrine of the Trinity, and would logically involve the denial of the authority of all doctrine whatsoever, since no single doctrine of whatever simplicity can be ascertained from Scripture except by the use of the processes of the understanding. It is, therefore, an unimportant incident that the recent plea against the use of human logic in determining doctrine has been most sharply put forward in order to justify the rejection of a doctrine which is explicitly taught, and that repeatedly, in the very letter of Scripture; if the plea is valid at all, it destroys at once our confidence in all doctrines, no one of which is ascertained or formulated without the aid of human logic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 226–27.</span></figcaption>

</figure><figure class="quote" id="q-9294aabf54" data-kw="">
<blockquote><p>In the third place, it is said, as I also have read, that they base their faith on this verse, “He who believes and is baptized will be saved” [Mark 16:16]. This they interpret to mean that no man should be baptized before he believes. I must say that they are guilty of a great presumption. For if they follow this principle they cannot venture to baptize before they are certain that the one to be baptized believes, How and when can they ever know that for certain? Have they now become gods so that they can discern the hearts of men and know whether or not they believe? If they are not certain if they believe, why then do they baptize, since they contend so strenuously that faith must precede baptism? Are they not contradicting themselves when they baptize without being certain if faith is there or not? For whoever bases baptism on faith and baptizes on chance and not on certainty that faith is present does nothing better than he who baptizes him who has no faith. For unbelief and uncertain belief are one and the same thing, and both are contrary to the verse, “Whoever believes,” which speaks of a sure faith which they who are to be baptized should have. You say, I know, that he confesses that he believes, etc. Dear sir, confession is neither here nor there. The text does not say, “He who confesses,” but “He who believes.” To have his confession is not to know his faith. With all your reasoning you cannot do justice to this verse unless you also know he has faith, since all men are liars and God alone knows the heart. So whoever bases baptism on the faith of the one to be baptized can never baptize anyone. Even if you baptized a person a hundred times a day you would not at all know if he believes. Why then do you carry on with your rebaptizing, since you contradict yourself and baptize when you are not sure that faith is present, and yet you teach that faith must most certainly be present. This verse, “Whoever believes,” altogether opposes their rebaptizing, since the verse speaks of a certain faith. They base their rebaptizing on an uncertain faith, and in not a syllable do they follow the meaning of the verse. I say the same thing about the baptized one who receives or grounds his baptism on his faith. For he is not sure of his own faith. I would compare the man who lets himself be rebaptized with the man who broods and has scruples because perhaps he did not believe as a child. So when next day the devil comes, his heart is filled with scruples and he says, Ah, now for the first time I feel I have the right faith, yesterday I don’t think I truly believed. So I need to be baptized a third time, the second baptism not being of any avail. You think the devil can’t do such things? You had better get to know him better. He can do worse than that, dear friend. He can go on and cast doubt on the third, and the fourth and so on incessantly (as he indeed has in mind to do), just as he has done with me and many in the matter of confession. We never seemed able to confess sufficiently certain sins, and incessantly and restlessly sought one absolution after the other, one father confessor after the other. Just because we sought to rely on our confession, as those to be baptized now want to rely on their faith. What is the end result? Baptizing without end would result. All this is nonsense. Neither the baptizer nor the baptized can base baptism on a certain faith. This verse of Scripture is far more a judgment on them than on us. And these are the people who don’t want to trust the men who are witnesses of their baptism, but now as men are ready to trust themselves that they are baptized as if they were not men, or as if they were more certain of their faith than the witness of Christendom allows. So I contend that if they want to do justice to this passage, “Whoever believes,” according to their understanding, they must condemn rebaptism much more earnestly than the first baptism. Neither the baptizer nor the baptized can maintain his position, for both are uncertain of their faith, or at least are in constant peril and anxiety. For it happens, indeed it is so in this matter of faith, that often he who claims to believe does not at all believe; and on the other hand, he who doesn’t think he believes, but is in despair, has the greatest faith. So this verse, “Whoever believes,” does not compel us to determine who has faith or not. Rather, it makes it a matter of every man’s conscience to realize that if he is to be saved he must believe and not pretend that it is sufficient for a Christian to be baptized. For the verse does not say, “Whoever knows that he believes, or, if you know that anyone believes,” but it says, “Whoever believes.” Who has it, has it. One must believe, but we neither should nor can know it for certain.</p></blockquote>

t+want+to+trust+the+men+who+are+witnesses+of+their+baptism%2C+but+now+as+men+are+ready+to+trust+themselves+that+they+are+baptized+as+if+they+were+not+men%2C+or+as+if+they+were+more+certain+of+their+faith+than+the+witness+of+Christendom+allows.+So+I+contend+that+if+they+want+to+do+justice+to+this+passage%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+according+to+their+understanding%2C+they+must+condemn+rebaptism+much+more+earnestly+than+the+first+baptism.+Neither+the+baptizer+nor+the+baptized+can+maintain+his+position%2C+for+both+are+uncertain+of+their+faith%2C+or+at+least+are+in+constant+peril+and+anxiety.+For+it+happens%2C+indeed+it+is+so+in+this+matter+of+faith%2C+that+often+he+who+claims+to+believe+does+not+at+all+believe%3B+and+on+the+other+hand%2C+he+who+doesn%E2%80%99t+think+he+believes%2C+but+is+in+despair%2C+has+the+greatest+faith.+So+this+verse%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+does+not+compel+us+to+determine+who+has+faith+or+not.+Rather%2C+it+makes+it+a+matter+of+every+man%E2%80%99s+conscience+to+realize+that+if+he+is+to+be+saved+he+must+believe+and+not+pretend+that+it+is+sufficient+for+a+Christian+to+be+baptized.+For+the+verse+does+not+say%2C+%E2%80%9CWhoever+knows+that+he+believes%2C+or%2C+if+you+know+that+anyone+believes%2C%E2%80%9D+but+it+says%2C+%E2%80%9CWhoever+believes.%E2%80%9D+Who+has+it%2C+has+it.+One+must+believe%2C+but+we+neither+should+nor+can+know+it+for+certain.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Concerning+Rebaptism+in+Luther%E2%80%99s+Works%2C+Vol.+40%3A+Church+and+Ministry+II%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+40+%28Philadelphia%3A+Fortress+Press%2C+1999%29%2C+239%E2%80%9341.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9294aabf54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9294aabf54.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/luther-challenges-the-anabaptist-interpretation-of-mark-1616/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-a761f3de04" data-kw="">
<blockquote><p>If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone. …Faith, therefore, is not the gift of the church, except improperly and in a mere ministerial capacity; but it is properly and necessarily the gift and effect of the Holy Spirit speaking through the scriptures. The sum of the matter is this: faith is produced by scripture alone; therefore the true sense of scripture is to be discovered from the scripture itself alone. Our third argument stands thus: The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope. The major is self-evident. The minor, namely, that none of these properties exist in any visible church or in the pope, is clear also. …As to Cyprian, his error did not lie in rejecting custom and appealing to scripture, (for he is praised by Augustine for doing so,) but in thinking that his opinion could be established by scripture, whereas scripture is subversive of it. Even Gratian, Dist. 8 and 9, approves of Cyprian for refusing to yield to mere custom2. Bellarmine subjoins that the Arians (to mention no more) appealed to the scripture alone. I answer: The Arians clung to the bare words of scripture: we do not imitate them in that. We do not reject terms which never occur in scripture, provided the sense and force of those terms be contained in scripture, as we have frequently replied already: on which account we condemn the Arians for rejecting the Homoüsion. However, religion and piety do not consist in words; and Luther said truly, that he should not be a heretic if he rejected the term Homoüsion, and yet so thought of the Son of God as the scriptures have delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588), 328, 448, 611.</span></figcaption>

</figure><figure class="quote" id="q-2a5d66172a" data-kw="">
<blockquote><p>The Papists object, (1.) That the church is the supreme and infallible judge; from Deut. xvii. 8–13? Ans. There must be an umpire for the decision of controversies in church and state, for sake of order and peace, for determining rights and punishments; and in the visible church a judge is appointed for such a purpose, not to be a lord of our faith. And of such a judge, the passage in question speaks. This does not take away the right of private judgment, but only the right of persons to claim privileges in the church, against the judgment of others, on their own private judgment. Nor are these courts and judges infallible.

… They object, (2.) That God has granted infallibility and superior authority to the church; Matt. xviii. 17? Ans. (1.) In this passage Christ did not commit to the church infallible authority, nor authority to take away the right of private judgment, as accountable to God; but authority to regulate outward communion. (2.) The church has no promise of guidance infallible, nor any promise of guidance in taking away the right of private judgment, and substituting her own in its place. (3.) The church has the promise of guidance in her proper duty of regulating outward communion.

… They object, (3) Necessity requires that there be some ultimate judge in ecclesiastical things, as well as civil? Ans. (1.) There is a judge appointed by Christ, for the application of law to outward things, and to regulate outward fellowship, as there is in civil things, for outward order; viz., church courts. (2.) But courts are not an infallible judge, either in civil or ecclesiastical matters. (3.) Neither in civil, nor in ecclesiastical matters, does the judge interfere with private judgment, nor assume the responsibility of moral obligation for the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), pp 74-75.</span></figcaption>

<blockquote><p>What direct proof have we that every man should exercise a judgment of discretion for himself? Ans. (1.) Various commands and exhortations amount to this; as John v. 39; Rom. xiv. 5, “Let every man be fully persuaded in his own mind;” 1 Thess. v. 21, “Prove all things,” &amp;c., and, (2) Approved examples; as Acts xvii. 11. (3.) Inference from duties enjoined; as 1 John iv. 1, “Try the spirits,” &amp;c., which cannot be done but by comparing them with the Scriptures for ourselves. (4.) From our accountability under privileges; and because that accountability cannot be borne by the church, so as to relieve the private person. (5.) From the promise of the Holy Spirit to individuals, with the word; as John xiv. 26; xvi. 13; 2 Thess. ii. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), p. 73.</span></figcaption>

<blockquote><p>In a word, the Confessional doctrine of the sufficiency or completeness of Scripture is the charter of liberty of conscience; God’s prescriptions for faith and conscience are required to be received with humility of heart, and none but God’s.

It must be observed, however, that the teachings and prescriptions of Scripture are not confined by the Confession to what is “expressly set down in Scripture.” Men are required to believe and to obey not only what is “expressly set down in Scripture,” but also what “by good and necessary consequence may be deduced from Scripture.”

This is the strenuous and universal contention of the Reformed theology against Socinians and Arminians, who desired to confine the authority of Scripture to its literal asseverations; and it involves a characteristic honouring of reason as the instrument for the ascertainment of truth. We must depend upon our human faculties to ascertain what Scripture says; we cannot suddenly abnegate them and refuse their guidance in determining what Scripture means.

This is not, of course, to make reason the ground of the authority of inferred doctrines and duties. Reason is the instrument of discovery of all doctrines and duties, whether “expressly set down in Scripture ” or “by good and necessary consequence deduced from Scripture:” but their authority, when once discovered, is derived from God, who reveals and prescribes them in Scripture, either by literal assertion or by necessary implication.

The Confession is only zealous, as it declares that only Scripture is the authoritative rule of faith and practice, so to declare that the whole of Scripture is authoritative, in the whole stretch of its involved meaning. It is the Reformed contention, reflected here by the Confession, that the sense of Scripture is Scripture, and that men are bound by its whole sense in all its implications.

The re-emergence in recent controversies of the plea that the authority of Scripture is to be confined to its expressed declarations, and that human logic is not to be trusted in divine things, is, therefore, a direct denial of a fundamental position of Reformed theology, explicitly affirmed in the Confession, as well as an abnegation of fundamental reason, which would not only render thinking in a system impossible, but would discredit at a stroke many of the fundamentals of the faith, such, e. g., as the doctrine of the Trinity, and would logically involve the denial of the authority of all doctrine whatsoever, since no single doctrine of whatever simplicity can be ascertained from Scripture except by the use of the processes of the understanding.

It is, therefore, an unimportant incident that the recent plea against the use of human logic in determining doctrine has been most sharply put forward in order to justify the rejection of a doctrine which is explicitly taught, and that repeatedly, in the very letter of Scripture; if the plea is valid at all, it destroys at once our confidence in all doctrines, no one of which is ascertained or formulated without the aid of human logic.</p></blockquote>

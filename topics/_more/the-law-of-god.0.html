<blockquote><p>The relation of the law to the Gospel is one of the most important questions of theology. To misunderstand it, is to misunderstand the whole theory of the Divine government, and the whole plan of redemption. It needs not to add that it is, in a very marked and special sense, one of the questions of the day.

Views regarding it have been recently, and ostentatiously promulgated, which cut far deeper into the foundations of both morality and religion, than is at all perceived by multitudes of those who favourably listen to them, or even by some of those who adopt and teach them. …

In bringing out the relation of the law to the mission and work of Christ, the first thing to which attention must be turned, is the great and fundamental fact, that it was the existence of the law, and the necessity which had arisen for upholding it in all its integrity and honour, which brought Christ into this world. As saith the Apostle Paul, “Where no law is, there is no transgression.” In the absence of law there could have been no sinner, and, therefore, no saviour. The proper and scriptural definition of sin is this, — “it is the transgression of the law.” The object of law is to express the will and to assert the authority of the Ruler. The law declares this to be right and that to be wrong — this to be duty and that to be disobedience — this to be required and that to be forbidden.

Where no law is, therefore, it follows of necessity that there is, and can be, no such thing as sin; for, as already has been said, — “sin is the transgression of the law.” It is a contempt of the authority and disregard of the will of God. But that will cannot be disregarded where there is no law to express it; and that authority cannot be contemned, where there is no law to assert it. The fact that law did not begin, for the first time, to exist in this world when it was given on the two tables of stone to the people of Israel, was made conclusively manifest from this, — that there was sin in the world for ages before.

Sin, as Paul tells us (Rom. v. 12), “is not imputed” — is not held to exist; that is, “where there is no law.” But as death, which is the wages of sin, reigned universally among men, “from Adam to Moses,” the conclusion is inevitable that law existed, and was in full force all the while. And I again repeat, it was the existence of this law, as a law, which man had broken, and under whose awful curse and penalty he had consequently fallen, which created the necessity for Christ’s coming into the world, if man was to be saved.

It is this very truth which is explicitly proclaimed in those well-known words of the Epistle to the Galatians (iv. 4-5), “When the fulness of the time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law” (or more strictly and literally “those under the law;” those, that is, that were, and those that are and those that are to be, under the law), “that we might receive the adoption of sons.”

In His pre-existent state, as the eternal and only begotten Son of God, Christ was not under the law. He was then in the form of God, and thought it not robbery to be equal with God. As such, He was not a member or subject of the kingdom of Heaven, but its Sovereign Head and Lord. He possessed, indeed, in that condition, the most absolute and perfect holiness; but it was not the holiness which consists in obedience. The law which is holy, and the commandment which is holy, and just, and good, was conformed to Him; not He to the law. His holiness was exercised as the lawgiver, in making the law, and in governing the world by it.

But in undertaking, and entering on the blessed mission which brought Him down from heaven to earth, He “took upon Him the form of a servant, and was made in the likeness of men.” (Phil. ii. 7). By so doing, He placed himself “under the law;” the very law to which those were subject, whom He had come to redeem. Had they — that is, the human race — kept that law, His interposition in their behalf would not have been required. The law itself would have secured them eternal life. But having broken that law, they had both forfeited the rewards of obedience, and incurred the tremendous penalty of transgression. It was in this extremity that Christ came to seek and to save that which was lost: and this He did, by meeting, in the room and stead of His people — and as their substitute and surety — all the law’s demands.

We have thus seen, as the first result of our inquiry into the subject before us, that the law stands, to the mission and work of Christ, in a relation of the closest and most fundamental kind. Take away the law, and you take away the gospel; for, in taking away the law, you take away the only adequate ground, or necessity, for such a work as Christ came into this world to accomplish.</p></blockquote>

<blockquote><p>Although it is in connection with certain discussions which have lately taken place among us regarding the Sabbath, the mode of its observance, and the grounds of its obligation, that the present course of lectures has originated, it is well to bear in mind that the Sabbath question, properly, is but one branch of a much wider question, involving many other truths, all-important, which it is the design of these lectures to illustrate and defend.

Whether God has given to man, in the Scriptures of the Old and New Testaments, a revelation of His will, which is the only infallible rule of faith and practice; whether that revelation contains, in any proper sense, a law for all men and for all times; and whether the Decalogue, as given from Sinai, and as interpreted and confirmed by our Lord, is to be regarded as a comprehensive summary of that law, still binding therefore as the rule of the Christian’s life; — such are some of the great questions at issue in the present controversy. And they are questions concerning which our opinions will necessarily, to a large extent, be modified by the views which we adopt as to the origin and obligation of the Christian’s day of weekly rest and worship.

For this reason, as well as on account of the acknowledged importance and value of the institution itself, whether considered from a religious, moral, or social point of view, the subject is one well worthy of our best attention. If a man’s way of keeping the Sabbath may be taken as a good index of his Christian character, a criterion of steadfastness or decline in personal religion — and this is on all hands confessed — by a religious teacher’s doctrine concerning the Sabbath, we may judge as to his general soundness in the faith.</p></blockquote>

<blockquote><p>§8. That there is a covenant of God with man naturally convinces even the most savage men of the following:

1. There is a conscience or faculty seated in the soul from birth for distinguishing between those things that are θεοπρεπη, proper to God and worthy of God, and those that are unworthy of God, between those that are praiseworthy and those that are reproachable, between those that are licit and those that are illicit. Its judgment approves the law of God and goads it to do those things that are right and praiseworthy and to avoid the contrary, confirming deeds done justly and condemning deeds done wickedly (Rom. 2:15). Conscience, having been darkened in the sinner by the loss of divine illumination, various arguments, empty opinions, and also by proneness to evil, has been made impotent to present man holy.

Nevertheless, it has not been destroyed entirely, so that it does not accuse sin, make it shameful, and give to man reason to seek a covering for sin, or quicken him to condemn the sin of another, teach him to produce just laws, or even give occasion for boasting after the pattern of one’s innocence either with a show of zeal or as one less depraved. So it is a witness of the rectitude in which man was created (Eccl. 7:29). Rectitude, moreover, shows that the law has been revealed to man: “When the Gentiles not having the law, do the things which are of the law, although they do not have the law, they are a law unto themselves” (Rom. 2:14).

2. The will of man desires the true good, in which he could find pleasure and which is naught but God, longs for immortal life, and fees death. This desire in itself is naught but from the Creator Himself, drawing man to its fruition by the instinct of nature. If this is without effect, it does more to torment man than to delight him. The perfect Creator, moreover, undoubtedly did not wish to create man guilty of vain desire, for misery and torment. Nor can the same desire at the same time be good (compliant with the nature and will of God) and vain, as if it were not proper to God and yet in harmony with His will.

3. The daily and constant benefits by which man is stirred to seek His Creator and Benefactor, love Him, glorify Him, and give thanks to Him, are so powerful that they seem to proclaim, “Seek God” (Acts 17:27; 14:17; Rom. 1:21). His purity, however, allows Him to say to a certain one, “In vain you seek Me” (Isa. 45:18–19). Thus, Scripture makes it clear that it is necessary for those who walk with God to believe that God exists and rewards those who seek Him (Heb. 11:6).</p></blockquote>

<blockquote><p>XXIII. Hence is easily gathered the reason why God wished to recall that [natural] law by Moses, to deliver it to his people viva voce, and proclaimed it in a solemn manner, committing it to writing and comprehending it in the decalogue. For although in upright nature there was no need of such a promulgation, still (after sin) so great was the blindness of mind, such the perversity of will and disturbance of the affections that only remains of this law survived in the hearts of all (like rubbed pictures of the same, which on that account ought to be retouched by the voice and hand of God as by a new brush).

Hence there were weighty causes for that promulgation. (1) That the natural law might be confirmed more and more, lest the remaining traces might gradually be obliterated by the vanity and wickedness of men or be considered as their uncertain and doubtful opinions. (2) That it might be corrected in those things in which it had been corrupted by the fall. (3) That it might be supplemented in those things which were wanting in it and had been obliterated. (4) That the necessity of a mediator might be understood and a desire for him to be enkindled more strongly every day on account of the weakness of man and of the law in the flesh (Rom. 3:20; 8:3; 10:4). (5) That the people of Israel might be joined by this law into one republic and be separated from all other nations (Dt. 4:6, 7; Ps. 147:19, 20; Rom. 9:4).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXIII. Hence is easily gathered the reason why God wished to recall that [natural] law by Moses, to deliver it to his people viva voce, and proclaimed it in a solemn manner, committing it to writing and comprehending it in the decalogue. For although in upright nature there was no need of such a promulgation, still (after sin) so great was the blindness of mind, such the perversity of will and disturbance of the affections that only remains of this law survived in the hearts of all (like rubbed pictures of the same, which on that account ought to be retouched by the voice and hand of God as by a new brush).

Hence there were weighty causes for that promulgation. (1) That the natural law might be confirmed more and more, lest the remaining traces might gradually be obliterated by the vanity and wickedness of men or be considered as their uncertain and doubtful opinions. (2) That it might be corrected in those things in which it had been corrupted by the fall. (3) That it might be supplemented in those things which were wanting in it and had been obliterated. (4) That the necessity of a mediator might be understood and a desire for him to be enkindled more strongly every day on account of the weakness of man and of the law in the flesh (Rom. 3:20; 8:3; 10:4). (5) That the people of Israel might be joined by this law into one republic and be separated from all other nations (Dt. 4:6, 7; Ps. 147:19, 20; Rom. 9:4).”

— Francis Turretin, Institutes of Elenctic Theology, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.23.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXIII.+Hence+is+easily+gathered+the+reason+why+God+wished+to+recall+that+%5Bnatural%5D+law+by+Moses%2C+to+deliver+it+to+his+people+viva+voce%2C+and+proclaimed+it+in+a+solemn+manner%2C+committing+it+to+writing+and+comprehending+it+in+the+decalogue.+For+although+in+upright+nature+there+was+no+need+of+such+a+promulgation%2C+still+%28after+sin%29+so+great+was+the+blindness+of+mind%2C+such+the+perversity+of+will+and+disturbance+of+the+affections+that+only+remains+of+this+law+survived+in+the+hearts+of+all+%28like+rubbed+pictures+of+the+same%2C+which+on+that+account+ought+to+be+retouched+by+the+voice+and+hand+of+God+as+by+a+new+brush%29.%0A%0AHence+there+were+weighty+causes+for+that+promulgation.+%281%29+That+the+natural+law+might+be+confirmed+more+and+more%2C+lest+the+remaining+traces+might+gradually+be+obliterated+by+the+vanity+and+wickedness+of+men+or+be+considered+as+their+uncertain+and+doubtful+opinions.+%282%29+That+it+might+be+corrected+in+those+things+in+which+it+had+been+corrupted+by+the+fall.+%283%29+That+it+might+be+supplemented+in+those+things+which+were+wanting+in+it+and+had+been+obliterated.+%284%29+That+the+necessity+of+a+mediator+might+be+understood+and+a+desire+for+him+to+be+enkindled+more+strongly+every+day+on+account+of+the+weakness+of+man+and+of+the+law+in+the+flesh+%28Rom.+3%3A20%3B+8%3A3%3B+10%3A4%29.+%285%29+That+the+people+of+Israel+might+be+joined+by+this+law+into+one+republic+and+be+separated+from+all+other+nations+%28Dt.+4%3A6%2C+7%3B+Ps.+147%3A19%2C+20%3B+Rom.+9%3A4%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+M.+Giger%2C+ed.+James+T.+Dennison+%281679%3B+3+vols%2C+Phillipsburg+NJ%3A+Presbyterian+%26+Reformed%2C+1992%29%2C+11.1.23.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd6aeca99e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd6aeca99e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/21/francis-turretin-on-the-promulgation-of-the-law-of-nature-in-the-decalogue/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-aea43f33ea" data-kw="">
<blockquote><p>O how great then is the Christian’s labour? whose care and duty has no less compass than the commandment of God, which is of such vast comprehension, that the Psalmist, who saw an end of all perfections, could see no end of it. Psalm 119.96. I have seen an end of all perfections, but thy commandment is exceeding broad. The Commandment here includes both Law and Gospel, and the Christians duty extends to, yea, diffuseth it self over both.

First, the Law Moral, this is bound upon the Christian in point of duty to make it his rule, as strictly as it was upon innocent Adam himself, though not upon such strait conditions, and dismal consequences. The Christian is bound to it upon peril of contracting sin, though not of incurring death and damnation; the Christian hath no more liberty to transgress the Law than Adam had, though he hath a promise of pardon upon repentance, when he hath sinned, which Adam had not; how indeed can we imagine that Christ, who was made a curse for sin, would come to be a cloak to sin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Labour and Reward, or, A Sermon, part of which was Preached at the Funeral of the Right Honourable the Lady Mary Vere, relict of Sir Horace Vere, Baron of Tilbury, on the 10th of January, 1671, at Castle Heviningham in Essex</cite>, (London: Ralph Smith, 1672), pp 11-12.</span></figcaption>

</figure><figure class="quote" id="q-dda33fab82" data-kw="">
<blockquote><p>TO WHAT USE THE LAW WAS GIVEN.

First, that is should declare unto us the will of God, how we ought to live, and what works we ought to do, that we may please the Lord our God. …

Secondly, that is should reveal and open unto us our sin and wickedness, while we consider how unable we be of ourselves to do that which the holy, righteous, and good law of God requireth of us to be done. …

Thirdly, after we have learned our weakness, our wretchedness, our sin, our wickedness, by comparing our strength and life with the law of God, which proveth us all sinners and worthy of eternal damnation, lest we should fall into desperation, and so be damned, the law was given of God to be a school-master unto us to lead us unto Christ, the alone end and perfect fulfiller of all the laws of God; that we, through faith taking upon us his righteousness, and his fulfilling of the law, might be found blameless through him in the sight of God, and so be made inheritors of everlasting glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 496-97.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-de3fc4268c" data-kw="">
<blockquote><p>In general, Christ requires us to hearken to the whole Word; to the Law to convince us and drive us out of ourselves unto Jesus, and to the Gospel which proclaims salvation to the sinner; to the Law so that according to its never-ceasing demands, we may direct all our actions thereby as our only rule; to the Gospel which shews us in whom is our power to obey the Law. O! how sweet it is to walk between Sinai and Zion, to go again and again unto Jesus for power to do all that which God in His ever-enduring Law demands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 119.</span></figcaption>

</figure><figure class="quote" id="q-2e65c72609" data-kw="">
<blockquote><p>We may observe this Rule, That the Affirmative Commands include in them the Prohibition of the contrary Sin; and the Negative Commands include the Injunction of the contrary Duty: for it is necessary that the contrary to what is forbidden, must be commanded; and again, the contrary to what is commanded, must be forbidden: As for instance, God in the third Commandment, forbids the taking of his Name in vain, therefore by consequence the hallowing and sanctifying his Name is therein commanded. The Fourth requires the sanctifying of the Sabbath-day; therefore it surely followeth, that the Prophanation of its is thereby forbidden. The Fifth commands us to Honor our Parents; therefore it forbids us to be Disobedient or Injurious to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 25.</span></figcaption>

</figure><figure class="quote" id="q-dab7e8e370" data-kw="">
<blockquote><p>[T]he difference of the Law and Gospel lieth not in this, (as some do assign) that one is the instrument of grace, and the other not; (for God useth both, as I shall shew) but in this, that the holiness wrought in us by preaching of the Word of God, whether it be Law or gospel, doth not justify us; but this favour is an evangelical manner, by forgiving whatsoever is irregular in us, and communicating Christ his righteousness to us. Therefore let us not confound the Law, or Gospel, nor yet make them so contrary in their natures and effects, that where one is, the other cannot be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 196.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[T]he difference of the Law and Gospel lieth not in this, (as some do assign) that one is the instrument of grace, and the other not; (for God useth both, as I shall shew) but in this, that the holiness wrought in us by preaching of the Word of God, whether it be Law or gospel, doth not justify us; but this favour is an evangelical manner, by forgiving whatsoever is irregular in us, and communicating Christ his righteousness to us. Therefore let us not confound the Law, or Gospel, nor yet make them so contrary in their natures and effects, that where one is, the other cannot be.”

<blockquote><p>FIRST QUESTION

Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish.

I. As the doctrine concerning the law of God (the discussion of which we now enter upon with the favour of God) properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life – as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin – because as sin is illegally (anomia), from no other source than the law can its truth and heinousness be ascertained (Rom. 3:20). (3) For preparation for grace – that from the declaration of man’s sin and misery, the necessity of saving grace may be unfolded and a desire for it excited in us (in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24). …

IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which he also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolic law given to Adam [Gen. 2:16, 17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God).

There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedent to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere. …

XXII. If it is asked how this natural law agrees with or differs from the moral law, the answer is easy. It agrees as to substance and with regard to principles, but differs as to accidents and with regard to conclusions. The same duties (both toward God and toward our neighbour) prescribed by the moral law are also contained in the natural law. The difference is with regard to the mode of delivery.

In the moral law, these duties are clearly, distinctly and fully declared; while in the natural law they are obscurely and imperfectly declared both because many intimations have been lost and obliterated by sin and because it has been variously corrupted by the vanity and wickedness of men (Rom. 1:20-22). Not to mention other differences: as that the natural law was engraven upon the hearts of men, the moral law on stony tables; the former pertains to all universally, the latter only to those called by the word, the former contains nothing except morality, the latter has also certain ceremonials mingled with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.1, 4, 22.</span></figcaption>

<blockquote><p>Having proved it is a Covenant, all the difficulty remaineth in declaring what Covenant it is; for here is much difference of judgements, even with the Learned and Orthodox: and this doth arise from the different places of the Scripture, which, although they be not contrary one to another, yet the weakness of our understandings is many times overmastered by some places:

Some (as you have heard) make it a Covenant of works, others a mixt Covenant, some a subservient Covenant; but I am persuaded to go with those who hold it to be a Covenant of grace: and indeed, it is very easy to bring strong arguments for the affirmative; but then there will be some difficulty to answer such places as are brought for the negative; and if the affirmative prove true, the dignity and excellency of the Law will appear the more. Now, before I come to the arguments, which induce me hereunto, consider in what sense it may be explained, that it is a Covenant of grace.</p></blockquote>

<blockquote><p>Q. 36 What is the difference between the law and the gospel?

A. The law contains the covenant of nature established by God with man in creation; that means, it is known by man from nature, it requires perfect obedience of us to God, and it promises eternal life to those who keep it but threatens eternal punishment to those who do not.

The gospel, however, contains the covenant of grace; that means, although it exists, it is not known at all from nature; it shows us Christ’s fulfilment of that righteousness which the law requires, and its restoration in us through Christ’s Spirit; and it promises eternal life freely on account of Christ to those who believe in him.</p></blockquote>

<blockquote><p>Secondly, it is evident from the distribution of the Scripture; for it is divided into the Law and the Gospel: but justification is not sought or contained in the doctrine of the Law. Not in that part which prescribes obedience and promises a recompence to those fulfilling its commands; because the conscience of every one witnesses, that we cannot be justified by the legal covenant. Much less in that other part which contains the threats and punishments due to those who violate the law; because this doctrine affords not the hope of salvation, but inspires the dread of hell. It remains, therefore, that justification be sought in the Gospel, i. e. in the promises of grace; and the act of faith, as far as it justifies, should be especially directed to these promises. …

For the divine word is not adapted in every part to produce hope; nay the law serves to arouse fear. Hope, therefore, arises, not from the preaching of the legal covenant. This do and thou shalt live; but from the promulgation of the evangelical covenant, Believe, and thou shalt be saved. Well spake Tertullian, advers. Marc. iii. cap. 16, The possession of eternal life comes not to us through the discipline of the law, but through the grace of the Gospel. As the possession is through grace, not through the law, so the hope of the possession is excited through the preaching of the grace of the gospel, not of the doctrine of the law. They who expect eternal life from the covenant of works, do not hope, but presume. But it has been shewn before by us, that the proper object of faith and hope, is, not all those things in general which are delivered in the word, but the promises of grace …</p></blockquote>

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 63, 86.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+it+is+evident+from+the+distribution+of+the+Scripture%3B+for+it+is+divided+into+the+Law+and+the+Gospel%3A+but+justification+is+not+sought+or+contained+in+the+doctrine+of+the+Law.+Not+in+that+part+which+prescribes+obedience+and+promises+a+recompence+to+those+fulfilling+its+commands%3B+because+the+conscience+of+every+one+witnesses%2C+that+we+cannot+be+justified+by+the+legal+covenant.+Much+less+in+that+other+part+which+contains+the+threats+and+punishments+due+to+those+who+violate+the+law%3B+because+this+doctrine+affords+not+the+hope+of+salvation%2C+but+inspires+the+dread+of+hell.+It+remains%2C+therefore%2C+that+justification+be+sought+in+the+Gospel%2C+i.+e.+in+the+promises+of+grace%3B+and+the+act+of+faith%2C+as+far+as+it+justifies%2C+should+be+especially+directed+to+these+promises.+%E2%80%A6%0A%0AFor+the+divine+word+is+not+adapted+in+every+part+to+produce+hope%3B+nay+the+law+serves+to+arouse+fear.+Hope%2C+therefore%2C+arises%2C+not+from+the+preaching+of+the+legal+covenant.+This+do+and+thou+shalt+live%3B+but+from+the+promulgation+of+the+evangelical+covenant%2C+Believe%2C+and+thou+shalt+be+saved.+Well+spake+Tertullian%2C+advers.+Marc.+iii.+cap.+16%2C+The+possession+of+eternal+life+comes+not+to+us+through+the+discipline+of+the+law%2C+but+through+the+grace+of+the+Gospel.+As+the+possession+is+through+grace%2C+not+through+the+law%2C+so+the+hope+of+the+possession+is+excited+through+the+preaching+of+the+grace+of+the+gospel%2C+not+of+the+doctrine+of+the+law.+They+who+expect+eternal+life+from+the+covenant+of+works%2C+do+not+hope%2C+but+presume.+But+it+has+been+shewn+before+by+us%2C+that+the+proper+object+of+faith+and+hope%2C+is%2C+not+all+those+things+in+general+which+are+delivered+in+the+word%2C+but+the+promises+of+grace+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1831%29%2C+i%2C+63%2C+86.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32e1f94fd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32e1f94fd8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/27/john-davenant-on-the-law-gospel-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>For the reason why the law inculcates all these precepts is, that when a man has failed in fulfilling them, he may not be swollen with pride, and so exalt himself, but may in very weariness betake himself to grace. Thus the law fulfils its office as “schoolmaster,” so terrifying the man as “to lead him to Christ,” to give Him his love.</p></blockquote>

</figure><figure class="quote" id="q-cfe744cbde" data-kw="">
<blockquote><p>And the Decalogue, or Ten Commandments, is a summary or brief epitome of those laws, written by the immediate finger of God: and contracted into so short an abridgement, not only to ease our memories, but to gain our veneration; for sententious commands are best befitting Majesty. And, indeed, if we consider the paucity of the expressions, and yet the copiousness and variety of the matter contained in them, we must needs acknowledge, not only their authority to be divine, but likewise the skill and art in reducing the Whole Duty of Man to so brief a compendium. … The rest of the Scripture is but a commentary upon them: either exhorting us to obedience, by arguments; or alluring us to it, by promises; or frightening us from transgressing, by threatenings: or exciting us to the one, and restraining us from the other, by examples recorded in the historical part of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), pp 24-25.</span></figcaption>

</figure><figure class="quote" id="q-20de63699f" data-kw="">
<blockquote><p>Thus ye see Jesus Christ is either the subject of all in the scriptures, or the end of it all. He is the very proper subject of the gospel. Paul knew nothing but Christ crucified in his preaching; and he is the very end and scope “of the law for righteousness,” Rom. 10.3. All the preaching of a covenant of works, all the curses and threatenings of the Bible, all the rigid exactions of obedience, all come to this one great design; not that we set about such a walking to please God, or do something to pacify him, but that we being concluded under sin and wrath on the one hand, and an impossibility to save ourselves on the other hand, Gal. 3.22, Rom. 5.20, 21, may be pursued unto Jesus Christ for righteousness and life, who is both able to save us, and ready to welcome us.

Therefore the Gospel opens the door of salvation in Christ, the law is behind us with fire and sword, and destruction pursuing us; and all for this end, that sinners may come to him and have life. Thus the law is made the pedagogue of the soul to lead to Christ; Christ is behind us, cursing, condemning, threatening us, and he is before with stretched-out arms ready to receive us, bless us, and save us, inviting, promising, exhorting to have life. Christ is on Mount Sinai, delivering the law with thunders, Acts 7.38; and he is on the Mount Zion, in the calm voice; he is both upon the mountain of cursings and blessings, and on both doing the part of a mediator, Gal. 3.19,20.

It is love that is in his heart which made him first cover his countenance with frowns and threats; and it is love that again displays itself in his smiling countenance. Thus souls are enclosed with love pursuing and love receiving; and thus the law, which seems most contrary to the Gospel, testifies of Christ. It gives him this testimony, that except salvation be in him, it is nowhere else.

The law says, It is not in me, seek it not in obedience; I can do nothing but destroy you, if you abide under my jurisdiction. The ceremonies and sacrifices say, If you can behold the end of this ministry,—if a veil be not upon your hearts, as it was upon Moses’ face, (2 Cor. 3. 13.) you may see where it is; it is not in your obedience, but in the death and suffering of the Son of God whom we represent. Then the Gospel takes all these coverings and veils away and gives a plain and open testimony of him: There is no name under heaven to be saved by, but Christ’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 48-49.</span></figcaption>

</figure><figure class="quote" id="q-83386abcb3" data-kw="">
<blockquote><p>Wherefore I conceive the two covenants to have been both delivered on Mount Sinai to the Israelites. First, The covenant of grace made with Abraham, contained in the preface, repeated and promulgate there unto Israel, to be believed and embraced by faith, that they might be saved; to which were annexed the ten commandments, given by the Mediator Christ, the head of the covenant, as a rule of life to his covenant people.

Secondly, The covenant of works made with Adam, contained in the same ten commands, delivered with thunderings and lightnings, the meaning of which was afterwards cleared by Moses, describing the righteousness of the law and sanction thereof, repeated and promulgate to the Israelites there, as the original perfect rule of righteousness, to be obeyed; and yet were they no more bound hereby to seek righteousness by the law than the young man was by our Saviour’s saying to him, Mat. xix. 17, 18, ”If thou wilt enter into life, keep the commandments — Thou shalt do no murder,” &amp;c. The latter was a repetition of the former.

Thus there is no confounding of the two covenants of grace and works; but the latter was added to the former as subservient unto it, to turn their eyes towards the promise, or covenant of grace: “God gave it to Abraham by promise. Wherefore then serveth the law? it was added, because of transgressions, till the Seed should come,” Gal. iii. 18, 19. So it was unto the promise given to Abraham, that this subservient covenant was added; and that promise we have found in the preface to the ten commands. To it, then, was the subservient covenant, according to the apostle, added, put, or set to, as the word properly signifies. So that it was no part of the covenant of grace, the which was entire to the fathers, before the time that it was set to it; and yet is, to the New Testament church, after that it is taken away from it: for, says the apostle, “It was added till the Seed should come.” Hence it appears, that the covenant of grace was, both in itself, and in God’s intention, the principal part of the Sinai transaction: nevertheless the covenant of works was the most conspicuous part of it, and lay most open to the view of the people.

According to this account of the Sinai transaction, the ten commands, there delivered, must come under a twofold notion or consideration; namely, as the law of Christ, and as the law of works: and this is not strange, if it is considered, that they were twice written on tables of stone, by the Lord himself, — the first tables the work of God, Exod. xxxii. 16, which were broken in pieces, verse 19, called the tables of the covenant, Deut. ix. 11, 15,— the second tables the work of Moses, the typical Mediator, Exod. xxxiv. 1; deposited at first (it would seem) in the tabernacle, mentioned chap, xxxiii. 7, afterward, at the rearing of the tabernacle with all its furniture, laid up in the ark within the tabernacle, chap. xxv. 16; and whether or not some such thing is intimated, by the double accentuation of the decalogue, let the learned determine; but to the ocular inspection it is evident, that the preface to the ten commands, Exod. xx. 2, and Deut. v. 6, stands in the original, both as a part of a sentence joined to the first command, and also as an entire sentence separated from it, and shut up by itself.

Upon the whole, one may compare with this the first promulgation of the covenant of grace, by the messenger of the covenant in paradise, Gen. iii. 15, and the flaming sword placed there by the same hand, “turning every way to keep the way of the Tree of Life.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Wherefore I conceive the two covenants to have been both delivered on Mount Sinai to the Israelites. First, The covenant of grace made with Abraham, contained in the preface, repeated and promulgate there unto Israel, to be believed and embraced by faith, that they might be saved; to which were annexed the ten commandments, given by the Mediator Christ, the head of the covenant, as a rule of life to his covenant people.

Secondly, The covenant of works made with Adam, contained in the same ten commands, delivered with thunderings and lightnings, the meaning of which was afterwards cleared by Moses, describing the righteousness of the law and sanction thereof, repeated and promulgate to the Israelites there, as the original perfect rule of righteousness, to be obeyed; and yet were they no more bound hereby to seek righteousness by the law than the young man was by our Saviour’s saying to him, Mat. xix. 17, 18, ”If thou wilt enter into life, keep the commandments — Thou shalt do no murder,” &amp;c. The latter was a repetition of the former.

Thus there is no confounding of the two covenants of grace and works; but the latter was added to the former as subservient unto it, to turn their eyes towards the promise, or covenant of grace: “God gave it to Abraham by promise. Wherefore then serveth the law? it was added, because of transgressions, till the Seed should come,” Gal. iii. 18, 19. So it was unto the promise given to Abraham, that this subservient covenant was added; and that promise we have found in the preface to the ten commands. To it, then, was the subservient covenant, according to the apostle, added, put, or set to, as the word properly signifies. So that it was no part of the covenant of grace, the which was entire to the fathers, before the time that it was set to it; and yet is, to the New Testament church, after that it is taken away from it: for, says the apostle, “It was added till the Seed should come.” Hence it appears, that the covenant of grace was, both in itself, and in God’s intention, the principal part of the Sinai transaction: nevertheless the covenant of works was the most conspicuous part of it, and lay most open to the view of the people.

According to this account of the Sinai transaction, the ten commands, there delivered, must come under a twofold notion or consideration; namely, as the law of Christ, and as the law of works: and this is not strange, if it is considered, that they were twice written on tables of stone, by the Lord himself, — the first tables the work of God, Exod. xxxii. 16, which were broken in pieces, verse 19, called the tables of the covenant, Deut. ix. 11, 15,— the second tables the work of Moses, the typical Mediator, Exod. xxxiv. 1; deposited at first (it would seem) in the tabernacle, mentioned chap, xxxiii. 7, afterward, at the rearing of the tabernacle with all its furniture, laid up in the ark within the tabernacle, chap. xxv. 16; and whether or not some such thing is intimated, by the double accentuation of the decalogue, let the learned determine; but to the ocular inspection it is evident, that the preface to the ten commands, Exod. xx. 2, and Deut. v. 6, stands in the original, both as a part of a sentence joined to the first command, and also as an entire sentence separated from it, and shut up by itself.

Upon the whole, one may compare with this the first promulgation of the covenant of grace, by the messenger of the covenant in paradise, Gen. iii. 15, and the flaming sword placed there by the same hand, “turning every way to keep the way of the Tree of Life.”

— Edward Fisher, The Marrow of Modern Divinity, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 197-98n. (The footnote is Boston’s.)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWherefore+I+conceive+the+two+covenants+to+have+been+both+delivered+on+Mount+Sinai+to+the+Israelites.+First%2C+The+covenant+of+grace+made+with+Abraham%2C+contained+in+the+preface%2C+repeated+and+promulgate+there+unto+Israel%2C+to+be+believed+and+embraced+by+faith%2C+that+they+might+be+saved%3B+to+which+were+annexed+the+ten+commandments%2C+given+by+the+Mediator+Christ%2C+the+head+of+the+covenant%2C+as+a+rule+of+life+to+his+covenant+people.%0A%0ASecondly%2C+The+covenant+of+works+made+with+Adam%2C+contained+in+the+same+ten+commands%2C+delivered+with+thunderings+and+lightnings%2C+the+meaning+of+which+was+afterwards+cleared+by+Moses%2C+describing+the+righteousness+of+the+law+and+sanction+thereof%2C+repeated+and+promulgate+to+the+Israelites+there%2C+as+the+original+perfect+rule+of+righteousness%2C+to+be+obeyed%3B+and+yet+were+they+no+more+bound+hereby+to+seek+righteousness+by+the+law+than+the+young+man+was+by+our+Saviour%E2%80%99s+saying+to+him%2C+Mat.+xix.+17%2C+18%2C+%E2%80%9DIf+thou+wilt+enter+into+life%2C+keep+the+commandments+%E2%80%94+Thou+shalt+do+no+murder%2C%E2%80%9D+%26c.+The+latter+was+a+repetition+of+the+former.%0A%0AThus+there+is+no+confounding+of+the+two+covenants+of+grace+and+works%3B+but+the+latter+was+added+to+the+former+as+subservient+unto+it%2C+to+turn+their+eyes+towards+the+promise%2C+or+covenant+of+grace%3A+%E2%80%9CGod+gave+it+to+Abraham+by+promise.+Wherefore+then+serveth+the+law%3F+it+was+added%2C+because+of+transgressions%2C+till+the+Seed+should+come%2C%E2%80%9D+Gal.+iii.+18%2C+19.+So+it+was+unto+the+promise+given+to+Abraham%2C+that+this+subservient+covenant+was+added%3B+and+that+promise+we+have+found+in+the+preface+to+the+ten+commands.+To+it%2C+then%2C+was+the+subservient+covenant%2C+according+to+the+apostle%2C+added%2C+put%2C+or+set+to%2C+as+the+word+properly+signifies.+So+that+it+was+no+part+of+the+covenant+of+grace%2C+the+which+was+entire+to+the+fathers%2C+before+the+time+that+it+was+set+to+it%3B+and+yet+is%2C+to+the+New+Testament+church%2C+after+that+it+is+taken+away+from+it%3A+for%2C+says+the+apostle%2C+%E2%80%9CIt+was+added+till+the+Seed+should+come.%E2%80%9D+Hence+it+appears%2C+that+the+covenant+of+grace+was%2C+both+in+itself%2C+and+in+God%E2%80%99s+intention%2C+the+principal+part+of+the+Sinai+transaction%3A+nevertheless+the+covenant+of+works+was+the+most+conspicuous+part+of+it%2C+and+lay+most+open+to+the+view+of+the+people.%0A%0AAccording+to+this+account+of+the+Sinai+transaction%2C+the+ten+commands%2C+there+delivered%2C+must+come+under+a+twofold+notion+or+consideration%3B+namely%2C+as+the+law+of+Christ%2C+and+as+the+law+of+works%3A+and+this+is+not+strange%2C+if+it+is+considered%2C+that+they+were+twice+written+on+tables+of+stone%2C+by+the+Lord+himself%2C+%E2%80%94+the+first+tables+the+work+of+God%2C+Exod.+xxxii.+16%2C+which+were+broken+in+pieces%2C+verse+19%2C+called+the+tables+of+the+covenant%2C+Deut.+ix.+11%2C+15%2C%E2%80%94+the+second+tables+the+work+of+Moses%2C+the+typical+Mediator%2C+Exod.+xxxiv.+1%3B+deposited+at+first+%28it+would+seem%29+in+the+tabernacle%2C+mentioned+chap%2C+xxxiii.+7%2C+afterward%2C+at+the+rearing+of+the+tabernacle+with+all+its+furniture%2C+laid+up+in+the+ark+within+the+tabernacle%2C+chap.+xxv.+16%3B+and+whether+or+not+some+such+thing+is+intimated%2C+by+the+double+accentuation+of+the+decalogue%2C+let+the+learned+determine%3B+but+to+the+ocular+inspection+it+is+evident%2C+that+the+preface+to+the+ten+commands%2C+Exod.+xx.+2%2C+and+Deut.+v.+6%2C+stands+in+the+original%2C+both+as+a+part+of+a+sentence+joined+to+the+first+command%2C+and+also+as+an+entire+sentence+separated+from+it%2C+and+shut+up+by+itself.%0A%0AUpon+the+whole%2C+one+may+compare+with+this+the+first+promulgation+of+the+covenant+of+grace%2C+by+the+messenger+of+the+covenant+in+paradise%2C+Gen.+iii.+15%2C+and+the+flaming+sword+placed+there+by+the+same+hand%2C+%E2%80%9Cturning+every+way+to+keep+the+way+of+the+Tree+of+Life.%E2%80%9D%0A%0A%E2%80%94+Edward+Fisher%2C+The+Marrow+of+Modern+Divinity%2C+%281646%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+vii%2C+197-98n.+%28The+footnote+is+Boston%E2%80%99s.%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83386abcb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83386abcb3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/12/thomas-boston-on-the-two-covenants-delivered-at-sinai/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Nom. Did he break all the commandments, say you? Sir, I beseech you shew me wherein.

Evan. 1. He chose himself another God when he follows the devil.

2. He idolized and deified his own belly; as the apostle’s phrase is, “He made his belly his God.”

3. He took the name of God in vain, when he believed him not.

4. He kept not the rest and estate wherein God had set him.

5. He dishonoured his Father who was in heaven; and therefore his days were not prolonged in that land which the Lord his God had given him.

6. He massacred himself and all his posterity.

7. From Eve he was a virgin, but in eyes and mind he committed spiritual fornication.

8. He stole, like Achan, that which God had set aside not to be meddled with; and this his stealth is that which troubles all Israel :— the whole world.

9. He bear witness against God, when he believed the witness of the devil before him.

10. He coveted an evil covetousness, like Ammon, which cost him his life, and all his progeny. Now, whosoever considers what a nest of evils here were committed at one blow, must needs, with Musculus, see our case to be such, that we are compelled every way to commend the justice of God, and to condemn the sin of our first parents, saying concerning all mankind, as the prophet Hosea does concerning Israel, “Israel, thou hast destroyed thyself,” Hos. xiii. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 178-79.</span></figcaption>

<blockquote><p>Q. How many ways does the Word of God teach us to come to the Kingdom of Heaven? Ans. Two.

Q. Which are they? A. The Law and the Gospel.

Q. What saith the Law? A. Do this and thou shalt live.

Q. What saith the Gospel? A. Believe in Jesus Christ, and thou shalt be saved.

Q. Can we come to the Kingdom of Heaven by the way of God’s Law? A. No.

Q. Why so? A. Because we cannot do it.

Q. Why can we not do it? A. Because we are all born in sin.

Q. What is it to be born in sin? A. To be naturally prone to evil, and untoward to that which is good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Catechetical Exposition of Christian Doctrine</cite>, (London, 1633), pp 3-4.</span></figcaption>

<blockquote><p>Touching the time of God’s worship, it was the seventh day from the beginning of the creation, the Sabbath day. And here we must note, that the keeping of the Sabbath is moral. Some indeed do plead that it is but a ceremony; yet falsely: for it was ordained before the fall of man, at which time Ceremonies signifying sanctification had no place. Nay mark further: Adam in his innocency was not clogged with sin as we are; and yet then he had a set Sabbath to worship God his creator: and therefore much more need hath every one of us a Sabbath day, wherein we may sever our selves from the works of our callings, and the works of sin, to the worship of God in the exercise of religion, and godly meditation of our creation.

This point must be learned of us, for when no occasion is offered of business, then men will formally seem to keep the Sabbath: but if there come occasion of breaking the Sabbath, as traffic, gaming, and vain shows, then Sabbath farewell, men will have their pleasures, let them worship God that will. But let us remember in the fear of God, that whosoever continueth in the breach of this law being moral, God will no less pour forth his punishments upon them, then for the breach of any other commandment: the consideration whereof, must move every man to a reverent sanctifying of the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 238.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-5ff5aaf85c" data-kw="">
<blockquote><p>We know it was the cursed error of the Manichees and Marcionites, that the Law was only carnal, and had only carnal promises; whereas it’s evident, that the Fathers had the same faith for substance as we have. It’s true, if we take Law and Gospel in this strict difference, as some Divines do, that all the Precepts, wheresoever they are, must be under the Law, and all the Promises be reduced to the Gospel, whether in Old or New Testament; in which sense Divines then say, Lex jubet &amp; Gratia juvat; the Law commands, and Grace helps; and, Lex imperat, the Law commands, and Fides impetrat, Faith obtaineth; then the Law can have no sanction by Promise: But where can this be shewed in Scripture? When we speak of the sanction of the Law by Promise, we take it as in the administration of it by Moses, which was Evangelical; not as it was given to Adam, with a Promise of Eternal life upon perfect obedience: for the Apostle Paul’s propositions, To him that worketh, the reward is reckoned of debt; and, the doers of the Law are justified, were never verifiable, but in the state of innocency.</p></blockquote>

<blockquote><p>This is one principal difference between the law and the gospel, and was ever so esteemed in the church of God, until all communication of efficacious grace began to be called in question: The law guides, directs, commands, all things that are against the interest and rule of sin. It judgeth and condemneth both the things that promote it and the persons that do them; it frightens and terrifies the consciences of those who are under its dominion. But if you shall say unto it, “What then shall we do? this tyrant, this enemy, is too hard for us. What aid and assistance against it will you afford unto us? what power will you communicate unto its destruction?” Here the law is utterly silent, or says that nothing of this nature is committed unto it of God; nay, the strength it hath it gives unto sin for the condemnation of the sinner: “The strength of sin is the law.” But the gospel, or the grace of it, is the means and instrument of God for the communication of internal spiritual strength unto believers. By it do they receive supplies of the Spirit or aids of grace for the subduing of sin and the destruction of its dominion. By it they may say they can do all things, through Him that enables them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the dominion of sin and grace; wherein sin’s reign is discovered, in whom it is, and in whom it is not; how the law supports it; how grace delivers from it, by setting up its dominion in the heart</cite>, (London, 1688) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1965), vii, 546-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-280290dbac" data-kw="">
<blockquote><p>I have endeavoured to give the Law its due, and the Gospel its due, remembering that of Luther […] He that knoweth how to distinguish between Law and Gospel, let him give thanks to God, and know that he is a Divine.</p></blockquote>

<blockquote><p>4. The Bible contains laws addressed to nations and rulers for their direction in civil things. – The Bible is the word of Christ. The Spirit by whom the Old Testament prophets were inspired, was “the Spirit of Christ,” 1 Pet. i. 11. And, from the preface to the moral law, “I am the Lord thy God,” (Ex. xx. 2,) we ascertain the fact that this law came to Israel, and comes to us, out of the mouth of Christ, and is thus proclaimed anew to mankind, by his authority. The Westminster Assembly have well paraphrased the preface to the moral law, in the following words; “Because God is the Lord, and our God, and Redeemer, therefore, we are bound to keep all his commandments.” [Shorter Catechism Q. 24] The law of the Ten Commandments is most assuredly binding upon nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia, 1842), p. 20.</span></figcaption>

</figure><figure class="quote" id="q-e111c0082b" data-kw="">
<blockquote><p>God is the just Judge of crimes, and if he did not exercise this justice, he would not be God. […] Third, the moral and ceremonial law itself establishes the same thing. Since the precepts of the former (as to a great part) are indispensable and founded upon the eternal and natural right of God, it is necessary that the penal sanction added to them should be of the same nature; also because (as has been shown before) there is a natural and necessary connection between sin and punishment, moral and physical evil, just as moral and physical good are mutually connected by an indissoluble bond. […]

Thus a magistrate would err, if by a too great indulgence he would dispense with the right of punishment as this would give impunity to crimes. Now the penal right of which we speak is not a positive but a natural right, founded on the very holiness and justice of God. It springs from the essential dependence of the creature (subjecting it to its Creator) both as to obedience by reason of precepts and as to punishment by reason of their sanction. It is not the private right of a creditor; for although sins are sometimes compared to debts, yet they are also crimes which cannot remain unpunished without prejudice to the laws. Rather it is the public right of a ruler because God does not punish as the offended part, but as Judge and the supreme ruler of the world.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“God is the just Judge of crimes, and if he did not exercise this justice, he would not be God. […] Third, the moral and ceremonial law itself establishes the same thing. Since the precepts of the former (as to a great part) are indispensable and founded upon the eternal and natural right of God, it is necessary that the penal sanction added to them should be of the same nature; also because (as has been shown before) there is a natural and necessary connection between sin and punishment, moral and physical evil, just as moral and physical good are mutually connected by an indissoluble bond. […]

Thus a magistrate would err, if by a too great indulgence he would dispense with the right of punishment as this would give impunity to crimes. Now the penal right of which we speak is not a positive but a natural right, founded on the very holiness and justice of God. It springs from the essential dependence of the creature (subjecting it to its Creator) both as to obedience by reason of precepts and as to punishment by reason of their sanction. It is not the private right of a creditor; for although sins are sometimes compared to debts, yet they are also crimes which cannot remain unpunished without prejudice to the laws. Rather it is the public right of a ruler because God does not punish as the offended part, but as Judge and the supreme ruler of the world.”

11c0082b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/08/23/francis-turretin-on-penal-sanctions-and-the-moral-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Q. What is the third rule?

A. When the Law forbiddeth or commandeth any thing, it forbiddeth and commandeth all means, occasions, and provocations thereunton.

Q. What is the fourth rule?

A. Whatsoever the Law commands, it forbids the contrary; whatsoever it forbids, it commandeth the contrary. […]

Q. Why are all the Commandments (except two) set down negatively?

A. Because the Negative bindeth more strongly: for the Negative precept bindeth always, and to all moments of time; the Affirmative bindeth always, but not to all moments of time.</p></blockquote>

<blockquote><p>Q. What is the Moral Law?

A. It is a Doctrine commanding the perfection of Godliness, and Righteousness, binding us to eternal death for our least defect therein; which Law is handled at large throughout the whole Scripture, but is summarily contained, first into ten words, or ten Commandments, written by God’s own finger at the first, in Tables of stone: to signify thereby, not only the hardness of our hearts, in which they ought to be imprinted; but also the perpetual use of them, to the very end of the world. And after, further abridged into two Commandments by our Saviour Christ, containing the sum of the whole Law.</p></blockquote>

<blockquote><p>What the Moral Law is, I will describe in three points: First, it is that part of God’s Word concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature: in regard whereof it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection; and outward in speech and action. Thirdly, it binds to the curse and punishment, every one that fails in the least duty thereof, though but once, and that in thought only: Gal. 3:10 Cursed is everyone that continues not in all things that are written in the Law, to do them. The sum of the Moral Law is propounded in the Decalogue, or Ten Commandments, which many can repeat, but few do understand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon on the Mount</cite>, (London, 1631), p. 33.</span></figcaption>

</figure><figure class="quote" id="q-4b32f9cbd8" data-kw="">
<blockquote><p>Nowadays, it is a little understood fact that the orthodox Covenanter position is that most of the penal sanctions of the Old Testament are part of the moral law, and thus forever bind all people (Westminster Confession 19:5). Those who appeal to Westminster Confession 19:4 in an attempt to prove that such laws have expired have seriously misunderstood what the Confession is referring to. As Samuel B. Wylie explains below, there is a section of the judicial laws that were unique to Israel; these laws have expired so as not to bind us any further than there general equity may require. However, other judicial laws do not fall under this category but are simply conceived as being part of natural/moral law:

Whatsoever the law of God commands to be punished, ought to be punished with the penalties therein made and provided; but God has commanded gross heretics, blasphemers, and idolaters, to be punished with certain specified penalties. Therefore, such ought to be punished. These commands could not belong to the ceremonial law, for then they would have flowed entirely from the arbitrary will of God, and been mere signs between him and Israel. Who would dare to think so of gross heresy, &amp;c.? Neither could they belong to that part of the judicial law which respected the Jews peculiarly. Who would dare to say that none but the Jews were, or are, under obligation to worship God in purity, or abstain from blaspheming his nature and dignity? They must, therefore, belong to the moral law, and flow from the moral nature of Jehovah, who has declared he will not give his glory to another, nor his praise to graven images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 66.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>

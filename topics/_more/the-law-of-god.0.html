</figure><figure class="quote" id="q-9e3afd8f49" data-kw="">
<blockquote><p>Obj. 9. That is not to be taught in the church which increases sin. The law increases sin. (Rom. 7:8.) Therefore, it is not to be taught. Ans. There is here a fallacy of accident in the minor proposition. The law increases sin by an accident, or on account of the corruption of man, and that in two ways. First, because the nature of man is so depraved and alienated from God, that men do not perform what they know to be pleasing to God; and, on the other hand, what they know to be prohibited by God, that they desire, and do with the greatest willingness. Secondly, because it works wrath, when men fret and murmur against God, hate and turn away from him, and rush into despair according as the law reveals to them a knowledge of their sins, and the punishment which they deserve in consequence thereof. The law in itself produces righteousness, conformity with God, love to God, etc. The law also in itself increases sin, if we understand the word increase in a different sense, viz., that it shows unto us, and brings it to pass that we acknowledge the greatness and magnitude of our sins; but not that it so increases sin as that which in itself is small is made greater and more aggravated. There are, therefore, four terms in this syllogism, in consequence of the ambiguity of the word increase in the minor proposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>

ma" href="../quote/9e3afd8f49.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/10/ursinus-against-the-antinomians-libertines-and-similar-fanatics-who-deny-that-the-decalogue-is-for-teaching-in-the-christian-church-objection-9/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-e0bbe98fe5" data-kw="">
<blockquote><p>Obj. 8. The law is the letter which killeth, and is the ministration of death and condemnation. (2 Cor. 3:6, 7.) But there is no condemnation to Christians. Therefore, the law does not have respect to Christians who are in Christ Jesus. Ans. There is here a fallacy of accident; for the law is not in itself the letter which killeth; since this comes to pass by the fault of men, who, the more clearly they perceive the difference between themselves and the law, the more fully do they give themselves over to despair in reference to their salvation, and are therefore slain by the law. Again, the law alone, without the gospel, is the letter, that is, it is the doctrine which merely teaches, demands obedience, denounces the wrath of God and death to such as are disobedient, without producing the spiritual obedience which it requires. But when it is joined with the gospel, which is the Spirit, it also commences to become the Spirit, which is effectual in the godly, inasmuch as those who are regenerated commence willingly and cheerfully to yield obedience to the law. The law, therefore, is the letter, 1. By itself and without the gospel. 2. In respect to those who are unregenerated. On the other hand, the gospel is the Spirit; that is, it is the ministration and means through which the Holy Ghost, which works spiritual obedience in us, is given; not indeed as though all who hear, would receive the Holy Ghost and be regenerated, but because faith, by which our hearts are quickened, so that they begin to yield obedience to the law, is received by it. It does not follow, therefore, that the law is no longer to be taught in the church; for Christ himself says: “I am not come to destroy the law, but to fulfill it.” (Matt. 5:17.) And Paul also says, that we establish the law through faith. (Rom. 3:31.) Christ fulfilled the law in two respects: by obedience and suffering. He was just and holy in himself and did not violate the law in a single instance, but partly performed in our behalf those things which he was not bound to do, and partly sustained the punishment of the law. He also fulfills the law in us in two ways, by teaching it and granting unto us his Spirit, that so we may commence obedience to it, as we proved when speaking of the abrogation of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>

</figure><figure class="quote" id="q-8edfdd62f1" data-kw="">
<blockquote><p>Obj. 4. Christ is not the lawgiver. Therefore his ministers should not teach and enforce the law. Ans. Christ is not the lawgiver, as it respects the principal office of the mediator; but he was and is lawgiver:

1. In as far as he is God and the author of the law, together with the Father.

2. In as far as it belonged to the mediator to free the law from the errors with which it had been corrupted, and to restore its true sense, not indeed chiefly, but that he might be able to accomplish the principal parts of his office, which are comprehended in the reconciliation and salvation of the human race. We may give the same answer to the objection as it relates to the ministers of the gospel, inasmuch as they are to teach and expound no other doctrine to the church than that which Christ himself delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>

</figure><figure class="quote" id="q-ecb08134b6" data-kw="">
<blockquote><p>We divide this Word into two principal parts or kinds: the one is called the ‘Law,’ the other the ‘Gospel.’ For all the rest can be gathered under the one or other of these two headings…Ignorance of this distinction between Law and Gospel is one of the principal sources of the abuses which corrupted and still corrupt Christianity.</p></blockquote>

<blockquote><p>If life and justice come not by the law, the law then is in vain. And this objection is expressed by way of interrogation, ‘Wherefore then serves the law?’ The answer is in the next words, ‘It is added for transgressions,’ that is, for the revealing of sin and the punishment thereof, and for the convincing of men touching their sins (Rom 3:19–20; HT: Inwoo Lee).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:194 (On Galatians 3:19).</span></figcaption>

</figure><figure class="quote" id="q-af9d98cc39" data-kw="">
<blockquote><p>Objection: But does not the apostle say, Rom. 6:14. ‘Ye are not under the law but under grace?’ and Gal. 5:22, 23. ‘But the fruit of the Spirit is love, joy, peace, &amp;c.—against such there is no law?’ Answer: Believers are not under the law as a covenant of works, to be either justified or condemned thereby. For the apostle says, ‘Christ hath redeemed us from the curse of the law, being made a curse for us,’ Gal. 3:13; and that there is no condemnation to them which are in Christ Jesus.’ They are neither under the commanding nor the condemning power of that law, seeing Christ has given perfect obedience to it as a covenant of works, so that under that character it can have nothing to demand of them; and has fully satisfied all its demands in point of punishment, having suffered the very penalty threatened therein. So that as a covenant of works they are entirely delivered from it. And as to the fruits of the Spirit in them, they are the product of the Spirit, agreeable to the will and law of God; and no law can be against them, seeing they are agreeable to the very letter and spirit thereof. But believers are still under the law as a rule of life, according to which they are to regulate their hearts and lives. It is the pole star that must direct their course to heaven, and is of singular use to provoke and excite them to gratitude to Christ, who hath perfectly fulfilled it in their room and stead.</p></blockquote>

</figure><figure class="quote" id="q-a0ff0d7b1d" data-kw="">
<blockquote><p>The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on Christ’s Sermon on the Mount, in Works</cite>, 1:244–45.</span></figcaption>

<blockquote><p>[W]hy the Lord says, “He that doeth the things of the law shall live,” considering no man since the fall can do the things of the law? Answer. The Lord since man’s fall repeats the law in his [its] old tenor, not to mock men, but for other weighty causes. The first is to teach us that the law is of a constant and unchangeable nature. The second is to advertise us of our weakness and to show us what we cannot do. The third is to put us in mind that we must still humble ourselves under the hand of God, after we have begun by grace to obey the law, because even then we come far short in doing the things which the law requires at our hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:178.</span></figcaption>

<blockquote><p>Hieronymus Zanchius (Operum, Tom. iv. lib. i. c. 11), Maintains at large, and by several arguments, that we Christians have nothing to do with the moral precepts, as they were given to the Israelites by Moses; but only in so far as they agree with the law of nature, common to all nations, and confirmed by Christ, whom we acknowledge to be our king.</p></blockquote>

</figure><figure class="quote" id="q-7ff41b378c" data-kw="">
<blockquote><p>XIV. The law, which God in this manner published, consists of ten words or commandments, Exod. 34:28, Deut. 4:13. Wherefore the Greeks also called it δεκάλογος, the decalogue. Moreover the contents of those ten words are various. 1st, There is the prescription of certain duties; and in this, the nature of a law, as such, properly consists. 2dly, The threatening of divine vengeance against the transgressors thereof, as in the second and third commandments; and this is the sanction of the covenant of works, from which all threatenings are derived, as we explained at large, book iii. chap. i sect. 22. 3dly, The proposal of divine grace and favour; and as this is made to sinners, and that under a condition, not of perfect, but of sincere obedience, so far it flows from the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, 2.175</span></figcaption>

<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin, and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery, but, being weak through the flesh, leaves the transgressor under the curse, and man cannot by this law obtain saving grace.

6. What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit through the word or ministry of reconciliation; which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe, as well under the Old as under the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/synod-of-the-reformed-church.html">Synod of the Reformed Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons of Dort 3/4.5–6</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin, and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery, but, being weak through the flesh, leaves the transgressor under the curse, and man cannot by this law obtain saving grace.

6. What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit through the word or ministry of reconciliation; which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe, as well under the Old as under the New Testament.”

<blockquote><p>Hence, also, we see the error of those who, in comparing the Law with the Gospel, represent it merely as a comparison between the merit of works, and the gratuitous imputation of righteousness. This is indeed a contrast not at all to be rejected. For Paul often means by the term “law” the rule of righteous living by which God requires of us what is his own, giving us no hope of life unless we completely obey him, and adding on the other hand a curse if we deviate even in the slightest degree. This Paul does when he contends that we pleasing to God through grace and accounted righteous through his pardon, because nowhere is found that observance of the law for which the reward has been promised. Paul therefore justly makes contraries of the righteousness of the law and that of the gospel.</p></blockquote>

<blockquote><p>10 Q. What is the difference between the law and the gospel? A. The law is a doctrine that God has implanted in human nature and has repeated and renewed in His commandments. In it He holds before us, as if in a manuscript, what it is we are and are not to do, namely, obey Him perfectly both inwardly and outwardly. He also promises eternal life on the condition that I keep the law perfectly my whole life long. On the other hand, He threatens eternal damnation if I do not keep every provision of the law my whole life long but violate it in one or more of its parts. As God says in Deuteronomy 27[:26] and Galatians 3[:10], “Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.” And once the law has been violated, it has no promise that by the help of the law, that is, by works of the law, our sins might be forgiven. Rather, the sentence of condemnation is imposed upon us. The gospel or good news, however, is a doctrine of which even the wisest knew nothing by nature but which is revealed from heaven. In it God does not demand but rather offers and gives us the righteousness that the law requires. This righteousness is the perfect obedience of the suffering and death of Jesus Christ, through which all sin and damnation, made manifest by the law, is pardoned and washed away (Rom. 5; Gal. 3). Furthermore, God does not give us forgiveness of sins in the gospel on the condition that we keep the law. Rather, even though we never have kept it nor will ever be able to keep it perfectly, He still has forgiven our sins and given us eternal life as an unmerited gift through faith in Jesus Christ. John 1[:17] says, “The law was given through Moses, but grace and truth come through Jesus Christ.” And Romans 8[:3, 4]: “What for the law was impossible in that it was weak through the flesh, God did by sending His Son in the likeness of sinful flesh, and condemned sin the flesh through sin, that the righteousness required by the law might be fulfilled in us, who do not walk according to the flesh but according to the Spirit.” Finally, Galatians 3:[12–14]: “The law is not of faith but ‘The man who does it shall live by it.’ Christ, however, redeemed us from the curse of the law when He became a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that the blessing of Abraham might come upon the Gentiles in Christ Jesus and we thus might receive the promised Spirit through faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation</cite>, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 9–10.</span></figcaption>

<blockquote><p>A godly person observed that Christians are usually to blame for three things: 1) they seek in themselves what they can only find in Christ; 2) they seek in the law what will only be found in the gospel; and 3) they seek on earth what will only be enjoyed in heaven.</p></blockquote>

<blockquote><p>The law is the Word in which God teaches and tells us what we are to do and not to do, as in the Ten commandments. …The other word of God is not Law or commandment, nor does it require anything of us; but after the first Word, that of the Law, has done this work and distressful misery and poverty have been produced in the heart, God comes and offers his lovely, living Word, and promises, pledges, and obligates himself to give grace and help, that we may get out of this misery and that all sins not only be forgiven but also blotted out and that love and delight to fulfill the law may be given besides. See, this divine promise of his grace and of the forgiveness of his is properly called Gospel. And I say again and yet again that you should never understand Gospel to mean anything but the divine promise of his grace and of the forgiveness of sin. For this is why hitherto St. Paul’s epistles were not understood and cannot be understood by our adversaries even now; they do not know what Law and Gospel really are. For they consider Christ a Legislator and the Gospel nothing but the teaching of new laws. This is nothing else but locking up the gospel and obscuring everything. For “Gospel” is Greek and means “good news,” because in it is proclaimed the saving doctrine of life, of the divine promise, and grace and the forgiveness of sins are offered. Therefore works do not belong to the gospel; for it is not laws but faith alone, because it is nothing whatever but the promise and offer of divine grace. He, then, who believes the Gospel receives grace and the Holy Spirit. Thereby the heart becomes glad and joyful in God and then keeps the Law gladly and freely, without the fear of punishment and without the expectation of reward; for it is sated and satisfied with that grace of God by which the law has been satisfied.</p></blockquote>

<blockquote><p>THERE is little more in all this, (viz. “The Marrow,”) to be attributed to me than the very gathering and composing of it. That which I aim at, and intend therein, is to show unto myself, and others that shall read it, the difference betwixt the Law and the Gospel,—a point, as I conceive, very needful for us to be well instructed in, and that for these reasons:—First, Because, if we be ignorant thereof, we shall be very apt to mix and mingle them together, and so to confound the one with the other; which, as Luther on the Galatians, p. 31, truly says, “doth more mischief than man’s reason can conceive;” and therefore he doth advise all Christians, in the case of justification, to separate the Law and the Gospel as far asunder as heaven and earth are separated. Secondly, Because if we know right how to distinguish betwixt them, the knowledge thereof will afford ns no small light towards the true understanding of the Scripture, and will help us to reconcile all such places, both in the Old and New Testament, as seem to be repugnant; yea, and it will help us to judge aright of cases of conscience, and quiet our own conscience in time of trouble and distress; yea, and we shall thereby be enabled to try the truth and falsehood of all doctrines: wherefore, for our better instruction in this point, we are first of all to consider and take notice what the law is, and what the gospel is. Now, the law is a doctrine partly known by nature, teaching us that there is a God, and what God is, and what he requires us to do, binding all reasonable creatures to perfect obedience, both internal and external, promising the favour of God, and everlasting life to all those who yield perfect obedience thereunto, and denouncing the curse of God and everlasting damnation to all those who are not perfectly correspondent thereunto. But the gospel is a doctrine revealed from heaven by the Son of God, presently after the fall of mankind into sin and death, and afterwards manifested more clearly and fully to the patriarchs and prophets, to the evangelists and apostles, and by them spread abroad to others; wherein freedom from sin, the curse of the law, the wrath of God, death, and hell, is freely promised for Christ’s sake unto all who truly believe on his name. 2dly, We are to consider what the nature and office of the law is, and what the nature and office of the gospel is. Now, the nature and office of the law is to show unto us our sin, (Rom. 3:20,) our condemnation, our death, Rom. 2:1; 7:10. But the nature and office of the gospel is to show unto us, that Christ has taken away our sin, (John 1:29,) and that he also is our redemption and life, Col. 1:14; 3:4. So that the LAW is a word of wrath, Rom. 4:14; but the GOSPEL is a word of peace, Eph. 2:17. 3dly, We are to consider where we may find the law written, and where we may find the gospel written. Now, we shall find this law and this gospel written and recorded in the writings of the prophets, evangelists, and apostles, namely, in the books called the Old and New Testament, or the Scriptures. For, indeed, the law and the gospel are the chief general heads which comprehend all the doctrine of the Scriptures; yet we are not to think that these two doctrines are to be distinguished by the books and leaves of the Scriptures, but by the diversity of God’s Spirit speaking in them: we are not to take and understand whatsoever is contained in the compass of the Old Testament to be only and merely the word and voice of the law; neither are we to think that whatsoever is contained within the compass of the bookscalled the New Testament is only and merely the voice of the gospel; for sometimes in the Old Testament God does speak comfort, as he comforted Adam, with the voice of the gospel; sometimes also in the New Testament he does threaten and terrify, as when Christ terrified the Pharisees. In some places, again, Moses and the prophets do play the evangelists; inasmuch that Hierom doubts whether he should call Isaiah a prophet or an evangelist. In some places, likewise, Christ and the apostles supply the part of Moses: Christ himself, until his death, was under the law, which law he came not to break, but to fulfil; so his sermons made to the Jews, for the most part, run all upon the perfect doctrine and works of the law, showing and teaching what we ought to do by the right law of justice, and what danger ensues in the non-performance of the same. All which places, though they be contained in the book of the New Testament, yet are they to be referred to the doctrine of the law, ever having included in them a privy exception of repentance and faith in Jesus Christ. As for example, where Christ thus preaches, “Blessed are the pure in heart, for they shall see God,” Matt. 5:8. Again, “Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven,” Matt. 18:3. And again, “He that doth the will of my Father which is in heaven, shall enter into the kingdom of heaven,” Matt. 7:22. And again, the parable of the wicked servant cast into prison, for not forgiving his fellow, Matth. 18:30; the casting of the rich glutton into hell, Luke 16:23. And again, “He that denieth me before men, I will deny him before my Father which is in heaven,” Luke 12:9; with divers such other places, all which, I say, do appertain to the doctrine of the law. Wherefore, in the fourth place, we are to take heed, when we read the Scriptures, we do not take the gospel for the law, nor the law for the gospel, but labour to discern and distinguish the voice of the one from the voice of the other: and if we would know when the law speaks, and when the gospel speaks, let us consider and take this for a note, That when in Scripture there is any moral work commanded to be done, either for eschewing of punishment, or upon promise of any reward, temporal or eternal; or else when any promise is made, with the condition of any work to be done, which is commanded in the law, there is to be understood the voice of the law. Contrariwise, where the promise of life and salvation is offered unto us freely, without any condition of any law, either natural, ceremonial, or moral, or any work done by us, all those places, whether we read them in the Old Testament, or in the New, are to be referred to the voice and doctrine of the gospel; yea, and all those promises of Christ coming in the flesh, which we read in the Old Testament, yea, and all those promises in the New Testament, which offer Christ upon condition of our believing on his name, are properly called the voice of the gospel, because they have no condition of our mortifying annexed unto them, but only faith to apprehend and receive Jesus Christ; as it is written, (Rom. 3:22,) “For the righteousness of God, which is by faith of Jesus Christ unto all, and upon all that believe,” &amp;c. Briefly, then, if we would know when the law speaks, and when the gospel speaks, either in reading the word, or in hearing it preached; and if we would skilfully distinguish the voice of the one from the voice of the other, we must consider, Law. The law says, “Thou art a sinner, and therefore thou shalt be damned;” Rom. 7:2; 2 Thess. 2:12. Gos. But the gospel says, No; “Christ Jesus came into the world to save sinners;” and therefore “believe on the Lord Jesus Christ, and thou shalt be saved,” 1 Tim. 1:15; Acts 16:31. Law. Again the law says, “Knowest thou not that the unrighteous shall not inherit the kingdom of God; be not deceived,” &amp;c. 1 Cor. 6:9. And therefore thou being a sinner, and not righteous, shall not inherit the kingdom of God. Gos. But the gospel says, “God has made Christ to be sin for thee, who knew no sin; that thou mightest be made the righteousness of God in him, who is the Lord thy righteousness,” Jer. 23:6. Law. Again the law says, “Pay me that thou owest me, or else I will cast thee into prison,” Matt. 18:28, 30. Gos. But the gospel says, “Christ gave himself a ransom for thee,” 1 Tim. 2:6; “and so is made redemption unto thee,” 1 Cor. 1:30. Law. Again the law says, “Thou hast not continued in all that I require of thee, and therefore thou art accursed,” Deut. 27:6. Gos. But the gospel says, “Christ hath redeemed thee from the curse of the law, being made a curse for thee,” Gal. 3:13. Law. Again the law says, “Thou art become guilty before God, and therefore shalt not escape the judgment of God,” Rom. 3:29; 2:3. Gos. But the gospel says, “The Father judgeth no man, but hath committed all judgment to the Son,” John 5:12. And now, knowing rightly how to distinguish between the law and the gospel, we must, in the fifth place, take heed that we break not the orders between these two in applying the law where the gospel is to be applied, either to ourselves or to others; for albeit the law and gospel, in order of doctrine, are many times to be joined together, yet, in the case of justification, the law must be utterly separated from the gospel.</p></blockquote>

+and+external%2C+promising+the+favour+of+God%2C+and+everlasting+life+to+all+those+who+yield+perfect+obedience+thereunto%2C+and+denouncing+the+curse+of+God+and+everlasting+damnation+to+all+those+who+are+not+perfectly+correspondent+thereunto.+But+the+gospel+is+a+doctrine+revealed+from+heaven+by+the+Son+of+God%2C+presently+after+the+fall+of+mankind+into+sin+and+death%2C+and+afterwards+manifested+more+clearly+and+fully+to+the+patriarchs+and+prophets%2C+to+the+evangelists+and+apostles%2C+and+by+them+spread+abroad+to+others%3B+wherein+freedom+from+sin%2C+the+curse+of+the+law%2C+the+wrath+of+God%2C+death%2C+and+hell%2C+is+freely+promised+for+Christ%E2%80%99s+sake+unto+all+who+truly+believe+on+his+name.+2dly%2C+We+are+to+consider+what+the+nature+and+office+of+the+law+is%2C+and+what+the+nature+and+office+of+the+gospel+is.+Now%2C+the+nature+and+office+of+the+law+is+to+show+unto+us+our+sin%2C+%28Rom.+3%3A20%2C%29+our+condemnation%2C+our+death%2C+Rom.+2%3A1%3B+7%3A10.+But+the+nature+and+office+of+the+gospel+is+to+show+unto+us%2C+that+Christ+has+taken+away+our+sin%2C+%28John+1%3A29%2C%29+and+that+he+also+is+our+redemption+and+life%2C+Col.+1%3A14%3B+3%3A4.+So+that+the+LAW+is+a+word+of+wrath%2C+Rom.+4%3A14%3B+but+the+GOSPEL+is+a+word+of+peace%2C+Eph.+2%3A17.+3dly%2C+We+are+to+consider+where+we+may+find+the+law+written%2C+and+where+we+may+find+the+gospel+written.+Now%2C+we+shall+find+this+law+and+this+gospel+written+and+recorded+in+the+writings+of+the+prophets%2C+evangelists%2C+and+apostles%2C+namely%2C+in+the+books+called+the+Old+and+New+Testament%2C+or+the+Scriptures.+For%2C+indeed%2C+the+law+and+the+gospel+are+the+chief+general+heads+which+comprehend+all+the+doctrine+of+the+Scriptures%3B+yet+we+are+not+to+think+that+these+two+doctrines+are+to+be+distinguished+by+the+books+and+leaves+of+the+Scriptures%2C+but+by+the+diversity+of+God%E2%80%99s+Spirit+speaking+in+them%3A+we+are+not+to+take+and+understand+whatsoever+is+contained+in+the+compass+of+the+Old+Testament+to+be+only+and+merely+the+word+and+voice+of+the+law%3B+neither+are+we+to+think+that+whatsoever+is+contained+within+the+compass+of+the+bookscalled+the+New+Testament+is+only+and+merely+the+voice+of+the+gospel%3B+for+sometimes+in+the+Old+Testament+God+does+speak+comfort%2C+as+he+comforted+Adam%2C+with+the+voice+of+the+gospel%3B+sometimes+also+in+the+New+Testament+he+does+threaten+and+terrify%2C+as+when+Christ+terrified+the+Pharisees.+In+some+places%2C+again%2C+Moses+and+the+prophets+do+play+the+evangelists%3B+inasmuch+that+Hierom+doubts+whether+he+should+call+Isaiah+a+prophet+or+an+evangelist.+In+some+places%2C+likewise%2C+Christ+and+the+apostles+supply+the+part+of+Moses%3A+Christ+himself%2C+until+his+death%2C+was+under+the+law%2C+which+law+he+came+not+to+break%2C+but+to+fulfil%3B+so+his+sermons+made+to+the+Jews%2C+for+the+most+part%2C+run+all+upon+the+perfect+doctrine+and+works+of+the+law%2C+showing+and+teaching+what+we+ought+to+do+by+the+right+law+of+justice%2C+and+what+danger+ensues+in+the+non-performance+of+the+same.+All+which+places%2C+though+they+be+contained+in+the+book+of+the+New+Testament%2C+yet+are+they+to+be+referred+to+the+doctrine+of+the+law%2C+ever+having+included+in+them+a+privy+exception+of+repentance+and+faith+in+Jesus+Christ.+As+for+example%2C+where+Christ+thus+preaches%2C+%E2%80%9CBlessed+are+the+pure+in+heart%2C+for+they+shall+see+God%2C%E2%80%9D+Matt.+5%3A8.+Again%2C+%E2%80%9CExcept+ye+be+converted%2C+and+become+as+little+children%2C+ye+shall+not+enter+into+the+kingdom+of+heaven%2C%E2%80%9D+Matt.+18%3A3.+And+again%2C+%E2%80%9CHe+that+doth+the+will+of+my+Father+which+is+in+heaven%2C+shall+enter+into+the+kingdom+of+heaven%2C%E2%80%9D+Matt.+7%3A22.+And+again%2C+the+parable+of+the+wicked+servant+cast+into+prison%2C+for+not+forgiving+his+fellow%2C+Matth.+18%3A30%3B+the+casting+of+the+rich+glutton+into+hell%2C+Luke+16%3A23.+And+again%2C+%E2%80%9CHe+that+denieth+me+before+men%2C+I+will+deny+him+before+my+Father+which+is+in+heaven%2C%E2%80%9D+Luke+12%3A9%3B+with+divers+such+other+places%2C+all+which%2C+I+say%2C+do+appertain+to+the+doctrine+of+the+law.+Wherefore%2C+in+the+fourth+place%2C+we+are+to+take+heed%2C+when+we+read+the+Scriptures%2C+we+do+not+take+the+gospel+for+the+law%2C+nor+the+law+for+the+gospel%2C+but+labour+to+discern+and+distinguish+the+voice+of+the+one+from+the+voice+of+the+other%3A+and+if+we+would+know+when+the+law+speaks%2C+and+when+the+gospel+speaks%2C+let+us+consider+and+take+this+for+a+note%2C+That+when+in+Scripture+there+is+any+moral+work+commanded+to+be+done%2C+either+for+eschewing+of+punishment%2C+or+upon+promise+of+any+reward%2C+temporal+or+eternal%3B+or+else+when+any+promise+is+made%2C+with+the+condition+of+any+work+to+be+done%2C+which+is+commanded+in+the+law%2C+there+is+to+be+understood+the+voice+of+the+law.+Contrariwise%2C+where+the+promise+of+life+and+salvation+is+offered+unto+us+freely%2C+without+any+condition+of+any+law%2C+either+natural%2C+ceremonial%2C+or+moral%2C+or+any+work+done+by+us%2C+all+those+places%2C+whether+we+read+them+in+the+Old+Testament%2C+or+in+the+New%2C+are+to+be+referred+to+the+voice+and+doctrine+of+the+gospel%3B+yea%2C+and+all+those+promises+of+Christ+coming+in+the+flesh%2C+which+we+read+in+the+Old+Testament%2C+yea%2C+and+all+those+promises+in+the+New+Testament%2C+which+offer+Christ+upon+condition+of+our+believing+on+his+name%2C+are+properly+called+the+voice+of+the+gospel%2C+because+they+have+no+condition+of+our+mortifying+annexed+unto+them%2C+but+only+faith+to+apprehend+and+receive+Jesus+Christ%3B+as+it+is+written%2C+%28Rom.+3%3A22%2C%29+%E2%80%9CFor+the+righteousness+of+God%2C+which+is+by+faith+of+Jesus+Christ+unto+all%2C+and+upon+all+that+believe%2C%E2%80%9D+%26c.+Briefly%2C+then%2C+if+we+would+know+when+the+law+speaks%2C+and+when+the+gospel+speaks%2C+either+in+reading+the+word%2C+or+in+hearing+it+preached%3B+and+if+we+would+skilfully+distinguish+the+voice+of+the+one+from+the+voice+of+the+other%2C+we+must+consider%2C+Law.+The+law+says%2C+%E2%80%9CThou+art+a+sinner%2C+and+therefore+thou+shalt+be+damned%3B%E2%80%9D+Rom.+7%3A2%3B+2+Thess.+2%3A12.+Gos.+But+the+gospel+says%2C+No%3B+%E2%80%9CChrist+Jesus+came+into+the+world+to+save+sinners%3B%E2%80%9D+and+therefore+%E2%80%9Cbelieve+on+the+Lord+Jesus+Christ%2C+and+thou+shalt+be+saved%2C%E2%80%9D+1+Tim.+1%3A15%3B+Acts+16%3A31.+Law.+Again+the+law+says%2C+%E2%80%9CKnowest+thou+not+that+the+unrighteous+shall+not+inherit+the+kingdom+of+God%3B+be+not+deceived%2C%E2%80%9D+%26c.+1+Cor.+6%3A9.+And+therefore+thou+being+a+sinner%2C+and+not+righteous%2C+shall+not+inherit+the+kingdom+of+God.+Gos.+But+the+gospel+says%2C+%E2%80%9CGod+has+made+Christ+to+be+sin+for+thee%2C+who+knew+no+sin%3B+that+thou+mightest+be+made+the+righteousness+of+God+in+him%2C+who+is+the+Lord+thy+righteousness%2C%E2%80%9D+Jer.+23%3A6.+Law.+Again+the+law+says%2C+%E2%80%9CPay+me+that+thou+owest+me%2C+or+else+I+will+cast+thee+into+prison%2C%E2%80%9D+Matt.+18%3A28%2C+30.+Gos.+But+the+gospel+says%2C+%E2%80%9CChrist+gave+himself+a+ransom+for+thee%2C%E2%80%9D+1+Tim.+2%3A6%3B+%E2%80%9Cand+so+is+made+redemption+unto+thee%2C%E2%80%9D+1+Cor.+1%3A30.+Law.+Again+the+law+says%2C+%E2%80%9CThou+hast+not+continued+in+all+that+I+require+of+thee%2C+and+therefore+thou+art+accursed%2C%E2%80%9D+Deut.+27%3A6.+Gos.+But+the+gospel+says%2C+%E2%80%9CChrist+hath+redeemed+thee+from+the+curse+of+the+law%2C+being+made+a+curse+for+thee%2C%E2%80%9D+Gal.+3%3A13.+Law.+Again+the+law+says%2C+%E2%80%9CThou+art+become+guilty+before+God%2C+and+therefore+shalt+not+escape+the+judgment+of+God%2C%E2%80%9D+Rom.+3%3A29%3B+2%3A3.+Gos.+But+the+gospel+says%2C+%E2%80%9CThe+Father+judgeth+no+man%2C+but+hath+committed+all+judgment+to+the+Son%2C%E2%80%9D+John+5%3A12.+And+now%2C+knowing+rightly+how+to+distinguish+between+the+law+and+the+gospel%2C+we+must%2C+in+the+fifth+place%2C+take+heed+that+we+break+not+the+orders+between+these+two+in+applying+the+law+where+the+gospel+is+to+be+applied%2C+either+to+ourselves+or+to+others%3B+for+albeit+the+law+and+gospel%2C+in+order+of+doctrine%2C+are+many+times+to+be+joined+together%2C+yet%2C+in+the+case+of+justification%2C+the+law+must+be+utterly+separated+from+the+gospel.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+An+Explication+of+the+Assembly%E2%80%99s+Shorter+Catechism%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1850%29%2C+7.459%E2%80%9362.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc42ee3be7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c42ee3be7d.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/07/thomas-boston-how-and-why-to-distinguish-between-law-and-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-771cc66c44" data-kw="">
<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>

<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin,1 and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery,2 but, being weak through the flesh,3 leaves the transgressor under the curse,4 and man cannot by this law obtain saving grace. 6.What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit1 through the word or ministry of reconciliation;2 which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe,3 as well under the Old as under the New Testament.</p></blockquote>

<blockquote><p>There be some which divide the holy Scriptures into four parts, and describe some books as well of the Old Testament as of the New to laws, some to histories, some to prophecies, and other some again to wisdom. But it is not meet to divide the books of the holy Scriptures from one another, because that in the books of Exodus, Leviticus, Numbers, and Deuteronomy, in which they appoint laws to be contained, are found almost as many histories as laws. Besides that in the books which they assign to prophets, laws of living uprightly are sometimes written and clearly expounded. Neither can we properly separate the books of Solomon and other of the kind (which they will have proper to wisdom) from laws and prophecies. For there are in them sentences here and there written, which serving for the instruction of life, have also without controversy the nature of laws. Further for the that in them are very many secrets opened unto the church by the inspiration of the Spirit of God, they pour undoubtedly into the attentive hearers, oracles of things to come, It may easily be granted, that all these things which they make mention of, are found in the holy books: I mean the precepts of living, notable histories, prophecies of things to come, and also most wise sentences and sayings: but in such […], that in manner in every book they are set forth unto us dispersedly, neither yet would I that these holy books should be divided from one another by these ends and limits. I would rather think as the learned […] do also judge, that whatsoever things are contained in the holy scriptures should be referred unto to principal heads, the law I mean and the gospel. For everywhere are declared unto us either the precepts of God of upright living, as when we are reproved to have strayed from them by reason of weakness or else of malice, gospel is lay forth before us, wherein by Christ that thing wherein we have offended is pardoned and the strength and power of the Holy Spirit promises us, to restore us again to the image of God, which we had lost.</p></blockquote>

<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>

<blockquote><p>Ver.

24. Which things are a typical history; for these two women represent the two covenants, with the churches thereto adhering respectively; the one from Mount Sinai, to wit, the covenant of works, which was given there, and where the Jewish synagogue, under that covenant, had its beginning: this bringeth forth children indeed, but such children as are mere mercenary worshippers, and under the bondage of that covenant, its curses and commands; and this is that represented by Agar the bondwoman, and that very conveniently. Ver.

25. (Gr. To gar Agar, Sina oros estin en te Arabia, &amp;c.), For as to that allegorical Agar, the mountain Sinai is in Arabia, where lived Agar and her son; and the same Sinai answers well to the earthly Jerusalem, the now Jewish synagogue, nothing being heard from either of them, but Do and Live: but Sinai still but serves with the legalists her children, Sinai and her covenant, because it was never designed but to be subservient to the covenant of grace, as Hagar to Sarah; her children, the legalists, following the state of the venter i. e. the womb from whence they came, are but in the state of bond-servants; not in the state of sons and heirs, more than Ishmael had Isaac’s privilege. “26 But Jerusalem which is above, is free, which is the mother of us all. 27 For it is written, Rejoice thou barren, that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she which hath an husband.” Ver.

26. But the other covenant, the covenant of grace, with the church adhering thereto, to wit, the church of believers in Christ, which is the heavenly Jerusalem, enjoying the reality of all the typical external privileges which the earthly Jerusalem had, which covenant and church is the mother of us all, Jews or Gentiles, that believe in Christ, even she is free: the covenant is served, but serves not as Sarah; the church is mistress of the family, being Christ’s spouse; and her children sons and heirs, as Sarah and her Isaac. Ver.

27. I say, the Christian church is that free mother of us all; for Isaiah in his 54th chap. ver. 1. with an eye to that typical history of Hagar and Sarah, in Abraham’s family, after he had spoke of the sufferings of Christ, immediately addressseth himself to her, as she was in her very first days before the preaching of the gospel by the apostles, saying, Rejoice thou that, as Sarah, art yet barren, thy children making no figure in comparison of the synagogue, break forth over all thy discouragements, and cry for joy, though thou travailest not yet to bring forth children, as thou shalt do ere long by the preaching of the apostles, after the effusion of the Holy Ghost on them: for though thou seem desolate as a widow, thy husband being yet in his state of humiliation, and so very little known, thou shalt have many more children, even such as shall join themselves to thee as members, than the Jewish synagogue, which only seems to have God for her husband. This shall be as sure to thee as if thou hadst all these children about thy hand already. “28 Now we, brethren, as Isaac was, are the children of promise.” Ver.

28. Now, brethren, to apply the whole unto us, ye see, we who adhere to the covenant of grace are such children as Isaac, even children of promise; born unto God by virtue of the absolute promise; not by the strength of nature or by our own works. “29 But as then be that was born after the flesh persecuted him that was born after the Spirit, even so it is now. “30 Nevertheless, what saith the scripture? Cast out the bond-woman and her son: for the son of the bond-woman shall not be heir with the son of the free-woman.” Ver.

29. But as then Ishmael persecuted Isaac, so now the legalists, children of the covenant of works, persecute the children of the covenant of grace. Ver.

30. Nevertheless, what saith the scripture? even, Cast out Hagar and Ishmael, for he shall not be heir with Isaac. The same sentence is passed against the Jewish synagogue, and all that adhere to the covenant of works; they shall be rejected and cast out of the society of saints, for they shall never partake of the heavenly inheritance with those that believe in Christ. “31 So then, brethren, we are not children of the bond-woman, but of the free.” Ver.

31. Therefore, seeing we are children of promise, as Isaac, we are not under the legal covenant, but the covenant of grace, and so are free; and therefore have nothing to do with the law.</p></blockquote>

n+Christ%2C+which+is+the+heavenly+Jerusalem%2C+enjoying+the+reality+of+all+the+typical+external+privileges+which+the+earthly+Jerusalem+had%2C+which+covenant+and+church+is+the+mother+of+us+all%2C+Jews+or+Gentiles%2C+that+believe+in+Christ%2C+even+she+is+free%3A+the+covenant+is+served%2C+but+serves+not+as+Sarah%3B+the+church+is+mistress+of+the+family%2C+being+Christ%E2%80%99s+spouse%3B+and+her+children+sons+and+heirs%2C+as+Sarah+and+her+Isaac.+Ver.+27.+I+say%2C+the+Christian+church+is+that+free+mother+of+us+all%3B+for+Isaiah+in+his+54th+chap.+ver.+1.+with+an+eye+to+that+typical+history+of+Hagar+and+Sarah%2C+in+Abraham%E2%80%99s+family%2C+after+he+had+spoke+of+the+sufferings+of+Christ%2C+immediately+addressseth+himself+to+her%2C+as+she+was+in+her+very+first+days+before+the+preaching+of+the+gospel+by+the+apostles%2C+saying%2C+Rejoice+thou+that%2C+as+Sarah%2C+art+yet+barren%2C+thy+children+making+no+figure+in+comparison+of+the+synagogue%2C+break+forth+over+all+thy+discouragements%2C+and+cry+for+joy%2C+though+thou+travailest+not+yet+to+bring+forth+children%2C+as+thou+shalt+do+ere+long+by+the+preaching+of+the+apostles%2C+after+the+effusion+of+the+Holy+Ghost+on+them%3A+for+though+thou+seem+desolate+as+a+widow%2C+thy+husband+being+yet+in+his+state+of+humiliation%2C+and+so+very+little+known%2C+thou+shalt+have+many+more+children%2C+even+such+as+shall+join+themselves+to+thee+as+members%2C+than+the+Jewish+synagogue%2C+which+only+seems+to+have+God+for+her+husband.+This+shall+be+as+sure+to+thee+as+if+thou+hadst+all+these+children+about+thy+hand+already.+%E2%80%9C28+Now+we%2C+brethren%2C+as+Isaac+was%2C+are+the+children+of+promise.%E2%80%9D+Ver.+28.+Now%2C+brethren%2C+to+apply+the+whole+unto+us%2C+ye+see%2C+we+who+adhere+to+the+covenant+of+grace+are+such+children+as+Isaac%2C+even+children+of+promise%3B+born+unto+God+by+virtue+of+the+absolute+promise%3B+not+by+the+strength+of+nature+or+by+our+own+works.+%E2%80%9C29+But+as+then+be+that+was+born+after+the+flesh+persecuted+him+that+was+born+after+the+Spirit%2C+even+so+it+is+now.+%E2%80%9C30+Nevertheless%2C+what+saith+the+scripture%3F+Cast+out+the+bond-woman+and+her+son%3A+for+the+son+of+the+bond-woman+shall+not+be+heir+with+the+son+of+the+free-woman.%E2%80%9D+Ver.+29.+But+as+then+Ishmael+persecuted+Isaac%2C+so+now+the+legalists%2C+children+of+the+covenant+of+works%2C+persecute+the+children+of+the+covenant+of+grace.+Ver.+30.+Nevertheless%2C+what+saith+the+scripture%3F+even%2C+Cast+out+Hagar+and+Ishmael%2C+for+he+shall+not+be+heir+with+Isaac.+The+same+sentence+is+passed+against+the+Jewish+synagogue%2C+and+all+that+adhere+to+the+covenant+of+works%3B+they+shall+be+rejected+and+cast+out+of+the+society+of+saints%2C+for+they+shall+never+partake+of+the+heavenly+inheritance+with+those+that+believe+in+Christ.+%E2%80%9C31+So+then%2C+brethren%2C+we+are+not+children+of+the+bond-woman%2C+but+of+the+free.%E2%80%9D+Ver.+31.+Therefore%2C+seeing+we+are+children+of+promise%2C+as+Isaac%2C+we+are+not+under+the+legal+covenant%2C+but+the+covenant+of+grace%2C+and+so+are+free%3B+and+therefore+have+nothing+to+do+with+the+law.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Sermons+and+Discourses+on+Several+Important+Subjects+in+Divinity%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+6+%28Aberdeen%3A+George+and+Robert+King%2C+1849%29%2C+266%E2%80%9368.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdd7018578.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdd7018578.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/02/boston-on-works-and-grace-in-galatians-4/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>DATHENUS: Just as this is very comforting, so it also is certain and true. For this is what Paul is teaching us with these similar words, namely, that “by the deeds of the law no flesh shall justified in his sight: for by the law is knowledge of sin” (Rom. 3:20). Also, “Nay, I had not know sin, but by the law: for I had not known lust except the law had said, Thou shalt not covet” (Rom. 7:7; Exod. 20:17). As summation, Paul points out that the law is our disciplinarian, or what which leads us to Christ, to be justified by faith. However, once we have come to faith, we are no longer under the disciplinarian guide. ELIZABETH: That is comforting and true. But accommodate yourself to my ignorance, and explain it to me even more. DATHENUS: I will gladly do that. You did understand what we discussed earlier about the blindness, alienation and depravity of the natural man, in which he is spiritually dead before God, did you not? ELIZABETH: I did hear you say that, but I did not understand it very well. DATHENUS: In spite of what the real state of man is before God, he likes to see himself as being pious, holy and righteous. This we can see by the example of the rich young ruler who boasted that he had kept all the commandments of God from his youth (Mat. 19:20). When the penitent woman who was a sinner touched Jesus, Simon the Pharisee regarded himself as if he were not likewise a sinner (Luke 18:11). ELIZABETH: Indeed, that is the case all too often with unbelievers. DATHENUS: Oh Elizabeth, God grant that it does not happen with those who think themselves to be the best of Christians, who see the splinter in another’s eye, but do not notice the beam in their own eye. ELIZABETH: But can this also happen with those who truly know God? DATHENUS: Alas, yes, far too often. I have to complain that I come across it many times, and I do not doubt that you sometimes have discovered it in yourself. Spiritual pride, self-love and self-centeredness have not died in the children of God. You can see this very plainly in the example of Loadicea, where the say themselves as rich and enriched and having lack of nothing. But the Lord testifies to the contrary, that they were poor, miserable, blind and naked (Rev. 3:17). ELIZABETH: That, indeed, is true. DATHENUS: Because we are so blinded by spiritual pride that we do not feel our miserable state, the law of God serves as an eye salve (Rev. 3:11), to clear up our dim vision, as a mirror (James 2:5), in which we can see and acknowledge how far we fall short. He does this in order that we will be displeased with ourselves (Ps. 19:13) and become ashamed like the poor publican who did not even dare to lift up his eyes to heaven, and say with him, “God be merciful to me a sinner” (Luke 18:13). ELIZABETH: I also need that eye salve and that mirror. DATHENUS: Not only you, dear Elizabeth, but also the holiest of people. Therefore also the more experienced of God’s elect see themselves mirrored faithfully when they have made a sincere confession (Ps. 19:13; 38:5; Job 13:23; 14:4; Isa. 38:17; 64:6; 1 John 1:9). The highest perfection of people, as long as they live on earth, lies in a sincere confession of imperfections. ELIZABETH: This cannot be denied, for who does not have to say and confess with David, “Who can understand his errors? Cleanse though me from secret faults” (Ps. 19:12). Please, also teach me something of the gospel which, as you taught me earlier, is the other part of God’s Word. I now pretty well understand what the law is about. DATHENUS: This I would wish you from the heart, but I fear that you still have quite deficiency in the knowledge of the law; but we can always make up that deficiency later. So not let us talk about the gospel. Tell me, Elizabeth, what definition would you give me of the gospel? ELIZABETH: All that Christ and His apostles have taught us and handed down to us in writing in the New Testament. DATHENUS: Here you are again making quite a big mistake. Have you forgotten so soon that which I point out earlier– that Christ and His apostles (Rom. 8:3) also proclaim and enforce the law? Don’t you remember that they exhort all people to keep the commandments of God, which we are not able to do (Acts 15:10)? ELIZABETH: Yes, that is true, but I had almost forgotten that. So please instruct me. What is the true gospel? DATHENUS: The Greek word for gospel denotes joyful good news which causes people to speak and sing joyfully and be glad in heart, just like the good news that came to Israel that David triumphed over the arrogant Goliath and slain him (1 Sam. 18:6). Such also is the good news of the gospel that proclaims to us and tells us that God will be gracious to a poor sinner, and will forgive and forget our sins (Jer. 31:34; Heb. 8:12). Yes, for Christ’s sake (1 Tim. 1:15) God will regard us as holy and righteous (2 Cor. 5:21), out of pure grace, by faith alone, without adding any works (1 Cor. 1:30; Rom. 3:28).</p></blockquote>

e+who+truly+know+God%3F+DATHENUS%3A+Alas%2C+yes%2C+far+too+often.+I+have+to+complain+that+I+come+across+it+many+times%2C+and+I+do+not+doubt+that+you+sometimes+have+discovered+it+in+yourself.+Spiritual+pride%2C+self-love+and+self-centeredness+have+not+died+in+the+children+of+God.+You+can+see+this+very+plainly+in+the+example+of+Loadicea%2C+where+the+say+themselves+as+rich+and+enriched+and+having+lack+of+nothing.+But+the+Lord+testifies+to+the+contrary%2C+that+they+were+poor%2C+miserable%2C+blind+and+naked+%28Rev.+3%3A17%29.+ELIZABETH%3A+That%2C+indeed%2C+is+true.+DATHENUS%3A+Because+we+are+so+blinded+by+spiritual+pride+that+we+do+not+feel+our+miserable+state%2C+the+law+of+God+serves+as+an+eye+salve+%28Rev.+3%3A11%29%2C+to+clear+up+our+dim+vision%2C+as+a+mirror+%28James+2%3A5%29%2C+in+which+we+can+see+and+acknowledge+how+far+we+fall+short.+He+does+this+in+order+that+we+will+be+displeased+with+ourselves+%28Ps.+19%3A13%29+and+become+ashamed+like+the+poor+publican+who+did+not+even+dare+to+lift+up+his+eyes+to+heaven%2C+and+say+with+him%2C+%E2%80%9CGod+be+merciful+to+me+a+sinner%E2%80%9D+%28Luke+18%3A13%29.+ELIZABETH%3A+I+also+need+that+eye+salve+and+that+mirror.+DATHENUS%3A+Not+only+you%2C+dear+Elizabeth%2C+but+also+the+holiest+of+people.+Therefore+also+the+more+experienced+of+God%E2%80%99s+elect+see+themselves+mirrored+faithfully+when+they+have+made+a+sincere+confession+%28Ps.+19%3A13%3B+38%3A5%3B+Job+13%3A23%3B+14%3A4%3B+Isa.+38%3A17%3B+64%3A6%3B+1+John+1%3A9%29.+The+highest+perfection+of+people%2C+as+long+as+they+live+on+earth%2C+lies+in+a+sincere+confession+of+imperfections.+ELIZABETH%3A+This+cannot+be+denied%2C+for+who+does+not+have+to+say+and+confess+with+David%2C+%E2%80%9CWho+can+understand+his+errors%3F+Cleanse+though+me+from+secret+faults%E2%80%9D+%28Ps.+19%3A12%29.+Please%2C+also+teach+me+something+of+the+gospel+which%2C+as+you+taught+me+earlier%2C+is+the+other+part+of+God%E2%80%99s+Word.+I+now+pretty+well+understand+what+the+law+is+about.+DATHENUS%3A+This+I+would+wish+you+from+the+heart%2C+but+I+fear+that+you+still+have+quite+deficiency+in+the+knowledge+of+the+law%3B+but+we+can+always+make+up+that+deficiency+later.+So+not+let+us+talk+about+the+gospel.+Tell+me%2C+Elizabeth%2C+what+definition+would+you+give+me+of+the+gospel%3F+ELIZABETH%3A+All+that+Christ+and+His+apostles+have+taught+us+and+handed+down+to+us+in+writing+in+the+New+Testament.+DATHENUS%3A+Here+you+are+again+making+quite+a+big+mistake.+Have+you+forgotten+so+soon+that+which+I+point+out+earlier%E2%80%93+that+Christ+and+His+apostles+%28Rom.+8%3A3%29+also+proclaim+and+enforce+the+law%3F+Don%E2%80%99t+you+remember+that+they+exhort+all+people+to+keep+the+commandments+of+God%2C+which+we+are+not+able+to+do+%28Acts+15%3A10%29%3F+ELIZABETH%3A+Yes%2C+that+is+true%2C+but+I+had+almost+forgotten+that.+So+please+instruct+me.+What+is+the+true+gospel%3F+DATHENUS%3A+The+Greek+word+for+gospel+denotes+joyful+good+news+which+causes+people+to+speak+and+sing+joyfully+and+be+glad+in+heart%2C+just+like+the+good+news+that+came+to+Israel+that+David+triumphed+over+the+arrogant+Goliath+and+slain+him+%281+Sam.+18%3A6%29.+Such+also+is+the+good+news+of+the+gospel+that+proclaims+to+us+and+tells+us+that+God+will+be+gracious+to+a+poor+sinner%2C+and+will+forgive+and+forget+our+sins+%28Jer.+31%3A34%3B+Heb.+8%3A12%29.+Yes%2C+for+Christ%E2%80%99s+sake+%281+Tim.+1%3A15%29+God+will+regard+us+as+holy+and+righteous+%282+Cor.+5%3A21%29%2C+out+of+pure+grace%2C+by+faith+alone%2C+without+adding+any+works+%281+Cor.+1%3A30%3B+Rom.+3%3A28%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+Dathenus%2C+The+Pearl+of+Christian+Comfort&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fedf28e8308.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/edf28e8308.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/06/law-and-gospel-in-a-pastoral-context/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-a11b97b7cb" data-kw="">
<blockquote><p>Many are the mistakes at present about religious matters; but none are more destructive than those which concern the law and the gospel. The generality of our people confound them, and put one in the place of the other. Some suppose they are to be accepted of God for their works, and that they can be justified by the law in the sight of God. Others make their keeping of the law the condition of their receiving the blessings of the gospel, as if these were to be the purchase and reward of their partial obedience. Some are persuaded they must do all they can, and keep the law with all their might, and wherein they come short of the perfect demands of the law, Christ will, out his his merits, atone for their failings. And others again think that Christ has abated the rigor of the law, and that the gospel is nothing more than a new law dispensation, in which the Lord has been pleased to declare that he will accept of sincere obedience instead of perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-romaine.html">William Romaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Twelve Discourses on the Law and the Gospel” in The Whole Works of the Late Rev. William Romaine</cite>, (London, 1837).</span></figcaption>

</figure><figure class="quote" id="q-de7acf28c8" data-kw="">
<blockquote><p>Q. How shall we come to the right sight of our sins and a sound persuasion of the greatness of them? A: By the Spirit of God leading us into the true understanding of the law and a due examination of ourselves thereby. Q: Where is the law set down? A: it is written in many places of the Scriptures but the sum thereof is contained in the Ten Commandments. Q: Rehearse them A: I am the Lord your God, you shall have no other Gods but me… Q: How are they divided? A: Into two principal heads or tables as they are called. Q: What does the first table teach us? A: It teaches us our duties toward God and is contained in the first four commandments. Q: What does the second teach? A: Our duty toward our neighbor and is contained in the last six commandments. Q: Why are the duties towards God set down before the duties toward our neighbor? A: Because the love of God is the ground of our love of neighbor. Q: What follows hereof? A: That no one can rightly love his neighbor except he first love God. Q: Why are the duties towards our neighbor joined to our duty towards God? A: Because of the love of our neighbor is the proof our love towards God. Q: What ensues hereof? A: That no one can love God aright except he also love his neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Form Of Catechizing</cite>, (1599).</span></figcaption>

</figure><figure class="quote" id="q-3aa066fe47" data-kw="">
<blockquote><p>What are the principal parts of God’s Word? The law and the gospel. What do you call the law? It is that part of the word that commands all good and forbids all evil. What if we could keep the law? Then we should be blessed. What if we break the law? Then we are subject to the curse of God, and to death and damnation. What do you call the gospel? It is that part of the word which contains the free promises of God made unto us in Jesus Christ without and respect to our deserving. What does that work in us? It works in us a true and lively faith in Jesus Christ, whereby we lay hold of the free remission of our sins in him and the true repentance of them. What must we learn by the whole word of God? Two things: First, to make a right and sound entrance to our salvation. Secondly, how to increase and continue in the same unto the end. What is required for our right and sound entrance to our salvation? Three things are required: first, to know and to be persuaded of the greatness of our sins and the misery due to the same. Secondly, to know and be persuaded how we may be delivered from them. Thirdly, to know and be persuaded what thanks we owe to God for our deliverance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Form Of Catechizing</cite>, (Spelling modernized; HT: Chris Gordon).</span></figcaption>

<blockquote><p>At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.”

<blockquote><p>There then is the first use of the preaching of the law; to make known our innumerable faults so that in ourselves we begin to be miserable and greatly humble ourselves; in short, to beget in us the first degree of repentance which is called “contrition of heart”; this produces a full and open confession toward the Lord.</p></blockquote>

<blockquote><p>5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.

6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace.

7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-confession-of-faith.html">Westminster Confession of Faith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 19.5–7.</span></figcaption>

</figure><figure class="quote" id="q-6ef87b084f" data-kw="">
<blockquote><p>Now, the law is a doctrine partly known by nature, teaching us that there is a God, and what God is, and what he requires us to do, binding all reasonable creatures to perfect obedience, both internal and external, promising the favour of God, and everlasting life to all those who yield perfect obedience thereunto, and denouncing the curse of God and everlasting damnation to all those who are not perfectly correspondent thereunto. But the gospel is a doctrine revealed from heaven by the Son of God, presently after the fall of mankind into sin and death, and afterwards manifested more clearly and fully to the patriarchs and prophets, to the evangelists and apostles, and by them spread abroad to others; wherein freedom from sin, from the curse of the law, the wrath of God, death, and hell, is freely promised for Christ’s sake unto all who truly believe on his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1645, modern edition, 2009).</span></figcaption>

</figure><figure class="quote" id="q-60ccae10cc" data-kw="">
<blockquote><p>It may be remarked that the law of the ten commandments was promulgated to Israel from Sinai in the form of a covenant of works. Not that it was the design of God to renew a covenant of works with Israel or to put them upon seeking life by their own obedience to the law but the law was published to them as a covenant of works to show them that without a perfect righteousness answering to all the demands of the law they could not be justified before God and that finding themselves wholly destitute of that righteousness they might be excited to take hold of the covenant of grace in which a perfect righteousness for their justification is graciously provided. The Sinai transaction was a mixed dispensation. In it the covenant of grace was published as appears from these words in the preface standing before the commandments “I am the Lord thy God which have brought thee out of the land of Egypt out of the house of bondage” and from the promulgation of the ceremonial law at the sametime But the moral law as a covenant of works was also displayed to convince the Israelites of their sinfulness and misery to teach them the necessity of an atonement and lead them to embrace by faith the blessed Mediator the Seed promised to Abraham in whom all the families of the earth were to be blessed. The law therefore was published at Sinai as a covenant of works in subservience to the covenant of grace And the law is still published in subservience to the gospel as a schoolmaster to bring sinners to Christ that they may be justified by faith Gal iii 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith</cite>, (1845) on WCF chapter 19</span></figcaption>

<blockquote><p>9. From this speciall and proper way of governing reasonable Creatures, there ariseth that covenant, which is between God and them. For this covenant is as it were a certaine transaction of God with the Creature, whereby God commandeth, promiseth, threatneth, fulfilleth, and the Creature doth tie it selfe in obedience to God thus covenanting. Deut. 26. 16, 17, 18, 19. This day Jehova thy God commandeth thee. &amp;c. Thou hast avouched this day the Lord to be thy God, &amp;c. Jehova hath avouched thee this day, &amp;c. To make thee high, &amp;c. And that thou mayest be an holy people, &amp;c.

10. Now because this way of entring into covenant is not between those that are equall, but between Lord and servant. Therefore it pertaines to government, whence also it is most properly called not the covenant of man, but of God, who is the author, and chiefe Executor of it. Deut. 8. 17. 18. That he may performe his covenant.

11. By vertue of this covenant the morall workes of the intelligent Creature, whilst he is in the way, have alwayes a respect, either to happinesse as a reward, of to unhappinesse as a punishment: but in the last there is meriting, but in the other not.

12. Hence the proper and highest difference of a good work and sinne doth flow, namely in that a good worke is an operation expecting happinesse of another by way of reward: as by the opposite privation of it, evill workes are made in their kind extreamly evill.

13. Hence ariseth the force &amp; reason of conscience, which is the judgement of an intelligent Creature of it selfe, as he is subjected to God.

14. Speciall government of the reasonable Creature is of Angels and men.

15. Speciall government of Angels, is either a speciall prescription, or ordering the event that followes upon it.

16. This was the same Law as touching the substance, with the morall Law which is contained in the Decalogue.</p></blockquote>

<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.17.</span></figcaption>

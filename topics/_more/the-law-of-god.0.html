</figure><figure class="quote" id="q-6508f8c201" data-kw="">
<blockquote><p>And here consider, if we look upon the Moral Law in that notion as it was given to Adam in Paradise, I mean as it was a Covenant of Works, or as the Covenant thereof was Works; so that whosoever would receive life and salvation, must perform perfect obedience to the same, according as it is written, He that doth these things shall live in them. And again, Moses describes the righteousness which is of the Law, That the man which doth these things shall live by them: in this sense as it was given to Adam in Paradise to justify or save men, the Doctrine of Faith doth make void the Moral Law.

I will not stand disputing, whether the Law, as given by Moses, could have given life and righteousness; or whether God did primarily intend in publishing this Law by Moses on Mount Sinai, to send man to fetch his life out of the Law; this we know, that whatever strength there is in the Law ex se. Yet by reason of sin it is weakened, and it is impossible that life and salvation should come to man by it, as the case now stands: it was long since concluded. That by the Works of the Law, there shall no flesh be justified in his sight. And Paul confesseth, We are become dead to the Law by the body of Christ: And again, I through the Law am dead to the Law: We constantly teach, That every Christian by the Gospel, is freed from expecting life by any obedience to the Law.

Again, if we look upon the Moral Law in its execration, and as it is enabled with a power to curse men to hell for their sins; I say, as it is a sentencing, killing, and death-ministring Letter, the Gospel hath made it void unto believers; it hath no power to fasten the curse of heaven upon the person of any believer; though all their sins are cursed sins, even such as deserve the grand curses of the Law, yet no curse for sin can come from the Law upon them; the curse of the Law seized on Christ to the utmost, that the blessing might befall them: Further, if we shall look upon the Law in its strictness and rigour, as it hath a power to challenge and exact a punctual and personal obedience to it self, without which, it allows no man favour with God, or life from God, then it is also made void by the Doctrine of Faith, the right and strictness of the Law is fulfilled in us by our surety, its not expected that it should be fulfilled by us in our own persons.

Besides, if we shall consider the Moral Law in its coactive or coercive power, as it doth by fears and terrors wrought in the conscience, urge and constrain an obedience to it self, making men and women servile and slavish in all acts of duty; thus is it made void to beleevers under the Gospel: I do not conceive that the Spirit of bondage, or the Spirit of fear, or the Spirit of unwillingness, lays so upon a believer, that he must be forced to do required service; nay, rather he is a Law unto himself, willingly performing what is right and required, Luke 1. 74. Rom. 8. 15. 1 Tim. 1. 9. 2 Tim. 1. 7. 1 Joh. 5. 3. For this is the Love of God, that we keep his Commandments; and his Commandments are not grievous. To conclude, if we shall consider the Law Moral in its irritation, as it hath in it an accidental or occasional secret sin-provoking, enraging, or exasperating power, whereby it stirs up in men an earnestness to the commission of sin; thus is it made void to the believer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-sedgwick.html">John Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antinomianism Anatomized. Or, A Glass for the Lawless: Who deny the Ruling use of the Moral Law unto Christians under the Gospel</cite>, (London: Samuel Gellibrand, 1643), pp 9-10.</span></figcaption>

</figure><figure class="quote" id="q-0960bfb248" data-kw="">
<blockquote><p>Certainly, the Ministers of the Gospel may and must Preach the Law; It is made the note of false prophets to see vain and foolish things, and not to discover iniquity; O how many are there yet unacquainted with their heart and their life vileness, because this glass is not set open to them, and pressed upon them? O how many unbroken and unhumbled hearts are there among us, and all because the Law is not Preached; men are yet strongly wedded to their sins, scorn all tenders of mercy; cannot be drawn to think of, much less to welcome Jesus Christ, and all for want of the Preaching of the Law: Was it ever known, that until the soul was broken and brought low, and John Baptist had done his part (which is the work of the Law) that any man was prepared for Jesus Christ?

Go out therefore O you Ministers of God, gird your sword upon your thighs, and make your arrows keen in the hearts of all obstinate and rebellious sinners; Preach down all those who cry down the Preaching of the Law; and Preach you the Law to discover men unto themselves, to drive them to Christ, and to keep them on duty: Know thus much, when you Preach the Law rightly, you Preach salvation to them that fear it; as when you Preach the Gospel, you Preach damnation to them that neglect or contemn it: I would have every Minister wary in Preaching the Law; It’s possible that there may be an ill dispensation of the Law; The surgeon that launceth, may do as much hurt as he that doth not use the Instrument at all; Such as Preach not the Law at all may make dead and loose hearers, and such as Preach the Law too far may make desperate hearers.

The golden mean is to be observed: The thing I would is this. 1. I would not have the Law to be Preached alone by it self, without a mixture of some of the Promises of the Gospel; The fire hath its heat and light, and a Minister should have both Law and Gospel in his mouth. 2. I would have the Law to be Preached, as it was published, for Evangelical and merciful intentions and purposes; not for destruction and desparation, but for edification: I find that it was published in the hand of a Mediator, I would have it to be Preached in the same hand; he preacheth the Law best who preacheth it with reference to Jesus Christ; as I would in Preaching the Law shew men hell, so I would seek thereby to save them from hell; the wound should neither be made wider or deeper than the Plaster, &amp;c.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Certainly, the Ministers of the Gospel may and must Preach the Law; It is made the note of false prophets to see vain and foolish things, and not to discover iniquity; O how many are there yet unacquainted with their heart and their life vileness, because this glass is not set open to them, and pressed upon them? O how many unbroken and unhumbled hearts are there among us, and all because the Law is not Preached; men are yet strongly wedded to their sins, scorn all tenders of mercy; cannot be drawn to think of, much less to welcome Jesus Christ, and all for want of the Preaching of the Law: Was it ever known, that until the soul was broken and brought low, and John Baptist had done his part (which is the work of the Law) that any man was prepared for Jesus Christ?

Go out therefore O you Ministers of God, gird your sword upon your thighs, and make your arrows keen in the hearts of all obstinate and rebellious sinners; Preach down all those who cry down the Preaching of the Law; and Preach you the Law to discover men unto themselves, to drive them to Christ, and to keep them on duty: Know thus much, when you Preach the Law rightly, you Preach salvation to them that fear it; as when you Preach the Gospel, you Preach damnation to them that neglect or contemn it: I would have every Minister wary in Preaching the Law; It’s possible that there may be an ill dispensation of the Law; The surgeon that launceth, may do as much hurt as he that doth not use the Instrument at all; Such as Preach not the Law at all may make dead and loose hearers, and such as Preach the Law too far may make desperate hearers.

The golden mean is to be observed: The thing I would is this. 1. I would not have the Law to be Preached alone by it self, without a mixture of some of the Promises of the Gospel; The fire hath its heat and light, and a Minister should have both Law and Gospel in his mouth. 2. I would have the Law to be Preached, as it was published, for Evangelical and merciful intentions and purposes; not for destruction and desparation, but for edification: I find that it was published in the hand of a Mediator, I would have it to be Preached in the same hand; he preacheth the Law best who preacheth it with reference to Jesus Christ; as I would in Preaching the Law shew men hell, so I would seek thereby to save them from hell; the wound should neither be made wider or deeper than the Plaster, &amp;c.”

<blockquote><p>I agree also, that the Law of the Sabbath is one of the Decalogue or Ten Commandments delivered to Israel on Mount Sinai. Ex. 20. But I am willing to think it was a Law before. Not only because we find it observed, Exod. 16. (before the giving of the Law on Mount Sinai, Ex. 20.) but especially because of that in Gen. 2. 3. God blessed the Seventh day and Sanctified it, because in it he rested from all his Work. And those who are most averse to the Morality (as it is wont to be called) or the Perpetuity of the Sabbath, or Day of Holy Rest, and are yet very zealous for the Holiness of Places, would be very fond of it if they could find so clear a Testimony, and so ancient, for the holiness of Place, as here is for that of Time.

I agree also that the Law of the Decalogue or Ten Commandments, though then given peculiarly to Israel, is Obligatory to Us also. For though some Clauses therein do peculiarly respect them; as that who brought thee out of the land of Egypt out of the house of bondage, and that thy days may be long in the land which the Lord thy God giveth thee, (which I think is there said with a particular respect to the land of Canaan, which God gave to Israel, not to us;) yet the Body of that Law and the preceptive part of it, I take to be Obligatory to others also, and to Us in particular; the Decalogue being Declarative of what was (I think) a Law before (however neglected or forgotten,) and is by Christ and his Apostles frequently cited as such, even to Gentiles as well as Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-wallis.html">John Wallis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A defense of the Christian Sabbath in answer to a treatise of Mr. Tho. Bampfield pleading for Saturday-sabbath</cite>, (Oxford: Chr. Coningsby, 1692), pp 3-4.</span></figcaption>

<blockquote><p>How is the Scripture divided, in respect of the matter it handleth?

Into the Law and the Gospel: for that part of God’s word is called the Law, wherein we are taught what we ought to do, but the Gospel is that part of God’s Word. wherein we are taught, what we ought to believe, and consequently wherein we have the remission of our sins promised us by faith in Christ.</p></blockquote>

</figure><figure class="quote" id="q-e039807967" data-kw="">
<blockquote><p>It is only in accordance with what might have been expected, that the peculiar and distinguished place, which was thus secured to the Sabbath in the history of God’s providence toward the Israelites, was also given to it in the laws and statutes which he imposed upon them.

The command to remember the Sabbath, and keep it entire, as a day of sacred rest to Jehovah, formed one of the ten delivered from Mount Sinai, and along with the other nine possesses three marks or notes of distinction, which entirely separate it from the merely judicial and ceremonial statutes given to the Jewish people.

1. It was spoken immediately by the voice of God, amid the most striking manifestations of the Divine presence, and in the hearing of the people, Exod. xix. All the other laws were revealed only to Moses, and by him communicated to the people. This clearly marked off the Ten Commandments, and among the rest the law of the Sabbath, from the other statutes and ordinances given to Israel, as being in some respects of a more fundamental nature and more essentially connected with God’s character and glory than the rest.

2. It was written, in common, with the other parts of the Decalogue, by the finger of God on one of the two tables of stone, whereas the ceremonial and judicial laws were written by Moses in a book. This difference evidently implied, that the one was much more important and stable than the other—was not, like the latter, to be left to inferior hands or committed to wasting parchments, but deserving to be engraved by God’s own pen as in the rock for ever.

3. These Ten Commandments, as one great whole, were preserved, and alone preserved, in the Ark of the Covenant, Deut. x. 2, 5; 1 Kings viii. 9. The book which contained all the other laws and ordinances of God, delivered to Moses, was not placed within, but at the side of the Ark (Deut. xxxi. 26), manifestly implying, that in the Jewish economy the things written there held a very inferior place to those written on the two tables, and that the one, as a sort of outward appendage, might be removed and taken out of the way, whereas the other stood among the final and imperishable things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath. Part III. in Christian Miscellany</cite></span></figcaption>

3. These Ten Commandments, as one great whole, were preserved, and alone preserved, in the Ark of the Covenant, Deut. x. 2, 5; 1 Kings viii. 9. The book which contained all the other laws and ordinances of God, delivered to Moses, was not placed within, but at the side of the Ark (Deut. xxxi. 26), manifestly implying, that in the Jewish economy the things written there held a very inferior place to those written on the two tables, and that the one, as a sort of outward appendage, might be removed and taken out of the way, whereas the other stood among the final and imperishable things of God.”

<blockquote><p>Thou that preachest, A man should not steal, doost thou steal?] He objecteth unto the Jews those things, which were commonly committed of them. And to reprove them he useth that part of the law, whereof none was ignorant, namely, the x. commandments. And as touching theft, theft is, when we withhold that which is an other man’s against the owners will: or when we by injury draw unto us other men’s goods: or when we distribute not that which is ours when need requireth. And there are also many other kinds of theft. But in the Decalogue, or x. commandments, the chief purpose is only to set forth the chief sum, &amp; that but rudely &amp; grossly, under which we ought to understand all the parts thereof.

The ground &amp; sum of all theft is covetousness: even as in filthy pleasures is expressed only adultery: under which are comprehended all kinds of uncleanness. And as touching idolatry, there is forbidden all kind of false worshipping: when yet only is expressed, that which is most gross. For there is forbidden us any strange God, and there are forbidden also graven images, and sundry forms. Wherefore it is our part, when any of the ten commandments of God forbiddeth us any thing, well to consider, what things are comprehended under that vice. And afterward to seek out the root, against which we must to our power resist. Covetousness, or theft here hence springeth, for that we distrust in God, and are always afraid, least we should want. But adultery &amp; all uncleanness of the flesh springeth of the desire of voluptuous pleasures: as Christ expressed, when he said, If any man shall see a woman to lust after her, he hath already committed adultery in his heart. And against this concupiscence or lust ought we to strive.

And as touching murder, Christ hath likewise admonished us, that we should cut of anger, as the root thereof. Now resteth as touching sacrilege to see what the Apostle complaineth thereof. Sacrilege is rashly to touch or to usurp unto himself holy things which are dedicated unto God, due either by the name of a vow, or else of a curse. The Jews had a commandment given them, that they should not spare idols. For their duty was to overthrow and destroy all things pertaining unto them. But they being led by covetousness, reserved those things unto themselves, and turned them to their own proper commodities. So sinned Acham, and also Saul, when he had overcome Amalech.

Contrariwise Moses gave an excellent example of virtue, when he not only brake the golden calf, but also did beat it into powder, and threw it into the river. For if the reliques of the idol had remained still, peradventure the Israelites, as they were outrageous, would have worshipped them. Indeed the pub[lic] wealth, and our magistrates may take away those things which are superstitious, and convert the prices of them to good and godly uses. But this thing is not permitted unto private men. But the Hebrews were generally forbidden, that they should not save such things, especially as were vowed by a curse.</p></blockquote>

<blockquote><p>Not to lay undue stress on the first word, “Remember,” although that word does seem to imply that this is not the first time that the Sabbath has been spoken of, and to refer us back to the original appointment at the creation, — it is well worthy of notice that what is enjoined at the beginning, and what is said to be blessed at the end of the precept, is not the seventh-day, but the Sabbath-day.

What this commandment fixes, is, not the relation of the day of holy rest to the other days of the week — that was determined by the original institution — but the proportion of time to be devoted to sacred purposes, as compared with that to be employed in secular pursuits. So that there is no necessity for supposing that the commandment was altered or repealed at the time when the change was made from the seventh to the first day of the week.

The first-day Sabbath, observed by us now, is as strictly and properly the seventh day, following as it does six days of labour, as the Sabbath which was kept by the Patriarchs and Jews. If this be the correct view — if this commandment specifies merely the proportion of time, and not the particular day — not the seventh, but a seventh-day — six days of labour and one day of rest — every seventh day a Sabbath, — and we can see nothing deserving the name of “quirk” or “quibble” in such an interpretation, — then there is no need to suppose that any part of it was positive, or that any part of it has been abrogated by Christ.

The whole precept, in all its integrity, stands there among the rest, as a portion of the moral law, unrepealed, immutable — as binding upon man now, as on the day when it was first revealed. It is no merely positive enactment that has strangely found its way into a place — and that place most conspicuous and honourable — among a number of others that are moral. And if it be our duty still, in obedience to the other commandments with which it is associated, to worship Jehovah only, to revere His holy name, to honour our father and mother, to abstain from murder, adultery, theft, falsehood, and covetousness, — it is equally our duty still, under the same authority, and by the sanction of the same law, to “remember the Sabbath-day to keep it holy.”

Mark too, in confirmation of this, how, while the Passover, to which the Sabbath has frequently been compared, was rigidly restricted to the Jews — “There shall no stranger eat thereof,” — the keeping of the Sabbath is expressly enjoined, not only upon the Hebrew and his family, but on “the stranger within his gate.” And the same conclusion follows from the reason assigned for the observance, in which there is. nothing national or local, nothing peculiarly interesting to the Jews more than to any other people:— “For in six days the Lord made heaven and earth.</p></blockquote>

.%0A%0AThe+whole+precept%2C+in+all+its+integrity%2C+stands+there+among+the+rest%2C+as+a+portion+of+the+moral+law%2C+unrepealed%2C+immutable+%E2%80%94+as+binding+upon+man+now%2C+as+on+the+day+when+it+was+first+revealed.+It+is+no+merely+positive+enactment+that+has+strangely+found+its+way+into+a+place+%E2%80%94+and+that+place+most+conspicuous+and+honourable+%E2%80%94+among+a+number+of+others+that+are+moral.+And+if+it+be+our+duty+still%2C+in+obedience+to+the+other+commandments+with+which+it+is+associated%2C+to+worship+Jehovah+only%2C+to+revere+His+holy+name%2C+to+honour+our+father+and+mother%2C+to+abstain+from+murder%2C+adultery%2C+theft%2C+falsehood%2C+and+covetousness%2C+%E2%80%94+it+is+equally+our+duty+still%2C+under+the+same+authority%2C+and+by+the+sanction+of+the+same+law%2C+to+%E2%80%9Cremember+the+Sabbath-day+to+keep+it+holy.%E2%80%9D%0A%0AMark+too%2C+in+confirmation+of+this%2C+how%2C+while+the+Passover%2C+to+which+the+Sabbath+has+frequently+been+compared%2C+was+rigidly+restricted+to+the+Jews+%E2%80%94+%E2%80%9CThere+shall+no+stranger+eat+thereof%2C%E2%80%9D+%E2%80%94+the+keeping+of+the+Sabbath+is+expressly+enjoined%2C+not+only+upon+the+Hebrew+and+his+family%2C+but+on+%E2%80%9Cthe+stranger+within+his+gate.%E2%80%9D+And+the+same+conclusion+follows+from+the+reason+assigned+for+the+observance%2C+in+which+there+is.+nothing+national+or+local%2C+nothing+peculiarly+interesting+to+the+Jews+more+than+to+any+other+people%3A%E2%80%94+%E2%80%9CFor+in+six+days+the+Lord+made+heaven+and+earth.%E2%80%9D%0A%0A%E2%80%94+William+Symington%2C+The+Sabbath%3B+The+Grounds+of+its+Obligation%2C+and+its+Proper+Place+in+Relation+to+Christian+Life+and+Duty+in+Patrick+Fairbairn+et+al.%2C+Divine+Revelation+Explained+and+Vindicated%3A+A+Course+of+Lectures+for+the+Times%2C+Delivered+in+Glasgow+in+the+Spring+of+1866&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdcff4253f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dcff4253f2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/03/06/william-symington-ii-on-the-sabbath-and-the-universal-moral-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a8a675fa03" data-kw="">
<blockquote><p>First for the word Testament, it doth signify the last Will of a man which he makes before his death, and leaves behind him either in word or writing, testified by seals and witnesses; By virtue of which Will he doth dispose his lands and possessions which he hath purchased, and all his goods which he hath gathered in his life time, and doth bequeath them as he himself will, and to whom he thinks fit, either freely or with condition, to have and hold them after his death, and not before; This is the true and proper meaning of the Word, and thus it is used by the Apostle, Hebr. 9. 16. And because the Apostle there calls the Covenant Christ’s Testament, and also elsewhere in his Epistles wheresoever he doth speak of the Old and New Covenant, that is, of the Covenant of the Law and of the Gospel, doth use the Greek word διαθήκη, even the same which there he useth for the last Will and Testament of a Testator, whereupon it comes to passe, that the Books of the Law and the Prophets, before Christ, and the Covenant in them are called the New Testament, and that very fitly in some respect, I mean in respect of Christ the Mediator.

For the truth is, that the Covenant of Grace more obscurely revealed to the Fathers in the writings of the Law and Prophets, and more plainly in the Gospel and writings of the Apostles, was never in force, neither could be ratified but by the death of Christ. It was before his coming sealed by his Blood in Types and Figures; and at his Death in his Flesh it was fully sealed and ratified by his very Blood it self actually, and indeed shed for our sins, and in this respect it may be fitly called the Testament. Because as a Testament is not in force till the Testator be dead, and where a Testament is, there the death of the Testator must come between to ratify it; So it is with the Covenant of Grace, and the promises therein made unto us.

Christ hath performed and purchased all things necessary for us, &amp; doth freely give to us himself, his righteousness, and all his treasures, as a man gives his Lands and Goods in his last Will, but they cannot be of force to bring us to heaven, till his death come between as a satisfaction for sin also; It is as necessary that Justice should be satisfied for sin by his Death, as righteousness of life performed, and salvation purchased by him for us. Secondly, as a man doth seal his Testament when he seeth or imagineth that his death is at hand; So Christ at his last Supper, by instituting the Sacrament of his Body and Blood, and by the outward Signs and Seales therein contained, did seal to his Church the Covenant of Grace.

Thus in respect of CHRIST the Mediator, God and Man, the Covenant of Grace, and the writings, Old and New, wherein it is contained, are called Testaments. But in respect of God the Father, and in respect of God, considered simply, or as the Maker of the Covenant with man, and the party between whom and man the Covenant is made; the Covenant and the Writing, Old and New, wherein it is comprehended, can in no case be called a Testament, because a Testament is of no force without the Testator’s death. But God the Father never died, nor can die, neither God simply considered, nor God the Maker of the Covenant with Man, and the other party in it which is opposed to Man. Only Christ died as he was Mediator, God and Man, and as he was made a partner with Man, and stood on his side in the Covenant, and as he is the Testator, and free giver of his Word in the Old and New Testament, and of his graces and gifts therein promised; so they are called Testaments, and in no other respect at all.</p></blockquote>

<blockquote><p>34 The Law is the doctrine of works: Therefore it manifesteth unto us the corruption of our nature; it terrifieth us, and prescribeth unto us the rule of well-doing.

35 The Gospel is the doctrine of faith: which pointeth at Christ our Mediator, who hath made satisfaction for our sins, and raiseth up the conscience of man.

36 The practice of the Law and the Gospel consisteth in true Repentance.

37 Whereunto there is required Contrition, to be wrought in us by the Law; and Faith, by the Gospel.

38 Faith apprehendeth the Righteousness of Christ offered in the word of the Gospel: by which man, after Contrition wrought in him by the void of the Law, is justified before God, and beginneth to be renewed by the receiving of the Holy Ghost.

39 For by faith our hearts are purified. Acts 15.9.

40 Therefore the fruits of true Repentance are good works.

41 For, Faith worketh by Love. Gal. 5.6. And Christ giveth unto us not only his righteousness, but also his Holy Spirit, which beginneth to renew our nature, and bridle in us the concupiscences of the flesh.</p></blockquote>

<blockquote><p>I am Jehovah.” This name expresses, fundamentally, self-existence, and therefore conveys the idea that he to whom it belongs is the author of all finite being. The people to whom the law is given are hereby reminded that they are the creatures of God, living, moving, having their being in him, and that this absolute physical dependence involves an absolute moral dependence also.

This name serves to show that this law was not given to the Hebrews, as Hebrews, but as men, and, consequently, that it belongs not to those elements of the Mosaic institute which are provisional and temporary, but to those which are permanent and eternal. The sum of this law is love; and love to God is absolutely essential to the perfection and happiness of men. The law has been dispensed under many different forms, but in its essence it is as immutable as the nature of God and the relation of creature to creator.</p></blockquote>

<blockquote><p>They destroy the Moral Law which was delivered by Moses, by saying that is imperfect. Christ came to fulfil (that is, say they) to make the Law perfect; and they overthrow the Gospel, by saying that we are justified by the works of the Law, and by their confounding of the Law of Faith, and the Law of works; they say as the Jews say, that the great work of the Messiah is to proclaim and confirm the Law, only they add that it was his intent, legem Mosaicam ceu minus perfectam perficere &amp; locupletare, and therefore they say, Christ and his Apostles did so often press obedience to the Law, to shew that we are to be justified by the works of the Law: and hence it is that they call our blessed Saviour, Mosen Mosissimum, as if Christ had not preached the Gospel, the Law of Faith, as the Apostle calls it, Rom. 3. 27. And by this means the Law of Justification by faith alone without the works of the Law, which is the scope of the Gospel, is quite overthrown.</p></blockquote>

ass="perma" href="../quote/5bbdfb3edf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/10/19/francis-cheynell-on-socinian-opposition-to-law-and-gospel/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-92187abf33" data-kw="">
<blockquote><p>This standard [of national righteousness] can be none other than the Moral Law, the rule of universal rectitude, propounded with greater or less degrees of clearness, but demanding of all cordial and unlimited obedience. National righteousness implies freedom from national crimes, – recognition of the obligation of the Divine law, – and the practice of equity, truth and mercy, in acts of positive obedience to the will of Jehovah, the universal Sovereign. To have the character of righteousness in a proper and full sense, nations must receive the law from the hands of the Mediator, and rulers and subjects to a large extent embrace and exemplify the Gospel. They must assume the revelation of mercy as the basis of their public measures, and carry into application those principles of universal justice which receive the fullest development, and the most powerful confirmation from the Mediatorial system.

The law of nations, or the law of nature, is the same as the Moral Law, originally written on man’s moral constitution, and still found in scattered and imperfect lineaments in the hearts and consciences of men, and in the laws and customs of all nations under heaven. The only full and clear republication of this law is contained in the Scriptures of truth, in connexion with the remedial scheme that effectually provides for man’s recovery from ruin, through the wondrous obedience and death of the Lawgiver. This is the grand rule of moral rectitude to nations as well as to individuals.

Wherever the revealed law of heaven comes, it advances paramount claims to homage and subjection. None are truly righteous, save those who are conformed to it in heart and life. So in nations, the righteousness which exalt them, consists not in the number and excellence of their public institutions, nor in their commerce, literature, wealth, or military prowess, nor even in a lengthened course of outward prosperity. Many of these advantages have been enjoyed by States that have been the scourges of mankind, and that have sunk under the vengeance of the Almighty. But a righteous national character, – the fountain of countless capacity, its rulers and people, frame their nation in its collective capacity, its rulers and people, frame their constitution and regulate their proceedings in accordance with the supreme standard of rectitude, the revealed law of heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of nations favoured with divine revelation to promote scriptural education: in two discourses</cite>, (Belfast: George Druitt, 1840), pp 10-11.</span></figcaption>

<blockquote><p>2 Q. How many Commandments are there?

2. A. There are ten Commandments which are the sum and substance of all God’s perpetual Law. Deut. 10. 9. Exod. 34. 28.

Are there not ten?

Yes.

And, Are they not the sum and substance of all God’s perpetual Law?

Yes.

And, Hath not every one of them a general meaning and scope, and so encompasseth whatsoever tendeth to that?

Yes.

And, Do they not among them forbid all evil?

Yes.

And, Command all good?

Yes.

And, That in words &amp; thoughts as well as deeds?

Yes.</p></blockquote>

<blockquote><p>XVI. Fourth, the moral law (which is the pattern of God’s image in man) ought to correspond with the eternal and archetypal law in God, since it is its copy and shadow (aposkimation), in which he has manifested his justice and holiness. Hence we cannot conform ourselves to the image of God (to the imitation of which Scripture so often exhorts us) except by regulating our lives in accordance with the precepts of this law.

So when its observation in enjoined, the voice is frequently heard, “Be ye holy, for I am holy.” Now this law is immutable and perpetual. Therefore the moral law (its ectype) must necessarily also be immutable.</p></blockquote>

<blockquote><p>For this end (I mean that we might be coupled &amp; married thus to Christ, and so be certain of salvation &amp; at godly peace with god in our consciences) God hath given his holy word, which hath two parts (as now the children of God do consist of two men) one part of God’s word being proper to the old man, &amp; the other part of God’s word being proper to the new man. The part properly pertaining to the old man is the law: the part properly pertaining to the new man is the gospel.

The law is a doctrine which commandeth &amp; forbiddeth, requiring doing and avoiding. Under it therefore are contained all precepts, threatnings, promises upon conditions of our doing &amp; avoiding &amp;c. The Gospel is a doctrine which always offereth and giveth, requiring on our behalf, not as of worthiness or as a cause but as a certificate unto us, &amp; therefore under it is contained all the free and sweet promises of God: as I am the lord thy God &amp;c.

In those that be of years of discretion, it requireth faith, not as a cause, but as an instrument whereby we our selves may be certain of our good husband Christ, and of his glory: and therefore when the conscience feeleth it self disquieted for fear of God’s judgement against sin, she may in no wise look upon the doctrine pertaining to the old man, but to the doctrine only that pertaineth to the new man, in it not looking for that which it requireth, that is Faith, because we never believe as we should: but only on it which it offereth, which it giveth that is, on God’s grace &amp; eternal mercy and peace in Christ. So shall she be in quiet, when she looketh for it altogether out of herself in God’s mercy in Christ Jesus: in whose lap if she lay her head with saint John, then is she happy and shall find quietness in deed.

When she feeleth her self quiet, then in God’s name let her look on the law &amp; upon such things as it requireth, thereby to bridle and keep down the old Adam, to slay that Goliath, from whom she must needs keep the sweet promises, being the bed wherein her spouse and she meet and lie together, as the wife will keep her bed only for her husband, although in other things she is contented to have fellowship with others, as to speak, sit, eat, drink, go, &amp;c.

So our consciences, which are Christ’s wives, must needs keep the bed, that is, God’s sweet promises, all only for our selves and our husband, there to meet together, to embrace and laugh together, and to be joyful together. If sin, the law, the devil, or any thing would creep into the bed and lie there, then complain to thy husband Christ, and forth with thou shalt see him play Phineas’ part. Thus my dearly beloved, I have given you in few words a sum of all the Divinity which a Christian conscience cannot want.</p></blockquote>

nline · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c0ea707ae3" data-kw="">
<blockquote><p>There is no duty imposed upon the Israelite in the Ten Commandments, which is not equally incumbent upon all men, everywhere. These commandments are but the positive publication to Israel, of the universal human duties, the common morality of mankind. It was not merely natural but inevitable that in this positive proclamation of universal human duties to a particular people, a special form should be given their enunciation specifically adapting them to this particular people in its peculiar circumstances; and it was eminently desirable that they should be so phrased and so commended as to open a ready approach for them to this particular people’s mind and to bring them to bear with especial force upon its heart.

This element of particularity embedded in the mode of their proclamation, however, has no tendency to void these commandments of their intrinsic and universal obligation. It only clothes them with an additional appeal to those to whom this particular proclamation of them is immediately addressed. It is not less the duty of all men to do no murder, not to commit adultery, not to steal, not to bear false witness, not to covet a neighbour’s possession, that the Israelite too is commanded not to do these things, and is urged to withhold himself from them by the moving plea that he owes a peculiar obedience to a God who has dealt with him with distinguishing grace.

And it is not less the duty of all men to worship none but the one true God, and Him only with spiritual worship; not to profane His name nor to withhold from Him the time necessary for His service, or refuse to reverence Him in his representatives, that these duties are impressed especially on the heart of the Israelite by the great plea that this God has shown Himself in a peculiar manner his God. The presence of the Sabbath commandment in the midst of this series of fundamental human duties, singled out to form the compact core of the positive morality divinely required of God’s peculiar people, is rather its commendation to all peoples of all times as an essential element in primary human good conduct.</p></blockquote>

</figure><figure class="quote" id="q-dd4a748d56" data-kw="">
<blockquote><p>For it is written that Abraham had two sons, one by a slave and the other by a free woman. (Galatians 4:22)

V. 22. That Abraham) the meaning is, that as in Abraham’s family there were two mothers, and two kinds of issues, the one of bondage, and the other free, and the heir: so amongst those that have the knowledge of the true God, and make profession of serving him, there are two kinds according to the two doctrines or covenants propounded by God unto men, namely, the Law and the Gospel: those which hold themselves to the Law to obtain righteousness and life are slaves to sin and to the curse, and are finally excluded from the heavenly inheritance: those that embrace the Gospel are heirs and free.

V. 23. After the flesh) in a mere natural way: A figure of them who are out of Christ’s grace, and do of themselves endeavour to obtain life, and righteousness by the Law. By the promise) namely, by a free gift, and by a miraculous operation of God, out of the course of nature. A figure of Believers who are made sons and heirs of God, by his only grace and power.

V. 24. Are an allegory, the Italian, have an allegorical sense) namely, besides the historical and literal sense, may be taken for a figure of God’s great family. Are the two) that is to say, they signify and represent the two, &amp;c. The one) namely, that of the Law which was given in mount Sinai. Gendreth) of it self it may make those who are its followers to be part of God’s people by knowledge, profession, and worship; but in the mean time it cannot free them from their natural bondage, nor bring them into God’s grace, nor obtain the inheritance of heavenly life for them. Which is] namely, this covenant was figured by Agar.

V. 25. Agar is] namely, in this similitude of Abraham’s family with Gods family; Agar first is correspondent to Sinai, because that as Agar was a stranger, not of the blessed progeny, so Sinai was in Arabia in the Ishmaelite’s land, out of the bounds of the Land of Promise. And secondly, to the earthly Jerusalem of this age which makes profession of seeking life and righteousness in the Law, whereby all those which follow it do lose all right in the adoption and grace of God, and do remain subject to sin and malediction.

V. 26. But Jerusalem] there is also another body which is correspondent to Sara; namely, the Christian Church, which God himself hath created by his Word and Spirit, whose state shall also be perfect in Heaven, and that is freed by God from all spiritual bondage; and in it, and by it God gendreth and bringeth up all his true children.</p></blockquote>

V. 24. Are an allegory, the Italian, have an allegorical sense) namely, besides the historical and literal sense, may be taken for a figure of God’s great family. Are the two) that is to say, they signify and represent the two, &amp;c. The one) namely, that of the Law which was given in mount Sinai. Gendreth) of it self it may make those who are its followers to be part of God’s people by knowledge, profession, and worship; but in the mean time it cannot free them from their natural bondage, nor bring them into God’s grace, nor obtain the inheritance of heavenly life for them. Which is] namely, this covenant was figured by Agar.

<blockquote><p>IV. Third, “in all the precepts synecdoche is to be acknowledged” by which in one proposed species, all under the same genus are understood, and by one prohibited vice others of the same kind analogous to it (and whatever bear upon or lead to it) are prohibited. Thus in the precept “thou shalt not commit adultery” is prohibited every affection for another’s wife; to lust after her (Mt. 5:28) and all illicit desires are forbidden.

Under homicide, all angry feelings are included. What are most base and capital in each species of sin are forbidden, under which all the others are included, either because they flow thence or because they lead at length to it; or because what appear the smallest to men are in the most accurate judgment of God rated more severely. This is not done, therefore, to excuse or exclude lesser sins, but that a greater detestation of sin may be impressed upon our minds. For the flesh endeavours to dilute the foulness of sin and to cover it under specious pretexts; for example, anger and hatred are supposed to be so execrable when these terms are used, but when they are prohibited under the name of homicide, we understand better in how great abomination they are held by God.</p></blockquote>

<blockquote><p>Q. So much of the Preface: How are the Commandments divided?

A. Into two Tables: whereof the first contain our duties to God, in the four first Commandments; and the other those to our neighbour, in the six other Commandments.

Q. What are those towards God?

A. Such as concern his worship; and therefore to be preferred before the other towards our neighbour.

Q. How may that be shewed?

A. By the inequality of the persons offended, God, and man; then also by the punishments assigned in the Scripture: for the breaches of the first Table, are to be more severely punished, then the breaches of the second. As he that revileth the Magistrate shall bear his sin, but he that blasphemeth God, shall be stoned to death. Which serveth to discover the crafty practices of the Papists, who would make men believe that the chiefest and most meritorious good Works, of all, required in the Law of God, are the works of the second Table; as Charity, alms-deeds, thereby deceiving the people to enrich themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), p. 78.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>Now having expounded the words of the Commandment, let us come briefly to handle the question, Whether this Commandment be perpetual, binding all men in all ages, or whether temporary binding only the men which lived before the resurrection of Christ, and no further? It is manifest that the Laws given in the old Testament are to be distinguished in regard of their continuance into these two kinds. For the will of the Law-giver (from which the force, extent, and continuance of the Law hath its original) was that some of them should be observed but till the resurrection of Christ and no longer, and again that some should continue in force from the time of their making to the world’s end.

Now concerning this fourth Commandment, it is apparent that the Law-giver did intend that it should bind all men for ever from the time that he gave it. For how could he declare his mind in this behalf more plainly then by equalling it in all things with those precepts which are known to be of everlasting continuance, and by separating it from, and exalting it above all those other which are known to have been but Temporary. It was promulgated in the same majestic manner with the same voice, at the same time, and in the same place that the other nine. It was delivered to the same person to be laid up together in the same Ark, and so is a part of the same Covenant, whence those Tables are called the Tables of the Covenant, and that Ark the Ark of the Covenant.

What Commandment, therefore is a part of the eternal Covenant, and is by God graced and commended with all those signs of commendation wherewith all the rest are graced, cannot, I think, be made of less continuance then the rest; for what did their writing in Tables of stone, and laying up in the Ark signify, but their durableness and eternal continuance, and full accomplishment for us in Christ. The Lord hath separated this precept from all temporary precepts, by giving it those privileges, as it were, and notes of honour, which all of them wanted, and God hath equalled it with the perpetual and everlasting precepts, by communicating to it all those testimonies of force and continuance which they had, therefore we are bound to believe that he would have this to continue in force as much and as long as the rest, even to all men in all ages, so long as this world shall last.

There is one argument that carries some shew of force for the overthrowing of this Doctrine of the perpetuity of the fourth Commandment, viz. That we are not now bound to do the thing it requireth, nay we are bound not to do it. For our Sabbath is not the seventh but the eighth from the Creation. To which I answer, That this fourth Commandment doth not require to rest and sanctify the seventh from the creation, nor from any other period or date of time, but alone the seventh after six of labour, or coming betwixt six of labour, in a settled course of numbering from any period that God should appoint; and so in the meaning of the Commandment we do now and ever must rest the seventh day, for the seventh is that part in order of numbering which doth still come betwixt six, having six before it and six after continually, and so our day of rest hath, and therefore we also rest the seventh day.

Indeed the period from which we take the beginning of our account, is not the same but another, for they did reckon from the beginning of the Creation and so forward, we from the Resurrection and so forward; but ours is as truly and surely the seventh as theirs, though reckoned from another period; and for the period from whence the count must be made, we have no word at all in this precept. He saith not six days from the creation thou shalt labour, and the seventh from the creation is the Sabbath of the Lord, in it thou shalt do no work, but six days shalt thou labour; and he saith not after, the Lord blessed and sanctified the seventh day from the creation, but the Sabbath day; that is, the seventh after six of labour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, pp 813-14.</span></figcaption>

m+the+Resurrection+and+so+forward%3B+but+ours+is+as+truly+and+surely+the+seventh+as+theirs%2C+though+reckoned+from+another+period%3B+and+for+the+period+from+whence+the+count+must+be+made%2C+we+have+no+word+at+all+in+this+precept.+He+saith+not+six+days+from+the+creation+thou+shalt+labour%2C+and+the+seventh+from+the+creation+is+the+Sabbath+of+the+Lord%2C+in+it+thou+shalt+do+no+work%2C+but+six+days+shalt+thou+labour%3B+and+he+saith+not+after%2C+the+Lord+blessed+and+sanctified+the+seventh+day+from+the+creation%2C+but+the+Sabbath+day%3B+that+is%2C+the+seventh+after+six+of+labour.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+system+or+body+of+divinity+consisting+of+ten+books%3A+wherein+the+fundamentals+and+main+grounds+of+religion+are+opened%2C+the+contrary+errors+refuted%2C+most+of+the+controversies+between+us%2C+the+papists%2C+Arminians%2C+and+Socinians+discussed+and+handled%2C+several+Scriptures+explained+and+vindicated+from+cor%2C+%28London%3A+William+Lee%2C+1654%29%2C+IX.V%2C+pp+813-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8efa5b6e4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8efa5b6e4a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/11/edward-leigh-on-the-perpetual-obligation-of-the-fourth-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e6e2269197" data-kw="">
<blockquote><p>Given that the law is the purveyor of death, when it reveals sin and the wrath of God against sin, it is not a message of grace or mercy but of the horrible wrath of God against sin, as the words of the law echo: “Cursed is the one who has not kept it all.” The law promises grace, peace and happiness only to those who keep it all perfectly.

The preaching of the gospel sounds another note entirely: “Come to me all you who labour and are heavy laden, and I will give you rest.” Therefore the word of grace is the exact opposite of the law and all its works and merits.</p></blockquote>

</figure><figure class="quote" id="q-8b89f75bc1" data-kw="">
<blockquote><p>So little does Jesus imagine that the Ten Commandments were of local and temporary obligation that He treats them as the law of the universal and eternal kingdom which He came to establish. Nor has He left us to infer this merely from His dealing with them in such instances as this of the rich young ruler. He tells us explicitly that His mission as regards the law was, not to abrogate it, but “to fulfil it,” that is to say, “to fill it out,” complete it, develop it into its full reach and power. The law, He declares in the most solemn manner, is not susceptible of being done away with, but shall never cease to be authoritative and obligatory.

“For verily I say unto you,” He says, employing for the first time in the record of His sayings which have come down to us, this formula of solemn asseveration—”Verily I say unto you, till heaven and earth pass away, one jot or one tittle shall in no wise pass away from the law, till all things be accomplished.” So long as time endures, the law shall endure in full validity, down to its smallest details.

The concluding phrase of this declaration, rendered in our Revised Version, “until all things be accomplished,” and perhaps even more misleadingly in the Authorized Version, “till all be fulfilled,” is not a mere repetition of “Till heaven and earth pass away,” but means, in brief, “until all which the law requires shall be done, until no item of the law shall remain unobserved.” So long as the world stands no iota of the law shall pass away—till all that it prescribes shall be performed.

The law exists not to be broken or to be abrogated, but to be obeyed; not to be “undone,” to employ an old English phrase, but to be “done.” It is to be obeyed, and it shall be obeyed, down to the last detail; and therefore in no detail of it can it be set aside or safely neglected. “The thought is,” remarks H. A. W. Meyer justly, that “the law will not lose its binding obligation, which reaches on to the final realization of all its prescriptions, so long as heaven and earth remain.”

Now, the law of which our Lord makes this strong assertion of its ever-abiding validity includes, as one of its prominent constituent parts, just the Ten Commandments. For, as He proceeds to illustrate His statements from instances in point, showing how the law is filled out, completed by Him, He begins by adducing instances from the Ten Commandments: “Thou shalt not kill”; “Thou shalt not commit adultery.” It is with the Ten Commandments clearly in His mind, therefore, that He declares that no jot or tittle of the law shall ever pass away, but it all must be fulfilled.</p></blockquote>

</figure><figure class="quote" id="q-844a025f83" data-kw="">
<blockquote><p>Again the law of God, is either perpetual, or for a certain time. The perpetual law of God, is that law which doth always bind all reasonable creatures to obedience: and that is called the moral law. The moral law is that law which teacheth how every one ought to behave himself, in inward, and outward manners, that his whole life may be agreeable to God’s will.

The sum of that is comprehended in the decalogue or ten commandments. The decalogue or ten commandments is a brief sum of the moral law, containing ten precepts. And that is divided into two tables or parts. The first table containeth four commandments, concerning our duties toward God, or concerning love towards God, or concerning his worship.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Again the law of God, is either perpetual, or for a certain time. The perpetual law of God, is that law which doth always bind all reasonable creatures to obedience: and that is called the moral law. The moral law is that law which teacheth how every one ought to behave himself, in inward, and outward manners, that his whole life may be agreeable to God’s will.

The sum of that is comprehended in the decalogue or ten commandments. The decalogue or ten commandments is a brief sum of the moral law, containing ten precepts. And that is divided into two tables or parts. The first table containeth four commandments, concerning our duties toward God, or concerning love towards God, or concerning his worship.”

nter</a></div>

<blockquote><p>It may also be said that this law is in the middle of a code, all the rest of which is acknowledged to be binding; and why not this? Were the other precepts of this code spoken by God from Sinai, amidst blackness and darkness, and tempest and terrors? So was this. Were the others written by the finger of God, on tables of stone? So was this. Were the others deposited in the ark of the testimony, in the holy of holies, under the wings of the cherubim? So was this.

No ceremonial or repealable law, given to the Jews, had these marks of honor put upon it. Did Christ say, “I came not to destroy, but to fulfil the law?” He said it as much of this as of any other precept. Did Christ’s most devoted followers keep the other commandments? So did they keep this. Luke 23: 56.</p></blockquote>

</figure><figure class="quote" id="q-a7d6993795" data-kw="">
<blockquote><p>First here observe, that the Law of God is made perpetual and unchangeable: If any man ask how this can be, seeing the Apostle saith, The Law is changed?

Answer. The Law is threefold; Ceremonial, Judicial, and Moral, as hath been said: now that place is principally to be understood of the Ceremonial law, which indeed is abrogated, in regard of the observation of it in God’s worship; but in the scope and substance of it, which is Christ crucified, with his benefits, whom it shadowed out, it remaineth still, and is now more plain then ever it was.

As for the Judicial law, though it be abrogated unto us, so far forth as it was peculiar to the Jews; yet, as it agrees with common equity, and serves directly to establish the precepts of the Moral law, it is perpetual. If it be said, that Christ changed the Moral law, in changing the Sabbath day, from the seventh day to the eight: I answer, Christ did so indeed by his Apostles, but that is no change of the substance, but of the ceremony of the Sabbath: for the substance of that law is, the enjoining of a seventh day’s rest unto the Lord. Now though the seventh day from the creation be not kept, yet a seventh day is kept still.

If it be further said, that the Law it self is abrogated; for that every one that breaketh the Law is not accursed, according to the sentence thereof, Deut. 27. 26.

Answer. We must know that the Law is but one part of God’s word, and the Gospel another, revealing another part of Gods will, besides that which the Law made known; for it adds a qualification to the Law, moderating the rigour thereof, after this manner: He is accursed (saith the Law) that faileth in any commandment, except (saith the Gospel) he be reconciled again in Christ, and in him have the pardon of his transgressions. And yet the Moral law remains for ever a rule of obedience to every child of God, though he be not bound to bring the same obedience for his justification before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 74-75.</span></figcaption>

</figure><figure class="quote" id="q-9b55840893" data-kw="">
<blockquote><p>The ark of the covenant, with its lid as the mercy-seat, and the cherubims at each end with outstretched wings, was the whole furniture properly belonging to the most holy place in the tabernacle; it was the very heart and centre of the Old Testament dispensation, out of which all its ceremonial institutions grew, and around which they all in a manner circulated.

And why was the ark called the ark of the covenant? Simply because it contained, and was made for the sole purpose of containing, the two tables of stone, which formed what is called the book of the covenant; for the covenant made with the Israelites properly consisted in the Ten Commandments, and not, as is very commonly imagined, in the laws and statutes of ceremonial worship.

This is repeatedly affirmed, and in the most express terms. Thus, in Exod. xxxiv. 28, it is said of God, that he “wrote upon the tables the words of the covenant, the Ten Commandments.” And in Deut. iv. 13, ix. 9, 11, 15, the tables are constantly named the tables of the covenant which God made with them in Horeb. For this reason it was, then, that the ark, or chest, which stood in the most holy place, was called the ark of the covenant, being made for the single and express purpose of holding the words or tables of the covenant — the Ten Commandments; and the character which belonged to the ark, in the Old Testament dispensation, belonged to it merely as the sacred repository of these all-important statutes: so that they formed the very innermost point and centre of that former dispensation — the ground and basis on which its entire superstructure of rites and ordinances was reared.

And why so singular a place given to these Ten Commandments? No adequate reason can possibly be assigned but this — that together they formed the substance of that duty which God requires of man; they are the brief but comprehensive expression of God’s holiness, as manifested in his government of his creatures on earth; the sum and perfection of all righteous obedience — attained only when there is the exercise of perfect love to God, and perfect love to man.

Who could prevail to keep that summary of complete and faultless obedience? None but the Holy One of Israel; who alone could say, in the language prepared for him by the Psalmist, “Lo, I come to do thy will, O God.” Therefore, till he came, the most holy place, where these Commandments were kept, was a barred region, excepting once a year to the high priest, who typified the person and work of Christ; and the Commandments themselves were covered out of tight beneath the lid of the ark, which was the mercy-seat, and on which the blood of atonement was sprinkled, to testify the guilt of sin committed against these Commandments could indeed be purged away, but only by the blood of Him who was himself sinless, perfect in all the righteousness of God.

Thus was the work of Christ shadowed forth by these outward symbols; the law, or book of the covenant, in the centre of the whole, declaring the perfect righteousness he had to perform, even unto death, before any sinner could enter the presence of a holy God in peace; the mercy-seat revealing the well-pleased satisfaction with which God should contemplate the work of his Son, as that through which be could dispense pardon to the guilty; and the cherubims, with intent eye, looking into the glorious mystery of this great redemption, and ready, as birds on the wing, to “minister to those who should be heirs of salvation.”

Now it is obvious, that the whole meaning and design of this fundamental part of the Old Testament dispensation depends upon the Ten Commandments being that perfect rule and covenant of obedience, for the fulfilment of which Christ led his spotless lite, and shed his atoning blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath. Part III. in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-35b91965e6" data-kw="">
<blockquote><p>Christ does not free believers from obedience to the moral law: It is true we are no more under it as a covenant for our justification; but we are, and must still be under it, as a rule for our direction. The matter of the moral law is unchangeable, as the nature of good and evil is, and cannot be abolished except that distinction could be destroyed, Mat. 5: 17,18. The precepts of the law are still urged under the gospel to enforce duties upon us, Eph. 6:12. It is therefore a vain distinction, invented by Libertines, to say it binds us as creatures, not as Christians: or that it binds the unregenerate part, but not the regenerate: but this is a sure truth, that they who are freed from its penalties are still under its precepts.

Though believers are no more under its curse, yet they are still under its conduct: The law sends us to Christ to be justified, and Christ sends us to the law to be regulated. Let the heart of every Christian join therefore with David’s in that holy wish, Psal. 119:4, 5. “Thou hast commanded us to keep thy precepts diligently; O that my heart were directed to keep thy statutes.” It is excellent when Christians begin to obey the law from life, which others obey for life; because they are justified, not that they may be justified. It is also excellent when duties are done in the strength, and for the honour of Christ, which is evangelical; and not in our own strength, and for our own ends, which is servile and legal obedience: Had Christ freed us from obedience, such a liberty had been to our loss.</p></blockquote>

</figure><figure class="quote" id="q-f629dc1361" data-kw="">
<blockquote><p>In regard then to the place which it occupies, it forms one of the Ten Commandments; all the rest of which are confessedly of eternal obligation, and were delivered in a very different manner, indeed, from the ceremonial law, which was to be binding on the Church only under the Mosaic dispensation.

The Ten Commandments were spoken by God himself from amidst the thunders and lightnings of mount Sinai, in the hearing of all the people; and he added no more, but wrote them once and again on two tables of stone, and delivered them unto Moses, to be by him deposited in the ark which was placed under the mercy-seat in the Holy of Holies.

It was not so with any other law or commandment enjoined upon Israel. All the rest were delivered to Moses in the mount, beyond the hearing of the Assembly of Israel: they were written by Moses in a book; and, though carefully preserved, still, as has been well observed, they were placed, not in, but by the side of the ark, as if to intimate that they might one day be separated and removed from it. But the Ten Commandments were placed in the ark under the mercy-seat, intimating that they were to receive their fulfilment in Him of whom the ark was a type, even Christ who is the “end of the law for righteousness to every one that believeth,” and without whose perfect obedience to the law there never could have been a mercy-seat for sinners to approach.

It is impossible, I think, seriously to consider all these circumstances, without being convinced that it was the purpose of God to distinguish the Fourth Commandment above all precepts and institutions of a mere positive or ceremonial nature—that, in fact, he has given to it all the weight and permanency of a moral obligation.

And, indeed, it is plain that, in substance, it is of a moral nature; for if, as God’s rational creatures, we are under an eternal obligation, in some way or other, to worship and do him homage, then some portion of time must necessarily be devoted to that duty; and though our reason might not be able to discover, in the nature of the thing, any necessity for that time being limited to one day rather than another, yet, did we understand the constitution of our nature as God understands it, or could we estimate as he estimates the tendency and the influence of his institutions, as they are calculated to affect us; I doubt not we should perceive something very different from a mere arbitrary arrangement, in his expressly appointing one whole day in seven to be a holy Sabbath to himself.</p></blockquote>

<blockquote><p>Since the moral law is the rule of life and conduct, which law is comprised in the decalogue, or ten commandments, it will be necessary to give an exposition of it. But first we must make a few preliminary observations. This law is divided into two tables, one of which contains the sum of the obedience we owe to God, the other of that which we owe to man; it is also divided into ten commandments, of which the first four relate to the first, the last six to the second table.

Again, there are certain rules for explaining the decalogue. The first rule is, that the negative are included in the affirmative, and the affirmative in the negative precepts, for what is good cannot be performed, without the opposite evil being avoided, nor the forbidden evil be avoided, without the opposite good being performed.

The second rule is, that under one species, which is expressed, all the species of the same genus are comprehended; and where one fault is prohibited, all others of the same kind, and analogous to it, together with every thing that tends or leads to it are also prohibited.

The third rule is, that the cause is included in the effect, the species in the genus, the correlative in the relative.

The fourth rule is that the law regulates not only the outward actions. but also the inward thoughts of the mind. “For the law is spiritual,” as St. Paul says; (Rom. vii. 14,) nor is the case the same with the heavenly Lawgiver, who searcheth the reins and the heart, as with an earthly lawgiver, who only takes cognizance of that which meets the senses.

The fifth rule is, that love is the sum and end of all the commandments.

The sixth rule is, that the affirmative precepts are not always binding, but admit of various interpretations and modifications according to time and place; for instance, a son is not always bound to obey his father; but the negative precepts are always binding, at all times, and in all places, without any regard to circumstances.

Moreover, there are certain rules of the obedience which is due to the law—it must be sincere, universal, perfect, and persevering. It must be performed by the whole man—the love of our neighbour must be subject to the love of God—and we must pay greater obedience to the moral precepts of the second table, than to the ceremonial precepts of the first, because God will have mercy, and not sacrifice.</p></blockquote>

Moreover, there are certain rules of the obedience which is due to the law—it must be sincere, universal, perfect, and persevering. It must be performed by the whole man—the love of our neighbour must be subject to the love of God—and we must pay greater obedience to the moral precepts of the second table, than to the ceremonial precepts of the first, because God will have mercy, and not sacrifice.”

<blockquote><p>Ma. Which be the chiefest parts of the Word of God?

Scho. The Law and the Gospel.

Ma. How be these two known, the one from the other?

Sch. The Law teacheth us our duty towards God, and our Neighbour, and chargeth us straightly to do the same: promising everlasting life to such as do fulfil the Law, and threatning eternal damnation to such as do break the same.

Ma. What doth the Gospel?

Sch. It promiseth that God, through faith in Christ, will be merciful to forgive the offenders of the Law, such as be sorry therefore, and purpose to amend.

Ma. How many parts be there of true Religion?

Sch. There be two principal parts of Religion, likewise as of the Word of God; out of the which, as it were the spring head, Religion doth flow.

Ma. Which be they?

Sch. Obedience, which the Law commandeth: and faith, or belief, which the Gospel requireth.</p></blockquote>

<blockquote><p>In conclusion, the Law pronounces us blessed when we accomplish it without omitting anything; the Gospel promises us salvation when we believe, that is to say, when, by faith, we take hold of Jesus Christ who has everything which we lack, and still more that we need.

</figure><figure class="quote" id="q-25f2d0e08b" data-kw="">
<blockquote><p>There are two sorts of things belonging to the church. Some which are intrinsical, and belonging to the soul or inward man, directly and primarily. Such things are not to be dispensed and administered by the civil magistrate:

I mean the word and sacraments, the keys of the kingdom of heaven, the suspension or excommunication of church officers or members, the ordination or deposition of officers, the determination and resolution from Scripture of controversies concerning the faith, the worship of God, the government of the church, cases of conscience.

These being in their nature, end, and use, merely spiritual, and belonging not to the outward man, but to the inward man or soul, are committed and entrusted to the pastors and other ruling officers of the church, and are not of civil and extrinsical, but of ecclesiastical and intrinsical cognisance and judgment.

There are other things belonging to the church, which are extrinsical, and do properly belong to the outward man, and are common to the church with other human societies or corporations: things of this kind fall within the civil jurisdiction; for the churches of Christ, being societies of men and women, and parts of commonwealths, are accountable unto and punishable by the civil magistrate, in their bodies, lives, civil liberties, and temporal estates, for trespasses against the law of God or the law of the land.

By the law of God I understand here jus divinum naturale, that is, the moral law or Decalogue, as it bindeth all nations (whether Christians or infidels), being the law of the Creator and King of nations. The magistrate, by his authority, may, and in duty ought, to keep his subjects within the bounds of external obedience to that law, and punish the external man with external punishments for external trespasses against that law.

From this obligation of the law, and subjection to the corrective power of the magistrate, Christian subjects are no more exempted than heathen subjects, but rather more straitly obliged. So that if any such trespass is committed by church officers or members, the magistrate hath power and authority to summon, examine, judge, and (after just conviction and to punish these, as well as other men. We do therefore abominate the disloyal papal tenet, that clergymen are not to be examined and judged by civil, but by ecclesiastical courts only, even in causes civil and criminal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh: Robert Ogle, and Oliver &amp; Boyd, 1844), Book 2.8, p. 121.</span></figcaption>

</figure><figure class="quote" id="q-af2aa585c5" data-kw="">
<blockquote><p>The perpetuity and the universal obligation of the Sabbath, and consequently its appointment in the beginning of time, are distinctly indicated by the place assigned it in the Decalogue. It is acknowledged that the other nine precepts are of universal and perpetual obligation; and for this reason they were written on tables of stone by the finger of God. But why should a ceremonial institution, designed for only one nation, and destined to pass away, be incorporated in a law which is obligatory on all men, and is to continue in force to the end of time?

True, there is something of the nature of a positive command in it; but it is also clearly moral. All our time belongs to God. Six parts of it he allows to be devoted to ordinary pursuits and pleasures; but the seventh he retains, and requires it to be specially and exclusively devoted to spiritual duties. The obligation to employ our time, or any part of it, according to divine direction, is clearly moral. And no reason can be assigned for the placing of the command to hallow the Sabbath in the Decalogue, save that, like the other nine, it is of universal and perpetual obligation. And since the other commandments were in substance given in the beginning of time, so was the fourth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The perpetuity and the universal obligation of the Sabbath, and consequently its appointment in the beginning of time, are distinctly indicated by the place assigned it in the Decalogue. It is acknowledged that the other nine precepts are of universal and perpetual obligation; and for this reason they were written on tables of stone by the finger of God. But why should a ceremonial institution, designed for only one nation, and destined to pass away, be incorporated in a law which is obligatory on all men, and is to continue in force to the end of time?

<blockquote><p>III. Second, “in affirmative precepts, negative, and in negative, affirmative are contained.” As in Scripture there are more things than words, so in the precepts and interdicts there is always more than is expressed in words. Not that the law is to be considered as a Lesbian rule (to be made to mean anything), but that we may search more deeply into the meaning of the lawgiver and embrace those things which are mutually connected or depend upon each other.

Hence since a good precept cannot be performed by the law without its opposite evil being avoided (nor a prohibited evil be shunned without its opposite good being performed), it follows that in the affirmative precepts negative are contained, and in the negative affirmative; so that those which are expressly negative and impliedly affirmative and vice versa. And so virtues are commanded when vices are forbidden. …</p></blockquote>

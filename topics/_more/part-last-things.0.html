<blockquote><p>22. On the other hand, I can scarce satisfy myself in my attempts to remove some difficulties. For since (as we before proved) God does, by virtue of his natural goodness, most ardently love a holy creature, as the lively image of Himself, how can this his goodness destroy that image and undo his own work? “Is it good unto thee that thou shouldst despise the work of thine hands” without deserving such treatment? Job 10:3. If it was good and for the glory of God to have made a creature to glorify Him, will it be good and for the glory of God to annihilate that creature who thus glorifies Him; and thus in fact to say, ‘Thou shalt not glorify me forever?’ Besides, as God Himself has created the most intense desire of eternity in the soul, and at the same time has commanded it to be carried out towards Himself as its eternal good; is it becoming God to frustrate such a desire, commanded and excited by Himself? Further, we have said it was a contradiction to suppose God addressing Himself to a holy soul in the manner following: ‘Hunger after me, but thou shalt not enjoy me.’ Yet in the moment we conceive the holy creature just sinking into annihilation, it would, in consequence of that divine command, hunger and thirst after God without any hope of ever enjoying Him again. Unless we should choose to affirm, that God at length would say to that soul: ‘Cease longing for me any more; acquiesce in this instance of my supreme dominion, by which I order thee to return to nothing.’ But I own it surpasses my comprehension how it is possible a holy creature should not be bound to consider God as its supreme good, and consequently pant after the enjoyment of Him.</p></blockquote>

<blockquote><p>39. Moreover, it might be here inquired whether the eternity of punishment ought to be derived from this natural right of God; or, which is the same thing, whether a punishment justly equivalent to every sin ought necessarily to be eternal, according to God’s natural right; so that to maintain the contrary would be unworthy of God and consequently impossible. A difficult question this, and the rather because to determine concerning this absolute right of God in special cases, seems to be above human reach. God is greater than man; He gives not an account of his matters. (Job 33:12-13) Let us, however, try whether from the consideration of the divine perfections, we may not gather what may in this case be worthy of God. 40. I now presuppose that there is in sin committed against the infinite majesty of God, a malignity in its measure infinite, and therefore a demerit of punishment in its measure infinite also. I fay that there is in sin a malignity only in its measure infinite. For it cannot be called infinite in an absolute sense. If you confider the entity of the act in itself, an act infinitely intense cannot be elicited by a finite creature: if the irregularity, and the privation of moral good adhering to the act, it is a privation of a finite rectitude, such as can be competent to a creature: if, in fine, you confider the whole complex, namely, sin in the concrete, as they speak, neither in that case is its malignity absolutely infinite. For all vicious acls are not equal, but there is a great disparity among them; which could not be unequal, if they were infinite. However, the malignity of sin is in its measure infinite: 1. Objctively, becaufe it is committed against an infinite good. 2. Extensively, in respect of duration, because the blot or stain of sin endures forever, unless it be purged away by the blood of Christ. And therefore there is in Him a desert of punishment not absolutely infinite as to intenseness of torments: (1) Because such a punishment is absolutely impossible; for a finite creature is not capable of infinite torments. (2) Because it would follow that God could never satisfy his justice by inflicting condign punishment on the wicked, seeing they are incapable of this punishment. Now, it is then absurd to say that any punishment is of right due to sin, which God could never inflict. (3) Because it would follow that an equal punishment was due to all sins, or that all in fact were to be punished alike: which is an absurdity and against Mt. 11:22, 24. The reason of this consequence is because there neither is, nor can be any disparity between infinites. Nevertheless there is in sin a desert of punishment in its measure infinite; namely, in the same manner that the malignity of it is infinite. That is: 1. Objectively, so as to deprive man of the enjoyment of the infinite good, which is God. 2. Extensively, so that the punishment shall last forever. And thus I consider this desert of eternal punishment so far only as to conclude that God does nothing contrary to equity and justice when He punishes the sins of men with eternal torments both of soul and body. Which the event shows, as I have made appear above, sect. 17. 41. But I know not if it can be determined whether this eternity ought necessarily to consist in the punishment of sense or whether the justice of God may be satisfied by the eternal punishment of loss in the annihilation of the sinful creature. This, I apprehend, may be said with sufficient probability and sobriety: If God shall be pleased to continue in existence forever the sinful creature, it is necessary (without a satisfaction) that He forever inflict punishment on him, not only the punishment of loss, but likewise that of sense. The reason is because not only the guilt of sin always remains, but also the stain with which sin, once committed, infects the soul and which can never be purged out but by the blood of Christ. But it is impossible, as we proved, sect. 22-24, that God should admit man stained with sin, to communion with Himself: and it cannot be that a rational creature, excluded the enjoyment of the divine favor, should not feel this indignation of God with the deepest anguish. Conscience most severely lashes the wretches for having squandered away the chief good. Which with no small care we have alfo shown, sect. 13 and the following sections. 42. But whether it be necessary that God should preserve forever the sinful creature in a state of existence, I own I am ignorant. May it not in its measure be reckoned an infinite punishment if God should please to doom man, who was by nature a candidate for eternity, to total annihilation, from whence He should never be suffered to return to life? I know God has now determined otherwise, and that with the highest: justice. But it is queried whether, agreeably to his juftice, He might not have settled it in this manner: ‘If thou, O man, sin, I will frustrate thy desire of eternal happiness and of a blessed eternity, and, on the contrary, give thee up to eternal annihilation?’ Here at Ieast let us stop.</p></blockquote>

<blockquote><p>When Thomas Cranmer drew up his Articles of Religion in 1553, there were Forty-Two of them, not the eventual Thirty-Nine, and its final two articles condemned those who sought to restore the doctrines of millennialism and universal restoration. However, when the Articles were revised, they were omitted for reasons not entirely clear. As a result, there is nothing in the Articles of Religion that requires a belief in eternal conscious torment without the hope of repentance, which is something that later universalists would come to point out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“When Thomas Cranmer drew up his Articles of Religion in 1553, there were Forty-Two of them, not the eventual Thirty-Nine, and its final two articles condemned those who sought to restore the doctrines of millennialism and universal restoration. However, when the Articles were revised, they were omitted for reasons not entirely clear. As a result, there is nothing in the Articles of Religion that requires a belief in eternal conscious torment without the hope of repentance, which is something that later universalists would come to point out.”

— River Devereux, ‘A History of Alternative Views of Hell in the Church of England’ (2025)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+Thomas+Cranmer+drew+up+his+Articles+of+Religion+in+1553%2C+there+were+Forty-Two+of+them%2C+not+the+eventual+Thirty-Nine%2C+and+its+final+two+articles+condemned+those+who+sought+to+restore+the+doctrines+of+millennialism+and+universal+restoration.+However%2C+when+the+Articles+were+revised%2C+they+were+omitted+for+reasons+not+entirely+clear.+As+a+result%2C+there+is+nothing+in+the+Articles+of+Religion+that+requires+a+belief+in+eternal+conscious+torment+without+the+hope+of+repentance%2C+which+is+something+that+later+universalists+would+come+to+point+out.%E2%80%9D%0A%0A%E2%80%94+River+Devereux%2C+%E2%80%98A+History+of+Alternative+Views+of+Hell+in+the+Church+of+England%E2%80%99+%282025%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3472fb0e3b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3472fb0e3b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/hell#:~:text=When%20Thomas%20Cranmer%20drew%20up%20his,universalists%20would%20come%20to%20point%20out." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f38928421" data-kw="">
<blockquote><p>…universalism soon arose in England among independent churchmen who were open to questioning the status quo. Between 1649 and 1653, Gerrad Winstanley, Richard Coppin, and three anonymous authors, had works published which advocated for universalism… No doubt inspired by these authors, universalism rapidly spread among a highly influential group of theologians, comprised of both conformists and non-conformists, known as the Cambridge Platonists. This group had a special appreciation for the writings of Origen, the retrieval of whom dated back to Erasmus in the previous century, and their universalist ideas were inspired by him. Of this group, we know that at least Peter Sterry [Westminster Divine], George Rust, and Joseph Glanvill affirmed universalism, and Henry More, John Smith, and Ralph Cudworth likely did as well, though they were more coy about it.</p></blockquote>

<blockquote><p>In 1661, Bishop Rust’s ‘A Letter of Resolution Concerning Origen and the Chief of his Opinions,’ was published anonymously with the support of his fellow Cambridge Platonists. This treatise is a bold defence of Origen’s teachings about the pre-existence of souls and the salvation of all God’s rational creatures… the influence that it and the Cambridge Platonists had on the flourishing of universalism in the following century was enormous. If the sixteenth century provided the fertile soil, it was the seventeenth century which sowed the seeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

</figure><figure class="quote" id="q-598435c150" data-kw="">
<blockquote><p>As for annihilationism, the first Anglican cleric to publicly show an openness to the idea was none other than the illustrious Bishop Jeremy Taylor. In his sermon ‘Christ’s Advent to Judgment,’… Taylor explains at some length that church fathers like Justin Martyr and Irenaeus believed that God would eventually annihilate the damned, since immortality is not intrinsic to human nature… Taylor… cannot bring himself to be certain of annihilationism. He settles only for its possibility… No controversy or backlash ever followed Bishop Taylor’s questioning of eternal conscious torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

<blockquote><p>Thomas Burnet… was… an influential thinker with many friends in high places, which is how he became the Chaplain to King William III and Clerk of the Closet. Burnet wrote ‘A Treatise Concerning the State of Departed Souls,’ where he argued for universal reconciliation and strongly repudiated the traditional view of eternal damnation… Burnet’s Treatise was published posthumously in 1720… Burnet did not deny that there would be a judgment for those who reject Christ or fail to repent of their sins, but he did not believe this judgment would last forever.</p></blockquote>

<blockquote><p>While belief in annihilationism was rare before the nineteenth century, it eventually rose exceedingly, although it was still less common than universalism… the fact that universalism was a popular belief among educated Victorians in general… In a world without lawful torture, constant public executions, and severed heads on display across London Bridge, people began to question the portrayals of hell as an eternal torture-chamber that were ubiquitous in the Middle Ages. Thus, there were dozens of universalist Anglican thinkers in this period…</p></blockquote>

<blockquote><p>Objection. In the same way as Abraham was justified, so also are we justified, as children of Abraham. But Abraham was not justified by faith alone, but also by works, as the apostle James testifies (Jm. 2:21). Response. A person is said to be justified either before himself and in his conscience, or before God. Abraham was not justified before himself and in his conscience by faith alone, but also by works—I grant it. He was not justified by faith alone before God—I deny it. I explain: a godly person sometimes doubts whether he is among those who are justified; that is, he acknowledges indeed that he must be justified by true faith, but doubts whether his faith is true. This, however, he discovers and recognizes from the warmth of faith, namely charity. James does not treat of that justification which is before the tribunal of God, but of that by which we are justified in our own conscience, when our righteousness is made evident to us. Therefore, we are justified—that is, our righteousness is made manifest to us—not only by faith but also by good works, insofar as they are evidences of sincere faith; but we are not thus justified before God, who regards faith alone.</p></blockquote>

<blockquote><p>Therefore, we dismiss these [previously mentioned] opinions, while holding firmly to the popular and more commonly accepted view which maintains that the Pontiff, his rank and his rule, are correctly described by this prophecy. In fact, we may compute his name in either Greek or Hebrew, the two languages by which God gave his oracles and prophecies (shrouding them in mystery), yet the sum of their letters will yield the same result. For, if the computation be made in Greek, which is quite appropriate considering the Revelation was written in Greek to Greeks, no other suitable name occurs than the name Lateinos, as Irenaeus [A.D. 130-202] conjectured. And, if the name Romanus should be counted in the Hebrew characters, it will mean either Roman seat or Roman, as John Foxe [1516-1587] determined. Moreover, the Hebrew term comprises the same meaning as that of the Greek term. For Romanus or Lateinos is the name of the aforementioned Beast and is that name which the Pope imposes on all his disciples [that is, Roman Catholic]. It is on this self-same Beast that all these and additional marks of Antichrist converge; i.e., such marks as causing the whole earth, which follows him, to wonder; his blaspheming the name of God; and the great power he holds over the heads of all people and tongues, etc. That this name contains the number 666 in both Greek and Hebrew is not a point of dispute [the following is in the Greek alphabet]: L – λ – 30 a – α – 1 t – τ – 300 e – ε – 5 i – ι – 10 n – ν – 50 o – ο – 70 s – ς – 200 = 666 Thus the Roman Pontiff and his Seat is undoubtedly indicated. For he is truly Latin who holds the remains of the Latin empire and the ancient seat. By no small coincidence, he does not allow public worship to be conducted in any other language than Latin; nor does he publish his official documents and decrees in any other language. Also, the Eastern Orthodox call the Roman Church by the name Latin Church, as seen in the general councils where this distinction was meticulously made between the western fathers or bishops, called Latins, while the rest were called Greeks. Therefore, the name Lateinos (in Greek) or Romanus (in Hebrew) is fully consistent with the fulfillment of this prophecy, in that it predicts the seat of the Beast to be Rome, where it remains to this day. The truth is out in the open.</p></blockquote>

<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>

<blockquote><p>Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.</p></blockquote>

%93+1653+or+1655%29+was+a+German+reformed+minister%2C+a+delegate+at+the+Synod+of+Dort+and+a+professor+of+theology+and+philosophy+in+Bremen.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84a6e98317.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84a6e98317.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-judgment/bible-verses-on-rewards-in-heaven/#:~:text=Such%20works%20%28that%20obtain%20a%20reward%29,God%20has%20promised%20rewards%2C%20we%20admit." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>

<blockquote><p>I come now to my third [point]: that it is lawful to do good works intuitu mercedis, ‘with an eye or respect to the recompense of reward’. It is plain that Nehemiah here did so: “Remember me, O my God, concerning this,” etc. [Neh. 13:14] So did Moses, of whom it is said that he chose rather to suffer affliction with the people of God than to enjoy the pleasures of sin for a season; esteeming the reproach of Christ greater riches than the treasures of Egypt(Heb. 11:25–26), for, says the text, [Greek] (aspiciebat or intuebatur) [Greek], he had respect unto the recompense of reward. And, I confess, it seems an unreasonable thing to me [1] that that which is made the end (though but in part) of the action should not be at all looked unto by the agent; whereas finis is principium actionis [‘the end is the principle of the action]; and [2] that that which God has promised unto us as an encouragement, to make us work with the more alacrity, should not be thought on nor looked to in our working. Do not they who would persuade this go the way to discourage men from good works, by removing out of their sight the encouragement which God has given them? But they object, the obedience of God’s children ought to be filial, that is, free, and not mercenary, as that of hirelings. I answer: obedience which is only for reward, without all respect or motive of love and duty, is the obedience of a hireling; not that which acknowledges the tie of obedience-absolute, and the reward no otherwise due than of his Father’s free love and bounty, as every true child of God does, and ought to do. They object again that of the apostle, 1 Cor. 13:5, “Charity seeks not her own.” Now, say they, the works of God’s children must proceed from love and charity. I answer: what though charity seeks not her own? May not yet a charitable man so much as look or hope for his own, or have an eye to what is promised him? But this place is altogether misapplied and abused: for that property of charity now mentioned (as some also of the rest in that chapter) concerns only our charity towards men, and not our charity towards God; the meaning thereof being that a charitable man will sooner lose his own than, by seeking or contending for it, break the bond of charity.</p></blockquote>

</figure><figure class="quote" id="q-17ebb7d5dd" data-kw="">
<blockquote><p>We say that the said good works are pleasing and acceptable to God, and indeed have their reward from God, yet not a reward of any preceding merit properly so-called, which would have either an equality with the prize of eternal life, or even a proportion to it; but a reward that is only gracious, resting on the benignity and mercy of God.</p></blockquote>

<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.”

— Joshua Placeus, ‘Theological Theses on the Justification of Man before God’ trans. AI (1634), p. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXL.+Are+good+works+therefore+unnecessary+for+our+justification%3F+To+become+righteous+from+being+guilty+and+liable+to+punishment%E2%80%94that+is%2C+to+receive+the+abundance+of+grace+and+the+gift+of+righteousness%E2%80%94they+are+not+necessary+as+antecedents.+But+they+are+absolutely+necessary+as+consequences.+They+are+the+fruits+and+ends+of+justification%2C+from+which+justification+ought+not+and+cannot+be+separated.+For+in+the+New+Covenant%2C+God+has+first+promised+us+the+forgiveness+of+sins%2C+and+then+sanctification.+Christ+has+been+made+for+us+not+only+righteousness%2C+but+also+sanctification.+Faith+embraces+both+promises%2C+and+draws+both+benefits+from+the+fullness+of+Christ%2C+into+whom+it+inserts+us.+Thus%2C+a+faith+that+does+not+produce+good+works+as+its+fruits+reveals+itself+not+to+be+true+faith+at+all%2C+but+a+rotten+corpse+of+faith%2C+which+mimics+the+outward+appearance+of+faith+but+has+no+power%2C+movement%2C+or+activity.+Therefore%2C+in+order+that+we+may+be+declared+righteous%2C+and+that+it+may+be+shown+%28whether+in+the+court+of+our+conscience+or+in+the+final+judgment%29+that+God+has+truly+granted+us+forgiveness+of+sins%2C+good+works+are+necessary+as+posterior+evidences%2C+as+they+say.+For+faith+is+known+by+its+works%2C+just+as+a+tree+is+known+by+its+fruits.+References%3A+Heb.+10%3A16%3B+2+Cor.+1%3A30%3B+Jm.+1%3A11.%E2%80%9D%0A%0A%E2%80%94+Joshua+Placeus%2C+%E2%80%98Theological+Theses+on+the+Justification+of+Man+before+God%E2%80%99+trans.+AI+%281634%29%2C+p.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eddfe8052.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eddfe8052.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=XL.%20Are%20good%20works%20therefore%20unnecessary,10%3A16%3B%202%20Cor.%201%3A30%3B%20Jm.%201%3A11." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-4540f60acb" data-kw="">
<blockquote><p>…with respect to the very obscure and difficult passage in 1 Pet. 3:19, about his going and preaching to the spirits in prison, I must say that I have never met with an interpretation of it that seemed to me altogether satisfactory. Among the many interpretations that have been given of it, there are just two in support of which anything really plausible, as it appears to me, can be advanced–viz., first, that which regards the preaching there spoken of as having taken place in the time of Noah, and through the instrumentality of Noah; and secondly, that which regards it as having taken place after his resurrection, and through the instrumentality of the apostles. The latter view is ably advocated in Dr. John Brown’s Expository Discourses on First Peter [pp. 515-518]. If either of these interpretations be the true one, the passage has no reference to the period of his history between his death and resurrection.</p></blockquote>

<blockquote><p>For man knows God naturally in the same way as he desires him naturally. Now man desires him naturally insofar as he naturally desires happiness, which is a likeness of the divine goodness. Hence it does not follow that God considered in Himself is naturally known to man, but that his likeness is. Therefore, man must come by reasoning to know God in the likenesses to Him which he discovers in God’s effects.</p></blockquote>

</figure><figure class="quote" id="q-ba6637706b" data-kw="">
<blockquote><p>What is ‘happiness’ after all? Is it a matter of ‘getting what you want’? Is it a matter of maximizing pleasure and minimizing pain, as Bentham and Mill held (albeit in different ways)? On these conceptions, happiness seems to be definable in terms of the subjective states of the agent. On an Aristotelian or classical natural law conception, though, it is something objective, a matter of living in accordance with one’s nature, understood as a fixed essence entailing a natural end or purpose.</p></blockquote>

<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>

<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews. 2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>

<blockquote><p>When it comes to the punishments of little ones, believe me, I am tormented by great anxieties, nor do I find at all what to respond… Although I desire it, I ask it, I wish for it with ardent vows and expect that the Lord may take away my ignorance of this matter through you, yet if I am minimally deserving, I will ask for patience for myself from the Lord our God.</p></blockquote>

</figure><figure class="quote" id="q-010ce8e010" data-kw="">
<blockquote><p>The penalty is proportioned to the fault, and therefore to actual mortal sin, in which is found an aversion from the incommunicable good and a conversion to a communicable good, is due a penalty of loss, namely the lack of the divine vision, corresponding to the aversion, and a penalty of sense, corresponding to the conversion. But in original sin there is no conversion to the creature, but only an aversion from God, or something corresponding to aversion, namely the destitution of the soul of original justice; and therefore to original sin is not due a penalty of sense, but only a penalty of loss, namely the lack of the divine vision,” etc. And they wish that these infants suffer this penalty of loss in the Limbo, as they call it, of Infants. §48. The Protestants: 1. Agree that this stain is in itself meritorious of eternal death and damnable, but does not always actually damn. 2. They deny the Limbo of Infants. Some, however, agree with Augustine thus far, that they feel the infants of infidels are damned, from 1 Cor. 5:12-13. [3.] Others believe that all infants are damned [as they did not reach, and were not ordained to salvation through actual faith]. [4.] Others, that judgment should not be precipitated, believe that all infants, even of infidels, are saved. Such are Zwingli in Declaration on Original Sin to Urbanus Rhegius, tome 2, Opera, p. 120; Franciscus Junius in Collation on Nature &amp; Grace contra Puccius, Reason 18, p. 331; J. Bergius in Der Wille Gottes, ch. 19, §1, 5, ff., pp. 213-25; G. J. Vossius in History of Pelagianism, bk. 2, pt. 2, th. 4 &amp; pt. 3, th. 4; Ludovicus Crocius in Twelve Dissertations, VI, §3, ff., pp. 282-85, and also Dissertation XI, §53, pp. 685-86; Daille in Apology for the Two Synods, pt. 3, pp. 464-67 &amp; pt. 4, pp. 636-39; Jaquelot in Examination of the Theology of Bayle, pt. 2, §1, p. 201. §49. We subscribe to the benign judgment of these on account of reasons sought: (1) From the Covenant of Grace, initiated with the repenting first parents (Gen. 3:15-16) and with Noah and Abraham (Gen. 18:18; 22:18; 28:14). Of which covenant are ordinarily those who have proceeded from covenanted parents, whether immediately, i.e., from a father and mother, or either one; or mediately, i.e., from covenanted ancestors, although with an interrupted continuation, as God says He will exercise mercy unto a thousand generations (Ex. 20:6). (2) From the philanthropy of God and the universal ransom of Christ, by which the fault and guilt of Adam was expiated, and access to the celestial kingdom was opened to all, from which none are excluded except the voluntarily unbelieving, as is established from Rom. 5:15, 17-19, 21. (3) Because no one is obligated to the impossible, which agrees with the words of Christ in Jn. 15:22, 24, “If I had not come and spoken unto them, they had not had sin,” etc. (4) Because not the privation, but the contempt of a sacrament damns; otherwise God would not have restricted circumcision to the eighth day. (5) Because in the places on the Final Judgment, evitable sins are brought forth as the cause of damnation, as in Mt. 25:41 ff.; Jn. 3:17, 19; 5:29; 2 Cor. 5:10.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The penalty is proportioned to the fault, and therefore to actual mortal sin, in which is found an aversion from the incommunicable good and a conversion to a communicable good, is due a penalty of loss, namely the lack of the divine vision, corresponding to the aversion, and a penalty of sense, corresponding to the conversion. But in original sin there is no conversion to the creature, but only an aversion from God, or something corresponding to aversion, namely the destitution of the soul of original justice; and therefore to original sin is not due a penalty of sense, but only a penalty of loss, namely the lack of the divine vision,” etc. And they wish that these infants suffer this penalty of loss in the Limbo, as they call it, of Infants. §48. The Protestants: 1. Agree that this stain is in itself meritorious of eternal death and damnable, but does not always actually damn. 2. They deny the Limbo of Infants. Some, however, agree with Augustine thus far, that they feel the infants of infidels are damned, from 1 Cor. 5:12-13. [3.] Others believe that all infants are damned [as they did not reach, and were not ordained to salvation through actual faith]. [4.] Others, that judgment should not be precipitated, believe that all infants, even of infidels, are saved. Such are Zwingli in Declaration on Original Sin to Urbanus Rhegius, tome 2, Opera, p. 120; Franciscus Junius in Collation on Nature &amp; Grace contra Puccius, Reason 18, p. 331; J. Bergius in Der Wille Gottes, ch. 19, §1, 5, ff., pp. 213-25; G. J. Vossius in History of Pelagianism, bk. 2, pt. 2, th. 4 &amp; pt. 3, th. 4; Ludovicus Crocius in Twelve Dissertations, VI, §3, ff., pp. 282-85, and also Dissertation XI, §53, pp. 685-86; Daille in Apology for the Two Synods, pt. 3, pp. 464-67 &amp; pt. 4, pp. 636-39; Jaquelot in Examination of the Theology of Bayle, pt. 2, §1, p. 201. §49. We subscribe to the benign judgment of these on account of reasons sought: (1) From the Covenant of Grace, initiated with the repenting first parents (Gen. 3:15-16) and with Noah and Abraham (Gen. 18:18; 22:18; 28:14). Of which covenant are ordinarily those who have proceeded from covenanted parents, whether immediately, i.e., from a father and mother, or either one; or mediately, i.e., from covenanted ancestors, although with an interrupted continuation, as God says He will exercise mercy unto a thousand generations (Ex. 20:6). (2) From the philanthropy of God and the universal ransom of Christ, by which the fault and guilt of Adam was expiated, and access to the celestial kingdom was opened to all, from which none are excluded except the voluntarily unbelieving, as is established from Rom. 5:15, 17-19, 21. (3) Because no one is obligated to the impossible, which agrees with the words of Christ in Jn. 15:22, 24, “If I had not come and spoken unto them, they had not had sin,” etc. (4) Because not the privation, but the contempt of a sacrament damns; otherwise God would not have restricted circumcision to the eighth day. (5) Because in the places on the Final Judgment, evitable sins are brought forth as the cause of damnation, as in Mt. 25:41 ff.; Jn. 3:17, 19; 5:29; 2 Cor. 5:10.”

— Barthold Holtzfus, ‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 16-18 Holtzfus was a German reformed theologian, and a hypothetical universalist respecting the atonement. | §47. The common opinion of the Roman Church today is that infants dying without baptism suffer a punishment not of sense, but of loss, which Thomas proposed nervously in On Evil, quest. 5, art. 2:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+penalty+is+proportioned+to+the+fault%2C+and+therefore+to+actual+mortal+sin%2C+in+which+is+found+an+aversion+from+the+incommunicable+good+and+a+conversion+to+a+communicable+good%2C+is+due+a+penalty+of+loss%2C+namely+the+lack+of+the+divine+vision%2C+corresponding+to+the+aversion%2C+and+a+penalty+of+sense%2C+corresponding+to+the+conversion.+But+in+original+sin+there+is+no+conversion+to+the+creature%2C+but+only+an+aversion+from+God%2C+or+something+corresponding+to+aversion%2C+namely+the+destitution+of+the+soul+of+original+justice%3B+and+therefore+to+original+sin+is+not+due+a+penalty+of+sense%2C+but+only+a+penalty+of+loss%2C+namely+the+lack+of+the+divine+vision%2C%E2%80%9D+etc.+And+they+wish+that+these+infants+suffer+this+penalty+of+loss+in+the+Limbo%2C+as+they+call+it%2C+of+Infants.+%C2%A748.+The+Protestants%3A+1.+Agree+that+this+stain+is+in+itself+meritorious+of+eternal+death+and+damnable%2C+but+does+not+always+actually+damn.+2.+They+deny+the+Limbo+of+Infants.+Some%2C+however%2C+agree+with+Augustine+thus+far%2C+that+they+feel+the+infants+of+infidels+are+damned%2C+from+1+Cor.+5%3A12-13.+%5B3.%5D+Others+believe+that+all+infants+are+damned+%5Bas+they+did+not+reach%2C+and+were+not+ordained+to+salvation+through+actual+faith%5D.+%5B4.%5D+Others%2C+that+judgment+should+not+be+precipitated%2C+believe+that+all+infants%2C+even+of+infidels%2C+are+saved.+Such+are+Zwingli+in+Declaration+on+Original+Sin+to+Urbanus+Rhegius%2C+tome+2%2C+Opera%2C+p.+120%3B+Franciscus+Junius+in+Collation+on+Nature+%26+Grace+contra+Puccius%2C+Reason+18%2C+p.+331%3B+J.+Bergius+in+Der+Wille+Gottes%2C+ch.+19%2C+%C2%A71%2C+5%2C+ff.%2C+pp.+213-25%3B+G.+J.+Vossius+in+History+of+Pelagianism%2C+bk.+2%2C+pt.+2%2C+th.+4+%26+pt.+3%2C+th.+4%3B+Ludovicus+Crocius+in+Twelve+Dissertations%2C+VI%2C+%C2%A73%2C+ff.%2C+pp.+282-85%2C+and+also+Dissertation+XI%2C+%C2%A753%2C+pp.+685-86%3B+Daille+in+Apology+for+the+Two+Synods%2C+pt.+3%2C+pp.+464-67+%26+pt.+4%2C+pp.+636-39%3B+Jaquelot+in+Examination+of+the+Theology+of+Bayle%2C+pt.+2%2C+%C2%A71%2C+p.+201.+%C2%A749.+We+subscribe+to+the+benign+judgment+of+these+on+account+of+reasons+sought%3A+%281%29+From+the+Covenant+of+Grace%2C+initiated+with+the+repenting+first+parents+%28Gen.+3%3A15-16%29+and+with+Noah+and+Abraham+%28Gen.+18%3A18%3B+22%3A18%3B+28%3A14%29.+Of+which+covenant+are+ordinarily+those+who+have+proceeded+from+covenanted+parents%2C+whether+immediately%2C+i.e.%2C+from+a+father+and+mother%2C+or+either+one%3B+or+mediately%2C+i.e.%2C+from+covenanted+ancestors%2C+although+with+an+interrupted+continuation%2C+as+God+says+He+will+exercise+mercy+unto+a+thousand+generations+%28Ex.+20%3A6%29.+%282%29+From+the+philanthropy+of+God+and+the+universal+ransom+of+Christ%2C+by+which+the+fault+and+guilt+of+Adam+was+expiated%2C+and+access+to+the+celestial+kingdom+was+opened+to+all%2C+from+which+none+are+excluded+except+the+voluntarily+unbelieving%2C+as+is+established+from+Rom.+5%3A15%2C+17-19%2C+21.+%283%29+Because+no+one+is+obligated+to+the+impossible%2C+which+agrees+with+the+words+of+Christ+in+Jn.+15%3A22%2C+24%2C+%E2%80%9CIf+I+had+not+come+and+spoken+unto+them%2C+they+had+not+had+sin%2C%E2%80%9D+etc.+%284%29+Because+not+the+privation%2C+but+the+contempt+of+a+sacrament+damns%3B+otherwise+God+would+not+have+restricted+circumcision+to+the+eighth+day.+%285%29+Because+in+the+places+on+the+Final+Judgment%2C+evitable+sins+are+brought+forth+as+the+cause+of+damnation%2C+as+in+Mt.+25%3A41+ff.%3B+Jn.+3%3A17%2C+19%3B+5%3A29%3B+2+Cor.+5%3A10.%E2%80 </figure><figure class="quote" id="q-e3c4b7bc33" data-kw="">
<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confirming</cite>, pp. 589-90</span></figcaption>

<blockquote><p>I. There are three kinds or differences of life: there is a life of nature, which the apostle calls Natural. There is a life of Grace, which the sons of God alone do enjoy in this world: there is a life of Glory, which consists in the vision of God. II. Life eternal is two ways taken: Metonymically, both for the way to life, and for Christ Himself: Properly, for the state of the blessed after this life. III. There is one vision of God natural, in the things created; another specular, or symbolical, by resemblances and signs; another of faith, by the doctrine and doings of Christ; another of present sight, or of glory to come, when we shall see God face to face.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confuting, of Life Eternal</cite>, pp. 594-5</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-b1ffe2efcb" data-kw="">
<blockquote><p>4. If indeed theology is considered as it is knowledge endowed by God upon creatures, either communicated in this age or to be communicated in the future age, that theology is ectypal. And this theology is fashioned by God alone from the archetype, as it were, through various ways and degrees of communication; for men turning to and fro in this world, through the grace of revelation; for angels rather, and for blessed spirits in heaven, it is received through the grace of vision, by benefit of which we also, after this life, face to face; that is, before him and closely, shall contemplate him as he is, 1 Jn. 3:2.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. If indeed theology is considered as it is knowledge endowed by God upon creatures, either communicated in this age or to be communicated in the future age, that theology is ectypal. And this theology is fashioned by God alone from the archetype, as it were, through various ways and degrees of communication; for men turning to and fro in this world, through the grace of revelation; for angels rather, and for blessed spirits in heaven, it is received through the grace of vision, by benefit of which we also, after this life, face to face; that is, before him and closely, shall contemplate him as he is, 1 Jn. 3:2.”

<blockquote><p>Life eternal is the highest degree of blessedness, in which we shall be made partakers of Christ’s glory, enjoying the sight of God, and heavenly joys forever and ever. The Rules: … III. That eternal happiness consists in our freedom from all evil; in the variety, magnitude and eternity of joys… IV. The variety of joys, is considered in the glorification of man, in the delights of heavenly mansions, in the blessed society of the saints, but chiefly in the union with God… … II. There shall be such a communion with God, that we shall see Him without end, love Him without tediousness, and praise Him without wearisomeness… XII. So great shall be that joy, that neither our tongues can express it, nor our minds conceive it… XIII. Neither shall any bounds be set to this happiness, nor shall we ever fall from it, but it shall continue forever…</p></blockquote>

<blockquote><p>7. Because the state of the church then will be one of perfection and not of edification, the ministry, sacraments, and discipline together with the instituted churches themselves will cease, and the mystical church will remain in immediate communion with God.</p></blockquote>

</figure><figure class="quote" id="q-421e5b9be5" data-kw="">
<blockquote><p>Yea, take the formal vision of God in an immediate fruition in heaven as a duty, and as in that notion contra-distinguished from the objective vision of Christ, then Christ is to be enjoyed, loved, rested on, infinitely above the duties of vision, beatific love, eternal resting on Him, yea, above imputed righteousness, assurance of pardon, reconciliation; as the King is more than his bracelets of gold, his myrrh, spikenard, perfumes, ointment, kisses; the tree more desireable then a fleece of apples that grows on it for the fourth part of a year.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Yea, take the formal vision of God in an immediate fruition in heaven as a duty, and as in that notion contra-distinguished from the objective vision of Christ, then Christ is to be enjoyed, loved, rested on, infinitely above the duties of vision, beatific love, eternal resting on Him, yea, above imputed righteousness, assurance of pardon, reconciliation; as the King is more than his bracelets of gold, his myrrh, spikenard, perfumes, ointment, kisses; the tree more desireable then a fleece of apples that grows on it for the fourth part of a year.”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself (London: 1647), pp. 82-83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYea%2C+take+the+formal+vision+of+God+in+an+immediate+fruition+in+heaven+as+a+duty%2C+and+as+in+that+notion+contra-distinguished+from+the+objective+vision+of+Christ%2C+then+Christ+is+to+be+enjoyed%2C+loved%2C+rested+on%2C+infinitely+above+the+duties+of+vision%2C+beatific+love%2C+eternal+resting+on+Him%2C+yea%2C+above+imputed+righteousness%2C+assurance+of+pardon%2C+reconciliation%3B+as+the+King+is+more+than+his+bracelets+of+gold%2C+his+myrrh%2C+spikenard%2C+perfumes%2C+ointment%2C+kisses%3B+the+tree+more+desireable+then+a+fleece+of+apples+that+grows+on+it+for+the+fourth+part+of+a+year.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+82-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F421e5b9be5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/421e5b9be5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Yea%2C%20take%20the%20formal%20vision%20of,the%20fourth%20part%20of%20a%20year." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f89f699d1" data-kw="">
<blockquote><p>Position 2. The Scripture and all the ordinances are but created things and not the ultimate object of our faith and highest and compleatest love: that is reserved to God in Jesus Christ; yea, the most perfect [mere human] we read of, Paul a chosen vessel, stood in need of comfort from Titus, 2 Cor 7:5-6, and the saints at Rome, Rom. 1:11-12… then the most perfect are not above the Law, the Gospel and Ordinances, as Familists say… But that we may understand this the better, we are to remember that: 1. There is a a twofold happiness of the saints, one formal and another objective. 2. That there is a mediate seeing of God, one by ordinances and means; another immediate. 3. That there is a twofold will of God; one that is revealed in Scripture, or the Law of Nature, and that is the moral good that God approves and enjoins to us, rather than the will of God; this the Familists call ‘the exterior or accidental will of God,’ because God’s will, as his essence, should have been entire and self-sufficient, though God had never revealed any such will to men or angels, yea though He had never made the world or men, or angel. ‘There is another will-essential in God, which is not the thing willed, but the essential faculty of desiring or willing in God.’ Now to come nearer the point, the formal blessedness of the saints is in the act of seeing, knowing, loving, enjoying God, which on our part are created things, and so empty nothings, and are not essentially the happiness of man, but means by the which we enjoy God our happiness, so the using of all the means and ordinances are not our happiness. It’s true, our Saviour says, It’s life eternal to know God and his Son Christ, Jn. 17. But He means it is the way and necessary means to happiness and life eternal. God in Christ, and in the in-comings and out-flowings of the Spirit of glory, or the blessed one God, in three persons, is the object and happiness of the saints, and therefore we are to prefer Christ Himself to all the kisses, visions, out-flowings of glory, and all our acts of seeing, loving, and enjoying of God; we may love ordinances, and prize highly, the vision of God, but God Himself, and Jesus Christ, we must not only prize, but be ravished, overcharged with Himself; as the Bridegroom is far more excellent than his bracelets, chains, rings. In this sense I would in my heart and esteem make away all ordinances, yea, all the honey-combs, all the apples, all the created roses that grow on Christ, all the sweet results and out-flowings of glory, yea, whole created heaven for Christ; Christ-God Himself; the bulk, the body, the stalk of the Tree of Life, is infinitely to be valued above an apple; yea all the created apples and sweet blossoms and soul-delighting flowers that grow on the tree. Now here on earth we are happy as ‘heirs,’ not as ‘lords and possessors, and in an union with the exterior, and revealed will of God,’ in believing, fearing, serving God, in Christ, in a practical union with God, but all this is but the way to the well, not the well itself, and the union with, or vision of God is mediate, far off, in a mirror, in the image, form, characters, elements, or looking-glass of Word, sacraments, ministry, ordinances, of hearing, praying, praising, but in heaven we see God face to face, that is without means, or the intervention of messengers, or ordinances. I cannot determine whether, when we shall know and see the Lord in an immediate vision of glory, our understanding shall receive created forms, intellectual species, images, characters of the lovely essence, the white, ruddy, pleasant, lovely countenance of that desirable Prince, the Lord Jesus; it’s a nicety not for our edification; sure Christ shall infuse and pour in into every vessel of glory so much of Himself, his presence, lovliness, image, beauty, as from bottom to brim, the soul shall be full, and who knows what the eternal milkings, the everlasting intellectual suckings of the glorified ones are, by which they draw in and drink from the honeycomb of uncreated glory, and the deep, deep fountain and river of endless life, the streams of joy, consolation, love, fruition of Jehovah, the soul being the channel, whose banks are eternally green with glory? what are the emanations, the out-flowings of blessedness from the pure essence and bright face of Him that sits on the throne? and what can these in-commings and the eternal flowings of the tide of that sea of matchless felicity be? who knows? ‘Come up and see,’ can best resolve; come up and drink, be drunk and giddy, and satiated with glory and move no curious question of that fruition of God. Christ will solve all these doubts to the quieting of your mind when ye come up thither. Nor is it needful to say that there is a vision of God in this life, which is heaven, and all the heaven we shall ever have, and this vision is without receiving any images, forms, characters of God, because it is purely spiritual and abstracted from all acts of imagination, and in it we are mere patients, not agents, God pouring the immediate brightness of his own essence in us: truely, this is to be wise above what is written and I crave leave to doubt, if Familists have the images and species of this opinion from the Spirit of God. For that spirit is a Spirit of sobriety and the most spiritual and ecstatical visions that the prophets, the men of God were taken up with; in them all, to me, there seems to be visions of forms, images, characters, a throne, angels with six wings, smoke, a woman clothed with the sun, etc… but a vision of God immediate in this life, and that ordinary, without forms, images, without Word, sacraments, ordinances, I know not, I understand it not. … Position 4. There is a twofold fulness of loveliness in Christ; one attainable in this life, the other reserved for the life to come. The full and highest pitch of the drawing loveliness of Christ, I think excludes all ordinances, Scripture, sacraments, and means we now use. Because old monks and late Familists make no heaven but in this life only (as if a monks’ coul were the very crown of eternal glory) and say the Resurrection is past; as their fathers Hymeneus and Phyletus said, and doubt of the immortality of the soul; therefore they, that they may be true to their own principles, must say that there be a number of perfect men that are above and higher than Law, duties, ordinances, teaching of men, ministry, because these are for the unperfect and unregenerate (and the monks and Familists are not such, but do already enjoy God in a fruition of glory). But the Scripture says that means, ordinances, are ever in use in this life and only excluded from the life to come, 1 Cor. 13:8… 2. The life to come is holden forth, Rev. 21:22, to want all ordinances… 2. The body of Christ is low of stature, capable of growing, the bride’s hair grows, she is not of a perfect •all stature, but like a yong girl, not yet fit for marriage to the Lamb, till we meet all in the unity of Faith: So I know no active anihilation, no evanishing of and ceasing from all acts of the will of God revealed in the law and Gospel; that is, from praying, hearing, meditating, loving, desiring, longing after Christ, till the day that the shadows flee away; Then I confess I shall have no leisure to read on the book of the Old and New Testament, or to attend preaching, sacraments or other ordinances, because I need no mirror, no portrait of Christ, no message of ministers, when I see and enjoy Himself. … Position 5. There is a fulness of loveliness in Christ, that is begun in us, by possession and title in this life, but never perfect till the life to come, in which there be these: 1. union. 2. fruition. 3. rest. 4. satisfaction. 5. sense. 6. living and acting in Christ. 7. loving and solacing of the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, pp. 349-52</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

llectual suckings of the glorified ones are, by which they draw in and drink from the honeycomb of uncreated glory, and the deep, deep fountain and river of endless life, the streams of joy, consolation, love, fruition of Jehovah, the soul being the channel, whose banks are eternally green with glory? what are the emanations, the out-flowings of blessedness from the pure essence and bright face of Him that sits on the throne? and what can these in-commings and the eternal flowings of the tide of that sea of matchless felicity be? who knows? ‘Come up and see,’ can best resolve; come up and drink, be drunk and giddy, and satiated with glory and move no curious question of that fruition of God. Christ will solve all these doubts to the quieting of your mind when ye come up thither. Nor is it needful to say that there is a vision of God in this life, which is heaven, and all the heaven we shall ever have, and this vision is without receiving any images, forms, characters of God, because it is purely spiritual and abstracted from all acts of imagination, and in it we are mere patients, not agents, God pouring the immediate brightness of his own essence in us: truely, this is to be wise above what is written and I crave leave to doubt, if Familists have the images and species of this opinion from the Spirit of God. For that spirit is a Spirit of sobriety and the most spiritual and ecstatical visions that the prophets, the men of God were taken up with; in them all, to me, there seems to be visions of forms, images, characters, a throne, angels with six wings, smoke, a woman clothed with the sun, etc… but a vision of God immediate in this life, and that ordinary, without forms, images, without Word, sacraments, ordinances, I know not, I understand it not. … Position 4. There is a twofold fulness of loveliness in Christ; one attainable in this life, the other reserved for the life to come. The full and highest pitch of the drawing loveliness of Christ, I think excludes all ordinances, Scripture, sacraments, and means we now use. Because old monks and late Familists make no heaven but in this life only (as if a monks’ coul were the very crown of eternal glory) and say the Resurrection is past; as their fathers Hymeneus and Phyletus said, and doubt of the immortality of the soul; therefore they, that they may be true to their own principles, must say that there be a number of perfect men that are above and higher than Law, duties, ordinances, teaching of men, ministry, because these are for the unperfect and unregenerate (and the monks and Familists are not such, but do already enjoy God in a fruition of glory). But the Scripture says that means, ordinances, are ever in use in this life and only excluded from the life to come, 1 Cor. 13:8… 2. The life to come is holden forth, Rev. 21:22, to want all ordinances… 2. The body of Christ is low of stature, capable of growing, the bride’s hair grows, she is not of a perfect •all stature, but like a yong girl, not yet fit for marriage to the Lamb, till we meet all in the unity of Faith: So I know no active anihilation, no evanishing of and ceasing from all acts of the will of God revealed in the law and Gospel; that is, from praying, hearing, meditating, loving, desiring, longing after Christ, till the day that the shadows flee away; Then I confess I shall have no leisure to read on the book of the Old and New Testament, or to attend preaching, sacraments or other ordinances, because I need no mirror, no portrait of Christ, no message of ministers, when I see and enjoy Himself. … Position 5. There is a fulness of loveliness in Christ, that is begun in us, by possession and title in this life, but never perfect till the life to come, in which there be these: 1. union. 2. fruition. 3. rest. 4. satisfaction. 5. sense. 6. living and acting in Christ. 7. loving and solacing of the soul…”

and+his+Son+Christ%2C+Jn.+17.+But+He+means+it+is+the+way+and+necessary+means+to+happiness+and+life+eternal.+God+in+Christ%2C+and+in+the+in-comings+and+out-flowings+of+the+Spirit+of+glory%2C+or+the+blessed+one+God%2C+in+three+persons%2C+is+the+object+and+happiness+of+the+saints%2C+and+therefore+we+are+to+prefer+Christ+Himself+to+all+the+kisses%2C+visions%2C+out-flowings+of+glory%2C+and+all+our+acts+of+seeing%2C+loving%2C+and+enjoying+of+God%3B+we+may+love+ordinances%2C+and+prize+highly%2C+the+vision+of+God%2C+but+God+Himself%2C+and+Jesus+Christ%2C+we+must+not+only+prize%2C+but+be+ravished%2C+overcharged+with+Himself%3B+as+the+Bridegroom+is+far+more+excellent+than+his+bracelets%2C+chains%2C+rings.+In+this+sense+I+would+in+my+heart+and+esteem+make+away+all+ordinances%2C+yea%2C+all+the+honey-combs%2C+all+the+apples%2C+all+the+created+roses+that+grow+on+Christ%2C+all+the+sweet+results+and+out-flowings+of+glory%2C+yea%2C+whole+created+heaven+for+Christ%3B+Christ-God+Himself%3B+the+bulk%2C+the+body%2C+the+stalk+of+the+Tree+of+Life%2C+is+infinitely+to+be+valued+above+an+apple%3B+yea+all+the+created+apples+and+sweet+blossoms+and+soul-delighting+flowers+that+grow+on+the+tree.+Now+here+on+earth+we+are+happy+as+%E2%80%98heirs%2C%E2%80%99+not+as+%E2%80%98lords+and+possessors%2C+and+in+an+union+with+the+exterior%2C+and+revealed+will+of+God%2C%E2%80%99+in+believing%2C+fearing%2C+serving+God%2C+in+Christ%2C+in+a+practical+union+with+God%2C+but+all+this+is+but+the+way+to+the+well%2C+not+the+well+itself%2C+and+the+union+with%2C+or+vision+of+God+is+mediate%2C+far+off%2C+in+a+mirror%2C+in+the+image%2C+form%2C+characters%2C+elements%2C+or+looking-glass+of+Word%2C+sacraments%2C+ministry%2C+ordinances%2C+of+hearing%2C+praying%2C+praising%2C+but+in+heaven+we+see+God+face+to+face%2C+that+is+without+means%2C+or+the+intervention+of+messengers%2C+or+ordinances.+I+cannot+determine+whether%2C+when+we+shall+know+and+see+the+Lord+in+an+immediate+vision+of+glory%2C+our+understanding+shall+receive+created+forms%2C+intellectual+species%2C+images%2C+characters+of+the+lovely+essence%2C+the+white%2C+ruddy%2C+pleasant%2C+lovely+countenance+of+that+desirable+Prince%2C+the+Lord+Jesus%3B+it%E2%80%99s+a+nicety+not+for+our+edification%3B+sure+Christ+shall+infuse+and+pour+in+into+every+vessel+of+glory+so+much+of+Himself%2C+his+presence%2C+lovliness%2C+image%2C+beauty%2C+as+from+bottom+to+brim%2C+the+soul+shall+be+full%2C+and+who+knows+what+the+eternal+milkings%2C+the+everlasting+intellectual+suckings+of+the+glorified+ones+are%2C+by+which+they+draw+in+and+drink+from+the+honeycomb+of+uncreated+glory%2C+and+the+deep%2C+deep+fountain+and+river+of+endless+life%2C+the+streams+of+joy%2C+consolation%2C+love%2C+fruition+of+Jehovah%2C+the+soul+being+the+channel%2C+whose+banks+are+eternally+green+with+glory%3F+what+are+the+emanations%2C+the+out-flowings+of+blessedness+from+the+pure+essence+and+bright+face+of+Him+that+sits+on+the+throne%3F+and+what+can+these+in-commings+and+the+eternal+flowings+of+the+tide+of+that+sea+of+matchless+felicity+be%3F+who+knows%3F+%E2%80%98Come+up+and+see%2C%E2%80%99+can+best+resolve%3B+come+up+and+drink%2C+be+drunk+and+giddy%2C+and+satiated+with+glory+and+move+no+curious+question+of+that+fruition+of+God.+Christ+will+solve+all+these+doubts+to+the+quieting+of+your+mind+when+ye+come+up+thither.+Nor+is+it+needful+to+say+that+there+is+a+vision+of+God+in+this+life%2C+which+is+heaven%2C+and+all+the+heaven+we+shall+ever+have%2C+and+this+vision+is+without+receiving+any+images%2C+forms%2C+characters+of+God%2C+because+it+is+purely+spiritual+and+abstracted+from+all+acts+of+imagination%2C+and+in+it+we+are+mere+patients%2C+not+agents%2C+God+pouring+the+immediate+brightness+of+his+own+essence+in+us%3A+truely%2C+this+is+to+be+wise+above+what+is+written+and+I+crave+leave+to+doubt%2C+if+Familists+have+the+images+and+species+of+this+opinion+from+the+Spirit+of+God.+For+that+spirit+is+a+Spirit+of+sobriety+and+the+most+spiritual+and+ecstatical+visions+that+the+prophets%2C+the+men+of+God+were+taken+up+with%3B+in+them+all%2C+to+me%2C+there+seems+to+be+visions+of+forms%2C+images%2C+characters%2C+a+throne%2C+angels+with+six+wings%2C+smoke%2C+a+woman+clothed+with+the+sun%2C+etc%E2%80%A6+but+a+vision+of+God+immediate+in+this+life%2C+and+that+ordinary%2C+without+forms%2C+images%2C+without+Word%2C+sacraments%2C+ordinances%2C+I+know+not%2C+I+understand+it+not.+%E2%80%A6+Position+4.+There+is+a+twofold+fulness+of+loveliness+in+Christ%3B+one+attainable+in+this+life%2C+the+other+reserved+for+the+life+to+come.+The+full+and+highest+pitch+of+the+drawing+loveliness+of+Christ%2C+I+think+excludes+all+ordinances%2C+Scripture%2C+sacraments%2C+and+means+we+now+use.+Because+old+monks+and+late+Familists+make+no+heaven+but+in+this+life+only+%28as+if+a+monks%E2%80%99+coul+were+the+very+crown+of+eternal+glory%29+and+say+the+Resurrection+is+past%3B+as+their+fathers+Hymeneus+and+Phyletus+said%2C+and+doubt+of+the+immortality+of+the+soul%3B+therefore+they%2C+that+they+may+be+true+to+their+own+principles%2C+must+say+that+there+be+a+number+of+perfect+men+that+are+above+and+higher+than+Law%2C+duties%2C+ordinances%2C+teaching+of+men%2C+ministry%2C+because+these+are+for+the+unperfect+and+unregenerate+%28and+the+monks+and+Familists+are+not+such%2C+but+do+already+enjoy+God+in+a+fruition+of+glory%29.+But+the+Scripture+says+that+means%2C+ordinances%2C+are+ever+in+use+in+this+life+and+only+excluded+from+the+life+to+come%2C+1+Cor.+13%3A8%E2%80%A6+2.+The+life+to+come+is+holden+forth%2C+Rev.+21%3A22%2C+to+want+all+ordinances%E2%80%A6+2.+The+body+of+Christ+is+low+of+stature%2C+capable+of+growing%2C+the+bride%E2%80%99s+hair+grows%2C+she+is+not+of+a+perfect+%E2%80%A2all+stature%2C+but+like+a+yong+girl%2C+not+yet+fit+for+marriage+to+the+Lamb%2C+till+we+meet+all+in+the+unity+of+Faith%3A+So+I+know+no+active+anihilation%2C+no+evanishing+of+and+ceasing+from+all+acts+of+the+will+of+God+revealed+in+the+law+and+Gospel%3B+that+is%2C+from+praying%2C+hearing%2C+meditating%2C+loving%2C+desiring%2C+longing+after+Christ%2C+till+the+day+that+the+shadows+flee+away%3B+Then+I+confess+I+shall+have+no+leisure+to+read+on+the+book+of+the+Old+and+New+Testament%2C+or+to+attend+preaching%2C+sacraments+or+other+ordinances%2C+because+I+need+no+mirror%2C+no+portrait+of+Christ%2C+no+message+of+ministers%2C+when+I+see+and+enjoy+Himself.+%E2%80%A6+Position+5.+There+is+a+fulness+of+loveliness+in+Christ%2C+that+is+begun+in+us%2C+by+possession+and+title+in+this+life%2C+but+never+perfect+till+the+life+to+come%2C+in+which+there+be+these%3A+1.+union.+2.+fruition.+3.+rest.+4.+satisfaction.+5.+sense.+6.+living+and+acting+in+Christ.+7.+loving+and+solacing+of+the+soul%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+349-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f89f699d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5f89f699d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Position%202.%20The%20Scripture%20and%20all,loving%20and%20solacing%20of%20the%20soul%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

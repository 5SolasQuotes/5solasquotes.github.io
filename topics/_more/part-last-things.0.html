<blockquote><p>38. Can we say very much about heaven and the blessings of heaven? No, for this far surpasses our understanding. We know only: … b) The enjoyment of heaven is in the first place the enjoyment of God, the visio Dei, a ‘beholding of God.’ This is not to be understood one-sidedly in an intellectualistic manner but in all its magnitude. The nearness of God will affect every capacity of man, and every capacity will react to it. Theologians usually speak of visio [seeing], amor [love], gaudium [joy], gloria [glory]; others of knowing, serving, enjoying and glorifying God (cf. 1 Cor. 13:9-13). It has been asked whether this will be a seeing with physical eyes. This is not to be assumed. God is not visible to the senses. The Mediator certainly is. No one has ever seen God. This seeing follows on faith. It is thus something that is comparable with faith but that still does not necessarily need to be a perceiving with the senses. There will thus be a perception of God, yet such that it is not a material entity that appears to us. c) The enjoyment of heaven in fellowship with God is eternal life in all its fullness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. Richard B. Gaffin 1 vol. ed. (Lexham Press, 2020), Ecclesiology, the Means of Grace, Eschatology, pt. 3, Eschatology, ch. 7, ‘General Eschatology’, pp. 1153-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-088949c4d2" data-kw="">
<blockquote><p>If it be man’s chief end to glorify God and enjoy Him for ever, then man has attained his end, the sole purpose for which he was made, the entire object for which he exists, when he enters into communion with God, abides in His presence, streaming out to Him in all the emotions, I do not say appropriate to a creature in the presence of his Maker and Lord, apprehended by him as the Good Lord and Righteous Ruler of the souls of men, but appropriate to the sinner who has been redeemed by the blood of God’s own Son and is inhabited by His Spirit and apprehends his Maker as also his Saviour, his Governor as also his Lover, and knows the supreme joy of him that was lost and is found, was dead and is alive again,—and all, through the glory of God’s seeking and saving love. He who attains to this experience has attained all that is to be attained. He is absorbed in the beatific vision. He that sees God shall be like Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith &amp; Life</cite>, (1916), “Prayer as a Practice”, p. 439</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>II. The end of God’s appointing this day is for the manifestation of the glory of his mercy in the eternal salvation of the elect… For then shall the righteous go into everlasting life, and receive that fulness of joy and refreshing which shall come from the presence of the Lord;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, Faith 1646, Ch. 33, ‘Of the Last Judgment’</span></figcaption>

<blockquote><p>Uniquely among the thirteenth-century Scholastic theologians, Henry of Ghent (c.1217–1293) gives an account of beatific union with God according to which it consists not simply in God’s being the object of a creature’s acts of cognition and/or volition, but in God’s fully interpenetrating the creature in such a way that the creature becomes in some sense identical with God. This article places Henry’s view in its immediate theological context, and outlines the two most important immediate reactions to it – including its influence, hitherto unnoticed, on Meister Eckhart’s account of mystical union. In so doing, it highlights a continuity between Scholastic and non-Scholastic theology in the Middle Ages.</p></blockquote>

</figure><figure class="quote" id="q-7879f4cc76" data-kw="">
<blockquote><p>The most studied source for Gerald Odonis’ doctrine of the beatiﬁc vision is the text of his Advent 1333 disputed question known as his Quodlibet. The polemic nature of the question and its structural idiosyncrasies have led to diﬃculties in interpreting Odonis’ theory of the ‘middle vision’ of the divine essence that the separate souls of the blessed have, as well as in understanding his defense of Pope John XXII’s controversial opinion [that saints do not enjoy the complete Beatific Vision till after the Final Judgment] (which excludes such a middle vision). By relating Odonis’ 1333 disputation to his earlier commentary on the Sentences… this paper shows how Odonis tried to ﬁt his doctrine of the ‘middle vision’ with his previous discussion…</p></blockquote>

<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>

</figure><figure class="quote" id="q-b7b47d7be1" data-kw="">
<blockquote><p>John Calvin structured his soteriology and doctrine of atonement around the patristic principle of graced exchange, the idea that Christ became what we are in order to make us what He is. In them, Christ’s descent to hell and the believer’s ascent to God represent the two furthest poles of the exchange. Descent to hell and ascent to God both involve vision of God. Calvin explains descent to hell as the terror sinners experience in their souls when they sense God’s wrath and judgment. In the passion and crucifixion, Christ arraigned Himself before God’s tribunal as our surety to make satisfaction. Standing in the place of the accused, He saw God as an angry judge prepared to punish sin. As a real human being with the affections and infirmities common to human nature, Christ could not help but experience terror in his soul and even fear for his own salvation. Christ willingly underwent this ordeal to prove his obedience, demonstrate his love for humanity, and secure a more lavish redemption than otherwise possible. Christ emerged from the ordeal victorious, and the Father accepted his obedience as satisfaction for our sin. As a result, the redeemed are adopted as sons who will ascend to God and see Him face-to-face as a propitious Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/carl-mosser.html">Carl Mosser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Graced Exchange &amp; Vision of God in Calvin’s Atonement Theology’ in Reformed Theological Review</cite>, vol. 82, no. 1 (April 2023), pp. 48-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“John Calvin structured his soteriology and doctrine of atonement around the patristic principle of graced exchange, the idea that Christ became what we are in order to make us what He is. In them, Christ’s descent to hell and the believer’s ascent to God represent the two furthest poles of the exchange. Descent to hell and ascent to God both involve vision of God. Calvin explains descent to hell as the terror sinners experience in their souls when they sense God’s wrath and judgment. In the passion and crucifixion, Christ arraigned Himself before God’s tribunal as our surety to make satisfaction. Standing in the place of the accused, He saw God as an angry judge prepared to punish sin. As a real human being with the affections and infirmities common to human nature, Christ could not help but experience terror in his soul and even fear for his own salvation. Christ willingly underwent this ordeal to prove his obedience, demonstrate his love for humanity, and secure a more lavish redemption than otherwise possible. Christ emerged from the ordeal victorious, and the Father accepted his obedience as satisfaction for our sin. As a result, the redeemed are adopted as sons who will ascend to God and see Him face-to-face as a propitious Father.”

— Carl Mosser, ‘Graced Exchange &amp; Vision of God in Calvin’s Atonement Theology’ in Reformed Theological Review, vol. 82, no. 1 (April 2023), pp. 48-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJohn+Calvin+structured+his+soteriology+and+doctrine+of+atonement+around+the+patristic+principle+of+graced+exchange%2C+the+idea+that+Christ+became+what+we+are+in+order+to+make+us+what+He+is.+In+them%2C+Christ%E2%80%99s+descent+to+hell+and+the+believer%E2%80%99s+ascent+to+God+represent+the+two+furthest+poles+of+the+exchange.+Descent+to+hell+and+ascent+to+God+both+involve+vision+of+God.+Calvin+explains+descent+to+hell+as+the+terror+sinners+experience+in+their+souls+when+they+sense+God%E2%80%99s+wrath+and+judgment.+In+the+passion+and+crucifixion%2C+Christ+arraigned+Himself+before+God%E2%80%99s+tribunal+as+our+surety+to+make+satisfaction.+Standing+in+the+place+of+the+accused%2C+He+saw+God+as+an+angry+judge+prepared+to+punish+sin.+As+a+real+human+being+with+the+affections+and+infirmities+common+to+human+nature%2C+Christ+could+not+help+but+experience+terror+in+his+soul+and+even+fear+for+his+own+salvation.+Christ+willingly+underwent+this+ordeal+to+prove+his+obedience%2C+demonstrate+his+love+for+humanity%2C+and+secure+a+more+lavish+redemption+than+otherwise+possible.+Christ+emerged+from+the+ordeal+victorious%2C+and+the+Father+accepted+his+obedience+as+satisfaction+for+our+sin.+As+a+result%2C+the+redeemed+are+adopted+as+sons+who+will+ascend+to+God+and+see+Him+face-to-face+as+a+propitious+Father.%E2%80%9D%0A%0A%E2%80%94+Carl+Mosser%2C+%E2%80%98Graced+Exchange+%26+Vision+of+God+in+Calvin%E2%80%99s+Atonement+Theology%E2%80%99+in+Reformed+Theological+Review%2C+vol.+82%2C+no.+1+%28April+2023%29%2C+pp.+48-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7b47d7be1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b7b47d7be1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on- </figure><figure class="quote" id="q-2114a44213" data-kw="">
<blockquote><p>However, it is not agreed between the Scholastic Doctors and at least some of our theologians, as is evident from what has been said, whether the soul of our Lord Jesus Christ, while he was still on earth, before death already enjoyed that highest blessedness which it now enjoys in Heaven; and thus whether Christ could then be said to be simultaneously a wayfarer and a comprehender (which the Roman School teaches by common consent). But some of our theologians deny this, while others affirm it, most being silent and saying or establishing nothing about it. Furthermore, from that matter another dispute arises, whether Christ had faith and hope properly so called, which the Roman School denies, as has been shown before. But those of our theologians who deny that Christ’s soul was always perfectly blessed affirm it. Concerning faith, however, there seems to be a λογομαχία [logomachy, or dispute about words]… Moreover, from what has been said it appears that our theologians, either all or most, differ from the Roman School in this, that they think that all fullness of grace was not poured out upon Christ’s soul at once and simultaneously as soon as he was conceived in the Virgin’s womb, but that Christ made progress in grace with time, not only as to acts, but also as to habits; whereas on the contrary the Roman School holds that the gifts of the Spirit were conferred upon Christ in such abundance in his very first conception, that afterwards there was no place at all for increase, but whatever gifts and grace Christ now possesses in his soul, he always had even in his mother’s womb in the same measure and degree. But the principal dispute is about the knowledge of Christ’s soul, which indeed all agree now knows all things in heaven of which knowledge can fall to any creature, but they do not agree whether he always knew all things and never learned anything which he truly did not know before. And the Pontificals indeed by common consent hold that the soul of our Lord Jesus Christ was so filled with knowledge from its very creation, that it afterwards learned nothing which it did not know before, and that Christ never labored under any privative and properly so called ignorance, but through some created knowledge always knew all things which he now knows, and which it is possible for a creature to know. On the contrary, however, most of our theologians assert that it can be truly and properly said that Christ, insofar as he is man, was sometimes ignorant of something, and that his knowledge began to have various increases with age, and thus that he knows some things in heaven which he did not know when he was not yet glorified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, 3. ‘Knowledge of Christ’s soul, and his grace and blessedness’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 2. Controversies on Christ’s Person &amp; Office, pp. 974-82 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

tion%2C+that+afterwards+there+was+no+place+at+all+for+increase%2C+but+whatever+gifts+and+grace+Christ+now+possesses+in+his+soul%2C+he+always+had+even+in+his+mother%E2%80%99s+womb+in+the+same+measure+and+degree.+But+the+principal+dispute+is+about+the+knowledge+of+Christ%E2%80%99s+soul%2C+which+indeed+all+agree+now+knows+all+things+in+heaven+of+which+knowledge+can+fall+to+any+creature%2C+but+they+do+not+agree+whether+he+always+knew+all+things+and+never+learned+anything+which+he+truly+did+not+know+before.+And+the+Pontificals+indeed+by+common+consent+hold+that+the+soul+of+our+Lord+Jesus+Christ+was+so+filled+with+knowledge+from+its+very+creation%2C+that+it+afterwards+learned+nothing+which+it+did+not+know+before%2C+and+that+Christ+never+labored+under+any+privative+and+properly+so+called+ignorance%2C+but+through+some+created+knowledge+always+knew+all+things+which+he+now+knows%2C+and+which+it+is+possible+for+a+creature+to+know.+On+the+contrary%2C+however%2C+most+of+our+theologians+assert+that+it+can+be+truly+and+properly+said+that+Christ%2C+insofar+as+he+is+man%2C+was+sometimes+ignorant+of+something%2C+and+that+his+knowledge+began+to+have+various+increases+with+age%2C+and+thus+that+he+knows+some+things+in+heaven+which+he+did+not+know+when+he+was+not+yet+glorified.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+Published+at+Various+Times%2C+3.+%E2%80%98Knowledge+of+Christ%E2%80%99s+soul%2C+and+his+grace+and+blessedness%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+Posthumous+Works%2C+2.+Controversies+on+Christ%E2%80%99s+Person+%26+Office%2C+pp.+974-82+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2114a44213.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2114a44213.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=However%2C%20it%20is%20not%20agreed%20between,when%20he%20was%20not%20yet%20glorified&amp;text=However%2C%20it%20is%20not%20agreed%20between%20the%20Scholastic&amp;text=not%20know%20when%20he%20was%20not%20yet%20glorified" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>

oksonline.com/on-the-beatific-vision/#:~:text=In%20fact%20we%20assert%20from%20Scripture,in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9&amp;text=In%20fact%20we%20assert%20from%20Scripture%20that%20the&amp;text=be%20seen%20in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e51aa60dd1" data-kw="">
<blockquote><p>It is a question: An sancti fruantur beatitudine ante ultimum judicium? [Whether the saints enjoy blessedness before the Last Judgment?] It was a current opinion among most of the Fathers, if not all that the souls of men after their death do not go immediately to heaven, but are in a receptacle or mansion-place till the day of Judgement, and some of late have followed it, especially the Anabaptists. The souls immediately departed have not the compleat fullness of that happiness which they shall have, yet they are not excluded from the enjoying of God, Lk. 23:43; 2 Cor. 5:1; Phil. 1:23. Some say there is a difference of those that are raised again, as Lazarus and some others; for it is likely (say they) that their souls went not into heaven, but were detained by God, who would unite them again to show forth his glory. The accidental joy of the saints (say the [Medieval] Schoolmen) shall be greater, both extensively, because it shall be in soul and body, and intensively, because the soul shall rejoyce to see the body glorified. 2. The essential glory shall increase extensively, because it shall redound unto the body. The souls of the godly immediately after their departure hence from the body are said to be in rest, Heb. 4:11 in consolation, Lk. 16:25, in security, Jn. 11:15,18, therefore they presently go to heaven, to God and Christ. Consider the names given to the state of glory: it is called Life, ‘These shall enter into life’; Rest, find rest, go to rest; our home, our Fathers’ house; a purchased and glorious inheritance; A Kingdom, the Kingdom of heaven; Joy, our Master’s joy, everlasting joy; Glory, weight of glory, eternal weight of glory; The City of our God. The Scripture calls it Paradise, a place of all delight and pleasure, alluding to that Paradise planted by God’s own hand, to make it a delight for the innocent state of man, and Abrahams bosom, wherein the Saints receive refreshing, which is a borrowed speech taken from fathers carrying and cherishing their little one, in their bosome, so the elect are cherished in the bosom of the father of all the faithful. There is perfection, perpetuity, immutability, there is Foelix securitas, secura foelicitas. Bernard.</p></blockquote>

<blockquote><p>1. There are continual operations of God in Christ in the souls of them that are glorified, and communications from Him unto them. For all creatures must eternally live, even in heaven, in dependence on Him who is the eternal fountain of being, life, goodness, and blessedness unto all. As we cannot subsist one moment in our beings, lives, souls, bodies, the inward or outward man, without the continual actings of divine power in us, and towards us; so in the glorified state our all shall depend eternally on divine power and goodness, communicating themselves unto us, for all the ends of our blessed subsistence in heaven.

2. What is the way and manner of these communications, we cannot comprehend. We cannot, indeed, fully understand the nature and way of his spiritual communications unto us in this life. We know these things by their signs, their outward means, and principally by the effects they produce in the real change of our natures; but in themselves we see but little of them. “The wind bloweth where it listeth, and we hear the sound thereof, but we know not whence it cometh, and whither it goeth; so is every one that is bom of the Spirit,” John 3:8. All God’s real operations in heaven and earth are incomprehensible, as being acts of infinite power; and we cannot search them out unto perfection.

3. All communications from the Divine Being and infinite fulness in heaven unto glorified saints, are in and through Christ Jesus, who shall forever be the medium of communication between God and the church, even in glory. All things being gathered into one head in him, even things in heaven, and things in earth— that head being in immediate dependence on God—this order shall never be dissolved, Eph. 1:10-11; 1 Cor. 3:[22-]23. And on these communications from God through Christ depends entirely our continuance in a state of blessedness and glory. We shall no more be self-subsistent in glory than we are in nature or grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ</cite>, ch. 14, ‘Other Differences…’ in Works, vol. 1, pp. 413-4</span></figcaption>

<blockquote><p>Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.”

— Johannes Maccovius, Other citations (work not named), in Johannes Hoornbeek, ch. 13, §§19-20 of Institutes of Theology, tr. Charles Johnson">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDoes+it+belong+to+the+perfection+of+the+soul+that+we+comprehend+God%E2%80%99s+essence%3F+Response%3A+certainly+this+does+not+appear+to+be+the+case%2C+and+the+reason+is+that+what+is+incomprehensible+cannot+be+comprehended.+But%2C+they+say%2C+even+if+what+is+infinite+cannot+be+comprehended+distinctly%2C+nevertheless%2C+it+can+be+comprehended+confusedly%2C+and+they+called+this+%E2%80%98comprehension.%E2%80%99+Thus%2C+that+famous+phrase%3A+%E2%80%98All+God+is+known%2C+but+not+totally.%E2%80%99+%5Btotum+sed+non+totaliter%3B+this+phrase+summarizes+Thomas%2C+Summa%2C+pt.+1%2C+q.+12%2C+art.+7%2C+replies+to+objections+2-3%5D+And+they+bring+up+the+example+of+an+eye%2C+which+contemplates+the+whole+man%3B+namely%2C+confusedly%2C+but+not+totally.+Response%3A+There+is+no+comparison+between+things+which+come+within+reach+of+eyesight+and+the+divine+nature%E2%80%A6+the+divine+nature+is+most+simple%3B+certainly+the+soul+cannot+confusedly+comprehend+those+things+which+are+most+simple%2C+let+alone+the+senses%2C+unless+it+comprehends+them+in+another+way+than+by+essence%3B+that+is%2C+by+laying+hold+of+their+very+essence.+And+thus%2C+if+God+is+known+by+us+by+essence%2C+it+is+necessary+for+him+to+be+known+by+us+distinctly%3B+and+if+he+is+known+by+us+distinctly%2C+he+is+indeed+comprehended%2C+which+those+who+state+that+God+will+be+seen+by+essence+in+the+life+to+come+do+not+wish+to+concede.+the+axiom+common+in+the+schools%2C+%E2%80%9CAll+that+is+received+is+received+according+to+the+manner+of+the+recipient.%E2%80%9D+Now%2C+if+God%E2%80%99s+essence+will+be+seen%2C+it+will+be+seen+in+a+finite+way%2C+for+the+recipient+is+finite%3A+and+thus%2C+the+infinite+will+be+seen+by+essence+in+a+finite+way%2C+which+implies+a+contradiction.+For+finite+knowledge+is+an+image+of+a+thing+in+the+mind%2C+and+thus%2C+if+knowledge+is+finite%2C+but+the+thing+comprehended+is+infinite%2C+on+the+other+hand%2C+it+follows+that+the+thing+is+known+and+not+known.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Other+citations+%28work+not+named%29%2C+in+Johannes+Hoornbeek%2C+ch.+13%2C+%C2%A7%C2%A719-20+of+Institutes+of+Theology%2C+tr.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F971cc0d92f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/971cc0d92f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Does%20it%20belong%20to%20the%20perfection,thing%20is%20known%20and%20not%20known&amp;text=Does%20it%20belong%20to%20the%20perfection%20of%20the&amp;text=that%20the%20thing%20is%20known%20and%20not%20known" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. In the first operation of this light of glory, believers shall so behold the glory of Christ, and the glory of God in Him, as that therewith and thereby they shall be immediately and universally changed into his likeness. They shall be as He is, when they shall see Him as He is. There is no growth in glory, as to parts— there may be as to degrees. Additions may be outwardly made unto what is at first received as by the resurrection of the body; but the internal light of glory and its transforming efficacy is capable of no degrees, though new revelations may be made unto it unto eternity. For the infinite fountain of life and light, and goodness, can never be fathomed, much less exhausted. And what God spake on the entrance of sin, by the way of contempt and reproach, ‘Behold, the man is become like one of us!’ upbraiding him with what he had foolishly designed—on the accomplishment of the work of his grace, He says in love and infinite goodness, “Man is become like one of us, in the perfect restoration of our image in him.’ This is the first effect of the light of glory. … 4. …For, as it is expressly assigned thereunto in the Scripture, so whereas it contains the perfect operation of our minds and souls in a perfect state, on the most perfect object, it is the only mea.ns of our blessedness. And this is the true cause whence there neither is nor can be any satiety or weariness in heaven, in the eternal contemplation of the same glory. For not only the object of our sight is absolutely infinite, which can never be searched unto the bottom, yea, is perpetually new unto a finite understanding; but our subjective blessedness consisting in continual fresh communications from the infinite fulness of the divine nature, derived unto us through vision, is always new, and always will be so to eternity. Herein shall all the saints of God drink of the rivers of pleasure that are at his right hand, be satisfied with his likeness, and refresh themselves in the eternal springs of life, light, and joy for evermore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ</cite>, ch. 14, ‘Other Differences…’ in Works, vol. 1, pp. 412-14</span></figcaption>

<blockquote><p>…Aquinas’s conception of the resurrection… holds that the soul of a person persists between death and resurrection, so that there is continuity between the person who died and the later person whose body is indistinguishable from that of the person who died. If Socrates is ressurected, he will be Socrates and not a mere replica because the same one soul, which had informed the matter of Socrates’ body before he died, comes to inform that matter again… Another thing philoophy can tell us is that if a resurrection were to occur, only God could bring it about. That, in any event, was Aquinas’s view (Cf. Summa Theologiae, Supplement, 75.3). Natural material causes can no more reunite soul and body than they could generate a soul in the first place. Nor could even an angelic intellect reunite a soul and its body, since angels can only manipulate natural causes, even if they can do so more powerfully than we can (Cf. Summa Theologiae I.65.3-4 and I.105.1).</p></blockquote>

</figure><figure class="quote" id="q-8ffa30f4c7" data-kw="">
<blockquote><p>But the soul is not a complete substance in its own right. Though it can to some extent operate independently of the body, that is not its natural state, and only if the body is restored to it will the complete human person be restored. Nor can resurrection be an alternative to the soul’s immortality. For suppose a body that is physically indistinguishable from Socrates’ body were suddenly to appear. Should we say that Socrates has been resurrected? Or should we say instead that a perfect replica of Socrates has come into being? Recall from chapter 10 that Antony Flew raises this problem for the view that reconstituting a person’s body suffices to ensure that the person survives death. And recall that Aquinas’s conception of the resurrection is not open to this objection, because it hold that the soul of a person persists between death and resurrection, so that there is continuity between the person who died and the later person whose body is indistinguishable from that of the person who died. If Socrates is ressurected, he will be Socrates and not a mere replica because the same one soul, which had informed the matter of Socrates’ body before he died, comes to inform that matter again.</p></blockquote>

<blockquote><p>…in what sense a man may be said to be judged by his works at the latter day, in the same sense, and that sense only, he [James] intends this his justification by works, and in no other; for all judging and passing of sentence must have either a justification or a condemnation as the sentence of it in the close. So as there is no more danger to say, a man at the latter day shall be justified by his works, as evidences of his state and faith, than to say he shall be judged according thereto… And in relation to this outward judgment at the latter day, our sentence of salvation is termed expressly a justification; and this very thing is asserted by Christ Himself: Mt. 12:36-37, ‘…for by thy words thou shalt be justified, and by thy words thou shalt be condemned.’ Neither is it anywhere said that God will judge men according to their faith only; nor will it be a sufficient plea at the latter day to say, ‘Lord, thou knowest I believed, and cast myself at thy grace.’ God will say, ‘I am to judge thee so as every one shall be able to judge my sentence righteous together with Me: 1 Cor. 4:5, ‘Therefore, show me thy faith by thy works;&#x27;</p></blockquote>

<blockquote><p>The believers have not a full discharge till then: we are in this life continually subject to new sins, and so to new guilt, whereby arise new fears, so that the soul has not a full rest from all till that final absolution be pronounced at the Day of Judgment… the Scripture do also call the Day of Judgment a time when sins shall be blotted out, because then is the public absolution of the godly, and according to philosophy, motions receive their names from the term to which they tend… Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way, as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith, but this way shall then cease; for having perfect righteousness inherent in ourselves, we shall need no covering… This seems to be undoubted, that the way of justification by faith in Christ, arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae, a justification of us in our way, not when we come to our home. Fourthly, although pardon of sin be completed at that great day, yet this is not to be understood, as if God’s pardon of any sin were imperfect, and something of sin did still remain to be done away… But because we commit new sins daily, and so need pardon daily, Therefore it is that we are not completely pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publicly be declared to all the world. … Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished, and not so much as any scars remain, the wound will be so fully healed… Thirdly, then and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be.</p></blockquote>

ected.+Because+all+the+effects+of+pardon+will+then+be+accomplished%2C+and+not+so+much+as+any+scars+remain%2C+the+wound+will+be+so+fully+healed%E2%80%A6+Thirdly%2C+then+and+not+till+then+may+we+say+remission+of+sins+will+be+completed%2C+because+then+shall+no+more+iteration+of+pardon+be.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Other+citations+%28work+not+named%29%2C+Lecture+29+on+Acts+3%3A19+in+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+%E2%80%A6+%28London%2C+1651%29%2C+pp.+254-63%2C+pp.+256-60&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9268bd4411.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9268bd4411.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-justification-of-believers-at-the-final-judgment/#:~:text=The%20believers%20have%20not%20a%20full,no%20more%20iteration%20of%20pardon%20be&amp;text=The%20believers%20have%20not%20a%20full%20discharge%20till&amp;text=then%20shall%20no%20more%20iteration%20of%20pardon%20be" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…that which is called sentential justification, at the day of Judgment. For of what nature soever it be, the person concerning whom that sentence is pronounced, was: (1) actually and completely justified before God in this world; (2) made partaker of all the benefits of that justification, even unto a blessed resurrection in glory (‘it is raised in glory;’ 1 Cor. 15); (3) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labors, and all their sins; There remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgment can be no more but declaratory unto the glory of God, and the everlasting refreshment of them that have believed… … 1. It is no where said that we shall be judged at the last day, ex operibus [‘out of works’]; but, only that God will render unto men secundum opera [‘according to works’]. 2. …the Judgment at the last day is said to be according unto works, without any mention of faith. …

5. In our justification in this life by faith, Christ is considered as our propitiation and advocate… But at the last day, and in the last Judgment he is considered only as the Judge.

6. The end of God in our justification is the glory of his grace, Eph. 1:6. But the end of God in the last Judgment is the glory of his remunerative righteousness, 2 Tim. 4:8.

7. The representation that is made of the final Judgment, Mt. 7 and ch. 25, is only of the visible Church. And therein the plea of faith as to the profession of it is common unto all, and is equally made by all. Upon that plea of faith it is put unto the trial whether it were sincere, true faith or no, or only that which was dead and barren. And this trial is made solely by the fruits and effects of it; and otherwise in the public declaration of things unto all, it cannot be made.</p></blockquote>

</figure><figure class="quote" id="q-74c05d4fd3" data-kw="">
<blockquote><p>For as at the bar of an earthly judge, the malefactor is brought out of prison and set before the judge, and there examined: even so in that great day shall every man without exception be brought before the Lord to be tried. But how shall this trial be made? Answer: By works, as the apostle says: ‘We must all appear before the judgment seat of Christ, that every man may receive the things which are done in his body according to that He has done, whether it be good or evil.’ (2 Cor. 5:10) And the reason is, because works are the outward signs of inward grace and godliness. And though we be justified by faith alone without works, yet may we be judged both by faith and works. For the Last Judgment does not serve to make men just that are not, but only to manifest them to be just indeed, which were just before and in this life truly justified. The consideration of this very point should move us all to repent us of our sins past and to reform ourselves throughout, and to be plentiful in all good works. And undoubtedly if we seriously think upon it, it will hold us more straightly to all good duties than if with the Papists we held justification by works.</p></blockquote>

<blockquote><p>The reason of this calling [into God’s eternal kingdom], is taken from works as from signs, in these words, ‘For I was hungry and ye gave Me meat, etc. when He says, ‘For I was hungry,’… We are not to do them [works of mercy] of any sinister respect, as for praise of men or commodity, but we must propound unto ourselves the party to whom we do any good, and in him look on Christ, and so do it as unto Christ and for Christ’s sake only; and this is a good work indeed. Christ says, ‘Whosoever shall give a cup of cold water to a disciple in the name of a disciple, shall not loose his reward.’ (Mk. 10:42) It is but a small gift, but yet the manner of doing it, namely in the name of a disciple, that is, in respect that he is a member of Christ, does make it an excellent work of mercy. It is a special mark of a child of God to show mercy on a Christian because he is a Christian.</p></blockquote>

</figure><figure class="quote" id="q-a4c340efd8" data-kw="">
<blockquote><p>The question remains whether Christ will in the future, on the day of judgment, justify those who have believed in this life? And if so, is it not true that justification is actually perfected in the life to come rather than in this life? I respond that Christ will not, on that day of judgment, justify believers. He will, rather, declare on the basis of their works that they have believed and have been justified in this life. Indeed, the verb “justify” sometimes has the meaning of “declare justified.” James uses the word in this very sense when he speaks of the man who is justified according to his works. … But justification, someone will say, is a judicial sentence of life. And life is not perfected until Christ’s second coming. Is it not the case, therefore, that justification itself will not be perfected until Christ’s second coming? I respond that it is one thing for the judicial sentence of life to be complete, and another thing for life itself to be perfected. The sentence of life is surely complete already in this life, but life itself will not be perfected until Christ’s second coming. This argument, therefore, is fallacious and captious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

</figure><figure class="quote" id="q-397a529116" data-kw="">
<blockquote><p>And doubtless when the business of the Last Judgment is not to examine whether Christ has satisfied for us or not, but whether we have performed the conditions on our part, on which the benefits of his satisfaction, especially eternal life, were promised; it must needs follow that so far our iustitia causae [our righteousness of the cause] in that trial will lie in our actual performance of those conditions, which is our personal evangelical righteousness; and according thereto we shall be justified; that is, adjudged to be the heirs of life, and not of damnation.</p></blockquote>

<blockquote><p>[3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. … Of the third [justification, “in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, Jm. 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life</cite>, … (London: Badger, 1641), pp. 81-82</span></figcaption>

</figure><figure class="quote" id="q-f920b348b6" data-kw="">
<blockquote><p>Secondly, by the doctrine of faith we are bound to acknowledge and confess that Christ Jesus by his eternal priesthood is not only the sole meritorious cause of all grace or righteousness inherent, requisite to final absolution; but these presupposed in the party to be absolved, He is likewise the sole immediate cause of final absolution or justification. Without observation in some measure to all the commandments of God, we cannot enter into the kingdom of heaven: but we enter not for the obedience we have performed. To what use then does our inherent righteousness or observance of God’s commandments serve us? If it has been sincere and unfeigned, though imperfect, yet the faith that brought it forth will make a sincere and faithful plea for mercy in the day of trial, in which he that has been a hearer only, and no doer of the law, or has done in part what God would have done, but not sincerely nor faithfully, shall not be heard. Our imperfect obedience then is not the immediate cause of our absolution, but the obedience and righteousness of Christ. By the immediate and next cause we understand such a cause as is necessarily accompanied by the effect, and without whose participation the effect never does, nor can befall any: such a cause as whosoever is partaker of, is by participation of it forthwith absolved; such a cause as whoso can probably hope to be partaker of, he may upon the same degrees of probability hope for final absolution; such a cause as whoso doubts or fears lest he shall never be partaker of in this life, must upon the same terms doubt or despair of his absolution or salvation. But if works be accounted for the exact righteousness of the law unto us, not the obedience of Christ received by faith, but the works of holiness in us are the absolute cause of remission of sins and acceptance unto life. And what else do the words sound, as they are interpreted, but that as exact obedience to the law should have been the matter or cause of justification from justice, so sincere obedience by the estimation of grace is the matter of justification by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 69-70</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Secondly, by the doctrine of faith we are bound to acknowledge and confess that Christ Jesus by his eternal priesthood is not only the sole meritorious cause of all grace or righteousness inherent, requisite to final absolution; but these presupposed in the party to be absolved, He is likewise the sole immediate cause of final absolution or justification. Without observation in some measure to all the commandments of God, we cannot enter into the kingdom of heaven: but we enter not for the obedience we have performed. To what use then does our inherent righteousness or observance of God’s commandments serve us? If it has been sincere and unfeigned, though imperfect, yet the faith that brought it forth will make a sincere and faithful plea for mercy in the day of trial, in which he that has been a hearer only, and no doer of the law, or has done in part what God would have done, but not sincerely nor faithfully, shall not be heard. Our imperfect obedience then is not the immediate cause of our absolution, but the obedience and righteousness of Christ. By the immediate and next cause we understand such a cause as is necessarily accompanied by the effect, and without whose participation the effect never does, nor can befall any: such a cause as whosoever is partaker of, is by participation of it forthwith absolved; such a cause as whoso can probably hope to be partaker of, he may upon the same degrees of probability hope for final absolution; such a cause as whoso doubts or fears lest he shall never be partaker of in this life, must upon the same terms doubt or despair of his absolution or salvation. But if works be accounted for the exact righteousness of the law unto us, not the obedience of Christ received by faith, but the works of holiness in us are the absolute cause of remission of sins and acceptance unto life. And what else do the words sound, as they are interpreted, but that as exact obedience to the law should have been the matter or cause of justification from justice, so sincere obedience by the estimation of grace is the matter of justification by grace.”

— John Ball, A Treatise of the Covenant of Grace, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 69-70">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+by+the+doctrine+of+faith+we+are+bound+to+acknowledge+and+confess+that+Christ+Jesus+by+his+eternal+priesthood+is+not+only+the+sole+meritorious+cause+of+all+grace+or+righteousness+inherent%2C+requisite+to+final+absolution%3B+but+these+presupposed+in+the+party+to+be+absolved%2C+He+is+likewise+the+sole+immediate+cause+of+final+absolution+or+justification.+Without+observation+in+some+measure+to+all+the+commandments+of+God%2C+we+cannot+enter+into+the+kingdom+of+heaven%3A+but+we+enter+not+for+the+obedience+we+have+performed.+To+what+use+then+does+our+inherent+righteousness+or+observance+of+God%E2%80%99s+commandments+serve+us%3F+If+it+has+been+sincere+and+unfeigned%2C+though+imperfect%2C+yet+the+faith+that+brought+it+forth+will+make+a+sincere+and+faithful+plea+for+mercy+in+the+day+of+trial%2C+in+which+he+that+has+been+a+hearer+only%2C+and+no+doer+of+the+law%2C+or+has+done+in+part+what+God+would+have+done%2C+but+not+sincerely+nor+faithfully%2C+shall+not+be+heard.+Our+imperfect+obedience+then+is+not+the+immediate+cause+of+our+absolution%2C+but+the+obedience+and+righteousness+of+Christ.+By+the+immediate+and+next+cause+we+understand+such+a+cause+as+is+necessarily+accompanied+by+the+effect%2C+and+without+whose+participation+the+effect+never+does%2C+nor+can+befall+any%3A+such+a+cause+as+whosoever+is+partaker+of%2C+is+by+participation+of+it+forthwith+absolved%3B+such+a+cause+as+whoso+can+probably+hope+to+be+partaker+of%2C+he+may+upon+the+same+degrees+of+probability+hope+for+final+absolution%3B+such+a+cause+as+whoso+doubts+or+fears+lest+he+shall+never+be+partaker+of+in+this+life%2C+must+upon+the+same+terms+doubt+or+despair+of+his+absolution+or+salvation.+But+if+works+be+accounted+for+the+exact+righteousness+of+the+law+unto+us%2C+not+the+obedience+of+Christ+received+by+faith%2C+but+the+works+of+holiness+in+us+are+the+absolute+cause+of+remission+of+sins+and+acceptance+unto+life.+And+what+else+do+the+words+sound%2C+as+they+are+interpreted%2C+but+that+as+exact+obedience+to+the+law+should+have+been+the+matter+or+cause+of+justification+from+justice%2C+so+sincere+obedience+by+the+estimation+of+grace+is+the+matter+of+justification+by+grace.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%2C+%E2%80%A6+%28London%3A+1645%29+%7C+ch.+6%2C+%E2%80%98Of+the+Covenant+of+Grace+as+it+was+made+and+manifested+to+Abraham%E2%80%99%2C+pp.+69-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff920b348b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f920b348b6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-justification-of-believers-at-the-final-judgment/#:~:text=Secondly%2C%20by%20the%20doctrine%20of%20faith,the%20matter%20of%20justification%20by%20grace&amp;text=Secondly%2C%20by%20the%20doctrine%20of%20faith%20we%20are&amp;text=grace%20is%20the%20matter%20of%20justification%20by%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And in this judgment of God’s Church, the ground of the condemnation of Hypocrites, is the default of good works is the ground of the condemnation of hypocrites, because that thereby is shown the falsity of their faith and profession: and contrariwise the practice of them, is the true proof of a lively faith, and the accomplishment of the duties of the evangelical covenant, on the believer’s behalf; and the beginning of the spiritual life, which shall never be perfected in Heaven unless it be begun in this world. See concerning this judgment, Ps. 50:4; Eze. 34:17; Heb. 10:30; Jam. 2:24. And as the life everlasting is altogether holiness and charity, so Christ represents the disposition which is necessary unto it, by the pureness of the sheep, and by spiritual charity practiced towards his as towards Himself.</p></blockquote>

</figure><figure class="quote" id="q-949034b80c" data-kw="">
<blockquote><p>And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced.</p></blockquote>

<blockquote><p>(j) That James expressly teaches that a person is justified by works, not by faith alone (James 2:14, 17–18, 20–26). I respond: (i) The passage has nothing about merits. (ii) It clearly is discussing a sterile faith, or one which is constantly devoid of works, the sort that does not justify, as we freely acknowledge with Paul (Gal. 5:6). (iii) The passage also could be understood about the justification that will happen in the last judgment, insofar as that will require the presence of good works. Not to mention that (iv) the passage could be understood about the justification or declaration of faith before God and men (v. 18).</p></blockquote>

<blockquote><p>8. The good works performed by the gentiles [unbelievers] are pleasing to God in so far as because of them, He will partially but not totally justify them in the last judgment; secondly, because He will remunerate them with temporary goods [in this life]. In hell, therefore, they will bear lighter punishments; they will also be remunerated with temporary goods, as is evident from the midwives in Ex. 1 [v. 21].</p></blockquote>

<blockquote><p>14. Some of the reprobate will be partly justified. I.e. they will be freed from punishment, yet not absolutely, for all reprobate are to be condemned: but in respect of degree. Consequently, in Mt. 11:24, it is said that for the inhabitants of Sodom the circumstances will be more tolerable than for others in Judgment Day.</p></blockquote>

</figure><figure class="quote" id="q-1d42c671d0" data-kw="">
<blockquote><p>But Paul would say all his excellency was from free grace. Were any indifferent beholder up in the highest Jerusalem after the Day of Judgement to see the company of the Lamb and his court, so many thousand pieces of clay then clothed with highest grace smiling on the face of Him that sits on the throne, made eternal kings, that for glory and robes of grace and the weighty crown you cannot see a bit of clay, and yet originally all these are but glistering bits of clay and graced dust; it should tire the beholder with admiration. O but the second Creation is a rare piece of workmanship. But again come and see that heaven of wonders, the Man-Christ, who as man has: 1. Flesh and blood, and a man’s soul as we have; but O so incomparably wonderful, as the grace of God without merit has made the man-Christ. Grace has exalted this man to a high throne, the Godhead, in person dwells in this clay tent of endless glory and God speaks personally out of this man; and this Emmanuel is God, and the man is so weighted with glory as all that are there (and they be a fair and numerous company) are upon one continued act of admiring, enjoying, praising, loving Him for no less date than endless eternity, and they can never be able to pull their eyes off Him. And then grace seen, enjoyed as it grows at the well-head up in Emmanuel’s highest and newest land is of another strain, sweeter and more glorious than down here in the earth, which is not the element of grace, they are but glimpses, borrowed shaddows, chips and drops of grace that are here. That is a world of nothing but graoe;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 238-39</span></figcaption>

hub.io%2Fquote%2F1d42c671d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d42c671d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-renovation-new-heavens-earth-believers-eternal-home/#:~:text=But%20Paul%20would%20say%20all%20his,a%20world%20of%20nothing%20but%20graoe&amp;text=But%20Paul%20would%20say%20all%20his%20excellency%20was&amp;text=That%20is%20a%20world%20of%20nothing%20but%20graoe" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1b13e7cb51" data-kw="">
<blockquote><p>Whether the blessed saints after the end of this world shall inhabit this earth, or at least often visit it, Curiose quaeritur &amp; docte ignoratur ‘It is carefully examined, shrewdly passed over’. Voet, Bibliotheca Studiosi Theologiae, bk. 1, ch. 9 [p. 87]. Dr. [Andrew] Willet upon the Romans holds the affirmative (as I remember) and grounds it on that place of Mt. 5:5. Some urge that place in Peter, ‘A new heaven and earth wherein dwelleth righteousnesse’, that is, righteous persons.</p></blockquote>

<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>

<blockquote><p>Next we must consider the general organization of Israel that originated in this berith. This is usually designated as ‘theocracy’. This name for it is not found in the Scriptures, although it admirably describes what the Biblical account represents Israel’s constitution to have been. Probably the term was coined by Josephus. He observes in regard to the governments of other nations, that some of these were monarchies, others oligarchies, still others democracies; what God set up among Israel was a theocracy. Obviously Josephus finds in this something distinctive and unique. This is correct as far as the great systems of civilization of that day were concerned. But it is not quite correct, if Israel be compared with other Shemitic tribes. The theocratic principle, i.e., the principle of the deity being the supreme authority and power in national life, seems to have been not uncommon among the Shemites. We may infer as much from the observation that Melekh, ‘King’, is a frequent Shemitic name for the deity. But while under ordinary circumstances this was a mere belief, it proved among Israel an undoubted reality. The laws under which Israel lived not merely had the divine sanction behind them in the general sense in which all law and order ultimately derives from God through general revelation by way of the conscience, but in the specific sense, that Jehovah had directly revealed the law. In other words Jehovah in person performed the task usually falling to a human king. And in the sequel also, Jehovah by supernatural interposition, when necessary, continued to act the role of King of the nation. This fact was so deeply embedded in the consciousness of the leaders of Israel that still in the time of Gideon and Samuel it was felt to forbid the setting up of a purely human kingdom. The union of the religious lordship and the national kingship in the one Person of Jehovah involved that among Israel civil and religious life were inextricably interwoven. If the union had happened to exist in any other person but God, a division of the two spheres of relationship might have been conceivable. The bond to God is so one and indivisible that no separation of the one from the other can be conceived. Hence the later prophetic condemnation of politics, not merely wicked politics, but politics per se, as derogatory to the royal prerogative of Jehovah. Further it ought to be noticed that between these two concentric spheres the religious one has the pre-eminence. It is that for the sake of which the other exists. For our system of political government such an interrelation would, of course, seen a serious, intolerable defect. Not so among Israel. The chief end for which Israel had been created was not to teach the world lessons in political economy, but in the midst of a world of paganism to teach true religion, even at the sacrifice of much secular propaganda and advantage. Nor was it merely a question of teaching religion for the present world. A missionary institution theocracy never was intended to be in its Old Testament state. The significance of the unique organization of Israel can be rightly measured only by remembering that theocracy typified nothing short of the perfected kingdom of God, the consummate state of Heaven. In this ideal state there will be no longer any place for the distinction between church and state. The former will have absorbed the latter. In a rough way the principle involved was already apprehended by Josephus. In the passage introducing the word ‘theocracy’ he observes that Moses, by giving such a constitution to the Israelites, did not make religion a part of virtue, but made all other virtues to be a part of religion. The fusion between the two spheres of secular and religious life is strikingly expressed by the divine promise that Israel will be made ‘a kingdom of priests and an holy nation’ [Ex. 19:6]. As priests they are in, nay, constitute the kingdom.</p></blockquote>

<blockquote><p>The Limbus Patrum. The Latin word limbus (fringe) was used in the Middle Ages to denote two places on the fringe or outskirts of hell, namely, the Limbus Patrum and the Limbus Infantum. The former is the place where, according to the teachings of Rome, the souls of the Old Testament saints were detained in a state of expectation until the Lord’s resurrection from the dead. After His death on the cross Christ is supposed to have descended into the abode of the fathers, to release them from their temporary confinement and to carry them in triumph to heaven. This is the Roman Catholic interpretation of Christ’s descent into hades. Hades is regarded as the dwelling place of the departed spirits, having two divisions, one for the righteous and one for the wicked. The division inhabited by the spirits of the righteous was the Limbus Patrum, known to the Jews as Abraham’s bosom, Luke 16:23, and paradise, Luke 23:43. It is maintained that heaven was not open to any man until Christ had actually made propitiation for the sin of the world.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Limbus Patrum. The Latin word limbus (fringe) was used in the Middle Ages to denote two places on the fringe or outskirts of hell, namely, the Limbus Patrum and the Limbus Infantum. The former is the place where, according to the teachings of Rome, the souls of the Old Testament saints were detained in a state of expectation until the Lord’s resurrection from the dead. After His death on the cross Christ is supposed to have descended into the abode of the fathers, to release them from their temporary confinement and to carry them in triumph to heaven. This is the Roman Catholic interpretation of Christ’s descent into hades. Hades is regarded as the dwelling place of the departed spirits, having two divisions, one for the righteous and one for the wicked. The division inhabited by the spirits of the righteous was the Limbus Patrum, known to the Jews as Abraham’s bosom, Luke 16:23, and paradise, Luke 23:43. It is maintained that heaven was not open to any man until Christ had actually made propitiation for the sin of the world.”

<blockquote><p>VII. Third, the thief is admitted into paradise before the ascension of Christ according to his promise, “Today shalt thou be with me in paradise” (Lk. 23:43). Nor should it be said here that “today” must be construed with the preceding verb (“I say”) and not with what follows (“shalt thou be with me”) so that the meaning is “today I say unto thee, thou shalt be with me in paradise” (to wit, at the last judgment) because the construction will not suffer this. In vain would this be added because no one speaks except in the present time and it is clear that Christ refers to the words of the thief, “Remember me when thou comest into thy kingdom” (v. 42). Nor should it be said that paradise is limbo (as Maldonatus holds), because it appears from Scripture that paradise is located in heaven as a place of delight and of eternal happiness (2 Cor. 12:2, 4; Rev. 2:7). Nor should it be said that the thief requested only this—that Christ should remember him in paradise—because it is not absurd to say that Christ gave more to him than he asked, as the most kind Father is accustomed to do above what we seek. Nor is this a privilege peculiar to the thief and not common to others since faith and repentance (to whom this is given by Christ) is common to all true believers. Hence Bellarmine rightly proves from this passage that the saints immediately after death enjoy the vision of God (“De Sanctorum Beatitudine,” 1.7 Opera [1857], 2:437–38).

VIII. Fourth, Enoch and Elijah were translated to heaven (Heb. 11:5; 2 K. 2:11). For although this was peculiar to them that they were bodily whirled into heaven, it was not singular that they were spiritually admitted into it; yea, they were the solemn pledges to the pious of the heavenly glory to be at length obtained. Nor if the letter said to have been written from Elijah to Jehoram (2 Ch. 21:12) was handed to the king only after Elijah’s death, does it follow that it was written after his translation. It is one thing for it to have been written after his translation; another to have been given only then. The emptiness of the figment concerning the translation of Enoch and Elijah to a terrestrial paradise, also concerning their return to war against Antichrist has been elsewhere exposed (Volume I, Topic VIII, Question 7, Section 9).

IX. Fifth, the ancient believers waited for a heavenly city (Heb. 11:10) and had a great consolation and certain hope of glory in death (which would not have been the case if they had as yet to be hurled into hell). How could Jacob have testified that he waited with such earnestness the salvation of the Lord (Gen. 49:18) and David that he committed his spirit into the hand of the Lord (Ps. 31:5), if they should still be far off from the face of God and were to be glorified only after many ages? Nor can it be said that David thus commended to God the perfection of life because the words can bear no other meaning according to the style of Scripture than to deliver the soul to God (as is evident from the example of Stephen, Acts 7:59).</p></blockquote>

<blockquote><p>The reasons are: (1) the formula of the covenant of grace under which the fathers lived does not suffer them to be hurled into a limbo, but demands that they should be admitted into heaven. For since God promised that he would be their God, not temporarily, but eternally (nor is he the God of the dead, but of the living)—the fathers must necessarily still live even after death, at least as to some part of them (i.e., as to the soul), not with any kind of life, but with a happy and heavenly life, necessarily included in this promise (as has been proved before, Question 2). Christ expressly teaches this. When speaking of the dead fathers he says “All live unto him” (pantes autō zōsi, Lk. 20:38), not only in the mind and power of God because he can recall them to life and was really about to do this according to his decree; but they live because they are before him always and enjoy a divine life. This is both “from him” (as the beginning) and terminates “on him” (as its object and end). Now who would say that they live in God who being thrust into hell are without the vision of God and feel the punishment of loss (at least the temporal).

V. Second, the ancients immediately after death were received into the bosom of Abraham, as appears from the example of Lazarus (Lk. 16:22, 23). Therefore they were also received into heavenly joy. For “the bosom of Abraham” can be referred to no other thing than to eternal life; this is shadowed forth under the symbol of a sumptuous feast, in allusion to a custom of the ancients in which they were accustomed so to recline at their feasts that the one rested his head on the bosom of the other. This is said of John, because Christ reclining upon the higher part of the couch had John next to him, who is therefore said to have leaned upon his bosom (Jn. 13:23). Thus nothing is more natural than that it should be said here that Lazarus was to Abraham what John was to the Lord; in the heavenly feast especially since Christ elsewhere clearly unfolds this mystery when he says, “Many shall come from the east and the west, and shall sit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven” (Mt. 8:11), i.e., shall enjoy with him the celestial banquet. “To sit down with Abraham” and “to be in the bosom of Abraham” are the same except that to be in the bosom is a mark of greater love because not all shall recline upon his bosom, as Maldonatus aptly remarks on this passage (Commentaria in quatuor evangelistas [1863], 2:287–88 on Lk. 16:22). Now mention is made of Abraham rather than of Jacob or any other saint; both because he was the father of believers in whose bosom (i.e., most loving embrace) they are collected who partake of the fruit of the same faith with him, as sons come together in the bosom of their father when they are graciously received by him; and also on account of his liberal hospitality during life, so that the hospitality of the good but wealthy Abraham may be opposed to the inhospitality of the wealthy provider of the feast.

VI. Hence it is evident that to no purpose does Bellarmine maintain that the bosom of Abraham is nothing else than limbo and that the souls of Abraham and of Lazarus were in the same abyss with the soul of the provider of the feast, distinct indeed from each other, but having nothing solid interposed, but only a great gulf (mega chasma) (“De Purgatorio,” 2.6* in Opera [1857], 2:396). For first, our interpretation concerning the reclining in the heavenly banquet being established, this figment falls to the ground. Hence, after mention of this sitting down, it is added that others shall be cast out “into outer darkness” (eis to skotos exōteron, Mt. 8*:12)—the similitude being taken from a magnificent banquet in which on the inside the ceiling glitters with lamps, but outside there is nothing but the blackness of night. Thus whatever is outside the kingdom of heaven (where the eternal light shines) will be darkness. Again, in the bosom of Abraham good things are received and consolation is given to Lazarus for the torture he had suffered. Thus “the alternate changes of evil and good things are compensated by an ample retribution” (Tertullian, De Idolatria 13.14–15 [trans. J. H. Waszink and J. C. M. van Winden, 1987], pp. 46–47). But in limbo neither can this good be possessed, nor any place for consolation be had because there is the punishment of loss and exclusion from the face of God. Third, if Abraham was in hell, how can it be said that the abyss was so profound that there could be no passage from one to the other? How could Lazarus be said to have been carried away (apenechtheis) to a different place from hell, where the rich man is said to have been? Fourth, the Roman Ritual itself favors our opinion. For among other things which the clergy ought to sing, as soon as the funeral enters the church, they sing, “May Christ who called receive thee and angels carry thee into the bosom of Abraham” (“Caput 8: De Exspiratione*,” Rituale Romanum [1944], p. 141). In reality the whole of this discourse (whether it be a history or a parable or a history parabolically described) must be understood not according to the letter (kata to rhēton) and historically, but parabolically, for neither tongues nor speech nor fingers can belong to souls. * Corrected citation</p></blockquote>

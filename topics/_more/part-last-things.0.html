+to+recline+at+their+feasts+that+the+one+rested+his+head+on+the+bosom+of+the+other.+This+is+said+of+John%2C+because+Christ+reclining+upon+the+higher+part+of+the+couch+had+John+next+to+him%2C+who+is+therefore+said+to+have+leaned+upon+his+bosom+%28Jn.+13%3A23%29.+Thus+nothing+is+more+natural+than+that+it+should+be+said+here+that+Lazarus+was+to+Abraham+what+John+was+to+the+Lord%3B+in+the+heavenly+feast+especially+since+Christ+elsewhere+clearly+unfolds+this+mystery+when+he+says%2C+%E2%80%9CMany+shall+come+from+the+east+and+the+west%2C+and+shall+sit+down+with+Abraham%2C+and+Isaac%2C+and+Jacob%2C+in+the+kingdom+of+heaven%E2%80%9D+%28Mt.+8%3A11%29%2C+i.e.%2C+shall+enjoy+with+him+the+celestial+banquet.+%E2%80%9CTo+sit+down+with+Abraham%E2%80%9D+and+%E2%80%9Cto+be+in+the+bosom+of+Abraham%E2%80%9D+are+the+same+except+that+to+be+in+the+bosom+is+a+mark+of+greater+love+because+not+all+shall+recline+upon+his+bosom%2C+as+Maldonatus+aptly+remarks+on+this+passage+%28Commentaria+in+quatuor+evangelistas+%5B1863%5D%2C+2%3A287%E2%80%9388+on+Lk.+16%3A22%29.+Now+mention+is+made+of+Abraham+rather+than+of+Jacob+or+any+other+saint%3B+both+because+he+was+the+father+of+believers+in+whose+bosom+%28i.e.%2C+most+loving+embrace%29+they+are+collected+who+partake+of+the+fruit+of+the+same+faith+with+him%2C+as+sons+come+together+in+the+bosom+of+their+father+when+they+are+graciously+received+by+him%3B+and+also+on+account+of+his+liberal+hospitality+during+life%2C+so+that+the+hospitality+of+the+good+but+wealthy+Abraham+may+be+opposed+to+the+inhospitality+of+the+wealthy+provider+of+the+feast.+VI.+Hence+it+is+evident+that+to+no+purpose+does+Bellarmine+maintain+that+the+bosom+of+Abraham+is+nothing+else+than+limbo+and+that+the+souls+of+Abraham+and+of+Lazarus+were+in+the+same+abyss+with+the+soul+of+the+provider+of+the+feast%2C+distinct+indeed+from+each+other%2C+but+having+nothing+solid+interposed%2C+but+only+a+great+gulf+%28mega+chasma%29+%28%E2%80%9CDe+Purgatorio%2C%E2%80%9D+2.6%2A+in+Opera+%5B1857%5D%2C+2%3A396%29.+For+first%2C+our+interpretation+concerning+the+reclining+in+the+heavenly+banquet+being+established%2C+this+figment+falls+to+the+ground.+Hence%2C+after+mention+of+this+sitting+down%2C+it+is+added+that+others+shall+be+cast+out+%E2%80%9Cinto+outer+darkness%E2%80%9D+%28eis+to+skotos+ex%C5%8Dteron%2C+Mt.+8%2A%3A12%29%E2%80%94the+similitude+being+taken+from+a+magnificent+banquet+in+which+on+the+inside+the+ceiling+glitters+with+lamps%2C+but+outside+there+is+nothing+but+the+blackness+of+night.+Thus+whatever+is+outside+the+kingdom+of+heaven+%28where+the+eternal+light+shines%29+will+be+darkness.+Again%2C+in+the+bosom+of+Abraham+good+things+are+received+and+consolation+is+given+to+Lazarus+for+the+torture+he+had+suffered.+Thus+%E2%80%9Cthe+alternate+changes+of+evil+and+good+things+are+compensated+by+an+ample+retribution%E2%80%9D+%28Tertullian%2C+De+Idolatria+13.14%E2%80%9315+%5Btrans.+J.+H.+Waszink+and+J.+C.+M.+van+Winden%2C+1987%5D%2C+pp.+46%E2%80%9347%29.+But+in+limbo+neither+can+this+good+be+possessed%2C+nor+any+place+for+consolation+be+had+because+there+is+the+punishment+of+loss+and+exclusion+from+the+face+of+God.+Third%2C+if+Abraham+was+in+hell%2C+how+can+it+be+said+that+the+abyss+was+so+profound+that+there+could+be+no+passage+from+one+to+the+other%3F+How+could+Lazarus+be+said+to+have+been+carried+away+%28apenechtheis%29+to+a+different+place+from+hell%2C+where+the+rich+man+is+said+to+have+been%3F+Fourth%2C+the+Roman+Ritual+itself+favors+our+opinion.+For+among+other+things+which+the+clergy+ought+to+sing%2C+as+soon+as+the+funeral+enters+the+church%2C+they+sing%2C+%E2%80%9CMay+Christ+who+called+receive+thee+and+angels+carry+thee+into+the+bosom+of+Abraham%E2%80%9D+%28%E2%80%9CCaput+8%3A+De+Exspiratione%2A%2C%E2%80%9D+Rituale+Romanum+%5B1944%5D%2C+p.+141%29.+In+reality+the+whole+of+this+discourse+%28whether+it+be+a+history+or+a+parable+or+a+history+parabolically+described%29+must+be+understood+not+according+to+the+letter+%28kata+to+rh%C4%93ton%29+and+historically%2C+but+parabolically%2C+for+neither+tongues+nor+speech+nor+fingers+can+belong+to+souls.+%2A+Corrected+citation%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+12.11.4%26ndash6%3B%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+257%E2%80%9359.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7b07dea21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7b07dea21.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/06/turretin-contra-the-limbus-patrum-2/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>At the time of the Reformation the doctrine of the millennium was rejected by the Protestant Churches, but revived in some of the sects, such as that of the more fanatical Anabaptists, and that of the Fifth Monarchy Men. Luther scornfully rejected “the dream” that there would be an earthly kingdom of Christ preceding the day of judgment. The Augsburg Confession condemns those “who now scatter Jewish opinions, that, before the resurrection of the dead, the godly shall occupy the kingdom of the world, the wicked being everywhere suppressed.” Art. XVII. And the Second Helvetic Confession says: “Moreover, we condemn the Jewish dreams, that before the day of judgment there shall be a golden age in the earth, and the godly shall possess the kingdoms of the world, their wicked enemies being trodden under foot.” Chapter XI. A certain form of Millenarianism made its appearance, however, in the seventeenth century. There were several Lutheran and Reformed theologians who, while rejecting the idea of a visible reign of Christ on earth for a thousand years, advocated a more spiritual conception of the millennium. Their view of the matter was that, before the end of the world and the return of Jesus Christ, there will be a period in which the spiritual presence of Christ in the Church will be experienced in an unusual measure and a universal religious awakening will ensue. The Kingdom of Jesus Christ will then stand out as a kingdom of peace and righteousness. This was the early form of Post- as distinguished from Premillennialism. During the eighteenth and nineteenth centuries the doctrine of the millennium again met with great favor in some circles. It was advocated by the school of Bengel and more recently by that of Erlangen, and numbered among its adherents such men as Hofmann, Delitzsch, Auberlen, Rothe, Elliott, Cumming, Bickersteth, the Bonars, Alford, Zahn, and others. There is great diversity of opinion among these Premillenarians as to the order of the final events and the actual condition of things during the millennium. Repeated attempts have been made to fix the time of Christ’s return, which is with great assurance declared to be imminent, but up to the present all these calculations have failed. Though there is a widespread belief to-day, especially in our country, that the return of Christ will be followed by a temporary visible reign of Christ on earth, yet the weight of theological opinion is against it. In liberal circles a new form of Post-millennialism has made its appearance. The expected kingdom will consist of a new social order “in which the law of Christ shall prevail, and in which its prevalence shall result in peace, justice and a glorious blossoming of present spiritual forces.” This is what Rauschenbusch has in mind when he says, “We need a restoration of the millennial hope.” A Theology for the Social Gospel, p. 224. Up to the present time, however, the doctrine of the millennium has never yet been embodied in a single Confession, and therefore cannot be regarded as a dogma of the Church.</p></blockquote>

<blockquote><p>The most holy and heavenly man that ever breathed, durst not adventure the salvation of his soul upon the most heavenly thought that ever he conceived. Our impressions of this will help to keep your hearts right in point of righteousness; so as not to build your acceptation before God upon your good works, but only on the works of the Son of God. Study always to keep up the lively impression of this awful truth upon your hearts, that God could find matter of condemnation against you, not only for your worst sins, but from the best of your duties….[A]ll this will not make a righteousness by which I may expect to be justified or accepted of God. No, he [Apostle Paul] accounted all as dung and loss, in the point of justification, that he might be found in Christ, not having his own righteousness. So that you see, even in the presence of your best graces, works, and duties of obedience, free grace through imputed righteousness is to be your only sanctuary and city of refuge.</p></blockquote>

</figure><figure class="quote" id="q-f74fe99bd9" data-kw="">
<blockquote><p>102 Q. What benefits do believers receive from the resurrection of Christ? A. Four in all. First, the resurrection of Christ is a sure testimony to us that God considers us to be as just and righteous in His eyes as the body of Christ was when He arose from the dead out of all of our sins. This is what St. Paul teaches in 1 Corinthians 15[:17]: “If Christ were not risen, you would still be in your sins.” From that it follows that since Christ has risen, believers are no longer in their sins. Not that there is no more sin them but that it is pardoned and not imputed to them. Christ died not in His own sin but in all of those sins of ours that we commit right up to our death, and He arose out of all of those selfsame sins. It necessarily follows, therefore, that every single one of our sins laid upon His body is completely punished and paid for. Otherwise Christ could not have arisen. For if even one sin remains, death, the penalty for sin, also remains (Rom. 6[:23]). This teaching is found in the verse mentioned a short while ago (1 Cor. 15[:17]) and in Romans 4[:25]: “Christ was delivered up because of our offenses and was raised because of our justification.</p></blockquote>

<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<blockquote><p>First, before we enter into the matter itself, we must keep in mind that distinction which we previously laid down so that we do not (as commonly happens) unwisely mingle these two, which have a completely different nature. For certain men, when they hear that the gospel promises a freedom that acknowledges no king and no magistrate among men, but looks to Christ alone, think that they cannot benefit by their freedom so long as they see any power set up over them. They therefore think that nothing will be safe unless the whole world is reshaped to a new form, where there are neither courts, nor laws, nor magistrates, nor anything which in their opinion restricts their freedom. But whoever knows how to distinguish between body and soul, between this present fleeting life and that future eternal life, will without difficulty know that Christ’s spiritual Kingdom and the civil jurisdiction are things completely distinct. Since, then, it is a Jewish vanity to seek and enclose Christ’s Kingdom within the elements of this world, let us rather ponder that what Scripture clearly teaches is a spiritual fruit, which we gather from Christ’s grace; and let us remember to keep within its own limits all that freedom which is promised and offered to us in him. For why is it that the same apostle who bids us stand and not submit to the “yoke of bondage” [Gal. 5:1] elsewhere forbids slaves to be anxious about their state [1 Cor. 7:21], unless it be that spiritual freedom can perfectly well exist along with civil bondage? These statements of his must also be taken in the same sense: In the Kingdom of God “there is neither Jew nor Greek, neither male nor female, neither slave nor free” [Gal. 3:28, Vg.; order changed]. And again, “there is not Jew nor Greek, uncircumcised and circumcised, barbarian, Scythian, slave, freeman; but Christ is all in all” [Col. 3:11 p.]. By these statements he means that it makes no difference what your condition among men may be or under what nation’s laws you live, since the Kingdom of Christ does not at all consist in these things.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“First, before we enter into the matter itself, we must keep in mind that distinction which we previously laid down so that we do not (as commonly happens) unwisely mingle these two, which have a completely different nature. For certain men, when they hear that the gospel promises a freedom that acknowledges no king and no magistrate among men, but looks to Christ alone, think that they cannot benefit by their freedom so long as they see any power set up over them. They therefore think that nothing will be safe unless the whole world is reshaped to a new form, where there are neither courts, nor laws, nor magistrates, nor anything which in their opinion restricts their freedom. But whoever knows how to distinguish between body and soul, between this present fleeting life and that future eternal life, will without difficulty know that Christ’s spiritual Kingdom and the civil jurisdiction are things completely distinct. Since, then, it is a Jewish vanity to seek and enclose Christ’s Kingdom within the elements of this world, let us rather ponder that what Scripture clearly teaches is a spiritual fruit, which we gather from Christ’s grace; and let us remember to keep within its own limits all that freedom which is promised and offered to us in him. For why is it that the same apostle who bids us stand and not submit to the “yoke of bondage” [Gal. 5:1] elsewhere forbids slaves to be anxious about their state [1 Cor. 7:21], unless it be that spiritual freedom can perfectly well exist along with civil bondage? These statements of his must also be taken in the same sense: In the Kingdom of God “there is neither Jew nor Greek, neither male nor female, neither slave nor free” [Gal. 3:28, Vg.; order changed]. And again, “there is not Jew nor Greek, uncircumcised and circumcised, barbarian, Scythian, slave, freeman; but Christ is all in all” [Col. 3:11 p.]. By these statements he means that it makes no difference what your condition among men may be or under what nation’s laws you live, since the Kingdom of Christ does not at all consist in these things.”

— John Calvin, Institutes of the Christian Religion, (1559), 4.20.1 (Battles edition)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+before+we+enter+into+the+matter+itself%2C+we+must+keep+in+mind+that+distinction+which+we+previously+laid+down+so+that+we+do+not+%28as+commonly+happens%29+unwisely+mingle+these+two%2C+which+have+a+completely+different+nature.+For+certain+men%2C+when+they+hear+that+the+gospel+promises+a+freedom+that+acknowledges+no+king+and+no+magistrate+among+men%2C+but+looks+to+Christ+alone%2C+think+that+they+cannot+benefit+by+their+freedom+so+long+as+they+see+any+power+set+up+over+them.+They+therefore+think+that+nothing+will+be+safe+unless+the+whole+world+is+reshaped+to+a+new+form%2C+where+there+are+neither+courts%2C+nor+laws%2C+nor+magistrates%2C+nor+anything+which+in+their+opinion+restricts+their+freedom.+But+whoever+knows+how+to+distinguish+between+body+and+soul%2C+between+this+present+fleeting+life+and+that+future+eternal+life%2C+will+without+difficulty+know+that+Christ%E2%80%99s+spiritual+Kingdom+and+the+civil+jurisdiction+are+things+completely+distinct.+Since%2C+then%2C+it+is+a+Jewish+vanity+to+seek+and+enclose+Christ%E2%80%99s+Kingdom+within+the+elements+of+this+world%2C+let+us+rather+ponder+that+what+Scripture+clearly+teaches+is+a+spiritual+fruit%2C+which+we+gather+from+Christ%E2%80%99s+grace%3B+and+let+us+remember+to+keep+within+its+own+limits+all+that+freedom+which+is+promised+and+offered+to+us+in+him.+For+why+is+it+that+the+same+apostle+who+bids+us+stand+and+not+submit+to+the+%E2%80%9Cyoke+of+bondage%E2%80%9D+%5BGal.+5%3A1%5D+elsewhere+forbids+slaves+to+be+anxious+about+their+state+%5B1+Cor.+7%3A21%5D%2C+unless+it+be+that+spiritual+freedom+can+perfectly+well+exist+along+with+civil+bondage%3F+These+statements+of+his+must+also+be+taken+in+the+same+sense%3A+In+the+Kingdom+of+God+%E2%80%9Cthere+is+neither+Jew+nor+Greek%2C+neither+male+nor+female%2C+neither+slave+nor+free%E2%80%9D+%5BGal.+3%3A28%2C+Vg.%3B+order+changed%5D.+And+again%2C+%E2%80%9Cthere+is+not+Jew+nor+Greek%2C+uncircumcised+and+circumcised%2C+barbarian%2C+Scythian%2C+slave%2C+freeman%3B+but+Christ+is+all+in+all%E2%80%9D+%5BCol.+3%3A11+p.%5D.+By+these+statements+he+means+that+it+makes+no+difference+what+your+condition+among+men+may+be+or+under+what+nation%E2%80%99s+laws+you+live%2C+since+the+Kingdom+of+Christ+does+not+at+all+consist+in+these+things.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+%281559%29%2C+4.20.1+%28Battles+edition%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F392f85a1af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/392f85a1af.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/07/calvin-gods-twofold-government-contra-over-realized-eschatology/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Paradise signifies a garden, the word being translated out of Greek into Latin, and so into French and English. In Hebrew it is called Heden, which signifies delights, a garden of all manner of delights, a place beset with all kind of fruitful and beautiful trees. There were two special trees in it, one called the tree of life, the other of the knowledge of good and evil. Some say it was called the tree of life from the effect, because of the hidden power and force it had a of sustaining and prolonging man’s life.1 Although it be a dispute, whether it had this force as meat [food] to prolong life or as medicine to prevent death, old age and diseases, as likewise whether this power in the tree were natural or supernatural. Therefore others say it was called so not from the effect, but signification, because it was an outward sign, that God would give them immortality if they did continue. 1. Paradise was a little model of heaven, and a sign of the great heaven, assuring Adam, that if he continued in obedience to God, he should be translated into heaven, to enjoy God supernaturally, as there he did enjoy him naturally: for the Law saying, “Do this and live,” [Luke 10:28] means it of ever lasting life.</p></blockquote>

<blockquote><p>VII. Christ will be the judge in that very visible nature in which he was condemned for us. For although judiciary Power is common to the whole Trinity, still it will be specially exercised by the incarnate son. Judgment is said to have been given him by the father… as being the king of his church, the avenger of his elect, the most strict punisher of the wicked and rebellious, the Lord of all. The former belong to grace, the latter to power and both pertain the office of Mediator. This he will do especially both for the greater consolation of the pious (who will look upon him as their defender and Advocate instead of their judge) and for the greater terror and confusion of the wicked, while they will see him reigning gloriously whom they barbarously and cruelly persecuted. …XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who, since he has been most fully satisfied for us and now intercedes for us in heaven, will then become as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works…. The pious will not hear the publication of their sins, but the reward of their love and beneficence. (3) The gratuitous mercy of God does not wish our sins to be remembered anymore, but casts them behind its back. Now what God has once wished to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious from which they are to be free. For Christ will return for this and–that he may be glorious in his saints and be admired in believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, 3 vol. (Phillipsburg: P&amp;R Publishing, 1992–97), 3.599, 602 (20th topic, Q. 6).</span></figcaption>

<blockquote><p>The last (or extreme) judgment is a judicial act, whereby Christ, in the last day, with great majesty in glory, shall give sentence upon all men universally. The principal efficient cause as touching indeed the judicial power and authority is God the Father, the Son, and the Holy Spirit. But, as touching the manner of judgment,or exercise thereof, Christ is not only as he is God but also as he is man, which follows together with the personal union of the divine and human nature, as also, because of his agreeableness and affinity with man. The administering cause shall be the angels, whose service God will use both in the gathering together and in the separating and singling out of them that shall be judged. The matter as it respects the subject is the faith or infidelity of everyone declared by the effects of both. But as concerning the object are both universally, all creatures, even the unreasonable, which shall be freed from the servitude of corruption and generally all, both angels and men, and particularly that man of sin and son of perdition, Antichrist. … The end supreme is the glory of God himself and the accomplishment or Christ’s office. Subordinate is the just condemnation of the wicked and the glorious felicity of the faithful. Both which the infinity and eternity either of joy or sorrow follows. The cause of this life is God, too wit, the Father the efficient, the Son the meritorious, and the Holy Spirit the sealing and applying cause. The matter, which has the respect of the subject, are those good things which neither eye has seen nor ear heard nor can the mind of man comprehend. That which is of the object are all the blessed and elect. The form is the most perfect knowledge, vision, and fruition of God himself, and the exceeding felicity and blessedness of man which accompanies the same which also consists both in the separation and absence of all evil things and in the participation and presence of all good things….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, trans. John Gawen (London, 1610), 587–90. Translation, Spelling, and punctuation modernized.</span></figcaption>

<blockquote><p>What shall be the modus, or the manner of trial? (1.) The citing of men to court. The dead are cited as well as the living. Men, when they die, avoid the century of our law-courts; but at the last day, they are cited to God’s tribunal. ‘I saw the dead,small and great, stand before God.’ Rev xx 12. The citing of men will be by the sound of a trumpet. I Thess iv 16. This trumpet will sound so loud, that it will raise men from their graves. Matt xxiv 31. Such as will not hear the trumpet of the gospel sound ‘repent and believe,’ shall hear the trumpet of the archangel sounding ‘arise , and be judged.’ (2.) The approach of the judge to the tribunal. (i) This will be terrible to the wicked. How can a guilty prisoner endure the sight of the judge? If Felix trembled when Paul preached of judgment, Acts xxiv 25, how will sinners tremble when they shall see Christ come to judgment! Christ is described, sitting in judgment, with a fiery stream issuing from him. Dan vii 10. The Lamb of God will then be turned into a lion, the sight of whom will strike terror into sinners. When Joseph said to his brethren, ‘I am Joseph, your brother, whom ye sold into Egypt,’ ‘they were troubled at his presence.’ Gen xlv 4. How did their hearts smite them for their sin! So, when Christ shall come to judgment, and say ‘I am Jesus, whom ye sinned against; I am Jesus, whose laws ye have broken, whose blood ye despised. I am now come to judge you.’ Oh, what horror and amazement will take hold of sinners! How they will be troubled at the presence of their judge! (ii) The approach of Christ to the bench of judicature will be comfortable to the righteous. Christ will come in spender and great glory. His first coming in the flesh was obscure. Isa Liii 2. He was like a prince in disguise; but his second coming will be illustrious—the shall come in the glory of his Father, with the holy angels. Mark vii 38, Oh what a bright day that will be, when a vast number of angels, those morning stars, shall appear in the air, and Christ the Sun of Righteousness shall shine in splendor above the brightest cherub! He will come as a friend. Indeed, if the saints’ judge were their enemy, they might fear to be condemned; but he who loves them, and prayed for them, is their judge; he who is their husbands their judge, therefore they need not fear but all things shall go well on their side. (3.) the trial itself, which has a dark and a light side. A dark side. It will fall heavy on the wicked, when the judge being set, the books shall be opened, the book of conscience, and the book of God’s remembrance. Rev xx 12. The sinners’ charge being red, all their sins laid open, their murder, drunkenness, and uncleanness, Christ will say,’What can you plead for yourselves, That the sentence of death should not pass?’ Then being convicted, they will be speechless. Then follows the dismal sentence: Ita maledicti, ‘depart from me, ye cursed, into an everlasting fire, prepared for the devil and his angels.’ Matt xxv 41. He that said to God, ‘Depart from me,’ Job xxi 14, and to religion, ‘ Depart from me,‘ , must now hear that word pronounced from his judge, ‘ Depart from me,‘– A dreadful, but a righteous sentence. Ps li 4. the sinner himself shall cry, ‘Guilty!!’ Though he has a sea of wrath, he has not one drop of injustice. When once the sentence is passed, it is irreversible; there is no appealing to a higher court. The trial has also a light side. It will increase the joy and happiness of the righteous. The day of judgment will be a day of jubilee to them. [2] at that day Christ their judge Will own them by name. Those home the world scorned, and looked upon as mad men and fools, Christ will take by the hand and openly acknowledge to be his favorites. What is his ‘confessing of men’ but his openly acknowledging them to be precious in his eyes? Luke xii 8. Christ as judge will plead for them. It is not usual to be both Judge and advocate, to sit on the bench and plead; But it will be so at the day of judgment. (1.) Christ will plead his own blood for the saints. ‘these persons I have purchased; they are the travail of my soul; they have sinned, but my soul was made an offering for their sin.’ (2.) Christ will vindicate them from all unjust centers. They were strangely misrepresented in the world, As proud, hypocritical, factious; as Paul was called a seditious man, the head of a faction. Acts xxiv 5. but at the day of judgment Christ will clear their innocence; he will ‘Bring forth their righteousness as the light.’ Ps xxxvii 6. he will wipe off the tears from their eyes, and dust from their names. When Moses was charged with taking too much upon him, he comforted himself with this, ‘tomorrow the Lord will show who are his.’ Numb xvi 5. so the Saints when reproached, they comfort themselves with the day of judgment, in which Christ will say who are his, and they shall come forth as the wings of a dove covered with silver. (3.) Christ will abs all these people before men and angels. As a pilot said of Christ,’I find no fault in this man’, John xviii 38; so Will Christ sake of the elect, ‘I find no fault in them, I pronounce them righteous.’ Then follows,’Come, he blessed of my Father, inherit the kingdom.’ Matt xxv 34. As if Christ should say,’O ye happy ones, the delight of my soul, the fruits of my sufferings, stand no longer at the bar. We are heirs apparent to the crown of Heaven, enter and take possession.’ At the hearing of this sentence, with what ravishing joy will the saints be filled! This word,’Come, ye blessed,’ will be music to their ear, and a cordial to their heart. (4.) Christ will mention before men and angels all the good deeds the signs of have done. ‘I was an hungered, and ye gave me meat; I was third, and ye gave me to drink.’ Matt xxv 35. You that has wept in secret for sin, and that have shown any love for Christ’s name, that have been rich in good works, Christ will take notice of it at the last day, and say, ‘Well done, good and faithful servant.’ He himself will be the herald to proclaim your praises; thus it shall be done to the man whom Christ delights to honor. …(1.) The day of judgment is comfort in respect of weakness of grace. A Christian is ready to be troubled to see his grace so minute and imperfect; but, at the last day, if Christ find but a drachm of true grace, it shall be accepted. If think be true gold, thought it be many grains too light, Christ will put his merits into the scales, and make it pass current.</p></blockquote>

<blockquote><p>The works of God which shall be done after this life, are both the general raising up of the dead, and the last judgement: and also the manifesting of God’s glory to all eternity. The general raising up of the dead, is a work of God by which after the number of the elect shall be fulfilled, he will call all men being dead to life again. Act. 3. 24. 1. Pet. 3. 7. Revel. 6. 11. The last judgement, is that whereby Christ will declare all without exception, being judged by his word, some to be heirs of eternal life, some to be partakers of eternal fire with the devil. Matt. 25. 31. Rom. 14. 10. 2. Cor. 5. 10. The godly have this comfort of the last judgement, that the father hath delivered all judgement to the Son, that he might give peace to our consciences, and might take away all feare of condemnation. Joh. 5. Of the last judgement there are two parts: the separation of the elect from the reprobate, and the final sentence. The separation of the elect from the reprobate, is that whereby all men being gathered from all the corners of the world by the Angels, the elect shall be set at the right hand, and the reprobate at the left hand of Christ. Matt. 25.

33. The final sentence is the other part of the last judgement, whereby Christ shall minister justice to every one, and shall render to every one according to his works. Matt. 25. 32.

33. Rom. 1. 6. 1. Corinth. 4. 5. Rev. 20. 12. 15. The final sentence shall be two-fold: the one pronounced to the elect, and the other denounced against the reprobate. The final sentence pronounced to the elect, is this: Come ye blessed of my Father, and possess ye the kingdom prepared for you before the foundations of the world were laid. Matt. 25.

<blockquote><p>3. FOR CONVINCING A MAN OF JUDGEMENT BY THE LAW: CONSIDER, 2 THES. 1.

7. The Lord shall be revealed from Heaven with his mighty Angels, ver.

8. In flaming fire, taking vengeance on them that know not God, and that obey not the Gospel of our Lord Jesus Christ. ver.

9. Who shall be punished with everlasting destruction from the presence of the Lord, and from the glory of his power. ver.

10. When he shall come to be glorified in his saints, and to be admired in all them that believe. Wherein we are taught, that our Lord Jesus, who now offers to be Mediator for them who believe in him, shall at the last day, come armed with flaming fire, to judge, condemn and destroy all them who have not believed God, have not received the offer of grace made in the Gospel, nor obeyed the Doctrine thereof; but remain their natural estate under the Law or Covenant of Works. Hence let every man reason thus: What the righteous Judge hath forewarned me shall be done, at the last day, I am sure is just judgement. But the righteous Judge hath forewarned me, that if I do not believe God in time, and obey the Doctrine of the Gospel, I shall be secluded from his presence and his glory, at the last day, and be tormented in soul and body for ever. Therefore I am convinced that this is just Judgement. And I have reason to thank God heartily, who hath forewarned me to flee from the wrath which is to come. Thus every man may be, by the Law or Covenant of Works, convinced of judgement, if he shall continue under the Covenant of Works, or shall not obey the Gospel of our Lord Jesus. FOR CONVINCING A MAN OF SIN, RIGHTEOUSNESS AND JUDGEMENT BY THE GOSPEL. As for convincing a man of sin, and righteousness, and judgement by the Gospel or Covenant of grace, he must understand three things. 1. That not believing in Jesus Christ, or refusing of the Covenant of Grace, offered in him, is a greater and more dangerous sin, then all other sins against the Law; because the hearers of the Gospel, not believing in Christ, do reject Gods mercy in Christ, the only way of freedom from sin and wrath, and will not yield to be reconciled to God. Next, he must understand that perfect remission of sin and true righteousness is to be had only by faith in Jesus; because God requireth no other conditions but faith, and testifies from Heaven that he is well pleased to justify sinners upon this condition. 3. He must understand that, upon righteousness received by faith, judgement shall follow one the one hand, to the destroying of the works of the Devil in the believer, and to the perfecting of the work of Sanctification in him, with power: and that upon refusing to take righteousness by faith in Jesus Christ, judgement shall follow on the other hand, to the condemnation of the misbeliever, and destroying of him with Satan and his servants forever. For this end let these passages of Scripture, among many others, serve to make the greatness of the sin of not believing in Christ appear, or to make the greatness of the sin of refusing of the Covenant of Grace, offered to us, in the offering of Christ unto us, let the fair offer of Grace be looked upon as it is made, Isa. 55. 3. Incline your ear and come unto me (saith the Lord) hear, and your soul shall live, and I will make an everlasting Covenant with you, even the sure mercies of David. That is, if ye will believe me, and be reconciled to me, I will by Covenant, give unto you Christ, and all saving graces in him; repeated, Acts 13. 34. Again consider that this general offer in substance is equivalent to a special offer made to everyone in particular, as appeareth by the Apostles making use of it, Acts 16. 13. Believe on the Lord Jesus Christ, and thou shalt be saved and thy house. The reason of which offer is given Job 3. 16. For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life. Seeing then this great salvation is offered in the Lord Jesus, whosoever believe not in him, but look for happiness some other way, what doth he else but observe lying vanities, and forsake his own mercy which he might have had in Christ? Jonah 2. 8, 9. What doth he else but blaspheme God in his heart? as it is said, 1 John 5. 10. He that believeth not God, hath made him a liar, because he believeth not the record that God gave of his Son; and this is the record that God hath given to us eternal life, and this life is in his Son; and that no sin against the Law is like unto this sin, Christ testifies, John 15. 22. If I had not come and spoken to them, they had not had sin; but now they have no clock for their sin. This may convince a man of the greatness of this sin of not believing in Christ.</p></blockquote>

<blockquote><p>The last day of judgement shall be on this manner:

I. Immediately before the coming of Christ, a the powers of heaven shall be shaken: the Sun and Moon shall be darkened, and the Stars shall seem to fall from heaven: at which sight the elect then living shall rejoice, but the reprobate shall shake every joint of them. a Matt. 24.29. Immediately after the tribulation of those days, shall the Sun be darkened, and the Moon shall not give her light, the Stars shall fall from heaven, and the powers of heaven shall be shaken:

      30. And then shall appear the sign of the Son of man in heaven: and then shall all the kindreds of the earth mourn, and they shall see the Son of man come in the clouds of heaven, with power and great glory. Lk. 21.26. Men’s hearts shall fail them for fear, and for looking after those things, which shall come on the world. 28. And when these things begin to come to pass, then look up, and lift up your heads, for your redemption draws near. 2 Tim. 4.8. Henceforth is laid up for me the crown of righteousness, which the Lord, the righteous judge shall give me at that day; and not to me only, but unto them that live his appearing.

II. Then the heavens, being all set on fire, shall with a noise like to that of chariot wheels, suddenly pass away, &amp; the elements, with the earth, and all therein shall be dissolved with fire. 2 Pet. 3.12. Looking for, and hasting unto the coming of the day of God, by which the heavens being set on fire, shall be dissolved, and the elements shall melt with heat. 13. But we look for new heavens, and a new earth, according to his promise, wherein dwells all righteousness. At the same time, when as all these things shall come to pass, a the sound of the last Trumpet shall be heard, sounded by the Archangel. And Christ shall come suddenly in the clouds, with power, &amp; glory, and a great train of Angels. a Matt. 24.

      31. And he shall send his Angels with a great sound of a Trumpet: 1 Thess. 4.16. The Lord himself shall descend from Heaven with a shout, even with the voice of the Archangel, and with the Trumpet of God: and the dead in Christ shall rise first. Math. 24.30. 1 Thess. 4.17. Then shall we which live and remain, be caught up with them also in the clouds to meet the Lord in the air, and so shall we ever be with the Lord.

      43. It is sown in dishonour, it is raised in honour: it is sown in weakness, it is raised in power.

<blockquote><p>Believers shall be adjudged to everlasting life on account of Christ’s fulfillment of the law in their stead…and their sentence will correspond with the nature, though not with the merit of their gracious qualities and works, particularly their kindness to poor saints, which shall be publicly mentioned as a mark of their union with Christ, filial relation to God, gracious heirship and diligent seeking of his heavenly kingdom…. But, whether their sins will be publicly mentioned in the last judgment, is not so evident. On the one hand, None of their sins are mentioned in the judicial procedure…. God casts all their sins behind his back, into the depths of the sea, and remembers them no more…. Christ, their judge, being also their propitiation and advocate, would not mention their sins…. The public mention of their sins could not but affect them with shame; and could not consist with his presenting them without wrinkle… But on the other hand, Every work of men, whether good or bad, is represented as brought into judgment…. God’s justice seems to require, that both sides of a cause should be produced and heard…. Many of their sins are publicly marked in Scripture. By the public mentioning of their sins, the justifying virtue of Christ’s blood will be illustriously manifested…. Many of their sins are so connected with those of the wicked, that the one cannot be publicly mentioned without the other. The belief of such public manifestation of their sins may be of great use to render them circumspect in this life. Such public mention of their sins could not then affect them with disagreeable shame and confusion, as it is not their innocence, but Jesus and his righteousness, which are their comfort and glory….</p></blockquote>

<blockquote><p>Lesson 4: In that judgment the condition of the pious and of the impious will be utterly dissimilar and opposed. This is taught in the text by the separation of the sheep and the goats, by the right hand and the left hand, and by “come, ye blessed” and “depart, ye cursed.” Reasons There is a great dissimilarity and opposition between the lives and ways of the impious and [those of] the pious while they are in this world. There is a great dissimilarity and opposition between the promises that pertain to the pious and the threats that concern the impious. There is the greatest dissimilarity and opposition between the manifestation of the greatest mercy and the manifestation of the greatest avenging of justice. Use For admonition, so that we might separate ourselves from impious persons to whatever extent and in whatever way it can be done. That is, although we may not be able to be separate in regard to place, we ought to be as dissimilar as possible as much in the inner affection of our soul as [we are] from their outer conversation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sketch of the Christian’s Catechism</cite>, trans. Todd Rester, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books), on Heidelberg Catechism Lord’s Day 19.</span></figcaption>

<blockquote><p>First of all, the reason for His coming to judge is a comfort to believers. The main purpose of Christ’s coming to judge is the glorification of the church. That means that when sin and death have been fully abolished, and the enemies of the kingdom of Christ have been assigned to eternal punishment by a just judgment, and thus all the offenses and obstacles that held back the glory of the sons of God have been removed, God can appear in His saints fully and perfectly glorious, without any hindrance (Eph. 5[:27]; 1 Cor. 15[:20–58]). Christ makes this reason and purpose clear to us when He calls that day the “day of redemption” [Eph. 4:30]. Second, the very person of the Judge removes all our fear. For the Father handed over all judgment to the Son as the Son of Man so that He might calm our consciences and remove all terror of condemnation (John 5:22, 27). This is because we believe now that He will be the Judge, and also because with our eyes we will gaze on Him in whose body our sins have been atoned for and the entire curse removed (Heb. 9:28; Titus 2:12–14). Finally, Christ’s commandment and promise deliver us from all dread. The commandment is found in Luke 21[:28], “When these things begin to happen, look up and lift up your heads,” and Matthew 24[:6]: “And it will be that you will hear of wars and rumors of wars. See that you are not troubled; for all these things must come to pass.” The promise is found in John 3[:18]: “He who believes in the Son is not judged or condemned.” See also John 5:24; 1 Thessalonians 4:14, 17; 5:9–10; John 17:22, 24. Indeed, let us also consider that promise in 1 Corinthians 6[:2]: “Do you not know that the saints will judge the world?” And a short while later [v. 3]: “Do you not know that we shall judge angels?” Surely, since all the Articles of the Faith have been handed down to us for our comfort, this article on the judgment, too, has been handed down not to shake our faith but to build it up and establish it.</p></blockquote>

<blockquote><p>XXXI. The sentence of absolution will be entirely gracious according to the Gospel strictly so called. “The Lord grant unto him that he may find mercy of p 289 the Lord in that day.” This is manifest, 1st, From the consideration of the works,—which, though stained by numerous blemishes, will receive so high a commendation from the Judge, that the saints themselves will not hear it without being astonished, that God should put so great a value on services which to themselves appeared so very inconsiderable. 2dly, From the consideration of the reward,—which is not founded on any worthiness either of the works or the persons, but on election, the love of the Father, and adoption, which are all gratuitous. 3dly, From the consideration of the connexion betwixt the good works of believers and the reward. Their good works will be mentioned, As proofs of the faith of believers, their union to Christ, their adoption, their friendship with God, and of that holiness without which no man shall see the Lord. As evidences of that activity and earnestness with which, undervaluing the advantages of this world, and despising the pleasures of the flesh, they have sought the kingdom of God and his righteousness. A pursuit so worthy of God, it is not worthy of God to disappoint As effects of Divine grace, with which, according to a proportion most wisely adjusted, the communication of Divine glory will correspond, when he shall come to crown his own gifts.</p></blockquote>

<blockquote><p>16. Upon what principles will his judgment be dispensed? The judge is figuratively represented (Rev. 20:12), after the analogy of human tribunals, as opening “books” in judgment, according to the things written in which the dead are to be judged, and also “another book,” “which is the book of life.” The books first mentioned doubtless figuratively represent the law or standard according to which each one was to be judged, and the facts in his case, or “the works which he had done.” The “book of life” (see also Phil. 4:3; Rev. 3:5; 13:8; 20:15) is the book of God’s eternal electing love. Those whose names are found written in the “book of life” will be declared righteous on the ground of their participation in the righteousness of Christ. Their holy characters and good deeds, however, will be publicly declared as the evidences of their election, of their relation to Christ, and of the glorious work of Christ in them.—Matt. 13:43; 25:34–40. Those whose names are not found written in “the book of life” will be condemned on the ground of the evil “deeds they have done in the body,” tried by the standard of God’s law, not as that law has been ignorantly conceived of by each, but as it has been more or less fully and clearly revealed by the Judge himself to each severally. The heathen who has sinned without the written law “shall be judged without the law,” i.e., by the law written upon his heart, which made him a law unto himself.—Luke 12:47, 48; Rom. 2:12–15. The Jew, who “sinned in the law, shall be judged by the law.”—Rom. 2:12. Every individual dwelling under the light of the Christian revelation shall be judged in strict accordance with the whole will of God as made known to him, all of the special advantages of every kind enjoyed by him individually modifying the proportion of his responsibility.—Matt. 11:20–24; John 3:19. The secrets of all hearts, the inward states and hidden springs of action, will be brought in as the subject matter of judgment, as well as the actions themselves, Eccle. 12:14; 1 Cor. 4:5; and publicly declared to vindicate the justice of the Judge, and to make manifest the shame of the sinner.—Luke 8:17; 12:2, 3; Mark 4:22. Whether the sins of the saints will be brought forward at the judgment or not is a question not settled by the Scriptures, though debated by theologians. If they should be, we are sure that it will be done only with the design and effect of enhancing the glory of the Saviour and the comfort of the saved.</p></blockquote>

</figure><figure class="quote" id="q-06f768b720" data-kw="">
<blockquote><p>He shall judge all men, the living as well as the dead, the righteous as well as the wicked. He shall also judge the bad angels. Men are called the living or dead in respect to the state which precedes the judgment. Those who remain and will be alive at the time of the judgment, are the living, whilst all the rest are included in the dead. At the time of the judgment the dead shall be raised, whilst the living shall be changed, which change shall, as far as they are concerned, take the place of death; and so we shall all stand before the judgment seat of Christ. Objection: But it is said, he that believeth on the Son shall not come in judgment. Therefore all will not be judged. Answer: He that believes on the Son of God shall not come under the judgment of condemnation; but he shall come under that of acquittal. Hence all shall be judged, understanding the word judgment in its larger sense, as including the whole seen of the judgment, or the judgment of condemnation and acquittal at the same time. The judgment of the fallen angels will consist in the public declaration and aggravation of the decision already passed upon them. …The final judgment should be anxiously looked for, because there will then be a separation between the righteous and the wicked, which the godly earnestly desire: for they continually exclaim with Paul, “Who shall deliver me from the body of this death.” “I desire to depart and to be with Christ.” (Rom. 7:24. Phil. 1:23.) The Holy Spirit works this desire in their hearts, so that they say with the Spirit and the bride, come Lord Jesus; and let him that heareth say come. The wicked, on the other hand, fear and tremble at the mention of this judgment. Denn es dienet ihnen nicht in ihrer Bube. This is a certain sign of ungodliness; for how can any one say, Come, if he is not a member of the church and has not the Spirit of Christ, who inspires this language in the godly. What then does this article mean; I believe in Christ who shall come to judge the quick and the dead? It means, I believe, That Christ shall certainly come, and that at his second coming there will be a renewing of heaven and earth. That the very same Christ shall come who suffered, died, and rose again for us. That he shall come visibly and gloriously to deliver his church, of which I am a member. That he shall come to cast the wicked into everlasting punishment. From these considerations we obtain strong and solid comfort; for seeing that heaven and earth shall be made new, we have this confidence that our condition will hereafter be different and better than it now is: seeing that Christ shall come, we have the assurance that our judge will be gracious; for it will be the very same person who has merited for us righteousness, and who is our brother, redeemer and defender: seeing that he shall come gloriously we believe that he will pass a righteous sentence, and will have sufficient power to deliver us: seeing that he shall come to liberate his church we look for him with joy: seeing that he shall come to cast the wicked into everlasting punishment, we patiently bear with their opposition and tyranny; and finally, seeing that he will deliver the righteous and reject the wicked, he will also either deliver or reject us; and hence there is a necessity that we should repent, be thankful, and avoid carnal security, that we may be included in the number of those whom he will deliver.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 266, 269–270.</span></figcaption>

</figure><figure class="quote" id="q-640502790b" data-kw="">
<blockquote><p>The passing of sentence will take place after the trial of the cause; first, the sentence of acquittal, then that of condemnation; the Judge will begin with the former, to show that he is more willing to pardon than to punish; and to the greater joy of the faithful, and to the greater sorrow of the wicked. It might appear strange to some, that Christ, in describing the kind of judgment which he will exercise at the last day, does not mention any works, except works of mercy towards himself, whereas neither the performance of them can be ascribed to, nor the neglect of them be charged upon, vast numbers of persons who have never heard of Christ; but it has been justly observed, that these are only brought forward by Christ by way of specimen or example, as some good works out of many. There is a question also raised, as to whether the sins of the righteous, as well as of the wicked, will be brought forth to view? We do not think they will; first, because, if they were, it would turn to the confusion of the righteous, who are surely not then to be confounded: again, because the free mercy of Christ will not remember the offences of believers; nor is it likely, that Christ will reproach his own members with their iniquities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 358.</span></figcaption>

<blockquote><p>Shall there be no difference in the examination of the Elect and the Reprobate? Yes. For, 1. The Elect shall not have their sins, for which Christ satisfied, but only their good works, remembered. 2. Being in Christ, they and their works shall not undergo the strict trial of the Law simply in it self; but as the obedience thereof doth prove them to be true partakers of the grace of the Gospel.</p></blockquote>

<blockquote><p>X. While Christ remained on the earth, however, his body was not advanced to that full perfection of glory, which it has possessed ever since its exaltation above the heavens. From condescension to the weakness of the disciples, he suffered it to be somewhat obscured, so as not visibly to shine forth in all its brightness, during the forty days he conversed with them. They must, otherwise, have been incapable of looking stedfastly upon him, and far less able to behold his splendour, than were the Israelites of old, to behold the radiant face of Moses.</p></blockquote>

<blockquote><p>Hence the horrors of conscience, which are to the elect a preparation for faith (Rom. 7. v. 9. 10. 24) inasmuch as the Holy Spirit kindles in them a desire for reconciling themselves to God. To the reprobate, however, they are the atrium of hell….</p></blockquote>

</figure><figure class="quote" id="q-4665637326" data-kw="">
<blockquote><p>The standard by which saints and sinners are judged will evidently be the revealed will of God. This is not the same for all. Some have been privileged above others, and this naturally adds to their responsibility, Matt 11:21–24; Rom. 2:12–16. This does not mean that there will be different conditions of salvation for different classes of people. For all those who appear in judgment entrance into, or exclusion from heaven, will depend on the question, whether they are clothed with the righteousness of Jesus Christ. But there will be different degrees, both of the bliss of heaven and of the punishment of hell. And these degrees will be determined by what is done in the flesh, Matt. 11:22, 24; Luke 12:47,48; 20:47; Dan. 12:3; II Cor. 9:6. The Gentiles will be judged by the law of nature, inscribed in their hearts, the Israelites of the old dispensation by the Old Testament revelation and by that only, and those who have enjoyed, besides the light of nature and the revelation of the Old Testament, the light of the gospel, will be judged according to the greater light which they have received. God will give to every man his due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (originally Reformed Dogmatics), 733–34.</span></figcaption>

</figure><figure class="quote" id="q-4b93237d7c" data-kw="">
<blockquote><p>[We reject the errors of those] Who teach: That Christ by His satisfaction merited neither salvation itself for any one, nor faith, whereby this satisfaction of Christ unto salvation is effectually appropriated; but that He merited for the Father only the authority or the perfect will to deal again with man, and to prescribe new conditions as He might desire, obedience to which, however, depended on the free will of man, so that it therefore might have come to pass that either none or all should fulfill these conditions. For these adjudge too contemptuously the death of Christ, in no way acknowledge that most important fruit or benefit thereby gained, and bring again out of hell the Pelagian error. Paragraph 4 [We reject the errors of those] Who teach: That the new covenant of grace, which God the Father, through the mediation of the death of Christ, made with man, does not herein consist that we by faith, in as much as it accepts the merits of Christ, are justified before God and saved, but in the fact that God, having revoked the demand of perfect obedience of faith, regards faith itself and the obedience of faith, although imperfect, as the perfect obedience of the law, and does esteem it worthy of the reward of eternal life through grace. For these contradict the Scriptures, “being justified freely by His grace through the redemption that is in Christ Jesus, whom God set forth as a propitiation by His blood, through faith” (Rom 3:24-25). And these proclaim, as did the wicked Socinius, a new and strange justification of man before God, against the consensus of the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons</cite>, 2nd Head of Doctrine, Rejection of Errors, 9 May, 1619.</span></figcaption>

<blockquote><p>1. That justifying faith, or that faith whereby we are justified, is our receiving of Christ as our Lord and Saviour, trusting in him and yielding obedience to him. 2. That faith, in justifying, is not to be considered as a hand whereby we lay hold on the righteousness of another, or as an instrument, as though righteousness were provided for us and tendered unto us; which would overthrow all necessity of being righteous in ourselves. 3. Nor yet doth faith, repentance, or obedience, procure our justification, or is the efficient or meritorious cause thereof. 4. But the true use of our faith (and repentance), as to our justification before God, is that they are the “causa sine qua non,” or the condition whereby, according to the appointment of God, we come to be justified; and so is imputed to us. 5. That our justification is our absolution from the guilt of sin, and freedom from obnoxiousness unto punishment for it, and nothing else. Our regeneration is the condition of our absolution, and in them both, in several respects, is our righteousness. 6. That the way whereby we come to obtain this absolution is this: Jesus Christ, the only Son of God, being sent by him to reveal his love and grace to lost, sinful mankind, in that work yielding obedience unto God even unto death, was, for a reward of that obedience, exalted, and had divine authority over them for whom he died committed to him to pardon and save them; which accordingly he doth, upon the performance of the condition of faith and obedience by him prescribed to them, at once effecting a universal conditional application of all actually justifying every individual upon the performance of the condition. 7. That as to good works, and their place in this business, Paul speaks of the perfect works of the law and legal manner of justifying, which leave no place for grace or pardon; James, of gospel works of new obedience, which leave place for both. 8. That the denial of our faith and obedience to be the condition of our justification, or the asserting that we are justified by the obedience of Christ imputed to us, is the ready way to overthrow all obedience, and drive all holiness and righteousness out of the world. 9. That, as the beginning, so the continuance of our justification depends on the condition of our faith, repentance, and obedience, which are not fruits consequent of it, but conditions antecedent to it, Socin. Thes. de Justificat. p. 18; Fragm. de Justificat. p. 113. And therefore, in the first place, we are to be solicitous about what is within us, about our sanctification, before our absolution or justification, Socin. Ep. ad Ch. MN. de Fide et Operibus. 10. As to the death of Christ, our sins were the impulsive cause of it, and it was undergone for the forgiveness of sins, and occasioned by them only, and is in some sense the condition of our forgiveness. 11. That absolution and pardon of sin are by no means the immediate effects of the death of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 12 (Edinburgh: T&amp;T Clark, n.d.), 597–601.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. That justifying faith, or that faith whereby we are justified, is our receiving of Christ as our Lord and Saviour, trusting in him and yielding obedience to him. 2. That faith, in justifying, is not to be considered as a hand whereby we lay hold on the righteousness of another, or as an instrument, as though righteousness were provided for us and tendered unto us; which would overthrow all necessity of being righteous in ourselves. 3. Nor yet doth faith, repentance, or obedience, procure our justification, or is the efficient or meritorious cause thereof. 4. But the true use of our faith (and repentance), as to our justification before God, is that they are the “causa sine qua non,” or the condition whereby, according to the appointment of God, we come to be justified; and so is imputed to us. 5. That our justification is our absolution from the guilt of sin, and freedom from obnoxiousness unto punishment for it, and nothing else. Our regeneration is the condition of our absolution, and in them both, in several respects, is our righteousness. 6. That the way whereby we come to obtain this absolution is this: Jesus Christ, the only Son of God, being sent by him to reveal his love and grace to lost, sinful mankind, in that work yielding obedience unto God even unto death, was, for a reward of that obedience, exalted, and had divine authority over them for whom he died committed to him to pardon and save them; which accordingly he doth, upon the performance of the condition of faith and obedience by him prescribed to them, at once effecting a universal conditional application of all actually justifying every individual upon the performance of the condition. 7. That as to good works, and their place in this business, Paul speaks of the perfect works of the law and legal manner of justifying, which leave no place for grace or pardon; James, of gospel works of new obedience, which leave place for both. 8. That the d — John Owen, The Works of John Owen, ed. William H. Goold, vol. 12 (Edinburgh: T&amp;T Clark, n.d.), 597–601.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+That+justifying+faith%2C+or+that+faith+whereby+we+are+justified%2C+is+our+receiving+of+Christ+as+our+Lord+and+Saviour%2C+trusting+in+him+and+yielding+obedience+to+him.+2.+That+faith%2C+in+justifying%2C+is+not+to+be+considered+as+a+hand+whereby+we+lay+hold+on+the+righteousness+of+another%2C+or+as+an+instrument%2C+as+though+righteousness+were+provided+for+us+and+tendered+unto+us%3B+which+would+overthrow+all+necessity+of+being+righteous+in+ourselves.+3.+Nor+yet+doth+faith%2C+repentance%2C+or+obedience%2C+procure+our+justification%2C+or+is+the+efficient+or+meritorious+cause+thereof.+4.+But+the+true+use+of+our+faith+%28and+repentance%29%2C+as+to+our+justification+before+God%2C+is+that+they+are+the+%E2%80%9Ccausa+sine+qua+non%2C%E2%80%9D+or+the+condition+whereby%2C+according+to+the+appointment+of+God%2C+we+come+to+be+justified%3B+and+so+is+imputed+to+us.+5.+That+our+justification+is+our+absolution+from+the+guilt+of+sin%2C+and+freedom+from+obnoxiousness+unto+punishment+for+it%2C+and+nothing+else.+Our+regeneration+is+the+condition+of+our+absolution%2C+and+in+them+both%2C+in+several+respects%2C+is+our+righteousness.+6.+That+the+way+whereby+we+come+to+obtain+this+absolution+is+this%3A+Jesus+Christ%2C+the+only+Son+of+God%2C+being+sent+by+him+to+reveal+his+love+and+grace+to+lost%2C+sinful+mankind%2C+in+that+work+yielding+obedience+unto+God+even+unto+death%2C+was%2C+for+a+reward+of+that+obedience%2C+exalted%2C+and+had+divine+authority+over+them+for+whom+he+died+committed+to+him+to+pardon+and+save+them%3B+which+accordingly+he+doth%2C+upon+the+performance+of+the+condition+of+faith+and+obedience+by+him+prescribed+to+them%2C+at+once+effecting+a+universal+conditional+application+of+all+actually+justifying+every+individual+upon+the+performance+of+the+condition.+7.+That+as+to+good+works%2C+and+their+place+in+this+business%2C+Paul+speaks+of+the+perfect+works+of+the+law+and+legal+manner+of+justifying%2C+which+leave+no+place+for+grace+or+pardon%3B+James%2C+of+gospel+works+of+new+obedience%2C+which+leave+place+for+both.+8.+That+the+denial+of+our+faith+and+obedience+to+be+the+condition+of+our+justification%2C+or+the+asserting+that+we+are+justified+by+the+obedience+of+Christ+imputed+to+us%2C+is+the+ready+way+to+overthrow+all+obedience%2C+and+drive+all+holiness+and+righteousness+out+of+the+world.+9.+That%2C+as+the+beginning%2C+so+the+continuance+of+our+justification+depends+on+the+condition+of+our+faith%2C+repentance%2C+and+obedience%2C+which+are+not+fruits+consequent+of+it%2C+but+conditions+antecedent+to+it%2C+Socin.+Thes.+de+Justificat.+p.+18%3B+Fragm.+de+Justificat.+p.+113.+And+therefore%2C+in+the+first+place%2C+we+are+to+be+solicitous+about+what+is+within+us%2C+about+our+sanctification%2C+before+our+absolution+or+justification%2C+Socin.+Ep.+ad+Ch.+MN.+de+Fide+et+Operibus.+10.+As+to+the+death+of+Christ%2C+our+sins+were+the+impulsive+cause+of+it%2C+and+it+was+undergone+for+the+forgiveness+of+sins%2C+and+occasioned+by+them+only%2C+and+is+in+some+sense+the+condition+of+our+forgiveness.+11.+That+absolution+and+pardon+of+sin+are+by+no+means+the+immediate+effects+of+the+death+of+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+12+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+597%E2%80%93601.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F361678f0fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/361678f0fc.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/09/what-the-socinians-denied-and-taught-on-faith-and-justification/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-f41fa118f0" data-kw="">
<blockquote><p>Nothing within man, and nothing that man can do, either in nature, or by grace, concurreth to the act of justification before God, as any cause thereof, either efficient, material, formal, or final, but faith alone; all other gifts and graces, as hope, love, the fear of God, are necessary to salvation, as signs thereof, and consequents of faith. Nothing in any man concurres to any cause of this work but faith alone. And faith itself is no principal but only an instrumental cause whereby we receive, apprehend, and apply Christ and his righteousness for our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, (1616 edition), 572. Emphasis added.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-3dcf2df3aa" data-kw="">
<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 97–99.</span></figcaption>

C+that+this+is+so+necessary%2C+and+so+connected+with+the+former%2C+that+he+is+deceived+who+boasts+of+that+and+is+destitue+of+this.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Conciliatory+or+Irenical+Animadversions+on+the+Controversies+Agitated+in+Britain%2C+trans.+Thomas+Bell+%28Glasgow%3A+W.+Lang%2C+1807%29%2C+97%E2%80%9399.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3dcf2df3aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3dcf2df3aa.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/09/witsius-works-necessary-evidences-effects-salvation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-897e637887" data-kw="">
<blockquote><p>Our predestination is not wrought in ourselves, but in secret with Him, in His foreknowledge. But we are called by the preaching of repentance. We are justified in the calling of mercy and fear of judgment. He feareth not judgment, who hath previously attained salvation. Being called, we renounce the devil by repentance, that we may not continue under his yoke: being justified, we are healed by mercy, that we may not fear judgment: being glorified, we pass into everlasting life, where we praise God without end.… The verse wherewith this Psalm concludeth is the voice of life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Expositions on the Book of Psalms,” in Saint Augustin: Expositions on the Book of Psalms</cite>, ed. Philip Schaff, trans. A. Cleveland Coxe, vol. 8, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (New York: Christian Literature Company, 1888), 682.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

— Augustine of Hippo, “Expositions on the Book of Psalms,” in Saint Augustin: Expositions on the Book of Psalms, ed. Philip Schaff, trans. A. Cleveland Coxe, vol. 8, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (New York: Christian Literature Company, 1888), 682.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+predestination+is+not+wrought+in+ourselves%2C+but+in+secret+with+Him%2C+in+His+foreknowledge.+But+we+are+called+by+the+preaching+of+repentance.+We+are+justified+in+the+calling+of+mercy+and+fear+of+judgment.+He+feareth+not+judgment%2C+who+hath+previously+attained+salvation.+Being+called%2C+we+renounce+the+devil+by+repentance%2C+that+we+may+not+continue+under+his+yoke%3A+being+justified%2C+we+are+healed+by+mercy%2C+that+we+may+not+fear+judgment%3A+being+glorified%2C+we+pass+into+everlasting+life%2C+where+we+praise+God+without+end.%E2%80%A6+The+verse+wherewith+this+Psalm+concludeth+is+the+voice+of+life+everlasting.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+%E2%80%9CExpositions+on+the+Book+of+Psalms%2C%E2%80%9D+in+Saint+Augustin%3A+Expositions+on+the+Book+of+Psalms%2C+ed.+Philip+Schaff%2C+trans.+A.+Cleveland+Coxe%2C+vol.+8%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+First+Series+%28New+York%3A+Christian+Literature+Company%2C+1888%29%2C+682.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F897e637887.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/897e637887.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/05/augustine-on-justification-salvation-and-assurance/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-13d65c2e21" data-kw="">
<blockquote><p>1. Because we are justified by the object of faith alone, that is by the merits of Christ only, without which we can have no righteousness whatever: for we are justified for Christ’s sake. Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit. All works are excluded from, our justification, yea even faith itself in as far as it is a virtue, or work. 2. Because the act which belongs properly to faith is to apprehend, and apply to itself the righteousness of Christ; indeed, faith is nothing else than the acceptance itself, or the apprehension of the merits of Christ. 3. Because faith alone is the instrument which apprehends the satisfaction of Christ. Hence it is plain, why the exclusive particle only should be added, as it is in the Catechism, and be maintained against the Papist. It is done, 3.1. For the purpose of expressing what Paul affirms when he says: “We are justified freely by his grace, without the deeds of the laws:” And what Christ says; “only believe.” (Rom. 4:24, 28. Mark. 5:36.) 3.2. That all our own works, and merits, as well as those of others, may be excluded as being the cause of our justification, that faith may be understood correlatively. We are justified by faith only, that is, by the merits of Christ alone. 3.3. That not only all our merits, but that even faith itself may be excluded from that which is received by faith; so that when we say, we are justified by faith only, the sense is, that it is not by meriting, but only by receiving; as when it is said, This beggar is enriched only by receiving alms, all works and merits are excluded there from, yea, even the very acceptance of alms, in as far as it is viewed as a merit. It is for this reason, that Paul always says, that we are justified by faith, and through faith, as by an instrument; and never on account of faith, as the Papists will have it, who indeed admit both forms of expression, as if faith might be the application of Christ’s righteousness, and be also at the same time a certain work, or merit, by which we are counted worthy of being declared righteous, which is directly opposed to the very nature of faith. For if we were justified on account of our faith, then faith would no longer be the acceptance of the righteousness of another, but it would be the merit, and cause of our own righteousness; neither would it receive the satisfaction of another, for it would no longer stand in need of it. 3.4. That we may understand the necessity of faith for our justification, and may know that we are justified, not by the merit of faith, but yet just as little without faith, to receive the righteousness of Christ; because it is the province of faith to appropriate this to itself. 3.5. The orthodox Fathers often use the same form of speech, by faith only. Origen writes: “The Apostles say, that the justification OF FAITH ONLY is sufficient, so that if any one ONLY BELIEVES, he may be justified, even though he does not perform any works.” Ambrose says: “They are justified freely, who, with out working or rendering any thing in turn, are justified BY FAITH ONLY as the gift of God.” Again; “How can the Jews suppose that they are justified by the works of the law, seeing they have the justification of Abraham set before them, who was justified, not by the works of the law, but BY FAITH ONLY. The law, therefore, is not necessary, when the sinner is justified before God by FAITH ONLY.” And again. “God has decreed that he who believes in Christ, should be saved without works, receiving the remission of sins freely BY FAITH ONLY.” We are therefore justified by faith only, which means that it is by the merits of Christ alone, apprehended by faith. This we must firmly maintain, and believe: 3.5.1. For the glory of God, that so the sacrifice of Christ may not be impaired. 3.5.2. For our consolation, that we may be assured that our righteousness does not depend upon our works, (for if this were the case we should lose it thousands of times,) but upon the sacrifice and merit of Christ alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Orthodox Doctrine</cite>, (on Heidelberg Catechism 61).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Because we are justified by the object of faith alone, that is by the merits of Christ only, without which we can have no righteousness whatever: for we are justified for Christ’s sake. Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit. All works are excluded from, our justification, yea even faith itself in as far as it is a virtue, or work. 2. Because the act which belongs properly to faith is to apprehend, and apply to itself the righteousness of Christ; indeed, faith is nothing else than the acceptance itself, or the apprehension of the merits of Christ. 3. Because faith alone is the instrument which apprehends the satisfaction of Christ. Hence it is plain, why the exclusive particle only should be added, as it is in the Catechism, and be maintained against the Papist. It is done, 3.1. For the purpose of expressing what Paul affirms when he says: “We are justified freely by his grace, without the deeds of the laws:” And what Christ says; “only believe.” (Rom. 4:24, 28. Mark. 5:36.) 3.2. That all our own works, and merits, as well as those of others, may be excluded as being the cause of our justification, that faith may be understood correlatively. We are justified by faith only, that is, by the merits of Christ alone. 3.3. That not only all our merits, but that even faith itself may be excluded from that which is received by faith; so that when we say, we are justified by faith only, the sense is, that it is not by meriting, but only by receiving; as when it is said, This beggar is enriched only by receiving alms, all works and merits are excluded there from, yea, even the very acceptance of alms, in as far as it is viewed as a merit. It is for this reason, that Paul always says, that we are justified by faith, and through faith, as by an instrument; and never on account of faith, as the Papists will have it, who indeed admit both forms of expression, as if faith might be the application of Christ’s righteousness, and be also at the same time a certain work, or merit, by which we are counted worthy of being declared righteous, which is directly opposed to the very nature of faith. For if we were justified on account of our faith, then faith would no longer be the acceptance of the righteousness of another, but it would be the merit, and cause of our own righteousness; neither would it receive the satisfaction of another, for it would no longer stand in need of it. 3.4. That we may understand the necessity of faith for our justification, and may know that we are justified, not by the merit of faith, but yet just as little without faith, to receive the righteousness of Christ; because it is the province of faith to appropriate this to itself. 3.5. The orthodox Fathers often use the same form of speech, by faith only. Origen writes: “The Apostles say, that the justification OF FAITH ONLY is sufficient, so that if any one ONLY BELIEVES, he may be justified, even though he does not perform any works.” Ambrose says: “They are justified freely, who, with out working or rendering any thing in turn, are justified BY FAITH ONLY as the gift of God.” Again; “How can the Jews suppose that they are justified by the works of the law, seeing they have the justification of Abraham set before them, who was justified, not by the works of the law, but BY FAITH ONLY. The law, therefore, is not necessary, when the sinner is justified before God by FAITH ONLY.” And again. “God has decreed that he who believes in Christ, should be saved without works, receiving the remission of sins freely BY FAITH ONLY.” We are therefore justified by faith only, which means that it is by the merits of Christ alone, apprehended by faith. This we must firmly maintain, and believe: 3.5.1. For the glory of God, that so the sacrifice of Christ may not be impaired. 3.5.2. For our consolation, that we may be assured that our righteousness does not depend upon our works, (for if this were the case we should lose it thousands of times,) but upon the sacrifice and merit of Christ alone.”

— Zacharias Ursinus, Compendium of Orthodox Doctrine, (on Heidelberg Catechism 61).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Because+we+are+justified+by+the+object+of+faith+alone%2C+that+is+by+the+merits+of+Christ+only%2C+without+which+we+can+have+no+righteousness+whatever%3A+for+we+are+justified+for+Christ%E2%80%99s+sake.+Nothing+but+the+merit+of+Christ+can+be+our+righteousness+in+the+sight+of+God%2C+either+as+a+whole%2C+or+a+part+only.+We+are+justified+only+by+believing%2C+and+receiving+the+righteousness+of+another%2C+and+not+by+our+own+works%2C+or+merit.+All+works+are+excluded+from%2C+our+justification%2C+yea+even+faith+itself+in+as+far+as+it+is+a+virtue%2C+or+work.+2.+Because+the+act+which+belongs+properly+to+faith+is+to+apprehend%2C+and+apply+to+itself+the+righteousness+of+Christ%3B+indeed%2C+faith+is+nothing+else+than+the+acceptance+itself%2C+or+the+apprehension+of+the+merits+of+Christ.+3.+Because+faith+alone+is+the+instrument+which+apprehends+the+satisfaction+of+Christ.+Hence+it+is+plain%2C+why+the+exclusive+particle+only+should+be+added%2C+as+it+is+in+the+Catechism%2C+and+be+maintained+against+the+Papist.+It+is+done%2C+3.1.+For+the+purpose+of+expressing+what+Paul+affirms+when+he+says%3A+%E2%80%9CWe+are+justified+freely+by+his+grace%2C+without+the+deeds+of+the+laws%3A%E2%80%9D+And+what+Christ+says%3B+%E2%80%9Conly+believe.%E2%80%9D+%28Rom.+4%3A24%2C+28.+Mark.+5%3A36.%29+3.2.+That+all+our+own+works%2C+and+merits%2C+as+well+as+those+of+others%2C+may+be+excluded+as+being+the+cause+of+our+justification%2C+that+faith+may+be+understood+correlatively.+We+are+justified+by+faith+only%2C+that+is%2C+by+the+merits+of+Christ+alone.+3.3.+That+not+only+all+our+merits%2C+but+that+even+faith+itself+may+be+excluded+from+that+which+is+received+by+faith%3B+so+that+when+we+say%2C+we+are+justified+by+faith+only%2C+the+sense+is%2C+that+it+is+not+by+meriting%2C+but+only+by+receiving%3B+as+when+it+is+said%2C+This+beggar+is+enriched+only+by+receiving+alms%2C+all+works+and+merits+are+excluded+there+from%2C+yea%2C+even+the+very+acceptance+of+alms%2C+in+as+far+as+it+is+viewed+as+a+merit.+It+is+for+this+reason%2C+that+Paul+always+says%2C+that+we+are+justified+by+faith%2C+and+through+faith%2C+as+by+an+instrument%3B+and+never+on+account+of+faith%2C+as+the+Papists+will+have+it%2C+who+indeed+admit+both+forms+of+expression%2C+as+if+faith+might+be+the+application+of+Christ%E2%80%99s+righteousness%2C+and+be+also+at+the+same+time+a+certain+work%2C+or+merit%2C+by+which+we+are+counted+worthy+of+being+declared+righteous%2C+which+is+directly+opposed+to+the+very+nature+of+faith.+For+if+we+were+justified+on+account+of+our+faith%2C+then+faith+would+no+longer+be+the+acceptance+of+the+righteousness+of+another%2C+but+it+would+be+the+merit%2C+and+cause+of+our+own+righteousness%3B+neither+would+it+receive+the+satisfaction+of+another%2C+for+it+would+no+longer+stand+in+need+of+it.+3.4.+That+we+may+understand+the+necessity+of+faith+for+our+justification%2C+and+may+know+that+we+are+justified%2C+not+by+the+merit+of+faith%2C+but+yet+just+as+little+without+faith%2C+to+receive+the+righteousness+of+Christ%3B+because+it+is+the+province+of+faith+to+appropriate+this+to+itself.+3.5.+The+orthodox+Fathers+often+use+the+same+form+of+speech%2C+by+faith+only.+Origen+writes%3A+%E2%80%9CThe+Apostles+say%2C+that+the+justification+OF+FAITH+ONLY+is+sufficient%2C+so+that+if+any+one+ONLY+BELIEVES%2C+he+may+be+justified%2C+even+though+he+does+not+perform+any+works.%E2%80%9D+Ambrose+says%3A+%E2%80%9CThey+are+justified+freely%2C+who%2C+with+out+working+or+rendering+any+thing+in+turn%2C+are+justified+BY+FAITH+ONLY+as+the+gift+of+God.%E2%80%9D+Again%3B+%E2%80%9CHow+can+the+Jews+suppose+that+they+are+justified+by+the+works+of+the+law%2C+seeing+they+have+the+justification+of+Abraham+set+before+them%2C+who+was+justified%2C+not+by+the+works+of+the+law%2C+but+BY+FAITH+ONLY.+The+law%2C+therefore%2C+is+not+necessary%2C+when+the+sinner+is+justified+before+God+by+FAITH+ONLY.%E2%80%9D+And+again.+%E2%80%9CGod+has+decreed+that+he+who+believes+in+Christ%2C+should+be+saved+without+works%2C+receiving+the+remission+of+sins+freely+BY+FAITH+ONLY.%E2%80%9D+We+are+therefore+justified+by+faith+only%2C+which+means+that+it+is+by+the+merits+of+Christ+alone%2C+apprehended+by+faith.+This+we+must+firmly+maintain%2C+and+believe%3A+3.5.1.+For+the+glory+of+God%2C+that+so+the+sacrifice+of+Christ+may+not+be+impaired.+3.5.2.+For+our+consolation%2C+that+we+may+be+assured+that+our+righteousness+does+not+depend+upon+our+works%2C+%28for+if+this+were+the+case+we+should+lose+it+thousands+of+times%2C%29+but+upon+the+sacrifice+and+merit+of+Christ+alone.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Compendium+of+Orthodox+Doctrine%2C+%28on+Heidelberg+Catechism+61%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F13d65c2e21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/13d65c2e21.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/ursinus-on-christs-merits-and-sola-fide/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The doctrine of justification, which now follows, is one of the chief articles of our faith, not only because it treats of those things which are fundamental, but also because it is most frequently called in question by heretics. The controversies between the church and heretics have respect principally to two points: the one is concerning God, and the other concerning the justification of man in the sight of God. And such is the importance of these doctrines that if either one of them be overthrown, the other parts of our faith easily fall to pieces. Hence it becomes necessary for us, to fortify and establish ourselves, especially in these doctrines, against all the assaults of heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-8a8b5c53aa" data-kw="">
<blockquote><p>Christ was given to us by God’s generosity, to be grasped and possessed by us in faith. By partaking of him, we principally receive a double grace: namely, that being reconciled to God through Christ’s blamelessness, we may have in heaven instead of a Judge a gracious Father; and secondly, that sanctified by Christ’s spirit we may cultivate blamelessness and purity of life. Of renewal,1 indeed, the second of these gifts, I have said what seemed sufficient. The theme of justification was therefore more lightly touched upon because it was more to the point to understand first how little devoid of good works is the faith, through which alone we obtain free righteousness by the mercy of God; and what is the nature of the good works of the saints, with which part of this question is concerned. Therefore we must now discuss these matters thoroughly. And we must so discuss them as to bear in mind that this is the main axis (praecipuum…cardinem) on which religion turns,2 so that we devote the greater attention and care to it. For unless you first of all grasp what your relationship to God is, and the nature of his judgment concerning you, you have neither a foundation on which to establish your salvation nor one on which to build piety toward God. But the need to know this will better appear from the knowledge itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.1 (Battles Edition)</span></figcaption>

<blockquote><p>Sanctification, as here described, is the immediate work of God by his Spirit upon our whole nature, proceeding from the peace made for us by Jesus Christ, whereby, being changed into his likeness, we are kept entirely in peace with God, and are preserved unblamable, or in a state of gracious acceptation with him, according to the terms of the covenant, unto the end.</p></blockquote>

<blockquote><p>Question 36. But how are we justified by faith? Answer: Not because of the worthiness of our faith, as if God justifies us because of it, as the Remonstrants would have it, and [as if] faith is here reckoned as a virtue and a remarkable good work, and therefore as the meritorious cause of the same [i.e. of justification]. …Question 38. How should faith here then be understood? Answer: As a hand or instrument, whereby we grab and take hold of the righteousness of the Redeemer, hence the sayings ‘take hold of God’s strength’ Is. 27:5; ‘receiving Jesus’ Jn. 1:12; ‘receiving the gift of righteousness’ Rom 5:17 and Acts 26:18. Question 39. By which analogy do you clear this up? Answer: Of the beggar who would receive alms of the generosity of a rich man, to which he must stretch out the hand, in which case it [i.e. the hand] deserves nothing, but is only the means by which he receives the gift; or alternatively, of one who in the navigation of the sea capsizes and sees a plank, grabs hold of it, and hauls himself onto it, thereby to be spared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henricus-siccama.html">Henricus Siccama</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Kort Begrip der Waare Godtgeleertheit</cite>, Chapter XVI (On Justification) (Trans. Jake Griesel)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Question 36. But how are we justified by faith? Answer: Not because of the worthiness of our faith, as if God justifies us because of it, as the Remonstrants would have it, and [as if] faith is here reckoned as a virtue and a remarkable good work, and therefore as the meritorious cause of the same [i.e. of justification]. …Question 38. How should faith here then be understood? Answer: As a hand or instrument, whereby we grab and take hold of the righteousness of the Redeemer, hence the sayings ‘take hold of God’s strength’ Is. 27:5; ‘receiving Jesus’ Jn. 1:12; ‘receiving the gift of righteousness’ Rom 5:17 and Acts 26:18. Question 39. By which analogy do you clear this up? Answer: Of the beggar who would receive alms of the generosity of a rich man, to which he must stretch out the hand, in which case it [i.e. the hand] deserves nothing, but is only the means by which he receives the gift; or alternatively, of one who in the navigation of the sea capsizes and sees a plank, grabs hold of it, and hauls himself onto it, thereby to be spared.”

<blockquote><p>The Reformed churches have ever considered Christ and justification by faith in his merits, as the great centre of the Christian system. The Oxford Tract writers make the church the main point; the church as an ordinance for conveying life to all its members by means of the sacraments. The church, with them, is the great mediator between God and man, the only authorized channel of divine communication.</p></blockquote>

<blockquote><p>2. He infers a general conclusion, “That a man is justified by faith, without the works of the law,” chap. 3:28. What is meant by “the law,” and what by “the works of the law,” in this discourse of the apostle about our justification, hath been before declared. And if we are justified freely through faith in the blood of Christ, that faith which hath the propitiation of Christ for its especial object, or as it hath so, can take no other grace nor duty into partnership with itself therein; and being so justified as that all such boasting is excluded as necessarily results from any differencing graces or works in ourselves, wherein all the works of the law are excluded, it is certain that it is by faith alone in Christ that we are justified. All works are not only excluded, but the way unto their return is so shut up by the method of the apostle’s discourse, that all the reinforcements which the wit of man can give unto them will never introduce them into our justification before God. 3. He asserts from hence, that we “do not make void the law through grace,” but establish it, verse 31; which, how it is done, and how alone it can be done, hath been before declared. This is the substance of the resolution the apostle gives unto that great inquiry, how a guilty convinced sinner may come to be justified in the sight of God?—“The sovereign grace of God, the mediation of Christ, and faith in the blood of Christ, are all that he requireth thereunto.” And whatever notions men may have about justification in other respects, it will not be safe to venture on any other resolution of this case and inquiry; nor are we wiser than the Holy Ghost. Rom. chap. 4. In the beginning of the fourth chapter he confirms what he had before doctrinally declared, by a signal instance; and this was of the justification of Abraham, who being the father of the faithful, his justification is proposed as the pattern of ours, as he expressly declares, verses 22–24. And some few things I shall observe on this instance in our passage unto the fifth verse, where I shall fix our discourse. 1. He denies that Abraham was justified by works, verse 2. And,—(1.) These works were not those of the Jewish law, which alone some pretend to be excluded from our justification in this place; for they were the works he performed some hundreds of years before the giving of the law at Sinai: wherefore they are the works of his moral obedience unto God that are intended. (2.) Those works must be understood which Abraham had then, when he is said to be justified in the testimony produced unto that purpose; but the works that Abraham then had were works of righteousness, performed in faith and love to God, works of new obedience under the conduct and aids of the Spirit of God, works required in the covenant of grace. These are the works excluded from the justification of Abraham. And these things are plain, express, and evident, not to be eluded by any distinctions or evasions. All Abraham s evangelical works are expressly excluded from his justification before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 313–314.</span></figcaption>

g</a></div>
</figure><figure class="quote" id="q-8e1b9cd757" data-kw="">
<blockquote><p>The sum and whole cause of the writing of this epistle is to prove that a man is justified by faith only; which proposition whoso denieth, to him is not only this epistle and all that Paul writeth, but also the whole Scripture, so locked up, that he shall never understand it to his soul’s health…And by justifying understand no other thing than to be reconciled to God, and to be restored unto his favor, and to have thy sins forgiven thee. And when I say, God juistifieth us, understand thereby that God for Christ’s sake, merits, and deservings only, receiveth us unto His mercy, favour, and grace, and forgiveth us our sins. And when I say, Christ justifieth us, understand thereby that Christ only hath redeemed us, bought, and delivered us out of the wrath of God and damnation, and hath with his works only purchased us the mercy, the favor, and the grace of God, and the forgiveness of our sins. And when I say that faith justified, understand thereby that faith and trust in the truth God and in the mercy promised us for Christ’s sake, and for His deserving and works only, doth quiet the conscience and certify her that our sins be forgiven, and we in the favour of God. Furthermore we set before thine eyes Christ’s own works and thine own works. Christ’s works only justify thee and make satisfaction for thy sin, and not thine own works…For the promise of mercy is made thee for Christ’s work’s sake, and not for thine works’s sake…Finally, that we say, faith only justified, ought to offend no man. for if this be true, that Christ only redeemed us, Christ only bare our sins, make satisfaction for them and purchased us the favor of God; then it must it must needs be true that the trust only in Christ’s deservings and in the promises of God the Father, made to us for Christ’s sake, doth alone quiet the conscience and certify it that the sins are forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface to Romans c. 1526 (Works, 1.508).</span></figcaption>

<blockquote><p>…The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls”

0%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.18.9+%28Battles+edition%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9705ea056a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9705ea056a.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/10/calvin-what-the-law-requires-the-gospel-gives-freely/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-7ab25cec18" data-kw="">
<blockquote><p>When I was a monk, I thought by and by that I was utterly cast away, if at any time I felt the lust of the flesh; that is to say, if I felt any evil motion, fleshly lust, wrath, hatred, or envy against any brother. I assayed many ways to help quieten my conscience but it would not be; for the concupiscence and lust of my flesh did always return, so that I could not rest, but was continually vexed with these thoughts: this without sin though has committed: though are infected with envy, with impatience, and with such other symptoms: therefore thou art entered into this whole order in vain, and all thy good works are unprofitable. If, then, I had rightly understood these sentences of Paul, “The flesh lusteth contrary to the Spirit, and the Spirit contrary to the Flesh, and these two are one against another, so that ye cannot do the things that ye would do;” I should not have so miserably tormented myself, but should have thought and said to myself, as now commonly I do: “Martin, thou shalt not utterly be without sin, for thous hast flesh; thous halt, therefore, feel the battle thereof according to that saying of Paul: ‘The flesh resisteth the Spirit.’ Despair not, therefore, but resist it strongly, and fulfill not the lust thereof. Thus doing, thou are not under the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, (Philadelphia, 1860)</span></figcaption>

nline · Heidelblog</a></div>
</figure><figure class="quote" id="q-157d80b1c4" data-kw="">
<blockquote><p>It must not be omitted, that if any article is stated as necessary to be known, which cannot be understood, unless some other article shall have been previously understood and believed; that other article must also rank among those which are necessary. For example; it is necessary to know that we are saved only by the grace of our Lord Jesus Christ; for the Apostle Paul says, “If any man preach any other gospel unto you than that which we have preached unto you, let him be accursed.” But this can be neither understood nor believed, unless we know that sin has plunged us into so deep an abyss of misery, that our deliverance surpassed our own power, and even the united exertions of all creatures. Thus, from the necessity of the article respecting our deliverance, we strongly infer the necessity of the article respecting our misery. …When any thing, in fine, the necessity of which must have been more doubtful, is expressly represented as necessary to be known; it follows, that a doctrine will also be necessary, the necessity of which we should have been less, or at least not more, disposed to question. To give an instance of this: the Apostle teaches that the article regarding justification by faith in Christ without the works of the law, is necessary, when he asserts that they who are “ignorant of God’s righteousness, and going about to establish their own righteousness, have not submitted themselves to the righteousness of God.” The necessity of this article being thus demonstrated; it unavoidably follows, that it is necessary for us to know also, that, considered in ourselves, we are obnoxious to condemnation and wrath: for this last article is much more evident than the former, and more obvious to every one that is willing to examine himself; nor, without the knowledge of it, can we be induced to seek that righteousness which is in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser vol. 1 (Edinburgh: A. Fullarton &amp; Co., 1823), 25–26.</span></figcaption>

</figure><figure class="quote" id="q-6167a2af9c" data-kw="">
<blockquote><p>Redemption is a real deliverance from the evils of punishment, which is actually nothing but the carrying out of the sentence of justification. For in justification we are pronounced just and awarded the judgement of life. In glorification the life that results from the pronouncement and award is given to us: We have it in actual possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.30.4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

— William Ames, The Marrow of Theology 3rd, 1.30.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRedemption+is+a+real+deliverance+from+the+evils+of+punishment%2C+which+is+actually+nothing+but+the+carrying+out+of+the+sentence+of+justification.+For+in+justification+we+are+pronounced+just+and+awarded+the+judgement+of+life.+In+glorification+the+life+that+results+from+the+pronouncement+and+award+is+given+to+us%3A+We+have+it+in+actual+possession.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology+3rd%2C+1.30.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6167a2af9c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6167a2af9c.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/10/ames-redemption-is-the-execution-of-the-sentence/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-960975c5ef" data-kw="">
<blockquote><p>Since Paul knew that justification of faith is a refuge for those who lack righteousness of their own [cf. Romans chapter 5], he boldly infers that all who are justified by faith are excluded from works righteousness. But since it is certain that this is common to all believers, from this fact Paul with equal assurance determines that no one is justified by works [cf. Romans 3:20]—on the contrary, that men are justified without any help from our works. But it is one thing to discuss what value works have of themselves, another, to weigh in what place they are to be held after faith righteousness has been established. If we are to determine a price for works according to their worth, we say that they are unworthy to come before God’s sight; that man, accordingly, has no works in which to glory before God; that hence, stripped of all help from works, he is justified by faith alone. But we define justification as follows: the sinner, received into communion with Christ, is reconciled to God by his grace, while, cleansed by Christ’s blood, he obtains forgiveness of sins, and clothed with Christ’s righteousness as if it were his own, he stands confident before the heavenly judgment seat. After forgiveness of sins is set forth, the good works that now follow are appraised otherwise than on their own merit. For everything imperfect in them is covered by Christ’s perfection, every blemish or spot is cleansed away by his purity in order not to be brought in question at the divine judgment. Therefore, after the guilt of all transgressions that hinder man from bringing forth anything pleasing to God has been blotted out, and after the fault of imperfection, which habitually defiles even good works, is buried, the good works done by believers are accounted righteous, or, what is the same thing, are reckoned as righteousness [Romans 4:22].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.8 (Battles edn)</span></figcaption>

<blockquote><p>verse 4. That the justification of the law might be fulfilled, etc. They who understand that the renewed, by the Spirit of Christ, fulfil the law, introduce a gloss wholly alien to the meaning of Paul; for the faithful, while they sojourn in this world, never make such a proficiency, as that the justification of the law becomes in them full or complete. This then must be applied to forgiveness; for when the obedience of Christ is accepted for us, the law is satisfied, so that we are counted just. For the perfection which the law demands was exhibited in our flesh, and for this reason — that its rigor should no longer have the power to condemn us. But as Christ communicates his righteousness to none but to those whom he joins to himself by the bond of his Spirit, the work of renewal is again mentioned, lest Christ should be thought to be the minister of sin: for it is the inclination of many so to apply whatever is taught respecting the paternal kindness of God, as to encourage the lasciviousness of the flesh; and some malignantly slander this doctrine, as though it extinquished the desire to live uprightly.</p></blockquote>

<blockquote><p>Verse 4. That the righteousness of the law might be fulfilled in us, &amp;c. This verse expresses the design of God in sending his Son, and in condemning sin the flesh. He did thus condemn it, ἵνα, in order that the righteousness of the law might be fulfilled. The meaning, therefore, of this passage is determined by the view taken of ver. 3. If that verse means, that God, by sending his Son, destroyed sin us, then of course this verse must mean, ‘He destroyed sin, in order that we should fulfil the law;’ i.e. that we should be holy. But if ver. 3 is understood of the sacrificial death of Christ, and of the condemnation of sin him as the substitute of sinners, then this verse must be understood of justification, and not of sanctification. He condemned sin, in order that the demands of the law might be satisfied. This is the view of the passage given even by the majority of the early Fathers, and by almost all evangelical interpreters, including the Reformers. “Qui intelligunt Spiritu Christi renovatos legem implere, commentum a sensu Pauli penitus alienum afferunt; neque enim eo usque proficiunt fideles, quamdia peregrinantur in mundo, ut justificatio legis in illis plena sit, vel integra. Ergo hoc ad veniam referre necesse est; quia, dum nobis accepta fertur Christi obedientia, legi satisfactum est, ut pro justis censeamur.” That this is the true meaning of the passage appears not only from the connection and the course of the argument, but also from the following considerations: 1. It is consistent with the strict and natural meaning of the words. The word δικαίωμα, here used, means, first, something righteous, and then, second, something declared to be righteous and obligatory, an ordinance or precept; and, third, a righteous decision, a just judgment, as when in Rom. 1:29, the heathen are said to know the δικαίωμα, the righteous judgment of God; and, fourth, the act of declaring righteous, justification. In this sense δικαίωμα is antithetical to κατάκριμα. The δικαίωμα τοῦ νόμου, therefore, may mean, the righteous requirement of the law, that which satisfies its demands. In strict accordance therefore with the sense of the words, we may explain the passage to mean, ‘that the demands of the law might be satisfied in us.’ That is, that we might be justified. Christ was condemned, that to us there might be no condemnation. He was made sin, that we might be made righteousness, 2 Cor. 5:21. Or, if we take δικαίωμα in the sense of (Rechtfertigungsurtheil) a declaration of righteousness, an act of justification, the same idea is expressed: ‘Sin was condemned in Christ, in order that the sentence of justification might be fulfilled, or carried into effect in us.’ This is the explanation which Eckermann, Köllner, Philippi, and other modern interpreters adopt. 2. The analogy of Scripture. To make this passage teach the doctrine of subjective justification, that we are freed from condemnation or delivered from the law by our inward sanctification, is to contradict the plain teaching of the Bible, and the whole drift and argument of this epistle. 3. The concluding clause of the verse, (who walk not after the flesh, &amp;c.) demands the interpretation given above. In the other view of the passage, the latter clause is altogether unnecessary. Why should Paul say, that Christ died in order that they should be holy who are holy, i.e. those who walk not after the flesh? On the other hand, the second clause of the verse is specially pertinent, if the first treats of justification. The benefits of Christ’s death are experienced only by those who walk not after the flesh. The gospel is not antinomian. Those only are justified who are also sanctified. Holiness is the fruit and evidence of reconciliation with God. There is no condemnation to those who walk after the Spirit; and the righteousness of the law is fulfilled by those who walk after the Spirit. In both cases, the latter clause is designed to describe the class of persons who are entitled to appropriate to themselves the promise of justification in Christ. 4. Finally, as intimated in the above quotation from Calvin, it is not true that the righteousness of the law, in the sense of complete obedience, is fulfilled in believers. The interpretation which makes the apostle say, that we are delivered from the law by the work of Christ, in order that the complete obedience which the law demands might be rendered by us, supposes what all Scripture and experience contradicts. For an exposition of the last clause of the verse, see ver. 1.</p></blockquote>

<blockquote><p>In this way we can admit not only that there is a partial righteousness in works (as our adversaries maintain), but that they are approved by God as if they were absolutely perfect. If we remember on what foundation this is rested, every difficulty will be solved. The first time when a work begins to be acceptable is when it is received with pardon. And whence pardon, but just because God looks upon us and all that belongs to us as in Christ? Therefore, as we ourselves when ingrafted into Christ appear righteous before God, because our iniquities are covered with his innocence; so our works are, and are deemed righteous, because every thing otherwise defective in them being buried by the purity of Christ is not imputed. Thus we may justly say, that not only ourselves, but our works also, are justified by faith alone. Now, if that righteousness of works, whatever it be, depends on faith and free justification, and is produced by it, it ought to be included under it and, so to speak, made subordinate to it, as the effect to its cause; so far is it from being entitled to be set up to impair or destroy the doctrine of justification. Thus Paul, to prove that our blessedness depends not on our works, but on the mercy of God, makes special use of the words of David, “Blessed is he whose transgression is forgiven, whose sin is covered;” “Blessed is the man unto whom the Lord imputeth not iniquity.” Should any one here obtrude the numberless passages in which blessedness seems to be attributed to works, as, “Blessed is the man that feareth the Lord;” “He that has mercy on the poor, happy is he;” “Blessed is the man that walketh not in the counsel of the ungodly,” and “that endureth temptation;” “Blessed are they that keep judgment,” that are “pure in heart,” “meek,” “merciful,”, they cannot make out that Paul’s doctrine is not true. For seeing that the qualities thus extolled never all so exist in man as to obtain for him the approbation of God, it follows, that man is always miserable until he is exempted from misery by the pardon of his sins. Since, then, all the kinds of blessedness extolled in the Scripture are vain so that man derives no benefit from them until he obtains blessedness by the forgiveness of sins, a forgiveness which makes way for them, it follows that this is not only the chief and highest, but the only blessedness, unless you are prepared to maintain that it is impaired by things which owe their entire existence to it. There is much less to trouble us in the name of righteous which is usually given to believers. I admit that they are so called from the holiness of their lives, but as they rather exert themselves in the study of righteousness than fulfill righteousness itself, any degree of it which they possess must yield to justification by faith, to which it is owing that it is what it is.</p></blockquote>

</figure><figure class="quote" id="q-a17a5aad48" data-kw="">
<blockquote><p>Now he could not mean to contradict himself in saying, “The doers of the law shall be justified,” as if their justification came through their works, and not through grace; since he declares that a man is justified freely by His grace without the works of the law, intending by the term “freely” nothing else than that works do not precede justification. For in another passage he expressly says, “If by grace, then is it no more of works; otherwise grace is no longer grace.” But the statement that “the doers of the law shall be justified” must be so understood, as that we may know that they are not otherwise doers of the law, unless they be justified, so that justification does not subsequently accrue to them as doers of the law, but justification precedes them as doers of the law.</p></blockquote>

</figure><figure class="quote" id="q-7aee18ce20" data-kw="">
<blockquote><p>That they indeed quote Paul in the same sense does them very little good: “The doers of the law, not the hearers, are justified” [Rom. 2:13 p.]. I do not intend to evade the question through Ambrose’s solution: that this was said because fulfillment of the law is faith in Christ.15 For I see this as a mere evasion, quite needless where the way lies open. Here the apostle is casting down the foolish confidence of the Jews, who claimed for themselves the sole knowledge of the law, even while they were its greatest despisers. Lest, then, mere skill in the law should please them so much, he warns that if righteousness be sought from the law, not knowledge but observance of it is sought. We assuredly do not question that the righteousness of the law consists in works, and not even that righteousness consists in the worth and merits of works. But it has not yet been proved that we are justified by works unless they produce some one man who has fulfilled the law. That Paul meant precisely this is sufficiently attested by the context of his utterance. After having condemned Gentiles and Jews together for their unrighteousness, he then gets down to details and says: “Those who have sinned without law will perish without law,” which has reference to the Gentiles; and “those who have sinned in the law will be judged by the law” [Rom. 2:12], which concerns the Jews. Now, since they, winking at their own shortcomings, plumed themselves on the law alone, Paul adds something especially fitting: the law was not laid down merely that men might be made righteous by hearing its voice; but only if and when they obeyed it. It is as if he said: “Do you seek righteousness in the law? Do not claim to have heard it, something of little weight in itself, but bring works whereby you may declare that the law was not laid down for you in vain.” Since they were all lacking in these works, it followed that they were bereft of boasting about the law. Paul’s meaning, then, requires us, rather, to frame the opposite argument: the righteousness of the law lies in perfection of works; no one can boast that he has fulfilled the law through works; consequently, there is no righteousness arising from the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, 3.17.12.</span></figcaption>

<blockquote><p>VERSE 13. For not the hearers of the law. This verse is connected with the last clause of the preceding, and assigns the reason why the Jews shall be judged or punished according to the law; the mere possession or knowledge of the law would not avail, for it is not the hearers, but the doers of the law that are just before God. The expression hearers instead of readers, is explained by the fact that the law was read in the presence of the people, and by hearing rather than by reading, their knowledge of it was obtained. Comp. Matt. 5:21, John 12:34, Gal. 4:21, James 1:22. To be just before God, and to be justified, are the same thing. They are both forensic expressions, and indicate the state rather than the character of those to whom they refer. Those are just in the sight of God, or are justified, who have done what the law requires, and are regarded and treated accordingly; that is, are declared to be free from condemnation, and entitled to the favour of God. In obvious allusion to the opinion, that being a Jew was enough to secure admission to heaven, the apostle says, It is not the hearers but the doers of the law that are justified. He is not speaking of the method of justification available for sinners, as revealed in the gospel, but of the principles of justice which will be applied to all who look to the law for justification. If men rely on works, they must have works; they must be doers of the law; they must satisfy its demands, if they are to be justified by it. For God is just and impartial; he will, as a judge administering the law, judge every man, not according to his privileges, but according to his works and the knowledge of duty which he has possessed. On these principles, it is his very design to show that no flesh living can be justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (Grand Rapids, MI: Louis Kregel, 1882), 81–82.</span></figcaption>

<blockquote><p>…they gloried in the mere knowledge of it: to obviate this mistake, he declares that the hearing of the law or any knowledge of it is of no such consequence, that any one should on that account lay claim to righteousness, but that works must be produced, according to this saying, “He who will do these shall live in them.” The import then of this verse is the following, — “That if righteousness be sought from the law, the law must be fulfilled; for the righteousness of the law consists in the perfection of works.” They who pervert this passage for the purpose of building up justification by works, deserve most fully to be laughed at even by children. It is therefore improper and beyond what is needful, to introduce here a long discussion on the subject, with the view of exposing so futile a sophistry: for the Apostle only urges here on the Jews what he had mentioned, the decision of the law, — That by the law they could not be justified, except they fulfilled the law, that if they transgressed it, a curse was instantly pronounced on them. Now we do not deny but that perfect righteousness is prescribed in the law: but as all are convicted of transgression, we say that another righteousness must be sought. Still more, we can prove from this passage that no one is justified by works; for if they alone are justified by the law who fulfill the law, it follows that no one is justified; for no one can be found who can boast of having fulfilled the law.</p></blockquote>

log.net/2014/05/calvin-on-romans-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>13. But the doers of the Law will be justified. This passage is interpreted in a twofold way by blessed Augustine in chapter 26 of On the Spirit and the Letter. First in this way:The doers of the Law will be justified means that through justification they will become, will be made, what they were not before, doers. Second, and in a better way, will be justified means that they will be looked upon and thought of as righteous, as stated in the gloss. It is sufficiently clear from the preceding (the period 13), “for not the hearers of the Law are righteous before God,” that, if you should ask who else is righteous before God except the hearers, the answer would be: “The doers will be righteous, that is, they will be justified and looked upon as righteous.” Thus Ps. 143:2 says, “for no man living is righteous before Thee,” that is, he is not looked upon as righteous. And below, in Rom. 3:20, we read: “No human being will be justified in his sight by works of the law.” And again Luke 10:29: “And he, desiring to justify himself” (that is, he wanted to declare or to state that he was righteous, and he wanted to absolve himself of sin, as though he did not know who was his neighbor whom he was commanded to love), and similarly in many other places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, 25.184–85.</span></figcaption>

</figure><figure class="quote" id="q-d970ca3fcb" data-kw="">
<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>

<blockquote><p>CHAP. XXXVII. CONCERNING THE SECOND DEGREE OF THE DECLARATION OF GODS LOVE. The second degree, is Justification, whereby such as believe, are accounted just before God, through the obedience of Christ Jesus. 2. Cor. 5. 21. He has made him to be sin for us, who knew no sin: that we should be made the righteousness of God in him. 1. Cor. 1. 30. Rom. 5. 19. As by one man’s disobedience many were made sinners, so by the obedience of one (that is, Jesus Christ) shall many also be made righteous. Quest. Whether did Christ perform full obedience to the Law, for us men alone, or for himself also? Answ. I. Not for himself, as some not rightly would have him: for the flesh of Christ being hypostatically united to the Word, and so in it self fully sanctified, was even from the first moment of conception, most worthy to be blessed with eternal life. Therefore, by all that obedience which he performed after his conception, Christ merited nothing for himself. II. For us, namely, for the faithful, he fulfilled all the righteoussness of the law and hence it is, that he is called the end of the law unto righteousness, to every one who believes, Rom. 10. 4. Here may be objected: I. Christ as he is man, is bound to perform obedience to the law for himself. Answ. He is not bound by nature, but of his own accord: for he was not a mere man, but God and man. And albeit Christ did never suffer nor fulfill the law, but in that flesh which he took upon him; yet by reason of the hypostatical union, this his passion and obedience has respect unto the whole person, considered as God and man, and therefore his obedience was not due on his part, and so was without merit to himself yea, in that the flesh of Christ is united to the person of the Word, and so exalted in dignity and sanctity, above all angels, it may seem to be exempted from this natural obligation of performing the law. II. Object. If then Christ performed the law for us, we are no more bound to the observance of the same: as we do not undergo eternal punishments for our sins, the which Christ in his person did bear upon the cross. Answer. If we keep the same respect of performing obedience to the law, the consequence is very true, otherwise it is not so: for Christ performed obedience to the law for us, as it is the satisfaction of the law: but the faithful they are bound to obedience, not as it is satisfactory, but as it is a document of faith, and a testimony of their gratitude towards God, or a means to edify their neighbours: even as Christ suffering eternal punishments for our sins, we also suffer punishments, as they are either trials, or chastisments unto us. III. Object. The law and justice of God do not togither exact both, namely obedience, and punishment. Answ. In man’s perfect estate, the justice of God requires only obedience: but in his estate corrupted, he requires both obedience, and punishment. Punishment, as the law is violated: Obedience, that legal justice may be performed. Gal. 3. 10. It is therefore plain, that not only Christ’s passion, but also his legal obedience, is our righteousness before God. Justification hath two parts: Remission of sins, and imputation of Christs righteoussness. Remission of sins, is that part of justification, whereby he that believeth, is freed from the guilt and punishment of sin, by the passion of Christ. Col. 1. 21, 22. You has he now reconciled in the body of his flesh thorough death, to make you holy and blameless, and without fault in his sight. 1. Pet. 2. 24. Who, in his own flesh, bore our sins in his body, on the tree, that we being delivered from sin, should live in righteousness, by whose stripes you are healed. Imputation of righteousness, is the other part of justification, whereby such as believe, having the guilt of their sins covered, are accounted just in the sight of God, through Christ’s righteousness. 2. Cor. 5. 21. Psal. 32. 1. Blessed is he, whose wickedness is forgiven, and whose sin is covered. Rom. 4. the whole chapter, where the Apostle repeats imputation eleven times. Phil. 3. 8, 9. I have counted all things loss, and do judge them to be dung, that I might win Christ, and might be found in him, that is, not having my own righteousness that is by the law, but that which is through the faith of Christ, even the righteousness [note] which is of faith. The form of justification, is, as it were, a kind of translation of the believer’s sins to Christ, and again Christ’s righteousness unto the believer, by a reciprocal or mutual imputation. As is apparent in this picture following.</p></blockquote>

<blockquote><p>For the [Mosiac] covenant was a legal covenant solemnly agreed, by which the people were obligated to present, by their own strength, perfect obedience to the Law (Matthew 22). Since the Law is the eternal rule of righteousness in the divine mind to which he wills all rational creatures to be conformed, and eternal life was promised by God to the servants who perfectly obeyed, truly the curse is pronounced upon transgressors. …For this reason also the Apostle says in Romans 10 that the goal of this legal covenant was Christ. And he withdrew nothing from the divine justice expressed in the sanction of the law, already before the same through the Prophet he promised a Mediator, God and Man, who by the his merit the memory of sin will be destroyed and by his efficacy the laws will be inscribed on our hearts. Because the knowledge of him will have been given to us by means of Christ.</p></blockquote>

<blockquote><p>For the hearers of the law,” etc. This anticipates an objection which the Jews might have adduced. As they had heard that the law was the rule of righteousness, (Deuteronomy 4:1) they gloried in the mere knowledge of it: to obviate this mistake, he declares that the hearing of the law or any knowledge of it is of no such consequence, that any one should on that account lay claim to righteousness, but that works must be produced, according to this saying, “He who will do these shall live in them.” The import then of this verse is the following, — “That if righteousness be sought from the law, the law must be fulfilled; for the righteousness of the law consists in the perfection of works.” They who pervert this passage for the purpose of building up justification by works, deserve most fully to be laughed at even by children. It is therefore improper and beyond what is needful, to introduce here a long discussion on the subject, with the view of exposing so futile a sophistry: for the Apostle only urges here on the Jews what he had mentioned, the decision of the law, — That by the law they could not be justified, except they fulfilled the law, that if they transgressed it, a curse was instantly pronounced on them. Now we do not deny but that perfect righteousness is prescribed in the law: but as all are convicted of transgression, we say that another righteousness must be sought. Still more, we can prove from this passage that no one is justified by works; for if they alone are justified by the law who fulfill the law, it follows that no one is justified; for no one can be found who can boast of having fulfilled the law.</p></blockquote>

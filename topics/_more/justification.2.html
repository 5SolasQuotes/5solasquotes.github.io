<blockquote><p>A twofold trial can be entered into by God with man: either by the law (inasmuch as he is viewed as guilty of violating the law by sin and thus comes under the accusation and condemnation of the law); or by the gospel (inasmuch as he is accused by Satan of having violated the gospel covenant and so is supposed to be an unbeliever and impenitent or a hypocrite, who has not testified by works the faith he has professed with his mouth). Now to this twofold trial a twofold justification ought to answer; not in the Romish sense, but in a very different sense. The first is that by which man is absolved from the guilt of sin on account of the righteousness of Christ imputed to us and apprehended by faith; the other is that by which he is freed from the charge of unbelief and hypocrisy and declared to be a true believer and child of God; one who has fulfilled the gospel covenant (if not perfectly as to degree, still sincerely as to parts) and answered to the divine call by the exercise of faith and piety. The first is justification properly so called; the other is only a declaration of it. That is justification of cause a priori; this is justification of sign or of effect a posteriori, declaratively. In that, faith alone can have a place because it alone apprehends the righteousness of Christ, by whose merit we are freed from the condemnation of the law; in this, works also are required as the effects and signs of faith, by which its truth and sincerity are declared against the accusation of unbelief and hypocrisy. For as faith justifies a person, so works justify faith.</p></blockquote>

</figure><figure class="quote" id="q-f0f38d607e" data-kw="">
<blockquote><p>You see that a person is justified by works and not by faith alone.”— James 2:24 It’s not uncommon to hear some people appeal to James 2:24 in order to argue that God saves people by faith plus works. In particular, some argue against the doctrine of justification by faith alone by appealing to this verse. They tend to pit Paul, who writes that we are justified by faith and not works, against James, who apparently writes that we are justified by faith plus works. This raises the question, who is right? What are we to believe? Are Paul and James actually at odds with each other? No, they are not. What Are Paul and James Saying about Justification? Simply put, although they are using the same verb, justification (in Greek it is also the same verb, dikaioō), they are using it differently. Paul is using it in its legal declarative sense, but James is using it in an evidential sense. They are complementing each other, not opposing each other. Questions concerning Paul and James begin with Paul writing in Romans 3–5 about justification as a declarative act of God grounded in the work of Christ and received by faith. James, on the other hand, is writing about sanctification—the gracious work of God that necessarily follows from justification. James’ primary concern is that a person who has been justified will have good works that demonstrate their faith. True saving faith—the instrument of justification (e.g., Rom. 5:1; Eph. 2:8)—necessarily leads to sanctification, and sanctification is evidence of saving faith versus merely a faith that believes in mere knowledge (see James 2:19). Justification and Sanctification—Two Benefits of Salvation in Christ In order to help understand how Paul and James complement one another, there are two important terms to define: justification and sanctification. The Westminster Shorter Catechism provides good and concise definitions of each one.</p></blockquote>

</figure><figure class="quote" id="q-9422a48ce2" data-kw="">
<blockquote><p>But let us leave the philosophers aside. The law itself, which contains the most perfect rule of life, could not, as we said, confer righteousness. Not that there was anything lacking in the law; Moses declared that he set before the people good and evil, life and death. But because of the corruption of our nature, the law was not enough to insure righteousness. Even as Paul taught (Rom. 8:3), the defect was in our flesh, not in the law. When the law speaks, nature drives us in the opposite direction, and our desires break out with the greater force, like untamed wild elephants, against God’s command. Thus the law works wrath rather than righteousness. The law holds all guilty, and by exposing sin takes away from men every excuse. Therefore we must seek another way to righteousness: the way which is in Christ, whom the law itself set forth as its fulfillment. The righteousness of the law said, Who does these commandments, shall live in them (Lev. 18:5). But none did them. Therefore there had to be another righteousness; one that Paul taught, from Moses himself: The word is near, in your mouth and in your heart; this is the word of faith which we preach (Rom. 10:8). It is this doctrine that justifies us—not the bare doctrine, but because it offers us the fruit of Christ’s death, by which our sins are forgiven and we are reconciled to God. For if by faith we grasp this gift, we are counted as righteous before God.</p></blockquote>

22a48ce2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9422a48ce2.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/calvin-leviticus-185-is-law-not-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>[God] himself took on him the burden of our iniquities, he gave his own Son as a ransom for us, the Holy One for transgressors, the blameless one for the wicked, the righteous one for the unrighteous, the incorruptible one for the corruptible, the immortal one for them that are mortal. For what other thing was capable of covering our sins than his righteousness? By what other one was it possible that we, the wicked and ungodly, could be justified, than by the only Son of God? O sweet exchange! O unsearchable operation! O benefits surpassing all expectation! — that the wickedness of many should be hid in a single Righteous One, and that the righteousness of one should justify many transgressors!’</p></blockquote>

</figure><figure class="quote" id="q-64836131a7" data-kw="">
<blockquote><p>I do not make void the grace of God; for if righteousness is through the law, then Christ died in vain” (Galatians 2:21) “I do not make void the grace of God,” says Paul in concluding the report of his speech to Peter; “for if righteousness is through the law, then Christ died in vain.” The “for” here gives a reason for the use of the harsh word “make void”–” ‘make void,’ I say; for that is just the right word, since if Judaizers say, justification comes even in part through our obedience to the law, then Christ died in vain.” This verse is the key verse of the Epistle to the Galatians; it expresses the central thought of the Epistle. The Judiazers attempted to supplement the saving work of Christ by the merit of their own obedience to the law. “That,” says Paul, “is impossible; Christ will do everything or nothing: earn your salvation if your obedience to the law is perfect, or else trust wholly to Christ’s completed work; you cannot do both; you cannot combine merit and grace; if justification even in slightest measure, is through human merit, then Christ died in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on Galatians</cite>, 161.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I do not make void the grace of God; for if righteousness is through the law, then Christ died in vain” (Galatians 2:21) “I do not make void the grace of God,” says Paul in concluding the report of his speech to Peter; “for if righteousness is through the law, then Christ died in vain.” The “for” here gives a reason for the use of the harsh word “make void”–” ‘make void,’ I say; for that is just the right word, since if Judaizers say, justification comes even in part through our obedience to the law, then Christ died in vain.” This verse is the key verse of the Epistle to the Galatians; it expresses the central thought of the Epistle. The Judiazers attempted to supplement the saving work of Christ by the merit of their own obedience to the law. “That,” says Paul, “is impossible; Christ will do everything or nothing: earn your salvation if your obedience to the law is perfect, or else trust wholly to Christ’s completed work; you cannot do both; you cannot combine merit and grace; if justification even in slightest measure, is through human merit, then Christ died in vain.”

<blockquote><p>CHAPTER 31: THE MEANS BY WHICH OBTAIN DIVINE BLESSING Let us cleave then to His blessing, and consider what are the means of possessing it. Let us think over the things which have taken place from the beginning. For what reason was our father Abraham blessed? Was it not because he wrought righteousness and truth through faith? Isaac, with perfect confidence, as if knowing what was to happen, cheerfully yielded himself as a sacrifice. Jacob, through reason of his brother, went forth with humility from his own land, and came to Laban and served him; and there was given to him the scepter of the twelve tribes of Israel. CH 32: WE ARE JUSTIFIED NOT BY OUR OWN WORKS, BUT BY FAITH Whosoever will candidly consider each particular, will recognize the greatness of the gifts which were given by him. For from him have sprung the priests and all the Levites who minister at the altar of God. From him also [was descended] our Lord Jesus Christ according to the flesh. From him [arose] kings, princes, and rulers of the race of Judah. Nor are his other tribes in small glory, inasmuch as God had promised, “Thy seed shall be as the stars of heaven.” All these, therefore, were highly honored, and made great, not for their own sake, or for their own works, or for the righteousness which they wrought, but through the operation of His will. And we, too, being called by His will in Christ Jesus, are not justified by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but by that faith through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.</p></blockquote>

<figure class="quote" id="q-2fe58a00b8" data-kw="">
<blockquote><p>Therefore whoever knows well how to distinguish the Gospel from the Law should give thanks to God and know that he is a real theologian. I admit that in the time of temptation I myself do not know how to do this as I should. The way to distinguish the one from the other is to locate the Gospel in heaven and the Law on earth, to call the righteousness of the Gospel heavenly and divine and the righteousness of the Law earthly and human, and to distinguish as sharply between the righteousness of the Gospel and that of the Law as God distinguishes between heaven and earth or between light and darkness or between day and night. Let the one be like the light and the day, and the other like the darkness and the night. If we could only put an even greater distance between them! Therefore if the issue is faith, heavenly righteousness, or conscience, let us leave the Law out of consideration altogether and let it remain on the earth. But if the issue is works, then let us light the lamp of works and of the righteousness of the Law in the night. So let the sun and the immense light of the Gospel and of grace shine in the day, and let the lamp of the Law shine in the night. These two must be distinguished in your mind in such a way that when your conscience is completely terrified by a sense of sin, you will think of yourself. “At the moment you are busy on earth. Here let the ass work, let him serve and carry the burden that has been laid upon him; that is, let the body and its members be subject to the Law. But when you ascend into heaven, leave the ass with his burdens on earth; for the conscience has no relation to the Law or to works or to earthly righteousness. Thus the ass remains in the valley; but the conscience ascends the mountain with Isaac, knowing absolutely nothing about the Law or its works but looking only to the forgiveness of sins and the pure righteousness offered and given in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Galatians</cite>, On Galatians 2:14 in Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 115–16</span></figcaption>

</figure><figure class="quote" id="q-c085023e56" data-kw="">
<blockquote><p>Whence it follows, that the merit of works ceases when righteousness is sought by faith; for it is necessary that this righteousness should be freely given by God, and offered in his word, in order that any one may possess it by faith. To render this more intelligible, when Moses says that faith was imputed to Abram for righteousness, he does not mean that faith was that first cause of righteousness which is called the efficient, but only the formal cause; as if he had said, that Abram was therefore justified, because, relying on the paternal loving-kindness of God, he trusted to His mere goodness, and not to himself, nor to his own merits. For it is especially to be observed, that faith borrows a righteousness elsewhere, of which we, in ourselves, are destitute; otherwise it would be in vain for Paul to set faith in opposition to works, when speaking of the mode of obtaining righteousness. Besides, the mutual relation between the free promise and faith, leaves no doubt upon the subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the First Book of Moses</cite>, …, 1.407</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-093b114c3a" data-kw="">
<blockquote><p>There is yet something more required; it is not enough that we are not guilty, we must also be actually righteous,—not only all sin is to be answered for, but all righteousness is to be fulfilled. By taking away the guilt of sin, we are as persons innocent; but something more is required to make us to be considered as persons obedient. I know nothing to teach me that an innocent person shall go to heaven, be rewarded, if he be no more but so. Adam was innocent at his first creation, but he was to ‘do this,’ to ‘to keep the commandments,’ before he entered into ‘life:’ he had no title to life by innocency. This, then, moreover, is required, that the whole law be fulfilled, and all the obedience performed that God requires at our hands. This is the soul;s second inquiry; and it finds a resolution only in the Lord Christ: “For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life,’ Rom v. 10. His death reconciled us; then we are saved by his life. The actual obedience which he yielded to the whole law of God, is that righteousness whereby we are saved; if so be we found in him, not having on our own righteousness which is of the law, but the righteousness which is of God by faith. Phil. iii. 9. This I shall have occasion to hand more at large hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 2.105.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

 it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-406050a4e5" data-kw="">
<blockquote><p>In every generation, the doctrine of justification by faith alone comes under attack. As the heart of the gospel, the doctrine of justification is most fundamental to the definition of salvation and any adequate understanding of the atoning work of the Lord Jesus Christ. In our current cultural milieu where orthodox belief is despised and innovation is praised, many have ignored, maligned, or sought to redefine the biblical doctrine of justification by faith alone. Unfortunately, there are even those within more conservative theological domains whose definition of justification by faith falls short of the biblical and reformed doctrine of justification, particularly as defined in the Westminster Standards. To combat these harmful perversions, we here seek to define a clear, confessional polemic that might serve the church as a bulwark to “strengthen what remains.” …We deny that a man’s works, in any way, contribute to his justification, whether before or after believing on Christ in faith.[4] We deny that we are justified by “sanctifying fruit” in addition to faith in the perfection of Christ’s work. Furthermore, we deny that doing such works from a “justified position” qualifies those works to become somehow instrumental in obtaining one’s “final salvation”. …We deny that our deliverance requires the believer’s attainment of two statuses: namely initial justification and final salvation. While we still await the future enactment of our salvation, when the wrath of God against the nations is revealed and his children are brought into the kingdom fully, the ground of that future salvation is entirely present to the individual in the work of the Spirit at the moment of justification.[8] Furthermore, as God himself calls those whom he predestines, justifies those whom he calls, and glorifies those whom he justifies, we deny that any who are predestined, called, or justified may fail to partake of glorification in the end. Thus, we deny that our salvation from the final judgment is established or obtained through the works which proceed from that justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/general-synod-of-the-bible-presbyterian-church.html">General Synod of the Bible Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Resolution on the Doctrine of Justification</cite>, (August 2–6, 2018)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

<blockquote><p>8 Q. Just as there is only one way to salvation, the crucified Christ, there is also only one doctrine of salvation that freely and graciously offers us Christ and all His benefits for our possession. What is this doctrine? A.* The gospel. Because it contains promises of salvation, it is called the gospel of salvation, a word of salvation, and a power of God unto salvation (Rom. 1[:16]). Of course the law leads us by the hand, as it were, to this doctrine. For after we are convicted of our unrighteousness and smitten with the awareness of eternal death, the law teaches us not to seek salvation in ourselves but to accept by faith the salvation offered us outside of ourselves in the gospel. St. Paul speaks of this in Rom. 10[:4]: “The end of the law is Christ for righteousness to every believer.” Also, “The law was our tutor to bring us to Christ” (Gal. 3[:24]). 9 Q. Could you give a more definitive explanation of what the gospel is? A. The gospel, or the good news that delights the heart of the poor condemned sinner, is a revelation of the fatherly and immutable will of God, in which He promised us, who are unworthy, that all our sins have been washed away and pardoned not just for the rest of our lives but, indeed, forever. He carries out this promise by giving His Son to die for us and by raising Him. Since Christ died not in His own sin but in ours (as if He Himself had committed it) and arose out of this same sin as a mighty victor (1 Cor. 15:17), it follows that there is not a single sin of ours for which He has not paid. If even one of all those sins that Christ took upon Himself had not been paid for, He would have had to remain the tomb and could not have risen. For where there is even one sin, there is also eternal death, as God Himself says in Deuteronomy 27. Also, “The wages of sin is death” (Rom. 6[:23]). Since, therefore, Christ arises out of all our sin as a victor in our flesh (which He assumed and forever retains), this is public testimony to us that we are considered as pure and righteous in the eyes of God as Christ Jesus was when He arose from the grave (Rom. 4; 1 Cor. 15:17). Along with that, God through Christ both promises us in the gospel and then actually gives us the Holy Spirit. The Spirit turns our hearts from sin and from the kingdom of the Devil to Himself, bears witness that we are children of God, initiates in us both joy in God and eternal life here below, and brings it to completion in us up in heaven. All of this God freely offers and gives to us in the gospel, without any regard to our past, present, or future merit or piety. He applies it to us by grace through faith, so that whoever boasts, boasts in the Lord (Jer. 9[:24]; 1 Cor. 1[:31]). It can also be described more briefly: the gospel is a revelation of the fatherly and immutable will of God, in which He promises all believers (1) that their sins have been pardoned from eternity and shall be forever forgotten, and (2) that He will freely give them the Holy Spirit and eternal life, without any past, present, or future merit of ours, because of the voluntary sacrifice of this most exalted person, Christ—truly God and truly human. This sacrifice was there before the face of God from eternity, then was promised, and now has been carried out and completed, retaining forever its efficacy for our full redemption (Eph. 1).</p></blockquote>

<blockquote><p>Therefore read these words “me” and “for me” with great emphasis, and accustom yourself to accepting this “me” with a sure faith and applying it to yourself. Do not doubt that you belong to the number of those who speak this “me.” Christ did not love only Peter and Paul and give Himself for them, but the same grace belongs and comes to us as to them; therefore we are included in this “me.” For just as We cannot deny that we are all sinners, and just as we are obliged to say that through his sin Adam destroyed us and made us enemies of God who are liable to God’s wrath and judgment and worthy of eternal death—for all terrified hearts feel and confess this, in fact, more than is proper—so we cannot deny that Christ died for our sins in order that we might be justified. For He did not die to make the righteous righteous; He died to make sinners into righteous men, the friends and sons of God, and heirs of all heavenly gifts. Therefore since I feel and confess that I am a sinner on account of the transgression of Adam, why should I not say that I am righteous on account of the righteousness of Christ, especially when I hear that He loved me and gave Himself for me? Paul believed this most firmly, and therefore he speaks with such πληροφορία [full of assurance].</p></blockquote>

<blockquote><p>II. However, we must premise here that God, the just Judge (dikaiokritēn), cannot pronounce anyone just and give him a right to life except on the ground of some perfect righteousness which has a necessary connection with life; but that righteousness is not of one kind. For as there are two covenants which God willed to make with men—the one legal and the other of grace—so also there is a twofold righteousness—legal and evangelical. Accordingly there is also a double justification or a double method of standing before God in judgment—legal and evangelical. The former consists in one’s own obedience or a perfect conformity with the law, which is in him who is to be justified; the latter in another’s obedience or a perfect observance of the law, which is rendered by a surety in the place of him who is to be justified—the former in us, the latter in Christ. Concerning the first, Paul says, “Not the hearers, but the doers of the law shall be justified” (Rom. 2:13); and “Moses describeth the righteousness which is of the law. That the man which doeth those things shall live by them” (Rom. 10:5). Concerning the other, he says, “The gospel is the power of God unto salvation to every one that believeth, for therein is the righteousness of God revealed from faith to faith: as it is written, The just shall live by faith” (Rom. 1:16, 17); and “Being justified freely by his grace through the redemption that is in Christ Jesus” (Rom. 3:24). Concerning both, he says, “That I may be found in Christ, not having my own righteousness, which is of the law, but that which is through the faith of Christ” (Phil. 3:9; cf. also Rom. 9:30, 31). Hence a twofold justification flows: one in the legal covenant by one’s own righteousness according to the clause, “Do this and live”; the other in the covenant of grace, by another’s righteousness (Christ’s) imputed to us and apprehended by faith according to the clause, “Believe and thou shalt be saved.” Each demands a perfect righteousness. The former requires it in the man to be justified, but the latter admits the vicarious righteousness of a surety. The former could have place in a state of innocence, if Adam had remained innocence. But because after sin it became impossible to man, we must fly to the other (i.e, the gospel), which is founded upon the righteousness of Christ.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“II. However, we must premise here that God, the just Judge (dikaiokritēn), cannot pronounce anyone just and give him a right to life except on the ground of some perfect righteousness which has a necessary connection with life; but that righteousness is not of one kind. For as there are two covenants which God willed to make with men—the one legal and the other of grace—so also there is a twofold righteousness—legal and evangelical. Accordingly there is also a double justification or a double method of standing before God in judgment—legal and evangelical. The former consists in one’s own obedience or a perfect conformity with the law, which is in him who is to be justified; the latter in another’s obedience or a perfect observance of the law, which is rendered by a surety in the place of him who is to be justified—the former in us, the latter in Christ. Concerning the first, Paul says, “Not the hearers, but the doers of the law shall be justified” (Rom. 2:13); and “Moses describeth the righteousness which is of the law. That the man which doeth those things shall live by them” (Rom. 10:5). Concerning the other, he says, “The gospel is the power of God unto salvation to every one that believeth, for therein is the righteousness of God revealed from faith to faith: as it is written, The just shall live by faith” (Rom. 1:16, 17); and “Being justified freely by his grace through the redemption that is in Christ Jesus” (Rom. 3:24). Concerning both, he says, “That I may be found in Christ, not having my own righteousness, which is of the law, but that which is through the faith of Christ” (Phil. 3:9; cf. also Rom. 9:30, 31). Hence a twofold justification flows: one in the legal covenant by one’s own righteousness according to the clause, “Do this and live”; the other in the covenant of grace, by another’s righteousness (Christ’s) imputed to us and apprehended by faith according to the clause, “Believe and thou shalt be saved.” Each demands a perfect righteousness. The former requires it in the man to be justified, but the latter admits the vicarious righteousness of a surety. The former could have place in a state of innocence, if Adam had remained innocence. But because after sin it became impossible to man, we must fly to the other (i.e, the gospel), which is founded upon the righteousness of Christ.”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 16.2.2. (2.637).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+However%2C+we+must+premise+here+that+God%2C+the+just+Judge+%28dikaiokrit%C4%93n%29%2C+cannot+pronounce+anyone+just+and+give+him+a+right+to+life+except+on+the+ground+of+some+perfect+righteousness+which+has+a+necessary+connection+with+life%3B+but+that+righteousness+is+not+of+one+kind.+For+as+there+are+two+covenants+which+God+willed+to+make+with+men%E2%80%94the+one+legal+and+the+other+of+grace%E2%80%94so+also+there+is+a+twofold+righteousness%E2%80%94legal+and+evangelical.+Accordingly+there+is+also+a+double+justification+or+a+double+method+of+standing+before+God+in+judgment%E2%80%94legal+and+evangelical.+The+former+consists+in+one%E2%80%99s+own+obedience+or+a+perfect+conformity+with+the+law%2C+which+is+in+him+who+is+to+be+justified%3B+the+latter+in+another%E2%80%99s+obedience+or+a+perfect+observance+of+the+law%2C+which+is+rendered+by+a+surety+in+the+place+of+him+who+is+to+be+justified%E2%80%94the+former+in+us%2C+the+latter+in+Christ.+Concerning+the+first%2C+Paul+says%2C+%E2%80%9CNot+the+hearers%2C+but+the+doers+of+the+law+shall+be+justified%E2%80%9D+%28Rom.+2%3A13%29%3B+and+%E2%80%9CMoses+describeth+the+righteousness+which+is+of+the+law.+That+the+man+which+doeth+those+things+shall+live+by+them%E2%80%9D+%28Rom.+10%3A5%29.+Concerning+the+other%2C+he+says%2C+%E2%80%9CThe+gospel+is+the+power+of+God+unto+salvation+to+every+one+that+believeth%2C+for+therein+is+the+righteousness+of+God+revealed+from+faith+to+faith%3A+as+it+is+written%2C+The+just+shall+live+by+faith%E2%80%9D+%28Rom.+1%3A16%2C+17%29%3B+and+%E2%80%9CBeing+justified+freely+by+his+grace+through+the+redemption+that+is+in+Christ+Jesus%E2%80%9D+%28Rom.+3%3A24%29.+Concerning+both%2C+he+says%2C+%E2%80%9CThat+I+may+be+found+in+Christ%2C+not+having+my+own+righteousness%2C+which+is+of+the+law%2C+but+that+which+is+through+the+faith+of+Christ%E2%80%9D+%28Phil.+3%3A9%3B+cf.+also+Rom.+9%3A30%2C+31%29.+Hence+a+twofold+justification+flows%3A+one+in+the+legal+covenant+by+one%E2%80%99s+own+righteousness+according+to+the+clause%2C+%E2%80%9CDo+this+and+live%E2%80%9D%3B+the+other+in+the+covenant+of+grace%2C+by+another%E2%80%99s+righteousness+%28Christ%E2%80%99s%29+imputed+to+us+and+apprehended+by+faith+according+to+the+clause%2C+%E2%80%9CBelieve+and+thou+shalt+be+saved.%E2%80%9D+Each+demands+a+perfect+righteousness.+The+former+requires+it+in+the+man+to+be+justified%2C+but+the+latter+admits+the+vicarious+righteousness+of+a+surety.+The+former+could+have+place+in+a+state+of+innocence%2C+if+Adam+had+remained+innocence.+But+because+after+sin+it+became+impossible+to+man%2C+we+must+fly+to+the+other+%28i.e%2C+the+gospel%29%2C+which+is+founded+upon+the+righteousness+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+16.2.2.+%282.637%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1ab262a91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1ab262a91.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/10/turretin-there-is-no-future-justification-by-grace-and-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Verse. 13 For * ‖ not the hearers of the Law are just with God: but the doers of the Law ‖ shall be justified. RHEM. 5. [ 13. Not the hearers] This same sentence agreeable also to Christs words (Mat, 7. 21.) is the very ground of S. James disputation that not faith alone, but good works also do justify, [note] Therefore S. Paul (howsoever some perversely construe his words in other places) meaneth the same that S. James. And here he speaketh * not properly of the first justification, when an Infidel or ill man is made just, who had no acceptable works before to be justified by (of which kind he specially meaneth in other places of this Epistle) but he speaketh of the second justification or increase of former justice, which he that is in Gods grace, daily proceedeth in, by doing all kind of good works, which be justices: and for doing of which, he is just indeed before God, and of this kind doth S. James namely treate. Which is directly against the Heretics of this time, who not only attribute nothing to the works done in sin and infidelity, but esteeme nothing at all of all Christian mens works toward justification and salvation, condemning them unclean, sinful, hypocritical, and Pharisaical: which is directly against these and other Scriptures, and plain blaspheming of Christ and his grace, by whose spirit and cooperation we do them, CARTW. 5 [13. Not the hearers.] And if the wresting of mens words from their honest meaning be a sin worthy of death, what a horrible condemnation waiteth for these Jesuits, that pull and hale the Lords words to a quite contrary meaning then he set them downe. For the Apostle [note] having disputed in the former chapter, that no man hath any righteousness of his owne by any manner of worke. In this second chapter he descendeth to the special cause of the Jews, which of all other might seeme to be exempted from that generallity of Injustice, wherewith he had charged the whole world, the opinion of whose Justice might rise in that they had not only an exact knowledge of the law, in such sort, that every Jew was able after a sort to be a guide unto the blind, and a Doctor to the unlearned: But also for that in some measure of the holy spirit they received, many of [note] them gave their endeavor to do the works of the law, Now the Apostle to throw down this stately &amp; proud Castle of the opinion of their own justice, declareth that the Justification that is of the law, standeth not in the hearing or knowledge of the law, no if (possibly) they could attain the full and perfect knowledge thereof, but in the full and perfect doing and accomplishment thereof, which he doth more expressly set forth to the Galatians, where he requireth to justification by the works [note] of the law a performance of all the commandments, and that constant and perpetual without any intermission or interruption by stepping a hair breadth aside, either on the right hand or on the left. Now that the Apostle meaneth not those only which either heard the law only, or did the outward and civil works of the law, which a mere natural man doth, that but he withal compriseth those which having believed brought forth by the work of the spirit, good fruits; it appeareth diversely. First by the writing of this Epistle, wherein he instructed those that believed in Christ, but not without some wavering in this doctrine which he so largely unfoldeth, as appeareth in that his desire was [note] to come to them, that they might be strengthened. Secondly it appeareth by the testimony of the Prophet Ezechiel, who doth evidently as well by that which goeth before, as by that which cometh after, refer the sentence which the Apostle draweth from him, touching the name of God blasphemed amongst the Gentiles for the Jews sake, unto the true Church and spouse of Christ. And this the floating and unconstant Jesuits have in their marginal note at unawares confessed. wherein they say; It is a great sin that by the evil life of the faithful our Lords name should be evil [note] spoken of. And the example of David, a faithful man, who caused the name of God to be blasphemed, will not suffer us to remaine in any doubt, but that the cause of blaspheming of Gods name may fall into the Church of God. Last of all, this is evident by the examples of Abraham and David, which the [note] Apostle setteth forth. For touching Abraham, he obeying the voice of the Lord when he called him first out of Chaldea, and then out of Charan, must needs even then have faith; yet some years after upon the promise made unto him of the blessed seede received by faith, it is said that his faith did justify him, and not his good works, which he had done very excellent and manifold. So that although he were a doer of the law after he believed, yet still his Justification is placed in faith. This is yet more manifest in the example of David, who having believed, or at least having been sanctified more than 40 years, and done many singular acts of true godliness before his foul crimes, of the murder of many his faithful servants by the sword of the Ammonites, of the adultery with Bathsheba, and finally of the drunkenness that he threw Uriah into, placeth his repaire not as the Jesuits blasphemously do in the [note] satisfaction which is by works, but in faith which believeth and layeth hold of remission of sins by Christ. Whereby appeareth the lewd and blockish answer of the Jesuits, which wrest the Apostles denial of justification by works of the law to those civil works that men either worke by the light and strength of nature, or by a bare knowledge of the law, without any assistance of Gods spirit, and with all their sottish καινοφονία, and newfangled distinction of the first justification by faith alone, and of the second justification by faith and works together is crushed all to pieces; seeing the Apostles ascribeth the justification which men have after they are entered into the way of righteousness, not to works [note] done, either before or after to be done, but unto that faith which being first planted in their hearts after waxeth and groweh to that proportion that the Lord seeth good in his great wisdome to be fit for every one according to the place he occupieth in the body of Christ, and trials that he will prove them with. Hereupon the Apostle in the stairs whereby we orderly come to the kingdom of [note] heaven, doth never set one justification after another, but placeth sanctification after justification. And if this new and unlawful coine of distinction were true, then the sentence of the Apostle, should not have where to set foot, which declareth that as there is but one true body, one spirit whereby [note] that body liveth, one hope of our calling, one true Lord, one lawful baptisme, one true God: so there is but one true and holy faith. Touching Saint James it shall be answered (God willing) in the proper place. As for Augustine, he utterly refuseth to be fraughted with such beggarly merchandise, as you would load him with. But so (saith he) it must be understood that the doers of the law shall be justified, that we may know that they are not otherwise doers of the law, unless they be justified: that justification should not come to the doers of the law, or be an after comer to them, but that justification should go before the doers of the law, which cleane overturneth the Jesuits diversely. First that he maketh the doing of the law to be the effect of justification, which they make the cause, and call it the second Justification. Secondly because he maketh one Justification which always goeth before good works, and is done that we may be fit for good works. So this giveth answere to his words alleged in the next Annotation. For those words meane thus much, that we being just in Christ, because we have in him done the law, must have that grace ere we can do the law, as apeareth first because these words follow upon the former sentence, and is so expounded by the words immediately following. And by this it is as much as if a man would say, they shall be made doers of the law, not that they were, but that they may be, that so the Jews might understand which are the hearers of the law, that they have need of the grace of the just justifier: that they may be doers. For that Augustine doth not acknowledge a second righteousness, whereby a man may be justified, shall once for all appeare by these places following. Every living man justifieth [note] himselfe before himselfe, not before thee. How before himselfe? In pleasing themselves and displeasing thee. But before thee no man is justified. Enter not therefore with me into judgment O Lord my God, how much soever I seem to be righteous. Thou bringest out of thy treasure a rule, which when thou appliest unto me I shall be found nought. And after having noted with thy servant, that all, even the Apostles, after they were Apostles must pray, forgive us our sins. He saith in the end; Let therefore the Apostles say, Let them hardly say forgive us our debts as we forgive our debtors. And when it is said to them why say you so? what be your debts? [note] Let them answere, because no man living shall be justified in thy sight. And in another place he saith; He said not I shall not be able to abide it, but who shall be able to abide it, for that the whole life of man is in a manner barked at by their owne sins, that all consciences are accused by their owne thoughts, that there is not found a chaste heart which presumeth of it owne righteousness. If therefore there is no chaste heart that can presume of it own righteousness, let every mans heart presume of Gods mercy, and let it say unto God; If thou O Lord wilt observe or marke up our iniquities, O Lord who shall abide it? But what hope is there? because with thee there is mercy: And what is this mercy but the sacrifice? And what is the sacrifice but that which was offered for us? even the innocent blood that was shed hath done away all the sins of the guilty: the price only which was given redeemeth all captive from the hands of the enemy that carried them captive. Therefore there is mercy with the Lord: for if there were not mercy with thee: and if thou wilt be nothing else but a Judge, and not merciful, and observe or marke up all our iniquities, and inquire into them, who shall be able to abide it; who should stand and say I am innocent. As for the other trash which they have in their next noteless note. First let the good Reader marke, that they confessing proofe of our part out of the Scripture that to justify is to impute justifice, bring nothing to the reproofe thereof beside their owne barking. For their sottish consequence that God should be either ignorant or unjust, if he should repute him as righteous which is not so, is unworthy any answere: for first he hath Christs righteousness, which being a true and perfect righteousness is as verily his through faith, as if he had done it in his owne person. Secondly, they wickedly speak of a man that being justified by faith, is made a member of the body of Christ; when they say he is wicked, impious and unjust: for although they have remnant of sin them, yet for [note] that the same is not imputed unto them, it is blasphemous against Christ to account his members impious, and to make him a head of any impious body. Thirdly, this is not so much against us as against the Apostle, who speaketh so plainly that God justifieth the wicked, that he loved us when we were his enemies, as we cannot speak plainer. Againe they impudently belie us, when they make the state of the question between us and them; Whither it be more glory to God, and more to the commendation of Christs justice, to call and count an evil man so continuing for just, then by his grace to make him of an evil one just indeed, and so truly to justify him. For they know well that we teach, that the justified man must walk in all the ways and commandments of God, and urge the keeping of the Law much more straightly then they do, which make partly sin no sin, partly make venial sins, which a little holy, or rather harlotry water may take away: yea so we urge it, as we pronounce that they never truly believed, nor were ever justified which remaine in the same wickedness wherein they were when they first obtained mercy. Now take away your slanderous and lying forgery of us, that a man justified by faith remaineth still in impiety. And we boldly affirme that there is more glory to God, and commendation to Christs Justice, to call and account an evil man just; theu to make him of an evil one just, in the works that are done in and by himselfe. And this we say not only as you beggarly Sophisters are wont to do, but with sound and substantial proofe. And first after this sort, it is more to Gods glory, whereby glory is to be taken from men and given unto God, then that whereby glory being added to men is taken from God: But by justification through faith alone, or by imputation, glory is taken from men, and given to God; and contrariwise in justification by the deeds of the law. Wherefore it is more to Gods glory that he justifieth us by faith only then by the works of the law. The first proposition is both evident in itself, and is confirmed by the plaine testimonies of the Apostle. The second is as evident by the same Apostle, who shutteth out glorying from men not by the law of works, but by the law of faith. Where if the Jesuits would run to their old hole, that he meaneth the civil and outward works done of Jews and Gentiles not believing in Christ, their own disciples would hiss and clap their hands against them: for so much as so they should place greater excellency in works done infidelity, than in the faith that is in Christ; considering that the Apostle by that doing of the law there spoken of, affirmeth that more glory is pulled to men from God, then when their justification standeth by faith without works, wherein if there were yet any manner of scruple, yet the same is most evidently remedied of the Apostle, who by and by asking whether faith which he had mentioned in the former words were contrary to that law which likewise he had mentioned before: he (with great detestation) affirmeth, that faith not only doth not make the law void, or is contrary unto it: but that by faith he and all other of his fellows did establish the law. And indeed whither we consider the exact righteousness which God requireth in his law, it was never heretofore, nor ever shall be hereafter, that any the sons of Adam beside Christ, could or can precisely observe the law of God, or whither we consider that the Lord requireth sanctification in some acceptable measure, according to the gifts which he hath dealt to every of the faithful: there could not so much as the least and smallest commandment of God be once with a good heart (I say) not done, but not so much as endeavored by unbelievers, seeing all good works come from faith as the fountaine of them all. Now it is manifest that the faith of Christ is contrary to all such works proceeding from infidelity, as those which are not done of faith, nor proceede from a pure conscience purged by faith. Secondly we say that by our judgment of faith alone in the cause of salvation the justice of God is maintained, which by their fantasy of justification by works of the law is utterly overthrowne. For whilst the redemption and riddance from sin is placed in the death of Christ, and our stole and robe of righteousness, whereby we may confidently stand against the sentence of Gods judgment is placed in the obedience which our Saviour Christ yielded unto God his father in his own person: It is brought to pass that we have both a full &amp; perfect satisfaction for all our sins, and a whole and unmaimed righteousness, against which God in his most exact justice cannot proceede, no more than he can call his owne son unto a second death, or not accept his face, who is the righteousness of God himselfe. On the other side, if he should accept in Christ mens owne satisfaction for their sins, or the worke that they do after they be engraffed in this body of Christ for righteousness. It must necessarily follow, that God should be unjust in both, for he should take that for a perfect satisfaction which is not, (no man being able to make payment for the manifold talents wherewith he is indebted unto God) and that for a perfect and whole righteousness, which hath many transgressions of the law joined therewith: when therefore this justice (wherein his glory consisteth as well as in his mercy) would not suffer him to show mercy without a full recompence for sin, and an exact righteousness of the law: there remained only this way to accord his justice and mercy, and to cause them to embrace one another, that Christ should be both our surety to pay our debts, and our righteousness, by the which we might come into the presence of God. And if this imputative Justice without the works of the law be so strange in your ears; how cometh it to pass that yourselves hold that original sin of infants that are baptized is (without any work of theirs) pardoned in the blood of Christ: If imputation be generally refused in the Scripture, why have you admitted it in the remission of sins? why should you thrust it out in the other part of our salvation, which is righteousuess. And if God may impute mens sins to Christ being just, why may he not impute his righteousness to those that are not in themselves righteous? If therefore the pride of your heart doth carry you away that you will not amend yourselves at our correction, yet suffer yourselves to be corrected by yourselves. Having answered your question tell us we pray you, whether there is more honour to a King in freely forgiving his servant a debt, and giving him forthwith to be rich of; or to give him some means office or occupation, whereby he may in time (if he will) both pay his debt, and grow to wealth again. And for that you would seeme to be jealous of Gods glory, and of the commendation of Christs Justice, tell us further whither we or you shot nearer this mark: we which affirm that we have no manner of ability in ourselves, or by our natural power to do any thing which is good, but only by the grace of God in Christ; or you that affirme that we have some strength of nature in ourselves, which being helped by the grace of God in Christ is able to do the will of God. We which say with the Apostles that naturally we are stark dead; or you that say we are but half dead: we which give greater [note] power unto Christ in the healing of the soul, then to the Physician in healing of the body, or you which give no more unto Christ in healing the soul than is given to Physicians in healing the body: For when as the Physician through his cunning is able to recover a man that is halfe dead by his skill, notwithstanding cannot attaine to the restoring of a man that is dead: By this doctrine of yours you match and mate the Physicians cunning in his faculty, and our Saviour Christs in his. Finally we which make Christ a whole Saviour, or you that make him halfe a Saviour.</p></blockquote>

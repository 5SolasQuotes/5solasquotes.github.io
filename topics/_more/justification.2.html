<div class="actions"><button class="copy" data-copy="“Verse. 13 For * ‖ not the hearers of the Law are just with God: but the doers of the Law ‖ shall be justified. RHEM. 5. [ 13. Not the hearers] This same sentence agreeable also to Christs words (Mat, 7. 21.) is the very ground of S. James disputation that not faith alone, but good works also do justify, [note] Therefore S. Paul (howsoever some perversely construe his words in other places) meaneth the same that S. James. And here he speaketh * not properly of the first justification, when an Infidel or ill man is made just, who had no acceptable works before to be justified by (of which kind he specially meaneth in other places of this Epistle) but he speaketh of the second justification or increase of former justice, which he that is in Gods grace, daily proceedeth in, by doing all kind of good works, which be justices: and for doing of which, he is just indeed before God, and of this kind doth S. James namely treate. Which is directly against the Heretics of this time, who not only attribute nothing to the works done in sin and infidelity, but esteeme nothing at all of all Christian mens works toward justification and salvation, condemning them unclean, sinful, hypocritical, and Pharisaical: which is directly against these and other Scriptures, and plain blaspheming of Christ and his grace, by whose spirit and cooperation we do them, CARTW. 5 [13. Not the hearers.] And if the wresting of mens words from their honest meaning be a sin worthy of death, what a horrible condemnation waiteth for these Jesuits, that pull and hale the Lords words to a quite contrary meaning then he set them downe. For the Apostle [note] having disputed in the former chapter, that no man hath any righteousness of his owne by any manner of worke. In this second chapter he descendeth to the special cause of the Jews, which of all other might seeme to be exempted from that generallity of Injustice, wherewith he had charged the whole world, the opinion of whose Justice might rise in that they had not only an exact knowledge of the law, in such sort, that every Jew was able after a sort to be a guide unto the blind, and a Doctor to the unlearned: But also for that in some measure of the holy spirit they received, many of [note] them gave their endeavor to do the works of the law, Now the Apostle to throw down this stately &amp; proud Castle of the opinion of their own justice, declareth that the Justification that is of the law, standeth not in the hearing or knowledge of the law, no if (possibly) they could attain the full and perfect knowledge thereof, but in the full and perfect doing and accomplishment thereof, which he doth more expressly set forth to the Galatians, where he requireth to justification by the works [note] of the law a performance of all the commandments, and that constant and perpetual without any intermission or interruption by stepping a hair breadth aside, either on the right hand or on the left. Now that the Apostle meaneth not those only which either heard the law only, or did the outward and civil works of the law, which a mere natural man doth, that but he withal compriseth those which having believed brought forth by the work of the spirit, good fruits; it appeareth diversely. First by the writing of this Epistle, wherein he instructed those that believed in Christ, but not without some wavering in this doctrine which he so largely unfoldeth, as appeareth in that his desire was [note] to come to them, that they might be strengthened. Secondly it appeareth by the testimony of the Prophet Ezechiel, who doth evidently as well by that which goeth before, as by that which cometh after, refer the sentence which the Apostle draweth from him, touching the name of God blasphemed amongst the Gentiles for the Jews sake, unto the true Church and spouse of Christ. And this the floating and unconstant Jesuits have in their marginal note at unawares confessed. wherein they say; It is a great sin that by the evil life of the faithful our Lords name should be evil [note] spoken of. And the example of David, a faithful man, who caused the name of God to be blasphemed, will not suffer us to remaine in any doubt, but that the cause of blaspheming of Gods name may fall into the Church of God. Last of all, this is evident by the examples of Abraham and David, which the [note] Apostle setteth forth. For touching Abraham, he obeying the voice of the Lord when he called him first out of Chaldea, and then out of Charan, must needs even then have faith; yet some years after upon the promise made unto him of the blessed seede received by faith, it is said that his faith did justify him, and not his good works, which he had done very excellent and manifold. So that although he were a doer of the law after he believed, yet still his Justification is placed in faith. This is yet more manifest in the example of David, who having believed, or at least having been sanctified more than 40 years, and done many singular acts of true godliness before his foul crimes, of the murder of many his faithful servants by the sword of the Ammonites, of the adultery with Bathsheba, and finally of the drunkenness that he threw Uriah into, placeth his repaire not as the Jesuits blasphemously do in the [note] satisfaction which is by works, but in faith which believeth and layeth hold of remission of sins by Christ. Whereby appeareth the lewd and blockish answer of the Jesuits, which wrest the Apostles denial of justification by works of the law to those civil works that men either worke by the light and strength of nature, or by a bare knowledge of the law, without any assistance of Gods spirit, and with all their sottish καινοφονία, and newfangled distinction of the first justification by faith alone, and of the second justification by faith and works together is crushed all to pieces; seeing the Apostles ascribeth the justification which men have after they are entered into the way of righteousness, not to works [note] done, either before or after to be done, but unto that faith which being first planted in their hearts after waxeth and groweh to that proportion that the Lord seeth good in his great wisdome to be fit for every one according to the place he occupieth in the body of Christ, and trials that he will prove them with. Hereupon the Apostle in the stairs whereby we orderly come to the kingdom of [note] heaven, doth never set one justification after another, but placeth sanctification after justification. And if this new and unlawful coine of distinction were true, then the sentence of the Apostle, should not have where to set foot, which declareth that as there is but one true body, one spirit whereby [note] that body liveth, one hope of our calling, one true Lord, one lawful baptisme, one true God: so there is but one true and holy faith. Touching Saint James it shall be answered (God willing) in the proper place. As for Augustine, he utterly refuseth to be fraughted with such beggarly merchandise, as you would load him with. But so (saith he) it must be understood that the doers of the law shall be justified, that we may know that they are not otherwise doers of the law, unless they be justified: that justification should not come to the doers of the law, or be an after comer to them, but that justification should go before the doers of the law, which cleane overturneth the Jesuits diversely. First that he maketh the doing of the law to be the effect of justification, which they make the cause, and call it the second Justification. Secondly because he maketh one Justification which always goeth before good works, and is done that we may be fit for good works. So this giveth answere to his words alleged in the next Annotation. For those words meane thus much, that we being just in Christ, because we have in him done the law, must have that grace ere we can do the law, as apeareth first because these words follow upon the former sentence, and is so expounded by the words immediately following. And by this it is as much as if a man would say, they shall be made doers of the law, not that they were, but that they may be, that so the Jews might understand which are the hearers of the law, that they have need of the grace of the just justifier: that they may be doers. For that Augustine doth not acknowledge a second righteousness, whereby a man may be justified, shall once for all appeare by these places following. Every living man justifieth [note] himselfe before himselfe, not before thee. How before himselfe? In pleasing themselves and displeasing thee. But before thee no man is justified. Enter not therefore with me into judgment O Lord my God, how much soever I seem to be righteous. Thou bringest out of thy treasure a rule, which when thou appliest unto me I shall be found nought. And after having noted with thy servant, that all, even the Apostles, after they were Apostles must pray, forgive us our sins. He saith in the end; Let therefore the Apostles say, Let them hardly say forgive us our debts as we forgive our debtors. And when it is said to them why say you so? what be your debts? [note] Let them answere, because no man living shall be justified in thy sight. And in another place he saith; He said not I shall not be able to abide it, but who shall be able to abide it, for that the whole life of man is in a manner barked at by their owne sins, that all consciences are accused by their owne thoughts, that there is not found a chaste heart which presumeth of it owne righteousness. If therefore there is no chaste heart that can presume of it own righteousness, let every mans heart presume of Gods mercy, and let it say unto God; If thou O Lord wilt observe or marke up our iniquities, O Lord who shall abide it? But what hope is there? because with thee there is mercy: And what is this mercy but the sacrifice? And what is the sacrifice but that which was offered for us? even the innocent blood that was shed hath done away all the sins of the guilty: the price only which was given redeemeth all captive from the hands of the enemy that carried them captive. Therefore there is mercy with the Lord: for if there were not mercy with thee: and if thou wilt be nothing else but a Judge, and not merciful, and observe or marke up all our iniquities, and inquire into them, who shall be able to abide it; who should stand and say I am innocent. As for the other trash which they have in their next noteless note. First let the good Reader marke, that they confessing proofe of our part out of the Scripture that to justify is to impute justifice, bring nothing to the reproofe thereof beside their owne barking. For their sottish consequence that God should be either ignorant or unjust, if he should repute him as righteous which is not so, is unworthy any answere: for first he hath Christs righteousness, which being a true and perfect righteousness is as verily his through faith, as if he had done it in his owne person. Secondly, they wickedly speak of a man that being justified by faith, is made a member of the body of Christ; when they say he is wicked, impious and unjust: for although they have remnant of sin them, yet for [note] that the same is not imputed unto them, it is blasphemous against Christ to account his members impious, and to make him a head of any impious body. Thirdly, this is not so much against us as against the Apostle, who speaketh so plainly that God justifieth the wicked, that he loved us when we were his enemies, as we cannot speak plainer. Againe they impudently belie us, when they make the state of the question between us and them; Whither it be more glory to God, and more to the commendation of Christs justice, to call and count an evil man so continuing for just, then by his grace to make him of an evil one just indeed, and so truly to justify him. For they know well that we teach, that the justified man must walk in all the ways and commandments of God, and urge the keeping of the Law much more straightly then they do, which make partly sin no sin, partly make venial sins, which a little holy, or rather harlotry water may take away: yea so we urge it, as we pronounce that they never truly believed, nor were ever justified which remaine in the same wickedness wherein they were when they first obtained mercy. Now take away your slanderous and lying forgery of us, that a man justified by faith remaineth still in impiety. And we boldly affirme that there is more glory to God, and commendation to Christs Justice, to call and account an evil man just; theu to make him of an evil one just, in the works that are done in and by himselfe. And this we say not only as you beggarly Sophisters are wont to do, but with sound and substantial proofe. And first after this sort, it is more to Gods glory, whereby glory is to be taken from men and given unto God, then that whereby glory being added to men is taken from God: But by justification through faith alone, or by imputation, glory is taken from men, and given to God; and contrariwise in justification by the deeds of the law. Wherefore it is more to Gods glory that he justifieth us by faith only then by the works of the law. The first proposition is both evident in itself, and is confirmed by the plaine testimonies of the Apostle. The second is as evident by the same Apostle, who shutteth out glorying from men not by the law of works, but by the law of faith. Where if the Jesuits would run to their old hole, that he meaneth the civil and outward works done of Jews and Gentiles not believing in Christ, their own disciples would hiss and clap their hands against them: for so much as so they should place greater excellency in works done infidelity, than in the faith that is in Christ; considering that the Apostle by that doing of the law there spoken of, affirmeth that more glory is pulled to men from God, then when their justification standeth by faith without works, wherein if there were yet any manner of scruple, yet the same is most evidently remedied of the Apostle, who by and by asking whether faith which he had mentioned in the former words were contrary to that law which likewise he had mentioned before: he (with great detestation) affirmeth, that faith not only doth not make the law void, or is contrary unto it: but that by faith he and all other of his fellows did establish the law. And indeed whither we consider the exact righteousness which God requireth in his law, it was never heretofore, nor ever shall be hereafter, that any the sons of Adam beside Christ, could or can precisely observe the law of God, or whither we consider that the Lord requireth sanctification in some acceptable measure, according to the gifts which he hath dealt to every of the faithful: there could not so much as the least and smallest commandment of God be once with a good heart (I say) not done, but not so much as endeavored by unbelievers, seeing all good works come from faith as the fountaine of them all. Now it is manifest that the faith of Christ is contrary to all such works proceeding from infidelity, as those which are not done of faith, nor proceede from a pure conscience purged by faith. Secondly we say that by our judgment of faith alone in the cause of salvation the justice of God is maintained, which by their fantasy of justification by works of the law is utterly overthrowne. For whilst the redemption and riddance from sin is placed in the death of Christ, and our stole and robe of righteousness, whereby we may confidently stand against the sentence of Gods judgment is placed in the obedience which our Saviour Christ yielded unto God his father in his own person: It is brought to pass that we have both a full &amp; perfect satisfaction for all our sins, and a whole and unmaimed righteousness, against which God in his most exact justice cannot proceede, no more than he can call his owne son unto a second death, or not accept his face, who is the righteousness of God himselfe. On the other side, if he should accept in Christ mens owne satisfaction for their sins, or the worke that they do after they be engraffed in this body of Christ for righteousness. It must necessarily follow, that God should be unjust in both, for he should take that for a perfect satisfaction which is not, (no man being able to make payment for the manifold talents wherewith he is indebted unto God) and that for a perfect and whole righteousness, which hath many transgressions of the law joined therewith: when therefore this justice (wherein his glory consisteth as well as in his mercy) would not suffer him to show mercy without a full recompence for sin, and an exact righteousness of the law: there remained only this way to accord his justice and mercy, and to cause them to embrace one another, that Christ should be both our surety to pay our debts, and our righteousness, by the which we might come into the presence of God. And if this imputative Justice without the works of the law be so strange in your ears; how cometh it to pass that yourselves hold that original sin of infants that are baptized is (without any work of theirs) pardoned in the blood of Christ: If imputation be generally refused in the Scripture, why have you admitted it in the remission of sins? why should you thrust it out in the other part of our salvation, which is righteousuess. And if God may impute mens sins to Christ being just, why may he not impute his righteousness to those that are not in themselves righteous? If therefore the pride of your heart doth carry you away that you will not amend yourselves at our correction, yet suffer yourselves to be corrected by yourselves. Having answered your question tell us we pray you, whether there is more honour to a King in freely forgiving his servant a debt, and giving him forthwith to be rich of; or to give him some means office or occupation, whereby he may in time (if he will) both pay his debt, and grow to wealth again. And for that you would seeme to be jealous of Gods glory, and of the commendation of Christs Justice, tell us further whither we or you shot nearer this mark: we which affirm that we have no manner of ability in ourselves, or by our natural power to do any thing which is good, but only by the grace of God in Christ; or you that affirme that we have some strength of nature in ourselves, which being helped by the grace of God in Christ is able to do the will of God. We which say with the Apostles that naturally we are stark dead; or you that say we are but half dead: we which give greater [note] power unto Christ in the healing of the soul, then to the Physician in healing of the body, or you which give no more unto Christ in healing the soul than is given to Physicians in healing the body: For when as the Physician through his cunning is able to recover a man that is halfe dead by his skill, notwithstanding cannot attaine to the restoring of a man that is dead: By this doctrine of yours you match and mate the Physicians cunning in his faculty, and our Saviour Christs in his. Finally we which make Christ a whole Saviour, or you that make him halfe a Saviour.”

— Thomas Cartwright, A Confutation of the Rhemists Translation, Glosses And Annotations On The New Testament, (Leiden, 1618), 331–34.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse.+13+For+%2A+%E2%80%96+not+the+hearers+of+the+Law+are+just+with+God%3A+but+the+doers+of+the+Law+%E2%80%96+shall+be+justified.+RHEM.+5.+%5B+13.+Not+the+hearers%5D+This+same+sentence+agreeable+also+to+Christs+words+%28Mat%2C+7.+21.%29+is+the+very+ground+of+S.+James+disputation+that+not+faith+alone%2C+but+good+works+also+do+justify%2C+%5Bnote%5D+Therefore+S.+Paul+%28howsoever+some+perversely+construe+his+words+in+other+places%29+meaneth+the+same+that+S.+James.+And+here+he+speaketh+%2A+not+properly+of+the+first+justification%2C+when+an+Infidel+or+ill+man+is+made+just%2C+who+had+no+acceptable+works+before+to+be+justified+by+%28of+which+kind+he+specially+meaneth+in+other+places+of+this+Epistle%29+but+he+speaketh+of+the+second+justification+or+increase+of+former+justice%2C+which+he+that+is+in+Gods+grace%2C+daily+proceedeth+in%2C+by+doing+all+kind+of+good+works%2C+which+be+justices%3A+and+for+doing+of+which%2C+he+is+just+indeed+before+God%2C+and+of+this+kind+doth+S.+James+namely+treate.+Which+is+directly+against+the+Heretics+of+this+time%2C+who+not+only+attribute+nothing+to+the+works+done+in+sin+and+infidelity%2C+but+esteeme+nothing+at+all+of+all+Christian+mens+works+toward+justification+and+salvation%2C+condemning+them+unclean%2C+sinful%2C+hypocritical%2C+and+Pharisaical%3A+which+is+directly+against+these+and+other+Scriptures%2C+and+plain+blaspheming+of+Christ+and+his+grace%2C+by+whose+spirit+and+cooperation+we+do+them%2C+CARTW.+5+%5B13.+Not+the+hearers.%5D+And+if+the+wresting+of+mens+words+from+their+honest+meaning+be+a+sin+worthy+of+death%2C+what+a+horrible+condemnation+waiteth+for+these+Jesuits%2C+that+pull+and+hale+the+Lords+words+to+a+quite+contrary+meaning+then+he+set+them+downe.+For+the+Apostle+%5Bnote%5D+having+disputed+in+the+former+chapter%2C+that+no+man+hath+any+righteousness+of+his+owne+by+any+manner+of+worke.+In+this+second+chapter+he+descendeth+to+the+special+cause+of+the+Jews%2C+which+of+all+other+might+seeme+to+be+exempted+from+that+generallity+of+Injustice%2C+wherewith+he+had+charged+the+whole+world%2C+the+opinion+of+whose+Justice+might+rise+in+that+they+had+not+only+an+exact+knowledge+of+the+law%2C+in+such+sort%2C+that+every+Jew+was+able+after+a+sort+to+be+a+guide+unto+the+blind%2C+and+a+Doctor+to+the+unlearned%3A+But+also+for+that+in+some+measure+of+the+holy+spirit+they+received%2C+many+of+%5Bnote%5D+them+gave+their+endeavor+to+do+the+works+of+the+law%2C+Now+the+Apostle+to+throw+down+this+stately+%26+proud+Castle+of+the+opinion+of+their+own+justice%2C+declareth+that+the+Justification+that+is+of+the+law%2C+standeth+not+in+the+hearing+or+knowledge+of+the+law%2C+no+if+%28possibly%29+they+could+attain+the+full+and+perfect+knowledge+thereof%2C+but+in+the+full+and+perfect+doing+and+accomplishment+thereof%2C+which+he+doth+more+expressly+set+forth+to+the+Galatians%2C+where+he+requireth+to+justification+by+the+works+%5Bnote%5D+of+the+law+a+performance+of+all+the+commandments%2C+and+that+constant+and+perpetual+without+any+intermission+or+interruption+by+stepping+a+hair+breadth+aside%2C+either+on+the+right+hand+or+on+the+left.+Now+that+the+Apostle+meaneth+not+those+only+which+either+heard+the+law+only%2C+or+did+the+outward+and+civil+works+of+the+law%2C+which+a+mere+natural+man+doth%2C+that+but+he+withal+compriseth+those+which+having+believed+brought+forth+by+the+work+of+the+spirit%2C+good+fruits%3B+it+appeareth+diversely.+First+by+the+writing+of+this+Epistle%2C+wherein+he+instructed+those+that+believed+in+Christ%2C+but+not+without+some+wavering+in+this+doctrine+which+he+so+largely+unfoldeth%2C+as+appeareth+in+that+his+desire+was+%5Bnote%5D+to+come+to+them%2C+that+they+might+be+strengthened.+Secondly+it+appeareth+by+the+testimony+of+the+Prophet+Ezechiel%2C+who+doth+evidently+as+well+by+that+which+goeth+before%2C+as+by+that+which+cometh+after%2C+refer+the+sentence+which+the+Apostle+draweth+from+him%2C+touching+the+name+of+God+blasphemed+amongst+the+Gentiles+for+the+Jews+sake%2C+unto+the+true+Church+and+spouse+of+Christ.+And+this+the+floating+and+unconstant+Jesuits+have+in+their+marginal+note+at+unawares+confessed.+wherein+they+say%3B+It+is+a+great+sin+that+by+the+evil+life+of+the+faithful+our+Lords+name+should+be+evil+%5Bnote%5D+spoken+of.+And+the+example+of+David%2C+a+faithful+man%2C+who+caused+the+name+of+God+to+be+blasphemed%2C+will+not+suffer+us+to+remaine+in+any+doubt%2C+but+that+the+cause+of+blaspheming+of+Gods+name+may+fall+into+the+Church+of+God.+Last+of+all%2C+this+is+evident+by+the+examples+of+Abraham+and+David%2C+which+the+%5Bnote%5D+Apostle+setteth+forth.+For+touching+Abraham%2C+he+obeying+the+voice+of+the+Lord+when+he+called+him+first+out+of+Chaldea%2C+and+then+out+of+Charan%2C+must+needs+even+then+have+faith%3B+yet+some+years+after+upon+the+promise+made+unto+him+of+the+blessed+seede+received+by+faith%2C+it+is+said+that+his+faith+did+justify+him%2C+and+not+his+good+works%2C+which+he+had+done+very+excellent+and+manifold.+So+that+although+he+were+a+doer+of+the+law+after+he+believed%2C+yet+still+his+Justification+is+placed+in+faith.+This+is+yet+more+manifest+in+the+example+of+David%2C+who+having+believed%2C+or+at+least+having+been+sanctified+more+than+40+years%2C+and+done+many+singular+acts+of+true+godliness+before+his+foul+crimes%2C+of+the+murder+of+many+his+faithful+servants+by+the+sword+of+the+Ammonites%2C+of+the+adultery+with+Bathsheba%2C+and+finally+of+the+drunkenness+that+he+threw+Uriah+into%2C+placeth+his+repaire+not+as+the+Jesuits+blasphemously+do+in+the+%5Bnote%5D+satisfaction+which+is+by+works%2C+but+in+faith+which+believeth+and+layeth+hold+of+remission+of+sins+by+Christ.+Whereby+appeareth+the+lewd+and+blockish+answer+of+the+Jesuits%2C+which+wrest+the+Apostles+denial+of+justification+by+works+of+the+law+to+those+civil+works+that+men+either+worke+by+the+light+and+strength+of+nature%2C+or+by+a+bare+knowledge+of+the+law%2C+without+any+assistance+of+Gods+spirit%2C+and+with+all+their+sottish+%CE%BA%CE%B1%CE%B9%CE%BD%CE%BF%CF%86%CE%BF%CE%BD%E1%BD%B7%CE%B1%2C+and+newfangled+distinction+of+the+first+justification+by+faith+alone%2C+and+of+the+second+justification+by+faith+and+works+together+is+crushed+all+to+pieces%3B+seeing+the+Apostles+ascribeth+the+justification+which+men+have+after+they+are+entered+into+the+way+of+righteousness%2C+not+to+works+%5Bnote%5D+done%2C+either+before+or+after+to+be+done%2C+but+unto+that+faith+which+being+first+planted+in+their+hearts+after+waxeth+and+groweh+to+that+proportion+that+the+Lord+seeth+good+in+his+great+wisdome+to+be+fit+for+every+one+according+to+the+place+he+occupieth+in+the+body+of+Christ%2C+and+trials+that+he+will+prove+them+with.+Hereupon+the+Apostle+in+the+stairs+whereby+we+orderly+come+to+the+kingdom+of+%5Bnote%5D+heaven%2C+doth+never+set+one+justification+after+another%2C+but+placeth+sanctification+after+justification.+And+if+this+new+and+unlawful+coine+of+distinction+were+true%2C+then+the+sentence+of+the+Apostle%2C+should+not+have+where+to+set+foot%2C+which+declareth+that+as+there+is+but+one+true+body%2C+one+spirit+whereby+%5Bnote%5D+that+body+liveth%2C+one+hope+of+our+calling%2C+one+true+Lord%2C+one+lawful+baptisme%2C+one+true+God%3A+so+there+is+but+one+true+and+holy+faith.+Touching+Saint+James+it+shall+be+answered+%28God+willing%29+in+the+proper+place.+As+for+Augustine%2C+he+utterly+refuseth+to+be+fraughted+with+such+beggarly+merchandise%2C+as+you+would+load+him+with.+But+so+%28saith+he%29+it+must+be+understood+that+the+doers+of+the+law+shall+be+justified%2C+that+we+may+know+that+they+are+not+otherwise+doers+of+the+law%2C+unless+they+be+justified%3A+that+justification+should+not+come+to+the+doers+of+the+law%2C+or+be+an+after+comer+to+them%2C+but+that+justification+should+go+before+the+doers+of+the+law%2C+which+cleane+overturneth+the+Jesuits+diversely.+First+that+he+maketh+the+doing+of+the+law+to+be+the+effect+of+justification%2C+which+they+make+the+cause%2C+and+call+it+the+second+Justification.+Secondly+because+he+maketh+one+Justification+which+always+goeth+before+good+works%2C+and+is+done+that+we+may+be+fit+for+good+works.+So+this+giveth+answere+to+his+words+alleged+in+the+next+Annotation.+For+those+words+meane+thus+much%2C+that+we+being+just+in+Christ%2C+because+we+have+in+him+done+the+law%2C+must+have+that+grace+ere+we+can+do+the+law%2C+as+apeareth+first+because+these+words+follow+upon+the+former+sentence%2C+and+is+so+expounded+by+the+words+immediately+following.+And+by+this+it+is+as+much+as+if+a+man+would+say%2C+they+shall+be+made+doers+of+the+law%2C+not+that+they+were%2C+but+that+they+may+be%2C+that+so+the+Jews+might+understand+which+are+the+hearers+of+the+law%2C+that+they+have+need+of+the+grace+of+the+just+justifier%3A+that+they+may+be+doers.+For+that+Augustine+doth+not+acknowledge+a+second+righteousness%2C+whereby+a+man+may+be+justified%2C+shall+once+for+all+appeare+by+these+places+following.+Every+living+man+justifieth+%5Bnote%5D+himselfe+before+himselfe%2C+not+before+thee.+How+before+himselfe%3F+In+pleasing+themselves+and+displeasing+thee.+But+before+thee+no+man+is+justified.+Enter+not+therefore+with+me+into+judgment+O+Lord+my+God%2C+how+much+soever+I+seem+to+be+righteous.+Thou+bringest+out+of+thy+treasure+a+rule%2C+which+when+thou+appliest+unto+me+I+shall+be+found+nought.+And+after+having+noted+with+thy+servant%2C+that+all%2C+even+the+Apostles%2C+after+they+were+Apostles+must+pray%2C+forgive+us+our+sins.+He+saith+in+the+end%3B+Let+therefore+the+Apostles+say%2C+Let+them+hardly+say+forgive+us+our+debts+as+we+forgive+our+debtors.+And+when+it+is+said+to+them+why+say+you+so%3F+what+be+your+debts%3F+%5Bnote%5D+Let+them+answere%2C+because+no+man+living+shall+be+justified+in+thy+sight.+And+in+another+place+he+saith%3B+He+said+not+I+shall+not+be+able+to+abide+it%2C+but+who+shall+be+able+to+abide+it%2C+for+that+the+whole+life+of+man+is+in+a+manner+barked+at+by+their+owne+sins%2C+that+all+consciences+are+accused+by+their+owne+thoughts%2C+that+there+is+not+found+a+chaste+heart+which+presumeth+of+it+owne+righteousness.+If+therefore+there+is+no+chaste+heart+that+can+presume+of+it+own+righteousness%2C+let+every+mans+heart+presume+of+Gods+mercy%2C+and+let+it+say+unto+God%3B+If+thou+O+Lord+wilt+observe+or+marke+up+our+iniquities%2C+O+Lord+who+shall+abide+it%3F+But+what+hope+is+there%3F+because+with+thee+there+is+mercy%3A+And+what+is+this+mercy+but+the+sacrifice%3F+And+what+is+the+sacrifice+but+that+which+was+offered+for+us%3F+even+the+innocent+blood+that+was+shed+hath+done+away+all+the+sins+of+the+guilty%3A+the+price+only+which+was+given+redeemeth+all+captive+from+the+hands+of+the+enemy+that+carried+them+captive.+Therefore+there+is+mercy+with+the+Lord%3A+for+if+there+were+not+mercy+with+thee%3A+and+if+thou+wilt+be+nothing+else+but+a+Judge%2C+and+not+merciful%2C+and+observe+or+marke+up+all+our+iniquities%2C+and+inquire+into+them%2C+who+shall+be+able+to+abide+it%3B+who+should+stand+and+say+I+am+innocent.+As+for+the+other+trash+which+they+have+in+their+next+noteless+note.+First+let+the+good+Reader+marke%2C+that+they+confessing+proofe+of+our+part+out+of+the+Scripture+that+to+justify+is+to+impute+justifice%2C+bring+nothing+to+the+reproofe+thereof+beside+their+owne+barking.+For+their+sottish+consequence+that+God+should+be+either+ignorant+or+unjust%2C+if+he+should+repute+him+as+righteous+which+is+not+so%2C+is+unworthy+any+answere%3A+for+first+he+hath+Christs+righteousness%2C+which+being+a+true+and+perfect+righteousness+is+as+verily+his+through+faith%2C+as+if+he+had+done+it+in+his+owne+person.+Secondly%2C+they+wickedly+speak+of+a+man+that+being+justified+by+faith%2C+is+made+a+member+of+the+body+of+Christ%3B+when+they+say+he+is+wicked%2C+impious+and+unjust%3A+for+although+they+have+remnant+of+sin+them%2C+yet+for+%5Bnote%5D+that+the+same+is+not+imputed+unto+them%2C+it+is+blasphemous+against+Christ+to+account+his+members+impious%2C+and+to+make+him+a+head+of+any+impious+body.+Thirdly%2C+this+is+not+so+much+against+us+as+against+the+Apostle%2C+who+speaketh+so+plainly+that+God+justifieth+the+wicked%2C+that+he+loved+us+when+we+were+his+enemies%2C+as+we+cannot+speak+plainer.+Againe+they+impudently+belie+us%2C+when+they+make+the+state+of+the+question+between+us+and+them%3B+Whither+it+be+more+glory+to+God%2C+and+more+to+the+commendation+of+Christs+justice%2C+to+call+and+count+an+evil+man+so+continuing+for+just%2C+then+by+his+grace+to+make+him+of+an+evil+one+just+indeed%2C+and+so+truly+to+justify+him.+For+they+know+well+that+we+teach%2C+that+the+justified+man+must+walk+in+all+the+ways+and+commandments+of+God%2C+and+urge+the+keeping+of+the+Law+much+more+straightly+then+they+do%2C+which+make+partly+sin+no+sin%2C+partly+make+venial+sins%2C+which+a+little+holy%2C+or+rather+harlotry+water+may+take+away%3A+yea+so+we+urge+it%2C+as+we+pronounce+that+they+never+truly+believed%2C+nor+were+ever+justified+which+remaine+in+the+same+wickedness+wherein+they+were+when+they+first+obtained+mercy.+Now+take+away+your+slanderous+and+lying+forgery+of+us%2C+that+a+man+justified+by+faith+remaineth+still+in+impiety.+And+we+boldly+affirme+that+there+is+more+glory+to+God%2C+and+commendation+to+Christs+Justice%2C+to+call+and+account+an+evil+man+just%3B+theu+to+make+him+of+an+evil+one+just%2C+in+the+works+that+are+done+in+and+by+himselfe.+And+this+we+say+not+only+as+you+beggarly+Sophisters+are+wont+to+do%2C+but+with+sound+and+substantial+proofe.+And+first+after+this+sort%2C+it+is+more+to+Gods+glory%2C+whereby+glory+is+to+be+taken+from+men+and+given+unto+God%2C+then+that+whereby+glory+being+added+to+men+is+taken+from+God%3A+But+by+justification+through+faith+alone%2C+or+by+imputation%2C+glory+is+taken+from+men%2C+and+given+to+God%3B+and+contrariwise+in+justification+by+the+deeds+of+the+law.+Wherefore+it+is+more+to+Gods+glory+that+he+justifieth+us+by+faith+only+then+by+the+works+of+the+law.+The+first+proposition+is+both+evident+in+itself%2C+and+is+confirmed+by+the+plaine+testimonies+of+the+Apostle.+The+second+is+as+evident+by+the+same+Apostle%2C+who+shutteth+out+glorying+from+men+not+by+the+law+of+works%2C+but+by+the+law+of+faith.+Where+if+the+Jesuits+would+run+to+their+old+hole%2C+that+he+meaneth+the+civil+and+outward+works+done+of+Jews+and+Gentiles+not+believing+in+Christ%2C+their+own+disciples+would+hiss+and+clap+their+hands+against+them%3A+for+so+much+as+so+they+should+place+greater+excellency+in+works+done+infidelity%2C+than+in+the+faith+that+is+in+Christ%3B+considering+that+the+Apostle+by+that+doing+of+the+law+there+spoken+of%2C+affirmeth+that+more+glory+is+pulled+to+men+from+God%2C+then+when+their+justification+standeth+by+faith+without+works%2C+wherein+if+there+were+yet+any+manner+of+scruple%2C+yet+the+same+is+most+evidently+remedied+of+the+Apostle%2C+who+by+and+by+asking+whether+faith+which+he+had+mentioned+in+the+former+words+were+contrary+to+that+law+which+likewise+he+had+mentioned+before%3A+he+%28with+great+detestation%29+affirmeth%2C+that+faith+not+only+doth+not+make+the+law+void%2C+or+is+contrary+unto+it%3A+but+that+by+faith+he+and+all+other+of+his+fellows+did+establish+the+law.+And+indeed+whither+we+consider+the+exact+righteousness+which+God+requireth+in+his+law%2C+it+was+never+heretofore%2C+nor+ever+shall+be+hereafter%2C+that+any+the+sons+of+Adam+beside+Christ%2C+could+or+can+precisely+observe+the+law+of+God%2C+or+whither+we+consider+that+the+Lord+requireth+sanctification+in+some+acceptable+measure%2C+according+to+the+gifts+which+he+hath+dealt+to+every+of+the+faithful%3A+there+could+not+so+much+as+the+least+and+smallest+commandment+of+God+be+once+with+a+good+heart+%28I+say%29+not+done%2C+but+not+so+much+as+endeavored+by+unbelievers%2C+seeing+all+good+works+come+from+faith+as+the+fountaine+of+them+all.+Now+it+is+manifest+that+the+faith+of+Christ+is+contrary+to+all+such+works+proceeding+from+infidelity%2C+as+those+which+are+not+done+of+faith%2C+nor+proceede+from+a+pure+conscience+purged+by+faith.+Secondly+we+say+that+by+our+judgment+of+faith+alone+in+the+cause+of+salvation+the+justice+of+God+is+maintained%2C+which+by+their+fantasy+of+justification+by+works+of+the+law+is+utterly+overthrowne.+For+whilst+the+redemption+and+riddance+from+sin+is+placed+in+the+death+of+Christ%2C+and+our+stole+and+robe+of+righteousness%2C+whereby+we+may+confidently+stand+against+the+sentence+of+Gods+judgment+is+placed+in+the+obedience+which+our+Saviour+Christ+yielded+unto+God+his+father+in+his+own+person%3A+It+is+brought+to+pass+that+we+have+both+a+full+%26+perfect+satisfaction+for+all+our+sins%2C+and+a+whole+and+unmaimed+righteousness%2C+against+which+God+in+his+most+exact+justice+cannot+proceede%2C+no+more+than+he+can+call+his+owne+son+unto+a+second+death%2C+or+not+accept+his+face%2C+who+is+the+righteousness+of+God+himselfe.+On+the+other+side%2C+if+he+should+accept+in+Christ+mens+owne+satisfaction+for+their+sins%2C+or+the+worke+that+they+do+after+they+be+engraffed+in+this+body+of+Christ+for+righteousness.+It+must+necessarily+follow%2C+that+God+should+be+unjust+in+both%2C+for+he+should+take+that+for+a+perfect+satisfaction+which+is+not%2C+%28no+man+being+able+to+make+payment+for+the+manifold+talents+wherewith+he+is+indebted+unto+God%29+and+that+for+a+perfect+and+whole+righteousness%2C+which+hath+many+transgressions+of+the+law+joined+therewith%3A+when+therefore+this+justice+%28wherein+his+glory+consisteth+as+well+as+in+his+mercy%29+would+not+suffer+him+to+show+mercy+without+a+full+recompence+for+sin%2C+and+an+exact+righteousness+of+the+law%3A+there+remained+only+this+way+to+accord+his+justice+and+mercy%2C+and+to+cause+them+to+embrace+one+another%2C+that+Christ+should+be+both+our+surety+to+pay+our+debts%2C+and+our+righteousness%2C+by+the+which+we+might+come+into+the+presence+of+God.+And+if+this+imputative+Justice+without+the+works+of+the+law+be+so+strange+in+your+ears%3B+how+cometh+it+to+pass+that+yourselves+hold+that+original+sin+of+infants+that+are+baptized+is+%28without+any+work+of+theirs%29+pardoned+in+the+blood+of+Christ%3A+If+imputation+be+generally+refused+in+the+Scripture%2C+why+have+you+admitted+it+in+the+remission+of+sins%3F+why+should+you+thrust+it+out+in+the+other+part+of+our+salvation%2C+which+is+righteousuess.+And+if+God+may+impute+mens+sins+to+Christ+being+just%2C+why+may+he+not+impute+his+righteousness+to+those+that+are+not+in+themselves+righteous%3F+If+therefore+the+pride+of+your+heart+doth+carry+you+away+that+you+will+not+amend+yourselves+at+our+correction%2C+yet+suffer+yourselves+to+be+corrected+by+yourselves.+Having+answered+your+question+tell+us+we+pray+you%2C+whether+there+is+more+honour+to+a+King+in+freely+forgiving+his+servant+a+debt%2C+and+giving+him+forthwith+to+be+rich+of%3B+or+to+give+him+some+means+office+or+occupation%2C+whereby+he+may+in+time+%28if+he+will%29+both+pay+his+debt%2C+and+grow+to+wealth+again.+And+for+that+you+would+seeme+to+be+jealous+of+Gods+glory%2C+and+of+the+commendation+of+Christs+Justice%2C+tell+us+further+whither+we+or+you+shot+nearer+this+mark%3A+we+which+affirm+that+we+have+no+manner+of+ability+in+ourselves%2C+or+by+our+natural+power+to+do+any+thing+which+is+good%2C+but+only+by+the+grace+of+God+in+Christ%3B+or+you+that+affirme+that+we+have+some+strength+of+nature+in+ourselves%2C+which+being+helped+by+the+grace+of+God+in+Christ+is+able+to+do+the+will+of+God.+We+which+say+with+the+Apostles+that+naturally+we+are+stark+dead%3B+or+you+that+say+we+are+but+half+dead%3A+we+which+give+greater+%5Bnote%5D+power+unto+Christ+in+the+healing+of+the+soul%2C+then+to+the+Physician+in+healing+of+the+body%2C+or+you+which+give+no+more+unto+Christ+in+healing+the+soul+than+is+given+to+Physicians+in+healing+the+body%3A+For+when+as+the+Physician+through+his+cunning+is+able+to+recover+a+man+that+is+halfe+dead+by+his+skill%2C+notwithstanding+cannot+attaine+to+the+restoring+of+a+man+that+is+dead%3A+By+this+doctrine+of+yours+you+match+and+mate+the+Physicians+cunning+in+his+faculty%2C+and+our+Saviour+Christs+in+his.+Finally+we+which+make+Christ+a+whole+Saviour%2C+or+you+that+make+him+halfe+a+Saviour.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+Confutation+of+the+Rhemists+Translation%2C+Glosses+And+Annotations+On+The+New+Testament%2C+%28Leiden%2C+1618%29%2C+331%E2%80%9334.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F823c0ad173.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/823c0ad173.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/10/thomas-cartwright-contra-rome-on-romans-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>9 Q. Could you give a more definitive explanation of what the gospel is? A. The gospel, or the good news that delights the heart of the poor condemned sinner, is a revelation of the fatherly and immutable will of God, in which He promised us, who are unworthy, that all our sins have been washed away and pardoned not just for the rest of our lives but, indeed, forever. He carries out this promise by giving His Son to die for us and by raising Him. Since Christ died not in His own sin but in ours (as if He Himself had committed it) and arose out of this same sin as a mighty victor (1 Cor. 15:17), it follows that there is not a single sin of ours for which He has not paid. If even one of all those sins that Christ took upon Himself had not been paid for, He would have had to remain the tomb and could not have risen. For where there is even one sin, there is also eternal death, as God Himself says in Deuteronomy 27. Also, “The wages of sin is death” (Rom. 6[:23]). Since, therefore, Christ arises out of all our sin as a victor in our flesh (which He assumed and forever retains), this is public testimony to us that we are considered as pure and righteous in the eyes of God as Christ Jesus was when He arose from the grave (Rom. 4; 1 Cor. 15:17). Along with that, God through Christ both promises us in the gospel and then actually gives us the Holy Spirit. The Spirit turns our hearts from sin and from the kingdom of the Devil to Himself, bears witness that we are children of God, initiates in us both joy in God and eternal life here below, and brings it to completion in us up in heaven. All of this God freely offers and gives to us in the gospel, without any regard to our past, present, or future merit or piety. He applies it to us by grace through faith, so that whoever boasts, boasts in the Lord (Jer. 9[:24]; 1 Cor. 1[:31]). It can also be described more briefly: the gospel is a revelation of the fatherly and immutable will of God, in which He promises all believers (1) that their sins have been pardoned from eternity and shall be forever forgotten, and (2) that He will freely give them the Holy Spirit and eternal life, without any past, present, or future merit of ours, because of the voluntary sacrifice of this most exalted person, Christ—truly God and truly human. This sacrifice was there before the face of God from eternity, then was promised, and now has been carried out and completed, retaining forever its efficacy for our full redemption (Eph. 1).</p></blockquote>

<blockquote><p>Now take both Laws, the Ceremonial Law and the Moral Law or the Decalog. Imagine that by the merit of congruity you have made so much progress that the Spirit has been granted to you and that you have love. Of course, all this would be a monstrosity and cannot be found anywhere in the nature of things. But imagine, I say, that, by doing what lies within you, you acquire grace, are righteous, and have the Spirit. On what basis? On the basis of the merit of congruity? Then you do not need Christ, but He has become useless to you and died to no purpose.</p></blockquote>

<blockquote><p>I. As in the chain of salvation justification follows calling (Rom. 8:30) and is everywhere set forth as the primary effect of faith, the topic concerning calling and faith begets the topic concerning justification. This must be handled with the greater care and accuracy as this saving doctrine is of the greatest importance in religion. It is called by Luther “the article of a standing and a falling church” (Articulus stantis, et cadentis Ecclesiae).1 By other Christians, it is termed the characteristic and basis of Christianity—not without reason—the principal rampart of the Christian religion. This being adulterated or subverted, it is impossible to retain purity of doctrine in other places. Hence Satan in every way has endeavored to corrupt this doctrine in all ages, as has been done especially in the papacy. For this reason, it is deservedly placed among the primary causes of our secession from the Roman church and of the Reformation. 1 Luther said things like this but in this form, the saying has been traced to the Reformed theologian J. H. Alsted (1618).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 16.1.1 (p. 633).</span></figcaption>

<blockquote><p>Take note, therefore, of a new righteousness and a new definition of righteousness. For one usually says: “Righteousness is the virtue that renders to everyone his due.” Here it is stated that righteousness is faith in Jesus Christ or the virtue by which one believes in Jesus Christ, as in Rom. 10:10: “With the heart man believes unto righteousness”; that is, if anyone wants to be righteous, it is necessary for him to believe in Christ with his heart. And in the third chapter St. Jerome says: “Well put is that true statement of a wise man that the believer does not live as the result of righteousness but is righteous by faith.” A beautiful statement indeed! It follows now that the man who is righteous through faith does not through himself give to anyone what is his; he does this through Another, namely, Jesus Christ, who alone is so righteous as to render to all what should be rendered them. As a matter of fact, they owe everything to Him. But he who believes in Christ and by the spirit of faith has become one with Him not only renders satisfaction now to all but also brings it about that they owe everything to him, since he has all things in common with Christ. His sins are no longer his; they are Christ’s. But in Christ sins are unable to overcome righteousness. In fact, they themselves are overcome. Hence they are destroyed in him. Again, Christ’s righteousness now belongs not only to Christ; it belongs to His Christian. Therefore the Christian cannot owe anything to anyone or be oppressed by his sins, since he is supported by such great righteousness.</p></blockquote>

<blockquote><p>Ver. 5. “For Moses,” he says, “describeth the righteousness which is of the Law.” What he means is this. Moses showeth us the righteousness ensuing from the Law, what sort it is of, and whence. What sort is it then of, and what does it consist in? In fulfilling the commandments. “He (R. T. the man), that doeth these things,” He says, “shall live by (or in), them.” (Lev. 18:5.) And there is no other way of becoming righteous in the Law save by fulfilling the whole of it. But this has not been possible for any one, and therefore this righteousness has failed them. (διαπέπτωκεν). But tell us, Paul, of the other righteousness also, that which is of grace. What is that then, and of what does it consist? Hear the words in which he gives a clear sketch of it. For after he had refuted the other, he next goes on to this, and says, Ver. 6, 7, 8, 9. “But the righteousness which is of faith speaketh on this wise, Say not in thine heart, Who shall ascend into heaven (that is, to bring Christ down from above): or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.) But what saith it? The word is nigh thee, even in thy mouth, and in thy heart, that is, the word of faith which we preach. That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised Him from the dead, thou shalt be saved. To prevent the Jews then from saying, How came they who had not found the lesser righteousness to find the greater? he gives a reason there was no answering, that this way was easier than that. For that requires the fulfilment of all things (for when thou doest all, then thou shalt live); but the righteousness which is of faith doth not say this, but what? “If thou confess with thy mouth the Lord Jesus, and believe in thy heart that God hath raised Him from the dead, thou shalt be saved.” Then again that we may not seem to be making it contemptible by showing it to be easy and cheap, observe how he expands his account of it. For he does not come immediately to the words just given, but what does he say? “But the righteousness which is of faith saith on this wise; Say not in thine heart, Who shall go up into heaven? (that is, to bring Christ down); or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.”) For as to the virtue manifested in works there is opposed a listlessness, which relaxeth our labors,3 and it requireth a very wakeful soul not to yield to it: thus, when one is required to believe, there are reasonings which confuse and make havoc of the minds of most men, and it wants a soul of some vigor to shake them thoroughly off. And this is just why he brings the same before one. And as he did in Abraham’s case, so he does here also. For having there shown that he was justified by faith, lest he should seem to have gotten so great a crown by a mere chance, as if it were a thing of no account, to extol the nature of faith, he says, “Who against hope believed in hope, that he might become the father of many nations. And being not weak in faith, he considered his own body now dead, and the deadness of Sarah’s womb. He staggered not at the promise of God through unbelief; but was strong in faith, giving glory to God; and being fully persuaded that what He had promised He was able also to perform” (Rom. 4:18–21): so he showed that there is need of vigor, and a lofty soul, that takes in things beyond expectation, and stumbles not at appearances. This then he does here also, and shows that it requires a wise mind, and a spirit heavenly (Gr. heaven-reaching) and great. And he does not say merely, “Say not,” but, “Say not in thine heart,” that is, do not so much as think of doubting and saying with thyself, And how can this be? You see that this is a chief characteristic of faith, to leave all the consequences of this lower world, and so to seek for that which is above nature, and to cast out the feebleness of calculation, and so to accept everything from the Power of God. The Jews, however, did not merely assert this, but that it was not possible to be justified by faith. But himself turns even what had taken place to another account, that having shown the thing to be so great, that even after it had taken place it required faith, he might seem with good reason to bestow a crown on these: and he uses the words which are found in the Old Testament, being always at pains to keep quite clear of the charges of love of novelties, and of opposition to it. For this, which he here says of faith, Moses says to them of the commandment, so showing that they had enjoyed at God’s hand a great benefit. For there is no need to say, he means, that one must go up to heaven, or cross a great sea, and then receive the commandments, but things so great and grand hath God made of easy access to us. And what meaneth the phrase, “The Word is nigh thee?” That is, It is easy. For in thy mind and in thy tongue is thy salvation. There is no long journey to go, no seas to sail over, no mountains to pass, to get saved. But if you be not minded to cross so much as the threshold, you may even while you sit at home be saved. For “in thy mouth and in thy heart” is the source of salvation. And then on another score also he makes the word of faith easy, and says, that “God raised Him from the dead.” For just reflect upon the worthiness of the Worker, and you will no longer see any difficulty in the thing. That He is Lord then, is plain from the resurrection. And this he said at the beginning even of the Epistle. “Which was declared to be the Son of God with power … by the resurrection from the dead.” (Rom. 1:4.) But that the resurrection is easy too, has been shown even to those who are very unbelieving, from the might of the Worker of it. Since then the righteousness is greater, and light and easy to receive, is it not a sign of the utmost contentiousness to leave what is light and easy, and set about impossibilities? For they could not say that it was a thing they declined as burdensome. See then how he deprives them of all excuse. For what do they deserve to have said in their defence, who choose what is burdensome and impracticable, and pass by what is light, and able to save them, and to give them those things which the Law could not give? All this can come only from a contentious spirit, which is in a state of rebellion against God. For the Law is galling (ἐπαχθὴς), but grace is easy. The Law, though they dispute never so much, does not save; Grace yieldeth the righteousness resulting from itself, and that from the Law likewise. What plea then is to rescue them, since they are disposed to be contentious against this, but cling to that to no purpose whatever? Then, since he had made a strong assertion, he again confirms it from the Scripture.</p></blockquote>

u+be+not+minded+to+cross+so+much+as+the+threshold%2C+you+may+even+while+you+sit+at+home+be+saved.+For+%E2%80%9Cin+thy+mouth+and+in+thy+heart%E2%80%9D+is+the+source+of+salvation.+And+then+on+another+score+also+he+makes+the+word+of+faith+easy%2C+and+says%2C+that+%E2%80%9CGod+raised+Him+from+the+dead.%E2%80%9D+For+just+reflect+upon+the+worthiness+of+the+Worker%2C+and+you+will+no+longer+see+any+difficulty+in+the+thing.+That+He+is+Lord+then%2C+is+plain+from+the+resurrection.+And+this+he+said+at+the+beginning+even+of+the+Epistle.+%E2%80%9CWhich+was+declared+to+be+the+Son+of+God+with+power+%E2%80%A6+by+the+resurrection+from+the+dead.%E2%80%9D+%28Rom.+1%3A4.%29+But+that+the+resurrection+is+easy+too%2C+has+been+shown+even+to+those+who+are+very+unbelieving%2C+from+the+might+of+the+Worker+of+it.+Since+then+the+righteousness+is+greater%2C+and+light+and+easy+to+receive%2C+is+it+not+a+sign+of+the+utmost+contentiousness+to+leave+what+is+light+and+easy%2C+and+set+about+impossibilities%3F+For+they+could+not+say+that+it+was+a+thing+they+declined+as+burdensome.+See+then+how+he+deprives+them+of+all+excuse.+For+what+do+they+deserve+to+have+said+in+their+defence%2C+who+choose+what+is+burdensome+and+impracticable%2C+and+pass+by+what+is+light%2C+and+able+to+save+them%2C+and+to+give+them+those+things+which+the+Law+could+not+give%3F+All+this+can+come+only+from+a+contentious+spirit%2C+which+is+in+a+state+of+rebellion+against+God.+For+the+Law+is+galling+%28%E1%BC%90%CF%80%CE%B1%CF%87%CE%B8%E1%BD%B4%CF%82%29%2C+but+grace+is+easy.+The+Law%2C+though+they+dispute+never+so+much%2C+does+not+save%3B+Grace+yieldeth+the+righteousness+resulting+from+itself%2C+and+that+from+the+Law+likewise.+What+plea+then+is+to+rescue+them%2C+since+they+are+disposed+to+be+contentious+against+this%2C+but+cling+to+that+to+no+purpose+whatever%3F+Then%2C+since+he+had+made+a+strong+assertion%2C+he+again+confirms+it+from+the+Scripture.%E2%80%9D%0A%0A%E2%80%94+John+Chrysostom%2C+%E2%80%9CHomilies+of+St.+John+Chrysostom%2C+Arch <blockquote><p>3. In the promises. The law promises life to those who are righteous in themselves, or on the condition of righteousness, and perfect obedience. “He that doeth them, shall live in them.” “If thou wilt enter into life, keep the commandments.” (Lev. 18:5. Matt. 19:17.) The gospel, on the other hand, promises life to those who are justified by faith in Christ, or on the condition of the righteousness of Christ, applied unto us by faith. The law and gospel are, however, not opposed to each other in these respects: for although the law requires us to keep the commandments if we would enter into life, yet it does not exclude us from life if another perform these things for us. It does indeed propose a way of satisfaction, which is through ourselves, but it does not forbid the other, as has been shown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 104–05.</span></figcaption>

<blockquote><p>LEV. 18:5. Ye shall therefore keep my statutes. Although Moses introduces this passage, where he exhorts the Israelites to cultivate chastity in respect to marriage, and not to fall into the incestuous pollutions of the Gentiles, yet, as it is a remarkable one, and contains general instruction, from whence Paul derives his definition of the righteousness of the Law, (Rom. 10:5,) it seems to me to come in very appropriately here, inasmuch as it sanctions and confirms the Law by the promise of reward. The hope of eternal life is, therefore, given to all who keep the Law; for those who expound the passage as referring to this earthly and transitory life are mistaken.1 The cause of this error was, because they feared that thus the righteousness of faith might be subverted, and salvation grounded on the merit of works. But Scripture does not therefore deny that men are justified by works, because the Law itself is imperfect, or does not give instructions for perfect righteousness; but because the promise is made of none effect by our corruption and sin. Paul, therefore, as I have just said, when he teaches that righteousness is to be sought for in the grace of Christ by faith, (Rom. 10:4,) proves his statement by this argument, that none is justified who has not fulfilled what the Law commands. Elsewhere also he reasons by contrast, where he contends that the Law does not accord with faith as regards the cause of justification, because the Law requires works for the attainment of salvation, whilst faith directs us to Christ, that we may be delivered from the curse of the Law. Foolishly, then, do some reject as an absurdity the statement, that if a man fulfils the Law he attains to righteousness; for the defect does not arise from the doctrine of the Law, but from the infirmity of men, as is plain from another testimony given by Paul. (Rom. 8:3.) We must observe, however, that salvation is not to be expected from the Law unless its precepts be in every respect complied with; for life is not promised to one who shall have done this thing, or that thing, but, by the plural word, full obedience is required of us. The pratings of the Popish theologians about partial righteousness are frivolous and silly, since God embraces at once all the commandments; and who is there that can boast of having thoroughly fulfilled them? If, then, none was ever clear of transgression, or ever will be, although God by no means deceives us, yet the promise becomes ineffectual, because we do not perform our part of the agreement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Four Last Books of Moses (Harmony)</cite>, Commentaries on the Four Last Books of Moses Arranged in the Form of a Harmony, trans. Charles William Bingham (repr. Bellingham, WA: Logos Bible Software, 2010), 3.203–05.</span></figcaption>

</figure><figure class="quote" id="q-63888d76cf" data-kw="">
<blockquote><p>Whether good or bad. That is, whether he did good or evil. Each person will receive according to his deeds, whether good or bad. It is from passages such as this that some American theologians have inferred that the only benefit the believer receives from Christ is the forgiveness of sin, and that being pardoned he is dealt with according to the principles of justice. Others, especially in Germany, have drawn from the same source the conclusion that the doctrine of Paul is that the merit of Christ cleanses only from the sins committed before conversion. If a Jew or Gentile became a Christian, his sins were blotted out, and then he was rewarded or punished, saved or lost, according to his works. The merit of Christ did not bring pardon for sin committed after conversion. This is very much the ancient doctrine that there is no forgiveness for post-baptismal sins. The benefits of Christ’s work, according to many of the ancients, are conveyed to the soul in baptism, but if once forfeited by sin can never be reapplied. This gloomy doctrine, which belonged to the transition period that preceded the full development of theology of the papal church, has been revived by the Roman Catholics of the present day. But according to the Scriptures, the blood of Jesus Christ cleanses from all sin, whether committed before or after baptism or conversion. It is a fountain to which we may come every day for cleansing. He is a priest who lives forever to make intercession for us and who always presents before God the merit of his sacrifice as a perpetual offering, typified by the morning and evening sacrifice under the law. According to the anti-scriptural views mentioned above, when a person first comes to Christ his sins are forgiven, and he then begins afresh under the covenant of works and stands in the same relationship to God as Adam did before the fall. The condition of salvation is to him as it was to our first parent: “Do this and live.” Christ is of no use to him from now on. See Romans 6:14. But in truth, because of the one offering of Christ, by which those who believe are sanctified forever (that is, they are atoned for), God does not impute the penitent believer’s sins to him and condemn him. He is not judged by the law or treated according to its principles, for then no one could be saved. But he is treated as someone for all whose sins—past, present, and future—an infinite satisfaction has been made and who has a perpetual claim to that satisfaction as long as he is united to Christ by faith and the indwelling of his Spirit.</p></blockquote>

<blockquote><p>The Protestant doctrine affirms that a sinner is made or constituted righteous by having Christ’s righteousness imputed to him; and that, being thus justified actually, he is also justified declaratively, when his acceptance is proved or attested, so as to be made manifest to his own conscience, or to his fellow-men. In both cases it is one and the same Justification that is spoken of,—his acceptance as righteous in the sight of God; but, in the one, it is considered simply as a fact, in the other, as a fact that is attested and proved. Actual Justification comes first, and is necessarily presupposed in that which is declarative; and hence, if any one is declared to have been justified, we conclude that he was actually justified, or accepted as righteous in the sight of God. …And on that solemn occasion, just as in the case of the woman that was a sinner, the acquittal and acceptance of the believer will not only be authoritatively declared by the sentence of the Judge, but that sentence will refer to the fruits of his faith, and especially to his love to Christ, as manifested by love to His afflicted people: ‘Inasmuch as ye did it to one of these my brethren, ye did it unto me.’ Justification, considered as the pardon of a sinner and his acceptance as righteous in the sight of God, is by faith; but judgment is according to works; and it is not a second Justification,—as if there might be two—the one by faith, the other by works—it is one and the same Justification, which is actually bestowed in the present life, and authoritatively declared and attested at the judgment-seat. …From the age of Augustine downwards, the most various and conflicting interpretations have been proposed. Recourse has been had to each of the principal terms in succession,—Justification,—Faith,—Works,—with the view of finding, in one or other of them, a means of harmonizing the teaching of the two Apostles. Some have founded their theory on the first of these terms, and have contended for a first and second, or an initial and final, Justification,—not in the sense of the one being actual, and the other declarative merely,—but in the sense of both being actual, while the one is by faith, and the other by works. Others have founded on the second term, and have attempted to show that, if every believer is actually justified in the present life, it can only be because faith is considered as the germ of personal holiness, and as comprehensive of all the other graces, and acts of new obedience, which spring from it. Others still have founded on the third term, and have endeavoured to show, that the works which are excluded from the ground of our Justification, are—either mere ceremonial observances such as were enjoined in that part of the Mosaic law which is now abolished,—or moral duties such as the heathen practised, which were done in the unaided strength of nature, without grace, and before faith in Christ,—or perfect obedience to the divine law, such as no man in his own strength can possibly accomplish, but not that sincere, though imperfect, obedience which every Christian is enabled by the grace of the Spirit to render to its requirements. …Paul, in his Epistles to the Romans and Galatians, treats at great length, and with much earnestness, the question of a sinner’s actual Justification, or acceptance in the sight of God. He states the conclusion of his whole argument, when he says, ‘Therefore by the deeds of the law shall no flesh be justified in His sight: for by the law is the knowledge of sin;’ and again, ‘Therefore we conclude that a man is justified by faith, without the deeds of the law.’ …So that man’s righteousness arising from his works of obedience to the divine Law, is excluded from the ground of his Justification on two distinct grounds,—first, on the ground of God’s Law, which convicts and condemns every sinner;—and secondly, on the ground of God’s method of redeeming mercy, which brings in another righteousness altogether,—the righteousness of Him who ‘became obedient unto death, even the death of the Cross.’ It is manifest from the whole course of his argument, that Paul’s design was to explain the method and ground, and even, to some extent, the rationale, of the actual justification of a sinner in the sight of God,—to show how, and why, he may be forgiven and accepted as righteous,—and to set forth this as the immediate privilege of every believer, as soon as he renounces all confidence in his own righteousness, and submits ‘to the righteousness of God.’ …It is equally clear, that the Apostle James, while he refers incidentally, or by necessary implication, to the actual justification of sinners in the sight of God, is not engaged in expounding either the nature, or grounds, of that great Gospel privilege, but rather in illustrating the declarative justification of believers, or the practical evidence by which their actual justification is attested and proved. He refers to the same justification of a sinner in the sight of God, which is more fully expounded by Paul; for he speaks, like Paul, of the justification of Abraham, which was evidently, in the first instance, that of a sinner before God; and for this reason, it is a defective statement to say that he speaks only of justification before men. But actual justification is necessarily presupposed in that which is declarative; for the latter is the mere evidence, manifestation, or proof the former; and the Apostle proves the actual justification of Abraham, first, from the testimony of God Himself, as it is recorded in Scripture, ‘which saith, Abraham believed in God, and it was imputed unto him for righteousness: and he was called the Friend of God;’ and secondly, from the practical fruits or manifestations of his faith in works of holy obedience: ‘For was not Abraham our father justified by works, when he had offered Isaac his son upon the altar?’</p></blockquote>

<blockquote><p>[The Galatians] joined the works of the law with Christ and his grace in the cause of their justification and salvation. Here it must be observed that they which make a union of grace and works in the cause of justification are separated from the grace of God. Grace admits no partner or fellow. Grace must be freely given every way, or it is no way grace.</p></blockquote>

<blockquote><p>XXVII. The grace of God and the merit of Christ are not opposed, but subordinated because they are viewed here in different respects (kat’ allo kai allo): grace in respect of us, both in the giving of the surety and in the acceptance of his satisfaction for our justification; but merit in respect of God’s justice, which could not leave sin unpunished (which the apostle asserts are in the highest degree consistent with each other, Rom. 3:24, 25). XXVIII. Although the remission of God and of men are similar in various points as to the thing (and most especially in the sincere and genuine pardon offenses), it does not follow that they are exactly similar. Men are private persons to whom the right of punishment does not necessarily belong, but God is a Judge whose prerogative it is to punish sinners. XXIX. If God promises remission of sins in the new covenant, this does not deny but supposes the satisfaction of Christ because it is promised in the name of Christ (Acts 10:43), i.e., through his virtue and merit. Nor is there any remission without the shedding of blood (haimatekchysia, Heb. 9:22). And if the elders are said to have obtained pardon by faith (Heb. 11), Christ is necessarily included (whom faith regards as its proper object); indeed inasmuch as he was crucified who ought to lay down his life as a sacrifice for sin (Is. 53:10) and to be made a sin offering (2 Cor. 5:21) and a curse (katara, Gal. 3:13). For other matters bearing upon this point, see Volume I, Topic III, Question 19; and Disputation 1 and 2, on the Necessity of Satisfaction (De Satisfactionis Christi Necessitate, in Opera [1848], 4:385–435).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXVII. The grace of God and the merit of Christ are not opposed, but subordinated because they are viewed here in different respects (kat’ allo kai allo): grace in respect of us, both in the giving of the surety and in the acceptance of his satisfaction for our justification; but merit in respect of God’s justice, which could not leave sin unpunished (which the apostle asserts are in the highest degree consistent with each other, Rom. 3:24, 25). XXVIII. Although the remission of God and of men are similar in various points as to the thing (and most especially in the sincere and genuine pardon offenses), it does not follow that they are exactly similar. Men are private persons to whom the right of punishment does not necessarily belong, but God is a Judge whose prerogative it is to punish sinners. XXIX. If God promises remission of sins in the new covenant, this does not deny but supposes the satisfaction of Christ because it is promised in the name of Christ (Acts 10:43), i.e., through his virtue and merit. Nor is there any remission without the shedding of blood (haimatekchysia, Heb. 9:22). And if the elders are said to have obtained pardon by faith (Heb. 11), Christ is necessarily included (whom faith regards as its proper object); indeed inasmuch as he was crucified who ought to lay down his life as a sacrifice for sin (Is. 53:10) and to be made a sin offering (2 Cor. 5:21) and a curse (katara, Gal. 3:13). For other matters bearing upon this point, see Volume I, Topic III, Question 19; and Disputation 1 and 2, on the Necessity of Satisfaction (De Satisfactionis Christi Necessitate, in Opera [1848], 4:385–435).”

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 426. (14.10.27–29)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVII.+The+grace+of+God+and+the+merit+of+Christ+are+not+opposed%2C+but+subordinated+because+they+are+viewed+here+in+different+respects+%28kat%E2%80%99+allo+kai+allo%29%3A+grace+in+respect+of+us%2C+both+in+the+giving+of+the+surety+and+in+the+acceptance+of+his+satisfaction+for+our+justification%3B+but+merit+in+respect+of+God%E2%80%99s+justice%2C+which+could+not+leave+sin+unpunished+%28which+the+apostle+asserts+are+in+the+highest+degree+consistent+with+each+other%2C+Rom.+3%3A24%2C+25%29.+XXVIII.+Although+the+remission+of+God+and+of+men+are+similar+in+various+points+as+to+the+thing+%28and+most+especially+in+the+sincere+and+genuine+pardon+offenses%29%2C+it+does+not+follow+that+they+are+exactly+similar.+Men+are+private+persons+to+whom+the+right+of+punishment+does+not+necessarily+belong%2C+but+God+is+a+Judge+whose+prerogative+it+is+to+punish+sinners.+XXIX.+If+God+promises+remission+of+sins+in+the+new+covenant%2C+this+does+not+deny+but+supposes+the+satisfaction+of+Christ+because+it+is+promised+in+the+name+of+Christ+%28Acts+10%3A43%29%2C+i.e.%2C+through+his+virtue+and+merit.+Nor+is+there+any+remission+without+the+shedding+of+blood+%28haimatekchysia%2C+Heb.+9%3A22%29.+And+if+the+elders+are+said+to+have+obtained+pardon+by+faith+%28Heb.+11%29%2C+Christ+is+necessarily+included+%28whom+faith+regards+as+its+proper+object%29%3B+indeed+inasmuch+as+he+was+crucified+who+ought+to+lay+down+his+life+as+a+sacrifice+for+sin+%28Is.+53%3A10%29+and+to+be+made+a+sin+offering+%282+Cor.+5%3A21%29+and+a+curse+%28katara%2C+Gal.+3%3A13%29.+For+other+matters+bearing+upon+this+point%2C+see+Volume+I%2C+Topic+III%2C+Question+19%3B+and+Disputation+1+and+2%2C+on+the+Necessity+of+Satisfaction+%28De+Satisfactionis+Christi+Necessitate%2C+in+Opera+%5B1848%5D%2C+4%3A385%E2%80%93435%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+426.+%2814.10.27%E2%80%9329%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e3932130d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e3932130d.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/11/turretin-christ-is-our-substitute-in-whom-mercy-and-justice-meet/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-2e4b47f56e" data-kw="">
<blockquote><p>The next thing to be considered, is the trial of the righteous, who are said to stand before Christ’s judgment-seat. Here it may be observed that no indictment shall be brought against them, at least, with the Judge’s approbation; for they were acquitted and discharged, when brought into a justified state; and as the consequence of their having been so, ‘none,’ as the apostle says, ‘shall lay any thing to their charge,’ since ‘it is God that justifieth.’ If any thing be alleged against them by the enemies of God, who loaded them with reproach, and laid many things to their charge in this world of which some have been just, and others unjust and malicious, the great and merciful Judge will appear as an advocate on their behalf, and will vindicate them from those charges which are ungrounded, and will farther allege, as a foundation of their discharge from the guilt of all others, that he has made a full atonement for them. Hence, when their sins are sought for, they shall not be found in judgment, or charged upon them to their shame, confusion, or condemnation; but they shall be pronounced righteous, as interested in Christ’s righteousness. The great Judge shall evince that they are so, by producing those graces which were wrought in them, which are inseparably connected with their justification, though not the foundation of it, that so the method of the divine proceedings may be vindicated, and it may appear that, as ‘without holiness no one shall see the Lord,’ so they are holy, and accordingly possess that internal quality which denotes them to be persons whom God designed to save. This I take to be the meaning of our Saviour’s address to the righteous, when he pronounces them ‘blessed,’ and invites them to ‘come and inherit the kingdom prepared for them from the foundation of the world; for I was an hungered, and ye gave me meat; I was thirsty, and ye gave me drink,’ &amp;c. Here the word ‘for’ is taken demonstratively, and not causally; and denotes that they were such as might expect to be admitted to this honour and blessedness, having those marks and characters of his children upon them to which the promise of salvation was annexed; not as though any thing done by them was the cause of their salvation. It hence appears that the graces of God’s people shall be published before angels and men, to the praise of the glory of him who was the author of them. But there is a difficult question proposed by some, namely, Whether shall the sins of God’s people be published in the great day; though it is certain they shall not be alleged against them to their condemnation? This is one of the secret things which belong to God, which he has not so fully or clearly revealed to us in his word; so that we can say little more about it than what is matter of conjecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, vol. 2 (New York: Robert Carter &amp; Brothers, 1855), 277–78.</span></figcaption>

<blockquote><p>X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.</p></blockquote>

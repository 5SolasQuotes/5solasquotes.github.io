<blockquote><p>V. That what God forbids, is at no time to be done; what He commands, is always our duty, and yet every particular duty is not to be done at all times. Thus sin is, under no pretense, to be committed. Accordingly, Moses, when he was in a prosperous condition in Pharaoh’s court, though he might have pretended that his greatness and the advantages which Israel might have expected from it, would be an excuse for his continuing to enjoy the pleasures of sin there; yet he was sensible that these considerations would not exempt him from guilt. Hence, ‘he forsook Egypt, and chose rather to suffer affliction with the people of God, than to enjoy the pleasures of sin.</p></blockquote>

</figure><figure class="quote" id="q-517674f604" data-kw="">
<blockquote><p>Now indeed it would be most pleasing to us that the Supper be celebrated every month, provided that the more frequent use does not produce negligence. For while the greater part abstain from communion, the Church is in some measure scattered. Nevertheless, we would rather that the Church be invited monthly than only four times in the year, as is our custom. When I first came here [to Geneva], it was distributed only three times a year—and that so that between the Supper at Pentecost and that at the Nativity of Christ, seven whole months intervened. I preferred a monthly celebration; but since I could by no means persuade them, it seemed better to pardon the weakness of the people than to contend too stubbornly. Yet I took care that it should be entered in the public records that our custom was a faulty one, in order that a correction might be easier and freer for posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’</cite>, (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213 tr. ChatGPT-5</span></figcaption>

</figure><figure class="quote" id="q-cfd38b358f" data-kw="">
<blockquote><p>As, then, in civility, there is a respect and reverence different from adoration, so it is in religion also… We neither submit our minds nor humble [bow] our bodies to the sacrament, yet do we render to it veneration (Cartwright on 1 Cor. 11, sect. 18), forasmuch as we esteem highly of it, as a most holy thing, and meddle [handle] reverently with it, without all contempt or unworthy usage. ‘Inanimate things’, says the Archbishop of Spalato, ‘may indeed be as sacred as you please, they do not deserve other honor from us except in a negative sense (Dr Rep. Eccl., bk. 7, ch. 12, num. 50), as that they be not contemned, nor unworthily handled. If it is said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than [the absence of] profanatio [profanation], I answer, as honor both in the positive and negative sense, has various degrees, and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted… for the greater regard of those things which are more immediately divine, we are not in the usage of them, to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly, divine, and which are not from God so immediately as the other, but more by the intervention of means; and thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking aught from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, ‘nothing here is human, but everything divine’ (Didoclav., ubi supra, p. 808); for Christ’s own words are, or at least should be spoken to us when we receive the sacrament, and the elements also are, by Christ’s own institution, holy symbols of his blessed body and blood; whereas the Word preached to us is but fixedly and mediately divine; and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of god, we are bidden try the spirits, and are required, after the example of the Bereans, to search the Scriptures daily, whether these things which we hear preached be so or not. Now we are not in the like sort to try the elements, and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us, that the sacrament given, according to Christ’s institution, is more merely and immediately divine than is the Word preached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali, 1993), pp. 218-9</span></figcaption>

t, and the elements also are, by Christ’s own institution, holy symbols of his blessed body and blood; whereas the Word preached to us is but fixedly and mediately divine; and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of god, we are bidden try the spirits, and are required, after the example of the Bereans, to search the Scriptures daily, whether these things which we hear preached be so or not. Now we are not in the like sort to try the elements, and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us, that the sacrament given, according to Christ’s institution, is more merely and immediately divine than is the Word preached…”

f+is+given+to+be+this%2C+because+when+we+come+to+the+sacrament%2C+%E2%80%98nothing+here+is+human%2C+but+everything+divine%E2%80%99+%28Didoclav.%2C+ubi+supra%2C+p.+808%29%3B+for+Christ%E2%80%99s+own+words+are%2C+or+at+least+should+be+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are%2C+by+Christ%E2%80%99s+own+institution%2C+holy+symbols+of+his+blessed+body+and+blood%3B+whereas+the+Word+preached+to+us+is+but+fixedly+and+mediately+divine%3B+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+god%2C+we+are+bidden+try+the+spirits%2C+and+are+required%2C+after+the+example+of+the+Bereans%2C+to+search+the+Scriptures+daily%2C+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+the+like+sort+to+try+the+elements%2C+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us%2C+that+the+sacrament+given%2C+according+to+Christ%E2%80%99s+institution%2C+is+more+merely+and+immediately+divine+than+is+the+Word+preached%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%28Naphtali%2C+1993%29%2C+pp.+218-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfd38b358f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfd38b358f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-frequency-of-the-lords-supper-2/#:~:text=As%2C%20then%2C%20in%20civility%2C%20there%20is,divine%20than%20is%20the%20Word%20preached&amp;text=As%2C%20then%2C%20in%20civility%2C%20there%20is%20a%20respect&amp;text=and%20immediately%20divine%20than%20is%20the%20Word%20preached" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>

</figure><figure class="quote" id="q-3aa0c37dcc" data-kw="">
<blockquote><p>The communion, or supper of the Lord, is frequently to be celebrated; but how often, may be considered and determined by the ministers, and other church-governors of each congregation, as they shall find most convenient for the comfort and edification of the people committed to their charge. And, when it shall be administered, we judge it convenient to be done after the morning sermon… Where this sacrament cannot with convenience be frequently administered, it is requisite that publick warning be given the sabbath-day before the administration thereof: and that either then, or on some day of that week, something concerning that ordinance, and the due preparation thereunto, and participation thereof, be taught; that, by the diligent use of all means sanctified of God to that end, both in publick and private, all may come better prepared to that heavenly feast.</p></blockquote>

<blockquote><p>The moral law is the declaration of the will of God to mankind, directing and binding every one to personal, perfect, and perpetual conformity and obedience thereunto, in the frame and disposition of the whole man, soul and body, and in performance of all those duties of holiness and righteousness which he oweth to God and man…</p></blockquote>

</figure><figure class="quote" id="q-a4f0a417ed" data-kw="">
<blockquote><p>It may seem absurd to say that he ‘is in heaven’ while he still lives on earth. If it is answered that this is true about his divine nature, then this expression would mean something else—-namely, that while he was man he was ‘in heaven.’ I could point out that no place is mentioned here and that only Christ is distinguished from everybody else as far as his state is concerned, since he is the heir of the kingdom of God, from which the whole human race is banished. However, as very frequently happens, because of the unity of the person of Christ, what correctly applies to one of his natures is applied to another of his natures, and so we need seek no other solution. So Christ, who ‘is in heaven,’ has clothed himself in our flesh, so that by stretching out his brotherly hand to us he may raise us to heaven with himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John in Crossway Classic Commentaries, eds. Alister McGrath &amp; J. I. Packer</cite>, (Wheaton, IL: Crossway, 1994), on Jn. 3:13, pp. 74-75</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>

</figure><figure class="quote" id="q-87b9ae1558" data-kw="">
<blockquote><p>Common “wine” is instituted, of indifferent color, undiluted with water because it is called simply the “fruit of the vine” (Mt. 26:29; Mk. 14:25). Thus the Romanists here without reason urge the mixture of water with the wine, which although according to them is not of the integrity of the sacrament, still is of its congruity, nor can it be omitted without mortal sin (as Bellarmine holds). For although it may seem to be indifferent (which may be equally omitted or retained, provided the order of the church is not disturbed; and it is clear that by the ancients water was mixed with the wine because the use of pure wine is rare among the orientals); still they are deservedly to be censured because (without authority from the word) they invent mortal sins and condemn the liberty of others.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Common “wine” is instituted, of indifferent color, undiluted with water because it is called simply the “fruit of the vine” (Mt. 26:29; Mk. 14:25). Thus the Romanists here without reason urge the mixture of water with the wine, which although according to them is not of the integrity of the sacrament, still is of its congruity, nor can it be omitted without mortal sin (as Bellarmine holds). For although it may seem to be indifferent (which may be equally omitted or retained, provided the order of the church is not disturbed; and it is clear that by the ancients water was mixed with the wine because the use of pure wine is rare among the orientals); still they are deservedly to be censured because (without authority from the word) they invent mortal sins and condemn the liberty of others.”

<blockquote><p>V. Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary). We do not deny that the use of fermented bread seems to us the more suitable, both because it is more in accordance with the design of Christ (which was to use common and ordinary bread, which is everywhere to be found); and because it is more appropriate to sustain the sacramental analogy (which consists in signifying our communion with Christ by the similitude of bodily nourishment); and because the necessity of unleavened bread belongs to the Jewish ceremonies (which are abrogated and cannot be retained without a certain affectation [kakozēlia] of Judaism); and because in the whole ancient church no traces appear of the common use of unleavened bread in the Eucharist before the ninth or tenth century. Yea, it is evident that the Eucharistic symbols were formerly taken from the offerings of bread and wine made by believers, which were undoubtedly of ordinary and fermented bread (as the Jesuit James Sirmondus, “Disquisitio de Azymo,” Opera Varia [1696], 4:513–30, candidly acknowledges and solidly confirms by many arguments). The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever he did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks: “An act of Christ alone is not sufficient to form a command; for although he consecrated in white wine, or at night, for example, he did not on that account command us so to consecrate” (3. Thom. de Sacra). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>

<blockquote><p>In his Sacred Supper he bids me take, eat, and drink his body and blood under the symbols of bread and wine. I do not doubt that he himself truly presents them, and that I receive them.</p></blockquote>

<blockquote><p>In the Supper of the Lord, the external minister holds forth the external symbols, the bread of the Lord and the wine of the Lord, which are perceived by the organs of our body, consumed and swallowed. The internal minister, the Holy Spirit, not by external organs of the body, but by his secret virtue, feeds the souls of the faithful, both truly and efficaciously, with the body and the blood of the Lord unto eternal life, as truly as they know themselves to be nourished for this mortal life by bread and wine.</p></blockquote>

<blockquote><p>2. The special object of faith, as justifying, is not the special object of faith in this ordinance. The special object of faith, as justifying, is the promise, and Christ in the promise, in general, as “the Saviour of sinners:” so when the apostle called men “to repent and believe,” he tells them, “The promise is unto you,” Acts 2:39. And I suppose I need not insist upon the proof this, that the promise, and Christ in the promise as Saviour and Redeemer, is the object of faith, as it is justifying. But this also is supposed in the actings of faith in this ordinance; which is peculiar, and gives us peculiar communion with Christ. Therefore,— 3. The special and peculiar object of faith, the immediate object of it in this ordinance, in its largest extent is,— (1.) The human nature of Christ, as the subject wherein mediation and redemption was wrought. Christ is considered to come as a sacrifice; that is laid down as the foundation of it, Ps. 40:6; Heb. 10:5, “A body hast thou prepared me;” which is synecdochically taken for the whole human nature. Faith, when it would lead itself unto the sacrifice of Christ, which is here represented, doth in an especial manner consider the human nature of Christ; that God prepared him a body for that end. This we are to have peculiar regard unto when we come to the administration or participation of this ordinance. For that end we now celebrate it. Nay,— (2.) Faith goes farther, and doth not consider merely the human nature of Christ, but considers it as distinguished into its integral parts,—into body and blood; both which have a price, value, and virtue given unto them by their union with his human soul: for both the body of Christ and the blood of Christ, upon which the work of our redemption is put in Scripture, have their value and worth from their relation unto his soul; as soul and body, making the human nature, had its value and worth from its relation unto the Son of God: otherwise, he saith of his body, “Handle it, it is but flesh and bones.” But where the body of Christ is mentioned, and the blood of Christ is mentioned, there is a distribution of the human nature into its integral parts, each part retaining its relation to his soul; and from thence is its value and excellency. This is the second peculiar in the object of faith in this ordinance. (3.) There is more than this: they are not only considered as distinguished, but as separate also;—the blood separate from the body, the body left without the blood. This truth our apostle, in this chapter and the next, doth most signally insist upon; namely, the distinct parts of this ordinance,—one to represent the body, and the other to represent the blood,—that faith may consider them as separate. The Papists, we know, do sacrilegiously take away the cup from the people; they will give them the bread, but they will not give them the cup: and as it always falls out that one error must be covered with another, or else it will keep no man dry under it, they have invented the doctrine of concomitance,—that there is a concomitance; that is, whole Christ is in every kind,—in the bread, and in the wine,—the one doth accompany the other: which is directly to overthrow the ordinance upon another account,—as it is to represent Christ’s body and blood as separated one from the other. Our Lord Jesus blessed the bread and the cup, and said, “This is my body;” [“This is my blood;”]—which cannot be spoken distinctly, unless supposed to be separate. Here, then, is a threefold limitation of the act of faith, even in this ordinance, in a peculiar manner restraining it to a special communion with God in Christ:—that it hath a special regard to the human nature of Christ; to his human nature as consisting of body and blood; and as it respects them as separated, body and blood. Yea,— (4.) It respects them as separate in that manner. You all along know that I do not intend these objects of faith as the ultimate object,—for it is the person of Christ that faith rests in,—but those immediate objects that faith is exercised about, to bring it to rest in God. It is exercised about the manner of this separation; that is, the blood of Christ comes to be distinct by being shed, and the body of Christ comes to be separate by being bruised and broken. All the instituted sacrifices of old did signify this,—a violent separation of body and blood: the blood was let out with the hand of violence, and so separated; and then sprinkled upon the altar, and then towards the holy place; and then the body was burned distinct by itself. So, the apostle tells us, it is “the cup which we bless, and the bread which we break;” the cup is poured out, as well as the bread broken, to remind faith of the violent separation of the body and blood of Christ. From this last consideration, of faith acting itself upon the separation of the body and blood of Christ by way of violence, it is led to a peculiar acting of itself upon all the causes of it,—whence it was that this body and this blood of Christ were represented thus separate: and by inquiring into the causes of it, it finds a moving cause, a procuring cause, an efficient cause, and a final cause; which it ought to exercise itself peculiarly upon always in this ordinance. [1.] A moving cause; and that is, the eternal love of God in giving Christ in this manner, to have his body bruised, and his blood shed. The apostle, going to express the love of God towards us, tells you it was in this, that “he spared not his own Son,” Rom. 8:32. One would have thought that the love of God might have wrought in sending his Son into the world; but it also wrought in not sparing of him. Thus faith is called in this ordinance to exercise itself upon that love which gives out Christ not to be spared. [2.] It reflects upon the procuring cause;—whence it is, or what it is, that hath procured it, that there should be this representation of the separated body and blood of Christ; and this is even our own sin. “He was delivered for our offences,”—given for our transgressions,—died to make reconciliation and atonement for our sins: they were the procuring cause of it, upon such considerations of union and covenant which I shall not now insist upon. It leads faith, I say, upon a special respect to sin, as the procuring cause of the death of Christ. A natural conscience, on the breach of the law, leads the soul to the consideration of sin, as that which exposes itself alone to the wrath of God and eternal damnation, but in this ordinance we consider sin as that which exposed Christ to death: which is a peculiar consideration of the nature of sin. [3.] There is the efficient cause;—whence it was that the body and blood of Christ were thus separated; and that is threefold:—principal, instrumental, and adjuvant. What is the principal efficient cause of the sufferings of Christ? Why, the justice and righteousness of God. “God hath set him forth to be a propitiation, to declare his righteousness,” Rom. 3:25. Whence it is said, “He spared him not.” He caused all our sins to meet upon him: “The chastisement of our peace was upon him.” Again, there is the instrumental cause; and that is the law of God. Whence did that separation, which is here represented unto us, ensue and flow? It came from the sentence of the law, whereby he was hanged upon the tree. Moreover, the adjuvant cause was those outward instruments, the wrath and malice of men: “For of a truth against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together,” Acts 4:27. Faith considers the cause whence it was that Christ was thus given up, the eternal love of God; the procuring cause was our own sins: and if once faith takes a view of sin as that which hath nailed Christ to the cross, it will have a blessed effect on the soul. And it considers the efficient cause; which is the justice and righteousness of God: the law of God was the instrument in the hand of righteousness, which was holpen on by those outward instruments who had a hand in his suffering, but none in his sacrifice. [4.] Faith considers in this matter the end of this separation of the body and blood of Christ which is thus represented; and that is, ultimately and absolutely, the glory of God. He “set him forth to declare his righteousness,” Rom. 3:25, Eph. 1:6. God aimed at the glorifying of himself. I could easily manifest unto you how all the glorious properties of his nature are advanced, exalted, and will be so to eternity, in this suffering of Christ. The subordinate ends are two; I mean the subordinate ends of this very peculiar act of separation of the body and blood:—1st. It was to confirm the covenant. Every covenant of old was to be ratified and confirmed by sacrifice; and in confirming the covenant by sacrifice, they divided the sacrifice into two parts, and passed between them before they were offered; and then took it upon themselves that they would stand to the covenant which was so confirmed. Jesus Christ being to confirm the covenant, Heb. 9:16, the body and blood of Christ, this sacrifice, was to be parted, that this covenant might be confirmed. And,—2dly. A special end of it was, for the confirming and strengthening of our faith. God gives out unto us the object of our faith in parcels. We are not able to take this great mysterious fruit of God’s love in gross, in the lump; and therefore he gives it out, I say, in parcels. We shall have the body broken to be considered; and the blood shed is likewise to be considered. This is the peculiar communion which we have with Christ in this ordinance; because there are peculiar objects for faith to act itself upon in this ordinance above others.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. The special object of faith, as justifying, is not the special object of faith in this ordinance. The special object of faith, as justifying, is the promise, and Christ in the promise, in general, as “the Saviour of sinners:” so when the apostle called men “to repent and believe,” he tells them, “The promise is unto you,” Acts 2:39. And I suppose I need not insist upon the proof this, that the promise, and Christ in the promise as Saviour and Redeemer, is the object of faith, as it is justifying. But this also is supposed in the actings of faith in this ordinance; which is peculiar, and gives us peculiar communion with Christ. Therefore,— 3. The special and peculiar object of faith, the immediate object of it in this ordinance, in its largest extent is,— (1.) The human nature of Christ, as the subject wherein mediation and redemption was wrought. Christ is considered to come as a sacrifice; that is laid down as the foundation of it, Ps. 40:6; Heb. 10:5, “A body hast thou prepared me;” which is synecdochically taken for the whole human nature. Faith, when it would lead itself unto the sacrifice of Christ, which is here represented, doth in an especial manner consider the human nature of Christ; that God prepared him a body for that end. This we are to have peculiar regard unto when we come to the administration or participation of this ordinance. For that end we now celebrate it. Nay,— (2.) Faith goes farther, and doth not consider merely the human nature of Christ, but considers it as distinguished into its integral parts,—into body and blood; both which have a price, value, and virtue given unto them by their union with his human soul: for both the body of Christ and the blood of Christ, upon which the work of our redemption is put in Scripture, have their value and worth from their relation unto his soul; as soul and body, making the human nature, had its value and worth from its relation unto the Son of God: otherwise, he saith of his body, “Handle it, it is but flesh and bones.” But where the body of Christ is mentioned, and the blood of Christ is mentioned, there is a distribution of the human nature into its integral parts, each part retaining its relation to his soul; and from thence is its value and excellency. This is the second peculiar in the object of faith in this ordinance. (3.) There is more than this: they are not only considered as distinguished, but as separate also;—the blood separate from the body, the body left without the blood. This truth our apostle, in this chapter and the next, doth most signally insist upon; namely, the distinct parts of this ordinance,—one to represent the body, and the other to represent the blood,—that faith may consider them as separate. The Papists, we know, do sacrilegiously take away the cup from the people; they will give them the bread, but they will not give them the cup: and as it always falls out that one error must be covered with another, or else it will keep no man dry under it, they have invented the doctrine of concomitance,—that there is a concomitance; that is, whole Christ is in every kind,—in the bread, and in the wine,—the one doth accompany the other: which is directly to overthrow the ordinance upon another account,—as it is to represent Christ’s body and blood as separated one from the other. Our Lord Jesus blessed the bread and the cup, and said, “This is my body;” [“This is my blood;”]—which cannot be spoken distinctly, unless supposed to be separate. Here, then, is a threefold limitation of the act of faith, even in this ordinance, in a peculiar manner restraining it to a special communion with God in Christ:—that it hath a special regard to the human nature of Christ; to his human nature as consisting of body and blood; and as it respects them as separated, body and blood. Yea,— (4.) It respects them as separate in that manner. You all along know that I do not intend these objects of faith as the ul blood of Christ; and this is even our own sin. “He was delivered for our offences,”—given for our transgressions,—died to make reconciliation and atonement for our sins: they were the procuring cause of it, upon such considerations of union and covenant which I shall not now insist upon. It leads faith, I say, upon a special respect to sin, as the procuring cause of the death of Christ. A natural conscience, on the breach of the law, leads the soul to the consideration of sin, as that which exposes itself alone to the wrath of God and eternal damnation, but in this ordinance we consider sin as that which exposed Christ to death: which is a peculiar consideration of the nature of sin. [3.] There is the efficient cause;—whence it was that the body and blood of Christ were thus separated; and that is threefold:—principal, instrumental, and adjuvant. What is the principal efficient cause of the sufferings of Christ? Why, the justice and righteousness of God. “God hath set him forth to be a propitiation, to declare his righteousness,” Rom. 3:25. Whence it is said, “He spared him not.” He caused all our sins to meet upon him: “The chastisement of our peace was upon him.” Again, there is the instrumental cause; and that is the law of God. Whence did that separation, which is here represented unto us, ensue and flow? It came from the sentence of the law, whereby he was hanged upon the tree. Moreover, the adjuvant cause was those outward instruments, the wrath and malice of men: “For of a truth against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together,” Acts 4:27. Faith considers the cause whence it was that Christ was thus given up, the eternal love of God; the procuring cause was our own sins: and if once faith takes a view of sin as that which hath nailed Christ to the cross, it will have a blessed effect on the soul. And it considers the efficient cause; which is the justice hem+by+their+union+with+his+human+soul%3A+for+both+the+body+of+Christ+and+the+blood+of+Christ%2C+upon+which+the+work+of+our+redemption+is+put+in+Scripture%2C+have+their+value+and+worth+from+their+relation+unto+his+soul%3B+as+soul+and+body%2C+making+the+human+nature%2C+had+its+value+and+worth+from+its+relation+unto+the+Son+of+God%3A+otherwise%2C+he+saith+of+his+body%2C+%E2%80%9CHandle+it%2C+it+is+but+flesh+and+bones.%E2%80%9D+But+where+the+body+of+Christ+is+mentioned%2C+and+the+blood+of+Christ+is+mentioned%2C+there+is+a+distribution+of+the+human+nature+into+its+integral+parts%2C+each+part+retaining+its+relation+to+his+soul%3B+and+from+thence+is+its+value+and+excellency.+This+is+the+second+peculiar+in+the+object+of+faith+in+this+ordinance.+%283.%29+There+is+more+than+this%3A+they+are+not+only+considered+as+distinguished%2C+but+as+separate+also%3B%E2%80%94the+blood+separate+from+the+body%2C+the+body+left+without+the+blood.+This+truth+our+apostle%2C+in+this+chapter+and+the+next%2C+doth+most+signally+insist+upon%3B+namely%2C+the+distinct+parts+of+this+ordinance%2C%E2%80%94one+to+represent+the+body%2C+and+the+other+to+represent+the+blood%2C%E2%80%94that+faith+may+consider+them+as+separate.+The+Papists%2C+we+know%2C+do+sacrilegiously+take+away+the+cup+from+the+people%3B+they+will+give+them+the+bread%2C+but+they+will+not+give+them+the+cup%3A+and+as+it+always+falls+out+that+one+error+must+be+covered+with+another%2C+or+else+it+will+keep+no+man+dry+under+it%2C+they+have+invented+the+doctrine+of+concomitance%2C%E2%80%94that+there+is+a+concomitance%3B+that+is%2C+whole+Christ+is+in+every+kind%2C%E2%80%94in+the+bread%2C+and+in+the+wine%2C%E2%80%94the+one+doth+accompany+the+other%3A+which+is+directly+to+overthrow+the+ordinance+upon+another+account%2C%E2%80%94as+it+is+to+represent+Christ%E2%80%99s+body+and+blood+as+separated+one+from+the+other.+Our+Lord+Jesus+blessed+the+bread+and+the+cup%2C+and+said%2C+%E2%80%9CThis+is+my+body%3B%E2%80%9D+%5B%E2%80%9CThis+is+my+blood%3B%E2%80%9D%5D%E2%80%94which+cannot+be+spoken+distinctly%2C+unless+supposed+to+be+separate.+Here%2C+then%2C+is+a+threefold+limitation+of+the+act+of+faith%2C+even+in+this+ordinance%2C+in+a+peculiar+manner+restraining+it+to+a+special+communion+with+God+in+Christ%3A%E2%80%94that+it+hath+a+special+regard+to+the+human+nature+of+Christ%3B+to+his+human+nature+as+consisting+of+body+and+blood%3B+and+as+it+respects+them+as+separated%2C+body+and+blood.+Yea%2C%E2%80%94+%284.%29+It+respects+them+as+separate+in+that+manner.+You+all+along+know+that+I+do+not+intend+these+objects+of+faith+as+the+ultimate+object%2C%E2%80%94for+it+is+the+person+of+Christ+that+faith+rests+in%2C%E2%80%94but+those+immediate+objects+that+faith+is+exercised+about%2C+to+bring+it+to+rest+in+God.+It+is+exercised+about+the+manner+of+this+separation%3B+that+is%2C+the+blood+of+Christ+comes+to+be+distinct+by+being+shed%2C+and+the+body+of+Christ+comes+to+be+separate+by+being+bruised+and+broken.+All+the+instituted+sacrifices+of+old+did+signify+this%2C%E2%80%94a+violent+separation+of+body+and+blood%3A+the+blood+was+let+out+with+the+hand+of+violence%2C+and+so+separated%3B+and+then+sprinkled+upon+the+altar%2C+and+then+towards+the+holy+place%3B+and+then+the+body+was+burned+distinct+by+itself.+So%2C+the+apostle+tells+us%2C+it+is+%E2%80%9Cthe+cup+which+we+bless%2C+and+the+bread+which+we+break%3B%E2%80%9D+the+cup+is+poured+out%2C+as+well+as+the+bread+broken%2C+to+remind+faith+of+the+violent+separation+of+the+body+and+blood+of+Christ.+From+this+last+consideration%2C+of+faith+acting+itself+upon+the+separation+of+the+body+and+blood+of+Christ+by+way+of+violence%2C+it+is+led+to+a+peculiar+acting+of+itself+upon+all+the+causes+of+it%2C%E2%80%94whence+it+was+that+this+body+and+this+blood+of+Christ+were+represented+thus+separate%3A+and+by+inquiring+into+the+causes+of+it%2C+it+finds+a+moving+cause%2C+a+procuring+cause%2C+an+efficient+cause%2C+and+a+final+cause%3B+which+it+ought+to+exercise+itself+peculiarly+upon+always+in+this+ordinance.+%5B1.%5D+A+moving+cause%3B+and+that+is%2C+the+eternal+love+of+God+in+giving+Christ+in+this+manner%2C+to+have+his+body+bruised%2C+and+his+blood+shed.+The+apostle%2C+going+to+express+the+love+of+God+towards+us%2C+tells+you+it+was+in+this%2C+that+%E2%80%9Che+spared+not+his+own+Son%2C%E2%80%9D+Rom.+8%3A32.+One+would+have+thought+that+the+love+of+God+might+have+wrought+in+sending+his+Son+into+the+world%3B+but+it+also+wrought+in+not+sparing+of+him.+Thus+faith+is+called+in+this+ordinance+to+exercise+itself+upon+that+love+which+gives+out+Christ+not+to+be+spared.+%5B2.%5D+It+reflects+upon+the+procuring+cause%3B%E2%80%94whence+it+is%2C+or+what+it+is%2C+that+hath+procured+it%2C+that+there+should+be+this+representation+of+the+separated+body+and+blood+of+Christ%3B+and+this+is+even+our+own+sin.+%E2%80%9CHe+was+delivered+for+our+offences%2C%E2%80%9D%E2%80%94given+for+our+transgressions%2C%E2%80%94died+to+make+reconciliation+and+atonement+for+our+sins%3A+they+were+the+procuring+cause+of+it%2C+upon+such+considerations+of+union+and+covenant+which+I+shall+not+now+insist+upon.+It+leads+faith%2C+I+say%2C+upon+a+special+respect+to+sin%2C+as+the+procuring+cause+of+the+death+of+Christ.+A+natural+conscience%2C+on+the+breach+of+the+law%2C+leads+the+soul+to+the+consideration+of+sin%2C+as+that+which+exposes+itself+alone+to+the+wrath+of+God+and+eternal+damnation%2C+but+in+this+ordinance+we+consider+sin+as+that+which+exposed+Christ+to+death%3A+which+is+a+peculiar+consideration+of+the+nature+of+sin.+%5B3.%5D+There+is+the+efficient+cause%3B%E2%80%94whence+it+was+that+the+body+and+blood+of+Christ+were+thus+separated%3B+and+that+is+threefold%3A%E2%80%94principal%2C+instrumental%2C+and+adjuvant.+What+is+the+principal+efficient+cause+of+the+sufferings+of+Christ%3F+Why%2C+the+justice+and+righteousness+of+God.+%E2%80%9CGod+hath+set+him+forth+to+be+a+propitiation%2C+to+declare+his+righteousness%2C%E2%80%9D+Rom.+3%3A25.+Whence+it+is+said%2C+%E2%80%9CHe+spared+him+not.%E2%80%9D+He+caused+all+our+sins+to+meet+upon+him%3A+%E2%80%9CThe+chastisement+of+our+peace+was+upon+him.%E2%80%9D+Again%2C+there+is+the+instrumental+cause%3B+and+that+is+the+law+of+God.+Whence+did+that+separation%2C+which+is+here+represented+unto+us%2C+ensue+and+flow%3F+It+came+from+the+sentence+of+the+law%2C+whereby+he+was+hanged+upon+the+tree.+Moreover%2C+the+adjuvant+cause+was+those+outward+instruments%2C+the+wrath+and+malice+of+men%3A+%E2%80%9CFor+of+a+truth+against+thy+holy+child+Jesus%2C+whom+thou+hast+anointed%2C+both+Herod%2C+and+Pontius+Pilate%2C+with+the+Gentiles%2C+and+the+people+of+Israel%2C+were+gathered+together%2C%E2%80%9D+Acts+4%3A27.+Faith+considers+the+cause+whence+it+was+that+Christ+was+thus+given+up%2C+the+eternal+love+of+God%3B+the+procuring+cause+was+our+own+sins%3A+and+if+once+faith+takes+a+view+of+sin+as+that+which+hath+nailed+Christ+to+the+cross%2C+it+will+have+a+blessed+effect+on+the+soul.+And+it+considers+the+efficient+cause%3B+which+is+the+justice+and+righteousness+of+God%3A+the+law+of+God+was+the+instrument+in+the+hand+of+righteousness%2C+which+was+holpen+on+by+those+outward+instruments+who+had+a+hand+in+his+suffering%2C+but+none+in+his+sacrifice.+%5B4.%5D+Faith+considers+in+this+matter+the+end+of+this+separation+of+the+body+and+blood+of+Christ+which+is+thus+represented%3B+and+that+is%2C+ultimately+and+absolutely%2C+the+glory+of+God.+He+%E2%80%9Cset+him+forth+to+declare+his+righteousness%2C%E2%80%9D+Rom.+3%3A25%2C+Eph.+1%3A6.+God+aimed+at+the+glorifying+of+himself.+I+could+easily+manifest+unto+you+how+all+the+glorious+properties+of+his+nature+are+advanced%2C+exalted%2C+and+will+be+so+to+eternity%2C+in+this+suffering+of+Christ.+The+subordinate+ends+are+two%3B+I+mean+the+subordinate+ends+of+this+very+peculiar+act+of+separation+of+the+body+and+blood%3A%E2%80%941st.+It+was+to+confirm+the+covenant.+Every+covenant+of+old+was+to+be+ratified+and+confirmed+by+sacrifice%3B+and+in+confirming+the+covenant+by+sacrifice%2C+they+divided+the+sacrifice+into+two+parts%2C+and+passed+between+them+before+they+were+offered%3B+and+then+took+it+upon+themselves+that+they+would+stand+to+the+covenant+which+was+so+confirmed.+Jesus+Christ+being+to+confirm+the+covenant%2C+Heb.+9%3A16%2C+the+body+and+blood+of+Christ%2C+this+sacrifice%2C+was+to+be+parted%2C+that+this+covenant+might+be+confirmed.+And%2C%E2%80%942dly.+A+special+end+of+it+was%2C+for+the+confirming+and+strengthening+of+our+faith.+God+gives+out+unto+us+the+object+of+our+faith+in+parcels.+We+are+not+able+to+take+this+great+mysterious+fruit+of+God%E2%80%99s+love+in+gross%2C+in+the+lump%3B+and+therefore+he+gives+it+out%2C+I+say%2C+in+parcels.+We+shall+have+the+body+broken+to+be+considered%3B+and+the+blood+shed+is+likewise+to+be+considered.+This+is+the+peculiar+communion+which+we+have+with+Christ+in+this+ordinance%3B+because+there+are+peculiar+objects+for+faith+to+act+itself+upon+in+this+ordinance+above+others.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+9+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+523%E2%80%93527.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5e35feb96.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5e35feb96.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/owen-gives-us-theological-reasons-to-object-to-intinction/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-de0e31b76d" data-kw="">
<blockquote><p>XXV. Next follow the actions of the disciples, and consequently of the other guests. And these, according to Christ’s appointment, are three: first, to receive both the bread and the cup; but each separately, for so Christ distributed them: in this manner he commanded his people to take them; thus the body of Christ, as broken for us; his blood as poured out of his body, are more distinctly represented; and in fine, as a complete entertainment requires both meat and drink, so this most complete spiritual repast which we have in Christ, is thus most excellently represented. And therefore we cannot so well approve of that custom which prevailed in Cyprian’s time, to give a piece of bread dipt in wine to infants and the sick; which was the practice in some places, about the year of Christ 340, in the public and ordinary celebration of the sacrament. The same judgment we are to pass on the custom of the Greeks, who crumble the consecrated bread into the wine, and take it out with a spoon.</p></blockquote>

<blockquote><p>Respect the sacramental table to which you have approached, the bread of which you have partaken, the cup in which you have communicated, being consecrated by the sufferings of Christ.5 5. Note that this allusion implies that Communion in both Kinds was given separately, as in the Anglican Church, not by intinction, as in the present Orthodox Eastern Church. Gregory Nazianzen | “Select Orations of Saint Gregory Nazianzen,” in S. Cyril of Jerusalem, S. Gregory Nazianzen, ed. Philip Schaff and Henry Wace, trans. Charles Gordon Browne and James Edward Swallow, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), 40.31 (p. 371). The first mention of intinction in the West, is at Carthage in the fifth century. We know it was practised in the seventh century and by the twelfth it had become general, to give place to the withdrawal of the chalice altogether in the West. Henry R. Percival | “The Canons of the 318 Holy Fathers Assembled in the City of Nice, in Bithynia,” in The Seven Ecumenical Councils, ed. Philip Schaff and Henry Wace, vol. 14, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Charles Scribner’s Sons, 1900), 31. All forms of intinction had virtually disappeared in the W. by c. 1200. The third form (dipping the Host into the consecrated wine) has been sporadically revived in modern times in the Anglican Communion as a method both of reservation and of giving Communion to the sick. F. L. Cross and Elizabeth A. Livingstone | eds., The Oxford Dictionary of the Christian Church (Oxford; New York: Oxford University Press, 2005), s.v. “Intinction.</p></blockquote>

<blockquote><p>I conclude, then, that it is wicked and despotic to deny both kinds to the laity, and that this is not within the power of any angel, much less of any pope or council. Nor does the Council of Constance﻿﻿ give me pause, for if its authority is valid, why not that of the Council of Basel as well, which decreed to the contrary that the Bohemians should be permitted to receive the sacrament in both kinds?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Babylonian Captivity of the Church in Works</cite>, vol. 36.27</span></figcaption>

<blockquote><p>XV. The Arminians do cover themselves against this shower of arguments, with that their distinction of the antecedent and consequent will of God. They say that God does love some men more than other by his consequent will, that is, by that will which is after the faith and repentance of man: For God does love them most, whom he forsees will believe, and by their own free will, are to use grace well. But by his primary and antecedent will, God does alike love all men, and does equally desire the salvation of all; and therefore he doth give to all men sufficient grace for faith, and so for salvation. And the cause why the Gospel is not preached to all, they say, is not the will of God, but either the negligence of Christians, or the indignity and unworthiness of the people, or else the sins of their ancestors, who have rejected grace, being offered. XVI. Certainly this is a deadly speech, and is directly contrary, not only to the Scripture, but also to itself. For while they bring reasons, why God does not offer his Gospel to all, unawares they yield to our party; for they lay down the causes, why God does not equally love all: But the question is not, why God loves some men more than others, but whether God does love all men equally; therefore they entangle themselves. And how absurd that distinction is of the will of God into antecedent and consequent, how contumelious against God, in that sense in which it is taken by the sectaries, we have taught at large, Chap. 5. XVII. Moreover, they teach, that God is often disappointed of his antecedent will, and that the love of God to us is then mutable, if he love us with his consequent will, that is, by his will which is after our love and faith, and our own will. It is a wicked thing to desire, that the immutability of the love of God towards us, should be after our love, and should depend on our will; for the love of God cannot be certain, if it be grounded on the love wherewith we first love him. That therefore the love of God to us might be certain and immutable, it must needs go before our love, as Saint John teaches, 1. Epist. 4. 19. You love him, because he loved you first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, (London, 1620), 267–68 [spelling modernized].</span></figcaption>

</figure><figure class="quote" id="q-14bed2b0c7" data-kw="">
<blockquote><p>This communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being placed in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requires personal obedience, perfect obedience, and exact obedience. He that ‘continues not in all is cursed,’ Gal. 3:10. The law then finds us dead and kills us. It finds us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, ed. Alexander Balloch Grosart, vol. 6 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 3. [spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-03c0559bd9" data-kw="">
<blockquote><p>Let us, then, lay weight on every effect of the Holy Ghost in any of the particulars before mentioned, on this account, that they are acts of his love and power towards us. This faith will do, that takes notice of his Kindness in all things. Frequently he performs, in sundry particulars, the office of a comforter towards us, and we are not thoroughly comforted,—we take no notice at all of what he doth. Then is he grieved. Of those who do receive and own the consolation he tenders and administers, how few are there that consider him as the Comforter, and rejoice in him as they ought! Upon every work of consolation that the believer receives, this ought his faith to resolve upon,—“This is from the Holy Ghost; he is the Comforter, the God of all consolation; I know there is no joy, peace, hope, nor comfort, but what he works, gives, and bestows; and, that he might give me this consolation, he hath willingly condescended to this office of a comforter. His love was in it, and on that account doth he continue it. Also, he is sent by the Father and Son for that end and purpose. By this means come I to be partaker of my joy,—it is in the Holy Ghost; of consolation,—he is the Comforter. What price, now, shall I set upon his love! how shall I value the mercy that I have received!” This, I say, is applicable to every particular effect of the Holy Ghost towards us; and herein have we communion and fellowship with him, as was in part discovered in our handling the particulars. Doth he shed abroad the love of God in our hearts? doth he witness unto our adoption? The soul considers his presence, ponders his love, his condescension, goodness, and kindness; is filled with reverence of him, and cares [takes care] not to grieve him, and labours to preserve his temple, his habitation, pure and holy. Again: our communion with him causeth in us returning Praise, and thanks, and honour, and glory, and blessing to him, on the account of the mercies and privileges which we receive from him; which are many. Herein consists our next direction. So do we with the Son of God on the account of our redemption: “Unto him that loved us, and washed us from our sins in his own blood, to him be glory and dominion for ever and ever,” Rev. 1:5, 6. And are not the like praises and blessings due to him by whom the work of redemption is made effectual to us? who with no less infinite love undertook our consolation than the Son our redemption. When we feel our hearts warmed with joy, supported in peace, established in our obedience, let us ascribe to him the praise that is due to him, bless his name, and rejoice in him. And this glorifying of the Holy Ghost in thanksgivings, on a Spiritual sence of his consolations, is no small part of our communion with him. Considering his free engagement in this work, his coming forth from the Father to this purpose, his mission by the Son, and condescension therein, his love and kindness, the soul of a believer is poured out in thankful praises to him, and is sweetly affected with the duty. There is no duty that leaves a more heavenly savour in the soul than this doth. Also, in our prayers to him for the carrying on the work of our consolation, which he hath undertaken, lies our communion with him. John prays for grace and peace from the seven Spirits that are before the throne, or the Holy Ghost, whose operations are perfect and complete. This part of his worship is expressly mentioned frequently in Scripture; and all others do necessarily attend it. Let the saints consider what need they stand in of these effects of the Holy Ghost before mentioned, with many such others as might be insisted on; weigh all the privileges which we are made partakers of; remember that he distributes them as he will, that he hath the sovereign disposal of them; and they will be prepared for this duty.</p></blockquote>

e+Holy+Ghost+before+mentioned%2C+with+many+such+others+as+might+be+insisted+on%3B+weigh+all+the+privileges+which+we+are+made+partakers+of%3B+remember+that+he+distributes+them+as+he+will%2C+that+he+hath+the+sovereign+disposal+of+them%3B+and+they+will+be+prepared+for+this+duty.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+2+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+270%E2%80%9372.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03c0559bd9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03c0559bd9.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/11/owen-on-thanksgiving-and-our-communion-with-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>29. He who shall eat unworthily, eateth judgment to himself. He had previously pointed out in express terms the heinousness of the crime, when he said that those who should eat unworthily would be guilty of the body and blood of the Lord. Now he alarms them, by denouncing punishment; for there are many that are not affected with the sin itself, unless they are struck down by the judgment of God. This, then, he does, when he declares that this food, otherwise health-giving, will turn out to their destruction, and will be converted into poison to those that eat unworthily. He adds the reason—because they distinguish not the Lord’s body, that is, as a sacred thing from a profane. “They handle the sacred body of Christ with unwashen hands, (Mark 7:2,) nay more, as if it were a thing of nought, they consider not how great is the value of it. They will therefore pay the penalty of so dreadful a profanation.” Let my readers keep in mind what I stated a little ago, that the body is presented to them, though their unworthiness deprives them of a participation in it. For this cause, etc. After having treated in a general way of unworthy eating, and of the kind of punishment that awaits those who pollute this sacrament, he now instructs the Corinthians as to the chastisement which they were at that time enduring. It is not known whether a pestilence was raging there at that time, or whether they were labouring under other kinds of disease. However it may have been as to this, we infer from Paul’s words, that the Lord had sent some scourge upon them for their correction. Nor does Paul merely conjecture, that it is on that account that they are punished, but he affirms it as a thing that was perfectly well known by him. He says, then, that many lay sick—that many were kept long in a languishing condition, and that many had died, in consequence of that abuse of the Supper, because they had offended God. By this he intimates, that by diseases and other chastisements from God, we are admonished to think of our sins; for God does not afflict us without good reason, for he takes no pleasure in our afflictions. The subject is a copious and ample one; but let it suffice to advert to it here in a single word. If in Paul’s times an ordinary abuse of the Supper could kindle the wrath of God against the Corinthians, so that he punished them thus severely, what ought we to think as to the state of matters at the present day? We see, throughout the whole extent of Popery, not merely horrid profanations of the Supper, but even a sacrilegious abomination set up in its room. In the first place, it is prostituted to filthy lucre (1 Tim. 3:8) and merchandise. Secondly, it is maimed, by taking away the use of the cup. Thirdly, it is changed into another aspect, by its having become customary for one to partake of his own feast separately, participation being done away. Fourthly, there is there no explanation of the meaning of the sacrament, but a mumbling that would accord better with a magical incantation, or the detestable sacrifices of the Gentiles, than with our Lord’s institution. Fifthly, there is an endless number of ceremonies, abounding partly with trifles, partly with superstition, and consequently manifest pollutions. Sixthly, there is the diabolical invention of sacrifice, which contains an impious blasphemy against the death of Christ. Seventhly, it is fitted to intoxicate miserable men with carnal confidence, while they present it to God as if it were an expiation, and think that by this charm they drive off everything hurtful, and that without faith and repentance. Nay more, while they trust that they are armed against the devil and death, and are fortified against God by a sure defence, they venture to sin with much more freedom, and become more obstinate. Eighthly, an idol is there adored in the room of Christ. In short, it is filled with all kinds of abomination. Nay even among ourselves, who have the pure administration of the Supper restored to us, in virtue of a return, as it were, from captivity, how much irreverence! How much hypocrisy on the part of many! What a disgraceful mixture, while, without any discrimination, wicked and openly abandoned persons intrude themselves, such as no man of character and decency would admit to common intercourse! And yet after all, we wonder how it comes that there are so many wars, so many pestilences, so many failures of the crop, so many disasters and calamities—as if the cause were not manifest! And assuredly, we must not expect a termination to our calamities, until we have removed the occasion of them, by correcting our faults.</p></blockquote>

<blockquote><p>43. But as for the outward ceremony of the action — whether or not the believers take it in their hands, or divide it among themselves, or severally eat what has been given to each; whether they hand the cup back to the deacon or give it to the next person; whether the bread is leavened or unleavened; the wine red or white — it makes no difference. These things are indifferent, and left at the church’s discretion. However, it is certain that the practice of the ancient church was for all to take it in their hands. And Christ said, “Divide it among yourselves” [Luke 22:17, Vg.]. The histories narrate that common leavened bread was used before the time of the Roman Bishop Alexander, who was the first who delighted in unleavened bread. But I see no reason for this, unless to draw the eyes of the common people to wonderment by a new spectacle, rather than to instruct their minds in sound religion. I ask all who are in the least affected by a zeal for piety whether they do not clearly see both how much more brightly God’s glory shines here, and how much richer: sweetness of spiritual consolation comes to believers, than in these lifeless and theatrical trifles, which serve no other purpose than to deceive the sense of a people stupefied. They call this the holding of the people by religion when they lead them at will — dulled and befooled with superstition. If anyone should like to defend such inventions by appealing to antiquity, I also am not ignorant of how ancient the use of chrism and exsuffiation is in baptism; how soon after the apostolic age the Lord’s Supper was corrupted by rust. But this, indeed, is the stubborn boldness of men, which cannot restrain itself from always trifling and wantoning in God’s mysteries. Let us, however, remember that God so esteems obedience to his Word that he would have us judge both his angels and the whole world in its light [1 Corinthians 6:2-3; Galatians 1:8]. Now, to get rid of this great pile of ceremonies, the Supper could have been administered most becomingly if it were set before the church very often, and at least once a week. First, then, it should begin with public prayers. After this a sermon should be given. Then, when bread and wine have been placed on the Table, the minister should repeat the words of institution of the Supper. Next, he should recite the promises which were left to us in it; at the same time, he should excommunicate all who are debarred from it by the Lord’s prohibition. Afterward, he should pray that the Lord, with the kindness wherewith he has bestowed this sacred food upon us, also teach and form us to receive it with faith and thankfulness of heart, and, inasmuch as we are not so of ourselves, by his mercy make us worthy of such a feast. But here either psalms should be sung, or something be read, and in becoming order the believers should partake of the most holy banquet, the ministers breaking the bread and giving the cup. When the Supper is finished, there should be an exhortation to sincere faith and confession of faith, to love and behavior worthy of Christians. At the last, thanks should be given, and praises sung to God. When these things are ended, the church should be dismissed in peace. 44. …Luke relates in The Acts that this was the practice of the apostolic church, when he says that believers “…continued in the apostles’ teaching and fellowship, in the breaking of bread and in prayers” [Acts 2:42, cf. Vg.]. Thus it became the unvarying rule that no meeting of the church should take place without the Word, prayers, partaking of the Supper, and almsgiving. That this was the established order among the Corinthians also, we can safely infer from Paul [cf. 1 Corinthians 11:20]. And it remained in use for many centuries after.</p></blockquote>

<blockquote><p>THE OBSERVANCE OF THE SUPPER WITH BOTH BREAD AND WINE. We think that rite, manner, or form of the Supper to be the most simple and excellent which comes nearest to the first institution of the Lord and to the apostles’ doctrine. It consists in proclaiming the Word of God, in godly prayers, in the action of the Lord himself, and its repetition, in the eating of the Lord’s body and drinking of this blood; in a fitting remembrance of the Lord’s death, and a faithful thanksgiving; and in a holy fellowship in the union of the body of the Church. We therefore disapprove of those who have taken from the faithful one species of the sacrament, namely, the Lord’s cup. For these seriously offend against the institution of the Lord who says: “Drink ye all of this”; which he did not so expressly say of the bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Helvetic Confession(1566)</cite>, 21</span></figcaption>

<blockquote><p>That we ought not to take from the laity the wine of the supper. Gelasius Pope of Rome, of consecration in that the second distinction, chapter Comperimus etc. “We have understood that some men receiving only the body of the Lord, do abstain themselves from the cup, who for as much as they sin by superstition, ought to be contravened and compelled to receive the sacrament wholly or else to reject it altogether. For the division of this mystery cannot be without great sacrilege. Jesus Christ commanded in his Supper and said: drink all of this, for this is my blood of the new testament.” The Council of Basle has ordained that the laity should communicate the supper in two kinds. St. Cyprian in his sermon on penitent sinners: “How shall we exhort the people to shed their blood for the confession of Christ, if we deny to them the blood of him when they ought to fight or how can we make ourselves capable to drink the cup of martyrdom, except that we suffer ourselves first to drink the cup of the Lord?</p></blockquote>

</figure><figure class="quote" id="q-17a98c4e84" data-kw="">
<blockquote><p>For though Christ the Lord at the last supper instituted and delivered to the Apostles this venerable sacrament under the forms of bread and wine, yet that institution and administration do signify that all the faithful are by an enactment of the Lord to receive under both forms (Chapter 1) It declares furthermore, that in the dispensation of the sacraments…the Church may, according to circumstances, times and places, determine or change whatever she may judge most expedient for the benefit of those receiving them or for the veneration of the sacraments; and this power has always been hers” (Chapter 2). …Wherefore from the beginning of the Christian religion the use of both forms has not been infrequent, yet since that custom has already very widely changed, holy mother Church, cognizant of her authority in the administration of the sacraments, has induced by just and weighty reasons, approved this custom of communicating under either species and has decreed that it be considered the law, which may not be repudiated for changed at pleasure with the authority of the Church. (Chapter 2) …If anyone says that each and all the faithful of Christ are by a precept of God or by the necessity of salvation bound to receive both species of the most holy sacrament of the Eucharist, let him be anathema (Canon 1).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For though Christ the Lord at the last supper instituted and delivered to the Apostles this venerable sacrament under the forms of bread and wine, yet that institution and administration do signify that all the faithful are by an enactment of the Lord to receive under both forms (Chapter 1) It declares furthermore, that in the dispensation of the sacraments…the Church may, according to circumstances, times and places, determine or change whatever she may judge most expedient for the benefit of those receiving them or for the veneration of the sacraments; and this power has always been hers” (Chapter 2). …Wherefore from the beginning of the Christian religion the use of both forms has not been infrequent, yet since that custom has already very widely changed, holy mother Church, cognizant of her authority in the administration of the sacraments, has induced by just and weighty reasons, approved this custom of communicating under either species and has decreed that it be considered the law, which may not be repudiated for changed at pleasure with the authority of the Church. (Chapter 2) …If anyone says that each and all the faithful of Christ are by a precept of God or by the necessity of salvation bound to receive both species of the most holy sacrament of the Eucharist, let him be anathema (Canon 1).”

<figure class="quote" id="q-faa49b0340" data-kw="">
<blockquote><p>By reason, therefore, of this laver of repentance and knowledge of God, which has been ordained on account of the transgression of God’s people, as Isaiah cries, we have believed, and testify that that very baptism which he announced is alone able to purify those who have repented; and this is the water of life. But the cisterns which you have dug for yourselves are broken and profitless to you. For what is the use of that baptism which cleanses the flesh and body alone? Baptize the soul from wrath and from covetousness, from envy, and from hatred; and, lo! the body is pure. For this is the symbolic significance of unleavened bread, that you do not commit the old deeds of wicked leaven. But you have understood all things in a carnal sense, and you suppose it to be piety if you do such things, while your souls are filled with deceit, and, in short, with every wickedness. Accordingly, also, after the seven days of eating unleavened bread, God commanded them to mingle new leaven, that is, the performance of other works, and not the imitation of the old and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho the Jew</cite>, Ch. 14, Righteousness is Not Placed in Jewish Rites, but in the Conversion of the Heart Given in Baptism by Christ.</span></figcaption>

</figure><figure class="quote" id="q-98af2d2317" data-kw="">
<blockquote><p>In regard to the external form of the ordinance, whether or not believers are to take into their hands and divide among themselves, or each is to eat what is given to him; whether they are to return the cup to the deacon or hand it to their neighbor; whether the bread is to be leavened or unleavened, and the wine to be red or white, is of no consequence. These things are indifferent, and left free to the Church, though it is certain that it was the custom of the ancient Church for all to receive into their hand. And Christ said, “Take this, and divide it among yourselves” (Luk_12:17). History relates that leavened and ordinary bread was used before the time of Alexander the Bishop of Rome, who was the first that was delighted with unleavened bread: for what reason I see not, unless it was to draw the wondering eyes of the populace by the novelty of the spectacle, more than to train them in sound religion. I appeal to all who have the least zeal for piety, whether they do not evidently perceive both how much more brightly the glory of God is here displayed and how much more abundant spiritual consolation is felt by believers than in these frigid and histrionic [exaggerated dramatic behavior designed to attract attention] follies, which have no other use than to impose on the gazing populace. They call it restraining the people by religion, when, stupid and infatuated, they are drawn hither and thither by superstition. Should any one choose to defend such inventions by antiquity, I am not unaware how ancient is the use of Christ and exorcism in baptism, and how, not long after the age of the apostles, the Supper was tainted with adulteration; such, indeed, is the forwardness of human confidence, which cannot restrain itself, but is always sporting and wantoning in the mysteries of God. But let us remember that God sets so much value on obedience to his word, that, by it, He would have us to judge his angels and the whole world. All this mass of ceremonies being abandoned, the sacrament might be celebrated in the most becoming manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, vol. 2, Ed. John McNeill, Tr. Ford Battles (Philadelphia: The Westminster Press, 1960) 1420-1422, this quote was compiled by Peter Allison.</span></figcaption>

</figure><figure class="quote" id="q-752dfaf3c6" data-kw="">
<blockquote><p>Secondly, it was not of the substance of the institution [of the Lord’s Supper] to eat unleavened bread, no more than to eat it at night… we are not more bound to the one, than to the other. Again, Christ used unleavened bread because it was the usual bread at that time: so we do use that which is the usual bread in our time. And St. Paul speaketh of such bread as was usual among the gentiles, when he saith, ‘The bread which we break’, 1. Cor. 10:17. Ergo, ordinary bread and leavened [is] to be used, not unleavened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Concerning the Elements, or the Material Part of the Sacrament, namely Bread and Wine’ in Synopsis Papismi</cite>, (London, 1592), Controversies Concerning the Church Triumphant, 13th Controversy, of the Sacrament of the Lord’s Supper, First Part: of the Sacrament of the Eucharist, 4th Question, p. 462</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

— Andrew Willet, ‘Concerning the Elements, or the Material Part of the Sacrament, namely Bread and Wine’ in Synopsis Papismi, (London, 1592), Controversies Concerning the Church Triumphant, 13th Controversy, of the Sacrament of the Lord’s Supper, First Part: of the Sacrament of the Eucharist, 4th Question, p. 462">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+it+was+not+of+the+substance+of+the+institution+%5Bof+the+Lord%E2%80%99s+Supper%5D+to+eat+unleavened+bread%2C+no+more+than+to+eat+it+at+night%E2%80%A6+we+are+not+more+bound+to+the+one%2C+than+to+the+other.+Again%2C+Christ+used+unleavened+bread+because+it+was+the+usual+bread+at+that+time%3A+so+we+do+use+that+which+is+the+usual+bread+in+our+time.+And+St.+Paul+speaketh+of+such+bread+as+was+usual+among+the+gentiles%2C+when+he+saith%2C+%E2%80%98The+bread+which+we+break%E2%80%99%2C+1.+Cor.+10%3A17.+Ergo%2C+ordinary+bread+and+leavened+%5Bis%5D+to+be+used%2C+not+unleavened.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+%E2%80%98Concerning+the+Elements%2C+or+the+Material+Part+of+the+Sacrament%2C+namely+Bread+and+Wine%E2%80%99+in+Synopsis+Papismi%2C+%28London%2C+1592%29%2C+Controversies+Concerning+the+Church+Triumphant%2C+13th+Controversy%2C+of+the+Sacrament+of+the+Lord%E2%80%99s+Supper%2C+First+Part%3A+of+the+Sacrament+of+the+Eucharist%2C+4th+Question%2C+p.+462&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F752dfaf3c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/752dfaf3c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=Secondly%2C%20it%20was%20not%20of%20the,is%5D%20to%20be%20used%2C%20not%20unleavened&amp;text=Secondly%2C%20it%20was%20not%20of%20the%20substance%20of&amp;text=and%20leavened%20%5Bis%5D%20to%20be%20used%2C%20not%20unleavened" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0fbb9ae289" data-kw="">
<blockquote><p>He took bread. The bread which Christ took was leavened bread, such as they ate at the feast of the Passover. This circumstance, however, does not properly belong to the Supper, any more than the evening at which time it was instituted; for the use of leavened bread at the institution was accidental. Hence we must not infer from this that there is any necessity for the use of such bread in the celebration of the Supper, or that Christ would lay down any particular way of baking or using it. Yet still the bread which is used in the celebration of the Lord’s supper differs from common bread, for whilst the latter is eaten for the nourishment of the body, the former is received for the nourishment of the soul, or for the confirmation of our faith, and union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, reprinted 1888, trans. G.W. Williard, 4th American ed,, Cincinnati, | Question 77, p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-a019d5253b" data-kw="">
<blockquote><p>In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.”

</figure><figure class="quote" id="q-364d33927d" data-kw="">
<blockquote><p>The Lord’s Supper is the other Sacrament of the New Testament; in which Christians that are of age, receive spiritually Christ’s body and blood sealed to them in the reception of Bread and Wine according to Christ’s institution. The Rules …

III. The outward matter thereof, or Signs, are Bread and Wine.

IV. The Supper is lame, without both Signs; and to rob the people of the Cup, is Sacrilege.

V. The inward matter is Christ, with all his satisfaction and merit.

VI. As it is Jewish superstition, to use unleavened Bread; so the Popish Penny-Wafers are superstitious relics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity 3rd</cite>, ed. (London, 1660), p. 197, Ch. 24 – Of the Lord’s Supper</span></figcaption>

</figure><figure class="quote" id="q-894e025b26" data-kw="">
<blockquote><p>An act of Christ alone is not sufficient to form a command; for although He consecrated in white wine, or at night, for example, He did not on that account command us to consecrate” (3. Thom. De Sacra. +). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, ed. James Dennison Jr., 1997, p. 430 | 19th Topic: The Sacraments | 22nd Question: Why was the holy Supper instituted by our Lord and of how many parts does it consist? | The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever He did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks:</span></figcaption>

</figure><figure class="quote" id="q-efc52c85f3" data-kw="">
<blockquote><p>The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

<blockquote><p>But I come back to your interrogatories. You say, “The bread which our Savior brake, was surely unleavened. No other was in existence among the Jews on the Passover day. How do you justify the use of leavened bread at our sacramental table?</p></blockquote>

</figure><figure class="quote" id="q-a96796ee1c" data-kw="">
<blockquote><p>Took bread. Matthew 26:26 , it is said, “ as they were eating, ” i.e. during the repast, “ Jesus took bread, ” that is, he took of the bread lying on the table; and as it was at the time of the Passover, there is no doubt that the bread used was unleavened. It was the thin Passover bread of the Jews. But as no part of the significancy of the rite depends on the kind of bread used, as there is no precept on the subject, and as the apostles subsequently in the celebration of the ordinance used ordinary bread, it is evidently a matter of indifference what kind of bread is used. It was however for a long time a subject of bitter controversy. At first the Latins and Greeks used leavened bread; when the Latins introduced the unleavened wafer from superstitious fear of any of the fragments being dropped, the Greeks retained the use of fermented bread, and accused the Latins of Judaizing. Romanists and Lutherans use unleavened wafers; Protestants generally ordinary bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1878 | This quote was compiled by Andy Webb</span></figcaption>

<blockquote><p>2nd, from the significancy of the symbol; since bread, as the principal natural nourishment of our bodies, represents his flesh, which, as living bread, he gave for the life of the world.–– John 6:51 . But the kind of bread, whether leavened or unleavened, is not specified in the command, nor is it rendered essential by the nature of the service. Christ used unleavened bread because it was present at the Passover. The early Christians celebrated the Communion at a common meal, with the bread of common life, which was leavened. The Romish Church has used unleavened bread ever since the eighth century, and commands the use of the same as the only proper kind, but does not make it essential (“Cat. Conc. Trident.,” Pt. 2, ch. 4:, &amp;&amp; 13 and 14). The Greek Church insists upon the use of leavened bread. The Lutherans Church uses unleavened bread. The Reformed Church, including the Church of England, regards the use of leavened bread, as the food of common life, to be most proper, since bread in the Supper is the symbol of spiritual nourishment. The use of sweet cake, practiced in some of our churches is provincial and arbitrary, and is without any support in Scripture, tradition, or good taste.</p></blockquote>

d%2C%20from%20the%20significancy%20of%20the%20symbol%3B%20since&amp;text=any%20support%20in%20Scripture%2C%20tradition%2C%20or%20good%20taste" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>After the thanksgiving, it is very clear that our Divine Lord broke the bread. We scarcely know what kind of bread was used on that occasion; it was probably the thin passover cake of the Jews; but there is nothing said in Scripture about the use of leavened or unleavened bread, and therefore it matters not which we use. Where there is no ordinance, there is no obligation; and we are, therefore, left free to use the bread. which it is our custom to eat.</p></blockquote>

<blockquote><p>With the dough they had brought from Egypt, they baked cakes of unleavened bread. The dough was without yeast because they had been driven out of Egypt and did not have time to prepare food for themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-reyburn.html">Robert Reyburn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite>, “First, a rationale is provided for the use of unleavened bread in the Passover Feast. That is, we know why it was used. The reason is given in Exodus 12:34,39.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

— Robert Reyburn, This quote was compiled by Andy Webb, “First, a rationale is provided for the use of unleavened bread in the Passover Feast. That is, we know why it was used. The reason is given in Exodus 12:34,39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWith+the+dough+they+had+brought+from+Egypt%2C+they+baked+cakes+of+unleavened+bread.+The+dough+was+without+yeast+because+they+had+been+driven+out+of+Egypt+and+did+not+have+time+to+prepare+food+for+themselves.%E2%80%9D%0A%0A%E2%80%94+Robert+Reyburn%2C+This+quote+was+compiled+by+Andy+Webb%2C+%E2%80%9CFirst%2C+a+rationale+is+provided+for+the+use+of+unleavened+bread+in+the+Passover+Feast.+That+is%2C+we+know+why+it+was+used.+The+reason+is+given+in+Exodus+12%3A34%2C39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6db4634bd4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6db4634bd4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=With%20the%20dough%20they%20had%20brought,time%20to%20prepare%20food%20for%20themselves&amp;text=With%20the%20dough%20they%20had%20brought%20from%20Egypt&amp;text=not%20have%20time%20to%20prepare%20food%20for%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e063738240" data-kw="">
<blockquote><p>1. In all three Gospels what Jesus gave the disciples is [in Greek] “artos,” meaning simply “bread.” It is striking that He is not said to have given them “azumos” or “azuma” which are the proper words for unleavened bread, AND which are clearly available since they are used in each of the Gospels in the context to refer to the Passover. In other words, the use of “artos” by Matthew, Mark and Luke to tell us what Jesus gave the disciples makes the fact that this may have been unleavened bread of NO importance. At the same time we also must recognize that because the Scripture NOWHERE calls it “unleavened bread,” we cannot at all be sure that it was (throughout the NT “artos” is used for common or leavened bread). We simply may not base our teaching on the silence of Scripture because then we are really basing our teaching on a human conjecture. So, the fundamental argument, “Jesus used unleavened bread, therefore we should too,” is in fundamental error. This should close the case, but there is more.

2. To use unleavened bread in the Lord’s Supper is to commemorate the wrong thing. The purpose of unleavened bread in the Passover is to commemorate the haste with which Israel left Egypt; there was not even enough time to put yeast into the bread dough. In the Lord’s Supper we are NOT commemorating the Exodus from Egypt where unleavened bread makes sense. In the Lord’s Supper we are commemorating the sacrifice of Christ for our sins. In the Supper the bread is broken to recall Christ’s suffering and death, the breaking of His body. Other things could be said, but there is nothing in unleavening the bread of the Supper that would commemorate anything in the death of Christ that is taught in Scripture (unless we really let our imaginations run loose here – and then we are back to conjecture).

3. Thus using unleavened bread in the Supper is an unwarranted return to Old Testament shadows (commemorating the Passover instead of Christ’s death) and therefore ought to be resisted. The historic Reformed characterization of the Mass as a return to OT shadows of pictorial ceremonialism is common and fits here.

4. “The kingdom of heaven is not food and drink, but righteousness and joy and peace in the Holy Spirit” (Romans 10). This teaches us that an emphasis on a detail of food is not characteristic of the New Testament, quite in contrast with the Old. Thus the insistence on unleavened bread in the Supper is more typical of an OT ceremony than an NT one. Ah, you say, this also applies to the wine. Indeed it does. None, I hope, would claim that those who use grape juice are celebrating something else than the Lord’s Supper. Nevertheless there is a positive argument to use wine in Christ’s words found in all three Gospels, “I will not eat of this fruit of the vine from now on, until I eat it new with you in the Kingdom of God.” The proper understanding of this “fruit of the vine” is wine. So we drink wine, looking forward to the heavenly supper in Christ’s presence where He will drink it with us.

5. Another old Reformed argument is that if Christ used unleavened bread, He was using the bread at hand in the Passover not out of symbolism but out of convenience. He did not go out of the way to obtain leavened bread. In the same way, runs the argument, we too should use our common bread (which IS leavened) and not go out of our way to obtain something special. This argument stands alongside one that says that in order to preserve the meaning of the Supper that we are nourished spiritually by Christ’s body, we should use the bread that we ordinarily use to nourish our bodies, and that would, of course, be leavened bread. These are theological arguments, not directly biblical, but I do think that they do carry the analogy of Scripture, especially in light of the very biblical fact that the kingdom of God is NOT details of food, as we noted above. 6. 1 Cor. 5:8 is not talking about WHAT we eat, but HOW we eat the Lord’s supper. It speaks of unleavened people, not about going back to replaying the Passover with its use of unleavened bread. The unleavened bread in the Passover reflects the haste with which Israel left Egypt, without time to even put yeast into their bread. The Lord’s supper reflects not on a hasty exit from Egypt, but on the death of Christ for our sins, which makes HIM “our passover.” The bread represents the body of Christ in the Lord’s Supper, unleavening the bread in the Supper has no significance with respect to Christ’s sacrifice. Thus using unleavened bread would, as mentioned above, be going back to the OT Passover as though we were still celebrating the Exodus from Egypt in the Supper, rather than Christ’s sacrifice for our sins. 7. In the rest of the New Testament the Lord’s Supper is often called “breaking bread,” the same language that is used for ordinary meals (Acts 2:42 for example is most likely speaking of fellowship in a meal rather than the Lord’s Supper because in the immediate context they “ate their bread from house to house.”) In any case, the word “artos” is used for what is broken. There is never a description of the Supper in the NT in which that which is broken or eaten is called anything but “artos.” This argues quite strongly against requiring unleavened bread in the Supper because “artos” in a general use would simply mean ordinary bread.</p></blockquote>

2. To use unleavened bread in the Lord’s Supper is to commemorate the wrong thing. The purpose of unleavened bread in the Passover is to commemorate the haste with which Israel left Egypt; there was not even enough time to put yeast into the bread dough. In the Lord’s Supper we are NOT commemorating the Exodus from Egypt where unleavened bread makes sense. In the Lord’s Supper we are commemorating the sacrifice of Christ for our sins. In the Supper the bread is broken to recall Christ’s suffering and death, the breaking of His body. Other things could be said, but there is nothing in unleavening the bread of the Supper that would commemorate anything in the death of Christ that is taught in Scripture (unless we really let our imaginations run loose here – and then we are back to conjecture).

3. Thus using unleavened bread in the Supper is an unwarranted return to Old Testament shadows (commemorating the Passover instead of Christ’s death) and therefore ought to be resisted. The historic Reformed characterization of the Mass as a return to OT shadows of pictorial ceremonialism is common and fits here.

4. “The kingdom of heaven is not food and drink, but righteousness and joy and peace in the Holy Spirit” (Romans 10). This teaches us that an emphasis on a detail of food is not characteristic of the New Testament, quite in contrast with the Old. Thus the insistence on unleavened bread in the Supper is more typical of an OT ceremony than an NT one. Ah, you say, this also applies to the wine. Indeed it does. None, I hope, would claim that those who use grape juice are celebrating something else than the Lord’s Supper. Nevertheless there is a positive argument to use wine in Christ’s words found in all three Gospels, “I will not eat of this fruit of the vine from now on, until I eat it new with you in the Kingdom of God.” The proper understanding of this “fruit of the vine” is wine. So we drink wine, looking forward to the heavenly supper in Christ’s presence where He will drink it with us.

5. Another old Reformed argument is that if Christ used unleavened bread, He was using the bread at hand in the Passover not out of symbolism but out of convenience. He did not go out of the way to obtain leavened bread. In the same way, runs the argument, we too should use our common bread (which IS leavened) and not go out of our way to obtain something special. This argument stands alongside one that says that in order to preserve the meaning of the Supper that we are nourished spiritually by Christ’s body, we should use the bread that we ordinarily use to nourish our bodies, and that would, of course, be leavened bread. These are theological arguments, not directly biblical, but I do think that they do carry the analogy of Scripture, especially in light of the very biblical fact that the kingdom of God is NOT details of food, as we noted above. 6. 1 Cor. 5:8 is not talking about WHAT we eat, but HOW we eat the Lord’s supper. It speaks of unleavened people, not about going back to replaying the Passover with its use of unleavened bread. The unleavened bread in the Passover reflects the haste with which Israel left Egypt, without time to even put yeast into their bread. The Lord’s supper reflects not on a hasty exit from Egypt, but on the death of Christ for our sins, which makes HIM “our passover.” The bread represents the body of Christ in the Lord’s Supper, unleavening the bread in the Supper has no significance with respect to Christ’s sacrifice. Thus using unleavened bread would, as mentioned above, be going back to the OT Passover as though we were still celebrating the Exodus from Egypt in the Supper, rather than Christ’s sacrifice for our sins. 7. In the rest of the New Testament the Lord’s Supper is often called “breaking bread,” the same language that is used for ordinary meals (Acts 2:42 for example is most likely speaking of fellowship in a meal rather than the Lord’s Supper because in the immediate context they “ate their bread from house to house.”) In any case, the word “artos” is used for what is broken. There is never a description of the Supper in the NT in which that which is broken or eaten is called anything but “artos.” This argues quite strongly against requiring unleavened bread in the Supper because “artos” in a general use would simply mean ordinary bread.”

— Robert Grossman, See here for a bio. This quote was compiled by Andy Webb">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+In+all+three+Gospels+what+Jesus+gave+the+disciples+is+%5Bin+Greek%5D+%E2%80%9Cartos%2C%E2%80%9D+meaning+simply+%E2%80%9Cbread.%E2%80%9D+It+is+striking+that+He+is+not+said+to+have+given+them+%E2%80%9Cazumos%E2%80%9D+or+%E2%80%9Cazuma%E2%80%9D+which+are+the+proper+words+for+unleavened+bread%2C+AND+which+are+clearly+available+since+they+are+used+in+each+of+the+Gospels+in+the+context+to+refer+to+the+Passover.+In+other+words%2C+the+use+of+%E2%80%9Cartos%E2%80%9D+by+Matthew%2C+Mark+and+Luke+to+tell+us+what+Jesus+gave+the+disciples+makes+the+fact+that+this+may+have+been+unleavened+bread+of+NO+importance.+At+the+same+time+we+also+must+recognize+that+because+the+Scripture+NOWHERE+calls+it+%E2%80%9Cunleavened+bread%2C%E2%80%9D+we+cannot+at+all+be+sure+that+it+was+%28throughout+the+NT+%E2%80%9Cartos%E2%80%9D+is+used+for+common+or+leavened+bread%29.+We+simply+may+not+base+our+teaching+on+the+silence+of+Scripture+because+then+we+are+really+basing+our+teaching+on+a+human+conjecture.+So%2C+the+fundamental+argument%2C+%E2%80%9CJesus+used+unleavened+bread%2C+therefore+we+should+too%2C%E2%80%9D+is+in+fundamental+error.+This+should+close+the+case%2C+but+there+is+more.+2.+To+use+unleavened+bread+in+the+Lord%E2%80%99s+Supper+is+to+commemorate+the+wrong+thing.+The+purpose+of+unleavened+bread+in+the+Passover+is+to+commemorate+the+haste+with+which+Israel+left+Egypt%3B+there+was+not+even+enough+time+to+put+yeast+into+the+bread+dough.+In+the+Lord%E2%80%99s+Supper+we+are+NOT+commemorating+the+Exodus+from+Egypt+where+unleavened+bread+makes+sense.+In+the+Lord%E2%80%99s+Supper+we+are+commemorating+the+sacrifice+of+Christ+for+our+sins.+In+the+Supper+the+bread+is+broken+to+recall+Christ%E2%80%99s+suffering+and+death%2C+the+breaking+of+His+body.+Other+things+could+be+said%2C+but+there+is+nothing+in+unleavening+the+bread+of+the+Supper+that+would+commemorate+anything+in+the+death+of+Christ+that+is+taught+in+Scripture+%28unless+we+really+let+our+imaginations+run+loose+here+%E2%80%93+and+then+we+are+back+to+conjecture%29.+3.+Thus+using+unleavened+bread+in+the+Supper+is+an+unwarranted+return+to+Old+Testament+shadows+%28commemorating+the+Passover+instead+of+Christ%E2%80%99s+death%29+and+therefore+ought+to+be+resisted.+The+historic+Reformed+characterization+of+the+Mass+as+a+return+to+OT+shadows+of+pictorial+ceremonialism+is+common+and+fits+here.+4.+%E2%80%9CThe+kingdom+of+heaven+is+not+food+and+drink%2C+but+righteousness+and+joy+and+peace+in+the+Holy+Spirit%E2%80%9D+%28Romans+10%29.+This+teaches+us+that+an+emphasis+on+a+detail+of+food+is+not+characteristic+of+the+New+Testament%2C+quite+in+contrast+with+the+Old.+Thus+the+insistence+on+unleavened+bread+in+the+Supper+is+more+typical+of+an+OT+ceremony+than+an+NT+one.+Ah%2C+you+say%2C+this+also+applies+to+the+wine.+Indeed+it+does.+None%2C+I+hope%2C+would+claim+that+those+who+use+grape+juice+are+celebrating+something+else+than+the+Lord%E2%80%99s+Supper.+Nevertheless+there+is+a+positive+argument+to+use+wine+in+Christ%E2%80%99s+words+found+in+all+three+Gospels%2C+%E2%80%9CI+will+not+eat+of+this+fruit+of+the+vine+from+now+on%2C+until+I+eat+it+new+with+you+in+the+Kingdom+of+God.%E2%80%9D+The+proper+understanding+of+this+%E2%80%9Cfruit+of+the+vine%E2%80%9D+is+wine.+So+we+drink+wine%2C+looking+forward+to+the+heavenly+supper+in+Christ%E2%80%99s+presence+where+He+will+drink+it+with+us.+5.+Another+old+Reformed+argument+is+that+if+Christ+used+unleavened+bread%2C+He+was+using+the+bread+at+hand+in+the+Passover+not+out+of+symbolism+but+out+of+convenience.+He+did+not+go+out+of+the+way+to+obtain+leavened+bread.+In+the+same+way%2C+runs+the+argument%2C+we+too+should+use+our+common+bread+%28which+IS+leavened%29+and+not+go+out+of+our+way+to+obtain+something+special.+This+argument+stands+alongside+one+that+says+that+in+order+to+preserve+the+meaning+of+the+Supper+that+we+are+nourished+spiritually+by+Christ%E2%80%99s+body%2C+we+should+use+the+bread+that+we+ordinarily+use+to+nourish+our+bodies%2C+and+that+would%2C+of+course%2C+be+leavened+bread.+These+are+theological+arguments%2C+not+directly+biblical%2C+but+I+do+think+that+they+do+carry+the+analogy+of+Scripture%2C+especially+in+light+of+the+very+biblical+fact+that+the+kingdom+of+God+is+NOT+details+of+food%2C+as+we+noted+above.+6.+1+Cor.+5%3A8+is+not+talking+about+WHAT+we+eat%2C+but+HOW+we+eat+the+Lord%E2%80%99s+supper.+It+speaks+of+unleavened+people%2C+not+about+going+back+to+replaying+the+Passover+with+its+use+of+unleavened+bread.+The+unleavened+bread+in+the+Passover+reflects+the+haste+with+which+Israel+left+Egypt%2C+without+time+to+even+put+yeast+into+their+bread.+The+Lord%E2%80%99s+supper+reflects+not+on+a+hasty+exit+from+Egypt%2C+but+on+the+death+of+Christ+for+our+sins%2C+which+makes+HIM+%E2%80%9Cour+passover.%E2%80%9D+The+bread+represents+the+body+of+Christ+in+the+Lord%E2%80%99s+Supper%2C+unleavening+the+bread+in+the+Supper+has+no+significance+with+respect+to+Christ%E2%80%99s+sacrifice.+Thus+using+unleavened+bread+would%2C+as+mentioned+above%2C+be+going+back+to+the+OT+Passover+as+though+we+were+still+celebrating+the+Exodus+from+Egypt+in+the+Supper%2C+rather+than+Christ%E2%80%99s+sacrifice+for+our+sins.+7.+In+the+rest+of+the+New+Testament+the+Lord%E2%80%99s+Supper+is+often+called+%E2%80%9Cbreaking+bread%2C%E2%80%9D+the+same+language+that+is+used+for+ordinary+meals+%28Acts+2%3A42+for+example+is+most+likely+speaking+of+fellowship+in+a+meal+rather+than+the+Lord%E2%80%99s+Supper+because+in+the+immediate+context+they+%E2%80%9Cate+their+bread+from+house+to+house.%E2%80%9D%29+In+any+case%2C+the+word+%E2%80%9Cartos%E2%80%9D+is+used+for+what+is+broken.+There+is+never+a+description+of+the+Supper+in+the+NT+in+which+that+which+is+broken+or+eaten+is+called+anything+but+%E2%80%9Cartos.%E2%80%9D+This+argues+quite+strongly+against+requiring+unleavened+bread+in+the+Supper+because+%E2%80%9Cartos%E2%80%9D+in+a+general+use+would+simply+mean+ordinary+bread.%E2%80%9D%0A%0A%E2%80%94+Robert+Grossman%2C+See+here+for+a+bio.+This+quote+was+compiled+by+Andy+Webb&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe063738240.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e063738240.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=1.%20In%20all%20three%20Gospels%20what,use%20would%20simply%20mean%20ordinary%20bread&amp;text=1.%20In%20all%20three%20Gospels%20what%20Jesus%20gave&amp;text=a%20general%20use%20would%20simply%20mean%20ordinary%20bread" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Another question arises about the reality of real relation, namely whether there is a real distinction between the relation itself and its absolute foundation, on which see chapter 8 below. Quantity too gives some difficulty, namely whether it is merely a mode or modal accident of substance or not. For Scholastics, in order to explain how the sensible species of the Eucharist can be sustained miraculously in the absence of the substance of bread and wine, seem to have changed, and perhaps not a little, the original Aristotelian opinion. But this question seems rather to belong to theology than to philosophy.</p></blockquote>

<blockquote><p>I do not know of any satisfactory answer to this problem,” Kenny continued. “If I did, I would give it. Since I do not, I must leave it, as the writers of textbooks say, as an exercise for the reader” (A Path from Rome, 1986, 167–168). These questions may seem abstruse… But the question of Christ’s presence now on the altar is… central to the consecration and adoration of the Eucharist [in Romanism]. It is a question that many others besides Thomas Aquinas sought to answer, and a seriously inquiring intellect might rightly be disturbed, even scandalized, if forbidden to ask it. But for a long time Thomas’s answer was accepted just because it was his… Thomas’s answer to Kenny’s question can, in fact, be found in other Scholastics who variously adopt the principle that “that into which something is converted is where the converted thing was before.” This principle is dubious and was not universally accepted. Since transubstantiation converts only the substance of the bread into Christ’s body and not also the accidents, why should any of the accidents of the bread be kept by Christ’s body if, according to the doctrine, the accidents are not part of the transubstantiation? [Simpson goes on to describe Scotus’s proposed answer to the issue.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-l-p-simpson.html">Peter L.P. Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Have you Tried Scotus? Aquinas Didn’t Know Everything’ in Commonweal</cite>, (June 14, 2019), p. 12</span></figcaption>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-644a4b274b" data-kw="">
<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’

II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, … (Cambridge, 1596), pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>

<blockquote><p>The apostle says, ‘If meat make my brother to offend, I will eat no flesh while the world standeth.’ (1 Cor. 8:13) Now put the case the apostle had been hindered from preaching the Gospel for his precise abstaining from those meats whereat his brother would be offended, would he in that case have eaten? Nay, he says peremptorily that whiles the world stands, he would not eat.</p></blockquote>

<blockquote><p>Answer 1: Here be the white-shifts of Mr. Sanderson, Paybodie, Downham, who place loyalty above charity. We owe to our brother love, but to the ruler (say they) love and justice. [Answer] 2. It is true, these duties which we owe to others by way of justice are more obligatory than these which we owe only by way of charity, caeteris paribus [all things being equal], when duties of the law of Nature, and moral Law, are compared together, then indeed the duties which we owe, both by the tie of justice and charity, are more obligatory, than the duties that we owe only by the tie of charity. As for example: My father is in danger before my eyes to be drowned in one deep water; and before my eyes also, my neighbor and friend is in danger of the like kind; the two ties and bands of justice and charity, both by the fifth and sixth Commandments are more obligatory, hic &amp; nunc [here and now], and do more strictly oblige that I run to succor, and preserve the life of my father, than the life of my neighbor; for the obligation to my neighbor, is only charity, by the obligation of the sixth Commandment, which obligation ceases, hic &amp; nunc, at this time when my father’s life is in hazard; and thus far the doctor’s argument goes for strong, as schoolmen, casuists, and divines teach. But it is not to a purpose for the Doctor’s; For all offices and duties generally, and universally, of whatever kind which we owe by way of justice, are not more obligatory than duties which we owe only by way of charity, as when duties of a positive commandment of God, enjoined by our superiors, and duties which we owe by charity only are compared together, then the Doctor’s major proposition is not clear of itself, as they dream, nor do casuists or [William] Ames, or divines say with them, but truth, and all our divines say against them. Let us suppose that the King, and convocation, and assembly of priests and prophets of Israel make a canon according to God’s Word. That no manner of man presume to eat showbread, save the priests only. All men owe obedience to this, both because it is God’s express Law, and by the band of justice, the elders and assembly of the ancients have forbidden it. But if our Doctor’s argument stand strong, David at the point and hazard of famishing for hunger, sinned in eating showbread, yet Christ acquits him of all sin, and says, Mt. 12:5, he and his followers are [in Greek] blameless. Now David was under a duty by mercy, and love to his own life, and the lives of his followers, to eat showbread, and he was under the band of justice, by the law of the ancients of Israel, and God’s law, not to eat. Therefore in some cases, when our superiors’ commandments are only positive laws, they are not more obligatory, than duties of charity only commanded in the law of nature. I clear it further thus: I see my neighbor in danger before my eyes of drowning, and my father commands me to go and labor, or sow his farm in that time while I am to preserve the life of my neighbor in present danger, to lose his life in a great water. By the Doctor’s maxim, I am under the higher obligatory tie of justice to obey my father, who commands a thing both lawful and necessary by virtue of the higher commandment, to wit, the First of the Second Table, than I am obliged by the sixth Commandment, and of charity only, to give present succor and help to my dying neighbor; so I must let my neighbor die in the waters, to give a duty of justice to my father, of far less necessity. I would not commit my conscience to such casuists, as are the doctors of Aberdeen. But if the doctors would see with some new light of reason; it is clear that not only the tie of justice makes the precept more obligatory, but also the weightiness of the thing commanded; Yea, and if the positive commandments of the Lord our God, who of justice and kingly sovereignty has right to ask obedience of us above all earthly superiors do yield and cede as less obligatory, than commandments of love only, that are commanded in the law of nature, what do our Doctors clatter and fable to us of a right of justice that mortal rulers have to command in things indifferent, from which the destruction of souls does arise? For these commandments of rulers, (kneel religiously before bread, the vice-gerent image of Christ crucified) (keep human holy-days), cross the air with your thumb above a baptized infant’s face) at best, are but positive commandments, not warranted by God’s Word. But shall they be more obligatory by a supposed band of justice that prelates have over us to command, such toys than this divine law of God and Nature, Rom. 14. For indifferent days, meats, surplice, destroy not him for whom Christ died? All the casuists, and schoolmen, Navarra, Sylvester, Sanchez, Raphael de la Torre, Meratius, Duvallius, Thomas, Scotus, Bonaventura, Suarez, Vasquez, Grego. de Valentia, Albertus, Richardus, Biel, Corduba, Angelus, Adrianus, Alphonsus, Becanus, yea, and all the host of our divines cry with Scripture that mercy and the precepts of love, and of the Law of nature, are more obligatory than sacrifice, burnt offerings, and God’s own positive laws, yea, and that positive laws lose their obligatory power, and cease to be laws, when the laws of nature and necessary duties of mercy and love (as not to murder our brother) (not to scandalize) stands in their way. I might weary the reader here with citations, and bewilder myself also, but it is a point of divinity denied by none at all. [Answer]

3. What we owe of Justice to our superiors, is indeed both a moral debt of obedience, and a debt of justice, and law which rulers may seek by their place, and ex jure, as Aristotle says, but this right is limited; Rulers have no right to seek absolute obedience, but only in the Lord, not against charity. And though the place of rulers be authoritative, yet their commanding power, as touching the matter of what they enjoin is only ministerial, and they cannot but in God’s place exact, that which is God’s due, and seeing God Himself, if he should immediately in his own person command, He would not urge a positive commandment, far less the commandment of light and vain ceremonies, against and beyond the precept of love, not to destroy a soul for whom Christ died. Therefore, superiors under God, who borrow all their right from God, cannot have a higher right than God has. [Answer]

4. The comparison [of the Doctors] of a man who owes money to a creditor, and owes money to the poor, is close off the way, for he is obliged to pay the creditor first, but the case here is far otherwise; The debt of practicing indifferent feathers and straws, such as kneeling, crossing, wearing surplice, is neither like the debt owing to the poor, nor to the creditor; For nature’s law, and God’s Word, 1 Cor. 10:18-19, makes the non-practice, non-murdering obedience to God, when the practice of indifferent things, is a soul-stumbling to the weak, and the practicing is but at its best obedience to a positive Law, and ought to stoop, and go off the way and disappear when nature’s Law (murder not) does come in its way. When the Doctors put loyalty above charity, they suppose obedience to commandments commanding scandalizing of souls to be loyalty to superiors, which is questioned, it being treason to the Sovereign of heaven and earth to destroy his image; it is tatherfken as loyalty by our Doctors, but not proven to be loyalty, and so a vain question here, whether loyalty be above charity or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Appendix, ‘An Introduction to the Doctrine of Scandal’ | Question 4, p. 49-53, this is in the context of civil and/or episcopally imposed ceremonies going under the name of indifferent matters, though they scandalize the godly.</span></figcaption>

resent+succor+and+help+to+my+dying+neighbor%3B+so+I+must+let+my+neighbor+die+in+the+waters%2C+to+give+a+duty+of+justice+to+my+father%2C+of+far+less+necessity.+I+would+not+commit+my+conscience+to+such+casuists%2C+as+are+the+doctors+of+Aberdeen.+But+if+the+doctors+would+see+with+some+new+light+of+reason%3B+it+is+clear+that+not+only+the+tie+of+justice+makes+the+precept+more+obligatory%2C+but+also+the+weightiness+of+the+thing+commanded%3B+Yea%2C+and+if+the+positive+commandments+of+the+Lord+our+God%2C+who+of+justice+and+kingly+sovereignty+has+right+to+ask+obedience+of+us+above+all+earthly+superiors+do+yield+and+cede+as+less+obligatory%2C+than+commandments+of+love+only%2C+that+are+commanded+in+the+law+of+nature%2C+what+do+our+Doctors+clatter+and+fable+to+us+of+a+right+of+justice+that+mortal+rulers+have+to+command+in+things+indifferent%2C+from+which+the+destruction+of+souls+does+arise%3F+For+these+commandments+of+rulers%2C+%28kneel+religiously+before+bread%2C+the+vice-gerent+image+of+Christ+crucified%29+%28keep+human+holy-days%29%2C+cross+the+air+with+your+thumb+above+a+baptized+infant%E2%80%99s+face%29+at+best%2C+are+but+positive+commandments%2C+not+warranted+by+God%E2%80%99s+Word.+But+shall+they+be+more+obligatory+by+a+supposed+band+of+justice+that+prelates+have+over+us+to+command%2C+such+toys+than+this+divine+law+of+God+and+Nature%2C+Rom.+14.+For+indifferent+days%2C+meats%2C+surplice%2C+destroy+not+him+for+whom+Christ+died%3F+All+the+casuists%2C+and+schoolmen%2C+Navarra%2C+Sylvester%2C+Sanchez%2C+Raphael+de+la+Torre%2C+Meratius%2C+Duvallius%2C+Thomas%2C+Scotus%2C+Bonaventura%2C+Suarez%2C+Vasquez%2C+Grego.+de+Valentia%2C+Albertus%2C+Richardus%2C+Biel%2C+Corduba%2C+Angelus%2C+Adrianus%2C+Alphonsus%2C+Becanus%2C+yea%2C+and+all+the+host+of+our+divines+cry+with+Scripture+that+mercy+and+the+precepts+of+love%2C+and+of+the+Law+of+nature%2C+are+more+obligatory+than+sacrifice%2C+burnt+offerings%2C+and+God%E2%80%99s+own+positive+laws%2C+yea%2C+and+that+positive+laws+lose+their+obligatory+power%2C+and+cease+to+be+laws%2C+when+the+laws+of+nature+and+necessary+duties+of+mercy+and+love+%28as+not+to+murder+our+brother%29+%28not+to+scandalize%29+stands+in+their+way.+I+might+weary+the+reader+here+with+citations%2C+and+bewilder+myself+also%2C+but+it+is+a+point+of+divinity+denied+by+none+at+all.+%5BAnswer%5D+3.+What+we+owe+of+Justice+to+our+superiors%2C+is+indeed+both+a+moral+debt+of+obedience%2C+and+a+debt+of+justice%2C+and+law+which+rulers+may+seek+by+their+place%2C+and+ex+jure%2C+as+Aristotle+says%2C+but+this+right+is+limited%3B+Rulers+have+no+right+to+seek+absolute+obedience%2C+but+only+in+the+Lord%2C+not+against+charity.+And+though+the+place+of+rulers+be+authoritative%2C+yet+their+commanding+power%2C+as+touching+the+matter+of+what+they+enjoin+is+only+ministerial%2C+and+they+cannot+but+in+God%E2%80%99s+place+exact%2C+that+which+is+God%E2%80%99s+due%2C+and+seeing+God+Himself%2C+if+he+should+immediately+in+his+own+person+command%2C+He+would+not+urge+a+positive+commandment%2C+far+less+the+commandment+of+light+and+vain+ceremonies%2C+against+and+beyond+the+precept+of+love%2C+not+to+destroy+a+soul+for+whom+Christ+died.+Therefore%2C+superiors+under+God%2C+who+borrow+all+their+right+from+God%2C+cannot+have+a+higher+right+than+God+has.+%5BAnswer%5D+4.+The+comparison+%5Bof+the+Doctors%5D+of+a+man+who+owes+money+to+a+creditor%2C+and+owes+money+to+the+poor%2C+is+close+off+the+way%2C+for+he+is+obliged+to+pay+the+creditor+first%2C+but+the+case+here+is+far+otherwise%3B+The+debt+of+practicing+indifferent+feathers+and+straws%2C+such+as+kneeling%2C+crossing%2C+wearing+surplice%2C+is+neither+like+the+debt+owing+to+the+poor%2C+nor+to+the+creditor%3B+For+nature%E2%80%99s+law%2C+and+God%E2%80%99s+Word%2C+1+Cor.+10%3A18-19%2C+makes+the+non-practice%2C+non-murdering+obedience+to+God%2C+when+the+practice+of+indifferent+things%2C+is+a+soul-stumbling+to+the+weak%2C+and+the+practicing+is+but+at+its+best+obedience+to+a+positive+Law%2C+and+ought+to+stoop%2C+and+go+off+the+way+and+disappear+when+nature%E2%80%99s+Law+%28murder+not%29+does+come+in+its+way.+When+the+Doctors+put+loyalty+above+charity%2C+they+suppose+obedience+to+commandments+commanding+scandalizing+of+souls+to+be+loyalty+to+superiors%2C+which+is+questioned%2C+it+being+treason+to+the+Sovereign+of+heaven+and+earth+to+destroy+his+image%3B+it+is+tatherfken+as+loyalty+by+our+Doctors%2C+but+not+proven+to+be+loyalty%2C+and+so+a+vain+question+here%2C+whether+loyalty+be+above+charity+or+not.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%28London%2C+1646%29%2C+Appendix%2C+%E2%80%98An+Introduction+to+the+Doctrine+of+Scandal%E2%80%99+%7C+Question+4%2C+p.+49-53%2C+this+is+in+the+context+of+civil+and%2For+episcopally+imposed+ceremonies+going+under+the+name+of+indifferent+matters%2C+though+they+scandalize+the+godly.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c0be86202.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c0be86202.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1st-2nd-tables-of-the-law/#:~:text=Answer%201%3A%20Here%20be%20the%20white%2Dshifts,loyalty%20be%20above%20charity%20or%20not&amp;text=Answer%201%3A%20Here%20be%20the%20white%2Dshifts%20of%20Mr&amp;text=here%2C%20whether%20loyalty%20be%20above%20charity%20or%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>

<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil112 (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>

— Travis Fentiman, “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists, (1604; RBO, 2025), p. 50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+can+the+context+of+public+worship+be+completely+divorced+from+the+ethical+sphere+of+common+life%2C+because+the+most+fundamental+law+of+nature+is+to+pursue+good+and+avoid+evil112+%28Ps.+34%3A14%3B+Amos+5%3A14%3B+1+Pet.+3%3A11%29.+This+natural+law%2C+inherent+to+us%2C+falls+under+moral+obedience+to+God+in+the+First+Commandment.+But+public+worship+ordinances%2C+being+ceremonial+in+nature%2C+and+the+Regulative+Principle+of+Worship%2C+are+secondary+to+that+and+less+fundamental%2C+flowing+out+of+the+Second+Commandment.+Further%2C+the+good+of+persons%E2%80%99+salvation%2C+besides+being+grounded+in+the+First+Commandment%2C+also+derives+in+significant+part+from+the+moral+Sixth+Commandment%2C+both+of+which+may+override+the+ceremonies+of+the+First+Table+of+the+Law.+Thus+moral+obedience+and+serving+the+good+of+the+cause+of+the+Gospel+%28including+through+the+principles+we+have+been+discussing%29+underlies%2C+penetrates%2C+takes+precedence+over+and+foundationally+supports+public+worship.+To+deny+this+and+affirm+the+opposite+is+to+wrench+the+Great+Commission+backwards+%28Mt.+28%3A18%E2%80%9320%29.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists%2C+%281604%3B+RBO%2C+2025%29%2C+p.+50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0bce3d4602.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0bce3d4602.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1st-2nd-tables-of-the-law/#:~:text=Nor%20can%20the%20context%20of%20public,the%20Great%20Commission%20backwards%20%28Mt.%2028%3A18%E2%80%9320&amp;text=Nor%20can%20the%20context%20of%20public%20worsh <blockquote><p>…he takes from this ground that when two duties commanded of God do meet in one practice, so as we can not do them both, in this case we must performe the greatter duty and neglect the lesser. Now, whereas he says when two duties do meet, etc., he means not that both may be duties at once, for then a man shall be so straitened that he must needs commit a sin, in that he must needs omit one of the duties. But (as he explains himself) he calls them duties being considered apart: as to hear a sermon at the Church on the Sabbath, and to tend a sick person ready to die at home at the same time; both are duties being considered apart, but meeting together in our practice at one time, there is but one duty, because the lesser work binds not for that present.</p></blockquote>

<blockquote><p>2. Express and actual reference and intention to every commandment of God, or to God’s glory in every particular action, I do not urge; a habitual reference and intention I conceive is holden forth to us in Scripture: 1 Cor. 10:31.</p></blockquote>

</figure><figure class="quote" id="q-1a09d03e1c" data-kw="">
<blockquote><p>This fact of David [eating the showbread under natural and moral necessity] was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646) | Appendix, pp. 81-82</span></figcaption>

</figure><figure class="quote" id="q-5825e88ff5" data-kw="">
<blockquote><p>Promulgation of a truth and Christian reproof are duties commanded by God; and yet are sometimes to be abstained from for scandals taken, by not only the weak, but also malicious. ‘Reprove not a scorner, least he hate thee,’ Prov. 9:8; ‘speak not in the ears of a fool; for he will despise the wisdom of thy words,’ Prov. 23:9. ‘Give not that which is holy unto dogs, neither cast ye your pearls before swine, lest they trample them under their feet and turn again and rent you,’ Mt. 7:6. Pro vitando scandalo cessat rigor disciplinae. ‘To avoid scandal the rigor of discipline ceases.’ To explain this, farther recourse must be had unto that old and golden rule, Affirmativa praecepta semper obligant, non ad semper. Affirmative precepts do always bind, but not to always; so that we are not bound to perform always what they enjoin but only Loco &amp; tempore debitis, when we have due time and place. Now as by the intercurrency of other circumstances, so especially by intercurrence of scandal, there may not be opportunity and seasonableness of doing what we are urged unto by some affirmative precepts; so these precepts may pro hic &amp; nunc, cease to be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>…I shall desire you to consider the ground why such affirmative precepts, as command duties relating to others, do not bind to always. The duties that they command are principally to this end, that they do good to men for the curing of their evils, for the farthering of virtue in them. Wherefore when prudence shows that such actions will be fruitless in respect of the end, or contrariwise harmful, they are to be forborne.</p></blockquote>

<blockquote><p>7. The seventh distinction (which is ordinary) is of the commandments into affirmative and negative… …

2. Though the positive commandment, or (the positive part of the commandment) be of alike force and authority with the negative, as to the obligation it lays on us to duty, yet it does not tie us to all occasions and times, as negatives do: Hence is that common maxim, that affirmative commands tie and oblige semper, ever, that is, they never want their authority, and we are never absolved from their obedience, but they do not oblige and tie ad semper, that is, in all differences of time we are not tied to the exercise of the duties enjoined; negatives again oblige both semper and ad semper, that is, always, and in all differences of time: For instance, in the Third Commandment, the affirmative part is to use the Lord’s Name, and ordinances holily and reverently in prayer, reading and hearing, etc. So in the Fourth Commandment we are required to sanctify the Sabbath, by waiting on ordinances, etc. This makes these still duties, so as to pray, hear, etc. are still duties, but we are not to be, and should not be always exercised in these duties, for we must abound in other duties also of necessity, and mercy, we must eat, and sleep, etc. and when we sleep, we can neither act love, nor fear. Again, the negative part is, not to profane the Lord’s Name in his ordinances; this may not be done at any time: The reason of the difference is this, because in affirmatives we are not always tied to the acts of duties and graces, but to the disposition and habit. Habits are a spiritual quality, a (vis) or power sitting and enabling for bringing forth these acts; and for the bringing them forth in the due time and season, when they shall be called for; but in sinful things we are prohibited, not only the habits, but the acts also: the one is always and ever a sin, but the other is not always called for as duty. If any desire rules to know when a duty is called for; as for instance, when we are to pray, hear, etc. it is hardly possible to be particular in this, yet we may try it by these generals:

1. Any affirmative precept binds to present practise, when the duty required tends to Gods glory, unto which every thing should be done (as 1 Cor. 10:31) and when the omission of the duty may dishonor him.

2. When it tends to others edification, and omitting will some way stumble and offend.

3. When some special providences meet and concur, to give opportunity for such a duty; as for instance, the giving of aims when we have it, and some indigent person offers, whose necessity calls for it, Gal. 6:10. So when secrecy for prayer is offered (and no other more necessary duty at that time is called for), which we are to watch unto, Col. 4:2, or when we meet with some special occasion or dispensation, pointing out to us this or that as a duty called for, such a providence invites us to the practice of that duty: for though providences will not make these things to become duties which are not duties, yet they will serve to time and circumstantiate duties that lie on us, by virtue of affirmative precepts.

4. Some special occasions and times are set down in the Word, as for praying morning and evening, for hearing the Word on Sabbath days; and in these, and other the like duties, the examples of the saints, so recorded for imitation in Scripture, would be observed as a copy and pattern.

5. When they have not such inconveniences with them, as cross and hinder other moral duties of edification, love, etc. for if they do that, they must yield and give place to these; but if no other duty be called for, then they ought to be done, for we should be in some duty. And though such duties be in themselves moral, suppose praying, hearing, and such others, which might be instanced, yet the timing of them, or going about them at such a time, and in such a manner, is not moral simply, but as these are by circumstances called for.

6. When without sin such a duty cannot be omitted; and although there be not any inward exercise of mind, or frame of spirit suitable thereto, yet the conscience calls for it, or there is some on special occasion or other that puts us to it. 3. Observe, that this rule of negatives tying ad semper, or obliging in all circumstances of time, is not to be understood, but where the matter is moral; therefore we would distinguish again betwixt negative morals, and negative positives, for positives, whether negative or affirmative, give still place to morals. As for instance, that part of the fourth Commandment is negative. In it (that is, on the seventh day) ‘Thou shalt do no manner of work,’ yet sometimes, when necessity calls for it, some manner of works is lawful on that day, because it is only a negative positive, and not a negative moral: And so David’s eating of Show-bread, was against a negative command, though not against a negative moral, but a negative positive.</p></blockquote>

<blockquote><p>VII. Sixth [Rule], ‘some precepts are affirmative’ (ordering things to be done, sins of omission); ‘others negative’ (prohibiting things to be avoided, sins of commission). ‘The former bind always, but not to always, the latter bind always to always.’ The virtues and duties commanded by the affirmative precepts cannot be exercised every moment together at once, and suppose certain conditions (which being absent, there is no place for them); for example, parents are not always alive or near us, so that we can render them their due respect. But the vices and crimes prohibited can be committed lawfully in no article of time. Here, however, we must make an exception of the general affirmative command to love God (which obliges always and to always) because there is no time or place or state in which man can be exempted from the duty of loving God. … XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VII &amp; XII, pp. 35-37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVII.+Sixth+%5BRule%5D%2C+%E2%80%98some+precepts+are+affirmative%E2%80%99+%28ordering+things+to+be+done%2C+sins+of+omission%29%3B+%E2%80%98others+negative%E2%80%99+%28prohibiting+things+to+be+avoided%2C+sins+of+commission%29.+%E2%80%98The+former+bind+always%2C+but+not+to+always%2C+the+latter+bind+always+to+always.%E2%80%99+The+virtues+and+duties+commanded+by+the+affirmative+precepts+cannot+be+exercised+every+moment+together+at+once%2C+and+suppose+certain+conditions+%28which+being+absent%2C+there+is+no+place+for+them%29%3B+for+example%2C+parents+are+not+always+alive+or+near+us%2C+so+that+we+can+render+them+their+due+respect.+But+the+vices+and+crimes+prohibited+can+be+committed+lawfully+in+no+article+of+time.+Here%2C+however%2C+we+must+make+an+exception+of+the+general+affirmative+command+to+love+God+%28which+obliges+always+and+to+always%29+because+there+is+no+time+or+place+or+state+in+which+man+can+be+exempted+from+the+duty+of+loving+God.+%E2%80%A6+XII.+Fourth+%5BRule+of+Obedience%5D%2C+as+the+precepts+do+not+have+an+equal+degree+of+importance+and+necessity%2C+so+neither+is+the+obedience+to+be+reckoned+of+the+same+order+and+value%E2%80%A6+The+omission+of+a+command+is+one+thing%3B+opposition+to+it+another%3B+forgetfulness%2C+neglect+and+contempt+are+different.+Neglect+proceeds+from+the+langor+of+slothfulness%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+vol.+2%2C+11th+Topic%2C+%E2%80%98The+Law+of+God%E2%80%99%2C+Question+6%2C+%E2%80%98The+Rules+of+Explanation+and+of+Observance+of+the+Decalogue%E2%80%99%2C+Sections+VII+%26+XII%2C+pp.+35-37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F293bb8b3b4.html&amp;via=5Solas" target="_blank" rel="noopener">Sh

</figure><figure class="quote" id="q-69e651fa8d" data-kw="">
<blockquote><p>In response to an appeal from the Original Secession Synod seeking unity between itself and the Free Church of Scotland, in 1852 the General Assembly of the latter body passed an Act concerning the need to continue to prosecute the principles advocated in the covenants of the seventeenth-century:

In regard to the events and transactions of the First and Second Reformations, to which the Synod refer in their Representation and Appeal, the General Assembly agree with their brethren in owning the special grace of God vouchsafed to our fathers on these critical occasions; when the Lord was pleased to order his Providence in a manner specially calling for faithfulness, zeal, and union; and when He enabled the church and nation to make high attainments, and disposed them to enter into solemn vows and engagements for the advancement of His cause, and the overthrow of all that was opposed to it within these realms.

The General Assembly agree also in confessing and lamenting the defection from these attainments, and the breach of these public promises and engagements. And they fully and unreservedly acknowledge the obligation to prosecute the ends of the Covenants, in the Reformations which these Covenants were designed to advance and perpetuate; and in particular, to oppose Popery in all its forms, and Popish institutions, influences, and tendencies, wherever they may be found; and to aim at a Scriptural union and uniformity, in doctrine, worship, and discipline, among the Churches of these lands; in the use of all competent means, suitable to present circumstances, and consistent with the Word of God and the functions and spirit of a Church of Christ. The General Assembly appoint the Representation and Appeal, referred to in this Act, to be recorded as craved, and to be inserted along with this Act in the printed Acts of the General Assembly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/general-assembly-of-the-free-church-of-scotland.html">General Assembly of the Free Church of Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Act anent the Representation and Appeal of the Synod of United Original Seceders. Edinburgh, 1 June 1852, Sess. 21’ in Acts of the General Assembly of the Free Church of Scotland, 1848-1852</cite>, (Edinburgh: John Greig, 1852), pp 418-19 (emphasis added).</span></figcaption>

</figure><figure class="quote" id="q-d521838597" data-kw="">
<blockquote><p>Once we had a fair shew of zeal for God, of love and desire of reformation of life, many solemn undertakings were that we should amend our ways and doings: but what is the fruit of all? Alas, we have corrupted ourselves more than they. Israel promised, but we vowed and swore to the Most High, reformation and amendment of life in our conversations and callings.

Lay this rule to our practices, and are we not a perverse and crooked generation? Oh! that we were more affected with our corruptions, and were more sensible of them; then we could not choose but mourn for our own and the land’s departing from God.

Did not every man vow and swear to the most high God to endeavour reformation of his life, even a personal reformation? But alas, where is it? “He that is filthy is filthy still.” Nay, which is worse, the evil man waxeth worse and worse. There is a great noise of a public reformation of ordinances and worship; but alas, the deformation of life and practice outcries all that noise. Nay, certainly all that is done in the public, must come to an account before God, since our practices outcry it. Public reformation is abomination, where personal corruptions do not cease. This made the Jews’ solemn days hateful, “their hands were full of blood.” Isa. i.

All that ye have spent on the public will never be reckoned, since ye will not consecrate your lives to God, will not give your lusts up to him. Ye are his enemies in the mean time, though you account yourselves religion’s friends. I beseech you, consider your ways. Would any of us have thought to have seen such profanity, mocking of godliness, and ignorance in Scotland in so short a time? Nay, it is to be feared that the day is not far off, when ye will corrupt yourselves, and do abominable things; yea, defile yourselves as ill as the nations that know not God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heart-Humiliation: or, Miscellany Sermons, Preached upon some choice texts, at several solemn occasions</cite>, (1676) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 399-400.</span></figcaption>

</figure><figure class="quote" id="q-183040b3c9" data-kw="">
<blockquote><p>BY firmness and patience, I mean a resolute adherence to your duty, and laying your account with many difficulties as well as occasional disappointments. In a former part of this discourse, I have cautioned you against ostentation and vain glory. Be pleased further to observe, that extremes often beget one another, the same persons who exult extravagantly on success, are generally most liable to despondent timidity on every little inconsiderable defeat.

Men of this character are the bane and corruption of every society or party to which they belong, but they are especially the ruin of an army if suffered to continue in it. Remember the vicissitude of human things, and the usual course of providence. How often has a just cause been reduced to the lowest ebb, and yet when firmly adhered to, has become finally triumphant.</p></blockquote>

<blockquote><p>Obj: 1: The First Objection is grounded on the 2 Cor. 6 17. Wherefore come out from among them, and be ye separate &amp;c. This is the strongest of their Arguments: The Lord commands the Corinthians to come from among them and Separate; And therefore (say they) when there are wicked men coming together with the Godly, the Godly ought to separate from them.

But to shew you the vanity of the Argument we shall Answer it by reading out the rest of the verse; For it is clear what the Apostle aims at—Be ye separate, saith the Lord, and touch not the unclean thing &amp;c. He bids them only Separate from Sinful Actions, and not from Lawful Duties.

That ye may see yet further the vanity of this Reason, Know, It was the custom in the Church of Corinth 1 Cor. 10. When Idolaters would invite some of their Christian neighbours, they would go with them, and eat with them at their Idol Feasts, and they thought they might lawfully do it, because they knew their Idols were not true Gods, and so by their eating they intended no worship to the Idol, as these Idolaters did who did eat with them, but did it only to satisfy their hunger and keep up common Friendship:

Now Paul discharges them from this kind of Communion, and this is it he points at here, Be separate, Do not meddle with their Idol Feasts because it was indeed Communion with them in their Idolatry: And so it doth not follow, because Paul bids the Corinthians be separate from Heathens, in doing a thing sinful, That therefore he forbids Christians to join in a lawful Worship with the Church of Christ.</p></blockquote>

</figure><figure class="quote" id="q-8f0b426baf" data-kw="">
<blockquote><p>Consider, that as it is our duty and interest, so we are bound by the oath of God to upbuild, maintain, and preserve the tabernacle of David against all injuries. Besides personal vows, there are public vows, oaths, and covenants, frequently repeated, lying upon us and our posterity to build up the tabernacle of David, to maintain the doctrine, discipline, worship, and government of the church of Scotland, as it is stated in our public standards.

And whatever failures, through human weakness and infirmity, there might be either in the composure of these covenants, or yet in their administration, this can never loose us from the oath of God to maintain and carry on a reformation of the church of Christ, antecedently binding by the authority of God in his word. The Rechabites thought themselves bound to abstain from wine, a thing indifferent in itself, because of their father’s oath; and are commended for it.

The rash oath made to the Gibeonites in the days of Joshua was found binding in the days of Saul and David, although it was only the princes of the congregation that sware. The oath of Zedekiah king of Judah to the king of Babylon, a heathen, though prohibited in the law of Moses, was found binding; “Shall he break the covenant, and escape?” The bond of any city or community, though made only by those who presently govern, is found binding in law upon their successors in office in the same society.

And yet, will any deny that the oath of God, so solemnly sworn by king, nobles, gentry, commons, and persons of all ranks, with uplifted hand to the great God, for maintaining and upholding his tabernacle in the land, is not obligatory upon us their posterity? And therefore, I say, if we do not concur in building the fallen tabernacle of David according to these oaths, we are guilty, not only of rebellion against the divine authority, but also of perjury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tabernacle of David Ruined by Man, and reared up by the Mighty God. Being Three Discourses. The First and Second Preached at Edinburgh, November 1735; and the Third at Kinross, February 17th 1736, at the opening of the Presbytery of the Associate Ministers there in The Whole Works of Ebenezer Er</cite></span></figcaption>

</figure><figure class="quote" id="q-1e635490f6" data-kw="">
<blockquote><p>Now my petition, backed with the authority of a mother, to your honours is, that for the glory of Christ’s kingdom in this land, the adorning of his majesty’s crown, &amp; quietness of his loyal subjects, the endless praise of your selves, and flourishing of your honourable estate, and the particular comfort of the Ministers and congregations within this realm in this time of distress felt and feared. I may by your timeous intercession at his gracious majesties hands, and uttermost endeavours debt full to God from your place, obtain how soon occasion may be offered.

1 A sufficient and ready execution of former acts of Parliament made against the fearful blasphemy of God’s name, profaning of the Lord’s day, and contempt of his sanctuary, and service, so universally overflowing this land, not only in the persons of poor ignorants, in a manner tied to these horrible crimes by a cursed custom, &amp; beggarly necessity: but even in the more honourable sort, whose damnable example encourages their followers to sin without fear: with such additions as may repress and restrain these crying abominations in all, without respect of persons.

2 A safe liberty to enjoy the profession of our religion, as it is reformed in doctrine, sacraments and discipline, and hath been openly professed by Prince, Pastors, and people of all ranks, your predecessors of worthy memory, your selves &amp; us, all yet living, these threescore years by gone, and above.

3 A full deliverance from, and a sufficient defence against all novations and novelties in doctrine, sacraments, and discipline, and specially such, as by constitutions of the Kirk, confessions of faith, lovable laws of the country, and long continued practise hath been condemned, and casten out as idle rites, and Romish formalities, under what soever pretence they plead for re-entry.</p></blockquote>

<blockquote><p>But to answer more briefly, we shall find Instances in the New Testament that make Separation unlawful, as well as in the Old, which Instances shall make up our Third Argument.

Arg, III. Our Third Argument. In the Church of Corinth there was a Profane Multitude, 1 Cor, 3, 4. We find there were Schismaticks in it. Chap, v. v, 1. We find Incests were Tolerated, Chap. 6 v, 1. We find there were men of Contentious Spirits, going to Law before Infidels. Yea in that Chapter, We find there were some pleading the Lawfulness of Fornication; And Chap, 11. We find there were Drunkards among them; And such Drunkenness as was most abominable; For some came Drunk to the Lords Table, v, 21. And Chap, 15. We find there were some infected with a dangerous Heresy The denying of the Resurrection.

And so a number of very offensive things were among them, But after all, the Apostle. Tho he reproves them very sharply yet he no where says, Ye that are Godly stay away from joining in Worship, because of such men’s joining; But on the contrary he approves their coming together to go about the Ordinances, Only reproving the wrong way they came in. So Chap, 11. v, 18. First of all when ye come together in the Church I hear there be divisions among you. And v, 20. When you come together therefore unto one place, &amp;c. He doth not reprove their coming together, but supposes it as a thing Lawful, only he reproves them for their Divisions.

So in the Church of Galatia, There was much corruption among them, they were Bewitched with Heretical Doctrine O Foolish Galatians who hath Bewitched you, &amp;c. Cap, 3. v, 1, They had begun in the Spirit but were like to end in the Flesh, v, 3. In the Church of Ephesus were many who had fallen away from their first Love, Revel, 2, 1.

The Church of Sardis, Revel: 3, 1. Did Tolerate profane persons such as defiled their Garments; And yet we never read the Spirit of God commanding to Separate from worship because of them: Indeed he reproves them sharply for their Corruption; For their falling away from their first love, For Their Tolerating Prophane wicked men; But he says not All ye that are Godly turn your backs upon that Church; Make up a new Church of your Own; But directly approves their joining together in what was right. So it is clear that Separation from the Ordinances is no more to be Tolerated under the New Testament than it was under the Old.</p></blockquote>

<blockquote><p>The Free Church Magazine, which William M. Hetherington edited, gave the following summary of the debate at the 1847 Free Church General Assembly on the National Covenant of Scotland:

Those who read or heard the discussion in the Assembly would perceive that it turned chiefly on the difficult question respecting the permanent obligation of the National Covenant. The essential difficulty in this question was distinctly specified by Dr [William] Cunningham; but we intentionally abstain from even touching it at present, requesting our readers to re-peruse the debate, and do their best to appreciate clearly that point. Till they understand the very essence of the difficulty, they will neither perceive its importance, nor be in a condition to attempt a solution.

It was abundantly evident that those who argued against the adoption of the Testimony, chiefly because of its reference to the National Covenant, had no clear conception of what that covenant really was in itself, or of what is meant by its permanent obligation. One opponent, indeed, began by resting his objection against a testimony which referred to the Covenant on his ignorance of what amount or kind of obligation that might imply. This was honest, doubtless, as a confession of ignorance; but it was not very praise-worthy, the means of removing that ignorance being sufficiently accessible.

Another rested his opposition on a total misconception both of the Covenant itself, and on the principles and conduct of those by whom it was framed. It was painful to hear any minister or member of the Free Church declaring that the National Covenant contained the principles of persecution. Till that hour we have believed that a charge so offensive and unfounded could be urged against the National Covenant only by the prejudiced assailants of the Presbyterian Church; and we cannot adequately express how deeply we were grieved to hear it uttered in the General Assembly of the Free Church of Scotland.

It was not answered; it never will need any other answer than has been already furnished by Dr. [Thomas] McCrie. And the silence in which it was allowed to pass may be accounted for both on that ground, and also from the regretful respect which is willing to allow a good man’s mistake to pass unmarked. Perhaps even this gentle reference to it is too much. It is all, certainly, that we mean to make; and we do so only in defence of the memory of our noble ancestors, as implicated in the character of that important document to which they attached so much, even sacred, value.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Recent General Assembly of the Free Church in Free Church Magazine</cite></span></figcaption>

<blockquote><p>Many there be who, out of a godly and zealous mind, do in good sort seek reformation, and for that church government, which Christ himself hath instituted in his church, whom I neither dare nor do reprove. Others there be, that seek reformation amiss, with venomous and slanderous tongues, railing and reviling against those which understand it; which things do neither grace themselves, nor yet the cause which they would prefer; other some there be, who, to make the cause of reformation odious, do say, that it abolisheth her majesty’s supreme government, and authority in causes ecclesiastical. I would wish all men to speak the truth, and to seek the preferment of God’s truth, in a dutiful, peaceable, and charitable sort. Let the cause be made no worse than it is. For my part, I desire no more than every Cliristian ought, namely, that the truth of God should carry the pre-eminence, whatsoever it be.

And I would to God that, all malice and contention set apart, all of all parts would grow more charitably affected, both in their words and in their writings, one towards another; for so would this controversy sooner come to an end, and the more speedily be decided. Others there be, who for that in so long time they cannot see their desired discipline and church government to be established, run from our church, and make a schism and separation from us, erecting discipline by their own authority, condemning our church to be no church, that they may make their detestable schism the more allowable. These are the Brownists and Barrowists, who will not stay the chief magistrate’s pleasure for the establishing thereof nor yet allow unto us any church in England, but themselves.

But they, for against them I deal, and you, must understand, that a church may be, yea, a true church may be and is, though it have neither elders, nor deacons, nor discipline in it; for we read in Acts ii. 41, 42, 43, 47, of an assembly of people at Jerusalem, that received the word of God and believed, and which are expressly called a church, and who can or dare deny them to be the true church of God, sith the Holy Ghost doth so testify of them? and yet at that time no deacons were chosen, nor consistories of elders erected. For they were not erected till afterward.

And therefore a true church of God may be, though as yet it have not these, for this desired discipline is not an essential part of the church; for it doth resemble the wall of a city, or an hedge or ditch about a vineyard ; and it is a city, though the wall be wanting, and it is a vineyard, though the hedge or ditch he wanting; though so much the less fortified, I grant.

Inasmuch therefore as we have the preaching of God’s holy word, and the right administration of the sacraments, which be the essential marks of the true church, none ought to forsake our church for any other defect, corruption, or imperfection. For there may be corruptions both in doctrine and discipline some, and yet the church where they be, the true church of God.

Admit, if they will, that ministers in the church of England be not rightly created and brought into the church, will they therefore count they be no ministers? By as good an argument they may say, that he that is brought and born into the world, not according to the right course or order of nature, but otherwise, as by ripping of his mother’s belly, is no man, for the one cometh unorderly into the world, as the other doth into the church. I am sure the corrupt ordination of a minister doth not prove him to be no minister; neither doth any other corruption in our church take away the life and being of a church; for if a man be diseased and full of corruptions, will any man therefore say he is no man?

They say we do not only want the right discipline, but we have also put a wrong discipline in the place thereof. But what of this? The error then, I confess, is great, but yet not such as doth make a nullity of our church, so long as it holdeth Christ Jesus the life and soul of the church, and is ready to reform her error whensoever by good proof it shall be manifested unto her.

In the mean time, their argument is nothing worth; for if a man lose a leg or arm, yet none will deny him to be a man for all this blemish or defect; yea, though he put a wooden leg instead of his leg which he wanteth, yet he remaineth a man still, because his principal parts remain; so though we want that discipline, yet we have the principal parts of the church, namely, the right preaching of the word of God and administration of the sacraments, and therefore a true church of God undoubtedly.

And if we have a true church, though not a perfect church, let the Brownists and Barrowists consider from whence they are fallen; for if the church of Christ be the body of Christ, as St Paul affirmeth, what do they else but by their schism and separation rent themselves from the body of Christ? And then let them remember whose members they be until they be reunited.

Let them no longer for shame charge our church with idolatry, except they were better able to prove it, which neither they nor all the world shall do. To say, as they say, that a set form of prayer is used in the church and exhibited unto God, the prayer being framed according to the rule of God’s word, is idolatry, is detestable; for by as good reason they may condemn all prayer made to God by the preacher or pastor of the congregation, which they will not do; and besides, all the reformed churches in Christendom have a set form of public prayers for public meetings and congregations. …

I therefore wish them to cease their slander against this church, and to cease their damnable schism, and to be reconciled to that church of ours, from whence they have foolishly departed; for how imperfect a church soever it be, — whose imperfections God cure in his good time, — yet shall they never be able to shew otherwise, but that the Church of England is the true church of God, from which it is utterly unlawful to make a separation. God forgive us all, and reconcile us unto him. Amen.</p></blockquote>

Admit, if they will, that ministers in the church of England be not rightly created and brought into the church, will they therefore count they be no ministers? By as good an argument they may say, that he that is brought and born into the world, not according to the right course or order of nature, but otherwise, as by ripping of his mother’s belly, is no man, for the one cometh unorderly into the world, as the other doth into the church. I am sure the corrupt ordination of a minister doth not prove him to be no minister; neither doth any other corruption in our church take away the life and being of a church; for if a man be diseased and full of corruptions, will any man therefore say he is no man?

They say we do not only want the right discipline, but we have also put a wrong discipline in the place thereof. But what of this? The error then, I confess, is great, but yet not such as doth make a nullity of our church, so long as it holdeth Christ Jesus the life and soul of the church, and is ready to reform her error whensoever by good proof it shall be manifested unto her.

In the mean time, their argument is nothing worth; for if a man lose a leg or arm, yet none will deny him to be a man for all this blemish or defect; yea, though he put a wooden leg instead of his leg which he wanteth, yet he remaineth a man still, because his principal parts remain; so though we want that discipline, yet we have the principal parts of the church, namely, the right preaching of the word of God and administration of the sacraments, and therefore a true church of God undoubtedly.

And if we have a true church, though not a perfect church, let the Brownists and Barrowists consider from whence they are fallen; for if the church of Christ be the body of Christ, as St Paul affirmeth, what do they else but by their schism and separation rent themselves from the body of Christ? And then let them remember whose members they be until they be reunited.

Let them no longer for shame charge our church with idolatry, except they were better able to prove it, which neither they nor all the world shall do. To say, as they say, that a set form of prayer is used in the church and exhibited unto God, the prayer being framed according to the rule of God’s word, is idolatry, is detestable; for by as good reason they may condemn all prayer made to God by the preacher or pastor of the congregation, which they will not do; and besides, all the reformed churches in Christendom have a set form of public prayers for public meetings and congregations. …

I therefore wish them to cease their slander against this church, and to cease their damnable schism, and to be reconciled to that church of ours, from whence they have foolishly departed; for how imperfect a church soever it be, — whose imperfections God cure in his good time, — yet shall they never be able to shew otherwise, but that the Church of England is the true church of God, from which it is utterly unlawful to make a separation. God forgive us all, and reconcile us unto him. Amen.”

— Henry Smith, God’s Arrow Against Atheism and Irreligion, (1593) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 446-48, 449.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+there+be+who%2C+out+of+a+godly+and+zealous+mind%2C+do+in+good+sort+seek+reformation%2C+and+for+that+church+government%2C+which+Christ+himself+hath+instituted+in+his+church%2C+whom+I+neither+dare+nor+do+reprove.+Others+there+be%2C+that+seek+reformation+amiss%2C+with+venomous+and+slanderous+tongues%2C+railing+and+reviling+against+those+which+understand+it%3B+which+things+do+neither+grace+themselves%2C+nor+yet+the+cause+which+they+would+prefer%3B+other+some+there+be%2C+who%2C+to+make+the+cause+of+reformation+odious%2C+do+say%2C+that+it+abolisheth+her+majesty%E2%80%99s+supreme+government%2C+and+authority+in+causes+ecclesiastical.+I+would+wish+all+men+to+speak+the+truth%2C+and+to+seek+the+preferment+of+God%E2%80%99s+truth%2C+in+a+dutiful%2C+peaceable%2C+and+charitable+sort.+Let+the+cause+be+made+no+worse+than+it+is.+For+my+part%2C+I+desire+no+more+than+every+Cliristian+ought%2C+namely%2C+that+the+truth+of+God+should+carry+the+pre-eminence%2C+whatsoever+it+be.%0A%0AAnd+I+would+to+God+that%2C+all+malice+and+contention+set+apart%2C+all+of+all+parts+would+grow+more+charitably+affected%2C+both+in+their+words+and+in+their+writings%2C+one+towards+another%3B+for+so+would+this+controversy+sooner+come+to+an+end%2C+and+the+more+speedily+be+decided.+Others+there+be%2C+who+for+that+in+so+long+time+they+cannot+see+their+desired+discipline+and+church+government+to+be+established%2C+run+from+our+church%2C+and+make+a+schism+and+separation+from+us%2C+erecting+discipline+by+their+own+authority%2C+condemning+our+church+to+be+no+church%2C+that+they+may+make+their+detestable+schism+the+more+allowable.+These+are+the+Brownists+and+Barrowists%2C+who+will+not+stay+the+chief+magistrate%E2%80%99s+pleas <blockquote><p>Having cleared the Question, we come to Our Arguments for the Truth; viz. That the presence of wicked men does not defile the Worship of those that are Godly: And that the Godly should not keep back from lawful Commanded Duties, because wicked men have their hands at them.

Arg I. Our First, Argument is taken from the Church of the Jews in Christ’s time; Any who know the History of the Gospel, know that it was a very corrupt Church, in Christ time, in Doctrine and manners; Their Preachers the Scribes and Pharisees were debauched Persons; They perverted the Law, the blind led the blind: And when the Preachers were such, ye may judge what the People were; And yet we find that Christ and his Apostles did join with them in the lawful Worship, For First, Christ himself came yearly up to the Feast at Jerusalem.

Secondly, He is so far from commanding his Apostles, and those who believed in him, to keep back from the Ordinary Worship, because of wicked men among them, That upon the contrary he forbids them to stumble at any thing of that kind; And commands them to come to the lawful Worship: as Matth: 23. 1. 2. Then spake Jesus to the multitude, and to his disciples, Saying, The scribes &amp;c. Which is as if he had said do not keep back from the lawful Worship, because they are but Godless men that go about it; What they Preach according to the word, do that, and for Their wicked life follow them not in it.

Arg: II. Our Second Argument is taken from the Church in the Old Testament: We find, for the most part, many Corrupters and Graceless men that were Members of that Church; Both of the Preachers, and People; And yet we never find that the Godly did loathe the Lawful Worship or keep back from it because of that: Yea we find, The Lord commands them to join in the lawful Worship; And when they would Separate, He reproves them for it. We shall make this appear from Three or Four Times of the Church of the Old Testament.

The First is, Moses’ Time; There was a great mixture of profane men in the Church at that Time; As ye will find Deut: 32. (only remember this all along that the Point we are speaking to, is not to plead for keeping profane men in the Church; We shew those should be removed; But the Question is, when they are keeped in, what the Godly should do in that Case; If they should turn back and leave that Church) I say we find, Deut: 32. the Church at that time, for the most part, was not very sound, They corrupted themselves, Their spots were not the spots of Children; yet we never read that Moses and the Godly did withdraw from the Commanded Worship, because such were at it; yea, on the contrary, we find them joining with them, Deut: 29. Moses enters into a Covenant with them, Preaches to them, Prays for them: Yea Deut: 18. 6. 7. 8. The Lord commands the People to come up to the Public Worship, in the place where he should choose to place his name, and go about the lawful Commanded Duties: Though (doubtless) there would be many wicked men among them.

The Second Time of the Church in the Old Testament, which we take to prove the Point is, in Joshua’s time; there were then great mixtures of wicked men among them; As appears from Joshua 24. 14. 23. He bids them put away the Strange Gods, So there were numbers of them corrupt in the way of Worship, and yet we find in the same Chapter v, 23. That Joshua convenes them altogether to a Solemn piece of Worship, and enters into a Covenant with God, and Preaches to them on that Subject: Now surely Joshua would not have done this, if so be the presence of wicked men did defile the Worship to the Godly: And if it had been a sin in the Godly to stay with the wicked when about Worship.

The Third Time is in Elijah’s time, 1 Kings 18. We find at that time there were some Godly, Seven Thousand that had not bowed their Knee to Baal; We find also an Atheistical Multitude in verse 29. The Body of the People Halting betwixt God and Baal; They would neither say that God was their God, nor that Baal was their God; and yet Elijah called All together to a solemn Worship, a solemn Sacrifice; That is gone about verse 36. And there was Preaching and Praying to that purpose. Now surely, If so be the presence of that Godless Multitude, which Elijah could not get reformed in a hast, had profaned the Worship to the seven thousand Godly, Elijah would never have been accessory to that sin:

A Fourth Time is from Solomon’s time to Hezekiah‘s: There was great Corruption tolerated in the Church then; As Worshipping God in the High-places, as is clear through the whole Tract of the History of that time; And there was much Prophanity of Life in that time; which also appears from the frequent Sermons of the Prophets to that purpose; And yet we never read that the Prophets did separate from the lawful Worship, because of that mixture in the Church: Yea on the contrary we read they did join with them in every Lawful Duty, 2 Chron. 15. Asa gathers all together, and enters into a Covenant with them: Isaias, Jeremiah, and the rest Preaches to them, Prays with them. Now if the presence of Wicked Men had polluted the Service to them, then Isaias his Preaching and Praying, and joining with the People in Worship should have been defiled to Him.

A Fifth Instance is taken from 1 Samuel 2. 16. Eli‘s Sons the Priests were Prophane men: whereupon the Godly began to abhor the Worship; And so it is said in verse 17. Wherefore the sin of the young Men was very great before the Lord, for Men abhorred the Offering of the Lord. And to speak the Truth, It was little wonder they did so: For in verse 22. We find the Priests were so Godless that they did lie with Women that Assembled at the doors of the Tabernacle of the Congregation: Little wonder then that the Godly did loath and withdraw: But does the Lord approve of Their withdrawing, notwithstanding of that reason?

No, We see in verse 24. Where Eli the Prophet speaks to his Sons, says he, Nay my Sons: For it is no good report that I hear; ye make the Lord’s People to transgress: Their abhorring the offering of the Lord because of wicked men that had their hands at it, is called (a transgressing) ye make the Lord’s people to transgress. From all which it is clear. That the presence of wicked men doth not defile the Worship to the Godly, providing they come honestly themselves: And that therefore the wicked’s presence should not keep them away.</p></blockquote>

rs+into+a+Covenant+with+God%2C+and+Preaches+to+them+on+that+Subject%3A+Now+surely+Joshua+would+not+have+done+this%2C+if+so+be+the+presence+of+wicked+men+did+defile+the+Worship+to+the+Godly%3A+And+if+it+had+been+a+sin+in+the+Godly+to+stay+with+the+wicked+when+about+Worship.%0A%0AThe+Third+Time+is+in+Elijah%E2%80%99s+time%2C+1+Kings+18.+We+find+at+that+time+there+were+some+Godly%2C+Seven+Thousand+that+had+not+bowed+their+Knee+to+Baal%3B+We+find+also+an+Atheistical+Multitude+in+verse+29.+The+Body+of+the+People+Halting+betwixt+God+and+Baal%3B+They+would+neither+say+that+God+was+their+God%2C+nor+that+Baal+was+their+God%3B+and+yet+Elijah+called+All+together+to+a+solemn+Worship%2C+a+solemn+Sacrifice%3B+That+is+gone+about+verse+36.+And+there+was+Preaching+and+Praying+to+that+purpose.+Now+surely%2C+If+so+be+the+presence+of+that+Godless+Multitude%2C+which+Elijah+could+not+get+reformed+in+a+hast%2C+had+profaned+the+Worship+to+the+seven+thousand+Godly%2C+Elijah+would+never+have+been+accessory+to+that+sin%3A%0A%0AA+Fourth+Time+is+from+Solomon%E2%80%99s+time+to+Hezekiah%E2%80%98s%3A+There+was+great+Corruption+tolerated+in+the+Church+then%3B+As+Worshipping+God+in+the+High-places%2C+as+is+clear+through+the+whole+Tract+of+the+History+of+that+time%3B+And+there+was+much+Prophanity+of+Life+in+that+time%3B+which+also+appears+from+the+frequent+Sermons+of+the+Prophets+to+that+purpose%3B+And+yet+we+never+read+that+the+Prophets+did+separate+from+the+lawful+Worship%2C+because+of+that+mixture+in+the+Church%3A+Yea+on+the+contrary+we+read+they+did+join+with+them+in+every+Lawful+Duty%2C+2+Chron.+15.+Asa+gathers+all+together%2C+and+enters+into+a+Covenant+with+them%3A+Isaias%2C+Jeremiah%2C+and+the+rest+Preaches+to+them%2C+Prays+with+them.+Now+if+the+presence+of+Wicked+Men+had+polluted+the+Service+to+them%2C+then+Isaias+his+Preaching+and+Praying%2C+and+joining+with+the+People+in+Worship+should+have+been+defiled+to+Him.%0A%0AA+Fifth+Instance+is+taken+from+1+Samuel+2.+16.+Eli%E2%80%98s+Sons+the+Priests+were+Prophane+men%3A+whereupon+the+Godly+began+to+abhor+the+Worship%3B+And+so+it+is+said+in+verse+17.+Wherefore+the+sin+of+the+young+Men+was+very+great+before+the+Lord%2C+for+Men+abhorred+the+Offering+of+the+Lord.+And+to+speak+the+Truth%2C+It+was+little+wonder+they+did+so%3A+For+in+verse+22.+We+find+the+Priests+were+so+Godless+that+they+did+lie+with+Women+that+Assembled+at+the+doors+of+the+Tabernacle+of+the+Congregation%3A+Little+wonder+then+that+the+Godly+did+loath+and+withdraw%3A+But+does+the+Lord+approve+of+Their+withdrawing%2C+notwithstanding+of+that+reason%3F%0A%0ANo%2C+We+see+in+verse+24.+Where+Eli+the+Prophet+speaks+to+his+Sons%2C+says+he%2C+Nay+my+Sons%3A+For+it+is+no+good+report+that+I+hear%3B+ye+make+the+Lord%E2%80%99s+People+to+transgress%3A+Their+abhorring+the+offering+of+the+Lord+because+of+wicked+men+that+had+their+hands+at+it%2C+is+called+%28a+transgressing%29+ye+make+the+Lord%E2%80%99s+people+to+transgress.+From+all+which+it+is+clear.+That+the+presence+of+wicked+men+doth+not+defile+the+Worship+to+the+Godly%2C+providing+they+come+honestly+themselves%3A+And+that+therefore+the+wicked%E2%80%99s+presence+should+not+keep+them+away.%E2%80%9D%0A%0A%E2%80%94+James+Fergusson%2C+A+brief+refutation+of+the+errors+toleration%2C+Erastianism%2C+Independency+and+separation+delivered+in+some+sermons+from+I+Joh.+4.+I%2C+preached+in+the+year+1652%3A+to+which+are+added+four+sermons+preached+on+several+occasions%2C+%28Edinburgh%3A+George+Mosman%2C+1692%29%2C+pp+218-22.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5792d1c4bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5792d1c4bb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/13/james-fergusson-on-the-example-of-christ-and-the-old-testament-saints-against-separatism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>My friends, we are met together this day about a very great and weighty work, namely, renewing of our solemn covenant-engagements to the Lord, which, for a great many years back, have been lying buried in oblivion, by the generality of the inhabitants of the land. Many grave-stones have been cast upon them, since they were last renewed by authority, both civil and ecclesiastical.

Their obligation was rescinded by act of the Scots parliament: they were ignominiously burnt at Edinburgh, by the hand of the public executioner; many have suffered upon scaffolds and gibbets, in the fields and cities, for asserting the obligation of these covenants, under some reigns before the Revolution ; and, since that period, they have lain much neglected, yea, measures gone into, both by church and state, inconsistent with a covenanted reformation.

However, we, the ministers of the Associate Presbytery, are this day met together, in order, through grace, to renew these solemn covenants, in a suitableness unto the circumstances wherein we stand in holy providence, and, in the Lord’s strength, to essay the rolling away the stones from the grave, in which they have been so long buried, and to bring them forth again to the light. We that are ministers are only concerned in the work of this day, that we may, like the he-goats, lead the way to the Lord’s flock, who, I hope, in due time shall follow.

There are two things which I judge somewhat remarkable, with respect to the work we have in view, namely, the time, and the place of it. 1st, As for the time, I judge it pretty remarkable, that this same time hundred years, the Solemn League for reformation was sworn by persons of all ranks through the three kingdoms of Scotland, England, and Ireland; and that, notwithstanding of the strong efforts of hell and earth, since that time, to have them buried in utter silence, yet this day, God, in his adorable providence, is making these covenant-engagements with him to peep from under the ground, 2dly, I judge the place of their begun resurrection somewhat remarkable, namely, in the town of Stirling, where that faithful witness, Mr James Guthrie, minister of the place, was stoned, and otherwise maltreated and abused, by a malignant party, for his faithful adherence unto the covenanted reformation, and who also suffered martyrdom in the same cause, in the Grassmarket of Edinburgh.

And although we be shut out of the legal synagogue of the place, have not access to speak in the pulpit of that eminent light of our Israel, yet, it is worthy of our observation, that God has, in his holy providence, brought a place of worship out of the old quarry, where we may worship him, even in Stirling, and set about the renovation of our solemn covenant-allegiance unto the exalted King of Zion.

Perhaps some may say, as in Neh. iv., “What will these feeble associates do ? will they make an end in a day ? will they revive the stones out of the heaps of the rubbish, which are burnt?” I answer, It is all one with God to work by many or by few; by the weak things of the world, or by the great and mighty, who appeared for this cause at our reformation. I remember a scripture or two that has been comfortable to myself since the first beginning of the work that God has been employing us in for some time past. One you have, Mic. ii. 13, “The Breaker is come up before them; they have broken up, and have passed through the gate, and are gone out by it, and their King shall pass before them, and the Lord on the head of them,” The other is, Matth. xxviii. ult., being Christ’s parting word of promise to his disciples immediately before lie ascended up on high, “Lo, I am with you alway even unto the end of the world.”

In the faith of his faithful word of promise, though our hands be weak and few, we are to set forward in this great work. The apostles were but twelve poor fishermen, sent out to build the kingdom of Christ, and to encounter hell and earth, principalities and powers, and the rulers of the darkness of this world; and yet, the Breaker going up, before them, the Jewish economy is unhinged, the idolatries of the Gentile nations fallen down, and the power of the Roman empire is made to stoop to the obedience of Christ, the Prince of the kings of the earth.

And what do we know, but the Lord may so far countenance the little mint we are making to own the royal authority of Zion’s King this day, as to determine all the inhabitants of Britain and Ireland, in his own time to do the same, and again, like Ethiopia, to stretch out their hands to God, and to return to him, from whom they have so far departed. His blessing upon this essay will do it effectually; for “his hand is not shortened, that he cannot save; neither his ear heavy, that he cannot hear.</p></blockquote>

n+view%2C+namely%2C+the+time%2C+and+the+place+of+it.+1st%2C+As+for+the+time%2C+I+judge+it+pretty+remarkable%2C+that+this+same+time+hundred+years%2C+the+Solemn+League+for+reformation+was+sworn+by+persons+of+all+ranks+through+the+three+kingdoms+of+Scotland%2C+England%2C+and+Ireland%3B+and+that%2C+notwithstanding+of+the+strong+efforts+of+hell+and+earth%2C+since+that+time%2C+to+have+them+buried+in+utter+silence%2C+yet+this+day%2C+God%2C+in+his+adorable+providence%2C+is+making+these+covenant-engagements+with+him+to+peep+from+under+the+ground%2C+2dly%2C+I+judge+the+place+of+their+begun+resurrection+somewhat+remarkable%2C+namely%2C+in+the+town+of+Stirling%2C+where+that+faithful+witness%2C+Mr+James+Guthrie%2C+minister+of+the+place%2C+was+stoned%2C+and+otherwise+maltreated+and+abused%2C+by+a+malignant+party%2C+for+his+faithful+adherence+unto+the+covenanted+reformation%2C+and+who+also+suffered+martyrdom+in+the+same+cause%2C+in+the+Grassmarket+of+Edinburgh.%0A%0AAnd+although+we+be+shut+out+of+the+legal+synagogue+of+the+place%2C+have+not+access+to+speak+in+the+pulpit+of+that+eminent+light+of+our+Israel%2C+yet%2C+it+is+worthy+of+our+observation%2C+that+God+has%2C+in+his+holy+providence%2C+brought+a+place+of+worship+out+of+the+old+quarry%2C+where+we+may+worship+him%2C+even+in+Stirling%2C+and+set+about+the+renovation+of+our+solemn+covenant-allegiance+unto+the+exalted+King+of+Zion.%0A%0APerhaps+some+may+say%2C+as+in+Neh.+iv.%2C+%E2%80%9CWhat+will+these+feeble+associates+do+%3F+will+they+make+an+end+in+a+day+%3F+will+they+revive+the+stones+out+of+the+heaps+of+the+rubbish%2C+which+are+burnt%3F%E2%80%9D+I+answer%2C+It+is+all+one+with+God+to+work+by+many+or+by+few%3B+by+the+weak+things+of+the+world%2C+or+by+the+great+and+mighty%2C+who+appeared+for+this+cause+at+our+reformation.+I+remember+a+scripture+or+two+that+has+been+comfortable+to+myself+since+the+first+beginning+of+the+work+that+God+has+been+employing+us+in+for+some+time+past.+One+you+have%2C+Mic.+ii.+13%2C+%E2%80%9CThe+Breaker+is+come+up+before+them%3B+they+have+broken+up%2C+and+have+passed+through+the+gate%2C+and+are+gone+out+by+it%2C+and+their+King+shall+pass+before+them%2C+and+the+Lord+on+the+head+of+them%2C%E2%80%9D+The+other+is%2C+Matth.+xxviii.+ult.%2C+being+Christ%E2%80%99s+parting+word+of+promise+to+his+disciples+immediately+before+lie+ascended+up+on+high%2C+%E2%80%9CLo%2C+I+am+with+you+alway+even+unto+the+end+of+the+world.%E2%80%9D%0A%0AIn+the+faith+of+his+faithful+word+of+promise%2C+though+our+hands+be+weak+and+few%2C+we+are+to+set+forward+in+this+great+work.+The+apostles+were+but+twelve+poor+fishermen%2C+sent+out+to+build+the+kingdom+of+Christ%2C+and+to+encounter+hell+and+earth%2C+principalities+and+powers%2C+and+the+rulers+of+the+darkness+of+this+world%3B+and+yet%2C+the+Breaker+going+up%2C+before+them%2C+the+Jewish+economy+is+unhinged%2C+the+idolatries+of+the+Gentile+nations+fallen+down%2C+and+the+power+of+the+Roman+empire+is+made+to+stoop+to+the+obedience+of+Christ%2C+the+Prince+of+the+kings+of+the+earth.%0A%0AAnd+what+do+we+know%2C+but+the+Lord+may+so+far+countenance+the+little+mint+we+are+making+to+own+the+royal+authority+of+Zion%E2%80%99s+King+this+day%2C+as+to+determine+all+the+inhabitants+of+Britain+and+Ireland%2C+in+his+own+time+to+do+the+same%2C+and+again%2C+like+Ethiopia%2C+to+stretch+out+their+hands+to+God%2C+and+to+return+to+him%2C+from+whom+they+have+so+far+departed.+His+blessing+upon+this+essay+will+do+it+effectually%3B+for+%E2%80%9Chis+hand+is+not+shortened%2C+that+he+cannot+save%3B+neither+his+ear+heavy%2C+that+he+cannot+hear.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+Christ+considered+as+the+nail+fastened+in+a+sure+place%2C+bearing+all+the+glory+of+his+Father+s+house.+A+sermon+preached+at+Stirling%2C+December+28%2C+1743%2C+immediately+before+the+renovation+of+our+solemn+covenants%2C+by+the+ministers+of+the+Associate+Presbytery.+And+some+other+sermons+preached+afterwards+u&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F73985b6188.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/73985b6188.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/07/ebenezer-erskine-on-the-associate-presbyterys-1743-renovation-of-the-covenants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>For first, with you are all the Armies in heaven: All the Saints and Churches of Christ are with you, striving with you by their prayers, (not only in reference to by our persons, but to your employments) for protection, guidance, blessing. The appearing of Christ in the beauty of Reformation among us, may be said to be the desire of all (Christian) Nations.

Secondly, not only so, but ye have the prayers of those that have been before us. For verily many Prophets and righteous men have desired to see the things which ye see,&amp; have not seen them, viz. a Parliament resolved upon a more thorough Reformation; an Assembly called to debate &amp; advise about the establishing of Doctrine and worship, and the Government of the Church in a more pure &amp; regular manner; with how many tears and prayers did our Forefathers seek this at the hands of God? The first fruits of which prayers we (who are entered upon their labours) have already tasted, and shall reap in full answers, in due time if we faint not.</p></blockquote>

.wordpress.com/2019/06/04/matthew-newcomen-on-prayerful-encouragement-to-further-reformation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8e2516eeef" data-kw="">
<blockquote><p>WE are now to speak of the Second Head, Concerning Separation from true Churches, and the true worship of God in them, because of the sins of Fellow-worshipers.

I. That which our Adversaries hold concerning this, is, That the presence of wicked men at Ordinances do defile the Ordinances to the Godly: Therefore, say they, where ever there is any corruption in a Church, or where prophane or wicked men are suffered to be in it, The Godly are bound to abstain from the Lords Table, and not to communicate with the mixed multitude; And because they hold it is not Lawful for any to live in any Church, where they cannot enjoy the whole Ordinances of God: Therefore they maintain that the Godly are bound to Separate from That Church, and to make up a Church of their Own, by gathering out so many of the Godly that are in it, as they can get, and make a little Congregation of their own, choosing any of them to be a Minister, and some one or two to be Elders, And so they set up a Church against a Church, a Church in the Bosom of a Church.

This is not a new Error, It troubled the Church of Christ long since, in the Fourth Century or something more than Three hundred years after Christ: The Donatists, a kind of Hereticks arose and troubled the Church for a long time, and did teach the same very thing; Against whom the Godly Fathers of the Church in that time did write: Yet because this Error was carried on with a shew of Holiness and Strictness more than ordinary, It took such deep rooting in the minds of some well minding People (some of them at least) that it could not be driven out by force of Argument, till the Lord did leave the maintainers of this Error to fall into other vile abominations, for all their pretence of Strictness; Which made all others to loathe them: And before it could be gotten rooted out of the minds of men, It troubled the Church almost 100. years together. The same is the Error which we have now to Refute.</p></blockquote>

</figure><figure class="quote" id="q-1b83b2baff" data-kw="">
<blockquote><p>For if that were true, That the presence of wicked Men did defile the Worship to Thee, then Christians would be in a very hard condition: For there was never a Church so pure, but there were some admitted to it, whom a Man truly tender would think should not be there; There was never a Church so pure but a tender Man zealously strict would find some to challenge; And so according to that Doctrine there should be no Church that a tender Christian could join with; And so he should be forced to serve God apart and by himself alone:

And this hath been the Separatists way, They have Separated from one Church to another, till at last they could get none to join with; And so turned Seekers, that is, A Sect who think there are None they can join with; And therefore, they cast off all Public Duties, and serve God by themselves alone; Because they can see none so Holy as themselves.

And therefore ye would suspect Zeal when joined with Error; And fear Error most when it is covered over with Zeal: For Error is never so dangerous, as when it gets on the mask of Zeal, It being then most cruel and most impudent: People then have no will to meddle with it, lest they should seem to be Enemies to True Piety; And therefore because it is suffered and born with, it turns impudent until it undo all.</p></blockquote>

inburgh%3A+George+Mosman%2C+1692%29%2C+pp+233-34.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b83b2baff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1b83b2baff.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/20/james-fergusson-on-the-madness-of-separatist-purism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I would not be understood to extend this too far, as some, through a Mistake dangerous enough, do, as if thereby we were forbid civil or neighbourly Converse with Persons that are not religious; for this is not only lawful, but a Duty; we have not only Scripture Commands to this Purpose, but the very Law of Nature obliges us to it: And we are sure, GOD did never by any positive Precept enjoin us any Thing contrary to this. Nay, upon the contrary, we see plainly, That a Walk according; to the Law of Nature in this Matter, is highly congruous to Religion. If such Persons do visit us, we may visit them again, and carry it friendly.

This is one Part of that Courteousness that the Apostle Peter enjoins us, I Pet. iii. 8, Finally, be ye all of one Mind, having Compassion one of another; love as Brethren, be pitiful, be courteous. And where as the Refusal of civil Converse, in enquiring after one another’s Health, visiting at some Times, and the like Acts of Kindness, is looked upon by some as a Piece of Strictness and Perfection, it is quite otherwise; for the very contrary is determined to be a Piece of a Perfection, by our great Lord and Master, who is the best Judge, Matth. v. 47, 48. And if ye salute your Brethren only, what do ye more than others? do not even the Publicans so? Be therefore perfect, even as your Father which is in Heaven is perfect.

The plain Meaning of which is this, A Christian should be a Man every way beyond others, and should have something peculiar in the Whole of his Conduct; but if ye deal only civilly and neighbourly with these of your own Persuasion, with these who in every Thing do jump with you, wherein do ye go beyond the Publicans and Sinners, the most signally impious Wretches that the World can shew again? Even Thieves and Robbers will keep some Correspondence and Civility toward these of their own Sort; but Christian Perfection calls for more Enlargement of Soul, and requires that we carry obligingly to all, and perform, as Occasion calls, all the Duties of Love, which comprehend certainly these of civil Converse and Neighbourliness, as the Apostle puts beyond all question, I Cor. x. 27, If any of them that believe not, bid you to a Feast, and ye be disposed to go, whatsoever is set before you, eat asking no Question for Conscience sake.

Thus we see Christians are allowed to converse civilly with these who are Unbelievers. And indeed not to do so, has a Tendency to brine the Way of GOD into Contempt, and to make Religion to be evil spoken of, and is contrary to the very Spirit of the Gospel, and to those many express Commands which we have of adorning the Gospel, and of conversing, so as thereby we may leave a Testimony upon the Consciences of Men. Nay, ’tis to bear Witness against GOD’s Goodness, and to rub Shame upon our Religion, as if it did narrow our Souls, and make us defective in these Duties which it obliges us to abound in.

But tho’ what we have said doth condemn the unchristian Rigidity of some, yet it will not justify the unwarrantable Choice of Persons who have no Religion, for our Intimates, or for our ordinary and daily Companions. No, we are obliged to guard against this. If we do this, we are out of our Duty, and therefore have no Reason to promise to our selves GOD’s Protection. A Person that walks, that ordinarily converses with such Men, has Reason to fear that the LORD may leave him to become like to them: And this Intimacy, I fear, is what most of you are guilty of.</p></blockquote>

<blockquote><p>The idea of emitting this “memorial” originated in the writer’s proposal to visit the United States of America. As the Synod of the Reformed Presbyterian body in that country had adopted measures for the public renewal of the British Covenants, – adapting them to the circumstances of those who acknowledge their moral obligation and adhere to their grand principles, in a different land, – he was desirous of contributing whatever was in his power to further so important a movement.

By relating what the Church’s exalted Head had done, in leading his servants in one country to pledge themselves anew to his service by sacred vows, and to lift up a standard for despised truths, and by exhibiting the salutary effects flowing from federal dedication, it was hoped that others might by excited and encouraged to “yield themselves to the Lord,” and might be directed in the performance of an all-important duty.</p></blockquote>

<blockquote><p>Recd Sept 27 U.S. Consulate Belfast September 13 1865 Hon William H. Seward Secretary of State

Sir

Will you allow me the honor and pleasure of congratulating you upon your recovery and your present ability to resume the duties of your office. I suppose that the subject of this despatch should have been sent to the Secretary of the Treasury. If however you see fit to forward it will do still better than to send it there in the first instance.

The Covenanting Synod in the US deputed three ministers Dr Wilson, Mr Wylie &amp; Mr Milligan to visit their churches in this country and collect money and clothing for the Freedmen to be dispersed through their church. The Covenanting churches here refuse Royal Bounty and wholly support their own ministers. This commends them to my approbation. They also feel more sympathy for the late slaves and are more ready to aid them than any body here except the Quakers.

In America the Covenanters held always a most firm and self sacrificing testimony against slavery. This fits them for labouring in behalf of the education and general improvement of the negroes.

Considerable though not large amounts of clothing &amp; clothing materials have been contributed through these men to supply the wants of the Freedmen. I would for these reasons most respectfully solicit the Secretary of the Treasury through you to allow these three ministers or Mr Wylie the writer of the enclosed note as one of them to pass articles free of duty that may have been contributed in this county for this benevolent object.

The enclosed note is the only other explanation that the matter seems to require.

I have the honor to be Sir your humble servant John Young</p></blockquote>

<blockquote><p>Robert Buchanan, who later joined the Free Church of Scotland as a result of the Disruption of 1843, warned the British Prime Minister, Sir Robert Peel, of the danger to the Church of Scotland that was posed by the government’s policy of restricting the spiritual independence of the established Church of Scotland:

The Right Honble Sir Robert Peel Bart Private

Sir

I have this day received a communication to which I venture most earnestly to solicit your attention. It is contained in the accompanying printed circular. I believe that the head of her Majesty’s Govt, as a wise &amp; discerning Statesman, will not seem [illegible] the multitude of grave &amp; momentous questions which are at this moment engrossing his mind, deem it unworthy of serious thought. If I came using an undue liberty in presuming to obtrude it on your notice my only apology is the strength of my conviction that it is due to both you &amp; the country to make you aware of the facts which the document in question will disclose. If I am wrong in thinking so at least I am conscious of acting in the sincerity of my heart. No one knows, &amp; so far as I am concerned, no one shall know that I have done what I am now doing. My sole object &amp; desire is to place the matter before you leaving the result in the hands of Him whose counsel shall stand &amp; who will do all His pleasure. I court no reply.

Permit me only in the [illegible] form, to advert to the way in which the alarming event the circular contemplates, is expected to arrive. Ten days ago what appeared most probable was that the disruption of the Scottish Church might be produced by the passing of a law at variance with what the majority of her office-bearers regard as a fundamental principle of her constitution.

The commencement since them made in Parlt that Govt do not propose to legislate upon the subject at all, but to support the law as it has been or may be declared in the civil courts, changed the form in which the destructive collision will take place, but can hardly be said in any degree to have lessened the possibility of its coming.

The question now under discussion in the courts of civil law is substantially this, is the jurisdiction of the church supreme &amp; exclusive in matters spiritual? The civil courts may decide in such a way as to negate that proposition, for they have already before the points has been tried, assumed a power which they cannot vindicate their right to exercise in any other way.

The instant that decision is pronounced, the church of necessity is driven to the wall. She will not part with a jurisdiction which she hold as an article of faith &amp; believes to be committed to her keeping by the Lord Jesus Christ, which she believes moreover to have been solemnly ratified by the constitution of this being done.

There will then therefore be no other alternative but separation from the State.

Believe me Sir Robert Peel I write these words with all their tremendous import before my mind. But knowing what I do if the question at issue &amp; of the parties who are concerned in it, I declare, as in the sight of God my firm belief, that in the event of such a decision as I have alluded to being come to &amp; Parlt declining to interpose there will be greatly more difficulty than now, the breaking us of the Church of Scotland will be altogether inevitable.

I retain no copy of what I have now written.

I have done what I believed to be a duty in placing the subject before you. I regard it as more really important, in its bearings on the peace &amp; welfare of this empire, than even the greatest of those other national questions that now agitate the public mind.

That the Lord of all grace &amp; wisdom may guide you in the disposal of it is the earnest prayer.

Sir Yr most obt humble servt Robert Buchanan Glasgow 24 March 1842</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Robert Peel, 24 Mar. 1842 (British Library, London, Peel Papers, Add MS 40508, ff 207-11).</cite></span></figcaption>

</figure><figure class="quote" id="q-7b46081604" data-kw="">
<blockquote><p>Yet my soul is so united unto you upon that account, and because of your real concernedness and soul sympathy with all of us in Scotland, who desire to be helped of the Lord, to espouse his quarrel to be only ours, and his concernments to be only ours; I say, so united (though little or nothing I can say as I ought) that I cannot keep silent. … Most reverend Sir, my soul desires, while I live, to praise the Lord, for what great things He hath helped you to do, in so nobly, faithfully, and freely witnessing for his noble cause, and sweet Scotland’s cause.

My soul desires to honour you, because He hath so honoured you; and to love you, because He loves you, and hath caused you to love and own his cause, and receive his truths in love; and also to be afflicted in all the afflictions of his people, and to be such a sympathizer, and a burden-bearer with his poor remnant in this land, as that we may say of you, as Paul of the Hebrews, “Ye have had compassion on us in our bonds.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Yet my soul is so united unto you upon that account, and because of your real concernedness and soul sympathy with all of us in Scotland, who desire to be helped of the Lord, to espouse his quarrel to be only ours, and his concernments to be only ours; I say, so united (though little or nothing I can say as I ought) that I cannot keep silent. … Most reverend Sir, my soul desires, while I live, to praise the Lord, for what great things He hath helped you to do, in so nobly, faithfully, and freely witnessing for his noble cause, and sweet Scotland’s cause.

My soul desires to honour you, because He hath so honoured you; and to love you, because He loves you, and hath caused you to love and own his cause, and receive his truths in love; and also to be afflicted in all the afflictions of his people, and to be such a sympathizer, and a burden-bearer with his poor remnant in this land, as that we may say of you, as Paul of the Hebrews, “Ye have had compassion on us in our bonds.”

— James Renwick, Letter to William Brackel, 5 Oct. 1682 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh, 1876), iv, 61-62.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+my+soul+is+so+united+unto+you+upon+that+account%2C+and+because+of+your+real+concernedness+and+soul+sympathy+with+all+of+us+in+Scotland%2C+who+desire+to+be+helped+of+the+Lord%2C+to+espouse+his+quarrel+to+be+only+ours%2C+and+his+concernments+to+be+only+ours%3B+I+say%2C+so+united+%28though+little+or+nothing+I+can+say+as+I+ought%29+that+I+cannot+keep+silent.+%E2%80%A6+Most+reverend+Sir%2C+my+soul+desires%2C+while+I+live%2C+to+praise+the+Lord%2C+for+what+great+things+He+hath+helped+you+to+do%2C+in+so+nobly%2C+faithfully%2C+and+freely+witnessing+for+his+noble+cause%2C+and+sweet+Scotland%E2%80%99s+cause.%0A%0AMy+soul+desires+to+honour+you%2C+because+He+hath+so+honoured+you%3B+and+to+love+you%2C+because+He+loves+you%2C+and+hath+caused+you+to+love+and+own+his+cause%2C+and+receive+his+truths+in+love%3B+and+also+to+be+afflicted+in+all+the+afflictions+of+his+people%2C+and+to+be+such+a+sympathizer%2C+and+a+burden-bearer+with+his+poor+remnant+in+this+land%2C+as+that+we+may+say+of+you%2C+as+Paul+of+the+Hebrews%2C+%E2%80%9CYe+have+had+compassion+on+us+in+our+bonds.%E2%80%9D%0A%0A%E2%80%94+James+Renwick%2C+Letter+to+William+Brackel%2C+5+Oct.+1682+in+Thomas+Houston+%28ed.%29%2C+Spiritual+Support+and+Consolation+in+Difficult+Times%3A+The+Letters+of+the+Rev.+James+Renwick+%281865%29+in+Works+Doctrinal+and+Practical+of+the+Rev.+Thomas+Houston%2C+D.D.+%284+vols%2C+Edinburgh%2C+1876%29%2C+iv%2C+61-62.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b46081604.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7b46081604.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/15/james-renwick-on-the-sympathy-of-wilhelmus-a-brakel-for-the-suffering-church-of-scotland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-61677b42bb" data-kw="">
<blockquote><p>The enemy says, What will we get to boast of now? “for our God is now gone,” and our religion both; for they think the covenanted cause of the Reformed Presbyterian Church of Scotland is now dead and buried, and they are beginning to write epitaphs on her grave. But the Church will live longer than they. Zion will outlive all her enemies in spite of all that is deadly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/michael-bruce.html">Michael Bruce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><figure class="quote" id="q-4ffa2a08d8" data-kw="">
<blockquote><p>(f) Last, but not least, when St. Paul said, “Come out and be separate,” he did not mean that Christians ought to withdraw from every Church in which there are unconverted members, or to refuse to worship in company with any who are not believers, or to keep away from the Lord’s table if any ungodly people go up to it. This is a very common but a very grievous mistake. There is not a text in the New Testament to justify it, and it ought to be condemned as a pure invention of man. Our Lord Jesus Christ Himself deliberately allowed Judas Iscariot to be an apostle for three years, and gave him the Lord’s Supper. He has taught us, in the parable of the wheat and tares, that converted and unconverted will be “together till the harvest,” and cannot be divided. (Matt. xiii. 30.)

In His Epistles to the Seven Churches, and in all St. Paul’s Epistles, we often see faults and corruptions mentioned and reproved; but we are never told that they justify desertion of the assembly, or neglect of ordinances. In short, we must not look for a perfect Church, a perfect congregation, and a perfect company of communicants, until the marriage supper of the Lamb. If others are unworthy Churchmen, or unworthy partakers of the Lord’s Supper, the sin is theirs and not ours: we are not their judges. But to separate ourselves from Church assemblies, and deprive ourselves of Christian ordinances, because others use them unworthily, is to take up a foolish, unreasonable, and unscriptural position. It is not the mind of Christ, and it certainly is not St. Paul’s idea of separation from the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), pp 275-76.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-9598a2fd2c" data-kw="">
<blockquote><p>I now approach death, heartily satisfied with our excellent Westminster Confession of Faith, Catechisms, and Form of church-government,—and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the doctrines and practise the duties therein contained.

I look upon the Secession as indeed the cause of God, but sadly mismanaged and dishonoured by myself and others. Alas! for that pride, passion, selfishness, and unconcern for the glory of Christ, and spiritual edification of souls, which has so often prevailed!—Alas! for our want of due meekness, gentleness, holy zeal, self-denial, hearty grief for sin, compassion to souls in immediate connection with us, or left in the established church, which became distinguished witnesses for Christ. Alas! that we did not chiefly strive to pray better, preach better, and live better than our neighbours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Address to Students of Divinity in John Brown and Ebenezer Brown (eds), Select Remains of the Rev. John Brown, Late Minister of the Gospel at Haddington</cite></span></figcaption>

<blockquote><p>Many a sermon hath God bestowed upon thee, O Scotland, but ere long God’s judgments shall be as frequent as these precious meetings have been wherein He sent forth His faithful servants to give warning in His name of their hazard in apostatizing from God, and in breaking all these noble vows which He brought the land unto Himself. God sent out a Welch, a Semple, a Cameron, and a Cargill to preach to thee, O Scotland, but ere long God shall preach unto thee by a bloody sword; for God shall not let a sentence of these men’s words fall to the ground that He sent out, and a commissioned to preach these things in His name – I say, God shall not let a sentence of these men’s words fall to the ground, but they shall have their due accomplishment ere it be long.</p></blockquote>

<blockquote><p>Families are the seminaries both of the church and state. And, therefore, as you desire the church may be pure and the state righteous, look well unto you families and let religion flourish in them. Reformation indeed must begin with persons. And if every one would mend one, all would be reformed. But from persons it must proceed to houses. And if these were but once leavened with godliness, what holy cities and what a happy nation would there be!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), p. 181.</span></figcaption>

</figure><figure class="quote" id="q-931f7e9954" data-kw="">
<blockquote><p>Again, I reason thus; That which moved not Christ and his Apostles to separate from the Church of their time, is no cause to us of separation; but, want of satisfaction by convincing signs of the true grace of every member of the Church, was to them no cause of separation from the Churches of their times, Ergo.

The major is clear, except we desire a better pattern for our practices then Christ and his Apostles; what ever carrieth us beyond their line, must be high presumption and deep hypocrisy.

The minor is clear, by many Scriptures; the Scribes and Pharisees were a generation of vipers; Jerusalem worse then Sodom and Gomorrah; Corasin and Bethsaida was worse then Tyrus and Sidon, and to be cast lower in Hell then these: yet the Lord did not give over to preach, to pray, to go to the Temple with them. Judas when a declared Traitor, did not scare him, nor any of his company from the Sacrament. After he went from the Table, when his wickedness was revealed that a Devil was in him; yet none of the Apostles offered to cast themselves out of the body because this wicked member was not cut off.

Many members of the Apostolic Churches were so far from convincing signs of true grace, that the works of the flesh were most evident in their life. In the Corinthians, fundamental errors, open Idolatry, grievous scandal, bitter contentions, profanation of the Lords Table. In the Galatians, such errors as destroyed grace, and made Christ of none effect. In the Church of Ephesus, of Laodicea, and the other golden Candlesticks, divers members were so evidently faulty, that the Candlestick is threatened to be removed; yet from none of these Churches did any of the Apostles ever separate, nor gave they the least warrant to any of their Disciples to make a separation from any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), pp 158-59.</span></figcaption>

</figure><figure class="quote" id="q-5a77753ae2" data-kw="">
<blockquote><p>What to Moses and the Prophets was not a sufficient cause of separation from the Churches of their time, is not a sufficient cause for us to separate from the Churches in our times. But, want of satisfaction by convincing signs of the true grace of many members of the Church, was not a sufficient cause for Moses and the Prophets to separate in their times.

Ergo: The minor is clear and uncontroverted; for Moses and the Prophets were so far from separating from the Churches of their days for want of assurance of the true grace of every person in these Churches that they remained still to their dying day in the bosom of these Churches, communicating with them in the Word, Prayer, Sacraments and Sacrifices, though they were assured of the evident wickedness of the most of their fellow-members.

Moses knew the Body of Israel to be a crooked and perverse generation: Isaiah tells the Jews that they were another Sodom; Jeremy sheweth that Israel in his days was uncircumcised in heart, no better then Moab, Ammon, or Edom; Micah, that the godly in his time were very rare as the summer fruits, as the grapes after the Vintage; of this truth all the Prophets are full; yet for all this, none of the Prophets did ever think of a separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), p. 157.</span></figcaption>

</figure><figure class="quote" id="q-5497843023" data-kw="">
<blockquote><p>If, therefore, magistrates command that which is prejudicial to the general welfare of the society, or dishonourable to God, the Supreme Governor of it, they ought to be disobeyed. And, if they be habitually cruel and tyrannical, they ought to be resisted and deposed, if circumstances permit.

1. When the great body of the subjects are much alienated in affection, a revolution may be accomplished without much hazard or hurt.

2. By resisting tyrannical princes in proper circumstances, nations have often preserved their lives as well as their liberties from impending ruin.

3. Such resistance, prudently managed, is an effectual warning to other magistrates to beware of abusing and opposing their subjects.

4. In mixed forms of government, the propriety of resistance is most clear as well as most easy: as when a parliament resists a king, or a king resists a parliament, in defence of the common liberties of the nation. – Nevertheless, as princes are exposed to many and uncommon difficulties, and are apt to be imposed on by their confidents:- and as their real designs are not easily penetrated, and often not to be pried into by their subjects; – and as resistance ordinarily occasions much bloodshed and misery, – subjects ought to put the best construction upon the conduct of their governors that it can justly admit, – and never proceed to violent measures but where it is absolutely necessary, and where there is an hopeful prospect of success.</p></blockquote>

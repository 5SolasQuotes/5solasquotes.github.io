<blockquote><p>On this subject [of church-state relations] there are various and conflicting opinions. 1. One of these is opposed to all connection between Church and State; and this opinion is commonly defended on two separate grounds. First, it is alleged that because religion is a thing altogether personal, lying exclusively between a man and his Maker, therefore its support ought to depend on the voluntary contributions of professors. And secondly, it is argued that the State is properly little else than a national arbiter of party interests in things civil, and that it has absolutely nothing to do with religion. The latter of these is the more fundamental; and our objection to it is, that, so far as we can see, a nation acting on this principle must continue to be in all time coming essentially infidel.

Its people may, independently of this, be all of them professing members of the Church of Christ. But the nation itself, and in its corporate capacity, cannot, as we think, be other than unbelieving—making no profession of the faith of the gospel. And then we are at a loss to see how, in these circumstances, “the kingdoms of this world are to become the kingdoms of our Lord and of his Christ;” how “kings are to be nursing fathers, and their queens nursing mothers,” of the Church; and still more, how, in accordance with this theory, it should be said that by Christ “kings reign and princes decree justice” — that by him “princes rule and nobles, even all the judges of the earth” — and farther, that he hath on his vesture and on his thigh a name written, “King of kings and Lord of lords” (Rev. xi. 15; Isa. xlix. 23; Prov. viii. 15, 16; Rev. xix. 16).

There are also practical difficulties in the way. A nation, acting rigidly on this principle, would, as we think, be compelled to withdraw all public protection from the observance of the weekly Sabbath, and to disregard the moral obligation of oaths given in evidence. The nation, as a nation, would thus have to act on principles altogether at variance with those of the families and individuals composing it — a thing as impracticable as inconsistent with the proper bonds of society; but it is chiefly as regards the prophetical vision that we have to do with this theory, and here the objection is equally fundamental.

For, if the very idolatry of nations be self-will, and if this will is never to be subordinated to the will of God, then how is the stone to pound the image? and still more, how is it to take the place of the image? How is the very will of God, as taught in his Word and observed in his Church, to supplant and destroy the will of man in all things national? And yet all this is foretold, for, in the room of the image, there is to be “a kingdom, which the God of heaven shall set up, and which shall never be destroyed.” (V. 44.)</p></blockquote>

<blockquote><p>All Christians are obliged to the uttermost of their power to quench the fire of heresy and schism; but above all other, we have a special obligation for this duty. We have lifted up our hands to the most high God, vowing to him, in the sight of all the neighbour-nations, our endeavours in the sincerity of our hearts, to extirpate heresy and schism, and whatsoever shall be found contrary to sound doctrine, without respect of persons.

If herein we should be negligent, would not God avenge our solemn perjury? If respect to any person should make us ever think of breaking that bond, and expressly contrary thereto to begin once to tamper about the toleration of errors contrary to sound doctrine, what might we and the posterity expect from the hand of the God of justice and truth?</p></blockquote>

<blockquote><p>Social covenanting has been one distinguished means of maintaining the Divine cause in the world. The national profession of Israel was ratified by the national oath at Horeb. This covenant was renewed forty years after on the plains of Moab; and the notable seasons of revival in the days of Joshua, Asa, Nehemiah, and others, were accompanied by national vows to the Most High.

The Jewish Scriptures abound with notices of these covenants; every prophet cries out against the land because of the breach of them; and the inference naturally suggested by this to every man, whose understanding is not snared by the entanglements of party opinion, would be that these things are written in Scripture, and diffused throughout the world, to teach the nations to avouch the Lord to be their God.

Such was the inference drawn by the most famous among the reformed churches. Never – not even in the days of Asa, when all Judah rejoiced because of the oath – not even then was covenanting more eminently countenanced by the Divine blessing than it has been among the churches of the Reformation. So early as 1530, when the Reformation was only in its infancy, while it was yet struggling for existence with numerous, powerful, and embittered foes; the German reformers entered into a league to support and defend one another in adhering to and maintaining their religion and liberties. Similar covenants were entered into by other Protestant states, and under God were the means of consolidating the triumphs which Protestantism had attained.

In no land has covenanting been more frequently engaged in, or more signally countenanced, than in Scotland. Hence the name bestowed upon that church from an early period — THE COVENANTED CHURCH OF SCOTLAND. Before the period of her establishment by the state, the Church of Scotland was a covenanting church, and she continued to be a covenanting church from the Reformation till the Revolution.

It was by covenanting that our fathers were cemented into godly union, and inspired by that victorious energy which rendered them triumphant in their struggles against Popery, Prelacy, and Erastianism. When these enemies of civil and religious liberty came in like a flood, the standard raised against them by the Spirit of the Lord was the banner of the covenant. Under this standard the armies of the Lamb in Scotland went down into the battle, and performed those deeds which shall be had in everlasting remembrance. To expunge the covenants from the history of the Church of Scotland would be, not only to rob it of certain facts, but to deprive it of its vital spirit.</p></blockquote>

The Jewish Scriptures abound with notices of these covenants; every prophet cries out against the land because of the breach of them; and the inference naturally suggested by this to every man, whose understanding is not snared by the entanglements of party opinion, would be that these things are written in Scripture, and diffused throughout the world, to teach the nations to avouch the Lord to be their God.

Such was the inference drawn by the most famous among the reformed churches. Never – not even in the days of Asa, when all Judah rejoiced because of the oath – not even then was covenanting more eminently countenanced by the Divine blessing than it has been among the churches of the Reformation. So early as 1530, when the Reformation was only in its infancy, while it was yet struggling for existence with numerous, powerful, and embittered foes; the German reformers entered into a league to support and defend one another in adhering to and maintaining their religion and liberties. Similar covenants were entered into by other Protestant states, and under God were the means of consolidating the triumphs which Protestantism had attained.

In no land has covenanting been more frequently engaged in, or more signally countenanced, than in Scotland. Hence the name bestowed upon that church from an early period — THE COVENANTED CHURCH OF SCOTLAND. Before the period of her establishment by the state, the Church of Scotland was a covenanting church, and she continued to be a covenanting church from the Reformation till the Revolution.

It was by covenanting that our fathers were cemented into godly union, and inspired by that victorious energy which rendered them triumphant in their struggles against Popery, Prelacy, and Erastianism. When these enemies of civil and religious liberty came in like a flood, the standard raised against them by the Spirit of the Lord was the banner of the covenant. Under this standard the armies of the Lamb in Scotland went down into the battle, and performed those deeds which shall be had in everlasting remembrance. To expunge the covenants from the history of the Church of Scotland would be, not only to rob it of certain facts, but to deprive it of its vital spirit.”

— William White, Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation, (Edinburgh: W. P. Kennedy, 1844), pp 1-2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSocial+covenanting+has+been+one+distinguished+means+of+maintaining+the+Divine+cause+in+the+world.+The+national+profession+of+Israel+was+ratified+by+the+national+oath+at+Horeb.+This+covenant+was+renewed+forty+years+after+on+the+plains+of+Moab%3B+and+the+notable+seasons+of+revival+in+the+days+of+Joshua%2C+Asa%2C+Nehemiah%2C+and+others%2C+were+accompanied+by+national+vows+to+the+Most+High.%0A%0AThe+Jewish+Scriptures+abound+with+notices+of+these+covenants%3B+every+prophet+cries+out+against+the+land+because+of+the+breach+of+them%3B+and+the+inference+naturally+suggested+by+this+to+every+man%2C+whose+understanding+is+not+snared+by+the+entanglements+of+party+opinion%2C+would+be+that+these+things+are+written+in+Scripture%2C+and+diffused+throughout+the+world%2C+to+teach+the+nations+to+avouch+the+Lord+to+be+their+God.%0A%0ASuch+was+the+inference+drawn+by+the+most+famous+among+the+reformed+churches.+Never+%E2%80%93+not+even+in+the+days+of+Asa%2C+when+all+Judah+rejoiced+because+of+the+oath+%E2%80%93+not+even+then+was+covenanting+more+eminently+countenanced+by+the+Divine+blessing+than+it+has+been+among+the+churches+of+the+Reformation.+So+early+as+1530%2C+when+the+Reformation+was+only+in+its+infancy%2C+while+it+was+yet+struggling+for+existence+with+numerous%2C+powerful%2C+and+embittered+foes%3B+the+German+reformers+entered+into+a+league+to+support+and+defend+one+another+in+adhering+to+and+maintaining+their+religion+and+liberties.+Similar+covenants+were+entered+into+by+other+Protestant+states%2C+and+under+God+were+the+means+of+consolidating+the+triumphs+which+Protestantism+had+attained.%0A%0AIn+no+land+has+covenanting+been+more+frequently+engaged+in%2C+or+more+signally+countenanced%2C+than+in+Scotland.+Hence+the+name+be <blockquote><p>These lands, and particularly this, entered into solemn leagues and covenants, for preserving and carrying on a work of reformation, in opposition to Papists, Prelatists, Erastians, Sectarians, and all malignants, or enemies of the work of reformation under whatever denomination, and to adhere to the doctrine, discipline, worship, and government of the church of Christ; but alas! how treacherously have we and our fathers dealt with the great God, with respect to these covenant-engagements? How shamefully was the obligation of them rescinded by act of parliament; and not only so, but disgracefully and ignominiously burnt at the public cross of the capital city of the nation, and that by the countenance of authority?

And, as if that had not been enough in opposition to the royal authority of the Son of God, our covenanted Head and King, the prerogatives of his crown, by act of parliament, were taken from him, and a sinful mortal vested with one of the jewels of his mediatory crown, and declared head in all causes, civil and ecclesiastic. And how many sinful compliances (with these usurpations) have there been both before and since the revolution, contrary to these solemn covenant-engagements?

We have reason to fear that God is at this day upon his march to avenge the quarrel of his holy name, that was solemnly interposed in these covenants by all ranks. Ezek. xvii. from verse 12, and downwards, we read there of an oath taken from the king of Judah by the king of Babylon, that he and all the land should be tributaries unto him: Well, though the oath was extorted, although it was made to a heathen, yet because the name of God was interposed, God avenges the quarrel of his name upon Zedekiah for the breach of it, as you see, ver. 16—19, &amp;c.

How much more will not God avenge the breach of that oath, that was made to himself as the immediate party by king, nobles, gentry, commons, and all ranks in the land, especially when interposed for no other end but to maintain the doctrine, worship, discipline, and government of his house, according to his word? How little regard has been or is had to these solemn covenants? How little personal, family, church, or state reformation doth appear among us, when all manner of blasphemy, error, profanity, and wickedness of all sorts, is abounding without any check? yea, when ecclesiastic judicatories, themselves have been, and still are, acting the very reverse of these covenants, in violating the rights and liberties of the Lord’s people?

O Sirs! wrath from the Lord is hovering over our heads for the profanation of that great and dreadful name of the Lord, in the matter of solemn oaths and covenants, both of a more public and of a more private kind. The children of Israel were separated from the rest of the nations, and God declares them to be “a royal priesthood, a peculiar people, an holy nation,” and discharged them from making any league, or entering into any affinity with these abominations; and yet they went a whoring after the idols and abominations of the nations round about them, worshipped their gods, and learned their sinful customs, which made the Lord to abhor them, and to write their sin upon their punishment, by scattering them among the nations. And is not this the case with us?

By solemn covenant we were engaged never to join with malignants, or any enemies of the reformation, and to improve our endeavours for the reformation of Britain and Ireland; but how are these things observed, when, contrary unto these engagements, the public consent is given, that abjured Prelacy and superstition shall continue in England; and when the open enemies of the covenanted reformation are not only admitted into places civil and military, but taken into the bosom of the church, and vested with the sacred rights and privileges thereof?

There is a great pother and noise when one disaffected to the civil government begins to mingle in with our civil elections of magistrates; and there is good reason to exclude them: but some men who make a mighty noise about this, make little or no account of admitting this set of people, disaffected to the government of King Jesus, to mingle in themselves, in electing the rulers and governors of the house of God. Which, to me, makes it plain, that the government of an earthly prince is dearer to them, than the government of the “Prince of the kings of the earth, the King of kings, and Lord of lords.</p></blockquote>

<blockquote><p>The [ministerial] candidate who is not ready to swear in truth, judgment, and in righteousness, that he believes the whole doctrine contained in our Confession of Faith, and Catechisms, to be founded upon the word of God, cannot be received by us into the holy ministry, without a most sinful violation of our ordination vows and engagements. He must also declare that he believes the binding obligation of our solemn covenants upon posterity. …

We impose our Formula upon no man; but we must endeavour, in the strength of promised grace, to be faithful to our glorious Master, and to all with whom we are connected in church-fellowship. We are commanded to commit the things of God to faithful men, who shall be able to teach others also. It is not tyranny to exclude from the holy ministry candidates who do not believe all the truths contained in the sacred oracles. Such persons will shun to make known the whole counsel of God to perishing sinners.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The [ministerial] candidate who is not ready to swear in truth, judgment, and in righteousness, that he believes the whole doctrine contained in our Confession of Faith, and Catechisms, to be founded upon the word of God, cannot be received by us into the holy ministry, without a most sinful violation of our ordination vows and engagements. He must also declare that he believes the binding obligation of our solemn covenants upon posterity. …

We impose our Formula upon no man; but we must endeavour, in the strength of promised grace, to be faithful to our glorious Master, and to all with whom we are connected in church-fellowship. We are commanded to commit the things of God to faithful men, who shall be able to teach others also. It is not tyranny to exclude from the holy ministry candidates who do not believe all the truths contained in the sacred oracles. Such persons will shun to make known the whole counsel of God to perishing sinners.”

<blockquote><p>Now particularly to you (Honoured and Worthy) that are Members of the Honourable House of Commons, as you are single persons, search your selves, consider your ways; Is there any thing in your hands to be cleansed? You are to purge the corrupt leaven out of your own houses, your selves, your families, your places of office and trust are the proper sphere of your activity; you are for Ecclesiastical reformation, and the sweeping out of corruptions out of the house of God: but are you as intent upon personal reformation of your own ways? do your own houses lie clean? have you real principles of godliness in your own hearts? or are you carried merely by the Parliamentary genius or stream, by a rapt motion? In one word: are you not afraid of holiness?

These are things sadly to be considered. For can you think that in good earnest one black-more should go about to wash another? would you not say, Why doth not he first make himself white, that the other may thereby be persuaded he can make him so too? If any of you should lie in known sins or lusts, can you comfortably, conscientiously, and zealously contribute to the reformation of others? you may indeed do that which is right in the sight of God, but where is your comfort, if it be not done with a perfect heart? He must needs be afraid to hedge in the Sacrament, and to make it inaccessible to the scandalous and prophane, or to settle a faithful and searching ministry in the place he lives in, that knows he shall but thereby make a rod for himself.

I beseech you therefore to search your selves, that you may not be Carpenters to build an Ark for others, and your selves be lost. It is a great honour to be a Member of this Parliament, but it is as great a burthen too, as ever English men underwent: and I shall crave leave to tell you further, that you may become the greatest sinners in the world by it, for now the sins of the Kingdom: may become yours; the Heresies, blasphemies, and crying wickedness of oppression and injustice may become yours; they are other men’s sins by commission, they are your other men’s sins by your omission of that opportunity, and duty of your place to provide for remedies preventive and removal of them, so far as they may come within your knowledge, and the reach of your power.

That which Scripture calls partaking in other men’s sins, adds more guilt to men of all sorts, especially Ministers and Magistrates, then is generally thought of. Take heed of making your selves partakers of those sins and abominations, which you hate the thought of: and the Lord keep alive your zeal by this quickening consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The purifying of unclean hearts and hands: opened in a sermon preached before the Honourable House of Commons, at their solemn fast, January 28. 1645 in Margaret’s Westminster</cite>, (London: Abel Roper, 1646), pp 17-19.</span></figcaption>

<blockquote><p>There is a great difference between the theoretical and the practical recognition of any truth; and a little attention to this difference might help us to account for much of the practical ungodliness that abounds in the world. The habit of substituting the theoretical for the practical, is by far too common a feature in the character of fallen man; and, in a thousand instances, when the sinner is detected in a practical violation of any truth, does he find a ready justification of himself in a verbal, or a speculative, or a theoretical admission of its obligations.

Thus, for example, how common a thing it is to hear the transgressor against the law of temperance, acknowledging the duty and propriety of moderation and sobriety. Speak to him, in his sober moments, and tell him of the sin of drunkenness, and of the disastrous effects resulting from it, both to his temporal and spiritual interests, and he will generally be found to acknowledge in words the truth of all you say to him. Thus does the intemperate man condemn intemperance.

Or speak to the neglector of Divine ordinances, and set forth the duty of keeping the Sabbath, by waiting upon God in the preaching of the word, and you are in most cases sure to meet with a ready acknowledgment of the very becoming and proper habit of going to church. In his own case, he adroitly finds some hindrance by which he justifies his own practice; but in comparatively few instances will the propriety of the duty it-self be denied. Thus will the Sabbath-breaker condemn the Sabbath-breaker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-nicholson.html">William Nicholson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Omnipresence of God in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Sir Henry [Martin] asked me what I thought of the King’s Supremacy. I replied, that if I should be put Legally to it; my answer should give Caesar that which was Caesar’s. I told him further, that being a Scholar, and a great Civilian, he could not choose but know; what both Divines and Lawyers, (Popish and Orthodox) had delivered concerning that: he replied, it was true: neither was he so gross, as to think any King or other Man to be Head of the Church; only he did hold the King to be Sovereign and Supreme Governor under Christ. Then (said I) Sir Henry you have answered your self; but of this further in mine Examination by Sir Robert Heath, then Attorney General.

From that he fell to ask me, what was the reason that I did oppose the Hierarchy so vehemently. I replied, true it is, I have ever opposed them, since the Lord called me; but I protested, and that truly, it was not out of hatred to their persons, though I and mine had suffered by them: nor out of envy to their places, whence their wealth, honour, and case might accrue: but first, because their Places and Authority are not of God. Secondly, because in executing of their Places, they take more upon them, then either the Law of God, or Man, alloweth them: to the prejudice and abusing of the King’s grants, the heavy detriment of the Subject, and the highly endangering of themselves: and this I offered to make good: and as for their persons, I told them, I wished them as well as my self.

What? said Sir Henry Martin, if it be so, we are all mistaken; doe you not think that they are of God; Nothing less (said I) neither think I that they think themselves so, if they will impartially examine their own hearts: for they know those thoughts to be contrary to the Word of God, the current of Human Writers, and to their own Peremptory Assertions in their own Works, written by them for their defence. Yea, said Sir Henry Martin, but I will prove it thus, is there not superiority in a Civil state; and was there not superiority in the State Ecclesiastical, under the Jews: Witness Aaron’s superiority over the Priests, so that he reasoned thus in effect, Aaron was over all the Levitical Priests.

Ergo, Bishops by Divine Right should be over Ministers.

For all my pressures, I smiled to hear their Champion for the time; beat the brains out of their cause, with a beam of their own making, or of the Popes; withal I told Sir Henry, that his Antecedent and Consequent were of so deep distance, that all the Learning in the World, could never make them meet. Yet he set a face to prove it, by a connex Proposition;

If Aaron were over the Priests,

Then Bishops should be over Ministers, &amp;c.

I denied the Connexion, and told him that all the learning amongst them could not advance that Argument one foot; nor no more they did; but being at a stand, I told Sir Henry Martin that he could not of all the Quiver, have chosen a deadlier shaft against themselves; as should appear by the retorting of the Argument thus.

The Major I cleared both from proof and reason, as Collos. 2. vers. 17. Yea the Author to the Hebrews speaks particularly to the point, as in Hebr. 7.11, 12. The Minor as it is undeniable, so he had granted it by way of query: yea, the Papists themselves grant both in express terms, in the fore-quoted place to the Hebrews, That the Levitical office in Aaron, and other things were figures of Christ’s death, and to be ended and accomplished in the same.

I shewed how I could make good the Argument from the testimonies of the Fathers; as Cyprian speaks punctually to it, citing the words of the Apostle, Let a man so account of us, as of the Ministers of Christ, and Stewards of the Mysteries of God, 1 Cor. 4.1. Paulus Apostolus (saith the Father) aequales habere voluit Sacerdotes, cum dicit, sic nos existimet, &amp;c. The Apostle Paul will have all Ministers to be equal; when he saith, Let a man esteem of us, &amp;c. Doctor [Andrew] Willet useth the like Argument, by way of retortion against the Papists, bringing Aaron and his ornaments, for a warrant of their Mass, Church-Musique, Vestments, and the like; because (saith he) these were in God’s worship then, therefore they should not be now.</p></blockquote>

The Major I cleared both from proof and reason, as Collos. 2. vers. 17. Yea the Author to the Hebrews speaks particularly to the point, as in Hebr. 7.11, 12. The Minor as it is undeniable, so he had granted it by way of query: yea, the Papists themselves grant both in express terms, in the fore-quoted place to the Hebrews, That the Levitical office in Aaron, and other things were figures of Christ’s death, and to be ended and accomplished in the same.

I shewed how I could make good the Argument from the testimonies of the Fathers; as Cyprian speaks punctually to it, citing the words of the Apostle, Let a man so account of us, as of the Ministers of Christ, and Stewards of the Mysteries of God, 1 Cor. 4.1. Paulus Apostolus (saith the Father) aequales habere voluit Sacerdotes, cum dicit, sic nos existimet, &amp;c. The Apostle Paul will have all Ministers to be equal; when he saith, Let a man esteem of us, &amp;c. Doctor [Andrew] Willet useth the like Argument, by way of retortion against the Papists, bringing Aaron and his ornaments, for a warrant of their Mass, Church-Musique, Vestments, and the like; because (saith he) these were in God’s worship then, therefore they should not be now.”

ews%2C+That+the+Levitical+office+in+Aaron%2C+and+other+things+were+figures+of+Christ%E2%80%99s+death%2C+and+to+be+ended+and+accomplished+in+the+same.%0A%0AI+shewed+how+I+could+make+good+the+Argument+from+the+testimonies+of+the+Fathers%3B+as+Cyprian+speaks+punctually+to+it%2C+citing+the+words+of+the+Apostle%2C+Let+a+man+so+account+of+us%2C+as+of+the+Ministers+of+Christ%2C+and+Stewards+of+the+Mysteries+of+God%2C+1+Cor.+4.1.+Paulus+Apostolus+%28saith+the+Father%29+aequales+habere+voluit+Sacerdotes%2C+cum+dicit%2C+sic+nos+existimet%2C+%26c.+The+Apostle+Paul+will+have+all+Ministers+to+be+equal%3B+when+he+saith%2C+Let+a+man+esteem+of+us%2C+%26c.+Doctor+%5BAndrew%5D+Willet+useth+the+like+Argument%2C+by+way+of+retortion+against+the+Papists%2C+bringing+Aaron+and+his+ornaments%2C+for+a+warrant+of+their+Mass%2C+Church-Musique%2C+Vestments%2C+and+the+like%3B+because+%28saith+he%29+these+were+in+God%E2%80%99s+worship+then%2C+therefore+they+should+not+be+now.%E2%80%9D%0A%0A%E2%80%94+Alexander+Leighton%2C+An+epitome+or+brief+discovery%2C+from+the+beginning+to+the+ending%2C+of+the+many+and+great+troubles+that+Dr.+Leighton+suffered+in+his+body%2C+estate%2C+and+family%2C+for+the+space+of+twelve+years+and+upwards.+Wherein+is+laid+down+the+cause+of+those+sufferings%3B+namely+that+book+called+Sion%E2%80%99s+plea+against+the+p%2C+%28London%3A+I.+D.%2C+1646%29%2C+pp+4-6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33a59a6b04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/33a59a6b04.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/17/alexander-leightons-arguments-against-a-prelatical-hierarchy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-458a803ab8" data-kw="">
<blockquote><p>Speaking in relation to an overture by the Edinburgh Presbytery to the General Assembly of the Free Church of Scotland, which mentioned the Covenanted Reformation, Robert S. Candlish made the following remarks about the principles of the National Covenant of Scotland and the Solemn League and Covenant:

I take for granted that all who can be possibly expected to approve of this document, will concur in admitting the general lawfulness of what our fathers did on the occasion of the — First and Second Reformations, — that they will acknowledge the lawfulness of the objects for which they allied, and the engagements and vows of the Covenants.

I take it for granted, also, that we will all acknowledge, or that nearly all of us will be prepared to own, that generally, in their substance, the Covenants and engagements into which, on these two occasions, our fathers entered, were lawful in themselves, just and necessary in the circumstances in which they were placed, and in accordance with the Word of God; and I believe that none of us will have any difficulty in owning that, in so far as their engagements were in accordance with the Word of God, suited to the emergencies of the times, based on sound principle, and fitted to promote the cause of Christ, they are to be regarded by us as a superadded obligation laid upon us to hold fast by the principles which they have handed down to us.

The obligation under which we lie to maintain our principles, does not arise primarily from any engagements or covenants of man. We know and we feel that the obligation under which we lie to maintain and carry out these principles primarily and essentially arise out of the authority of the Word of God. We do not desire to maintain the principles for which we have testified, and to follow them out, merely because our fathers did so, and because our fathers bound themselves to do so. We recognise as the only primary obligation the authority of the Word of God.

But when, as in ordinary life, and as in the intercourse of man with man, and still more, in the intercourse of nation with nation, we do own and acknowledge contracts and engagements entered into, as increasing or enforcing the obligation under which men originally lie to do justly to one another, so I think we cannot dispute that in some sense or other, and to some extent or other, if we are identically the Church that entered into engagements in former times, and that was enabled to make attainments in former times, we lie under a superadded obligation to be faithful, and to hand down to the generation following the testimony which has been handed down to us.</p></blockquote>

<blockquote><p>While we declare ourselves friendly to every sober and solid political reformation, it becomes us, as persons of ecclesiastical character, with still greater zeal to avow our desire of a reformation higher and more important.

This, therefore, is the wish where with the love of our country inspires our breasts, that the God of heaven, by his most merciful interposition, may remove from our great men that spirit of irreligion and pride, of luxury and oppression, which hath long been too manifest and prevalent among them; of which the awful counterpart and consequence is, among the lower ranks in society, a profligate and ungovernable spirit, ready for sedition and every mischief.

And we are bold to express our apprehensions that, unless reformation of this kind be vigorously attended to, it cannot justly be hoped that national prosperity shall be lasting, or that, if it should continue for a time, it shall answer any purposes that ought to be much valued by rational and immortal beings.</p></blockquote>

<blockquote><p>In the earlier years of this blog, we advocated the traditional Reformed Presbyterian (RP) doctrine of political dissent. Further study has convinced us that this view, as far as it pertains to Britain, is at odds with the original Covenanter and Westminster doctrine of civil magistracy. Thomas Boston – who was a Covenanter, but not an RP – helpfully pointed out that the early RP position actually contradicted the original intent of the National Covenant of 1638 and the Solemn League and Covenant of 1643. We realise that modern RPs have modified this position somewhat, yet Boston’s comments are still worthy of consideration:

I find, that at the first taking of the covenant, they swear to maintain the King’s authority: as also, when, with additions, it was renewed in the year 1638, they swear to stand to the defence of his majesty’s person and authority. How agrees our dissenters’ principle, rejecting the authority of the Queen, with this part of the covenant? O, say they, “she is not a covenanted Queen, and therefore cannot be Queen of a covenanted land.”

Strange prejudices! Was not Scotland a covenanted land long ere the Solemn League and Covenant was heard tell of? Was not king Charles I. King of a covenanted land at that time when the covenant was renewed, and his authority sworn to be defended? But was he a covenanted king? Did he own their covenant? No, no; upon the contrary; he obliged some of their nobles at London to abjure it, declared the covenanters rebels, and brought down an army against them to force them from it. See Apologetical Relation, page 53.

As for the Solemn League and Covenant, we find them guilty the same way. It binds us expressly against schism, as well as Prelacy, superstition, and heresy. And that they are guilty of schism has been proven before. It also bound to the maintaining of the king’s authority, it being far from the mind of the covenanters to cast off the authority of the magistrate, though it was entered into without the king’s consent. Was it ever the mind of the covenanters that they would own no king, but one that had taken this covenant? I am sure the Parliament of Scotland thought not so, when in the year 1649 they proclaimed and declared to all the world, That Charles II was king of Great Britain, etc., their sovereign lord and king; and this was a full year before he took the covenant: for which see the Apologetical Relation, pp. 64, 65.

Nor did the General Assembly 1649 think so, when in their letter to the King’s Majesty (to be found amongst the printed Acts of the Assembly, in their last session), before he was come home, or had taken the Covenant, they call him “Most gracious Sovereign,” and subscribe the letter thus, “Your Majesty’s most loyal subjects, and humble servants, the Ministers and Elders convened in this national Assembly of the Kirk of Scotland:” While, in the mean time they tell him in the same letter, “That he had settled a peace with the Irish Papists, the murderers of so many thousands of his Protestant subjects, and granted to them (contrary to the standing laws of his royal progenitors) a full liberty of their abominable idolatry; which, say they, cannot be otherwise judged, but a giving of your royal power to the Beast;” and they exhort him to lay aside the service-book.

And several other things may be there found, that may make men blush to talk of their agreeing with the Church of Scotland in her principles in these times, and yet rejecting the authority of the present Queen. And, which is most lamentable, even those worthies that laid down their lives for the covenants, whose testimonies are recorded in Naphtali, having owned the King’s authority, and prayed for him on the scaffolds, must by this new doctrine be reputed to die as fools, who understood not the covenants they were laying down their precious lives for.</p></blockquote>

I find, that at the first taking of the covenant, they swear to maintain the King’s authority: as also, when, with additions, it was renewed in the year 1638, they swear to stand to the defence of his majesty’s person and authority. How agrees our dissenters’ principle, rejecting the authority of the Queen, with this part of the covenant? O, say they, “she is not a covenanted Queen, and therefore cannot be Queen of a covenanted land.”

Strange prejudices! Was not Scotland a covenanted land long ere the Solemn League and Covenant was heard tell of? Was not king Charles I. King of a covenanted land at that time when the covenant was renewed, and his authority sworn to be defended? But was he a covenanted king? Did he own their covenant? No, no; upon the contrary; he obliged some of their nobles at London to abjure it, declared the covenanters rebels, and brought down an army against them to force them from it. See Apologetical Relation, page 53.

<blockquote><p>The attention of the nation being excited to the African slave-trade, carried on by British subjects under parliamentary sanction; it was moved in the Synod, in May 1788, that they should petition Parliament for its abolition. The Synod judged it inexpedient for them to appear as petitioners in their judicative character; but agreed in expressing their detestation of this infamous traffic, as inconsistent both with religion and with humanity; and published their judgment on this head to the world. …

In our skirts is to be found the blood of many innocents. While this generation lies under the unspeakable guilt of shedding the blood of the saints in the last period of persecution, which has never been generally confessed and lamented; how many thousands have perished in consequence of the unlawful and inhuman traffic called The Slave Trade!

For many years past, the laws against the shocking crime of child-murder have not been duly executed. The horrid practice of duelling has long been the fashionable method of avenging an affront. Though good laws exist against this species of deliberate murder, they are but too seldom put in execution. But when the righteous Judge ariseth to make inquisition for blood, shall not he visit for these things: shall not his soul be avenged on such a nation as this?</p></blockquote>

<blockquote><p>It cannot be unknown to any, except such as are ignorant of Satan’s devices, and altogether strangers to the Histories of former times, that when the Church cometh out of Idolatry, and out of bitter servitude and grievous pressures of conscience, all her storms are not over her head, but she begins to be assaulted and afflicted more then before with heresies, schisms, and home-bred disturbances.

Which through the manifold wisdom and over-ruling dispensation of God, who worketh all things according to the counsel of his will, is England’s lot this day, that this may be to those in whom the Lord hath no pleasure, a stone of stumbling, and a rock of offence, that they may go and fall backward, and be broken; &amp; snared, and taken: that others, who are approved, may be made manifest; yea, that many may be purified, and tried, and made white; and that in the issue God may have the greater glory in making a sovereign remedy out of poisonful Ingredients, and his people may say, blessed be the Lord God of Israel who only doth wondrous things.</p></blockquote>

<blockquote><p>Precious in the sight of the Lord is the death of his saints;” and he will make inquisition for the blood of his saints that has been shed like water in our streets. Sirs, much of this blood was shed in the times of persecuting tyranny, particularly in this city [Edinburgh]. That blood, I say, hath not been purged; yea, the guilt of it calls for wrath upon us their sinful posterity.

There was no due inquiry after it, when the Lord turned back our captivity after the Revolution; yea, instead of that, men who had dipt their hands in the blood of his saints were put into places and posts both civil and military; yea, I will add, that they were admitted to sit as constituent members in the supreme judicatories of this church.

We have reason to believe, that he will inquire after that blood; for he “visits the iniquity of the fathers upon the children, to the third and fourth generation.” It is crying yet from under the altar against many families in Scotland; and I fear it has a loud cry against this city, where it was shed in great abundance.</p></blockquote>

<blockquote><p>In a letter to the Londonderry Standard explaining his decision to vote in the General Election of 1868, the Revd Samuel Patton of Waterside Eastern Reformed Presbyterian Church, Londonderry, made the following points concerning the Glorious Revolution:

The Revolution Settlement was effected under William III., and against that settlement our fathers took up position uncompromising dissent. Their grand ideal of Christian Church in a Christian State seemed rudely dashed to the ground. For by this Settlement a semi-Erastian Presbytery was established in Scotland, and wholly Erastian Prelacy in England and Ireland. With all the energy most determined dissent the Covenanters [Reformed Presbyterians] recoiled from this Settlement, and withdrew, not only from the Church, but also from the State.

Yet let it be considered that, by the Revolution Settlement, a part of the contendings of the farsighted Covenanters was nobly vindicated. The absolute sovereignty of the King over the nation was swept away, and civil liberty triumphed. The Revolution Settlement gave us a Constitution. Prelacy was set up, indeed, and Royal supremacy was established, but this was done by the nation itself now acting through its Parliament. The arrangement was bad, but it was capable of being reversed. …

One word, now, as to the Solemn League and Covenant and my vote. Once again we have come face to face with the Royal Supremacy. The field of action is not a Drumclog, but the broad territory of the United Kingdom, under the peaceful sway of Queen Victoria, and amid the forms of constitutional Government. …</p></blockquote>

<blockquote><p>And the “precision” of ministers concerns first of all themselves and their families, then members of their congregation and any who hear them, then neighbouring churches with which they have dealings either individually or through synod or classis, and finally those who are outside the church …

Anyone who reverses this order, or who advocates or demands precision for others, often with great importunity, in classis or synod, and emphasizing minutiae and ritual forms, while his own life, family, or church is simply an uncultivated field, should not be called a zealot or precisionist, but a meddler, busybody, Pharisee, Diotrephes [3 Jn. 9], who is everywhere and is busy everywhere, except at home.</p></blockquote>

<blockquote><p>IN the first place, we confess that Christians are obliged both by the will of their Master, and by their own welfare and salvation, to continue united one to another, and all together to make up but one body. And as this union is their sovereign happiness, and the necessary effect of charity, without which they cannot be Christians; so the breach of it, and division is the greatest of their infelicities, and the most grievous of their crimes. And they who either procure it or foment it, shall never be able to avoid that curse, which our Saviour doth often denounce, of not inheriting the kingdom of heaven; into which place none is received without this charity, which such men want.

For as the being and perfection of a natural body consists in the union of its parts; which dissolving and falling asunder, the whole doth presently lose not its form and beauty only, but likewise its force and life: so is it in all human Societies, which are called Bodies only by similitude. Their being and their excellence depends upon the union of the members whereof they are composed.

We see Kingdoms and States flourish while the Subjects are united and knit together with the lovely bond of concord, but straight crumble to nothing when dissension separates them each from other. And among all the evils that afflict them there is none so pernicious as division, which strikes at the very foundation of their being, and poisons the original of their life and strength. So that to kindle sedition and sow faction by breaking the peace of Subjects, is questionless the highest crime that any man can commit against a State.

So then, the Church being the heavenly Kingdome and everlasting State of Christ Jesus, the most admirable of all the Societies that ever have been either seen or sanctioned in the Universe; We must needs conclude, That by proportion their crime who trouble and disturb it (so far especially as to rend away from the Body any of its parts) is the blackest of all crimes whatsoever. Thus far we all agree. Nor are any ready to speak ought further in behalf of union or against division, which we are not ready to sign and consent unto; desiring still, if possible, to outbid any for unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 2-3.</span></figcaption>

</figure><figure class="quote" id="q-12bd699815" data-kw="">
<blockquote><p>Magistrates in their place have their influence on them to preserve them from corruption: but especially Ministers are useful that way. In such Nations where there is no Gospel Ministry, People are very corrupt: if by the light of Nature and severity of Rulers, they be preserved from grosser iniquities, yet they are always very corrupt. But the Faithful Services of Gospel-Ministers is a special help to preserve from corruptions.

A Gospel-Ministry is looked upon by some Persons as an heavy charge, they groan under the burden of it; but Men have little reason to think much of the charge considering the benefit that they are to a People, as they are means to prevent the growing of corruption. Ministers had need be careful that they do fulfil their Ministry, for their work is not only of great concernment to themselves, but also to Multitudes of others, by keeping the Country from corruption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of Gospel-ministers to preserve a people from corruption. Set forth, in a sermon preached at Brookfield, October 16. 1717. Being the day wherein the church was gathered, and Mr. Thomas Cheney, was ordained Pastor</cite>, (Boston: Samuel Phillips, 1718), pp 3-4.</span></figcaption>

t online · Reformed Covenanter</a></div>

<blockquote><p>Is it not the same Christians whom you then derided, and now revile at, and condemn as Children of the devil: O miserable man! Is all your hearing and praying come to this? Dare you meet the Messengers of Christ in the face, and tell them they are Liars and deceivers?

Dare you cast out the holy worship of Christ as false worship, and seek to draw people into the contempt of it? Dare you damn those Churches and millions of Saints that Christ hath bought with his precious blood? Dare you seek to draw men to hate their Teachers whom Christ hath set over them, and to hate his people as if they were the Children of the Devil, and to hate his worship and holy ways?

Alas that ever a man in his wits should look upon such abominations as amiable, and much more that any man should be so mad as to do this under the Name and profession of a Christian! That you can imagine that the furious opposition to the whole Army of Christ, his Officers, Church and Ordinances, can yet be a work that Christ accepteth: That you should no better know Christ’s work from Satan’s, nor know that it is the Dragon whose warfare these men do manage?

I must needs profess that it is a very grievous thing in mine eyes, that after all our pains with men’s souls, and after the rejoicings which we had in their seeming conversion, and zealous lives, we should yet see so much ignorance, levity, and giddiness of professors, as that they are ready to entertain the most horrid abominations!

That the devil can no sooner bait his hook, but they greedily catch at it, and swallow it without chewing; yea, nothing seems too gross for them, but so it seems Novelty all goes down. I am afraid if they go a little further, they will believe him that shall say, The Devil is God, and to be worshipped and obeyed. Shall I freely tell you whence all this comes? Even from hellish pride of heart: You see it not (it’s like) in your self or in them, but I shall endeavour to make you see it both in your selves and them.</p></blockquote>

<blockquote><p>If Christ be the sole manager of his Father’s house, and doth all the glory of it hang upon him? then it ill becomes any crowned head to wear the jewel of supremacy in and over the church, which is the house of the living God, save he only whom God hath anointed King over his holy hill of Zion.

The Pope, or Antichrist, pretended to this supremacy; and when King Henry VIII. of England renounced the Pope’s jurisdiction, he took that jewel of the crown of Christ, and set it in his own crown, and got himself proclaimed head in all causes, not only civil, but ecclesiastic, and the oath of supremacy imposed in consequence thereof upon the subjects of England, and there it stands to this day. [1]

This supremacy, at the restoration of King Charles, was extended to Scotland, and an absolute power granted to the king, to mould the church of Christ according to his pleasure. Upon which, contrary to the oath of God, lying upon himself and the whole land, the whole covenanted work of reformation from 1638, and the obligation of our solemn covenants for reformation, were rescinded by acts of parliament, some of which are not to this day abrogated.

Our forefathers witnessed against these things, and many of them sealed their testimony with their blood. Their testimony, for Scotland’s reformation and solemn covenants, has never been fairly adopted by the church of Scotland, since the deliverance God wrought for us at the Revolution; but, on the contrary, a conspiracy has been found among the prophets of our Israel, for burying that testimony, and our solemn covenants for reformation, in utter silence and oblivion.

However, God, who takes the wise in their own craftiness, and turns the counsel of the froward headlong, has, in his overruling providence, raised up that testimony, and a judicatory upon the footing of the covenanted reformation, who are this day met together, on design to revive and renew our covenant-allegiance unto the exalted King of Zion, after the example of our worthy forefathers, and the precedents thereof which stand upon record in scripture, particularly, Deut. xxix. 10-16; Neh. ix. 38.</p></blockquote>

<blockquote><p>At the late annual meeting of the Supreme Court of the Church to which I belong, the attention of the Brethren was directed to the approaching Bi-centenary of the Westminster Assembly. A committee was, in consequence, appointed to enter into correspondence with the churches adhering to the principles of the Westminster Confession of Faith, respecting the practicability of holding a General Meeting in London to celebrate the event. I have been instructed by the Committee to address myself to you, as the representative of one of the churches embraced in the Resolution of the General Assembly.

We of the General Assembly of the Presbyterian Church in Ireland can safely testify, that the Westminster Divines have been instrumental in conferring the most substantial blessing upon our Zion. We regard their Confession and their Catechisms as Formularies of unrivalled excellence, and we know that they have been the means of imparting instruction and comfort to thousands and tens of thousands connected with our communion.

At an early period, our fathers in this country concurred with the parent Church of Scotland in adopting them as ecclesiastical Standards, and so long as their principles were faithfully maintained, our Church was adorned with the “beauty of holiness;” but when a number of our Ministers ceased to hold the doctrines which they so lucidly explain, the power of godliness visibly declined. We rejoice that of late there has been a return to the old paths of their theology—that they have formed a basis of union between the Synod of Ulster and the Secession Synod of Ireland, and that all our candidates for license, and ordination, are now required to receive them as founded upon and agreeable to Scripture.

We recognize it as a special proof of the divine approbation, that an increased respect for these venerable Symbols has been accompanied by a revival of zeal and piety; and that now, when as a united Church we are walking in the good way of their apostolic testimony, we have been signally blessed with prosperity and peace. Notwithstanding the divisions which exist, and the prevailing want of an expansive spirit of real Catholicism, it is refreshing to think that the true children of God are still longing for the union of the Church. They delight to contemplate the coming of a period when the watchmen of Zion shall see eye to eye, and lift up the voice together, and when, throughout all the earth, there shall be one Lord, and his name one.

It is not to be forgotten that the Westminster Divines prayed and laboured for this glorious consummation, and that they were convened for the express purpose of promoting a uniformity of religion throughout the three kingdoms. In their works they have traced the outlines of the Doctrine, Government, and Worship of the Church, as revealed in the word of God; and though a visible union amongst the professing disciples of the Saviour in those lands is still apparently far from being realized, we rejoice to know, that millions, in Europe, and America, are linked together in ecclesiastical fellowship by a mutual recognition of the Westminster Formularies.

We feel confident, that as these Formularies are better understood, they will be more generally appreciated, and a Bi-centenary, celebration of the meeting of the Assembly of Divines would be eminently useful were it only to promote a more earnest desire for Christian Union, and to direct increased attention to the study of the Westminster Symbols. Fondly do we cherish the hope that such a meeting if convened, would be productive of direct benefit to all the churches holding the Westminster standards, and that by preparing the way for their general incorporation, it would enable them, ere long, to exhibit, for the imitation of the rest of Christendom, the unity, energy, and beauty of Evangelical Presbyterianism.</p></blockquote>

<blockquote><p>Referring to the first gathering of the General Assembly of the Church of Scotland after the Glorious Revolution, which met in October 1690, the younger Thomas McCrie made the following observations on some of the prominent godly ministers in attendance:

The Moderator, HUGH KENNEDY, first attracts our notice. He is a venerable man, selected for the honourable place he occupies from respect to his great age and his tried attachment to the cause of Presbytery. So keen was his opposition to Prelacy, that the Jacobites had nicknamed him Bitter-Beard. His brethren, however, who knew him better, assure us that those who gave him such a name “mistook the temper of the man.” And how often do we find similar misapprehensions of public men entertained by those who know them only as opponents, or have seen them only amidst “the strife of tongues!”

Turning our eye towards the Assembly, we see many of his compatriots and fellow-sufferers around him. There is old GABRIEL SEMPILL of Jedburgh, who assisted at the renewing of the covenants at Lanark before the rising at Pentland; — a gentleman by birth, being the son of Sir Bryce and the descendant of Lord Sempill, — a bold man and a genuine chip of the old block was this same Gabriel Sempill; — the companion of the heroic John Welsh in his weary wanderings and hairbreadth escapes, and though, like him, no lover of the extreme policy of Sir Robert Hamilton and his party, yet a sufferer in the good cause, for he was captured, thrown into prison, and narrowly escaped “with the skin of his teeth;” and a powerful preacher withal, “eminently countenanced of God with success in the work of the gospel.” There he stands, hale and sound after all he has endured, and with a vigour so little impaired by age that Thomas Boston, having heard him deliver an address “from the reader’s desk,” declares, ” I was in a manner amazed, for his words went out through me, and in through me, so that I said in my heart, Happy are those that hear thy wisdom!”

And there sits WILLIAM VEITCH, whose Memoirs, lately rescued from oblivion, have made us familiar with his adventurous career; and beside him sits his friend, GILBERT ELLIOT, after wards Lord Minto, who, when an advocate, had contrived to save his life. The two friends may be conceived conversing on the perils through which they had passed; for often was his lordship wont facetiously to say to Veitch after he became minister of Dumfries, “Ah, Willie, Willie, had it no” been for me, the pyets hail been pyking your pate on the Netherbow port!” To which Veitch would reply, “Ah, Gibbie, Gibbie, had it no’ been for me, ye would have been writing papers yet for a plack the page!”

There, too, might be seen a venerable sufferer, whose name was enough to diffuse an air of sanctity over the Assembly which he graced with his presence — the grave, the godly, the apostolic THOMAS HOG of Kiltearn. There he sits — that man of God, whom the Highlanders have not even yet forgot, who would spend whole days and nights in prayer; the man whom Lauderdale committed to the Bass, and whom, on his praying to be released on the plea of delicate health, Sharp ordered to be thrust down into the subterranean cell of that prison, but where, instead of perishing, as was no doubt intended, he recovered, and used afterwards to observe, when any thing was said to the prejudice of the Archbishop, “Commend me to Sharp for a good physician!”

Gifted with that celestial light “shining inward,&#x27;” which seems to have been vouchsafed to the saints under the dark cloud of persecution, on the same principle that Milton looked for it, when deprived of sight, this singular man predicted the Revolution four years before it took place, sending the following message to the Prince of Orange in the “killing time” of 1685:— “Tell him that I have assurance of the Lord, that though the Church of Scotland is under a dark cloud now, yet it will be over in a few years, and that he shall be the instrument of her deliverance, and shall be king of these realms.” What must have been his feelings, now that he saw his prophecy realised! There he sits, not scathed but sublimed by the fires of persecution — destined yet to leave the stamp of his piety on the north, and graft the genial influences of Christianity on the hardy stock of the Highland character. The firmness and fidelity of the martyr followed him to the grave.

The Assembly having, partly from sanitary, partly from anti-popish reasons, prohibited intermural burials in churches, a hot-headed laird determined to violate the injunction, and came for that purpose with a train of armed attendants. Mr Hog placed himself at the church door, and told them, that if they entered, it should be over his dead body. His own grave he ordered to be dug at the threshold, and on his tombstone was written the inscription, “This stone shall bear witness against the parishioners of Kiltearn, if they bring ane ungodly minister in here.”

Another striking character in this assembly is HENRY ERSKINE, the pious father of the famous Ebenezer and Ralph Erskine; and, what is not less honourable to his memory, the spiritual father of Thomas Boston, who traced his conversion to a sermon delivered by this worthy man, — a conversion which has issued, it is believed, in that of thousands besides. Who that has heard can ever forget the domestic scene in the cottage at Dryburgh, when the scanty supplies were consumed at supper-time, and the children awoke crying for bread, while the good minister tried to entertain them by playing on the gittern, and to comfort their poor mother, playing and praying by turns, when some one knocks at the door, and the country man on horseback leaves the bag stored with provisions, and gets so mysteriously surly on being questioned whence it came, and goes off leaving them lost in astonishment and gratitude!

Or to change the scene, who can fail to admire the same good man, as he stood before the Privy Council with the instruments of torture attached to his hands, and when required to give bond to preach no more at conventicles, replying to Sir George Mackenzie: “My lord, I have my commission from Christ, and though I were within an hour of my death, I durst not lay it down at the feet of any mortal man!” And who does not rejoice to see such a noble character sitting again in the Assembly of his church, and peacefully ending his days at an advanced age in his manse at Chirnside!

The names we have now chronicled may be regarded as representing the more pious and devoted class — types of the men of the covenant.</p></blockquote>

%E2%80%9CCommend+me+to+Sharp+for+a+good+physician%21%E2%80%9D%0A%0AGifted+with+that+celestial+light+%E2%80%9Cshining+inward%2C%27%E2%80%9D+which+seems+to+have+been+vouchsafed+to+the+saints+under+the+dark+cloud+of+persecution%2C+on+the+same+principle+that+Milton+looked+for+it%2C+when+deprived+of+sight%2C+this+singular+man+predicted+the+Revolution+four+years+before+it+took+place%2C+sending+the+following+message+to+the+Prince+of+Orange+in+the+%E2%80%9Ckilling+time%E2%80%9D+of+1685%3A%E2%80%94+%E2%80%9CTell+him+that+I+have+assurance+of+the+Lord%2C+that+though+the+Church+of+Scotland+is+under+a+dark+cloud+now%2C+yet+it+will+be+over+in+a+few+years%2C+and+that+he+shall+be+the+instrument+of+her+deliverance%2C+and+shall+be+king+of+these+realms.%E2%80%9D+What+must+have+been+his+feelings%2C+now+that+he+saw+his+prophecy+realised%21+There+he+sits%2C+not+scathed+but+sublimed+by+the+fires+of+persecution+%E2%80%94+destined+yet+to+leave+the+stamp+of+his+piety+on+the+north%2C+and+graft+the+genial+influences+of+Christianity+on+the+hardy+stock+of+the+Highland+character.+The+firmness+and+fidelity+of+the+martyr+followed+him+to+the+grave.%0A%0AThe+Assembly+having%2C+partly+from+sanitary%2C+partly+from+anti-popish+reasons%2C+prohibited+intermural+burials+in+churches%2C+a+hot-headed+laird+determined+to+violate+the+injunction%2C+and+came+for+that+purpose+with+a+train+of+armed+attendants.+Mr+Hog+placed+himself+at+the+church+door%2C+and+told+them%2C+that+if+they+entered%2C+it+should+be+over+his+dead+body.+His+own+grave+he+ordered+to+be+dug+at+the+threshold%2C+and+on+his+tombstone+was+written+the+inscription%2C+%E2%80%9CThis+stone+shall+bear+witness+against+the+parishioners+of+Kiltearn%2C+if+they+bring+ane+ungodly+minister+in+here.%E2%80%9D%0A%0AAnother+striking+character+in+this+assembly+is+HENRY+ERSKINE%2C+the+pious+father+of+the+famous+Ebenezer+and+Ralph+Erskine%3B+and%2C+what+is+not+less+honourable+to+his+memory%2C+the+spiritual+father+of+Thomas+Boston%2C+who+traced+his+conversion+to+a+sermon+delivered+by+this+worthy+man%2C+%E2%80%94+a+conversion+which+has+issued%2C+it+is+believed%2C+in+that+of+thousands+besides.+Who+that+has+heard+can+ever+forget+the+domestic+scene+in+the+cottage+at+Dryburgh%2C+when+the+scanty+supplies+were+consumed+at+supper-time%2C+and+the+children+awoke+crying+for+bread%2C+while+the+good+minister+tried+to+entertain+them+by+playing+on+the+gittern%2C+and+to+comfort+their+poor+mother%2C+playing+and+praying+by+turns%2C+when+some+one+knocks+at+the+door%2C+and+the+country+man+on+horseback+leaves+the+bag+stored+with+provisions%2C+and+gets+so+mysteriously+surly+on+being+questioned+whence+it+came%2C+and+goes+off+leaving+them+lost+in+astonishment+and+gratitude%21%0A%0AOr+to+change+the+scene%2C+who+can+fail+to+admire+the+same+good+man%2C+as+he+stood+before+the+Privy+Council+with+the+instruments+of+torture+attached+to+his+hands%2C+and+when+required+to+give+bond+to+preach+no+more+at+conventicles%2C+replying+to+Sir+George+Mackenzie%3A+%E2%80%9CMy+lord%2C+I+have+my+commission+from+Christ%2C+and+though+I+were+within+an+hour+of+my+death%2C+I+durst+not+lay+it+down+at+the+feet+of+any+mortal+man%21%E2%80%9D+And+who+does+not+rejoice+to+see+such+a+noble+character+sitting+again+in+the+Assembly+of+his+church%2C+and+peacefully+ending+his+days+at+an+advanced+age+in+his+manse+at+Chirnside%21%0A%0AThe+names+we+have+now+chronicled+may+be+regarded+as+representing+the+more+pious+and+devoted+class+%E2%80%94+types+of+the+men+of+the+covenant.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Jr.%2C+%E2%80%9CThe+Marrow+Controversy%3A+with+Notices+of+the+State+of+Scottish+Theology+in+the+beginning+of+the+last+century%E2%80%99%2C+British+and+Foreign+Evangelical+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fedc83f228d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/edc83f228d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/10/thomas-mccrie-the-younger-on-the-characters-of-the-1690-scottish-general-assembly/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Here I might admonish them which separate themselves from our church [of England]. As Paul saith, ‘Examine whether you be in the faith,’ so examine whether you have the show of error. Hath it not the show of error to broach a religion which was never heard of before? Hath it not the show of error to retain an opinion which the author himself [Robert Browne] hath recanted, as though ye would suck up that which the dog hath vomited? Hath it not the show of error to affirm that those preachers may not be heard, which (by their own confessions) have converted them to the knowledge of God, and daily convert others? Hath it not the show of error to affirm that the Lord’s prayer may not be used for a prayer, which for anything that we or they can read, was so used from the beginning?

Hath it not the show of error to say that no man may use any set prayer, seeing there be many set prayers, and psalms, and blessings in the holy Scripture, which were used in the same form? Hath it not the show of error to affirm that we have no church, and yet to grant that our martyrs which died in popery were true members of the church? Hath it not the show of error to affirm that two or three may excommunicate all the rest without a minister, seeing the pastor is the mouth of the church?

Hath it not the show of error to affirm that the church of Christ was ever invisible before this age, and that it is such a small flock as their number is, and that it hath set foot nowhere but in England? Hath it not the show of error to hold that for good and sound religion which is altered every day, adding and detracting, as though a man should make a religion of his own invention, so fast as new conceits come into his brain: Let them think what Paul Saith unto them, ‘Be wise unto sobriety,’ Rom. xii. 3, and suspect that construction which yourselves devised; for Solomon saith, There is an error upon the right hand as well as upon the left, Prov. iv. 27; that is (as I may call it), the zealous error; and if this be not, I know none within this land.</p></blockquote>

<blockquote><p>The Church of Scotland was founded on the principle, that not only is the Bible the only rule of faith, but the only statute-book by which the Lord Jesus would have His Church on earth governed. It assumed that Christ Himself has given certain office-bearers for the administration of His Church, and that He has given to these office-bearers their Directory, their only book of Canons in the written Word.

And it farther assumed, that in the administration of the Church, civil rulers and secular magistrates ought not to interfere with the servants of Christ, but should leave it to them to rule Christ’s house — His Church on earth, according to Christ’s own laws. And it still farther assumed that in the event of the Church entering into any connexion with the State — accepting an endowment for instance — the Church was not at liberty to surrender any spiritual privilege as the price of protection, or pecuniary support. This was the theory. And at the Revolution, this theory became the statute-law of Scotland; and at the Union, it was stipulated that this should abide the statute-law of Scotland for ever.</p></blockquote>

<blockquote><p>That “the Revolution Settlement,” by which the liberties of the Church were secured, under the reign of William and Mary, was in all respects satisfactory, has never been maintained by this Church. On the contrary, various circumstances may be pointed out as hindering the Church from realizing fully the attainments that had been reached during the Second Reformation. Not only were the three kingdoms of England, Scotland, and Ireland, unprepared for prosecuting the work of “reformation and uniformity in religion” to which they had pledged themselves; but even in Scotland itself the reluctant concessions of statesmen were limited to what a people, worn out by long and heavy tribulation, were barely willing to accept as a relief; – and did not thoroughly undo the mischief of an age of misrule.

Thus, for instance, in the civil sanction then given to Presbytery, the Parliament of 1690, overlooking altogether the higher attainments of the Second Reformation, went back at once to the Act 1592, and based its legislation upon that Act alone, as being the original charter of the Presbyterian Establishment. Accordingly, it left unrepealed the infamous “Act Rescissory” of King Charles, by which all that the Church had done, and all that the State had done for her, in the interval between 1638 and the Restoration, had been stigmatized as treasonable and rebellious. Thus the Revolution Settlement failed in adequately acknowledging the Lord’s work done formerly in the land.

And it was, besides, in several matters of practical legislation, very generally considered by our fathers at the time to be defective and unsatisfactory. Some, and these not the least worthy, even went so far as to refuse all submission to it. But for the most part, our fathers, smarting from the fresh wounds of anti-Christian oppression, weary of strife, and anxious for rest and peace, either thankfully accepted, or at least acquiesced in it; in the hope of being able practically to effect under it the great ends which the Church had all along, in all her former contendings, regarded as indispensable.

For it would be in a high degree ungrateful to overlook the signal and seasonable benefits which the Revolution Settlement really did confer upon the Church, as well as upon the nation. Not only did it put an end to the cruel persecution by which the best blood of Scotland had been shed in the field, on the hill-side, and on the scaffold; not only did it reinstate in their several parishes the pastors who had been unrighteously cast out in the reign of the second Charles, and set up again the platform of the Presbyterian government; but by reviving and re-enacting the Statute of 1592, – the original charter and foundation of Presbytery, it recognised as an inalienable part of the constitution of this country the establishment of the Presbyterian Church.

It secured also effectually, as was then universally believed, the exclusive spiritual jurisdiction of the Church, and her independence in spiritual matters of all civil control. And by the arrangements which it sanctioned for the filling up of vacant charges, it abolished those rights of patronage which had been reserved in 1592, [Act 7th June 1690] and made provision for enforcing the fundamental principle of this Church, that “no pastor shall be intruded into a congregation contrary to the will of the people.” On all these grounds the Church was well entitled to rejoice in the deliverance wrought out for her in 1688 and 1690; to thank God for it, and take courage; and to cherish the warm and sanguine expectation of reaping now the fruit of her struggles and her trials, in a career of undisturbed, united and successful exertion, for the glory of her great Head, the good of the land, and the saving of many souls.</p></blockquote>

<blockquote><p>[F]alse theology will be (3) apart from Christ, that is, not teaching the words about Christ, for which reason heathenism, Judaism, and Islam fail, since they do not hold to the words about Christ. Or, it will be (4) insufficiently “according to godliness,” which is especially problematic for the schismatic theology of the Lutherans and Arminians, since they either excessively extol man and his will, his works, his perfection, and disparage God’s grace and mercy in Christ – which Arminianism does along with the Pelagians, papists, and Socinians – or they present an opportunity for despairing by setting up, in their teaching on absolute perfection and the total apostasy of the saints, perpetual doubts about salvation.

Even Lutheranism participates in this last error: along with what was just pointed out, at least regarding the total apostasy of the saints, they also give rein to carnal security either by a universal grace of God, a universal satisfaction of Christ – which they apply to all equally, for which reason, with the rest, the Lutheran faith is especially troubled – or by widening the path of salvation, which agrees little with either the justice or mercy of God. In this way, by setting mercy against justice, Lutheranism follows the Socinian path to its own ruin.</p></blockquote>

<blockquote><p>In the preface to a printed version of James Begg’s speech before the General Assembly of the Free Church of Scotland in 1868 on the subject of Irish disestablishment, he attributed Ulster’s prosperity partly to its Protestantism and warned of the evils of the British government disowning Protestantism in Ireland:

The vast importance of the subject to which it relates can scarcely be over-estimated, and although a singular amount of delusion is abroad in regard to it, it is hoped that wiser counsels may yet prevail. That any one who, having read history, has travelled over Ireland, and had an opportunity of comparing that fertile but unhappy country with other lands, can have any serious doubt as to the leading cause of its social degradation, seems incredible. Other causes, no doubt, there are, but let any one compare Belfast with Galway, Protestant Ulster with the Popish south and west of Ireland, and it seems impossible to deny that the same cause which has degraded Mexico and Spain, Austria and Italy, has visibly stamped its impress on Ireland. …

That the question of Ireland involves peculiar difficulties, especially when considered cursorily, and from a Scotch point of view, without regard to the broad issues raised, may be readily admitted. But these difficulties are not new; and what is now proposed is that the Government should, instead of reforming, not only disendow but disestablish or disown Protestantism in Ireland; in other words, virtually hand over that unhappy country to the management of the Romish priests. How such a man as Dr [Thomas] Chalmers would have acted in present circumstances cannot be doubtful; and a mere change of position cannot affect unalterable principles, founded on the Word of God.

At the present moment parties are manifestly acting in concert whose objects are totally different, and never, perhaps, was the political craft of Rome more conspicuous than in getting so many opposite classes to do her work, and that too upon pretence of seeking to destroy her influence.

The questions now raised, however, should be considered apart from individuals or parties, and we commend the following facts and considerations to the Christian people of Britain, who must think and act for themselves. They have now, to an extent greater than has probably existed since the Reformation, the power of influencing the proceedings of statesmen and of parliaments.

No such crisis as the present has occurred since the Revolution; no more important parliament than that about to assemble has been convened in modern times. And we trust the result will prove that the Protestant spirit of the country is still unbroken, and that whilst fully prepared for every measure of true reform, the Parliament of Britain will resist revolution, and maintain to the uttermost that truth and righteousness by which alone a nation can be exalted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 3, 4.</span></figcaption>

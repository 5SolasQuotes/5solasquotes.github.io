<blockquote><p>These events brought about a marked deterioration in the atmosphere. Their immediate result was to impel the government to greater efforts against the field-meetings in general and to deploy more troops to suppress them. Cameron, for his part, appears to have become increasingly embarrassed by Hamilton’s activities on his behalf, and he is said to have publicly expressed his regret for the Loudon Hill [Rutherglen, 1679] incident in particular.</p></blockquote>

<blockquote><p>On the 29th of May, 1679, the day appointed for celebrating the restoration of [king] Charles [II, in 1660], a body of them amounting to eighty armed men, under the guidance of Sir Robert Hamilton, came to Rutherglen, where they extinguished the bonfires kindled in honour of the day, and affixed a declaration to the cross condemning all the proceedings of government since the Restoration; in confirmation of which testimony they publicly burnt at the cross all the acts which had been emitted against the work of the Reformation, “as our enemies,” said they, “perfidiously and blasphemously have burnt our holy covenants through several cities of these covenanted kingdoms.”… The country, however, was not prepared for a general rising, and no due means had been taken to follow up the movement, or to meet the consequences. The government took the alarm, and Claverhouse was despatched to the west with a body of dragoons, having unlimited power to kill and destroy all whom he found in arms… On Sabbath morning, the 1st of June, 1679, intelligence was brought to a large field-meeting held that day at Loudonhill, of the approach of Claverhouse and his dragoons; upon which all who were armed resolved to leave the meeting, face the soldiers, and, if possible, relieve the prisoners. Accordingly, about forty horse and one hundred and fifty or two hundred foot, came up with Claverhouse and his party near Drumclog, in the parish of Evandale, about a mile east from Loudonhill. The particulars of the skirmish which followed are well -known… The following are the simple facts, in which all authentic accounts agree. After a short and very warm engagement, Balfour of Burley with some horse, and Colonel Cleland with some of the infantry, boldly crossed the morass which lay between the combatants, and attacked the dragoons of Claverhouse with such impetuosity that they were soon put to flight, leaving about forty killed on the field. Claverhouse’s horse was shot under him, and he himself narrowly escaped. Before commencing the engagement he had given the word, “No quarter,” and ordered those who guarded King and the other persons to shoot them, in the event of his troops being worsted; but the soldiers were soon compelled to flee for their own safety, and the prisoners escaped. The dragoons taken by the Covenanters received quarter, and were dismissed without harm, much to the displeasure of Hamilton, who insisted on their being dealt with as they intended to have dealt with the Covenanters. Panic-struck and filled with rage at his defeat, Claverhouse fled from the field of Drumclog, and never slackened rein till he reached Glasgow. Thither he was pursued by Hamilton, who made an attempt to take the city; but the inhabitants not only refused to rise, but shamefully maltreated some of his soldiers, who fell wounded in their streets. At this time Sir Robert’s troops amounted, according to his own account, to about six thousand horse and foot. They consisted, it is true, chiefly of raw undisciplined countrymen, ill supplied with arms or ammunition; but had they been properly managed, such was their courage and determination, that they might have kept the royal troops in check, and procured, if not victory, at least honourable terms. Unhappily, however, a spirit of disunion began to appear among their leaders, who, instead of combining against the common enemy, spent their time in hot disputes about points in which the most hearty and genuine friends of the Presbyterian cause differed from each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), pp. 327-28</span></figcaption>

<blockquote><p>Indeed it was the divisions and heights run into by some who joined in that rising, contrary to the inclinations of the better and greater part, with the indiscretion rashness, and ill conduct, not to say cowardice of Robert Hamilton, who took the command upon him, which ruined that design, and effectually broke all their measures, much more than any opposition which was or could he made by the king’s troops. And the terrible handle made of this rising by the bishops and violent party in the government, in severities, circuits, aud oppression of all presbyterians for many years after it was over…</p></blockquote>

<blockquote><p>Sixteen of these [field] ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), pp. 328-331</span></figcaption>

</figure><figure class="quote" id="q-8cb7567c9a" data-kw="">
<blockquote><p>Thus their divisions increased, and the necessary work which might and should have been gone into, was by their debates first delayed and then entirely marred. And enemies had it to observe and remark that ministers preached and prayed against one another. And Mr. Cargil, they say, publicly protested that they behoved to part one from another because a good many of them would not go into a day of humiliation. When this project failed, I am told, Mr. Hamilton [a lay-leader in the covenanting army] took upon him to send orders to Mr. Welsh, Mr. Hume, Mr. Rae, and others of the more moderate party, to preach against the indulgence, otherwise he and a good many of the officers would not hear them. It is said, Mr. Rae sent a very home and close answer to him, and desired the messenger to tell Mr. Hamilton and the rest, that he had been wrestling against Erastianism in the magistrate for many years; and he would never truckle to the worst kind of Erastianism in the common people [led by Hamilton, with such orders]; that he would receive no instructions from him nor any of them as to the subject and matter of his sermons; and wished he might mind what belonged to him, and not go beyond his sphere and station.</p></blockquote>

<blockquote><p>Robert Hamilton spake nothing against me; but he and his faction kept an eye still upon me, and afterwards they told me that Cameron was in Holland; and I prayed God that all his faction were with him.</p></blockquote>

</figure><figure class="quote" id="q-d28a27931b" data-kw="">
<blockquote><p>Robert Hamilton sent out for me to sup with him. When I came, there was none with him but Mr. Douglas, and Gredden came in afterward. He was extraordinary kind to me; he inquired many things at me, but the drift of all was to see if he could have gotten me brought over. He told me how unanimous they were [in the army camp] before the ministers came to them, and that they would do no good until they were removed, and that they [Hamilton’s crew] were for not owning of the king, who had deprived us of the gospel and was seeking our destruction both of soul and body. I gave him no answer at all, but heard all, and afterward returned to my men, who were lying in the close, where were Mr. [John] Welsh and the rest of the brethren for penning of the declaration. I went to him and told him all that had passed, and I desired him to put forth a declaration that would give satisfaction to the multitude; for if we meddled with the king or with the indulgence, it would hinder many [persons] to come [to the covenanter army] who would be as willing as we [to protest, supplicate and defensively fight] and were waiting till they saw it, and would make friends to become enemies; and no fear what Robert Hamilton and his party could do: that if he was clear therein as in the sight of God, I should stand by him as long as my life was in me, and so would most part of the army; and if he yielded to them, I would leave them all and go home. He told me my advice was very refreshing to them at that nick of time. With that they were resolved to do so— they desired me to come to them tomorrow and I should see what they had done [in writing up such a declaration]; and so I came, and it gave me and the army all satisfaction, except Robert Hamilton and his faction… Also we told them, they were more taken up with other men’s sins than they were with their own, and that it were our duty first to begin with ourselves. They spake likewise of putting off of officers [who were not on Hamilton’s side], and did put off him who was captain to the men who came from the east end of Stirlingshire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., pp. 462-65</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Robert Hamilton sent out for me to sup with him. When I came, there was none with him but Mr. Douglas, and Gredden came in afterward. He was extraordinary kind to me; he inquired many things at me, but the drift of all was to see if he could have gotten me brought over. He told me how unanimous they were [in the army camp] before the ministers came to them, and that they would do no good until they were removed, and that they [Hamilton’s crew] were for not owning of the king, who had deprived us of the gospel and was seeking our destruction both of soul and body. I gave him no answer at all, but heard all, and afterward returned to my men, who were lying in the close, where were Mr. [John] Welsh and the rest of the brethren for penning of the declaration. I went to him and told him all that had passed, and I desired him to put forth a declaration that would give satisfaction to the multitude; for if we meddled with the king or with the indulgence, it would hinder many [persons] to come [to the covenanter army] who would be as willing as we [to protest, supplicate and defensively fight] and were waiting till they saw it, and would make friends to become enemies; and no fear what Robert Hamilton and his party could do: that if he was clear therein as in the sight of God, I should stand by him as long as my life was in me, and so would most part of the army; and if he yielded to them, I would leave them all and go home. He told me my advice was very refreshing to them at that nick of time. With that they were resolved to do so— they desired me to come to them tomorrow and I should see what they had done [in writing up such a declaration]; and so I came, and it gave me and the army all satisfaction, except Robert Hamilton and his faction… Also we told them, they were more taken up with other men’s sins than they were with their own, and that it were our duty first to begin with ourselves. They spake likewise of putting off of officers [who were not on Hamilton’s side], and did put off him who was captain to the men who came from the east end of Stirlingshire.”

— James Ure, Memoirs of Mr. William Veitch, and George Brysson, written by Themselves, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., pp. 462-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRobert+Hamilton+sent+out+for+me+to+sup+with+him.+When+I+came%2C+there+was+none+with+him+but+Mr.+Douglas%2C+and+Gredden+came+in+afterward.+He+was+extraordinary+kind+to+me%3B+he+inquired+many+things+at+me%2C+but+the+drift+of+all+was+to+see+if+he+could+have+gotten+me+brought+over.+He+told+me+how+unanimous+they+were+%5Bin+the+army+camp%5D+before+the+ministers+came+to+them%2C+and+that+they+would+do+no+good+until+they+were+removed%2C+and+that+they+%5BHamilton%E2%80%99s+crew%5D+were+for+not+owning+of+the+king%2C+who+had+deprived+us+of+the+gospel+and+was+seeking+our+destruction+both+of+soul+and+body.+I+gave+him+no+answer+at+all%2C+but+heard+all%2C+and+afterward+returned+to+my+men%2C+who+were+lying+in+the+close%2C+where+were+Mr.+%5BJohn%5D+Welsh+and+the+rest+of+the+brethren+for+penning+of+the+declaration.+I+went+to+him+and+told+him+all+that+had+passed%2C+and+I+desired+him+to+put+forth+a+declaration+that+would+give+satisfaction+to+the+multitude%3B+for+if+we+meddled+with+the+king+or+with+the+indulgence%2C+it+would+hinder+many+%5Bpersons%5D+to+come+%5Bto+the+covenanter+army%5D+who+would+be+as+willing+as+we+%5Bto+protest%2C+supplicate+and+defensively+fight%5D+and+were+waiting+till+they+saw+it%2C+and+would+make+friends+to+become+enemies%3B+and+no+fear+what+Robert+Hamilton+and+his+party+could+do%3A+that+if+he+was+clear+therein+as+in+the+sight+of+God%2C+I+should+stand+by+him+as+long+as+my+life+was+in+me%2C+and+so+would+most+part+of+the+army%3B+and+if+he+yielded+to+them%2C+I+would+leave+them+all+and+go+home.+He+told+me+my+advice+was+very+refreshing+to+them+at+that+nick+of+time.+With+that+they+were+resolved+to+do+s </figure><figure class="quote" id="q-58630b2678" data-kw="">
<blockquote><p>Upon the Sabbath, [the 15th] when we were convened in the muir to hear sermon, they called a council of war and called the whole ministers, and told them, if they did not preach, name and sir-name, against the indulgence, they should preach none. They [the ministers] thought it very hard to be kept within guard, and to be commanded what to preach. They told them, they were to receive their commission from Jesus Christ what to preach, and not from them. When we heard of it, we came [to the council meeting] — for they never called us if we came not of ourselves. We told them that it was the height of supremacy to give instructions to ministers what to preach; we would hear no such doctrine. With this confusion this day was well spent, and when they saw us own them (the ministers) and that they could not prevail, they slipped their way; and so they went and preached, and every man went to hear him whom they liked best. At this debate there was one minister left us, and never returned again [to the camp], but was a-coming upon the Monday when we were broken; for he declared to me, when he was let out without the guard, that he thought they were set to take their lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 466</span></figcaption>

</figure><figure class="quote" id="q-183ccf445b" data-kw="">
<blockquote><p>We entreated them to stand to the declaration, to let us go on against our enemy, and to let all debates alone till a free parliament and a general assembly [was had]. They told us we were for an indulgence, and they would sheathe their swords as soon in them who owned it as they would do in many of the malignants. We wished that we had known that sooner. We said, we told them we were not for an indulgence more nor they, and we would subscribe it if they would not believe us. Robert Hamilton told us that they owned Cameron, and were of his judgment plainly. I arose and told Robert Hamilton, that I had a wife and five children, and that I had a little bit of an estate, and that I was come to hazard all and my life, to get the yoke of prelacy and supremacy removed; but for ought that I saw, they intended to tyrannize over our consciences, and lead us to a worse snare nor we were into; and for my part, I would fight till the last drop of my blood before I went one step-length with them. And I told Mr. Cargill, he rendered himself odious by his naughty principles. He was very much offended with me. When they saw we were resolved to leave them, they drew by, and when they came to us they condescended to stand to the declaration, and to let all debates alone, and to give it under their hands: so we were all glad and merry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 470</span></figcaption>

</figure><figure class="quote" id="q-7da9bbf34b" data-kw="">
<blockquote><p>The mean while the enemy came hard to the bridge-end and spoke to us and we to them. They desired us to come over and they would not harm us, and called for Mr. Hamilton to speak with him; so Mr. David Hume went over, and another gentleman with him, and spoke with the duke, and desired his Grace if he would prevent the effusion of blood. He told them, their petition should have been more humbly worded, and said, lay down our arms and come in his mercy, and we should be favourably dealt with: so he returned and told us. When Robert Hamilton heard it, he laughed at it, and said, ‘and [we shall] hang next.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 477</span></figcaption>

<blockquote><p>…Monmouth gave the order [to the government troops] to advance. His prime objective was control of the bridge separating the two sides… When their [the covenanters’] ammunition gave out, they sent for fresh supplies, but Hamilton, instead of sending them the help they requested, ordered them back to the main body of the army. Whether this was because no supplies were available, or for some other reason, has never been satisfactorily explained, and even the most sympathetic commentators have found it difficult to justify Hamilton’s action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), p. 156</span></figcaption>

</figure><figure class="quote" id="q-70327c335b" data-kw="">
<blockquote><p>…Russell, who was present, says: ‘After the skirmish, Robert Hamilton slaughtered one of the prisoners in cold blood, and seems to have regretted all his life that five more did not share the same fate. In his letter of self-vindication to the Anti-Popish, Anti-Prelatic, Anti-Erastian, Anti-Sectarian, True Presbyterian Remnant of the Church of Scotland (1684), he says: ‘as for that accusation they bring against me, of killing that poor man (as they call him) at Drumclog, I may easily guess that my accusers cannot but be some of the house of Saul, or Shimei, or some such, risen again to espouse that poor Gentleman (Saul) his quarrel against honest Samuel, by his offering to kill that poor man Agag, after the King’s given him quarter. [The obligation to kill Agag stemmed from a direct and unique command of God, Dt. 25:17-19, on par with the special command to kill all the Canaanites, which was unique to Israel in entering Canaan and typological in its severity, not something of general or common equity.] But I being called to the command that day, gave out the word, ‘that no quarter should be given,’ and returning from pursuing Claverhouse, one or two of these fellows were standing in the midst of a company of our friends, and some were debating for quarter and others against it. None could blame me to decide the controversy, and I bless God for it to this day.’ He next mentions that five more got quarter, without his knowledge, and adds, ‘which I reckoned among the first steppings aside that I feared the Lord would not honour us to do much for Him,’ and he thanks God that since ever he set his face to his work, he would neither give nor take favour from his enemies. Mr. Wilson says: ‘Some without Mr. Hamilton’s knowledge, and directly contrary to his express command, gave five of these bloody enemies quarter, and then let them go. This greatly grieved Mr. Hamilton, when he saw some of Babel’s brats spared after the Lord had delivered them into their hands, that they might have dashed them against the stones — Psalms 137:9.’ In support of these principles, he quotes certain texts of scripture, as ‘Cursed be he who doeth the work of the Lord deceitfully.’ ‘Cursed be he who keepeth back his hand from blood.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-aiton.html">William Aiton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of the Rencounter at Drumclog, and Battle at Bothwell Bridge</cite>, (Hamilton: Borthwick, 1821), pp. 57-58</span></figcaption>

</figure><figure class="quote" id="q-debfb648a2" data-kw="">
<blockquote><p>…no doubt it was this party headed by Mr. Hamilton, who, as they violently pushed forward the country people to a rising, so by their indiscretion and want of conduct, evidently ruined the west country army, and effectually hindered the fair prospect there once was, that they might have been a mean of delivering the church and nation from the burdens they were under; and the upshot of all was, divisions came in, joint measures were not taken. A great many left them when they saw whither matters were going, and far more never joined them; and such as continued together could never do any thing of consequence: and when they came to be attacked, the high-flyers withdrew first, and left the poor country men to the mercy of the king’s army.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 65</span></figcaption>

</figure><figure class="quote" id="q-60278f979b" data-kw="">
<blockquote><p>The papers on the other side blame Mr. Hamilton and his party as discouraging the men, and doing nothing but clamouring against those who were sent to the duke, and such as were for an accommodation; they allege, Mr. Hamilton, and these who were warmest, were soonest out of the field… but [the covenanters] were never able to make their horses face the cannon; and, in the wheeling, or taking up their ground, they fell foul upon some of their own men formed near them, and put them in some disorder: and those nearest them, seeing this, took it to be a flight, and the whole army fell into confusion, and fled; and one who was present there writes to me, Mr Hamilton was among the foremost, “leaving the world to debate whether he acted most like a traitor, coward, or fool.</p></blockquote>

</figure><figure class="quote" id="q-f6b816c2c5" data-kw="">
<blockquote><p>In the weeks that followed [the loss at Bothwell in 1679], the government busied themselves with taking reprisals. Despite their most strenuous efforts, however, they failed to capture any of the army leaders. Most of these eventually fled to Holland. Some, including Robert Hamilton, were to remain there until the persecution was over [in 1689]… The confrontational tactices of Robert Hamilton had ended in disaster.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 157-58</span></figcaption>

<blockquote><p>…[After Bothwell in 1679] [Donald] Cargill received an urgent invitation from [Robert] M’Ward and Brown [of Wamphray] in Holland to go over and join them… he determined at once to accept. Apparently, however, there were others included in the invitation and time was pressing, for on receiving the letter Cargill wrote at once to Robert Hamilton, who was now in hiding in Galloway, to come to Edinburgh in all haste to meet him. Hamilton duly arrived, heavily disguised for fear of capture, and Cargill put the proposition to him. Hamilton, who was in daily danger of his life so long as he remained in the country, readily assented; and some time in mid-August he and Cargill appear to have left for Holland together.</p></blockquote>

<blockquote><p>An incident which took place at this time between Hamilton and [Donald] Cargill provides another example of Cargill’s spirit of Christian chairty and his desire to avoid division. The Rotterdam Church, though generally favorable to the exiles, decided to debar [David] Hackston from the communion, presumably because of his involvement in the death of the archbishop [James Sharp, on May 3, 1679]. Cargill was due to officiate at the communion service the following day, 22 October [1679], and Hamilton, on hearing of the church’s decision, immediately went to tell Cargill of it, apparently expecting that he would refuse to take part. ‘But’, says Hamilton, ‘he, with other friends, though resolving to resent it, yet could not determine on such a sudden to withdraw from the church, this being the first step of their ever appearing against us.’ The next day, Cargill gave the communion as planned… an unfortunate disagreement which broke out in the Rotterdam congregation and which split the loyalties of the exiles into two camps. The dispute centered around Robert Fleming, an old fellow-student of Cargill’s at St. Andrews, who was now minister of the Rotterdam Church. Fleming, previously minister of Cambuslang, had been deprived of his charge because of his refusal to conform to the new ecclesiastical order in Scotland, and he was settled in Rotterdam in December, 1677. On revisiting Scotland in 1679 he was arrested and imprisoned in the Edinburgh Tolbooth. Some time after Bothwell [1679], however, he was set at liberty and in October of the same year, shortly after the other exiles arrived, he returned to his charge in Holland. Fleming, a man of judgement and moderation, could not bring himself to condemn those ministers who complied with the Indulgence, though remaining firmly opposed to it himself, and he pleaded with his congregation that such ministers should not be debarred from fellowship. Several of the newly arrived exiles, Robert Hamilton in particular, were highly critical of Fleming’s attitude and refused to countenance his ministry. [Robert] M’Ward, though equally resolute against Fleming’s position, continued to hear him and, instead of condemning him outright, tried by friendly argument to persuade him to change his views. As a result, M’Ward too was ostracized by Hamilton and by some others who sided with him. The disagreement caused M’Ward much distress and mauy well have hastened his end.¹ ¹ In a letter to the church at home [in Scotland] in late 1679 or early 1680 M’Ward wrote, ‘I was so confounded with these cause-destroying excesses… if the principle whereby they defend their practice owned, it would not only infer the dissolution of the united visible church, but also of all Christian society.’… it is clear that the reference is to Hamilton, who himself admits, in a letter dated 15 August 1682, that his fellowship with M’Ward, which had previously been close, ended with the arrival of Fleming. Says Hamilton, ‘Mr M’Ward continued extraordinarily kind until Mr Fleming came over, and then we differing in judgment he became greatly against me, to the making of me so far as possible odious in the whole provinces’…</p></blockquote>

</figure><figure class="quote" id="q-7249d18b63" data-kw="">
<blockquote><p>After the defeat at Bothwell, he avoided the consequences of his attainder and condemnation by an escape into Holland. There, in Geneva and the Palatinate, he endeavoured to excite the sympathy of foreign protestants with the sufferings of their Scottish brethren; and along with his brother-in-law, Gordon of Earlston, he acted as commissioner in behalf of the united societies, whom he greatly assisted by his influence in obtaining for them the countenance and support of the continental churches. He continued to reside principally in Holland, although the English government, apprised of his intention of returning with arms and money to the assistance of his persecuted countrymen, repeatedly urged upon the States an application for his delivery.</p></blockquote>

</figure><figure class="quote" id="q-b07c8bef17" data-kw="">
<blockquote><p>This dispute [with Hamilton] caused McWard a good deal of distress, and may well have hastened his death in May 1681. For these and other reasons Hamilton became decidedly unpopular among the Scottish exiles. Eventually realising that he was looked on generally as a ‘pest’–the term is his own–he decided, later in 1681, to leave Holland for good and move further into the Continent. His original intention was to go to Hungary, where he planned to align himself with the then persecuted supporters of the Protestant interest. He was dissuaded however from this by Herman Witsius, the great theologian of the Covenants, whom he had gone to see at Utrecht and with whom he was on friendly terms… …but rather go to the northern province of Friesland, where there was a particular work for him to do… and Witsius, when he consulted him again, nto only approved it but gave him a letter of introduction to a Friesland minister, William Brakel, of Leeuwarden… in Hamilton’s words, Brakel showed ‘unspeakable kindness’ to him, entertained him in his own house for several weeks, and gave him a most sympathetic hearing when he spoke of the plight of the persecuted church in Scotland. Brakel, indeed, was so impressed by what Hamilton told him that he wrote directly to the Societies expressing his strong support and concern at their plight and pledging himself to do all in his power to help them… Hamilton felt emboldened to broach… the possibility of having young men from the Societies trained for the ministry in Holland… Brakel and his friends offered not only to arrange for the students’ training, but to help with the costs themselves.</p></blockquote>

2%80%94+Maurice+Grant%2C+Preacher+to+the+Remnant%3A+The+Story+of+James+Renwick%2C+%28Blue+Banner+Productions%2C+2009%29%2C+p.+45&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb07c8bef17.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b07c8bef17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-covenanter-robert-hamilton-d-1701-leading-father-of-the-united-societies-later-reformed-presbyterians/#:~:text=This%20dispute%20%5Bwith%20Hamilton%5D%20caused%20McWard,to%20help%20with%20the%20costs%20themselves&amp;text=This%20dispute%20%5Bwith%20Hamilton%5D%20caused%20McWard%20a%20good&amp;text=training%2C%20but%20to%20help%20with%20the%20costs%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1a1e1e72f4" data-kw="">
<blockquote><p>[James] Renwick, he was told, would have to subscribe the Confession and Catechisms of the Dutch church, as was mandatory in all ordinations; otherwise there was no prospect of the Presbytery ordaining him. Hamilton asked to see a copy of the Confession, and found his worst fears confirmed… there were vestiges of pre-Reformation practices–ceremonial, liturgy, and the role of the civil power in the church–which were reflected all too plainly in the [Belgic] Confession. Hamilton on seeing this, urgently consulted Renwick. Together they had to accept that Renwick could not subscribe the [Belgic] Confession, since to do so would be to compromise the basic principles of the Scottish Reformation and Covenants… …he [Hamilton] went round the ministers of the Presbytery and pleaded with them that, if Renwick was to subscribe anything, ti should be the Confession and Catechisms of the Church of Scotland… they eventually assented.</p></blockquote>

</figure><figure class="quote" id="q-d37baf5e4f" data-kw="">
<blockquote><p>At length the revolution of 1688 (in which, however, the fastidious nature of his principles would not sanction his concurrence) allowed him to return from exile. His attainder was reversed, and, on his brother’s death, he succeeded to the honours of the family; but from religious scruples as to acknowledging the prince of Orange, he never applied for the succession to his brother’s estates. In 1692 he was imprisoned for 8 months on account of being the suspected author of the ‘Sanquhar Declaration, 10th Aug. 1692,’ and was at length liberated in May 1693, and allowed to spend the remainder of his days in undisturbed tranquillity. Sir Robert died unmarried on the 20th Oct. 1701, at Borrowstonness, where he had resided for some period before.</p></blockquote>

</figure><figure class="quote" id="q-9cdd80b30f" data-kw="">
<blockquote><p>No sooner was it known that the [Scottish, civil] convention of estates [at Dundee] was to meet in March, 1689 [during the Glorious Revolution], than the Covenanters of the west resolved on repairing in a body to Edinburgh, to aid in protecting the meeting from the apprehended attack of the Jacobites [those for the previous king, James II]. Their assistance was far from being unnecessary… The sudden rising of Dundee having led to measures for the defence of the country, those of the Covenanters known by the name of Cameronians, chiefly in the neighbourhood of Douglas, raised a regiment of eight hundred men, without beat of drum or expense of levy, under the command of the Earl of Angus… Such was the origin of the Cameronian regiment… Discussions ensued, of a kind similar to those which had divided the counsels of the Covenanters at Bothwell. It was keenly debated among them whether it was not a “sinful association” to enlist under the same banner with other regiments, composed of those who had been malignants and abettors of tyranny, or who had not cleared themselves from the scandal of unlawful engagements. Owing to their pertinacity in these unreasonable scruples [longtime covenanter] Colonel Cleland, on whom the command of the regiment was devolved, very nearly lost temper, and he refused to accede to their demands, as subversive of all military discipline. But the matter was finally compromised by their agreeing on a brief general declaration, drawn up by Sir Patrick Hume of Polwart, and explained by Mr. Alexander Shields… It was to the effect that they “appeared in his majesty’s service in defence of the nation, recovery and preservation of the Protestant religion, and, in particular, the work of reformation in Scotland, in opposition to Popery, Prelacy, and arbitrary power, in all its branches and steps, until the government of church and state be brought back to their lustre and integrity, established in the best and purest times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), pp. 398-99</span></figcaption>

<blockquote><p>Though Cleland’s name appears among the officers who sided with Robert Hamilton at Bothwell [1679], there is reason to think that he afterwards left that party; and though still a zealous Presbyterian and Covenanter, his principles did not hinder him from joining with the government at the Revolution [1689].</p></blockquote>

<blockquote><p>And when Robert Hamilton came from abroad [from the Netherlands] among them, they got a brow of brass, calling him [i.e. Alexander Shields, one of the last three Cameronian ministers] a liar, and upbraided him to his face, saying, although he used these arguments [to join the 1690 Church of Scotland] to draw them out of the way of the Lord, yet you dare not publish them. I well remember he said, ‘Dare I not? dare I not? I promise before you all, I both dare and will, and avow it before the world.’ [which he did] But alas they still gave us a deaf ear, and now will not be spoken to nor plead with; however it stands for our mite of testimony… But, if the Lord spare, I resolve to give the world a more surprising account of the rude treatment and unheard-of ingratitude Mr. Shields, [Thomas] Linning [another of the last three Cameronian ministers, which joined the 1690 Church of Scotland], and others received at that time, and since, at their hands… …all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William as King of Britain and his Government; the greater part [of the Cameronians] reckoned it their duty to take a legal unite way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>

<blockquote><p>Sir Robert Hamilton remained the central figure in the United Societies until his death in 1701, even though there is no record that he was ever ordained to any office. The Societies then remained without a designated leader, or any ministerial oversight, until 1706 when John Macmillan, a deposed minister from the Church of Scotland, was called as their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/justin-stodghill.html">Justin Stodghill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Alexander Shields’ Response to Sir Robert Hamilton in 1690” Scottish Reformation Society Historical Journal 7</cite>, (2017), pp. 73-103</span></figcaption>

<blockquote><p>For, to speak about this epistle to the Romans, nobody could now think, speak, or even write about it enough. For it contains that mystery and those unsearchable riches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 5.</span></figcaption>

</figure><figure class="quote" id="q-dda1599af0" data-kw="">
<blockquote><p>The unhappy Arminian schism has given occasion for the calling of this Synod, arising not so much from Arminius himself as from his followers after his death, within the churches of the Netherlands.

For Jacobus Arminius, when in the year 1603 he succeeded Dr. Franciscus Junius in the theological professorship at Leiden, secretly instilled his subtleties and opinions into certain disciples and sought to cover the disputes arising from them with smooth words. But he did not at all dare to act openly until the year 1607, when peace had been concluded with the Spaniard. Whether this came from himself, or from being puffed up by others, or whether he was bribed to disturb the state of the fatherland—as some suspect—I do not say; but he then began to accuse the doctrine of the Dutch churches concerning predestination before the States of Holland as erroneous, and to alter underhand certain other chief articles.

His followers, after his death in 1609, declared themselves somewhat more openly, spread their views, planted them among the common people, and pressed upon the other churches with such bitterness—indeed, with such frenzy—that the whole United Netherlands, which for so long had been most united both in religion and in civil government, was afterwards miserably torn by domestic discord, hatred, injustice, tumults, violence, banishments, and murders; so that it differed little from a ship cast into the sea by a tempest, and in danger of perishing by shipwreck.

Against such peril, which was now so near, the civil authorities—so far as the matter was political—at length applied a remedy with courageous foresight and manly firmness. Of this I will not now speak, for it does not belong to my present purpose.

But as for the ruin of the churches, the remedy long resolved upon, yet hindered by various delays, was finally applied: namely, a National Synod, to illuminate the controversies by lawful examination, convened by the authority of the High and Mighty Lords, the States‑General. For ecclesiastical assemblies have been the medicine used since the times of the Apostles to heal the wounds of the churches and to clarify doubtful matters of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oration of David Pareus, Professor of Sacred Theology at Heidelberg, Delegate to the National Synod of Dordrecht, Together with His Judgment Concerning the Five Remonstrant Articles, Given in Latin at Heidelberg, 1 February, Anno 1619,</cite>, trans. Petrus Jacobus Austro-Silvius (Amsterdam: Hendrick Laurentsz with the consent of the Burgomasters of the City of Amsterdam, 1619), pp 4-5. (Translation generated by Copilot.)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-be69b5645a" data-kw="">
<blockquote><p>Well spake Tertullian of this matter, Idolatry is the principal crime of Mankind, and the highest guilt of any age. God therefore so severely commanding, that we should fly from Idols and all Idolatry, though shadowed over with what fair pretences soever, that is to be counted morally impossible which cannot be done without some stain of Idolatry, &amp; grievous offending of God’s Majesty.

See here the grand and horrible hindrance, whereby the Reformed Churches are compelled, not without great grief, and horror of mind to remain out of the Communion of the Romish Church. For they so dote on their Idols, and enforce them on others to be adored, that none can come, at least abide in Communion with them, except with the same deed he will become a most manifest Idolater.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exhortation to brotherly communion betwixt the Protestant churches</cite>, (London: Richard Badger, 1641), p. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Well spake Tertullian of this matter, Idolatry is the principal crime of Mankind, and the highest guilt of any age. God therefore so severely commanding, that we should fly from Idols and all Idolatry, though shadowed over with what fair pretences soever, that is to be counted morally impossible which cannot be done without some stain of Idolatry, &amp; grievous offending of God’s Majesty.

See here the grand and horrible hindrance, whereby the Reformed Churches are compelled, not without great grief, and horror of mind to remain out of the Communion of the Romish Church. For they so dote on their Idols, and enforce them on others to be adored, that none can come, at least abide in Communion with them, except with the same deed he will become a most manifest Idolater.”

<blockquote><p>He mentions also as another qualification, that he shunned the wicked in such a manner as not on that account to forsake the congregation of God, or withdraw himself from the company of those with whom he was commanded by divine appointment to associate. Many err in this way grievously; imagining when they see the evil mingled with the good, that they will be infected with pollution, unless they immediately withdraw themselves from the whole congregation. This preciseness drove the Donatists of old, and prior to them the Cathari and the Novatians, into mischievous schisms.

In our own times, too, the Anabaptists, from a similar conceit, have separated themselves from the sacred assemblies, because they reckoned them not so free from all defilement as could have been wished. Moreover, the Donatists made themselves a laughing-stock in a certain process, by tenaciously clinging to mere words. When an assembly was held to settle dissensions, and they were invited by the president of the meeting, with a view to do honour to them, to take a seat, they replied, they would stand, because it was not lawful to “sit with the wicked.” Why then, wittily replied Augustine, did your conscience permit you to come in amongst us? for the one is written as well as the other, I will not go in to the wicked, neither will I sit with the ungodly.

David, therefore, prudently moderates his zeal, and while separating himself from the ungodly, ceases not to frequent the temple, as the divine commandment and the order prescribed in the law required. When he denominates them the assembly of the ungodly, we may unquestionably conclude, that their number was not few; nay, it is probable that they flaunted about at that time, as if they alone were exalted above the people of God, and were lords over them: yet this did not prevent David from coming as usual to the sacrifices.

Public care, indeed, is to be used that the Church be not defiled by such wickedness, and every man ought privately to endeavour, in his own place, that his remissness and forbearance do not cherish the disorders which these vices occasion. Although, however, this strictness should not be exercised with that care which is necessary, there is nothing in this to hinder any of the faithful from piously and holily remaining in the fellowship of the Church. It is to be observed, in the meantime, that what retained David, was his communion with God and with sacred things.</p></blockquote>

<blockquote><p>The very next day after my preaching from Acts 10:33, as above related, Mr. [John] Macmillan came to Eskdale, and some of my hearers went to him. This was what I got to begin with. On the morrow after I went up to S. to see J. L.’s family and others; my design was to endeavour to prevent their perverting others. When I came there, I went first into the house of one of my hearers; and there I was surprised with the news of Mr. Macmillan’s being in J. L.’s, and others with him. The old man came in to me. Is. L came into that house, but never noticed me; but I carried courteously to her, and told her I had a mind to have come and seen them. She told me, I should be welcome. When I went in, J. L. shewed not common civility. I was set down among three men, strangers, none of whom I knew. They were S. H. of H., Mr. St. and Mr. Sm. The last I took for Mr. Macmillan, having never seen the man.

Being set down, I was resolved to divert disputes, at least a while, with some discourse of practical godliness. Wherefore being asked, “What news?” I said, that news were hard to be got here, the place being so far remote from towns; that it was like Jerusalem; Psalm 125:2; which brought us at length to the discourse of communion with God; concerning which S. H. gave his opinion, that it consisted in doing the will of God, keeping his commandments. I told him, that all communion was mutual, and therefore it could not consist in that; and shewed, that actual communion with God, which we ordinarily call communion with God, consists in the Lord’s letting down the influences of his grace on the soul, and the soul’s reacting the same in the exercise of grace. O, says he, that is extraordinary; wherewith I was stunned. I told him, it was that without which neither he nor I would be saved. How will you prove that? said he. So I was put to prove it to him.

Thereafter he brought in the matter of the separation; told, that he understood I was an enemy to them, and preached against them. I acknowledged, that I judged their way was not of God; and therefore, when it fell in my way, I did preach against it. And understanding that lie meant of a note I had at Morbattle sacrament, I desired him to tell me what he heard I had said. He shifted this; and I told him, viz. that I exhorted those that had met with God at this occasion, to tell them that it was so; and that they thereupon, according to the spirit of the gospel, should say, “We will go with you, for we hear the Lord is with you.” J. L. said, if that were true, that the Lord were with you, we would join with you. Mr. St. having no will to make that the determining point, told me, that he knew not but the Lord was with the church of the Jews in time of great corruption. To which I answered, And neither did Christ himself separate from them in that time; and urged them with that, Luke 4:16. After other shifts, they were at length brought to that desperate answer, That Christ was the lawmaker, and therefore not imitable by us.

The person whom I took for Mr. Macmillan was not like to speak, and therefore I asked for Mr. Macmillan. I staid there with them an hour and a half at least; but saw not Mr. Macmillan. When I was coming away, I desired Mr. St. to tell him, that seeing I had not seen him, he would come to my house and see me; which he undertook to tell him. Above six weeks after this rencounter, and my not meeting Mr. Macmillan having made a noise in the country, I heard that John Scot in Laugshawburn had said of me, that I was a liar, and he would prove me a liar, for I had never asked for Mr. Macmillan, nor desired him to come to my house. This was at first very troublesome to me. Afterwards I found real joy in my heart, in that I was made partaker of the sufferings of Christ, while I saw a spirit of bitterness possessing some of that party. However, the truth was brought to light after, by the confession of some of that party. Mr. Macmillan was in that house in the time, in an outer chamber; and Adam Linton told me, that he was certainly informed, that he caused the lass lock the door, and give him in the key at the door head or foot, whatever was his design in it.</p></blockquote>

+had+said+of+me%2C+that+I+was+a+liar%2C+and+he+would+prove+me+a+liar%2C+for+I+had+never+asked+for+Mr.+Macmillan%2C+nor+desired+him+to+come+to+my+house.+This+was+at+first+very+troublesome+to+me.+Afterwards+I+found+real+joy+in+my+heart%2C+in+that+I+was+made+partaker+of+the+sufferings+of+Christ%2C+while+I+saw+a+spirit+of+bitterness+possessing+some+of+that+party.+However%2C+the+truth+was+brought+to+light+after%2C+by+the+confession+of+some+of+that+party.+Mr.+Macmillan+was+in+that+house+in+the+time%2C+in+an+outer+chamber%3B+and+Adam+Linton+told+me%2C+that+he+was+certainly+informed%2C+that+he+caused+the+lass+lock+the+door%2C+and+give+him+in+the+key+at+the+door+head+or+foot%2C+whatever+was+his+design+in+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Memoirs%2C+%281731%29+in+The+Whole+Works+of+the+Late+Reverend+Thomas+Boston+of+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+12%3A+199-200.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc79043b4a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c79043b4a3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/02/09/thomas-boston-on-the-separatists/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I had sometimes served heartily a volunteer in the military, to suppress the mad attempts of the enemies to the Revolution, headed and commanded by one Graham of Claverhouse, who sought to overthrow the Revolution footing, and restore the abdicate King James. I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands, in sending that great man, King William, to overthrow our enemies and redeem us from slavery. …

But alas, alas ! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, … I at last was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowledge, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire : for, though I saw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me, and are as follows.-

Their criticising upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults, and often fixing some, where there is none; yea, seldom sparing one another, even where they are one in judgment; their making the terms of their communion straiter than what God allows in his word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children nor servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government.

They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion, and to be savingly acquainted with the inward and serious part of real godliness.

They would publish a declaration, disowning the authority of the great King William, and against the validity of the present church communion; and when I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it upon which, I protested against it, for myself, and for all that would adhere unto me: for I thought and said, that since God, of his infinite goodness, had so wonderfully, graciously, and mercifully wrought such a great deliverance for us, and redressed so many of our former intolerable grievances, by sending in that great and famous instrument King William, that it was a despising of many valuable mercies, because we got not all we would and should have had; and that it was a reflecting dishonour on God, and on his worthy instrument, and was a sign of great ingratitude and unthankfulness in us, to refuse allegiance and obedience to King William and his government, he ruling under God, in the execution of the ancient law of this kingdom, for the preservation of our privileges sacred and civil; I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon any thing amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things according to the word of God.</p></blockquote>

<blockquote><p>If therefore there were in the midst of Her [Rome], only some one society of men that held affirmatively those things which we cannot believe, and others lived at liberty either to receive or reject them, In this case I confess, that it were very difficult to excuse our Separation, since the Communion with that body whence we have departed doth not oblige us precisely to any points contrary to our consciences, But who knows not that those Articles which we cannot receive, are public not private Doctrines, common to the whole Church of Rome, and not peculiar to the Pope and his party? established authentically in her General Councils, by the suffrages of the Deputies of all the Churches in the world that live in her Communion?

Articles, to the belief and observation, whereof, she obligeth all sorts of persons whatsoever, Clergy and Laity, Monks and Seculars, Men and Women, little and great? anathematizing all as Heretics, who teach or believe otherwise; and besides the thunderbolts of the Church (excommunications) making use of fire and sword and what else they can against them, where ever she hath power.

Thus it appears, that our cause is no whit like that of the Donatists, our Separation arising from public and universal Doctrines of the Church of Rome, whereas Theirs had no foundation or reason, but only a pretended act of one particular man, neither confessed nor proved. The African Church (whose communion they fled from) presented them nothing in her Creeds and Service, which was contrary to their faith; whereas Rome (whence we are departed) will constrain us to think and do several things, that directly overthrow the doctrines, which we in our souls and consciences believe.</p></blockquote>

</figure><figure class="quote" id="q-b81c5cf4e4" data-kw="">
<blockquote><p>At the Revolution, all the faithful ministers were earnest for the formal recognition of the Covenants. This however was delayed, the time not being suitable. The General Assembly, however, in its acts 1690, 1700, 1701, mention breach of covenant as a cause of fasting. (Wodrow’s Correspondence, vol. i. pp. 124, 125.) Even so late as 1726, after a debate with some brethren that were for putting in the covenants more plainly, they were agreed to be included under the more courtly phraseology of solemn engagements to God. (Wodrow, vol. iii. p. 256.) Till after the secession all the eminent evangelical ministers continued to maintain the permanent obligation of the covenants.

It was not until Moderatism had destroyed the spiritual understanding of the church, that there ceased to be men who gave warning to the nation of the sin of covenant-breaking. About 1727, that spurious spirituality which has since done so much injury, made its appearance in Mr [John] Glass and his adherents. Among other things they denied the obligation of our covenants. Various ministers of the Establishment distinguished themselves in defending what till then were the common principles of the better party in the church. One of these subscribes himself, “a well-wisher of the Covenanted Reformation;” another subscribes himself, “a lover of peace and truth,” – both published in 1727, and both maintain the warrantableness and continued obligation of national covenants.</p></blockquote>

</figure><figure class="quote" id="q-af95c11a73" data-kw="">
<blockquote><p>Look even to the Synod of Ulster. While that church was unfaithful to her Lord, and had allowed her standards to fall into disuse; error, it is admitted, crept into and devastated her borders. But fearless men arose within her to “contend for the faith,” and uplift again her ancient testimony, and now, having shaken off the incubus that prostrated her energies, she is walking forth over the land with brightening vision and buoyant tread, having favour with her Lord, and going forth to his help against the embattled hosts of the mighty.

Her past redemption from error she achieved, her present steadfastness in the truth she maintains, and all without the aid of a liturgy. How? By the blessing of God on the means she used, not the “conservative resource” of preaching merely, but the resumption of her ancient formularies, and the exercise of a discipline which the Presbyterianism of her government enabled her to wield.</p></blockquote>

</figure><figure class="quote" id="q-ba01757aac" data-kw="">
<blockquote><p>Having thus stated the form of our government, allow me now to advert to some of its advantages. The first is, that by it the spiritual independence of the church is fully secured. Our fundamental principle is, that Christ is the alone Head of the church. Here we acknowledge no pope, we bow to no earthly potentate.

When the despots of the Stuart race attempted to invade and usurp this royal prerogative of Messiah, our fathers, though most firmly attached to the sovereign, and most conscientiously and cheerfully obedient to him, in all civil matters, here took their stand; and by their struggles in the Assembly, their wanderings on the mountains, their achievements in the battle field, and their sufferings at the stake, they have handed down to us, stained with the blood of many martyrs, this noble birthright of Presbyterians — the independence of our church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-denham.html">James Denham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse III in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

</figure><figure class="quote" id="q-6caac118dd" data-kw="">
<blockquote><p>O Jehovah, who shall dwell in thy tabernacle? As nothing is more common in the world than falsely to assume the name of God, or to pretend to be his people, and as a great part of men allow themselves to do this without any apprehension of the danger it involves, David, without stopping to speak to men, addresses himself to God, which he considers the better course; and he intimates, that if men assume the title of the people of God, without being so in deed and in truth, they gain nothing by their self-delusion, for God continues always like himself, and as he is faithful himself, so will he have us to keep faith with him in return. No doubt, he adopted Abraham freely, but, at the same time, he stipulated with him that he should live a holy and an upright life, and this is the general rule of the covenant which God has, from the beginning, made with his Church.

The sum is, that hypocrites, who occupy a place in the temple of God, in vain pretend to be his people, for he acknowledges none as such but those who follow after justice and uprightness during the whole course of their life. David saw the temple crowded with a great multitude of men who all made a profession of the same religion, and presented themselves before God as to the outward ceremony; and, therefore, assuming the person of one wondering at the spectacle, he directs his discourse to God, who, in such a confusion and medley of characters, could easily distinguish his own people from strangers.

There is a threefold use of this doctrine. In the first place, If we really wish to be reckoned among the number of the children of God, the Holy Ghost teaches us, that we must show ourselves to be such by a holy and an upright life; for it is not enough to serve God by outward ceremonies, unless we also live uprightly, and without doing wrong to our neighbours.

In the second place, As we too often see the Church of God defaced by much impurity, to prevent us from stumbling at what appears so offensive, a distinction is made between those who are permanent citizens of the Church, and strangers who are mingled among them only for a time. This is undoubtedly a warning highly necessary, in order that when the temple of God happens to be tainted by many impurities, we may not contract such disgust and chagrin as will make us withdraw from it.

By impurities I understand the vices of a corrupt and polluted life. Provided religion continue pure as to doctrine and worship, we must not be so much stumbled at the faults and sins which men commit, as on that account to rend the unity of the Church. Yet the experience of all ages teaches us how dangerous a temptation it is when we behold the Church of God, which ought to be free from all polluting stains, and to shine in uncorrupted purity, cherishing in her bosom many ungodly hypocrites, or wicked persons.

From this the Catharists, Novatians, and Donatists, took occasion in former times to separate themselves from the fellowship of the godly. The Anabaptists, at the present day, renew the same schisms, because it does not seem to them that a church in which vices are tolerated can be a true church. But Christ, in Matthew 25:32, justly claims it as his own peculiar office to separate the sheep from the goats; and thereby admonishes us, that we must bear with the evils which it is not in our power to correct, until all things become ripe, and the proper season of purging the Church arrive. At the same time, the faithful are here enjoined, each in his own sphere, to use their endeavours that the Church of God may be purified from the corruptions which still exist within her.

And this is the third use which we should make of this doctrine. God’s sacred barn-floor will not be perfectly cleansed before the last day, when Christ at his coming will cast out the chaff; but he has already begun to do this by the doctrine of his gospel, which on this account he terms a fan. We must, therefore, by no means be indifferent about this matter; on the contrary, we ought rather to exert ourselves in good earnest, that all who profess themselves Christians may lead a holy and an unspotted life.

But above all, what God here declares with respect to all the unrighteous should be deeply imprinted on our memory; namely, that he prohibits them from coming to his sanctuary, and condemns their impious presumption, in irreverently thrusting themselves into the society of the godly. David makes mention of the tabernacle, because the temple was not yet built. The meaning of his discourse, to express it in a few words, is this, that those only have access to God who are his genuine servants, and who live a holy life.</p></blockquote>

From this the Catharists, Novatians, and Donatists, took occasion in former times to separate themselves from the fellowship of the godly. The Anabaptists, at the present day, renew the same schisms, because it does not seem to them that a church in which vices are tolerated can be a true church. But Christ, in Matthew 25:32, justly claims it as his own peculiar office to separate the sheep from the goats; and thereby admonishes us, that we must bear with the evils which it is not in our power to correct, until all things become ripe, and the proper season of purging the Church arrive. At the same time, the faithful are here enjoined, each in his own sphere, to use their endeavours that the Church of God may be purified from the corruptions which still exist within her.

And this is the third use which we should make of this doctrine. God’s sacred barn-floor will not be perfectly cleansed before the last day, when Christ at his coming will cast out the chaff; but he has already begun to do this by the doctrine of his gospel, which on this account he terms a fan. We must, therefore, by no means be indifferent about this matter; on the contrary, we ought rather to exert ourselves in good earnest, that all who profess themselves Christians may lead a holy and an unspotted life.

But above all, what God here declares with respect to all the unrighteous should be deeply imprinted on our memory; namely, that he prohibits them from coming to his sanctuary, and condemns their impious presumption, in irreverently thrusting themselves into the society of the godly. David makes mention of the tabernacle, because the temple was not yet built. The meaning of his discourse, to express it in a few words, is this, that those only have access to God who are his genuine servants, and who live a holy life.”

<blockquote><p>Shew a regard to him, by espousing his cause, the interest of his house and kingdom. Sirs, the cause of Christ is upon the field at this day; the covenanted standard of Scotland is displayed, in opposition to that course of defection which the whole land is gone into, and which the judicatories of the established church are carrying on, with might and main. The cry is given, “Who is on the Lord’s side?” let them “come up to the help of the Lord, to the help of the Lord against the mighty.”

Some, both ministers and Christians, profess friendship unto the cause of Christ, his covenanted doctrine, discipline, worship, and government: but they love to dwell at ease, and, like Issachar, to crouch under the burden: but I have little skill if that be the Lord’s way, and the Lord’s call, when others are jeoparding themselves “in the high places of the field,” for the cause and testimony of Jesus.

I may say to such, be who they will, as the prophet said to Israel, in a day of defection from the Lord, “How long halt ye between two opinions? If Baal be God, serve him, and if Jehovah be God,” then serve and follow him. If the judicatories of the church be fighting the cause of Christ, and building the Lord’s house, then cleave to them, and good reason: but if they be building Jericho, instead of Jerusalem; if they be pulling down the work of God, instead of building it up; if the ark of God, his covenanted cause and testimony, be carried without the camp, it is time to follow it; let “us go out therefore unto him without the camp, bearing his reproach.”

And if folk shift following Christ, his cause and sworn testimony, especially when it is espoused by a handful upon all hazards, they need to consider upon it in time, lest that sentence go against them; “Curse ye Meroz, curse ye bitterly the inhabitants thereof, because they came not to the help of the Lord, to the help of the Lord against the mighty.” Christ and his cause will carry the day without you; but take heed that he don’t resent it, ere all be done; his frowns and down-looks are heavier than the frowns of all the men on earth, or angels in heaven, or devils in hell.</p></blockquote>

</figure><figure class="quote" id="q-8509e393f4" data-kw="">
<blockquote><p>If these covenants are still binding on the country, is it not a duty of the most important nature, to bear a testimony against the ingratitude of man in breaking these vows, and for the goodness of God, in having brought the nation into such a close and honourable connection with himself.

In the case of individual saints, defection generally begins with diminished impressions of what the Lord has done for the person’s soul. And it has generally been at this point, that defection has begun in the church. When was it that Israel first turned aside to worship Baal, and Ashtaroth, and the other idol-gods of Palestine? Was it not when Joshua and “the elders that outlived Joshua” were gathered to their fathers, “and there arose another generation after them, who knew not the Lord, nor yet the works which he had done for Israel?”

And did not the defection of the Scottish Church also begin at this point? As Israel provoked God at “the sea, even the Red Sea,” did not our fathers at the Red Sea deliverance of the Revolution, provoke him, by declining, through carnal policy, to assert in a formal manner the obligation of those covenants, which they believed to be still binding on the land? Is it not matter of history, that this was the first introduction of that spirit of worldly expediency, which was afterwards developed into Moderatism? And ought not the revival of a better spirit to be consummated by a public acknowledgment of the vows of God that are lying on the land?

If the covenants be still binding on the country, then Britain must be involved in awful criminality. If this be the case, the church, which does not own the continued obligation of the covenants, cannot fully discharge her duty as the public instructress of the nation, by pointing her testimony against the national sins; nor can she, in an adequate manner, perform the duties of her high function, as an intercessor for the land.

It is a duty we owe to Christ as King of nations, to own the continued obligation of our national covenants. By these solemn deeds, Christ obtained an additional right to his headship over the British dominions. The nation then swore allegiance to Him, vowed to be His in all time coming. He had a right to be the head over all the nations by the covenant of grace, but he obtained a superadded claim to these Islands of the sea, by the national covenants of our fathers; just as in the case of an individual saint, Christ, to whom he already belongs by purchase, acquires an additional right to him by his self-dedication. And I do not see how we can possibly maintain that Christ is King of nations, unless we admit that nations continue bound to him by their oaths of allegiance.

There is, it is true, little likelihood that the scheme of our fathers will be realized in present times. But on that account the matter is by no means unimportant. If it be the truth of God, though it may not be realized in the British empire in our day, it will be realized on a wider field. And our testimony for the grand principles on which covenant obligation is maintained, may be the means of furnishing materials for the construction of nations and churches during the millennial age, when Christ shall reign as king over a covenanted world.

If the covenants be binding, then the land must be lying under an awful load of guilt, for our many and flagrant breaches of these solemn engagements. The first duty, therefore, incumbent on those who admit the continued obligation of these deeds is, to confess the sin of the land in breaking them. A second duty is to feel ourselves under a special obligation in our place and station to carry out the ends of these covenants.</p></blockquote>

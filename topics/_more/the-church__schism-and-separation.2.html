— John Brown of Haddington, A Compendious View of Natural and Revealed Religion, (1782; Fearn: Christian Focus, 2002), pp 23-24.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf%2C+therefore%2C+magistrates+command+that+which+is+prejudicial+to+the+general+welfare+of+the+society%2C+or+dishonourable+to+God%2C+the+Supreme+Governor+of+it%2C+they+ought+to+be+disobeyed.+And%2C+if+they+be+habitually+cruel+and+tyrannical%2C+they+ought+to+be+resisted+and+deposed%2C+if+circumstances+permit.%0A%0A1.+When+the+great+body+of+the+subjects+are+much+alienated+in+affection%2C+a+revolution+may+be+accomplished+without+much+hazard+or+hurt.%0A%0A2.+By+resisting+tyrannical+princes+in+proper+circumstances%2C+nations+have+often+preserved+their+lives+as+well+as+their+liberties+from+impending+ruin.%0A%0A3.+Such+resistance%2C+prudently+managed%2C+is+an+effectual+warning+to+other+magistrates+to+beware+of+abusing+and+opposing+their+subjects.%0A%0A4.+In+mixed+forms+of+government%2C+the+propriety+of+resistance+is+most+clear+as+well+as+most+easy%3A+as+when+a+parliament+resists+a+king%2C+or+a+king+resists+a+parliament%2C+in+defence+of+the+common+liberties+of+the+nation.+%E2%80%93+Nevertheless%2C+as+princes+are+exposed+to+many+and+uncommon+difficulties%2C+and+are+apt+to+be+imposed+on+by+their+confidents%3A-+and+as+their+real+designs+are+not+easily+penetrated%2C+and+often+not+to+be+pried+into+by+their+subjects%3B+%E2%80%93+and+as+resistance+ordinarily+occasions+much+bloodshed+and+misery%2C+%E2%80%93+subjects+ought+to+put+the+best+construction+upon+the+conduct+of+their+governors+that+it+can+justly+admit%2C+%E2%80%93+and+never+proceed+to+violent+measures+but+where+it+is+absolutely+necessary%2C+and+where+there+is+an+hopeful+prospect+of+success.%E2%80%9D%0A%0A%E2%80%94+John+Brown+of+Haddington%2C+A+Compendious+View+of+Natural+and+Revealed+Religion%2C+%281782%3B+Fearn%3A+Christian+Focus%2C+2002%29%2C+pp+23-24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5497843023.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5497843023.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/06/john-brown-of-haddington-on-the-overthrow-of-despotic-rulers/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5d63c12f3b" data-kw="">
<blockquote><p>My Brethren and I, that have had Occasion here to confer about you, see a Beauty in the Providence of your being in Communion with the English Church; otherwise such great Confluences from among them, had not attended your Ministry, nor consequently received the Benefit, or reaped the Advantage by it, which so many of them have done.

And tho’ infinite Wisdom has made and may yet make this an alluring Bait to draw them forth; yet as England’s Reformation at first (from Popery and its superstitious and ceremonial Services) however great and glorious, was far from being to full as that of some other Protestant Churches, particularly that of Scotland; so we would fain hope, that, when a new and general Reformation shall be set on Foot, some more at least of the Rags of that Romish Church will be dropp’d, such as (abstracting at present from the Subject of Church-Government) many useless Rites and Customs relating to Worship, that have no scriptural Foundation.

This is what some of the most pious and eminent Divines of your Communion, have wished to see reformed, knowing that many of these were retained at first, only under a View of Reforming gradually, and from some prudential Considerations; and knowing also that the continued Retaining of these Things, which the reforming Fathers designed gradually to cast off, has been more stumbling to the Friends, than ever it was gaining to the Enemies of the Reformation.</p></blockquote>

<blockquote><p>In that day five cities in the land of Egypt will speak the language of Canaan and swear by the Lord of hosts …” (Isaiah 19:18a)

</figure><figure class="quote" id="q-5eebab948f" data-kw="">
<blockquote><p>In the midst of the Ten Years Conflict between the non-intrusionist party in the Church of Scotland and the British state, Robert S. Candlish explained that the non-intrusionists were contending for the headship of Christ over his church:

The principle for which we are contending has already been explained tonight – we are contending for the prerogatives of Christ’s Crown and the prerogatives of the office-bearers of his Church. There are two things which flow from this doctrine – that rulers should be subject to Christ, and that those under them should be free. Christ alone is the King and head of his Church. All we ask is spiritual independence – that each office-bearer in Christ’s Church should be left free in his own department. We seek no clerical power as has been falsely represented. […]

That is the great point for which we are called upon to contend – that Christ is King and Head of his Church. The Church of the Lord Jesus Christ is not the creature of the state; it is the creature of God, and independent of the state. The Church was not founded by the fiat of any earthly prince, but by the same mighty power which said, “Let there be light, and there was light.” The Church arose not as did Prelacy, from the cabals of princes […] but by the word of the living God, and is independent of political origin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commercial Chronicle</cite>, 17 July 1841</span></figcaption>

e-church-under-christs-headship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6c5e800952" data-kw="">
<blockquote><p>Let all our divisions be with the enemy; among ourselves let the bond of brotherly union continue and increase. All that are for God, and the welfare of the kingdoms in the three nations, are united together by the covenant and band of God [the Solemn League and Covenant]. All ages shall call them cursed, who for imaginable advantage, private or public, shall labour to put asunder what God has conjoined. The greatest advantages cannot make up the loss which unavoidably will follow upon such a breach […] that man is greatest, who with the greatest sedulity employs himself to cast water on every beginning, on every least appearance of any division which Satan may be working in the Parliament, in the Assembly, in the city, in the army, and, above all, between these covenanted nations.</p></blockquote>

</figure><figure class="quote" id="q-eaf4794a01" data-kw="">
<blockquote><p>Although many today think that you can be Reformed while rejecting theocratic politics, the reality is that most modern “Reformed” people have accepted the Anabaptist view of church-state relations:

The doctrines respecting the total disunion of civil and religious matters, by which many are led away in present times’, were unheard of in the world till broached by the Anabaptists of Germany, a few years posterior to the Reformation; and, although I would not wish to brand any system of principles with infamy merely because of the men by whom they were advocated or the circumstances that gave them birth, I cannot help saying, that the origin of these doctrines would lead me to entertain respecting them a very great degree of suspicion, if not of absolute disgust. The sentiments of these German sectaries were of the wildest description. They undertook to carry the Reformation unspeakably farther than had been done by the Reformers. They pretended to found a new Church entirely purified from the alloy of this world — altogether spiritual and divine. On behalf of this Church, they professed to be armed against all opposition by celestial visions and the power of working miracles. Among the doctrines which they advocated were polygamy — perfect equality — the abolition of all distinctions arising from birth, rank, and wealth—and the utter uselessness among Christians of all magistracy, laws, and government.

They proceeded at length to propagate their doctrines throughout Germany by the sword, and their fanatical sect was not crushed till the blood of more than a hundred thousand of the German people had been shed. This, my friends, is the origin of the doctrines respecting the spirituality of the kingdom of Christ, and the entire disunion of the Church and State, which we hear so much extolled in present times. And I cannot help saying, that, for my own part, I would be filled with inexpressible wonder if I could believe that the bringing forth before the world of a great scriptural principle, affecting the whole character and prosperity of the Church of Christ, had been reserved by Divine Providence for a party of fanatics the most wild, enthusiastic, and ferocious that the world ever saw.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>Among “evangelical Calvinists” Henry Scougal’s book, The life of God in the soul of man, is held in high esteem – largely owing to the book’s influence upon George Whitefield. The Scottish Seceders, however, regarded it as a work that was harmful to the gospel:

Socinian and Arminian doctrine is now in such general request, that some have ventured openly to recommend these principles without being noticed by any of the judicatories of the church. Mr. William Wishart, principal of the college of Edinburgh, has recommended Dr. Scougal’s life of God in the soul of man, upon which Mr. Whitefield’s experiences are founded; a book calculated to lead off from faith in the righteousness of Christ without us, to a righteousness within us, and inward sensations, as the ground of our pardon and acceptance before God.</p></blockquote>

Socinian and Arminian doctrine is now in such general request, that some have ventured openly to recommend these principles without being noticed by any of the judicatories of the church. Mr. William Wishart, principal of the college of Edinburgh, has recommended Dr. Scougal’s life of God in the soul of man, upon which Mr. Whitefield’s experiences are founded; a book calculated to lead off from faith in the righteousness of Christ without us, to a righteousness within us, and inward sensations, as the ground of our pardon and acceptance before God.”

<blockquote><p>In 1857 the minister of Londonderry Reformed Presbyterian Church, the Revd Robert Nevin, visited the American Covenanter Synod. The letter below informs us of the reaction of the Americans to his visit and their interest in Roman Catholic mission and covenant renewal:

To the Moderator and the members of the Reformed Presbyterian Synod of Ireland.

Dear brethren,

[…] Your brother, Rev. R. Nevin, whose intention of visiting our land you mention, is present with us at our synodical meeting. It gives us great pleasure to say that we have been comforted by his appearing among us. In an address, which at our request he kindly delivered, he gave such and encouraging account of your estate – of the success of your various schemes for adorning the interests of the covenanted cause, especially your mission among the Roman Catholic population and of the fruits of your renewal of the covenants, as made our hearts glad. To us in our trials and difficulties, his words were cheering, and in fact that his kind and seasonable counsel was suited to animate us with a firmer purpose to go forward with the solemn work to which we had assigned the first two days of our meeting. […]

Samuel Sterrit, Mod

John G. Boyd, Clerk</p></blockquote>

</figure><figure class="quote" id="q-4c390f119c" data-kw="">
<blockquote><p>You have state yourselves public witnesses for Jesus Christ, who profess to adhere to, and propagate his injured truths, and to commemorate with thankfulness the remarkable mercies, which he has bestowed on our Church and Nation, and to testify against and mourn over our own and our fathers’ fearful backsliding from that Covenanted work of Reformation once attained in our land. See that you be judicious, upright, constant and faithful in your profession. I now approach death heartily satisfied, with our excellent Westminster Confession of Faith, Catechisms and Form of Church Government, and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the Doctrines and practice the duties therein contained. […] Study to see everything with your own eyes but never indulge and itch after NOVELTIES! Most of those which are now esteemed such, are nothing but OLD ERRORS which were long ago justly refuted, varnished over with some new expressions. If I mistake not the Churches are entering into a fearful cloud of apostacy and trouble! But he that endures to the end shall be saved. Be ye faithful unto death and Christ shall give you a crown of life.</p></blockquote>

</figure><figure class="quote" id="q-13f458389c" data-kw="">
<blockquote><p>The early Reformed Presbyterians and Seceders opposed evangelical latitudinarianism, the idea that important doctrines could be laid aside so that we can all stand “together for the gospel”. This mindset is similar to that of Liberalism, in that it thinks that some biblical truths are “essentials”, while others are “non-essentials”. Although it is true that some dogmas are more important than others, once something has been confessed by the church as biblical teaching it cannot be dismissed as a non-essential; if it was a non-essential God would not have put it in the Bible. Such was the extent of their opposition to such pernicious ideas, that the Anti-Burgher Seceders in Ireland declared it to be a disciplinarian offence for their people to join with latitudinarian evangelical groups:

[…] Evangelical Society of Ulster, question of discipline of such of our Communion as have connection with the same. […] Synod decided unanimously that such as join the Evangelical Society were following a divisive course &amp; that such should be tenderly dealt with, and that while all encouragement should be given to praying societies in our own congregations persons belonging to our communion should be admonished to withdraw from private religious societies not under our inspection […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/associate-synod-of-ireland.html">Associate Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts &amp; proceedings of the Associate Synod of Ireland (Anti-Burgher) 1788-1818, 29 July 1800 (P.R.O.N.I., Belfast, D/3815/D/4), pp 62-3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>11. Are there more visible Churches than one?

The term CHURCH is sometimes applied to a particular congregation; [Acts 9:31] sometimes to a particular ecclesiastical judicatory; [Matthew 18:17] to several congregations united under one judicatory; [Acts 8:1] and by reason of the folly of man, there are distinct associations of professed Christians, more or less differing from one another; [1 Cor. 3:3] and, with reference to these, it may be said there are more Churches than one.

12. Do the scripture approve of the erection of distinct churches?

The scriptures recommended, for the more convenient edification of the saints, the erection of distinct congregations, and of distinct judicatories; [Acts 20:41] but it is the sin and loss of professed Christians to establish distinctions which destroy the unity of the visible church; [James 3:16] since, according to the institution of Christ, the CHURCH IS ONE among all nations. [Ephesians 4:3-4]</p></blockquote>

<blockquote><p>Regretfully, the Original Seceders did not unite with the Reformed Presbyterians in order to strengthen the covenanting cause against the forces of latitudinarian evangelicalism, liturgical antinomianism, and Romanism. Nevertheless, Thomas Hobart’s comments concerning the need for such unity, made at the Original Secession’s renewal of the covenants in 1873, are still relevant today:

And now that latitudinarian indifference on the one hand, and Popery on the other, are so rapidly increasing, and making such determined efforts to gain the ascendancy in our land, we trust we have this day but the beginning of the drawing together of the covenanting forces, – that the Reformed Presbyterians, who have so long and so nobly testified for the same truths, shall soon become one with us in maintaining a testimony for our glorious second reformation principles, and that as united we shall be the means, in the Spirit’s hand, of beginning to roll back the tide of error, will-worship, and ungodliness that threatens to overwhelm our land.</p></blockquote>

<blockquote><p>George Whitefield is often thought of as the archetypal “evangelical Calvinist”, hence we find his picture on the spine of Banner of Truth books. Moreover, one denomination, which attempts to marry revivalism and Calvinism, even named their theological hall after him. However, it is worth keeping in mind that both the early Reformed Presbyterians and the early Seceders regarded his brand of revivalism as deeply injurious to the covenanted reformation, due to its latitudinarianism and physical manifestations. In other words, they released that evangelicalism and covenanting principles were wholly incompatible. Here is what the Associate Presbytery, when renewing the covenants in 1763, thought of Whitefield’s religious movement:

The sins and provocations of this land are further increased, by the kind of reception that many, both ministers and people, have given to Mr George Whitefield, a professed member and priest of the superstitious church of England, and by the great entertainment that has been given to Latitudinarian Tenets, as further propagated by him and others; whereby any particular form of church-government is denied to be of divine institution, and, under a pretence of catholic love, a scheme is laid for uniting parties of all denominations in church communion, in a way destructive of any testimony for the declarative glory of Immanuel, as Head and King of Zion, and for the covenanted reformation of this church and land: for which a righteous God hath justly chosen their delusions, and sent forth a spirit of delusion among them, in the present awful work upon the bodies and spirits of men. And, tho’ the Lord has been pleased, in his sovereign goodness, to preserve a remnant from being carried off by the above dangerous scheme and awful delusion; yet, while endeavouring to testify against the same before the world, we have not be suitably exercised thereanent before the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/scottish-seceders.html">Scottish Seceders</a></span><span class="wk"><span class="lbl">Work:</span> <cite>for renewing the National Covenant of Scotland, and the Solemn League and Covenant of the three kingdoms in a way and manner agreeable to our present situation and circumstances in this period</cite>, (Glasgow, 1763), pp 34-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-e7baccd699" data-kw="">
<blockquote><p>Although some think that they can claim a historical link with the Second Reformation Church of Scotland without acknowledging the covenants of the seventeenth-century, this supposition is a-historical. This is because in 1640 the General Assembly of the Scottish Kirk made it an ex-communicable offence not to adhere to the National Covenant (which, incidentally, proves that the early Covenanters believed in close communion/confessional membership):

The Assembly ordains, that such as have subscribed the Covenant and speaks against the same, if he be a Minister, shall be deprived: And if he continue so, being deprived, shall be excommunicate: And if he be any other man, shall be dealt with as perjured, and satisfy publikely [sic] for his perjury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanting-and-the-general-assembly-of-the-church-of-scotland-1640.html">Covenanting and the General Assembly of the Church of Scotland (1640)</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Act for censuring speakers against the covenant’, Session 5, 1 Aug. 1640 in A true copy of the whole printed acts of the General Assemblies of the Church of Scotland, beginning at the Assembly holden in Glasgow the 27 day of November 1638; and ending at the 27 day of November 1638; and ending at th</cite>, (n.p., 1682).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although some think that they can claim a historical link with the Second Reformation Church of Scotland without acknowledging the covenants of the seventeenth-century, this supposition is a-historical. This is because in 1640 the General Assembly of the Scottish Kirk made it an ex-communicable offence not to adhere to the National Covenant (which, incidentally, proves that the early Covenanters believed in close communion/confessional membership):

The Assembly ordains, that such as have subscribed the Covenant and speaks against the same, if he be a Minister, shall be deprived: And if he continue so, being deprived, shall be excommunicate: And if he be any other man, shall be dealt with as perjured, and satisfy publikely [sic] for his perjury.”

— Covenanting and the General Assembly of the Church of Scotland (1640), ‘Act for censuring speakers against the covenant’, Session 5, 1 Aug. 1640 in A true copy of the whole printed acts of the General Assemblies of the Church of Scotland, beginning at the Assembly holden in Glasgow the 27 day of November 1638; and ending at the 27 day of November 1638; and ending at th, (n.p., 1682).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+some+think+that+they+can+claim+a+historical+link+with+the+Second+Reformation+Church+of+Scotland+without+acknowledging+the+covenants+of+the+seventeenth-century%2C+this+supposition+is+a-historical.+This+is+because+in+1640+the+General+Assembly+of+the+Scottish+Kirk+made+it+an+ex-communicable+offence+not+to+adhere+to+the+National+Covenant+%28which%2C+incidentally%2C+proves+that+the+early+Covenanters+believed+in+close+communion%2Fconfessional+membership%29%3A%0A%0AThe+Assembly+ordains%2C+that+such+as+have+subscribed+the+Covenant+and+speaks+against+the+same%2C+if+he+be+a+Minister%2C+shall+be+deprived%3A+And+if+he+continue+so%2C+being+deprived%2C+shall+be+excommunicate%3A+And+if+he+be+any+other+man%2C+shall+be+dealt+with+as+perjured%2C+and+satisfy+publikely+%5Bsic%5D+for+his+perjury.%E2%80%9D%0A%0A%E2%80%94+Covenanting+and+the+General+Assembly+of+the+Church+of+Scotland+%281640%29%2C+%E2%80%98Act+for+censuring+speakers+against+the+covenant%E2%80%99%2C+Session+5%2C+1+Aug.+1640+in+A+true+copy+of+the+whole+printed+acts+of+the+General+Assemblies+of+the+Church+of+Scotland%2C+beginning+at+the+Assembly+holden+in+Glasgow+the+27+day+of+November+1638%3B+and+ending+at+the+27+day+of+November+1638%3B+and+ending+at+th%2C+%28n.p.%2C+1682%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7baccd699.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e7baccd699.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/10/03/2751/" rel="noope

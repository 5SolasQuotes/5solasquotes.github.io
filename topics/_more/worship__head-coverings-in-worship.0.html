<blockquote><p>We must understand that in these civil things that might be decent and fit in one country (and consequently commanded of God) which in another country is utterly undecent, and consequently forbidden. It was a great sin among the Corinthians for a woman to come into the congregation with her head uncovered, that is, without a vail to cover her whole head, 1 Cor. 11:5. In our congregations (because it is undecent) it were a sin for a woman to come so attired. In which respect, though we have oft in the New Testament mention of fasts both public and private, of sackcloth used in them, we have no mention at all.</p></blockquote>

<blockquote><p>8th Practice. In some parish-churches where the sectaries are put in, they have put down all singing of psalms… and will not suffer the parishes to enjoy any singing of psalms; and in other places, they begin to put down all prayer in the public assemblies, and to say there must be only discoursing and preaching; and in places where they cannot prevail to shut out singing of psalms, they in a contemptuous manner clap on their hats in the time of singing of psalms, and having been pulled off, put them on again; yea in prayer also many of them keep on hats.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, … (London, 1646), Catalogue, ‘Some Passages in the Prayers of the Sectaries’, pp. 56-57. See also the Third Part, New &amp; Further Discovery, ‘A Passage sent in a letter dated June 16, 1646…’, p. 96</span></figcaption>

</figure><figure class="quote" id="q-c03c3aae9e" data-kw="">
<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>

aning+of+the+apostle+to+be+in+those+words.%E2%80%9D%0A%0A%E2%80%94+Joseph+Mede%2C+Diatribae+Discourses+on+Diverse+Texts+of+Scripture%2C+%28London%2C+1642-1648%29%2C+Discourses+on+Diverse+Texts+of+Scripture%2C+Sermon+on+1+Cor.+11%3A5%2C+pp.+182-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc03c3aae9e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c03c3aae9e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=as%20that%20sex%20is%20prone%20to,apostle%20to%20be%20in%20those%20words&amp;text=as%20that%20sex%20is%20prone%20to%20follow%20the&amp;text=of%20the%20apostle%20to%20be%20in%20those%20words" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d95edf01bb" data-kw="">
<blockquote><p>Three things about the worship of God are to be considered: 1. The kinds of it… 2. The parts of it… 3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1c8ac596e8" data-kw="">
<blockquote><p>The Christian women appeared open, and in public uncovered, from a phantastical imitation of the she-priests and prophetesses of the gentiles when they showed their idols, as their Pythiae, Bacchae, or Menadae, and the like, who used when they uttered their oracles or celebrated the rites and sacrifices of their gods, to put themselves into a wild and extatical guise, having their faces discovered, their hair disheveled etc. The Corinthian women conceiting themselves, when they prayed or prophesied in the Church, to be acting the parts of the priests, or celebrating sacrifice, were so fond as to imitate them and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby dishonoured their head, that is, were unseemly accontred and dressed on their head. Master Mede on 1 Cor. 11.5, vide [see] Grotius.¹ ¹ In Tertullian’s time, those that professed virginity, took upon them to sit with their faces unveiled in the Church, taking it for a privilege of their rank to disclaim the subjection of the sex, and profess freedom. This is the occasion of his book, De velandis virginibus. Thorndike, Of the Service of God at Religious Assemblies, ch. 6 [p. 190], see more there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, … (London, 1654), on 1 Cor. 11 | v. 5</span></figcaption>

<blockquote><p>Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection (Mr. [William] Perkins on Revelation); therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, to signify their submission and reverence unto the ministry of the gospel.</p></blockquote>

<blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Notes on the Epistle of Jude</cite>, … (London, 1658), verse 9, Question &amp; Answer 4, pp. 371-2</span></figcaption>

</figure><figure class="quote" id="q-2575a7f8ab" data-kw="">
<blockquote><p>(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.</p></blockquote>

<blockquote><p>Ver. 2. And keep the ordinances ] Gr. the traditions or doctrines by word of mouth. These are, 1. Dogmatic, concerning faith and practice, 2 Thess. 2:15 ; 2 Thess. 2:1-17 . Ritual; and these again are, 1. Perpetual, as that of the manner of administering the two sacraments. 2. Temporary, as that of abstaining from certain meats, Acts 15:28-29 . And those other pertaining to the observing of external order and decency in Church assemblies. And of these the apostle here speaketh. (Sclater) … Ver. 4. Dishonoureth his head] As they accounted it then and there. In other places it is otherwise. The French preach covered. The Turks neither kneel nor uncover the head at public prayer, as holding those postures unmanly. Several countries have their several customs. Basiliades, duke of Muscovy, showed himself a tyrant in nailing an ambassador’s hat to his head, for not uncovering it before him.</p></blockquote>

<blockquote><p>…suppose the 〈◊〉 of churches in a city meet at nine of the clock for God’s 〈◊〉, and in the country parishes adjoining, where many people live at a great distance from their churches, they meet at ten or half an hour after nine, nay in the same church at one and the same time [as they have feed animals, etc. and can’t leave sooner], whilst the Word of God is read or preached, those that sit in seats may have their heads uncovered, and those that stand in allies may keep on their hats the whole sermon〈◊〉, because the crowd or throng may render it inconvenient to keep them off. Now in both these instances there is not uniformity in the same circumstances, and yet there may be order observed, and confusion may very well, notwithstanding, be avoided in all the parts of God’s worship and service.</p></blockquote>

<blockquote><p>The testimonies of Cyprian, Ambrose, Augustine, are easily answered, in a few words: They speak not of mystical rites, or significant ceremonies, but of some civil external usages gotten into worship; different in diverse places; as Socrates [the early Church, ecclesiastical historian] tells us of many, in his time, as in observation of Easter or Lent: in receiving the Lord’s Supper at evening or morning, standing or sitting, etc. Such an usage in Reformed Churches, is, that somewhere the ministers preach with heads covered, otherwhere, bare-headed, and many the like: In such things, those ancients advise to conform to the usages of the places where they come: but surely, would never have wise people to comply in things inexpediently sinful, in worship, in any place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-bagshaw.html">Edward Bagshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The XXIV Cases concerning things Indifferent in Religious Worship Considered</cite>, … (London, 1663), The Grand Case Considered, I. Touching Things Inexpedient, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

oks Online</a></div>
</figure><figure class="quote" id="q-aacdbafef7" data-kw="">
<blockquote><p>And so he proceeds to answer their next query, which concerned decent behavior of men and women in Church-assemblies… so the man, being inferior to Christ, is yet above the woman, being her head. From which they may understand that order in Church-assemblies is to be observed. …having any covering on his head, that is, having his head and face covered, he dishonors himself, and does an indecent thing against the liberty and dignity of his sex, it being a sign of shame and infamy for a man to have his head covered, but was a sign of power and dominion (in that country) to have his head, and face bare and uncovered… …He further appeals to the common custom of those countries, and demands of them whether it would not be uncomely for men to wear long and dishevelled hair, like women, to whom nature has given long hair for an ornament and a covering, and so to be a token to them of their subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-cradock.html">Samuel Cradock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Apostolical History, containing the Acts, Labors, Travels, Sermons, Discourses, Miracles, Successes &amp; Sufferings of the Holy Apostles</cite>, … (London, 1672), ch. 6, section 7, pp. 171-2 Cradock (1621?–1706) was an English presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

0answer,token%20to%20them%20of%20their%20subjection&amp;text=And%20so%20he%20proceeds%20to%20answer%20their%20next&amp;text=be%20a%20token%20to%20them%20of%20their%20subjection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>On the other side, narrow and temporary precepts and examples: 1. Are void of all these foresaid [universal and perpetual] characters; 2. They are about materials of temporary use; 3. Or they are but the ordering of such customs as were there before, and were proper to those countries; 4. And many speeches are plainly appropriated to the time and persons; 5. And many actions were manifestly occasional, without any intimation of reason or purpose of obliging others to imitation. … So the women’s veil and the custom of kissing each other as a token of love, and men’s not wearing long hair, were the customs of the country there ordered and improved by the apostles about sacred things, but not introduced into other countries that had no such custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, pp. 893-4</span></figcaption>

</figure><figure class="quote" id="q-586625ff3c" data-kw="">
<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). … 13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. … 14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). … 15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. … 16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>

</figure><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing… 3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister., pp. 40-44</span></figcaption>

<blockquote><p>1. Indifferent Things are far below the scale of divine institutions, though these institutions are but positive, and not of eternal goodness and righteousness. All the appointments of God and Christ are lifted up into that state the divine appointment designs them to; and shall, if used according to those appointments, be made efficacious to those ends for which they are appointed, according to the effectual working of that power and grace from which they received their original: So that they do make us better, they do commend us to God, if we observe the will and law of God concerning them; and we are the worse in the sinful neglect of them, according to the degree of neglect. 2. They are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands; and not of confusion; so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion; yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil. 3. Of the same account is that euschemonia, or decency of religious actions, required by God before Himself, and before the holy angels, of which the apostle discourses; ‘Every man praying with his Head uncovered, dishonoureth his head;’ every Woman praying so, ‘ought to have a covering on her head, because of the angels;’ such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Indifferent Things are far below the scale of divine institutions, though these institutions are but positive, and not of eternal goodness and righteousness. All the appointments of God and Christ are lifted up into that state the divine appointment designs them to; and shall, if used according to those appointments, be made efficacious to those ends for which they are appointed, according to the effectual working of that power and grace from which they received their original: So that they do make us better, they do commend us to God, if we observe the will and law of God concerning them; and we are the worse in the sinful neglect of them, according to the degree of neglect. 2. They are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands; and not of confusion; so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion; yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil. 3. Of the same account is that euschemonia, or decency of religious actions, required by God before Himself, and before the holy angels, of which the apostle discourses; ‘Every man praying with his Head uncovered, dishonoureth his head;’ every Woman praying so, ‘ought to have a covering on her head, because of the angels;’ such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.”

<blockquote><p>and keep the ordinances: …The word signifies anything that is doctrinally delivered, or taught men, whether it concerns faith or manners. It is thought, that in this text it doth not signify what the apostle had delivered to them with respect to faith, or their moral conversation, but with respect to matters of order, because such is the next instance which the apostle mentions, about praying or prophesying with the head covered, or uncovered; and undoubtedly any precepts of that nature from one guided by an infallible Spirit ought to be observed. The apostle doth not command them to keep any traditions, which others should to the end of the world deliver to them, he only praises them for keeping those which he had delivered.</p></blockquote>

<blockquote><p>Having his head covered; i.e. with a hat or cap, or such covering of the head as is in use in the country wherein he lives. It is not to be understood of the natural covering of the head, which is our hair; nor yet of any other covering which is necessary for the preservation of life and health; but such a covering as he might spare, and is ornamental to him according to the fashion of the country… Dishonoureth his head; …Interpreters rightly agree, that this and the following verses are to be interpreted from the customs of countries; and all that can be concluded from this verse is, that it is the duty of men employed in divine ministrations, to look to behave themselves as those who are to represent the Lord Jesus Christ, behaving themselves with a just authority and gravity that becometh his ambassadors, which decent gravity is to be judged from the common opinion and account of the country wherein they live. So as all which this text requires of Christian ministers, is authority and gravity, and what are external ludications of it. Our learned Dr. Lightfoot observes, that the Jewish priests were wont in the worship of God to veil their heads; so that Christian ministers praying or prophesying with their heads covered, Judaized, which he judges the reason of the apostle’s assertion. The heathens also, both Romans and Grecians, were wont to minister in their sacred things with their heads covered. Some think this was the reason why the Christians used the contrary gesture; but the apostle’s arguing from the man’s headship, seems to import that the reason of this assertion of the apostle was, because in Corinth the uncovered head was a sign of authority. At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances. The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent. Nothing in this is a further rule to Christians, than that it is the duty of ministers, in praying and preaching, to use postures and habits that are not naturally, nor according to the custom of the place where they live, uncomely and irreverent, and so looked upon. It is only the general observation of decency (which cannot by any be created, but arises either from nature, or custom, and prescription) which this text of the apostle makes to be the duty of all Christians; though as to the Corinthians, he particularly required the man’s ministering in sacred things with his head uncovered, either to avoid the habit or posture used by Jews and pagans; or for the showing of his dignity and superiority over the woman, (whom we shall by and by find commanded to pray or prophesy covered), or that he represented Christ who was the Head of the church. The uncovering of the head being with them as much a sign of subjection, as it is with us of superiority and pre-eminence.</p></blockquote>

<blockquote><p>‘nature’ here some understand the law of nature, according to which it would have an intrinsic evil in it, which it is plain it has not; for then neither must the Nazarites have used it (as they did), neither would it be lawful for the sake of men’s health or life. Others understand by nature the law of nations; but neither is this true, for in many nations men wear hair at the utmost length. Others understand common sense, or the light and judgment of that natural reason which since the fall is left in man; but this must be the same in all men, and we know that all men do not judge this shameful. Others therefore by nature here understand a common custom, which (as they say) makes as it were a second nature; so the term is taken, Rom. 11:24; but it cannot so signify here; for there neither is, nor ever was, such a universal custom in any place, that none in it wore long hair. Others by nature here understand natural inclination; but neither can this be the sense, for there is in some men, as well as in women, a natural propension and inclination to wear their hair at excessive lengths. Others here by nature understand the difference of the sex, as they take this word to be used, Rom. 1:26; the distinction of the sexes teaches us this: and this seems to be the most probable sense of this text. The apostle arguing, that as the male and female sex are artificially distinguished by garments, and it was the will of God they should be so, so they should also be distinguished by the wearing of their hair; and it was no less shame for a man to wear his hair like a woman, than to wear garments like a woman.</p></blockquote>

— Matthew Poole, Annotations on 1 Cor. 11, v. 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98nature%E2%80%99+here+some+understand+the+law+of+nature%2C+according+to+which+it+would+have+an+intrinsic+evil+in+it%2C+which+it+is+plain+it+has+not%3B+for+then+neither+must+the+Nazarites+have+used+it+%28as+they+did%29%2C+neither+would+it+be+lawful+for+the+sake+of+men%E2%80%99s+health+or+life.+Others+understand+by+nature+the+law+of+nations%3B+but+neither+is+this+true%2C+for+in+many+nations+men+wear+hair+at+the+utmost+length.+Others+understand+common+sense%2C+or+the+light+and+judgment+of+that+natural+reason+which+since+the+fall+is+left+in+man%3B+but+this+must+be+the+same+in+all+men%2C+and+we+know+that+all+men+do+not+judge+this+shameful.+Others+therefore+by+nature+here+understand+a+common+custom%2C+which+%28as+they+say%29+makes+as+it+were+a+second+nature%3B+so+the+term+is+taken%2C+Rom.+11%3A24%3B+but+it+cannot+so+signify+here%3B+for+there+neither+is%2C+nor+ever+was%2C+such+a+universal+custom+in+any+place%2C+that+none+in+it+wore+long+hair.+Others+by+nature+here+understand+natural+inclination%3B+but+neither+can+this+be+the+sense%2C+for+there+is+in+some+men%2C+as+well+as+in+women%2C+a+natural+propension+and+inclination+to+wear+their+hair+at+excessive+lengths.+Others+here+by+nature+understand+the+difference+of+the+sex%2C+as+they+take+this+word+to+be+used%2C+Rom.+1%3A26%3B+the+distinction+of+the+sexes+teaches+us+this%3A+and+this+seems+to+be+the+most+probable+sense+of+this+text.+The+apostle+arguing%2C+that+as+the+male+and+female+sex+are+artificially+distinguished+by+garments%2C+and+it+was+the+will+of+God+they+should+be+so%2C+so+they+should+also+be+distinguished+by+the+wearing+of+their+hair%3B+and+it+was+no+less+shame+for+a+man+to+wear+his+hair+like+a+woman%2C+than+to+wear+garments+like+a+woman.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Annotations+on+1+Cor.+11%2C+v.+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9eb32ae152.html&amp;v <blockquote><p>given her hair for a covering. There have been books written about the lawfulness or unlawfulness of men’s wearing long hair, and the due or undue lengths of men’s hair, the substance of which were too much to transcribe here. That which in these verses seems to be commended to us, as the will of God in this matter, is: 1. That men and women should so order their hair, as by it to preserve the distinction of sexes. 2. That men should not wear their hair after the manner of women, either disheveled, or curled, and tricked up about their heads, which speaks too much of an unmanly and effeminate temper, much more was what became not Christians. And if this be forbidden men, as to the use of their own hair, they stand concerned to consider whether it be lawful for them thus to wear and adorn themselves with the hair of other men and women.</p></blockquote>

<blockquote><p>We have no such custom, of women’s praying or prophesying with their heads uncovered, or men’s praying or prophesying with their heads covered; or we have no such custom of contending for these little frivolous things; neither any of the churches of God; and good Christians, in their practices, ought, in things of this nature, to have an eye and regard to the custom of their own church, and also of other Christian churches. Thus the apostle closes this discourse, and proceeds in the next verses to tax other abuses which were crept into this famous church.</p></blockquote>

</figure><figure class="quote" id="q-f486f665f6" data-kw="">
<blockquote><p>The misconduct of their women (some of whom seem to have been inspired) in the public assembly, who laid by their veils, the common token of subjection to their husbands in that part of the world… … it must be observed that it was a signification either of shame or subjection for persons to be veiled, or covered, in the eastern countries, contrary to the custom of ours, where the being bare-headed betokens subjection, and being covered superiority and dominion… Now, believe evil angels will be sure to mix in all Christian assemblies, therefore should women wear the token of their shamefacedness and subjection, which in that age and country, was a veil… He [Paul] sums up all by referring those who were contentious to the usages and customs of the churches, v. 16. Custom is in a great measure the rule of decency. And the common practice of the churches is what would have them govern themselves by. He does not silence the contentious by mere authority, but lets them know that they would appear to the world as very odd and singular in their humor if they would quarrel for a custom to which all the churches of Christ were at that time utter strangers, or against a custom in which they all concurred, and that upon the ground of natural decency. It was the common usage of the churches for women to appear in public assemblies, and join in public worship, veiled; and it was manifestly decent that they should do so. Those must be very contentious indeed who would quarrel with this, or lay it aside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11</span></figcaption>

src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=The%20misconduct%20of%20their%20women%20%28some,with%20this%2C%20or%20lay%20it%20aside&amp;text=The%20misconduct%20of%20their%20women%20%28some%20of%20whom&amp;text=would%20quarrel%20with%20this%2C%20or%20lay%20it%20aside" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-404369d6ed" data-kw="">
<blockquote><p>And truly this argument of theirs seems to me very preposterous, as if they meant to tie two extremes together without a medium. For who with reason can affirm: Because a man is not of the woman, but the woman of the man, etc. Therefore ought a woman to wear a veil or a hood on her head, by an argument fetched from the moral Law of their creation? Truly I have often heard that the whole Law of God was to be known by the discourse of reason, and was called moral… But whoever could from the dictate of reason know that a woman, because she was made of man and for man, ought therefore to wear a veil or hood on her head, especially in the Church? That she is therefore inferior to her husband, and that therefore she ought to be subject unto him, is not abhorrent from the discourse of reason; and because she is for that cause subject to her husband, reason dictates she ought to acknowledge it, but by what means or sign she should do it in the Church or elsewhere, custom seems only to have taught, especially in Christian churches, as the apostle intimates in this place. For we read not of any such custom in the Old Testament. Rebecca truly might (which they instance for an example), when she came near to Isaac, Gen. 24:65, take a veil and cover herself, as well for modesty as for reverence. But Judah thought Thamar to be an harlot because she covered herself with a veil, Gen. 38:14-15. So that from the beginning the covering of a veil was no certain sign of subjection…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/norton-knatchbull.html">Norton Knatchbull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon Some Difficult Texts in all the Books of the New Testament</cite>, (Cambridge, 1693), on 1 Cor. 11:10, pp. 196-200 Knatchbull (1602–1685) was an English politician who sat in the House of Commons at various times between 1640 and 1679.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>

<blockquote><p>we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.</p></blockquote>

<blockquote><p>…that arrangement which takes away all confusion, barbarity, obstinacy, turbulence, and dissension. There are examples of the first sort in Paul: that profane drinking bouts should not be mingled with the sacred supper of the Lord (1 Cor. 11:21-22), and that women should not go out in public with uncovered heads (1 Cor. 11:5). And we have many others in daily use, such as: that we pray with knees bent and head bare… [Calvin implicitly distinguishes that female covering in Paul’s time was a normal social propriety for appearing in public. Greek and Roman men on the other hand, went uncovered in public. In Reformation Geneva, men normally wore hats in public, but then uncovered for prayer.] But because He did not will in outward discipline and ceremonies what we ought to do (because He foresaw that this depended upon the state of the times, and He did not deem one form suitable for all ages), here we must take refuge in those general rules which He has given, that whatever the necessity if the church will require for order and decorum should be tested against these… Lastly, because He has taught nothing specifically, and because these things are not necessary to salvation, and for the upbuilding of the church ought to be variously accommodated to the customs of each nation and age, it will be fitting (as the advantage of the church will require) to change and abrogate traditional practices and to establish new ones.</p></blockquote>

</figure><figure class="quote" id="q-d6eadf723f" data-kw="">
<blockquote><p>Let us, however, bear in mind, that in this matter the error is merely in so far as decorum is violated, and the distinction of rank which God has established, is broken in upon. For we must not be so scrupulous as to look upon it as a criminal thing for a teacher to have a cap on his head, when addressing the people from the pulpit. Paul means nothing more than this — that it should appear that the man has authority, and that the woman is under subjection, and this is secured when the man uncovers his head in the view of the Church, though he should afterwards put on his cap again from fear of catching cold. In fine, the one rule to be observed here is το πρέπον — decorum If that is secured, Paul requires nothing farther.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 4</span></figcaption>

</figure><figure class="quote" id="q-8bd0c2eb1e" data-kw="">
<blockquote><p>‘Doth not even nature itself’ He [Paul] again sets forth nature as the mistress of decorum, and what was at that time in common use by universal consent and custom—even among the Greeks—he speaks of as being natural, for it was not always reckoned a disgrace for men to have long hair. Historical records bear, that in all countries in ancient times, that is, in the first ages, men wore long hair. Hence also the poets in speaking of the ancients, are accustomed to apply to them the common epithet of unshorn. It was not until a late period that barbers began to be employed at Rome—about the time of Africanus the elder. And at the time when Paul wrote these things, the practice of having the hair shorn had not yet come into use in the provinces of Gaul or Germany. Nay more, it would have been reckoned an unseemly thing for men, no less than for women, to be shorn or shaven; but as in Greece [Corinth] it was reckoned an unbecoming thing for a man to allow his hair to grow long, so that those who did were remarked as effeminate, he [Paul] reckons as nature a custom that had come to be confirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 12</span></figcaption>

<blockquote><p>6. …Some [apostolic traditions] are concerning the rites and the good order of the Church; as that touching the blood of things that were strangled, the covering of women’s heads, that men should not be covered in the time of prayer, and such like. 7. Those things, which are concerning the substance of doctrine [e.g. Lord’s Supper], are to be perpetually observed in the Church: but as for the things which appertain to outward rites, they in consideration of diverse circumstances, as of time, place and person, may be changed: yet so, as regard be always had (which must be generally observed in all indifferent things) unto that which makes most for the glory of God and the edification of the Church.</p></blockquote>

</figure><figure class="quote" id="q-09959d9512" data-kw="">
<blockquote><p>V. 3. But I] a new precept or renewed by the apostle, concerning common civility for habit [wearing of garments] namely that women in public assemblies of the church should be covered, and men should have their heads uncovered by reason that in those places and times, the covered head was sign of subjection and an uncovered head contrary wise of liberty; and command wherefore that they might keep in the church that degree amongst sexes which God had established, they were to observe such signs and marks thereof as were used by the common consent of nations. See Gen. 20:16 and 24:65… … V. 10. To have power] as who should say to go forth in public in a modest and civil manner for this necessity of women’s covering the head took place but only out of doors, and not within doors. And if they went abroad without a vail they were reputed as debauched women, like run away servants or soldiers that have not their master’s or captain’s pass…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations upon the Holy Bible</cite>, ... (1643), on 1 Cor. 11</span></figcaption>

</figure><figure class="quote" id="q-76622747c4" data-kw="">
<blockquote><p>Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction of not eating blood and of things strangled [Acts 15:20]; concerning the woman’s head being covered and the man’s being uncovered when they prophesy [1 Cor. 11:4, 5]) because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded upon any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>

</figure><figure class="quote" id="q-aaa70fed60" data-kw="">
<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (d. 1562; London, 1583), ch. 4, ‘Of Ecclesiastical Laws…’, p.42</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

r" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-31c09df0bd" data-kw="">
<blockquote><p>How can we deprive the Church of this liberty that it may not signify some thing by her actions and rites, the same being done, without placing any worship of God therein, modestly and in few things, so as the people of Christ be not burthened with ceremonies, and that better things be not letted [prevented]. But you will say [with respect to a white vestment], let them [ministers] show themselves to be angels, let them not signify it. I hear what you say. But the self same might have been answered unto Paul when he decreed unto the Corinthians that the woman should have her head covered, and the man uncovered, for he only urges a reason of the signification. For any man of the Church of Corinth might have answered: let the man show himself to be head of the woman, and let the woman in her deeds and life show herself to be subject unto the man, let them not contend to show this by signs. But the apostle saw this also to be a profitable thing, that we should not only live well, but that also we should by words and tokens be admonished of our duty. But and if hereby there be given an occasion of error unto the weak, let them be warned how they should believe these indifferent things, let them be taught by sermons that they judge not the worshipping of God to consist herein.</p></blockquote>

</figure><figure class="quote" id="q-53ba2a652c" data-kw="">

</figure><figure class="quote" id="q-00a419400e" data-kw="">
<blockquote><p>I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)</p></blockquote>

</figure><figure class="quote" id="q-6be503fe2d" data-kw="">
<blockquote><p>I have heard also one of their doctors [of the Independents] deliver it as his opinion that it was expedient for the minister in preaching to have his head covered, and the people in time of preaching [for the people] to sit uncovered: But in the holy Communion, that it was expedient the minister should celebrate that sacrament uncovered unto the people covered. I do not deny my suspicion of the spirit of these men, who are not afraid in so short a time to vent such a multitude of strange novelties.</p></blockquote>

</figure><figure class="quote" id="q-fa459e7ca9" data-kw="">
<blockquote><p>But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London, 1645) | ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122 &amp; 149</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

26+149&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa459e7ca9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/fa459e7ca9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=But%20their%20%5Bthe%20Independents%E2%80%99%5D%20main%20difference,discourse%20publicly%20enough%20to%20this%20purpose&amp;text=But%20their%20%5Bthe%20Independents%E2%80%99%5D%20main%20difference%20from%20all&amp;text=chief%20men%20discourse%20publicly%20enough%20to%20this%20purpose" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-18487bdd66" data-kw="">
<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints Happiness</cite>, … (London: M.S., 1660), pp. 15-16</span></figcaption>

<blockquote><p>Question: How is the public worship of God to be ordered and administered in the Church? Answer: All the members of the Church, being met together as one man in the sight of God are to join together in holy duties with one accord, the men with their heads uncovered, the women covered.</p></blockquote>

<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>

<blockquote><p>He prescribes not a rule necessary every where to be observed; but accommodates himself unto the custom then observed among the Corinthians. It is admirably expounded by Alting… Almost all Christians have observed the canon of the apostle. Not because the uncovering of the head is counted a token of reverence; for with a very great part of the world it is not so to this day. But as my [Herman] Witsius thinks, Videtur potius perinere ad libertatem Novi Testamenti [This seems to more pertain to the liberty of the New Testament].</p></blockquote>

</figure><figure class="quote" id="q-10e4283e38" data-kw="">
<blockquote><p>As penitent sinners of various kinds were ordered to sit in the church ”bare-heidit all the tyme of the sermons,’¹ it would appear that the members of the congregation kept their hats on during that time. This is also implied by Knox’s statement that the Earl of Huntly pulled down his bonnet over his eyes when the preacher denounced certain vices.² In 1637, George Gillespie says: ‘A man coming into one of our churches in time of public worship, if he see the hearers covered, he knows, by this customable sign, that sermon is begun.”‘³ Thomas Kirk, an Englishman, who visited Dundee in 1677, says: “We heard a sermon at the greatest church; they first sing a psalm, and then the minister begins his prayer, and as soon as he has taken his text they all put on their hats.’† By the beginning of the eighteenth century many Scottish Presbyterians uncovered their heads during sermon.° The custom survived in the Scottish Church at Rotterdam until at least the last quarter of the nineteenth century. At one time the ministers of Scotland may have kept their hats on while preaching, as French and Dutch Protestant preachers did.ª ¹ Booke of the Universall Kirk, 2:692. ² Laing’s Knox, 2:362. ³ Dispute Against the English-Popish Ceremonies, 1637, part 3, p. 86. † Kirk and Thoresby’s Tours in Scotland, p. 19. — In England, during part of the seventeenth century, it was customary for the people to sit in church with their hats on, and to take them off when they sang the Psalms (Brand’s Popular Antiquities, Bohn’s ed., 2:323). Some lifted them at the name of Jesus [according to the Anglican custom] (Marsden’s Early Puritans, 1853, p. 347). ° An Examination of Three Prelatical Pamphlets, 1703, p. 18. ª “He [i.e. Alix] was bold and brisk in the pulpit, and when he read his text, he cocked his hatt; but Claud, when he put on his hat, slipped it on, and drew down the sides of it” (Wodrow’s Analecta, 2:273). ‘The ministers’ of the Church of Holland ‘are covered in the time of sermon’ (Lieut. -Col. Erskine to Wodrow in 1728, Edinburgh Christian Instructor, xxvii, 265). This custom was approved by at least one eminent English [Independent] Puritan. “Mr. [Philip] Nye told us his private judgement, that in preaching he thinks the minister should be covered, and the people discovered; but in the sacrament, the minister should be discovered, as a servant, and the guests all covered.” (Laing’s Baillie’s Letters, 2:149).</p></blockquote>

<blockquote><p>We may… try to conceive the landscape, and the parish features generally, as the new incumbent [John Macmillan of Balmaghie] saw them in 1701… The dress of the people was on a par with their homes and fare. A Galloway man wore constantly, even in church, his broad blue bonnet, made in Kilmarnock… Young girls at home wore no head-covering, but snooded their locks with a piece of string or ribbon. At fair or church, they wore white linen mutches [linen caps], slightly plaited above the brow. The farmers’ wives covered their heads with coarse white linen toys [linen or wool headdresses that hang down over the shoulders] when they went a-visiting.¹ ¹ For all the above, I have drawn on Nicholson’s History, II. 332-339.</p></blockquote>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.”

— David Calderwood, A Re-examination of the Five Articles enacted at Perth, anno 1618, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BMargin+Note%3A%5D+The+uncovering+of+the+head+not+like+kneeling+We+uncover+our+heads%2C+say+they%2C+when+we+receive+the+elements%2C+why+may+we+not+also+kneel%3F+I+answer%3A+First%2C+the+uncovering+of+the+head+is+a+gesture+of+reverence+only%2C+and+that+only+among+some+nations%2C+but+not+of+adoration.+The+Jews%2C+Turks+and+Mahometans+pray+with+their+heads+covered.+The+Grecians+and+Romans+of+old%2C+howbeit+they+walked+in+public+with+uncovered+heads%2C+except+in+rain%2C+great+heat+or+mourning%2C+yet+in+the+service+of+their+gods%2C+they+had+their+heads+covered.+The+Europeans+this+day+uncover+their+heads+when+they+are+praying.+Kneeling+is+a+gesture+of+adoration+among+all+nations%2C+either+in+civil+or+religious+use.+Augustine+says%3A+%E2%80%98Honorat+emnis+qui+adorat%2C+no+autem+adorat+omnes+quid+onorat%3B%E2%80%99+%E2%80%98Every+one+that+does+adore%2C+does+honor%2C+but+not+every+one+that+honors%2C+adores.%E2%80%99+Contra+Serm.+Arian.%2C+ch.+23+I+will+not+kneel+to+every+one+to+whom+I+uncover+my+head+civilly.+Everyone+that+stands+with+his+head+uncovered+in+presence+of+the+king+is+not+adoring%2C+as+he+is+who+is+presenting+his+petition+to+the+king+upon+his+knee+in+their+sight.+A+provincial+synod+holden+at+London+%28anno+1603%29+ordained+the+head+to+be+uncovered+when+their+service+is+read+in+the+Church%2C+yet+I+think+they+would+not+have+enjoined+kneeling.+We+%5Bthe+Scots%5D+hear+the+canonical+scripture+read+%5Bin+the+administration+of+the+Lord%E2%80%99s+Supper%5D+with+uncovered+heads%2C+but+yet+we+kneel+not.+The+words+of+Christ%2C+which+He+uttered+at+the+institution+are+still+and+often+uttered%3B+that+same+voice+sounds+through+all+the+tables+of+the+world%3B+his+actions%2C+which+were+divine+and+holy%2C+are+reiterat%5Bed%5D.+In+Gratian%E2%80%99s+decree+%28De+consecrat.+dist.+1%2C+ch.+68%29+we+have+a+superstitious+direction+of+Pope+Anastasius%2C+that+when+the+Gospel+is+read+in+the+Church%2C+those+that+are+present+shall+not+sit%2C+but+stand%2C+venerabiliter+curvi%2C+bowing+reverently%2C+hearken+and+adore.+Wherefore+more+at+the+hearing+of+the+Gospel+than+the+%5Breading+of+the%5D+Epistle%5Bs%5D%2C+which+is+also+Evangelical%3F+Yet+you+see%2C+howbeit+that+standing+with+bowing+be+more+than+to+have+the+head+uncovered%2C+it+was+but+veneration.+And%2C+whereas+he+says%2C+Et+fideliter+adorent%2C+the+gloss+has%2C+id+est+venerentur%2C+because+the+word+%E2%80%98adoring%E2%80%99+is+taken+there+in+a+large+sense%2C+as+ye+may+see+%5Bin%5D+sundry+places+above+cited%2C+not+for+that+which+is+in+a+strict+sense+called+adoration.+Adoration+in+strict+sense+is+kneeling+or+prostration.+Whereas+Matthew+says%2C+ch.+8%2C+of+the+leprous+man%2C+that+he+worshipped+Christ%2C+or+adored+Christ%2C+as+the+Latin+translation+has+according+to+the+original%2C+Mk.+1%3A40%2C+He+kneeled+down+to+Him%2C+and+Luke+5%3A12%2C+that+he+fell+in+his+face.+Suchlike%2C+where+it+is+said+of+the+Cananitish+woman%2C+Mt.+15%3A25%2C+that+she+worshipped%2C+or+adored+Him%3A+et+adoravit+eum%2C+Mk.+7%3A25%2C+it+is+said+that+she+fell+at+his+feet.+The+Greek+word+%5BGreek%5D%2C+signifies+to+fall+down+like+a+dog+o%E2%80%A2%E2%80%A2whelp+at+the+feet+of+another%2C+as+our+Lord.+Further%2C+our+heads+are+not+other+way+uncovered+in+the+act+of+receiving+than+in+the+rest+of+the+time+of+the+celebration+when+we+are+not+near+the+elements.+And+thirdly%2C+the+uncovering+of+our+head+is+compatible+with+the+variety+of+actions+in+time+of+celebration%3A+praying%2C+singing%2C+the+words+of+the+institution%2C+and+chapters+read%2C+but+adoration+directed%2C+as+they+pretend+to+God%2C+cannot+be+without+presenting+our+petitions+and+thanks+to+God%2C+which+requires+a+several+part+of+the+action+by+itself.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Re-examination+of+the+Five+Articles+enacted+at+Perth%2C+anno+1618%2C+%E2%80%A6+%281636%29%2C+Of+the+Communicants%E2%80%99+gesture+in+the+act+of+receiving%2C+eating+and+drinking%E2%80%99%2C+4th+Part%2C+ch.+5%2C+%E2%80%98Kneeling+in+the+act+of+receiving+the+sacramental+elements+of+the+supper+is+idolatry%E2%80%99%2C+pp.+104-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd014bbafa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/dd014bbafa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=Margin%20Note%3A%5D%20The%20uncovering%20of%20the,part%20of%20the%20action%20by%20itself&amp;text=Margin%20Note%3A%5D%20The%20uncovering%20of%20the%20head%20not&amp;text=a%20several%20part%20of%20the%20action%20by%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>

<blockquote><p>How few be they in our times, who by observing this distance do declare that they believe the Church to be God’s house, how many that come in without preparing themselves at first by devotion and prayer? How many who clap on their hats when God is speaking to them by his Word, I mean in the time when the very text is reading? Nay the servant who will be uncovered before this master in his own house, will many times be covered before him in God’s house; all which bewrays that many men do either take the Church not to be ‘my house’ [Mt. 21:13], that is, God’s; or (which is worse) God’s house not to be so good as their own.</p></blockquote>

</figure><figure class="quote" id="q-6b695031cf" data-kw="">
<blockquote><p>First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.</p></blockquote>

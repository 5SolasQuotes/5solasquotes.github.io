<div class="actions"><button class="copy" data-copy="“First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.”

— John Weemes, A Treatise of the Four Degenerate Sons, … wherein are handled many… sundry places of Scripture, cleared out of the original tongues. Being the fourth volume, of the Works… (London, 1636), On the 3rd Degenenerate Son, the Idolater, section 6, pp. 264-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+their+head+%5Bof+the+idolaters+in+Ahab%E2%80%99s+time%5D%3B+they+prayed+before+their+idols+with+their+heads+covered%2C+because+the+people+of+the+East+worshipped+their+great+men+with+their+heads+covered%3B+therefore+they+prayed+after+the+same+manner%2C+and+honored+their+idols+standing+before+them+with+their+heads+covered.+Maimonides+says+that+religious+outward+worship+should+be+given+after+the+same+manner+as+they+worshipped+great+men%2C+and+he+adds%2C+nisi+forte+sit+mos+illius+loci%2C+ut+quis+stet+coram+magnatibus+aperto+capite%2C+that+is%2C+%E2%80%98unless+it+be+the+manner+of+men+in+that+place+to+stand+bare-headed%2C+when+they+do+reverence+to+great+men%E2%80%99%3B+where+we+see+that+the+gesture+and+the+manner+of+praying+is+to+be+accommodated+to+the+custom+of+the+place+where+one+lives%2C+and+they+should+testifie+their+outward+reverence+by+such+signs+as+men+testify+their+reverence+to+great+men.+This+manner+of+worship+varies+in+sundry+parts.+Maimonides+wrote+his+Mishna+in+Egypt%2C+and+amongst+the+Mahometans+who+uncover+not+their+heads+before+great+men%2C+but+bow+only+their+head+before+them%3B+and+therefore+when+they+pray+they+uncover+not+their+head%3A+So+the+Jews+both+the+priests+and+people+uncover+not+the+head+in+time+of+divine+service.+The+priests+had+such+bonnets+upon+their+heads+which+could+not+easily+be+taken+off+and+put+on+as+ours%2C+and+when+they+came+abroad+they+never+uncovered+their+heads%3B+but+when+they+made+great+lamentation+they+uncovered+their+heads%2C+and+cast+ashes+upon+them%3A+But+the+Christians+in+the+West%2C+when+they+do+reverence+to+their+superiors%2C+they+always+uncover+their+heads%3B+and+therefore+it+is+the+fittest+gesture+for+us+to+uncover+our+heads+when+we+pray.+The+Jews+who+live+here+in+Europe%2C+when+they+are+in+their+synagogues%2C+they+never+uncover+their+heads%2C+which+is+altogether+contrary+to+the+custom+of+Europe%3A+They+salute+great+men+here+uncovering+their+heads%2C+and+so+should+they+pray+according+to+the+canon+of+Maimonides%3B+but+they+do+this+in+despite+of+the+Christians%3A+The+apostle%2C+1+Cor.+11%2C+wills+men+to+be+uncovered%2C+and+women+to+be+covered%2C+when+they+pray%2C+because+that+was+the+usual+form+amongst+the+Grecians%2C+for+the+men+did+uncover+their+heads%2C+when+they+did+any+reverence+to+their+superiours%3B+and+the+women+had+vails+which+covered+their+heads+and+faces+when+they+came+abroad%3A+therefore+he+would+not+have+them+uncovered+in+time+of+prayer.%E2%80%9D%0A%0A%E2%80%94+John+Weemes%2C+A+Treatise+of+the+Four+Degenerate+Sons%2C+%E2%80%A6+wherein+are+handled+many%E2%80%A6+sundry+places+of+Scripture%2C+cleared+out+of+the+original+tongues.+Being+the+fourth+volume%2C+of+the+Works%E2%80%A6+%28London%2C+1636%29%2C+On+the+3rd+Degenenerate+Son%2C+the+Idolater%2C+section+6%2C+pp.+264-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b695031cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6b695031cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=First%2C%20their%20head%20%5Bof%20the%20idolaters,them%20uncovered%20in%20time%20of%20prayer&amp;text=First%2C%20their%20head%20%5Bof%20the%20idolaters%20in%20Ahab%E2%80%99s&amp;text=not%20have%20them%20uncovered%20in%20time%20of%20prayer" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1 Cor. 11:16, ‘We have no such custom, nor the churches of Christ’… the apostle is there speaking of things wherein custom is indeed the rule, as having the head bare, or covered, wearing long or short hair: it does not thence follow (if the apostle did there make it the rule) that it must also be the rule in other things… he [the episcopalian opponent] pretends to convince us further, that Augustine distinguished the custom of the universal Church from the custom of particular places, and he makes the one mutable, the other not so. He needed not be at pains to convince us of that distinction. I know nobody that doubts of it, nor that reject the customs that are truly universal, unless they clash with Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … wherein the Divine Right of the Government of the Church by Presbyters acting in Parity, is Asserted… (Edinburgh, 1697) Rule was a leading father of the Revolution Church of Scotland who wrote numerous works at that time for the divine right of presbyterianism. | section 6, p. 87</span></figcaption>

</figure><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>

<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 3, pp. 46-47</span></figcaption>

<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgess [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the [Scottish] bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgess himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached. But others (I hear) object that if a man should uncover his head at the sight of a graven image, we would account this to be an adoring of the image; and why then shall not we call our uncovering at the sacrament adoration also? Answer: Though veneration and adoration be distinguished in holy things, to show that adoration given to them is idolatry, but veneration given to them is not idolatry, yet in profane things, such as images are, veneration given to them is idolatry as well as adoration: and we are idolaters for doing so much as to respect and reverence them, as things sacred or holy. For as I touched [upon] before, and as Zanchi evidences by sundry instances (bk. 1, de Viti. ext. cult. oppos., cols. 504-5), idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it, than God allows, or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [like as unto God in some degree].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgess [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the [Scottish] bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgess himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached. But others (I hear) object that if a man should uncover his head at the sight of a graven image, we would account this to be an adoring of the image; and why then shall not we call our uncovering at the sacrament adoration also? Answer: Though veneration and adoration be distinguished in holy things, to show that adoration given to them is idolatry, but veneration given to them is not idolatry, yet in profane things, such as images are, veneration given to them is idolatry as well as adoration: and we are idolaters for doing so much as to respect and reverence them, as things sacred or holy. For as I touched [upon] before, and as Zanchi evidences by sundry instances (bk. 1, de Viti. ext. cult. oppos., cols. 504-5), idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it, than God allows, or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [like as unto God in some degree].”

for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.+But+others+%28I+hear%29+object+that+if+a+man+should+uncover+his+head+at+the+sight+of+a+graven+image%2C+we+would+account+this+to+be+an+adoring+of+the+image%3B+and+why+then+shall+not+we+call+our+uncovering+at+the+sacrament+adoration+also%3F+Answer%3A+Though+veneration+and+adoration+be+distinguished+in+holy+things%2C+to+show+that+adoration+given+to+them+is+idolatry%2C+but+veneration+given+to+them+is+not+idolatry%2C+yet+in+profane+things%2C+such+as+images+are%2C+veneration+given+to+them+is+idolatry+as+well+as+adoration%3A+and+we+are+idolaters+for+doing+so+much+as+to+respect+and+reverence+them%2C+as+things+sacred+or+holy.+For+as+I+touched+%5Bupon%5D+before%2C+and+as+Zanchi+evidences+by+sundry+instances+%28bk.+1%2C+de+Viti.+ext.+cult.+oppos.%2C+cols.+504-5%29%2C+idolatry+is+committed+when+more+estimation+is+had+of+anything%2C+more+dignity+and+excellency+placed+in+it%2C+and+more+regard+had+to+it%2C+than+God+allows%2C+or+than+can+stand+with+God%E2%80%99s+revealed+will.+For+a+thing+thus+regarded%2C+though+it+be+not+exalted%2C+ut+Deus+simpliciter+%5Bas+God+simply%5D%2C+yet+it+is+set+up%2C+tanquam+Deus+ex+parte+%5Blike+as+unto+God+in+some+degree%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29+%7C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99+%7C+ch.+4%2C+%E2%80%98That+the+ceremonies+are+idols+among+Formalists+themselves%3B+and+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa377dddf14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a377dddf14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=Those%20who%20speak%20out%20more%20plainly,as%20unto%20God%20in%20some%20degree&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=parte%20%5Blike%20as%20unto%20God%20in%20some%20degree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As for the vails wherewith the apostle would have women covered while as they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1), they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign for that comely and orderly distinction of men and women, which civil decency required in all their meetings: wherefore that distinction of habits [garments], which they used for decency and comeliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness, still to retain in their holy assemblies. And further the apostle shows that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman, verses 3, 8, 9 (for covering was then a sign of subjection), and by the long hair which nature gives to a woman, verse 15, where he would have the artificial covering to be fashioned in imitation of the natural. What need we [argue] any more? Let us see nature’s institution or the apostles’ recommendation for the controverted [English-Popish] ceremonies (as we have seen them for women’s vails) and we yield the argument.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As for the vails wherewith the apostle would have women covered while as they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1), they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign for that comely and orderly distinction of men and women, which civil decency required in all their meetings: wherefore that distinction of habits [garments], which they used for decency and comeliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness, still to retain in their holy assemblies. And further the apostle shows that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman, verses 3, 8, 9 (for covering was then a sign of subjection), and by the long hair which nature gives to a woman, verse 15, where he would have the artificial covering to be fashioned in imitation of the natural. What need we [argue] any more? Let us see nature’s institution or the apostles’ recommendation for the controverted [English-Popish] ceremonies (as we have seen them for women’s vails) and we yield the argument.”

<blockquote><p>1. The text [1 Cor. 11:16] gives him [Anglican bishop Andrewes] no ground for this doctrine… that the custom of the Church should be enough to us in matters of ceremony… for the custom of the Church there spoken of is not concerning a point of circumstance, but concerning a very substantial and necessary point, namely, not to be contentious: neither does the apostle urge those orders of the men’s praying uncovered and the women’s praying veiled from this ground, because so was the Church’s custom (as the bishop would have it), but only he is warning the Corinthians not to be contentious about those matters, because the churches have no such custom as to be contentious. So is the place expounded by Chrysostom, Ambrose, Calvin, Martyr, Bullinger, Marlorat, Beza, Fulke, Cartwright, Pareus… And for this exposition it makes that the apostle in the preceding part of the chapter has given sufficient reasons for that order of covering or veiling the women: wherefore if any would contend about the matter, he tells them they must contend with themselves, for they (nor the churches of God) would not contend with them: they had no such custom. … 2. The custom of the Church is not enough to pitch on, and it is found oftentimes expedient to change a custom of the Church. Basil the Great does flatly refuse to admit the authority of custom: Consuetudo sine veritate [Custom without truth], says Cyprian, vetustas erroris est [is an old thing erring]. Frustra enim qui ratione vincuntur, says Augustine, consuetudinem nobis objiciunt, quasi consuetudo major sit veritate, etc. Nullus pudor est ad meliora transire, says Ambrose to the Emperour Valentinian: Quaelibet consuetudo [Any custom], says Gratian, veritati est postponenda [ought to be put after the truth]. And again: Corrigendum est quod illicite admittitur, aut a praedecessoribus admissum invenitur. A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’ In the end of the epistle he alleges this testimony of Cyprian: ‘If Christ alone be to be heard, then we ought not to give heed what any man before us has thought fit to be done, but what Christ (who is before all) has done, for we must not follow the custom of man, but the truth of God.’ What can be more plain than that antiquity cannot be a confirmation to error, nor custom a prejudice to truth?… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. 4. Whereas the custom of some churches is alleged for the ceremonies, we have objected the custom of other churches against them: Neither shall ever our opposites prove them to be the customs of the Church universal. … 6. If it were so that we ought to pitch upon the Churches custom, yet (that I may speak with Mr. [Richard] Hooker) the law of common indulgence permits us to think of our own customs as half a thought better than the customs of others. But why was there such a change made in the discipline, policy and orders of the Church of Scotland, which were agreeable to the Word of God, confirmed and ratified by general assemblies and parliaments, used and enjoyed with so great peace and purity? Our custom should have holden the ceremonies out of Scotland, hold them in elsewhere as it may.</p></blockquote>

<blockquote><p>But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?”

— George Gillespie, A Treatise of Miscellany Questions, … (Edinburgh, 1649), | ch. 5, ‘Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14; 12:28; Eph. 4:11, were extraordinary…’, pp. 75-76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+where+find+we+that+women+which+were+prophetesses+and+immediately+inspired+were+allowed+to+deliver+their+prophesy+in+the+Church+%5Baccording+to+Gillespie%E2%80%99s+objector%5D%3F+I+suppose+he+had+a+respect+to+1+Cor%3A+11%3A5%2C+%E2%80%98But+every+woman+that+prayeth+or+prophesieth+with+her+head+covered%2C+dishonoureth+her+head%2C%E2%80%99+which+is+meaned+of+the+public+assembly%2C+for+the+apostle+is+speaking+of+covering+or+uncovering+the+head+in+the+Church.+%5BThe+argument+of+the+last+statement+is+that+one+can+know+that+the+context+in+1+Cor.+11+is+of+public+assemblies+of+the+Church+%28as+opposed+to+private%29+because+it+mentions+the+practice+of+headcoverings.+That+is%2C+headcoverings+had+a+distinctively+public+function%2C+likely+to+all+such+societal%2C+public+functions.+This+is+confirmed+below.%5D+But+diverse+interpreters+understand+here+by+a+woman+that+prays+or+prophesies%2C+a+woman+that+joins+as+a+hearer+in+the+public+assembly%3A+and+so+verse+4%2C+by+a+man+that+prays+or+prophesies+%5Bsignifies%5D+a+man+that+is+a+hearer+and+joins+in+the+ordinances.+So+that+the+Geneva+annotation+upon+verse+5+gives+a+good+sense+of+that+text%3A+that+women+which+show+themselves+in+public+and+ecclesiastical+assemblies+without+the+sign+and+token+of+their+subjection%2C+that+is+to+say%2C+uncovered%2C+shame+themselves.+See+more+for+this+in+Junius%2C+his+annotations+on+the+Arabic+version+in+that+place.+If+the+apostle+by+%E2%80%98prophesying%E2%80%99%2C+1+Cor.+11%3A4-5%2C+understand+prophesying+by+immediate+inspiration%2C+then+the+objection+may+be+retorted+and+turned+into+an+argument+against+the+objectors+%5Bwho+advocated+for+regular+lay+preaching%5D%3A+For+the+sense+of+the+word+%E2%80%98prophesying%E2%80%99+in+the+11th+chapter+may+give+light+to+the+word+prophesying+in+the+14th+chapter%2C+verse+3.+Peter+Martyr+%28Common+Places%2C+eccles.+4%2C+ch.+1%29+is+indeed+of+opinion+that+women+which+were+prophetesses+and+extraordinarily+inspired+might+speak+in+the+Church%2C+provided+that+their+heads+were+covered%2C+in+token+of+feminine+subjection%2C+and+that+the+forbidding+of+women+to+speak+in+the+Church+extends+to+such%2C+and+so+he+reconciles%2C+1+Cor.+14%3A34%3B+1+Tim.+2%3A13+with+2+Cor.+11%3A5.+I+doubt+his+opinion+in+this+particular+is+not+well+grounded%2C+only+so+far+I+make+use+of+it%3A+that+if+1+Cor.+11%3A5+be+meant+of+prophetesses+praying+or+prophesying+in+the+Church+%28which+the+Objector+has+to+prove%29.+Then+certainly+the+forbidding+of+women+to+speak+in+the+Church+cannot+be+understood+universally%2C+but+with+a+reserve+and+exception+of+extraordinary+cases.+But+how+can+this+exception+of+prophetesses+consist+with+the+text%2C+%E2%80%98Let+your+women+keep+silence+in+the+Church%2C%E2%80%99+Why+%5BGreek%5D+your+women%2C+they+had+prophesying+women%2C+as+is+supposed+by+these+of+the+other+opinion%2C+from+1+Cor.+11%3A5.+Nay%2C+even+your+women+must+be+silent+says+the+apostle%3B+and+the+reasons+which+he+adds+are+so+universal+as+to+comprehend+even+prophetesses%2C+they+are+commanded+to+be+under+obedience%2C+and+to+be+in+subjection+%28which+Martyr+himself+notes%29%2C+holds+true+of+prophesying+women+as+well+as+others%3B+and+that+for+that+cause+their+heads+were+to+be+covered.+Another+reason+is+added%2C+1+Tim.+2%3A14%2C+Adam+was+not+deceived%3B+but+the+woman+being+deceived%2C+was+in+the+transgression.+It+might+be+feared%2C+says+Peter+Martyr%2C+if+women+were+permitted+to+speak+in+the+Church%2C+Satan+should+return+to+his+first+wile+and+deceive+the+man+by+the+woman.+Surely+he+that+made+use+of+Eve+might+also+make+use+of+a+prophesying+woman+to+deceive%2C+and+so+much+the+more%2C+because%2C+now+since+the+fall%2C+both+man+and+woman+are+more+subject+to+tentation.+So+that+both+the+apostle%E2%80%99s+command+and+the+reasons+of+it+seem+plainly+to+exclude+even+prophesying+women+from+speaking+in+the+Church%3B+and+if+they+be+allowed+to+deliver+extraordinary+prophesies+and+revelations+in+the+Church%2C+why+not+also+to+prophesy+as+other+gifted+members%3F+If+that+which+is+greater+be+allowed+them%2C+why+not+that+which+is+less%3F+And+if+prophetesses+be+excepted+from+the+rule%2C+1+Cor.+14%3A34%2C+why+not+also+other+women+of+excellent+gifts%3F%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%2C+%E2%80%A6+%28Edinburgh%2C+1649%29%2C+%7C+ch.+5%2C+%E2%80%98Whether+these+prophets+and+prophesyings+in+the+primitive+Church%2C+1+Cor.+14%3B+12%3A28%3B+Eph.+4%3A11%2C+were+extraordinary%E2%80%A6%E2%80%99%2C+pp.+75-76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fccf1687a01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ccf1687a01.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=But%20where%20find%20we%20that%20women,also%20other%20women%20of%20excellent%20gifts&amp;text=But%20where%20find%20we%20that%20women%20which%20were&amp;text=why%20not%20also%20other%20women%20of%20excellent%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…an external ecclesiastical reformation and several canons [implemented by the apostles] concerning the reformation of external abuses and scandals in the Church: as for instance, that the churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick [1 Tim. 5] and that such widows must be at least 60 years old, and the like.</p></blockquote>

</figure><figure class="quote" id="q-b55a47f3a4" data-kw="">
<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>

<blockquote><p>And here also [regarding worship] we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and unseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individual proprieties of every man: forma, figura, locus, tempus, strips[?], patria, nomen. Under form and figure: The first two, I comprehend, such a proportion of body, a man of a high stature, or low; a man beautiful, or not beautiful, to which I crave leave to reduce all external forms of habits [garments], as clothes, the head covered, or not covered, the situation of the body, as they are in themselves, mere physical acts; kneeling, sitting, standing; the eyes cast down to the earth, or lifted up; the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural, time, place, family, country, name, as such a person… 1. All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people; or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit, some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions, because neither actions natural, civil, nor religious, can be performed, but by some persons, in some habit and gesture, in some time, in some place: And lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and unseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak in this place, rather than that place (so it be not, locus ut sic, of intention, such a religious place, before the image of Christ, or the Father, or the Virgin Mary) the praying is neither the more, or the less acceptable to God because of these common and unseparable adjuncts… …to my knowledge all these that are mere physical circumstances, are particularly enumerated, such as are: 1. time: 2. place, 3. person, or agent: 4. name. 5. family: 6. condition, as country, family, house: 7. habits or garments: 8. gestures, as sitting, standing, lifting of the eyes or hands, knocking on the breast, kneeling, and there is no blind in this enumeration, for there be no other particulars that can be enumerated [that do not fall into one of these categories]…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And here also [regarding worship] we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and unseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individual proprieties of every man: forma, figura, locus, tempus, strips[?], patria, nomen. Under form and figure: The first two, I comprehend, such a proportion of body, a man of a high stature, or low; a man beautiful, or not beautiful, to which I crave leave to reduce all external forms of habits [garments], as clothes, the head covered, or not covered, the situation of the body, as they are in themselves, mere physical acts; kneeling, sitting, standing; the eyes cast down to the earth, or lifted up; the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural, time, place, family, country, name, as such a person… 1. All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people; or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit, some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions, because neither actions natural, civil, nor religious, can be performed, but by some persons, in some habit and gesture, in some time, in some place: And lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and unseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak in this place, rather than that place (so it be not, locus ut sic, of intention, such a religious place, before the image of Christ, or the Father, or the Virgin Mary) the praying is neither the more, or the less acceptable to God because of these common and unseparable adjuncts… …to my knowledge all these that are mere physical circumstances, are particularly enumerated, such as are: 1. time: 2. place, 3. person, or agent: 4. name. 5. family: 6. condition, as country, family, house: 7. habits or garments: 8. gestures, as sitting, standing, lifting of the eyes or hands, knocking on the breast, kneeling, and there is no blind in this enumeration, for there be no other particulars that can be enumerated [that do not fall into one of these categories]…”

— Samuel Rutherford, The Divine Right of Church Government, ... (1646) | Introduction | section 1, pp. 2-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+here+also+%5Bregarding+worship%5D+we+consider+things+circumstantial%2C+as+time%2C+place%2C+etc.+And+circumstances+are+either+merely+physical%2C+or+2.+merely+moral%2C+or+3.+mixed%2C+partly+moral%2C+partly+physical.+Circumstances+merely+physical+are+such+adjuncts+of+divine+worship+as+are+common+and+unseparable+concomitants+of+both+civil%2C+natural%2C+and+religious+or+sacred+actions+performed+by+men%2C+and+as+they+are+such%2C+contribute+no+moral+goodness+or+badness+to+the+action+or+agent+in+the+performance+thereof%2C+such+as+I+take+to+be+the+seven+individual+proprieties+of+every+man%3A+forma%2C+figura%2C+locus%2C+tempus%2C+strips%5B%3F%5D%2C+patria%2C+nomen.+Under+form+and+figure%3A+The+first+two%2C+I+comprehend%2C+such+a+proportion+of+body%2C+a+man+of+a+high+stature%2C+or+low%3B+a+man+beautiful%2C+or+not+beautiful%2C+to+which+I+crave+leave+to+reduce+all+external+forms+of+habits+%5Bgarments%5D%2C+as+clothes%2C+the+head+covered%2C+or+not+covered%2C+the+situation+of+the+body%2C+as+they+are+in+themselves%2C+mere+physical+acts%3B+kneeling%2C+sitting%2C+standing%3B+the+eyes+cast+down+to+the+earth%2C+or+lifted+up%3B+the+hands+lifted+up%2C+or+not+lifted+up%2C+the+knocking+on+the+breast%2C+or+not+knocking%2C+motions+of+the+soul%2C+that+are+natural%2C+time%2C+place%2C+family%2C+country%2C+name%2C+as+such+a+person%E2%80%A6+1.+All+these+are+common+concomitants+of+civil%2C+natural%2C+and+religious+actions%2C+for+all+actions+performed+by+man+of+what+kind+soever%2C+as+natural%2C+to+eat%2C+sleep%2C+or+civil%2C+to+declaim+an+oration+before+the+people%3B+or+religious%2C+to+preach+or+pray%2C+must+be+done+by+some+persons%2C+John+or+Thomas%2C+men+of+some+family%2C+in+some+time%2C+in+some+place%2C+for+they+are+not+actions+eternal%2C+and+so+must+be+done+in+time+and+place%2C+so+the+agents+must+have+some+habit%2C+some+gesture+in+the+doing+of+all+these+actions%2C+and+they+are+unseparable+adjuncts+of+all+these+actions%2C+because+neither+actions+natural%2C+civil%2C+nor+religious%2C+can+be+performed%2C+but+by+some+persons%2C+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+And+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+unseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak+in+this+place%2C+rather+than+that+place+%28so+it+be+not%2C+locus+ut+sic%2C+of+intention%2C+such+a+religious+place%2C+before+the+image+of+Christ%2C+or+the+Father%2C+or+the+Virgin+Mary%29+the+praying+is+neither+the+more%2C+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts%E2%80%A6+%E2%80%A6to+my+knowledge+all+these+that+are+mere+physical+circumstances%2C+are+particularly+enumerated%2C+such+as+are%3A+1.+time%3A+2.+place%2C+3.+person%2C+or+agent%3A+4.+name.+5.+family%3A+6.+condition%2C+as+country%2C+family%2C+house%3A+7.+habits+or+garments%3A+8.+gestures%2C+as+sitting%2C+standing%2C+lifting+of+the+eyes+or+hands%2C+knocking+on+the+breast%2C+kneeling%2C+and+there+is+no+blind+in+this+enumeration%2C+for+there+be+no+other+particulars+that+can+be+enumerated+%5Bthat+do+not+fall+into+one+of+these+categories%5D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+...+%281646%29+%7C+Introduction+%7C+section+1%2C+pp.+2-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27b38c5889.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/27b38c5889.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=And%20here%20also%20%5Bregarding%20worship%5D%20we,fall%20into%20one%20of%20these%20categories&amp;text=And%20here%20also%20%5Bregarding%20worship%5D%20we%20consider%20things&amp;text=do%20not%20fall%20into%20one%20of%20these%20categories" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bcfb44bddb" data-kw="">
<blockquote><p>A habit is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere circumstance… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the temple for Jewish worship. The former are circumstances merely physical, the latter merely moral; I mean, as they are restricted other ways… … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say in all morals because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not put forth such things, but supposes them]: The Scripture says not that the worship of God must have a time, a place, when, and where its to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be; because nature teaches that without time, place, person, habit, gesture, its unpossible that these or any human actions can be; And therefore prelatical formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all; yea, there is as good reason that they demand Scripture to prove he must be a living man, who has a reasonable soul and senses, and is born of a woman, who preaches and administrates sacraments, which is presupposed by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-796f070775" data-kw="">
<blockquote><p>…because there is no moral goodness imaginable, but it must have its essential form and being from a law or word of God; therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God: For circumstances clothed with religious positive goodness, such as are the Sabbath day, the Holy of Holiest, the Temple; these are not mere circumstances, but worship itself: So a religious habit, as an ephod or a surplice, is not a mere circumstance, or a mere habit, but a worship, or such a part or limb of worship as must be warranted by the Word of truth, else it is nothing but a will-device and a forgery, and so to be rejected.</p></blockquote>

</figure><figure class="quote" id="q-6721ab3bf3" data-kw="">
<blockquote><p>…and undeniably the Jewish days, the High Priest’s garment and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship; for the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven, we do not think that the Lord in all or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat (that belongs to art), only he speaks of garments as contrary to gravity, as signs of vanity and lightness, Isa. 3:16, etc. Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High-Priests in their service, in which consideration the religious times, holy places, and mosaical garments were divine worship, by which God was immediatly honored, but not adjuncts only, or actions; but religious things or performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…and undeniably the Jewish days, the High Priest’s garment and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship; for the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven, we do not think that the Lord in all or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat (that belongs to art), only he speaks of garments as contrary to gravity, as signs of vanity and lightness, Isa. 3:16, etc. Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High-Priests in their service, in which consideration the religious times, holy places, and mosaical garments were divine worship, by which God was immediatly honored, but not adjuncts only, or actions; but religious things or performances.”

— Samuel Rutherford, The Divine Right of Church Government, ... (1646) | Introduction, p. 87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6and+undeniably+the+Jewish+days%2C+the+High+Priest%E2%80%99s+garment+and+many+things+of+that+kind%2C+were+divine+or+religious+performances%2C+things+or+adjuncts+of+divine+worship%2C+but+so+as+they+are+not+merely+adjuncts+of+worship%2C+but+also+worship%3B+for+the+High+Priest%E2%80%99s+ephod+was+not+only+a+civil+ornament%2C+nor+was+it+a+mere+physical+or+natural+means+to+fence+off+the+injuries+of+sun+and+heaven%2C+we+do+not+think+that+the+Lord+in+all+or+any+place+of+the+Old+or+New+Testament+sets+down+any+laws+concerning+garments+simply%2C+as+they+do+fence+off+cold+or+heat+%28that+belongs+to+art%29%2C+only+he+speaks+of+garments+as+contrary+to+gravity%2C+as+signs+of+vanity+and+lightness%2C+Isa.+3%3A16%2C+etc.+Zeph.+1%3A8%3B+1+Pet.+3%3A3-4.+And+of+garments+as+religious+observances%2C+of+which+sort+was+the+attire+and+garments+of+the+priests+and+High-Priests+in+their+service%2C+in+which+consideration+the+religious+times%2C+holy+places%2C+and+mosaical+garments+were+divine+worship%2C+by+which+God+was+immediatly+honored%2C+but+not+adjuncts+only%2C+or+actions%3B+but+religious+things+or+performances.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+...+%281646%29+%7C+Introduction%2C+p.+87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6721ab3bf3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6721ab3bf3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=and%20undeniably%20the%20Jewish%20days%2C%20the,actions%3B%20but%20religious%20things%20or%20performances&amp;text=and%20undeniably%20the%20Jewish%20days%2C%20the%20High%20Priest%E2%80%99s&amp;text=only%2C%20or%20actions%3B%20but%20religious%20things%20or%20performances" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f6d80689e0" data-kw="">
<blockquote><p>Uncovering of the head: Though this last be not adoration, but a national sign of reverence, and is not every where adoration; yet Abulensis says, the Jews did pray and sacrifice with covered heads: So says Virgil, and Lod. Vives: Therefore the Corinthians had this from the Grecians as a civil sign of gravity, which should not be banished from God’s worship.</p></blockquote>

</figure><figure class="quote" id="q-66a913b15c" data-kw="">
<blockquote><p>In the field, or in the bed, clothed with gown or cloak, when we pray or preach, are mere accidents and circumstances of praying and preaching, and we grant them to be variable and indifferent; howbeit, they admit of regulation-moral, and so are not simply indifferent; for to pray in the fields and streets, to be seen of men, is vain glory. But I hope they are not indifferent in your [Forbes’] meaning, as are surplice, holy-days, etc. For you will not say the Church may make laws that no prayers be but in the fields, no preaching except the preacher be clothed with a cloak. … 3. Place or habit does not constitute praying and preaching in their specific nature; that were a wonder, for their objects do constitute their nature, and their objects are God and God’s Word;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 649-50</span></figcaption>

</figure><figure class="quote" id="q-4a3df5f2e3" data-kw="">
<blockquote><p>The materials of worship, as linen, clothes, habits, gestures may be in their physical consideration indifferent, but as applied by formalists, they cannot be indifferent, for in their use, kneeling appropriated to sacramental bread, linen appropriated to the body of a priest, while he officiates, cannot be but religious or profane.</p></blockquote>

<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations</cite>, (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— Daniel Featley, The English Annotations, (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+2.+%E2%80%A6and+keep+the+ordinances%5D+By+the+word+%5BGreek%5D+in+the+original%2C+which+signifies+traditions%2C+he+means%E2%80%A6+particular+ordinances+of+comeliness%2C+and+good+order%2C+which+belong+to+ecclesiastical+policy%2C+which+afterward+were+called+canons.+%E2%80%A6+V.+10.+power+on+her+head%5D+That+is%2C+a+vail+or+covering%2C+in+token+of+her+husband%E2%80%99s+power+and+authority+over+her%3B+or+a+kind+of+warrant+or+pass+to+go+abroad+with+credit+and+honesty%3A+for+there+was+no+necessity+of+vailing+or+covering+their+head+within+doors%2C+but+if+they+went+abroad+without+their+vail%2C+they+were+counted+light+and+wanderers%2C+like+unto+run-away+servants%2C+or+soldiers+that+have+no+passe+to+show+from+their+masters+or+captains%E2%80%A6+because+of+the+Angels%5D+Some+by+the+angels+understand+the+pastors+of+the+congregations%2C+who+are+termed+angels%2C+Mal.+2%3A7+and+Rev.+1%3A20%2C+and+that+the+apostle+draws+his+reason+to+enforce+women%E2%80%99s+modest+carriage+from+the+reverend+respect+the+women+ought+to+show%2C+especially+in+the+Church%2C+to+these+angels+of+the+Churches.+Others+take+angels+here+in+the+proper+sense+for+the+coelestial+spirits%2C+which+always+attend+upon+Christ+their+Head%2C+and+are+present+in+the+congregation+of+the+faithful%2C+and+are+offended+at+all+disorders+and+uncomeliness+which+may+be+used+there%E2%80%A6+%E2%80%A6+V.+16.+if+any+man+seem+to+be+contentious%2C+we+have+no+such+custom%5D+Either+the+meaning+is%2C+We+have+no+such+custom+for+women+to+pray+uncovered%3B+or%2C+we+have+no+such+custom+or+the+Churches+of+God+to+contend+about+matters+of+this+nature%2C+but+willingly+and+cheerful+to+obey+those+that+have+the+o </figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s Called, ‘The Keys of the Kingdom of Heaven’. As also upon Another Tract of his Called, ‘The Way of the Churches of New England’. Manifesting: 1. The Weakness of his Proofs. 2. The Contradictions to Himself &amp; Others. 3. The Middle-Way</cite>, ... (London, 1645), ch. 6, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.”

<blockquote><p>The very attire which nature and custom of all times and places have taught women to put on, confirms the same: as long hair, vails, and other coverings over the head: this and the former argument does the Apostle himself use to this very purpose, 1 Cor. 11:7, etc.</p></blockquote>

</figure><figure class="quote" id="q-377ce1470e" data-kw="">
<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>

ils" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§10. Of the vices contrary to children’s reverend gesture towards their parents. … 2. Disdainful stateliness, when they think [it too] much to stand bare-headed any while in their parents’ presence. It falls out many times, that when parents and children are together before their betters, they will show more reverence than these: for the father will stand, and be uncovered, when the son sits down and puts on his hat, upon conceit that his father does more reverence than is meet: but if it were so, yet the son for the father’s sake should stoop somewhat the lower.</p></blockquote>

<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>

<figure class="quote" id="q-a27f86e030" data-kw="">
<blockquote><p>We have seen heretofore, that Eliu intending to rebuke Job, protested that he himself was a mortal man as Job was, to the end he should not complain that he was handled with too high a power. And so he showed that God’s will was to win him by reason and gentleness, according also as he deals towards us. For he bears with us, making his word to be preached to us by men like ourselves, so as we may come the more familiarly to hear things that he tells us, and the doctrine is chewed and put into our mouths. We see then that God pities us, when he appoints men to be the ministers of his word, and to teach us in his name and authority. For he knows our ability, and that as much as we are feeble, we should out of hand be swallowed up by his majesty, and overwhelmed with his glory. And that is the cause why he stoops down to our lowness, instructing us by the means of men.</p></blockquote>

</figure><figure class="quote" id="q-b9aa2973f1" data-kw="">
<blockquote><p>But the chief thing is, that Christ, the Sun of Righteousness, has so irradiated your mind with the light of his Gospel, that you understand that the true way of governing the Church is no other than what is to be derived from him, and that you at the same time know the difference between that genuine form of religion which he has instituted, and that fictious and degenerate form which was afterwards introduced; for you wholly understand that God’s worship has been corrupted and deformed, as innumerable superstitions have crept in, that the grace of Christ has been unworthily involved in great darkness, that the virtue of his death has been annihilated, that he himself has been almost lacerated and torn in pieces, that assurance of salvation has been plucked up by the roots, that consciences have been miserably and even horribly vexed and tormented, that wretched men have been led away from the sincere and right worship of God into various and perplexed labyrinths, that the Church has been cruelly and tyrannically oppressed; and, in short, that no real Christianity has been left.</p></blockquote>

</figure><figure class="quote" id="q-f44b2859af" data-kw="">
<blockquote><p>As for the assemblies of Anabaptists, Libertines, Antinomies, Tritheists, Arians, Samosatenians, they are no Churches of God, but conspiracies of monstrous heretics judicially condemned in the primitive Church, and again by the malice of Satan renewed and revived in this age. The same we are to think and say of the Family of Love.</p></blockquote>

</figure><figure class="quote" id="q-6e2abb4eea" data-kw="">
<blockquote><p>Nom. And do any of our godly and modern writers agree with you on this point? Evan. Yes, indeed. Polanus says, “The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.” And Dr. Preston, on the New Covenant, (p. 317.) says, “The covenant of works runs in these terms, “Do this and thou shalt live, and I will be thy God.” This was the covenant which was made with Adam, and the covenant that is expressed by Moses in the moral law.” And Mr. Pemble (Vind. Fid. p. 152.) says, “By the covenant of works we understand what we call in one word, “the law,” namely, that means of bringing man to salvation, which is by perfect obedience unto the will of God. Hereof there are also two several administrations: the first is with Adam before his fall, when immortality and happiness was promised to man, and confirmed by an external symbol of the tree of life, upon condition that he continued obedient to God, as well in all other things, as in that particular commandment of not eating of the tree of knowledge of good and evil. The second administration of this covenant was the renewing thereof with the Israelites at Mount Sinai: where, after the light of nature began to grow darker and corruption had in time worn out the characters of religion and virtue first graven in man’s heart,u God revived the law by a compendious and full declaration of all duties required of man towards God or his neighbour, expressed in the decalogue; according to the tenor of which law God entered into covenant with the Israelites, promising to be their God in bestowing upon them all blessings of life and happiness, upon condition that they would be his people, obeying all things that he had commanded; which condition they accepted of, promising an absolute obedience, (Exod. 19:8.) “All things which the Lord hath said we will do;” and also submitting themselves to all punishment in case they disobeyed, saying ‘Amen’ to the curse of the law, ‘cursed is every one that confirmeth not all the words of the law; and all the people shall say Amen.’ ” And Mr. Walker on the covenant, (p. 128.) says, that “the first part of the covenant, which God made with Israel at Horeb, was nothing else but a renewing of the old covenant of worksv which God made with Adam in paradise.” And it is generally laid down by our divines, that we are by Christ delivered from the law as it is a covenant.w BOSTON’S NOTES u.That is, had worn them out, in the same measure and degree as the light of nature was darkened; but neither the one nor the other was ever fully done, Rom. 2:14, 15. w. But not as it is a rule of life, which is the other member of that distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: An Explication of the Assembly’s Shorter Catechism</cite>, ed. Samuel M‘Millan, vol. 7 (Aberdeen: George and Robert King, 1850), 200–01.</span></figcaption>

<blockquote><p>WE are disposed to think there must be, on an average, at least one misrepresentation for every page in this work. As it requires more words to correct a misstatement than to make it, we should be obliged to write a book instead of a review, if we thought it necessary to correct all these errors. We believe they may be safely allowed to work their own cure.</p></blockquote>

</figure><figure class="quote" id="q-6a40c28292" data-kw="">
<blockquote><p>I have found it absolutely necessary to oppose different opinions; both those of the public adversaries of the reformed churches, amongst whom I reckon, first, the Socinians and the Remonstrants, who, by their daring comments have defiled the doctrine of God’s covenants; and those of some of our brethren, who have enterprised the formation of new hypotheses, and have thereby almost rooted out all true divinity. I persuade myself it is not in the power of malice to deny that I have acted with candour and modesty: I have stated the controversy justly, not attributing to any one any opinion which he would not allow to be his own, and have made use of such arguments as had before satisfied my own conscience, as if these were not of themselves convincing, I could not think that any force would be added to them by the warmth of the disputant; especially, I considered that the opinions of our brethren were to be treated with candour, and I have never sought after any inaccurate word, harsh phrase, or crude expression, in order to criticise them; esteeming it much better to point out how far all the orthodox agree, and how the more improper ways of expression may be softened, remarking only on those sentiments which are really different; and these, I dare affirm, will be found to be fewer and of less moment than they are generally thought to be, provided we examine them without prejudice. Yet, I cannot pass over in silence some uncouth expressions, foreign interpretations, or contradictory theses, and occasionally I note the danger attending them, but without any malevolence to their authors; for I confess, I am of their opinion who believe that the doctrine of the covenant has long since been delivered to the churches on too good a foundation to stand in need of new hypotheses, in which I cannot find that solidity or usefulness which is necessary to establish their divinity.</p></blockquote>

</figure><figure class="quote" id="q-4309f79060" data-kw="">
<blockquote><p>…He had always the preference given him in their synods, and was twice honored with the supreme government and headship of the university; namely, in the years 1686, and 1697. Nor must we omit, that when, in the year 1685, the states of Holland sent a splendid embassy to James the Second, king of Great Britain, who at that time was pursuing measures, which at last justly ended in his total ruin; and Wassenar, lord of Duvenwarden, and Weedius, lord of Dykeveldt, and Citerius, were the person nominated to execute sumptuous commission; the second of these noble personages easily convinced the other two, that none was so proper to attend them to England, in quality of chaplain, as Witsius; who might not only, y his uncommon knowledge in religious and civil matters, be of great service to them in both respects; but also, be no small credit to the reformed churches of Holland, by letting the English nation see what great divines flourished there. The design being intimated to Witisus, he cheerfully closed with it; though he was at that time very ill and weak in body. After some months’ stay in England, he confessed, on his return, that he had conversed with the archbishop of Canterbury, the bishop of London, and many other divines, both conformist and dissenters: “by which conversations,: he would say, “I was much furthered in learning, experience, and moderation.” From that period forward, the principal prelates and clergymen in England did not conceal the respect and esteem in which they held this great man; especially,m as he came to be more and more known to them.</p></blockquote>

</figure><figure class="quote" id="q-d8a27410cf" data-kw="">
<blockquote><p>III. Ministers are fishers by office; they are catchers of the souls of men, sent “to open the eyes of the blind, and to turn them from darkness to light, and from the power of Satan unto God,” Acts 26:18. Preachers of the gospel are fishers; and their work, and that of fishers, agree in several things. 1. The design and work of fishers is to catch fish. This is the work that preachers of the gospel have taken in hand, even to endeavour to bring souls to Christ. Their design in their work should be the same. Tell me, O my soul, what is thy design in preaching? for what end dost thou lay the net in the water? is it to shew thy gifts, and to gain the applause of men? Oh! no. Lord, thou knowest my gifts are very small; and had I not some other thing than them to lean to, I had never gone to a pulpit. I confess, that, for as small as they are, the devil and my corruptions do sometimes present them to me in a magnifying glass, and so would blow me up with wind. But, Lord, thou knowest it is my work to repel these motions. An instance of this see in my Diary, Jan. 1. 1699. But of this see afterwards. 2. Their work is hard work; they are exposed to much cold in the water. So is the minister’s work. 3. A storm that will affright others, they will venture on, that they may not lose their fish. So should preachers of the gospel do. 4. Fishers catch fish with a net. So preachers have a net to catch souls with. This is the everlasting gospel, the word of peace and reconciliation, wherewith sinners are caught. It is compared to a net wherewith fishers catch fish….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: A Soliloquy on the Art of Man-Fishing</cite>, ed. Samuel M‘Millan, vol. 5 (Aberdeen: George and Robert King, 1849), 10–11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-ebf4251402" data-kw="">
<blockquote><p>We maintain to start with that, when God raised up Luther and others, who held forth a torch to light us into the way of salvation on on whose ministry our churches are founded and built, those heads of doctrine in which the truth of our religion, those in which the pure and legitimate worship of God, and those in which the salvation of man are comprehended, were in a great measure obsolete.</p></blockquote>

<blockquote><p>And are there not others, though I hope but a few, who being enlightened to see their misery, by reason of the guilt of sin, though not by reason of the filth of sin, and hearing of justification freely by grace, through the redemption which is in Jesus Christ, do applaud and magnify that doctrine, following them that do most preach and press the same, seeming to be, as it were, ravished with the hearing thereof, out of a conceit that they are by Christ freely justified from the guilt of sin, though still they retain the filth of sin? There are those that content themselves with a gospel knowledge, with mere notions in the head, but not in the heart; glorying and rejoicing in free grace and justification by faith alone; professing faith in Christ, and yet are not possessed of Christ; these are they that can talk like believers, and yet do not walk like believers; these are they that have language like saints, and yet do have conversation like devils; these are they that are not obedient to the law of Christ, and therefore ae justly called Antinomians.</p></blockquote>

<blockquote><p>From the confession of our opponents, who cannot deny that before Luther and Zwingli, there were innumerable persons who professed our faith and protested publicly against the papal errors. See what is related of the Waldenses and Albigenses, Hussites, Wycliffites, Lollards and Picards by Thuanus (de Thou), Historiam sui temporis 6 and 27 (1625), 1:111‐34 and 540–57; Aeneas Sylvius (Pius II), “Historia bohemica,” 35 Aeneae Sylvii…Opera (1551/1967), pp.102–5; Poplinerius, L’ Historire de France (1581), 1:7–8, 24–26; Charles Molinaeus (Dumoulin) “De Monarchi Francorum,” Opera omnia (1658), 3:2012 and not a few others who trace their origin long before the Reformation. Nor can Eck deny it when he says that Luther did nothing else then recall heresies previously condemned in the Waldenses, Albigenses, Hussites and others (Enchiridion of Common Places [trans. F. L. Battles, 1979], pp.186–89, esp. p. 186). Cochlaeus acknowledges that the Lutherans received their doctrine from Hussites (Historia Hussitarum) 8* [1549], p. 283). Nor must we all miss here the testimony of Reynerius, 300 years before, and inquisitor against the heretics, concerning the dwellers in the enclosed valleys (commonly called Waldenses), of whose antiquity and integrity he assures us in his book written about them and published by Gretzer and republished in Bibliotheca Patrum: “Among all the sects,” says he, “which still are or were, none was more dangerous to the church then the Leonistarian” (or the poor people of Lyon [i.e., the Waldemses], against whom the treatise is inscribed). “And this from three causes. The first is because it is more ancient than all; for some say that it has continued from the time of Sylvester (I), some from the time of the apostles. The second because it was more widely spread; for there is scarcely any land in which this sect is not found. The third because while all the sects by their coarse blasphemies against God horrify the hearers, this has a great appearance of piety in that they live justly before men and truly believe all things concerning God and observe all the articles contained in the Creed, only they blaspheme the Roman Church and clergy” (cf. Reinari Ord. Praedicatorum contra Waldenses haereticcos in La Bigne, Magna Bibliotheca Veterum [1654], 4:749). Claudius Sesselius, Archbishop of Turin, in a book which he wrote against the Waldenses, relates “that the Waldensian sect took its rise from a certain Leo, the most religious man, in the time of Constantine the Great, the first Emperor of the Christians, who being opposed to the avarice of Sylvester, and the too great liberality of Constantine, preferred to follow poverty in simplicity of faith than to remain with Sylvester and be contaminated with a rich benefice, to whom as many adhered as thought well of the faith” (Adversus errors et sectam Valdensiam disputationes [1520], vol. v–vi). Moreover that their religion and faith were conformed to ours is gathered not only from the passages cited of Thuanus and Aeneas Sylvius, in which the principal heads of their belief are given, but also from the ancient confessions and their writing quoted both by John Paul Perrin, Histoire of the Waldenses and the Albagenses (1624) and a few years before by Joannes Legerus, pastor in the same place, his Histoire Generale de Elgises Evangeliques des Valdes 3–4. (1669) (1669/1980), 21‐30ff., where he accurately treats of their antiquity and faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.20.</span></figcaption>

<blockquote><p>All this is true. But it really does not apply to the situation in the Presbyterian Church in the U.S.A. The point is that Church is very largely dominated by unbelief. It does not merely harbor unbelief here and there. No, it has made unbelief, in the form of a deadly Modernist vagueness, the determinative force in its central official life. Such a body is hardly what the Bible means by a church at all. The Bible commands Christian people to be members of a true church, even though it be an imperfect one. It represents the nurture provided by such a true church as a necessity, not a luxury, in the Christian life. There must therefore be a separation between the Christian and the Modernist elements in the Presbyterian Church in the U.S.A. That is perfectly clear. The only question is how the separation shall be effected. Unquestionably the best way would be the way of reform. If Modernism should be removed from the Presbyterian Church in the U. S. A., and that church should be brought back to conformity with its constitution and with the Word of God, all would be well. The other way is the way of separation from the existing organization on the part of the loyal part of the church. Only, if the separation comes, it ought to come in such fashion as to make perfectly clear the fact that those who are separating from the present Modernist organization are not founding a “new church,” but are carrying on the true, spiritual succession of the Presbyterian Church in the U. S. A.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“What Should Be Done by Christian People Who are in a Modernist Church?” The Presbyterian Guardian</cite>, 1.2 (21 October 1935): 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>From the conformity of our church to the primitive apostolic Church. For since no one can deny that the primitive church was instituted by Christ and the apostles neither can it be denied that our church, if it is conformed that both in faith and in worship, was even then in it. Now it is easy to prove that it is conformed if we approach the examination of doctrine, as we so often desire. From this it will appear that nothing is received by us to be believed or done which was not delivered by Christ and the apostles; and whatever is rejected by us has no foundation in the writings, but is beyond what is written (par ho gegraphtai) And beyond that gospel which they preached (Gal 1:8). Nor is it to be said here that the ancient church cannot be said to be the same with ours because it did not reject the papacy, as we have done. (a) Faith and religion by themselves (and essentially) are not negative, but positive, since a negation or a rejection of error is by accident and positive faith suffices for the essential unity of the church. (b) if it did not reject explicitly (because the papacy had not yet sprung up), it rejected it implicitly and virtually by teaching such things as are incompatible (asystata) with it (in which way the scripture is said by the positing of the truth to reject errors not yet arisen, but only about to arise in the in the progress of time).</p></blockquote>

d it online · Heidelblog</a></div>

<blockquote><p>XVII. From the faith of history which exhibits multiple worshipers of God and witnesses of the truth, who repeatedly opposed themselves to the papistical errors and bore testimony to the truth. For if there are granted many who by words, deeds and writings disturbed the Roman court on account of his errors, idolatries and tyranny and who for that cause were treated in the most unworthy manner and exposed to the most cruel persecutions, there is no doubt that they constituted the true church which we seek. Now that there were innumerable such persons the catalogues of Magdeburg, of Illyricus, Plessius, Fox and others prove, which give the names and writings of those warning the condition of the church under the papacy, while seeking and urging a Reformation. Ussher Also should be examined (de Christianarum ecclesiam in Occidentis 6 [1613], pp. 142-74); and Voetius, Where he proves the succession of the true faith and church under the New Testament through all ages up to the Reformation and brings forward various examples of the pious lamenting and protesting against the errors of the papacy (Desperata causa papatus novissime 3.2 [1635], 530-703). XVIII. From more similar examples of the church both of the Old and of the New Testaments. In the Old Testament: (a) of the church in Egypt after the death of Joseph and his brothers Ezk 16); (a) of the Israelite church under Elijah, who complains that he is left alone, God however reserving for himself 7000 (1 K 19:18); (c) Of the church in Samaria after the 10 tribes had been carried away to Assyria (2 Ch 30:11; 34:33); (d) of the Jewish church in the Babylonian captivity, with which is compared the state of the church under the tyranny of antichrist (Rev. 17; 18). Under the New Testament: at the time of the birth of Christ, the church was not to be found among the scribes, Pharisees and pontiffs (who glory in the name of the church, but who were the enemies of God and Christ), but in a few pious persons and believers waiting for the redemption of Israel. At the time of Paul, the Jewish church was reduced to a few elect with Paul, others remaining hardened and unbelievers (Rom. 11:1, 5). What wonder, then, if we say that the true church was equally in the midst of the spiritual Babylon and Egypt, stripped of her distinctive marks and external ornaments?</p></blockquote>

</figure><figure class="quote" id="q-dfa59e1768" data-kw="">
<blockquote><p>That the truth of the gospel. There was no danger that Paul would be deprived of his liberty even by yielding to them; but the example would have done harm to others, and therefore he prudently inquired what was expedient. This shows us how far offenses must be avoided, and points us to edification as the object which ought to be kept in view in all matters of indifference. The amount, is this: “We are the servants of the brethren, but still keeping in view that we all serve the Lord, and that the liberty of our conscience shall remain unimpaired.” When false brethren wished to bring the saints in to bondage, it was their duty not to yield to them. The truth of the gospel denotes its genuine purity, or, which means the same thing, its pure and entire doctrine. For the false apostles did not altogether set aside the gospel, but mixed up with it their own notions, so as to give it a false and disguised aspect, which it always has when we make the smallest departure “from the simplicity that is in Christ.” (2 Cor 11:3.) With what effrontery then will the Papists boast that they possess the gospel, which is not only corrupted by many inventions, but more than adulterated by many wicked doctrines? Let us remember that it is not enough to retain the name of the gospel, and some kind of summary of its doctrines, if its solid purity do not remain untouched. Where are the men who, by pretended moderation, endeavor to bring about a reconciliation between us and the Papists? as if the doctrine of religion, like a matter affecting money or property, could be compromised. With what abhorrence would such a transaction have been regarded by Paul, who affirms that it is not the true gospel, if it is not pure!</p></blockquote>

</figure><figure class="quote" id="q-a40b74dd77" data-kw="">
<blockquote><p>I do not forget that some of the respected and beloved brethren, who are regarded as the advocates of the doctrines alluded to, tell us continually that they believe substantially as we believe; that the difference between them and us is chiefly, if not entirely a difference of words. And is it possible, if this is the case, that they will allow so much anxiety and noise to be created by a mere verbal dispute? But whatever may be the understanding and the intention of leading preachers of the doctrines referred to, the question is, “How are they understood by others?” … There is the utmost danger that others (not so discerning or so pious) will be led astray by the language in question, and really embrace, in all their extent, the errors which it was originally employed to express. … Besides, all experience admonishes us to be upon our guard against those who, in publishing erroneous opinions, insist upon it that they differ from the old orthodox creed “only in words.” This plan has been often pursued, until the language became familiar, and the opinions which it naturally expressed, current; and then the real existence of something more than verbal difference was disclosed in all its extent and inveteracy. Such was the course adopted by Arius, in the fourth century. … It is, indeed, an easy thing for a minister accused of heresy, and affording too much evidence of the fact, by ingenious refinements, and plausible protestations, to render it difficult, if not impossible for a judicatory to convict him. And it is easy for such of his brethren as resolve him from censure, so to varnish over his opinions — as to hide, for the present, most of their deformity.</p></blockquote>

e%2C+so+to+varnish+over+his+opinions+%E2%80%94+as+to+hide%2C+for+the+present%2C+most+of+their+deformity.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+Doctrinal+Integrity%3A+The+Utility+and+Importance+of+Creeds+and+Confessions+and+Adherence+to+our+Doctrinal+Standards%2C+%28Dallas%2C+Texas%3A+Presbyterian+Heritage+Publications%2C+1989%29%2C+pp.103-105%2C+109-110.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa40b74dd77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a40b74dd77.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/07/more-than-a-semantic-difference/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>THE present situation in the Presbyterian Church in the U. S. A. is only one phase of a situation that prevails in the Protestant churches throughout the world. Everywhere—in the countries of Europe and in mission lands—Christianity finds itself in a mighty conflict with an alien type of religious belief and life. This alien type of religious belief and life appears in many different forms, and expresses itself in many different ways; but at bottom it is everywhere the same. Disparagement of doctrine, decrying of controversy, sinking of doctrinal differences in a program of peace and work, the craze for organizational unions, the “interpretation” of the Bible and of the great Christian creeds to make them mean almost their exact opposite, the substitution of vague swelling words for a clear-cut proclamation of the Cross of Christ, exaltation of experience” at the expense of God’s written Word—these are everywhere the marks of one great and deadly enemy to the Christian faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Present Situation in the Presbyterian Church,” Christianity Today</cite>, (1930).</span></figcaption>

<blockquote><p>XIII. Third, as to place, the question can be understood in two ways. It may be understood definitely concerning the certain and constant seat of the church (such as Rome is) and in that continued series of bishops or pastors which the Romanists would wish. But this is false.(a) The church of the New Testament is bound to know fixed place as in the Old, but is ambulatory and migrates from place to place, as appears from the example of the Asiatic churches spoken of in Rev. 2 and 3 And many others which have perished. (b) It Is not bound to have that succession, since it either wholly fails with the churches themselves or is changed into a succession of walls who devour the flock (Acts 20:29) Or who impiously domineer over it (2 Thess. 2:3, 4). Or it may be understood indefinitely of a seat and domicile in general, which, according to the dispensation of God, it has obtained in various places, now here and then there. XIV. In this sense, we say the true church before Luther and Zwingli was already in various assemblies separated from the Roman church, many of which, it is certain, existed both in the east and in the west. The arrogance (authadeia) and tyranny of the Roman bishop, in the corruption of doctrine as well as in the depravation of worship and innovations upon the order and government of the church, so displeased them that they not only never wished to subject themselves to him, but did not hesitate openly to oppose and turn away from him. It is well known that the Waldenses and Albigenses were particularly such. As long as they either relied upon the authority of princes or trusted to their own numbers, these could hold public assemblies and save us rendered the church visible and conspicuous, as in Bohemia, in certain parts of England and in the provinces of southern France—Aquitania, Occitania (Languedoc)—and in the Narbonne Region of France as far as the Alps. But afterword the princes, excited by the fury and arts of the Roman bishop and fascinated by a blind zeal, persecuted those pious believers with arms in order to gratify him, ejected them (wasted vicarious defeats and most cruelly treated) from their cities and natural habitations and endeavored to destroy them by fire and the sword. Then the external appearance of that part of the church was indeed so obscured that it seemed to have altogether failed. In the meantime, the monuments of history testify that a remnant of them still survived (although disbursed and scattered) in various places, especially in the pier in the end for us and the enclosed valleys at the basis of the Alps. Even this single fact would be sufficient to rebut the unjust crimination of our opponents—that we cannot show where our church was before Luther—since it is evident that those purer Christians who held the same faith with us in essentials existed in various places and have their segregated assemblies, although somewhat concealed. And since no mention is made by historians of their secession from the Roman church, it is reasonable to infer that they never had any communion with her, but always lived separated from her and had preserved pure and uncontaminated the truth handed down to them by the preaching of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.13–14.</span></figcaption>

<blockquote><p>X. Nevertheless, that we may not seem to shun the question (as if it were insoluble [alytos] by us), we can answer directly that the question puts on a fourfold relation or has reference to four things: (1) the doctrine and faith of the elect, who constitute the church; (2) their persons and condition; (3) the place where they were; (4) the form of government under which They lived and the external worship which they had. As to the first, if we treat of the Christian faith, we say the substance of the things to be believed and done in order to salvation was always in the Scriptures, in the Apostles’ Creed, in the law of God and the Lord’s Prayer, sealed by the sacraments, which by a special providence he willed to preserve always in the church for sustaining the alack, although that doctrine was frequently mixed with various errors. So that we must hear accurately distinguish the substance of faith from the corrupting accidents in doctrine and worship, in the midst of which God knew how to preserve his elect in that purity which was necessary for salvation until the age of the Reformation. XI. Second, if we trees of the persons themselves (i.e., Of the church properly so called, inasmuch as it denotes the mystical body of Christ, constituted of the elect alone), we say that it subsisted in all the elect who were from the time of the apostles, who is all ages have believed in Christ according to the publicly preached truth of the gospel, who separated the substance of saving doctrine in the public ministry from the errors repeatedly creeping in. These we are no more bound to show to them that Elijah was bound to show the 7000 men who have not bowed their knees to bail, although they were truly in Israel. XII. The condition of this church was miserable and afflicted, both because it was obscure and destitute of splendor (which was adumbrated by the woman flying into the wilderness [Rev. 12:6], small in number and reduced to great paucity, designated by the “two witnesses” [Rev. 11:3], because they were very few when compared with the multitude of those wandering in error) and because it was partly corrupt, partaking in some measure of the errors of the papacy, although it always retained the foundation of salvation and so seceded from the papacy (if not positively, yet negatively; if not in place still in faith and religion), disapproving of her errors and opposing themselves to them as far as they could.</p></blockquote>

</figure><figure class="quote" id="q-6e4d73afe0" data-kw="">
<blockquote><p>We teach and define as a divinely revealed dogma that when the Roman pontiff speaks ex cathedra, that is, when, in the exercise of his office as shepherd and teacher of all Christians, in virtue of his supreme apostolic authority, he defines a doctrine concerning faith or morals to be held by the whole church, he possesses, by the divine assistance promised to him in blessed Peter, that infallibility which the divine Redeemer willed his church to enjoy in defining doctrine concerning faith or morals. Therefore, such definitions of the Roman pontiff are of themselves, and not by the consent of the church, irreformable. So then, should anyone, which God forbid, have the temerity to reject this definition of ours: let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/first-vatican-council.html">First Vatican Council</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Session 4, July 1870</cite>, chapter 4, “On the Infallible Teaching Authority of the Roman Pontiff”</span></figcaption>

</figure><figure class="quote" id="q-455255632b" data-kw="">
<blockquote><p>Therefore St. John rejects a false and feigned faith; he demands a genuine faith which will openly confess before the world the two things it has learned, namely, that Christ is the Son of God and of Mary and that He became our Savior. If this Christian confession stands, other good works will follow. If you were a fornicator, an adulterer, or a drunkard, you will now be that no longer; for if you are redeemed from sin, you will henceforth desist from sin. Consider how you could harmonize a sinful life, greed, anger, hatred, and fornication with a claim to Christianity. No faith can exist where sin abounds. You must cease your fornication and marry; you dare not steal or bear false witness against your neighbor. If you do wallow in sin and commit adultery, unchastity, fornication, gluttony, carousing, and gambling, you are not yet redeemed from sin. For wherever sin still holds sway, there is no forgiveness of sin and no faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 22: Sermons on the Gospel of St. John: Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Saint Louis: Concordia Publishing House, 1999), 393–94.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-093d826dbf" data-kw="">
<blockquote><p>We desire all people, whom the benign influence of our clemency rules, to turn to the religion which tradition from Peter to the present day declares to have been delivered to the Romans by blessed Peter the Apostle, the religion which it is clear that the Pontiff Damasus and Peter Bishop of Alexandria, a man of apostolic holiness follow; this faith is that we should believe, in accordance with apostolic discipline and Gospel teaching, that there is one Godhead, Father, Son, and Holy Spirit, in an equal Majesty and a holy Trinity.1 We order those who follow this doctrine to receive the title of Catholic Christians, but others we judge to be mad and raving and worthy of incurring the disgrace of heretical teaching, nor are their assemblies to receive the name of churches. They are to be punished not only by Divine retribution but also by our own measures which we have decided in accordance with Divine inspiration.2 Given on the 3rd Kalends of March at Thessalonica, Gratianus and Theodosius being Consuls (February 27, 380).</p></blockquote>

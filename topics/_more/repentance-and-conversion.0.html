</figure><figure class="quote" id="q-6e62898d0e" data-kw="">
<blockquote><p>But, whereas God is said to will the thing that he commands, here ariseth a question, how that can be said to be willed by God, which most commonly is not accomplished? For, albeit the will of command is accomplished, by the commanding of this or that, yet God’s will of the thing commanded seems not to be accomplished, unless the thing willed by God be sometimes brought to pass. The truth is, your opinion seems to be, That God not only willeth the salvation of the world, upon the condition of their repentance, (for that is no more to will their salvation, than their damnation) but that God willeth and desireth their salvation absolutely, in as much as he willeth and desireth their repentance.

I confess you do not in express terms profess as much; namely, that God willeth and desireth the repentance of Reprobates; yet hitherto you seem to tend, in this discourse of yours, though concerning this you say no more than this, That God gives means to help them to the performance of this obedience, so far as is meet for him: which while you profess, I doubt you understand not your own meaning; and therefore no marvel if others do not understand it: For, how far he doth help them, you express in a very uncertain manner; which is rather to conceal, than to discover and express your meaning. But I will endeavour to bolt it out.

These means you speak of are either moral only, consisting in instructing them wherein this obedience doth consist, and urging them by persuasion thereunto; or, in affording, besides this, some efficacious operation of God’s Spirit, to work them to this obedience. Now, this latter cannot be your meaning; for if this were afforded them, their obedience, certainly, would be wrought: but the world, of whom you speak, doe never perform this obedience. Now, in granting the other, there is not so much evidence of God’s will that they shall perform this obedience, as by the denying of this we have evidence, that his will is not that they shall perform this obedience.

Again, in respect of means moral, can any be saved without the means of true faith and true repentance? I think you will not say they can: Then consider, have all men sufficient instruction unto the performance of true faith and true repentance? How will you be able to make this good? Hand over head, you say, God gives means to help them to the performance of this obedience, so far as is meet for him to do: yet, I am persuaded, you are not able to make this good, taking it according to the confuse generality wherein you express it. For, is it not meet for God to afford any Nation or particular persons his word and Gospel, as well as it is meet for him to afford it us?

Nay, is it not as meet for God to afford any other person both the outward means, and the inward efficacious operation of his holy Spirit, to work them unto faith and true repentance, as well as by these means he hath been pleased to work us hereunto? This meetness, what is it but that which Schoolmen call, Justitia condecentiae, and which they profess doth accompany every action of God? So that had God afforded the same grace to others which he hath afforded unto us, he had carried himself therein meetly, that is, justly, justitia condecentiae.

Again, had he denied the same grace to us which he hath denied unto others, he had herein also carried himself meetly, or decently, that is, justly, justitia condecentiae. I am sorry to observe from such good men’s pens such illusions to have their course, to the obscuring of the grace of God, and his sovereignty of dispensing it to whom he will.</p></blockquote>

the+grace+of+God%2C+and+his+sovereignty+of+dispensing+it+to+whom+he+will.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+treatise+of+Mr.+Cotton%E2%80%99s%2C+Clearing+certain+doubts+concerning+predestination.+Together+with+an+examination+thereof%2C+%28London%3A+Andrew+Crook%2C+1646%29%2C+pp+98-100.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e62898d0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e62898d0e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/08/william-twisse-does-god-desire-the-repentance-of-the-reprobate/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Prophets in the old Testament exhorting the rebellious Jews unto Repentance, use commonly an Hebrew verb which signifieth turn ye, or return ye &amp; come back again, by the which Metaphor is meant, that like as a man that is strayed far out of his way, must turn quite back again the contrary way: So those that have strayed from the ways of Godliness, to the way of sin, must come back again, as fast as ever they went forward, &amp; altogether change the course of their life: so that Repentance is an earnest turning unto God with all our heart, soul, and mind.

Saint John Baptist, and the Apostles in the New Testament exhorting unto Repentance, use a Greek word which signifieth a changing of the mind afterward, or afterwit, so that those which through their folly &amp; want of former wit, have slipped into the deep pit, and dangerous gulf of sin, when they come to themselves, &amp; have recovered their wits, will be wise afterward, &amp; take heed they never come there again according to the Proverb: The burnt child will take heed of the Fire.

By this time I hope you see what is repentance. It is not every sorrow, but sorrow for sin, not for some sin, but for all sin, not for an hour, but for ever, not for a day, but continually, not for a week, but as long as we live. Some think every sorrow is repentance: but so should worldlings repent. Some think every little pant for sin is repentance: so should Pharaoh repent. Some think all weeping and lamenting for sin is repentance: so should Esau, Judas &amp; Cain, repent. Some think every little humbling of our selves is repentance: but so should Ahab repent. Some think that good words, and good purposes is Repentance: but so should every sick man repent. Some think the reformation of words and deeds, is Repentance: but so should civil men repent. Some think that cry God mercy is repentance: and so should every fool repent.</p></blockquote>

</figure><figure class="quote" id="q-19f84a4aaa" data-kw="">
<blockquote><p>That repentance and faith are both essential to the attainment of eternal life. Though this has speculatively, it has not practically, been assented to by many professing Christians. Some have attached a high importance to repentance, but have at the same time almost entirely overlooked the necessity of faith. They think that if a man refrain from vicious habits, and be humane, charitable, just, and sober, he has attained the great end of all religion — he is a good man, and therefore must be held to be a good Christian; and they not unfrequently look upon and speak of those who attach a special importance to faith in Christ, as enthusiasts and visionaries, and sometimes go the length of representing them as favouring the doctrine that man may sin that grace may abound.

Others, again, have attached a high importance to faith in Christ; but at the same time have forgotten the equally high importance which belongs to repentance. They think that if a man believe the gospel, and entertain a zealous attachment to a sound creed, he must be a true Christian; and they not unfrequently look on those who insist on the necessity of repentance and good works as persons destitute of evangelical views, ignorant of the truth, attached to legal doctrine, and going about to establish their own righteousness.

Both these classes of persons proceed on erroneous principles — on partial views of the subject. The Holy Scriptures, from which alone we derive our knowledge of it, do not authorize them to give any such preference to the one grace or to the other, and far less to indulge in mutual, uncandid animadversions. A very slight acquaintance with the Scriptures may make any candid man perceive that both are equally essential, though not in the same sense.

A man without repentance, which is the principle or seed of holiness, is dead in trespasses and sins, and therefore incapable of enjoying heaven. And a man without faith, which is the uniting bond with the Saviour, is under condemnation, and has no title to the enjoyment of heaven. A well-informed Christian knows that that is truth. An experienced Christian feels that it is truth. He is not more assured that without holiness no man shall see the Lord, than that to be saved he must believe in the Lord Jesus Christ.</p></blockquote>

<blockquote><p>Thy prayers and alms. Because God seemeth to be after a sort deaf, unless he answer our petitions by and by, hence cometh that speech, that our prayers come unto him, and that he is mindful thereof. Furthermore, the angel assigneth this as the cause why God vouchsafeth to show to Cornelius the light of his gospel; because he hath heard his prayers and accepted his alms.

Whence we gather that virtues and good works do not only please God, but that they are also adorned with this excellent reward, that he heapeth upon us and enricheth us with greater gifts for their sakes; according to that, “To him that hath shall be given,” (Matthew 13:12.) And again, “Well done, good and faithful servant; thou hast been faithful in a few things, I will set thee over many things,” (Matthew 25:21.) For God doth after this sort extol his by a continual course of his gifts, as it were by certain steps, until he bring them to the top.

But the Papists abuse this place two ways; for because God respected the prayers and alms of Cornelius, so that he endued him with the faith of the gospel, they wrest that unto the preparations which they have invented, as if a man did get faith by his own industry and power, and did prevent the grace of God by the merits of works. Secondly, they gather, generally, that good works are meritorious in such sort, that the graces of God are increased in every man as he hath deserved. In the former they are too childishly deceived, whilst that they feign that the works of Cornelius were acceptable to God before he was illuminated by faith.

And we need not to fet [seek] a proof far to refute their ignorance; for he could obtain nothing by prayer unless faith went before, which only openeth the gate for us to pray; and Augustine weigheth that well and wisely, who derideth Pelagius, because he said that faith was obtained by prayers before it was in man in any measure: Who (saith he) will seek a physician save he who is already healed in some part? And it is the health of faith which teacheth us to knock. Furthermore, the fear of God and godliness do plainly prove that he was regenerate by the Spirit. For Ezekiel giveth this praise to God alone, that he frameth the hearts of men to fear him, (Ezekiel 32:40 [sic].) And Isaiah saith, that the Spirit of the fear of God resteth in Christ, (Isaiah 11:2,) that we may know that he can be found no where save only in his members. Therefore it is too great folly to feign a man in the person of Cornelius, who, having nature for his guide, can attain unto eternal life, or endeavour to come thither. Therefore they reason blockishly, that we are able to prevent the grace of God with the merits of works.

As touching the second error, when as they imagine that every one of us is increased with greater graces as he hath deserved, it may easily be refuted. First, we deny that we have any good works which God hath not freely given us; secondly, we say that the right use of gifts cometh from him also and that this is his second grace, that we use his former gifts well. Thirdly, we deny that we deserve any thing by our works, which are always lame and corrupt. Good works do indeed purchase for us the increase of grace, but not by their own desert. For they cannot be acceptable to God without pardon, which they obtain by the benefit of faith. Wherefore it is faith alone which maketh them acceptable. Thus did Cornelius obtain more perfect knowledge of Christ by his prayers and alms, but in that he had God to be favourable and merciful to his prayers and alms, that did depend upon faith.

Furthermore, if good works be esteemed [estimated] by faith, it is of mercy, and not of merit, that God doth allow [approve] them. For because faith findeth no worthy thing in us whereby we can please God, it borroweth that of Christ which we want. And this is too perverse, that though the Papists have this word merit every now and then in their mouths, and cease not to puff up fools with a vain confidence, yet they bring nothing whereby the studies of men may be moved to do well. For they leave their consciences always in a doubt, and command men to doubt whether their words please God or not. Must not men’s minds need faint when they are possessed with such fear?

But as for us, though we take merit from works, yet when as we teach that there is a reward laid up for them, we prick men forward with an excellent and sharp prick, to desire to live well. For we address ourselves then joyfully to serve God, when we are persuaded that we lose not our labour. And whereas there appeareth at this day no more plentiful abundance of the gifts of the Spirit, but that the more part doth rather wither away, we must thank our unthankfulhess for that. For as God did crown Cornelius’ prayers and alms, and holiness, with the most precious pearl of his gospel, so there is just cause why he should suffer us to starve, being brought unto hungry poverty, when as he seeth us abuse the treasure of his gospel wickedly and ungodlily.

Yet here may a question be asked, Whether faith require the knowledge of Christ, or it be content with the simple persuasion of the mercy of God? for Cornelius seemeth to have known nothing at all concerning Christ. But it may be proved by sound proofs that faith cannot be separated from Christ; for if we lay hold upon the bare majesty of God, we are rather confounded with his glory, than that we feel any taste of his goodness. Therefore, Christ must come between, that the mind of man may conceive that God is merciful. And it is not without cause that he is called the image of the invisible God, (Colossians 1:15;) because the Father offereth himself to be holden in his face alone. Moreover, seeing that he is the way, the truth, and the life, (John 14:6;) whithersoever thou goest without him, thou shalt be enwrapped on every side in errors, and death shall meet you [thee] on every side. We may easily answer concerning Cornelius.

All spiritual gifts are offered unto us in Christ; and especially whence cometh regeneration, save only because we are ingrafted into the death of Christ, our old man is crucified (Romans, 6:5, 6.) And if Cornelius were made partaker of the Spirit of Christ, there is no cause why we should think that he was altogether void of his faith; neither had he so embraced the worship of the true God, (whom the Jews alone did worship,) but that he had also heard somewhat of the promised Mediator; though the knowledge of him were obscure and entangled, yet was it some. Whosoever came at that time into Judea he was enforced to hear somewhat of the Messiah, yea, there was some fame of him spread through countries which were far off. Wherefore, Cornelius must be put in the catalogue of the old fathers, who hoped for salvation of the Redeemer before he was revealed.

And it is properly [improperly] said of Augustine, that Peter grounded his faith; whereas it had now before a firm foundation; although Augustine thinketh as we do in the thing itself, who affirmeth plainly, that Cornelius could not pray unless he had faith, in his Book of the Predestination of Saints, and other places.</p></blockquote>

<blockquote><p>I do no less heartily thank, then worthily commend in the Lord, all you that are present, who, according to your accustomed manner, are so willingly and joyfully gathered together, induced hereunto, not through any vain delight of fond novelty, but of a serious, and studious zeal of godliness, not as gazers of frivolous fantastical fables, but as willing witnesses of this great and inestimable benefit of almighty God.

Lastly, I do from the bottom of my heart rejoice in the behalf of this person, for whose cause we are as now met here together, who being transported from out the uttermost parts of Barbary into England, and conversant amongst us, by the space of six whole years, renouncing now at the last the natural contumacy of his native country, doth with so earnest bent affection of voluntary will, cheerfully desire to become a member of Jesus Christ, and to be made partaker of his holy congregation through faith, and Baptism.

And withal I most humbly beseech Almighty God, that he will not only vouchsafe his gracious increase to this glorious work begun with this Israelite stranger, but also to allure the whole remnant of the circumcised Race, by this his example, to be desirous of the same communion: So that at the length, all nations, as well Jews, as Gentiles, embracing the faith, and Sacraments of Christ Jesus, acknowledging one Shepherd, united together in one sheepfold, may with one voice, one soul, and one general agreement, glorify the only begotten son our saviour Jesus Christ, &amp; be glorified again of him.</p></blockquote>

And withal I most humbly beseech Almighty God, that he will not only vouchsafe his gracious increase to this glorious work begun with this Israelite stranger, but also to allure the whole remnant of the circumcised Race, by this his example, to be desirous of the same communion: So that at the length, all nations, as well Jews, as Gentiles, embracing the faith, and Sacraments of Christ Jesus, acknowledging one Shepherd, united together in one sheepfold, may with one voice, one soul, and one general agreement, glorify the only begotten son our saviour Jesus Christ, &amp; be glorified again of him.”

<blockquote><p>As a ground of security that we shall inherit the promises, it is not enough that we can point to a time when we were numbered amongst the members of the visible church. The believer, it is true, draws encouragement from a review of the way by which God has led him, and may legitimately infer, that “He who hath begun a good work” in him “will perform it until the day of Christ.” Yet profession may be mistaken for conversion. However highly we may have been favoured with the means of grace—however regular our attendance on these means may have been—nay, however great may have been our seeming delight in the enjoyment of them, we may never, in reality, have laid hold of Christ.

He only that “endureth to the end shall be saved.” The Lord’s people will undoubtedly be so “kept by the power of God,” as to make it manifest, at the great day, that not one of them has been lost. Yet, during the entire period of their life on earth, they will be found “running with patience the race that is set before them; forgetting the things which are behind, and reaching forth unto those things which are before,” they will be ever “pressing towards the mark for the prize of the high calling of God in Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-doig.html">Thomas Doig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Certainty of the Fulfilment of God s Threatened Judgments and Promised Mercies’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-8cce6acac0" data-kw="">
<blockquote><p>Seeing therefore that inward contrition for sin is the first step to repentance, and that which killeth the root of sin, and setteth us free from the power and dominion of it, and erecteth in our hearts a throne for Christ Jesus; the use of this point is,

First for reproof of those that persuade themselves, and bear others in hard that they have truly repented, and do continually confess their faults, and ask pardon for them: but what grief and pain have they had in their hearts for their sins? nay, they thank God, they were never terrified nor troubled in their consciences. Do you thank God for this? it is in effect to thank him for that you want the first and principal note of true conversion: if your hearts have never been pricked and slung with the sense of your vileness and wretchedness, it is because you are senseless: for there is cause sufficient why you should be grieved; and the less you have had, the more you are likely to have, if not here, yet in the world to come, and at that day when you shall be most unwilling of it.

Secondly, here are those to be reproved that run into far greater excess of sinning than ever David did, breaking forth into gross and foul evils, that every body seeth and knoweth, and condemneth, and yet they pass them over slightly, and carelessly, as if they were matters of nothing. When David did but cut off the lap of Saul’s coat, his heart smote him, and was grieved within him, in that he was so near unto sin: what then shall we think of these that do not cut off the lap of the coat of an enemy, but are injurious to their friends, and cruel against their brethren, that break covenant and promise, sin against God, blaspheme his name, profane his Sabbaths, and the like, and yet none of all these do soundly work upon them, nor much trouble them? surely such men are not of David’s spirit, and therefore not being broken hearted here, they shall be broken and crushed in pieces with the unsupportable weight of God’s vengeance hereafter.

Thirdly, sith this inward touch for sin is a thing so necessary, let us hence learn to labour for it, and to keep tenderness of heart when we have obtained it: for that sorrow which breaketh the heart, doth withal break the neck of sin: and therefore when the Lord doth check &amp; control our consciences, let us esteem it as a great mercy, and not let such strokes pass without their right use, but let us go to God and to his children for help and direction, and them that little spark of the fire of God in our souls, being fed &amp; nourished, will grow in the end to a great flame. Now that our hearts may be kept always tender &amp; sensible of those checks which God’s spirit giveth us, let us use these means that follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal</cite>, (London: William Welbie, 1611), pp 4-5.</span></figcaption>

v>

<blockquote><p>Not to trust in repentance, but after all thy humiliations still to depend only upon Christ. Though Christ died, and was crucified, yet he did not lose his strength and efficacy. This was represented in that passage of God’s providence, That a bone of his was a broken; Rely therefore upon Christ wounded for sin, not upon thy own heart that is wounded, use this, but trust only in Christ.

Dependence upon Evangelical graces doth evacuate Christ, as well as confidence in the Law. A man may not only preach the Law, and the duties thereof to the prejudice of Christ’s glory; but also the duties and graces of the Gospel. If a man relieth upon his repentance and believing, he maketh Justification and Salvation to be of works, though it be of faith; for he makes his faith a work, and gives that glory which belongs to Christ, to his own repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 164.</span></figcaption>

<blockquote><p>‘What thy hand findeth to do, do it with all thy might.’ — in whatever sphere Providence may have appointed your lot; but in so doing, never for a moment lose sight of the grand ulterior object for which the Church was originally constituted, and spiritual rights and privileges conferred, viz. the conversion of the world. By the encouragements of Scripture prophecies, — by the specific appropriation and use of Scripture petitions, — by the binding obligation of Divine commands, — you are bound to pray and to labour for the conversion of a lost world.

The amount and direction of your actual exertions in the great cause, must of necessity vary with varying abilities, and means and opportunities of usefulness, and a thousand providential contingencies; but your eye must ever be fixed on the accomplishment of the great design, as the proper terminating object. In immediate and simultaneous action you may not, you cannot, be a cosmopolite; but in spirit, and prayer, and longing, and positive appetency, a cosmopolite you may, and ought to be.</p></blockquote>

<blockquote><p>A certain levity lies at the heart of “the Keswick Movement”; its zeal is to assure ourselves that we are actually and fully saved, rather than to give ourselves to the repentance which is due to our sins, to the working out of salvation with fear and trembling, to heavenly mindedness, and a life of prayer and a walk in love.

It imagines that there can be faith without repentance and conquest of sin without moral struggle. The law, sin itself as evil desire in the regenerate, the determined fulfilment of the will of God in vital endeavour, are pushed into the background. It seeks, in a word, peace instead of righteousness, and the trail of a spiritual euthymia lies over it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Die Heiligungsbewegun in Bibliotheca Sacra</cite></span></figcaption>

</figure><figure class="quote" id="q-601138bbb8" data-kw="">
<blockquote><p>Referring to the proposition contained in the so-called “Auchterarder Creed” (condemned by the General Assembly in 1717) that subsequently gave rise to the Marrow controversy in the Church of Scotland, the younger Thomas McCrie made the following remarks:

The Presbytery of Auchterarder had refused Mr William Craig, a preacher, an extract of his licence, because, on being interrogated, he refused to subscribe the following article: — “I believe that it is not sound and orthodox to teach that we must forsake sin in order to our coming to Christ, and instating us in covenant with God.”

The article was no doubt unhappily worded. Every sinner ought surely to be taught to forsake sin, and no sinner can come to Christ but in the way of forsaking it. But the meaning of the good men of Auchterarder Presbytery was very apparent; they meant to guard against that legal strain of preaching which insists on repentance as an indispensable condition to qualify the sinner for coming to Christ. The real truth is beyond all contravention.

Repentance, which is first in the call of the gospel, is last in the obedience of the sinner; and though God begins by inviting ” the wicked to forsake his way, and the unrighteous man his thoughts,” well does he know that not one of them will move a step till the words that follow ring in his ears, and meet the response of faith, “For he will have mercy, and will abundantly pardon.” To lead the sinner directly to the Saviour, to Him who alone can “give repentance and remission of sins,” must be obviously the ultimate aim of the gospel minister, even when he calls upon him to forsake his sins.

In this lay the germ of the whole controversy that followed. We suspect this Mr William Craig must have been a mere tool in the hands of others, and an incipient legalist withal, who would soon grow up into a full-blown Arminian. Be this as it may, the Assembly, on hearing the case, held up their hands in absolute horror, and ” declared their abhorrence of the foresaid proposition as unsound and most detestable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Marrow Controversy: with Notices of the State of Scottish Theology in the beginning of the last century’, British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-6c6e943e29" data-kw="">
<blockquote><p>God is not as man, that he should repent; He is said to repent, because he doth that which men do when they repent. I will repent, That is, I will turn my judgements into mercies. God doth sometimes will a change, but he never changeth his will. God from all eternity decreed to be served in the old Testament with types and figures, and in the New-Testament, in spirit and truth. Here was a will of a change, but no change in God’s will.

When God is said to repent, the change is in us, not in God. As when the Sun softneth the wax, and hardeneth the clay; here is a different act of the Sun; but the change ariseth from the different object, not from the Sun. So God from all eternity decrees to punish the impenitent, and to bless the penitent. And when a Nation by God’s Almighty grace becomes penitent, God turns his punishments into blessings; but the change is in the Nation, not in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s looking-glass presented in a sermon preached before the Honourable House of Commons at their late solemn fast, December 22, 1641</cite>, (London: Chr. Meredith, 1642), p. 23.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“God is not as man, that he should repent; He is said to repent, because he doth that which men do when they repent. I will repent, That is, I will turn my judgements into mercies. God doth sometimes will a change, but he never changeth his will. God from all eternity decreed to be served in the old Testament with types and figures, and in the New-Testament, in spirit and truth. Here was a will of a change, but no change in God’s will.

When God is said to repent, the change is in us, not in God. As when the Sun softneth the wax, and hardeneth the clay; here is a different act of the Sun; but the change ariseth from the different object, not from the Sun. So God from all eternity decrees to punish the impenitent, and to bless the penitent. And when a Nation by God’s Almighty grace becomes penitent, God turns his punishments into blessings; but the change is in the Nation, not in God.”

— Edmund Calamy, England’s looking-glass presented in a sermon preached before the Honourable House of Commons at their late solemn fast, December 22, 1641, (London: Chr. Meredith, 1642), p. 23.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+is+not+as+man%2C+that+he+should+repent%3B+He+is+said+to+repent%2C+because+he+doth+that+which+men+do+when+they+repent.+I+will+repent%2C+That+is%2C+I+will+turn+my+judgements+into+mercies.+God+doth+sometimes+will+a+change%2C+but+he+never+changeth+his+will.+God+from+all+eternity+decreed+to+be+served+in+the+old+Testament+with+types+and+figures%2C+and+in+the+New-Testament%2C+in+spirit+and+truth.+Here+was+a+will+of+a+change%2C+but+no+change+in+God%E2%80%99s+will.%0A%0AWhen+God+is+said+to+repent%2C+the+change+is+in+us%2C+not+in+God.+As+when+the+Sun+softneth+the+wax%2C+and+hardeneth+the+clay%3B+here+is+a+different+act+of+the+Sun%3B+but+the+change+ariseth+from+the+different+object%2C+not+from+the+Sun.+So+God+from+all+eternity+decrees+to+punish+the+impenitent%2C+and+to+bless+the+penitent.+And+when+a+Nation+by+God%E2%80%99s+Almighty+grace+becomes+penitent%2C+God+turns+his+punishments+into+blessings%3B+but+the+change+is+in+the+Nation%2C+not+in+God.%E2%80%9D%0A%0A%E2%80%94+Edmund+Calamy%2C+England%E2%80%99s+looking-glass+presented+in+a+sermon+preached+before+the+Honourable+House+of+Commons+at+their+late+solemn+fast%2C+December+22%2C+1641%2C+%28London%3A+Chr.+Meredith%2C+1642%29%2C+p.+23.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c6e943e29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c6e943e29.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/19/edmund-calamy-on-divine-repentance-as-an-anthropomorphism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-29968d7c8a" data-kw="">
<blockquote><p>The first step to true and sound repentance is to be wounded and disquieted in our hearts for sin, until our souls be pierced, and as it were struck through with the feeling of our corruptions, and of God’s displeasure, due unto us for the same, we have not made any entrance into the ways of godliness, nor laid the very foundation of the works of conversion, therefore the Prophet Joel exhorting the Israelites to repentance, biddeth them, rent their hearts: that is, the first stone that must be laid in this building: their hearts must be crushed and broken, for the wickedness committed against the Majesty of God; till then there is no turning unto him: one may as well bid a prisoner that is in strong hold, and hath bolts and fetters upon his heels, walk abroad and take the fresh air, and not remain any longer in that dark &amp; loathsome dungeon, as bid one that hath not his heart crushed &amp; humbled to turn unto the Lord: alas he is held fast in the chains of Satan, and cannot stir one foot to God-ward; therefore is it noted in those converts, Act. 2. 37. that They were pricked in their hearts] when they began the work of repentance, the rebukes of God had wakened their drowsy consciences, so that they saw their sins and God’s vengeance due unto them, and the words of Peter had gone through their hearts, even as a two edged sword, and then they were fit to bee soundly healed and comforted, when they had been pierced, and thoroughly wounded by the Arrows of God.

1 First, till the heart be broken for sin, there can be no plain confession of sin, and therefore no repentance. Men naturally are like wild Ass-Colts, nothing will work upon them, nor bring them unto any good frame or order; though they hear often of their faults, they will not acknowledge them, but be still unruly and untamed, as Paul was before his conversion; so long as he was heart-whole in his own conceit, though he had heard many excellent Sermons (no doubt,) yet he was like a beast still, never bewailing nor confessing his grievous offences, till the Lord had taken him down, and thoroughly mastered him.

2 Nay further, men are so far from taking pains to come to a true acknowledgement of their iniquities, till such time as there is a breach made into their hearts by godly sorrow, they do not so much as desire to be delivered from them, nor make any reckoning of God’s mercy for the pardoning of them: till such time as they become mourners for sin, they cannot possibly hunger and thirst after righteousness. And indeed what reason is there that they should esteem of that medicine which will cure, when they do not feel themselves to be sick? they think it a matter worth the looking after, to be freed from poverty, from infamy, from the pestilence, &amp;c. but as for the corruptions of their nature, and the sinfulness of their ways, they were never much troubled with them, and therefore they make little account to be delivered from them.</p></blockquote>

<blockquote><p>Q. How is this Faith and Repentance confirmed and increased in us?

A. By three means especially.

Q. Which is the first?

A. A diligent and faithful reading of the holy Scriptures, and hearing of the same word preached, receiving it with all meekness and hearty obedience. …

Q. Which is the second?

Answ. Fervent and constant prayer unto God in the holy Ghost, both public and private according to his will. …

Q. Which is the third?

Answer. A right using and partaking of both the holy Sacraments. viz. Baptism, and the Supper of the Lord.</p></blockquote>

<blockquote><p>Nor does it follow that they were dead in the guilt of that sin of ignorance, because they never repented of it. If they did not expressly and formally repent of it, yet they sought its pardon implicitly when they sought the pardon on all sins (even of secret sins). Nor was a special repentance to be exacted of them for this act more than for the other acts of which we do not read that they repented.

Otherwise we do not read that Noah repented of his drunkenness; or Lot of incest; or others for other sins. Still we do not doubt that they obtained the pardon of all their sins from God through faith in the Messiah. If many pious persons commit numerous sins out of ignorance and error (of which they never distinctly repent), this does not prevent their seeking and obtaining the pardon of them – saying with David, “cleanse thou me from secret faults” (Ps. 19:12). Why may we not say the same of the ancient polygamists?</p></blockquote>

<blockquote><p>WHAT REPENTANCE IS.

Repentance is an inward sorrow of the mind, wrought by the Holy Ghost, for the sins to fore committed against God, joined both with a perfect faith to be forgiven for Christ’s sake, and also with a full determined purpose from henceforth to amend, and to lead a new life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), p. 506.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“WHAT REPENTANCE IS.

Repentance is an inward sorrow of the mind, wrought by the Holy Ghost, for the sins to fore committed against God, joined both with a perfect faith to be forgiven for Christ’s sake, and also with a full determined purpose from henceforth to amend, and to lead a new life.”

</figure><figure class="quote" id="q-0ef5b46ada" data-kw="">
<blockquote><p>But I am more prone to this opinion, that I should believe that Lydia, a Jewish woman, was induced with the spirit of regeneration, and had received true piety, and believed in the Messiah promised, although she did not yet know that Jesus the Son of Mary was the Christ, because he was preached to her. Such an one was the Eunuch of Candaces, and Cornelius, who, Act. 10 is called a devout man, whose prayers, and alms, and piety, was praised, before he had heard anything of Christ …

I think it were a wickedness to account these among infidels, and among the rest of the Jews, who did blaspheme Christ, and despise him preaching. Seeing therefore that Lydia was such an one, God opened her heart, that she might attend to the words of Saint Paul, and might learn from him, that Christ whom she did expect, was already come, and that those things were fulfilled, which were fore-told of him by the Prophets.</p></blockquote>

</figure><figure class="quote" id="q-7a0773e451" data-kw="">
<blockquote><p>For such is the loving-kindness of God; He never turns his face away from a sincere repentance … And after this again, Manasses, having exceeded all in fury and tyranny, and having subverted the legal form of worship, and shut up the temple, and caused the deceit of idolatry to flourish, and having become more ungodly than all who were before him, when he afterwards repented, was ranked amongst the friends of God. Now if, looking to the magnitude of his own iniquities, he had despaired of restoration and repentance, he would have missed all which he afterwards obtained: but as it was, looking to the boundlessness of God’s tender mercy instead of the enormity of his transgressions, and having broken in sunder the bonds of the devil, he rose up and contended with him, and finished the good course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exhortation to Theodore after his fall</cite>, (c. 400), 1.6 in Nicene and Post-Nicene Fathers 1, 9: 95.</span></figcaption>

</figure><figure class="quote" id="q-346770f521" data-kw="">
<blockquote><p>The beginning of hungering and thirsting after righteousness lies in the birth of conviction of sin. In fact the presence of this element in it is what distinguishes true, deep repentance from every kind of superficial regret for the secondary consequences of sin. True repentance strips sin of all that is accidental.

It resembles an inner chamber where no one and nothing else is admitted except God and the sinner and his sin. Into that chamber all the great penitents like David and Paul and Augustine and Luther have entered, and each one in the bitter anguish of his soul has borrowed the words of the psalmist: ‘Against thee, thee only have I sinned, and done this evil in thy sight, that thou mightest be justified when thou speakest, and be clear when thou judgest.’ A repentant sinner acquits God and condemns himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), p. 37.</span></figcaption>

</figure><figure class="quote" id="q-b813db9ab9" data-kw="">
<blockquote><p>In the midst of denying that Cornelius was saved while remaining a heathen, the Westminster divine Anthony Burgess pointed out that Cornelius was actually a believer in the promised Messiah. Ergo, the so-called “conversion” of Cornelius was not a revivalist conversion narrative at all. Instead, it is an example of someone during the period of transition between the Old and New Testaments coming to a realisation that Jesus of Nazareth was the promised Messiah:

I will not bring all the places they [who affirm the heathen can be saved] stand upon, that which is mainly urged is Act. 10 of Cornelius; his prayers were accepted, saith Peter, Now I perceive, &amp;.c. But this proceedeth from a mere mistake; for Cornelius had the implicit knowledge and faith of Christ, and had received the doctrine of the Messias, though he was ignorant of Christ, that individual Person. And as for that worshipping of him in every Nation, that is not understood of men abiding so, but whereas before it was limited to the Jews, now God would receive all that should come to him, of what Nation soever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), pp 80-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-0cf28b9d94" data-kw="">
<blockquote><p>Although a Gentile by birth, Cornelius, was yet a proselyte by religion. Although he could not believe that the Messiah had come and was that Jesus whom Peter preached, yet he could not believe with the Jews from the oracles of the prophets that he would come. Thus he is not to be reckoned among the Gentiles, but among the patriarchs who looked for salvation from a Redeemer not yet manifested. Hence by the advent of Peter, he did not receive a beginning, but an increase of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679-85; 3 vols, Philipsburg NJ: Presbyterian and Reformed, 1992), 1.4.19.</span></figcaption>

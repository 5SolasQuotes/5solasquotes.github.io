<blockquote><p>I. Repentance unto life is an evangelical gracea… a. Zec 12:10; Acts 11:18 II. By it a sinner… upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,a purposing and endeavoring to walk with him in all the ways of his commandments.b a. Ps 51:4; 119:128; Isa 30:22; Jer 31:18-19; Ezek 18:30-31; 36:31; Joel 2:12-13; Amos 5:15; 2 Cor 7:11 b. 2 Kings 23:25; Psa 119:6, 59, 106; Luke 1:6 III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,a which is the act of God’s free grace in Christ;b yet is it of such necessity to all sinners that none may expect pardon without it.c a. Eze 16:61-63; 36:31-32 b. Hos 14:2, 4; Rom 3:24; Eph 1:7 c. Luke 13:3, 5; Acts 17:30-31“ . . Articles 1600’s Davenant, John – section 5 in ch. 31, ‘Of the Necessity of Works to Salvation, or Justification’ in A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), pp. 299-300 Note that what Davenant says here is substantially the same as what Owen says below, with a bit of difference of some terminology. Davenant would have done better to, instead of using the term “good works” in this context, to use “a certain inherent righteousness,” similar to Goodwin below. Davenant here denies that works are efficient or meritorious causes of justification. Yet he affirms that certain inward works, or a certain inherent righteousness, is necessary as concurrent or preliminary conditions to justification, which accompany it, by way of order, not of causality; and these things “He Himself effects in us.</p></blockquote>

</figure><figure class="quote" id="q-e00340263b" data-kw="">
<blockquote><p>And here the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>

<blockquote><p>It is asked further: But since through faith the righteousness of Christ belongs to him who has been effectually called, cannot one be at least denominated righteous according to that righteousness which belongs to him through faith? I would not, indeed, completely deny that one who has been effectually called is already righteous through faith. But I would not admit that he can be called and named righteous, because the Judge’s sentence—which sentence evidently arises from some further grace—has not yet been delivered and pronounced concerning him. For it is entirely of grace that God pronounces righteous those who are already (in accordance with effectual calling) righteous through faith, and imputes to them another’s righteousness as if it were their own.</p></blockquote>

<blockquote><p>If here it be demanded which of these we do first receive, I answere that the spirit, the virtues of the Spirit, the habitual justice which is engrafted, the external justice of Jesus Christ, which is imputed: these we receice all at one and the same time; whensoever we have any of these, we haue all; they goe together. Yet since no man is justified except he believe, and no man believes except he have faith, and no man except he have received the spirit of adoption, has faith, for asmuch as they do necessarily infer justification, and justification does of necessity presuppose them: we must needs hold that imputed righteousness, in dignity being the chiefest, is notwithstanding in order the last of all these: but actual righteousness, which is the righteousness of good works, succeeds all, follows after all, both in order and time. Which being attentively marked, shows plainly how the faith of true believers cannot be divorced from hope and love; how faith is a part of sanctification, and yet unto justification necessary; how faith is perfected by good works, and no work of ours without faith;</p></blockquote>

<blockquote><p>…those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christs sake.</p></blockquote>

</figure><figure class="quote" id="q-537ed3534c" data-kw="">
<blockquote><p>The third place is that, Rom. 8:30, ‘Whom God hath predestinated, these He hath called, whom called, justified; whom justified, glorified.’… That sanctification is here comprised in the word ‘vocation.’ For whereas the links of this golden chain are inseparable, and all those that are called must needs be justified and glorified: by ‘vocation,’ must here be meant that calling which is inward and effectual, not that alone which is outward by the external ministry of the Word. For all that are thus called, be not justified, as is apparent; and again, some, as infants, are justified that are not capable of such a [external] calling. But now, wherein stands the inward vocation of a sinner? Is it not in the infusion of inherent sanctifying grace, enlightning his eyes, opening his ear, changing his heart, turning him from darkeness to light, from the power of Satan to the obedience of God; in a word, in the renovation of his faculties? Which, what is it else but sanctification? or regeneration? or conversion? Only styled by that tearm of ‘vocation’ in regard of the means whereby it is ordinarily effected (that is) the preaching of the Word. He must needs coin us some new mystery in divinity who will persuade us that some other work of grace is meant by ‘vocation,’ and not that of sanctification. Therefore we have neither one link snapped out, nor two shuffled together in this chain of our salvation: But four, as distinct, as undividable: Election, Sanctification (whereto we are called by the Gospel preached, 2 Thess. 2:14), Justification by Faith (which is a fruit of sanctification) and Glorification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … (Oxford, 1625) | section 1, ch. 2, pp. 11-12</span></figcaption>

</figure><figure class="quote" id="q-a4ee6cd852" data-kw="">
<blockquote><p>Faith sanctifies not as a cause, but as a part of infused grace: and such a part as goes not alone, but accompanied with all other graces of love, fear, zeal, hope, repentance, etc., inasmuch as man’s regeneration is not the infusion of one, but of the habit of all graces. Again, tis not the virtue of faith that justifies us; The grace of justification is from God; He works it: but tis our faith applies it and makes it ours. The act of justification is God’s mere work; but our faith only brings us the benefit and assurance of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … (Oxford, 1625) | section 2, ch. 3, p. 49</span></figcaption>

</figure><figure class="quote" id="q-55961cc683" data-kw="">
<blockquote><p>Now to make application of this to our inquiry touching the original of faith, you may perceive by what is spoken, whereof faith is a part, and when faith is wrought in the soule: namely, that faith is a part of our sanctification, that faith is wrought in the soul then when we are regenerate by the infusion of the habit [inward power] of grace into our whole man. This will appear if we distinguish between:

1. The habit of faith, which is in general the renewed quality of the soul, whereby it is made able to discern and yield assent unto, and also willing to put affiance in all divine truth revealed.

2. The act of faith, when the understanding and will do actually know and rely upon God’s truth and goodness. This is a fruit of the former, and follows it in time; the former is a branch of the image of God restored unto us, a stream of the common fountain of sanctification, whence all graces flow, a part of our inherent righteousness, as is most apparant: It being impossible that the understanding and will of man should be effectually inclined towards their spiritual and supernatural object, to give credence and put confidence in it, until such time as they be first rectified by grace and purged from their habitual inbred blindness and rebellion: Which change when it is wrought in the soul by the Spirit of grace, sanctifying and quickening it in all the powers thereof with spiritual life: then follow those living actions of faith, hope, love, etc. performed by the strength of inherent and assisting grace. Wherefore we are not to imagine that faith is infused either before or without other graces, or that the soul is not at the same time and as soon disposed to love and fear God as to believe in Him, or to humility, to patience, to charity, to repentance, as for faith. The seed of all these graces is sown at once; and for their habits they are coeval stems of one common root of inherent sanctity: though yet some of them shoot up faster and bear fruit sooner than other. … Hence this conclusion is to be observed:

1. That faith properly is not the root of all other graces, nor the first degree of our sanctification and spiritual life. Take faith in which sense we please, for the act or for the habit: If for the act, the habit [inward power] is before that, and the root of it; If for the habit, that is not before, but a part of our sanctification, nor yet a solitary habit infused alone by itself, but together with the actus primi [first act], or habits of all supernatural graces whatsoever. Tis true in some sense that before faith, there is no life nor sanctity in the soul: because faith is a part of our life of grace and of sanctity. But there are other parts too, hope, charity, etc. and of these it may be said as well as of faith, there’s no grace in the soul till hope and charity be wrought in it. All are parts of our spiritual life wrought together. For as the corporal, so the spiritual life is not one distinct, but omnes actus primi, of every faculty whereby it can work regularly. And though in the body some part may live alone, and others be dead, yet in our spiritual life tis far otherwise, all powers are quickened and live together: where the habit of one grace is, there are all, and as soon all, as one, every faculty being rectified as well as any: and all the operations of each faculty tending to all its objects, renewed as well as any one operation directed to some one object. Wherefore I see not, under correction of quick eyes, how faith can be accounted the root whence spring all other fruits of righteousness, the efficient cause of our sanctification, the only pipe through which the waters of life flow into the soul, that firstborn grace in our spiritual regeneration, so much that before its actual operation there is no jot of spiritual life and sanctity in our hearts. Many divine eulogies are given to faith in the Scriptures, but none such as to cause us to make it the fountain of all graces. That the heart is regenerate before the act of believing and other graces wrought therein, together with the habit of faith, may appear by these reasons:

1. It is the true and general doctrine of all divines, that actual faith is never wrought in the soul till, besides the supernatural illumination of the understanding, the will be also changed and freed in part from its natural perversness: For till this be done, tis utterly impossible it should ever embrace the promise. Now the doing away of this ignorance and rebellion, what is it but an effect of the grace of sanctification implanted in the soul, by which it is sweetly and freely inclined to all heavenly things?

2. To believe is an action of a man living by grace, not dead in sin. The soul therefore is first endued with the life of grace before it can perform this living action.

3. There can be no reason given why in our regeneration it should be necessary first to have faith before we can have any other grace of sanctification, no more than that it should be needful to have some other grace before we can have faith; or, why we are more fit being unconverted to receive the grace of faith rather than any other grace, as of repentance, etc. A man unregenerate, having no preparations at all to any grace, is alike disposed to receive every one: and so there is no difference on man’s part. If any say that the Spirit, which must work other graces, is not received till we do actually believe: in so saying he confutes himself, it being most apparant that the Spirit is given to men incredulous [unbelieving], to the end to make them believers: and no man should ever be converted were not the Holy Ghost given to him whilst he is unconverted, to work his conversion. Now God, that for Christ’s sake gives faith unto us when we had none, without any predisposition in us to receive it, can and does for the same Christ’s sake give us all other graces as well at the same time.

4. It cannot well be shown how faith produces all other virtues in us, seeing that all habits of grace are infused, not acquired; and one habit cannot produce another, nor does one habit bring forth the operations of another. Tis true that faith lends a hand to help forward all gracious actions, and does much in their guidance and direction; but tis like as the understanding guides the actions of the will and inferiour faculties, or as prudence moderates the actions of all other moral virtues; which actions notwithstanding come from their proper faculties and habits as their immediate principia and fountains. But of this point more at large when we come to show the dependance that obedience has upon faith. Against this may be objected that: We live by faith, Gal. 2:20, that by faith Christ dwells in our hearts, Eph. 3:17, that through faith we are risen with Christ, Col. 2:12, that by faith we receive the Holy Ghost, Jn. 7:38-39; Eph. 1:13, so that we have no life till we be in Christ, no being in Him till we have faith to believe on Him, no sap from the vine, no virtue from the body till we be united as branches, as members, which union is by faith only; no Spirit of grace to give us life till we have faith to receive it. In briefe thus: Christ by his Spirit is the author of all our spiritual life and sanctification. But till we believe we have no participation nor fellowship with Christ and his Spirit. Therefore till we believe we have in us no life at all, and consequently by faith we are made partakers of all life and grace. To which I answer: We must carefully distinguish between a twofold union and communion we have with Christ:

1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body.

2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God. The places alleged either touch not our sanctification at all, or speak only of the increase of grace, not of its first infusion, faith being a means of that, but no efficient or instrument of this.</p></blockquote>

nly+pipe+through+which+the+waters+of+life+flow+into+the+soul%2C+that+firstborn+grace+in+our+spiritual+regeneration%2C+so+much+that+before+its+actual+operation+there+is+no+jot+of+spiritual+life+and+sanctity+in+our+hearts.+Many+divine+eulogies+are+given+to+faith+in+the+Scriptures%2C+but+none+such+as+to+cause+us+to+make+it+the+fountain+of+all+graces.+That+the+heart+is+regenerate+before+the+act+of+believing+and+other+graces+wrought+therein%2C+together+with+the+habit+of+faith%2C+may+appear+by+these+reasons%3A+1.+It+is+the+true+and+general+doctrine+of+all+divines%2C+that+actual+faith+is+never+wrought+in+the+soul+till%2C+besides+the+supernatural+illumination+of+the+understanding%2C+the+will+be+also+changed+and+freed+in+part+from+its+natural+perversness%3A+For+till+this+be+done%2C+tis+utterly+impossible+it+should+ever+embrace+the+promise.+Now+the+doing+away+of+this+ignorance+and+rebellion%2C+what+is+it+but+an+effect+of+the+grace+of+sanctification+implanted+in+the+soul%2C+by+which+it+is+sweetly+and+freely+inclined+to+all+heavenly+things%3F+2.+To+believe+is+an+action+of+a+man+living+by+grace%2C+not+dead+in+sin.+The+soul+therefore+is+first+endued+with+the+life+of+grace+before+it+can+perform+this+living+action.+3.+There+can+be+no+reason+given+why+in+our+regeneration+it+should+be+necessary+first+to+have+faith+before+we+can+have+any+other+grace+of+sanctification%2C+no+more+than+that+it+should+be+needful+to+have+some+other+grace+before+we+can+have+faith%3B+or%2C+why+we+are+more+fit+being+unconverted+to+receive+the+grace+of+faith+rather+than+any+other+grace%2C+as+of+repentance%2C+etc.+A+man+unregenerate%2C+having+no+preparations+at+all+to+any+grace%2C+is+alike+disposed+to+receive+every+one%3A+and+so+there+is+no+difference+on+man%E2%80%99s+part.+If+any+say+that+the+Spirit%2C+which+must+work+other+graces%2C+is+not+received+till+we+do+actually+believe%3A+in+so+saying+he+confutes+himself%2C+it+being+most+apparant+that+the+Spirit+is+given+to+men+incredulous+%5Bunbelieving%5D%2C+to+the+end+to+make+them+believers%3A+and+no+man+should+ever+be+converted+were+not+the+Holy+Ghost+given+to+him+whilst+he+is+unconverted%2C+to+work+his+conversion.+Now+God%2C+that+for+Christ%E2%80%99s+sake+gives+faith+unto+us+when+we+had+none%2C+without+any+predisposition+in+us+to+receive+it%2C+can+and+does+for+the+same+Christ%E2%80%99s+sake+give+us+all+other+graces+as+well+at+the+same+time.+4.+It+cannot+well+be+shown+how+faith+produces+all+other+virtues+in+us%2C+seeing+that+all+habits+of+grace+are+infused%2C+not+acquired%3B+and+one+habit+cannot+produce+another%2C+nor+does+one+habit+bring+forth+the+operations+of+another.+Tis+true+that+faith+lends+a+hand+to+help+forward+all+gracious+actions%2C+and+does+much+in+their+guidance+and+direction%3B+but+tis+like+as+the+understanding+guides+the+actions+of+the+will+and+inferiour+faculties%2C+or+as+prudence+moderates+the+actions+of+all+other+moral+virtues%3B+which+actions+notwithstanding+come+from+their+proper+faculties+and+habits+as+their+immediate+principia+and+fountains.+But+of+this+point+more+at+large+when+we+come+to+show+the+dependance+that+obedience+has+upon+faith.+Against+this+may+be+objected+that%3A+We+live+by+faith%2C+Gal.+2%3A20%2C+that+by+faith+Christ+dwells+in+our+hearts%2C+Eph.+3%3A17%2C+that+through+faith+we+are+risen+with+Christ%2C+Col.+2%3A12%2C+that+by+faith+we+receive+the+Holy+Ghost%2C+Jn.+7%3A38-39%3B+Eph.+1%3A13%2C+so+that+we+have+no+life+till+we+be+in+Christ%2C+no+being+in+Him+till+we+have+faith+to+believe+on+Him%2C+no+sap+from+the+vine%2C+no+virtue+from+the+body+till+we+be+united+as+branches%2C+as+members%2C+which+union+is+by+faith+only%3B+no+Spirit+of+grace+to+give+us+life+till+we+have+faith+to+receive+it.+In+briefe+thus%3A+Christ+by+his+Spirit+is+the+author+of+all+our+spiritual+life+and+sanctification.+But+till+we+believe+we+have+no+participation+nor+fellowship+with+Christ+and+his+Spirit.+Therefore+till+we+believe+we+have+in+us+no+life+at+all%2C+and+consequently+by+faith+we+are+made+partakers+of+all+life+and+grace.+To+which+I+answer%3A+We+must+carefully+distinguish+between+a+twofold+union+and+communion+we+have+with+Christ%3A+1.+By+the+Spirit+on+his+part%3A+for+Christ+as+by+his+death%2C+he+is+the+meritorious+cause+of+life+and+grace+unto+the+elect%2C+so+by+his+Spirit+He+is+the+only+efficient+of+life+and+grace+in+the+regenerate.+To+whom%2C+whilst+they+are+yet+dead+in+sin+and+destitute+of+all+grace%2C+so+as+they+neither+do+nor+possibly+can+believe%2C+Christ+sends+his+Spirit+which+breathes+life+into+them%2C+changes+and+purifies+their+nature+by+working+all+holy+and+rectified+abilities+in+every+part.+Now+this+first+work+of+the+Spirit%2C+creating+of+grace+in+the+soul%2C+does+most+apparantly+precede+not+only+the+act+of+believing%2C+but+the+habit+also%3A+for+the+habit+itself+is+infused+by+this+work.+And+therefore+it+is+also+manifest+that+before+all+faith+we+have+and+must+have+some+participation+with+Christ%2C+even+to+this+end+that+we+may+have+faith.+But+this+union+with+Him+is+wrought+merely+by+the+Holy+Spirit%2C+which+is+that+band+whereby+Christ+knits+Himself+to+us%2C+communicating+all+gracious+and+quickening+virtue+from+Himself+to+us%2C+and+thereby+making+us+living+members+of+his+body.+2.+By+our+faith+on+our+parts%3A+when+being+quickened+by+infused+grace+we+actually+apply+ourselves+to+embrace+the+promise+and+to+rely+upon+Christ+only.+And+here+we+knit+ourselves+to+Christ%2C+resting+upon+Him+alone+for+all+comfort.+By+which+uniting+of+ourselves+to+Christ+we+receive+a+greater+increase+and+larger+measure+of+grace+from+Him.+In+the+first+union+we+were+insensible+of+it%2C+and+grace+is+given+to+us+non+petentibus%2C+that+asked+not+after+it%3A+in+this+second+union+we+are+most+sensible+of+its+comfort+and+benefit%3B+and+here+an+augmentation+of+grace+is+bestowed+on+us+petentes%2C+earnestly+suing+for+it%2C+and+by+faith+expecting+the+receiving+of+it.+Wherefore+I+conclude%2C+all+grace+and+virtue+whatsoever+in+us+is+given+us+from+the+fulness+of+Christ%2C+the+fountain+of+all+supernatural+life%3B+but+yet+all+is+not+wrought+by+Christ+embraced+by+our+faith%2C+but+by+Christ+conveying+his+grace+unto+us+by+his+Spirit.+This+first+quickens+us%3A+we+then+with+Lazarus+after+life+put+into+us%2C+can+awake%2C+stand+up%2C+come+forth%2C+and+by+faith+look+on+Him+that+raised+us%2C+fall+down%2C+worship+and+believe+in+Him+as+our+Lord+and+God.+The+places+alleged+either+touch+not+our+sanctification+at+all%2C+or+speak+only+of+the+increase+of+grace%2C+not+of+its+first+infusion%2C+faith+being+a+means+of+that%2C+but+no+efficient+or+instrument+of+this.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%2C+%E2%80%A6+%28London%3A+1627%29%2C+pp.+11-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55961cc683.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55961cc683.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=Now%20to%20make%20application%20of%20this,no%20efficient%20or%20instrument%20of%20this&amp;text=Now%20to%20make%20application%20of%20this%20to%20our&amp;text=that%2C%20but%20no%20efficient%20or%20instrument%20of%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cf04129731" data-kw="">
<blockquote><p>4… More rightly, therefore, do other Protestants, who are more sound and moderate, willingly concede that various disposing and preparing acts, produced in us through the Holy Ghost assisting, and not by the sole powers of our free-will, are required before justification, though most of them deny to these acts any power of justifying. (Pareus contra Bellarmine on Justification, bk. 1, ch. 3, p. 35, sect. secundo tenendum ff.; with many others)

5. Although not everything which has been said and written, and is commonly cited by Romanists and others for each of these disposing acts (e.g. ‘We are saved by hope,’ [Rom. 8:24] ‘Her sins, which are many, are forgiven, for she loved much,’ [Lk. 7:47] and some others), fully proves the point in question, yet they greatly err who, on that account, deny the thing itself, which is most certain from innumerable other passages of Scripture.

6. All Protestants rightly deny that these disposing acts done by faith and preventing grace, merit justification in any way, even in that of congruity; but very many Romanists also deny this, in opposition to the opinion of Bellarmine…</p></blockquote>

<blockquote><p>And what needs it also that we should speak of the power of prayer, by which we, with the publican, and all other pious persons, do humbly beg from God pardon of our sins, in order to obtain the same, having been so taught by our Savior Himself, ‘Forgive us our sins,’ or of that of other previous acts–since the matter is clearer than the noon-day sun. Nor does this interfere with our being justified gratis, as the Scripture teaches, for in these we put nothing at all of merit, any more than in faith itself… Amandus Polanus, a writer rigid in other respects, yet compelled by the force of truth, lays down this thesis, as the universal opinion of all Protestants, and very agreeable to the teaching of the Fathers. ‘By repentance, confession, prayers, and tears, proceeding from faith, we obtain forgiveness of sins, but we do not, properly speaking, merit it; and therefore we obtain forgiveness of sins, not by the merit of our penitence and prayer, but by the mercy and benignity of God.’ (Catholic Symphony, ch. 27, On the Remission of Sins, p. 951 ff., thesis 2) Which thesis, after a sufficiently sound elucidation, he confirms by some very clear testimonies of the Fathers, to which we could add numberless others, were not the thing itself most clear and certain. Would that all Protestants constantly professed this opinion, thus enunciated by Polanus: for there would remain scarce any matter for controversy regarding this article among the more right-thinking of both sides.</p></blockquote>

<blockquote><p>Whether some movement of free choice and faith is required? It is affirmed with a distinction. Whether a movement of free choice contra sin? It is disintinguished. Whether the remission of sins is to number the premises and prerequisites of justification? It is denied. Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished. … Whether it [justification] precedes repentance? It is distinguished. … Whether and in what way the law and penitence are able to be said to concur unto our justification? It is explained.</p></blockquote>

<blockquote><p>So that we may conclude from this passage of holy writ [Gen. 15:6], that Abraham was justified by faith alone: but this his faith, though alone in the act of justification, no other grace co-working with it, was not alone in existence, did not lie dead in him as a dormant and idle quality. Saving faith is lively and operative, attended with every other grace of the Spirit, setting them upon their work, animating and quickening them thereto, and regulating them therein. It stirs up sorrow for sin, and purpose of amendment; it raises the soul earnestly to long after, and heartily to crave mercy: it comes to Christ as a humble, poor, penitent petitioner for forgiveness: but that which is done by faith stirring up sorrow, and working by prayer, is not done partly by faith, partly by sorrow, and partly by prayers, but by that faith which does enforce to pray. For faith leans upon the promise, and no promise is made, the condition of prayer being shut forth. ‘Ask, and it shall be given you,’ Mk. 11.24. Therefore our Savior Christ being entreated of many that He would heal them, attributes all the force of their prayers to faith, ‘Thy faith has saved thee.’ And so by what faith Abraham embraced the promise, by the same he offered up his son Isaac [Gen. 22]. Works then (or a purpose to walk with God) justify (Jm. 2:22-23) as the passive qualification of the subject capable of justification, or as the qualification of that faith that justifies; or as they testify or give proof that faith is lively: but faith alone justifies, as it embraces the promise of free forgiveness in Jesus Christ. Abraham’s faith was accepted for righteousness, but Abraham himself is commanded to walk before God, and to be perfect (Gen. 17:1). There are diverse phrases in the Scripture of the Old Testament, expressing the same thing for substance: As to walk before God, Gen. 17:1, Septuagint: [Greek]; and 24:40; and 48:15; 1 Kn. 3:6, Septuagint: [Greek]; Ps. 116:9; Isa. 38:3; Ps. 56:14; 1 Kn. 9:4: to walk with God, Gen. 5:22 and 6:9; Mal. 2:6; Mic. 6:8: to walk after God, 2 Kn. 23:3; Hos. 11:10: to walk in the name of God, Zech. 10:12: to walk in the ways of God, 1 Kn. 3:14; Dt. 10:12–14: wholly to follow after the Lord, i.e. to exhibit full obedience to the Lord, Num. 32:12; Dt. 1:36; Josh. 14:14: to stand in the sight of God, 1 Kn. 17:1: to walk in the light of the Lord, Isa. 2:5: to walk in equity, Isa. 57:2: to walk in truth, in judgment and uprightness, 1 Kn. 2.4, and 3:6; 2 Kn. 20:6. The two first phrases of walking with God and before God, the Septuagint interpreters do most commonly render, ‘to please God’; though now and then they retain the phrase of walking with or before God, or walking after God: and the apostle seems to have respect unto their translation when he does so allege it, Heb. 11:5, ‘for he is reported to have pleased God.’ In the New Testament there are phrases that import the same thing for substance: As to walk in the truth, 2 Jn. 4: to walk in all the commandments, statutes and ordinances of the Lord, Lk. 1:6: to walk worthy of the Lord, that is, as becomes the sons of God, 1 Thess. 2:12; Eph. 4:2: and to please Him in all things, Col. 1:10: to walk in Christ, Col. 2:6, that is to do all after the rule and command of Christ, and set before our eyes his glory, as the white we shoot at in all affairs great and small. To walk with or before God then is to commit ourselves wholly to his care and divine protection both in life and all our actions, and assuredly to persuade ourselves that He is the present and just beholder of all thoughts, words and actions; to reverence Him as ever present and beholding all things; to be ready at his beck and command, studiously, readily, cheerfully to receive his commandments, and at all times reverently to demean and carry ourselves before Him: to turn our eyes and fix all our senses upon the Lord, and to attribute whatever good we enjoy to the Lord alone. In brief, to walk before God is from a true and sincere heart to believe, think and do whatsoever God prescribes, and that in such manner as He prescribes; to attend upon the pure worship of God, and to live holily, justly, unblameably: as they are said to be just before God, who are truly and sincerely just, or such as are righteous by way of eminency in comparison of others: what is done sincerely and excellently is said to be done before the Lord, 1 Thess. 1:3; Lk. 1.75; 1 Thess. 3:13. Thus Abraham was commanded, and by the grace of God enabled to walk with or before God, Gen. 24.40, and 48.15.</p></blockquote>

<blockquote><p>Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed</cite>, (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), pp. 9-10 Note, according to Westminster, “purposing and endeavoring to walk with him in all the ways of his commandments” is part of the definition of repentance; WCF 15.2.</span></figcaption>

<blockquote><p>…pardon of sin and salvation are propounded and preached upon condition of faith, repentance and newness of life, which are the conditions of the gospel; and yet may they also be so termed, as conditions of peace, upon agreement unto, and performance whereof, peace may be had (Lk. 14:31), which otherwherewise cannot be obtained. Only sir, I shall endeavour by help of logic out of Scripture thus to justify the use of that term: That which is so propounded as that being performed, life and salvation may undoubtedly be attained and without which it cannot be had, may well be termed a condition. But such are the things before mentioned. They may therefore justly be termed conditions.</p></blockquote>

</figure><figure class="quote" id="q-5b7beba402" data-kw="">
<blockquote><p>As for repentance and new obedience; there is as much difference between them and faith, in regard of its peculiar office, in this latter [New] Covenant; so much more between them and works in the former [Old Covenant]. 1. Between them and faith, in the point of justification, or the discharge of a sinner from the guilt of his sins; for that, howsoever they are both required as conditions to be necessarily performed by all those that expect life, or pardon of sin, and salvation by Christ; yet neither of them comes in, as having any hand in the business of our justification, or discharge of us from the guilt of our sin; because that neither do they cast ought in toward the discharge of our debt, nor have they any peculiar act in the application of, or special relation unto, that whereby our debt is discharged. Whereas our faith, though it afford not the least mite of itself toward the making up of that price wherewith our debt is to be discharged, yet it is that whereby we receive Jesus Christ (Jn. 1:12) and in Him and with Him the price by Him paid for us, and whereby we trust to Him and rely upon Him for the discharge of our debt by the merit of his sufferings: in regard whereof it is called, as ‘faith on Christ’ (Acts 20:21; 26:18), so more specially, on his blood. (Rom. 3:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance</cite>, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 47</span></figcaption>

</figure><figure class="quote" id="q-c3e7b5faa7" data-kw="">
<blockquote><p>4. For to your first demand, ‘Is this free grace?’ I shall crave leave to return you a counter-demand: Suppose a king be content at the suit either of the parties themselves or some friend of theirs, to grant his gracious pardon to a company of notorious rebels that had risen against him, set up some base desperate rogue in his room, done him all the despight and mischeif they were able to do; and being apprehended, arraigned and condemned to such death as by their wicked demerits they had most justly deserved, upon condition that they aknowledge their offence and their sorrow for it, with purpose and promise of living loyally for time to come; whether you would deem this to be free grace, or no? …refer it to any indifferent reader whatsoever to determine, whether he were not a most ungracious wretch, that having his pardon on such terms granted and signed him, should in regard of those conditions, deny it to be of free grace: and whether they do not blaspheme God’s free-grace that deny it to be free grace, if it be propounded on terms of belief, repentance and amendement of life. Sir, whatsoever you say of us, take heed how you tell Christ that He does not freely save you if He will not save you unless you believe.</p></blockquote>

</figure><figure class="quote" id="q-27d9c0a649" data-kw="">
<blockquote><p>If the Gospel propound and promise pardon of sin and salvation without any condition at all required on our part, and on all such conditions and qualifications, of belief, repentance and new obedience, destroy the freeness of grace, then neither Christ, nor John Baptist, nor the apostles preached Gospel or free grace; for they thus preached and propounded pardon of sin and salvation upon such terms from the first to the last.</p></blockquote>

<blockquote><p>…Libertines, who deny that justification, the Covenant of Grace and salvation have any the most gracious conditions in us; for that should obscure the freedom of Grace (they say)… But I hope faith is a work of free grace, and must presuppose conversion and a new heart as an essential condition, else with Pelagians they must say that out of the principles of nature all are to believe; and this obscures far more the freedom of the grace of God working faith in us than all the conditions of grace, which we hold to be subservient, not contrary to the freedom of grace.</p></blockquote>

</figure><figure class="quote" id="q-d54f60b6ea" data-kw="">
<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ the Lord our Righteousness</cite>, … (London, 1669), pp. 155-56</span></figcaption>

<blockquote><p>Justification and Sanctification agree in their foundation, which is at least inchoate, and initial holiness. For, though no man’s inherent holiness arises so high as to denominate him truly just, or holy, for its own sake; yet both to Sanctification and Justification, is necessarily required some preparatory and imperfect holiness, consisting principally in the conversion of the mind to God, from sin… But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2) … Lastly, to search no farther into this point, before justification there must of necessity go some degree of sanctification, even in the opinion of such as contend most rigorously for freeness of justification:</p></blockquote>

</figure><figure class="quote" id="q-58623a42cd" data-kw="">
<blockquote><p>All this while we have treated of the complex notion of faith; or at least, as it is that first general grace whereby we are inserted into Christ, and justified by it together with its blessed retinue of subordinate evangelical graces, which are reduced to these three, Faith, Hope and Charity: where faith stands by itself, and is a peculiar grace of itself, and has in this acceptation a more than common prerogative attributed unto it in order to our justification, or the bringing us to Christ, and partaking of Christ. For that is it whereby we are only properly justified; and all graces serve for no other end here, than to adapt us for the benefit of justification through Christ, and for Christ’s sake alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 20, p. 73</span></figcaption>

<blockquote><p>XXX. Indeed, when we say that faith alone justifies, we do not even mean by that merely the act of believing taken precisely, as it is opposed to acts of love and hope, and is distinguished from repentance, or penitence, as being the condition demanded by the new covenant, or Gospel, for us to obtain the remission of our sins and to be absolved from them because of Christ. For just as the hope of pardon and the love of God, as well as sorrow for sin and the purpose of leading a new life, and, in a word, all the acts necessary for true and sincere conversion, are also required, so they are necessary and altogether prerequisite so that anyone may be received into favor by God and may be regarded by Him as justified. Indeed, that living and operative faith which we affirm justifies alone includes and involves all these acts. XXXI. And just as Scripture frequently asserts that we obtain the remission of sins through faith, so, no less frequently and expressly, does it teach that repentance and the entire conversion of the sinner to God are conditions without which the remission of sins cannot be obtained from God, and which, no less than faith, are required beforehand for it, although it neither effects nor merits it. To this belongs Solomon’s saying, already cited before, “He who hides his sins will not prosper, but he who confesses and forsakes them will obtain mercy.” And what Christ says in Luke, “Unless you repent, you will all likewise perish.” Hence it is that Peter thus exhorts the Jews, “Repent and be baptized every one of you in the name of Jesus Christ for the remission of your sins,” Acts 2:38. And, “Repent, therefore, and turn again, that your sins may be blotted out,” Acts 3:19. … LII. From what has now been explained, it is clear that the doctors of both the Roman and Reformed Schools recognize by common consent: …

2. That only living faith justifies, while dead faith contributes nothing to justice and salvation.

3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice.

4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God.

5. That it is fitting and suitable to divine goodness and wisdom to remit sins and grant the grace of the Holy Spirit to a sinner who sincerely repents and flees to God’s mercy by faith, but not to the unbelieving and impenitent.

6. That the new justice which the Holy Spirit creates in the faithful consists not only of the habit of faith but also of other Christian virtues.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXX. Indeed, when we say that faith alone justifies, we do not even mean by that merely the act of believing taken precisely, as it is opposed to acts of love and hope, and is distinguished from repentance, or penitence, as being the condition demanded by the new covenant, or Gospel, for us to obtain the remission of our sins and to be absolved from them because of Christ. For just as the hope of pardon and the love of God, as well as sorrow for sin and the purpose of leading a new life, and, in a word, all the acts necessary for true and sincere conversion, are also required, so they are necessary and altogether prerequisite so that anyone may be received into favor by God and may be regarded by Him as justified. Indeed, that living and operative faith which we affirm justifies alone includes and involves all these acts. XXXI. And just as Scripture frequently asserts that we obtain the remission of sins through faith, so, no less frequently and expressly, does it teach that repentance and the entire conversion of the sinner to God are conditions without which the remission of sins cannot be obtained from God, and which, no less than faith, are required beforehand for it, although it neither effects nor merits it. To this belongs Solomon’s saying, already cited before, “He who hides his sins will not prosper, but he who confesses and forsakes them will obtain mercy.” And what Christ says in Luke, “Unless you repent, you will all likewise perish.” Hence it is that Peter thus exhorts the Jews, “Repent and be baptized every one of you in the name of Jesus Christ for the remission of your sins,” Acts 2:38. And, “Repent, therefore, and turn again, that your sins may be blotted out,” Acts 3:19. … LII. From what has now been explained, it is clear that the doctors of both the Roman and Reformed Schools recognize by common consent: …

2. That only living faith justifies, while dead faith contributes nothing to justice and salvation.

3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice.

4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God.

<blockquote><p>(6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification, and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>

<blockquote><p>VI. (3) The question is not whether solitary faith (i.e. separated from the other virtues) justifies (which we grant could not easily be the case, since it is not even true and living faith); but whether it “alone” (sola) concurs to the act of justification (which we assert); as the eye alone sees, but not when torn out of the body. Thus the particle “alone” (sola) does not determine the subject, but the predicate (i.e., “faith only does not justify [sola fides non justificat], but “faith justifies alone” [fides justificat sola]). The coexistence of love in him who is justified is not denied; but its coefficiency or cooperation in justification is denied. (4) The question is not whether the faith “which justifies” (quae justificat) works by love (for otherwise it would not be living but dead); rather the question is rather faith “by which it justifies” (qua justificat) or in the act itself of justification, is to be considered under such a relation (schesei) (which we deny). …

XIII. It is one thing for love and works to be required in the person who is justified (which we grant); another in the act itself or causality of justification (which we deny). If works are required as concomitants of faith, they are not on that account determined to be causes of justification with faith or to do the very thing which faith does in the matter.

XIV. Although the whole force of justifying on the part of man is in faith as to the act of apprehension (so that other virtues contribute nothing to it with faith), it does not follow that faith can justify when they are absent as well as when they are present–yea, even wehn the opposite vices are present. It is one thing to justify without virtues (i.e., separated from them–which we deny); another for it to justify alone, but not separated from them. As it does not follow, the hand alone writes and the eye alone sees–therefore [it does this] as much when torn from the head and the other members as [it does when it is] in the body; the sole force of respiration is in the lungs–therefore the lungs can respire torn out from the liver and other viscera as well as when connected to them (which everyone sees to be absurd). Natural potencies are connected as to existence, but disjoined as to operation. Light and heat in the sun are most closely connected together, but still the light alone illuminates, the heat alone warms. Therefore, although the other virtues do not justify with faith, still faith cannot justify in their absences, much less the opposite vices being present. For faith cannot be true except in connection with the virtues (which if they do not contribute to justification, still contribute to the existence and life of faith, which the presence of vices would destroy). … XX. Although remission of sins is promised to repentance (because it ought to accompany faith and be in him who is justified as a certain condition requisite from him because God cannot pardon sin to an impenitent), it does not follow that it can be said to justify with faith because it contributes nothing (neither meritoriously, nor instrumentally) to the act of justification.</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994), vol. 2, 16th Topic, 8. ‘Does faith alone justify? We affirm against the Romanists., pp. 677, 680-81">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+%283%29+The+question+is+not+whether+solitary+faith+%28i.e.+separated+from+the+other+virtues%29+justifies+%28which+we+grant+could+not+easily+be+the+case%2C+since+it+is+not+even+true+and+living+faith%29%3B+but+whether+it+%E2%80%9Calone%E2%80%9D+%28sola%29+concurs+to+the+act+of+justification+%28which+we+assert%29%3B+as+the+eye+alone+sees%2C+but+not+when+torn+out+of+the+body.+Thus+the+particle+%E2%80%9Calone%E2%80%9D+%28sola%29+does+not+determine+the+subject%2C+but+the+predicate+%28i.e.%2C+%E2%80%9Cfaith+only+does+not+justify+%5Bsola+fides+non+justificat%5D%2C+but+%E2%80%9Cfaith+justifies+alone%E2%80%9D+%5Bfides+justificat+sola%5D%29.+The+coexistence+of+love+in+him+who+is+justified+is+not+denied%3B+but+its+coefficiency+or+cooperation+in+justification+is+denied.+%284%29+The+question+is+not+whether+the+faith+%E2%80%9Cwhich+justifies%E2%80%9D+%28quae+justificat%29+works+by+love+%28for+otherwise+it+would+not+be+living+but+dead%29%3B+rather+the+question+is+rather+faith+%E2%80%9Cby+which+it+justifies%E2%80%9D+%28qua+justificat%29+or+in+the+act+itself+of+justification%2C+is+to+be+considered+under+such+a+relation+%28schesei%29+%28which+we+deny%29.+%E2%80%A6+XIII.+It+is+one+thing+for+love+and+works+to+be+required+in+the+person+who+is+justified+%28which+we+grant%29%3B+another+in+the+act+itself+or+causality+of+justification+%28which+we+deny%29.+If+works+are+required+as+concomitants+of+faith%2C+they+are+not+on+that+account+determined+to+be+causes+of+justification+with+faith+or+to+do+the+very+thing+which+faith+does+in+the+matter.+XIV.+Although+the+whole+force+of+justifying+on+the+part+of+man+is+in+faith+as+to+the+act+of+apprehension+%28so+that+other+virtues+contribute+nothing+to+it+ </figure><figure class="quote" id="q-d79115b944" data-kw="">
<blockquote><p>Even though we have taught in part how faith possesses Christ, and how through it we enjoy his benefits, this would still remain obscure if we did not add an explanation of the effects we feel. With good reason, the sum of the gospel is held to consist in repentance and forgiveness of sins [Luke 24:47; Acts 5:31]. Any discussion of faith, therefore, that omitted these two topics would be barren and mutilated and well-nigh useless. Now, both repentance and forgiveness of sins—that is, newness of life and free reconciliation—are conferred on us by Christ, and both are attained by us through faith. As a consequence, reason and the order of teaching demand that I begin to discuss both at this point. However, our immediate transition will be from faith to repentance. For when this topic is rightly understood it will better appear how man is justified by faith alone, and simple pardon; nevertheless actual holiness of life, so to speak, is not separated from free imputation of righteousness. Now it ought to be a fact beyond controversy that repentance not only constantly follows faith, but is also born of faith. For since pardon and forgiveness are offered through the preaching of the gospel in order that the sinner, freed from the tyranny of Satan, the yoke of sin, and the miserable bondage of vices, may cross over into the Kingdom of God, surely no one can embrace the grace of the gospel without betaking himself from the errors of his past life into the right way, and applying his whole effort to the practice of repentance. There are some, however, who suppose that repentance precedes faith, rather than flows from it, or is produced by it as fruit from a tree. Such persons have never known the power of repentance, and are moved to feel this way by an unduly slight argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1 (1559) Battles edition</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-1e62a02161" data-kw="">
<blockquote><p>The Westminster Shorter Catechism has a helpful, biblically-based definition of repentance: Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, does, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience. The Heidelberg Catechism gives a good biblical definition of true faith: Question 21. What is true faith? Answer: True faith is not only a certain knowledge, whereby I hold for truth all that God has revealed to us in his word, but also an assured confidence, which the Holy Ghost works by the gospel in my heart; that not only to others, but to me also, remission of sin, everlasting righteousness and salvation, are freely given by God, merely of grace, only for the sake of Christ’s merits. Repentance is turning from sin to obedience. Internally, it is a hatred of sin and a motivation to live in gratitude and love by obeying God’s commands. Externally it is changed conduct. Saving faith is a gift of God in our hearts leading us to trust him alone for our forgiveness, righteousness, and salvation, only because of what Christ has done for us. So, which comes first—faith or repentance? The answer is faith precedes repentance; it is a fruit of saving faith—not the other way around. A person is reconciled to God (justified) by faith alone, not by faith plus works. Yet, faith without repentance is not saving faith. Let me explain by considering what the Bible teaches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Faith or Repentance—Which Comes First?</cite>, May 10, 2022</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Westminster Shorter Catechism has a helpful, biblically-based definition of repentance: Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, does, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience. The Heidelberg Catechism gives a good biblical definition of true faith: Question 21. What is true faith? Answer: True faith is not only a certain knowledge, whereby I hold for truth all that God has revealed to us in his word, but also an assured confidence, which the Holy Ghost works by the gospel in my heart; that not only to others, but to me also, remission of sin, everlasting righteousness and salvation, are freely given by God, merely of grace, only for the sake of Christ’s merits. Repentance is turning from sin to obedience. Internally, it is a hatred of sin and a motivation to live in gratitude and love by obeying God’s commands. Externally it is changed conduct. Saving faith is a gift of God in our hearts leading us to trust him alone for our forgiveness, righteousness, and salvation, only because of what Christ has done for us. So, which comes first—faith or repentance? The answer is faith precedes repentance; it is a fruit of saving faith—not the other way around. A person is reconciled to God (justified) by faith alone, not by faith plus works. Yet, faith without repentance is not saving faith. Let me explain by considering what the Bible teaches.”

2a02161.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e62a02161.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/05/repentance-comes-from-faith/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>How then can his repentance atone for his iniquities, or entitle him to the favour of God and to the happiness of heaven? How can that evangelical repentance, which he is incapable of exercising till after his sins be all forgiven on the ground of an infinite atonement imputed to him, make atonement for them? How can that true repentance, which he cannot exercise until in justification he be already entitled to eternal life, entitle him to eternal life? Does not the consummate righteousness of Jesus Christ, imputed for justification, entitle the believer fully to it? What need is there, then, that his repentance should entitle him? How can that exercise of repentance which is the consequence of pardon, afford a previous title to pardon? or that which is a part of eternal life be a ground of right to eternal life?</p></blockquote>

</figure><figure class="quote" id="q-0db7cdbd1a" data-kw="">
<blockquote><p>As, David, Daniel, Esay [Isaiah], Jeremy, and others, Whereof we have special examples in the Psalms, where we see that God’s children having to do with God, do so often look upon their sins, and so humble themselves therewith, that thereby afterwards they come to receive in their hearts a filial faith, fear, and obedience. His P. Excell: did know that our spiritual enemy, which we bear about us, was overcome, and that death had lost her sting, and hell her victory.

This enemy, Sin, we do overcome: First, by true repentance, and do hate him as our deadliest enemy; Secondly, when we by true faith, cast them upon the shoulders of that unspotted Lamb Jesus Christ, who can only bear them, &amp; carry them away; &amp; thirdly, when on the contrary we become lovers of righteousness, and whatsoever is acceptable unto the Lord. These three particulars may every one find that is any thing experienced in holiness, that the Holy Ghost hath in a special manner wrought in this Prince. His Excell: knowing that there is but one way to heaven for the greatest potentate, and the meanest subject, hath not flattered himself, nor sought to justify his sins, but hath, as one of the least of God’s servants, with an humble heart and unfeigned repentance, confessed them before the Lord, and hath, in true faith taken his refuge only to Jesus Christ, in whom his soul found rest. And thereunto he so often declared his hearty desire, to serve the Lord better then he confessed to have done, as the Lord’s great benefits unto him did require.</p></blockquote>

</figure><figure class="quote" id="q-5cd0997c2c" data-kw="">
<blockquote><p>Doct. II. That it is in vain for any sinful persons to expect Gods turning to them in mercy and favour, who do not turn unto him with true repentance and reformation; but while they continue in their sins, they must expect that God will come forth against them, as the Lord of Hosts, commanding and ordering all his Creatures against them for their hurt. …

First, Turning to the Lord, implies, 1. That by sin continued in, men turn from the Lord, and against the Lord: as when men turn from one another in enmity, they turn their backs one to another, and their faces to opposite objects; so it is in this case, continuers in sin turn from God and his Word, to Sin, and the World, and Satan, which are opposite to God in his holy and righteous Laws; and God turns his face and favour from them, and his wrath and indignation against them. Hence it is that the Lord saith of those that disobey the instructions of his word, that they have turned the back to him, and not the face, Jerem. 32. 33. and accordingly he threatneth them, that he will shew them his back, and not his face, in the day of their calamity. Thus you see what this turning to the Lord implies.

Secondly, This turning to the Lord imports two things; Repentance for, and from all their evil ways; and Reformation of them: A hearty turning to God, through faith in Christ, and unfeigned love to God in Christ, with an universal conformity to his holy and righteous Rules and ways; as they resolved in Isa. 26.13. It is true, that we cannot turn unto God of our selves, till he turn us unto himself, as you may see in Deut. 29.2, 3, 4. yet, when God calleth the vessels of mercy to turn unto him, and addeth his Promise for their encouragement thereunto, his Spirit in and by the promise, works converting grace in them: which works in them 1. Hearty prayer unto God to convert them, as Isai. 63.17. Jerem. 31.18. Lam. 5.31. 2. Actual Conversion to God, in answer to God’s calling them thereunto, Psal. 27.8. as in Jer. 31.22. This turning to God is right,

1. When it ariseth from right motives. The right motives of turning to God, are not Temporal, only for removing of some temporal Affliction, whether felt or feared; or for obtaining some temporal good, which we want and desire: for such a turning is not to the Lord, but to our selves, as you may see in Hos. 7.16. with Zech. 7.5. But the right motives of turning to God are Eternal, viz. A serious and fixed apprehension of Eternal life and death, in relation to God, and his everlasting favour and wrath, in the incomprehensible greatness and vastness of them: when these are not transient and vanishing, but fixed in the heart by the Spirit, and when they are looked at, not as far off, but as present; Then they work an effectual and present conversion to God. Therefore Christ taught his Disciples to use this motive in preaching the Gospel, for the conversion of sinners to God, Mark 16.16. and Christ himself used the same motive, Joh. 3.18, 36. and the reason is, because then a man seeth better and stronger reasons for his turning to God, then the world can give for his continuing in sin, 2 Cor. 4.18. from love to God, Psal. 97.10. Ye that love the Lord, hate evil.

2. When it’s done in a right manner, with the whole heart, Joel 2.12. that is, when a full resolution of turning to God, follows a full illumination and conviction; otherwise, when men have some motives to turn, but not enough, they are not fully convinced, and so they turn but by halves, and feignedly, Jer. 3.10. Hence a right turning to God, is described as the Effect opening men’s eyes, Acts 26.18. wherein is included the opening of their hearts, as in Acts 16.14. Lydia.

3. When it produceth suitable effects: 1. That sin, which had dominion in them, is dispossessed, and grace is made Master of the house; so as though sin gets in and dwells in them, yet it is by intrusion and usurpation, as a Thief or Enemy, which are expelled as soon as they are discovered, and sufficient strength is gained. 2. That sin is hated; as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3. this appears,

1. By their thrusting out the motions and lusts of sin out of their hearts with indignation, Isa. 30.22. and shutting the doors of the Soul, the Eyes and Ears, against temptations to it. They say in effect, as Ephraim did, in Hos. 14.8. What have I to do any more with Idols? Thus Amnon dealt with Tamar, 1 Sam. 13.15, 17.

2. By their seeking the utter destruction and full mortification of sin: for, hatred is implacable against the whole kind, as we see in a Wolf against all Sheep; nothing will satisfy but the death of its object, as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3.

3. By a continual fight against sin, till it be fully subdued. Gal. 5.17. The flesh lusteth against the Spirit, and the Spirit against the flesh. 1 Pet. 2.11. Dearly beloved, I beseech you as strangers and pilgrims, abstain from fleshly lusts, which war against the soul. Hence they will account them their best friends that help them against sin, their worst enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenport.html">John Davenport</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s call to his people to turn to him; together with his promise to turn unto them. Opened and applied in II. Sermons at public fasting-days appointed by authority</cite>, (Cambridge: John Usher, 1669), pp 11-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

First, Turning to the Lord, implies, 1. That by sin continued in, men turn from the Lord, and against the Lord: as when men turn from one another in enmity, they turn their backs one to another, and their faces to opposite objects; so it is in this case, continuers in sin turn from God and his Word, to Sin, and the World, and Satan, which are opposite to God in his holy and righteous Laws; and God turns his face and favour from them, and his wrath and indignation against them. Hence it is that the Lord saith of those that disobey the instructions of his word, that they have turned the back to him, and not the face, Jerem. 32. 33. and accordingly he threatneth them, that he will shew them his back, and not his face, in the day of their calamity. Thus you see what this turning to the Lord implies.

Secondly, This turning to the Lord imports two things; Repentance for, and from all their evil ways; and Reformation of them: A hearty turning to God, through faith in Christ, and unfeigned love to God in Christ, with an universal conformity to his holy and righteous Rules and ways; as they resolved in Isa. 26.13. It is true, that we cannot turn unto God of our selves, till he turn us unto himself, as you may see in Deut. 29.2, 3, 4. yet, when God calleth the vessels of mercy to turn unto him, and addeth his Promise for their encouragement thereunto, his Spirit in and by the promise, works converting grace in them: which works in them 1. Hearty prayer unto God to convert them, as Isai. 63.17. Jerem. 31.18. Lam. 5.31. 2. Actual Conversion to God, in answer to God’s calling them thereunto, Psal. 27.8. as in Jer. 31.22. This turning to God is right,

1. When it ariseth from right motives. The right motives of turning to God, are not Temporal, only for removing of some temporal Affliction, whether felt or feared; or for obtaining some temporal good, which we want and desire: for such a turning is not to the Lord, but to our selves, as you may see in Hos. 7.16. with Zech. 7.5. But the right motives of turning to God are Eternal, viz. A serious and fixed apprehension of Eternal life and death, in relation to God, and his everlasting favour and wrath, in the incomprehensible greatness and vastness of them: when these are not transient and vanishing, but fixed in the heart by the Spirit, and when they are looked at, not as far off, but as present; Then they work an effectual and present conversion to God. Therefore Christ taught his Disciples to use this motive in preaching the Gospel, for the conversion of sinners to God, Mark 16.16. and Christ himself used the same motive, Joh. 3.18, 36. and the reason is, because then a man seeth better and stronger reasons for his turning to God, then the world can give for his continuing in sin, 2 Cor. 4.18. from love to God, Psal. 97.10. Ye that love the Lord, hate evil.

2. When it’s done in a right manner, with the whole heart, Joel 2.12. that is, when a full resolution of turning to God, follows a full illumination and conviction; otherwise, when men have some motives to turn, but not enough, they are not fully convinced, and so they turn but by halves, and feignedly, Jer. 3.10. Hence a right turning to God, is described as the Effect opening men’s eyes, Acts 26.18. wherein is included the opening of their hearts, as in Acts 16.14. Lydia.

3. When it produceth suitable effects: 1. That sin, which had dominion in them, is dispossessed, and grace is made Master of the house; so as though sin gets in and dwells in them, yet it is by intrusion and usurpation, as a Thief or Enemy, which are expelled as soon as they are discovered, and sufficient strength is gained. 2. That sin is hated; as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3. this appears,

1. By their thrusting out the motions and lusts of sin out of their hearts with indignation, Isa. 30.22. and shutting the doors of the Soul, the Eyes and Ears, against temptations to it. They say in effect, as Ephraim did, in Hos. 14.8. What have I to do any more with Idols? Thus Amnon dealt with Tamar, 1 Sam. 13.15, 17.

2. By their seeking the utter destruction and full mortification of sin: for, hatred is implacable against the whole kind, as we see in a Wolf against all Sheep; nothing will satisfy but the death of its object, as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3.

3. By a continual fight against sin, till it be fully subdued. Gal. 5.17. The flesh lusteth against the Spirit, and the Spirit against the flesh. 1 Pet. 2.11. Dearly beloved, I beseech you as strangers and pilgrims, abstain from fleshly lusts, which war against the soul. Hence they will account them their best friends that help them against sin, their worst enemy.”

— John Davenport, God’s call to his people to turn to him; together with his promise to turn unto them. Opened and applied in II. Sermons at public fasting-days appointed by authority, (Cambridge: John Usher, 1669), pp 11-14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDoct.+II.+That+it+is+in+vain+for+any+sinful+persons+to+expect+Gods+turning+to+them+in+mercy+and+favour%2C+who+do+not+turn+unto+him+with+true+repentance+and+reformation%3B+but+while+they+continue+in+their+sins%2C+they+must+expect+that+God+will+come+forth+against+them%2C+as+the+Lord+of+Hosts%2C+commanding+and+ordering+all+his+Creatures+against+them+for+their+hurt.+%E2%80%A6%0A%0AFirst%2C+Turning+to+the+Lord%2C+implies%2C+1.+That+by+sin+continued+in%2C+men+turn+from+the+Lord%2C+and+against+the+Lord%3A+as+when+men+turn+from+one+another+in+enmity%2C+they+turn+their+backs+one+to+another%2C+and+their+faces+to+opposite+objects%3B+so+it+is+in+this+case%2C+continuers+in+sin+turn+from+God+and+his+Word%2C+to+Sin%2C+and+the+World%2C+and+Satan%2C+which+are+opposite+to+God+in+his+holy+and+righteous+Laws%3B+and+God+turns+his+face+and+favour+from+them%2C+and+his+wrath+and+indignation+against+them.+Hence+it+is+that+the+Lord+saith+of+those+that+disobey+the+instructions+of+his+word%2C+that+they+have+turned+the+back+to+him%2C+and+not+the+face%2C+Jerem.+32.+33.+and+accordingly+he+threatneth+them%2C+that+he+will+shew+them+his+back%2C+and+not+his+face%2C+in+the+day+of+their+calamity.+Thus+you+see+what+this+turning+to+the+Lord+implies.%0A%0ASecondly%2C+This+turning+to+the+Lord+imports+two+things%3B+Repentance+for%2C+and+from+all+their+evil+ways%3B+and+Reformation+of+them%3A+A+hearty+turning+to+God%2C+through+faith+in+Christ%2C+and+unfeigned+love+to+God+in+Christ%2C+with+an+universal+conformity+to+his+holy+and+righteous+Rules+and+ways%3B+as+they+resolved+in+Isa.+26.13.+It+is+true%2C+that+we+cannot+turn+unto+God+of+our+selves%2C+till+he+turn+us+unto+himself%2C+as+you+may+see+in+Deut.+29.2%2C+3%2 <blockquote><p>These things, beloved, we write unto you, not merely to admonish you of your duty, but also to remind ourselves. For we are struggling on the same arena, and the same conflict is assigned to both of us. Wherefore let us give up vain and fruitless cares, and approach to the glorious and venerable rule of our holy calling.

Let us attend to what is good, pleasing, and acceptable in the sight of Him who formed us. Let us look steadfastly to the blood of Christ, and see how precious that blood is to God, which, having been shed for our salvation, has set the grace of repentance before the whole world.

Let us turn to every age that has passed, and learn that, from generation to generation, the Lord has granted a place of repentance to all such as would be converted unto Him. Noah preached repentance, and as many as listened to him were saved. Jonah proclaimed destruction to the Ninevites; but they, repenting of their sins, propitiated God by prayer, and obtained salvation, although they were aliens [to the covenant] of God.</p></blockquote>

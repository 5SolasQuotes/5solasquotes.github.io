</figure><figure class="quote" id="q-7959766121" data-kw="">
<blockquote><p>The true knowledge of heavenly things increaseth according to the measure of sanctification. I do not speak of knowledge falsely so called, as the Apostle some where terms it, but of true knowledge, that is, inward, experimental understanding, and this grows up as holiness doth enlarge it self in the soul. The clearer the glass, the more perfect is the reflection that it makes.

The more pure and spotless the soul is, the better doth it receive and judge of heavenly things. If it be but day-break, or a dim and dusky twilight, we have a more doubtful appearance of things that are before us: but if it grows to a morning-light, and once increaseth into a noon-day brightness, then have we a more exact and judicious vision of them.

When the soul begins at first to turn unto God, it hath some taste or smattering of these spiritual dainties, and it is like that taste, which new-born babes have of the milk which they suck from the breasts, but when the Christian follows on to know the Lord, whose going forth is prepared as the morning, and when he doth resolvedly and strongly carry on the work of sanctification in his heart and life, then doth he come to a more mature and ripened judgement of these things; He was a child before, but now he is grown up to a strong man in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Security Against Seducing Spirits. Or, The Anointing from the Holy One the Best Teaching. Delivered in a Sermon at Paul’s before the Lord Major, Alderman, and Commonality of the City of London, upon the Fifth of November, 1651</cite>, ed. John Palmer and Christian Herring (1651; Purely Presbyterian Publications, 2019), p. 22.</span></figcaption>

<blockquote><p>Herein it is not amiss to be noted that not only some small church truly so called, though in some points imperfect, but many churches may go astray, whole populous churches may be seduced. For truly people, whether sole and single or assembled and making a church or churches, are but people, and therefore prone to sin and soon deceived; and as the moon does often eclipse, so churches may sometimes err.

And yet another good observation it is, that if anyone therefore will needs be willful and unwilling to contend to perfection because all people necessarily have imperfections, verily that person is unwise and wants grace and can be no child of the church of God, which is a house of such people as invoke and call on the holy name of God. And whosoever so does, of duty must evermore more and more depart as far as possible from all iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-prime.html">John Prime</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition and Observations upon Saint Paul to the Galatians. Together with Incident Questions Debated and Motives Removed</cite>, (Oxford, 1587). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 16.</span></figcaption>

<blockquote><p>Now because this work [of sanctification] is but inchoate and imperfect, and in part only transacted in this World; and there are remainders of sin in this life in the best of Saints; and because Grace and Corruption are vigorous, active, operative Principles, dwelling so near together, under the same Roof, in the same Soul, yea in the very same Faculties: there must needs arise a sharp and severe War in the Soul between these two Neighbouring and Opposite Natures, the particular events and successes whereof are various and uncertain; but the Victory is infallibly determined in the issue on the side of Grace. Grace indeed is greatly beset, hardly bestead, much encumbered and almost overthrown at some reasons: but it will certainly eluctari, wrestle and recover itself out of all the dangers that threaten it.</p></blockquote>

<blockquote><p>And the Gospel directs us to renewed acts of Repentance and Faith upon our short comings. The Children of God, being renewed but in part, can do no duty entirely perfect, according to the tenor of the first Covenant; and having the remainders of sin in them, which is a Law in their members, and a body of death, often takes advantage to make Captives of them, and draw them to acts of disobedience: now all the defects, in the Obedience of the Children of God are hidden under the Robe of Christ’s Righteousness; and there is a pardon out upon his account, to be applied to them for all their follies; but yet, as faith tells us that there is an Advocate with the Father for us if we sin, so it tells us that we ought not to sin, 1 Joh. 2.1.

And besides, we are acquainted, that all the sins of believers themselves, which have boldness or presumption attending upon them, do make a breach between God and them, though not to their rejection, yet to their feeling of his holy displeasure, by some manifest discoveries of it: and the way to have this breach made up again is thus prescribed. And we are told, 2 Cor. 7.10. That Godly sorrow worketh repentance into Salvation not to be repented of.

Yea the very daily unavoidable imperfections of God’s Children, call for the continued exercise of Repentance and Faith: In which Repentance we acknowledge our sins, and our just deservings by them, and do with grief and hatred renounce them; and in which Faith, we go to Christ for the pardon of these, the covering of them under his Robe, and the new witnessing in us to our Justification, and for more strength to be given us to withstand the Suggestions of Satan and Solicitations of the carnal part in us. All of these things most plainly discover what a value the Doctrine of faith in Christ puts upon the Law of God as a Rule.</p></blockquote>

</figure><figure class="quote" id="q-2d54bba5f6" data-kw="">
<blockquote><p>This promise of sanctification, is the principal promise of the covenant, made to Christ for his elect seed. Among the other promises of that class, it shines as the moon among the twinkling stars. Sanctification, is the chief subordinate end of the covenant; standing in it next to the glory of Jehovah, which is the chief ultimate end of it.

All the foregoing promises; the promise of preservation, of the quickening Spirit, of faith, of justification, and of a new and saving relation to God, tend thereto, and stand related to it as means to their end. They are all fulfilled to elect sinners, on purpose to render them holy. And all the subsequent promises, even the promise of glorification itself, are but the promise of sanctification extended. …

For the great object which Satan aimed at, in seducing our first parents to sin, was the defacing of the image of God in them; that so, the human race might no longer resemble God, but resemble himself: and the mystery of God for the recovery of lost sinners, is then and not till then, finished, when holiness restored to them, is brought to perfection.

From all this, it is obvious that the sanctification of all, who shall ever enter into heaven, is, in the covenant, secured on the firmest grounds, infinitely beyond the possibility of failure; that the unsanctified, have no personal interest in the covenant; and that the less holy the believer is, the less, is the promise of eternal life in the covenant, fulfilled, to him. The sanctification of sinners, is the great design of that holy covenant. It is that which the Father, Son, and Holy Spirit, next to the glory of redeeming grace, had principally in their view: and the promise of it is, in respect of sinners, the chief, the capital branch, of the promise of eternal life to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 217, 218.</span></figcaption>

</figure><figure class="quote" id="q-e5ccb98924" data-kw="">
<blockquote><p>After this we say, “Hallowed be Thy name;” not that we wish for God that He may be hallowed by our prayers, but that we beseech of Him that His name may be hallowed in us. But by whom is God sanctified, since He Himself sanctifies? Well, because He says, “Be ye holy, even as I am holy,” we ask and entreat, that we who were sanctified in baptism may continue in that which we have begun to be. And this we daily pray for; for we have need of daily sanctification, that we who daily fall away may wash out our sins by continual sanctification.

And what the sanctification is which is conferred upon us by the condescension of God, the apostle declares, when he says, “neither fornicators, nor idolaters, nor adulterers, nor effeminate, nor abusers of themselves with mankind, nor thieves, nor deceivers, nor drunkards, nor revilers, nor extortioners, shall inherit the kingdom of God. And such indeed were you; but ye are washed; but ye are justified; but ye are sanctified in the name of our Lord Jesus Christ, and by the Spirit of our God.”

He says that we are sanctified in the name of our Lord Jesus Christ, and by the Spirit of our God. We pray that this sanctification may abide in us and because our Lord and Judge warns the man that was healed and quickened by Him, to sin no more lest a worse thing happen unto him, we make this supplication in our constant prayers, we ask this day and night, that the sanctification and quickening which is received from the grace of God may be preserved by His protection.</p></blockquote>

8924.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5ccb98924.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/11/cyprian-of-carthage-on-hallowed-by-thy-name-as-a-prayer-for-sanctification/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-159ca6531c" data-kw="">
<blockquote><p>It is the never-failing characteristic of true religion, to prompt its professor, in imitation of the great apostle of the Gentiles, forgetting the things that are behind, to press forward towards the prize of his high and heavenly calling; and to be continually advancing in his Christian course, and never to be satisfied with his actual attainments, but to be striving to root out every remaining corruption, and to perfect every Christian grace, that he may bring every thought and feeling into the obedience of Christ;—to live more habitually under the influence of that divine Spirit, of which Christians are said, in Scripture, to be the temples;—and to feel more constantly and more powerfully the life and force of this blessed principle.</p></blockquote>

<blockquote><p>If yet you see not the pride of these men, I will shew it you in these four particular Evidences, and that so plainly, that if you know the difference between the language of heaven and of hell, you may easily perceive the devil speaking by their mouths.

1. They affirm themselves to be perfect without sin (yea, some of them say they are Christ and God.) And is it possible that any man in this life, that is not mad with spiritual pride, can indeed believe that he hath no sin? what? that he transgresseth no Law? That he doth love God in the highest degree that he is bound to do? That he never hath a thought or word that is sinful, nor sinfully loseth one minute of his time?

Yea, and this when in the eyes and ears of the wisest, they foam out their own shame, as the raging Sea doth cast out the dirt. The devil himself hath either less pride or less ignorance, then to think himself to be perfect without sin; If they have no sin, what need they pray, Forgive us our sins, or what further need have they of the blood of Christ or his Intercession to procure them any further forgiveness? If you can see no pride in this, I fear you are blinded with them to destruction.</p></blockquote>

<blockquote><p>There is but one God essentially considered: and in this the Scripture is clear, and so in this Book [Revelation], chap. 1. and last; although there be a plurality of Persons mentioned, yet it is ever God spoken of as One, in the singular number; and thus He is still opposed as the One living God, to the plurality of Idols.

And indeed, there can be no plurality in this: for, if that One God have in Him all perfections, There can be no perfection beside Him; and so no God beside this One true God. And, if we supposed any perfection to be beside Him, then were not He God, because not infinite in perfection; and, if infinite, then that which is infinite, in that respect, cannot be multiplied. There is no question of this, seeing the most wise Heathens have been necessitated to acknowledge it.</p></blockquote>

<blockquote><p>It was a very remarkable campaign which was conducted by Robert Pearsall Smith in Great Britain and Germany during the years 1873–1875 in the interests of what is known as “the Higher Christian Life.” It has left behind it two imposing monuments. One of them, the great “Keswick Movement,” is known wherever the English language is spoken. The other, a parallel movement in Germany, spoken of there as “Die Heiligungsbewegung,” the “Sanctification Movement,” deserves to be better known than it appears to be.

It took a peculiar form, which was given it by the circumstance that it made its way primarily in, and always by means of, “the Fellowships” (Gemeinschaften) which had come down from the times of Pietistic ascendency, and were now given new life and set upon a career of rapid self-propagation, by the impulse received from Pearsall Smith. Thus the “Sanctification Movement” inaugurated by him became in its form a great “Fellowship Movement,” which has spread throughout Germany and has extended itself everywhere in a stable organization and numerous instruments of activity. The center of its public manifestation is the great Gnadau Conference.

One of the remarkable features of this “Sanctification Movement” has been that it took its colour very largely from the teachings of one man. This man was Theodor Jellinghaus, who received his Higher Life doctrine from Smith and his colleagues at the great Oxford Union Meeting for the Promoting of Scriptural Holiness, in the early days of September, 1874, and who returned thence to Germany having before him his life-work of propagating it. In 1880 he published the work which became very much the doctrinal text book of the movement, under the title of “The Complete, Present Salvation through Christ.”

Through this book, in its successive editions, and the Bible school which he founded for the training of workers for the movement, Jellinghaus was able to give to the movement its doctrinal character. This doctrinal character, while following in the main, and at first very closely, the teachings of Smith, did not exactly coincide with them in all its details, and departed more and more from them as time went on, though never fundamentally. This was clearly marked in the successive editions of the book. A particular quality of its own was thus acquired by the German Sanctification Movement, which differentiated it as a distinct species of Higher Life teaching, while it retained its generic character.

Its development on these lines proceeded with great and fruitful quietness throughout the last quarter of the nineteenth century. With the twentieth century, however, a period of turmoil set in. Fanatical tendencies showed themselves, with ever increasing violence. A consequent Perfectionism endeavoured to substitute itself for the moderate Perfectionism of the Higher Life teachers, and especially of Jellinghaus, the most discreet of them all. The excesses of the Welsh Revival were imported into Germany.

Worst of all, the Fellowship circles were invaded by the fanaticisms of the “Pentecost Movement” — the “Los Angeles Revival,” which brought ruin in their train. The ultimate result was an immense revulsion of feeling. The whole Higher Life system which had supported the doctrinal basis of the movement from its beginning was undermined and discredited. Jellinghaus himself, who had given his life to its propagation, published, in a remarkable book, his recantation of it. When the Great War lowered its curtain over the land and shut off observation of the course of religious events in it, it looked very much as if the Fellowship Movement had definitely ceased to be a Higher Life movement and had returned with happy decisiveness to the Reformation for its doctrinal basis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The German Higher Life Movement in its Chief Exponent (1919) in The Works of Benjamin B. Warfield</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification.html">Sanctification</a></span></div>

</figure><figure class="quote" id="q-90de0bbebc" data-kw="">
<blockquote><p>But here again it is objected, that all the corruptions of the Church are not to be corrected by such harsh remedies — that they are not to be cut in to the quick — that not even is medicine to be applied to all, but some are to be treated gently, and others submitted to, if they cannot without difficulty be removed.

I answer, that we are not so unacquainted with ordinary life as not to know that the Church always has been, and always will be, liable to some defects which the pious are indeed bound to disapprove, but which are to be borne rather than be made a cause of fierce contention.

But our adversaries are unjust when they accuse us of being excessively morose, as if we had brought the Church into trouble on account of small and trivial errors. For to their other misrepresentations they add this one also, of endeavouring, by every artifice in their power, to extenuate the importance of the things which we have made the subject of controversy; the object being to make it seem that we have been hurried on by a love of quarrelling, and not that we were drawn into it by a just cause. This they do, not in ignorance, but with cunning design, namely, because they know that there is nothing more odious than the rash haste which they impute to us.

And yet they, at the same time, betray their own impiety in speaking so contemptuously of matters of the greatest moment. And is it indeed so, that when we complain that the worship of God was profaned — that His honour was utterly impaired — that the doctrine of salvation was entangled with numerous destructive errors — that the virtue of Christ’s death was suppressed — and that, in short, all things sacred were sacrilegiously polluted; is it indeed so, that we are to be derided and charged with the folly of disturbing ourselves and the whole world besides, to no purpose, with disputes about insignificant questions?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign</cite>, (1544) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 186-87.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

And yet they, at the same time, betray their own impiety in speaking so contemptuously of matters of the greatest moment. And is it indeed so, that when we complain that the worship of God was profaned — that His honour was utterly impaired — that the doctrine of salvation was entangled with numerous destructive errors — that the virtue of Christ’s death was suppressed — and that, in short, all things sacred were sacrilegiously polluted; is it indeed so, that we are to be derided and charged with the folly of disturbing ourselves and the whole world besides, to no purpose, with disputes about insignificant questions?”

— John Calvin, The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign, (1544) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 186-87.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+here+again+it+is+objected%2C+that+all+the+corruptions+of+the+Church+are+not+to+be+corrected+by+such+harsh+remedies+%E2%80%94+that+they+are+not+to+be+cut+in+to+the+quick+%E2%80%94+that+not+even+is+medicine+to+be+applied+to+all%2C+but+some+are+to+be+treated+gently%2C+and+others+submitted+to%2C+if+they+cannot+without+difficulty+be+removed.%0A%0AI+answer%2C+that+we+are+not+so+unacquainted+with+ordinary+life+as+not+to+know+that+the+Church+always+has+been%2C+and+always+will+be%2C+liable+to+some+defects+which+the+pious+are+indeed+bound+to+disapprove%2C+but+which+are+to+be+borne+rather+than+be+made+a+cause+of+fierce+contention.%0A%0ABut+our+adversaries+are+unjust+when+they+accuse+us+of+being+excessively+morose%2C+as+if+we+had+brought+the+Church+into+trouble+on+account+of+small+and+trivial+errors.+For+to+their+other+misrepresentations+they+add+this+one+also%2C+of+endeavouring%2C+by+every+artifice+in+their+power%2C+to+extenuate+the+importance+of+the+things+which+we+have+made+the+subject+of+controversy%3B+the+object+being+to+make+it+seem+that+we+have+been+hurried+on+by+a+love+of+quarrelling%2C+and+not+that+we+were+drawn+into+it+by+a+just+cause.+This+they+do%2C+not+in+ignorance%2C+but+with+cunning+design%2C+namely%2C+because+they+know+that+there+is+nothing+more+odious+than+the+rash+haste+which+they+impute+to+us.%0A%0AAnd+yet+they%2C+at+the+same+time%2C+betray+their+own+impiety+in+speaking+so+contemptuously+of+matters+of+the+greatest+moment.+And+is+it+indeed+so%2C+that+when+we+complain+that+the+worship+of+God+was+profaned+%E2%80%94+that+His+honour+was+utterly+impaired+%E2%80%94+that+the+doctrine+of </figure><figure class="quote" id="q-006c00dac8" data-kw="">
<blockquote><p>Who soever are perfect in the Church of God, or whosoever are come to a degree of perfection, or press to perfection, aspiring above nature, above human things, to see things Heavenly and spiritual, these men account of my wisdom, in the sight of these I am wise, and in their audience I speak wisdom, howbeit earthly men think all that I speak but folly. This is the meaning &amp; the effect of the Apostle’s answer shortly. As to this word of perfection, I will not insist in it. A full perfection is not here meaned, but a striving to perfection.

No man nor woman in this life is perfect, but the perfectest of us all that liveth in this world, one lie are striving to perfection, thorow infinite infirmities. Therefore, this word of perfection is not to be understood of that consummate perfection which we shall have in that other life, but as it is opened unto them that have no perfection, no spiritual nor Heavenly sight or knowledge of things Heavenly &amp; spiritual.</p></blockquote>

</figure><figure class="quote" id="q-9a71a3adaa" data-kw="">
<blockquote><p>We say nothing different from that which Scripture says.—But in a Divine nature, as such, when once we have believed in it, we can recognize no distinctions suggested either by the Scripture teaching or by our own common sense; distinctions, that is, that would divide that Divine and transcendent nature within itself by any degrees of intensity and remission, so as to be altered from itself by being more or less.

Because we firmly believe that it is simple, uniform, incomposite, because we see in it no complicity or composition of dissimilars, therefore it is that, when once our minds have grasped the idea of Deity, we accept by the implication of that very name the perfection in it of every conceivable thing that befits the Deity. Deity, in fact, exhibits perfection in every line in which the good can be found. If it fails and comes short of perfection in any single point, in that point the conception of Deity will be impaired, so that it cannot, therein, be or be called Deity at all; for how could we apply that word to a thing that is imperfect and deficient, and requiring an addition external to itself? …

So Deity, as long as it possesses perfection throughout all the properties that devotion may attach to it, by virtue of this perfection in everything good does not belie its name; but if any one of those things that contribute to this idea of perfection is subtracted from it, the name of Deity is falsified in that particular, and does not apply to the subject any longer. It is equally impossible to apply to a dry substance the name of water, to that whose quality is a state of coolness the name of fire, to stiff and hard things the name of air, and to call that thing Divine which does not at once imply the idea of perfection; or rather the impossibility is greater in this last case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316.</span></figcaption>

</figure><figure class="quote" id="q-734562b80d" data-kw="">
<blockquote><p>O take a look of Him in his perfection. He is without measure and limits – without beginning and ending. He is one and the same in his nature, in his counsels, and in his love. He perfectly knoweth Himself, and all things that are possible. He can do all things that do not imply a contradiction, and argue imperfection.

He is good and doeth good; He is righteous in Himself, and equal in all his ways of dealing with his creatures. He is true without and dissimulation; He is holy, and delighteth in his own holiness, and in every resemblance of it, in his angels and in his saints.

O! who can think of Him and who can speak of Him aright? He is infinite in all his attributes; and every perfection hath a perfect meeting in Him. Albeit some of his attributes are in some degree communicable to his creatures, yet they are in Him in an altogether incommunicable manner and measure. There is nothing in God but what is God; for this is his name – “I am that I am.”

Again I say, Who can think of Him, and who can speak of Him aright? Who can comprehend Him, or compass Him about? Who by understanding can search out God? Humble and believing ignorance is better than curious and prying knowledge: for all that we can know of Him, is to know that we cannot know him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-c796423fd6" data-kw="">
<blockquote><p>The historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestanism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it.

On Mystical ground—as for example among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men. Perfectionism persistently makes its appearance.

It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestanism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it.

On Mystical ground—as for example among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men. Perfectionism persistently makes its appearance.

It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.”

<blockquote><p>VII. The power of free choice in the regenerate is yet weak, so that we have still need of the help of God, neither can we do all that we would.

But, because our regeneration is as it were only begun and not as yet perfect, so that whereas we were before wholly flesh, now we consist partly of the Spirit and partly of the flesh, which do continually fight the one against the other, that what good things we would, them we cannot perform; but in our spirit we serve the law of God, but in our flesh the law of sin.

Therefore we believe that which we also know by experience in the regenerate, that much bondage still remaineth, much darkness in the soul and perverseness in the heart and weakness in all the faculties of mind and body, that we have still need of new help from God and new grace, whereby both our minds may be more and more enlightened and our wills made better and better, and our strength to do good more increased and perfected.

And therefore, while we remain in this flesh, our free choice is never truly and merely free, that is, never able enough of it self to avoid ill and do good, especially sith the event of all things is not in our power, but in the hand of God; and that it must needs be that all those things come to pass, not which we think, but whatsoever his hand and purpose hath decreed shall be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XX.VII, 1: 357.</span></figcaption>

<blockquote><p>But here the Apostle seems to comprehend a twofold holiness of those that are reconciled; one which consists in the remission of sins, and the imputation of Christ’s righteousness; the other which consists in our renovation, and in the fruits of holiness. For in both ways Christ presents all his people holy before God.

They are now strictly saints by imputation, because they are regarded as one mystical person with Christ their head; but as to inherent holiness, that is not effected instantly, but increases daily, and acquires not the summit of its perfection before we are translated from this life to the life of glory.

Yet we maintain that this incipient sanctification is real, although not complete. And therefore the Apostle adds these words, before God. For he is said to be just and holy before God, who is so in reality, not in appearance only; in rectitude of intention, not in fictitious imitation, as Lyra not inaptly remarks on these words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 258.</span></figcaption>

<blockquote><p>VIII. If any man should say that God is obnoxious, or subject to no laws, and therefore his actions are not rightly examined, according to the rule of justice, seeing he is tied to no rules: I will answer, that the nature of God, is more mighty than any law: That natural perfection, by which it is impossible that God should lie, or that he should sin; is also the cause, why he could not hate his guiltless creature, or appoint man to eternal torments, for no fault of his …</p></blockquote>

<blockquote><p>The most usual word to signify, either the upright is Tham, or Thamim, which commonly is translated perfect, as Gen. 17.1. Deut. 18.13. Ps. 15.2.37.37.119.1. or uprightness, is Thom or thamim, which usually is translated perfection whereby not legal perfection is meant (which is absolute and complete, not only in respect of the parts, but also of degrees) but evangelical, according to the covenant of grace; which is nothing else (the Lord accepting in his children the will for the deed) but integrity or uprightness; and is so expounded Ps. 25.21. Jos. 24.14. Job. 1.1.; 2.3. Ps. 27.7. For very many in the scriptures have this perfection attributed to them, who notwithstanding had their imperfections. as Noah, Gen. 6.9. Job. 1.1.8.2.3. Jacob, Gen. 25.27. &amp;c. of Asa it is said 2. Chro. 15.17. that his heart was perfect all his days: and yet in the next Chapter there are recorded three foul sins, which he committed. 2. Chron. 16.7.10.12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 122-23.</span></figcaption>

<blockquote><p>Therefore, See that ye come unto Jesus Christ by Faith without delay, and Receive him as your only All-sufficient Saviour, that is able to save you to the uttermost; Accepting him upon his own terms of denying your selves, taking up your Cross daily, and following him. So Jesus Christ will be unto you, Wisdom, to guide you in the way to Heaven; Righteousness, to wash away all your Sins by his blood, and justify you freely by his spotless Righteousness imputed unto you; Sanctification, to furnish you sufficiently with all treasures of Grace out of his fullness of Grace; and Redemption, to deliver you from all your bondage under Sin, Satan, the curse of the Law, the Wrath to come, and all your Spiritual Enemies.</p></blockquote>

</figure><figure class="quote" id="q-6700a17bc9" data-kw="">
<blockquote><p>What spirit shall we think they have, that will unchurch churches, because they have some defilement and unbrotherly brethren, accounting them no churches, no brethren, because they have some imperfections? Why hath not Christ a quarrel to the church then? is he blind? doth his love make him blind? No; he seeth corruption, but he seeth better things; somewhat of his own, that makes him overlook those imperfections, because they are such as he means to mortify, subdue, wear away, and to fire out by the power of his Spirit, which as fire shall waste all those corruptions in time. So it is with the church. Put the case, she hath some corruptions: that it be not with her as it should be, yet she is a church notwithstanding. The church of Corinth, we see, Paul styles them saints and brethren, with all those sweet names (1 Cor. 1:1, 2), notwithstanding they had many corruptions among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), pp 149-50.</span></figcaption>

</figure><figure class="quote" id="q-77a37dace4" data-kw="">
<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of the Atonement</cite>, (Columbia SC: Samuel Weir, 1845), pp 11, 28.</span></figcaption>

</figure><figure class="quote" id="q-8e1dd6ba7a" data-kw="">
<blockquote><p>The Westminster divines worked on what might have been called “The Medium Catechism” before scrapping it and writing the Shorter and Larger Catechisms. The minutes of the Assembly give us some insight into what this catechism would have looked like had it been published:

Q. 6. What doe the Scriptures teach us to conceive of God?

A. God is a most glorious being, infinite in all perfections. …

Q. 15. What are we to believe concerning the holiness of God?

A. God is most perfectly holy, and neither causeth nor alloweth any to sin. …

Q. 19. Is God subject to any change or changeableness?

A. God is always the same unchangeably notwithstanding the changes in all others things.

Q. 20. What are we to believe concerning the truth of God?

A. God is most true in all his words, particularly in his promises and threatenings, and it is not possible for him to lie.

Q. 21. What are we to believe concerning the blessedness of God?

A. God is in himself most blessed, every way, and for ever, neither can any creature add to his happiness or take anything from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 708, 711, 15, 17 Sep. 1646, pp 283, 285.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

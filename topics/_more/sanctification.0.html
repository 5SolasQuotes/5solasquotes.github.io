<figure class="quote" id="q-06fa1177e8" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: … IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: … 5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely. 6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16. 7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.</p></blockquote>

<blockquote><p>XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.</p></blockquote>

</figure><figure class="quote" id="q-80dd5fdbb9" data-kw="">
<blockquote><p>XVIII. Baptism indeed promises us the submersion of our Pharaoh and the mortification of sin, yet not so that it is no more or does not trouble us, but only that it does not overcome us, on account of Christ who, by His blood, prevents its power from condemning, and by his Spirit, restrains it from dominating. This is not so that men may sleep securely in their sins, but only that they may not waver and lose heart, who are tickled and pricked by their flesh.</p></blockquote>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are: 1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5). 2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things. 3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13). 4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1). 5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible. 6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4). 7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect. 5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ. 6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law. 7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>Randall in his epistle before the treatise called, The Bright Star: ‘I have therefore observed the ever to be bewailed non-proficiency of many ingenious spirits, who through the policy of others, and the too too much modesty and temerity of themselves, have precluded the way of progress to the top and pitch of rest and perfection against themselves, as being altogether unattainable, and have shortned the cut with a Non datur ultra [more is not given], and are become such who are ever learning and never come to the knowledge of the truth.’ But for the measure, sure it is not as Antinomians and Familists dream, complete and full in this life: 1. Because according to the manner and measure of the manifestation of Christ and knowledge, so is love and the perfection of believers. This is a truth in itself undeniable and granted by the author of the Bright Star, ch. 5, p. 52. For Christ’s excellency and drawing beauty in love goes in to the soul by the port and eye of knowledge. But 1 Cor. 13:9, ‘We know in part and we prophesy in part.’ 2. Paul disclaimes perfection as being but in the way and journeying toward it, Phil. 3:12, ‘Not as though I had already attained, either were already perfect: but I follow after, if that I may apprehend that for which also I am apprehended of Jesus Christ.’ Now this perfection which Paul professes he wants [lacks], is opposed vv. 13-14, to his pressing toward the garland, for the price of the high calling of God in Jesus Christ, Heb. 11:40. 3. Perfection, such as we expect in heaven, is in no capacity to receive any farther addition, or accession of grace or glory; nor is there a growing in grace and in the knowledge of our Lord and Saviour Jesus Christ, enjoined us there, as is expressly here in the way to our country, 2 Pet. 3:14, and to run our race to the end, Heb. 12:1, and be carried on to perfection, Heb. 6:1. It’s true, our good works are washed in the fountain opened for David’s house, in which our persons are washed; but that washing removes the sinful guilt, and Law-obligation from them, but not the inherent blot and sinful imperfection of our works, to make them perfect; for then might we be justified by our good works, if Christ’s blood make them to leave off to be sins; but that blood hinders them to be imputed to us only, but removes not their sinfull imperfections, as Antinomians say, that so they may make us perfect in this life: nor does that blood (as Papists say) add a meriting dignity and virtue to them, by which we are justified by works made white and meritorious in Christ’s blood and merits. God has so portraicted and chalked the way to heaven that all the most supernatural acts, even those that have immediate bordering with the vision of glory, should need a pass of pardoning grace; and to believe that Christ’s grace shall work in us acts void of sin, is not faith. Therefore we are to believe the pardon of such ere they have being, and not sanctifying grace to eschew them. It seems to me unbelieving murmuring to be cast down at these sins in such a way as to imagine we can eschew them, or that grace sanctifying is wanting to us in these; for grace is not due to sinless acts. Nor does the growing in grace which lies on us, by an obligation of a command, stop the way to the journeying toward perfection and heaven, nor shorten the cut to heaven, because heaven is not attainable in this life; but by the contrary, if perfection were attainable in this life, the man that attains it might sit down, rest there, and go not one step farther; for except he should go beyond the crown, and to the other side of heaven, and over-journey Christ at the right hand of God, whither should he go? And those that are ever learning and never come to the knowledge of the truth, are, 2 Tim. 3:5, lovers of pleasures more than lovers of God; such as we are to turn away from; as have a form of godliness, and have denied the power thereof; and are led away with diverse lusts; and are never entered into one only degree or step of the way of the saving knowledge of the truth, of which Paul speaks, and not the truly regenerate, who believe, with Paul and the Scriptures, that our greatest perfection is to sweat and contend for the highest pitch of perfection, even that which is beyond time. 4. Those that are perfected, as we hope we shall be in heaven, feed not with the Beloved among the lillies till the day break and the shadows fly away; but the perfectest, the Spouse of Christ, so feeds on Church-ordinances, Cant. 2:17. The perfect ones have the fullest pitch of the noon-day sun of glory; it shall never be afternoon nor the evening or twilight sky with them; nor shall any night-shadow nor cloud go over their sun. 5. In the Kingdom of perfect, on there shall be no indwelling of a body of sin, no sin, no uncleanness of heart, no turning of the love and liking of the soul off God; but the perfectest in this life sin and carry an indwelling body of sin with them; Prov. 20:9; Eccl. 7:20; Job says, ch. 14.4, The perfectest that beget children are unclean. Rom. 7:17-23; 1 Jn. 1:8-10; 1 Jn. 2:1. All that have need of a High Priest at the right hand of God to intercede for them, have sin, and insofar are imperfect, as all the saints are, Heb. 7:25 &amp; 4:15 &amp; 1:17-18 &amp; 8:1-2, • &amp; 9:23-26. And 1 Cor. 13:8, ‘Love never faileth:’ 〈…〉 abundantly, and is filled to satisfaction, that t•e 〈◊〉 I can contain no more of God; and is transformed in 〈…〉 of transcendent light, and highest love, as it were l•st in the deep fountain of universal and immensurable love and light; and the creature’s soul and love lives and breathes, rests in the bosom, in the heart, in the bowels of him who is an infinite mass of love; is wrapped in the sugared floods, in the honey-brooks and over-flowing waves and rivers of pure and unmixed joy, sleeps and solaces itself in the innocent embracings of the glory that shines, rays, and darts, world without end, out of Christ, exalted far above all heavens, all principalities, and powers, the souls there are sweetened, more than sweetened, over-solaced with the noonday-light of the Bridegroom’s glory, having in it the sweetest perfections of the morning-sun; they flee with doves’ wings of beauty after the Lamb, they never want the actual breathings of the Spirit of glory, they can never have enough of the chaste fruition of the glorious Prince Immanuel and they never want his inmost presence to the full; they suck the honey, the floods of milk of eternal consolations, and •ll all empty desires; and as if the soul were without bottom, afresh they suck again in acts for eternity continued; there be no such thing here in this life. Yet has Christ crucified in his bosom, the promise and full purchase of this life on the cross, and holds it out to sinners to draw them. 5 [sic]. We have not yet attained to the resurrection of our bodies, but cary about such clods of death as the wormes must sweetly feed on, and have a seed, and subject of distempers in our clay-tabernacles; all which we are uncapable of in the state of perfection, when the body shall be more naturally clothed with immortality, then the greenest and most delicious rose or flower which we could suppose were growing fresh, greene, and beautiful forever in such a happy soil as the fields that lie on the banks and within the drawings of sap from the river of life. 6. We are not masters of the invasion, at least of temptations of devils, of men, here. 7. Perfection makes the general assembly of all the sons of Sion, the heavenly family is never convened, but in place, country, condition separated, some born, some not born, some w•king, some sleeping in the dust, some in their country, some in the way to their country. 8. There is no Temple, no ordinances in our country of perfecttion, Rev.•1.2; 1 Cor. 13:8. 9. Th••e •s •o Ang•l▪ life here without marriage, eating, drinking, begeting of children, Lk. 22:29-30; Mk. 12:25. Clay cannot live, 〈◊〉 earthly, up above the clouds, and visible heavens, till this corruptible shall put on incorruption, 1 Cor. 15.</p></blockquote>

rld without end, out of Christ, exalted far above all heavens, all principalities, and powers, the souls there are sweetened, more than sweetened, over-solaced with the noonday-light of the Bridegroom’s glory, having in it the sweetest perfections of the morning-sun; they flee with doves’ wings of beauty after the Lamb, they never want the actual breathings of the Spirit of glory, they can never have enough of the chaste fruition of the glorious Prince Immanuel and they never want his inmost presence to the full; they suck the honey, the floods of milk of eternal consolations, and •ll all empty desires; and as if the soul were without bottom, afresh they suck again in acts for eternity continued; there be no such thing here in this life. Yet has Christ crucified in his bosom, the promise and full purchase of this life on the cross, and holds it out to sinners to draw them. 5 [sic]. We have not yet attained to the resurrection of our bodies, but cary about such clods of death as the wormes must sweetly feed on, and have a seed, and subject of distempers in our clay-tabernacles; all which we are uncapable of in the state of perfection, when the body shall be more naturally clothed with immortality, then the greenest and most delicious rose or flower which we could suppose were growing fresh, greene, and beautiful forever in such a happy soil as the fields that lie on the banks and within the drawings of sap from the river of life. 6. We are not masters of the invasion, at least of temptations of devils, of men, here. 7. Perfection makes the general assembly of all the sons of Sion, the heavenly family is never convened, but in place, country, condition separated, some born, some not born, some w•king, some sleeping in the dust, some in their country, some in the way to their country. 8. There is no Temple, no ordinances in our country of perfecttion, Rev.•1.2; 1 Cor. 13:8. 9. Th••e •s •o Ang•l▪ life here without marriage, eating, drinking, begeting of children, Lk. 22:29-30; Mk. 12:25. Clay cannot live, 〈◊〉 earthly, up above the clouds, and visible heavens, till this corruptible shall put on incorruption, 1 Cor. 15.”

s+Christ%2C+enjoined+us+there%2C+as+is+expressly+here+in+the+way+to+our+country%2C+2+Pet.+3%3A14%2C+and+to+run+our+race+to+the+end%2C+Heb.+12%3A1%2C+and+be+carried+on+to+perfection%2C+Heb.+6%3A1.+It%E2%80%99s+true%2C+our+good+works+are+washed+in+the+fountain+opened+for+David%E2%80%99s+house%2C+in+which+our+persons+are+washed%3B+but+that+washing+removes+the+sinful+guilt%2C+and+Law-obligation+from+them%2C+but+not+the+inherent+blot+and+sinful+imperfection+of+our+works%2C+to+make+them+perfect%3B+for+then+might+we+be+justified+by+our+good+works%2C+if+Christ%E2%80%99s+blood+make+them+to+leave+off+to+be+sins%3B+but+that+blood+hinders+them+to+be+imputed+to+us+only%2C+but+removes+not+their+sinfull+imperfections%2C+as+Antinomians+say%2C+that+so+they+may+make+us+perfect+in+this+life%3A+nor+does+that+blood+%28as+Papists+say%29+add+a+meriting+dignity+and+virtue+to+them%2C+by+which+we+are+justified+by+works+made+white+and+meritorious+in+Christ%E2%80%99s+blood+and+merits.+God+has+so+portraicted+and+chalked+the+way+to+heaven+that+all+the+most+supernatural+acts%2C+even+those+that+have+immediate+bordering+with+the+vision+of+glory%2C+should+need+a+pass+of+pardoning+grace%3B+and+to+believe+that+Christ%E2%80%99s+grace+shall+work+in+us+acts+void+of+sin%2C+is+not+faith.+Therefore+we+are+to+believe+the+pardon+of+such+ere+they+have+being%2C+and+not+sanctifying+grace+to+eschew+them.+It+seems+to+me+unbelieving+murmuring+to+be+cast+down+at+these+sins+in+such+a+way+as+to+imagine+we+can+eschew+them%2C+or+that+grace+sanctifying+is+wanting+to+us+in+these%3B+for+grace+is+not+due+to+sinless+acts.+Nor+does+the+growing+in+grace+which+lies+on+us%2C+by+an+obligation+of+a+command%2C+stop+the+way+to+the+journeying+toward+perfection+and+heaven%2C+nor+shorten+the+cut+to+heaven%2C+because+heaven+is+not+attainable+in+this+life%3B+but+by+the+contrary%2C+if+perfection+were+attainable+in+this+life%2C+the+man+that+attains+it+might+sit+down%2C+rest+there%2C+and+go+not+one+step+farther%3B+for+except+he+should+go+beyond+the+crown%2C+and+to+the+other+side+of+heaven%2C+and+over-journey+Christ+at+the+right+hand+of+God%2C+whither+should+he+go%3F+And+those+that+are+ever+learning+and+never+come+to+the+knowledge+of+the+truth%2C+are%2C+2+Tim.+3%3A5%2C+lovers+of+pleasures+more+than+lovers+of+God%3B+such+as+we+are+to+turn+away+from%3B+as+have+a+form+of+godliness%2C+and+have+denied+the+power+thereof%3B+and+are+led+away+with+diverse+lusts%3B+and+are+never+entered+into+one+only+degree+or+step+of+the+way+of+the+saving+knowledge+of+the+truth%2C+of+which+Paul+speaks%2C+and+not+the+truly+regenerate%2C+who+believe%2C+with+Paul+and+the+Scriptures%2C+that+our+greatest+perfection+is+to+sweat+and+contend+for+the+highest+pitch+of+perfection%2C+even+that+which+is+beyond+time.+4.+Those+that+are+perfected%2C+as+we+hope+we+shall+be+in+heaven%2C+feed+not+with+the+Beloved+among+the+lillies+till+the+day+break+and+the+shadows+fly+away%3B+but+the+perfectest%2C+the+Spouse+of+Christ%2C+so+feeds+on+Church-ordinances%2C+Cant.+2%3A17.+The+perfect+ones+have+the+fullest+pitch+of+the+noon-day+sun+of+glory%3B+it+shall+never+be+afternoon+nor+the+evening+or+twilight+sky+with+them%3B+nor+shall+any+night-shadow+nor+cloud+go+over+their+sun.+5.+In+the+Kingdom+of+perfect%2C+on+there+shall+be+no+indwelling+of+a+body+of+sin%2C+no+sin%2C+no+uncleanness+of+heart%2C+no+turning+of+the+love+and+liking+of+the+soul+off+God%3B+but+the+perfectest+in+this+life+sin+and+carry+an+indwelling+body+of+sin+with+them%3B+Prov.+20%3A9%3B+Eccl.+7%3A20%3B+Job+says%2C+ch.+14.4%2C+The+perfectest+that+beget+children+are+unclean.+Rom.+7%3A17-23%3B+1+Jn.+1%3A8-10%3B+1+Jn.+2%3A1.+All+that+have+need+of+a+High+Priest+at+the+right+hand+of+God+to+intercede+for+them%2C+have+sin%2C+and+insofar+are+imperfect%2C+as+all+the+saints+are%2C+Heb.+7%3A25+%26+4%3A15+%26+1%3A17-18+%26+8%3A1-2%2C+%E2%80%A2+%26+9%3A23-26.+And+1+Cor.+13%3A8%2C+%E2%80%98Love+never+faileth%3A%E2%80%99+%E3%80%88%E2%80%A6%E3%80%89+abundantly%2C+and+is+filled+to+satisfaction%2C+that+t%E2%80%A2e+%E3%80%88%E2%97%8A%E3%80%89+I+can+contain+no+more+of+God%3B+and+is+transformed+in+%E3%80%88%E2%80%A6%E3%80%89+of+transcendent+light%2C+and+highest+love%2C+as+it+were+l%E2%80%A2st+in+the+deep+fountain+of+universal+and+immensurable+love+and+light%3B+and+the+creature%E2%80%99s+soul+and+love+lives+and+breathes%2C+rests+in+the+bosom%2C+in+the+heart%2C+in+the+bowels+of+him+who+is+an+infinite+mass+of+love%3B+is+wrapped+in+the+sugared+floods%2C+in+the+honey-brooks+and+over-flowing+waves+and+rivers+of+pure+and+unmixed+joy%2C+sleeps+and+solaces+itself+in+the+innocent+embracings+of+the+glory+that+shines%2C+rays%2C+and+darts%2C+world+without+end%2C+out+of+Christ%2C+exalted+far+above+all+heavens%2C+all+principalities%2C+and+powers%2C+the+souls+there+are+sweetened%2C+more+than+sweetened%2C+over-solaced+with+the+noonday-light+of+the+Bridegroom%E2%80%99s+glory%2C+having+in+it+the+sweetest+perfections+of+the+morning-sun%3B+they+flee+with+doves%E2%80%99+wings+of+beauty+after+the+Lamb%2C+they+never+want+the+actual+breathings+of+the+Spirit+of+glory%2C+they+can+never+have+enough+of+the+chaste+fruition+of+the+glorious+Prince+Immanuel+and+they+never+want+his+inmost+presence+to+the+full%3B+they+suck+the+honey%2C+the+floods+of+milk+of+eternal+consolations%2C+and+%E2%80%A2ll+all+empty+desires%3B+and+as+if+the+soul+were+without+bottom%2C+afresh+they+suck+again+in+acts+for+eternity+continued%3B+there+be+no+such+thing+here+in+this+life.+Yet+has+Christ+crucified+in+his+bosom%2C+the+promise+and+full+purchase+of+this+life+on+the+cross%2C+and+holds+it+out+to+sinners+to+draw+them.+5+%5Bsic%5D.+We+have+not+yet+attained+to+the+resurrection+of+our+bodies%2C+but+cary+about+such+clods+of+death+as+the+wormes+must+sweetly+feed+on%2C+and+have+a+seed%2C+and+subject+of+distempers+in+our+clay-tabernacles%3B+all+which+we+are+uncapable+of+in+the+state+of+perfection%2C+when+the+body+shall+be+more+naturally+clothed+with+immortality%2C+then+the+greenest+and+most+delicious+rose+or+flower+which+we+could+suppose+were+growing+fresh%2C+greene%2C+and+beautiful+forever+in+such+a+happy+soil+as+the+fields+that+lie+on+the+banks+and+within+the+drawings+of+sap+from+the+river+of+life.+6.+We+are+not+masters+of+the+invasion%2C+at+least+of+temptations+of+devils%2C+of+men%2C+here.+7.+Perfection+makes+the+general+assembly+of+all+the+sons+of+Sion%2C+the+heavenly+family+is+never+convened%2C+but+in+place%2C+country%2C+condition+separated%2C+some+born%2C+some+not+born%2C+some+w%E2%80%A2king%2C+some+sleeping+in+the+dust%2C+some+in+their+country%2C+some+in+the+way+to+their+country.+8.+There+is+no+Temple%2C+no+ordinances+in+our+country+of+perfecttion%2C+Rev.%E2%80%A21.2%3B+1+Cor.+13%3A8.+9.+Th%E2%80%A2%E2%80%A2e+%E2%80%A2s+%E2%80%A2o+Ang%E2%80%A2l%E2%96%AA+life+here+without+marriage%2C+eating%2C+drinking%2C+begeting+of+children%2C+Lk.+22%3A29-30%3B+Mk.+12%3A25.+Clay+cannot+live%2C+%E3%80%88%E2%97%8A%E3%80%89+earthly%2C+up+above+the+clouds%2C+and+visible+heavens%2C+till+this+corruptible+shall+put+on+incorruption%2C+1+Cor.+15.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+342-45&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc27e8c9ec7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c27e8c9ec7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfectionism/#:~:text=Randall%20in%20his%20epistle%20before%20the,put%20on%20incorruption%2C%201%20Cor.%2015&amp;text=Randall%20in%20his%20epistle%20before%20the%20treatise%20called&amp;text=corruptible%20shall%20put%20on%20incorruption%2C%201%20Cor.%2015" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>FIRST, I shall consider the kinds of sanctification distinguishable. Sanctification of a soul is twofold. 1. Initial sanctification, which is the implanting of the seeds of grace in the soul at first, and is the same with regeneration, 1 John 3:9 wherein the Spirit of Christ comes into the man’s heart with his graces, and takes possession of him for God. The whole soul is cast into a new mould and frame, and the image of God is drawn anew upon it. 2. Progressive sanctification, whereby that change is carried on more and more, the Spirit holding hand to the begun work, Acts 20:32. Satan’s image is more defaced, and the image of God more perfected in the soul; corruption more weakened, and grace more excited and strengthened. This work lasts through the saint’s whole life, and is never perfected till death. These are one and the same work for substance, though differing in circumstances; and no man has the one, but he has the other too. Initial sanctification goes before justification in the order of nature, as being the principle from which faith doth arise; and this accounts for the apostle’s order in the text: but progressive sanctification, i. e. sanctification distinguished from regeneration, follows justification. SECONDLY, Let us consider the Author of sanctification, whose work it is. 1. Negatively, It is not the sinner himself, nor any other creature, who is the author of it. We can well defile ourselves with all impurity, but cannot cleanse ourselves. We will lie still in our filthiness, till help come from another quarter, Eph. 2:1. We are bid to cleanse our hands and hearts: but, alas! the rule of our duty is not the measure of our strength. 2. Positively, It is the work of God; for it needs no less power than was necessary for creating a world, or raising the dead. It is the work of a whole Trinity to sanctify a soul, as lightly as many think of being holy. It is the work of the Father, Jude, ver. 1 ‘Sanctified by God the Father;’ of the Son, Eph. 5:26. ‘That he (Christ) might sanctify—it;’ of the Holy Spirit, 2 Thess. 2:13. ‘Through sanctification of the Spirit.’ But in a special manner it belongs to the Spirit; as the Father elects, the Son redeems, and the Holy Ghost sanctifies. It is the work of the Spirit of God then.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“FIRST, I shall consider the kinds of sanctification distinguishable. Sanctification of a soul is twofold. 1. Initial sanctification, which is the implanting of the seeds of grace in the soul at first, and is the same with regeneration, 1 John 3:9 wherein the Spirit of Christ comes into the man’s heart with his graces, and takes possession of him for God. The whole soul is cast into a new mould and frame, and the image of God is drawn anew upon it. 2. Progressive sanctification, whereby that change is carried on more and more, the Spirit holding hand to the begun work, Acts 20:32. Satan’s image is more defaced, and the image of God more perfected in the soul; corruption more weakened, and grace more excited and strengthened. This work lasts through the saint’s whole life, and is never perfected till death. These are one and the same work for substance, though differing in circumstances; and no man has the one, but he has the other too. Initial sanctification goes before justification in the order of nature, as being the principle from which faith doth arise; and this accounts for the apostle’s order in the text: but progressive sanctification, i. e. sanctification distinguished from regeneration, follows justification. SECONDLY, Let us consider the Author of sanctification, whose work it is. 1. Negatively, It is not the sinner himself, nor any other creature, who is the author of it. We can well defile ourselves with all impurity, but cannot cleanse ourselves. We will lie still in our filthiness, till help come from another quarter, Eph. 2:1. We are bid to cleanse our hands and hearts: but, alas! the rule of our duty is not the measure of our strength. 2. Positively, It is the work of God; for it needs no less power than was necessary for creating a world, or raising the dead. It is the work of a whole Trinity to sanctify a soul, as lightly as many think of being holy. It is the work of the Father, Jude, ver. 1 ‘Sanctified by God the Father;’ of the Son, Eph. 5:26. ‘That he (Christ) might sanctify—it;’ of the Holy Spirit, 2 Thess. 2:13. ‘Through sanctification of the Spirit.’ But in a special manner it belongs to the Spirit; as the Father elects, the Son redeems, and the Holy Ghost sanctifies. It is the work of the Spirit of God then.”

— Thomas Boston, The Whole Works of Thomas Boston: An Illustration of the Doctrines of the Christian Religion, Part 1, ed. Samuel M‘Millan, vol. 1 (George and Robert King, 1848), 655.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFIRST%2C+I+shall+consider+the+kinds+of+sanctification+distinguishable.+Sanctification+of+a+soul+is+twofold.+1.+Initial+sanctification%2C+which+is+the+implanting+of+the+seeds+of+grace+in+the+soul+at+first%2C+and+is+the+same+with+regeneration%2C+1+John+3%3A9+wherein+the+Spirit+of+Christ+comes+into+the+man%E2%80%99s+heart+with+his+graces%2C+and+takes+possession+of+him+for+God.+The+whole+soul+is+cast+into+a+new+mould+and+frame%2C+and+the+image+of+God+is+drawn+anew+upon+it.+2.+Progressive+sanctification%2C+whereby+that+change+is+carried+on+more+and+more%2C+the+Spirit+holding+hand+to+the+begun+work%2C+Acts+20%3A32.+Satan%E2%80%99s+image+is+more+defaced%2C+and+the+image+of+God+more+perfected+in+the+soul%3B+corruption+more+weakened%2C+and+grace+more+excited+and+strengthened.+This+work+lasts+through+the+saint%E2%80%99s+whole+life%2C+and+is+never+perfected+till+death.+These+are+one+and+the+same+work+for+substance%2C+though+differing+in+circumstances%3B+and+no+man+has+the+one%2C+but+he+has+the+other+too.+Initial+sanctification+goes+before+justification+in+the+order+of+nature%2C+as+being+the+principle+from+which+faith+doth+arise%3B+and+this+accounts+for+the+apostle%E2%80%99s+order+in+the+text%3A+but+progressive+sanctification%2C+i.+e.+sanctification+distinguished+from+regeneration%2C+follows+justification.+SECONDLY%2C+Let+us+consider+the+Author+of+sanctification%2C+whose+work+it+is.+1.+Negatively%2C+It+is+not+the+sinner+himself%2C+nor+any+other+creature%2C+who+is+the+author+of+it.+We+can+well+defile+ourselves+with+all+impurity%2C+but+cannot+cleanse+ourselves.+We+will+lie+still+in+our+filthiness%2C+till+help+come+from+another+quarter%2C+Eph.+2%3A1.+We+are+bid+to+cleanse+our+hands+and+hearts%3A+but%2C+alas%21+the+rule+of+our+duty+is+not+the+measure+of+our+strength.+2.+Positively%2C+It+is+the+work+of+God%3B+for+it+needs+no+less+power+than+was+necessary+for+creating+a+world%2C+or+raising+the+dead.+It+is+the+work+of+a+whole+Trinity+to+sanctify+a+soul%2C+as+lightly+as+many+think+of+being+holy.+It+is+the+work+of+the+Father%2C+Jude%2C+ver.+1+%E2%80%98Sanctified+by+God+the+Father%3B%E2%80%99+of+the+Son%2C+Eph.+5%3A26.+%E2%80%98That+he+%28Christ%29+might+sanctify%E2%80%94it%3B%E2%80%99+of+the+Holy+Spirit%2C+2+Thess.+2%3A13.+%E2%80%98Through+sanctification+of+the+Spirit.%E2%80%99+But+in+a+special+manner+it+belongs+to+the+Spirit%3B+as+the+Father+elects%2C+the+Son+redeems%2C+and+the+Holy+Ghost+sanctifies.+It+is+the+work+of+the+Spirit+of+God+then.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+Part+1%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+1+%28George+and+Robert+King%2C+1848%29%2C+655.+%28HT%3A+Jim+Lincoln%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a31cc7b5c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a31cc7b5c.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/02/boston-sanctification-is-the-work-of-the-trinity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-e99c9da934" data-kw="">
<blockquote><p>Q133 Therefore, explain fully this sanctification of ours in Christ. A133 Something is said to be sanctified which is segregated from common pollution, so that it is most pure, and wholly consecrated to God the greatest adversary of all filth. Therefore, in this way our nature is sanctified in Christ from the very moment of conception, and so He sanctifies us. Furthermore it happens in two ways. First, as I have said, we are reckoned righteous by the imputed righteousness of Christ fully before God, not in ourselves, but in Him to whom we are united through faith. So also I say that our persons, by the imputation of His perfect holiness and integrity, are reckoned holy and whole and thus acceptable to the Father, not in ourselves, but in Christ. Finally, the force and energy of this most pure holiness which is in the flesh of Christ, I say it flows also into us by the working of the Holy Spirit in us, so that we become holy in ourselves, that is, segregated from the defilements of this world, and we serve God in spirit and body; which benefit in the scriptures is often termed sanctification, regeneration, illumination, new man, new creature, and spirituality. Q134 Therefore, you say that this latter sanctification is not something outside of us, and is not ours by imputation alone, but is a new endowment truly ingrafted and clinging in us, by the mere grace of the heavenly Father, and by the power of the Holy Spirit, diffused in us. A134 I say so. Q135 Therefore, to what end is the other sanctification of our nature which is imputed to us? A135 Because this sanctification which is inherent in us is unfinished in us, as is apparent by the perpetual warfare between the flesh and the spirit in us, even in the best men. Therefore, in order that our persons might be acceptable to God, and consequently so that which comes forth from us might please Him (for the life of the saints is as a kind of continual offering up of oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q133 Therefore, explain fully this sanctification of ours in Christ. A133 Something is said to be sanctified which is segregated from common pollution, so that it is most pure, and wholly consecrated to God the greatest adversary of all filth. Therefore, in this way our nature is sanctified in Christ from the very moment of conception, and so He sanctifies us. Furthermore it happens in two ways. First, as I have said, we are reckoned righteous by the imputed righteousness of Christ fully before God, not in ourselves, but in Him to whom we are united through faith. So also I say that our persons, by the imputation of His perfect holiness and integrity, are reckoned holy and whole and thus acceptable to the Father, not in ourselves, but in Christ. Finally, the force and energy of this most pure holiness which is in the flesh of Christ, I say it flows also into us by the working of the Holy Spirit in us, so that we become holy in ourselves, that is, segregated from the defilements of this world, and we serve God in spirit and body; which benefit in the scriptures is often termed sanctification, regeneration, illumination, new man, new creature, and spirituality. Q134 Therefore, you say that this latter sanctification is not something outside of us, and is not ours by imputation alone, but is a new endowment truly ingrafted and clinging in us, by the mere grace of the heavenly Father, and by the power of the Holy Spirit, diffused in us. A134 I say so. Q135 Therefore, to what end is the other sanctification of our nature which is imputed to us? A135 Because this sanctification which is inherent in us is unfinished in us, as is apparent by the perpetual warfare between the flesh and the spirit in us, even in the best men. Therefore, in order that our persons might be acceptable to God, and consequently so that which comes forth from us might please Him (for the life of the saints is as a kind of continual offering up of oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.”

2C+as+is+apparent+by+the+perpetual+warfare+between+the+flesh+and+the+spirit+in+us%2C+even+in+the+best+men.+Therefore%2C+in+order+that+our+persons+might+be+acceptable+to+God%2C+and+consequently+so+that+which+comes+forth+from+us+might+please+Him+%28for+the+life+of+the+saints+is+as+a+kind+of+continual+offering+up+of+oneself%2C%2A+to+which+the+apostle+exhorted+us%29%2C+another+sanctification+must+intervene%3B+clearly%2C+another+which+is+most+full+and+whole+in+Christ%2C+in+whom+our+most+kind+Father%2C+looking%2C+might+acquiesce%2C+He+who+is+a+perpetual+enemy+to+all+uncleanness%2C+and+is+the+most+just+and+merciful.+Q136+But+why+does+He+not+completely+sanctify+us+immediately%3F+A136+No%2C+instead+marvel+at+His+goodness%2C+in+that+He+instills+any+little+drop+of+regenerating+grace+in+man.+Yet+why+He+defers+the+full+sanctification+of+us+into+another+age%2C+there+are+many+reasons%2C+and+chiefly+two.+One%2C+because+we+are+of+little+faith%2C+and+therefore%2C+as+much+as+is+in+us%2C+we+impede+the+inworking+of+the+Holy+Spirit.+The+second%2C+so+that%2C+as+we+are+saved+by+grace+alone%2C+and+not+by+works%2C+he+who+glories%2C+should+glory+only+in+God.+For+if+this+sanctification+were+complete+in+us%2C+our+righteousness+would+also+be+complete%2C+or+inherent+in+us%2C+and+then+Christ+would+not+be+wholly+and+properly+our+Saviour%2C+but+only+the+tool+and+instrument+for+disposing+us+in+such+a+way+that+we+might+justify+ourselves+by+our+own+righteousness%2C+which+is+plainly+the+foul+and+detestable+error+of+the+Semi-Pelagian+Sophists.37+37.+Semi-Pelagianism+was+revived+in+the+16th+Century+by+the+Jesuit+theologian+Luis+Molina%2C+and+emphasized+man%E2%80%99s+free+will+in+obtaining+his+own+salvation.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Little+Book+of+Christian+Questions+and+Responses%2C+ed.+Dikran+Y.+Hadidian%2C+trans.+Kirk+M.+Summers%2C+vol.+9%2C+Princeton+Theological+Monograph+Series+%28Eugene%2C+OR%3A+Pickwick+Publications%2C+2009%29%2C+51%E2%80%9353.&amp;url=https%3A%2F%2F5solasquotes.gi <blockquote><p>Sanctification is a work of the triune God, but is ascribed more particularly to the Holy Spirit in Scripture, Rom. 8:11; 15:16; 1 Pet. 1:2. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to co-operate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally. In so far as sanctification takes place in the subconscious life, it is effected by the immediate operation of the Holy Spirit. But as a work in the conscious life of believers it is wrought, by several means, which the Holy Spirit employs.</p></blockquote>

<blockquote><p>And what is the reason for denying that sanctification is a mystery, i.e., the content of a dogma? The supposition that it is of human origin, that man is not totally unable, and that sanctification is betterment of character and life. Hence it is tantamount to (1) a lowering of holiness to the human standpoint; (2) an opposing sanctification as a work of God. And this is a very serious matter. We should again become clearly conscious of the fact that the holiness without which no man shall see God is not attained by the departing from some evil and the habitual doing of some good. The demand of sanctification belongs to the Covenant of Works; sanctification itself to the Covenant of Grace. This makes the difference very obvious. Not as tho the Covenant of Works commanded man to sanctify himself; given to holy men, it excluded sanctification. But God gave the Covenant of Grace to unholy men. And the only connection between the demand for sanctification and the Covenant of Works is, that the latter ever pursues fallen man with this demand, and with the terror of Horeb. Unholiness destroys the foundation of the Covenant of Works and renders compliance with its conditions impossible. Hence the absolute contradiction between it and the sinner’s personal life. The one must make room for the other; they can not stand together. In this painful conflict we are often tempted to ask whether God is not unjust in His law to demand of us the impossible, and to lay the blame on Him; for did He not make us so? And from this difficulty the Arminian in our own heart seeks to escape, either by denying that there ever was a Covenant of Works, or by substituting the fulfilment of the law for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit</cite>, (New York; London: Funk &amp; Wagnalls, 1900), 438–39</span></figcaption>

<blockquote><p>1. This whole matter of sanctification and holiness is peculiarly joined with and limited unto the doctrine, truth, and grace of the gospel; for holiness is nothing but the implanting, writing, and realizing of the gospel in our souls. Hence it is termed Ὁσιότης τῆς ἀληθείας, Eph. 4:24,—“The holiness of truth;” which the truth of the gospel ingenerates, and which consists in a conformity thereunto. And the gospel itself is ἀληθείας τῆς κατ᾿ εὐσέβειαν, Tit. 1:1,—“The truth which is according unto godliness;” which declares that godliness and holiness which God requireth. The prayer, also, of our Saviour for our sanctification is conformed thereunto: John 17:17, “Sanctify them in” (or by) “thy truth: thy word is truth.” And he sanctified himself for us to be a sacrifice, that “we might be sanctified in the truth.” This alone is that truth which makes us free, John 8:32,—that is, from sin and the law, unto righteousness in holiness. It belongs neither to nature nor the law, so as to proceed from them or to be effected by them. Nature is wholly corrupted and contrary unto it. The “law,” indeed, for certain ends, “was given by Moses,” but all “grace and truth came by Jesus Christ.” There neither is, nor ever was, in the world, nor ever shall be, the least dram of holiness, but what, flowing from Jesus Christ, is communicated by the Spirit, according to the truth and promise of the gospel. There may be something like it as to its outward acts and effects (at least some of them), something that may wear its livery in the world, that is but the fruit of men’s own endeavours in compliance with their convictions; but holiness it is not, nor of the same kind or nature with it. And this men are very apt to deceive themselves withal. It is the design of corrupted reason to debase all the glorious mysteries of the gospel, and all the concernments of them. There is nothing in the whole mystery of godliness, from the highest crown of it, which is the person of Christ, “God manifested in the flesh,” unto the lowest and nearest effect of this grace, but it labours to deprave, dishonour, and debase. The Lord Christ, it would have in his whole person to be but a mere man, in his obedience and suffering to be but an example, in his doctrine to be confined unto the capacity and comprehension of carnal reason, and the holiness which he communicates by the sanctification of his Spirit to be but that moral virtue which is common among men as the fruit of their own endeavours. Herein some will acknowledge that men are guided and directed to a great advantage by the doctrine of the gospel, and thereunto excited by motions of the Holy Ghost himself, put forth in the dispensation of that truth; but any thing else in it more excellent, more mysterious, they will not allow. But these low and carnal imaginations are exceedingly unworthy of the grace of Christ, the glory of the gospel, the mystery of the recovery of our nature, and healing of the wound it received by the entrance of sin, with the whole design of God in our restoration unto a state of communion with himself. Moral virtue is, indeed, the best thing amongst men that is of them. It far exceeds in worth, use, and satisfaction, all that the honours, powers, profits, and pleasures of the world can extend unto. And it is admirable to consider what instructions are given concerning it, what expressions are made of its excellency, what encomiums of its use and beauty, by learned contemplative men among the heathen; the wisest of whom did acknowledge that there was yet something in it which they could only admire, and not comprehend. And very eminent instances of the practice of it were given in the lives and conversations of some of them; and as the examples of their righteousness, moderation, temperance, equanimity, in all conditions, rise up at present unto the shame and reproach of many that are called Christians, so they will be called over at the last day as an aggravation of their condemnation. But to suppose that this moral virtue, whatever it be really in its own nature, or however advanced in the imaginations of men, is that holiness of truth which believers receive by the Spirit of Christ, is to debase it, to overthrow it, and to drive the souls of men from seeking an interest in it. And hence it is that some, pretending highly a friendship and respect unto it, do yet hate, despise, and reproach what is really so, pleasing themselves with the empty name or withered carcass of virtue, every way inferior, as interpreted in their practice, to the righteousness of heathens. And this, in the first place, should stir up our diligence in our inquiries after its true and real nature, that we deceive not ourselves with a false appearance of it, and that unto our ruin.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. This whole matter of sanctification and holiness is peculiarly joined with and limited unto the doctrine, truth, and grace of the gospel; for holiness is nothing but the implanting, writing, and realizing of the gospel in our souls. Hence it is termed Ὁσιότης τῆς ἀληθείας, Eph. 4:24,—“The holiness of truth;” which the truth of the gospel ingenerates, and which consists in a conformity thereunto. And the gospel itself is ἀληθείας τῆς κατ᾿ εὐσέβειαν, Tit. 1:1,—“The truth which is according unto godliness;” which declares that godliness and holiness which God requireth. The prayer, also, of our Saviour for our sanctification is conformed thereunto: John 17:17, “Sanctify them in” (or by) “thy truth: thy word is truth.” And he sanctified himself for us to be a sacrifice, that “we might be sanctified in the truth.” This alone is that truth which makes us free, John 8:32,—that is, from sin and the law, unto righteousness in holiness. It belongs neither to nature nor the law, so as to proceed from them or to be effected by them. Nature is wholly corrupted and contrary unto it. The “law,” indeed, for certain ends, “was given by Moses,” but all “grace and truth came by Jesus Christ.” There neither is, nor ever was, in the world, nor ever shall be, the least dram of holiness, but what, flowing from Jesus Christ, is communicated by the Spirit, according to the truth and promise of the gospel. There may be something like it as to its outward acts and effects (at least some of them), something that may wear its livery in the world, that is but the fruit of men’s own endeavours in compliance with their convictions; but holiness it is not, nor of the same kind or nature with it. And this men are very apt to deceive themselves withal. It is the design of corrupted reason to debase all the glorious mysteries of the gospel, and all the concernments of them. There is nothing in the whole mystery of godliness, from the highest crown of it, which is the person of Christ, “God manifested in the flesh,” unto the lowest and nearest effect of this grace, but it labours to deprave, dishonour, and debase. The Lord Christ, it would have in his whole person to be but a mere man, in his obedience and suffering to be but an example, in his doctrine to be confined unto the capacity and comprehension of carnal reason, and the holiness which he communicates by the sanctification of his Spirit to be but that moral virtue which is common among men as the fruit of their own endeavours. Herein some will acknowledge that men are guided and directed to a great advantage by the doctrine of the gospel, and thereunto excited by motions of the Holy Ghost himself, put forth in the dispensation of that truth; but any thing else in it more excellent, more mysterious, they will not allow. But these low and carnal imaginations are exceedingly unworthy of the grace of Christ, the glory of the gospel, the mystery of the recovery of our nature, and healing of the wound it received by the entrance of sin, with the whole design of God in our restoration unto a state of communion with himself. Moral virtue is, indeed, the best thing amongst men that is of them. It far exceeds in worth, use, and satisfaction, all that the honours, powers, profits, and pleasures of the world can extend unto. And it is admirable to consider what instructions are given concerning it, what expressions are made of its excellency, what encomiums of its use and beauty, by learned contemplative men among the heathen; the wisest of whom did acknowledge that there was yet something in it which they could only admire, and not comprehend. And very eminent instances of the practice of it were given in the lives and conversations of some of them; and as the examples of their righteousness, moderation, temperance, equanimity, in all conditions, rise up at present unto the shame and reproach of many that are called Christians, so they will be called over at the last day as an aggravation of their condemnation. But to suppose that this moral virtue, whatever it be really in its own nature, or however advanced in the imaginations of men, is that holiness of truth which believers receive by the Spirit of Christ, is to debase it, to overthrow it, and to drive the souls of men from seeking an interest in it. And hence it is that some, pretending highly a friendship and respect unto it, do yet hate, despise, and reproach what is really so, pleasing themselves with the empty name or withered carcass of virtue, every way inferior, as interpreted in their practice, to the righteousness of heathens. And this, in the first place, should stir up our diligence in our inquiries after its true and real nature, that we deceive not ourselves with a false appearance of it, and that unto our ruin.”

— John Owen, The Works of John Owen, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 370.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+This+whole+matter+of+sanctification+and+holiness+is+peculiarly+joined+with+and+limited+unto+the+doctrine%2C+truth%2C+and+grace+of+the+gospel%3B+for+holiness+is+nothing+but+the+implanting%2C+writing%2C+and+realizing+of+the+gospel+in+our+souls.+Hence+it+is+termed+%E1%BD%89%CF%83%CE%B9%CF%8C%CF%84%CE%B7%CF%82+%CF%84%E1%BF%86%CF%82+%E1%BC%80%CE%BB%CE%B7%CE%B8%CE%B5%CE%AF%CE%B1%CF%82%2C+Eph.+4%3A24%2C%E2%80%94%E2%80%9CThe+holiness+of+truth%3B%E2%80%9D+which+the+truth+of+the+gospel+ingenerates%2C+and+which+consists+in+a+conformity+thereunto.+And+the+gospel+itself+is+%E1%BC%80%CE%BB%CE%B7%CE%B8%CE%B5%CE%AF%CE%B1%CF%82+%CF%84%E1%BF%86%CF%82+%CE%BA%CE%B1%CF%84%E1%BE%BF+%CE%B5%E1%BD%90%CF%83%CE%AD%CE%B2%CE%B5%CE%B9%CE%B1%CE%BD%2C+Tit.+1%3A1%2C%E2%80%94%E2%80%9CThe+truth+which+is+according+unto+godliness%3B%E2%80%9D+which+declares+that+godliness+and+holiness+which+God+requireth.+The+prayer%2C+also%2C+of+our+Saviour+for+our+sanctification+is+conformed+thereunto%3A+John+17%3A17%2C+%E2%80%9CSanctify+them+in%E2%80%9D+%28or+by%29+%E2%80%9Cthy+truth%3A+thy+word+is+truth.%E2%80%9D+And+he+sanctified+himself+for+us+to+be+a+sacrifice%2C+that+%E2%80%9Cwe+might+be+sanctified+in+the+truth.%E2%80%9D+This+alone+is+that+truth+which+makes+us+free%2C+John+8%3A32%2C%E2%80%94that+is%2C+from+sin+and+the+law%2C+unto+righteousness+in+holiness.+It+belongs+neither+to+nature+nor+the+law%2C+so+as+to+proceed+from+them+or+to+be+effected+by+them.+Nature+is+wholly+corrupted+and+contrary+unto+it.+The+%E2%80%9Claw%2C%E2%80%9D+indeed%2C+for+certain+ends%2C+%E2%80%9Cwas+given+by+Moses%2C%E2%80%9D+but+all+%E2%80%9Cgrace+and+truth+came+by+Jesus+Christ.%E2%80%9D+There+neither+is%2C+nor+ever+was%2C+in+the+world%2C+nor+ever+shall+be%2C+the+least+dram+of+holiness%2C+but+what%2C+flowing+from+Jesus+Christ%2C+is+communicated+by+the+Spirit%2C+according+to+the+truth+and+promise+of+the+gospel.+There+may+be+something+like+it+as+to+its+outward+acts+and+effects+%28at+least+some+of+them%29%2C+something+that+may+wear+its+livery+in+the+world%2C+that+is+but+the+fruit+of+men%E2%80%99s+own+endeavours+in+compliance+with+their+convictions%3B+but+holiness+it+is+not%2C+nor+of+the+same+kind+or+nature+with+it.+And+this+men+are+very+apt+to+deceive+themselves+withal.+It+is+the+design+of+corrupted+reason+to+debase+all+the+glorious+mysteries+of+the+gospel%2C+and+all+the+concernments+of+them.+There+is+nothing+in+the+whole+mystery+of+godliness%2C+from+the+highest+crown+of+it%2C+which+is+the+person+of+Christ%2C+%E2%80%9CGod+manifested+in+the+flesh%2C%E2%80%9D+unto+the+lowest+and+nearest+effect+of+this+grace%2C+but+it+labours+to+deprave%2C+dishonour%2C+and+debase.+The+Lord+Christ%2C+it+would+have+in+his+whole+person+to+be+but+a+mere+man%2C+in+his+obedience+and+suffering+to+be+but+an+example%2C+in+his+doctrine+to+be+confined+unto+the+capacity+and+comprehension+of+carnal+reason%2C+and+the+holiness+which+he+communicates+by+the+sanctification+of+his+Spirit+to+be+but+that+moral+virtue+which+is+common+among+men+as+the+fruit+of+their+own+endeavours.+Herein+some+will+acknowledge+that+men+are+guided+and+directed+to+a+great+advantage+by+the+doctrine+of+the+gospel%2C+and+thereunto+excited+by+motions+of+the+Holy+Ghost+himself%2C+put+forth+in+the+dispensation+of+that+truth%3B+but+any+thing+else+in+it+more+excellent%2C+more+mysterious%2C+they+will+not+allow.+But+these+low+and+carnal+imaginations+are+exceedingly+unworthy+of+the+grace+of+Christ%2C+the+glory+of+the+gospel%2C+the+mystery+of+the+recovery+of+our+nature%2C+and+healing+of+the+wound+it+received+by+the+entrance+of+sin%2C+with+the+whole+design+of+God+in+our+restoration+unto+a+state+of+communion+with+himself.+Moral+virtue+is%2C+indeed%2C+the+best+thing+amongst+men+that+is+of+them.+It+far+exceeds+in+worth%2C+use%2C+and+satisfaction%2C+all+that+the+honours%2C+powers%2C+profits%2C+and+pleasures+of+the+world+can+extend+unto.+And+it+is+admirable+to+consider+what+instructions+are+given+concerning+it%2C+what+expressions+are+made+of+its+excellency%2C+what+encomiums+of+its+use+and+beauty%2C+by+learned+contemplative+men+among+the+heathen%3B+the+wisest+of+whom+did+acknowledge+that+there+was+yet+something+in+it+which+they+could+only+admire%2C+and+not+comprehend.+And+very+eminent+instances+of+the+practice+of+it+were+given+in+the+lives+and+conversations+of+some+of+them%3B+and+as+the+examples+of+their+righteousness%2C+moderation%2C+temperance%2C+equanimity%2C+in+all+conditions%2C+rise+up+at+present+unto+the+shame+and+reproach+of+many+that+are+called+Christians%2C+so+they+will+be+called+over+at+the+last+day+as+an+aggravation+of+their+condemnation.+But+to+suppose+that+this+moral+virtue%2C+whatever+it+be+really+in+its+own+nature%2C+or+however+advanced+in+the+imaginations+of+men%2C+is+that+holiness+of+truth+which+believers+receive+by+the+Spirit+of+Christ%2C+is+to+debase+it%2C+to+overthrow+it%2C+and+to+drive+the+souls+of+men+from+seeking+an+interest+in+it.+And+hence+it+is+that+some%2C+pretending+highly+a+friendship+and+respect+unto+it%2C+do+yet+hate%2C+despise%2C+and+reproach+what+is+really+so%2C+pleasing+themselves+with+the+empty+name+or+withered+carcass+of+virtue%2C+every+way+inferior%2C+as+interpreted+in+their+practice%2C+to+the+righteousness+of+heathens.+And+this%2C+in+the+first+place%2C+should+stir+up+our+diligence+in+our+inquiries+after+its+true+and+real+nature%2C+that+we+deceive+not+ourselves+with+a+false+appearance+of+it%2C+and+that+unto+our+ruin.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+3+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+370.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc57218b272.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c57218b272.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/02/owen-the-least-dram-of-holiness-never-flowed-except-from-christ-through-the-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-4320a15932" data-kw="">
<blockquote><p>Where sanctification is enjoined us as our duty, it is prescribed under this notion of cleansing ourselves from sin: “Wash you, make you clean,” Isaiah 1:16. “O Jerusalem, wash thine heart from wickedness, that thou mayest be saved,” Jeremiah 4:14. “Having therefore these promises, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God”… Nothing do they more earnestly labor after in their prayers and supplications than a cleansing from it by the blood of Christ, nor are any promises more precious unto them than those which express their purification and purging from it; for these are they which, next unto their interest in the atonement made by the sacrifice of Christ, give them boldness in their approaches unto God. So our apostle fully expresseth it, Hebrews 10:19-22: “Having therefore boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh; and having an high priest over the house of God; let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water…</p></blockquote>

</figure><figure class="quote" id="q-3c498b72ff" data-kw="">
<blockquote><p>Grant, Almighty God, that as thou dost train us up with so much diligence and assiduous care, and regard us as dear and precious like an hereditary vine, – O grant, that we may not bring forth wild grapes, and that our fruit may not be bitter and unpleasant to thee, but that we may strive so to form our whole life in obedience to thy law, that all our actions and thoughts may be pleasant and sweet fruits to thee. And as there is ever some sin mixed up with our works, even when we desire to serve thee sincerely and from the heart, grant that all stains in our works may be so cleansed and washed away by the sacrifice of thy Son, that they may be to thee sacrifices of sweet odour, through the same, even Christ Jesus, who has so reconciled us to thee, as to obtain pardon even for our works. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prayers of John Calvin</cite>, (from his Commentary on Hosea)</span></figcaption>

</figure><figure class="quote" id="q-e3b820959b" data-kw="">
<blockquote><p>1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (1692)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.”

<blockquote><p>Sanctification is a work of the Triune God, that is ascribed more particularly to the Holy Spirit in Scripture. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to cooperate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally… A man may boast of great moral improvement, and yet be an utter stranger to sanctification.</p></blockquote>

<blockquote><p>THE historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestantism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it. On Mystical ground—as, for example, among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men, Perfectionism persistently makes its appearance. It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield: Perfectionism, Part One</cite>, vol. 7 (Bellingham, WA: Logos Bible Software, 2008), 3–4.</span></figcaption>

<figure class="quote" id="q-06fa1177e8" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: …

IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: …

      5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely.

      6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16.

      7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.</p></blockquote>

<blockquote><p>XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.</p></blockquote>

<blockquote><p>XVIII. Baptism indeed promises us the submersion of our Pharaoh and the mortification of sin, yet not so that it is no more or does not trouble us, but only that it does not overcome us, on account of Christ who, by His blood, prevents its power from condemning, and by his Spirit, restrains it from dominating. This is not so that men may sleep securely in their sins, but only that they may not waver and lose heart, who are tickled and pricked by their flesh.</p></blockquote>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are:

1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5).

2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things.

3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13).

4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1).

5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible.

6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4).

7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect.

5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ.

6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law.

7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

<blockquote><p>Randall in his epistle before the treatise called, The Bright Star: ‘I have therefore observed the ever to be bewailed non-proficiency of many ingenious spirits, who through the policy of others, and the too too much modesty and temerity of themselves, have precluded the way of progress to the top and pitch of rest and perfection against themselves, as being altogether unattainable, and have shortned the cut with a Non datur ultra [more is not given], and are become such who are ever learning and never come to the knowledge of the truth.’ But for the measure, sure it is not as Antinomians and Familists dream, complete and full in this life: 1. Because according to the manner and measure of the manifestation of Christ and knowledge, so is love and the perfection of believers. This is a truth in itself undeniable and granted by the author of the Bright Star, ch. 5, p. 52. For Christ’s excellency and drawing beauty in love goes in to the soul by the port and eye of knowledge. But 1 Cor. 13:9, ‘We know in part and we prophesy in part.’

2. Paul disclaimes perfection as being but in the way and journeying toward it, Phil. 3:12, ‘Not as though I had already attained, either were already perfect: but I follow after, if that I may apprehend that for which also I am apprehended of Jesus Christ.’ Now this perfection which Paul professes he wants [lacks], is opposed vv. 13-14, to his pressing toward the garland, for the price of the high calling of God in Jesus Christ, Heb. 11:40.

3. Perfection, such as we expect in heaven, is in no capacity to receive any farther addition, or accession of grace or glory; nor is there a growing in grace and in the knowledge of our Lord and Saviour Jesus Christ, enjoined us there, as is expressly here in the way to our country, 2 Pet. 3:14, and to run our race to the end, Heb. 12:1, and be carried on to perfection, Heb. 6:1. It’s true, our good works are washed in the fountain opened for David’s house, in which our persons are washed; but that washing removes the sinful guilt, and Law-obligation from them, but not the inherent blot and sinful imperfection of our works, to make them perfect; for then might we be justified by our good works, if Christ’s blood make them to leave off to be sins; but that blood hinders them to be imputed to us only, but removes not their sinfull imperfections, as Antinomians say, that so they may make us perfect in this life: nor does that blood (as Papists say) add a meriting dignity and virtue to them, by which we are justified by works made white and meritorious in Christ’s blood and merits. God has so portraicted and chalked the way to heaven that all the most supernatural acts, even those that have immediate bordering with the vision of glory, should need a pass of pardoning grace; and to believe that Christ’s grace shall work in us acts void of sin, is not faith. Therefore we are to believe the pardon of such ere they have being, and not sanctifying grace to eschew them. It seems to me unbelieving murmuring to be cast down at these sins in such a way as to imagine we can eschew them, or that grace sanctifying is wanting to us in these; for grace is not due to sinless acts. Nor does the growing in grace which lies on us, by an obligation of a command, stop the way to the journeying toward perfection and heaven, nor shorten the cut to heaven, because heaven is not attainable in this life; but by the contrary, if perfection were attainable in this life, the man that attains it might sit down, rest there, and go not one step farther; for except he should go beyond the crown, and to the other side of heaven, and over-journey Christ at the right hand of God, whither should he go? And those that are ever learning and never come to the knowledge of the truth, are, 2 Tim. 3:5, lovers of pleasures more than lovers of God; such as we are to turn away from; as have a form of godliness, and have denied the power thereof; and are led away with diverse lusts; and are never entered into one only degree or step of the way of the saving knowledge of the truth, of which Paul speaks, and not the truly regenerate, who believe, with Paul and the Scriptures, that our greatest perfection is to sweat and contend for the highest pitch of perfection, even that which is beyond time.

4. Those that are perfected, as we hope we shall be in heaven, feed not with the Beloved among the lillies till the day break and the shadows fly away; but the perfectest, the Spouse of Christ, so feeds on Church-ordinances, Cant. 2:17. The perfect ones have the fullest pitch of the noon-day sun of glory; it shall never be afternoon nor the evening or twilight sky with them; nor shall any night-shadow nor cloud go over their sun.

5. In the Kingdom of perfect, on there shall be no indwelling of a body of sin, no sin, no uncleanness of heart, no turning of the love and liking of the soul off God; but the perfectest in this life sin and carry an indwelling body of sin with them; Prov. 20:9; Eccl. 7:20; Job says, ch. 14.4, The perfectest that beget children are unclean. Rom. 7:17-23; 1 Jn. 1:8-10; 1 Jn. 2:1. All that have need of a High Priest at the right hand of God to intercede for them, have sin, and insofar are imperfect, as all the saints are, Heb. 7:25 &amp; 4:15 &amp; 1:17-18 &amp; 8:1-2, • &amp; 9:23-26. And 1 Cor. 13:8, ‘Love never faileth:’ 〈…〉 abundantly, and is filled to satisfaction, that t•e 〈◊〉 I can contain no more of God; and is transformed in 〈…〉 of transcendent light, and highest love, as it were l•st in the deep fountain of universal and immensurable love and light; and the creature’s soul and love lives and breathes, rests in the bosom, in the heart, in the bowels of him who is an infinite mass of love; is wrapped in the sugared floods, in the honey-brooks and over-flowing waves and rivers of pure and unmixed joy, sleeps and solaces itself in the innocent embracings of the glory that shines, rays, and darts, world without end, out of Christ, exalted far above all heavens, all principalities, and powers, the souls there are sweetened, more than sweetened, over-solaced with the noonday-light of the Bridegroom’s glory, having in it the sweetest perfections of the morning-sun; they flee with doves’ wings of beauty after the Lamb, they never want the actual breathings of the Spirit of glory, they can never have enough of the chaste fruition of the glorious Prince Immanuel and they never want his inmost presence to the full; they suck the honey, the floods of milk of eternal consolations, and •ll all empty desires; and as if the soul were without bottom, afresh they suck again in acts for eternity continued; there be no such thing here in this life. Yet has Christ crucified in his bosom, the promise and full purchase of this life on the cross, and holds it out to sinners to draw them. 5 [sic]. We have not yet attained to the resurrection of our bodies, but cary about such clods of death as the wormes must sweetly feed on, and have a seed, and subject of distempers in our clay-tabernacles; all which we are uncapable of in the state of perfection, when the body shall be more naturally clothed with immortality, then the greenest and most delicious rose or flower which we could suppose were growing fresh, greene, and beautiful forever in such a happy soil as the fields that lie on the banks and within the drawings of sap from the river of life.

6. We are not masters of the invasion, at least of temptations of devils, of men, here.

7. Perfection makes the general assembly of all the sons of Sion, the heavenly family is never convened, but in place, country, condition separated, some born, some not born, some w•king, some sleeping in the dust, some in their country, some in the way to their country.

8. There is no Temple, no ordinances in our country of perfecttion, Rev.•1.2; 1 Cor. 13:8.

9. Th••e •s •o Ang•l▪ life here without marriage, eating, drinking, begeting of children, Lk. 22:29-30; Mk. 12:25. Clay cannot live, 〈◊〉 earthly, up above the clouds, and visible heavens, till this corruptible shall put on incorruption, 1 Cor. 15.</p></blockquote>

<blockquote><p>FIRST, I shall consider the kinds of sanctification distinguishable. Sanctification of a soul is twofold.

1. Initial sanctification, which is the implanting of the seeds of grace in the soul at first, and is the same with regeneration, 1 John 3:9 wherein the Spirit of Christ comes into the man’s heart with his graces, and takes possession of him for God. The whole soul is cast into a new mould and frame, and the image of God is drawn anew upon it.

2. Progressive sanctification, whereby that change is carried on more and more, the Spirit holding hand to the begun work, Acts 20:32. Satan’s image is more defaced, and the image of God more perfected in the soul; corruption more weakened, and grace more excited and strengthened. This work lasts through the saint’s whole life, and is never perfected till death. These are one and the same work for substance, though differing in circumstances; and no man has the one, but he has the other too. Initial sanctification goes before justification in the order of nature, as being the principle from which faith doth arise; and this accounts for the apostle’s order in the text: but progressive sanctification, i. e. sanctification distinguished from regeneration, follows justification. SECONDLY, Let us consider the Author of sanctification, whose work it is.

1. Negatively, It is not the sinner himself, nor any other creature, who is the author of it. We can well defile ourselves with all impurity, but cannot cleanse ourselves. We will lie still in our filthiness, till help come from another quarter, Eph. 2:1. We are bid to cleanse our hands and hearts: but, alas! the rule of our duty is not the measure of our strength.

2. Positively, It is the work of God; for it needs no less power than was necessary for creating a world, or raising the dead. It is the work of a whole Trinity to sanctify a soul, as lightly as many think of being holy. It is the work of the Father, Jude, ver. 1 ‘Sanctified by God the Father;’ of the Son, Eph. 5:26. ‘That he (Christ) might sanctify—it;’ of the Holy Spirit, 2 Thess. 2:13. ‘Through sanctification of the Spirit.’ But in a special manner it belongs to the Spirit; as the Father elects, the Son redeems, and the Holy Ghost sanctifies. It is the work of the Spirit of God then.</p></blockquote>

r+duty+is+not+the+measure+of+our+strength.+2.+Positively%2C+It+is+the+work+of+God%3B+for+it+needs+no+less+power+than+was+necessary+for+creating+a+world%2C+or+raising+the+dead.+It+is+the+work+of+a+whole+Trinity+to+sanctify+a+soul%2C+as+lightly+as+many+think+of+being+holy.+It+is+the+work+of+the+Father%2C+Jude%2C+ver.+1+%E2%80%98Sanctified+by+God+the+Father%3B%E2%80%99+of+the+Son%2C+Eph.+5%3A26.+%E2%80%98That+he+%28Christ%29+might+sanctify%E2%80%94it%3B%E2%80%99+of+the+Holy+Spirit%2C+2+Thess.+2%3A13.+%E2%80%98Through+sanctification+of+the+Spirit.%E2%80%99+But+in+a+special+manner+it+belongs+to+the+Spirit%3B+as+the+Father+elects%2C+the+Son+redeems%2C+and+the+Holy+Ghost+sanctifies.+It+is+the+work+of+the+Spirit+of+God+then.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+Part+1%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+1+%28George+and+Robert+King%2C+1848%29%2C+655.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a31cc7b5c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a31cc7b5c.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/02/boston-sanctification-is-the-work-of-the-trinity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>In sanctification, which is greater in the New Testament as to higher illumination of the intellect (as to mode), which is not external and ceremonial (which even a hypocrite may have), but internal (as to efficacy), which is greater on account of the greater measure and virtue of the Spirit and as to the motives, which are far stronger, being drawn from the example of Christ.</p></blockquote>

<blockquote><p>But although sanctification flows forth from the same Christ seized by faith, and leads us to the same place, namely the attainment of eternal life, it would nevertheless be mere madness to add something to the most perfect righteousness of Christ to obtain salvation, because it has reason of cause—it would be to dream. And because it is inchoate within us, it is never perfected here. Therefore, certainly this righteousness is inherent in us, but it is inchoate, so that we rest upon no part of it at all as a cause of our reconciliation and salvation. But we nevertheless hold it as a sure sign (τεκμηρίῳ) of our faith and of the perfect justification imputed to us.</p></blockquote>

<blockquote><p>[T]hat we must be reconciled to God, and justified by the remission of our sins, and imputation of righteousness, before any sincere obedience to the law; that we may be enabled for the practice of it. They account, that this doctrine tends to the subversion of a holy practice, and is a great pillar of Antinomianism; and that the only way to establish sincere obedience, is to make it rather a condition to be performed before our actual justification, and reconciliation before God. Therefore some late divines have thought fit to bring the doctrine of former Protestants concerning justification, to their anvil, and to hammer it into another form, that it might be more free of Antinomianism, and effectual to secure a holy practice. But their labor is vain and pernicious, tending to Antinomian profaneness, or painted hypocrisy at best; neither can the true practice of holiness be secure, except the persuasion of our justification, and reconciliation with God, be first obtained without works of the law.</p></blockquote>

<blockquote><p>The gospel method of sanctification, as well as of justification, lies so far out of the ken of natural reason, that if all the rationalists in the world, philosophers and divines, had consulted together…” Thomas Boston, Preface to The Marrow of Modern Divinity, to lay down a plan for repairing the lost image of God in man, they had never hit upon that which the divine wisdom has pitched upon, viz: that sinners should be sanctified in Jesus Christ (1 Cor 1:2), by faith in him (Acts 26:18); nay, being laid before them, they would have rejected it with disdain, as foolishness (1 Cor 1:23).</p></blockquote>

<blockquote><p>Q133 Therefore, explain fully this sanctification of ours in Christ. A133 Something is said to be sanctified which is segregated from common pollution, so that it is most pure, and wholly consecrated to God the greatest adversary of all filth. Therefore, in this way our nature is sanctified in Christ from the very moment of conception, and so He sanctifies us. Furthermore it happens in two ways. First, as I have said, we are reckoned righteous by the imputed righteousness of Christ fully before God, not in ourselves, but in Him to whom we are united through faith. So also I say that our persons, by the imputation of His perfect holiness and integrity, are reckoned holy and whole and thus acceptable to the Father, not in ourselves, but in Christ. Finally, the force and energy of this most pure holiness which is in the flesh of Christ, I say it flows also into us by the working of the Holy Spirit in us, so that we become holy in ourselves, that is, segregated from the defilements of this world, and we serve God in spirit and body; which benefit in the scriptures is often termed sanctification, regeneration, illumination, new man, new creature, and spirituality. Q134 Therefore, you say that this latter sanctification is not something outside of us, and is not ours by imputation alone, but is a new endowment truly ingrafted and clinging in us, by the mere grace of the heavenly Father, and by the power of the Holy Spirit, diffused in us. A134 I say so. Q135 Therefore, to what end is the other sanctification of our nature which is imputed to us? A135 Because this sanctification which is inherent in us is unfinished in us, as is apparent by the perpetual warfare between the flesh and the spirit in us, even in the best men. Therefore, in order that our persons might be acceptable to God, and consequently so that which comes forth from us might please Him (for the life of the saints is as a kind of continual offering up of oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.</p></blockquote>

f oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.”

<blockquote><p>Sanctification is a work of the triune God, but is ascribed more particularly to the Holy Spirit in Scripture, Rom. 8:11; 15:16; 1 Pet. 1:2. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to co-operate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally. In so far as sanctification takes place in the subconscious life, it is effected by the immediate operation of the Holy Spirit. But as a work in the conscious life of believers it is wrought, by several means, which the Holy Spirit employs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Eerdmans, 1932), 535.</span></figcaption>

t="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-fcc316f7a2" data-kw="">
<blockquote><p>And what is the reason for denying that sanctification is a mystery, i.e., the content of a dogma? The supposition that it is of human origin, that man is not totally unable, and that sanctification is betterment of character and life. Hence it is tantamount to (1) a lowering of holiness to the human standpoint; (2) an opposing sanctification as a work of God. And this is a very serious matter. We should again become clearly conscious of the fact that the holiness without which no man shall see God is not attained by the departing from some evil and the habitual doing of some good. The demand of sanctification belongs to the Covenant of Works; sanctification itself to the Covenant of Grace. This makes the difference very obvious. Not as tho the Covenant of Works commanded man to sanctify himself; given to holy men, it excluded sanctification. But God gave the Covenant of Grace to unholy men. And the only connection between the demand for sanctification and the Covenant of Works is, that the latter ever pursues fallen man with this demand, and with the terror of Horeb. Unholiness destroys the foundation of the Covenant of Works and renders compliance with its conditions impossible. Hence the absolute contradiction between it and the sinner’s personal life. The one must make room for the other; they can not stand together. In this painful conflict we are often tempted to ask whether God is not unjust in His law to demand of us the impossible, and to lay the blame on Him; for did He not make us so? And from this difficulty the Arminian in our own heart seeks to escape, either by denying that there ever was a Covenant of Works, or by substituting the fulfilment of the law for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit</cite>, (New York; London: Funk &amp; Wagnalls, 1900), 438–39</span></figcaption>

<blockquote><p>1. This whole matter of sanctification and holiness is peculiarly joined with and limited unto the doctrine, truth, and grace of the gospel; for holiness is nothing but the implanting, writing, and realizing of the gospel in our souls. Hence it is termed Ὁσιότης τῆς ἀληθείας, Eph. 4:24,—“The holiness of truth;” which the truth of the gospel ingenerates, and which consists in a conformity thereunto. And the gospel itself is ἀληθείας τῆς κατ᾿ εὐσέβειαν, Tit. 1:1,—“The truth which is according unto godliness;” which declares that godliness and holiness which God requireth. The prayer, also, of our Saviour for our sanctification is conformed thereunto: John 17:17, “Sanctify them in” (or by) “thy truth: thy word is truth.” And he sanctified himself for us to be a sacrifice, that “we might be sanctified in the truth.” This alone is that truth which makes us free, John 8:32,—that is, from sin and the law, unto righteousness in holiness. It belongs neither to nature nor the law, so as to proceed from them or to be effected by them. Nature is wholly corrupted and contrary unto it. The “law,” indeed, for certain ends, “was given by Moses,” but all “grace and truth came by Jesus Christ.” There neither is, nor ever was, in the world, nor ever shall be, the least dram of holiness, but what, flowing from Jesus Christ, is communicated by the Spirit, according to the truth and promise of the gospel. There may be something like it as to its outward acts and effects (at least some of them), something that may wear its livery in the world, that is but the fruit of men’s own endeavours in compliance with their convictions; but holiness it is not, nor of the same kind or nature with it. And this men are very apt to deceive themselves withal. It is the design of corrupted reason to debase all the glorious mysteries of the gospel, and all the concernments of them. There is nothing in the whole mystery of godliness, from the highest crown of it, which is the person of Christ, “God manifested in the flesh,” unto the lowest and nearest effect of this grace, but it labours to deprave, dishonour, and debase. The Lord Christ, it would have in his whole person to be but a mere man, in his obedience and suffering to be but an example, in his doctrine to be confined unto the capacity and comprehension of carnal reason, and the holiness which he communicates by the sanctification of his Spirit to be but that moral virtue which is common among men as the fruit of their own endeavours. Herein some will acknowledge that men are guided and directed to a great advantage by the doctrine of the gospel, and thereunto excited by motions of the Holy Ghost himself, put forth in the dispensation of that truth; but any thing else in it more excellent, more mysterious, they will not allow. But these low and carnal imaginations are exceedingly unworthy of the grace of Christ, the glory of the gospel, the mystery of the recovery of our nature, and healing of the wound it received by the entrance of sin, with the whole design of God in our restoration unto a state of communion with himself. Moral virtue is, indeed, the best thing amongst men that is of them. It far exceeds in worth, use, and satisfaction, all that the honours, powers, profits, and pleasures of the world can extend unto. And it is admirable to consider what instructions are given concerning it, what expressions are made of its excellency, what encomiums of its use and beauty, by learned contemplative men among the heathen; the wisest of whom did acknowledge that there was yet something in it which they could only admire, and not comprehend. And very eminent instances of the practice of it were given in the lives and conversations of some of them; and as the examples of their righteousness, moderation, temperance, equanimity, in all conditions, rise up at present unto the shame and reproach of many that are called Christians, so they will be called over at the last day as an aggravation of their condemnation. But to suppose that this moral virtue, whatever it be really in its own nature, or however advanced in the imaginations of men, is that holiness of truth which believers receive by the Spirit of Christ, is to debase it, to overthrow it, and to drive the souls of men from seeking an interest in it. And hence it is that some, pretending highly a friendship and respect unto it, do yet hate, despise, and reproach what is really so, pleasing themselves with the empty name or withered carcass of virtue, every way inferior, as interpreted in their practice, to the righteousness of heathens. And this, in the first place, should stir up our diligence in our inquiries after its true and real nature, that we deceive not ourselves with a false appearance of it, and that unto our ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 370.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. This whole matter of sanctification and holiness is peculiarly joined with and limited unto the doctrine, truth, and grace of the gospel; for holiness is nothing but the implanting, writing, and realizing of the gospel in our souls. Hence it is termed Ὁσιότης τῆς ἀληθείας, Eph. 4:24,—“The holiness of truth;” which the truth of the gospel ingenerates, and which consists in a conformity thereunto. And the gospel itself is ἀληθείας τῆς κατ᾿ εὐσέβειαν, Tit. 1:1,—“The truth which is according unto godliness;” which declares that godliness and holiness which God requireth. The prayer, also, of our Saviour for our sanctification is conformed thereunto: John 17:17, “Sanctify them in” (or by) “thy truth: thy word is truth.” And he sanctified himself for us to be a sacrifice, that “we might be sanctified in the truth.” This alone is that truth which makes us free, John 8:32,—that is, from sin and the law, unto righteousness in holiness. It belongs neither to nature nor the law, so as to proceed from them or to be effected by them. Nature is wholly corrupted and contrary unto it. The “law,” indeed, for certain ends, “was given by Moses,” but all “grace and truth came by Jesus Christ.” There neither is, nor ever was, in the world, nor ever shall be, the least dram of holiness, but what, flowing from Jesus Christ, is communicated by the Spirit, according to the truth and promise of the gospel. There may be something like it as to its outward acts and effects (at least some of them), something that may wear its livery in the world, that is but the fruit of men’s own endeavours in compliance with their convictions; but holiness it is not, nor of the same kind or nature with it. And this men are very apt to deceive themselves withal. It is the design of corrupted reason to debase all the glorious mysteries of the gospel, and all the concernments of them. There is nothing in the whole mystery of godliness, from the highest crown of it, which is the person of Christ, “God manifested in the flesh,” unto the lowest and nearest effect of this grace, but it labours to deprave, dishonour, and debase. The Lord Christ, it would have in his whole person to be but a mere man, in his obedience and suffering to be but an example, in his doctrine to be confined unto the capacity and comprehension of carnal reason, and the holiness which he communicates by the sanctification of his Spirit to be but that moral virtue which is common among men as the fruit of their own endeavours. Herein some will acknowledge that men are guided and directed to a great advantage by the doctrine of the gospel, and thereunto excited by motions of the Holy Ghost himself, put forth in the dispensation of that truth; but any thing else in it more excellent, more mysterious, they will not allow. But these low and carnal imaginations are exceedingly unworthy of the grace of Christ, the glory of the gospel, the mystery of the recovery of our nature, and healing of the wound it received by the entrance of sin, with the whole design of God in our restoration unto a state of communion with himself. Moral virtue is, indeed, the best thing amongst men that is of them. It far exceeds in worth, use, and satisfaction, all that the honours, powers, profits, and pleasures of the world can extend unto. And it is admirable to consider what instructions are given concerning it, what expressions are made of its excellency, what encomiums of its use and beauty, by learned contemplative men among the heathen; the wisest of whom did acknowledge that there was yet something in it which they could only admire, and not comprehend. And very eminent instances of the practice of it were given in the lives and conversations of some of them; and as the examples of their righteousness, moderation, temperance, equanimity, in all conditions, rise up at present unto the shame and reproach of many that are called Christians, so they will be called over at the last day as an aggravation of their condemnation. But to suppose that this moral virtue, whatever it be really in its own nature, or however advanced in the imaginations of men, is that holiness of truth which believers receive by the Spirit of Christ, is to debase it, to overthrow it, and to drive the souls of men from seeking an interest in it. And hence it is that some, pretending highly a friendship and respect unto it, do yet hate, despise, and reproach what is really so, pleasing themselves with the empty name or withered carcass of virtue, every way inferior, as interpreted in their practice, to the righteousness of heathens. And this, in the first place, should stir up our diligence in our inquiries after its true and real nature, that we deceive not ourselves with a false appearance of it, and that unto our ruin.”

— John Owen, The Works of John Owen, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 370.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+This+whole+matter+of+sanctification+and+holiness+is+peculiarly+joined+with+and+limited+unto+the+doctrine%2C+truth%2C+and+grace+of+the+gospel%3B+for+holiness+is+nothing+but+the+implanting%2C+writing%2C+and+realizing+of+the+gospel+in+our+souls.+Hence+it+is+termed+%E1%BD%89%CF%83%CE%B9%CF%8C%CF%84%CE%B7%CF%82+%CF%84%E1%BF%86%CF%82+%E1%BC%80%CE%BB%CE%B7%CE%B8%CE%B5%CE%AF%CE%B1%CF%82%2C+Eph.+4%3A24%2C%E2%80%94%E2%80%9CThe+holiness+of+truth%3B%E2%80%9D+which+the+truth+of+the+gospel+ingenerates%2C+and+which+consists+in+a+conformity+thereunto.+And+the+gospel+itself+is+%E1%BC%80%CE%BB%CE%B7%CE%B8%CE%B5%CE%AF%CE%B1%CF%82+%CF%84%E1%BF%86%CF%82+%CE%BA%CE%B1%CF%84%E1%BE%BF+%CE%B5%E1%BD%90%CF%83%CE%AD%CE%B2%CE%B5%CE%B9%CE%B1%CE%BD%2C+Tit.+1%3A1%2C%E2%80%94%E2%80%9CThe+truth+which+is+according+unto+godliness%3B%E2%80%9D+which+declares+that+godliness+and+holiness+which+God+requireth.+The+prayer%2C+also%2C+of+our+Saviour+for+our+sanctification+is+conformed+thereunto%3A+John+17%3A17%2C+%E2%80%9CSanctify+them+in%E2%80%9D+%28or+by%29+%E2%80%9Cthy+truth%3A+thy+word+is+truth.%E2%80%9D+And+he+sanctified+himself+for+us+to+be+a+sacrifice%2C+that+%E2%80%9Cwe+might+be+sanctified+in+the+truth.%E2%80%9D+This+alone+is+that+truth+which+makes+us+free%2C+John+8%3A32%2C%E2%80%94that+is%2C+from+sin+and+the+law%2C+unto+righteousness+in+holiness.+It+belongs+neither+to+nature+nor+the+law%2C+so+as+to+proceed+from+them+or+to+be+effected+by+them.+Nature+is+wholly+corrupted+and+contrary+unto+it.+The+%E2%80%9Claw%2C%E2%80%9D+indeed%2C+for+certain+ends%2C+%E2%80%9Cwas+given+by+Moses%2C%E2%80%9D+but+all+%E2%80%9Cgrace+and+truth+came+by+Jesus+Christ.%E2%80%9D+There+neither+is%2C+nor+ever+was%2C+in+the+world%2C+nor+ever+shall+be%2C+the+least+dram+of+holiness%2C+but+what%2C+flowing+from+Jesus+Christ%2C+is+communicated+by+the+Spirit%2C+according+to+the+truth+and+promise+of+the+gospel.+There+may+be+something+like+it+as+to+its+outward+acts+and+effects+%28at+least+some+of+them%29%2C+something+that+may+wear+its+livery+in+the+world%2C+that+is+but+the+fruit+of+men%E2%80%99s+own+endeavours+in+compliance+with+their+convictions%3B+but+holiness+it+is+not%2C+nor+of+the+same+kind+or+nature+with+it.+And+this+men+are+very+apt+to+deceive+themselves+withal.+It+is+the+design+of+corrupted+reason+to+debase+all+the+glorious+mysteries+of+the+gospel%2C+and+all+the+concernments+of+them.+There+is+nothing+in+the+whole+mystery+of+godliness%2C+from+the+highest+crown+of+it%2C+which+is+the+person+of+Christ%2C+%E2%80%9CGod+manifested+in+the+flesh%2C%E2%80%9D+unto+the+lowest+and+nearest+effect+of+this+grace%2C+but+it+labours+to+deprave%2C+dishonour%2C+and+debase.+The+Lord+Christ%2C+it+would+have+in+his+whole+person+to+be+but+a+mere+man%2C+in+his+obedience+and+suffering+to+be+but+an+example%2C+in+his+doctrine+to+be+confined+unto+the+capacity+and+comprehension+of+carnal+reason%2C+and+the+holiness+which+he+communicates+by+the+sanctification+of+his+Spirit+to+be+but+that+moral+virtue+which+is+common+among+men+as+the+fruit+of+their+own+endeavours.+Herein+some+will+acknowledge+that+men+are+guided+and+directed+to+a+great+advantage+by+the+doctrine+of+the+gospel%2C+and+thereunto+excited+by+motions+of+the+Holy+Ghost+himself%2C+put+forth+in+the+dispensation+of+that+truth%3B+but+any+thing+else+in+it+more+excellent%2C+more+mysterious%2C+they+will+not+allow.+But+these+low+and+carnal+imaginations+are+exceedingly+unworthy+of+the+grace+of+Christ%2C+the+glory+of+the+gospel%2C+the+mystery+of+the+recovery+of+our+nature%2C+and+healing+of+the+wound+it+received+by+the+entrance+of+sin%2C+with+the+whole+design+of+God+in+our+restoration+unto+a+state+of+communion+with+himself.+Moral+virtue+is%2C+indeed%2C+the+best+thing+amongst+men+that+is+of+them.+It+far+exceeds+in+worth%2C+use%2C+and+satisfaction%2C+all+that+the+honours%2C+powers%2C+profits%2C+and+pleasures+of+the+world+can+extend+unto.+And+it+is+admirable+to+consider+what+instructions+are+given+concerning+it%2C+what+expressions+are+made+of+its+excellency%2C+what+encomiums+of+its+use+and+beauty%2C+by+learned+contemplative+men+among+the+heathen%3B+the+wisest+of+whom+did+acknowledge+that+there+was+yet+something+in+it+which+they+could+only+admire%2C+and+not+comprehend.+And+very+eminent+instances+of+the+practice+of+it+were+given+in+the+lives+and+conversations+of+some+of+them%3B+and+as+the+examples+of+their+righteousness%2C+moderation%2C+temperance%2C+equanimity%2C+in+all+conditions%2C+rise+up+at+present+unto+the+shame+and+reproach+of+many+that+are+called+Christians%2C+so+they+will+be+called+over+at+the+last+day+as+an+aggravation+of+their+condemnation.+But+to+suppose+that+this+moral+virtue%2C+whatever+it+be+really+in+its+own+nature%2C+or+however+advanced+in+the+imaginations+of+men%2C+is+that+holiness+of+truth+which+believers+receive+by+the+Spirit+of+Christ%2C+is+to+debase+it%2C+to+overthrow+it%2C+and+to+drive+the+souls+of+men+from+seeking+an+interest+in+it.+And+hence+it+is+that+some%2C+pretending+highly+a+friendship+and+respect+unto+it%2C+do+yet+hate%2C+despise%2C+and+reproach+what+is+really+so%2C+pleasing+themselves+with+the+empty+name+or+withered+carcass+of+virtue%2C+every+way+inferior%2C+as+interpreted+in+their+practice%2C+to+the+righteousness+of+heathens.+And+this%2C+in+the+first+place%2C+should+stir+up+our+diligence+in+our+inquiries+after+its+true+and+real+nature%2C+that+we+deceive+not+ourselves+with+a+false+appearance+of+it%2C+and+that+unto+our+ruin.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+3+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+370.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc57218b272.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c57218b272.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/02/owen-the-least-dram-of-holiness-never-flowed-except-from-christ-through-the-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-4320a15932" data-kw="">
<blockquote><p>Where sanctification is enjoined us as our duty, it is prescribed under this notion of cleansing ourselves from sin: “Wash you, make you clean,” Isaiah 1:16. “O Jerusalem, wash thine heart from wickedness, that thou mayest be saved,” Jeremiah 4:14. “Having therefore these promises, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God”… Nothing do they more earnestly labor after in their prayers and supplications than a cleansing from it by the blood of Christ, nor are any promises more precious unto them than those which express their purification and purging from it; for these are they which, next unto their interest in the atonement made by the sacrifice of Christ, give them boldness in their approaches unto God. So our apostle fully expresseth it, Hebrews 10:19-22: “Having therefore boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh; and having an high priest over the house of God; let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification.html">Sanctification</a></span></div>

</figure><figure class="quote" id="q-3c498b72ff" data-kw="">
<blockquote><p>Grant, Almighty God, that as thou dost train us up with so much diligence and assiduous care, and regard us as dear and precious like an hereditary vine, – O grant, that we may not bring forth wild grapes, and that our fruit may not be bitter and unpleasant to thee, but that we may strive so to form our whole life in obedience to thy law, that all our actions and thoughts may be pleasant and sweet fruits to thee. And as there is ever some sin mixed up with our works, even when we desire to serve thee sincerely and from the heart, grant that all stains in our works may be so cleansed and washed away by the sacrifice of thy Son, that they may be to thee sacrifices of sweet odour, through the same, even Christ Jesus, who has so reconciled us to thee, as to obtain pardon even for our works. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prayers of John Calvin</cite>, (from his Commentary on Hosea)</span></figcaption>

</figure><figure class="quote" id="q-e3b820959b" data-kw="">
<blockquote><p>1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (1692)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.”

— Walter Marshall, The Gospel Mystery of Sanctification, (1692)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.2.1+We+are+all%2C+by+nature%2C+void+of+all+strength+and+ability+to+perform+acceptably+that+holiness+and+righteousness+which+the+law+requires%2C+and+are+dead+in+trespasses+and+sins%2C+and+children+of+wrath%2C+by+the+sin+of+our+first+father%2C+Adam%2C+as+the+Scripture+witnesses+%28Rom.+5%3A12%2C+15%2C+18%2C+19%3B+Eph.+2%3A+1-3%3B+Rom.+8%3A7%2C+8%29.+This+doctrine+of+original+sin%2C+which+Protestants+generally+profess%2C+is+a+firm+basis+and+groundwork+to+the+assertion+now+to+be+proved%2C+and+to+many+other+assertions+in+this+whole+discourse.+If+we+believe+it+to+be+true%2C+we+cannot+rationally+encourage+ourselves+to+attempt+a+holy+practice%2C+until+we+are+acquainted+with+some+powerful+and+effectual+means+to+enable+us+to+do+it.+While+man+continued+upright%2C+in+the+image+of+God%2C+as+he+was+at+first+created+%28Eccles.+7%3A29%3B+Gen.+1%3A27%29%2C+he+could+do+the+will+of+God+sincerely%2C+as+soon+as+he+knew+it%3B+but%2C+when+he+was+fallen%2C+he+was+quickly+afraid%2C+because+of+his+nakedness%3B+but+could+not+help+it+at+all%2C+until+God+discovered+to+him+the+means+of+restoration+%28Gen.+3%3A10%2C+15%29.+Say+to+a+strong+healthy+servant%2C+%E2%80%98Go%E2%80%99%2C+and+he+goes%3B+%E2%80%98Come%E2%80%99%2C+and+he+comes%3B+%E2%80%98Do+this%E2%80%99%2C+and+he+does+it%3B+but+a+bedridden+servant+must+know+first+how+he+may+be+enabled.+No+doubt+the+fallen+angels+knew+the+necessity+of+holiness%2C+and+trembled+at+the+guilt+of+their+sin%3B+but+they+knew+of+no+means+for+them+to+attain+to+holiness+effectually%2C+and+so+continue+still+in+their+wickedness.+It+was+in+vain+for+Samson+to+say%2C+%E2%80%98I+will+go+out+as+at+other+times+before%2C+and+shake+myself%2C%E2%80%99+when+he+had+sinned+away+his+strength+%28Judg.+16%3A20%29.+Men+show+themselves+strangely+forgetful%2C+or+hypocritical%2C+in+professing+original+sin+their+prayers%2C+catechisms+and+confessi <blockquote><p>Sanctification is a work of the Triune God, that is ascribed more particularly to the Holy Spirit in Scripture. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to cooperate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally… A man may boast of great moral improvement, and yet be an utter stranger to sanctification.</p></blockquote>

<blockquote><p>THE historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestantism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it. On Mystical ground—as, for example, among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men, Perfectionism persistently makes its appearance. It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 7 (Bellingham, WA: Logos Bible Software, 2008), 3–4.</span></figcaption>

<blockquote><p>Let no Church therefore think itself perfect, and needing nothing, (as bragging Laodicea did) especially when it hath but that first foundation which it had when it came newly out of Babylon; and more especially in matters of worship and discipline.

It is no dishonour unto those Reformers, to say, that they fully finished not this work; as it was not unto Zerubbabel here, that he perfected not the Temple at first. Blessed men! It is evident they purposed more then they did or could effect, because the people’s hearts were not [as yet] prepared, as the phrase is, 2 Chron. 20. 33. In our very Common-Prayer book, there is an [Until] the said discipline may be restored, which argueth they aimed at more. And besides, They were not Apostles, to whom nothing might be added, as Gal. 2. 6.

And God raising up the Tabernacle that was fallen down, not by immediate inspiration, (as at first by the Apostles) but by his Spirit, renewing and begetting light in an ordinary way: Hence therefore the Churches coming out of the darkness of Popery, must needs recover that fulness and perfection of light (which the Apostolical times had) …, by piece-meals and degrees. As for the great things of the Gospel, matters of Faith, or Doctrine, they had so happy a hand therein, that there is to be found little, if any Hay or stubble therein: But in matters of Order, which concern Worship and Discipline, (for so the Apostle distinguisheth, Colos. 2. 5. [Faith and Order] let it be enquired into, whether they were so exact therein.

Although this must be said, that God did take care for all Fundamental Ordinances of his worship; and it is a bitter error, and full of cruelty, to say, We have had no Churches, no Ministers, no Sacraments, but Antichristian all. God’s first and chief care was to build up his Church mystical, to make men Saints, and he hath made glorious ones in their personal walkings with him: and to that end he made a plentiful provision in matters of faith, even from the very first.

It fell out in this case, as in a new Plantation; which if men were to make in another world, and so to begin the world anew, their first care would be to provide necessaries for their subsistence as they are men; to have corn for bread, cattle for meat, and the like: But matters of Order &amp; Government they think of afterwards, and often fall into the right, by seeing their errors by degrees. Think not much, therefore, that men call for (as most men do) a reformation of some things amiss in matters of worship &amp; discipline, or an addition of some things; perhaps a Candlestick, or some other utensil or ordinance of Church-worship is found wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zerubbabel’s encouragement to finish the temple. A sermon preached before the honourable House of Commons, at their late solemn fast, Apr. 27 1642</cite>, (London: R. Dawlman, 1642), pp 16-18.</span></figcaption>

rdinances+of+his+worship%3B+and+it+is+a+bitter+error%2C+and+full+of+cruelty%2C+to+say%2C+We+have+had+no+Churches%2C+no+Ministers%2C+no+Sacraments%2C+but+Antichristian+all.+God%E2%80%99s+first+and+chief+care+was+to+build+up+his+Church+mystical%2C+to+make+men+Saints%2C+and+he+hath+made+glorious+ones+in+their+personal+walkings+with+him%3A+and+to+that+end+he+made+a+plentiful+provision+in+matters+of+faith%2C+even+from+the+very+first.%0A%0AIt+fell+out+in+this+case%2C+as+in+a+new+Plantation%3B+which+if+men+were+to+make+in+another+world%2C+and+so+to+begin+the+world+anew%2C+their+first+care+would+be+to+provide+necessaries+for+their+subsistence+as+they+are+men%3B+to+have+corn+for+bread%2C+cattle+for+meat%2C+and+the+like%3A+But+matters+of+Order+%26+Government+they+think+of+afterwards%2C+and+often+fall+into+the+right%2C+by+seeing+their+errors+by+degrees.+Think+not+much%2C+therefore%2C+that+men+call+for+%28as+most+men+do%29+a+reformation+of+some+things+amiss+in+matters+of+worship+%26+discipline%2C+or+an+addition+of+some+things%3B+perhaps+a+Candlestick%2C+or+some+other+utensil+or+ordinance+of+Church-worship+is+found+wanting.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+Zerubbabel%E2%80%99s+encouragement+to+finish+the+temple.+A+sermon+preached+before+the+honourable+House+of+Commons%2C+at+their+late+solemn+fast%2C+Apr.+27+1642%2C+%28London%3A+R.+Dawlman%2C+1642%29%2C+pp+16-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c9879eb73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c9879eb73.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2025/06/15/thomas-goodwin-on-the-imperfection-and-legitimacy-of-the-church-of-england/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b73efd0514" data-kw="">
<blockquote><p>The most of our perfection in this life (saith an ancient Father) consisteth in the acknowledgement and the bewailing of our imperfections. Therefore the more you are, (according to the example of all the faithful servants of God) troubled with your sins, (as appeareth by the trouble your Excell[ency]: hath of the sufficiency of your Repentance) so much the more may you assure your self, that your repentance is upright and acceptable unto the Lord: David saith, I confess my sins; for there is no rest in my bones, because of my sins: for mine iniquities are gone over my head, and as a weighty burthen they are too heavy for me. Your Excell: must also consider the subtlety of the devil, who as an enemy of our salvation, commonly towards our latter end doth most of al strive with us; but your Excell: must likewise know, that although our sins were as Crimson, they shall be made as white as Snow, even through the precious blood of Jesus Christ, which cleanseth us from all our sins: and therefore consequently that our Faith and Repentance is unperfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-bogerman.html">Johannes Bogerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The godly and Christian decease of the illustrious and high-borne Prince, Mauritius of Nassau, Prince of Orange, of happy memory. For the comfort and edification of all true Christians</cite>, (London: Nathanael Newbery, 1625), unpaginated.</span></figcaption>

<blockquote><p>Q136 But why does He not completely sanctify us immediately?

A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit.

The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), p. 53.</span></figcaption>

</figure><figure class="quote" id="q-3533d2c95c" data-kw="">
<blockquote><p>SANCTIFICATION is aimed at by many, if not by most who are religiously inclined. Even the heathens talked much about a virtuous life and a conduct conform able to right reason. But it is understood only by a few. That holiness, which adorns God’s people, greatly surpasses all the painted virtues of the heathens, and all the scrupulous morals of the Scribes and Pharisees.

The boasted virtue of the heathens and Pharisees, had its rise in self and terminated in self: they meant no more than to exalt themselves and to quiet their consciences. But the Christian’s holiness has its origin from God, and terminates in him: his glory animates the believer, and leads him to the performance of every action by which it can be displayed.</p></blockquote>

</figure><figure class="quote" id="q-11f90e96e5" data-kw="">
<blockquote><p>Of Exhortation, that we manfully set ourselves not only to repress such lusts, but quite also to root them out. Now the old man is mortified, 1. By that firm and constant purpose of changing our life, which is effectually begun in our first repentance, and daily ought to be renewed, and extended to all new emergencies.

2. By the virtue of Christ’s death applied to us by faith, whence our old man is said to be crucified with Christ; and it may be rightly added, with the same nails, that Christ was crucified with. For Christ was fastened unto the Cross, partly because of the guilt of our sins; partly out of the love of the Father to us, that we might be saved: partly out of Christ’s own love to us, whereby he was willing to lay down his life for us. And by the earnest meditation of these things, the power of sin is most diminished in us.

3. By the power of the Holy Spirit, to whom we ought to give up ourselves, in the use of all the means ordained of God, whereby he useth to put forth his powerful working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXXIII, pp 205-06.</span></figcaption>

<blockquote><p>And as to the unity or onliness rather of this being (or of the God-head) the deduction thereof seems plain and easy from what hath been already proved; that is from the absolute perfection thereof. For though some do toil themselves much about this matter; and others plainly conclude that it is not to be proved at all in a rational way, but only by divine revelation. Yet I conceive, they that follow the method (having proved some necessary self-subsisting being, the root and original spring of all Being and perfection actual and possible; which is as plain as any thing can be) of deducing from thence the absolute all comprehending perfection of such necessary being will find their work as good as done.

For nothing seems more evident than that there cannot be two (much less more) such Beings. Inasmuch as one comprehends in it self all being and perfection; for there can be but one all, without which is nothing. So that, one such being supposed, another can have nothing remaining to it. Yea so far is it therefore, if we suppose one infinite and absolutely perfect being, that there can be another independent thereon (and of a depending infinity we need not say more than we have, which if any such could be, cannot possibly be a distinct God) that there cannot be the minutest finite thing imaginable, which that supposed infinity doth not comprehend, or that can stand apart from it, on any distinct basis of its own. And that this matter may be left, as plain as we can make it; supposing it already most evident.

That there is actually existing an absolute entire fulness of Wisdom, Power, so of all other perfection.

That absolute entire fulness of perfection is infinite.

That this infinite perfection must have its primary seat somewhere.

That its primary original seat can be no where but in necessary self-subsisting Being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The living temple, or, A designed improvement of that notion that a good man is the temple of God</cite>, (London: John Starkey, 1675), pp 176-77.</span></figcaption>

<blockquote><p>Another way we have of apprehending him, by way of negation, denying all the imperfections of the creatures, and removing them at an infinite distance from him; and truly, though this be an imperfection in knowledge, yet it is the greatest knowledge we can attain to, to know rather what he is not, than what he is.

He is not limited to any place, nor bounded with any measures and degrees of perfection, as creatures are; therefore we call him infinite: he is not comprehended within the limits of time, but comprehends all within himself; therefore he is eternal: he is not subject to changes and alterations; therefore called immutable: he is not compounded, as a result of divers parts; therefore he is most purely simple, and one: he is not like those things we see and hear, that fall under our senses; therefore we call him a Spirit, or a spiritual Being.

Now, in all these weak endeavours of man, to detain and fix his own spirit in the contemplation of God, if he cannot reach the understanding of what God is, yet certainly he will attain this great point of wisdom, — not to be ignorant of his own ignorance. And truly, my beloved, this is the thing I would have us to learn to know, that the admiration of God in silence is the best expression of him.

We would not search into these mysteries, to satisfy our curiosity, but rather compose our hearts to a continual silent wondering before him; for where our understandings are confounded, and our minds overwhelmed with the infiniteness of that glory, so that we can see nothing but our ignorance of all, this should certainly compose all to quiet admiration, for silence and wonder is the proper and natural posture of a soul that is at a stand, and can neither win [i.e. get] forward for inaccessible light, nor will retire backward, for that it apprehends already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 241-42.</span></figcaption>

</figure><figure class="quote" id="q-60bc7cad09" data-kw="">
<blockquote><p>Your 24. and last Qu. is, [Whether do you say you shall be free from the body of sin while you are on the earth, and whether shall any be perfect yea or nay?]

Ans. I believe that all true Converts are free from the dominion of sin, but not from the remnants of it; And that our grace is of a perfect kind, as a small Candle is of a perfect kind of fire, which yet will not enlighten all the Town or House, nor scatter away all the darkness as the Sun will do; I believe also that in the instant of death when we part with the flesh, we part with all the remnants of sin. And for the Doctrine of personal sinless perfection here, I believe the devil, the greatest sinner bred it; the Pharisee received the foretastes and preparatives to it, the Heretics and Papists first entertained and cherished it, Christ detesteth it, and never man that knew himself, or had one spark of true grace and Christian experience, did to this day heartily believe it of himself.

And I think that it is a part of the Papists dung which they have taught you to feed upon. Christ’s Kingdom is an Hospital, he hath no Subjects in it but diseased ones. The Father’s Kingdom before had perfect Subjects, and so shall it have again when Christ hath perfected us: For when he hath perfected us by healing all our diseases and subduing all our enemies, even the last Enemy Death (at the Resurrection) then will he give up the Kingdom to the Father. But now, In many things we offend all, Jam. 3. 2. and there is no man on earth that doth good and sinneth not; And if we say we have no sin, we deceive our selves and the truth is not in us, therefore the truth is not in you Quakers.

I conclude my Answer with this Question to you; If you think you are perfect without sin, whether do you also think that you are already in Heaven or perfect glory? For what can keep the soul from the perfect enjoyment of God, but sin. And to enjoy God perfectly is to be glorified perfectly: But I forgot that your Brethren think Heaven and hell is only within men. Perhaps you look for no more Heaven then you have: And I wonder not at it: For if you did, in the way you are in, you are no more likely ever to find it then Darkness is to have communion with light, or Belial with Christ.

The Lord give Repentance unto life, to those of you that have not sinned unto death, and shew you another Heaven before you are out of reach of it, and a further Hell before you are in it. Though I look for no thanks from you for my charitable desires, yet you shall have them whether you will or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ catechism, or, The Quakers’ questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), pp 24-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>[T]he kingdom of grace is still restricted, in that measure in this our mortal life even they who seem to be somewhat nigh unto perfection are under necessity of confessing: “In many things we offend all,” and “If we say that we have no sin, we deceive ourselves, and the truth is not in us.” Wherefore it is that they pray without ceasing, saying: “Thy kingdom come.” But this will not be consummated even in them, until not only doth not sin reign in their mortal body, but there neither is nor can be any sin at all in the body then immortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Grace and Free Will</cite>, trans. Watkin W. Williams (1128; London: SPCK, 1920), p. 23.</span></figcaption>

<blockquote><p>Qu. 10. Can that man that hath one spark of grace believe that he hath no sin? Can he have so little knowledge of himself? And consequently of the need he hath of the Physician? Dare you say to Christ, we will not be beholden to thee for thy blood to wash us any more, or to thy Intercession to part on us any more? Do you not believe that In many things we offend all, Jam. 3. 2. If we say that we have no sin we deceive our selves, and the truth is not in us? If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness: If we say that we have not sinned, we make hem a liar, and his Word is not in us, 1 Joh. 1. 8, 9. 10.

Are not all Christ’s Disciples taught daily to pray [Forgive us our trespasses.] For my part, I am one that is sick and have need of the Physician, and dare not tell God that I will ask him pardon for no more sins, nor be beholden to him for any more. But O what a power hath the deceiver with these wretches, that in the midst of their horrid railing, slandering, and other wickedness, will stand to it that they have no sin; Just like the Swearer that will swear he never swore an Oath; Or the Drunkard that will swear he was never drunk, when he lieth drunk in the Channel. Solomon saith, There is not a just man upon earth that doth good and sinneth not, Eccles. 7. 20. and these Quakers that Pharisaically and Papistically justify themselves do give him the Lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), pp 29-30.</span></figcaption>

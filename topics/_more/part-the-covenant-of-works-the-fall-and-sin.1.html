<figure class="quote" id="q-7db9fe6fcc" data-kw="">
<blockquote><p>Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections [properties] of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness.</p></blockquote>

<blockquote><p>But the example of him whose eyes are put out as a punishment for a crime, and who cannot justly be commanded to see, is inept and foreign to the present matter. Because a blind man is not bound to see; but one born in original sin is bound to be just and without sin, for from this obligation a rational creature is never released. Add to this that he who has been deprived of his eyes by a judge is blind involuntarily, and would wish for the recovery of his sight at a great price. But men born in sin are voluntarily evil, and rejoice in their own vice, and hate remedies.</p></blockquote>

</figure><figure class="quote" id="q-6ea58232d5" data-kw="">
<blockquote><p>4. Papists indeed seem to reject the negative [of the question whether original sin exists], yet they foster such opinions concerning this sin as in fact overturn that sin while they teach it to be less than any venial sin, with Aquinas the prince of their school and his other sectaries, and thus not to merit eternal death; indeed they want this to be only punishment, not guilt before the free assent of the will. Add the ὕπουλα [treacherous] dogmas: 1. That concupiscence is not sin formally, but only originally and effectively so called, or terminatively, because it is from sin, and from it sin [comes]. Nor does it have anything of the character of sin formally, except what is voluntary [in persons sinning]. 2. That naturals [natural powers] remained whole after the Fall, and thus free will is given even in the unregenerate in order to spiritual good. See Bellarmine, bk. 1, On the Loss of Grace, ch. 12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous theological Disputations, pt. 1</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Disputation on Original Sin’ trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

race%2C%20ch.%2012" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4941084f95" data-kw="">
<blockquote><p>Today, the doctors of the Roman Church accuse the Protestants of denying free will; where, however, it should be noted that the question is not about the state of Integrity… But when they deal with the state of sin, they attribute to Luther, Calvin and other reformers that they teach that free will was utterly extinguished and lost through the Lapse of Adam, and therefore that man after the Lapse does not have free will. But it never came into the mind of the Protestants to simply deny free will, even after the lapse, neither with respect to natural works, nor civil, nor moral works of the natural order; but they only denied the rectitude and sanity of free will, and its natural powers for spiritual good, in which matter they followed Augustine, Enchiridion, ch. 30, ‘Man, by making bad use of free will, destroyed both himself and it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfuz.html">Barthold Holtzfuz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), p. 5 Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Today, the doctors of the Roman Church accuse the Protestants of denying free will; where, however, it should be noted that the question is not about the state of Integrity… But when they deal with the state of sin, they attribute to Luther, Calvin and other reformers that they teach that free will was utterly extinguished and lost through the Lapse of Adam, and therefore that man after the Lapse does not have free will. But it never came into the mind of the Protestants to simply deny free will, even after the lapse, neither with respect to natural works, nor civil, nor moral works of the natural order; but they only denied the rectitude and sanity of free will, and its natural powers for spiritual good, in which matter they followed Augustine, Enchiridion, ch. 30, ‘Man, by making bad use of free will, destroyed both himself and it.&#x27;”

<blockquote><p>Luther and his followers, who had at first made some very absolute and exaggerated statements in the way of denying free will altogether, came afterwards to attach much importance to a distinction between man’s freedom in things external, civil, and moral, and his freedom in things properly spiritual, and they embodied this distinction in the Confession of Augsburg (ch. 18).</p></blockquote>

</figure><figure class="quote" id="q-7d5dd1809c" data-kw="">
<blockquote><p>…the Reformers and older Calvinistic divines ascribed to man before his fall a freedom or liberty of will which they denied to man as he is, and that the only necessity or bondage which they ascribed to man as he is, was an inability to will what is spiritually good and acceptable to God, as a result or consequence simply of the entire depravity of his moral nature–i.e., of his actual dispositions and tendencies. This was the only necessity they advocated as having anything like direct and explicit sanction from scripture, or as indispensably necessary to the exposition and defence of their system of theology–not a necessity deduced from anything in God’s purposes and providence, or from anything in men’s mental constitution applicable to men, as men, or simply as creatures, but from a special feature in men’s character as fallen and depraved. This necessity or bondage under which they held man fallen, as distinguished from man unfallen, to lie, resolved itself into the entire absence in fallen man of holy and good dispositions or tendencies, and the prevalence in his moral nature of what is ungodly and depraved; and thus stood entirely distinct from, and independent of, those wider and more general considerations, whether philosophical or theological, applicable to man as man, having a certain mental constitution, or as a dependent creature and subject of God, on the ground of which the controversy about liberty and necessity has been of late commonly conducted.</p></blockquote>

</figure><figure class="quote" id="q-a9b5a185f1" data-kw="">
<blockquote><p>I willingly grant that the determination of the end does necessarily involve the means, that not only precede but procure the end. But I will utterly deny that sin is the means of damnation; we say rather that permission of sin is the means, whence notwithstanding it follows not that sin shall come to pass unavoidably, but rather avoidably, whether we consider the free will of man or the decree of God; for every particular sinful act is a natural thing, and undoubtedly man has free will as to do, so to abstain from doing, any particular act. And albeit God has determined that these particular sinful acts (instance the particular outrages committed against the holy Son of God by Herod, Pontius Pilate, together with the Gentiles and people of Israel) shall come to pass by his permission; yet seeing withal He has ordained them to come to pass contingently, that follows that they shall come to pass in such a manner as joined with a possibility of not coming to pass; otherwise they should come to pass not contingently but necessarily.</p></blockquote>

<blockquote><p>…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5). 5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice. 6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.</p></blockquote>

<blockquote><p>All the Reformed exclude from free choice a natural necessity, by which man is by his own nature determined to the thing he wills, as for example the sun, to shine, but nevertheless they admit the necessity: of dependence upon God, as the first cause; of infallibility, from the eternal decree; of predetermination, from governing providence; of slavery, from sin.</p></blockquote>

<blockquote><p>only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.</p></blockquote>

<blockquote><p>§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.</p></blockquote>

<blockquote><p>…we must deal with four preliminary issues: first, whether there is contingency in things; second, given that there is, we need to determine the first cause of contingency; third, we must show how the primary basis of contingency can be found in God; and fourth, we need to clarify certain propositions that arise in this discussion.</p></blockquote>

</figure><figure class="quote" id="q-a4c588ba16" data-kw="">
<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).”

— Stephen Hampton, Other citations (work not named), 1. ‘Free Choice’ in ‘Sin, Grace &amp; Free Choice in Post-Reformation Reformed Theology’ in Lehner, Muller &amp; Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016), pp. 229-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMaresius%E2%80%A6+insists%2C+the+Reformed+believe+that+the+power+of+free+choice+is+intrinsic+to+humanity%E2%80%A6+It+is+true+that+unlike+irrational+creatures%2C+human+beings+are+not+naturally+determined+to+just+one+course+of+action.+They+are+free%2C+in+other+words%2C+from+%E2%80%98physical+necessity%E2%80%99.+As+a+result%2C+when+human+beings+choose+to+do+something+under+the+influence+of+grace%2C+they+nonetheless+retain+a+faculty+within+them+which%2C+were+that+grace+withdrawn%2C+would+enable+them+to+pursue+another+course+of+action.+So+if+one+considers+free+choice+simply+as+a+faculty%2C+in+isolation+from+all+the+natural+and+supernatural+prerequisites+for+acting+%28the+%E2%80%98divided+sense%E2%80%99+%5Baccording+to+the+created+order%5D%29%2C+it+does+indeed+have+both+the+inherent+potential+to+accept+or+reject+a+given+course+of+action+%28%E2%80%98freedom+of+contradiction%E2%80%99%29%E2%80%A6+%E2%80%A6+So+for+Maresius%2C+free+choice+is+incompatible+with+both+physical+necessity+and+the+necessity+of+coercion%3A+but+it+is+compatible+with+other+kinds+of+necessity.+It+is+compatible%2C+for+example%2C+with+the+necessity+of+dependence+on+God+%28Maresius+1646-48%2C+2%3A12%29.+It+is+also+compatible+with+%E2%80%98moral+necessity%E2%80%99.+That+is+the+necessity+which+results+from+a+human+being%E2%80%99s+moral+character.+Jesus%E2%80%99s+moral+character+is+such+that+He+cannot+sin%3B+yet+his+goodness+is+still+freely+chosen.+The+moral+character+of+the+unregenerate+is+such+that+their+acts+are+always+sinful%3B+yet+their+sin+is+still+freely+chosen+%28Maresisu+1646-48%2C+2%3A14%29.+Free+choice+is+equally+compatible+with+the+necessity+brought+about+by+the+divine+decree.+Maresius+calls+this+kind+of+necessity+%E2%80%98hypothetical+necessity%E2%80%99+or+the+%E2%80%98necessity+of+consequence%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29%E2%80%A6+Maresius+is+seeking+to+preserve+the+fundamental+contingency+of+human+action%E2%80%A6+that+choice+is+only+necessary%2C+given+the+divine+decree%E2%80%93it+is+not+inherently+or+absolutely+necessary%E2%80%A6+for+as+Maresius+underlines%2C+%E2%80%98such+is+the+faculty+of+the+human+will+that%2C+by+its+intrinsic+constitution+and+nature%2C+it+is+equally+apt+to+choose+an+act+plainly+contrary+to+the+one+it+actually+chooses%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29.%E2%80%9D%0A%0A%E2%80%94+Stephen+Hampton%2C+1.+%E2%80%98Free+Choice%E2%80%99+in+%E2%80%98Sin%2C+Grace+%26+Free+Choice+in+Post-Reformation+Reformed+Theology%E2%80%99+in+Lehner%2C+Muller+%26+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29%2C+pp.+229-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4c588ba16.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4c588ba16.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=insists%2C%20the%20Reformed%20believe%20that%20the,it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15&amp;text=insists%2C%20the%20Reformed%20believe%20that%20the%20power%20of&amp;text=the%20one%20it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>

<blockquote><p>Richard A. Muller, in his article, “Grace, Election and Contingent Choice…” deals with the historical myth that the classic reformed theology leads to metaphysical determinism. Quite the contrary to the charge, by analyzing the teachings of the major Reformed thinkers and confessions, Muller shows that the Reformed view of divine sovereignty and grace neither denies human free choice and future contingents nor undermines human responsibility.” – Jeongmo Yoo, John Edwards, p. 28 Mylius, R.A. [Richard Muller] – ‘In the Steps of Voetius: Synchronic Contingency &amp; the Significance of Cornelius Elleboogius’ Disputationes de Tetragrammato to the Analysis of his Life &amp; Work’ (2010) 10 pp. in ed. M. Wisse, M. Sarot &amp; W. Otten, Scholasticism Reformed: Essays in Honour of Willem J. Van Asselt Buy pp. 92-102 ‘God as Absolute &amp; Relative, Necessary, Free, &amp; Contingent: The Ad Intra-Ad Extra Movement of Seventeenth-Century Reformed Language About God’ in Always Reformed: Essays in Honor of W. Robert Godfrey Buy ed. R. Scott Clark &amp; Joel E. Kim, 2010, pp. 56-73 Sytsma, David – ‘The Specter of Necessitarianism’ in ch. 7, ‘From ‘Epicurean’ Physics to Ethics’ in Richard Baxter &amp; the Mechanical Philosophers (Oxford, 2017), pp. 233-39 . . Books 1600’s Strong, William – A Treatise Showing the Subordination of the Will of Man Unto the Will of God ToC (London, 1657) 335 pp. on Acts 21:14 This was recommended by Thomas Manton. Pages 197-278, especially, treat of the permissive will of God. Strong was an Independent puritan and Westminster divine. Sterry, Peter – A Discourse of the Freedom of the Will (London, 1675) 245 pp. Sterry (1613–1672) was an Independent, a Westminster divine and a chaplain to Cromwell. Sterry associated with the Cambridge Platonists prominent during the English Civil War era. Sterry had a mystical streak and was a millenarian; he expected the second advent of Christ, with the millennium on earth following, in the early 1650’s, and 1656 at the latest. This book has three parts. The first argues against “those arguments… in opposition to that liberty of the will, which [liberty] is placed in the determining of its power, received from the First Cause, unto a contrariety or contradiction in its actings, with an independency upon the First Cause, the order and connection of causes, and the understanding.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Richard A. Muller, in his article, “Grace, Election and Contingent Choice…” deals with the historical myth that the classic reformed theology leads to metaphysical determinism. Quite the contrary to the charge, by analyzing the teachings of the major Reformed thinkers and confessions, Muller shows that the Reformed view of divine sovereignty and grace neither denies human free choice and future contingents nor undermines human responsibility.” – Jeongmo Yoo, John Edwards, p. 28 Mylius, R.A. [Richard Muller] – ‘In the Steps of Voetius: Synchronic Contingency &amp; the Significance of Cornelius Elleboogius’ Disputationes de Tetragrammato to the Analysis of his Life &amp; Work’ (2010) 10 pp. in ed. M. Wisse, M. Sarot &amp; W. Otten, Scholasticism Reformed: Essays in Honour of Willem J. Van Asselt Buy pp. 92-102 ‘God as Absolute &amp; Relative, Necessary, Free, &amp; Contingent: The Ad Intra-Ad Extra Movement of Seventeenth-Century Reformed Language About God’ in Always Reformed: Essays in Honor of W. Robert Godfrey Buy ed. R. Scott Clark &amp; Joel E. Kim, 2010, pp. 56-73 Sytsma, David – ‘The Specter of Necessitarianism’ in ch. 7, ‘From ‘Epicurean’ Physics to Ethics’ in Richard Baxter &amp; the Mechanical Philosophers (Oxford, 2017), pp. 233-39 . . Books 1600’s Strong, William – A Treatise Showing the Subordination of the Will of Man Unto the Will of God ToC (London, 1657) 335 pp. on Acts 21:14 This was recommended by Thomas Manton. Pages 197-278, especially, treat of the permissive will of God. Strong was an Independent puritan and Westminster divine. Sterry, Peter – A Discourse of the Freedom of the Will (London, 1675) 245 pp. Sterry (1613–1672) was an Independent, a Westminster divine and a chaplain to Cromwell. Sterry associated with the Cambridge Platonists prominent during the English Civil War era. Sterry had a mystical streak and was a millenarian; he expected the second advent of Christ, with the millennium on earth following, in the early 1650’s, and 1656 at the latest. This book has three parts. The first argues against “those arguments… in opposition to that liberty of the will, which [liberty] is placed in the determining of its power, received from the First Cause, unto a contrariety or contradiction in its actings, with an independency upon the First Cause, the order and connection of causes, and the understanding.”

</figure><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>

</figure><figure class="quote" id="q-d00bd64bf3" data-kw="">
<blockquote><p>Although the human will [according to the Roman Catholic Thomist, Domingo Banez] necessarily follows the divine will to attain the good, it does not do so with an absolute necessity (called “necessity of the consequent”) but only with a hypothetical and relative necessity (called “necessity of the consequence”). For example, the fact that the sun shines is an absolute necessity, provoked by the very nature of the sun; however, here we speak of a certain conditional or hypothetical necessity, such as the one the proposition “Peter is seated” has, while Peter is effectively seated. It is not absolutely necessary for Peter to be seated, but, if he is seated, then it is necessary for him (with necessity of consequence) to be seated. Likewise, if God, with his efficacious grace, moves a man here and now to conversion, it is necessary that he performs his conversion, but he will do so freely, because he possesses the intrinsic capacity to do it or not. Moreover, God does not concur in the human act as a partial cause, as Molina thought, but as a principal total cause, while the created free will is also a total but subordinate cause.</p></blockquote>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>

<blockquote><p>Something Contingent to Necessary Being [see pp. 48-50 of the Summary] 35. Whatever exists from itself (is either ineffectible or independent) is a necessary being. This point follows from the definitions. 36. Whatever exists contingently [see p. 48] not only has in another the reason for its existence, but receives existence from a cause that causes contingently and not necessarily [see pp. 48-49]. 37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause. 38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause. 39. If there is some contingent being, there is some necessary being. If there is something contingent, such a thing is caused (from conclusion 36), and consequently is dependent (from conclusion 38). But a dependent being implies a being from itself (from conclusion 32), and therefore a being from itself necessarily exists (from conclusion 35).</p></blockquote>

<blockquote><p>Scotus has well observed that the ultimate root of contingency is free will, for, in the system of absolute determinism, whatever happened would be necessary in its causes. It is plain that the opposite of something could only be when that something in fact comes to be if it depends immediately or at least mediately on a free cause, name on a cause that, when everything is given for acting that must be given, has it in its own power to act or not to act, or to act in this way or in some other way. Hence let a free cause be defined as a cause that in acting is undetermined either by anything outside itself and by its own nature as a being. Therefore, when all conditions outside it for acting are given, it has within it the power to act rather than not to act (liberty of contradictories), or to act in one rather than in another (liberty of contraries). So for us free cause is by definition the same as free will. A cause, therefore, that contingently causes is either such a free cause or is a non-free cause that truly depends for its existing or its causing on a free cause. So we can distinguish between a free cause and a contingently causing cause.¹ For even if a cause depends on a free first cause and thus is a contingent causer, it can be a non-free cause. Such a cause is even called by Scotus a natural cause or a cause that acts by way of nature; for any cause is a natural one that is determined by its nature to one way of acting when all necessary givens are given. It is also called a cause that is hypothetically or in a certain respect necessary. ¹ [Editor:] A cause is a contingently causing cause if it be able not to cause in the moment when it does in fact cause. As such it is opposed to a cause that causes necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 5, ‘On Contingent &amp; Necessary’ | Article 2, ‘On the Existence of the Contingent and of its Ultimate Cause’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>The covenant of works could by no means be renewed by fallen Adam, so as thereby to help himself and his posterity out of this misery, the which is the only thing in question here; otherwise, indeed, it might have been renewed, which is evident by this sad token, that many do actually renew it in their covenanting with God, being prompted thereto by their ignorance of the high demands of the law, their own utter inability, and the way of salvation by Jesus Christ. And from the same principle our legalist here makes no question but Adam might have renewed it, and kept it too, for the after-time; only, he questions whether or not Adam might thereby have helped himself, and his posterity too, out of the misery they were brought into by his sin.</p></blockquote>

<blockquote><p>In Adam’s sin there was the breach of the whole law in every commandment, either directly or by consequence, for he showed evident want of love to God in believing Satan more than God. Therein he chose Satan for his god; he worshipped Satan and took God’s name in vain; he showed also evident want of brotherly love, for hereby he became a murderer not only of himself, but of all his posterity. And thus do sins concur in every wicked action, in which regard it may be said with James that “he which faileth in one commandment is guilty of all” [2:10], which must admonish us to make conscience of every sin, for we cannot live in any one but we must needs run into many other.</p></blockquote>

<blockquote><p>Therefore, in this example even of Paul regenerate (for now regenerate he says this about himself) we see that even a regenerate person sometimes is made a slave of sin and is led away captive by it. ‘For what.’ He shows that he is sold under sin and dragged away captive as it were, to serve sin, from the disapproval of the deed that he perpetrates, that is, from the judgment of his mind. From alien judgment from sin that he nevertheless perpetrates, it follows that he is sold under sin as tyranny and is rendered captive to the law of sin.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/sin.html">Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore, in this example even of Paul regenerate (for now regenerate he says this about himself) we see that even a regenerate person sometimes is made a slave of sin and is led away captive by it. ‘For what.’ He shows that he is sold under sin and dragged away captive as it were, to serve sin, from the disapproval of the deed that he perpetrates, that is, from the judgment of his mind. From alien judgment from sin that he nevertheless perpetrates, it follows that he is sold under sin as tyranny and is rendered captive to the law of sin.”

— Robert Rollock, Commentary on Ephesians, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 109.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+in+this+example+even+of+Paul+regenerate+%28for+now+regenerate+he+says+this+about+himself%29+we+see+that+even+a+regenerate+person+sometimes+is+made+a+slave+of+sin+and+is+led+away+captive+by+it.+%E2%80%98For+what.%E2%80%99+He+shows+that+he+is+sold+under+sin+and+dragged+away+captive+as+it+were%2C+to+serve+sin%2C+from+the+disapproval+of+the+deed+that+he+perpetrates%2C+that+is%2C+from+the+judgment+of+his+mind.+From+alien+judgment+from+sin+that+he+nevertheless+perpetrates%2C+it+follows+that+he+is+sold+under+sin+as+tyranny+and+is+rendered+captive+to+the+law+of+sin.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Commentary+on+Ephesians%2C+trans.+Casey+Carmichael%2C+Classic+Reformed+Theology+Series+vol.+5+%28Reformation+Heritage+Books%2C+2021%29%2C+109.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee1b89fe36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee1b89fe36.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/09/robert-rollocks-commentary-on-romans-4/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-f56fe54d25" data-kw="">
<blockquote><p>There is still another area in which the Reformed view of the law is influenced by the idea of the covenant. Even after the fall, the law retains something of its covenantal form. The law was not included in the federal relationship without having been affected by it. Even today the call of the law sounds in our ears: such a life I would give you, if only you could fulfil me! God could have wholly eradicated that relation and have taken away the last traces of it from our minds, after the covenant of works was broken. However, He kept its memory alive in us. He has repeated that promise hypothetically and consequently has held up before us constantly the ideal of eternal life to be obtained by keeping the law, a lost ideal though it be. Thus the essential content of the concept of covenant has been kept in our consciousness. When the work of the Spirit by means of the law and the gospel leads to true conversion, in this conversion the longing for this lost ideal of the covenant appears as an essential part. From the above we can also explain why the older theologians did not always clearly distinguish between the covenant of works and the Sinaitic covenant. At Sinai it was not the “bare” law that was given, but a reflection of the covenant of works revived, as it were, in the interests of the covenant of grace continued at Sinai</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos</cite>, ed. Richard B. Gaffin Jr. (Phillipsburg, NJ: P&amp;R Publishing, 2001), 254–55</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-79a18339a4" data-kw="">
<blockquote><p>Once more, are true believers delivered from the commanding, condemning, and irritating power of the law as a covenant? Let them then, amid all their trials and all their conflicts with spiritual enemies, be of good comfort. Oh, let them rejoice exceedingly in that almighty, compassionate, dear Redeemer who, in His love and pity, has redeemed them from the dominion and curse of the broken law (Gal. 3:13). You, O believer, have become dead to the law by the body of Christ and are married to another husband, even to Him who is raised from the dead, that you may bring forth fruit unto God (Rom. 7:4). You are dead to the law of works; nevertheless, you live. You live to God as your own God, your covenant God, and you serve Him in newness of spirit. In union with your living Redeemer, who loved you and gave Himself for you, you live a life of justification, and consequently, it is your privilege as well as your duty to live a life of sanctification and consolation. Being justified by faith, you have peace with God through our Lord Jesus Christ and, in some measure, peace of conscience. If then the law as a covenant of works should at any time enter your conscience again and require perfect obedience from you as the ground of your title to eternal life, saying, “This do, and thou shalt live” (Luke 10:28), present to it, in the hand of faith, the perfect obedience of your divine Surety in answer to that demand. And as often as the law in your conscience repeats the high demand, renew your application of His consummate obedience and trust firmly that it was performed for you in order to entitle you to eternal life. The righteous law, magnified and made honorable by that meritorious obedience, will, in proportion as you do so, cease to disturb the peace of your conscience. The spotless obedience of the second Adam is, as was observed above, the only obedience that you should present to the law as a covenant of works; and your own personal obedience is the only obedience that you ought to exhibit to it as a rule of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 223–24.</span></figcaption>

</figure><figure class="quote" id="q-fe5106738c" data-kw="">
<blockquote><p>The law that was given from Mount Sinai by the ministry of Moses, considered as the matter of the covenant of works, was a ministry of rigor and of terror in opposition to the gospel dispensation, which is called grace; it was a ministration of condemnation and of death. Considered as a rule of duty in the covenant of grace and in the hand of Moses the typical mediator, it was a ministration of shadows as opposed to truth. The gospel, or New Testament dispensation of the covenant of grace, is styled “grace and truth” (John 1:14, 17). It is grace, for it is a clear and efficacious exhibition of the covenant of grace to sinners of mankind. It is truth, as opposed not only to falsehood but to shadows. While Jesus Christ has brought to His church the clearest discoveries of redeeming grace, He Himself is the substance of all the Jewish types and the accomplishment of all their predictions and promises. Moses was the minister of the law; Christ is the author of grace and truth. All the promises and blessings of salvation flow from His grace and are performed by His truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 66–67.</span></figcaption>

</figure><figure class="quote" id="q-163b6233b2" data-kw="">
<blockquote><p>God therefore displayed on Mount Sinai the law of the Ten Commandments as a covenant of works in subservience to the covenant of grace. He displayed it in that form in order that the people might, by contemplating it, see what kind and degree of righteousness it required as the condition of eternal life, and that by means of it, finding themselves utterly destitute of perfect righteousness, they might be impelled to take hold of the covenant of grace in which the perfect righteousness of the second Adam is provided and exhibited for the justification of all who believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 54.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-f365efb13b" data-kw="">
<blockquote><p>That the law as a covenant of works was displayed on Mount Sinai appears also from this: the Ten Commandments, written on tables of stone and so given to Moses on Sinai are called, by the apostle Paul, “the ministration of death, written and engraven in stones” (2 Cor. 3:7). Now it is manifest that these commandments are no otherwise the ministration of death than as they are in the form of the covenant of works. In this form they were delivered to Moses to be deposited in the ark in order to prefigure the fulfilling of them by Messiah, the surety of a better covenant (Heb. 7:22), and the concealing of that form, or the removal of it from them, to all who should believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 55–56.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“That the law as a covenant of works was displayed on Mount Sinai appears also from this: the Ten Commandments, written on tables of stone and so given to Moses on Sinai are called, by the apostle Paul, “the ministration of death, written and engraven in stones” (2 Cor. 3:7). Now it is manifest that these commandments are no otherwise the ministration of death than as they are in the form of the covenant of works. In this form they were delivered to Moses to be deposited in the ark in order to prefigure the fulfilling of them by Messiah, the surety of a better covenant (Heb. 7:22), and the concealing of that form, or the removal of it from them, to all who should believe in Him.”

— John Colquhoun, A Treatise on the Law and Gospel, (Grand Rapids: Reformation Heritage Books), 55–56.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+the+law+as+a+covenant+of+works+was+displayed+on+Mount+Sinai+appears+also+from+this%3A+the+Ten+Commandments%2C+written+on+tables+of+stone+and+so+given+to+Moses+on+Sinai+are+called%2C+by+the+apostle+Paul%2C+%E2%80%9Cthe+ministration+of+death%2C+written+and+engraven+in+stones%E2%80%9D+%282+Cor.+3%3A7%29.+Now+it+is+manifest+that+these+commandments+are+no+otherwise+the+ministration+of+death+than+as+they+are+in+the+form+of+the+covenant+of+works.+In+this+form+they+were+delivered+to+Moses+to+be+deposited+in+the+ark+in+order+to+prefigure+the+fulfilling+of+them+by+Messiah%2C+the+surety+of+a+better+covenant+%28Heb.+7%3A22%29%2C+and+the+concealing+of+that+form%2C+or+the+removal+of+it+from+them%2C+to+all+who+should+believe+in+Him.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel+%28Grand+Rapids%3A+Reformation+Heritage+Books%29%2C+55%E2%80%9356.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff365efb13b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f365efb13b.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/07/colquhoun-the-covenant-of-works-was-displayed-on-sinai/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-d4e5db7ae8" data-kw="">
<blockquote><p>As an evidence that all unregenerate persons are under the dominion of the law as a covenant of works, the natural bent of their hearts in all their views respecting the means of salvation is to the way of that covenant [of works]. They all desire to be under the law of works. All who have embraced either one or another of the false religions that are in the world agree at least in this principle: it is by doing that men are to live. Hence, when the Lord opens the eyes of a man to see that horrible gulf of sin and misery into which the first Adam plunged him, he is strongly inclined to exert himself for deliverance in the way of the covenant of works. He struggles hard to forsake his sins and to perform his duties, hoping that by his own performances he will become so righteous as to pacify the wrath of God and to procure for himself eternal life. Ah, ignorant, proud, vain attempt! This, however, he resolutely persists in doing until he is made to despair of ever being able to procure salvation for himself in the way of that covenant. Indeed, this natural bent of the depraved heart toward the way of the law as a covenant, together with deep ignorance of the high demands of the law in that form, is the source of all the self-righteousness that is in the world. To take sinners off from this to a cordial reliance only on the righteousness of the second Adam for all their title to salvation is a special part of the Holy Spirit’s work in conviction and conversion, and to do it requires a greater exertion of His almighty power than even to create a world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 41–42 (emphasis added).</span></figcaption>

5solasquotes.github.io%2Fquote%2Fd4e5db7ae8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d4e5db7ae8.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/07/colquhoun-the-unregenerate-are-under-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-30de8ba973" data-kw="">
<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 19.</span></figcaption>

</figure><figure class="quote" id="q-b2afeedd80" data-kw="">
<blockquote><p>The law, then, as a covenant of works, does, in the most authoritative manner, demand from every descendant of Adam who is under it perfect holiness of nature, perfect righteousness of life, and complete satisfaction for sin. And none of the race of fallen Adam can ever enter heaven unless he either answers these three demands perfectly in his own person or accepts by faith the consummate righteousness of the second Adam, who “is the end of the law for righteousness to every one that believeth” (Rom. 10:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-2ab7421dd5" data-kw="">
<blockquote><p>All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (Grand Rapids: Reformation Heritage Books and Dutch Reformed Translation Society, 2016), Lord’s Day 32.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

d it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-0725ba2c41" data-kw="">
<blockquote><p>CANON 18. That grace is not preceded by merit. Recompense is due to good works if they are performed; but grace, to which we have no claim, precedes them, to enable them to be done. CANON 19. That a man can be saved only when God shows mercy. Human nature, even though it remained in that sound state in which it was created, could be no means save itself, without the assistance of the Creator; hence since man cannot safe-guard his salvation without the grace of God, which is a gift, how will he be able to restore what he has lost without the grace of God? CANON 20. That a man can do no good without God. God does much that is good in a man that the man does not do; but a man does nothing good for which God is not responsible, so as to let him do it.</p></blockquote>

<blockquote><p>CANON 13. Concerning the restoration of free will. The freedom of will that was destroyed in the first man can be restored only by the grace of baptism, for what is lost can be returned only by the one who was able to give it. Hence the Truth itself declares: “So if the Son makes you free, you will be free indeed” (John 8:36). CANON 14. No mean wretch is freed from his sorrowful state, however great it may be, save the one who is anticipated by the mercy of God, as the Psalmist says, “Let thy compassion come speedily to meet us” (79:8), and again, “My God in his steadfast love will meet me” (Ps. 59:10).</p></blockquote>

</figure><figure class="quote" id="q-b92ca2da9e" data-kw="">
<blockquote><p>The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law. And that nature thus beautified with holiness and righteousness and the light of God’s law, is the foundation of the covenant of works, it is very evident; for that it could not well stand with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in his heart, whence those good works might proceed. For this cause, when he was to repeat that covenant of works to the people of Israel, he first gave the law written in tables of stone; then he made a covenant with his people, saying, “Do these things, and ye shall live.” Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God should in him, as in and by a mediator, make his covenant with man. And the cause that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant [note] with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>

<blockquote><p>Paul begins now to make a closer comparison between the law and the nature of man, in order that the origin of the wickedness which leads to death may be more clearly understood. He then sets before us the example of a regenerate man, in whom the remains of the flesh dissent from the law of the Lord in such a way that the spirit would gladly obey it. …Sold under sin. By this expression Paul shows the strength which sin has in itself. By nature man is no less a slave to sin, then the bondmen whom their masters buy and ill-treat at will, as if they were oxen or asses. You are so completely driven by the power of sin, that our whole mind, our whole heart, and all our actions are inclined to sin. Compulsion I always exclude, for the sin of our own free will. It would not be sin if it were not voluntary. We are, however, so addicted to sin, that we can do nothing of our own accord but sin…. 15. For that which I do I know not. And now comes to a more particular example of a man who has already been regenerated. In this man the two objects of Paul’s attention appear more clearly, viz. the great difference which exists between the law of God and the nature of man, and the impossibility of the law of its self producing death…. For the purpose, therefore, of understanding the whole of this argument with more certainty and fidelity, it should be noted that this conflict mentioned by the apostle does not exist in man until he has been sanctified by the spirit of God. There is, therefore, this difference between them and believers. Believers are never so blinded and hardened in their minds as not to come down their crimes when they are reminded of them in the judgment of their own conscience…. Among the godly, on the other hand, the regeneration of God has been begun. They are so divided, however, that although they aspire to God with a special desire of their hearts, seek heavenly righteousness, and hate sin, they are drawn back again to the earth by the remnant of their flesh. Accordingly, in this state of distraction they fight against their own nature and feel their own nature fighting against them. They condemn their sins, not only because they are compelled by the judgment of reason, but because they abhor them with genuine feeling of the heart and detest their conduct in committing sin. This is the Christian warfare between flesh and spirit, of which Paul speaks in Gal. 5.17…. We may do dues from this what we stated previously, that Paul is here speaking of believers. Some grace of the Spirit exists in them, which illustrates the agreement between a sound mind and the righteousness of the law, because the flesh does not hate sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Epistle of Paul the Apostle to the Romans and to the Thessalonians</cite>, trans. Ross MacKenzie, ed. David W. Torrance and Thomas F. Torrance (Grand Rapids: Eerdmans Publishing Company, 1961), 146–47, 148, 149, 150.</span></figcaption>

</figure><figure class="quote" id="q-13bf37024c" data-kw="">
<blockquote><p>Everyone will have to agree that for Adam, perfect keeping of the law for a fixed period of time was the means to acquire eternal beatitude that cannot be lost. When the covenant of works was broken, God could have rescinded this promise. He was no longer bound to honor it. Nevertheless, He allowed the promise and the condition to stand and repeatedly be published anew, especially by the proclamation of the Sinaitic law (Lev 18:5, “The one who does them will live by them”; cf. Rom 10:5, “For Moses describes the righteousness that is by the law,” etc.; Gal 3:12). Fulfillment of this condition from man’s side was no longer conceivable; thus the repetition must have had a different significance. This significance can only be that after the fall God gave His covenant of grace, in which the same demand and promise are fulfilled in the Mediator.</p></blockquote>

</figure><figure class="quote" id="q-c1cfe68768" data-kw="">
<blockquote><p>The communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten Commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being places in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requireth personal obedience, perfect obedience, and exact obedience. He that ‘continueth not in all is cursed,’ Gal. iii. 10. The law then findeth us dead and killeth us. It findeth us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>

</figure><figure class="quote" id="q-0bddb2a82d" data-kw="">
<blockquote><p>IX. Although natural liberty agrees in essentials with the liberty of man constituted in other states, still it differs greatly in accidentals. For the liberty of glory in blessedness is not to be able to sin (non posse peccare). The liberty of sinners in the state of sin is not to be able not to sin (non posse non peccare). The liberty of believers, in grace, is to be able to sin, and not to sin (posse peccare et non peccare). But the liberty of Adam was to be able not to sin (posse non peccare). The first was an absolute incapability of sinning; the second an incapability of acting well; the third the power of sinning and of acting well. The fourth was the power of not sinning. Augustine explains this excellently: “We must diligently and attentively examine if these good things differ, to be able not to sin (posse non peccare), and not to be able to sin (non posse peccare), to be able not to die, and not to be able to die, to be able not to leave the good, and not to be able to leave the good. For the first man was able not to sin, not to die, not to leave the good” (Admonition and Grace 12* [33] [FC 2:285; PL 44.936]). And afterwards: “Therefore the first liberty of will was to be able not to sin (posse non peccare), the last will be much greater, not to be able to sin (non posse peccare). The first immortality was the power of not dying, the last will be much greater, the incapability of dying. The first was the power of perseverance, the power to not desert the good, the last will be the happiness of perseverance, the want of power to desert the good” (ibid., pp. 285–86).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, ed. James T. Dennison Jr., vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.9 (p. 571).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability.html">Free Will and Inability</a></span></div>

</figure><figure class="quote" id="q-f9d695d05f" data-kw="">
<blockquote><p>VII. However, although he was free from the slavery of sin (because created just and upright) still he was not free from mutability (because whatever his holiness and righteousness, he was mutable, from which in consequence he could fall). Adam was placed in such a state in which he could stand and fall, sin and not sin. Although this argues less perfection than the state of grace (which is immutable), still it denotes no fault or imperfection (since immutability is by no means a gift of nature, but of grace). Still that mutability cannot belong to the liberty of Adam (although sometimes it is so termed) because that condition did not fear to be adorned with so illustrious a description which placed a limit to both the liberty and happiness of man; rather it was only an appendage of the Adamic liberty, so proper to it that it neither has been nor can be in any other man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.7 (p. 571).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability.html">Free Will and Inability</a></span></div>

</figure><figure class="quote" id="q-82aed5df44" data-kw="">
<blockquote><p>VI. The liberty of Adam was not the liberty of independence (as if he was irresponsible [anypeuthynos] and absolutely his own master) because he ought always to be in subjection (as a creature to his Creator, as a second cause to the first and to depend upon his will). It was not the liberty of a will undetermined by the practical intellect; for this would have changed the will into an irrational appetite, so that he would have sought evil as evil. This would not have been so much liberty as an unbridled license, incompatible (asystatos) with the image of God. But there was in him another threefold liberty: (1) from coaction; (2) from physical necessity; (3) from slavery (both of sin and of misery). The former two constituted his essential liberty. It belongs to man in whatever state constituted and has two characteristics: preference (to proairetikon) and will (to hekousion), so that what is done may be done by a previous judgment of the reason and spontaneously. But the latter was accidental because it comes in upon the essential liberty and can be separated from it (since true liberty exists where such freedom from slavery does not exist, as in the state of sin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.6 (p. 570).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“VI. The liberty of Adam was not the liberty of independence (as if he was irresponsible [anypeuthynos] and absolutely his own master) because he ought always to be in subjection (as a creature to his Creator, as a second cause to the first and to depend upon his will). It was not the liberty of a will undetermined by the practical intellect; for this would have changed the will into an irrational appetite, so that he would have sought evil as evil. This would not have been so much liberty as an unbridled license, incompatible (asystatos) with the image of God. But there was in him another threefold liberty: (1) from coaction; (2) from physical necessity; (3) from slavery (both of sin and of misery). The former two constituted his essential liberty. It belongs to man in whatever state constituted and has two characteristics: preference (to proairetikon) and will (to hekousion), so that what is done may be done by a previous judgment of the reason and spontaneously. But the latter was accidental because it comes in upon the essential liberty and can be separated from it (since true liberty exists where such freedom from slavery does not exist, as in the state of sin).”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.6 (p. 570).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+The+liberty+of+Adam+was+not+the+liberty+of+independence+%28as+if+he+was+irresponsible+%5Banypeuthynos%5D+and+absolutely+his+own+master%29+because+he+ought+always+to+be+in+subjection+%28as+a+creature+to+his+Creator%2C+as+a+second+cause+to+the+first+and+to+depend+upon+his+will%29.+It+was+not+the+liberty+of+a+will+undetermined+by+the+practical+intellect%3B+for+this+would+have+changed+the+will+into+an+irrational+appetite%2C+so+that+he+would+have+sought+evil+as+evil.+This+would+not+have+been+so+much+liberty+as+an+unbridled+license%2C+incompatible+%28asystatos%29+with+the+image+of+God.+But+there+was+in+him+another+threefold+liberty%3A+%281%29+from+coaction%3B+%282%29+from+physical+necessity%3B+%283%29+from+slavery+%28both+of+sin+and+of+misery%29.+The+former+two+constituted+his+essential+liberty.+It+belongs+to+man+in+whatever+state+constituted+and+has+two+characteristics%3A+preference+%28to+proairetikon%29+and+will+%28to+hekousion%29%2C+so+that+what+is+done+may+be+done+by+a+previous+judgment+of+the+reason+and+spontaneously.+But+the+latter+was+accidental+because+it+comes+in+upon+the+essential+liberty+and+can+be+separated+from+it+%28since+true+liberty+exists+where+such+freedom+from+slavery+does+not+exist%2C+as+in+the+state+of+sin%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+8.1.6+%28p.+570%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F82aed5df44.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/82aed5df44.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/12/turretin-on- <blockquote><p>IV. Liberty is fourfold: (1) the liberty of independence which belongs to God as the first being; this is opposed to the necessity of dependence which belongs to all creatures. (2) Liberty from coaction by which man acts spontaneously and with freedom; this is opposed to the necessity of coaction seen in those who act through force. (3) Rational liberty from brute and physical necessity by which man acts from choice (ek proaireseōs) and not by a brute instinct and blind impulse; this is opposed to the physical necessity of inanimates and brutes. (4) Liberty from slavery by which man is subject to the yoke of no slavery, either of sin or of misery; this is opposed to the necessity of slavery in sinners.</p></blockquote>

</figure><figure class="quote" id="q-83baa068be" data-kw="">
<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.7 [pp. 575–76].</span></figcaption>

</figure><figure class="quote" id="q-02da253815" data-kw="">
<blockquote><p>1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends. This the apostle proves undeniably in this epistle, especially in the chapter foregoing, and those two that follow. Hence it follows that it could abrogate or disannul nothing which God at any time before had given as a general rule unto the church. For that which is particular cannot abrogate any thing that was general, and before it; as that which is general doth abrogate all antecedent particulars, as the new covenant doth abrogate the old. And this we must consider in both the instances belonging hereunto. For,— (1.) God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfil it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant. For,— [1.] It revived, declared, and expressed all the commands of that covenant in the decalogue; for that is nothing but a divine summary of the law written in the heart of man at his creation. And herein the dreadful manner of its delivery or promulgation, with its writing in tables of stone, is also to be considered; for in them the nature of that first covenant, with its inexorableness as unto perfect obedience, was represented. And because none could answer its demands, or comply with it therein, it was called “the ministration of death,” causing fear and bondage, 2 Cor. 3:7. [2.] It revived the sanction of the first covenant, in the curse or sentence of death which it denounced against all transgressors. Death was the penalty of the transgression of the first covenant: “In the day that thou eatest, thou shalt die the death.” And this sentence was revived and represented anew in the curse wherewith this covenant was ratified, “Cursed be he that confirmeth not all the words of this law to do them,” Deut. 27:26; Gal. 3:10. For the design of God in it was to bind a sense of that curse on the consciences of men, until He came by whom it was taken away, as the apostle declares, Gal. 3:19. [3.] It revived the promise of that covenant,—that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Rom. 10:5; as he doth, Lev. 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 23.77–78.</span></figcaption>

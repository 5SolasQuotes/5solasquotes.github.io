<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>

</figure><figure class="quote" id="q-762b7e58fd" data-kw="">
<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.</span></figcaption>

<blockquote><p>QUESTION II. What ground we have to speak of “God’s covenant with Adam,” and to call it “a covenant;” there being no mention of it here in the text, nor elsewhere in scripture do we read of “God’s covenant with Adam.” ANSWER. However the name be not here, yet the thing is here and elsewhere, comparing scripture with scripture. It is a nice cavil in Socinians to call for the word “satisfaction;” others, for the word “sacrament;” others, for the word “Trinity;” others, for the words “faith alone justifying;” others, for the word “sabbath” for Lord’s day, etc.; and thence to conclude against satisfaction, sacraments, Trinity, justification by faith alone, and sabbath, for want of express words, when the things themselves are lively set down in other words. So, in this case of God’s covenant with Adam, we have: God’s command, which lays man under an obligation. We have God’s promise upon condition of obedience. We have God’s threatening upon his disobedience. We have their understanding it so, as appears in Eve’s words to the serpent. ( Gen. iii. 3.) We have the two trees as signs and symbols of the covenant. We have a “second covenant” and a “new covenant;” therefore there was a first and old covenant: a covenant of grace supposes one of works. OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7—9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that does” these things “shall live in them.” (Gal. 3:12) So likewise to the Romans: “Moses describes the righteousness which is of the law, That the man who does those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text. QUESTION III. Wherein, then, does this covenant of works consist? What is the nature, tenor, and end of it, as such? ANSWER 1. This covenant required working on our part, as the condition of it, for justification and happiness; [and is] therefore called “a covenant of works.” Thus before: “The man that does” these things “shall live in them.” (Gal. 3:12) Working, indeed, is also required under grace now; but, (1.) Not to justification; (2.) Not from our own power; (Eph. 2:8) (3.) Not previous to faith, which “works by love,” (Gal. 5:6) and lives by working; (James 2:20;) but man lives by faith. 2. A second characteristic sign of the covenant of works is this,— that in and under it man is left to stand upon his own legs and bottom, to live upon his own stock and by his own industry; he had a power to stand, and not to have fallen. This is meant, when it is said, “God created man in his own image.” (Gen. 1:27) And again: “Lo, this only have I found, that God made man upright.” (Eccles. 7:29) 3. In the first covenant, namely, that of works, man had no need of a mediator; God did then stipulate with Adam immediately: for, seeing as yet he had not made God his enemy by sin, he needed no daysman to make friends by intercession for him. After man’s creation God said, he “saw every thing which he had made, and, behold, it was very good.” (Gen. 1:31) And after the covenant made in Gen. ii., it is said, “They were naked, and were not ashamed:” (verse 25:) that is, they had not contracted guilt by committing of sin, from whence only arises shame. Therefore under the covenant [of works] there needs no mediator. And hence Moses’s law was not properly a covenant of works, because that law was given “in the hand of a mediator.” (Gal. 3:19) 4. The covenant of works once broken, God abates nothing of his justice, no, not upon repentance; but the soul that sinned, died. Mark our text: “Thou shalt die the death;” by which doubling of the words in the Hebrew idiom of speech, is meant vehemency and certainty; which was effected, and so had continued inevitably, without the help of another covenant, hinted in that first promise, Gen. 3:15. For the first covenant gives no relief to a poor sinner, when he hath broken it; but leaves him hopeless and helpless, under “a fearful expectation of” wrath “and fiery indignation.” (Heb. 10:27) 5. The Lord in the covenant of works accepts the person for the work’s sake: that is, he mainly looks at the work, how adequate it is to the command and rule; which he so exactly heeds, that upon the least failure his justice breaks out in wrath, neither can any personal excellency in the world salve the matter: “Cursed is he that continues not in all the words of the law to do them. And all the people shall say, Amen;” (Deut. 27:26; Gal. 3:10) a doleful Amen! And, “Whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” (James 2:1) Note that “whosoever;” God respects no man’s person in that case. 6. The covenant of works, in performance of the condition, leaves a man matter of boasting and glorying in himself, and makes God a debtor to him: “Where is boasting? It is excluded. By what law? of works? Nay.” (Rom. 3:27) As if he had said, “The covenant of works affords matter of boasting to him that workS to justification by his own personal power and righteousness.” “Now to him that works is the reward reckoned, not of grace, but of debt;” (Rom. 4:4) that is, it obliges God to pay it him as a due; which is the language of Pharisees and Papists; which were justly challenged and claimed, (1.) Were we indeed under a covenant of works, and not of grace; (2.) Were our works perfect; (3.) Did we not lie at God’s mercy, for our guilt:—all which declare man impotent, and grace necessary; and, withal, Jews and Papists to be enemies to the cross of Christ and covenant of grace, and under a covenant of works, of which more anon. 7. The covenant of works leaves a man still in doubt while resting in it, in that state; because it is a mutable state at best. He had all in his own hands, and then Satan cunningly rooked him of all. God puts him into a good bottom, and leaves him to be his own pilot at sea: the devil assaults him, and sinks him. And therefore the second covenant takes all into God’s hands, that it may continue safe under his fatherly care and custody; (1 Peter 1:4, 5; John 10:28, 29) and so gives the soul good security against death and danger, which Adam had not while he stood: much less can any rich or honorable man, in his fool’s paradise here in this world, say, his mountain is unmovable, his glory unchangeable; seeing it “passeth away” as a “pageant.” (1 Cor. 7:31) If Adam’s Paradise was so mutable, much more theirs: if he stood not in his integrity, how shall they stand in their iniquity? 8. The covenant of works was made with all men in Adam, who was made and stood as a public person, head and root, in a common and comprehensive capacity; I say, It was made with him as such, and with all in him: [Quo mansit remanente, et quo pereunte peribat; “He and all stood and fell together.” For even the elect may say, “We are all by nature the children of wrath, as well as others;” and that of St. Paul: “We know that what things soever the law saith, it saith to them who are under the law: that every mouth may be stopped, and all the world may become guilty before God.” (Rom.3:19) But the covenant of grace is a discriminating thing; it takes-in some, and leaves out others. Christ is not a head in covenant with all, as Adam was; but of his elect only: for we find many in the world under the headship of Satan and antichrist and old Adam, who are out of Christ; not only because unconverted, as saints themselves are before regeneration; but out of Christ in the account of God’s election, donation, and covenant; who have none of his special love, nor ever shall have. Thus I have briefly opened the distinguishing characters of the covenant of works; which might have been more enlarged by those of the covenant of grace, which is easily done by way of opposition and comparison one with the other….</p></blockquote>

ath;” by which doubling of the words in the Hebrew idiom of speech, is meant vehemency and certainty; which was effected, and so had continued inevitably, without the help of another covenant, hinted in that first promise, Gen. 3:15. For the first covenant gives no relief to a poor sinner, when he hath broken it; but leaves him hopeless and helpless, under “a fearful expectation of” wrath “and fiery indignation.” (Heb. 10:27) 5. The Lord in the covenant of works accepts the person for the work’s sake: that is, he mainly looks at the work, how adequate it is to the command and rule; which he so exactly heeds, that upon the least failure his justice breaks out in wrath, neither can any personal excellency in the world salve the matter: “Cursed is he that continues not in all the words of the law to do them. And all the people shall say, Amen;” (Deut. 27:26; Gal. 3:10) a doleful Amen! And, “Whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” (James 2:1) Note that “whosoever;” God respects no man’s person in that case. 6. The covenant of works, in performance of the condition, leaves a man matter of boasting and glorying in himself, and makes God a debtor to him: “Where is boasting? It is excluded. By what law? of works? Nay.” (Rom. 3:27) As if he had said, “The covenant of works affords matter of boasting to him that workS to justification by his own personal power and righteousness.” “Now to him that works is the reward reckoned, not of grace, but of debt;” (Rom. 4:4) that is, it obliges God to pay it him as a due; which is the language of Pharisees and Papists; which were justly challenged and claimed, (1.) Were we indeed under a covenant of works, and not of grace; (2.) Were our works perfect; (3.) Did we not lie at God’s mercy, for our guilt:—all which declare man impotent, and grace necessary; and, withal, Jews and Papists to be enemies to the cross of Christ and covenant of grace, and under a covenant of works, of which more anon. 7. The covenant of works leaves a man still in doubt while resting in it, in that state; because it is a mutable state at best. He had all in his own hands, and then Satan cunningly rooked him of all. God puts him into a good bottom, and leaves him to be his own pilot at sea: the devil assaults him, and sinks him. And therefore the second covenant takes all into God’s hands, that it may continue safe under his fatherly care and custody; (1 Peter 1:4, 5; John 10:28, 29) and so gives the soul good security against death and danger, which Adam had not while he stood: much less can any rich or honorable man, in his fool’s paradise here in this world, say, his mountain is unmovable, his glory unchangeable; seeing it “passeth away” as a “pageant.” (1 Cor. 7:31) If Adam’s Paradise was so mutable, much more theirs: if he stood not in his integrity, how shall they stand in their iniquity? 8. The covenant of works was made with all men in Adam, who was made and stood as a public person, head and root, in a common and comprehensive capacity; I say, It was made with him as such, and with all in him: [Quo mansit remanente, et quo pereunte peribat; “He and all stood and fell together.” For even the elect may say, “We are all by nature the children of wrath, as well as others;” and that of St. Paul: “We know that what things soever the law saith, it saith to them who are under the law: that every mouth may be stopped, and all the world may become guilty before God.” (Rom.3:19) But the covenant of grace is a discriminating thing; it takes-in some, and leaves out others. Christ is not a head in covenant with all, as Adam was; but of his elect only: for we find many in the world under the headship of Satan and antichrist and old Adam, who are out of Christ; not only because unconverted, as saints themselves are before regeneration; but out of Christ in the account of God’s election, donation, and covenant; who have none of his special love, nor ever shall have. Thus I have briefly opened the distinguishing characters of the covenant of works; which might have been more enlarged by those of the covenant of grace, which is easily done by way of opposition and comparison one with the other….”

— Samuel Annesley, The morning exercises at Cripplegate 1679–81, ed. James Nichols (London: Thomas Tegg, 1844), 5.96–99. [Spelling and Punctuation modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQUESTION+II.+What+ground+we+have+to+speak+of+%E2%80%9CGod%E2%80%99s+covenant+with+Adam%2C%E2%80%9D+and+to+call+it+%E2%80%9Ca+covenant%3B%E2%80%9D+there+being+no+mention+of+it+here+in+the+text%2C+nor+elsewhere+in+scripture+do+we+read+of+%E2%80%9CGod%E2%80%99s+covenant+with+Adam.%E2%80%9D+ANSWER.+However+the+name+be+not+here%2C+yet+the+thing+is+here+and+elsewhere%2C+comparing+scripture+with+scripture.+It+is+a+nice+cavil+in+Socinians+to+call+for+the+word+%E2%80%9Csatisfaction%3B%E2%80%9D+others%2C+for+the+word+%E2%80%9Csacrament%3B%E2%80%9D+others%2C+for+the+word+%E2%80%9CTrinity%3B%E2%80%9D+others%2C+for+the+words+%E2%80%9Cfaith+alone+justifying%3B%E2%80%9D+others%2C+for+the+word+%E2%80%9Csabbath%E2%80%9D+for+Lord%E2%80%99s+day%2C+etc.%3B+and+thence+to+conclude+against+satisfaction%2C+sacraments%2C+Trinity%2C+justification+by+faith+alone%2C+and+sabbath%2C+for+want+of+express+words%2C+when+the+things+themselves+are+lively+set+down+in+other+words.+So%2C+in+this+case+of+God%E2%80%99s+covenant+with+Adam%2C+we+have%3A+God%E2%80%99s+command%2C+which+lays+man+under+an+obligation.+We+have+God%E2%80%99s+promise+upon+condition+of+obedience.+We+have+God%E2%80%99s+threatening+upon+his+disobedience.+We+have+their+understanding+it+so%2C+as+appears+in+Eve%E2%80%99s+words+to+the+serpent.+%28+Gen.+iii.+3.%29+We+have+the+two+trees+as+signs+and+symbols+of+the+covenant.+We+have+a+%E2%80%9Csecond+covenant%E2%80%9D+and+a+%E2%80%9Cnew+covenant%3B%E2%80%9D+therefore+there+was+a+first+and+old+covenant%3A+a+covenant+of+grace+supposes+one+of+works.+OBJECTION.+If+any+shall+say%2C+%E2%80%9CBy+%E2%80%98first+and+old+covenant%E2%80%99+was+meant+God%E2%80%99s+covenant+with+Israel%2C+and+not+with+Adam%3B+and+so%2C+by+%E2%80%98covenant+of+works%E2%80%99+the+same+is+meant%3B+namely%2C+that+which+the+Lord+made+at+Mount+Sinai%3A%E2%80%9D+%28Heb.+8%3A7%E2%80%949%3A%29+ANSWER.+Hereunto+I+answer%2C+There+is+a+repetition+of+the+covenant+of+works+with+Adam+in+the+law+of+Moses%3B+as+in+that+of+the+apostle+to+the+Galatians%3A+%E2%80%9CThe+law+is+not+of+faith%3A+but%2C+The+man+that+does%E2%80%9D+these+things+%E2%80%9Cshall+live+in+them.%E2%80%9D+%28Gal.+3%3A12%29+So+likewise+to+the+Romans%3A+%E2%80%9CMoses+describes+the+righteousness+which+is+of+the+law%2C+That+the+man+who+does+those+things+shall+live+by+them.%E2%80%9D+%28Rom.+10%3A5.%29+Thus+it+was+with+Adam+principally+and+properly%3A+therefore+he+was+under+a+covenant+of+works%2C+when+God+gave+him+that+command+in+my+text.+QUESTION+III.+Wherein%2C+then%2C+does+this+covenant+of+works+consist%3F+What+is+the+nature%2C+tenor%2C+and+end+of+it%2C+as+such%3F+ANSWER+1.+This+covenant+required+working+on+our+part%2C+as+the+condition+of+it%2C+for+justification+and+happiness%3B+%5Band+is%5D+therefore+called+%E2%80%9Ca+covenant+of+works.%E2%80%9D+Thus+before%3A+%E2%80%9CThe+man+that+does%E2%80%9D+these+things+%E2%80%9Cshall+live+in+them.%E2%80%9D+%28Gal.+3%3A12%29+Working%2C+indeed%2C+is+also+required+under+grace+now%3B+but%2C+%281.%29+Not+to+justification%3B+%282.%29+Not+from+our+own+power%3B+%28Eph.+2%3A8%29+%283.%29+Not+previous+to+faith%2C+which+%E2%80%9Cworks+by+love%2C%E2%80%9D+%28Gal.+5%3A6%29+and+lives+by+working%3B+%28James+2%3A20%3B%29+but+man+lives+by+faith.+2.+A+second+characteristic+sign+of+the+covenant+of+works+is+this%2C%E2%80%94+that+in+and+under+it+man+is+left+to+stand+upon+his+own+legs+and+bottom%2C+to+live+upon+his+own+stock+and+by+his+own+industry%3B+he+had+a+power+to+stand%2C+and+not+to+have+fallen.+This+is+meant%2C+when+it+is+said%2C+%E2%80%9CGod+created+man+in+his+own+image.%E2%80%9D+%28Gen.+1%3A27%29+And+again%3A+%E2%80%9CLo%2C+this+only+have+I+found%2C+that+God+made+man+upright.%E2%80%9D+%28Eccles.+7%3A29%29+3.+In+the+first+covenant%2C+namely%2C+that+of+works%2C+man+had+no+need+of+a+mediator%3B+God+did+then+stipulate+with+Adam+immediately%3A+for%2C+seeing+as+yet+he+had+not+made+God+his+enemy+by+sin%2C+he+needed+no+daysman+to+make+friends+by+intercession+for+him.+After+man%E2%80%99s+creation+God+said%2C+he+%E2%80%9Csaw+every+thing+which+he+had+made%2C+and%2C+behold%2C+it+was+very+good.%E2%80%9D+%28Gen.+1%3A31%29+And+after+the+covenant+made+in+Gen.+ii.%2C+it+is+said%2C+%E2%80%9CThey+were+naked%2C+and+were+not+ashamed%3A%E2%80%9D+%28verse+25%3A%29+that+is%2C+they+had+not+contracted+guilt+by+committing+of+sin%2C+from+whence+only+arises+shame.+Therefore+under+the+covenant+%5Bof+works%5D+there+needs+no+mediator.+And+hence+Moses%E2%80%99s+law+was+not+properly+a+covenant+of+works%2C+because+that+law+was+given+%E2%80%9Cin+the+hand+of+a+mediator.%E2%80%9D+%28Gal.+3%3A19%29+4.+The+covenant+of+works+once+broken%2C+God+abates+nothing+of+his+justice%2C+no%2C+not+upon+repentance%3B+but+the+soul+that+sinned%2C+died.+Mark+our+text%3A+%E2%80%9CThou+shalt+die+the+death%3B%E2%80%9D+by+which+doubling+of+the+words+in+the+Hebrew+idiom+of+speech%2C+is+meant+vehemency+and+certainty%3B+which+was+effected%2C+and+so+had+continued+inevitably%2C+without+the+help+of+another+covenant%2C+hinted+in+that+first+promise%2C+Gen.+3%3A15.+For+the+first+covenant+gives+no+relief+to+a+poor+sinner%2C+when+he+hath+broken+it%3B+but+leaves+him+hopeless+and+helpless%2C+under+%E2%80%9Ca+fearful+expectation+of%E2%80%9D+wrath+%E2%80%9Cand+fiery+indignation.%E2%80%9D+%28Heb.+10%3A27%29+5.+The+Lord+in+the+covenant+of+works+accepts+the+person+for+the+work%E2%80%99s+sake%3A+that+is%2C+he+mainly+looks+at+the+work%2C+how+adequate+it+is+to+the+command+and+rule%3B+which+he+so+exactly+heeds%2C+that+upon+the+least+failure+his+justice+breaks+out+in+wrath%2C+neither+can+any+personal+excellency+in+the+world+salve+the+matter%3A+%E2%80%9CCursed+is+he+that+continues+not+in+all+the+words+of+the+law+to+do+them.+And+all+the+people+shall+say%2C+Amen%3B%E2%80%9D+%28Deut.+27%3A26%3B+Gal.+3%3A10%29+a+doleful+Amen%21+And%2C+%E2%80%9CWhosoever+shall+keep+the+whole+law%2C+and+yet+offend+in+one+point%2C+he+is+guilty+of+all.%E2%80%9D+%28James+2%3A1%29+Note+that+%E2%80%9Cwhosoever%3B%E2%80%9D+God+respects+no+man%E2%80%99s+person+in+that+case.+6.+The+covenant+of+works%2C+in+performance+of+the+condition%2C+leaves+a+man+matter+of+boasting+and+glorying+in+himself%2C+and+makes+God+a+debtor+to+him%3A+%E2%80%9CWhere+is+boasting%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay.%E2%80%9D+%28Rom.+3%3A27%29+As+if+he+had+said%2C+%E2%80%9CThe+covenant+of+works+affords+matter+of+boasting+to+him+that+workS+to+justification+by+his+own+personal+power+and+righteousness.%E2%80%9D+%E2%80%9CNow+to+him+that+works+is+the+reward+reckoned%2C+not+of+grace%2C+but+of+debt%3B%E2%80%9D+%28Rom.+4%3A4%29+that+is%2C+it+obliges+God+to+pay+it+him+as+a+due%3B+which+is+the+language+of+Pharisees+and+Papists%3B+which+were+justly+challenged+and+claimed%2C+%281.%29+Were+we+indeed+under+a+covenant+of+works%2C+and+not+of+grace%3B+%282.%29+Were+our+works+perfect%3B+%283.%29+Did+we+not+lie+at+God%E2%80%99s+mercy%2C+for+our+guilt%3A%E2%80%94all+which+declare+man+impotent%2C+and+grace+necessary%3B+and%2C+withal%2C+Jews+and+Papists+to+be+enemies+to+the+cross+of+Christ+and+covenant+of+grace%2C+and+under+a+covenant+of+works%2C+of+which+more+anon.+7.+The+covenant+of+works+leaves+a+man+still+in+doubt+while+resting+in+it%2C+in+that+state%3B+because+it+is+a+mutable+state+at+best.+He+had+all+in+his+own+hands%2C+and+then+Satan+cunningly+rooked+him+of+all.+God+puts+him+into+a+good+bottom%2C+and+leaves+him+to+be+his+own+pilot+at+sea%3A+the+devil+assaults+him%2C+and+sinks+him.+And+therefore+the+second+covenant+takes+all+into+God%E2%80%99s+hands%2C+that+it+may+continue+safe+under+his+fatherly+care+and+custody%3B+%281+Peter+1%3A4%2C+5%3B+John+10%3A28%2C+29%29+and+so+gives+the+soul+good+security+against+death+and+danger%2C+which+Adam+had+not+while+he+stood%3A+much+less+can+any+rich+or+honorable+man%2C+in+his+fool%E2%80%99s+paradise+here+in+this+world%2C+say%2C+his+mountain+is+unmovable%2C+his+glory+unchangeable%3B+seeing+it+%E2%80%9Cpasseth+away%E2%80%9D+as+a+%E2%80%9Cpageant.%E2%80%9D+%281+Cor.+7%3A31%29+If+Adam%E2%80%99s+Paradise+was+so+mutable%2C+much+more+theirs%3A+if+he+stood+not+in+his+integrity%2C+how+shall+they+stand+in+their+iniquity%3F+8.+The+covenant+of+works+was+made+with+all+men+in+Adam%2C+who+was+made+and+stood+as+a+public+person%2C+head+and+root%2C+in+a+common+and+comprehensive+capacity%3B+I+say%2C+It+was+made+with+him+as+such%2C+and+with+all+in+him%3A+%5BQuo+mansit+remanente%2C+et+quo+pereunte+peribat%3B+%E2%80%9CHe+and+all+stood+and+fell+together.%E2%80%9D+For+even+the+elect+may+say%2C+%E2%80%9CWe+are+all+by+nature+the+children+of+wrath%2C+as+well+as+others%3B%E2%80%9D+and+that+of+St.+Paul%3A+%E2%80%9CWe+know+that+what+things+soever+the+law+saith%2C+it+saith+to+them+who+are+under+the+law%3A+that+every+mouth+may+be+stopped%2C+and+all+the+world+may+become+guilty+before+God.%E2%80%9D+%28Rom.3%3A19%29+But+the+covenant+of+grace+is+a+discriminating+thing%3B+it+takes-in+some%2C+and+leaves+out+others.+Christ+is+not+a+head+in+covenant+with+all%2C+as+Adam+was%3B+but+of+his+elect+only%3A+for+we+find+many+in+the+world+under+the+headship+of+Satan+and+antichrist+and+old+Adam%2C+who+are+out+of+Christ%3B+not+only+because+unconverted%2C+as+saints+themselves+are+before+regeneration%3B+but+out+of+Christ+in+the+account+of+God%E2%80%99s+election%2C+donation%2C+and+covenant%3B+who+have+none+of+his+special+love%2C+nor+ever+shall+have.+Thus+I+have+briefly+opened+the+distinguishing+characters+of+the+covenant+of+works%3B+which+might+have+been+more+enlarged+by+those+of+the+covenant+of+grace%2C+which+is+easily+done+by+way+of+opposition+and+comparison+one+with+the+other%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Samuel+Annesley%2C+The+morning+exercises+at+Cripplegate+1679%E2%80%9381%2C+ed.+James+Nichols+%28London%3A+Thomas+Tegg%2C+1844%29%2C+5.96%E2%80%9399.+%5BSpelling+and+Punctuation+modernized%5D&amp;url=https%3A%2F% <blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>

<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, trans. E. W. (London, 1595), 87–88. [Spelling modernized]</span></figcaption>

</figure><figure class="quote" id="q-16e5724eaa" data-kw="">
<blockquote><p>God’s covenant, is his contract with man, concerning the obtaining of life eternal, upon a certain condition. This covenant consists of two parts: God’s promise to man, Man’s promise to God. God’s promise to man, is that, whereby he binds himself to man to be his God, if he perform the condition. Man’s promise to God, is that, whereby he vows his allegiance unto his Lord, and to perform the condition between them. Again, there are two kinds of this covenant. The covenant of works, and the covenant of grace. Jer. 31:31, 32, 33. “Behold the days come, says the Lord, that I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant, I made with their fathers, when I took them by the hand to bring them out of the land of Egypt; the which my covenant they brake, although I was an husband to them, saith the Lord. But this shall be the covenant, that I will make with the house of Israel: after those days, says the Lord, I will put my law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people.” The covenant of works, is Gods covenant, made with condition of perfect obedience, and is expressed in the moral law. The Moral Law, is that part of God’s word, which commands perfect obedience unto man, as well in his nature, as in his actions, and forbids the contrary. Romans 10. 5. “Moses thus describes the righteousness which is of the law, that the man which doth these things, shall live thereby.” 1. Timothy 1. 5. “The end of the commandment, is love out of a pure heart, and of a good conscience, and faith unfeigned.” Luke 16. 27. “You shalt love the Lord your God, with all your heart, with all your soul, and with all your strength.” Rom. 7. 14. “We know that the law is spiritual.” The Law has two parts. The Edict, commanding obedience, and the condition binding to obedience. The condition is eternal life to such as fulfill the law, but to transgressors, everlasting death. The Decalogue, or ten commandments, is an abridgement of the whole law, and the covenant of works. Exod. 34:27. And the Lord said unto Moses, Write these words, for after the tenor of these words, I have made a covenant with thee, and with Israel. And be was there with the Lord forty days and forty nights, and did neither eat bread, nor drink water, and he wrote in the tables the words of the covenant, even the ten commandments. 1. King. 8. 9. Nothing was in the Ark, save the two tables of stone, which Moses had put there at Horeb, where the Lord made a covenant with the children of Israel, when he brought them out of the land of Egypt. Mat. 22:40. “On these two commandments hangs the whole law and the prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Golden Chaine</cite>, (Cambridge, 1616), 32. [spelling and punctuation updated</span></figcaption>

</figure><figure class="quote" id="q-20e6ca868f" data-kw="">
<blockquote><p>This obedience of the Son was superior to all the justice of the Law. For Adam also, if he willed, could have remained in the righteousness of the Law. And to the degree that the curse was owed for every sin of the elect, to the same degree he had to fulfill all righteousness without any complaint, not even all the Angels were able to do this. Therefore, this obedience of the Son was not only regarding the righteousness of the Law, such as Adam received in creation, and such as the Law required of him, but also it exceeded the righteousness of all the Angels.</p></blockquote>

</figure><figure class="quote" id="q-2a9fc46282" data-kw="">
<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de iustificatione</cite>, (1536) in Luther’s Works, 26.185, 187</span></figcaption>

<blockquote><p>The second consequence attributed to the imputation of Christ’s righteousness, is a title to eternal life. This in the older writers is often expressed by the words “adoption and heirship.” Being made the children of God by faith in Christ Jesus (Gal. 3:26), they are heirs of God and joint heirs with Jesus Christ of a heavenly inheritance. (Romans 8:17.) The mere expiation of guilt confers no title to eternal life. The condition of the covenant under which man was placed was perfect obedience. This, from all that appears in Scripture, the perfection of God requires. As He never pardons sins unless the demands of justice be satisfied, so He never grants eternal life unless perfect obedience be rendered. Heaven is always represented as a purchased possession. In the covenant between the Father and the Son the salvation of his people was promised as the reward of his humiliation, obedience, and death. Having performed the stipulated conditions, He has a claim to the promised recompense. And this claim inures to the benefit of his people. But besides this, as the work of Christ consisted in his doing all that the law of God, or covenant of works requires for the salvation of men, and as that righteousness is freely offered to every one that believes. every such believer has as valid a claim to eternal life as he would have had, had he personally done all that the law demands. Thus broad and firm is the foundation which God has laid for the hopes of his people. It is the rock of ages; Jehovah our righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 3 vols. (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 3.164–65.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The second consequence attributed to the imputation of Christ’s righteousness, is a title to eternal life. This in the older writers is often expressed by the words “adoption and heirship.” Being made the children of God by faith in Christ Jesus (Gal. 3:26), they are heirs of God and joint heirs with Jesus Christ of a heavenly inheritance. (Romans 8:17.) The mere expiation of guilt confers no title to eternal life. The condition of the covenant under which man was placed was perfect obedience. This, from all that appears in Scripture, the perfection of God requires. As He never pardons sins unless the demands of justice be satisfied, so He never grants eternal life unless perfect obedience be rendered. Heaven is always represented as a purchased possession. In the covenant between the Father and the Son the salvation of his people was promised as the reward of his humiliation, obedience, and death. Having performed the stipulated conditions, He has a claim to the promised recompense. And this claim inures to the benefit of his people. But besides this, as the work of Christ consisted in his doing all that the law of God, or covenant of works requires for the salvation of men, and as that righteousness is freely offered to every one that believes. every such believer has as valid a claim to eternal life as he would have had, had he personally done all that the law demands. Thus broad and firm is the foundation which God has laid for the hopes of his people. It is the rock of ages; Jehovah our righteousness.”

9d03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99809b9d03.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/hodge-christ-fulfilled-the-conditions-of-the-covenant-of-works-for-believers/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>1. The distance between God and the creature is so great, that although reasonable creatures do owe obedience unto him as their Creator, yet they could never have any fruition of him as their blessedness and reward, but by some voluntary condescension on God’s part, which he hath been pleased to express by way of covenant. 2. The first covenant made with man was a covenant of works, wherein life was promised to Adam; and in him to his posterity, upon condition of perfect and personal obedience. 3. Man, by his fall, having made himself incapable of life by that covenant [of works], the Lord was pleased to make a second, commonly called the covenant of grace; wherein he freely offereth unto sinners life and salvation by Jesus Christ; requiring of them faith in him, that they may be saved, and promising to give unto all those that are ordained unto eternal life his Holy Spirit, to make them willing, and able to believe.</p></blockquote>

</figure><figure class="quote" id="q-1b332b9bae" data-kw="">
<blockquote><p>Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favor and life, if indeed he acted in obedience to his will. Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself. Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with thc whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heidegger-and-turretin.html">Heidegger And Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, (1675)</span></figcaption>

</figure><figure class="quote" id="q-b44322fa51" data-kw="">
<blockquote><p>3. BASICALLY, THE COVENANT OF GRACE IS SIMPLY THE EXECUTION OF THE ORIGINAL AGREEMENT BY CHRIST AS OUR SURETY. He undertook freely to carry out the will of God. He placed Himself under the law, that He might redeem them that were under the law, and were no more in a position to obtain life by their own fulfilment of the law. He came to do what Adam failed to do, and did it in virtue of a covenant agreement. And if this is so, and the covenant of grace is, as far as Christ is concerned, simply the carrying out of the original agreement, it follows that the latter must also have been of the nature of a covenant. And since Christ met the condition of the covenant of works, man can now reap the fruit of the original agreement by faith in Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 214.</span></figcaption>

</figure><figure class="quote" id="q-7d30a5a5b6" data-kw="">
<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.”

</figure><figure class="quote" id="q-46ebad6447" data-kw="">
<blockquote><p>XXV. Such a perfect observance of the laws of the covenant, up to the period which God had fixed for probation, had given man a right to the reward. Not from any intrinsic proportion of the work to the reward, as the grosser Papists proudly boast; but from God’s covenant and engagement, which was no ways unbecoming him to enter into. Nor had man, before the consummation of his obedience, even in the state of innocence, a right to life. He was only in a state of acquiring a right, which would at length be actually acquired, when he could say, I could have fulfilled the conditions of the covenant, I have constantly and perfectly done what was commanded; now I claim and expect that thou, my God, wilt grant the promised happiness. XXVI. How absurdly again do the Papists assert, that Adam, as he came from the hands of his Creator, had a right, as the adopted Son of God, to supernatural happiness, as to his paternal inheritance; which, according to Bellarmine, de Justificat. l. v. 17. “is due to the adopted Son of God, in right of adoption, previous to all good works.” But this is truly a preposterous way of reasoning. For the right of adoption belongs to the covenant of grace in Christ Jesus: “the adoption of children is by Jesus Christ,” Eph. 1:5. Besides, was this opinion true, good works could not be required, as the condition of acquiring a right to eternal life; but could only serve to prevent the forfeiture of the right of a son: by this means, the whole design of the covenant of works, and all the righteousness which is by the law, are quite destroyed. In fine, what can be more absurd, than the trifling manner in which these sophisters talk of the grace of adoption, as giving Adam a right to enter upon an heavenly inheritance, in a legal covenant: when, on the other hand, they so stiffly contend for the merits of works, under a covenant of grace. It is only there (to wit, under the covenant of grace) that we are to apply the above sentiment, that the inheritance is due to an adopted Son of God, in right of adoption, previous to all good works.</p></blockquote>

</figure><figure class="quote" id="q-84de65cf2d" data-kw="">
<blockquote><p>V. The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the conditions of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man it is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of works because it depended upon works or his proper obedience. XIV. Although man was already bound to this obedience by a natural obligation as a rational creature, necessarily subject to the dominion of God and his law, yet he was more strongly bound by a federal obligation which God so stipulated that man–by the powers received in creation–could perform it, although in order that he might actually perform it, he still needed the help of God both to actuate these faculties and powers and to preserve them from change. This help did not tend to the infusion of any new power but only to exercising the efficacy of that power which he had received. Now this did not belong properly to the covenant of nature, but always depended on the most free good pleasure (eudokia) of God; Otherwise the covenant of nature has been immutable, And man had never sinned. XV. The sanction of the covenant attended the exaction of duty. It consisted both in the promise of reward and gain and in the threatening of punishment. The promise was of the highest happiness (of eternal life) to be passed not on earth but in heaven. The threatening was of death and whatever in scripture comes under the name of death to express punishment of all kinds (into which man by his own sin deservedly fell). XVI. However, from this pact arises the mutual obligation of the parties, differing according to their condition. With respect to man, not only was it from the pact, but absolute and simple from the nature of the thing (and on account of God, to whom man as a creature to the Creator, the beneficiary to the Benefactor, owed himself wholly and whatever he had to God and was bound to love him with his whole heart). But with respect to God, it was gratuitous, as depending upon a pact or gratuitous promise (by which God was bound not to man, but to himself and to his own goodness, fidelity and truth, Rom. 3:3; 2 Tim 2:13). Therefore there was no debt (properly so called) from which man could derive a right, but only a debt of fidelity, arising out of the promise by which God demonstrated his infallible and immutable constancy in truth. If the apostle seems to acknowledge this right or debt (Rom. 4:4), it must be understood in no other than a respective sense; not as to the proportion and condignity of the duty rendered to God by man (Rom. 8:18; Lk. 17:10), but to the pact of God and justice (i.e., the fidelity of him making it). XVII. If therefore upright man in that state had obtained this merit, it must not be understood properly and rigorously. Since man has all things from and owes all to God, he can seek from him nothing as his own by right, nor can God be a debtor to him–not by condignity of work and from its intrinsic value (because what ever that may be, it can bear no proportion to the infinite reward of life), but from the pact and the liberal promise of God (according to which man had the right of demanding the reward to which God had of his own accord bound himself) and in comparison with the covenant of grace (which rests upon the sole merit of Christ, by which he acquired for us the right to life). However, this demanded antecedently a proper and personal obedience by which he obtained both his own justification before God and life, as the stipulated reward of his labors.</p></blockquote>

<blockquote><p>Now, therefore, we are to speak of the Word, or of the covenant of God, having first set down the ground, that all the word of God appertains to some covenant; for God speaks nothing to man without the covenant. For which cause all the scripture, both old and new where in God’s Word is contained, bears the name of God’s covenant or testament. The covenant of God generally is a promise under some one certain condition. And it is twofold; the first is the covenant of works; the second is the covenant of grace. Paul (Gal 4:24) expressly set down two covenants, which in the Old Testament were shadowed by two women, as by types, to whit, Hagar, the handmaid, and Sarah, the free woman; For saith he,”These be those two covenants.” Let us then speak something of these two covenants; and first of the covenant of works. The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law and that nature thus beautified with holiness and righteousness in the light of God’s law, is the foundation of the covenant of works, it is very evident for that could not stand well with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in His heart, whence those good works might proceed. For this cause he, when he was to repeat that covenant of works to the people of Israel, he gave the first law written in tables of stone; Then he made a covenant with his people, saying,”do these things and ye shall live.” Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God showed in him, as in and buy a mediator, make his covenant with man. And the causes that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Effectual Calling in Select Works of Robert Rollock</cite>, ed. William M. Gunn , 2 vol. (Edinburgh: Woodrow Society, 1849), 1.33–35</span></figcaption>

+to+his+law%2C+except+he+had+first+created+man+pure+and+holy%2C+and+had+engraven+his+law+in+His+heart%2C+whence+those+good+works+might+proceed.+For+this+cause+he%2C+when+he+was+to+repeat+that+covenant+of+works+to+the+people+of+Israel%2C+he+gave+the+first+law+written+in+tables+of+stone%3B+Then+he+made+a+covenant+with+his+people%2C+saying%2C%E2%80%9Ddo+these+things+and+ye+shall+live.%E2%80%9D+Therefore+the+ground+of+the+covenant+of+works+was+not+Christ%2C+nor+the+grace+of+God+in+Christ%2C+but+the+nature+of+man+in+the+first+creation+holy+and+perfect%2C+endued+also+with+the+knowledge+of+the+law.+For%2C+as+touching+the+covenant+of+works%2C+there+was+no+mediator+in+the+beginning+between+God+and+man%2C+that+God+showed+in+him%2C+as+in+and+buy+a+mediator%2C+make+his+covenant+with+man.+And+the+causes+that+there+was+no+need+of+a+mediator+was+this%2C+that+albeit+there+were+two+parties+entering+into+a+covenant%2C+yet+there+was+no+such+breach+or+variance+betwixt+them+that+they+had+need+of+any+mediator+to+make+reconciliation+between+them%3B+for%2C+as+for+the+covenant+of+works%2C+God+made+this+covenant+with+man%2C+as+one+friend+doth+with+another.+For+in+the+creation+we+were+God%E2%80%99s+friends%2C+and+not+his+enemies.+Thus+far+of+the+ground+of+the+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+A+Treatise+of+God%E2%80%99s+Effectual+Calling+in+Select+Works+of+Robert+Rollock%2C+ed.+William+M.+Gunn+%2C+2+vol.+%28Edinburgh%3A+Woodrow+Society%2C+1849%29%2C+1.33%E2%80%9335&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f2f9905ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f2f9905ba.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/03/rollock-covenant-of-works-founded-on-nature-and-republished-to-israel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-45221490ee" data-kw="">
<blockquote><p>OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7–9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that doeth” these things “shall live in them.” (Gal. 3:12.) So likewise to the Romans: “Moses describeth the righteousness which is of the law, That the man who doeth those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cooper.html">William Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VI: The Covenant of Works” in James Nichols</cite>, ed. Puritan Sermons (Wheaton, IL: Richard Owen Roberts, Publishers, 1981), 5.97.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-8de89ac022" data-kw="">
<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Covenant of Works</cite>, 5</span></figcaption>

</figure><figure class="quote" id="q-560646ec17" data-kw="">
<blockquote><p>A Repetition of the Law of the Covenant of Works. In the ministry of Moses, there was a repetition of the doctrine concerning the law of the covenant of works. The Mosaic Covenant, then, seems to be a sort of republication of the covenant of works. Of course it is not identical to the prelapsarian covenant, but there is that condition «by which formula, the righteousness, which is of the law, is described, Rom. x. 5. And the terror of the covenant of works is increased by repeated comminations; and that voice heard, cursed be he that confirmeth not all the words of this law to do them, Deut. xxvii. as the requirement of obedience was rigid under the ministry of Moses, the promises of spiritual and saving grace were more rare and obscure, the measure of the Spirit granted to the Israelites, scanty and short, Deut. xxix. 4. and on the contrary, the denunciation of the curse frequent and express; hence the ministry of Moses is called, “the ministration of death and condemnation,” 2 Cor. iii. 7,9. doubtless because it mentioned the condemnation of the sinner, and obliged the Israelites to subscribe to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 187.</span></figcaption>

">Read it online · Heidelblog</a></div>

<blockquote><p>Sin which does not thus reign, is that which the sinner resists by the grace of the Holy Spirit. It does not, therefore, expose him to eternal death, because he has repented and found favor through Christ. Such sins are disordered inclinations and unholy desires, a want of righteousness, and many sins of ignorance, of omission, and of infirmity, which remain the godly as long as they continue in this life; but which they, nevertheless, acknowledge, deplore, hate, resist, and earnestly pray may be forgiven them for the sake of Christ, the Mediator, saying, forgive us our debts. Hence the godly retain their faith and consolation, notwithstanding they are not free from these sins. “If we say we have no sin, we deceive ourselves, and the truth is not in us.” “It is no more I that do it, but sin that dwelleth in me.” “There is no condemnation to them that are in Christ Jesus, who walk after the Spirit.” “Who can understand his errors? Cleanse me from secret faults.” (1 John 1:8. Rom. 7:18; 8:1. Ps. 19:13.)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Sin which does not thus reign, is that which the sinner resists by the grace of the Holy Spirit. It does not, therefore, expose him to eternal death, because he has repented and found favor through Christ. Such sins are disordered inclinations and unholy desires, a want of righteousness, and many sins of ignorance, of omission, and of infirmity, which remain the godly as long as they continue in this life; but which they, nevertheless, acknowledge, deplore, hate, resist, and earnestly pray may be forgiven them for the sake of Christ, the Mediator, saying, forgive us our debts. Hence the godly retain their faith and consolation, notwithstanding they are not free from these sins. “If we say we have no sin, we deceive ourselves, and the truth is not in us.” “It is no more I that do it, but sin that dwelleth in me.” “There is no condemnation to them that are in Christ Jesus, who walk after the Spirit.” “Who can understand his errors? Cleanse me from secret faults.” (1 John 1:8. Rom. 7:18; 8:1. Ps. 19:13.)”

— Zacharias Ursinus, Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSin+which+does+not+thus+reign%2C+is+that+which+the+sinner+resists+by+the+grace+of+the+Holy+Spirit.+It+does+not%2C+therefore%2C+expose+him+to+eternal+death%2C+because+he+has+repented+and+found+favor+through+Christ.+Such+sins+are+disordered+inclinations+and+unholy+desires%2C+a+want+of+righteousness%2C+and+many+sins+of+ignorance%2C+of+omission%2C+and+of+infirmity%2C+which+remain+the+godly+as+long+as+they+continue+in+this+life%3B+but+which+they%2C+nevertheless%2C+acknowledge%2C+deplore%2C+hate%2C+resist%2C+and+earnestly+pray+may+be+forgiven+them+for+the+sake+of+Christ%2C+the+Mediator%2C+saying%2C+forgive+us+our+debts.+Hence+the+godly+retain+their+faith+and+consolation%2C+notwithstanding+they+are+not+free+from+these+sins.+%E2%80%9CIf+we+say+we+have+no+sin%2C+we+deceive+ourselves%2C+and+the+truth+is+not+in+us.%E2%80%9D+%E2%80%9CIt+is+no+more+I+that+do+it%2C+but+sin+that+dwelleth+in+me.%E2%80%9D+%E2%80%9CThere+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C+who+walk+after+the+Spirit.%E2%80%9D+%E2%80%9CWho+can+understand+his+errors%3F+Cleanse+me+from+secret+faults.%E2%80%9D+%281+John+1%3A8.+Rom.+7%3A18%3B+8%3A1.+Ps.+19%3A13.%29%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Body+of+Orthodox+Doctrine+of+the+Explication+of+the+Catechism%2C+on+Q.+7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F006dc58a76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/006dc58a76.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/12/sin-disordered-inclinations-unholy-desires-and-a-lack-of-righteousness/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-354c26cd8f" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.1.4.</span></figcaption>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

r+foot+shall+certainly+slide+in+due+time%3B+the+law+is+continually+throwing+the+fire-balls+of+its+curses+on+them%2C+and+will+at+length+set+them+on+fire+round+about%3B+death+is+on+the+pursuit+after+them%2C+and+has+gained+much+ground+of+them+already%2C+and+the+cloud+of+wrath+hangs+over+their+heads+continually+in+the+curse%2C+and+the+small+rain+of+God%E2%80%99s+wrath+is+still+falling+on+them%3B+how+soon+death+may+overtake+them%2C+they+know+not%3B+and+then+the+cloud+breaks%2C+and+the+great+rain+of+his+strength+falls+down+upon+them%2C+and+sweeps+them+away+without+hope+for+ever+and+ever.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+11+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+303%E2%80%9304.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa93b5fd0b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a93b5fd0b1.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/07/boston-man-under-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.”

— Herman Witsius, The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXLVIII.+Secondly%2C+we+more+especially+remark%2C+that+when+the+law+was+given+from+Mount+Sinai+or+Horeb+there+was+a+repetition+of+the+covenant+of+works.+For+those+tremendous+signs+of+thunders+and+lightnings%2C+of+an+earthquake%2C+a+thick+smoke+and+black+darkness%2C+were+adapted+to+strike+Israel+with+great+terror.+And+the+setting+bounds+and+limits+round+about+the+mount%2C+whereby+the+Israelites+were+kept+at+a+distance+from+the+presence+of+God%2C+upbraided+them+with+that+separation+which+sin+had+made+between+God+and+them.+%E2%80%9CIn+a+word%2C+whatever+we+read%2C+Exod.+19+%28says+Calvin%2C+on+Heb.+12%3A19%29+is+intended+to+inform+the+people%2C+that+God+then+ascended+his+tribunal%2C+and+manifested+himself+as+an+impartial+Judge.+If+an+innocent+animal+happened+to+approach%2C+he+commanded+it+to+be+thrust+through+with+a+dart%3B+how+much+sorer+punishment+were+sinners+liable+to%2C+who+were+conscious+of+their+sins%2C+nay%2C+and+knew+themselves+indicted+by+the+law%2C+as+guilty+of+eternal+death.%E2%80%9D+See+the+same+author+on+Exod.+19%3A1%2C+16.+And+the+apostle+in+this+matter%2C+Heb.+12%3A18%E2%80%9322%2C+sets+Mount+Sinai+in+opposition+to+Mount+Sion%2C+the+terrors+of+the+law+to+the+sweetness+of+the+gospel.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity+%284.4.48%29%2C+trans.+William+Crookshank%2C+vol.+2+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+188.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20ee32ad01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20ee32ad01.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/06/witsius-the-law-given-at-sinai-was-a-repetition-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-7f41ca17ec" data-kw="">
<blockquote><p>It will now be asked, what manner of covenant was that at Mount Sinai, which is called the worst covenant? What kind of covenant was it? Sol. In general, it was a covenant of works, as to be fulfilled by Jesus Christ, but not so to Israel. Or, it was the covenant of grace as to its legal condition to be performed by Jesus Christ, represented under a conditional administration of it to Israel.</p></blockquote>

</figure><figure class="quote" id="q-944fc81d80" data-kw="">
<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-654774880c" data-kw="">
<blockquote><p>The covenant of God generally is a promise under some one certain condition. And it is twofold; the first is the covenant of works; the second is the covenant of grace. Paul ( Gal. iv. 24) expressly sets down two covenants, which in the Old Testament were shadowed by two women, as by types, to wit, Hagar, the handmaid, and Sarah, the free woman; for, saith he, these be those two covenants. Let us then speak something of these two covenants; and first of the covenant of works. The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law. And that nature thus beautified with holiness and righteousness and the light of God’s law, is the foundation of the covenant of works, it is very evident; for that it could not well stand with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in his heart, whence those good works might proceed. For this cause, when he was to repeat that covenant of works to the people of Israel, he first gave the law written in tables of stone; then he made a covenant with his people, saying, Do these things, and ye shall live. Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God should in him, as in and by a mediator, make his covenant with man. And the cause that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Effectual Calling in Select Works of Robert Rollock</cite>, (1597), trans. 1849, 34–35.</span></figcaption>

</figure><figure class="quote" id="q-706737c25c" data-kw="">
<blockquote><p>The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture.(Edinburgh: T&amp;T Clark</cite>, (Oxford: Oxford University Press, 1867), 38–39.</span></figcaption>

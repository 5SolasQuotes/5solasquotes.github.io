enant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-da88f29e9d" data-kw="">
<blockquote><p>The same doctrine Moses repeated in his ministry. For he also inculcated the same precepts upon which the covenant of works had been built: he both repeated the same solemn saying, He who doeth these things shall live in them, Lev. 18:5 and also added another, Cursed be he who shall not perform the words of this law in doing them, Deut. 27:26. That this is the curse of the law, as it stands opposed to the covenant of grace, Paul teacheth, Gal. 3:10. which, however, is not so to be understood, as if God had intended, by the ministry of Moses, to make a new covenant of works with Israel, with a view to obtain righteousness and salvation by such a covenant. But that repetition of the covenant of works was designed to convince the Israelites of their sin and misery, to drive them out of themselves, to teach them the necessity of a satisfaction, and to compel them to cleave to Christ: and thus it was subservient to the covenant of grace, Rom. 10:4.</p></blockquote>

<blockquote><p>Quest. Now, whence comes this rootedness and firm stability of God’s children? Ans. Especially from this, that they are now in the covenant of grace, rooted in Christ, who is God-man, in whom they are firmly rooted. In Adam we had a root of our own, but now our root is in Christ. All grace is first poured into Christ’s blessed nature, John 1:16, and then at a second hand, ‘out of his fulness we all receive grace for grace.’ Being rooted in Christ we become firm, for there is in him an everlasting marriage and union. ‘The root beareth us, we bear not the root,’ Rom. 11:18. Christ beareth us, we bear not him. So now, in the covenant of grace, all the firmness is out of us. Even as salvation itself was wrought out of us by a mediator, so it is kept by a mediator out of us. All goodness, grace, and favour of God to us is not in us, but in Christ; but it is so out of us, as Christ and we are one. But now we only speak of the cause of our firmness and stability, that because we are in the state of grace we have an everlasting firmness, as we are in Christ Jesus, God now making a second covenant, he will not have it disannulled as the first was, for his second works are better than his first. His first covenant was, ‘Do this and live,’ Lev. 18:5; but his second is, ‘Believe this and live,’ Rom. 10:9. So as howsoever our state in grace be but little, yet it is of a blessed, growing, spreading, firm nature, so sure as what is begun in grace will end in glory. Where God gives the first fruits he will give tenths, yea, the full harvest and all, because by the covenant of grace we are one with Christ, who is an everlasting head that never dies. Subservient to this now we have promised in the covenant of grace that we shall never depart from him, and that he will never depart from us to do us good. He puts an awe-band into our hearts, that we shall never depart from him. But this point being often touched, leaving it, we will come to answer some objections.</p></blockquote>

<blockquote><p>How hath the Moral Law been delivered since the Fall? The Sum thereof was comprised in ten Words, (Exod. 34:28; Deut. 4:13.) commonly called the Decalogue or Ten Commandments; solemnly published and engraved in Table of Stone by God himself, (Deut. 4:14 &amp; 10:4.) Afterwards the same was more fully delivered in the Books of Holy Scripture, and so committed to the Church for all Ages, as the Royal Law for Direction of our Obedience to God our King, (James 1:8.) and for the Discovery of Sin, and the Punishment due thereto, Deut. 27:26; Rom. 1:31 &amp; 3:20. What then doth the Law now require of us? All such Duties as were required of Adam in his Innocency, (Levit. 18:5.) and all such as are required since by reason of his Fall, (Deut. 17:2–6.) binding us to eternal Death for our least defect therein. Declare now out of that which hath been said, what the Covenant of Works is? It is a Conditional Covenant between God and Man, whereby on the one side God commandeth the Perfection of Godliness and Righteousness, and promiseth that he will be our God, if we keep all his Commandments; and on the other side, Man bindeth himself to perform intire and perfect Obedience to God’s Law, by that Strength wherewith God hath indued him by the Nature of his first Creation. What was done in this Covenant on God’s part? There was his Law, backed with Promises and Threatnings; and unto them were added outward Seals. What was the Sum of this Law? Do this, and thou shalt live: If thou dost it not, thou shalt die the Death. What is meant by, Do this? Keep all my Commandments in Thought, Word, and Deed. What is meant by Life, promised to those that should keep all the Commandments? The Reward of Blessedness and Everlasting Life, Levit. 18:5; Luk. 10:28. What is meant by Death threatned to those that should transgress? In this World the Curse of God, and Death, with manifold Miseries both of Body and Soul: And (where this Curse is not taken away) Everlasting Death both of Body and Soul in the World to come, Deut. 27:26 &amp; 29:19, 20 &amp; 32:22; Levit. 26; Deut. 28. What were the outward Seals added hereunto? The two Trees, planted by God for that purpose in the midst of the Garden, Gen. 2:9 &amp; 3:3. that Adam before and in the sight of them might resort to some special place to serve God in, and might by the Sight of them be put in mind of those things whereof they were Signs and Seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, (London: R. J.; Jonathan Robinson; A. and J. Churchill; J. Taylor; J. Wyatt, 1702), 170–71.</span></figcaption>

<blockquote><p>This overview is sufficient to show how the older writings can manifest the covenant doctrine in Reformed theology. But, one might perhaps say, that only applies to the covenant of grace. These historical data cannot prove that the covenant of works belonged to the old Reformed school. This contention has been expressed repeatedly. In the second half of the seventeenth century Vlak and Bekker declared themselves against the covenant of works on the grounds that it was an invention of theologians of that period and was not encountered in the older Reformed theologians. It was supposed that Lubbertus, Makkowski, and Cloppenburg were the first to have introduced it. Just as Cocceius has occasionally been looked upon as the discoverer of the covenant concept in general, so also some wanted to maintain that the doctrine of the covenant of works had been thought up in the period immediately preceding Cocceius. If this is taken to mean that previously this doctrine had not been worked out in every detail and was not presented in all clarity as was the case later, then there is some truth to it. But whoever has the historical sense to be able to separate the mature development of a thought from its original sprouting and does not insist that a doctrine be mature at birth, will have no difficulty in recognizing the covenant of works as an old Reformed doctrine. Already with Ursinus in the Larger Catechism the question: “What does the divine law teach you?” is answered:“What kind of a covenant God entered into with man at the creation and how man behaved in the keeping of that covenant,” etc. Likewise, Olevianus speaks of the covenant of law, the covenant of nature, the covenant of creation in contradistinction to the covenant of grace. Sometimes, it is true, he means by it the promulgation of the Mosaic law, but in other places it is no less clear that the actual covenant of works has to be sought before the fall. Only in two points was this older doctrine of the covenant of works superseded by its later development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos</cite>, (De verbondsleer in de Gereformeerde theologie (Grand Rapids: “Democrat” Drukpers, 1891). This was Vos’ rectoral address at the Theological School of the Christian Reformed Church in Grand Rapids, Michigan. Trans. S. Voorwinde and W. Van Gemeren pu</span></figcaption>

<blockquote><p>ARGUMENT. V. Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts 10:43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. I think Dr. Preston says well, when he tells us, “It is a fault to think God’s pardons are not free, and that you must bring something in your hand. The very end (says he) of thy going to Christ, is to get thy hardness of heart and deadness of spirit removed, to be healed and enlivened.” And it is truly strange to think from what airth repentance should come to people, while as yet their sins are unpardoned, and God is their enemy. What need is their of those ways? Why go we not by faith to a reconciled God, to get repentance; but must seek repentance wherewith we may go to an unreconciled God, who is a consuming fire? If I mistake not, that is not the way of the gospel. It is a seasonable admonition that one gives us to this purpose, “When you go to mourn for sin, begin aloft with Christ; and do not always think to begin below with sin, and so to come up to Christ; but begin aloft with Christ, and fall down upon your sin.” “Papists (says Dr. Preston) tell of escaping damnation, and of getting into heaven. But Scripture gives other motives (to good works). Thou art in Christ, and Christ is thine; consider what he hath done for thee, what thou hast by him, what thou hadst been without him, and thus stir up thyself to do for him what he requireth.” Let them that will, repent that Christ may do for them; I shall desire always to believe what Christ hath done for me, that I may repent; not doubting but that the being instructed therein is the plain way to smiting on the thigh, and saying, What have I done? So says a godly writer, “First of all, God’s favour is apprehended, and remission of sin believed; then upon that cometh alteration of life and conversation.” Upon the whole’ we may see that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we must cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all? There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon. And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this. Now, this doctrine says, Repent, and thy sins shall be pardoned; which is indeed, Do this, and thou shalt live. It requires not perfect obedience indeed; but if we resolve it, we find it to be this, Turn from sin sincerely unto God, though thou caust not perfectly, and thou shalt live in God’s favour. Now, we know magis et minus non variant speciem. I have almost lost sight of faith its relation to the pardon of sin: and no great wonder; seeing another thing is set betwixt them, which seems to take the right hand of faith; for they will not say repentance goes before faith, and yet they will not allow it to come after remission of sin. So then it must go betwixt them, and therefore is the nearest mean: and whichsoever of two means be in themselves the more noble, yet, in relation to the common end, it is highly reasonable to prefer the immediate and nearest mean to the mediate and remote; whereby it comes to pass, that, in the matter of the pardon of sin, repentance most be the more noble mean. Again, I say, I believe and desire to go immediately to Christ for pardon: but dost thou repent of thy sins, thy faith cannot obtain pardon without repentance? Well then, still repentance is preferable to faith here: for without it faith can do nothing; but with it, it proves effectual; now, Propter quod unumquodque est tale, illud ipsum est magis tale. But this I am confident is not the doctrine of the gospel. Let us take a watchword from holy and learned Rutherford: “We would beware (says he) of Mr. Baxter’s* order of setting repentance and works of new obedience before justification; which is indeed a new covenant of works.</p></blockquote>

Papists+%28says+Dr.+Preston%29+tell+of+escaping+damnation%2C+and+of+getting+into+heaven.+But+Scripture+gives+other+motives+%28to+good+works%29.+Thou+art+in+Christ%2C+and+Christ+is+thine%3B+consider+what+he+hath+done+for+thee%2C+what+thou+hast+by+him%2C+what+thou+hadst+been+without+him%2C+and+thus+stir+up+thyself+to+do+for+him+what+he+requireth.%E2%80%9D+Let+them+that+will%2C+repent+that+Christ+may+do+for+them%3B+I+shall+desire+always+to+believe+what+Christ+hath+done+for+me%2C+that+I+may+repent%3B+not+doubting+but+that+the+being+instructed+therein+is+the+plain+way+to+smiting+on+the+thigh%2C+and+saying%2C+What+have+I+done%3F+So+says+a+godly+writer%2C+%E2%80%9CFirst+of+all%2C+God%E2%80%99s+favour+is+apprehended%2C+and+remission+of+sin+believed%3B+then+upon+that+cometh+alteration+of+life+and+conversation.%E2%80%9D+Upon+the+whole%E2%80%99+we+may+see+that+the+gospel+teaches+us+to+come+empty-handed+to+the+market+of+free+grace%2C+for+remission+of+sin+and+God%E2%80%99s+favour.+But+he+comes+not+empty%2C+who+brings+repentance+along+with+him.+If+any+shall+say%2C+that+if+we+screw+up+matters+so+high+in+this+point%2C+we+must+cast+faith+as+well+as+repentance%2C+in+the+matter+of+attaining+pardon%3B+for+that+is+still+something+we+bring+with+us.+I+shall+answer%3B+For+the+safety+of+God%E2%80%99s+grace%2C+let+the+work+faith%2C+the+inherent+quality+faith%2C+go%2C+and+be+made+to+stand+aback%2C+while+the+sinner+stands+before+God%E2%80%99s+tribunal+to+be+justified%3B+that+the+empty-handed%2C+taking+faith%2C+may+alone+have+place.+Hath+not+the+Lord+made+it+to+be+only+of+faith%2C+that+it+might+be+of+grace%2C+while+faith+comes+with+an+empty+hand%2C+and+receives+all%3F+There+is+a+vast+difference+betwixt+faith+and+repentance+in+this+matter%2C+even+as+much+as+betwixt+giving+and+receiving%3A+for+there+is+no+grace+of+the+Spirit+that+hath+more+of+the+nature+of+giving+than+repentance%2C+in+so+far+as+it+is+a+turning+of+the+whole+man+from+sin+unto+God%3B+and+upon+that+head+it+ought+to+be+banished+far+from+the+soul%E2%80%99s+justification%2C+and+to+have+no+part+nor+lot+in+the+matter+of+attaining+free+pardon.+And+seeing+this+doctrine+doth+so+well+agree+with+the+natural+religion+that+is+in+all+men%2C+whereby+they%2C+when+they+come+to+God+to+obtain+a+favour%2C+would+always+be+sure+of+some+qualification+in+themselves+fitting+them+for+the+receipt+of+it%3B+let+us+take+heed%2C+that+it+turn+not+the+covenant+of+grace+into+a+bastard+covenant+of+works.+The+covenant+of+works+says%2C+Do+this%3B+the+covenant+of+grace+says+so+too.+Where+is+the+difference+then%3F+Why%2C+the+covenant+of+works+says%2C+Do+this%2C+and+thou+shalt+live%2C+viz.+in+God%E2%80%99s+favour%2C+wherein+life+lies.+But+the+covenant+of+grace+saith%2C+Live+thou%2C+and+do+this.+Now%2C+this+doctrine+says%2C+Repent%2C+and+thy+sins+shall+be+pardoned%3B+which+is+indeed%2C+Do+this%2C+and+thou+shalt+live.+It+requires+not+perfect+obedience+indeed%3B+but+if+we+resolve+it%2C+we+find+it+to+be+this%2C+Turn+from+sin+sincerely+unto+God%2C+though+thou+caust+not+perfectly%2C+and+thou+shalt+live+in+God%E2%80%99s+favour.+Now%2C+we+know+magis+et+minus+non+variant+speciem.+I+have+almost+lost+sight+of+faith+its+relation+to+the+pardon+of+sin%3A+and+no+great+wonder%3B+seeing+another+thing+is+set+betwixt+them%2C+which+seems+to+take+the+right+hand+of+faith%3B+for+they+will+not+say+repentance+goes+before+faith%2C+and+yet+they+will+not+allow+it+to+come+after+remission+of+sin.+So+then+it+must+go+betwixt+them%2C+and+therefore+is+the+nearest+mean%3A+and+whichsoever+of+two+means+be+in+themselves+the+more+noble%2C+yet%2C+in+relation+to+the+common+end%2C+it+is+highly+reasonable+to+prefer+the+immediate+and+nearest+mean+to+the+mediate+and+remote%3B+whereby+it+comes+to+pass%2C+that%2C+in+the+matter+of+the+pardon+of+sin%2C+repentance+most+be+the+more+noble+mean.+Again%2C+I+say%2C+I+believe+and+desire+to+go+immediately+to+Christ+for+pardon%3A+but+dost+thou+repent+of+thy+sins%2C+thy+faith+cannot+obtain+pardon+without+repentance%3F+Well+then%2C+still+repentance+is+preferable+to+faith+here%3A+for+without+it+faith+can+do+nothing%3B+but+with+it%2C+it+proves+effectual%3B+now%2C+Propter+quod+unumquodque+est+tale%2C+illud+ipsum+est+magis+tale.+But+this+I+am+confident+is+not+the+doctrine+of+the+gospel.+Let+us+take+a+watchword+from+holy+and+learned+Rutherford%3A+%E2%80%9CWe+would+beware+%28says+he%29+of+Mr.+Baxter%E2%80%99s%2A+order+of+setting+repentance+and+works+of+new+obedience+before+justification%3B+which+is+indeed+a+new+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Sermons+and+Discourses+on+Several+Important+Subjects+in+Divinity%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+6+%28Aberdeen%3A+George+and+Robert+King%2C+1849%29%2C+87%E2%80%9389.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd81ce9a933.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d81ce9a933.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/boston-on-not-turning-the-covenant-of-grace-into-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>2. THE PROMISE OF THE COVENANT. The great promise of the covenant of works was the promise of eternal life. They who deny the covenant of works generally base their denial in part on the fact that there is no record of such a promise in the Bible. And it is perfectly true that Scripture contains no explicit promise of eternal life to Adam. But the threatened penalty clearly implies such a promise. When the Lord says, “for in the day that thou eatest thereof thou shalt surely die,” his statement clearly implies that, if Adam refrains from eating, he will not die, but will be raised above the possibility of death. The implied promise certainly cannot mean that, in the case of obedience, Adam would be permitted to live on in the usual way, that is, to continue the ordinary natural life, for that life was his already in virtue of his creation, and therefore could not be held out as a reward for obedience. The implied promise evidently was that of life raised to its highest development of perennial bliss and glory. Adam was indeed created in a state of positive holiness, and was also immortal in the sense that he was not subject to the law of death. But he was only at the beginning of his course and did not yet possess the highest privileges that were in store for man. He was not yet raised above the possibility of erring, sinning, and dying. He was not yet in possession of the highest degree of holiness, nor did he enjoy life in all its fulness. The image of God in man was still limited by the possibility of man’s sinning against God, changing from good to evil, and becoming subject to the power of death. The promise of life in the covenant of works was a promise of the removal of all the limitations of life to which Adam was still subject, and of the raising of his life to the highest degree of perfection. When Paul says in Rom. 7:10 that the commandment was unto life, he means life in the fullest sense of the word. The principle of the covenant of works was: the man that does these things shall live thereby; and this principle is reiterated time and again Scripture, Lev. 18:5; Ezek. 20:11, 13, 20; Luke 10:28; Rom. 10:5; Gal. 3:12.</p></blockquote>

<blockquote><p>1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.</p></blockquote>

<blockquote><p>A difference exists between a furnished and destitute state. The one is of the law considered in itself and its own nature; the other, in relation to us. The law was given to man in the beginning (before the fall) for life and by itself also led to life according to the sanction “do this and thou shalt live” (cf. Rom. 2:13). But after the fall, being destitute of strength through the flesh, it is not given for life, but for a mirror of sin and misery to render the sinner inexcusable (Rom. 3:19, 20). [1.4.15] …So God seriously wills (i.e., commands man to obey the law that he may live, according to the brief clause of the covenant of works: “Do this and thou shalt live”). [4.17.45] IV. (2) If Adam was righteous, he ought to have been immortal because there is a necessary connection between righteousness and life. (a) From the order of God who has joined righteousness and life in the law by an indissoluble bond (as he joined closely together sin and death: “Do this and thou shalt live; the soul that sinneth it shall die”). [5.12.4] XVII. There is not the same relation of justification and of the covenant through all things. To the former, faith alone concurs, but to the observance of the latter other virtues also are required besides faith. These conduce not only to the acceptance of the covenant, but also to its observance. For these two things ought always to be connected—the acceptance of the covenant and the keeping of it when accepted. Faith accepts by a reception of the promises; obedience keeps by a fulfillment of the commands. “Be ye holy, for I am holy.” And yet in this way legal and evangelical obedience are not confounded because the legal is prescribed for the meriting of life, the evangelical, however, only for the possession of it. The former precedes as the cause of life (“Do this and thou shalt live”); the latter follows as its fruit, not that you may live but because you live. The former is not admitted unless it is perfect and absolute; the latter is admitted even if imperfect, provided it be sincere. That is only commanded as man’s duty; this is also promised and given as the gift of God. [12.3.17]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, ed. James T. Dennison Jr. (Phillipsburg, NJ: P&amp;R Publishing, 1992–97).</span></figcaption>

<blockquote><p>This statement does not rest upon any express declaration of the Scriptures. It is, however, a concise and correct mode of asserting a plain Scriptural fact, namely, that God made to Adam a promise suspended upon a condition, and attached to disobedience a certain penalty. This is what in Scriptural language is meant by a covenant, and this is all that is meant by the term as here used. Although the word covenant is not used in Genesis, and does not elsewhere, in any clear passage, occur in reference to the transaction there recorded, yet inasmuch as the plan of salvation is constantly represented as a New Covenant, new, not merely in antithesis to that made at Sinai, but new in reference to all legal covenants whatever, it is plain that the Bible does represent the arrangement made with Adam as a truly federal transaction. The Scriptures know nothing of any other than two methods of attaining eternal life: the one that which demands perfect obedience, and the other that which demands faith. If the latter is called a covenant, the former is declared to be of the same nature. It is of great importance that the Scriptural form of presenting truth should be retained. Rationalism was introduced into the Church under the guise of a philosophical statement of the truths of the Bible free from the mere outward form in which the sacred writers, trained in Judaism, had presented them. On this ground the federal system, as it was called, was discarded. On the same ground the prophetic, priestly, and kingly offices of Christ were pronounced a cumbrous and unsatisfactory form under which to set forth his work as our Redeemer. And then the sacrificial character of his death, and all idea of atonement were rejected as mere Jewish drapery. Thus, by theory of accommodation, every distinctive doctrine of the Scriptures was set aside, and Christianity reduced to Deism. It is, therefore, far more than a mere matter of method that is involved in adhering to the Scriptural form of presenting Scriptural truths. God then did enter into a covenant with Adam. That covenant is sometimes called a covenant of life, because life was promised as the reward of obedience. Sometimes it is called the covenant of works, because works were the condition on which that promise was suspended, and because it is thus distinguished from the new covenant which promises life on condition of faith. …The condition of the covenant made with Adam is said in the symbols of our church to be perfect obedience. That that statement is correct may be inferred (1.) From the nature of the case and from the general principles clearly revealed in the word of God. Such is the nature of God, and such the relation which He sustains to his moral creatures, that sin, the transgression of the divine law, must involve the destruction of the fellowship between man and his Creator, and the manifestation of the divine displeasure. The Apostle therefore says, that he who offends in one point, who breaks one precept of the law of God, is guilty of the whole. (2.) It is everywhere assumed in the Bible, that the condition of acceptance under the law is perfect obedience. “Cursed is every one who continueth not in all things written in the book of the law to do them.” This is not a peculiarity of the Mosaic economy, but a declaration of a principle which applies to all divine laws. (3.) The whole argument of the Apostle in his epistles to the Romans and to the Galatians, is founded on the assumption that the law demands perfect obedience. If that be not granted, his whole argument falls to the ground. The specific command to Adam not to eat of a certain tree, was therefore not the only command he was required to obey. It was given simply to be the outward and visible test to determine whether he was willing to obey God in all things. Created holy, with all his affections pure, there was the more reason that the test of his obedience should be an outward and positive command; something wrong simply because it was forbidden, and not evil in its own nature. It would thus be seen that Adam obeyed for the sake of obeying. His obedience was more directly to God, and not to his own reason. The question whether perpetual, as well as perfect obedience was the condition of the covenant made with Adam, is probably to be answered in the negative. It seems to be reasonable in itself and plainly implied in the Scriptures that all rational creatures have a definite period of probation. If faithful during that period they are confirmed in their integrity, and no longer exposed to the danger of apostasy. Thus we read of the angels who kept not their first estate, and of those who did. Those who remained faithful have continued in holiness and in the favour of God. It is therefore to be inferred that had Adam continued obedient during the period allotted to his probation, neither he nor any of his posterity would have been ever exposed to the danger of sinning.</p></blockquote>

<blockquote><p>With regard to the covenant itself, we must observe, what was the duty required by God; what was the promise made to the performance of that duty; what was the threat denounced against the neglect of it. Now the duty consisted in all that knowledge of God which could be derived from contemplating the divine work, and from revelation, as much as could be acquired by a perfectly upright mind; but especially in obedience to the law of God, both the natural law, which was engraven on man’s heart, and any special commandments, which God might choose to impose (such as was the command to abstain from the fruit of the tree of the knowledge of good and evil;) in short, such an obedience was required, as was true and sincere (having respect not merely to some, but to all and each of God’s commands) constant and persevering, perfect and complete in all its parts. Moreover, man had sufficient power given him by his Creator to perform this obedience. The threatening denounced against the neglect of this obedience, was death, (Gen. 2:17,) by which we understand the death of the body, (Gen. 3:19,) together with all the miseries and calamities of life preceding; the death of the soul, on its separation from God, and from communion with him, (Ephes. 3:1,) and eternal death, consisting of the most dreadful torments both of soul and body. With regard to the promise of the covenant, though it is not expressly laid down, it is sufficiently clear from the threatening of death, which is opposed to it; for although God owes nothing to his creature, yet as the whole scripture sets him forth to us as slow to anger and abundant in mercy, it is not at all probable, that God denounced upon man the threat of eternal punishment, and at the same time gave him no promise. But if any one wonder why God should speak about punishment, and be silent concerning reward, we may give this as the probable reason of it, viz. that innocent Adam needed to have distinct mention made to him both of sin forbidden, and of death its consequence, seeing that in his upright state he was ignorant of death and sin, but it was not so necessary to make mention to him of the life which was to be bestowed upon him, on condition of his persevering in holiness; for he already enjoyed a most blessed life, from which he could very easily judge of the life that was to come. We must therefore form a judgment of the reward, from the punishment, and therefore, as the former comprehended all evil, especially eternal death, so the latter contained all that was good, particularly eternal life, and the most intimate communion with God in unchangeable holiness. This is further confirmed from the covenant of nature being the same as the covenant of works, as we shall see hereafter. Now the covenant of works promised eternal life, saying, “Do this, and live.</p></blockquote>

have distinct mention made to him both of sin forbidden, and of death its consequence, seeing that in his upright state he was ignorant of death and sin, but it was not so necessary to make mention to him of the life which was to be bestowed upon him, on condition of his persevering in holiness; for he already enjoyed a most blessed life, from which he could very easily judge of the life that was to come. We must therefore form a judgment of the reward, from the punishment, and therefore, as the former comprehended all evil, especially eternal death, so the latter contained all that was good, particularly eternal life, and the most intimate communion with God in unchangeable holiness. This is further confirmed from the covenant of nature being the same as the covenant of works, as we shall see hereafter. Now the covenant of works promised eternal life, saying, “Do this, and live.”

<blockquote><p>As to his legal relations, the Scriptures clearly teach that, at his creation, he was put under the equitable Covenant of Works for a certain probationary period. This just constitution provided (a) everlasting well-being on condition of perfect obedience, and (b) everlasting ill-being on condition of disobedience. Now, although under that covenant man failed, it is evident that, nevertheless, both of these conditions must be maintained in their integrity. To relax them would be to violate the word of God, to dishonour his law, and to render his promises and his threatenings alike unworthy of respect. The penalty, when once incurred, can be preserved inviolate only by being executed. The promise of everlasting well-being can be truthfully granted only when the condition of perfect obedience has been fulfilled. Suffering a righteous penalty entitles no criminal to a reward; and to offer eternal blessedness to such, on terms denied to unfallen Adam and to all angels, would be placing a premium on sin.</p></blockquote>

<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness. VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12). VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>

<blockquote><p>…In Hos. 6:7 we read: “But they like Adam have transgressed the covenant.” Attempts have been made to discredit this reading. Some have suggested the reading “at Adam,” which would imply that some well-known transgression occurred at a place called Adam. But the preposition forbids this rendering. Moreover, the Bible makes no mention whatever of such a well-known historical transgression at Adam. The Authorized Version renders “like men,” which would then mean, in human fashion. To this it may be objected that there is no plural in the original, and that such a statement would be rather inane, since man could hardly transgress in any other way. The rendering “like Adam” is after all the best. It is favored by the parallel passage in Job 31:33; and is adopted by the American Revised Version.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans publishing co., 1938), 214–15.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…In Hos. 6:7 we read: “But they like Adam have transgressed the covenant.” Attempts have been made to discredit this reading. Some have suggested the reading “at Adam,” which would imply that some well-known transgression occurred at a place called Adam. But the preposition forbids this rendering. Moreover, the Bible makes no mention whatever of such a well-known historical transgression at Adam. The Authorized Version renders “like men,” which would then mean, in human fashion. To this it may be objected that there is no plural in the original, and that such a statement would be rather inane, since man could hardly transgress in any other way. The rendering “like Adam” is after all the best. It is favored by the parallel passage in Job 31:33; and is adopted by the American Revised Version.”

</figure><figure class="quote" id="q-cba784bf7e" data-kw="">
<blockquote><p>According to the Westminster Confession of Faith, Scripture thinks of man as a covenant being. It tells us that man was originally placed on earth under the terms of the covenant of works. It informs us further that man broke this covenant of works and that God was pleased to carry through his aims with the covenant of works by means of the covenant of grace. Thus Scripture may be said to be the written expression of the provisions of God’s covenantal relationship with man. The Confession further sets forth the Protestant doctrine of Scripture under the four heads of its necessity, its authority, its sufficiency and its perspicuity. The necessity of Scripture lies in the fact that man has broken the covenant of works. He therefore needs the grace of God. There is no speech or manifestation of grace in nature.</p></blockquote>

<blockquote><p>Acquaintance with this covenant is of the greatest importance, for whoever errs here or denies the existence of the covenant of works will not understand the covenant of grace, and will readily err concerning the mediatorship of the Lord Jesus. Such a person will very readily deny that Christ by His active obedience has merited a right to eternal life for the elect. This is to be observed with several parties who, because they err concerning the covenant of grace, also deny the covenant of works. Conversely, whoever denies the covenant of works, must rightly be suspected to be in error concerning the covenant of grace as well.</p></blockquote>

<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law. 2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it. 3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

s+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+31%3A33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+31%3A33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+82%3A7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said%2C+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+3%3A38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+6%3A7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+3.+We+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+3%3A27.+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+6%3A14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11.180%E2%80%9382.+%28HT%3A+John+Fonville%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7457ef94db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7457ef94db.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/boston-galatians-proves-adam-was-in-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>It therefore now appears, that as the law or dictates of pure nature, comprehended together with other fit additionals, became at first one entire constitution aptly suited to the government of man in his innocent state, unto which the title did well agree of the law or covenant of works: so the same natural dictates, transcribed and made express (because now sullied, and not so legible in the corrupted nature of man) do, with such allays [alleviation] and additions as the case required, compose and make up the constitution which bears the title of the law or covenant of grace, or the law of faith, or the gospel of Christ; and is only suitable to the state of man lapsed and fallen, as the measure of that righteousness which he is now to aim at, and aspire unto.</p></blockquote>

<blockquote><p>1. Christ is a doer and fulfiller of the covenant of works most exactly in all points, both the command, and the curse and penalty of the Covenant, is satisfied by him; this is works, and this was the condition required upon his part, Heb. 10. 7, “Then said I, lo I come, in the volume of the book it is written of me, to do your will, O God.” Gal. 3. 13, “Christ has redeemed us from the curse of the Law, being made a curse for us.” 2. Christ as a doer and obedient fulfiller of the Law, has a reward in justice by the promise of this covenant: For (I humbly conceive) he had his reward of debt, and merit, having paid a condign price to the justice of God; therefore his reward is due to him, by commutative Justice, Phil. 2. 7, 8, “But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of man; And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the Cross; wherefore God also hath highly exalted him,” and is craved by him, Joh. 17. 4, 5, “I have glorified you on earth, I have finished the work which you gaves me to do. And now, O Father, glorify me with your own self.</p></blockquote>

<blockquote><p>1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him. 1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it. 2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree. 3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him. 1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it. 2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree. 3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.”

— Francis Roberts, The Mystery And Marrow Of The Bible, (London, 1657), 19–21 [Spelling and punctuation modernized].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Of+God%E2%80%99s+Covenant+of+Works%2C+with+the+First+Adam%2C+and+his+natural+seed+before+the+fall.+APHORISM+I.+GOD+was+pleased+to+enter+into+covenant+with+the+first+Adam%2C+before+his+fall.+Under+the+term%2C+Adam%2C+Scripture+sometimes+comprehends+both+sexes%2C+both+Adam+and+his+wife.+And+if+any+shall+contend+that+God+entered+into+covenant+with+both+Adam+and+we+at+once%2C+as+the+complete+root+of+mankind%2C+I+shall+not+much+gainsay%3A+and+yet+this+will+not+so+easily+be+proved%2C+nor+know+I+any+inconvenience+that+would+follow%2C+should+it+be+denied%2C+the+woman+coming+of+Adam+as+well+as+any+of+his+posterity.+Nor+am+I+ignorant+that+some+are+of+opinion%2C+that+Adam+received+the+covenant+alone%2C+and+was+to+teach+it%2C+and+did+teach+it+to+his+wife%2C+which+opinion+hath+the+more+weight%2C+because+when+God+forbids+the+Eating+of+the+tree+of+knowledge+under+pain+of+death%2C+%28wherein+the+promise+of+life+contrariwise+is+implied%2C%29+he+speaks+only+in+the+singular+number%2C+viz.+to+Adam+only.+But+how+may+it+be+evidenced%2C+That+God+entered+into+covenant+with+the+first+Adam%2C+even+into+a+Covenant+of+Works%2C+before+the+Fall%3F+Answ.+Though+it+be+not+positively+and+plainly+said+in+Scripture%2C+that+God+gave+Adam+a+Covenant+of+Works%2C+before+his+fall%3A+and+though+the+characters+and+footsteps+of+this+covenant+are+not+so+expressly+discovered+in+Holy+Writ%2C+as+of+some+others%3B+yet+notwithstanding%2C+upon+sundry+Scripture-grounds+and+considerations%2C+it+may+be+evinced+sufficiently.+As%2C+From+the+Inscription+of+the+Covenant+of+Works+in+Adam%E2%80%99s+heart.+Before+the+Fall+God+wrote+the+Covenant+of+Works%2C+viz.+The+Substance+of+the+Moral+Law%2C+perfectly+in+Adam%E2%80%99s+heart%3B+and+in+so+doing%2C+entered+into+Covenant+with+him.+Here+are+three+thing+in+this+Position+to+be+cleared%3B+viz.+That+the+Moral+Law+is+the+Covenant+of+Works.+That+this+Moral+Law+was+perfectly+written+in+Adams+heart+before+the+Fall.+That+God+in+Writing+the+Moral+Law+in+his+heart%2C+entered+into+Covenant+of+Works+with+him.+1.+That+the+Moral+Law+%28abstractly+and+precisely+in+its+self+considered%2C+without+the+additionals%2C+viz.+the+preface%2C+ceremonial+law%2C+%26c.+jointly+promulgated+with+it+in+Horeb%29+is+the+Covenant+of+Works+is+manifest%3B+%281%29+Because%2C+the+Moral+Law+%28by+which+is+the+knowledge+of+sin%2C+and+which+works+wrath%29+is+styled+by+the+Apostle+%E2%80%9CThe+Law+of+works%2C%E2%80%9D+and+is+set+in+opposition+to+%E2%80%9CThe+Law+of+Faith.%E2%80%9D+Now+this+Law+of+Works%2C+and+Law+of+Faith%2C+amount+in+effect+to+as+much+as+the+Covenant+of+works%2C+and+Covenant+of+Faith.+%282%29+Because+Righteousness+and+life+were+at+first+by+the+Moral+Law%2C+and+should+have+been+so+still%2C+had+not+the+Law+become+unable+to+give+Righteousness+and+life%2C+in+that+it+was+weak+through+the+flesh%2C+man+through+Sin+being+unable+to+keep+it.+Now+the+Law%2C+requiring+obedience%2C+and+promising+life+upon+that+condition%2C+must+needs+be+a+covenant%2C+and+that+a+Covenant+of+Works%3A+Works+being+the+proper+Condition+of+it.+2.+That+this+Moral+Law+for+Substance+was+perfectly+written+in+Adams+heart+before+the+Fall%2C+is+certain%3B+%281%29+Because%2C+Man+was+made+in+God%E2%80%99s+image+upright%2C+and+perfect.+And+consequently+was+thoroughly+furnished+with+all+accomplishments+of+upright+and+perfect+Humane+nature%3A+and+particularly+with+the+Moral+Law%2C+that+Law+of+Nature%3B+The+substance+whereof+was+engraved+both+in+his+mind%2C+by+natural+light%2C+knowing+it%3B+and+in+his+will%2C+by+natural+integrity+conforming+unto+it.+%282%29+Because%2C+The+Work+of+the+Law+remains+imperfectly+written+in+some+dim+characters+in+the+very+hearts+of+pagans+and+heathens+since+the+fall%3B+They+doing+by+nature+the+things+contained+in+the+Law%2C+and+being+a+Law+unto+themselves%2C+without+the+Law+of+God+written.+Whence+we+may+strongly+conclude+that+much+more+before+the+fall+the+Moral+Law+was+perfectly+written+in+Adam%E2%80%99s+heart%2C+there+being+in+him+no+sin+to+deface+it+in+the+least+degree.+3.+That%2C+God%2C+in+writing+the+Moral+Law+in+Adam%E2%80%99s+heart%2C+entered+into+Covenant+of+Works+with+him.+viz.+by+real+impressions+upon+his+heart%3A+though+not+by+verbal+expressions+to+the+ear.+For+by+this+Law+written+in+Adam%E2%80%99s+heart%2C+he+had+laid+before+him%2C+what+obedience+was+required+and+assented+to+on+Adam%E2%80%99s+part%3A+And+what+recompense+should+be+performed+on+God%E2%80%99s+part.+And+this+was+at+least+an+implicit%2C+if+not+an+explicit%2C+covenanting.+2.+From+God%E2%80%99s+express+prescription+of+a+positive+Law+unto+Adam+in+his+innocent+State.+God%E2%80%99s+positive+Law+is+laid+down+in+these+words%2C+%E2%80%9CAnd+the+LORD+God+commanded+the+man%2C+saying%2C+of+every+Tree+of+the+Garden+you+may+freely+eat%3A+But+of+the+Tree+of+the+Knowledge+of+good+and+evil%2C+you+shall+not+eat+of+it%3B+for+in+the+day+that+you+eat+thereof+thou+shall+surely+die.%E2%80%9D+Here+are+parties+covenanting%2C+and+agreeing+upon+terms%2C+viz.+God+and+Adam%3A+Here+are+also+terms+agreed+upon+and+matters+covenanted+reciprocally+by+these+parties%3B+Adam+on+his+part+was+to+be+obedient+to+God%2C+in+forbearing+to+Eat+of+the+Tree+of+Knowledge+only%3A+God+on+his+part%2C+for+present%2C+permits+Adam+to+eat+of+all+other+Trees+of+the+Garden%3B+And+for+future+%28in+his+explicit+threatening+of+death+in+case+of+disobedience%2C%29+implicitly+promises+life+in+case+of+obedience+herein.+Now+where+there+are+parties+covenanting+and+agreeing+upon+terms%3A+And+terms+mutually+agreed+upon+by+those+parties%2C+as+here%3B+there%E2%80%99s+the+substance+of+an+express+covenant%2C+though+it+be+not+formally+and+in+express+words+called+a+covenant.%E2%80%9D%0A%0A%E2%80%94+Francis+Roberts%2C+The+Mystery+And+Marrow+Of+The+Bible+%28London%2C+1657%29%2C+19%E2%80%9321+%5BSpelling+and+punctuation+modernized%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47aa6c917c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47aa6c917c.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/roberts-god-made-an-implicit-covenant-of-works-with-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>God intended a Law-dispensation but for a time. 2. Adam, how he was ordained for a Law-life. 3. How predestinated to glory in Christ, how not. 4. That the heathens have no more universal grace than devils. 5. No ground for such grace. It is apparent that God intended not a Law-dispensation in paradise to stand for ever. For nothing is spoken of Adam, after the fall, but of his procreating of children, of the patriarchs, of Adam’s dying and of his acts before the fall, the place of paradise being scarce well known, which says the Lord had a farther design to lay aside the transient Law-dispensation and to set up Christ. The Lord, of purpose, gave a positive Law, forbidding eating of such a tree, added a threatening thereunto particularly, suffered the serpent to tempt, and foresaw what frail nature would do, that he might deal with man, in a dispensation of free grace. Object. Did not God ordain that Adam should have life and righteousness, if he should continue in obedience. Answ. That was a decree conditional of things, (“the man that does these things shall live”) and shows the equity and holiness of the Law, but it was not a decree of persons, by which God predestinated Adam to a Law-glory, as the end, and to Law-obedience as the effectual means leading to that end. Q. Was not Adam chosen? Ans. Adam, according to the Lord’s design, finaliter and objective (finally and objectively) was created in the state of predestination to glory and grace in Christ, as touching [his] person, but according to his inherent condition, he was created in a legal dispensation, which was a gracious inlet to Christ; And according to his Law-state as he represented all mankind, he was created as a lubric [slippery] and frail copy of weak nature. Many who are such as are not chosen are created and live under a covenant of works, having only some concomitant favors of the Gospel, as the preaching thereof. 2. Common grace, inward warnings. 3. Protections of providence and forbearance, in regard they are mixed with the elect. The heathen cannot be said to have any inward calling to grace and glory, because there be some remnants of the image of God left in them, which no more can be called universal grace, then the same sparkles that are left in devils can be called Gospel grace, for they believe, “There is one God and confess the Son of God,” (Jam. 2:19; Luk. 4:34. Mark 1:24). Only if this be called grace, that the nature of man is so capable of Gospel mercy, and the nature of the fallen angels morally not so. 2. The offer is made to them of Christ; not so to devils, we shall not contend. Reason may seem to say that all should have a share of Gospel-grace, but it may be replied to reason, why should it seem to be a part of the goodness and bounty of God to will and desire all and every one to be saved, and not to institute such a dispensation, as all and every one should actually be saved? 2. How should that stand, (“he has mercy on whom he will”) if free-will of the creature absolutely dispose of salvation and damnation? 3. How is it that the calling, adoption, and the offer of mercy is restricted to few, and was confined to the Jews only of old? But we are more ready to call the Lord to a reckoning, for his dispensation of grace to others, then to use our own, as becomes us. 2. We cannot judge aright of God and of his goodness, except he be God our very way. 3. It is a matter of no small difficulty to make right use of the Lord’s freedom of grace, and for clay humbly to adore Sovereignty, and not to stumble at the highness of his ways, who, in these points, has ways and thoughts above ours, “as the heavens are above the earth” (Isa. 55).</p></blockquote>

esented+all+mankind%2C+he+was+created+as+a+lubric+%5Bslippery%5D+and+frail+copy+of+weak+nature.+Many+who+are+such+as+are+not+chosen+are+created+and+live+under+a+covenant+of+works%2C+having+only+some+concomitant+favors+of+the+Gospel%2C+as+the+preaching+thereof.+2.+Common+grace%2C+inward+warnings.+3.+Protections+of+providence+and+forbearance%2C+in+regard+they+are+mixed+with+the+elect.+The+heathen+cannot+be+said+to+have+any+inward+calling+to+grace+and+glory%2C+because+there+be+some+remnants+of+the+image+of+God+left+in+them%2C+which+no+more+can+be+called+universal+grace%2C+then+the+same+sparkles+that+are+left+in+devils+can+be+called+Gospel+grace%2C+for+they+believe%2C+%E2%80%9CThere+is+one+God+and+confess+the+Son+of+God%2C%E2%80%9D+%28Jam.+2%3A19%3B+Luk.+4%3A34.+Mark+1%3A24%29.+Only+if+this+be+called+grace%2C+that+the+nature+of+man+is+so+capable+of+Gospel+mercy%2C+and+the+nature+of+the+fallen+angels+morally+not+so.+2.+The+offer+is+made+to+them+of+Christ%3B+not+so+to+devils%2C+we+shall+not+contend.+Reason+may+seem+to+say+that+all+should+have+a+share+of+Gospel-grace%2C+but+it+may+be+replied+to+reason%2C+why+should+it+seem+to+be+a+part+of+the+goodness+and+bounty+of+God+to+will+and+desire+all+and+every+one+to+be+saved%2C+and+not+to+institute+such+a+dispensation%2C+as+all+and+every+one+should+actually+be+saved%3F+2.+How+should+that+stand%2C+%28%E2%80%9Che+has+mercy+on+whom+he+will%E2%80%9D%29+if+free-will+of+the+creature+absolutely+dispose+of+salvation+and+damnation%3F+3.+How+is+it+that+the+calling%2C+adoption%2C+and+the+offer+of+mercy+is+restricted+to+few%2C+and+was+confined+to+the+Jews+only+of+old%3F+But+we+are+more+ready+to+call+the+Lord+to+a+reckoning%2C+for+his+dispensation+of+grace+to+others%2C+then+to+use+our+own%2C+as+becomes+us.+2.+We+cannot+judge+aright+of+God+and+of+his+goodness%2C+except+he+be+God+our+very+way.+3.+It+is+a+matter+of+no+small+difficulty+to+make+right+use+of+the+Lord%E2%80%99s+freedom+of+grace%2C+and+for+clay+humbly+to+adore+Sovereignty%2C+and+not+to+stumble+at+the+highness+of+his+ways%2C+who%2C+in+these+points%2C+has+ways+and+thoughts+above+ours%2C+%E2%80%9Cas+the+heavens+are+above+the+earth%E2%80%9D+%28Isa.+55%29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+%28Edinburgh%2C+1654%29%2C+13%E2%80%9315+%5BSpelling+and+punctuation+modernized%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff29b709d88.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f29b709d88.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/rutherford-adam-was-in-a-temporary-legal-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Jer. chap. 31:31 Behold, the days come, says the Lord, that I will make a new covenant with the house of Israel, with the house of Judah, 32 Not according to the covenant that I made with their fathers, when I took them by the hand to bring them out of the land of Egypt, the which my covenant they broke, although I was a husband unto them, says the Lord. 33 But this shall be the covenant that I will make with the house of Israel, After those days, says the Lord, I will put my Law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people. 34 And they shall teach no more every man his neighbor, and every man his brother, saying, ‘Know the Lord:’ for they shall all know me from the least of them to the greatest of them, says the Lord: for I will forgive their iniquity, and will remember their sins no more. What follows to be spoken of? The covenant of grace. Seeing by the covenant of works life everlasting is propounded, what need is there that the covenant of grace should be set before us? Because, as has been said, the covenant of works cannot through the infirmity of our flesh give life to any: And therefore if God should justify any by it, he should be unjust, as one that should give the kingdom of heaven to wicked men. Seeing the nature of a covenant is to reconcile and join those together which are at variance; as we see in the example of Abraham, and Abimelech, Laban and Jacob: why is this called the covenant that can make no reconciliation between God and us? Although it be not able to reconcile us, yet it does make way to reconciliation by another covenant: neither is it meet strictly to bind God’s covenant with men, to the laws or covenants of one man with another; for among men the weaker seeks reconciliation at the hand of the mightier: but God neither able to be hurt or benefited by us, seeks unto us for peace. What is the covenant of grace? That God will give us life everlasting through Christ, if we believe in him. How are they convinced by the giving of this covenant, which seek righteousness in the law or old covenant? Because thereby they make God unwise, that would enter into a new and second covenant, if the former had been sufficient. Of how many sorts is this? It is either the old or new Testament. What is the old Testament? It is the covenant of God, under shadows to give life everlasting by faith in Christ that was to come. What is the new Testament? It is the covenant of God, without shadows to give life everlasting by faith in Christ that is come. Are these Testaments divers? They be in substance the same, but in manner they differ. What are the parts of this covenant of God? Two: the one is the covenant that God makes with us; the other is the covenant that we make with God. What is the sum of that covenant God makes with us.? That he will be our God.</p></blockquote>

<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>

<blockquote><p>A sacrament, is an outward sign, which God joins to his covenant, which he hath made with men. And that is either of an eternal, or temporal covenant. A sacrament of an eternal covenant, is a sacrament, whereby God confirms the promise of eternal life. And that is either of the covenant of works, or of the covenant of grace. The sacrament of the covenant of works, is a sacrament, which God gave our first parents in the state of their first integrity. And that was twofold: the tree of life, and the tree of the knowledge of good and evil. The tree of life was a sacrament of the covenant of works, whereby that life was signified, which man should have lived, if he had stood in the obedience of God. Gen. 2. 9. The tree of the knowledge of good and evil, was a sacrament by which was signified to man, in how good estate he was while he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2. 17 &amp; 3. 7. 8. 9. 10. 11.</p></blockquote>

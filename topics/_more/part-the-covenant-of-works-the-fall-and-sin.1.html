<blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall. II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise. III. They had a double use. 1. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy. IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification. V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event. VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall. II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise. III. They had a double use. 1. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy. IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification. V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event. VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….”

— Johannes Wollebius, Compendium of Christian Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+God+made+a+double+covenant+with+man%2C+the+one+of+works+and+the+other+of+grace%3B+the+former+before%2C+the+latter+after+the+fall.+II.+The+covenant+of+works+was+confirmed+by+a+double+sacrament%2C+to+wit%2C+the+Tree+of+Life%2C+and+the+tree+of+the+knowledge+of+good+and+evil+both+being+planted+in+the+midst+of+paradise.+III.+They+had+a+double+use.+1.+That+man%E2%80%99s+obedience+might+be+tried%2C+by+using+of+the+one%2C+and+abstaining+from+the+other.+2.+That+the+Tree+of+Life+might+ratify+eternal+happiness+to+those+that+should+obey%2C+but+the+Tree+of+Knowledge+should+signify+to+the+disobedient%2C+the+loss+of+the+greatest+happiness+and+the+possession+of+the+greatest+mercy.+IV.+Therefore+the+Tree+of+Life+was+so+called%2C+not+from+any+innate+faculty+it+had+to+give+life%2C+but+from+a+sacramental+signification.+V.+Likewise+the+Tree+of+Knowledge+of+good+and+evil%2C+had+this+denomination+from+signifying+the+chief+good+and+evil+and+from+the+event.+VI.+The+happiness+of+man+being+yet+in+his+integrity%2C+consisted+chiefly+in+the+image+of+God.+%E2%80%A6XIV.+Man+even+in+respect+of+his+body+was+immortal%2C+but+not+simply%2C+as+though+his+body+being+composed+of+the+elements+could+not+be+resolved+into+its+principles%2C+but+by+Divine+Covenant%3B+not+as+thought+it+could+not+die%2C+but+because+it+had+a+possibility+not+to+die%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c2bdfc123.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c2bdfc123.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/01/sacraments-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

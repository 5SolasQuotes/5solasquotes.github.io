</figure><figure class="quote" id="q-13a7af71bc" data-kw="">
<blockquote><p>Providence is a word which, in its proper signification, may seem to comprehend all the actions of God that outwardly are of him, that have any respect unto his creatures, all his works that are not ad intra, essentially belonging unto the Deity.

Now, because God “worketh all things according to his decree, or the counsel of his will,” Eph. i. 11, for whatsoever he doth now it pleased him from the beginning, Ps. cxv. 3; seeing, also, that known unto God are all his works from eternity; therefore, three things concerning his providence are considerable:—

1. His decree or purpose, whereby he hath disposed of all things in order, and appointed them for certain ends, which he hath fore-ordained. 2. His prescience, whereby he certainly fore-knoweth all things that shall come to pass. 3. His temporal operation, or working in time, — “My Father worketh hitherto,” John v. 17, — whereby he actually executeth all his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΘΕΟΜΑΧΙΑ ΑΥΤΕΞΟΥΣΙΑΣΤΙΚΗ</cite>, or, A display of Arminianism: being a discovery of the old Pelagian idol free-will, with the new goddess contingency (1643) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1967), 10: 31.</span></figcaption>

71bc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/27/john-owen-on-providence-and-the-ad-intra-ad-extra-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>God condescends to speak after the manner of men that we may understand him: and here we are not to think that God wants anything needful to him; he is God blessed for ever; or that he labours under any defect of power that he cannot accomplish what he would have, nor that he is capable of any uneasiness or desire of what he has not. To admit of any of those which commonly are found in men when they wish, were to blaspheme the Lord.</p></blockquote>

<blockquote><p>But God is so completely simple in His essence that not even by a plausible thought experiment can any composition be attributed to Him: not of material and form, not of parts, not of essence and being, nor of subject and accidents. Because whatever exists in God is God.</p></blockquote>

<blockquote><p>[Y]et lo when death comes to end our work, when she stretcheth out her arms to pull us into the port, when after so many dangerous passages, and loathsome lodgings she would conduct us to our true home and resting place: instead of rejoicing at the end of our labour, of taking comfort at the sight of our land, of singing at the approach of our happy mansion, we would fain (who would believe it?) retake our work in hand, we would again hoist sail to the wind, and willingly undertake our journey anew.

<blockquote><p>Forasmuch then as our turning away from God is our own act, and this is evil will; but our turning to God is not possible, except He rouses and helps us, and this is good will, — what have we that we have not received? But if we received, why do we glory as if we had not received? Therefore, as “he that glorieth must glory in the Lord,” it comes from His mercy, not their merit, that God wills to impart this to some, but from His truth that He wills not to impart it to others.

For to sinners punishment is justly due, because “the Lord God loveth mercy and truth,” and “mercy and truth are met together;” and “all the paths of the Lord are mercy and truth.” And who can tell the numberless instances in which Holy Scripture combines these two attributes? Sometimes, by a change in the terms, grace is put for mercy, as in the passage, “We beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.” Sometimes also judgment occurs instead of truth, as in the passage, “I will sing of mercy and judgment unto Thee, O Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.31 in Nicene and Post-Nicene Fathers 1, 5: 56-57.</span></figcaption>

ank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7540edc2ed" data-kw="">
<blockquote><p>The first Doubt is, What kind of act in God forgiveness of sin is? Whether it be an immanent act in-dwelling and abiding in God, or transient, working some real effect and change upon the creature.

Now in handling of this, I shall not trouble you with that perplex Question so much vexed by the Schoolmen, Whether a transient action be in the Agent, or in the Patient, but lay down some differences between an immanent action, and a transient action; only you must take notice that we are in mere darkness, and not able to comprehend how God is said to act or work.

For on the one side, we must not hold that there are any accidents in God; or that he can be a subject recipient of such, because of his most pure and simple Essence; so that whatsoever is in God is God. And yet on the other side, the Scripture doth represent God doing and working such mercies and judgements as seemeth good to him. …

Let us come to give the differences between an immanent action, and a transient, and then we may easily see, which of these two Justification or Remission of sin is.

The first and proper difference is this, An immanent action is that which abides in God, so that it works no real effect without: As when God doth merely know or understand a thing; but a transient action, is when a positive change is made thereby in a creature, as in Creation, &amp;c. So that we may conclude of all Gods actions, which do relate to believers, only predestination is an immanent act of God, and all the rest, Justification, Regeneration, Glorification, are transient acts: for Predestination though it be an act of God choosing such an one to happiness, yet it doth not work any real change or positive effect in a man, unless we understand it virtually, for it is the cause of all those transient actions that are wrought in time. Howsoever therefore Justification be called by some an immanent action, and so made to go before Faith and Repentance as if Faith were only a declaration and sign of pardon of sin from all eternity, yet that cannot be made good, as is to be shewed.

A second difference floweth from the other, An immanent action is from eternity, and the same with God’s essence, but a transient action is the same with the effect produced. Hence the Orthodox maintain, That God’s decrees are the same with his nature. Hence when we speak of God’s willing such a thing, it is no more then his divine Essence, with an habitude and respect to such objects; God’s Decrees are no more then God decreeing, God’s will no more then God willing: otherwise the simplicity of God’s nature will be overthrown, and those volitions of God will be created entities, and so must be created by other new volitions, and so in infinitum, as Spanheimius well argueth, only the later part seemeth not to be strong or sufficient, because when man willeth, he doth not will that by a new volition, and so in infinitum, and why then would such a thing follow in God?

Besides it’s no such absurdity in the actings of the soul, to hold a progress in infinitum, thus far, that it doth not determinately pitch or end at such an act. It is one thing to have things distinguished in God, and another thing for us to conceive distinctly of them. The former is false: The latter is true and necessary. But with transient actions it is otherwise, they being the same with the effects produced, are in time; And this is a perpetual mistake in the Antinomian, to confound Gods Decree and Purpose to justify, with Justification, God’s immanent action from all eternity, with that transient, which is done in time. Whereas if they should do thus in matters of Sanctification and Glorification, it would be absurd to every man’s experience, whereas indeed a man may as truly say, That his body is glorified from all eternity, as that his sins are forgiven from all eternity. And certainly Scripture speaks for one as well as the other, when it saith, Whom he hath justified, them he hath glorified.

By these two differences, you may see, That pardon of sin is a transient action, and so Justification also, partly, because it leaveth a positive, real effect upon a man justified; he that was in the state of hatred, is hereby in a state of love and friendship, he hath peace with God now, that once was at variance with him. Now when we say, There is a change made in a man by Justification, it is not meant of an inward, absolute and physical one, such as is in Sanctification, when of unholy we are made holy, but moral and relative; as when one is made a Magistrate, or husband and wife: partly, because this is done to us in time, whereas immanent actions were from all eternity, and therefore it would be absurd to pray for them, as it is ridiculous for a man to pray he may be predestinated or elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 164-65, 166-67.</span></figcaption>

A+for+Predestination+though+it+be+an+act+of+God+choosing+such+an+one+to+happiness%2C+yet+it+doth+not+work+any+real+change+or+positive+effect+in+a+man%2C+unless+we+understand+it+virtually%2C+for+it+is+the+cause+of+all+those+transient+actions+that+are+wrought+in+time.+Howsoever+therefore+Justification+be+called+by+some+an+immanent+action%2C+and+so+made+to+go+before+Faith+and+Repentance+as+if+Faith+were+only+a+declaration+and+sign+of+pardon+of+sin+from+all+eternity%2C+yet+that+cannot+be+made+good%2C+as+is+to+be+shewed.%0A%0AA+second+difference+floweth+from+the+other%2C+An+immanent+action+is+from+eternity%2C+and+the+same+with+God%E2%80%99s+essence%2C+but+a+transient+action+is+the+same+with+the+effect+produced.+Hence+the+Orthodox+maintain%2C+That+God%E2%80%99s+decrees+are+the+same+with+his+nature.+Hence+when+we+speak+of+God%E2%80%99s+willing+such+a+thing%2C+it+is+no+more+then+his+divine+Essence%2C+with+an+habitude+and+respect+to+such+objects%3B+God%E2%80%99s+Decrees+are+no+more+then+God+decreeing%2C+God%E2%80%99s+will+no+more+then+God+willing%3A+otherwise+the+simplicity+of+God%E2%80%99s+nature+will+be+overthrown%2C+and+those+volitions+of+God+will+be+created+entities%2C+and+so+must+be+created+by+other+new+volitions%2C+and+so+in+infinitum%2C+as+Spanheimius+well+argueth%2C+only+the+later+part+seemeth+not+to+be+strong+or+sufficient%2C+because+when+man+willeth%2C+he+doth+not+will+that+by+a+new+volition%2C+and+so+in+infinitum%2C+and+why+then+would+such+a+thing+follow+in+God%3F%0A%0ABesides+it%E2%80%99s+no+such+absurdity+in+the+actings+of+the+soul%2C+to+hold+a+progress+in+infinitum%2C+thus+far%2C+that+it+doth+not+determinately+pitch+or+end+at+such+an+act.+It+is+one+thing+to+have+things+distinguished+in+God%2C+and+another+thing+for+us+to+conceive+distinctly+of+them.+The+former+is+false%3A+The+latter+is+true+and+necessary.+But+with+transient+actions+it+is+otherwise%2C+they+being+the+same+with+the+effects+produced%2C+are+in+time%3B+And+this+is+a+perpetual+mistake+in+the+Antinomian%2C+to+confound+Gods+Decree+and+Purpose+to+justify%2C+with+Justification%2C+God%E2%80%99s+immanent+action+from+all+eternity%2C+with+that+transient%2C+which+is+done+in+time.+Whereas+if+they+should+do+thus+in+matters+of+Sanctification+and+Glorification%2C+it+would+be+absurd+to+every+man%E2%80%99s+experience%2C+whereas+indeed+a+man+may+as+truly+say%2C+That+his+body+is+glorified+from+all+eternity%2C+as+that+his+sins+are+forgiven+from+all+eternity.+And+certainly+Scripture+speaks+for+one+as+well+as+the+other%2C+when+it+saith%2C+Whom+he+hath+justified%2C+them+he+hath+glorified.%0A%0ABy+these+two+differences%2C+you+may+see%2C+That+pardon+of+sin+is+a+transient+action%2C+and+so+Justification+also%2C+partly%2C+because+it+leaveth+a+positive%2C+real+effect+upon+a+man+justified%3B+he+that+was+in+the+state+of+hatred%2C+is+hereby+in+a+state+of+love+and+friendship%2C+he+hath+peace+with+God+now%2C+that+once+was+at+variance+with+him.+Now+when+we+say%2C+There+is+a+change+made+in+a+man+by+Justification%2C+it+is+not+meant+of+an+inward%2C+absolute+and+physical+one%2C+such+as+is+in+Sanctification%2C+when+of+unholy+we+are+made+holy%2C+but+moral+and+relative%3B+as+when+one+is+made+a+Magistrate%2C+or+husband+and+wife%3A+partly%2C+because+this+is+done+to+us+in+time%2C+whereas+immanent+actions+were+from+all+eternity%2C+and+therefore+it+would+be+absurd+to+pray+for+them%2C+as+it+is+ridiculous+for+a+man+to+pray+he+may+be+predestinated+or+elected.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+true+doctrine+of+justification+asserted+and+vindicated%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially+Antinomians+in+XXX+lectures+preached+at+Lawrence-Jury%2C+London%2C+%282nd+edn%2C+London%3A+Tho.+Underhill%2C+1651%29%2C+pp+164-65%2C+166-67.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7540edc2ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7540edc2ed.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/30/anthony-burgess-on-the-distinction-between-immanent-and-transient-actions/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>For, from everlasting, nothing was extant to cause them of things possible to become future, but God himself: and in God himself, nothing can be imagined to be the cause hereof, but the will of God. This is the insoluble demonstration that cuts the throat of Scientia media, whereupon the Jesuits and Arminians, and all that oppose the absoluteness of God’s proceedings, do, and must rely; either wittingly or unwittingly, and whether they will or no; unless they will directly turn Atheists, and with Cicero deny that God fore-knows things that are to come.</p></blockquote>

</figure><figure class="quote" id="q-05a9db4dae" data-kw="">
<blockquote><p>A threefold love of God is commonly held; or rather there are three degrees of one and the same love. First, there is the love of benevolence by which God willed good to the creature from eternity; second, the love of beneficence by which he does good to the creature in time according to his good will; third, the love of complacency by which he delights himself in the creature on account of the rays of his image seen in them. The two former precede every act of the creature; the latter follows (not as an effect its cause, but as a consequent its antecedent).

By the love of benevolence, he loved us before we were; by the love of beneficence, he loves us as we are; and by the love of complacency, he loves us when we are (viz., renewed after his image). By the first he elects us; by the second, he redeems and sanctifies us; but by the third he gratuitously rewards us as holy and just. John 3:16 refers to the first; Ephesians 5:25 and Revelation 1:5 to the second; Isaiah 62:3 and Hebrews 11:6 to the third.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.20.5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

<blockquote><p>You cannot therefore attribute to God the cause of any human fault. For of all human offences, the cause is pride. For the conviction and removal of this a great remedy comes from heaven. God in mercy humbles Himself, descends from above, and displays to man, lifted up by pride, pure and manifest grace in very manhood, which He took upon Himself out of vast love for those who partake of it.

For, not even did even this One, so conjoined to the Word of God that by that conjunction he became at once the one Son of God and the same One the one Son of man, act by the antecedent merits of His own will. It behoved Him, without doubt, to be one; had there been two, or three, or more, if this could have been done, it would not have come from the pure and simple gift of God, but from man’s free will and choice.</p></blockquote>

</figure><figure class="quote" id="q-33ba5f5288" data-kw="">
<blockquote><p>It is well cleared by the Schoolmen, That those relations which are attributed to God in time, as a Creator, Father, or Lord, are not because of any new thing in God, but in respect of the creatures; so that when the world is created, when a man is justified, we say, God who was not a Creator before, is a Creator, who was not a Father by grace, is now by grace; not because any new accident is in him, but because there is a new effect in the creatures. Thus, if a man once the child of wrath, be now a son of God’s love, the change is not in God, but in the creature.

For the better clearing of this, we are to take notice in the fourth place, That it is one thing, as Aquinas observeth, Mutare voluntatem, to change the Will; and another thing, Velle mutationem, to Will a change. By the same unchangeable Will, we may Will several changes in an Object. As the Physician without any change of his Will, may will his Patient to take one kind of Physick one day, and another the third: here he wills a change, but doth not change his Will. Thus God with the same Will, decreed to permit in time such an elect man to be in a state of sin, under the power of Satan, and afterwards to call him out of this condition, to justify his person; here indeed is a great change made in the man, but none at all in God.

There is no new act in God, which was not from all Eternity, though every effect of this love of God was not from Eternity, but in time. Hence when our Divines argue against Arminians, That if the Saints should apostatize, God’s love would be changeable, it is meant of God’s love of Election, which is an absolute purpose and efficacious will to bring such a man to glory: now although such a decree was free, and so might not have been; yet ex hypothesi, supposing God hath made this decree, it doth very truly follow, That if that Saint should not be brought to glory, God would be changeable.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is well cleared by the Schoolmen, That those relations which are attributed to God in time, as a Creator, Father, or Lord, are not because of any new thing in God, but in respect of the creatures; so that when the world is created, when a man is justified, we say, God who was not a Creator before, is a Creator, who was not a Father by grace, is now by grace; not because any new accident is in him, but because there is a new effect in the creatures. Thus, if a man once the child of wrath, be now a son of God’s love, the change is not in God, but in the creature.

For the better clearing of this, we are to take notice in the fourth place, That it is one thing, as Aquinas observeth, Mutare voluntatem, to change the Will; and another thing, Velle mutationem, to Will a change. By the same unchangeable Will, we may Will several changes in an Object. As the Physician without any change of his Will, may will his Patient to take one kind of Physick one day, and another the third: here he wills a change, but doth not change his Will. Thus God with the same Will, decreed to permit in time such an elect man to be in a state of sin, under the power of Satan, and afterwards to call him out of this condition, to justify his person; here indeed is a great change made in the man, but none at all in God.

There is no new act in God, which was not from all Eternity, though every effect of this love of God was not from Eternity, but in time. Hence when our Divines argue against Arminians, That if the Saints should apostatize, God’s love would be changeable, it is meant of God’s love of Election, which is an absolute purpose and efficacious will to bring such a man to glory: now although such a decree was free, and so might not have been; yet ex hypothesi, supposing God hath made this decree, it doth very truly follow, That if that Saint should not be brought to glory, God would be changeable.”

— Anthony Burgess, The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London, (2nd edn, London: Tho. Underhill, 1651), p. 192.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+well+cleared+by+the+Schoolmen%2C+That+those+relations+which+are+attributed+to+God+in+time%2C+as+a+Creator%2C+Father%2C+or+Lord%2C+are+not+because+of+any+new+thing+in+God%2C+but+in+respect+of+the+creatures%3B+so+that+when+the+world+is+created%2C+when+a+man+is+justified%2C+we+say%2C+God+who+was+not+a+Creator+before%2C+is+a+Creator%2C+who+was+not+a+Father+by+grace%2C+is+now+by+grace%3B+not+because+any+new+accident+is+in+him%2C+but+because+there+is+a+new+effect+in+the+creatures.+Thus%2C+if+a+man+once+the+child+of+wrath%2C+be+now+a+son+of+God%E2%80%99s+love%2C+the+change+is+not+in+God%2C+but+in+the+creature.%0A%0AFor+the+better+clearing+of+this%2C+we+are+to+take+notice+in+the+fourth+place%2C+That+it+is+one+thing%2C+as+Aquinas+observeth%2C+Mutare+voluntatem%2C+to+change+the+Will%3B+and+another+thing%2C+Velle+mutationem%2C+to+Will+a+change.+By+the+same+unchangeable+Will%2C+we+may+Will+several+changes+in+an+Object.+As+the+Physician+without+any+change+of+his+Will%2C+may+will+his+Patient+to+take+one+kind+of+Physick+one+day%2C+and+another+the+third%3A+here+he+wills+a+change%2C+but+doth+not+change+his+Will.+Thus+God+with+the+same+Will%2C+decreed+to+permit+in+time+such+an+elect+man+to+be+in+a+state+of+sin%2C+under+the+power+of+Satan%2C+and+afterwards+to+call+him+out+of+this+condition%2C+to+justify+his+person%3B+here+indeed+is+a+great+change+made+in+the+man%2C+but+none+at+all+in+God.%0A%0AThere+is+no+new+act+in+God%2C+which+was+not+from+all+Eternity%2C+though+every+effect+of+this+love+of+God+was+not+from+Eternity%2C+but+in+time.+Hence+when+our+Divines+argue+against+Arminians%2C+That+if+the+Saints+should+apostatize%2C+God%E2%80%99s+love+would+ </figure><figure class="quote" id="q-6d5d649a64" data-kw="">
<blockquote><p>When God is said to desire something which does not occur, such as when He states, “O that there were such a heart in them, that they would fear Me, … that it might be well with them, and with their children for ever!” (Deuteronomy 5:29), or, “O that thou hadst hearkened to My commandments! then had thy peace been as a river” (Isaiah 48:18), He is speaking in the manner of men. Strictly speaking, such can never be said concerning the omniscient, omnipotent, immutable, and most perfect God. Rather, it indicates God‟s displeasure toward sin and how He delights in holiness. It indicates that sin is the reason why those blessings are withheld from them — blessings which they, according to His promise, would have received as a reward upon godliness.

The promises are made upon condition of obedience which is granted to the elect according to God‟s immutable purpose. When God says, “Have I any pleasure at all that the wicked should die? saith the Lord God: and not that He should return from His ways, and live?” (Ezekiel 18:23), this does not suggest that God‟s will is impotent. Rather, it indicates that God has no pleasure in the destruction of men, inasmuch as they are His creatures. He has pleasure in the exercise of righteousness and godliness, and in blessing the godly.</p></blockquote>

<blockquote><p>There are three kinds of this love usually ascribed to God. The love of benevolence is that by which God is moved to will some good to his creature as a creature, without any regard to the excellence which may be in it. This kind of love is the same as his goodness, and by it God, from eternity, will good to the creature, even though unworthy, and deserving of hatred.

The love of beneficence is that by which God does good in time; this expression in time must be noted, so that this love may be distinguished from the love of benevolence, which is from eternity. The love of complacency is that by which God is inclined towards the creature that is just and holy. By the first kind of love, God elects us; by the second, he redeems and sanctifies us; by the third, he rewards us being holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 2.5, p. 85.</span></figcaption>

<blockquote><p>It is a work above the reach of men or angels to persuade a soul to come to Christ. There is nothing so difficult or perplexing to flesh and blood as to close with Christ. There is nothing that corrupt nature has such a reluctancy to and prejudice against as this. It requires the mighty power of God to bring folk to subjection to Him, and to bring down the strongholds of sin within them and every vain thought.</p></blockquote>

</figure><figure class="quote" id="q-462cfb8246" data-kw="">
<blockquote><p>Worldly masters will not cast a way their faithful servants, but maintain them as they may, and thinkest thou that God will forsake his servants? Thinkest thou a mortal wretched man to be more loving to thee then the eternal God and merciful father that made thee, feedeth thee, and defendeth thee, when man cannot help thee? yea loveth the better then thou lovest thy self, and stayeth thee from running from him, when thou wouldest willingly seek thine own destruction wilfully.

Stand to him boldly, forsake him not cowardly. Polycarpus, an old man, when he should suffer martyrdom, was advised by some to have pity on his old age, and not so stiffly to stand out. Nay, saith he, I have served my Master Christ these 86. years, and he did me never harm, I will not forsake him now in my last days. Thus Nehemiah stoutly answering them, and boldly encouraging his fellows, goeth forward with the work, contemneth their mocking and false accusations, and falleth to his building again; so must all good builders of God’s house neither be afraid nor weary of scornful mockers, threatenings, accusations or violence, but manfully go forwards to the end, knowing that their God is stronger, wiser, and more willing to defend his people, then his enemies shall be to hurt them.</p></blockquote>

ess.com/2019/08/21/james-durham-on-gods-love-for-us-and-boldness-in-his-cause/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ec775f75de" data-kw="">
<blockquote><p>Some people take shelter in a notion of universal love. They say, ‘God loves everyone, and therefore everything will turn out all right in the end for me.’ But there’s a very solemn verse in the Bible, ‘Jacob have I loved, but Esau have I hated’ (Romans 9:13). I’m not saying that there’s anyone in the room of mercy who should come to the conclusion that God has hated them. Satan may be saying to some anxious soul, ‘There’s no hope for you because God has hated you.’ No one in the room of mercy, no one under the sound of the gospel, no one anxious about their soul, has any reason to come to that conclusion. And may God give grace to resist coming to that conclusion in a way that would prevent a person from seeking the Lord and seeking his mercy.

But what we can say is that you have no reason to believe the Lord has loved you until you’re found embraced in that love in the person of Christ. We cannot take it for granted. We cannot say God loves everyone. ‘I have loved thee’ is something very particular, something very personal, and we cannot rest until it becomes particular and personal to ourselves. The love of God is a very particular, distinguishing, personal thing toward a sinner, so that a person has to make sure they have a reason for believing it with regard to themselves.

And one other thing about this love of God toward the sinner — he says it’s everlasting. It had no beginning. With God, everlasting things have no beginning. God is the everlasting God. ‘From everlasting to everlasting, thou art God’ (Psalm 90: 2). There was no beginning to God. We can’t really grasp that. That’s something beyond our understanding— someone who has no beginning. We can understand in a measure something having no end — we know that that’s true of us. People try to blot out the idea of eternity, the idea of living beyond this world. But anyone who’s heard the gospel — and even anyone who hasn’t — when they listen to the underground noises in their own consciences and souls, they have this feeling — this fear, perhaps, this anxiety — that there’s no end. Yes, there was a beginning, but there’s no end. We can grasp that. But we can’t grasp the concept of ‘no beginning’.

And yet, God had no beginning. And God’s love ‘for thee’ — for the child of God, for the sinner saved by grace — had no beginning either. It wasn’t that there came a time in the experience of God when he began to love — no, God has loved eternally. Everlasting love. And that love is never withdrawn. It has never been removed from its objects. Even when he chastens them, even when he hides himself from them, even when they fear that the Lord has forgotten to be gracious and that he has shut up his tender mercies in his wrath — even then, this love is everlasting, it doesn’t change. It’s never withdrawn from its objects. And it has no end. It’ll never come to an end. Its consequences, its effects, will never come to an end. ‘I have loved thee with an everlasting love.’</p></blockquote>

<blockquote><p>I. The question whereby it is demanded whether God doth equally love all men, and so desire their Salvation, is an addition to the former question, and doth depend on it: For if remission of sins and Salvation are not purchased for all men by the death of Christ, it is plain that all men are not equally loved by God: wherefore these innovators do defend themselves in either question, by the same places of Scripture. …

II. Which before we demonstrate, the reader is to be admonished, that love in God is not an affection, nor passion, nor inclination of the mind, nor any desire; for God is not touched by these passions, as being impassible, and not subject to affections: But as God is said then to be angry or to hate, when he will punish or destroy; so love in God is a certain and sure will of doing good to the creature. Whence it cometh to pass, that he may rightly be said to be loved by God, to whom he hath given or hath decreed to give more and better good things.</p></blockquote>

<blockquote><p>Q. What ought you to believe concerning God, the chief object of divine knowledge?

A. That there is but one God. …

Q. What else do ye believe of God?

A. That he is of a most glorious nature, being an Eternal spirit, infinite in Essence, Knowledge, Goodness, and Power. …

Q. What else doe ye believe of God?

A. That the God-head is distinguished into three persons; the Father, Son, and holy Ghost.</p></blockquote>

<blockquote><p>Whereas the will of God is most simple; therefore, 1. In him there are not either two, or more, or contrary Wills. There are in deed divers distinctions of his Will, as shall be seen in the Doctrine of God’s Decrees: but these distinctions are nominal, rather than real.

2. The primary object of God’s will, is God himself.

3. The will of God is most free.

4. Nothing is done against the Will of God.

5. The Will of God, according to its divers objects hath divers names, to wit, of holiness, goodness, love, grace, mercy, wrath, justice, and such like.</p></blockquote>

<blockquote><p>Everything passes from the condition of what has been towards the condition of becoming, only through the point of being. It is this being that has potentiality. But God has not “been” (in this creaturely sense); therefore He Is from all eternity, and because He will not “become”, He Is to all eternity (Exodus 3:14). Because of this reality, God is the Existence that is uncreated, unlimited, and unchangeable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of God and Spiritual Friendship</cite>, ed. James M. Houston (Basingstoke: Pickering &amp; Inglis, 1983), p. 188.</span></figcaption>

<blockquote><p>For if the wrath of God were a passion, one might well despair as being unable to quench the flame which he had kindled by so many evil doings; but since the Divine nature is passionless, even if He punishes, even if He takes vengeance, he does this not with wrath, but with tender care, and much loving-kindness; wherefore it behoves us to be of much good courage, and to trust in the power of repentance.

For even those who have sinned against Him He is not wont to visit with punishment for His own sake; for no harm can traverse that divine nature; but He acts with a view to our advantage, and to prevent our perverseness becoming worse by our making a practice of despising and neglecting Him.</p></blockquote>

<blockquote><p>It’s a dream, that God loveth sinners with the same love every way, wherewith he loveth his own Son Christ. And why? Because God loveth us only for his own Son, and for nothing in us Ergo, Far more it must follow, it’s a far other, an higher, fountain love, wherewith the Father loveth his own eternal and consubstantial Son, the Mediator between God and man; and that derived love wherewith he loveth us sinners.

As the one is 1. Natural; the latter, free. 2. The love of the Father to the Son, as his consubstantial Son, and so far as it’s essentially included in his love to Jesus Christ Mediator, is not a love founded on grace and free-mercy, which might never have been in God; because essentially, the Father must love his Son Christ, as his Son; and being Mediator, he cannot for that renounce his natural love to him, which is the fundamental cause, why he loveth us for Christ his Son, as Mediator; but the love wherewith the Father loveth us for his Son Christ, is founded on free Grace and mercy; and might possibly never have been in God.

For, 1. as he could not but beget his Son, he could not but love him; nature, not election can have place in either: but it was his Free will to create a man, or not create him. 2. He cannot but love his Son Christ, but God might either have loved neither man nor Angel, so as to chuse them to Salvation, and he might have chosen other Men and Angels, then these whom he hath chosen; God hath no such freedom in loving his own Consubstantial Son.

2. It’s an untruth, that God loveth his chosen ones, as he doth love his Son; that is, with the same degree of love, wherewith he loves his Son; I think that not far from either gross ignorance, or blasphemy. It possibly may be the same love by proportion, with which the Father tendereth the Mediator, or Redeemer, and all his saved and ransomed ones; but in regard of willing good to the creature loved, he neither loveth his redeemed with the same love, wherewith he loveth his Son; except blasphemously we say, God hath as highly exalted all the redeemed, and given to them a name above every name, as he hath done to his own Son; nor doth he so love all his chosen ones, as he conferreth equal grace and glory upon all alike; as if one starre differed not from another star in glory, in the highest heavens.

Our own good works cannot make our Lord love us less or more, with the love of eternal election; but they may make God love us more with the love of complacency, and a sweeter manifestation of God in the fruits and gracious effects of his love. According to that, John 14.23. Jesus said, if a man love me, he will keep my words, and my Father will love him, and we will come unto him, and make our abode with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself</cite>, (London: Andrew Crooke, 1647), I, pp 74-75.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-b940e6d7ca" data-kw="">
<blockquote><p>The Lord’s decree is the first rise of all things that are, or have been, or are to come. This is the first original of them all, to which they must be reduced as their spring and fountain. All of you may understand that there are many things possible, which yet actually will never be. The Lord’s power and omnipotency is of a further extent than his decree and purpose. His power is natural and essential to his being; his decree is of choice, and voluntary. The Father could have sent a legion of angels to have delivered his Son; the Son could have asked them, but neither of them would do it, Matt. xxvi. 53. The Lord could have raised up children to Abraham out of stones, but he would not, Matt. iii. 9.

His power then comprehends within its reach all possible things which do not in their own nature and proper conception imply a contradiction; so that infinite worlds of creatures more perfect than this, – numbers of angels and men above these, – and creatures in glory surpassing them again, – are within the compass of the boundless power and omnipotency of God. But yet for all this it might have fallen out that nothing should actually and really have been, unless his majesty had of his own free will decreed what is, or hath been, or is to be. His will determines his power, and, as it were, puts it in the nearest capacity to act and exercise itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 159.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Lord’s decree is the first rise of all things that are, or have been, or are to come. This is the first original of them all, to which they must be reduced as their spring and fountain. All of you may understand that there are many things possible, which yet actually will never be. The Lord’s power and omnipotency is of a further extent than his decree and purpose. His power is natural and essential to his being; his decree is of choice, and voluntary. The Father could have sent a legion of angels to have delivered his Son; the Son could have asked them, but neither of them would do it, Matt. xxvi. 53. The Lord could have raised up children to Abraham out of stones, but he would not, Matt. iii. 9.

His power then comprehends within its reach all possible things which do not in their own nature and proper conception imply a contradiction; so that infinite worlds of creatures more perfect than this, – numbers of angels and men above these, – and creatures in glory surpassing them again, – are within the compass of the boundless power and omnipotency of God. But yet for all this it might have fallen out that nothing should actually and really have been, unless his majesty had of his own free will decreed what is, or hath been, or is to be. His will determines his power, and, as it were, puts it in the nearest capacity to act and exercise itself.”

— Hugh Binning, The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 159.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lord%E2%80%99s+decree+is+the+first+rise+of+all+things+that+are%2C+or+have+been%2C+or+are+to+come.+This+is+the+first+original+of+them+all%2C+to+which+they+must+be+reduced+as+their+spring+and+fountain.+All+of+you+may+understand+that+there+are+many+things+possible%2C+which+yet+actually+will+never+be.+The+Lord%E2%80%99s+power+and+omnipotency+is+of+a+further+extent+than+his+decree+and+purpose.+His+power+is+natural+and+essential+to+his+being%3B+his+decree+is+of+choice%2C+and+voluntary.+The+Father+could+have+sent+a+legion+of+angels+to+have+delivered+his+Son%3B+the+Son+could+have+asked+them%2C+but+neither+of+them+would+do+it%2C+Matt.+xxvi.+53.+The+Lord+could+have+raised+up+children+to+Abraham+out+of+stones%2C+but+he+would+not%2C+Matt.+iii.+9.%0A%0AHis+power+then+comprehends+within+its+reach+all+possible+things+which+do+not+in+their+own+nature+and+proper+conception+imply+a+contradiction%3B+so+that+infinite+worlds+of+creatures+more+perfect+than+this%2C+%E2%80%93+numbers+of+angels+and+men+above+these%2C+%E2%80%93+and+creatures+in+glory+surpassing+them+again%2C+%E2%80%93+are+within+the+compass+of+the+boundless+power+and+omnipotency+of+God.+But+yet+for+all+this+it+might+have+fallen+out+that+nothing+should+actually+and+really+have+been%2C+unless+his+majesty+had+of+his+own+free+will+decreed+what+is%2C+or+hath+been%2C+or+is+to+be.+His+will+determines+his+power%2C+and%2C+as+it+were%2C+puts+it+in+the+nearest+capacity+to+act+and+exercise+itself.%E2%80%9D%0A%0A%E2%80%94+Hugh+Binning%2C+The+Common+Principles+of+the+Christian+Religion%2C+Clearly+Proved%2C+and+Singularly+Improved.+Or%2C+A+Practical+Catechism%2C+%281672%29+in+The+Works+of+Hugh+Binning%2C+ed.+James+Cochrane+%2 </figure><figure class="quote" id="q-4b46cbd4b1" data-kw="">
<blockquote><p>We must know that the infinite majesty of heaven is not subject to those unquiet passions to which our weak and frail nature is vulnerable. He is not sometimes what He was not before. He is always in Himself the very same. His essence is unchangeable … In His most pure and blessed nature there is a perpetual calm and tranquillity.</p></blockquote>

</figure><figure class="quote" id="q-74c29ba9e9" data-kw="">
<blockquote><p>When any are lost, we do not hesitate to say that they perish by their own deserts, although God could have mercifully saved them, had it pleased him; and when any are saved, we dare not affirm that they deserved to be saved, since God could have justly condemned them, had it pleased him. But why he does not save all, or why he saves some rather than others, it is not necessary to inquire; since, leaving out the reasons of that difference, it is enough to know, that neither mercy supersedes justice, nor justice mercy, before that Being, by whom no one is condemned except through justice, no one is saved except through mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Christian Theology</cite></span></figcaption>

<blockquote><p>All other things were by him [God] brought out of nothing, in consequence of a free act of his will by means of his infinite power; so that they may be justly called mere contingencies, and he is the only necessarily existent being. Nay, he is the only really existent being. … This is likewise implied in the exalted name Jehovah, which expresses his being, and that he has it from himself … This idea of a first and eternal being is again inseparably connected with an infinite degree of all possible perfection, together with immutability, and absolute perseverance therein. … In life manner, if we suppose God to be the first of all beings, we must, unavoidably, therefrom, conclude his unity …</p></blockquote>

<blockquote><p>It gives the love of God the glory of its constancy and unchangeableness. This is another star of an eminent magnitude in the heaven of love. It is not a fading, a wavering, an altering thing, but abides for ever; God “rests in his love,” Zeph. iii. 17. It is a great thing, indeed, to apprehend that the great God should fix his love upon a poor creature, but add hereunto that he may love them one day and hate them the next, embrace them one hour and the next cast them into hell, one day rejoicing over them with joy, another rejoicing to destroy them; as it is dishonourable to God, and derogatory to all his divine excellencies and perfections, so, in particular, it clotheth his love with the most uncomely and undesirable garment that ever was put upon the affections of the meanest worm of the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Perseverance Explained and Confirmed</cite>, (Oxford, 1654) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), xi, 396.</span></figcaption>

</figure><figure class="quote" id="q-41a0e8df08" data-kw="">
<blockquote><p>The belief which human minds share demonstrates that God, the source of all things, is good; for since nothing better than God can be imagined, who can doubt that if something has no better, it is good? Reason in fact establishes that God’s goodness is such as to demonstrate further that perfect good resides within him. Were this not the case, he could not be the source of all things, for there would be something more perfect good, and would be seen to take precedence ahead of him, since all perfect things clearly take precedence over things less complete. So to prevent the argument advancing into infinity, we must allow that the highest God is totally full of the highest and perfect good. Now we have established that the perfect good is true happiness, so true happiness must reside in the highest God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/boethius.html">Boethius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Consolation of Philosophy</cite>, trans. P. G. Walsh (524; Oxford: Oxford University Press, 2000), 3.10.7-10, p. 58.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><figure class="quote" id="q-837104ccfc" data-kw="">
<blockquote><p>1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose. The proper actings of affections lie between these two; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. “He worketh all things after the counsel of his own will.” “Who hath known his mind? or who hath been his counsellor? Of him, and through him, and to him, are all things.”

2. They have their dependence on that wherewith he in whom they are is affected; that is, they owe their rise and continuance to something without him in whom they are. A man’s fear ariseth from that or them of whom he is afraid; by them it is occasioned, on them it depends. Whatever affects any man (that is, the stirring of a suitable affection), in all that frame of mind and soul, in all the volitions and commotions of will which so arise from thence, he depends on something without him. Yea, our being affected with something without lies at the bottom of most of our purposes and resolves. Is it thus with God, with him who is I AM? Exod. iii. 14. Is he independence upon any thing without him? Is it not a most eminent contradiction to speak of God in dependence on any other thing? Must not that thing either be God or be reduced to some other without and besides him, who is God, as the causes of all our affections are? ” God is in one mind, and who can turn him? what his soul desireth, that he doeth,” Job xxiii. 13.

3. Affections are necessarily accompanied with change and mutability; yea, he who is affected properly is really changed; yea, there is no more unworthy change or alteration than that which is accompanied with passion, as is the change that is wrought by the affections ascribed to God. A sedate, quiet, considerate alteration is far less inglorious and unworthy than that which is done in and with passion. Hitherto we have taken God upon his testimony, that he is the “Lord, and he changeth not,” Mai. iii. 6; that “with him there is neither change nor shadow of turning; “-—it seems, like the worms of the earth, he varieth every day.

4. Many of the affections here ascribed to God do eminently denote impotence; which, indeed, on this account, both by Socinians and Arminians, is directly ascribed to the Almighty. They make him affectionately and with commotion of will to desire many things in their own nature not impossible, which yet he cannot accomplish or bring about (of which I have elsewhere spoken); yea, it will appear that the most of the affections ascribed to God by Mr B[iddle]., taken in a proper sense, are such as are actually ineffectual, or commotions through disappointments, upon the account of impotency or defect of power.

Corel. To ascribe affections properly to God is to make him weak, imperfect, dependent, changeable, and impotent.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose. The proper actings of affections lie between these two; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. “He worketh all things after the counsel of his own will.” “Who hath known his mind? or who hath been his counsellor? Of him, and through him, and to him, are all things.”

2. They have their dependence on that wherewith he in whom they are is affected; that is, they owe their rise and continuance to something without him in whom they are. A man’s fear ariseth from that or them of whom he is afraid; by them it is occasioned, on them it depends. Whatever affects any man (that is, the stirring of a suitable affection), in all that frame of mind and soul, in all the volitions and commotions of will which so arise from thence, he depends on something without him. Yea, our being affected with something without lies at the bottom of most of our purposes and resolves. Is it thus with God, with him who is I AM? Exod. iii. 14. Is he independence upon any thing without him? Is it not a most eminent contradiction to speak of God in dependence on any other thing? Must not that thing either be God or be reduced to some other without and besides him, who is God, as the causes of all our affections are? ” God is in one mind, and who can turn him? what his soul desireth, that he doeth,” Job xxiii. 13.

3. Affections are necessarily accompanied with change and mutability; yea, he who is affected properly is really changed; yea, there is no more unworthy change or alteration than that which is accompanied with passion, as is the change that is wrought by the affections ascribed to God. A sedate, quiet, considerate alteration is far less inglorious and unworthy than that which is done in and with passion. Hitherto we have taken God upon his testimony, that he is the “Lord, and he changeth not,” Mai. iii. 6; that “with him there is neither change nor shadow of turning; “-—it seems, like the worms of the earth, he varieth every day.

4. Many of the affections here ascribed to God do eminently denote impotence; which, indeed, on this account, both by Socinians and Arminians, is directly ascribed to the Almighty. They make him affectionately and with commotion of will to desire many things in their own nature not impossible, which yet he cannot accomplish or bring about (of which I have elsewhere spoken); yea, it will appear that the most of the affections ascribed to God by Mr B[iddle]., taken in a proper sense, are such as are actually ineffectual, or commotions through disappointments, upon the account of impotency or defect of power.

Corel. To ascribe affections properly to God is to make him weak, imperfect, dependent, changeable, and impotent.”

— John Owen, Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 109-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Affections%2C+considered+in+themselves%2C+have+always+an+incomplete%2C+imperfect+act+of+the+will+or+volition+joined+with+them.+They+are+something+that+lies+between+the+firm+purpose+of+the+soul+and+the+execution+of+that+purpose.+The+proper+actings+of+affections+lie+between+these+two%3B+that+is%2C+in+an+incomplete%2C+tumultuary+volition.+That+God+is+not+obnoxious+to+such+volitions+and+incomplete+actings+of+the+will%2C+besides+the+general+consideration+of+his+perfections+and+blessedness+premised%2C+is+evident+from+that+manner+of+procedure+which+is+ascribed+to+him.+His+purposes+and+his+works+comprise+all+his+actings.+As+the+Lord+hath+purposed%2C+so+hath+he+done.+%E2%80%9CHe+worketh+all+things+after+the+counsel+of+his+own+will.%E2%80%9D+%E2%80%9CWho+hath+known+his+mind%3F+or+who+hath+been+his+counsellor%3F+Of+him%2C+and+through+him%2C+and+to+him%2C+are+all+things.%E2%80%9D%0A%0A2.+They+have+their+dependence+on+that+wherewith+he+in+whom+they+are+is+affected%3B+that+is%2C+they+owe+their+rise+and+continuance+to+something+without+him+in+whom+they+are.+A+man%E2%80%99s+fear+ariseth+from+that+or+them+of+whom+he+is+afraid%3B+by+them+it+is+occasioned%2C+on+them+it+depends.+Whatever+affects+any+man+%28that+is%2C+the+stirring+of+a+suitable+affection%29%2C+in+all+that+frame+of+mind+and+soul%2C+in+all+the+volitions+and+commotions+of+will+which+so+arise+from+thence%2C+he+depends+on+something+without+him.+Yea%2C+our+being+affected+with+something+without+lies+at+the+bottom+of+most+of+our+purposes+and+resolves.+Is+it+thus+with+God%2C+with+him+who+is+I+AM%3F+Exod.+iii.+14.+Is+he+independence+upon+any+thing+without+him%3F+Is+it+not+a+most+eminent+contradiction+to+speak+of+God+in+dep <blockquote><p>In general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that he is God. He that is not perfect in himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and hath no farther desire for supply. He who is blessed in himself is all-sufficient for himself. If God want or desire any thing for himself, he is neither perfect nor blessed. To ascribe, then, affections to God properly (such as before mentioned), is to deprive him of his perfection and blessedness.</p></blockquote>

<blockquote><p>We usually consider the separation of the attributes as quite a bit different than the distinction of the persons themselves. Indeed, in the distinction of persons, no religious devotion causes us to do anything but form three concepts referred not to some three divines (because the word “divine” denotes the essence common to the three persons), but to three hypostases in that divine, each of which circumscribes and determines our thought.

But in the distinction of attributes, if when we happen to imagine various concepts, it’s the case that according to our mode of conceiving and considering we conceive of the divine properties hardly different than of some powers (and surely Peter calls them αρετας), like they should differ in their nature from the essence, close to like how we understand habits and qualities are different from the very substance of the soul.

But after we’ve grown in this so that we ponder in our hearts that whatever is in God is necessarily God himself (which is God’s absolutely simple nature, utterly devoid of any composition), then we both immediately retract all those concepts into one only, and advance from it such that he is defined by one object without any distinction.</p></blockquote>

<blockquote><p>But let us hear what reasons may be alleged to the Universality of redemption: I. Ezekiel 33. v. 11. As I live saith the Lord, I will not the death of the wicked: but, that the wicked return from his wicked way. Answ. The place is to be understood not simply but in respect; of the twain God rather wills the repentance of the sinner then his death. Again, he wills not death as it is the destruction of his creature; and so this place may be understood: yet nevertheless he wills the same as it is a means of manifestation of his justice: and therefore the prophet Esai saith, that God createth evil.

II. 1. Tim. 2. God would have all men to be saved and come to the acknowledgement of the truth. Ans. The place is meant not of the persons of all particular men, but of the orders and kinds of men. For in the first verse Paul exhorted Timothy that prayer should be made for all men: and in the second verse opening his own meaning, he addeth these words, for kings and all that be in authority: as though he should say, we must pray not only for private men and for the common people, but also for public persons, though they persecute the Gospel. But why? because in that very order God hath his elect which shall be saved. And on this manner Paul expounds himself elsewhere. There is neither Jew nor Grecian: there is neither bond nor free: there is neither male nor female: for ye are all one in Christ.

III. Rom. 11. v. 32. God hath shut up all in unbelief that he might have mercy on all. Ans. The word all, must be understood of all that are to be saved, both of Jews and Gentiles, as the article added to all importeth, and the meaning is, that God will save all whom he purposeth to save of his mercy, and not of their merit, because all are sinners as well Jews as Gentiles: thus Paul expounds himself, Galat. 3.22. The scripture hath concluded all under sin, that the promise by the faith of Jesus Christ should be given to them that believe. And if we should expound the word all, for every particular man, as some would have it, Paul must contradict himself, who said before that God would have mercy on whom he will have mercy, and whom he will he hardeneth, and in this very chapter his drift is to prove the rejection of the Jews, and the calling of the Gentiles.

IV. Joh. 3. 16. God so loved the world that he hath given his only begotten son, that whosoever believeth in him shall not perish but have everlasting life: and Joh. 6.51. I will give my flesh for the life of the world. Answ. By world, we must not understand every particular man in the world, but the Elect among the Jews and Gentiles: for in both these places Christ doth overthwart the conceit of the Jews, which thought that they alone were loved of God, and not the Gentiles. And how this word is to be understood in the new testament, Paul doeth fully declare. Rom. 11. v. 12. If (saith he) the fall of them, that is, the Jews, be the riches of the world, and the diminishing of them the riches of the Gentiles, &amp;c. and v. 15. If the casting away of them be the reconciling of the world, what shall the receiving be but life from the dead. Where by the world, he understands the body of the Gentiles in the last age of the world. And thus he fully declares his own meaning, when he saith to the Corinthians, God was in Christ reconciling the world unto himself.

V. Rom. 14. v. 15. Destroy not him with thy meat for whom Christ dyed. 2. Pet. 2.1. Denying the Lord that bought them, and bring upon themselves swift damnation. Therefore Christ died for them also which are condemned. Answ. The reason is not good. For in these and such like places the scripture speaks of men, not as they are indeed before God, but as they are in appearance and profession, and as they are in the acceptation with men. For so long as a man holds and embraces the Christian faith, so long in the judgement of charity we must esteem him to be one that is redeemed by Christ, though indeed he be not. And this is the meaning of Peter when he saith, that false prophets deny the Lord that bought them.

VI. In the preaching of the gospel grace is freely offered not only to the Elect, but to all men indifferently: and God in offering grace deludes no man: and therefore Christ’s death appertains and belongs to all men indifferently. Answer. The preaching of the Gospel is an ordinance of God appointed for the gathering together and the accomplishment of the number of the elect: and therefore in the ministerial of the word, grace and salvation is offered principally and directly to the elect; and only by consequent to them which are ordained to just damnation: because they are mingled with the elect in the same societies: and because the ministers of God, not knowing his secret counsel, in charity think all to be elect. And though God in offering grace do not confer it to all, yet is there no delusion. For the offering of grace doth not only serve for the conversion of a sinner, but also to be an occasion by men’s fault of blinding the mind and hardening the heart, and of taking away excuse in the day of judgement.

To conclude this point; Universal redemption of all men, we grant: the Scripture saith so: and there is an universality among the elect and believers: but universal Redemption of all and every man as well the damned as the elect and that effectually, wee renounce as having neither footing in the scripture, nor in the writings of any ancient and orthodox divine, for many hundred years after Christ, his words not depraved and mistaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), pp 479-80.</span></figcaption>

II. 1. Tim. 2. God would have all men to be saved and come to the acknowledgement of the truth. Ans. The place is meant not of the persons of all particular men, but of the orders and kinds of men. For in the first verse Paul exhorted Timothy that prayer should be made for all men: and in the second verse opening his own meaning, he addeth these words, for kings and all that be in authority: as though he should say, we must pray not only for private men and for the common people, but also for public persons, though they persecute the Gospel. But why? because in that very order God hath his elect which shall be saved. And on this manner Paul expounds himself elsewhere. There is neither Jew nor Grecian: there is neither bond nor free: there is neither male nor female: for ye are all one in Christ.

III. Rom. 11. v. 32. God hath shut up all in unbelief that he might have mercy on all. Ans. The word all, must be understood of all that are to be saved, both of Jews and Gentiles, as the article added to all importeth, and the meaning is, that God will save all whom he purposeth to save of his mercy, and not of their merit, because all are sinners as well Jews as Gentiles: thus Paul expounds himself, Galat. 3.22. The scripture hath concluded all under sin, that the promise by the faith of Jesus Christ should be given to them that believe. And if we should expound the word all, for every particular man, as some would have it, Paul must contradict himself, who said before that God would have mercy on whom he will have mercy, and whom he will he hardeneth, and in this very chapter his drift is to prove the rejection of the Jews, and the calling of the Gentiles.

IV. Joh. 3. 16. God so loved the world that he hath given his only begotten son, that whosoever believeth in him shall not perish but have everlasting life: and Joh. 6.51. I will give my flesh for the life of the world. Answ. By world, we must not understand every particular man in the world, but the Elect among the Jews and Gentiles: for in both these places Christ doth overthwart the conceit of the Jews, which thought that they alone were loved of God, and not the Gentiles. And how this word is to be understood in the new testament, Paul doeth fully declare. Rom. 11. v. 12. If (saith he) the fall of them, that is, the Jews, be the riches of the world, and the diminishing of them the riches of the Gentiles, &amp;c. and v. 15. If the casting away of them be the reconciling of the world, what shall the receiving be but life from the dead. Where by the world, he understands the body of the Gentiles in the last age of the world. And thus he fully declares his own meaning, when he saith to the Corinthians, God was in Christ reconciling the world unto himself.

V. Rom. 14. v. 15. Destroy not him with thy meat for whom Christ dyed. 2. Pet. 2.1. Denying the Lord that bought them, and bring upon themselves swift damnation. Therefore Christ died for them also which are condemned. Answ. The reason is not good. For in these and such like places the scripture speaks of men, not as they are indeed before God, but as they are in appearance and profession, and as they are in the acceptation with men. For so long as a man holds and embraces the Christian faith, so long in the judgement of charity we must esteem him to be one that is redeemed by Christ, though indeed he be not. And this is the meaning of Peter when he saith, that false prophets deny the Lord that bought them.

VI. In the preaching of the gospel grace is freely offered not only to the Elect, but to all men indifferently: and God in offering grace deludes no man: and therefore Christ’s death appertains and belongs to all men indifferently. Answer. The preaching of the Gospel is an ordinance of God appointed for the gathering together and the accomplishment of the number of the elect: and therefore in the ministerial of the word, grace and salvation is offered principally and directly to the elect; and only by consequent to them which are ordained to just damnation: because they are mingled with the elect in the same societies: and because the ministers of God, not knowing his secret counsel, in charity think all to be elect. And though God in offering grace do not confer it to all, yet is there no delusion. For the offering of grace doth not only serve for the conversion of a sinner, but also to be an occasion by men’s fault of blinding the mind and hardening the heart, and of taking away excuse in the day of judgement.

To conclude this point; Universal redemption of all men, we grant: the Scripture saith so: and there is an universality among the elect and believers: but universal Redemption of all and every man as well the damned as the elect and that effectually, wee renounce as having neither footing in the scripture, nor in the writings of any ancient and orthodox divine, for many hundred years after Christ, his words not depraved and mistaken.”

+he+purposeth+to+save+of+his+mercy%2C+and+not+of+their+merit%2C+because+all+are+sinners+as+well+Jews+as+Gentiles%3A+thus+Paul+expounds+himself%2C+Galat.+3.22.+The+scripture+hath+concluded+all+under+sin%2C+that+the+promise+by+the+faith+of+Jesus+Christ+should+be+given+to+them+that+believe.+And+if+we+should+expound+the+word+all%2C+for+every+particular+man%2C+as+some+would+have+it%2C+Paul+must+contradict+himself%2C+who+said+before+that+God+would+have+mercy+on+whom+he+will+have+mercy%2C+and+whom+he+will+he+hardeneth%2C+and+in+this+very+chapter+his+drift+is+to+prove+the+rejection+of+the+Jews%2C+and+the+calling+of+the+Gentiles.%0A%0AIV.+Joh.+3.+16.+God+so+loved+the+world+that+he+hath+given+his+only+begotten+son%2C+that+whosoever+believeth+in+him+shall+not+perish+but+have+everlasting+life%3A+and+Joh.+6.51.+I+will+give+my+flesh+for+the+life+of+the+world.+Answ.+By+world%2C+we+must+not+understand+every+particular+man+in+the+world%2C+but+the+Elect+among+the+Jews+and+Gentiles%3A+for+in+both+these+places+Christ+doth+overthwart+the+conceit+of+the+Jews%2C+which+thought+that+they+alone+were+loved+of+God%2C+and+not+the+Gentiles.+And+how+this+word+is+to+be+understood+in+the+new+testament%2C+Paul+doeth+fully+declare.+Rom.+11.+v.+12.+If+%28saith+he%29+the+fall+of+them%2C+that+is%2C+the+Jews%2C+be+the+riches+of+the+world%2C+and+the+diminishing+of+them+the+riches+of+the+Gentiles%2C+%26c.+and+v.+15.+If+the+casting+away+of+them+be+the+reconciling+of+the+world%2C+what+shall+the+receiving+be+but+life+from+the+dead.+Where+by+the+world%2C+he+understands+the+body+of+the+Gentiles+in+the+last+age+of+the+world.+And+thus+he+fully+declares+his+own+meaning%2C+when+he+saith+to+the+Corinthians%2C+God+was+in+Christ+reconciling+the+world+unto+himself.%0A%0AV.+Rom.+14.+v.+15.+Destroy+not+him+with+thy+meat+for+whom+Christ+dyed.+2.+Pet.+2.1.+Denying+the+Lord+that+bought+them%2C+and+bring+upon+themselves+swift+damnation.+Therefore+Christ+died+for+them+also+which+are+condemned.+Answ.+The+reason+is+not+good.+Fo <blockquote><p>1 John iv. 16, “God is love,” not only subjectively, infinitely loving; but objectively, wholly lovely. And so he is in the eyes of all who live to his praise. To them the Father is lovely, the Son lovely, the Holy Spirit lovely. Every attribute of God is lovely. The holiness and purity of his nature, the great eye-sore of carnal men, is most lovely to them: Exod. xv. 11, “Who is like unto thee, Lord, glorious in holiness, fearful in praises, doing wonders?” Psalm xxx. 4, “Sing unto the Lord, ye saints of his, and give thanks at the remembrance of his holiness.” His works are lovely. The creation of the world is a lovely work; the guiding of it by providence a lovely work; but the most lovely is the redemption of the world by the blood of Christ.</p></blockquote>

<blockquote><p>God is independent altogether, and self-sufficient. This is his royal prerogative, wherein he infinitely transcends all created perfection. “He is of himself, and for himself,” from no other, and for no other, “but of him, and for him are all things.” He is the fountain-head; you ought to follow the streams up to it, and then to rest: for you can go no further. …

As God’s being is independent, so that he cannot be expressed by any name, more suitable than such as he takes to himself, “I am that I am;” importing a boundless, ineffable, absolute and transcendent being, beside which, no creature deserves so much as to have the name of being, or to be made mention of in one day with his name, because his glorious light makes the poor derived shadow of light in other creatures to disappear, and to evanish out of the world of beings: so it is the glorious perfection of his nature, that he doth all things for himself, for his own name, Prov. Xvi. 4, and his glory is as dear to him, as himself. Isa. xlii. 8, “I am the Lord, that is my name, and therefore my glory will I give to no other …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 9-10.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“God is independent altogether, and self-sufficient. This is his royal prerogative, wherein he infinitely transcends all created perfection. “He is of himself, and for himself,” from no other, and for no other, “but of him, and for him are all things.” He is the fountain-head; you ought to follow the streams up to it, and then to rest: for you can go no further. …

As God’s being is independent, so that he cannot be expressed by any name, more suitable than such as he takes to himself, “I am that I am;” importing a boundless, ineffable, absolute and transcendent being, beside which, no creature deserves so much as to have the name of being, or to be made mention of in one day with his name, because his glorious light makes the poor derived shadow of light in other creatures to disappear, and to evanish out of the world of beings: so it is the glorious perfection of his nature, that he doth all things for himself, for his own name, Prov. Xvi. 4, and his glory is as dear to him, as himself. Isa. xlii. 8, “I am the Lord, that is my name, and therefore my glory will I give to no other …”

<blockquote><p>The doctrine of divine simplicity has fallen on hard times in Reformed circles, which is largely owing to the lack of emphasis placed on this subject in the late 19th and early 20th centuries. One theologian who continued to hold the line on the subject was the Dutch-American theologian, Herman Hoeksema.

In accordance with the Thomistic-Reformed position on divine simplicity, he reminded us that the divine attributes were identical with the simple divine essence, and so identical with one another:

His virtues are … identical with that Essence, so are all His virtues one in Him. For even though we do not and cannot comprehend this simple divine Essence … this does not alter the fact that all God’s virtues are one in Him. Hence, His righteousness is His mercy, His holiness is His grace, His truth is His love. And therefore, this eternal Being, this independent, simple Essence that is called God is also the Immutable, in Whom there is no variableness, neither shadow of turning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, (Grand Rapids: Reformed Free Publishing Association, 1966), p. 36.</span></figcaption>

<blockquote><p>XIV. … The will of saving all men does not overthrow the decree of reprobation of passing by many because it is neither the decretive will, but only the preceptive and approving will; not the universal, which respects all and individuals, but only general, which is indiscriminately extended to any. So they can be called to the marriage by the preceptive will who nevertheless were excluded from eternity by the will of good pleasure. …

XVII. The passages which attribute a desire or wish to God do not immediately prove any ineffectual will in him, but things spoken after the manner of men must be understood in a manner becoming to God, unless we wish to adopt the deliriums of the Anthromorphites. …

XVIII. When God testifies that “he has no pleasure at all in the death of the sinner, but that he should return from his ways, and live” (Ezk. 18:23), this does not favour the inefficacious will or the feeble velleity of God because the word chpts (which occurs there) does not denote desire so much as delight and complacency. Thus God may be said not to delight in the punishment of the wicked inasmuch as it is the destruction of the creature, although he wills it as an exercise of his justice. So he is said to will the repentance of sinners approvingly and preceptively as a thing most pleasing to himself and expressed in his commands, although with respect to all of them he nills it decretively and effectively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.16.14, 17-18.</span></figcaption>

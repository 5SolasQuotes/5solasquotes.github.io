<blockquote><p>But God being a pure Spirit, without any mixture of body or matter, is never weary in his thoughts, purposes, and designs, neither doth he discourse after the manner of men, drawing a conclusion from the Premises, neither doth he think of one thing, and then of another, for there is not in him (I mean in his wisdom and intelligence, no more then in the Eternity of his duration) neither first nor second prius &amp; posterius, but all these thoughts, designs, counsels, and resolutions, are in him but one single and pure act, by which he sees, knows, understands, wills, and ordereth all things; his most pure, and perfect simplicity (which agreeth with so excellent and infinite a Nature) requireth that, and it implies a contradiction, that there should be in his Essence any variableness, or shadow of turning[.]

[W]e do conceive the Essence of God, his virtues, and properties, his wisdom, power, understanding, his will, that is to say, his Counsels, and designs, as by so many images, forms, and distinct conceptions, because that being corporeal, and finite, and he a Spirit, altogether infinite, we cannot see, nor comprehend what God is in himself, but we know well nevertheless, that Gods perfection, and simplicity doth not admit of so many things wholly different one from another; neither doth it imply that they be in his Essence formaliter (as the Schoolmen say) but eminenter, &amp; causaliter, as we hold that the Sun is not in his substance and Essence hot as the fire is, but only as he is the cause of heat every where.

It is then a very low thought of God, to imagine, that he labours in thinking, or designing any thing, or that he wearies himself in acting, and from thence, that he grows melancholy, and sad, and that this troubles his repose, and content, and in some manner abates from his felicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), pp 69-71.</span></figcaption>

</figure><figure class="quote" id="q-3bc4224d2d" data-kw="">
<blockquote><p>I hope I need not caution some in this assembly that they beware of imagining these various perfections of God, under the names of mercy, truth, righteousness and peace, as if they were really distinct and different things in God; or, as if they were really different parties, making a formal consultation, in order, to their agreement; For God is one, and cannot be divided; he is one infinite, eternal and unchangeable Being; there are not distinct and different things in his nature and essence, however his perfections be thus represented to our weak, finite capacities, which cannot understand the perfections of God but in several parts, as it were.

By mercy then, here, we are to understand God himself, as he is a merciful and a gracious God: By truth we are to understand the same God, as he is a true and faithful God: By righteousness we may understand his justice, or God himself, as he is a just and righteous God; and, by peace, the same God, as he is the God of peace, and a God reconciling the world to himself. So that the whole comes to this; it is the great and eternal God himself, consulting with himself, in a manner becoming his infinite and adorable perfections, how to glorify himself in all his glorious attributes in the way of saving sinners in and by Jesus Christ.</p></blockquote>

</figure><figure class="quote" id="q-2dafe2f33a" data-kw="">
<blockquote><p>After the unity of the Godhead asserted, here we have the nature of that one God described; and that by those properties, which the scriptures, that he hath revealed to us, and the reason that he hath implanted in us, attribute and ascribe unto him. Where by properties we are not to understand several faculties, habits, or qualities, as they are in us. For there is nothing in God, but what is God: the mercy of God is the same with the God of mercy; the power of God the same with the God of power; the love of God the same with the God of love; and the truth of God the same with the God of truth.

These properties of mercy, power, love, &amp;.c., as they are in us, they are accidents, and so really distinguished both from our souls, and from one another: but as they are in God, they are his nature and essence; and so neither distinguished from one another, nor from him in whom they are said to be. Distinguished from him or his essence they can- not be, for then he would be of himself imperfect; there being some property or perfection, which in his own nature he is not.

And again, if the properties of God should be really distinguished from himself, in themselves they would be either finite or infinite. Finite they could not all be; for infinitude itself is one of his properties, yea, and in our conception a property of all his other properties; so that his wisdom, power, justice, are all infinite, otherwise they would be imperfect: and therefore it is impossible all his properties, or indeed any of them, should be finite. And as they are not finite, so neither can they be infinite, if really distinguished from his essence: for then there would be something really distinguished from God infinite as well as God; and by consequence either God must not be infinite, and so not God; or else there must be two, yea, many infinites, which is as great an absurdity as the former.

And therefore we must needs acknowledge, that the properties of God are not really distinguished from the essence of God: but that the properties attributed to his essence are really the same with his essence to which they are attributed. So that his power, wisdom, goodness, truth, and the like, are all his essence, nature, or substance. And as they are not distinguished from his essence, so neither are they distinguished from one another; for then they must be really distinguished from his essence too, it being impossible that they should be all really and essentially distinct from one another, and yet be all but one and the self-same essence. And again, if they should be really distinguished from one another, then God would be compounded or made up of several distinct properties, and so not a simple, and therefore not a perfect God.

But by the properties therefore of God, we are to understand the several apprehensions that we have of him, according to the several manifestations that he maketh of himself to us. Which variety of discoveries of himself he maketh to us according to the variety of the objects which we apprehend him to act upon, and the variety of the circumstances that those objects may lie under. God in himself is a most simple and pure act, and therefore, as I have shewed, cannot have any thing in himself but himself, but what is that pure and simple act itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 13-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

— William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 13-15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAfter+the+unity+of+the+Godhead+asserted%2C+here+we+have+the+nature+of+that+one+God+described%3B+and+that+by+those+properties%2C+which+the+scriptures%2C+that+he+hath+revealed+to+us%2C+and+the+reason+that+he+hath+implanted+in+us%2C+attribute+and+ascribe+unto+him.+Where+by+properties+we+are+not+to+understand+several+faculties%2C+habits%2C+or+qualities%2C+as+they+are+in+us.+For+there+is+nothing+in+God%2C+but+what+is+God%3A+the+mercy+of+God+is+the+same+with+the+God+of+mercy%3B+the+power+of+God+the+same+with+the+God+of+power%3B+the+love+of+God+the+same+with+the+God+of+love%3B+and+the+truth+of+God+the+same+with+the+God+of+truth.%0A%0AThese+properties+of+mercy%2C+power%2C+love%2C+%26.c.%2C+as+they+are+in+us%2C+they+are+accidents%2C+and+so+really+distinguished+both+from+our+souls%2C+and+from+one+another%3A+but+as+they+are+in+God%2C+they+are+his+nature+and+essence%3B+and+so+neither+distinguished+from+one+another%2C+nor+from+him+in+whom+they+are+said+to+be.+Distinguished+from+him+or+his+essence+they+can-+not+be%2C+for+then+he+would+be+of+himself+imperfect%3B+there+being+some+property+or+perfection%2C+which+in+his+own+nature+he+is+not.%0A%0AAnd+again%2C+if+the+properties+of+God+should+be+really+distinguished+from+himself%2C+in+themselves+they+would+be+either+finite+or+infinite.+Finite+they+could+not+all+be%3B+for+infinitude+itself+is+one+of+his+properties%2C+yea%2C+and+in+our+conception+a+property+of+all+his+other+properties%3B+so+that+his+wisdom%2C+power%2C+justice%2C+are+all+infinite%2C+otherwise+they+would+be+imperfect%3A+and+therefore+it+is+impossible+all+his+properties%2C+or+indeed+any+of+them%2C+should+be+finite.+And+as+they+are+not+finite%2C+so+neither+can+they+be+infinite%2C+if+really+distinguished+from+his+essence%3A+for+then+there+would+be+something+really+distinguished+from+God+infinite+as+well+as+God%3B+and+by+consequence+either+God+must+not+be+infinite%2C+and+so+not+God%3B+or+else+there+must+be+two%2C+yea%2C+many+infinites%2C+which+is+as+great+an+absurdity+as+the+former.%0A%0AAnd+therefore+we+must+needs+acknowledge%2C+that+the+properties+of+God+are+not+really+distinguished+from+the+essence+of+God%3A+but+that+the+properties+attributed+to+his+essence+are+really+the+same+with+his+essence+to+which+they+are+attributed.+So+that+his+power%2C+wisdom%2C+goodness%2C+truth%2C+and+the+like%2C+are+all+his+essence%2C+nature%2C+or+substance.+And+as+they+are+not+distinguished+from+his+essence%2C+so+neither+are+they+distinguished+from+one+another%3B+for+then+they+must+be+really+distinguished+from+his+essence+too%2C+it+being+impossible+that+they+should+be+all+really+and+essentially+distinct+from+one+another%2C+and+yet+be+all+but+one+and+the+self-same+essence.+And+again%2C+if+they+should+be+really+distinguished+from+one+another%2C+then+God+would+be+compounded+or+made+up+of+several+distinct+properties%2C+and+so+not+a+simple%2C+and+therefore+not+a+perfect+God.%0A%0ABut+by+the+properties+therefore+of+God%2C+we+are+to+understand+the+several+apprehensions+that+we+have+of+him%2C+according+to+the+several+manifestations+that+he+maketh+of+himself+to+us.+Which+variety+of+discoveries+of+himself+he+maketh+to+us+according+to+the+variety+of+the+objects+which+we+apprehend+him+to+act+upon%2C+and+the+variety+of+the+circumstances+that+those+objects+may+lie+under.+God+in+himself+is+a+most+simple+and+pure+act%2C+and+therefore%2C+as+I+have+shewed%2C+cannot+have+any+thing+in+himself+but+himself%2C+but+what+is+that+pure+and+simple+act+itself.%E2%80%9D%0A%0A%E2%80%94+William+Beveridge%2C+Ecclesia+Anglicana+Ecclesia+Catholica%3B+or%2C+The+Doctri <blockquote><p>V. If any Doctrine be contumelious against God, this is, accusing him of folly, putting upon him human affections, &amp; falsely attributing to him wishes of no strength, and a desire of no force: as if they should bring in God speaking us: I do indeed earnestly desire to save you, but ye hinder, that I cannot do what I desire; I would if you would: therefore seeing by you I am frustrated of my intent, I will change my purpose of saving you, and my will being other wise bent, I have determined to destroy you for ever.

It is certainly plain, that this Antecedent will of God, is not a will; but a desire and wish, which God doth obtain only be entreaty, and as much as he may, by man’s good pleasure. Therefore Arminius doth oftentimes call this will, a desire and natural affection, and it is common to these sectaries to take those places, Psal. 81.14. Esa. 48.18. where God is brought in speaking, as one wishing and desiring, and disappointed of his wish, as if they were properly spoken, when these things are spoken by an Anthropopathy, and after the manner of men.</p></blockquote>

<blockquote><p>All the fulness of the Godhead.] That is, not some portion of the Divinity, which the Gentiles had an erroneous persuasion of concerning their false gods; neither excellent endowments of Divine grace and munificence only, which are common to angels, and prophets, and other holy men: but the Lογος itself—true and perfect God, with all his Divine attributes, namely, infinite wisdom, power, goodness, dwells in this human nature of Christ.

And the Apostle seems to allude to the ark of the covenant: for God promised that he would dwell there, hear them from thence, and be propitious to them: and, furthermore, the Apostle intimates, that the ark and the propitiatory, or mercy-seat, were types of Christ, and that the Deity dwelt in a much more excellent way in his human nature, than he did formerly in the tabernacle, concerning which it is written, Exod. xxix. 44, 45, I will sanctify the tabernacle of the testimony, and I will dwell among the children of Israel, &amp;.c.

As, therefore, the Jews, who had an appointed place whence God uttered his oracles, and made known his will, could not, without sin, enquire elsewhere about things pertaining to God; so we, who have the fulness of the Godhead dwelling in the body of Christ, cannot seek either the will of God or our salvation elsewhere, without the greatest folly and impiety.

Hence we learn,

1. As often as seducers endeavour to lead us away from the Gospel and from Christ, to their traditions and inventions, we must seriously reflect what kind of Saviour and Teacher Christ Jesus was; viz. one in whom dwelt all the fulness of the Godhead; and it is the height of madness to require new teachers after him.

2. Whoever, therefore, wanders out of Christ, or mixes any other thing with his doctrine as necessary to salvation, he accuses Christ of imperfection, and denies the fact that all the fulness of the Godhead dwelt in him.

3. This we observe in the Turks and Jews, who are not content with the Gospel doctrine, because they do not believe that all the fulness of the Godhead dwelt in him who proclaimed the Gospel. As to Papists, who, being fascinated with novel and marvellous error, acknowledge that all the fulness of the Godhead is in Christ, yet deny that all the fulness of salvation is contained in his doctrine, I know not what to say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 412-13.</span></figcaption>

<blockquote><p>To take the measures of absolutely perfect happiness at the lowest, it is evident there must be absolutely perfect possession and enjoyment of complete and absolutely perfectly good; that the matter, the possession, and the enjoyment, must all be perfect, and absolutely so, to make out a happiness of this kind: the least remission or abatement in any of these, must produce a proportional diminution of happiness, and bring it down so much below perfection.

It scarcely needs any reflection to assure one, that the matter of this kind of happiness, or what raises and maintains the constant flow of pleasure, satisfaction, and delight, wherein the very nature of happiness lies, must be absolutely perfect in every view; and therefore must be such, as not only doth not admit, but most effectually excludes, every degree and every tendency toward evil, of what kind forever; such as shall furnish out, and actually maintain, in the highest degree, and with infallible certainty, complete finished pleasure, satisfaction, delight, and continue for ever to do so; and, at the same time, support the happy being in the possession and perfect exercise of all possible powers, equal, and always the fame, without decrease, intermission, or end; as nothing can be more evident, than that a failure, the least failure, in any of these, would make a flaw in the enjoyment.

That there must be at the same time an absolutely perfect possession of this fame perfect good, is as evident; and that cannot subsist without the absolute property of it, independent of, and altogether above the reach of, every other being: or, to use the Stoics phrase, The happy being must have it in himself; not in that precarious and loose manner they imagined their wise man possessed of virtue, but that it shall be as essential to, and inseparable from him, as his own being. In one word, himself must be the fund of his own happiness, and in the all-sufficient fullness of his own being, and the unbounded extent of his powers, it must lie.</p></blockquote>

— Robert Riccaltoun, Essays on Human Nature, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 8-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+take+the+measures+of+absolutely+perfect+happiness+at+the+lowest%2C+it+is+evident+there+must+be+absolutely+perfect+possession+and+enjoyment+of+complete+and+absolutely+perfectly+good%3B+that+the+matter%2C+the+possession%2C+and+the+enjoyment%2C+must+all+be+perfect%2C+and+absolutely+so%2C+to+make+out+a+happiness+of+this+kind%3A+the+least+remission+or+abatement+in+any+of+these%2C+must+produce+a+proportional+diminution+of+happiness%2C+and+bring+it+down+so+much+below+perfection.%0A%0AIt+scarcely+needs+any+reflection+to+assure+one%2C+that+the+matter+of+this+kind+of+happiness%2C+or+what+raises+and+maintains+the+constant+flow+of+pleasure%2C+satisfaction%2C+and+delight%2C+wherein+the+very+nature+of+happiness+lies%2C+must+be+absolutely+perfect+in+every+view%3B+and+therefore+must+be+such%2C+as+not+only+doth+not+admit%2C+but+most+effectually+excludes%2C+every+degree+and+every+tendency+toward+evil%2C+of+what+kind+forever%3B+such+as+shall+furnish+out%2C+and+actually+maintain%2C+in+the+highest+degree%2C+and+with+infallible+certainty%2C+complete+finished+pleasure%2C+satisfaction%2C+delight%2C+and+continue+for+ever+to+do+so%3B+and%2C+at+the+same+time%2C+support+the+happy+being+in+the+possession+and+perfect+exercise+of+all+possible+powers%2C+equal%2C+and+always+the+fame%2C+without+decrease%2C+intermission%2C+or+end%3B+as+nothing+can+be+more+evident%2C+than+that+a+failure%2C+the+least+failure%2C+in+any+of+these%2C+would+make+a+flaw+in+the+enjoyment.%0A%0AThat+there+must+be+at+the+same+time+an+absolutely+perfect+possession+of+this+fame+perfect+good%2C+is+as+evident%3B+and+that+cannot+subsist+without+the+absolute+property+of+it%2C+independent+of%2C+and+altogether+above+the+reach+of%2C+every+other+being%3A+or%2C+t </figure><figure class="quote" id="q-6e87035f18" data-kw="">
<blockquote><p>The power of God in its second meaning, δύναμις (dunamis) in Greek, and potentia in Latin, refers to the power and strength of God whereby He is able to execute and accomplish everything which is in agreement with His character and His truth—also to create whatever is conceivable and to do whatever He wishes to do. From stones He is able to raise up children unto Abraham (Matthew 3:9), that is, to create human beings from a lump of clay as He did in the beginning, and make such human beings partakers of both the faith and life of Abraham. God could even create thousands of worlds. In a word, God’s power is unlimited.

One could imagine the creation of many things which would be contrary to the nature and truth of God. One could speculate about imaginary things which bear no resemblance to a creature. To relate this to the omnipotence of God and to ask whether God would be able to perform such things, is to entertain thoughts about God which are void of reverence and godly fear. Whatever is contradictory to the nature and truth of God, as well as contrary to the essential nature of a creature, is no reflection upon the power of God. Far be it from us to attribute this to the omnipotent and holy God. “Far be it from God, that He should do wickedness; and from the Almighty, that He should commit iniquity” (Job 34:10).

God can neither deny Himself (2 Timothy 2:13), nor can He lie or deceive (Titus 1:2). “It was impossible for God to lie” (Hebrews 6:18). Even though God has eternally been capable of creating a world, it does not follow that the world could have existed eternally. “Yes” and “no” are at all times opposites and cannot be simultaneous realities. One and the same body, one and the same man, cannot be simultaneously present at many places which are far removed from each other. These and a thousand-fold more things do not appertain to omnipotence.

Nevertheless, we maintain that God by His omnipotence is able to accomplish whatever He will even beyond what He has willed, as well as whatever He would will. His arm is not shortened and therefore He is called the Almighty. “I am the Almighty God” (Genesis 17:1); “When the Almighty was yet with me” (Job 29:5); “… saith the Lord Almighty” (2 Corinthians 6:18).</p></blockquote>

<blockquote><p>For the first, Thy will, &amp;c. God’s will is only one, considered in it self, as God is one; yet for our understanding, it may be thus distinguished: It is either absolute, or revealed. God’s absolute will, is the will of his good pleasure, whereby according to his eternal counsel, he determines of all things, what shall be done, or what shall not be done, and in what manner. This absolute will extendeth over all creatures, and over all their actions: Ephes. 1. 11. We are predestinate according to the purpose of him that worketh all things after the counsel of his own will. Roman. 9. 19. Who hath resisted his will? Matth. 10. 26. Without this will of God, a sparrow cannot fall to the ground. And this absolute will of God is hidden from us, till God reveal it by the event.

God’s revealed will, is the sacred doctrine of God in his word, whereby he signifieth unto man, so far as concerns his happiness and salvation, what he ought to do, or what he ought not to do. This is not Gods absolute will, but rather an effect thereof concerning man, revealing unto him, not what he simply and absolutely willeth to be done, for that must needs be done; but what is pleasing or displeasing unto him, done by man, and what he will have man to do, or not to do, if he desire to come to life, and would not be condemned. And this revealed will comprehendeth both the Law and the Gospel, with all their commandments, prohibitions, threatenings, exhortations, promises, &amp; such like, whereto the Apostle hath relation, when he saith, Prove what is the good will of God, and acceptable, Rom. 12. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), p. 275.</span></figcaption>

<blockquote><p>The essence of God, is the nature of God, whereby God is indeed, and doth subsist. And that essence is but one: and therefore God is but only one also. There are two parts of the knowledge of the essence of God, the first concerning the attributes of God, the second concerning the distinction of the persons. The attributes of God, are those titles, which are attributed to God, to declare his essence better unto us.

The attributes of God, are either simple, or compared. [1] The simple attributes of God are the essential properties of God, which do agree to him without comparison. Of these some have such a similitude of him, as is in the creatures by creation: some have not. Of the former kind are blessedness, immortality, understanding, prescience, memory, will, goodness, holiness, justice, clemency, long sufferance, patience, constancy, fortitude, truth, faithfulness, and the rest.

The goodness of God is that, by which he hath bene everlastingly contented with him self, not hauing need of any other thing. 1. Tim. 1.11. &amp; 6.15.

The understanding of God, is that by which he hath a perfect understanding of all things, &amp; this is sometimes called the wisdom of God.

The immortality of God, is that by which he never dieth. 1. Tim. 1.17. &amp; 6.16.

The prescience of God, is a most perfect foreknowledge of all things to come.

The memory of God, is that by which he doth most exactly remember all things. Psal. 25.6.7. Esa. 49.16.

The will of God, is that by which he willeth all things. Rom 9.15.22. Eph. 1.5.9.11. And that will is only one, &amp; most simple if we respect God him self, but so far as we respect men, to whom it is either revealed or hid, it is two fold: manifest or secret. The schoolmen do call the former of these, the will of the sign, the other the will of the good pleasure of God. The secret will also in due time appointed by God, is made open and manifest.

The will of God is most free, whereupon also it is called the free will of God. The free will of God, is that self same essence of God, understanding by it self all things immediately and most perfectly, &amp; that most freely, but yet unchangeably and necessarily, willing that which is good only, and abhorring that only which is evil, neither depending of another former beginning, but of it self only. And this alone may properly be called of his own power.

The goodness of God is that by which he is the author of all good things. And he doth exercise this, either generally towards all creatures, or else particularly towards his elect. The former is called beneficence, the later is called mercy. The beneficence of God, is that by which he giveth his gifts to all his creatures. Mat. 5.44.45. Act. 14.17. The mercy of God is that by which God doth good to his elect, although they deserve nothing of him but evil. Esa. 49.10.13. Eph. 2.3.4. Psal. 145.9.

The holiness of God is that by which he doth altogether abhor all impurity &amp; uncleanness Esa. 6.3. Reu. 4.8. Jerem. 3.12.

The justice of God, is that by which he dealeth justly in all things. Psal. 116.11. Rom. 3.4.

The clemency of God, is that by which he doth repress his anger, which is most just, that he might spare us. Exod. 34.5.

The long sufferance of God, is that whereby he doth a long time defer his anger, and punishment against sinners, that he might provoke them to repentance. Exod 34.5.

The patience of God is that by which he suffereth a long time patiently the sins of men, that he might lead them to repentance. Esa. 48.9

The constancy of God, is that by which he performeth most certainly that which he hath spoken. Exod. 34.5.

The fortitude of God, is that by which he is able to perform all things that he doth will. 1 Sam. 2.2. 2 Sam. 23.13. Esay. 28.2. &amp; 49.26. Jer. 50.34. Reuel. 18.8.

The truth of God is that by which he speaketh and doeth all things as they are indeed, he himself being most free from all lying. Rom. 3.4. Deut. 7.9.

The faithfulness of God is that by which he most faithfully performeth to his children that which he hath promised. Esay. 49.7. Exod. 34.6. Deut. 7.10.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The essence of God, is the nature of God, whereby God is indeed, and doth subsist. And that essence is but one: and therefore God is but only one also. There are two parts of the knowledge of the essence of God, the first concerning the attributes of God, the second concerning the distinction of the persons. The attributes of God, are those titles, which are attributed to God, to declare his essence better unto us.

The attributes of God, are either simple, or compared. [1] The simple attributes of God are the essential properties of God, which do agree to him without comparison. Of these some have such a similitude of him, as is in the creatures by creation: some have not. Of the former kind are blessedness, immortality, understanding, prescience, memory, will, goodness, holiness, justice, clemency, long sufferance, patience, constancy, fortitude, truth, faithfulness, and the rest.

The goodness of God is that, by which he hath bene everlastingly contented with him self, not hauing need of any other thing. 1. Tim. 1.11. &amp; 6.15.

The understanding of God, is that by which he hath a perfect understanding of all things, &amp; this is sometimes called the wisdom of God.

The immortality of God, is that by which he never dieth. 1. Tim. 1.17. &amp; 6.16.

The prescience of God, is a most perfect foreknowledge of all things to come.

The memory of God, is that by which he doth most exactly remember all things. Psal. 25.6.7. Esa. 49.16.

The will of God, is that by which he willeth all things. Rom 9.15.22. Eph. 1.5.9.11. And that will is only one, &amp; most simple if we respect God him self, but so far as we respect men, to whom it is either revealed or hid, it is two fold: manifest or secret. The schoolmen do call the former of these, the will of the sign, the other the will of the good pleasure of God. The secret will also in due time appointed by God, is made open and manifest.

The will of God is most free, whereupon also it is called the free will of God. The free will of God, is that self same essence of God, understanding by it self all things immediately and most perfectly, &amp; that most freely, but yet unchangeably and necessarily, willing that which is good only, and abhorring that only which is evil, neither depending of another former beginning, but of it self only. And this alone may properly be called of his own power.

The goodness of God is that by which he is the author of all good things. And he doth exercise this, either generally towards all creatures, or else particularly towards his elect. The former is called beneficence, the later is called mercy. The beneficence of God, is that by which he giveth his gifts to all his creatures. Mat. 5.44.45. Act. 14.17. The mercy of God is that by which God doth good to his elect, although they deserve nothing of him but evil. Esa. 49.10.13. Eph. 2.3.4. Psal. 145.9.

The holiness of God is that by which he doth altogether abhor all impurity &amp; uncleanness Esa. 6.3. Reu. 4.8. Jerem. 3.12.

The justice of God, is that by which he dealeth justly in all things. Psal. 116.11. Rom. 3.4.

The clemency of God, is that by which he doth repress his anger, which is most just, that he might spare us. Exod. 34.5.

The long sufferance of God, is that whereby he doth a long time defer his anger, and punishment against sinners, that he might provoke them to repentance. Exod 34.5.

The patience of God is that by which he suffereth a long time patiently the sins of men, that he might lead them to repentance. Esa. 48.9

The constancy of God, is that by which he performeth most certainly that which he hath spoken. Exod. 34.5.

The fortitude of God, is that by which he is able to perform all things that he doth will. 1 Sam. 2.2. 2 Sam. 23.13. Esay. 28.2. &amp; 49.26. Jer. 50.34. Reuel. 18.8.

The truth of God is that by which he speaketh and doeth all things as they are indeed, he himself being most free from all lying. Rom. 3.4. Deut. 7.9.

The faithfulness of God is that by which he most faithfully performeth to his children that which he hath promised. Esay. 49.7. Exod. 34.6. Deut. 7.10.”

— Amandus Polanus, The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal pointes whereof are contain, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 1-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+essence+of+God%2C+is+the+nature+of+God%2C+whereby+God+is+indeed%2C+and+doth+subsist.+And+that+essence+is+but+one%3A+and+therefore+God+is+but+only+one+also.+There+are+two+parts+of+the+knowledge+of+the+essence+of+God%2C+the+first+concerning+the+attributes+of+God%2C+the+second+concerning+the+distinction+of+the+persons.+The+attributes+of+God%2C+are+those+titles%2C+which+are+attributed+to+God%2C+to+declare+his+essence+better+unto+us.%0A%0AThe+attributes+of+God%2C+are+either+simple%2C+or+compared.+%5B1%5D+The+simple+attributes+of+God+are+the+essential+properties+of+God%2C+which+do+agree+to+him+without+comparison.+Of+these+some+have+such+a+similitude+of+him%2C+as+is+in+the+creatures+by+creation%3A+some+have+not.+Of+the+former+kind+are+blessedness%2C+immortality%2C+understanding%2C+prescience%2C+memory%2C+will%2C+goodness%2C+holiness%2C+justice%2C+clemency%2C+long+sufferance%2C+patience%2C+constancy%2C+fortitude%2C+truth%2C+faithfulness%2C+and+the+rest.%0A%0AThe+goodness+of+God+is+that%2C+by+which+he+hath+bene+everlastingly+contented+with+him+self%2C+not+hauing+need+of+any+other+thing.+1.+Tim.+1.11.+%26+6.15.%0A%0AThe+understanding+of+God%2C+is+that+by+which+he+hath+a+perfect+understanding+of+all+things%2C+%26+this+is+sometimes+called+the+wisdom+of+God.%0A%0AThe+immortality+of+God%2C+is+that+by+which+he+never+dieth.+1.+Tim.+1.17.+%26+6.16.%0A%0AThe+prescience+of+God%2C+is+a+most+perfect+foreknowledge+of+all+things+to+come.%0A%0AThe+memory+of+God%2C+is+that+by+which+he+doth+most+exactly+remember+all+things.+Psal.+25. <blockquote><p>Object. Perhaps the promises and threatnings of God, are his conditional decree, and depending upon the performance of the condition by the pleasure of man. Answ. But this cannot truly be said: For if it should be so, this decree would not be certain by the will of God, although the event was certainly foreseen by him: Also nothing can be imagined more absurd, than to appoint God to decree any thing with a condition is fulfilled.

But God willeth nothing, which he willed not from eternity. Indeed God doth promise life under the condition of obedience, but he doth decree nothing under that doubtful condition. He doth not elect Peter if he shall believe, but he electeth him to faith, that he might be saved: Neither was he only willing to preserve the Ninevites if they would be turned, but he also gave them repentance whereby they turned.</p></blockquote>

enanter</a></div>

<blockquote><p>The carnal man, who does not know God due to his innate ignorance, and consequently has no understanding regarding the intimate and essential relationship between God’s holy and glorious attributes, separates these attributes one from the other. He subscribes to some of God’s attributes while rejecting others, and in so doing the carnal and natural man subscribes to a God of his own liking who conforms to his foolish imagination.

He subscribes to a God who is only gracious, compassionate, merciful, and longsuffering, but who is not at all holy, truthful, just, etc., and thereby he constructs a God according to his own liking and will. Of such a God, the carnal man has nothing or little to fear, for He is only merciful and gracious, and He very readily forgives sin. This gives a man all the latitude he desires, so that he can live and conduct himself according to the desires of his heart. Oh, wretched ignorance of God! How many a sinner, traversing upon this pathway, will perish eternally!

If, however, we desire to lend an ear to good teaching and instruction, the instructor will provide this for us, saying that God is indeed merciful, but also just. Both these attributes, justice and mercy, are inseparably united in God’s being, and may therefore in no wise be separated. If we separate them, we then deny who God is, and we fabricate a worthless idol. In the Holy Scriptures, God is never set before us in any way but as a God who is both just and merciful.

Nearly every page of the Bible teaches this. Listen only to one passage, Exodus 34:6–7, where God declares His glory: “The LORD, the LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation.”

We are not to think of God in any other way than the description Moses here gives of Him: He is abundant in grace, longsuffering, and mercy, but He is also a God who will by no means clear the guilty, but will always severely punish sin both temporally and eternally. Thus, God’s mercy cannot be in conflict with His holiness and justice, nor can it function in such a fashion that it would eradicate or in any way be detrimental to His holiness and justice. Rather, they must coexist in God in a most intimate manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 54.</span></figcaption>

— Theodorus VanderGroe, The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 54.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+carnal+man%2C+who+does+not+know+God+due+to+his+innate+ignorance%2C+and+consequently+has+no+understanding+regarding+the+intimate+and+essential+relationship+between+God%E2%80%99s+holy+and+glorious+attributes%2C+separates+these+attributes+one+from+the+other.+He+subscribes+to+some+of+God%E2%80%99s+attributes+while+rejecting+others%2C+and+in+so+doing+the+carnal+and+natural+man+subscribes+to+a+God+of+his+own+liking+who+conforms+to+his+foolish+imagination.%0A%0AHe+subscribes+to+a+God+who+is+only+gracious%2C+compassionate%2C+merciful%2C+and+longsuffering%2C+but+who+is+not+at+all+holy%2C+truthful%2C+just%2C+etc.%2C+and+thereby+he+constructs+a+God+according+to+his+own+liking+and+will.+Of+such+a+God%2C+the+carnal+man+has+nothing+or+little+to+fear%2C+for+He+is+only+merciful+and+gracious%2C+and+He+very+readily+forgives+sin.+This+gives+a+man+all+the+latitude+he+desires%2C+so+that+he+can+live+and+conduct+himself+according+to+the+desires+of+his+heart.+Oh%2C+wretched+ignorance+of+God%21+How+many+a+sinner%2C+traversing+upon+this+pathway%2C+will+perish+eternally%21%0A%0AIf%2C+however%2C+we+desire+to+lend+an+ear+to+good+teaching+and+instruction%2C+the+instructor+will+provide+this+for+us%2C+saying+that+God+is+indeed+merciful%2C+but+also+just.+Both+these+attributes%2C+justice+and+mercy%2C+are+inseparably+united+in+God%E2%80%99s+being%2C+and+may+therefore+in+no+wise+be+separated.+If+we+separate+them%2C+we+then+deny+who+God+is%2C+and+we+fabricate+a+worthless+idol.+In+the+Holy+Scriptures%2C+God+is+never+set+before+us+in+any+way+but+as+a+God+who+is+both+just+and+merciful.%0A%0ANearly+every+page+of+the+Bible+teaches+this.+Listen+only+to+one+passage%2C+Exodus+34%3A6%E2%80%937%2C+where+God+declares+His+glory%3A+%E2%80%9CThe+LORD%2C+the+LORD+God%2C+merciful+and+gracious%2C+longsuffering%2C+and+abundant+in+goodness+and+truth%2C+keeping+mercy+for+thousands%2C+forgiving+iniquity+and+transgression+and+sin%2C+and+that+will+by+no+means+clear+the+guilty%3B+visiting+the+iniquity+of+the+fathers+upon+the+children%2C+and+upon+the+children%E2%80%99s+children%2C+unto+the+third+and+to+the+fourth+generation.%E2%80%9D%0A%0AWe+are+not+to+think+of+God+in+any+other+way+than+the+description+Moses+here+gives+of+Him%3A+He+is+abundant+in+grace%2C+longsuffering%2C+and+mercy%2C+but+He+is+also+a+God+who+will+by+no+means+clear+the+guilty%2C+but+will+always+severely+punish+sin+both+temporally+and+eternally.+Thus%2C+God%E2%80%99s+mercy+cannot+be+in+conflict+with+His+holiness+and+justice%2C+nor+can+it+function+in+such+a+fashion+that+it+would+eradicate+or+in+any+way+be+detrimental+to+His+holiness+and+justice.+Rather%2C+they+must+coexist+in+God+in+a+most+intimate+manner.%E2%80%9D%0A%0A%E2%80%94+Theodorus+VanderGroe%2C+The+Christian%E2%80%99s+Only+Comfort+in+Life+and+Death%3A+An+Exposition+of+the+Heidelberg+Catechism%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%281838-44%3B+2+vols%2C+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2016%29%2C+1%3A+54.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf5c7cc37e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af5c7cc37e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/20/theodorus-vandergroe-on-the-carnality-of-denying-the-divine-simplicity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d3ac8d1b5e" data-kw="">
<blockquote><p>The Psalmist’s expression in the eyes of the Lord, are very pregnant to our purpose. Here is a description of eternity, proving that God seeth all things with one intuitive cast of his eye, and that although to us things are present, past and to come, yet to God all things are present, and although we are not able to reach this with our understanding, no more then a pigmy the Pyramids, yet we must rest more upon this Scripture assertion, then our own understanding, Quicquid de Deo dici (we may add cogitari) potest, eo ipso est indig∣num quia dici (cogitari) potest: and again dignè Deum aestimamus, dum inaestimabilm dicimus.

The Schoolmen dispute, whether those things which God did once know, he still knoweth, as for example, God once knew that Christ was to die, but now it is not true, that he is to die; and their resolution is, that we cannot properly say, God begins to know what he did, or ceaseth to know what he did, but rather that the thing it self beginneth to be known, or ceaseth to be known, so that the change is not in respect of God’s knowing, but the thing known, as when I see the Sun, and afterwards it is hid in the cloud, the change is not in my eye, but in the Sun; Hence they also resolve, that God knoweth all things simul together, that his knowledge is invariable, that it admitteth not of increase or decrease, that all things are present to him, and that as the Sun is always in actu lucendi, so God in actu intelligendi …</p></blockquote>

n+asserted+and+vindicated%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially+Antinomians+in+XXX+lectures+preached+at+Lawrence-Jury%2C+London%2C+%282nd+edn%2C+London%3A+Tho.+Underhill%2C+1651%29%2C+p.+92.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3ac8d1b5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3ac8d1b5e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/09/anthony-burgess-on-gods-eternal-knowledge/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4a318ea19f" data-kw="">
<blockquote><p>Turn unto me] Renounce all Idols and men’s Devices in my Worship; acknowledge me alone to be your God, and my Word to be your only Rule, with unfeigned Repentance for your former departures from me, and disobedience to my Word; be my people, and observe my Commandments: for, to cry to God for Corn, &amp;c. is not a turning to God, but to the Creature, Hos. 7.14. but it is to seek God for himself, when nothing will satisfy us besides God himself to be our God, Psal. 144.15.

[A]nd when we mourn, not so much for the loss, or want of these things, as for God’s displeasure for our sins that have incensed his wrath, and so seek God’s face, &amp; reconciliation with him in Christ, Psal. 4.6, 7. God doth not require this of them, as if it were in their power to do it, but to convince them that it is their duty, whereunto he would excite them by the Ministry of his Prophet, and would quicken and enable them by the efficacy of his Spirit accompanying the same.

And I will turn unto you] God’s turning to us is not like our turning to God: for, our turning to God supposeth a change in us, but God’s turning to us is without shadow of turning, Jam. 1.17. both in his Nature, Mal. 3.6. and in his Will, Isa. 46.10. but it is to be understood in respect of his Effects; that is to say, I will be reconciled to you, and shew it by suitable effects, as Micah 7.19. He will turn again, he will have compassion upon us.

Saith the Lord of Hosts] This Attribute shews his Absolute dominion over all Creatures in Heaven and Earth, whom he can dispose of by his command, to execute his vengeance upon those that disobey him: in this sense it is added to the Precept. And to be Instruments of dispensing the effects of his favour to those that turn unto him, and obey him; in this sense it is added to the Promise: In both it is suited with their condition, who had experience of the former, and upon their returning to him should find him ready to use his Hosts for their good.</p></blockquote>

<blockquote><p>[L]et us consider what the knowledge of God is; it is a most pure act by which he doth at one instant know himself in himself, and all things without himself, not only necessary, and contingent, but which shall never be, after a most perfect, exquisite, and infallible manner.

Out of this description, we may gather two things. 1. That there is no Succession in God’s knowledge, it is uno intuitu, our knowledge is … from the effect to the cause; it is not so in God. 2. Things that are not have an objective being in his knowledge, Rom. 4. 17. He calls things that are not as if they were; even these non entia have an Idea in his knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-fd11d9c75c" data-kw="">
<blockquote><p>There is no composition in God, neither Physical, nor Logical, nor Metaphysical; because in him there is no priority nor posteriority, as in composition where the compositum is posterior to the parts compounding.

2. In composition there is act and possibility; but God is all act.

3. In composition the parts differ from the compositum; but in God there is no difference.

4. There is no composition in form; but God is a most simple form.

5. Whatsoever is compounded hath a cause of that composition; but in God there is no cause.</p></blockquote>

<blockquote><p>Let our Souls pause and imagine what an Incomprehensible Spirit GOD is! What is his Name, and his Sons Name, if thou canst tell. HE is that He is, has Life in Himself, and in Him we live and move and have our Being. The Worlds of Spirits, and so the Corporeal Universe, are his Workmanship, continually sustained and governed by Him.

His active Essence therefore intimately pervades and penetrates the immeasurable Frame! GOD is Life, Light, Mind, Self-existence; Glory, Blessedness, Perfection; incomparable, inconceivable. To Whom can we liken Him, or what Likeness can we compare unto Him? Singularity and Onliness is his Glory. There is One God, and no other than He.

We should not have dared to say of God that He is a Spirit, or to have called Spirits his Image and Likeness, if He Himself had not so spoken to us of Himself. Yet is there no other Image whereby our Minds can represent Him to themselves, but from their own spiritual Nature, Powers, and Operations. This therefore must be the first thing in the Image of God of Angels and Men, Spirituality. In this Glass we see the first Shadow of God. Our Souls discern it by Reflection on themselves. We then look without, look abroad, and see thro’ the Eyes of the Body Images of Wisdom, Power and Goodness, in every thing Material and Visible.

We see the Work of some perfectly wise, good, Almighty Intelligence. — It is in and from it self, that the poor finite Spirit of Man, conscious to its own Understanding and Affections, and enlightened from the Spirit and Word of God, conceives and infers what a transcendent Being and Spirit God is; the Framer of the Universe, and the Former and Father of all Spirits. It is because we in our Souls bear some Image of God, that we can at all apprehend &amp; know that God is a Spirit. The Beasts have Eyes to see the Fields of Grass and Corn as much as we, but not having our Souls to discern the Eternal Power and Godhead from the Things that are made, their Spirits are not the Likeness of God as ours are.

And yet the spiritual Nature of Angels and Men is not to be compared with the Spirituality of God, or the Simplicity of his Essence. The grossest Matter that our Eyes behold is not so much below the Soul of Man, as that is below the Spirituality of the Divine Nature. Never the less in the Faculties of the Human Soul we plainly see some Resemblance of the Infinite Eternal Spirit, the Maker and Preserver of all Things, visible &amp; invisible. And this is the first and most obvious part of the Image of God upon us in our Creation, that we are Souls or Spirits. God who made us this Soul, herein has made us in his own Image, after his Likeness; for He is THE SPIRIT, and the Father of Spirits.

God is a Spirit in a Sense far superior to that wherein Angels are to be so called. He maketh his Angels Spirits. I doubt not but God is more invisible to them, and in Comparison of them, than they are to us and in Comparison of us. Created Spirits are compounded Beings if compared with their MAKER; they are made what they are, and He who made them can if he please annihilate and dissolve them again.

But there is an ineffable, inconceivable Simplicity of Essence in the Divine Nature, which infinitely distinguishes His Spirituality from that of all Creatures.— Angels and Souls are Spirits but they singly occupy a space, and pass from place to place, with an incredible Swiftness, like Rays of Light; but the Invisible God is an Immense Being filling Heaven and Earth, always present and the same in all Places. This is as far above Souls or Angels, as they are above Bodies.

It is a most just and glorious Account that God gave of Himself to Moses, I AM THAT I AM. He is what no One else is or can be; He is alone what He is; what all his Creatures can but poorly represent, and less can understand; even as the Shadow of a Man does but poorly represent him in his Life, Look, Thought and Speech. — God is singly the Spiritual BEING, and there is none like Him, none beside Him. As there is none Good but One which is God, so is there but One only Spirit in the Universe, who filleth all in all.

Thus the Lord our God is ONE LORD, and the Knowledge of HIM is too wonderful for us; it is high, and we cannot attain to it: yea how little do we know of our own Spirits, which are made for the Knowledge of Him? It is but as thro’ a Glass darkly that we see any thing of GOD. The Ideas of Infinite, Eternal, Unchangeable and Self existent are the Proof and Illustration of his Spirituality. We can only explain and confirm the One from the other. As what Man knoweth the Things of a Man, save the Spirit of Man that is in him? even so the things of God knoweth no Man, but the Spirit of God: Which Things we therefore speak, not in the Words which Man’s Wisdom teacheth, but which the Holy Ghost teacheth, comparing spiritual things with spiritual.</p></blockquote>

<blockquote><p>Therefore, when the instructor speaks here of man’s only comfort, it is abundantly clear that he has in mind only true believers, who, by the grace of the Holy Spirit, have received true self-knowledge as to the depth of their inability and misery. Such have become deeply troubled and sorrowful about this, and no longer are able to be at peace with themselves.

Instead, being truly lost, wretched, and poor in spirit, they have looked outside of themselves and taken refuge only to the free grace of God in Christ Jesus for their comfort and deliverance. So the instructor has in mind true believers who truly know themselves to be poor and wretched, and it is concerning them that he inquires into what their comfort consists in regard to such misery.

The instructor proceeds to describe this comfort in greater detail and formulates it as the only comfort in life and death. The essential characteristic of man’s true comfort consists in the fact that it is singular in nature. It is unique; that is, there is but one object in which this true comfort can be sought and found: the all-sufficient God and His blessed communion. This is the only and highest good, and apart from this good there is none other in which a wretched sinner could find this true and essential comfort for his poor soul. The soul has miseries, needs, and desires that are infinite in dimension, and everything apart from God is finite and deficient.

Nothing but God alone can provide the soul with true and essential satisfaction, comfort, and encouragement. There is but one comfort for a poor and believing sinner. Only one Object can yield true and essential comfort. All comfort that is sought for and found outside of this Object is extremely harmful and vain. With Asaph, the soul of a believing sinner must here say to her God, “Whom have I in heaven but thee? and there is none upon earth that I desire beside thee” (Ps. 73:25).</p></blockquote>

— Theodorus VanderGroe, The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+when+the+instructor+speaks+here+of+man%E2%80%99s+only+comfort%2C+it+is+abundantly+clear+that+he+has+in+mind+only+true+believers%2C+who%2C+by+the+grace+of+the+Holy+Spirit%2C+have+received+true+self-knowledge+as+to+the+depth+of+their+inability+and+misery.+Such+have+become+deeply+troubled+and+sorrowful+about+this%2C+and+no+longer+are+able+to+be+at+peace+with+themselves.%0A%0AInstead%2C+being+truly+lost%2C+wretched%2C+and+poor+in+spirit%2C+they+have+looked+outside+of+themselves+and+taken+refuge+only+to+the+free+grace+of+God+in+Christ+Jesus+for+their+comfort+and+deliverance.+So+the+instructor+has+in+mind+true+believers+who+truly+know+themselves+to+be+poor+and+wretched%2C+and+it+is+concerning+them+that+he+inquires+into+what+their+comfort+consists+in+regard+to+such+misery.%0A%0AThe+instructor+proceeds+to+describe+this+comfort+in+greater+detail+and+formulates+it+as+the+only+comfort+in+life+and+death.+The+essential+characteristic+of+man%E2%80%99s+true+comfort+consists+in+the+fact+that+it+is+singular+in+nature.+It+is+unique%3B+that+is%2C+there+is+but+one+object+in+which+this+true+comfort+can+be+sought+and+found%3A+the+all-sufficient+God+and+His+blessed+communion.+This+is+the+only+and+highest+good%2C+and+apart+from+this+good+there+is+none+other+in+which+a+wretched+sinner+could+find+this+true+and+essential+comfort+for+his+poor+soul.+The+soul+has+miseries%2C+needs%2C+and+desires+that+are+infinite+in+dimension%2C+and+everything+apart+from+God+is+finite+and+deficient.%0A%0ANothing+but+God+alone+can+provide+the+soul+with+true+and+essential+satisfaction%2C+comfort%2C+and+encouragement.+There+is+but+one+comfort+for+a+poor+and+believing+sinner.+Only+one+Object+can+yiel <blockquote><p>Now, in the cross of Christ, all the divine attributes are perfectly harmonized. Here it is, and only here, that “mercy and truth have met together, righteousness and peace have kissed each other.” By the cross, every attribute of the Deity is shown immaculate, and beaming with a splendour nowhere else to be seen.

The highest display of the glory of God ever made to the universe, was made by the cross of Christ. This glory is here seen, not only to be consistent with the salvation of penitent offenders, but to shine the brightest of all, in the very act of saving the chief of sinners— “Where sin abounded, grace did much more abound.</p></blockquote>

</figure><figure class="quote" id="q-c699e98944" data-kw="">
<blockquote><p>For God is considered two ways, as a Creator, and as a Saviour. It is the love of Him as a Saviour, that is shewed to thee in thy Redemption. And when was this love revealed? when JESUS CHRIST came into the world, and took upon Him our nature, then this love brake out toward man: He loved him from all Eternity, but it brake not out till then.

Mark then. It is the love of GOD that saveth, it is GOD’S bountifulness that saveth: our delivery behoved to proceed of a wonderful bountifulness in God, whereof the ground is love. If He had not loved thee, He would not have delivered thee. Then it is not a common love which He beareth towards us, but there is a special love in GOD to mankind: He loveth not these Heavens, these Stars, so well as He doeth men. No, He communicateth not the thousand part of those things that He communicateth to man, either to the Heavens, or to the Stars.

Then it is not the love of GOD the Creator that doeth this, and is the ground of this bountifulness, and of our life in Him: but it is a special kind of love. It is that love that proceedeth of GOD the Saviour. It is not the love of a Creator, but of a Father, not to the creature, but to the son. GOD loveth His son better than He doeth His creature, He loveth us as His sons.

If there were no further love of GOD, but as He is a Creator, thou durst never cry, Abba, Father: and except the Spirit spread abroad into our hearts that love which He beareth unto us, for all the world thou durst not appear before Him. The time is set down when He hath saved us, when His singular love appeared in the world, He saved us being manifested in the flesh.</p></blockquote>

</figure><figure class="quote" id="q-38a08a75b7" data-kw="">
<blockquote><p>God, at the creation, beheld man, a goodly frame of his own rearing, adorned with his own image, beautified with his graces, embellished with holiness and righteousness, and furnished with a power to stand; and afterwards beheld him ungratefully rebelling against his sovereign, invading his rights, and contemning his goodness, forfeiting his own privileges, courting his ruin, and sinking into misery.

So blinded is his mind, as not to be able to find out a way for his own recovery; so perverse is his will, that instead of craving pardon of his judge, he flies from him, and when his flight would not advantage him, he stands upon his own defence, and extenuates his crime; thus adding one provocation to another, as if he had an ambition to harden the heart of God against him, and render himself irrecoverably miserable.

God so overlooks these, as in immense love and grace to settle a way for man’s recovery, without giving any dissatisfaction to his justice, so strongly engaged for the punishment of the offence. And rather than this notorious rebel and prodigious apostate should perish according to his merit, he would transfer the punishment (which he could not remit without a violation of his truth, and an injury to his righteousness) upon a person equal to himself, most beloved by him, his delight from eternity, and infinitely dearer to him than anything in heaven or earth. Herein was the emphasis of divine love to us, that ‘he sent his Son to be the propitiation for our sin,’ 1 John iv. 10.

It was love that he would restore man after the fall; there was no more necessity of doing this, than of creating the world. As it added nothing to the happiness of God, so the want of it had detracted nothing from it. There was no more absolute necessity of setting up man again after his breaking, than of a new repair of the world after the destructive deluge. But that he might wind up his love to the highest pitch, he would not only restore man, but rather than let him lie in his deserved misery, would punish his own bowels to secure man from it. It was purely his grace which was the cause that his Son ‘tasted death for every man,’ Heb. ii. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 496-97.</span></figcaption>

</figure><figure class="quote" id="q-6fe375315b" data-kw="">
<blockquote><p>It is, then, universally acknowledged that we must believe the Deity to be not only almighty, but just, and good, and wise, and everything else that suggests excellence. It follows, therefore, in the present dispensation of things, that it is not the case that some particular one of these Divine attributes freely displays itself in creation, while there is another that is not present there; for, speaking once for all, no one of those exalted terms, when disjoined from the rest, is by itself alone a virtue, nor is the good really good unless allied with what is just, and wise, and mighty (for what is unjust, or unwise, or powerless, is not good, neither is power, when disjoined from the principle of justice and of wisdom, to be considered in the light of virtue; such species of power is brutal and tyrannous; and so, as to the rest, if what is wise be carried beyond the limits of what is just, or if what is just be not contemplated along with might and goodness, cases of that sort one would more properly call vice; for how can what comes short of perfection be reckoned among things that are good?). If, then, it is fitting that all excellences should be combined in the views we have of God, let us see whether this Dispensation as regards man fails in any of those conceptions which we should entertain of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Catechism</cite>, (c. 385), 20 in Nicene and Post-Nicene Fathers 2, 5: 491.</span></figcaption>

ods-excellencies/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Quest. Here a question may be started, If there be such perfection in the knowledge of God, then he knows sin?

Resp. The Schools distinguish of a double knowledge in God. There is, 1. Scientia simplicis intelligentiae, a knowledge of pure intelligence, and thus he knows evil by a contrary good, as the light discovers the darkness. So we say, Rectum est index sui &amp; obliqui, The straight rule shews the crooked. 2. There is a knowledge of approbation. Thus God doth not know sin; for he hates it, he punisheth it. Christ was made sin, yet he knew no sin; he did know it so as to hate it, not so as to act or approve it.

I pass to the Reasons.

1. Reason. From his creation; God is the Father of lights, therefore must needs see. It is his own Argument, He that planted the ear, shall he not hear? he that formed the eye, shall he not see? He that makes a Watch, knows all the pins and wheels in it, and though these wheels move cross one to another, he knows the true and perfect motion of the Watch, and the spring that sets these wheels a going; He that formed the eye, shall he not see? Man may be compared to a spiritual Watch. The affections are the wheels; the heart is the spring; the motion of this Watch is false; the heart is deceitful; but God that made this watch knows the true motion of it (be it never so false) and the spring that sets the wheels a going. God knows us better then we know our selves: He is as Ezekiel’s wheels full of eyes, and as Augustin saith, he is totus oculus, all eye.

2. Reason. From his ubiquity. He is Omniscient, because Omnipresent, Ier. 23. 24. Do not I fill heaven and earth? He is no where included, and yet no where excluded; His circumference is every where: God hath an eye in Councils, in Armies, he makes an Heart anatomy; he sees what men’s designs are, and whither they are driving. If hatred wears the livery of Friendship, if Ambition comes masqued with humility, if Religion be made a stirrup to get into the saddle of preferment, God sees it; And though they dig into hell, thence shall my hand take them, Amos 9. 2. God can unlock hell; Plato saith of the King of Lydia, he had a Ring, when he turned the head of it to the palm of his hand, he could see every one, but himself walk invisible.

Thus God observes all our actings, but himself is not seen, as the Apostle argues, 1 Tim. 6. 16. Therefore the Schoolmen say well, Deus est in loco repletivè. Man may be circumscribed, the Angels may be defined, but God is in every place by way of repletion. His Centre is every where, and his eye is ever in his Centre.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of public humiliation</cite>, (London: Ralph Smith, 1654), pp 13-16.</span></figcaption>

<blockquote><p>Progressive evolution within the Divine nature, would imply a career for the Deity in which He was passing from less to more perfect stages of existence, and would bring Him within the realm of the relative and conditioned.

Latency is necessarily excluded from the Eternal One, by virtue of that absolute perfection and metaphysical self-completeness whereby his being is “without variableness or shadow of turning.” …

For the Deity, though self-complete and incapable of development himself, has yet made that which is potential and destined to an unfolding. He has created a universe that is full of latent powers and agencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Philosophy of History</cite>, (Andover: W. F. Draper, 1857), pp 23-24.</span></figcaption>

<blockquote><p>As God is essentially holy, so God is unmixedly holy. The holiness of God is a pure holiness, it is an unmixed holiness: 1 John i. 5, ‘God is light, and in him is no darkness at all.’ There are no mixtures in God. God is a most clear, bright-shining light, yea, he is all light, and in him is no darkness at all. The moon, indeed, when it shines brightest, hath her dark spots and specks, but God is a light that shines gloriously without the least spot or speck. Now, look, as that darkness which hath not the least light attending it is the grossest, the thickest Egyptian darkness that can be, so that light that hath not the least cloud of darkness attending it must be the most clear, splendid light that possible can be; and such a light is the Holy One of Israel.

It is very observable, the apostle, to illustrate the perfect purity and sanctity of God, adds a negative to his affirmative, ‘In him is no darkness at all,’ that is, God is so pure, that not the least spot, the smallest speck, can cleave to him; he is so holy, that no iniquity can be found in him; there is no defect nor default in the nature of God. He is a God of truth, and without iniquity; just and right is he.

As Moses spake in that Deut. xxxii. 4, God is a pure, a most pure act, without the least potentiality, defectability, or mutability, and therefore in the highest sense he is light, and in him is no darkness at all. Surely there is no unrighteousness in God; no evil can dwell with him, or come near unto him. God stands at such a distance from iniquity, yea, he so abhors it, that he never did, nor never will, bestow a good look upon it: Hab. i. 13, ‘Thou art of purer eyes than to behold evil, and canst not look on iniquity.’

There are four things that God cannot do: 1. He cannot lie; 2. He cannot die; 3. He cannot deny himself; nor, 4. He cannot look with a favourable eye upon iniquity. God doth indeed look upon iniquity with a hateful eye, with an angry eye, with a revengeful eye, and with a vindictive eye, but he never did nor will look upon iniquity with an eye of delectation, or with an eye of approbation. Witness his hurling the fallen angels out of heaven, and his banishing of sinning Adam out of paradise. By all this you see that the holiness of God is a pure holiness, it is a holiness without mixture.

But now all the holiness that is in the best and choicest saints in the world is but a dreggy holiness, a mixed holiness, a weak and imperfect holiness; their unholiness is always more than their holiness. Ah, what a deal of pride is mixed with a little humility, and what a deal of unbelief is mixed with a little faith, and what a deal of passion is mixed with a little meekness, and what a deal of earthliness is mixed with a little heavenliness, and what a deal of carnalness is mixed with a little spiritualness, and what a deal of hardness is mixed with a little tenderness!

Oh, but now the holiness of God is a pure holiness, it is a holiness without mixture, there is not the least drop nor the least dreg of unholiness in God. It is true the gods of the heathen were such as had been impure, beastly, filthy men, and therefore several writers have taken a great deal of pains to convince heathens of their impiety and folly in worshipping such for gods, upon whom they fastened many horrid, ridiculous, lascivious, and impious actions, and therefore they conclude against them, that they are no gods.

It is most certain that the true God, that he that is the High and the Holy One, cannot be charged with any iniquity, no, nor with the least show or shadow of vanity. In God there is wisdom without folly, truth without falsehood, light without darkness, and holiness without sinfulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 393-94.</span></figcaption>

— Thomas Brooks, The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 393-94.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+God+is+essentially+holy%2C+so+God+is+unmixedly+holy.+The+holiness+of+God+is+a+pure+holiness%2C+it+is+an+unmixed+holiness%3A+1+John+i.+5%2C+%E2%80%98God+is+light%2C+and+in+him+is+no+darkness+at+all.%E2%80%99+There+are+no+mixtures+in+God.+God+is+a+most+clear%2C+bright-shining+light%2C+yea%2C+he+is+all+light%2C+and+in+him+is+no+darkness+at+all.+The+moon%2C+indeed%2C+when+it+shines+brightest%2C+hath+her+dark+spots+and+specks%2C+but+God+is+a+light+that+shines+gloriously+without+the+least+spot+or+speck.+Now%2C+look%2C+as+that+darkness+which+hath+not+the+least+light+attending+it+is+the+grossest%2C+the+thickest+Egyptian+darkness+that+can+be%2C+so+that+light+that+hath+not+the+least+cloud+of+darkness+attending+it+must+be+the+most+clear%2C+splendid+light+that+possible+can+be%3B+and+such+a+light+is+the+Holy+One+of+Israel.%0A%0AIt+is+very+observable%2C+the+apostle%2C+to+illustrate+the+perfect+purity+and+sanctity+of+God%2C+adds+a+negative+to+his+affirmative%2C+%E2%80%98In+him+is+no+darkness+at+all%2C%E2%80%99+that+is%2C+God+is+so+pure%2C+that+not+the+least+spot%2C+the+smallest+speck%2C+can+cleave+to+him%3B+he+is+so+holy%2C+that+no+iniquity+can+be+found+in+him%3B+there+is+no+defect+nor+default+in+the+nature+of+God.+He+is+a+God+of+truth%2C+and+without+iniquity%3B+just+and+right+is+he.%0A%0AAs+Moses+spake+in+that+Deut.+xxxii.+4%2C+God+is+a+pure%2C+a+most+pure+act%2C+without+the+least+potentiality%2C+defectability%2C+or+mutability%2C+and+therefore+in+the+highest+sense+he+is+light%2C+and+in+him+is+no+darkness+at+all.+Surely+there+is+no+unrighteousness+in+God%3B+no+evil+can+dwell+with+him%2C+or+come+near+unto+him.+God+stands+at+such+a+distance+from+iniquity%2C+yea%2C+he+so+abhors+it%2C+that+he+never+did%2C+nor+never+will%2C+bestow+a+good+look+upon+it%3A+Hab.+i.+13%2C+%E2%80%98Thou+art+of+purer+eyes+than+to+behold+evil%2C+and+canst+not+look+on+iniquity.%E2%80%99%0A%0AThere+are+four+things+that+God+cannot+do%3A+1.+He+cannot+lie%3B+2.+He+cannot+die%3B+3.+He+cannot+deny+himself%3B+nor%2C+4.+He+cannot+look+with+a+favourable+eye+upon+iniquity.+God+doth+indeed+look+upon+iniquity+with+a+hateful+eye%2C+with+an+angry+eye%2C+with+a+revengeful+eye%2C+and+with+a+vindictive+eye%2C+but+he+never+did+nor+will+look+upon+iniquity+with+an+eye+of+delectation%2C+or+with+an+eye+of+approbation.+Witness+his+hurling+the+fallen+angels+out+of+heaven%2C+and+his+banishing+of+sinning+Adam+out+of+paradise.+By+all+this+you+see+that+the+holiness+of+God+is+a+pure+holiness%2C+it+is+a+holiness+without+mixture.%0A%0ABut+now+all+the+holiness+that+is+in+the+best+and+choicest+saints+in+the+world+is+but+a+dreggy+holiness%2C+a+mixed+holiness%2C+a+weak+and+imperfect+holiness%3B+their+unholiness+is+always+more+than+their+holiness.+Ah%2C+what+a+deal+of+pride+is+mixed+with+a+little+humility%2C+and+what+a+deal+of+unbelief+is+mixed+with+a+little+faith%2C+and+what+a+deal+of+passion+is+mixed+with+a+little+meekness%2C+and+what+a+deal+of+earthliness+is+mixed+with+a+little+heavenliness%2C+and+what+a+deal+of+carnalness+is+mixed+with+a+little+spiritualness%2C+and+what+a+deal+of+hardness+is+mixed+with+a+little+tenderness%21%0A%0AOh%2C+but+now+the+holiness+of+God+is+a+pure+holiness%2C+it+is+a+holiness+without+mixture%2C+there+is+not+the+least+drop+nor+the+least+dreg+of+unholiness+in+God.+It+is+true+the+gods+of+the+heathen+were+such+as+had+been+impure%2C+beastly%2C+filthy+men%2C+and+therefore+several+writers+have+taken+a+great+deal+of+pains+to+convince+heathens+of+their+impiety+and+folly+in+worshipping+such+for+gods%2C+upon+whom+they+fastened+many+horrid%2C+ridiculous%2C+lascivious%2C+and+impious+actions%2C+and+therefore+they+conclude+against+them%2C+that+they+are+no+gods.%0A%0AIt+is+most+certain+that+the+true+God%2C+that+he+that+is+the+High+and+the+Holy+One%2C+cannot+be+charged+with+any+iniquity%2C+no%2C+nor+with+the+least+show+or+shadow+of+vanity.+In+God+there+is+wisdom+without+folly%2C+truth+without+falsehood%2C+light+without+darkness%2C+and+holiness+without+sinfulness.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Crown+and+Glory+of+Christianity%3B+or+Holiness%2C+the+only+way+to+Happiness.+Discovered+in+LVIII+Sermons+from+Heb.+12.+14%2C+%281662%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grossart+%286+vols%2C+Edinburgh%3A+James+Nichol%2C+1861-67%29%2C+4%3A+393-94.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd051fac48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd051fac48.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/20/thomas-brooks-on-pure-actuality-and-gods-unmixed-holiness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2e92233f43" data-kw="">
<blockquote><p>The object of divine love is God. God is good, and good is amiable. God is all good: there is none good but one, that is God. God is essentially good, goodness in the abstract; he is infinitely excellent, he is all perfection. In this one attribute all the rest of the attributes of God are included, and this in each of them.

However the Scriptures, speaking to our capacities, describe God and his glorious attributes in several and distinct notions, yet in each one all are included; each one is infinite, and infinite perfection is essentially all perfection. God is originally good, the fountain and pattern of all that moral good which is in his creatures; he is bountiful and gracious, ready to do them good; and he is the felicitating end, or the final blessedness of the soul.</p></blockquote>

</figure><figure class="quote" id="q-d4c0f223a0" data-kw="">
<blockquote><p>We understand these attributes to be one from God’s perspective, however, such that they can neither be divorced from the divine Being nor essentially and properly from each other as they exist in God, but are the simple, absolute Being of God Himself.

We, however, relate these attributes as distinct entities by themselves. Justice and mercy are one in God, but we differentiate between them in reference to the objects towards which they are manifested, and the effects of these manifestations. Our God is inimitable and incomprehensible in His perfection, and consequently is simple and indivisible.

In God there can be no differentiation between various matters, for whatever would be essentially distinct from God would render Him imperfect. Our limited comprehension must deal with each matter individually, however, and thus we assign distinct names to each attribute. Whatever we are capable of comprehending concerning God is according to truth and is consistent with His Being, but our finite understanding cannot penetrate its perfection and infinity</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

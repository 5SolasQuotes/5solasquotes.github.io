<figure class="quote" id="q-3627cb522a" data-kw="">
<blockquote><p>Our own personal experience teaches us the reality of transient being; for experience the fact that many things that once did not exist now exist, as, for example, our present thoughts, sensations, and their objects. Further, we have experience of continuity from one moment of time to another, for our conscious life is not a mere succession of discrete instants but is something flowing and truly continuous, so that the last part of the past coincides with the first part of the future. However, this fact of continuity that we experience cannot be explained unless something from prior experience remains or endures in present experience. In other words our conscious life, although it is a whole that is continually changing and flowing, nevertheless contains within the whole certain elements or parts that are constant. But such constant things, even if their endurance is brief, have a true relative permanence… It also seems that the reality of the relatively permanent can be directly inferred from the essence itself of the transient. For if the transient were not also relatively permanent, it ought to begin and cease to be without any interval of duration. That which begins to be and that which ceases to be are simply opposed as to existence, so that a contradiction would be involved if they existed simultaneously. Therefore, in order to have something truly transient, there must be at least two instants of time one after the other. But these two instants are either separated by an interval or are so immediate to each other that there is no interval between them. But no instants of time are so united that one exists after the other without interval, and if there is some interval of time between the beginning to be of some being and its ceasing to be, then we have got something relatively permanent. Now whatever may be said about this argument, it certainly seems that a being which begins to be from nothing and then immediately afterwards altogether ceases to be, without any interval at all of duration, if it does not simply involve a contradiction, cannot exist in time at any rate and cannot naturally be known by us. Moreover, if such instants of immediate annihilation after production be multiplied even endlessly, they can never explain the experience of continuity that we in fact have. For just as a line is not the mere addition of points infinite in number, so neither is a continuous period of time the mere addition or sum of instants that lack, in themselves, all duration in time. This reasoning is confirmed by the fact that existence or being, namely the being we experience and which is the starting point for our metaphysical speculations cannot be conceived without duration. On the basis of this concession I argue as follows: although beginning to be or ceasing to be are said to happen in an instant or a moment, one may not argue that therefore we can have creation followed immediately afterwards without any duration by annihilation, just as neither may one argue: a point is the end of a line and as such lacks all dimension, so there can be two points so close together that no distance intervenes between them. Accordingly we can say that beginning to be cannot be had without duration, not precisely because a beginning directly includes duration (for it happens in an instant), but because beginning to be is impossible without existence and because existence involves duration. The like must be said of ceasing to be, or ceasing to be thus.</p></blockquote>

</figure><figure class="quote" id="q-d4512deee0" data-kw="">
<blockquote><p>We spoke above about the transient as to existence; the transient as to essence, on the contrary, is present if the quiddity or essence of the thing is a process or something flowing and becoming, for example time, a melody, organic life, the action of solving a mathematical problem. The permanent, by contrast, has its whole essence at once and not successively, as Peter, a tree, a table, the human soul.</p></blockquote>

</figure><figure class="quote" id="q-c9bfee1636" data-kw="">
<blockquote><p>When was time created? It is explained. Whether the day was first or night? The latter is affirmed. Whether the foreknowing of times and similar natural things are able to be predicted from the stars? It is distinguished. Whether through the inspection of an astrolabe and through an index of the stars it may be sinful to investigate future things? It is distinguished. Whether an event and actions which depend on the free will of men and are merely contingent by their nature, may be able to be certainly predicted from the stars? It is denied. Since there may be a twofold distinction for the year of the Old Testament, because there is a twofold entrance and twofold exit, which is better and older? It is explained. Whether time may be some precise thing understood from every operation? It is distinguished. Whether time may differ from motion in reality? It is denied with a distinction.</p></blockquote>

</figure><figure class="quote" id="q-f09f8805cf" data-kw="">
<blockquote><p>Eternity is God without beginning, without end and without all manner of succession; there is nothing past, nor to come. It was well said of him, who unto the question, ‘What was eternity?’ answered by that word of modesty, ‘I know not: It is the measure (without measure) of the duration of God, according to our apprehension.’ (Quid autem sit aeternitas, quaerat aliquis? Hîc si respondeam per verbum modestiae nescio recta ingenia per se intelligent, a byssum esse.) Three things are requisite thereunto, viz. to be without beginning, without end, and without all change: An unalterable and independing duration: It is all at once, where there is nothing past, nor to come; A remaining NOW. Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>

</figure><figure class="quote" id="q-b00ccbfa62" data-kw="">
<blockquote><p>According to Boethius “eternity is the total and perfect possession of unending life simultaneously” (Consolation of Philosophy 5.6). He expounds this definition as follows: “Whatever lives in time, proceeds in the present from the past to the future; for nothing is constituted in time that can embrace the whole extent of its life, but it does not yet grasp tomorrow and has already lost yesterday. That then which comprehends and as equally possesses the total fullness of unending life, and for which nothing of the future is absent and nothing of the past slipped away, is rightly held to be eternal.” In this definition are found the terms: a) ‘unending’, so that not only are beginning and ending excluded but their possibility too; b) ‘life’, so that the most perfect way of existing, namely as living, is expressed; c) ‘total and perfect possession simultaneously’, so that all succession and change are excluded and so that an eternal being is should to possess simultaneously the fullness of life. Such enduring existence, as will be seen later, belongs to God alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 3, article 2, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/eternity.html">Eternity</a></span></div>
<div class="actions"><button class="copy" data-copy="“According to Boethius “eternity is the total and perfect possession of unending life simultaneously” (Consolation of Philosophy 5.6). He expounds this definition as follows: “Whatever lives in time, proceeds in the present from the past to the future; for nothing is constituted in time that can embrace the whole extent of its life, but it does not yet grasp tomorrow and has already lost yesterday. That then which comprehends and as equally possesses the total fullness of unending life, and for which nothing of the future is absent and nothing of the past slipped away, is rightly held to be eternal.” In this definition are found the terms: a) ‘unending’, so that not only are beginning and ending excluded but their possibility too; b) ‘life’, so that the most perfect way of existing, namely as living, is expressed; c) ‘total and perfect possession simultaneously’, so that all succession and change are excluded and so that an eternal being is should to possess simultaneously the fullness of life. Such enduring existence, as will be seen later, belongs to God alone.”

he%20total%20and&amp;text=will%20be%20seen%20later%2C%20belongs%20to%20God%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But God’s eternity… is not mere longevity, but strict timelessness… not merely that God has existed throughout all past time, and will continue to exist throughout all future time. Rather, He exists outside of time altogether. This follows from both his immutability and his simplicity. If God existed within time, He would constantly be adding new seconds, days, and years to his life; would be acting at one moment in a way that differs from the way He acts at another moment; and… would constantly be acquiring new pieces of knowledge, such as the knowledge that it is now time t1, the knowledge that it is now time t2, and so forth. But all of this would involve change, and God is immutable. Hence, He does not exist within time, but rather timelessly. Furthermore, if God were in time, then there would be different stages of his life, each of which would be distinct from the others. In that case, He would have distinct parts. But God is simple or noncomposite, and thus without parts. Hence, He is timeless. Now, I have argued in earlier chapters that the existence of anything at any moment is ultimately caused by God. It might seem that that claim is incompatible with the claim that God is timeless. For if the existence of something at time t1, is caused by God, and the existence of something at time t2, is caused by God, doesn’t that entail that God is acting at time t1, and also acting at the later time t2? And doesn’t that in turn entail that God is in time? However, this does not follow. In particular, from the proposition that God causes it to be the case that such-and-such exists at time t1, it does not follow that at time t2, God causes it to be the case that such-and-such exists. It is not that at time t1, God causes some object to exist, then at a later time t2, carries out a second action of causing that thing to remain in existence, then at some yet later time t3, carries out a third action of causing it to remain in existence for a while longer, and so forth. It is rather that God, from outside of time, in a single act causes to exist a temporal world in which the object exists at times t1, t2, t3, and so on. You might compare his action to that of an author who comes up with an entire story in a single flash of insight. He determines, all at the same moment, what the beginning, middle, and end of the story will be. From the point of view of the characters in the story, what happens in the middle of the story follows what happened at the beginning and precedes what happens at the end. But the author himself did not first come up with the beginning, and then later the middle, and then later still the ending. Rather, he did it all at once.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Eternity’</span></figcaption>

<blockquote><p>It is one thing to speak of punishments properly so called and satisfactory, inflicted by a judge for the satisfaction of justice; another to speak of punishments improper and castigatory or medicinal. We do not deny that the latter are often appointed to believers, not by God, the Judge, but by God, the Father; not from hatred, but from love; not for vengeance, but for healing; not for destruction, but for correction. Hence Cyprian says: “The Lord chastises the saints that he may advance their holiness, and he advances their holiness that he may save them.” Thomas Aquinas says: “Before remission they are the punishments of sin, after remission they are the struggles and exercises of the saints.” And Augustine happily explains the difference between the punishments of the wicked and the chastisements of the pious: “All, both good and evil, are equally afflicted, nor by their afflictions can they be distinguished because what both suffer is not a distinction. For a distinction of sufferers remains even in a similarity of sufferings and even though, under the same pains, there is not the same virtue and vice; for as in the same fire gold shines and stubble smokes and by the same fan the chaff is blown away and the wheat purged; nor are dregs to be confounded with oil, because both are pressed in the same press. Thus one and the same inrushing power proves, purifies and refines the good; oppresses, ruins and destroys the bad. Hence under the same affliction, the wicked detest and blaspheme God, while the righteous pray to and praise him. So much difference does it make, not as to the kind of punishments, but as to the character of those who suffer them</p></blockquote>

<blockquote><p>The principal, and indeed the whole, contention lies in the point of number: whether two Gods may be admitted, by poetic license (if they must be), or pictorial fancy, or by the third process, as we must now add, of heretical depravity. But the Christian truth has distinctly declared this principle, “God is not, if He is not one;” because we more properly believe that has no existence which is not as it ought to be. In order, however, that you may know that God is one, ask what God is, and you will find Him to be not otherwise than one. So far as a human being can form a definition of God, I adduce one which the conscience of all men will also acknowledge,—that God is the great Supreme, existing in eternity, unbegotten, unmade, without beginning, without end. For such a condition as this must needs be ascribed to that eternity which makes God to be the great Supreme, because for such a purpose as this is this very attribute in God; and so on as to the other qualities: so that God is the great Supreme in form and in reason, and in might and in power. Now, since all are agreed on this point (because nobody will deny that God is in some sense the great Supreme, except the man who shall be able to pronounce the opposite opinion, that God is but some inferior being, in order that he may deny God by robbing Him of an attribute of God), what must be the condition of the great Supreme Himself? Surely it must be that nothing is equal to Him, i.e. that there is no other great supreme; because, if there were, He would have an equal; and if He had an equal, He would be no longer the great Supreme, now that the condition and (so to say) our law, which permits nothing to be equal to the great Supreme, is subverted. That Being, then, which is the great Supreme, must needs be unique, by having no equal, and so not ceasing to be the great Supreme. Therefore He will not otherwise exist than by the condition whereby He has His being; that is, by His absolute uniqueness. Since, then, God is the great Supreme, our Christian verity has rightly declared, “God is not, if He is not one.” Not as if we doubted His being God, by saying, He is not, if He is not one; but because we define Him, in whose being we thoroughly believe, to be that without which He is not God; that is to say, the great Supreme. But then the great Supreme must needs be unique. This Unique Being, therefore, will be God—not otherwise God than as the great Supreme; and not otherwise the great Supreme than as having no equal; and not otherwise having no equal than as being Unique. Whatever other god, then, you may introduce, you will at least be unable to maintain his divinity under any other guise, than by ascribing to him too the property of deity—both eternity and supremacy over all. How, therefore, can two great Supremes co-exist, when this is the attribute of the Supreme Being, to have no equal,—an attribute which belongs to One alone, and can by no means exist in two?</p></blockquote>

g; that is, by His absolute uniqueness. Since, then, God is the great Supreme, our Christian verity has rightly declared, “God is not, if He is not one.” Not as if we doubted His being God, by saying, He is not, if He is not one; but because we define Him, in whose being we thoroughly believe, to be that without which He is not God; that is to say, the great Supreme. But then the great Supreme must needs be unique. This Unique Being, therefore, will be God—not otherwise God than as the great Supreme; and not otherwise the great Supreme than as having no equal; and not otherwise having no equal than as being Unique. Whatever other god, then, you may introduce, you will at least be unable to maintain his divinity under any other guise, than by ascribing to him too the property of deity—both eternity and supremacy over all. How, therefore, can two great Supremes co-exist, when this is the attribute of the Supreme Being, to have no equal,—an attribute which belongs to One alone, and can by no means exist in two?”

— Tertullian, The Five Books against Marcion, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. Peter Holmes, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 1.3 (p. 273).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+principal%2C+and+indeed+the+whole%2C+contention+lies+in+the+point+of+number%3A+whether+two+Gods+may+be+admitted%2C+by+poetic+license+%28if+they+must+be%29%2C+or+pictorial+fancy%2C+or+by+the+third+process%2C+as+we+must+now+add%2C+of+heretical+depravity.+But+the+Christian+truth+has+distinctly+declared+this+principle%2C+%E2%80%9CGod+is+not%2C+if+He+is+not+one%3B%E2%80%9D+because+we+more+properly+believe+that+has+no+existence+which+is+not+as+it+ought+to+be.+In+order%2C+however%2C+that+you+may+know+that+God+is+one%2C+ask+what+God+is%2C+and+you+will+find+Him+to+be+not+otherwise+than+one.+So+far+as+a+human+being+can+form+a+definition+of+God%2C+I+adduce+one+which+the+conscience+of+all+men+will+also+acknowledge%2C%E2%80%94that+God+is+the+great+Supreme%2C+existing+in+eternity%2C+unbegotten%2C+unmade%2C+without+beginning%2C+without+end.+For+such+a+condition+as+this+must+needs+be+ascribed+to+that+eternity+which+makes+God+to+be+the+great+Supreme%2C+because+for+such+a+purpose+as+this+is+this+very+attribute+in+God%3B+and+so+on+as+to+the+other+qualities%3A+so+that+God+is+the+great+Supreme+in+form+and+in+reason%2C+and+in+might+and+in+power.+Now%2C+since+all+are+agreed+on+this+point+%28because+nobody+will+deny+that+God+is+in+some+sense+the+great+Supreme%2C+except+the+man+who+shall+be+able+to+pronounce+the+opposite+opinion%2C+that+God+is+but+some+inferior+being%2C+in+order+that+he+may+deny+God+by+robbing+Him+of+an+attribute+of+God%29%2C+what+must+be+the+condition+of+the+great+Supreme+Himself%3F+Surely+it+must+be+that+nothing+is+equal+to+Him%2C+i.e.+that+there+is+no+other+great+supreme%3B+because%2C+if+there+were%2C+He+would+have+an+equal%3B+and+if+He+had+an+equal%2C+He+would+be+no+longer+the+great+Supreme%2C+now+that+the+condition+and+%28so+to+say%29+our+law%2C+which+permits+nothing+to+be+equal+to+the+great+Supreme%2C+is+subverted.+That+Being%2C+then%2C+which+is+the+great+Supreme%2C+must+needs+be+unique%2C+by+having+no+equal%2C+and+so+not+ceasing+to+be+the+great+Supreme.+Therefore+He+will+not+otherwise+exist+than+by+the+condition+whereby+He+has+His+being%3B+that+is%2C+by+His+absolute+uniqueness.+Since%2C+then%2C+God+is+the+great+Supreme%2C+our+Christian+verity+has+rightly+declared%2C+%E2%80%9CGod+is+not%2C+if+He+is+not+one.%E2%80%9D+Not+as+if+we+doubted+His+being+God%2C+by+saying%2C+He+is+not%2C+if+He+is+not+one%3B+but+because+we+define+Him%2C+in+whose+being+we+thoroughly+believe%2C+to+be+that+without+which+He+is+not+God%3B+that+is+to+say%2C+the+great+Supreme.+But+then+the+great+Supreme+must+needs+be+unique.+This+Unique+Being%2C+therefore%2C+will+be+God%E2%80%94not+otherwise+God+than+as+the+great+Supreme%3B+and+not+otherwise+the+great+Supreme+than+as+having+no+equal%3B+and+not+otherwise+having+no+equal+than+as+being+Unique.+Whatever+other+god%2C+then%2C+you+may+introduce%2C+you+will+at+least+be+unable+to+maintain+his+divinity+under+any+other+guise%2C+than+by+ascribing+to+him+too+the+property+of+deity%E2%80%94both+eternity+and+supremacy+over+all.+How%2C+therefore%2C+can+two+great+Supremes+co-exist%2C+when+this+is+the+attribute+of+the+Supreme+Being%2C+to+have+no+equal%2C%E2%80%94an+attribute+which+belongs+to+One+alone%2C+and+can+by+no+means+exist+in+two%3F%E2%80%9D%0A%0A%E2%80%94+Tertullian%2C+The+Five+Books+against+Marcion%2C+ed.+Alexander+Roberts%2C+James+Donaldson%2C+and+A.+Cleveland+Coxe%2C+trans.+Peter+Holmes%2C+vol.+3%2C+The+Ante-Nicene+Fathers+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+1885%29%2C+1.3+%28p.+273%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F11fb7250a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/11fb7250a3.html">Permalink</a><a class="src" href="http </figure><figure class="quote" id="q-ee337ad3d7" data-kw="">
<blockquote><p>What is God’s simplicity? That attribute of God whereby He is free of all composition and distinction. God is free: a) Of logical composition; in Him there is no distinction between genus and species. b) Of natural composition; in Him there is no distinction between substance and form. c) Of supernatural composition; in Him there is no distinction between slumbering capacity and action. Proof texts: 1 John 1:5; 4:8; Amos 4:2; 6:8. The Socinians and Vossius deny this attribute in order better to escape the Trinity, that is, the oneness in being of the three Persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. and ed. Richard B. Gaffin, Jr. (Bellingham: Lexham Press, 2020), 19.</span></figcaption>

<blockquote><p>The divine Nature, is especially in perpetual operation by three attributes, the which do manifest the operation of God towards his creatures. These are his Wisdom, Will, and Omnipotency. The wisdom or knowledge of God, is that by the which God doth, not by certaine notions abstracted from the things themselves, but by his own essence: nor successively and by discourse of reason, but by one eternal and immutable act of understanding, distinctly and perfectly know himself, and all other things, though infinite, whether they have been or not. Mat. 11. 27. No man knoweth the son but the Father, nor the Father but the [note] Son, and he to whom the Son will reveale him. Heb. 4. 13. There is nothing created, which is not manifest in his sight: but all things are naked and open to his eyes, with whom we have to do, Psal. 147. 5. His wisdom is infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine</cite>, (1616)</span></figcaption>

<blockquote><p>Now Christian theology has always been more or less conscious of this calling. On the whole, its teaching has been that God is “simple,” that is, sublimely free from all composition, and that therefore one cannot make any real [i.e., ontological] distinction between his being and his attributes. Each attribute is identical with God’s being: he is what he possesses. In speaking of creatures we make all sorts of distinctions between what they are and what they have. A person, for example, is still human even though he or she has lost the image of God and has become a sinner. But in God all his attributes are identical with his being. God is light through and through; he is all mind, all wisdom, all logos, all spirit, and so forth. In God “to be is the same as to be wise, which is the same as to be good, which is the same as to be powerful. One and the same thing is stated whether it be said that God is eternal or immortal or good or just.” Whatever God is, he is that completely and simultaneously. “God has no properties but is pure essence. God’s properties are really the same as his essence: they neither differ from his essence nor do they differ materially from each other.”68 68. Augustine, The Trinity, VI, 7; John of Damascus, The Orthodox Faith, I, 9; T. Aquinas, Summa theol., I, qu. 2, art. 3; H. Heppe, Dogmatik der evangelisch-reformierten Kirche, 42, 51–53; H. F. F. Schmid, Doctrinal Theology of the Evangelical Lutheran Church, 122.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, trans. John Bolt and John Vriend, vol. 2 (Grand Rapids, MI: Baker Academic, 2004), 118.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now Christian theology has always been more or less conscious of this calling. On the whole, its teaching has been that God is “simple,” that is, sublimely free from all composition, and that therefore one cannot make any real [i.e., ontological] distinction between his being and his attributes. Each attribute is identical with God’s being: he is what he possesses. In speaking of creatures we make all sorts of distinctions between what they are and what they have. A person, for example, is still human even though he or she has lost the image of God and has become a sinner. But in God all his attributes are identical with his being. God is light through and through; he is all mind, all wisdom, all logos, all spirit, and so forth. In God “to be is the same as to be wise, which is the same as to be good, which is the same as to be powerful. One and the same thing is stated whether it be said that God is eternal or immortal or good or just.” Whatever God is, he is that completely and simultaneously. “God has no properties but is pure essence. God’s properties are really the same as his essence: they neither differ from his essence nor do they differ materially from each other.”68 68. Augustine, The Trinity, VI, 7; John of Damascus, The Orthodox Faith, I, 9; T. Aquinas, Summa theol., I, qu. 2, art. 3; H. Heppe, Dogmatik der evangelisch-reformierten Kirche, 42, 51–53; H. F. F. Schmid, Doctrinal Theology of the Evangelical Lutheran Church, 122.”

<blockquote><p>I. Although the knowledge of God is one and simple intrinsically no less than his essence, yet it can be considered in different ways extrinsically as to the objects. But it is commonly distinguished by theologians into the knowledge of simple intelligence (or natural and indefinite) and the knowledge of vision (or free and definite). The former is the knowledge of things merely possible and is therefore called indefinite because nothing on either hand is determined concerning them by God. The latter is the knowledge of future things and is called definite because future things are determined by the sure will of God. Hence they mutually differ: (1) in object because the natural knowledge is occupied with possible things, but the free about future things; (2) in foundation because the natural is founded on the omnipotence of God, but the free depends upon his will and decree by which things pass from a state of possibility to a state of futurition; (3) in order because the natural precedes the decree, but the free follows it because it beholds things future; now they are not future except by the decree. Proof that no such middle knowledge can be granted.

IX. The reasons are: (1) Natural and free knowledge embrace all knowable things and entities and are not to be multiplied unnecessarily. There is nothing in the nature of things which is not possible or future; nor can future conditional things constitute a third order. For they are such either from a condition only possible or powerful, yet never to take place, or from a condition certainly future and decreed. In the former manner, they do not recede from the nature of possible things and belong to natural knowledge; in the latter, they are future and decreed by God and come under the free knowledge.

X. (2) Things not true cannot be foreknown as true. Now conditional future things are not true apart from the determination of the divine will; for example, the Sidonians would have repented if the powers had been supplied to them, for they would have been indifferently disposed in their nature to repent or not to repent, those powers being given; therefore from some other source ought to come the truth that they would repent, those powers being posited, if it is at all true. But no cause of this thing can be imagined except the will of God. There was nothing from eternity which could be the cause of the determination of a thing indifferent to either part except the will of God; not his essence or knowledge, for neither can operate ad extra separated from the will. Therefore, as no effect can be understood as future (whether absolutely or hypothetically) without the divine decree (because no creature can be in the world without the divine causality), so no future conditional thing can be knowable before the decree.

XI. (3) If all the acts of the created will fall under the divine providence so that none are independent and indeterminate, no middle knowledge can be granted (which is supposed to have for its object the free determination of the will, depending upon no superior cause). Now that there is such a subjection of the created will is evident from the dependence between the first cause and second causes, between the Creator and creatures. Nor can it suffice to save that dependence that the will may be said to be created and its liberty given by God for it would not cease to be the principle of its own determination, if its acts did not depend upon some decree. It would not be indeed the first being, but yet it would be the first operator (nor any more the second, but the first cause because if it depended in being upon God, it would not depend upon him in operation).

XII. (4) No uncertain knowledge should be ascribed to God. The middle knowledge can have no certainty because it is occupied about an uncertain and contingent object (viz., the indifference [adiaphorian] of the will). I ask, therefore, whence can God certainly know what will or will not take place? For either this can be done from the nature of the things themselves when he regards them (either in their causes or in themselves) as free acts in a created will (which pleases Bellarmine)—but how can an uncertain thing afford foundation to certain knowledge—or this can be done from the infinity of divine knowledge, which certainly foreknows in what direction moral persuasion will incline the will (otherwise free) to the opposite (which Vasquez and Suarez hold); but how could infirmity of knowledge change the nature of things and see a thing as certainly to take place which is contingent? Again knowledge either makes the event certain or foresees it as certain. If it makes it so, how can it foreknow it as such; where then is the indifference of the will? If it foresees it as certain, how could the foresight of an uncertain and indifferent thing be itself certain? Or from the eternal existence of things by which they are said to be present to God (as others prefer); but since they could have no real being from eternity (but only an intentional), they cannot be said to have existed from eternity otherwise than by reason of the decree in which they obtain their futurition. Since, therefore, the certain necessity of the event cannot be founded on the contingent connection of the ends or on the knowledge which recognizes but does not make the thing, it follows that it is only from the efficacious decree of the connector. Thomas Aquinas says most satisfactorily, “He who knows an effect contingent in its own cause only and not in some superior cause certainly determining it, has only a conjectural knowledge concerning it; since from an indifferent cause as far as it is indifferent, a determinate act cannot flow; and for the same reason from a contingent antecedent, as far as it is contingent, a necessary conclusion cannot flow before the decree of the divine will” (ST, I, Q. 14, Art. 13, p. 83).

XIII. (5) This middle knowledge takes away the dominion of God over free acts because according to it the acts of the will are supposed to be antecedent to the decree and therefore have their futurition not from God, but from itself. Indeed God would seem rather to depend upon the creature while he could decree or dispose nothing, unless a determination of the human will were posited which God would see in such a connection of things. Nor ought the reply to be made that the dominion of God is not therefore taken away because he can remove that connection or some circumstance of it; for example, in the foreknowledge by which God knew that Peter would deny Christ if placed in a certain condition, God could hinder him from denying Christ by taking away some foreseen circumstance (for instance, the fear of death) or by adding greater light in the intellect and a greater inclination in the will to confession, and the like. For it is not sufficient for the support of the dominion of God that he could hinder Peter from denying Christ, for he might have deprived Peter of life before the apprehension of Christ (but this would be to have dominion over the life of Peter, not over his free will); but it is requisite that the free acts of Peter, of denying or not denying Christ, should depend upon him (which is denied on the supposition of this knowledge). In fine, if God can take away one foreseen circumstance, he can therefore change the event of the thing: if he can by a decree change the event of a thing, therefore it also pertains to the decree to procure it; for he who hinders the event by a removal of some circumstance ought to cause it by supplying the circumstances.

XIV. (6) On the supposition of such a knowledge, a reason for predestination can be assigned out of God besides his purpose and good pleasure (eudokian) because the foreseen consent of the will of Jacob placed in such circumstances would be at least the condition without which God could not predestine to salvation Jacob rather than Esau. But no reason for that election can be derived from Paul except the purpose (eudokian) of God: “For the children being not yet born, neither having done any good or evil” not on account of a foreseen good use of free will through middle knowledge, but “that the purpose of God according to election might stand, not of works, but of him that calleth; it was said, the elder shall serve the younger” (Rom. 9:11, 12*). Nor should it be said that this condition is assigned on the part of God who has the knowledge, not of men; for although it is God who foreknows, yet the object which he foreknows is maintained to be the good use of free will foreseen before the decree, so that the reason of the decree is put not in God, but in man. Thus grace might with greater propriety be called the servant of the human inclination than the mistress, and the companion than the cause, making God depend upon man rather than man upon God.</p></blockquote>

n+some+superior+cause+certainly+determining+it%2C+has+only+a+conjectural+knowledge+concerning+it%3B+since+from+an+indifferent+cause+as+far+as+it+is+indifferent%2C+a+determinate+act+cannot+flow%3B+and+for+the+same+reason+from+a+contingent+antecedent%2C+as+far+as+it+is+contingent%2C+a+necessary+conclusion+cannot+flow+before+the+decree+of+the+divine+will%E2%80%9D+%28ST%2C+I%2C+Q.+14%2C+Art.+13%2C+p.+83%29.+XIII.+%285%29+This+middle+knowledge+takes+away+the+dominion+of+God+over+free+acts+because+according+to+it+the+acts+of+the+will+are+supposed+to+be+antecedent+to+the+decree+and+therefore+have+their+futurition+not+from+God%2C+but+from+itself.+Indeed+God+would+seem+rather+to+depend+upon+the+creature+while+he+could+decree+or+dispose+nothing%2C+unless+a+determination+of+the+human+will+were+posited+which+God+would+see+in+such+a+connection+of+things.+Nor+ought+the+reply+to+be+made+that+the+dominion+of+God+is+not+therefore+taken+away+because+he+can+remove+that+connection+or+some+circumstance+of+it%3B+for+example%2C+in+the+foreknowledge+by+which+God+knew+that+Peter+would+deny+Christ+if+placed+in+a+certain+condition%2C+God+could+hinder+him+from+denying+Christ+by+taking+away+some+foreseen+circumstance+%28for+instance%2C+the+fear+of+death%29+or+by+adding+greater+light+in+the+intellect+and+a+greater+inclination+in+the+will+to+confession%2C+and+the+like.+For+it+is+not+sufficient+for+the+support+of+the+dominion+of+God+that+he+could+hinder+Peter+from+denying+Christ%2C+for+he+might+have+deprived+Peter+of+life+before+the+apprehension+of+Christ+%28but+this+would+be+to+have+dominion+over+the+life+of+Peter%2C+not+over+his+free+will%29%3B+but+it+is+requisite+that+the+free+acts+of+Peter%2C+of+denying+or+not+denying+Christ%2C+should+depend+upon+him+%28which+is+denied+on+the+supposition+of+this+knowledge%29.+In+fine%2C+if+God+can+take+away+one+foreseen+circumstance%2C+he+can+therefore+change+the+event+of+the+thing%3A+if+he+can+by+a+decree+change+the+event+of+a+thing%2C+therefore+it+also+pertains+to+the+decree+to+procure+it%3B+for+he+who+hinders+the+event+by+a+removal+of+some+circumstance+ought+to+cause+it+by+supplying+the+circumstances.+XIV.+%286%29+On+the+supposition+of+such+a+knowledge%2C+a+reason+for+predestination+can+be+assigned+out+of+God+besides+his+purpose+and+good+pleasure+%28eudokian%29+because+the+foreseen+consent+of+the+will+of+Jacob+placed+in+such+circumstances+would+be+at+least+the+condition+without+which+God+could+not+predestine+to+salvation+Jacob+rather+than+Esau.+But+no+reason+for+that+election+can+be+derived+from+Paul+except+the+purpose+%28eudokian%29+of+God%3A+%E2%80%9CFor+the+children+being+not+yet+born%2C+neither+having+done+any+good+or+evil%E2%80%9D+not+on+account+of+a+foreseen+good+use+of+free+will+through+middle+knowledge%2C+but+%E2%80%9Cthat+the+purpose+of+God+according+to+election+might+stand%2C+not+of+works%2C+but+of+him+that+calleth%3B+it+was+said%2C+the+elder+shall+serve+the+younger%E2%80%9D+%28Rom.+9%3A11%2C+12%2A%29.+Nor+should+it+be+said+that+this+condition+is+assigned+on+the+part+of+God+who+has+the+knowledge%2C+not+of+men%3B+for+although+it+is+God+who+foreknows%2C+yet+the+object+which+he+foreknows+is+maintained+to+be+the+good+use+of+free+will+foreseen+before+the+decree%2C+so+that+the+reason+of+the+decree+is+put+not+in+God%2C+but+in+man.+Thus+grace+might+with+greater+propriety+be+called+the+servant+of+the+human+inclination+than+the+mistress%2C+and+the+companion+than+the+cause%2C+making+God+depend+upon+man+rather+than+man+upon+God.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+3+vol.+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+1.212%E2%80%9316.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f2da85dbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f2da85dbd.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/08/turretin-contra-middle-knowledge/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-a933512888" data-kw="">
<blockquote><p>The effect or manner of God’s love is, that God makes the person happy whom he loves. For he doth amply reward that joy and delight which he takes in the holiness and obedience of the Elect, while he pours plentifully upon them all gifts, both of grace and of glory [1 John 4:16; John 3:35; Rom 5:8; Mal. 1:2]. This love of God to the elect is (1) Free, Hos. 5:15. He was moved with nothing but his own goodness [1 John 4:10, 19]. (2) Sure, firm, and unchangeable, Rom. 5:8, 10; 1 John 4:10; John 13:1 and 13:3. Infinite and Eternal, which shall never alter, John 3:16. (3) Effectual, as is declared both by his temporal and eternal blessings, 1 John 3:1. (4) Great and ardent, John 3:16 and 15:13; Rom. 5:6, 7. God bestows pledges of his love and favor upon them whom he has chosen, and sometimes he sheds the sense of his love abroad in their hearts [cf. Rom. 5:5; 8:1, 2]</p></blockquote>

</figure><figure class="quote" id="q-e6c6b7f3a6" data-kw="">
<blockquote><p>Hitherto we have spoken of the perfection of Gods nature: Now followeth the life of GOD, by which the Divine Nature is in perpetual action, living, and moving in it self. Psal. 42. 2. My soule thirsteth for God, even for the living God, when shall I come and appeare before the presence of God? Heb. 3. 12. See there be not at any time in any of you an evel heart to depart [note] from the living God. The divine Nature, is especially in perpetual operation by three attributes, the which do manifest the operation of God towards his creatures. These are his Wisdom, Will, and Omnipotency. The wisdom or knowledge of God, is that by the which God doth, not by certaine notions abstracted from the things themselves, but by his own essence: nor successively and by discourse of reason, but by one eternal and immutable act of understanding, distinctly and perfectly know himself, and all other things, though infinite, whether they have been or not. Mat. 11. 27. No man knoweth the son but the Father, nor the Father but the [note] Son, and he to whom the Son will reveale him. Heb. 4. 13. There is nothing created, which is not manifest in his sight: but all things are naked and open to his eyes, with whom we have to do, Psal. 147. 5. His wisdom is infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine</cite>, (1616), 12.</span></figcaption>

<blockquote><p>From the points which have been so far upheld against middle knowledge it is clear that the whole difficulty in the present controversy reduces to this one point: Could free conditioned things, from eternity indifferent by nature to futurition or nonfuturition, have passed over into the state of a future event otherwise than by the divine decree? This is the fundamental of fundamentals, on which the whole weight of the case rests. This is that postulate, which both we cannot concede to our adversaries and they cannot prove to us. …Middle knowledge is effective and congruous for any end by its nature. Upon it God is forced to wait in the wise framing of His decrees, which are bound to have a fixed result. The truth or falsity of future conditioned free ones is not known from their causes or from the divine decree, but from the actual occurrence of the thing. Before every act of His will God can see certainty in things quite uncertain by their nature. In short, there is an ens independent of the supreme ens.</p></blockquote>

</figure><figure class="quote" id="q-f43b1ed2ce" data-kw="">
<blockquote><p>God is Jehovah, and he changes not in his essence. We cannot tell you what Godhead is. We do not know what substance that is which we call God. It is an existence, it is a being; but what that is, we know not. However, whatever it is, we call it his essence, and that essence never changes. The substance of mortal things is ever-changing. The mountains with their snow-white crowns, doff their old diadems in summer, in rivers trickling down their sides, while the storm cloud gives them another coronation; the ocean, with its mighty floods, loses its water when the sunbeams kiss the waves, and snatch them in mists to heaven; even the sun himself requires fresh fuel from the hand of the Infinite Almighty, to replenish his ever-burning furnace.

All creatures change. Man, especially as to his body, is always undergoing revolution. Very probably there is not a single particle in my body which was in it a few years ago. This frame has been worn away by activity, its atoms have been removed by friction, fresh particles of matter have in the meantime constantly accrued to my body, and so it has been replenished; but its substance is altered. The fabric of which this world is made is ever passing away; like a stream of water, drops are running away and others are following after, keeping the river still full, but always changing in its elements.

But God is perpetually the same. He is not composed of any substance or material, but is spirit—pure, essential, and ethereal spirit—and therefore he is immutable. He remains everlastingly the same. There are no furrows on his eternal brow. No age hath palsied him; no years have marked him with the mementoes of their flight; he sees ages pass, but with him it is ever now. He is the great I AM—the Great Unchangeable.

Mark you, his essence did not undergo a change when it became united with the manhood. When Christ in past years did gird himself with mortal clay, the essence of his divinity was not changed; flesh did not become God, nor did God become flesh by a real actual change of nature; the two were united in hypostatical union, but the Godhead was still the same. It was the same when he was a babe in the manger, as it was when he stretched the curtains of heaven; it was the same God that hung upon the cross, and whose blood flowed down in a purple river, the self-same God that holds the world upon his everlasting shoulders, and bears in his hands the keys of death and hell. He never has been changed in his essence, not even by his incarnation; he remains everlastingly, eternally, the one unchanging God, the Father of lights, with whom there is no variableness, neither the shadow of a change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Immutability of God. Delivered on Sabbath Morning, January 7th, 1855 in New Park Street Pulpit</cite></span></figcaption>

<blockquote><p>Whatever is in God is essential to Him and to that end the very nature and essence of God. Therefore, God’s righteousness is God’s very essence, whereby He wills and does all things justly according to His law. For in the moral law, God expressed to us His righteousness and nature. Holiness in God embraces the highest of all God’s virtues—wisdom, righteousness, power, mercy, goodness, et cetera. This is what elsewhere is called goodness, as in Psalm 143:10, “Your good Spirit leads me through an upright journey,” and the light of God (1 John 1:5). And this is about these in God, in the ideal Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 3364-3368.</span></figcaption>

</figure><figure class="quote" id="q-6c64db98ae" data-kw="">
<blockquote><p>This Argument which the Atheists do assume, drawn from the Eternity of the World may be retorted against them, for if a thing Corporeal, Finite, Material, so gross, and so imperfect as this World is, can nevertheless have been, and subsisted from all Eternity, as now it is existent; how much more is it according to right Reason to constitute a spiritual, immaterial, infinite, and eternal Essence, subsisting of it self which is nothing else but the Deity? For by how much the more things are immaterial and spiritual, by so much the greater activity have they, and consequently are more able to subsist and last longer, as is seen in Souls, Angels, and Spirits. Moreover we see that this World is corruptible almost in all its parts, which are in perpetual vicissitudes &amp; changes of being and not being, which doth argue that it draweth towards its end, and that finally it will be dissolved, for the whole participates of the Nature of its parts, and cannot be contrary to them, now how can that have been from all Eternity, and without any Beginning, that draweth to an end, and that at last will come to it? For if hitherto it hath endured infinitely, it may do the same for the future, if it cannot last for the future, it is clearly evident that it cannot have been from all Eternity.

If then the World hath neither been, nor can be supposed to have existed from all Eternity, it hath necessarily had a Beginning, and since nothing can produce it self, we must conclude, That it hath been produced by some one that hath had no Beginning, but hath been from all Eternity, who is no other but God himself; otherwise we must affirm that this Architect of the world hath been produced by some other, and this also by another, and so to the infinite, which is grossly absurd.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), pp 17-18.</span></figcaption>

</figure><figure class="quote" id="q-1fceec7d24" data-kw="">
<blockquote><p>Let him who wishes to contemplate the invisible things of God in the unity of his essence fix his attention first on being itself, and let him see that being itself is so certain in itself that it cannot be thought not to be. For pure being occurs only in full flight from nonbeing just as nothing is in full flight from being. Therefore, just as absolute nothing has nothing of being or its attributes, so contrariwise being itself has nothing of nonbeing either in act or potency, either in objective truth or in our estimation.

Since nonbeing is the privation of being, it does not come into our understanding except through being; but being does not come to us through something else because everything which is understood is understood as nonbeing or being in potency or being in act. If, therefore, nonbeing can be understood only through being and being in potency only through being in act, and if being signifies the pure act of being, then being is what first comes into the intellect and this being is pure act. But this is not particular being, which is limited because mixed with potency; nor is it analogous being because that has only a minimum of actuality because it has only a minimum of being. It remains that the being in question must be divine Being.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Let him who wishes to contemplate the invisible things of God in the unity of his essence fix his attention first on being itself, and let him see that being itself is so certain in itself that it cannot be thought not to be. For pure being occurs only in full flight from nonbeing just as nothing is in full flight from being. Therefore, just as absolute nothing has nothing of being or its attributes, so contrariwise being itself has nothing of nonbeing either in act or potency, either in objective truth or in our estimation.

Since nonbeing is the privation of being, it does not come into our understanding except through being; but being does not come to us through something else because everything which is understood is understood as nonbeing or being in potency or being in act. If, therefore, nonbeing can be understood only through being and being in potency only through being in act, and if being signifies the pure act of being, then being is what first comes into the intellect and this being is pure act. But this is not particular being, which is limited because mixed with potency; nor is it analogous being because that has only a minimum of actuality because it has only a minimum of being. It remains that the being in question must be divine Being.”

</figure><figure class="quote" id="q-58370bd530" data-kw="">
<blockquote><p>Internal or real Virtue consists in an inward Temper and Disposition of Mind, which is like to God and conformable to the moral Perfections of his Nature; such as Holiness, Justice, Goodness and Truth. And this internal, divine Principle will naturally produce a Course of external Actions conformable to it, as the natural Effect and Expression of it. And the ultimate End and Design of a Person endued with this Principle, will be to act in Conformity to the divine Perfections, and to do all to the Glory of God.

… External or apparent Virtue is such an external Conduct as may seem to be the visible Effect or Expression of this inward divine Principle; but, in Reality, is not; and proceeds from some lower Motive, such as Self-Interest, Honour, Fancy, or the like. Thus a Man may devote a considerable Part of his Estate to public Uses civil and sacred, may be just and beneficent to his Neighbour, punctual to his Promises, and abstain from all bodily Excesses; and yet, in all these Things, have no Regard to God, but only to himself, to his own Interest, Reputation or Fancy.

Although the Matter of these Actions is just and right, and agreeable to the divine Law; yet, as they do not proceed from a true Principle and right End, they are not really virtuous, nor so accounted by the Searcher of Hearts. Indeed the Heathen, who had no higher Principle, generally accounted such Actions to be virtuous; but divine Revelation teaches us, that there can be no virtuous Actions without a divine Temper of Mind, in Conformity to the Perfections of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-clap.html">Thomas Clap</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay on the nature and foundation of moral virtue and obligation; being a short introduction to the study of ethics; for the use of students of Yale-College</cite>, (New Haven: B. Mecom, 1765), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>It much helps us in the contemplation of the Simplicity of God, to look upon it as opposed to Composition, all the ways whereof the Learned have referred to these seven Heads.

Composition is either of

Obj. Where there is a Plurality, there is not Simplicity: But in the divine Nature there is a Plurality: therefore.

Ans. The Objection holds, where there is a plurality of Essences, Beings, or things, but not where there is only a plurality of Subsistences. In the divine Nature, though there be a Trinity, therefore a plurality of Subsistences or Persons, yet there is but one Essence: In the Trinity there is distinction, but not composition.

Obj. 2. The Attribute of Simplicity concludes that all the Attributes are God himself, and consequently that there is no inequality amongst them: yet we read, that his tender mercies are over all his works; so, as it may seem, Mercy exceeds the other Attributes.

Ans. The meaning is, that his mercy is over, that is, upon all his works; not that God’s Mercy exceeds all his other Attributes, as if one Attribute were greater then another: for all the Attributes of God are equal, not one higher or greater then another, because they are all God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), pp 5-7.</span></figcaption>

<blockquote><p>Mat. x. 37, ‘He that loveth father or mother more than me, is not worthy of me.’ And to love anything more than Christ, is to hate him. A less degree of love is called hatred in Scripture, Gen. xxix. 30, 31. Because he loved Leah less than Rachel, he is said to hate her. Even as you may be said to hate your relations, enjoyments, lives, when you love them less than Christ, so much less as you will be content to part with them for his sake, whenever he requires it. And in this sense you must be able to hate them, or else you cannot be the disciples of Christ, or else you are not Christians; for upon these terms, and no other, will he own you for such.</p></blockquote>

<blockquote><p>THE Unchangeableness of God is one of those Perfections of his, whereby he is, in a peculiar manner, distinguished from the Creatures. The Creatures are made up of Changes. Their Beings, Life, Conditions, are subject to many Changes. But God knows none of these Changes, his Being is most immutable, his Life the most even, constant, Uniform, serene Life; his Happiness at all times alike and the Same. God doth always abide in the same likeness, says one of the Ancients, with him there is no Variableness nor shadow of Change. Now there is an instinct in us, whereby we are carried out to desire unchangeableness. Everything doth naturally desire its Perfection; Man therefore being a reasonable Creature, finding himself subject to many Changes, longs after a perfect State, which is to be Unchangeable, he would fain come to an Unchangeable Life, to an Unchangeable Happiness. Now what we cannot find, or attain unto in our selves, we should aspire after, by attaining Union and Conjunction with our Maker.

Everything is made perfect by reaching or attaining its First Cause or Principle. God is the Fountain of Life, the Fountain of Unchangeableness, so far as unchangeableness is communicable to the Creatures. Indeed, in a strict and proper sense Unchangeableness is one of the Incommunicable Attributes of God, none but God is simply and absolutely Unchangeable, or can be so. It implies a Contradiction to suppose a Creature, and that Creature intrinsically and in its own Nature, not to be under a possibility of Change; but yet after a sort, the Creatures may be made Unchangeable, in having an Unchangeable Life, an Unchangeable Happiness given to them by some kind of participation of God, who is the chief Good, and who hath all Life and Happiness in himself.

Thus the holy Angels, who are not simply and absolutely unchangeable in themselves, do yet enjoy an unchangeable Life and Happiness, in way of donation and Communication, by the sight of God, and Communion with God. We should therefore aspire after the sight of God, and press after the most perfect adherence to him. God only is the Centre of Unchangeableness, and by fixing our hearts in him, we shall, after a sort, become unchangeable. Join thy heart to Eternity, (says Austin [Augustine]) and thou thy self shalt be eternal.</p></blockquote>

<blockquote><p>It was not possible for a mortal creature to give a higher document of love to God than by sacrificing for His sake a dearly beloved and only son. The whole history is so amazing that we know not whether we should most admire the strange commandment or the unparalleled obedience. Even so, it was not possible for the immortal God to give a nobler demonstration of love to men than by delivering for their sake His only begotten Son to die for their offenses: “Greater love hath no man than this, that a man lay down his life for his friends” (John 15:13). The whole transaction, from first to last, is of such uncommon nature and so foreign to every human plan for acceptance with God that to the wise Greeks it was mere foolishness and to the Jews a stumbling block. As Abraham could not without faith have acquiesced in the precept, no more can we without faith acquiesce in the gospel plan. He consulted not with Sarah when he was called to obey; and when we are called to believe, we must not consult with vain philosophy.

Though in the mystery of redemption there is a depth of wisdom, thy line, O reason, is too short to sound its bottom. Reason, especially in its depraved state, may not unfitly be compared to the patriarch’s ass, which stayed at the foot of the hill but ascended not with Isaac to the sacrifice. It is the province of faith alone to ascend this hill of the Lord and comprehend the love of God “which passeth knowledge” (Eph. 3:19). Isaac, it is true, was not sacrificed, and there was no need that God should raise him from the dead, as the patriarch perhaps expected.

But as he was in a manner a dead man during all the three days that intervened betwixt the sentence being passed against him and the reversing of it by the heavenly voice, it may be truly said that “in a figure” he was received “from the dead” (Heb. 11:19). Exactly so, our true Isaac was received on the third day from the dead, not in a figure only. Like Isaac, He felt no harm, but, “O death, He was thy plague; O grave, He was thy destruction.” Like Isaac, He returned to His Father’s house from whence He came and became a Father of many nations, who are begotten again to a lively hope by His resurrection from the dead; for thus the prophet Isaiah foretells, with admirable plainness and propriety, “When thou [O heavenly Father] shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand” (Isa. 53:10).

Forbear, ye children of men, anxiously to inquire, “Wherewith shall I come before the LORD, and bow myself before the high God?… shall I give my firstborn for my transgression, the fruit of my body for the sin of my soul?” (Mic. 6:6–7). For lo, He has given His firstborn to atone for your transgression, and the Son of His love to expiate the sin of your souls by the sacrifice of Himself. “He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?” (Mic. 6:8).</p></blockquote>

ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1a9805cad.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/08/19/william-mcewen-on-the-love-of-god-displayed-in-the-sacrifice-of-christ-our-isaac/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It is easy for the wicked to conceive an evil design, and it is beyond doubt that God’s power so keeps their evil will within certain limits that they are unable to get what they covet without God’s permission. No one ever so little instructed in religious doctrine but knows that God’s wisdom and justice make use even of the evil works they do with an evil intention to achieve His own designs and decrees, when he sees that the most merciful will of God the Father who did not spare even His own Son, but delivered Him up for us all, was carried out by the wicked will of the traitor Judas and of the Jews, and when he reads in the Gospel that when Pilate said to Jesus: Speakest thou not to me? Knowest thou not that I have power to crucify thee, and I have power to release thee? our Lord answered: Thou shouldst not have any power against me, unless it were given thee from above.

Accordingly, God governs light and darkness. Darkness is not without guilt because God makes use of it for a good purpose and disposes that even the works of darkness should result in the good of the sons of light, allowing the wickedness of men bent on doing them harm to exact extent that He knows it will be helpful to chastise or to test His saints. And so, even when they go against God’s will, they yet fulfil that very will.</p></blockquote>

</figure><figure class="quote" id="q-09af279f89" data-kw="">
<blockquote><p>God is simple. We must comprehend Him with reverence and proclaim Him with piety. We must not, however, strive to apprehend Him by reasoning, but we must adore Him, for a nature that is limited and weak does not perceive the mystery of an infinite and omnipotent nature by its own power of comprehension. Hence, He is not changeable as if the Godhead were made up of parts, so that in Him the will comes after inaction, speech after silence, work after rest; nor are we to imagine that He only wills something when an incentive for the will is present or that He cannot say anything unless the words are spoken after silence; nor are we to look upon Him as doing nothing unless He proceeds to work.

He from whom every nature has derived its laws is not subject to the laws of nature, nor is He who transcends every measure of power limited in anything, either by weakness or by a change in His actions according to the Lord’s words: ‘Father, all things are possible to thee,’ so that the human mind cannot grasp as much as lies within His power. Similarly, He has not deprived Himself of the strength of His own omnipotence, as He states: ‘For everything that the Father does, the Son also does the same in like manner.’ No labour is required where there is no weakness, for a power that is unable to produce is inferior to a power for which there is no difficulty. The nature of what is done with difficulty is the result of the weakness of its power, since a power that requires no labour is unlimited in its strength and is not held captive by the law of weakness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, (c. 356-60), trans. Stephen McKenna, The Fathers of the Church: A New Translation, vol. 25 (Washington D.C.: The Catholic University of America Press, 1954), 9.72, pp 394-95.</span></figcaption>

</figure><figure class="quote" id="q-0086f61fe4" data-kw="">
<blockquote><p>Only let us cut ourselves off from passion, lest any root of bitterness springing up trouble us; only let us follow the image; only let us reverence our Archetype. Cut off the bodily passions; cut off also the spiritual. For by how much the soul is more precious than the body, by so much more precious is it to cleanse the soul than the body. And if cleansing of the body be a praiseworthy act, see, I pray you, how much greater and higher is that of the soul.

Cut away the Arian impiety; cut away the false opinion of Sabellius; do not join more than is right, or wrongly sever; do not either confuse the Three Persons into One, or make Three diversities of Nature. The One is praiseworthy if rightly understood; and the Three when rightly divided, when the division is of Persons, not of Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 22 in Nicene and Post-Nicene Fathers 2, 7: 344.</span></figcaption>

</figure><figure class="quote" id="q-0a705e8a69" data-kw="">
<blockquote><p>§ 4. For God is a being infinitely and absolutely perfect. He has all those Perfections which are contained or implied in the Words good, right, excellent, amiable, and all other Words of the like Import—all those Perfections which can possibly exist, or that can be conceived of by the most perfect Intelligent: For there can be no Limitation of Perfection in a necessary and self-existent Being.

§ 5. Indeed we get the Idea of a Perfection from those small Degrees of Perfection which we observe in the Creatures, and then we ascribe all Perfections to God, in an infinite Degree; and unite them all in the Idea of ONE ALL-PERFECT BEING.

§ 6. So that, in the Order of our Conceptions, we conceive of a Perfection as existing in the Creature, before we conceive of it as existing in God, and generally (it may be) before we have any Idea of God at all. And therefore we are apt to conceive (or, at least, to use some Expressions as if we did conceive) some Perfections to have an independent Existence out of God, and prior to him; and as if we would try him by that Standard, and approve of his Qualities according as we conceived them to be agreeable to it. But this is a great Mistake: For all Perfection is originally in God, as the primary Foundation and Standard, and from that Fountain is communicated to the Creatures, in various limited Degrees, according to their several Ranks and Orders.

§ 7. As his Being includes and comprehends all Perfection; so no Perfection can possibly exist in the Creature, or be conceived by him, but what first existed in the Creator: Neither can it have any innate Excellency or permanent Existence, but only so far as it resembles Something in God, and is dependent upon him. The Perfection of the Creature consists in his Resemblance or Conformity to God; but the Perfection of God consists in his being what he is, or like to himself, as the primary Standard; without any antecedent or concomitant Rule or Standard to measure himself by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-clap.html">Thomas Clap</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay on the nature and foundation of moral virtue and obligation; being a short introduction to the study of ethics; for the use of students of Yale-College</cite>, (New Haven: B. Mecom, 1765), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/spirituality-and-aseity.html">Spirituality and Aseity</a></span></div>

</figure><figure class="quote" id="q-b648ec2c61" data-kw="">
<blockquote><p>That necessary Being is most unmixed or purest Being. Without allay. That is pure which is full of it self. Purity is not here meant in a corporeal sense (which few will think) nor in the moral; but as with Metaphysicians it signifies simplicity of essence. And in its present use is more especially intended to signify that simplicity which is opposed to the composition of act, and possibility. We say then that necessary Being imports purest actuality. Which is the ultimate and highest perfection of Being. For it signifies no remaining possibility, yet unreplete, or not filled up, and consequently the fullest exuberancy and entire confluence of all Being, as in its fountain and original source. We need not here look further to evince this than the native import of the very terms themselves; necessity and possibility; the latter whereof is not so fitly said to be excluded the former (as contingency is) but to be swallowed up of it; as fulness takes up all the space which were otherwise nothing but vacuity or emptiness. It is plain then that necessary Being, engrosses all possible Being, both that is, and (for the same reason) that ever was so. For nothing can be or ever was in possibility to come into Being, but what either must spring, or hath sprung, from the necessary self-subsisting Being.

So that unto all that vast possibility, a proportionable actuality of this Being must be understood to correspond. Else the other were not possible. For nothing is possible to be produced which is not within the actual productive power of the necessary Being. I say within its actual productive power, for if its power for such production were not already actual, it could never become so, and so were none at all. Inasmuch as necessary being can never alter, and consequently can never come actually to be, what it, already, is not (upon which account it is truly said, In aeternis posse &amp; esse sunt idem.) Wherefore in it, is nothing else but pure actuality, as profound and vast, as is the utmost possibility of all created or producible Being, i. e. It can be nothing other than it is, but can do all things (of which more hereafter.) It therefore stands opposed not only (more directly) to impossibility of Being (which is the most proper notion of no-Being) but some way, even to possibility also; That is the possibility of being any thing but what it is; as being every way complete, and perfectly full already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The living temple, or, A designed improvement of that notion that a good man is the temple of God</cite>, (London: John Starkey, 1675), pp 150-52.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That necessary Being is most unmixed or purest Being. Without allay. That is pure which is full of it self. Purity is not here meant in a corporeal sense (which few will think) nor in the moral; but as with Metaphysicians it signifies simplicity of essence. And in its present use is more especially intended to signify that simplicity which is opposed to the composition of act, and possibility. We say then that necessary Being imports purest actuality. Which is the ultimate and highest perfection of Being. For it signifies no remaining possibility, yet unreplete, or not filled up, and consequently the fullest exuberancy and entire confluence of all Being, as in its fountain and original source. We need not here look further to evince this than the native import of the very terms themselves; necessity and possibility; the latter whereof is not so fitly said to be excluded the former (as contingency is) but to be swallowed up of it; as fulness takes up all the space which were otherwise nothing but vacuity or emptiness. It is plain then that necessary Being, engrosses all possible Being, both that is, and (for the same reason) that ever was so. For nothing can be or ever was in possibility to come into Being, but what either must spring, or hath sprung, from the necessary self-subsisting Being.

So that unto all that vast possibility, a proportionable actuality of this Being must be understood to correspond. Else the other were not possible. For nothing is possible to be produced which is not within the actual productive power of the necessary Being. I say within its actual productive power, for if its power for such production were not already actual, it could never become so, and so were none at all. Inasmuch as necessary being can never alter, and consequently can never come actually to be, what it, already, is not (upon which account it is truly said, In aeternis posse &amp; esse sunt idem.) Wherefore in it, is nothing else but pure actuality, as profound and vast, as is the utmost possibility of all created or producible Being, i. e. It can be nothing other than it is, but can do all things (of which more hereafter.) It therefore stands opposed not only (more directly) to impossibility of Being (which is the most proper notion of no-Being) but some way, even to possibility also; That is the possibility of being any thing but what it is; as being every way complete, and perfectly full already.”

<blockquote><p>And does not reason confirm the same truth? For, 1st, if God be not just, whence is there any justice? Either there would be no justice at all, or if there was any, it would not proceed from God; or if it did, it must proceed from one who had none; each of which particulars is absurd.

Besides, 2d, inasmuch as the Lord is governor of the whole universe, he would degenerate into a tyrant if he was not just; and, 3d, seeing Jehovah is judge of all the earth, how could he judge aright without being just himself? Neither can it be otherwise but that God should be just, seeing that he is absolutely perfect. All confess justice to be an excellency, involving no imperfection in it, and therefore it cannot bet wanting to that being, who is absolutely and infinitely perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gilbert-tennent.html">Gilbert Tennent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Justice of God in Sermons and Essays by the Tennents and their Contemporaries, Compiled by the Board</cite></span></figcaption>

</figure><figure class="quote" id="q-6caef26988" data-kw="">
<blockquote><p>That God is a simple act is the next thing excepted against and decried, name and thing; in the room whereof, that he is compounded of matter and form, or the like, must be asserted. Those who affirm God to be a simple act do only deny him to be compounded of divers principles, and assert him to be always actually in being, existence, and intent operation. God says of himself that his name Ehejeh, and he is I am, — that is, a simple being, existing in and of itself; and this is that which is intended by the simplicity of the nature of God, and his being a simple act. The Scripture tells us he is eternal, I am, always the same, and so never what he was not ever.

This is decried, and in opposition to it his being compounded, and so obnoxious to dissolution, and his being in potentia, in a disposition and passive capacity to be what he is not, is asserted; for it is only to deny these things that the term “simple” is used, which he condemns and rejects. And this is the second instance that Mr B. gives in the description of his God, by his rejecting the received expressions concerning him who is so: “He is limited, and of us to be comprehended; his essence and being consisting of several principles, whereby he is in a capacity of being what he is not.” Mr [John] B[iddle]., solus habeto; I will not be your rival in the favour of this God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 24 vols, Edinburgh: Banner of Truth, 1966), 12: 70-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>In heathen superstitions, it will generally be found that the objects to which divine honours are rendered, are little more than a deification of the passions of the worshipper. And the same principles which lead to the formation of a national mythology determine the mode of the worship; which partakes of the limited nature, as well as the corrupt condition of fallen man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-welsh.html">David Welsh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Limits and Extent of the Right of Private Judgment: Being the Substance of a Sermon, Preached in the Church of St Giles on Thursday, the 18th day of May, 1843</cite>, (Edinburgh: John Johnstone, 1843), p. 10.</span></figcaption>

</figure><figure class="quote" id="q-46d6ae3284" data-kw="">
<blockquote><p>I am to shew what this state of wrath is. But who can fully describe the wrath of an angry God? None can do it. Yet so much of it must be discovered, as may serve to convince men of the absolute necessity of fleeing to Jesus Christ, out of that state of wrath. Anger in men is a passion, and commotion of the spirit for an injury received, with a desire to resent the same.

When it comes to a height, and is fixed in one’s spirit, it is called wrath. Now there are no passions in God, properly speaking: they are inconsistent with his absolute unchangeableness, and independency; and therefore Paul and Barnabas (to remove the mistake of the Lycaonians, who thought they were gods) tell them, they were men of like passions with themselves, Acts xiv. 15.

Wrath then is attributed to God, not in respect of the affection of wrath, but the effects thereof. Wrath is a fire in the bowels of a man, tormenting the man himself: but there is no perturbation in God. His wrath does not in the least mar that infinite repose and happiness, which he hath in himself. It is a most pure undisturbed act of his will producing dreadful effects against the sinner. It is little we know of an infinite God: but condescending to our weakness, he is pleased to speak of himself to us, after the manner of men. Let us therefore notice man’s wrath, but remove every thing in our consideration of the wrath of God, that argues imperfection: and so we may attain to some view of it, however scanty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 97.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>We consider the context which is as strange as readily we read again in Scripture: Josiah works a great reformation in Judah, like unto him there was no King before him, neither after him arose there any like him, who turned to GOD with all his heart, and yet notwithstanding the Lord turned not from the fierceness of his wrath. Hence observe, that the persons and honest endeavours of the Lord’s worthies, that do their uttermost for turning away the Lord’s wrath from his people, may be graciously accepted with him, when their labours and endeavours come to little purpose, and are ineffectual for the turning away of his wrath and anger. There is here a testimony given to Josiah, that like unto him there was no King before him, neither after him, and yet his work came to nothing, in respect of his main design, the turning away of GOD’s wrath from Judah. Take the proposition by parts, and it will be the more clear.

1. The honest endeavours of worthy instruments in the Lord’s Work, which they use for turning away his anger from his people, may come to little purpose and prove ineffectual for that end; and this comes to pass two ways. (1.) When that very thing they do for this end doth miscarry among their hands. How many of the Lord’s servants have followed honest and great endeavours in their generation, that have come to nothing in respect of the end they aimed at, that is, the turning away of wrath from people, by turning them to God?

Jeremiah, an eminent instrument, and tender of God’s glory, and the good of his people, as any we read of, yet look through all his prophecies, when he hath done this, he can prevail nothing with neither King, Princes, Priests, nor people, and often he is tempted to quit the work, and yet falls to it again. So Chap. 20:7-9; “I am in derision daily, every one mocketh me, for since I spake, I cried out, I cried violence and spoil, because the word of the Lord was made a reproach;” then said, “I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire,” &amp;c. Elijah, another of the most eminent instruments that ever was heard tell of, he labours much to prevent wrath, (1 Kings 18:37, 38) by turning the people to God, he gathers all the Kingdom together, and convinces them of their evil way, and of the difference betwixt God and Baal, and causes slay the priests of Baal, yet the next day as Chap. 19:2, 3, he is said to fly and hide himself from the persecution of Jezebel.

(2.) Not only may their endeavours come to nought by miscarrying, but even when they have done the work they intended, they may miss their design. And this is that which is here spoken of. What was Josiah his great aim and design? We may read it, 2 Kings 22:11, 13, &amp;c., That he and the people being humbled, the great wrath of the Lord might be turned away. He goes about an outward reformation, and he gets it wrought, and his own heart is humbled before the Lord; but he gets not the Lord turned from his fierce anger and wrath; which was kindled against Judah for all that.

2. The second part of the proposition is, that even when it is so, that the honest endeavours of the Lord’s worthy servants for turning away of God’s wrath comes to nought, yet even then they in their persons and endeavours are graciously accepted and highly commended of him, so verse 25. Josiah gets the highest testimony and commendation that hath been given to men on earth. Moses, Joshua, David, Solomon, and all those worthies that prevailed often with God, to turn away his anger from his people, are no more commended, and some of them not so much as Josiah here.</p></blockquote>

<blockquote><p>God is nothing but pure eternity itself. And we cannot conceive of several eternities. For if there are several eternities, they are either without or within one another. But nothing is outside eternity. Therefore, neither is there an eternity outside eternity. Similarly, if eternities are outside one another, they are in different places or times, and this is unrelated to eternity. And so there are not several eternities outside one another. And if one asserts that there are several eternities within one another, such a one ought to know that there is only one and the same eternity, however many times eternity may be replicated upon itself.

For a nature that, replicated upon itself, is always one with itself in complete unity is of higher rank than a nature that admits plurality of itself. For there is diversity where there is plurality. And where there is diversity, there is not complete agreement. For agreement is complete that agrees in one identity and the same unity. Therefore, if complete agreement is better than incomplete agreement — and there cannot be anything incomplete in the highest good (i.e. eternity itself)—the nature of eternity cannot admit plurality. Therefore, there is one and the same, and only one, eternity.

And we likewise say the same about many other things. For example, omnipotence upon omnipotence is only one omnipotence. And I shall propose as an example one of the things that do not have the divine nature, in which the case is similar: a point superimposed on a point is only one point. For points like the midpoint of the world and this moment of time (i.e., the present time) have some comparison to eternity, no small matter for the useful consideration of the same eternity. And so there is need to consider this more broadly in another place. The consideration here suffices only to demonstrate that a simple point (i.e. one without parts), like eternity, is also indivisible, and so a point with a point superimposed without any interval is only one point, just as an eternity with an eternity superimposed is only one eternity.

Therefore, as God is eternity, there are not several gods, since there is no God outside of God, nor does God in God add plurality to God. Therefore, God is always one and the same, and only one. And so when God is generated from God, the offspring is in the parent, and the parent in the offspring (namely, one God the Father and the Son), since the generated is not outside the source of the generated. And when God proceeds from God the Father and the Son, he does not proceed outside God; God (i.e. the Holy Spirit) abides in God from whom he proceeds, and there is one God the Father and the Son and the Holy Spirit. And since this generation and procession are without beginning (otherwise, the eternity generated and the eternity proceeding have a beginning, and this is false), we neither ought nor can in any way conceive that God began to be the Father or the Son or the Holy Spirit.</p></blockquote>

29+have+some+comparison+to+eternity%2C+no+small+matter+for+the+useful+consideration+of+the+same+eternity.+And+so+there+is+need+to+consider+this+more+broadly+in+another+place.+The+consideration+here+suffices+only+to+demonstrate+that+a+simple+point+%28i.e.+one+without+parts%29%2C+like+eternity%2C+is+also+indivisible%2C+and+so+a+point+with+a+point+superimposed+without+any+interval+is+only+one+point%2C+just+as+an+eternity+with+an+eternity+superimposed+is+only+one+eternity.%0A%0ATherefore%2C+as+God+is+eternity%2C+there+are+not+several+gods%2C+since+there+is+no+God+outside+of+God%2C+nor+does+God+in+God+add+plurality+to+God.+Therefore%2C+God+is+always+one+and+the+same%2C+and+only+one.+And+so+when+God+is+generated+from+God%2C+the+offspring+is+in+the+parent%2C+and+the+parent+in+the+offspring+%28namely%2C+one+God+the+Father+and+the+Son%29%2C+since+the+generated+is+not+outside+the+source+of+the+generated.+And+when+God+proceeds+from+God+the+Father+and+the+Son%2C+he+does+not+proceed+outside+God%3B+God+%28i.e.+the+Holy+Spirit%29+abides+in+God+from+whom+he+proceeds%2C+and+there+is+one+God+the+Father+and+the+Son+and+the+Holy+Spirit.+And+since+this+generation+and+procession+are+without+beginning+%28otherwise%2C+the+eternity+generated+and+the+eternity+proceeding+have+a+beginning%2C+and+this+is+false%29%2C+we+neither+ought+nor+can+in+any+way+conceive+that+God+began+to+be+the+Father+or+the+Son+or+the+Holy+Spirit.%E2%80%9D%0A%0A%E2%80%94+Anselm+of+Canterbury%2C+On+the+Incarnation+of+the+Word%2C+%28c.+1090%29%2C+15+in+Anselm+of+Canterbury%3A+The+Major+Works%2C+eds+Brian+Davies+and+Gillian+Evans%2C+Oxford+World%E2%80%99s+Classics+%28Oxford%3A+Oxford+University+Press%2C+1998%29%2C+pp+257-58.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f38ca21ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f38ca21ce.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/13/anselm-of-canterbury-on-the-triune-god-as-eternity-itself/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ef4ebaac0a" data-kw="">
<blockquote><p>I Fear many of you come hither to gaze rather then to be edified by the carriage and last words of a dying man, but if any have an ear to hear, as I hope some of this great Confluence have, I desire your audience as to a few words: I am come hither to lay down this earthly tabernacle and mortal flesh of mine; and I bless God I do it willingly, and not by constraint, I say I suffer willingly, if I had been otherwise minded I might have made a diversion, and not been a prisoner, but I being conscious to my self of nothing worthy of death or bonds, I would not stain my conscience with the suspicion of guiltiness by my withdrawing. Neither have I wanted opportunity nor advantages to escape since I was a Prisoner: Not by the fault of my Keeper, God knows, but otherwise. But neither for this had I light or liberty, least I should reflect upon the Lord’s Name, and offend the Generation of the Righteous.

And if these men have not been mistaken or dealt deceitfully in telling me so, I might have avoided, not only the severity of the Sentence, but also had favour and countenance by complying with the course of the times: But durst not redeem my Life with the loss of my Integrity, God knows I durst not. And that since I was a Prisoner the Lord hath so held me by the hand, that he never suffered me to bring to debate in my inward thoughts, much less to propound or hearken to any Overtures in that kind.</p></blockquote>

<blockquote><p>Q. What is the Knowledge of God?

A. It is an Attribute of God, whereby is noted, that he perfectly knoweth himself; and of, and by himself, all things which are, and which are not.

Q. In what manner doth God know all things?

A. Not successively, or by discourse, collecting one thing from another, but in one simple and eternal act, knowing and comprehending all things; and therefore neither fore-knowledge, nor remembrance are properly in God, all things both past and to come, being present before him.

Q. What learn you from hence?

A. That he is infinite in wisdom and understanding; and therefore whatsoever he doth, must needs be done most wisely, and no vain act can proceed from him.

Q. Is not the knowledge or fore-knowledge of God the cause, why all other things are?

A. No: but his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 10-11.</span></figcaption>

</figure><figure class="quote" id="q-cb3f8c4a52" data-kw="">
<blockquote><p>For the first, that our Religion must be grounded on God’s truth, it is the foundation upon which all other duties to God or man are to be built, for if they be not grounded on God’s truth, but devised by man’s brain, they are but human traditions, which the Lord will not accept, neither is it to any purpose, that we shew ourselves earnest, and forward in religion, unless it be true and agreeable to God’s holy word.

… Tis not sufficient that we profess the truth, but it must be done in truth and simplicity of heart; for how glorious soever our profession of the true religion is before men, yet it is abominable in the eyes of God, if it be not in truth, and from an upright heart, Joshua 24.14. Fear the Lord, and serve him in uprightness, and in truth which if we perform in our serving of God; it will be acceptable in his sight, though performed in great weakness, and mingled with many imperfections; let us therefore with our Saviour, pray unto God that we may be sanctified with his truth, that not only whatsoever we do, may be grounded on God’s truth, but that we may do it in truth and uprightness of heart.</p></blockquote>

</figure><figure class="quote" id="q-dce0b3aa99" data-kw="">
<blockquote><p>The Doctrine of the Jesuits, who albeit they teach the concurrence of the first cause, to be necessary unto each operation of the second cause: yet so, as it doth not determine, but is determined by the second cause: thus Bellarmine. So as not fore-going, only accompanying of the second cause: thus Vasquez. So as it co-operates with the second cause, not after the manner of a principle, but after the manner of an action: thus Suarez.

It determineth the second cause (say they) negatively, not by way of influence: which mystical sense of the Jesuits. Hurtado (himself also a Jesuit) opens by a familiar comparison, thus: As (saith he) in case you can write with two pens, and I holding one of them, hinder you writing with it, permitting you to write with the other: this permission compelleth not you to write, you are free to both: but if you write, it must be with that pen which I leave, not with that which I hold in my hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), p. 125.</span></figcaption>

It determineth the second cause (say they) negatively, not by way of influence: which mystical sense of the Jesuits. Hurtado (himself also a Jesuit) opens by a familiar comparison, thus: As (saith he) in case you can write with two pens, and I holding one of them, hinder you writing with it, permitting you to write with the other: this permission compelleth not you to write, you are free to both: but if you write, it must be with that pen which I leave, not with that which I hold in my hand.”

— John Norton, The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i, (London: Henry Cripps and Lodowick Lloyd, 1654), p. 125.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Doctrine+of+the+Jesuits%2C+who+albeit+they+teach+the+concurrence+of+the+first+cause%2C+to+be+necessary+unto+each+operation+of+the+second+cause%3A+yet+so%2C+as+it+doth+not+determine%2C+but+is+determined+by+the+second+cause%3A+thus+Bellarmine.+So+as+not+fore-going%2C+only+accompanying+of+the+second+cause%3A+thus+Vasquez.+So+as+it+co-operates+with+the+second+cause%2C+not+after+the+manner+of+a+principle%2C+but+after+the+manner+of+an+action%3A+thus+Suarez.%0A%0AIt+determineth+the+second+cause+%28say+they%29+negatively%2C+not+by+way+of+influence%3A+which+mystical+sense+of+the+Jesuits.+Hurtado+%28himself+also+a+Jesuit%29+opens+by+a+familiar+comparison%2C+thus%3A+As+%28saith+he%29+in+case+you+can+write+with+two+pens%2C+and+I+holding+one+of+them%2C+hinder+you+writing+with+it%2C+permitting+you+to+write+with+the+other%3A+this+permission+compelleth+not+you+to+write%2C+you+are+free+to+both%3A+but+if+you+write%2C+it+must+be+with+that+pen+which+I+leave%2C+not+with+that+which+I+hold+in+my+hand.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+orthodox+evangelist.+Or+A+treatise+wherein+many+great+evangelical+truths+%28not+a+few+whereof+are+much+opposed+and+eclipsed+in+this+perilous+hour+of+the+passion+of+the+Gospel%29+are+briefly+discussed%2C+cleared%2C+and+confirmed%3A+as+a+further+help%2C+for+the+begetting%2C+and+establishing+of+the+faith+which+i%2C+%28London%3A+Henry+Cripps+and+Lodowick+Lloyd%2C+1654%29%2C+p.+125.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdce0b3aa99.html&amp;via=5Solas" target="_blank" rel="noopener">Share on <blockquote><p>Q. What is the second thing that the Scripture teacheth concerning God?

A. What God is, viz. a Spirit. • 1 Most simple, without mixture, or composition. • 2 Eternal, without beginning, or end. • 3 Infinite, without comprehension of place, or thought. • 4 Constant, without shadow of change. • 5 Absolute, in power, holiness, and glory.

Q. How then can he be known of us, being incomprehensible?

A. We only see his back parts, not his face, and conceive of him by his names, expressing what an one he is to us; not in his glorious nature, only known unto himself.

Q. What is the third thing which is taught us concerning God?

A. That there is only one God and no more; as also both nature teacheth, guiding all things to one principle; and reason acknowledgeth, admitting but one that is infinite, and independent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-crooke.html">Samuel Crooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guide unto true blessedness. Or, A body of the doctrine of the Scriptures, directing man to the saving knowledge of God</cite>, (London: John Pindley, 1613), pp 7-8.</span></figcaption>

</figure><figure class="quote" id="q-ffe4742ea4" data-kw="">
<blockquote><p>The Divine One is himself the Good (in the primary and proper sense of the word), whose very nature is goodness. This he is and he is so named, and is known by this nature. Since, then, it has not been demonstrated that there is any limit to virtue except evil, and since the Divine does not admit of an opposite, we hold the divine nature to be unlimited and infinite.

Certainly whoever pursues true virtue participates in nothing other than God, because he is himself absolute virtue. Since, then, those who know what is good by nature desire participation in it, and since this good has no limit, the participant’s desire itself necessarily has no stopping place but stretches out with the limitless.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Moses</cite>, trans. and eds. Abraham J. Malherbe and Everett Ferguson, The Classics of Western Spirituality (c. 390; New York: Paulist Press, 1978), Book 1.7, p. 31.</span></figcaption>

</figure><figure class="quote" id="q-9871b1950f" data-kw="">
<blockquote><p>But did the Son take his Deity from the Father?

When we speak simply of the Son without the Father, we avouch truly and properly that he is of himself, and call him God, because of himself he hath his being, and all that he hath; and therefore we call him one alone beginning. But when we point at that relation which he hath with his Father, we justly make the Father the beginning of the Son, and say that the Son received all from the Father, Joh. 3.33.

For the Essence is one thing, and the manner of subsisting another. Hence it is that the schoolmen say, that the Son is by himself not of himself. So the essence of the Son is without beginning, but the Father is the beginning of his Person. This made Hilary to say: The gifts of the Father do not infirm but affirm the Divinity of the Son. And Augustine, Christ in regard of himself is called God, and of the Father is called the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 9.</span></figcaption>

<blockquote><p>As God before time by one free, Eternal, and constant, immanent Act, decreed the futurition of all things: so God in time, by many transient Acts, doth exactly execute the same; only what he did decree, all that he did decree, and according as he did decree.

The Decree is God willing the Futurition; i. e. The future being of all things. The external Efficiency of God, is God’s working all that he hath willed, according as he hath willed. In the Decree is God’s great design of future action. The Efficiency is the execution of that design. In the Decree is, as it were, the Counsel of God; the Efficiency is, as it were, the Hand of God, working according to the Counsel of his Will. The Efficiency and Decree answer one another, as the Birth doth the Conception, the fruit the seed, as the pattern, and tabernacle, Exod. 25.40. And the Pattern and Temple were to answer one another, 1 Chron. 28.12.</p></blockquote>

<blockquote><p>IV. We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord of proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom he governs as ruler and legislator; to whom belong legislation, judgment and execution, so as to have the power of enacting laws, of judging in accordance with them and of carrying out the sentence pronounced).

This right is normally distinguished into natural and positive: the former, according to which he must prescribe to rational creatures their duties (the opposites of which imply a contradiction because they are not founded simply on the divine will, but on the perfection, eminence, holiness and rectitude of the divine nature); the latter, however, according to which he freely and from his mere good-pleasure prescribes such duties as he either was able not to prescribe, or the opposites of which antecedently to the open intimation of the divine will, he might have willed and enjoined without any prejudice to his perfection and holiness, and without embarrassing contradiction.

V. Therefore, whatever things have so close a connection with the nature, perfection, eminence and holiness of God (that he cannot command their opposites without prejudice to his nature and which involve a contradiction as commanded) belong to that natural right. It is certain that God cannot deny himself, or do or command anything contrary to his own holiness and perfection. So God cannot command the hatred of himself, blasphemy and lying; or relieve man from the dependence and obedience due to him because this would be to say that God is not God (i.e., the first cause and absolute Lord). …

VII. From this distinction of the divine right flows the distinction of the precepts (to be held here). For those things that have so close a connection with the nature of God that (the rational and governable creature being posited) he cannot but be bound to do them (such as he should subject himself to and reverence God; should have him for his one only God; and the like), without controversy belong to natural right. But those which flow from the free good will of God and which he was perfectly free to establish or not establish, ought to be referred to positive right. …

XIV. Second, if all the precepts of the law are dispensable and founded only upon positive right, God was perfectly free to make or not make them; yea, he could even command the contrary without any repugnancy. In those things which are by nature indifferent (adiaphora), he who has the right to command has also the right to forbid and so command the opposite. Thus God on this hypothesis could not only give no law to the rational creature about loving and worshipping him, but could also lay down the contrary concerning hating and blaspheming him; not believing any god; or not believing him to be just, good, omnipotent and the like; not obeying him; worshipping strange gods, yea, even the Devil himself.

Thus the most horrible sins (hatred of God, atheism, blasphemy and the like) would become praiseworthy for the very reason that they would fall under the precept, their character would be changed and they would no longer be sins. The proposition of such monstrous absurdities is their own sufficient refutation. For who does not see that God cannot do such things without denying himself and doing violence to his own nature? For as he is true and holy, it is repugnant to his nature to command what is false and base. Now if he would command the hatred of himself (or atheism and idolatry), he would command dreadful and most base falsehoods against his own truth and holiness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IV. We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord of proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom he governs as ruler and legislator; to whom belong legislation, judgment and execution, so as to have the power of enacting laws, of judging in accordance with them and of carrying out the sentence pronounced).

This right is normally distinguished into natural and positive: the former, according to which he must prescribe to rational creatures their duties (the opposites of which imply a contradiction because they are not founded simply on the divine will, but on the perfection, eminence, holiness and rectitude of the divine nature); the latter, however, according to which he freely and from his mere good-pleasure prescribes such duties as he either was able not to prescribe, or the opposites of which antecedently to the open intimation of the divine will, he might have willed and enjoined without any prejudice to his perfection and holiness, and without embarrassing contradiction.

V. Therefore, whatever things have so close a connection with the nature, perfection, eminence and holiness of God (that he cannot command their opposites without prejudice to his nature and which involve a contradiction as commanded) belong to that natural right. It is certain that God cannot deny himself, or do or command anything contrary to his own holiness and perfection. So God cannot command the hatred of himself, blasphemy and lying; or relieve man from the dependence and obedience due to him because this would be to say that God is not God (i.e., the first cause and absolute Lord). …

VII. From this distinction of the divine right flows the distinction of the precepts (to be held here). For those things that have so close a connection with the nature of God that (the rational and governable creature being posited) he cannot but be bound to do them (such as he should subject himself to and reverence God; should have him for his one only God; and the like), without controversy belong to natural right. But those which flow from the free good will of God and which he was perfectly free to establish or not establish, ought to be referred to positive right. …

XIV. Second, if all the precepts of the law are dispensable and founded only upon positive right, God was perfectly free to make or not make them; yea, he could even command the contrary without any repugnancy. In those things which are by nature indifferent (adiaphora), he who has the right to command has also the right to forbid and so command the opposite. Thus God on this hypothesis could not only give no law to the rational creature about loving and worshipping him, but could also lay down the contrary concerning hating and blaspheming him; not believing any god; or not believing him to be just, good, omnipotent and the like; not obeying him; worshipping strange gods, yea, even the Devil himself.

Thus the most horrible sins (hatred of God, atheism, blasphemy and the like) would become praiseworthy for the very reason that they would fall under the precept, their character would be changed and they would no longer be sins. The proposition of such monstrous absurdities is their own sufficient refutation. For who does not see that God cannot do such things without denying himself and doing violence to his own nature? For as he is true and holy, it is repugnant to his nature to command what is false and base. Now if he would command the hatred of himself (or atheism and idolatry), he would command dreadful and most base falsehoods against his own truth and holiness.”

— Francis Turretin, Institutes of Elenctic Theology, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.2.4, 5, 7, 14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+We+must+observe+that+the+right+of+God+%28as+far+as+regards+creatures%29+is+either+of+dominion+%28which+includes+the+right+of+possessing%2C+disposing+and+using+creatures%2C+as+a+lord+of+proprietor%2C+who+is+able+to+use+and+enjoy+his+own+property+at+pleasure%29%3B+or+of+government+%28which+properly+refers+to+rational+creatures+whom+he+governs+as+ruler+and+legislator%3B+to+whom+belong+legislation%2C+judgment+and+execution%2C+so+as+to+have+the+power+of+enacting+laws%2C+of+judging+in+accordance+with+them+and+of+carrying+out+the+sentence+pronounced%29.%0A%0AThis+right+is+normally+distinguished+into+natural+and+positive%3A+the+former%2C+according+to+which+he+must+prescribe+to+rational+creatures+their+duties+%28the+opposites+of+which+imply+a+contradiction+because+they+are+not+founded+simply+on+the+divine+will%2C+but+on+the+perfection%2C+eminence%2C+holiness+and+rectitude+of+the+divine+nature%29%3B+the+latter%2C+however%2C+according+to+which+he+freely+and+from+his+mere+good-pleasure+prescribes+such+duties+as+he+either+was+able+not+to+prescribe%2C+or+the+opposites+of+which+antecedently+to+the+open+intimation+of+the+divine+will%2C+he+might+have+willed+and+enjoined+without+any+prejudice+to+his+perfection+and+holiness%2C+and+without+embarrassing+contradiction.%0A%0AV.+Therefore%2C+whatever+things+have+so+close+a+connection+with+the+nature%2C+perfection%2C+eminence+and+holiness+of+God+%28that+he+cannot+command+their+opposites+without+prejudice+to+his+nature+and+which+involve+a+contradiction+as+commanded%29+belong+to+that+natural+right.+It+is+certain+that+God+cannot+deny+himself%2C+or+do+or+command+anything+contrary+to+his+own+holiness+and+perfection.+So+God+cannot+command+the+hatred+of+himself%2C+blasphemy+and+lying%3B+or+relieve+man+from+the+dependence+and+obedience+due+to+him+because+this+would+be+to+say+that+God+is+not+God+%28i.e.%2C+the+first+cause+and+absolute+Lord%29.+%E2%80%A6%0A%0AVII.+From+this+distinction+of+the+divine+right+flows+the+distinction+of+the+precepts+%28to+be+held+here%29.+For+those+things+that+have+so+close+a+connection+with+the+nature+of+God+that+%28the+rational+and+governable+creature+being+posited%29+he+cannot+but+be+bound+to+do+them+%28such+as+he+should+subject+himself+to+and+reverence+God%3B+should+have+him+for+his+one+only+God%3B+and+the+like%29%2C+without+controversy+belong+to+natural+right.+But+those+which+flow+from+the+free+good+will+of+God+and+which+he+was+perfectly+free+to+establish+or+not+establish%2C+ought+to+be+referred+to+positive+right.+%E2%80%A6%0A%0AXIV.+Second%2C+if+all+the+precepts+of+the+law+are+dispensable+and+founded+only+upon+positive+right%2C+God+was+perfectly+free+to+make+or+not+make+them%3B+yea%2C+he+could+even+command+the+contrary+without+any+repugnancy.+In+those+things+which+are+by+nature+indifferent+%28adiaphora%29%2C+he+who+has+the+right+to+command+has+also+the+right+to+forbid+and+so+command+the+opposite.+Thus+God+on+this+hypothesis+could+not+only+give+no+law+to+the+rational+creature+about+loving+and+worshipping+him%2C+but+could+also+lay+down+the+contrary+concerning+hating+and+blaspheming+him%3B+not+believing+any+god%3B+or+not+believing+him+to+be+just%2C+good%2C+omnipotent+and+the+like%3B+not+obeying+him%3B+worshipping+strange+gods%2C+yea%2C+even+the+Devil+himself.%0A%0AThus+the+most+horrible+sins+%28hatred+of+God%2C+atheism%2C+blasphemy+and+the+like%29+would+become+praiseworthy+for+the+very+reason+that+they+would+fall+under+the+precept%2C+their+character+would+be+changed+and+they+would+no+longer+be+sins.+The+proposition+of+such+monstrous+absurdities+is+their+own+sufficient+refutation.+For+who+does+not+see+that+God+cannot+do+such+things+without+denying+himself+and+doing+violence+to+his+own+nature%3F+For+as+he+is+true+and+ho <blockquote><p>Thirdly, [God is] without passions too; that is, not subject to, nor capable of love, hatred, joy, grief, anger, and the like, as they daily arise in us imperfect creatures; but he is always the same unmovable, unchangeable, impassible God: and therefore in all our contemplations of the Divine essence, we are not to conceive him as one passionately rejoicing or grieving for any thing, as we do, but as a pure and perfect essence, without body, parts, and passions too; as appears from scripture, reason, and fathers.

… we must conclude him to be without passions too, as well as parts; for if he be such a pure essence, yea, essence itself, it is impossible he should be subject to any passions. But this, that he is without passions, appears more clearly from these words, God is not a man, that he should lie, nor the son of man that he should repent, Num. xxiii. 19. But most clearly of all in that Paul and Barnabas, to convince the people at Lystra that they were not Gods, but men, tell them, they were men of like passions, or subject to passions, as well as they, Acts xiv. 14. And St. James useth the same argument to prove that Elias was a man too, James v. 17. Now had God been subject to passions, as well as men, the apostles would have been much overseen in their logics, using an argument that would make as much against them as for them. …

And that God is without passions, is also as clear as that he is without body and parts: for passion in its proper notion and notation implies suffering, which it is impossible for God, who is a most pure act, to be subject to. Again, in every passion, there is a motion or change in the subject wherein it is; and therefore also it is called a passion, because the subject suffers some change by it, sometimes loving, then hating, now rejoicing, then grieving, and the like; so that there is some change in the subject, from what it was before.

But now it is impossible there should be any such motion or change in God; for inconstancy and mutability are imperfections, and therefore not to be admitted into the notion of a Deity. And further, if God should be moved or changed, it must be either from better to worse, from worse to better, or from equal to equal. From better to worse he cannot be changed, for then he would be corrupted, and want some perfection after his change, which he had before, and so cease to be the chiefest good, and by consequence God; which we have before shewed he cannot, being in and of himself eternal.

From worse to better if he should change, before his change he was not God, because he wanted some perfection or degree of goodness, which he hath after: after his change he would not be God, because he had a beginning, and so not eternal. From equal to equal also he cannot change, for then too he would not be God absolutely perfect, wanting some perfection before his change, which he had after, and some perfection after his change, which he had before.

And lastly, if God should be moved, or changed, and by consequence be in passion any way, it must be either from something without him, or from something within him: from any thing without him, it cannot be; for he is the First Cause, and so the first mover, by whom all other things are moved, and therefore who cannot be moved by any thing: from within he cannot be moved, for he hath not any parts, (as I have shewn,) whereof one can be the thing moving, and the other the thing moved, being in and of himself a most pure and simple act. And therefore we cannot but conclude from reason also, that God is without body, parts, and passions.</p></blockquote>

<blockquote><p>The Essence of God absolutely considered, is that one pure and mere act, by which God is God. Because through weakness of our understanding we cannot apprehend it in any measure by one act, it hath pleased God to give unto himself many Names and Attributes, by the help of which we may the better conceive thereof. …

The divine Attributes are certain essential Properties, which God is pleased in Scripture to ascribe or attribute unto himself; they are also called the Perfections of God, or divine Predications, or Titles. They are not distinguished from the Essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving.

All the Attributes in God are one and the same Perfection. It is better said of God that he is his Attributes, then that he hath Attributes: The Attributes are not distinguished in God, but in our manner of understanding, who being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. …

The sum is: The Attributes, as was said before, are not distinguished in God, that is, from the divine Essence, or one from another really, but only notionally, or virtually in our conception, and in their objects, in respect of the various effects thereupon: For every and all the Attributes are the divine Essence it self; according to that received Proposition, Whatsoever is in God, is God: And this is the reason why some well describe the Attributes from the Essence of God: which manner of description, besides many useful notions clearly intimated thereby, doth in the describing of the Relative Attributes, principle and fortify the understanding against that perilous Tenet of Arminianism, concerning the Decree passing upon good or bad foreseen, with the evil consequences following thereupon. …

Negative Attributes are such as remove from God all imperfection: by these we help our understanding in our meditation of God, by way of Negation. The more principal of them are in number five, viz. Simplicity, Eternity, Immensity, Immutability, Infiniteness: to which, or some of which, any other of like nature may conveniently be referred.

Simplicity is God, one mere and perfect act without all composition. God calleth his Name, I am, Exod. 3.14. that is, mere Essence, wherein is nothing past, nor to come. Because spirits are immixt in respect of bodies, to shew that he is not compounded, he saith he is a Spirit, John. 4.24. When we say that God is a mere and perfect Act, the meaning is, that God is a Cause without any Cause, a Being that is not from any Being; not compounded of an Act, by which he is; and Possibility, by which he might not have been, or may not be: of whom it never could nor can be said, that any thing was to be in him, which was not; or cannot be, that is.

That God is a pure and simple Act without all composition, is evident, Because of his Perfection; all composition supposeth imperfection, because he is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.

<div class="actions"><button class="copy" data-copy="“The Essence of God absolutely considered, is that one pure and mere act, by which God is God. Because through weakness of our understanding we cannot apprehend it in any measure by one act, it hath pleased God to give unto himself many Names and Attributes, by the help of which we may the better conceive thereof. …

The divine Attributes are certain essential Properties, which God is pleased in Scripture to ascribe or attribute unto himself; they are also called the Perfections of God, or divine Predications, or Titles. They are not distinguished from the Essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving.

All the Attributes in God are one and the same Perfection. It is better said of God that he is his Attributes, then that he hath Attributes: The Attributes are not distinguished in God, but in our manner of understanding, who being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. …

The sum is: The Attributes, as was said before, are not distinguished in God, that is, from the divine Essence, or one from another really, but only notionally, or virtually in our conception, and in their objects, in respect of the various effects thereupon: For every and all the Attributes are the divine Essence it self; according to that received Proposition, Whatsoever is in God, is God: And this is the reason why some well describe the Attributes from the Essence of God: which manner of description, besides many useful notions clearly intimated thereby, doth in the describing of the Relative Attributes, principle and fortify the understanding against that perilous Tenet of Arminianism, concerning the Decree passing upon good or bad foreseen, with the evil consequences following thereupon. …

Negative Attributes are such as remove from God all imperfection: by these we help our understanding in our meditation of God, by way of Negation. The more principal of them are in number five, viz. Simplicity, Eternity, Immensity, Immutability, Infiniteness: to which, or some of which, any other of like nature may conveniently be referred.

</figure><figure class="quote" id="q-17e2491040" data-kw="">
<blockquote><p>GOD therefore is all places at once, not only by his virtue and power, but in his whole infinite essence; yet we must not imagine grossly of him, to think that either he is mixed with the Creatures (for that is contrary to his most perfect, single nature) or that by the filth and contagion of the creature himself can be polluted: (for that is contrary to his most perfect holy nature:) but in such a sort he is present, as is heavenly and spiritual, and incomprehensible.

And albeit, by nature we seek God in the Heavens, and our Saviour Christ hath taught us to say, Our Father which art in Heaven, that is not in respect of his essence; and as I may say, of his very presence, that he is rather in Heaven then in Earth, or dwelleth rather in his Church, then in prophane Synagogues; in the hearts of his Saints, then in the wicked: but in respect of his working, and more special grace, or of the clearer manifestation of his glory, as he saith, In Heaven is my Throne. And the Prophet DAVID, In his Temple he uttereth all his glory. And that this every-where-presence doth only belong to God, appeareth in that by this note, he differenceth himself from all other Creatures.

For when he saith, Do not I fill Heaven and Earth? he meaneth, that none other doth so. It is to be observed, that he saith there, Am I a God near at hand (saith JEHOVAH) and am I not a God far off? Do I not fill Heaven and Earth? As if he had said that, which none but God can challenge. God therefore is only Infinite: He only is that Circle, whose Centre is every where, and Circumference no where, who alone measureth the Waters in his fist, and counteth the Heavens with a span. As the Prophet would have us to understand, when he setteth the same, as a spell to any whatsoever, that foolish men shall dare to make like unto him.</p></blockquote>

</figure><figure class="quote" id="q-ca5eb21a59" data-kw="">
<blockquote><p>There is another Scripture, that is always brought in upon this Head of Argument, Ezek. xxxiii. 11. Where the Lord declares, with the Solemnity of an Oath, As I live, saith the Lord God, I have no Pleasure in the Death of the wicked, but that the wicked turn from his Way and live. When the Lord says, he has no Pleasure in the Death of the Wicked; the plain Sense of the Words is, that the Death and Misery of Sinners is not a Pleasure to him in itself, or for its own Sake, merely as it is a Misery to the Creature.

But this doesn’t say, but that their Death and Punishment may be agreeable and pleasing to him, under other Considerations; as it is an Execution of Justice, and Manifestation of his own Glory. If it were not so, Would he inflict Punishment upon any of them? Would he displease and make himself uneasy? And when he says, That it is a Pleasure to him, that the Wicked turn from his Way, and Live.

The Meaning is, that righteousness and Holiness in his Creatures, and the Happiness consequent upon it, is the Object of his Approbation and Liking, a Thing, in itself, agreeable and pleasing to his holy Nature. But this, sure, is no Proof, that he equally and alike designed the Sanctification and Salvation of all Sinners. If it proved any thing this Way, it would prove, that he designed it certainly for them all, if his Power could effect it.</p></blockquote>

<blockquote><p>IV. God also, besides his other proprieties, is simple or unmixed, that he can no ways be said to be compounded of many things. No, not of his being and essence.

V. For, although he attribute unto himself many things in the scriptures, as it were many qualities as to be good, just, might etc., yet no quality doth in very deed fall into God. But of what sort soever he is, the same he is in his own simple essence. But by these divers names the infinite perfection of his most simple essence is signified unto us.</p></blockquote>

</figure><figure class="quote" id="q-b8736c5415" data-kw="">
<blockquote><p>The other thing expressed in these invitations, is a sort of dislike, grief, or sorrow; (it’s a speech borrowed from man, for there is no disappointing of the Lord’s will, nor sorrow in him for the not fulfilling of it) or an earnest nilling and hating dislike, that these two should not go along, as approved efficaciously by us, to wit, the creatures obedience of Faith, and life eternal. God loveth, approveth the believing of Jerusalem, and of her children, as a moral duty, as the hen doth love to warm and nourish her chickens; and he hateth, with an exceeding and unfained dislike of improbation and hatred, their rebellious disobedience, and refusing to bee gathered: but there is no purpose, intention, or decree of God holden forth in these invitations called his revealed will, by which he saith, he intendeth and willeth that all he maketh the offer unto, shall obey and be saved.

But it’s to be observed, that the revealed will of God, holden forth to all, called voluntas signi, doth not hold forth formally, that God intendeth, decreeth, or purposeth in his eternal counsel, that any man shall actually obey, either elect or reprobate; it formally is the expression only of the good liking of that moral and duty-conjunction between the obedience of the creature, and the reward, but holdeth forth not any intention or decree of God, that any shall obey, or that all shall obey, or that none at all shall obey; and what Arminians say of Christ’s intention to die for all, and every one; and of the Lord’s intention and Catholic good will, to save all and every one; to wit, that these desires may be in God, though not any be saved at all, but all eternally perish, which maketh the Lord’s desires irrational, unwise, and frustraneous, that we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect, though not any one of men or Angel obey, if there were not going along with this will of God, another will, and eternal decree and purpose in God, of working by free grace in some chosen ones, what the Lord willeth in his approving will; and another decree in the which the Lord purposeth to deny his saving grace, upon his absolute liberty to others, that being left to the hardness of their own hearts, they may freely disobey, and be the sole Author’s of their own damnation. Now because Arminians deny any such two decrees in God, but assert only such as depend wholly in their fulfilling, on the free will of Men and Angels, and all the decrees of God may be frustrated and disappointed by Men and Angels; as if the poor short-sighted creature, not the Sovereign Creator were carver, and Lord of the decrees, and Master of work in fulfilling of these counsels.

We reject their Catholic intentions and decrees, to save and redeem all and every one, which they vainly fancy to be in God, as repugnant to his will, which is irresistible, and cannot miss its end. 2. To his immutability, which cannot be compelled to take a second port, whereas he cannot sail the first. 3. To his Omnipotency, who cannot be resisted, 4. To his happiness, who cannot come short of what his soul desires. 5. To his wisdom, who cannot aim at an end, and desire it with his soul, and go about it, by such means, as he seeth shall be utterly uneffectual, and never produce his end, and not use these means, which he knoweth may, and infallibly doth, produce the same end in others.

Now this desire of approbation is an abundantly sufficient closing of the mouth, of such as stumble at the Gospel, being appointed thereunto, and an expression of Christ’s good liking to save sinners. Expressed in his borrowed wishes, Deut. 5.29. O that there were such a heart in them, that they would fear me, and keep my commandments. Psal. 81.13. O that my people had hearkened unto me, and Israel walked in my ways. Which wish, as relating to disobeying Israel, is a Figure, or Metaphor borrowed from men, but otherwise sheweth how acceptable the duty is to God, how obligatory to the creature. 2. By the Lord’s expostulations, Ezek. 18.31 Why will ye die, O house of Israel. Verse 32. For I have no pleasure in the death of him that dies. 3. In the Lord’s crying to sinners. Prov. 1.20. Wisdom cries, she uttereth her voice in the streets. The Word is to cry with strong shouting, either for joy, Psalm. 81.2. or sorrow, Lament. 2.19. which expresseth Christ’s desire to save sinners.</p></blockquote>

<blockquote><p>Again, it is said, That if this Doctrine be true, then it follows, that God creates Men to damn them. This seems to be a ready-hand Argument, almost in every ones Mouth that denies the Doctrine.

Before we speck to any Words or Propositions, we ought to understand what is meant by them. Now and the Meaning I can conceive in this Sentence, [God creates Men to damn them] consistent with the Propriety of Speech, is, that their Damnation is God’s End in creating them; the final Cause and Reason of his bringing them into Being: And this imports in it that God loves, and delights in the Punishment and Misery of Creatures, merely as such, and for its own Sake; which is a Thing most blasphemous to suppose of him.

To suppose, that the Misery of any Creature, strictly and abstractly in itself, without any other Consideration, is agreeable and pleasing to God; yea so agreeable, that he makes them for this very End that he may have the Pleasure of punishing them; is indeed, to represent him like the very worst of Beings But then I would ask, Does God’s decreeing to punish Men for their Sin, as they deserve, for maintaining the Dignity of his Government, and the shewing forth of his infinite Holiness, Justice, and rightful Authority; does this, I say, bear in it any such Thing, as that he delights barely in the Misery of Creatures, so as to create them for the Sake of it? How irrational is such a Consequence?

But if any will yet insist on it, as a just Consequence, I desire them to consider a little, how they will free their own Scheme of it; which is every whit as liable to the Charge: Unless they have stupid Ignorance, and blasphemous Presumption enough, to deny God’s infinite Understanding and Fore-knowledge of all Things, it is just as reasonable to bring this Objection against the Arminians, as the Calvinists; and say, that God creates Men to damn them, if he knows before-hand, that he will damn them; if he fore-knew that they would die impenitent, in Unbelief; and thereupon has decreed their Damnation, before he has created them.

The Truth in the Matter is this, God decreed to create all Men for the Manifestation of his own Glory, which is his End in all his Works; and looking upon Mankind in their Apostacy and Sin, he decreed to leave a particular Part of them in that State, and to punish them according to their Sin, for the Manifestation of the Glory of his Sovereignty, Holiness and Justice, and the right and infinite Obligations of his Authority, as a Law-giver over his reasonable Creatures. This View of the Case gives no Ground for the Charge contained in the Objection.

Tho’ God foresees that Mankind will sin against him, cannot he, notwithstanding, create them; and determine to punish them, or any Part of them, as their Sin deserves, for the Illustration of his Glory aforesaid; without being chargeable with creating them, just that he might damn them? To say so, is the same Thing as to say, that the Sin and Default of the Creature, must bind up God’s Hands from doing that which is in itself every Way reasonable and Right; And in short, to say, that right is wrong.</p></blockquote>

<blockquote><p>The love of the world cannot be expunged by a mere demonstration of the world’s worthlessness. But may it not be supplanted by the love of that which is more worthy than itself? The heart cannot be prevailed upon to part with the world, by a simple act of resignation. But may not the heart be prevailed upon to admit into its preference another, who shall subordinate the world, and bring it down from its wonted ascendancy? If the throne which is placed there must have an occupier, and the tyrant that now reigns has occupied it wrongfully, he may not leave a bosom which would rather detain him than be left in desolation.

But may he not give way to the lawful sovereign, appearing with every charm that can secure His willing admittance, and taking unto himself His great power to subdue the moral nature of man, and to reign over it? In a word, if the way to disengage the heart from the positive love of one great and ascendant object, is to fasten it in positive love to another, then it is not by exposing the worthlessness of the former, but by addressing to the mental eye the worth and excellence of the latter, that all old things are to be done away and all things are to become new.

To obliterate all our present affections by simply expunging them, and so as to leave the seat of them unoccupied, would be to destroy the old character, and to substitute no new character in its place. But when they take their departure upon the ingress of other visitors; when they resign their sway to the power and the predominance of new affections; when, abandoning the heart to solitude, they merely give place to a successor who turns it into as busy a residence of desire and interest and expectation as before – there is nothing in all this to thwart or to overbear any of the laws of our sentient nature – and we see how, in fullest accordance with the mechanism of the heart, a great moral revolution may be made to take place upon it. This, we trust, will explain the operation of that charm which accompanies the effectual preaching of the gospel.

The love of God and the love of the world, are two affections, not merely in a state of rivalship, but in a state of enmity – and that so irreconcilable, that they cannot dwell together in the same bosom. We have already affirmed how impossible it were for the heart, by any innate elasticity of its own, to cast the world away from it; and thus reduce itself to a wilderness. The heart is not so constituted; and the only way to dispossess it of an old affection, is by the expulsive power of a new one. Nothing can exceed the magnitude of the required change in a man’s character – when bidden as he is in the New Testament, to love not the world; no, nor any of the things that are in the world for this so comprehends all that is dear to him in existence, as to be equivalent to a command of self-annihilation.

But the same revelation which dictates so mighty an obedience, places within our reach as mighty an instrument of obedience. It brings for admittance to the very door of our heart, an affection which once seated upon its throne, will either subordinate every previous inmate, or bid it away. Beside the world, it places before the eye of the mind Him who made the world and with this peculiarity, which is all its own – that in the Gospel do we so behold God, as that we may love God. It is there, and there only, where God stands revealed as an object of confidence to sinners and where our desire after Him is not chilled into apathy, by that barrier of human guilt which intercepts every approach that is not made to Him through the appointed Mediator.

It is the bringing in of this better hope, whereby we draw nigh unto God – and to live without hope, is to live without God; and if the heart be without God, then world will then have all the ascendancy. It is God apprehended by the believer as God in Christ, who alone can dispost it from this ascendancy. It is when He stands dismantled of the terrors which belong to Him as an offended lawgiver and when we are enabled by faith, which is His own gift, to see His glory in the face of Jesus Christ, and to hear His beseeching voice, as it protests good will to men, and entreats the return of all who will to a full pardon and a gracious acceptance it is then, that a love paramount to the love of the world, and at length expulsive of it, first arises in the regenerated bosom.

It is when released from the spirit of bondage with which love cannot dwell, and when admitted into the number of God’s children through the faith that is in Christ Jesus, the spirit of adoption is poured upon us – it is then that the heart, brought under the mastery of one great and predominant affection, is delivered from the tyranny of its former desires, in the only way in which deliverance is possible. And that faith which is revealed to us from heaven, as indispensable to a sinner’s justification in the sight of God, is also the instrument of the greatest of all moral and spiritual achievements on a nature dead to the influence, and beyond the reach of every other application.</p></blockquote>

<blockquote><p>Be there any parts or kinds of God?

None at all, because he is a most simple essence, which doth admit no composition or division; and simply, and in every respect of unity one, and in act most infinite.

Are there any causes of God?

Not any, for he is the cause of all causes.

Is there any accident in God?

No, in regard of God himself; for whatsoever is in God is his essence.

Seeing the essence of God is most simple, in what respect do power, goodness, justice, wisdom, mercy differ in God?

Not in essence: for all these attributes in essence, are but one very thing indeed: but in our weak capacity and manner of knowing, in regard of us, and by the effects, in respect of the creatures.</p></blockquote>

</figure><figure class="quote" id="q-211b8ff5db" data-kw="">
<blockquote><p>If God is, he must needs have subsisted of all Eternity, without any beginning. For, who should have given him his being? He could not have created himself, nor be made out of nothing, without any cause, and no first, or Superior cause can challenge the Creation of him, for there is nothing before, or superior to God.

And if he hath existed from all Eternity, he is then infinite, in respect of his duration. And if he hath an infinite duration, his Power is also infinite; and if he is infinitely Powerful, this World, which (though very great) is notwithstanding finite, and is not so great, but that it can have been made, or created by him, or ruled and Governed by an infinite Power, such as his is.</p></blockquote>

</figure><figure class="quote" id="q-6ccde3d345" data-kw="">
<blockquote><p>Here, then is another test of our Christian discipleship – a test, moreover, which I greatly fear many inwardly feel that they cannot at all abide. They inwardly respect real goodness; but to respect it is one thing, and so to love as to associate with it, and peculiarly to befriend and shelter it, is distinctly another.

And while I say not of now hearing me, that they are without natural affection. I yet would have you all to that you may utterly detest, and shun as would do the contagion of a pestilence, or of the grave, even all that is gracious; and that, should that persecution of which we at last been officially forewarned, be now to break forth upon us, it will be but in fulfilment of all our speculations upon human character, if we find the most active and relentless agents of it among those of our professing brethren, who have ever felt highest respect for real goodness, and yet have been farthest of all from ever liking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-bruce.html">John Bruce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Benevolence of the Renewed Heart: A Discourse in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-7391032a3b" data-kw="">
<blockquote><p>IT is a great, as well as a true Observation, which I have read in a Learned Man; namely, That all the many various Attributes of God mentioned in the Scripture, are no other than his very Essence, and are ascribed to him to help us in our Conceptions and Understandings of Him, who are not able to apprehend what may be known of God, under any one Name or Notion, or by any one Act of the Intellect.

We read (you know) of his Power, his Wisdom, his Holiness, his Justice, his Goodness, his Faithfulness, his All-sufficiency, and the like, all which are not distinguished in him, either from himself, or from one another, but are all one and the same God revealed and manifested to us, under various notions, and that to help us the better to conceive and apprehend him, as also to perform our homage and worship to him; accordingly we may say, the Holiness of God, is God; the Wisdom of God, is God; the Power of God, is God; the Goodness of God, is God:

And to come to my Text, the Unchangeableness of God, is God; and indeed the unchangeableness of God, is God manifested and revealed under a sweet and blessed, as well as a glorious Notion to us, under such a Notion as conduces-much to the quickening and encouraging of our Faith and Love, our Comfort and Obedience in him, and to him; and so indeed the Text represents it, I am the Lord, I change not, therefore ye Sons of Jacob are not consumed: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends</cite>, (London: Jonathan Robinson, 1674), pp 1-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><figure class="quote" id="q-eee053512b" data-kw="">
<blockquote><p>Nothing does more to encourage true godliness than constant and deep meditation on the goodness and free mercy of God. Those who make good use of the benefits they receive from other people are motivated by sincere gratitude, whereas neglect of such benefits is a sure sign of ingratitude. Likewise, those who remember all the care and trouble their parents went to on their behalf cannot be anything but devoted and attentive to them. So those for whom God has done so much ought to meditate constantly on the goodness he has given them so far and realize what a great debt they owe him.

But we shall never recognize the magnitude of God’s benefits unless we compare the dignity of being children of God, into which Christ Jesus has raised us and which he has given us in the freedom of the Spirit so that we can call on God with the sweetest name of Father, with that unhappy and deplorable state in which we were born. If everyone devoted as much time to thinking about this as they should, they would soon develop a wonderfully intense desire to live in a godly way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 186-87.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

formedcovenanter.wordpress.com/2021/07/14/rudolf-gwalther-meditating-on-gods-goodness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-aa8386c989" data-kw="">
<blockquote><p>What an adorable being is the Triune God! How gloriously mysterious in his being, attributes, operations, and personal acts! How little are we capable of knowing of this infinite Being. “None by searching can find out the Almighty to perfection.” Where the feelings of the heart are right, the incomprehensible nature of the divine existence causes no obstruction to genuine devotion.

Indeed, the soul of man is so constituted as to require an incomprehensible Being as the object of worship. Profound adoration is the very feeling which corresponds with this attribute.. Were it not so, the angels in heaven would be perplexed and unhappy; for the more is known of God, the more mysteries are perceived in the divine character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), pp 55-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“What an adorable being is the Triune God! How gloriously mysterious in his being, attributes, operations, and personal acts! How little are we capable of knowing of this infinite Being. “None by searching can find out the Almighty to perfection.” Where the feelings of the heart are right, the incomprehensible nature of the divine existence causes no obstruction to genuine devotion.

Indeed, the soul of man is so constituted as to require an incomprehensible Being as the object of worship. Profound adoration is the very feeling which corresponds with this attribute.. Were it not so, the angels in heaven would be perplexed and unhappy; for the more is known of God, the more mysteries are perceived in the divine character.”

<blockquote><p>13 God gave being unto all things Therefore he is the first, chief and independent Being.

14 He is [a se], that is, He hath his Being from himself. Scal. He is … Being above all beings. Dionys. lib. 1 De Divinis nom. cap. 1.

15 He is the Essence of all essences the Creator of all creatures, the Life of all lives, the Cause of all causes.

16 He it is that giveth all unto all but receiveth not ought from any.

17 Above him, is nothing; without him, is nothing; beneath him, is nothing: Under him, is all; in him, is all with him, is all: From him, are all things by him, are all things; in him, are all things. Aug. De Spec. cap. 33.

18 Between the Essence of God and the essence of the creatures there is an infinite difference: God’s Essence is after a singular, peculiar, and supereminent manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Doctrine</cite>, trans. Ralph Winterton (Cambridge: Roger Daniel, 1640), p. 16.</span></figcaption>

<blockquote><p>Did we know what being and life are, we might possibly form some satisfying conception, though nothing that could deserve the name of an idea; and here we are taught to fix our last resource, by the name that God hath chosen for himself, and which distinguishes him from every other being, Jehovah, which is best rendered by, He that is,—the possessor and proprietor of being; and, consequently, of all measures and degrees of perfection.

The nearer we can raise our conceptions to this, which always implies life, and all its powers, the nearer will we approach to right conceptions of that incomprehensible being, who hath condescended to give an authentic history of his works and ways, by which he hath discovered himself to us in his true character, and the perfections which belong to him.

However we may be forced to apprehend the divine perfections separately, or in different views, they are all one in the divine essence. Perfect being is perfect forever; and perfect power cannot be conceived without absolute perfection subsisting in the most perfect manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 169-70.</span></figcaption>

</figure><figure class="quote" id="q-a299149450" data-kw="">
<blockquote><p>God is said to be powerful, because he can do more then he will: he could of stones have raised children to Abraham, but he would not; and when our blessed Lord was apprehended, he tells Peter, that he could have obtained of his Father, more then twelve legions of Angels to help him, but he would not: He can do more then he will, but he will not do all that he can.

It meets with those that deny this to God: Plinius Secundus [Pliny the Elder] saith, God is not Almighty, because he cannot lie nor deceive: Ludovicus Vives [Juan Luis Vives] wonders at this, saying, I admire that a man so wise should cavil at God’s power; but Saint Augustine answers him well, and saith, therefore is God omnipotent, because he cannot he nor deceive, for these argue impotency.

Secondly, it confutes others, who say God is not so powerful as the Scripture makes him to be, because he cannot make a thing to be against its nature, as to bee, and not to be: to whom I answer, things which in their nature are simply impossible (with reverence be it spoken) God cannot do; but all other things, though impossible to created nature, God can do; therefore this vain objection doth not disparage God’s power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/josiah-shute.html">Josiah Shute</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Cordials: Delivered in ten sermons, upon part of the ninth and tenth chapters of Ezra, in a time of visitation. By that godly and faithful preacher of God’s Word, Josiah Shute, B.D. and late rector of Mary Woolnoth’s in Lumbard-Street London</cite>, (London: Robert Bostock, 1644), pp 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>God is essentially holy, and in this sense, none is holy but himself. Now essential holiness is all one with God himself. God’s essential holiness is God’s conformity to himself. Holiness in God is not a quality, but his essence. … Whatsoever is in God, is God. Holiness in angels and saints is but a quality, but in God it is his essence. The fallen angels keep their natures, though they have lost their holiness; for that holiness in them was a quality, and not their essence.

Look, as created holiness is the conformity of the reasonable creature to the rule, so the uncreated holiness of God is God’s conformity unto himself. God’s holiness and his nature are not two things, they are but one. God’s holiness is his nature, and God’s nature is his holiness. God is a pure act, and therefore, whatsoever is in God is God. It is God’s prerogative royal to be essentially holy. The most glorious creatures in heaven, and the choicest souls on earth, are only holy by participation: 1 Sam. ii. 2, ‘There is none holy as the Lord.’

God’s holiness is so essential and co-natural to him, that he can as soon cease to be, as cease to be holy. Holiness in God is a substance, but in angels and men it is only an accident, or a quality. The essence of the creature may remain when the holiness of the creature is lost, as you may see in Adam, and the fallen angels; but God’s essence and his holiness are always the same. His very nature is holy, and therefore it is that he is called ‘Jehovah,’ and ‘I am,’ because what he is really, that he is essentially, Exod. iii. 14.

Though men, for our information, do distinguish between the attributes of God and the nature of God, yet in him they are the same. Look, as the wisdom of God is the wise God, and the truth of God the true God, and the power of God the powerful God, and the justice of God the just God, and the mercy of God the merciful God, and the mightiness of God the mighty God, and the righteousness of God the righteous God, and the graciousness of God the gracious God, so the holiness of God is the holy God. God’s nature and his name are one and the same. God is essentially holy, and that is the top of all his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 392-93.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/attributes-of-god.html">Attributes of God</a></span></div>

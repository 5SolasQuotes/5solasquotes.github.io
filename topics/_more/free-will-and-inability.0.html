<blockquote><p>[Thomas] CHALMERS was not a widely-read divine, but as a practical thinker and teacher of the heart he was unrivalled. We have lost much of him for want of a Boswell. Many of his best sayings are gone for ever. As a man of erudition he might have been better. As a heaven-taught man, he needed little. Though not well read, all his reading passed through the alembic of his own mind. What he took in from without never came forth undigested. ….

But Chalmers never could understand the real difficulty of the Edwardean controversy. It was very poor insight in him to imagine that he had settled the controversy. He and I often talked of Edwards and Philosophical Necessity. He never could see that there was a third thing between Necessity and Contingency —viz. Liberty. Chalmers was not a speculative thinker; but he was especially great in all questions where the heart aids the intellect.

A minister once told me of the fine rebuke he got from him. He had visited a man on his death-bed who was delirious, and returning home met Chalmers. “Well,” said he, “did you pray with him?” “No; he was delirious; but I prayed with the family.” “Ah! you did very wrong, sir. Who knows but that some old train of thought might have been stirred up by the tones of a familiar voice? You did very wrong, sir?” In that region Chalmers was one of the greatest men of our century.

I DISSENT from J[onathan]. Edwards’ doctrine, because he hazards a speculation on will qua will, and therefore in reference to all will, divine and human. It is fatal to establish a necessary chain throughout every will in the universe. The Divine acts are free. They are necessary, I maintain, qua moral, though free qua will. But I am a determinist as much as Edwards.</p></blockquote>

<blockquote><p>Ninth Obj. He has brought himself to want by his own fault.

Ans. It must be considered what you mean by “his fault.”

1. If you mean a want of a natural faculty to manage affairs to advantage, that is to be considered as his calamity. Such a faculty is a gift that God bestows on some and not on others, and ’tis not owing to themselves. You ought to be thankful that God has given you such a gift that he has denied to him. And it will be a very suitable way for you to show your thankfulness to help them to whom that gift is denied and let them share of the benefit of it, which [is] as reasonable as that he to whom providence had imparted sight should be willing to help him to whom sight is denied, and that he should have the benefit of his sight, who has none of his own, or as he that God has given wisdom should be willing that the ignorant should have the benefit of his knowledge, or that he that has sound feet should be willing to lead the lame.

2. If they have been reduced to want by some oversight and are to be blamed that they did not consider themselves better, yet that don’t free us from all obligation of charity to ’em. If we should forever refuse to help a man because of that, that would be for us to make his inconsiderateness and imprudent act an unpardonable crime, quite contrary to the rules of the gospel, which insist so much upon forgiveness. We should not be disposed so highly to resent such an oversight in any that we have a dear affection for, as our children or near friends, so as to refuse to help ’em in that necessity and distress which they have brought upon themselves by their own inconsiderateness; but we ought to have a dear affection and concern for the welfare of all our fellow Christians, whom we should love as brethren, as Christ has loved us.

3. If they are come to want by a vicious idleness or prodigality, yet we ben’t thereby excused from all obligation to relieve ’em unless they continue in it. If they don’t continue in it, the rules of the gospel direct us to forgive ’em; and if their fault be forgiven ’em, then it won’t remain to be any bar in the way of our charitably relieving of ’em. If we do otherwise, we shall act very contrary to that rule of loving {one another} as Christ hath {loved us}: as we observed, not in degree, but [in the] manner of our expressing {love}. Now, Christ has loved us, pitied us, and greatly laid out himself to relieve us from that want and misery that we brought on ourselves by our own folly and wickedness. We foolishly and perversely threw away those riches that we were provided with, upon which we might have lived and been happy to all eternity.

4. If they continue in the same courses still, yet that don’t excuse us from charity to their families that are innocent. If we can’t relieve those of their families without them having something of it, yet that ought not to be a bar in the way of our charity; and that, because ’tis supposed that those of their families are proper objects of charity. And those that are so, we are bound to relieve; the command is positive and absolute. If we look upon that which the heads of the families have of it as entirely lost, yet we had better lose something of our estates than suffer those who are really proper objects of charity to remain without relief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Poor, Explained and Enforced (1733) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 401-02.</cite></span></figcaption>

<blockquote><p>For we are said to be capable of many things which it is much better not to have been capable of than to be capable of. We are to able to decline, we are able to die, we are able to be destroyed and to return to nothingness. Concerning whatever is of this kind, it is entirely greater not to be able [to do] each of these than to be able [to do them]. For these are indicators of infirmity rather than signs of majesty.

And so God can do all those things, and certainly only those, whose capacity is some potency, as we have already said. And therefore we call him omnipotent the more correctly and rightly by withdrawing from his potency all arguments of infirmity.</p></blockquote>

And so God can do all those things, and certainly only those, whose capacity is some potency, as we have already said. And therefore we call him omnipotent the more correctly and rightly by withdrawing from his potency all arguments of infirmity.”

— Richard of Saint Victor, De Trinitate:, On the Trinity, trans. Jonathan Couser (c. 1162-73; n.p., 1999), I.XXI.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+we+are+said+to+be+capable+of+many+things+which+it+is+much+better+not+to+have+been+capable+of+than+to+be+capable+of.+We+are+to+able+to+decline%2C+we+are+able+to+die%2C+we+are+able+to+be+destroyed+and+to+return+to+nothingness.+Concerning+whatever+is+of+this+kind%2C+it+is+entirely+greater+not+to+be+able+%5Bto+do%5D+each+of+these+than+to+be+able+%5Bto+do+them%5D.+For+these+are+indicators+of+infirmity+rather+than+signs+of+majesty.%0A%0AAnd+so+God+can+do+all+those+things%2C+and+certainly+only+those%2C+whose+capacity+is+some+potency%2C+as+we+have+already+said.+And+therefore+we+call+him+omnipotent+the+more+correctly+and+rightly+by+withdrawing+from+his+potency+all+arguments+of+infirmity.%E2%80%9D%0A%0A%E2%80%94+Richard+of+Saint+Victor%2C+De+Trinitate%3A%2C+On+the+Trinity%2C+trans.+Jonathan+Couser+%28c.+1162-73%3B+n.p.%2C+1999%29%2C+I.XXI.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa51d317f19.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a51d317f19.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/10/richard-of-saint-victor-the-power-of-god-excludes-weakness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-00b6ddf011" data-kw="">
<blockquote><p>Man’s fall, when he sinned, is to be ascribed, therefore, not to the gift of the power to sin, but to the fault of the will. Nevertheless, though he fell by an act of will, he hath it not equally in his power by an act of the will to rise again free from sin; because although there was given to the will the power so to stand that it should not fall, there was not given it the power to rise again, if it fell.

For not so easy is it to get out of a pit as it is to fall into it. By an act of will alone man fell into the pit of sin; but no act of will is sufficient to enable him to rise again, seeing that now, even if he so will, he is not able not to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Grace and Free Will</cite>, trans. Watkin W. Williams (1128; London: SPCK, 1920), pp 39-40.</span></figcaption>

</figure><figure class="quote" id="q-c49801523a" data-kw="">
<blockquote><p>But here possibly some may inquire, how it can be our duty thus to believe the Scriptures, since we are not of ourselves able to do so? In answer to this, I shall only say,

Firstly, The very light of nature shows, that it is our duty to yield perfect obedience, but yet certain it is, we are unable to answer to our duty.

Secondly, The Scriptures plainly require us to “serve God acceptably with reverence and godly fear,” and with the same breath tells us, we must have grace to enable us to do it, Heb. 12:28.

Thirdly, We have destroyed ourselves and by our own fault impaired the powers God originally gave us, and brought ourselves under innumerable prejudices and other evils, whereby the entrance of light is obstructed: but this cannot reasonably prejudge God’s right to demand credit to his word, on which he has impressed sufficient objective evidence of himself, which any one that has not thus faultily lost his eyes, may upon attention discern.

Fourthly, It is therefore our duty to justify God, blame ourselves, and wait in the way he has prescribed for that grace which is necessary to enable us; and if thus we do his will, or aim, at least at it, we have no reason to despair, but may expect in due time to be enabled to understand and know, whether these truths are of God, or they who spoke them did it of themselves, John 7:17 though yet we cannot claim this as what is our due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay Concerning the Nature of Faith; or, The Ground upon which Faith Assents to the Scriptures</cite>, (1714) in Faith and Justification (Gwynedd: James Begg Society, 2000), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>Then again, inasmuch as, in an infinitely greater degree, it is God’s not to sin, shall we therefore venture to say that He is able both to sin and to avoid sin? God forbid that we should ever say that He is able to sin! For He cannot, as foolish persons suppose, therefore fail to be almighty, because He is unable to die, or because He cannot deny Himself.</p></blockquote>

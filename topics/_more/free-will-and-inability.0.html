<figure class="quote" id="q-91d458e168" data-kw="">
<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 57</span></figcaption>

</figure><figure class="quote" id="q-f57a940b0e" data-kw="">
<blockquote><p>For our purposes, what is relevant here is passive obediential potency, which [the reformed] Senguerdius defines as: ‘[That] whereby a subject can receive an act beyond its nature, that is, to which it is not ordained by nature and would not naturally receive, such as the potency obediential passive given in stones to become sons of Abraham, or in water to be turned into wine.’ The idea here is simple. There is a sense in which you and I are perfectly capable of performing miracles. By this, I do not mean that we currently possess the active and formal power to perform miracles. Nor do I mean that we can affect them by our own natural powers. I only mean that you and I are the sort of beings that have the capacity to be raised by an agent superior to ourselves to perform miracles. … In this sense, man’s ordering to the beatific vision is an end superadded to his nature. When we speak about something being “supernatural,” strictly speaking, we mean that it is above the power of all created nature. The beatific vision clearly belongs to this category, since, as Thomas argues, no created effect of God is proportionate to his essence. Therefore, the beatific vision cannot be man’s intrinsic and natural end. Nevertheless, man’s rational nature entails an obediential potency for this vision, since his intellect and will make him the sort of creature capable of enjoying it, should God will to grant it. This is not because man’s nature is proportioned to that vision by nature, but only because it is not intrinsically repugnant to it as, for instance, would be the case of a stone, which lacks even the obediential potency to enjoy the beatific vision inasmuch as it is irrational. Thus man’s nature is not ‘closed off’ to grace even though it is not naturally ordered to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/brandon-corley.html">Brandon Corley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Natural End of Man’</cite>, (2026) at American Reformer</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-24bfbca880" data-kw="">
<blockquote><p>God has implanted two accounts [rationes] in the first matter, namely, causal or obediential principles whereby all things are naturally apt to obey God, such that whatever might please him would come to be from them. He has also implanted seedlike principles—that is, active principles whereby natural effects are brought about; and he is sometimes said to act contrary to these in the miracles that he performs. But properly speaking, even then he does not act contrary to them, but alongside them, or above them. He acts above them when he brings about an effect to which nature can in no way reach, like the form of glory for the glorified bodies. He acts alongside them when he produces without the service of natural causes an effect that nature can bring about, like when in John 2 he converts water into wine. But he does not act contrary to them, since he does not make it that an active natural cause, while remaining the same in species, has a different essential effect, such as that a fire, while remaining a fire, might cool something, just as it cannot simultaneously be the same thing and different. But he can indeed destroy one nature and make another, remove one form from matter and induce another; for in this way fire acts contrary to the nature of air when it corrupts it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, bk. 1, dist. 42, Power of God, quest. 2, art. 2, ‘Whether God can do things that by nature are impossible’, reply to obj. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-8aec757b9c" data-kw="">
<blockquote><p>However, God’s activity differs from an artisan’s activity in two ways. The first way is on the part of the matter. For since an artisan does not produce matter but rather works with a given matter, he does not confer on the matter the potency to receive the forms that he introduces to the matter, nor can he put this into the matter. But God, who is the author of the entire thing, conferred not only natural forms and powers on things but also the potency for receiving that which he would make in the matter. The second way is on the part of the form, because the forms that the artisan introduces do not reproduce themselves; for a couch that putrefies does not sprout into a couch but into a plant, as is clear from the Physics 1. But natural forms [of living things] can reproduce themselves. Thus, they have the property of a seed and are called ‘seedlike.’ Now, the forms of things as existing in the divine art are called ‘primordial’ because they are, simply speaking, the first principles of things to be produced. The potency that has been implanted in things for receiving into themselves that which the will of God decrees is called ‘obediential principles’ by some, based on which matter has the ability to become what God wills it to be. Finally, the actual powers placed in matter, which give rise to natural effects, are called ‘seedlike principles.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 18, Creation of Woman, quest. 1, art. 2, I answer that, bk. 2</span></figcaption>

aec757b9c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-nature-grace/#:~:text=However%2C%20God%E2%80%99s%20activity%20differs%20from%20an,natural%20effects%2C%20are%20called%20%E2%80%98seedlike%20principles&amp;text=However%2C%20God%E2%80%99s%20activity%20differs%20from%20an%20artisan%E2%80%99s%20activity&amp;text=rise%20to%20natural%20effects%2C%20are%20called%20%E2%80%98seedlike%20principles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.”

— Thomas Aquinas, Commentary on the Sentences, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer+that+immortality+indicates+a+certain+potential+to+live+forever+and+not+die.+But+this+potential+is+not+found+in+human+nature+on+the+side+of+the+body%2C+except+imperfectly%2C+as+if+by+obediential+potency+alone%2C+since+everlasting+life+cannot+be+had+through+the+principles+of+nature.+Rather%2C+the+completion+of+this+potency+comes+from+a+divine+gift+gratuitously+conferred.+And+so%2C+immortality+can+be+considered+in+two+ways%3A+either+with+regard+to+incomplete+natural+potency%2C+and+in+this+way%2C+there+is+one+and+the+same+immortality+just+as+there+is+one+and+the+same+nature%3B+or+with+regard+to+the+gift+of+grace%2C+which+is+like+the+formal+element+completing+the+aforementioned+potency.+And+in+this+way%2C+we+find+a+difference+between+the+two+immortalities+and+impassibilities%2C+since+the+first+was+through+the+grace+of+innocence+whereas+the+final+will+be+through+the+gift+of+glory.+For+in+the+first+state+the+soul%E2%80%99s+dominance+over+the+body+was+such+that+nothing+in+the+body+could+happen+that+would+be+adverse+to+the+soul.+But+in+the+last+state+the+dominance+will+be+greater%2C+inasmuch+as+the+properties+of+the+soul+will+in+a+certain+way+overflow+into+the+body+such+that+the+body+will+be+rendered+agile%2C+bright%2C+and+spiritual%2C+as+well+as+impassible.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Commentary+on+the+Sentences%2C+distinction+19%2C+Immortality+in+the+Original+State+of+Man%2C+quest.+1%2C+art.+5%2C+Whether+the+immoratlity+of+Adam+was+the+same+as+the+immortality+of+the+resurrected%2C+I+answer+that%2C+bk.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe052571c14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" h </figure><figure class="quote" id="q-8d7480c6b7" data-kw="">
<blockquote><p>The capacity of a created thing can be understood in two ways. The first is according to its natural potency, which pertains to its seedlike principle. In this respect, God does not leave empty any capacity of a created thing, generically speaking, although the capacity of some particular created thing may not be fulfilled, due to some impediment. The second is according to its obediential potency, whereby anything created is able to become what God wills it to be. And in this respect, in human nature there is a capacity for this dignity: that of being assumed into the unity of the divine [Second] person. Nor must every capacity like this be fulfilled, just as God need not do whatever he is able to do, but rather what befits the order established by his wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 1, Incarnation, quest. 1, art. 3, Whether God would have been incarnate if man had not sinned, Reply to obj. 4, bk. 3,</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-b08de97c2c" data-kw="">
<blockquote><p>In Christ’s conception there were two miracles: one that a woman conceived God, and another that a virgin begot a child. As to the first, then, the Blessed Virgin was involved in the conception only according to an obediential potency, and yet one much more remote than was the man’s rib as that from which the woman was formed. Now, in such matters the act and the potency toward the act are given together, as far as this may be said to be possible. But as to the second miracle, the Virgin did have a passive potency, although a natural one, which could be brought into act by a natural agent. Whence, as to the first he [Lombard] says, ‘a power receptive of the Word of God’; but as to the second he says, ‘but at the same time a power to beget the Word of God’. For the power of the Holy Spirit brings both potencies into act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 3, quest. 2, art. 1, Whether the Virgin actively contributed anything toward Christ’s conception, Reply to obj. 1, bk. 3,</span></figcaption>

<blockquote><p>No creature can do those things that are above nature as principal agent; however, it can cause a motion by uncreated power as instrumental agent: for as there is an obediential potency in creation, so that whatever the Creator has disposed happens in it, thus also so that it happens by means of it, which is the definition of an instrument.</p></blockquote>

<blockquote><p>God is said to have ceased from creating new creatures on the seventh day in that nothing has later been made that did not previously precede in some likeness in genus or species, or at least in seedlike principle or even as in obediential potency. Therefore I say that the world’s future renewal did pre-exist in the works of the six days in a kind of remote likeness, namely, in the glory or grace of the angels. It also preceded in obediential potency, which was then implanted in creation for the reception of such a renewal by God as agent.</p></blockquote>

<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God. [1 Cor,. 2:14]’ Richard Baxter:

1. What not sanctified free-will?

2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’ [1 Cor,. 2:14], that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London: Simmons, 1671), section 56, pp. 139-40</span></figcaption>

</figure><figure class="quote" id="q-f2194db38d" data-kw="">
<blockquote><p>XIII. The matter from which, of the first creation, there was none, but the omnipotent Creator produced all things from nothing, either negative, which signifies a pure negation and absence of pre-existing matter; or privative, which denotes a privation or indisposition, and therefore matter indeed, but indisposed, unsuitable, and by its nature inept for the production of the term, in which only an obediential potentiality, or non-repugnance in order to the first cause, acting with infinite power, is given. And the first, or immediate, creation [Gen. 1:1] was from negative nothing; but the second, or mediate, creation of the following days [from that which was without form and void, Gen. 1:2] was from privative nothing.</p></blockquote>

<blockquote><p>41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]</p></blockquote>

<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>

</figure><figure class="quote" id="q-fd151550ce" data-kw="">
<blockquote><p>Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories… Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them.</p></blockquote>

<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>

</figure><figure class="quote" id="q-4941084f95" data-kw="">
<blockquote><p>Today, the doctors of the Roman Church accuse the Protestants of denying free will; where, however, it should be noted that the question is not about the state of Integrity… But when they deal with the state of sin, they attribute to Luther, Calvin and other reformers that they teach that free will was utterly extinguished and lost through the Lapse of Adam, and therefore that man after the Lapse does not have free will. But it never came into the mind of the Protestants to simply deny free will, even after the lapse, neither with respect to natural works, nor civil, nor moral works of the natural order; but they only denied the rectitude and sanity of free will, and its natural powers for spiritual good, in which matter they followed Augustine, Enchiridion, ch. 30, ‘Man, by making bad use of free will, destroyed both himself and it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), p. 5 Latin</span></figcaption>

<blockquote><p>Luther and his followers, who had at first made some very absolute and exaggerated statements in the way of denying free will altogether, came afterwards to attach much importance to a distinction between man’s freedom in things external, civil, and moral, and his freedom in things properly spiritual, and they embodied this distinction in the Confession of Augsburg (ch. 18).</p></blockquote>

</figure><figure class="quote" id="q-7d5dd1809c" data-kw="">
<blockquote><p>…the Reformers and older Calvinistic divines ascribed to man before his fall a freedom or liberty of will which they denied to man as he is, and that the only necessity or bondage which they ascribed to man as he is, was an inability to will what is spiritually good and acceptable to God, as a result or consequence simply of the entire depravity of his moral nature–i.e., of his actual dispositions and tendencies. This was the only necessity they advocated as having anything like direct and explicit sanction from scripture, or as indispensably necessary to the exposition and defence of their system of theology–not a necessity deduced from anything in God’s purposes and providence, or from anything in men’s mental constitution applicable to men, as men, or simply as creatures, but from a special feature in men’s character as fallen and depraved. This necessity or bondage under which they held man fallen, as distinguished from man unfallen, to lie, resolved itself into the entire absence in fallen man of holy and good dispositions or tendencies, and the prevalence in his moral nature of what is ungodly and depraved; and thus stood entirely distinct from, and independent of, those wider and more general considerations, whether philosophical or theological, applicable to man as man, having a certain mental constitution, or as a dependent creature and subject of God, on the ground of which the controversy about liberty and necessity has been of late commonly conducted.</p></blockquote>

</figure><figure class="quote" id="q-a9b5a185f1" data-kw="">
<blockquote><p>I willingly grant that the determination of the end does necessarily involve the means, that not only precede but procure the end. But I will utterly deny that sin is the means of damnation; we say rather that permission of sin is the means, whence notwithstanding it follows not that sin shall come to pass unavoidably, but rather avoidably, whether we consider the free will of man or the decree of God; for every particular sinful act is a natural thing, and undoubtedly man has free will as to do, so to abstain from doing, any particular act. And albeit God has determined that these particular sinful acts (instance the particular outrages committed against the holy Son of God by Herod, Pontius Pilate, together with the Gentiles and people of Israel) shall come to pass by his permission; yet seeing withal He has ordained them to come to pass contingently, that follows that they shall come to pass in such a manner as joined with a possibility of not coming to pass; otherwise they should come to pass not contingently but necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, (Oxford, 1653), bk. 1, p. 69</span></figcaption>

<blockquote><p>…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5).

5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice.

6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.</p></blockquote>

<blockquote><p>All the Reformed exclude from free choice a natural necessity, by which man is by his own nature determined to the thing he wills, as for example the sun, to shine, but nevertheless they admit the necessity: of dependence upon God, as the first cause; of infallibility, from the eternal decree; of predetermination, from governing providence; of slavery, from sin.</p></blockquote>

<blockquote><p>only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.</p></blockquote>

<blockquote><p>§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.</p></blockquote>

<blockquote><p>…we must deal with four preliminary issues: first, whether there is contingency in things; second, given that there is, we need to determine the first cause of contingency; third, we must show how the primary basis of contingency can be found in God; and fourth, we need to clarify certain propositions that arise in this discussion.</p></blockquote>

— John Duns Scotus, ‘The Nature &amp; Cause of Contingency’ in John Duns Scotus, ed. &amp; trans. Thomas Williams (Oxford, 2017), pp. 86-95 from Reportatio IA, dd. 39-40, qq. 1-3, nn. 24-59, p. 86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+must+deal+with+four+preliminary+issues%3A+first%2C+whether+there+is+contingency+in+things%3B+second%2C+given+that+there+is%2C+we+need+to+determine+the+first+cause+of+contingency%3B+third%2C+we+must+show+how+the+primary+basis+of+contingency+can+be+found+in+God%3B+and+fourth%2C+we+need+to+clarify+certain+propositions+that+arise+in+this+discussion.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+%E2%80%98The+Nature+%26+Cause+of+Contingency%E2%80%99+in+John+Duns+Scotus%2C+ed.+%26+trans.+Thomas+Williams+%28Oxford%2C+2017%29%2C+pp.+86-95+from+Reportatio+IA%2C+dd.+39-40%2C+qq.+1-3%2C+nn.+24-59%2C+p.+86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92ef00dce0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/92ef00dce0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=we%20must%20deal%20with%20four%20preliminary,propositions%20that%20arise%20in%20this%20discussion&amp;text=we%20must%20deal%20with%20four%20preliminary%20issues%3A%20first&amp;text=clarify%20certain%20propositions%20that%20arise%20in%20this%20discussion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a4c588ba16" data-kw="">
<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).”

— Stephen Hampton, Other citations (work not named), 1. ‘Free Choice’ in ‘Sin, Grace &amp; Free Choice in Post-Reformation Reformed Theology’ in Lehner, Muller &amp; Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016), pp. 229-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMaresius%E2%80%A6+insists%2C+the+Reformed+believe+that+the+power+of+free+choice+is+intrinsic+to+humanity%E2%80%A6+It+is+true+that+unlike+irrational+creatures%2C+human+beings+are+not+naturally+determined+to+just+one+course+of+action.+They+are+free%2C+in+other+words%2C+from+%E2%80%98physical+necessity%E2%80%99.+As+a+result%2C+when+human+beings+choose+to+do+something+under+the+influence+of+grace%2C+they+nonetheless+retain+a+faculty+within+them+which%2C+were+that+grace+withdrawn%2C+would+enable+them+to+pursue+another+course+of+action.+So+if+one+considers+free+choice+simply+as+a+faculty%2C+in+isolation+from+all+the+natural+and+supernatural+prerequisites+for+acting+%28the+%E2%80%98divided+sense%E2%80%99+%5Baccording+to+the+created+order%5D%29%2C+it+does+indeed+have+both+the+inherent+potential+to+accept+or+reject+a+given+course+of+action+%28%E2%80%98freedom+of+contradiction%E2%80%99%29%E2%80%A6+%E2%80%A6+So+for+Maresius%2C+free+choice+is+incompatible+with+both+physical+necessity+and+the+necessity+of+coercion%3A+but+it+is+compatible+with+other+kinds+of+necessity.+It+is+compatible%2C+for+example%2C+with+the+necessity+of+dependence+on+God+%28Maresius+1646-48%2C+2%3A12%29.+It+is+also+compatible+with+%E2%80%98moral+necessity%E2%80%99.+That+is+the+necessity+which+results+from+a+human+being%E2%80%99s+moral+character.+Jesus%E2%80%99s+moral+character+is+such+that+He+cannot+sin%3B+yet+his+goodness+is+still+freely+chosen.+The+moral+character+of+the+unregenerate+is+such+that+their+acts+are+always+sinful%3B+yet+their+sin+is+still+freely+chosen+%28Maresisu+1646-48%2C+2%3A14%29.+Free+choice+is+equally+compatible+with+the+necessity+brought+about+by+the+divine+decree.+Maresius+calls+this+kind+of+necessity+%E2%80%98hypothetical+necessity%E2%80%99+or+the+%E2%80%98necessity+of+consequence%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29%E2%80%A6+Maresius+is+seeking+to+preserve+the+fundamental+contingency+of+human+action%E2%80%A6+that+choice+is+only+necessary%2C+given+the+divine+decree%E2%80%93it+is+not+inherently+or+absolutely+necessary%E2%80%A6+for+as+Maresius+underlines%2C+%E2%80%98such+is+the+faculty+of+the+human+will+that%2C+by+its+intrinsic+constitution+and+nature%2C+it+is+equally+apt+to+choose+an+act+plainly+contrary+to+the+one+it+actually+chooses%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29.%E2%80%9D%0A%0A%E2%80%94+Stephen+Hampton%2C+Other+citations+%28work+not+named%29%2C+1.+%E2%80%98Free+Choice%E2%80%99+in+%E2%80%98Sin%2C+Grace+%26+Free+Choice+in+Post-Reformation+Reformed+Theology%E2%80%99+in+Lehner%2C+Muller+%26+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29%2C+pp.+229-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4c588ba16.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4c588ba16.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=insists%2C%20the%20Reformed%20believe%20that%20the,it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15&amp;text=insists%2C%20the%20Reformed%20believe%20that%20the%20power%20of&amp;text=the%20one%20it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>

<blockquote><p>Richard A. Muller, in his article, “Grace, Election and Contingent Choice…” deals with the historical myth that the classic reformed theology leads to metaphysical determinism. Quite the contrary to the charge, by analyzing the teachings of the major Reformed thinkers and confessions, Muller shows that the Reformed view of divine sovereignty and grace neither denies human free choice and future contingents nor undermines human responsibility.” – Jeongmo Yoo, John Edwards, p. 28 Mylius, R.A. [Richard Muller] – ‘In the Steps of Voetius: Synchronic Contingency &amp; the Significance of Cornelius Elleboogius’ Disputationes de Tetragrammato to the Analysis of his Life &amp; Work’ (2010) 10 pp. in ed. M. Wisse, M. Sarot &amp; W. Otten, Scholasticism Reformed: Essays in Honour of Willem J. Van Asselt Buy pp. 92-102 ‘God as Absolute &amp; Relative, Necessary, Free, &amp; Contingent: The Ad Intra-Ad Extra Movement of Seventeenth-Century Reformed Language About God’ in Always Reformed: Essays in Honor of W. Robert Godfrey Buy ed. R. Scott Clark &amp; Joel E. Kim, 2010, pp. 56-73 Sytsma, David – ‘The Specter of Necessitarianism’ in ch. 7, ‘From ‘Epicurean’ Physics to Ethics’ in Richard Baxter &amp; the Mechanical Philosophers (Oxford, 2017), pp. 233-39 . . Books 1600’s Strong, William – A Treatise Showing the Subordination of the Will of Man Unto the Will of God ToC (London, 1657) 335 pp. on Acts 21:14 This was recommended by Thomas Manton. Pages 197-278, especially, treat of the permissive will of God. Strong was an Independent puritan and Westminster divine. Sterry, Peter – A Discourse of the Freedom of the Will (London, 1675) 245 pp. Sterry (1613–1672) was an Independent, a Westminster divine and a chaplain to Cromwell. Sterry associated with the Cambridge Platonists prominent during the English Civil War era. Sterry had a mystical streak and was a millenarian; he expected the second advent of Christ, with the millennium on earth following, in the early 1650’s, and 1656 at the latest. This book has three parts. The first argues against “those arguments… in opposition to that liberty of the will, which [liberty] is placed in the determining of its power, received from the First Cause, unto a contrariety or contradiction in its actings, with an independency upon the First Cause, the order and connection of causes, and the understanding.</p></blockquote>

 on earth following, in the early 1650’s, and 1656 at the latest. This book has three parts. The first argues against “those arguments… in opposition to that liberty of the will, which [liberty] is placed in the determining of its power, received from the First Cause, unto a contrariety or contradiction in its actings, with an independency upon the First Cause, the order and connection of causes, and the understanding.”

</figure><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>

</figure><figure class="quote" id="q-d00bd64bf3" data-kw="">
<blockquote><p>Although the human will [according to the Roman Catholic Thomist, Domingo Banez] necessarily follows the divine will to attain the good, it does not do so with an absolute necessity (called “necessity of the consequent”) but only with a hypothetical and relative necessity (called “necessity of the consequence”). For example, the fact that the sun shines is an absolute necessity, provoked by the very nature of the sun; however, here we speak of a certain conditional or hypothetical necessity, such as the one the proposition “Peter is seated” has, while Peter is effectively seated. It is not absolutely necessary for Peter to be seated, but, if he is seated, then it is necessary for him (with necessity of consequence) to be seated. Likewise, if God, with his efficacious grace, moves a man here and now to conversion, it is necessary that he performs his conversion, but he will do so freely, because he possesses the intrinsic capacity to do it or not. Moreover, God does not concur in the human act as a partial cause, as Molina thought, but as a principal total cause, while the created free will is also a total but subordinate cause.</p></blockquote>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>

<blockquote><p>Something Contingent to Necessary Being [see pp. 48-50 of the Summary]

35. Whatever exists from itself (is either ineffectible or independent) is a necessary being. This point follows from the definitions.

36. Whatever exists contingently [see p. 48] not only has in another the reason for its existence, but receives existence from a cause that causes contingently and not necessarily [see pp. 48-49].

37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause.

38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause.

<blockquote><p>Scotus has well observed that the ultimate root of contingency is free will, for, in the system of absolute determinism, whatever happened would be necessary in its causes. It is plain that the opposite of something could only be when that something in fact comes to be if it depends immediately or at least mediately on a free cause, name on a cause that, when everything is given for acting that must be given, has it in its own power to act or not to act, or to act in this way or in some other way. Hence let a free cause be defined as a cause that in acting is undetermined either by anything outside itself and by its own nature as a being. Therefore, when all conditions outside it for acting are given, it has within it the power to act rather than not to act (liberty of contradictories), or to act in one rather than in another (liberty of contraries). So for us free cause is by definition the same as free will. A cause, therefore, that contingently causes is either such a free cause or is a non-free cause that truly depends for its existing or its causing on a free cause. So we can distinguish between a free cause and a contingently causing cause.¹ For even if a cause depends on a free first cause and thus is a contingent causer, it can be a non-free cause. Such a cause is even called by Scotus a natural cause or a cause that acts by way of nature; for any cause is a natural one that is determined by its nature to one way of acting when all necessary givens are given. It is also called a cause that is hypothetically or in a certain respect necessary. ¹ [Editor:] A cause is a contingently causing cause if it be able not to cause in the moment when it does in fact cause. As such it is opposed to a cause that causes necessarily.</p></blockquote>

<blockquote><p>CANON 18. That grace is not preceded by merit. Recompense is due to good works if they are performed; but grace, to which we have no claim, precedes them, to enable them to be done. CANON 19. That a man can be saved only when God shows mercy. Human nature, even though it remained in that sound state in which it was created, could be no means save itself, without the assistance of the Creator; hence since man cannot safe-guard his salvation without the grace of God, which is a gift, how will he be able to restore what he has lost without the grace of God? CANON 20. That a man can do no good without God. God does much that is good in a man that the man does not do; but a man does nothing good for which God is not responsible, so as to let him do it.</p></blockquote>

<blockquote><p>IX. Although natural liberty agrees in essentials with the liberty of man constituted in other states, still it differs greatly in accidentals. For the liberty of glory in blessedness is not to be able to sin (non posse peccare). The liberty of sinners in the state of sin is not to be able not to sin (non posse non peccare). The liberty of believers, in grace, is to be able to sin, and not to sin (posse peccare et non peccare). But the liberty of Adam was to be able not to sin (posse non peccare). The first was an absolute incapability of sinning; the second an incapability of acting well; the third the power of sinning and of acting well. The fourth was the power of not sinning. Augustine explains this excellently: “We must diligently and attentively examine if these good things differ, to be able not to sin (posse non peccare), and not to be able to sin (non posse peccare), to be able not to die, and not to be able to die, to be able not to leave the good, and not to be able to leave the good. For the first man was able not to sin, not to die, not to leave the good” (Admonition and Grace 12* [33] [FC 2:285; PL 44.936]). And afterwards: “Therefore the first liberty of will was to be able not to sin (posse non peccare), the last will be much greater, not to be able to sin (non posse peccare). The first immortality was the power of not dying, the last will be much greater, the incapability of dying. The first was the power of perseverance, the power to not desert the good, the last will be the happiness of perseverance, the want of power to desert the good” (ibid., pp. 285–86).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IX. Although natural liberty agrees in essentials with the liberty of man constituted in other states, still it differs greatly in accidentals. For the liberty of glory in blessedness is not to be able to sin (non posse peccare). The liberty of sinners in the state of sin is not to be able not to sin (non posse non peccare). The liberty of believers, in grace, is to be able to sin, and not to sin (posse peccare et non peccare). But the liberty of Adam was to be able not to sin (posse non peccare). The first was an absolute incapability of sinning; the second an incapability of acting well; the third the power of sinning and of acting well. The fourth was the power of not sinning. Augustine explains this excellently: “We must diligently and attentively examine if these good things differ, to be able not to sin (posse non peccare), and not to be able to sin (non posse peccare), to be able not to die, and not to be able to die, to be able not to leave the good, and not to be able to leave the good. For the first man was able not to sin, not to die, not to leave the good” (Admonition and Grace 12* [33] [FC 2:285; PL 44.936]). And afterwards: “Therefore the first liberty of will was to be able not to sin (posse non peccare), the last will be much greater, not to be able to sin (non posse peccare). The first immortality was the power of not dying, the last will be much greater, the incapability of dying. The first was the power of perseverance, the power to not desert the good, the last will be the happiness of perseverance, the want of power to desert the good” (ibid., pp. 285–86).”

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, ed. James T. Dennison Jr., vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.9 (p. 571).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+Although+natural+liberty+agrees+in+essentials+with+the+liberty+of+man+constituted+in+other+states%2C+still+it+differs+greatly+in+accidentals.+For+the+liberty+of+glory+in+blessedness+is+not+to+be+able+to+sin+%28non+posse+peccare%29.+The+liberty+of+sinners+in+the+state+of+sin+is+not+to+be+able+not+to+sin+%28non+posse+non+peccare%29.+The+liberty+of+believers%2C+in+grace%2C+is+to+be+able+to+sin%2C+and+not+to+sin+%28posse+peccare+et+non+peccare%29.+But+the+liberty+of+Adam+was+to+be+able+not+to+sin+%28posse+non+peccare%29.+The+first+was+an+absolute+incapability+of+sinning%3B+the+second+an+incapability+of+acting+well%3B+the+third+the+power+of+sinning+and+of+acting+well.+The+fourth+was+the+power+of+not+sinning.+Augustine+explains+this+excellently%3A+%E2%80%9CWe+must+diligently+and+attentively+examine+if+these+good+things+differ%2C+to+be+able+not+to+sin+%28posse+non+peccare%29%2C+and+not+to+be+able+to+sin+%28non+posse+peccare%29%2C+to+be+able+not+to+die%2C+and+not+to+be+able+to+die%2C+to+be+able+not+to+leave+the+good%2C+and+not+to+be+able+to+leave+the+good.+For+the+first+man+was+able+not+to+sin%2C+not+to+die%2C+not+to+leave+the+good%E2%80%9D+%28Admonition+and+Grace+12%2A+%5B33%5D+%5BFC+2%3A285%3B+PL+44.936%5D%29.+And+afterwards%3A+%E2%80%9CTherefore+the+first+liberty+of+will+was+to+be+able+not+to+sin+%28posse+non+peccare%29%2C+the+last+will+be+much+greater%2C+not+to+be+able+to+sin+%28non+posse+peccare%29.+The+first+immortality+was+the+power+of+not+dying%2C+the+last+will+be+much+greater%2C+the+incapability+of+dying.+The+first+was+the+power+of+perseverance%2C+the+power+to+not+desert+the+good%2C+the+last+will+be+the+happiness+of+perseverance%2C+the+want+of+power+to+desert+the+good%E2%80%9D+%28ibid.%2C+pp.+285%E2%80%9386%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+ed.+James+T.+Dennison+Jr.%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+8.1.9+%28p.+571%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0bddb2a82d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0bddb2a82d.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/01/turretin-on-the-covenant-of-nature-9/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-f9d695d05f" data-kw="">
<blockquote><p>VII. However, although he was free from the slavery of sin (because created just and upright) still he was not free from mutability (because whatever his holiness and righteousness, he was mutable, from which in consequence he could fall). Adam was placed in such a state in which he could stand and fall, sin and not sin. Although this argues less perfection than the state of grace (which is immutable), still it denotes no fault or imperfection (since immutability is by no means a gift of nature, but of grace). Still that mutability cannot belong to the liberty of Adam (although sometimes it is so termed) because that condition did not fear to be adorned with so illustrious a description which placed a limit to both the liberty and happiness of man; rather it was only an appendage of the Adamic liberty, so proper to it that it neither has been nor can be in any other man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.7 (p. 571).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/free-will-and-inability.html">Free Will and Inability</a></span></div>

</figure><figure class="quote" id="q-82aed5df44" data-kw="">
<blockquote><p>VI. The liberty of Adam was not the liberty of independence (as if he was irresponsible [anypeuthynos] and absolutely his own master) because he ought always to be in subjection (as a creature to his Creator, as a second cause to the first and to depend upon his will). It was not the liberty of a will undetermined by the practical intellect; for this would have changed the will into an irrational appetite, so that he would have sought evil as evil. This would not have been so much liberty as an unbridled license, incompatible (asystatos) with the image of God. But there was in him another threefold liberty: (1) from coaction; (2) from physical necessity; (3) from slavery (both of sin and of misery). The former two constituted his essential liberty. It belongs to man in whatever state constituted and has two characteristics: preference (to proairetikon) and will (to hekousion), so that what is done may be done by a previous judgment of the reason and spontaneously. But the latter was accidental because it comes in upon the essential liberty and can be separated from it (since true liberty exists where such freedom from slavery does not exist, as in the state of sin).</p></blockquote>

</figure><figure class="quote" id="q-ce8c3f64cf" data-kw="">
<blockquote><p>IV. Liberty is fourfold: (1) the liberty of independence which belongs to God as the first being; this is opposed to the necessity of dependence which belongs to all creatures. (2) Liberty from coaction by which man acts spontaneously and with freedom; this is opposed to the necessity of coaction seen in those who act through force. (3) Rational liberty from brute and physical necessity by which man acts from choice (ek proaireseōs) and not by a brute instinct and blind impulse; this is opposed to the physical necessity of inanimates and brutes. (4) Liberty from slavery by which man is subject to the yoke of no slavery, either of sin or of misery; this is opposed to the necessity of slavery in sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.4 (p. 570).</span></figcaption>

</figure><figure class="quote" id="q-6a39d4fcc3" data-kw="">
<blockquote><p>Thou art created, thou art healed, thou art saved. Which of these, O man, originateth from thyself? Which of these is not impossible for free choice? Thou, who didst not exist, couldest not create thyself, nor, a sinner, couldest thou justify thyself, nor, when dead, couldest thou bring thyself again to life; so say nothing of other good things, which are either necessary to them that must be healed, or laid up in store for them that are to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Grace and Free Will</cite>, trans. Watkin W. Williams (1128; London: SPCK, 1920), p. 83.</span></figcaption>

— Bernard of Clairvaux, Treatise Concerning Grace and Free Will, trans. Watkin W. Williams (1128; London: SPCK, 1920), p. 83.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThou+art+created%2C+thou+art+healed%2C+thou+art+saved.+Which+of+these%2C+O+man%2C+originateth+from+thyself%3F+Which+of+these+is+not+impossible+for+free+choice%3F+Thou%2C+who+didst+not+exist%2C+couldest+not+create+thyself%2C+nor%2C+a+sinner%2C+couldest+thou+justify+thyself%2C+nor%2C+when+dead%2C+couldest+thou+bring+thyself+again+to+life%3B+so+say+nothing+of+other+good+things%2C+which+are+either+necessary+to+them+that+must+be+healed%2C+or+laid+up+in+store+for+them+that+are+to+be+saved.%E2%80%9D%0A%0A%E2%80%94+Bernard+of+Clairvaux%2C+Treatise+Concerning+Grace+and+Free+Will%2C+trans.+Watkin+W.+Williams+%281128%3B+London%3A+SPCK%2C+1920%29%2C+p.+83.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a39d4fcc3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a39d4fcc3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/20/bernard-of-clairvaux-sinners-cannot-save-themselves/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e0597b7dbb" data-kw="">
<blockquote><p>WHEN man fell from God, great was his fall indeed; for he fell from the Creator to the creature; he fell from heaven to earth; he fell from the height of happiness to the depth of misery, for he fell from holiness into sin. And ever since man first fell from holiness to sin, he hath been unable to rise again from sin to holiness.

Ever since he first chose the evil before the good, he hath been unable to choose the good before the evil. I know that as he was created at the first with freedom of will, he had power so to choose the good as to refuse the evil, and so to refuse the evil as to choose the good. And I know also, that when he fell from God he did not quite lose that freedom of his will, for he is still a reasonable creature, and wheresoever there is reason in the understanding there is freedom in the will. But I know withal, that this freedom of will is much corrupted and degenerated now since the fall, from what it was before the fall.

Then it was free to choose the good as well as the evil; now it is free to choose the evil but not the good: then it was free from sin to holiness; now it is free from holiness to sin: then it could so refuse the evil as to choose the good, and so choose the good as to refuse the evil; but now it can only so refuse the good as to choose the evil, and so choose the evil as to refuse the good. So that though the fall did not destroy it, yet it corrupted it; though the will be still free, yet not to God, not to grace, not to piety, but only to the world, to sin, and to iniquity.

And therefore it is, that as man willingly fell into sin at first, so he willingly lies in it still; and the only reason why he doth not rise again to holiness is, because he will not: nay, he so will not, that of himself he cannot will it. For his will being itself corrupted, it cannot but choose and delight in corruption; and so it must necessarily refuse what is good and honest: which necessity doth not excuse the will, as the will doth not exclude the necessity; for indeed it is a willing necessity. As the angels necessarily love God, and yet they love him willingly; so man willingly loves sin, and yet he loves it necessarily, not from any external but an internal necessity, not forced by others, but allured by himself; his own will being so taken with sin that he cannot but take delight in it, and so averse from holiness that he cannot turn to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 274-76.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“WHEN man fell from God, great was his fall indeed; for he fell from the Creator to the creature; he fell from heaven to earth; he fell from the height of happiness to the depth of misery, for he fell from holiness into sin. And ever since man first fell from holiness to sin, he hath been unable to rise again from sin to holiness.

Ever since he first chose the evil before the good, he hath been unable to choose the good before the evil. I know that as he was created at the first with freedom of will, he had power so to choose the good as to refuse the evil, and so to refuse the evil as to choose the good. And I know also, that when he fell from God he did not quite lose that freedom of his will, for he is still a reasonable creature, and wheresoever there is reason in the understanding there is freedom in the will. But I know withal, that this freedom of will is much corrupted and degenerated now since the fall, from what it was before the fall.

Then it was free to choose the good as well as the evil; now it is free to choose the evil but not the good: then it was free from sin to holiness; now it is free from holiness to sin: then it could so refuse the evil as to choose the good, and so choose the good as to refuse the evil; but now it can only so refuse the good as to choose the evil, and so choose the evil as to refuse the good. So that though the fall did not destroy it, yet it corrupted it; though the will be still free, yet not to God, not to grace, not to piety, but only to the world, to sin, and to iniquity.

And therefore it is, that as man willingly fell into sin at first, so he willingly lies in it still; and the only reason why he doth not rise again to holiness is, because he will not: nay, he so will not, that of himself he cannot will it. For his will being itself corrupted, it cannot but choose and delight in corruption; and so it must necessarily refuse what is good and honest: which necessity doth not excuse the will, as the will doth not exclude the necessity; for indeed it is a willing necessity. As the angels necessarily love God, and yet they love him willingly; so man willingly loves sin, and yet he loves it necessarily, not from any external but an internal necessity, not forced by others, but allured by himself; his own will being so taken with sin that he cannot but take delight in it, and so averse from holiness that he cannot turn to it.”

— William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 274-76.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWHEN+man+fell+from+God%2C+great+was+his+fall+indeed%3B+for+he+fell+from+the+Creator+to+the+creature%3B+he+fell+from+heaven+to+earth%3B+he+fell+from+the+height+of+happiness+to+the+depth+of+misery%2C+for+he+fell+from+holiness+into+sin.+And+ever+since+man+first+fell+from+holiness+to+sin%2C+he+hath+been+unable+to+rise+again+from+sin+to+holiness.%0A%0AEver+since+he+first+chose+the+evil+before+the+good%2C+he+hath+been+unable+to+choose+the+good+before+the+evil.+I+know+that+as+he+was+created+at+the+first+with+freedom+of+will%2C+he+had+power+so+to+choose+the+good+as+to+refuse+the+evil%2C+and+so+to+refuse+the+evil+as+to+choose+the+good.+And+I+know+also%2C+that+when+he+fell+from+God+he+did+not+quite+lose+that+freedom+of+his+will%2C+for+he+is+still+a+reasonable+creature%2C+and+wheresoever+there+is+reason+in+the+understanding+there+is+freedom+in+the+will.+But+I+know+withal%2C+that+this+freedom+of+will+is+much+corrupted+and+degenerated+now+since+the+fall%2C+from+what+it+was+before+the+fall.%0A%0AThen+it+was+free+to+choose+the+good+as+well+as+the+evil%3B+now+it+is+free+to+choose+the+evil+but+not+the+good%3A+then+it+was+free+from+sin+to+holiness%3B+now+it+is+free+from+holiness+to+sin%3A+then+it+could+so+refuse+the+evil+as+to+choose+the+good%2C+and+so+choose+the+good+as+to+refuse+the+evil%3B+but+now+it+can+only+so+refuse+the+good+as+to+choose+the+evil%2C+and+so+choose+the+evil+as+to+refuse+the+good.+So+that+though+the+fall+did+not+destroy+it%2C+yet+it+corrupted+it%3B+though+the+will+be+still+free%2C+yet+not+to+God%2C+not+to+grace%2C+not+to+piety%2C+but+only+to+the+world%2C+to+sin%2C+and+to+iniquity.%0A%0AAnd+therefore+it+is%2C+that+as+man+willingly+fell+into+sin+at+first%2C+so+he+willingly+lies+in+it+still%3B+and+the+only+reason+why+he+doth+not+rise+again+to+holiness+is%2C+because+he+will+not%3A+nay%2C+he+so+will+not%2C+that+of+himself+he+cannot+will+it.+For+his+will+being+itself+corrupted%2C+it+cannot+but+choose+and+delight+in+corruption%3B+and+so+it+must+necessarily+refuse+what+is+good+and+honest%3A+which+necessity+doth+not+excuse+the+will%2C+as+the+will+doth+not+exclude+the+necessity%3B+for+indeed+it+is+a+willing+necessity.+As+the+angels+necessarily+love+God%2C+and+yet+they+love+him+willingly%3B+so+man+willingly+loves+sin%2C+and+yet+he+loves+it+necessarily%2C+not+from+any+external+but+an+internal+necessity%2C+not+forced+by+others%2C+but+allured+by+himself%3B+his+own+will+being+so+taken+with+sin+that+he+cannot+but+take+delight+in+it%2C+and+so+averse+from+holiness+that+he+cannot+turn+to+it.%E2%80%9D%0A%0A%E2%80%94+William+Beveridge%2C+Ecclesia+Anglicana+Ecclesia+Catholica%3B+or%2C+The+Doctrine+of+the+Church+of+England+Consonant+to+Scripture%2C+Reason%2C+and+Fathers%3A+In+a+Discourse+upon+the+Thirty-Nine+Articles+Agreed+upon+in+the+Convocation+held+at+London+MDLXII%2C+in+The+Theological+Works+of+William+Beveridge%2C+D.D.+%2812+vols%2C+Oxford%3A+John+Henry+Parker%2C+1842-48%29%2C+7%3A+274-76.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe0597b7dbb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e0597b7dbb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/12/03/william-beveridge-on-fallen-mans-corrupt-will/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Q186 But certainly that necessity, which together with lust entered the heart of man, in such a manner that he could not help but sin (just as you declared before), seems to remove contingency.

A186 Although I should confess it to be so, still men cannot be exempted from blame. First, because this necessity of sinning, with which the human race is now oppressed, is not from the Creator, but from the spontaneous (as we have said) inclination of man’s natural will to evil. Moreover, who would marvel that he is burned, who hurls himself willingly into a fire? Again, although man is not now carried to evil contingently or by chance, but out of utter necessity, since after the corruption of sin (as the Apostle said) he is enslaved to sin, until freed by the Son of God. Yet that which he does, he does spontaneously, and not from coercion.

For just as he cannot help but do evil, so also he delights in nothing other than evil, while the evil, now and then lurking under the guise of good, deceives him. And therefore, not even this necessity, which was brought in through the spontaneous fall, does remove the spontaneous moving of the will. With that granted, it follows that man is the cause of sin, since, although he sins necessarily, he also sins willingly. But still I do not even say that contingency is removed by this necessity. For although in a man who is bound under the necessity of sin, and is not yet regenerated, there now remains no deliberation either to choose the true good, or evil, as was in human nature before the Fall; still there remains a deliberating between this or that evil.

For where there is no choice concerning this or that, there is no deliberation. But even the most wicked men deliberate. But they can neither understand something, nor think anything, and therefore much less deliberate concerning something, except they either wander away from the good, or else against their conscience. Therefore, all the deliberation of them is turned to choice between two or more evils. Moreover, that they prefer the one or the other, it also happens altogether contingently, in respect to their own spontaneous will, which contingency the immutable decree of God now no more removes, than it did long ago in the uncorrupted man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), pp 76-77.</span></figcaption>

<blockquote><p>Origen’s Restorationism grew naturally out of his view of human liberty. He held that the liberty of indifference and the power of contrary choice, instead of simple self-determination, are the substance of freedom. These belong inalienably and forever to the nature of the finite will. They cannot be destroyed, even by apostasy and sin.

Consequently, there is forever a possibility of a self-conversion of the will in either direction. Free will may fall into sin at any time; and free will may turn to God at any time. This led to Origen’s theory of an endless alternation of falls and recoveries, of hells and heavens; so that practically he taught nothing but a hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), p. 3.</span></figcaption>

<blockquote><p>Grace does not grow in the garden of nature, there being no seed of it to be found therein. It is neither a natural power, such as that of the understanding, will, conscience, memory, or affections, which are to be found in all the children of Adam by nature; neither is it connatural, such as original righteousness was in Adam before his fall; neither is it a habit acquired by the multiplicity of acts, whereof there are some dispositions in nature, such as the habits of arts and sciences, and moral virtues.

Grace is a pure stream which cannot spring forth from the polluted fountain of nature. Job. 14:4: “Who can bring a clean thing out of an unclean?” You never saw figs grow upon thorns or grapes upon thistles. The souls of all the fallen children of men, being wholly corrupt and depraved with original sin, it is impossible that this good should be effected by the power of nature. Some, by the strength of natural power, cultivated by education and learning, may attain much knowledge in the mysteries of nature, and by studying the Scriptures they may attain a notional knowledge of divine mysteries; but the excellency of these mysteries is hidden from them. They still remain without the spiritual discerning of the things of the Spirit without the teachings of the Spirit (1 Corinthians 2:14).

Natural men may, through observance and diligence, attain a great accomplishment as to many moral virtues, and hereby shine with some kind of luster in darker parts of the world; but by no natural power or industry can they attain unto any truly sanctifying and saving grace. The stream cannot be raised up to a greater height than the spring lies from whence it arises. And that which is natural cannot by any natural power be elevated unto that which is supernatural.</p></blockquote>

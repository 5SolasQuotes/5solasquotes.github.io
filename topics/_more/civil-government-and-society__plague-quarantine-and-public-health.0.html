<blockquote><p>Every person is engaged in his place and capacity to appear against vice, and to endeavor the extirpation of it; but here the Magistrate in a special manner is concerned, who is to see that all infected persons be shut up. The leper under the Law was to dwell alone without the camp, that he might not converse with those that were whole: now I have told you, that sin is the worst of plagues and leprosies. You therefore that are in public places and offices are to set a watch over notorious sinners, that they go not abroad to infect others: if they break out, you may shoot at them; if sinners will be bold and daring, you are bound to unsheath the sword of justice and strike at them; as indeed there are a sort of hardened sinners that stare justice in the face, and say she is blind, and laugh at her sword, and make their brag that they never felt the edge of it. Here you will do well to make them experience how sharp it is; that others too, beholding the punishment inflicted on them, may not presume to glory in their shame.</p></blockquote>

in%20their%20shame" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9fa81f195b" data-kw="">
<blockquote><p>Item, it is statute and ordained that how soon any manner of person falls sick within this burgh, in whatsome-ever kind of sickness that ever it be, the owners of the house enclose themselves and come not forth of their houses, neither suffer any to resort to them unto the time they advertise the baillie [civil officer] of the quarter and order be taken by him, under the pain of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oct. 15</cite>, 1568, ‘Pestilence Statues’ in ‘Extracts from the Records: 1568, July-December’, in Extracts From the Records of the Burgh of Edinburgh, 1557-1571, ed. J D Marwick (Edinburgh, 1875), pp. 250-259. British History Online</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“Item, it is statute and ordained that how soon any manner of person falls sick within this burgh, in whatsome-ever kind of sickness that ever it be, the owners of the house enclose themselves and come not forth of their houses, neither suffer any to resort to them unto the time they advertise the baillie [civil officer] of the quarter and order be taken by him, under the pain of death.”

— City of Edinburgh, Oct. 15, 1568, ‘Pestilence Statues’ in ‘Extracts from the Records: 1568, July-December’, in Extracts From the Records of the Burgh of Edinburgh, 1557-1571, ed. J D Marwick (Edinburgh, 1875), pp. 250-259. British History Online">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CItem%2C+it+is+statute+and+ordained+that+how+soon+any+manner+of+person+falls+sick+within+this+burgh%2C+in+whatsome-ever+kind+of+sickness+that+ever+it+be%2C+the+owners+of+the+house+enclose+themselves+and+come+not+forth+of+their+houses%2C+neither+suffer+any+to+resort+to+them+unto+the+time+they+advertise+the+baillie+%5Bcivil+officer%5D+of+the+quarter+and+order+be+taken+by+him%2C+under+the+pain+of+death.%E2%80%9D%0A%0A%E2%80%94+City+of+Edinburgh%2C+Oct.+15%2C+1568%2C+%E2%80%98Pestilence+Statues%E2%80%99+in+%E2%80%98Extracts+from+the+Records%3A+1568%2C+July-December%E2%80%99%2C+in+Extracts+From+the+Records+of+the+Burgh+of+Edinburgh%2C+1557-1571%2C+ed.+J+D+Marwick+%28Edinburgh%2C+1875%29%2C+pp.+250-259.+British+History+Online&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9fa81f195b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/9fa81f195b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=Item%2C%20it%20is%20statute%20and%20ordained,him%2C%20under%20the%20pain%20of%20death&amp;text=Item%2C%20it%20is%20statute%20and%20ordained%20that%20how&amp;text=taken%20by%20him%2C%20under%20the%20pain%20of%20death" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d279c3545e" data-kw="">
<blockquote><p>There must also an order be set down [by the magistrates] among the citizens, to avoid public assemblies, games, feasts, drinkings, marriages, dancings, fairs, schools, churches, and public baths; for besides that in many of these there is great offence committed, not only against the body, but also against the soul, there is also no small danger of getting and scattering the infection. Wherefore, wise men give counsel that at such times we should very seldom come into great companies of men. For there is no man so unskillful but he knows that where as all things are done without consideration, as it were in a mingle mangle, that there the infection is spread farthest and infects many. As when the taverns and typling houses whither they go to drink are open unto all daily, the market also, the shambles, public places also in which linen is washed, and diverse sorts of people are wont [accustomed] to be mixed together, are haunted [frequented by the plague]. In this case, therefore, laws must be made by the Preservers [civil health officials appointed specifically for the plague] whereby such meetings may be forbidden, or else severed into diverse places and times. … If marriages are to be made (albeit whom can these contracts like in such an estate of things, in which if at any time else, the counsel of the apostle ought to prevail, that for the present necessity it were better to remain single) let them be kept with a very small number of persons and without all pomp. As for drunkenness and gormandize, dancings and other not necessary or rather dangerous and hurtful ceremonies and fashions, which for the most part are wont to be used: let them be sent packing far away, lest (as it is in the proverb) this sweet meat have sour sauce (Tob. 2; Amos 8; 1. Mach. 1; Prov. 14), and lest they bewail the next day the oversight committed the day before. … Now concerning houses of learning and schools in which children come together, what shall I say? Else than that it seems very convenient and in manner necessary, if we will avoid the spreading of the infection, that those which cannot be brought unto a place more commodious, be for a time shut up and that the youth be rather taught at home, albeit with never so small profit, and give themselves to private readings than with so great danger by heaps to come together. For the age of children and lads, as being given to feeding, intemperate, tender, thin, unwary, is wont to be more subject unto this sickness [bubonic plague] than those that are elder and of more years. Wherefore, Rhases, the chief of the Arabian physicians, and after him Franciscus Valleriola, physician of Arles, give counsel that infants and children be with speed removed from infectious places into another country where they need fear no danger of infection, The like may be judged of common and yearly fairs, also of funerals or burials… Unto this chapter, let the Preservers [civil health officials appointed for the plague] add this, and earnestly advise upon it with all the magistrates, namely, whether it were better for certain poor people, which get their living by begging from door to door, and by reason of their needy life feeding on everything, are more in danger of this disease than others, go unto and run about all streets, and chiefly such houses where dead corpses are, and seek unto all men (for cruel necessity drives them out of their own poor cottages); let them I say consider whether it were better to send them some whither else, or to maintain them by the common charge at their own houses so long until the sickness slack, that by this means occasion may be taken from them of running up and down, of receiving and scattering the infection. For it can scarce be said how great and present danger does hereby grow unto the whole city. … For this way it shall come to pass that the less multitude of people there is, so much the less infection there shall be: and the less infection there is, so much less dying and more speedy deliverance is to be hoped for. For like as when the rot is gotten into an heap of apples, the more lie gathered together, the more it increases and the longer the rotting endures: so also here it comes to pass that if once the plague be crept into a city that is populous, we see the sickness daily to be increased and cherished a great while, which thing is not wont in such sort to happen in a place less peopled…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583) | ch. 6, ‘Of Order to be Appointed Among the Citizens, and of Leaving of Public Meetings &amp; Assemblies’, pp. 26-7 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

ize%2C+dancings+and+other+not+necessary+or+rather+dangerous+and+hurtful+ceremonies+and+fashions%2C+which+for+the+most+part+are+wont+to+be+used%3A+let+them+be+sent+packing+far+away%2C+lest+%28as+it+is+in+the+proverb%29+this+sweet+meat+have+sour+sauce+%28Tob.+2%3B+Amos+8%3B+1.+Mach.+1%3B+Prov.+14%29%2C+and+lest+they+bewail+the+next+day+the+oversight+committed+the+day+before.+%E2%80%A6+Now+concerning+houses+of+learning+and+schools+in+which+children+come+together%2C+what+shall+I+say%3F+Else+than+that+it+seems+very+convenient+and+in+manner+necessary%2C+if+we+will+avoid+the+spreading+of+the+infection%2C+that+those+which+cannot+be+brought+unto+a+place+more+commodious%2C+be+for+a+time+shut+up+and+that+the+youth+be+rather+taught+at+home%2C+albeit+with+never+so+small+profit%2C+and+give+themselves+to+private+readings+than+with+so+great+danger+by+heaps+to+come+together.+For+the+age+of+children+and+lads%2C+as+being+given+to+feeding%2C+intemperate%2C+tender%2C+thin%2C+unwary%2C+is+wont+to+be+more+subject+unto+this+sickness+%5Bbubonic+plague%5D+than+those+that+are+elder+and+of+more+years.+Wherefore%2C+Rhases%2C+the+chief+of+the+Arabian+physicians%2C+and+after+him+Franciscus+Valleriola%2C+physician+of+Arles%2C+give+counsel+that+infants+and+children+be+with+speed+removed+from+infectious+places+into+another+country+where+they+need+fear+no+danger+of+infection%2C+The+like+may+be+judged+of+common+and+yearly+fairs%2C+also+of+funerals+or+burials%E2%80%A6+Unto+this+chapter%2C+let+the+Preservers+%5Bcivil+health+officials+appointed+for+the+plague%5D+add+this%2C+and+earnestly+advise+upon+it+with+all+the+magistrates%2C+namely%2C+whether+it+were+better+for+certain+poor+people%2C+which+get+their+living+by+begging+from+door+to+door%2C+and+by+reason+of+their+needy+life+feeding+on+everything%2C+are+more+in+danger+of+this+disease+than+others%2C+go+unto+and+run+about+all+streets%2C+and+chiefly+such+houses+where+dead+corpses+are%2C+and+seek+unto+all+men+%28for+cruel+necessity+drives+them+out+of+their+own+poor+cottages%29%3B+let+them+I+say+consider+whether+it+were+better+to+send+them+some+whither+else%2C+or+to+maintain+them+by+the+common+charge+at+their+own+houses+so+long+until+the+sickness+slack%2C+that+by+this+means+occasion+may+be+taken+from+them+of+running+up+and+down%2C+of+receiving+and+scattering+the+infection.+For+it+can+scarce+be+said+how+great+and+present+danger+does+hereby+grow+unto+the+whole+city.+%E2%80%A6+For+this+way+it+shall+come+to+pass+that+the+less+multitude+of+people+there+is%2C+so+much+the+less+infection+there+shall+be%3A+and+the+less+infection+there+is%2C+so+much+less+dying+and+more+speedy+deliverance+is+to+be+hoped+for.+For+like+as+when+the+rot+is+gotten+into+an+heap+of+apples%2C+the+more+lie+gathered+together%2C+the+more+it+increases+and+the+longer+the+rotting+endures%3A+so+also+here+it+comes+to+pass+that+if+once+the+plague+be+crept+into+a+city+that+is+populous%2C+we+see+the+sickness+daily+to+be+increased+and+cherished+a+great+while%2C+which+thing+is+not+wont+in+such+sort+to+happen+in+a+place+less+peopled%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johann+von+Ewich%2C+The+Duty+of+a+Faithful+and+Wise+Magistrate+in+Preserving+and+Delivering+of+the+Commonwealth+from+Infection+in+the+Time+of+the+Plague+or+Pestilence%2C+Two+Books+%28London%2C+1583%29+%7C+ch.+6%2C+%E2%80%98Of+Order+to+be+Appointed+Among+the+Citizens%2C+and+of+Leaving+of+Public+Meetings+%26+Assemblies%E2%80%99%2C+pp.+26-7+ff.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd279c3545e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d279c3545e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=There%20must%20also%20an%20order%20be,happen%20in%20a%20place%20less%20peopled&amp;text=There%20must%20also%20an%20order%20be%20set%20down&amp;text=sort%20to%20happen% <blockquote><p>6. They [civil magistrates] may, and ought to interpose their authority, for inhibiting the receiving and hearing, or conversing with known and manifest seducers: for, this is but to discharge, and thereby to preserve the people from running to their own hazard, even as men ought to be commanded to keep at distance with a place or person suspected to be infectious because of the pestilence; Neither could such a restraint be accounted any diminution of their just liberty, yea this were but a putting to of their sanction to the clear direction which the Lord lays upon His people, and therefore there could be no hazard to miscarry in it, especially where the application to such and such persons, might be as clearly discernable from the Word as the duty is.</p></blockquote>

</figure><figure class="quote" id="q-d9109a0038" data-kw="">
<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gary-north.html">Gary North</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conclusion’ in Ch. 56, ‘Boundary Violations’, ‘C. Public Health’, ‘2. Quarantine’ in Christian Economics: Scholar’s Edition</cite>, vol. 4 (2020)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-678f7064e9" data-kw="">
<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>

</figure><figure class="quote" id="q-833ea0c68f" data-kw="">
<blockquote><p>They that shall adventure to bring into the city and to sell things forbidden are worthily to be punished with the loss of the things themselves. The same punishment is to be laid upon the buyers, if they yet now have with them the things whole and untouched: otherwise let the punishment be equal unto the price of the things. He that is found selling of profitable things, as meats or drinks, in any other place than in the place appointed, let him bear the loss of all that he sets to sale. Whosoever of his own private authority shall covetously increase the price of things sellable above that [which] is reasonable or above the appointed rate, let him be under the punishment of unlawful usuries, and for a time forbidden to occupy any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 2, ch. 9</span></figcaption>

v>
</figure><figure class="quote" id="q-eaaf0040a1" data-kw="">
<blockquote><p>But truly the Preservers [civil health officials appointed for the plague] shall in vain altogether with this travail [labor] and diligence look unto their commonwealth if they use not like wisdom in the receiving in or shutting out of either men or things that come from other places when as this sickness is now rife everywhere and is at this time in a great part of Germany. For what shall it avail to have removed the filth of our own places, if we will receive again the corruption from others? …even so also this magistrate of ours (whom in this case we have said must be a general physician [by metaphor]) must do his diligence in the universal and common body of the commonwealth and orderly provide for all, that not so much as the least piece of infection be received or left behind whereupon new wracks and dangers are to be feared. For (as the poet says) the flame that is not looked unto does straight again recover. … But if any man shall think that it is against charity for that I hold that men and such as are our brethren are to be shut out, of the which many fly unto us as unto a sanctuary, as it were from a deadly enemy: unto him I must make this answer, that I would have no man forsaken or in any case to be destitute of our help, but yet there ought to be a set and steadfast way and order in using of help. True charity begins at itself, but ends not in it self alone: But rather it stretches out itself as far as it can to every neighbor, and according unto her power, imparts her help with every man; and as Ambrose says of liberality, [it] is commended of her faith: cause, place and time. For what a kind of charity should this be, to receive one sick sheep into the fold and to bring the scab unto the whole flock?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But truly the Preservers [civil health officials appointed for the plague] shall in vain altogether with this travail [labor] and diligence look unto their commonwealth if they use not like wisdom in the receiving in or shutting out of either men or things that come from other places when as this sickness is now rife everywhere and is at this time in a great part of Germany. For what shall it avail to have removed the filth of our own places, if we will receive again the corruption from others? …even so also this magistrate of ours (whom in this case we have said must be a general physician [by metaphor]) must do his diligence in the universal and common body of the commonwealth and orderly provide for all, that not so much as the least piece of infection be received or left behind whereupon new wracks and dangers are to be feared. For (as the poet says) the flame that is not looked unto does straight again recover. … But if any man shall think that it is against charity for that I hold that men and such as are our brethren are to be shut out, of the which many fly unto us as unto a sanctuary, as it were from a deadly enemy: unto him I must make this answer, that I would have no man forsaken or in any case to be destitute of our help, but yet there ought to be a set and steadfast way and order in using of help. True charity begins at itself, but ends not in it self alone: But rather it stretches out itself as far as it can to every neighbor, and according unto her power, imparts her help with every man; and as Ambrose says of liberality, [it] is commended of her faith: cause, place and time. For what a kind of charity should this be, to receive one sick sheep into the fold and to bring the scab unto the whole flock?”

— Johann von Ewich, The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books, (London, 1583) | bk. 1, ch. 10, ‘Of not Receiving of Travelers and Strangers into the City, nor of Bringing in of Things without a Testimonial of the Health of that Place from Whence they Come’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+truly+the+Preservers+%5Bcivil+health+officials+appointed+for+the+plague%5D+shall+in+vain+altogether+with+this+travail+%5Blabor%5D+and+diligence+look+unto+their+commonwealth+if+they+use+not+like+wisdom+in+the+receiving+in+or+shutting+out+of+either+men+or+things+that+come+from+other+places+when+as+this+sickness+is+now+rife+everywhere+and+is+at+this+time+in+a+great+part+of+Germany.+For+what+shall+it+avail+to+have+removed+the+filth+of+our+own+places%2C+if+we+will+receive+again+the+corruption+from+others%3F+%E2%80%A6even+so+also+this+magistrate+of+ours+%28whom+in+this+case+we+have+said+must+be+a+general+physician+%5Bby+metaphor%5D%29+must+do+his+diligence+in+the+universal+and+common+body+of+the+commonwealth+and+orderly+provide+for+all%2C+that+not+so+much+as+the+least+piece+of+infection+be+received+or+left+behind+whereupon+new+wracks+and+dangers+are+to+be+feared.+For+%28as+the+poet+says%29+the+flame+that+is+not+looked+unto+does+straight+again+recover.+%E2%80%A6+But+if+any+man+shall+think+that+it+is+against+charity+for+that+I+hold+that+men+and+such+as+are+our+brethren+are+to+be+shut+out%2C+of+the+which+many+fly+unto+us+as+unto+a+sanctuary%2C+as+it+were+from+a+deadly+enemy%3A+unto+him+I+must+make+this+answer%2C+that+I+would+have+no+man+forsaken+or+in+any+case+to+be+destitute+of+our+help%2C+but+yet+there+ought+to+be+a+set+and+steadfast+way+and+order+in+using+of+help.+True+charity+begins+at+itself%2C+but+ends+not+in+it+self+alone%3A+But+rather+it+stretches+out+itself+as+far+as+it+can+to+every+neighbor%2C+and+according+unto+her+power%2C+imparts+her+help+with+every+man%3B+and+as+Ambrose+says+of+liberality%2C+%5Bit%5D+is+commended+of+her+faith%3A+cause%2C+place+and+time.+For+what+a+kind+of+charity+should+this+be%2C+to+receive+one+sick+sheep+into+the+fold+and+to+bring+the+scab+unto+the+whole+flock%3F%E2%80%9D%0A%0A%E2%80%94+Johann+von+Ewich%2C+The+Duty+of+a+Faithful+and+Wise+Magistrate+in+Preserving+and+Delivering+of+the+Commonwealth+from+Infection+in+the+Time+of+the+Plague+or+Pestilence%2C+Two+Books+%28London%2C+1583%29+%7C+bk.+1%2C+ch.+10%2C+%E2%80%98Of+not+Receiving+of+Travelers+and+Strangers+into+the+City%2C+nor+of+Bringing+in+of+Things+without+a+Testimonial+of+the+Health+of+that+Place+from+Whence+they+Come%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaaf0040a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/eaaf0040a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=But%20truly%20the%20Preservers%20%5Bcivil%20health,the%20scab%20unto%20the%20whole%20flock&amp;text=But%20truly%20the%20Preservers%20%5Bcivil%20health%20officials%20appointed&amp;text=to%20bring%20the%20scab%20unto%20the%20whole%20flock" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]</p></blockquote>

</figure><figure class="quote" id="q-d88f5496f0" data-kw="">
<blockquote><p>May 21, 1585 Wilsoun, Russell, Walker, put to Assize. Finds expedient that Thomas Wilsoun, traveler, presently infected with the pest[ilence] and in point of death, and also Margaret Russell and Jonet Walker, her daughter, be incontinent [not containing themselves] put to the knowledge of an assize [judgment] for having of the pest and known the same concealing thereof and repairing amongst our Sovereign Lord’s lieges [lands] openly, to the infection of some and hazard of many, and being found culpable in any point of the premises, to be immediately execut[ed] to the death at the Stray Mercat. … May 28, 1585 Masters of the College. The bailies and a part of the council being convened, and understanding be master Robert Rollock and master Duncane Nairne, masters of the College, that the whole students, through the fire and brute of the pestilence, has left the schools and thereby they have nothing to do, desiring therefore licence of the town to depart and use their friends for a season, offering to return to their cuir [chair?] and service whensoever the town shall think expedient, upon advertisement to be made in their names be master Alexander Guthre, their clerk. Which desire the said bailies and council thought reasonable, and therefore willingly granted and consented thereto.</p></blockquote>

<blockquote><p>45. The second difference [between civil and church power] is in the object, or matter about which: The power politic or civil is occupied about the outward man and civil or earthly things, about war, peace, conservation of justice and good order in the commonwealth; also about the outward business or external things of the Church, which are indeed necessary to the Church, or profitable, as touching the outward man, yet not properly and purely spiritual, for they do not reach unto the soul, but only to the external state and condition of the ministers and members of the Church. 46. For the better understanding whereof, tis to be observed that so far as the ministers and members of the Church are citizens, subjects or members of the commonwealth, it is in the power of the Magistrate to judge, determine and give sentence concerning the disposing of their bodies or goods; As also concerning the maintenance of the poor, sick, the banished and of others in the Church which are afflicted; To regulate (so far as concerns the civil order) marriages, burials, and other circumstances which are common both to holy and also to honest civil societies; to afford places fit for holy assemblies and other external helps by which the sacred matters of the Lord may be more safely, commodiously and more easily in the Church performed: To remove the external impediments of divine worship or of ecclesiastical peace, and to repress those which exalt themselves against the true Church and her Ministers, and do raise up trouble against them. … 66. Fourthly, they [the Church and magistrate] differ in the[ir] end [design]: The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and counsel of judges; or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured, and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

</figure><figure class="quote" id="q-6997373933" data-kw="">
<blockquote><p>2. He [the king] is the head of the persons who make the Church, and so is a politic-head, but he is not the head of the Church-visible, as it is such. The head-visible and members are of one nature; the king as king is a politic and civil head; the visible Church is not a politic and civil, but an ecclesiastic body… Nathan as a man was David’s servant, but as a prophet he was God’s servant, and not David’s servant.</p></blockquote>

</figure><figure class="quote" id="q-86f1b7b339" data-kw="">
<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 19, ‘…as about… the King’s Power in Things Ecclesiastical’, pp. 303-4</span></figcaption>

</figure><figure class="quote" id="q-ad6c570a0e" data-kw="">
<blockquote><p>We do not teach that Church-men are loosed from the positive laws of emperors and kings. Bellarmine [a Papal apologist] says that the magistrate can neither punish Church-men, nor convene them before the tribunal; so [Pope] Innocentius the third, says the empire is not above the Pope, but the Pope is above the empire… And what they allege for Peter’s exemption from paying tribute, will exime [exempt] all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they [Papists]) by a divine positive law are eximed from the laws of magistrates. So says Suarez, Bellarmine, and the [??] of Rheimes, but with neither conscience, nor reason. And contrary to their own practice and doctrine: For Paul will have every soul subject to superior powers, and except the Roman Clergy want [lack] souls, they must also be subject. Solomon punished Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Caesar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil [unqualified], as many as are in danger of resisting the power, are to be subject. Rom. 13:4; but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 454-5</span></figcaption>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.”

— Alexander Henderson, ‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27, 1643’ (London, 1644)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B1.+The+Rule+of+Reformation.%5D+The+rule+of+building+the+house+of+God%2C+and+of+the+reformation+of+religion+is+the+same+and+perpetual%3A+the+commandment+of+God%2C+and+not+the+commandment+of+man+one+or+more%2C+whether+they+be+civil+or+ecclesiastical+persons.+It+is+their+part+to+provide+according+to+their+places+and+callings%2C+to+command+and+direct+that+the+Commandment+of+God+be+obeyed.+This+King+commands+not+that+his+will+be+done%2C+but+what+God+has+commanded.+Neither+King+nor+Parliament+can+command+otherwise.+Civil+powers+have+great+authority%2C+not+only+in+things+civil%2C+but+in+matters+of+Religion%3B+and+they+sin+against+God%2C+if+they+use+not+the+authority+which+God+hath+put+in+their+hands%2C+for+the+good+of+Religion.+To+them+belongs+inspection+and+watching+over%2C+not+only+ecclesiasticos+%5Becclesiastical+persons%5D%2C+but+ecclesiastica+%5Bthat+which+is+ecclesiastical%5D.+Ecclesiastical+persons+are+subject+to+civil+authority+no+less+than+others%3B+and+in+respect+of+things-ecclesiastical%2C+or+matters+of+religion%2C+Eusebius+brings+in+Constantine+the+great%2C+saying%3A+%E2%80%98Vos+Episcopi+in+Ecclesia%2C+ego+extra+Ecclesiam+seu+templum+Episcopus+a+Deo+constitutus+sum%E2%80%98+%5BYe+are+overseers+in+the+Church%3B+I+am+constituted+of+God+an+overseer+outside+of+the+Church+Church%5D%3A+Not+that+any+mortal+man+whether+Pope+or+Prince%2C+can+be+properly+Head+of+the+Church%2C+or+vice-gerent+%5Bregent%5D+unto+Christ+the+Mediator+in+his+special+and+economical+Kingdom+of+Grace%3A+for+princes+are+vice-gerents+to+God%2C+and+to+his+Son+Jesus+Christ+as+He+is+God%2C+in+his+universal+Kingdom+of+Providence%3B+and+this+watching+and+inspection+of+princes+and+magistrates%2C+is+objective+ecclesiastica+%5Bobjectively+ecclesiastical%5D%2C+but+formaliter+civilis+%5Bformally+civil%5D%2C+it+is+about+matters+of+religion+in+a+civil+manner%2C+and+in+a+way+suitable+to+the+nature+and+quality+of+their+place+and+power.+The+faithful+custody+and+preservation+of+religion%2C+is+a+part+of+their+office%3A+for+they+are+not+only+keepers+of+the+Second%2C+but+of+the+First+Table+of+the+Law%E2%80%A6+Religion+also+expects+from+them+the+civil+sanction%2C+that+the+worship+of+God%2C+and+the+wholesome+constitutions+of+the+Church+about+religion%2C+be+confirmed+and+settled+by+their+Laws.+Coaction+%5Bcoercion%5D+also+is+theirs%2C+for+they+by+their+power+%5Bin+a+Christian+nation%5D+are+to+constrain+their+subjects+to+the+duties+of+religion%2C+and+to+coerce+and+stop+them+that+they+do+nothing+to+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson%2C+%E2%80%98A+Sermon+Preached+To+the+Honorable+House+of+Commons%2C+at+Their+late+Solemn+Fast%2C+Wed.%2C+Dec.+27%2C+1643%E2%80%99+%28London%2C+1644%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0350d090e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/0350d090e9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=1.%20The%20Rule%20of%20Reformation.%5D%20The,they%20do%20nothing%20to%20the%20contrary&amp;text=1.%20The%20Rule%20of%20Reformation.%5D%20The%20rule%20of&amp;text=them%20that%20they%20do%20nothing%20to%20the%20contrary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-56880e1e24" data-kw="">
<blockquote><p>2. My second distinction shall be this: The magistrate may and ought not only to conserve justice, peace and order in the commonwealth and in the church, as it is in the commonwealth, but also to take special care of the conservation of the true reformed religion and of the reformation of it when and wherein it needs to be reformed, imperative [by command], not elicitive [not by drawing forth the power by oneself]. The magistrate (says Dr. [Andrew] Rivet on the Decalogue, p. 262) is neither to administer Word, nor sacra- ments, nor church discipline, etc., but he is to take care that all these things be done by those whom God has called thereunto. Whatever is properly spiritual, belonging to the soul and inward man (such as church censures, and the other particular before mentioned), cannot be actus elicitus [an elicited act] of the magistrate… Yet all these, and generally the administration of the keys of the kingdom of Heaven, are actus imperati [having been commanded] of the Christian magistrate, and that both antecedenter [antecedently, before-hand] and consequenter [consequently, after-the-fact]: Antecedently, the magistrate may command church officers to suspend or excommunicate all obstinate and scandalous persons; he may command the classes to ordain able and godly ministers, and no other; he may command a synod to meet to debate and determine such or such a controversy. Consequently, also, when the thing is examined, judged, resolved, or done by the ecclesiastical power, the magistrate has power and authority to add his civil sanction, confirmation, or ratification; to make the ecclesiastical sentence to be obeyed and submitted unto by all whom it concerns; — in all which the Christian magistrate does exceeding much for the conservation and purgation of religion, not eliciendo actus, doing or exercising by himself, or by his own authority, acts of church government or discipline, but taking care that such and such things be done by those to whom they do belong.</p></blockquote>

<blockquote><p>91. For the national synod ought to declare, and that with [the] greatest reverence, to the Magistrate the grounds of their sentence, and the reasons of their proceedings when he demands or enquires into the same, and desires to be satisfied: but if the Magistrate nevertheless do dissent, or cannot by contrary reasons (which may be brought, if he please) move the synod to alter their judgement, yet may he require and procure that the matter be again debated and canvassed in another national synod…</p></blockquote>

</figure><figure class="quote" id="q-652a314578" data-kw="">
<blockquote><p>1st Assertion: The Magistrate as the Magistrate is to procure that there be preachers and Church-officers to dispense Word, Sacraments, and Discipline; For: … 2. The difference between the Magistrates and other callings, is, that the Magistrate was to take care of old, that there were Levites who bare the Ark, and, priests who should burn incense before the Lord, and sacrifice; and yet it was unlawful for the Magistrate to bear the Ark on his own shoulders, or in his own person to burn incense or sacrifice… 3. But the magistrate as the magistrate does not command [the spiritual affect of] sincere, hearty, zealous, and affectionate dispensing of Word, sacraments and discipline: But only the dispensing of those without the qualification of the spiritual, or sincere exercise of the power, because: 1. The Magistrate cannot command that as a magistrate, which he cannot judge of, whether the thing commanded be consonant to his command or not: But the magistrate as the magistrate cannot judge of the spirituallity, sincerity, zealousness, affectionateness of that obedience, which the Church yields to his command: for if the pastors dispense Word and sacraments, and bind and loose by the keys following the rules of the Word, the magistrate cannot judge the heart or intention, whether they do those with conscience to God, and reverence and subjection of spirit to his holy Law, nor can the manner of doing be proved by witnesses to the magistrate. 2. The Magistrate as Magistrate does not command what he does not praise or reward, for well doing is the object of the Magistrate’s praising and rewarding power, Rom. 13:3. But as a Magistrate he does not praise and reward the qualification, or spirituality, or sincerity of pastors dispensing of Word and seals; if they feed the flock, the Magistrate is to take care they be rewarded with wages, nor can the Magistrate as the magistrate withhold praise or wages from labourers in the vineyard because they preach Christ out of envy, as some did Phil. 1:15, or because they feed not the lambs out of a love to Christ, as they ought to do, Jn. 21:15-17; It is true, magistrates as godly men, may love and commend sincerity in faithful labourers, and hate the contrary, but this they do as Christian men, not as magistrates, not by their office, and authoritatively. 3. Magistrates command that as magistrates, the not doing of which they can as magistrates punish with the sword, for the object of their vindicative and revenging power is ill-doing, Rom. 13:4. But if pastors feed the flock and rule them, the magistrate cannot use the sword against the feeders for that they want sincerity, love, cheerfulness in the manner of doing these things, for the sword of the magistrate does only reach men for their external facts, not for opinions in the mind, not for crooked intentions, not for hollow-heartedness, hypocrisy, infidelity in the manner, or inward principles of the actions. 2nd Assertion. When magistrates command Churchmen to do their duty, and to feed the flock, sincerely, and in the fear of the Lord, they do it not as magistrates [from their office]; but as touching the manner, they may exhort them to do their duty sincerely, cordially, and zealously as godly men; hence that charge that King Jehoshaphat gave to the priests and Levites, 2 Chron. 19:9, ‘This shall ye do in the fear of the Lord faithfully, and with a perfect heart,’ is a mixed command as touching the judging of the people in all causes and controversies that should come before them; the king as king commanded them to do this: But for the manner of the doing of it, that they should do it faithfully in the fear of the Lord, and with a perfect heart; this he commanded them not as a king, but exhorted them to it as a godly and religious man, for: 1. Any godly man might have said this, and the King might have punished the Levites and priests if they had not judged the causes according to the Law. But though they had not judged in the fear of the Lord, and with a perfect heart, yet could not the king as king have punished them therefore; nor can any say that the spiritual exhortation of Hezekiah, 2 Chron. 29 to the priests and Levites came from him as king, but as from a graced and religious man; as king he might command them to sanctify themselves legally, for so they were to do by office; and he might use the sword against them, if they failed in that; and as king he may command all external duties, not only to Churchmen, but to all others, only he cannot punish them for failings in the spiritual manner of doing external duties; 2. A spiritual and Christian exhortation ex conditione operis [out of the nature of the work], and intrinsically, has influence on the conscience to turn the soul to God. But nothing that the magistrate can do as a magistrate, has such an influence on the conscience; all that he does as a magistrate and directly, is toward the outward man, by rewards and punishments; if the magistrate remove false teachers and wolves, which would devour the flock, and if that work upon the conscience, it is indirectly and by accident, for, quoad actus imperatos [as far as the acts having been commanded], he can command that the Gospel, which has a kindly [in-kind] and intrinsic power to work upon the conscience, be preached; if the magistrate convince the conscience of a murderer, that he has failed against the Law of God, he does not that as a magistrate, but as a godly and religious man he may convince him as a magistrate, that he has failed against the laws of the State and bands of human society, and external peace… Answer [to an objection]: We never denied but the magistrate commands both the exercise of Church power simply, and the manner and such qualifications as are external and obvious to the knowledge of the magistrate, such as blasphemous and false doctrine is; But we deny that as a magistrate he does command those things that are internal and invisible, that is, the spirituality of the actions; he can exhort and stir men up to the spirituality and sincerity of doing as a godly and Christian man. … Answer 1 [to another objection]: …for [ecclesiastical] elders may command as elders more than the not doing of which they can censure, which the magistrate cannot do; for elders have committed to them the Word of reconciliation, as the ambassadors of Christ. Now the Word has an immediate influence on the conscience, on the thoughts and intents of the heart: 2 Cor. 5:18-20; 1 Cor. 3:5; 1 Cor. 4:15; Ps. 19:7; Heb. 4:12-13. And therefore their ministry has action on the thoughts; yet can they not in the external court of the Church censure the thoughts, as not being able to see them, but the Gospel which they preach can arraign the conscience and thoughts, 2 Cor. 10:4-5. But the Magistrate carries not such a message, and therefore his magistratical command can reach no farther than his temporal praise and reward, and his sword; and that is commensurable and of equal latitude with those. … Answer [to another objection]: It is true, the magistrate as the magistrate does care for the supernatural good of subjects, and the duties of religion, and the First Table, but how? Intrinsically and as a magistrate, that is, that men worship God according to his Word: But: 1. The magistrate as such has nothing to do with the spirit, nor can he command the sincerity of the worship; his care is that there be a divine worship, that is, materially and externally right and consonant, externally to the rules of the Word; and for this cause learned divines make the external man the object of the magistrate’s office; but not the external man as doing the duties of the Second Table only, but also as serving God in the duties of the First Table: for which cause I said Augustine meant the same, when he said that kings serve God as men and as kings. (Augustine contra literas petilian., bk. 2, ch. 92 &amp; contra Cresconi., bk. 8, ch. 5) 2. Magistrates as magistrates are to extend their power for Christ; that is, that not only there be justice and peace amongst men, but also that there be religion in the land, yea, that the Gospel be preached; so all our divines make the king to be custos ut vindex utriusque tabulae [Keeper &amp; Vindicator of both Tables]: Yea, I think he is a keeper and preserver of the Gospel also, and is to command men to serve Christ, and profess the Gospel, and to punish the blaspheming of Jesus Christ: and this is royal and magistratical service that the King as King performs to God, and to Jesus Christ the Mediator, ex conditione operis [out of the nature of the work], in regard that good which he procures as King, materially and externally, is consonant to the supernatural Law of the Gospel, but it is not magistratical service to Christ ex intentione operantis [out of the intention of the work]. … 3rd Assertion …The unjust and evil exercise of the ministerial power is obnoxious to the magistrate as the magistrate; thus, in that he bears the sword against all evil doers, Rom. 13:1, the magistrate as the magistrate does only command well doing in order to praise and a good name, or temporal reward amongst men, Rom. 13:3, “Do that which is good and thou shalt have praise of the power;” 1 Tim. 5:17; Mt. 10:10. Nor can the magistrate as the magistrate promise, or command the [ecclesiastical] elders to feed the flock with the promise of the reward that Peter promises, 1 Pet. 5:4, to wit, that when the Chief Shepherd shall appear, they shall receive a crown of glory that fades not away. … Yet my sense is not that the magistrate can lawfully command obedience in matters of religion not understood or known by the subjects; that were to exact blind obedience; but my meaning is, that the Magistrate as the Magistrate holds not forth his commandments to teach and inform the conscience, as pastors do, but he presupposes that his mandates are known to be agreeable to the Word of God, and proposes them to the subjects to be obeyed. … 5th Assertion. When the Magistrate commands painful and sound administration in preaching and governing, with provision of the praising and rewarding of well doing, he does not subordinate to himself the ministry in its exercise, because [Rutherford gives, expounds and defends two reasons for this]… 6th Assertion. Though the magistrate may both threaten to inflict, and actually inflict the ill of temporal punishment on ministers, if they be either idle or unsound in their administration; yet thence can only be concluded that the mal-administration of the ministry is subjected to the magistrate as such, but not the ministry itself, or the exercise thereof: 1. The mal-administration of any office is accidental to the office. 2. This subjects the erring person, not the teaching minister [as such], to the civil magistrate… 7th Assertion. There is a twofold subordination of the exercise of mal-administration of ministers; one civil, another ecclesiastical: These two differ, so as the former must be subordinate to the magistrate who is to inflict bodily punishment; but the latter is only subject to the Church. The judicial determination according to the Word of God, for the informing of the conscience and gaining to the truth the erring ministers, is proper to the college [presbytery] of ministers; and in this, if the college of ministers err, they are also punishable; and the magistrate is to command them to judge and determine, de novo, over again: The magistrate in a constitute[d] church is to determine civilly [in distinction from the above, of seeking to gain erring ministers to the truth], and sentence, and civilly punish the ministers that either are dumb dogs and will not bark, or that pervert the souls of people with false doctrine; and where the Church is constituted, it is presumed that the priests, whose lips should preserve knowledge, have determined in an ecclesiastical way the very same [thing] which the judge civilly is to determine, [and that] not because the Church has so determined [already], but because he judges, in his conscience, it to be according to the Word of God. … 9th Assertion… Even as the magistrate may command the pastors to preach and dispense the sacraments aright; but the magistrate himself can neither preach nor dispense the sacraments; so the [Medieval] schoolmen say that the actions of the understanding depend on the will, quoad excercitium [as far as the exercise]: the will may set the mind to think on this or that truth, but not quoad specificationem [as far as the determination]. The will itself can neither assent, nor dissent from a truth, nor can the will command the mind to assent to a known untruth, or dissent from a known truth; the mind or understanding naturally does both; and this distinction holds in acts of the civil power and in acts merely ecclesiastical [they being coordinate].</p></blockquote>

+pastors+dispensing+of+Word+and+seals%3B+if+they+feed+the+flock%2C+the+Magistrate+is+to+take+care+they+be+rewarded+with+wages%2C+nor+can+the+Magistrate+as+the+magistrate+withhold+praise+or+wages+from+labourers+in+the+vineyard+because+they+preach+Christ+out+of+envy%2C+as+some+did+Phil.+1%3A15%2C+or+because+they+feed+not+the+lambs+out+of+a+love+to+Christ%2C+as+they+ought+to+do%2C+Jn.+21%3A15-17%3B+It+is+true%2C+magistrates+as+godly+men%2C+may+love+and+commend+sincerity+in+faithful+labourers%2C+and+hate+the+contrary%2C+but+this+they+do+as+Christian+men%2C+not+as+magistrates%2C+not+by+their+office%2C+and+authoritatively.+3.+Magistrates+command+that+as+magistrates%2C+the+not+doing+of+which+they+can+as+magistrates+punish+with+the+sword%2C+for+the+object+of+their+vindicative+and+revenging+power+is+ill-doing%2C+Rom.+13%3A4.+But+if+pastors+feed+the+flock+and+rule+them%2C+the+magistrate+cannot+use+the+sword+against+the+feeders+for+that+they+want+sincerity%2C+love%2C+cheerfulness+in+the+manner+of+doing+these+things%2C+for+the+sword+of+the+magistrate+does+only+reach+men+for+their+external+facts%2C+not+for+opinions+in+the+mind%2C+not+for+crooked+intentions%2C+not+for+hollow-heartedness%2C+hypocrisy%2C+infidelity+in+the+manner%2C+or+inward+principles+of+the+actions.+2nd+Assertion.+When+magistrates+command+Churchmen+to+do+their+duty%2C+and+to+feed+the+flock%2C+sincerely%2C+and+in+the+fear+of+the+Lord%2C+they+do+it+not+as+magistrates+%5Bfrom+their+office%5D%3B+but+as+touching+the+manner%2C+they+may+exhort+them+to+do+their+duty+sincerely%2C+cordially%2C+and+zealously+as+godly+men%3B+hence+that+charge+that+King+Jehoshaphat+gave+to+the+priests+and+Levites%2C+2+Chron.+19%3A9%2C+%E2%80%98This+shall+ye+do+in+the+fear+of+the+Lord+faithfully%2C+and+with+a+perfect+heart%2C%E2%80%99+is+a+mixed+command+as+touching+the+judging+of+the+people+in+all+causes+and+controversies+that+should+come+before+them%3B+the+king+as+king+commanded+them+to+do+this%3A+But+for+the+manner+of+the+doing+of+it%2C+that+they+should+do+it+faithfully+in+the+fear+of+the+Lord%2C+and+with+a+perfect+heart%3B+this+he+commanded+them+not+as+a+king%2C+but+exhorted+them+to+it+as+a+godly+and+religious+man%2C+for%3A+1.+Any+godly+man+might+have+said+this%2C+and+the+King+might+have+punished+the+Levites+and+priests+if+they+had+not+judged+the+causes+according+to+the+Law.+But+though+they+had+not+judged+in+the+fear+of+the+Lord%2C+and+with+a+perfect+heart%2C+yet+could+not+the+king+as+king+have+punished+them+therefore%3B+nor+can+any+say+that+the+spiritual+exhortation+of+Hezekiah%2C+2+Chron.+29+to+the+priests+and+Levites+came+from+him+as+king%2C+but+as+from+a+graced+and+religious+man%3B+as+king+he+might+command+them+to+sanctify+themselves+legally%2C+for+so+they+were+to+do+by+office%3B+and+he+might+use+the+sword+against+them%2C+if+they+failed+in+that%3B+and+as+king+he+may+command+all+external+duties%2C+not+only+to+Churchmen%2C+but+to+all+others%2C+only+he+cannot+punish+them+for+failings+in+the+spiritual+manner+of+doing+external+duties%3B+2.+A+spiritual+and+Christian+exhortation+ex+conditione+operis+%5Bout+of+the+nature+of+the+work%5D%2C+and+intrinsically%2C+has+influence+on+the+conscience+to+turn+the+soul+to+God.+But+nothing+that+the+magistrate+can+do+as+a+magistrate%2C+has+such+an+influence+on+the+conscience%3B+all+that+he+does+as+a+magistrate+and+directly%2C+is+toward+the+outward+man%2C+by+rewards+and+punishments%3B+if+the+magistrate+remove+false+teachers+and+wolves%2C+which+would+devour+the+flock%2C+and+if+that+work+upon+the+conscience%2C+it+is+indirectly+and+by+accident%2C+for%2C+quoad+actus+imperatos+%5Bas+far+as+the+acts+having+been+commanded%5D%2C+he+can+command+that+the+Gospel%2C+which+has+a+kindly+%5Bin-kind%5D+and+intrinsic+power+to+work+upon+the+conscience%2C+be+preached%3B+if+the+magistrate+convince+the+conscience+of+a+murderer%2C+that+he+has+failed+against+the+Law+of+God%2C+he+does+not+that+as+a+magistrate%2C+but+as+a+godly+and+religious+man+he+may+convince+him+as+a+magistrate%2C+that+he+has+failed+against+the+laws+of+the+State+and+bands+of+human+society%2C+and+external+peace%E2%80%A6+Answer+%5Bto+an+objection%5D%3A+We+never+denied+but+the+magistrate+commands+both+the+exercise+of+Church+power+simply%2C+and+the+manner+and+such+qualifications+as+are+external+and+obvious+to+the+knowledge+of+the+magistrate%2C+such+as+blasphemous+and+false+doctrine+is%3B+But+we+deny+that+as+a+magistrate+he+does+command+those+things+that+are+internal+and+invisible%2C+that+is%2C+the+spirituality+of+the+actions%3B+he+can+exhort+and+stir+men+up+to+the+spirituality+and+sincerity+of+doing+as+a+godly+and+Christian+man.+%E2%80%A6+Answer+1+%5Bto+another+objection%5D%3A+%E2%80%A6for+%5Becclesiastical%5D+elders+may+command+as+elders+more+than+the+not+doing+of+which+they+can+censure%2C+which+the+magistrate+cannot+do%3B+for+elders+have+committed+to+them+the+Word+of+reconciliation%2C+as+the+ambassadors+of+Christ.+Now+the+Word+has+an+immediate+influence+on+the+conscience%2C+on+the+thoughts+and+intents+of+the+heart%3A+2+Cor.+5%3A18-20%3B+1+Cor.+3%3A5%3B+1+Cor.+4%3A15%3B+Ps.+19%3A7%3B+Heb.+4%3A12-13.+And+therefore+their+ministry+has+action+on+the+thoughts%3B+yet+can+they+not+in+the+external+court+of+the+Church+censure+the+thoughts%2C+as+not+being+able+to+see+them%2C+but+the+Gospel+which+they+preach+can+arraign+the+conscience+and+thoughts%2C+2+Cor.+10%3A4-5.+But+the+Magistrate+carries+not+such+a+message%2C+and+therefore+his+magistratical+command+can+reach+no+farther+than+his+temporal+praise+and+reward%2C+and+his+sword%3B+and+that+is+commensurable+and+of+equal+latitude+with+those.+%E2%80%A6+Answer+%5Bto+another+objection%5D%3A+It+is+true%2C+the+magistrate+as+the+magistrate+does+care+for+the+supernatural+good+of+subjects%2C+and+the+duties+of+religion%2C+and+the+First+Table%2C+but+how%3F+Intrinsically+and+as+a+magistrate%2C+that+is%2C+that+men+worship+God+according+to+his+Word%3A+But%3A+1.+The+magistrate+as+such+has+nothing+to+do+with+the+spirit%2C+nor+can+he+command+the+sincerity+of+the+worship%3B+his+care+is+that+there+be+a+divine+worship%2C+that+is%2C+materially+and+externally+right+and+consonant%2C+externally+to+the+rules+of+the+Word%3B+and+for+this+cause+learned+divines+make+the+external+man+the+object+of+the+magistrate%E2%80%99s+office%3B+but+not+the+external+man+as+doing+the+duties+of+the+Second+Table+only%2C+but+also+as+serving+God+in+the+duties+of+the+First+Table%3A+for+which+cause+I+said+Augustine+meant+the+same%2C+when+he+said+that+kings+serve+God+as+men+and+as+kings.+%28Augustine+contra+literas+petilian.%2C+bk.+2%2C+ch.+92+%26+contra+Cresconi.%2C+bk.+8%2C+ch.+5%29+2.+Magistrates+as+magistrates+are+to+extend+their+power+for+Christ%3B+that+is%2C+that+not+only+there+be+justice+and+peace+amongst+men%2C+but+also+that+there+be+religion+in+the+land%2C+yea%2C+that+the+Gospel+be+preached%3B+so+all+our+divines+make+the+king+to+be+custos+ut+vindex+utriusque+tabulae+%5BKeeper+%26+Vindicator+of+both+Tables%5D%3A+Yea%2C+I+think+he+is+a+keeper+and+preserver+of+the+Gospel+also%2C+and+is+to+command+men+to+serve+Christ%2C+and+profess+the+Gospel%2C+and+to+punish+the+blaspheming+of+Jesus+Christ%3A+and+this+is+royal+and+magistratical+service+that+the+King+as+King+performs+to+God%2C+and+to+Jesus+Christ+the+Mediator%2C+ex+conditione+operis+%5Bout+of+the+nature+of+the+work%5D%2C+in+regard+that+good+which+he+procures+as+King%2C+materially+and+externally%2C+is+consonant+to+the+supernatural+Law+of+the+Gospel%2C+but+it+is+not+magistratical+service+to+Christ+ex+intentione+operantis+%5Bout+of+the+intention+of+the+work%5D.+%E2%80%A6+3rd+Assertion+%E2%80%A6The+unjust+and+evil+exercise+of+the+ministerial+power+is+obnoxious+to+the+magistrate+as+the+magistrate%3B+thus%2C+in+that+he+bears+the+sword+against+all+evil+doers%2C+Rom.+13%3A1%2C+the+magistrate+as+the+magistrate+does+only+command+well+doing+in+order+to+praise+and+a+good+name%2C+or+temporal+reward+amongst+men%2C+Rom.+13%3A3%2C+%E2%80%9CDo+that+which+is+good+and+thou+shalt+have+praise+of+the+power%3B%E2%80%9D+1+Tim.+5%3A17%3B+Mt.+10%3A10.+Nor+can+the+magistrate+as+the+magistrate+promise%2C+or+command+the+%5Becclesiastical%5D+elders+to+feed+the+flock+with+the+promise+of+the+reward+that+Peter+promises%2C+1+Pet.+5%3A4%2C+to+wit%2C+that+when+the+Chief+Shepherd+shall+appear%2C+they+shall+receive+a+crown+of+glory+that+fades+not+away.+%E2%80%A6+Yet+my+sense+is+not+that+the+magistrate+can+lawfully+command+obedience+in+matters+of+religion+not+understood+or+known+by+the+subjects%3B+that+were+to+exact+blind+obedience%3B+but+my+meaning+is%2C+that+the+Magistrate+as+the+Magistrate+holds+not+forth+his+commandments+to+teach+and+inform+the+conscience%2C+as+pastors+do%2C+but+he+presupposes+that+his+mandates+are+known+to+be+agreeable+to+the+Word+of+God%2C+and+proposes+them+to+the+subjects+to+be+obeyed.+%E2%80%A6+5th+Assertion.+When+the+Magistrate+commands+painful+and+sound+administration+in+preaching+and+governing%2C+with+provision+of+the+praising+and+rewarding+of+well+doing%2C+he+does+not+subordinate+to+himself+the+ministry+in+its+exercise%2C+because+%5BRutherford+gives%2C+expounds+and+defends+two+reasons+for+this%5D%E2%80%A6+6th+Assertion.+Though+the+magistrate+may+both+threaten+to+inflict%2C+and+actually+inflict+the+ill+of+temporal+punishment+on+ministers%2C+if+they+be+either+idle+or+unsound+in+their+administration%3B+yet+thence+can+only+be+concluded+that+the+mal-administration+of+the+ministry+is+subjected+to+the+magistrate+as+such%2C+but+not+the+ministry+itself%2C+or+the+exercise+thereof%3A+1.+The+mal-administration+of+any+office+is+accidental+to+the+office.+2.+This+subjects+the+erring+person%2C+not+the+teaching+minister+%5Bas+such%5D%2C+to+the+civil+magistrate%E2%80%A6+7th+Assertion.+There+is+a+twofold+subordination+of+the+exercise+of+mal-administration+of+ministers%3B+one+civil%2C+another+ecclesiastical%3A+These+two+differ%2C+so+as+the+former+must+be+subordinate+to+the+magistrate+who+is+to+inflict+bodily+punishment%3B+but+the+latter+is+only+subject+to+the+Church.+The+judicial+determination+according+to+the+Word+of+God%2C+for+the+informing+of+the+conscience+and+gaining+to+the+truth+the+erring+ministers%2C+is+proper+to+the+college+%5Bpresbytery%5D+of+ministers%3B+and+in+this%2C+if+the+college+of+ministers+err%2C+they+are+also+punishable%3B+and+the+magistrate+is+to+command+them+to+judge+and+determine%2C+de+novo%2C+over+again%3A+The+magistrate+in+a+constitute%5Bd%5D+church+is+to+determine+civilly+%5Bin+distinction+from+the+above%2C+of+seeking+to+gain+erring+ministers+to+the+truth%5D%2C+and+sentence%2C+and+civilly+punish+the+ministers+that+either+are+dumb+dogs+and+will+not+bark%2C+or+that+pervert+the+souls+of+people+with+false+doctrine%3B+and+where+the+Church+is+constituted%2C+it+is+presumed+that+the+priests%2C+whose+lips+should+preserve+knowledge%2C+have+determined+in+an+ecclesiastical+way+the+very+same+%5Bthing%5D+which+the+judge+civilly+is+to+determine%2C+%5Band+that%5D+not+because+the+Church+has+so+determined+%5Balready%5D%2C+but+because+he+judges%2C+in+his+conscience%2C+it+to+be+according+to+the+Word+of+God.+%E2%80%A6+9th+Assertion%E2%80%A6+Even+as+the+magistrate+may+command+the+pastors+to+preach+and+dispense+the+sacraments+aright%3B+but+the+magistrate+himself+can+neither+preach+nor+dispense+the+sacraments%3B+so+the+%5BMedieval%5D+schoolmen+say+that+the+actions+of+the+understanding+depend+on+the+will%2C+quoad+excercitium+%5Bas+far+as+the+exercise%5D%3A+the+will+may+set+the+mind+to+think+on+this+or+that+truth%2C+but+not+quoad+specificationem+%5Bas+far+as+the+determination%5D.+The+will+itself+can+neither+assent%2C+nor+dissent+from+a+truth%2C+nor+can+the+will+command+the+mind+to+assent+to+a+known+untruth%2C+or+dissent+from+a+known+truth%3B+the+mind+or+understanding+naturally+does+both%3B+and+this+distinction+holds+in+acts+of+the+civil+power+and+in+acts+merely+ecclesiastical+%5Bthey+being+coordinate%5D.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+pp.+543-561&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F652a314578.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/652a314578.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=1st%20Assertion%3A%20The%20Magistrate%20as%20the,acts%20merely%20ecclesiastical%20%5Bthey%20being%20coordinate&amp;text=1st%20Assertion%3A%20The%20Magistrate%20as%20the%20Magistrate%20is&amp;text=and%20in%20acts%20merely%20ecclesiastical%20%5Bthey%20being%20coordinate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. An appellation is one thing, and the complaint of an oppressed man is another thing; or a provocation to a competent judge is one thing, and the refugium, the refuge and fleeing of an oppressed man to a higher power is another thing; if the Church err and fail against the Law of Christ in the matter, and decree the man to be a heretic, who is none, and that to be heresy which is truth, the oppressed man in a constituted Church may have his refuge to the godly Magistrate and complain, but he cannot appeal, for an appellation is from an erring judge to an higher judge, in eadem serie, in the same nature and kind of judicatures… but a complaint may be made to the Magistrate; if the Church fail in their judging, the Magistrate is to command the Church to judge it over again, but the Magistrate cannot judge it himself; as there is a complaint made to the Magistrate that the printer has not drawn the image exactly, according to the samplar: the Magistrate judges not of the art of the painter, nor can the Magistrate as the Magistrate draw the image himself; But the Magistrate may judge of the painter’s breach of promise who did the action to draw it exactly according to the samplar, and has not kept faith to the man who pays him wages; and therefore the Magistrate may either punish his moral error, his breach of promise, not his error of art (the faculty or company of painters must judge of that) or then command the painter to paint the same image again, according as the painter convenanted. But it may be objected, ‘You then make the Magistrate to meddle no more with matters of faith and preaching truth or falsehood, and giving out Ecclesiastical rules in Church government, as Acts 15, then he meddles with painting according to the principles of art; now painting according to art belongs not at all to the conscience of the Magistrate, but sound preaching, right ruling in God’s house, belongs in a far nearer relation to the conscience of the godly Magistrate.’ I Answer: As touching the formal judging Ecclesiastically… it no more belongs to him as a Magistrate… But in another consideration, as [the] sound or unsound dispensing of Word and Sacraments, as right or unjust ruling in the house of God, may more or less hurt or benefit the souls of men, which he is to care for indirectly, in ordine ad penas vel premia civilia et corporalia [in the order of civil and corporal penalties or rewards], it belongs more to the Magistrate to take care of the Church, of religion, of preaching and governing God’s House, than any painting or arts in the earth. Again, the Church proceeding in these things that are against common justice in all judicatures, no less then in the Church, as to condemn the party never heard, or not convinced [convicted] either by confession, or under two sufficient witnesses, or to do manifest injustice in the manner of proceeding, leaves a clear place to the wronged party, by the Law of Nature, if not to appeal, yet to flee and have re-course to the Christian Magistrate, who is Parens Patrie, the father of the Commonwealth. … 7. …Or, 2. the godly Magistrate would command that the Church would impartially proceed to right an oppressed man, as Cabeljavius says [Pieter Cabeljauw, c.1608-1668, who was reformed] (De Lib. Eccles., ch. 9, pp. 134-35) . Or, 3. when there is no synods to be had, then as [Jacob] Triglandius says well from Beza, the Christian Magistrate may provide fit means of relieving the oppressed. (Trigland, De Civili &amp; Ecclesiastic. Potest., ch. 20, pp. 420-21)</p></blockquote>

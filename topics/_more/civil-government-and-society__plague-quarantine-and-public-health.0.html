<blockquote><p>But, to our discontent, we also had Our due allowances the shorter made Ev’n by command. For, some (I know not why) Had falsely misinform’d Authority, That our promiscuous meetings, at the Fast, Increased the plague: which was believ’d in haste. And being urg’d, perhaps, with such fane show Of reason, as conjecture could imbue; (The matter being aggravated too, With such untruths, as travel to and fro) The public preaching on the Fasting day, Was, in an evil season, took away. For, when the flesh was fed, and soul deprived Of two repasts, which weekly we received, Profaneness, and hard-heartedness began To get new rooting in the mind of man. We missed those good helps, and those examples Which had been preached to us in our temples. The poor did want full quickly, to their grief, Those alms the Fast brought out for their relief. And, when with prayers, preaching did not go, Our cold devotions, did far colder grow. What instrument of mischief might he be Who caused that? And, what a fool was he! If Wednesday-sermons holp infect[ion]; I pray What kept us safer on the Sabbath day? Since most fast then till noon without re[in]fection? Or, what at funerals, did stop infection? Good God! in thy affairs, how vain (to me) Doth carnal policy appear to be? How apt is flesh and blood to run a course, Which makes the soul’s condition, worse and worse? To venture on eternal death how toward! And in a temporal danger what a coward! Sure, had not such a project, had a scope Beyond the reaching of the Devil’s hope, And been too damnable for any one To be his procurator thereupon; Some would have made the motion that we might Have liv’d excluded from our churches quite: And, that till God his hand should please to stay, None should in public, either preach, or pray. ‘Twas well the weekly number of the dead, By God’s mere mercy, was diminished, Before the prohibition of the Fast: The Fiend had else, for evermore, di•g•ac’t That discipline: and carnal policy Had so insulted o’re Divinity, That, in succeeding ages, men unholy, Would thence have proved, such devotion, folly. But, God prevented it, that we should take Good notice of it; and good uses make: And I have mention’d it, that here I may God’s wisdom and man’s foolishness display. Oh let us to our fasts again return; Let us, for our omissions truly mourn; And not capitulate with God, as though He, first his rod out of his hand should throw, Here we would come unto Him: for, if thus A son of ours should bear himself to us, It would our fire exasperate the more; And make the fault seem greater than before. Why should we in an action that is just The mercy of our gracious God distrust? Or, unto any place be loath to go, Where God is to be heard, or spoken to, Through fear of that which may be caught at home And in a thousand places where we come? Our sins and plagues were public: so should we In pray’rs, and tears, and alms, and fastings be. For, that strong Devil which hath tortur’d thus Our general body, is not cast from us By single exorcisms: neither shall Our privacies advantage us at all, Except in what conduces to the health Of private men, or of their private wealth. If we in close retirements (by our fear) At markets, or where worse assemblies are, Infected grow: the Devil, by and by With us persuadeth, either to belie The Church, our constant fasting, or some one Good work, or pious action we have done. (As visiting the sick, in time of need, Or any other such like Christian deed) For, he those practices doth greatly spite, And, to disparage them hath much delight: Because he sees, that such as are inclined To pious means, will soon by trial find, Good hopes to thrive beyond their expectations; Their knowledge, fool his cunning machinations; Their faiths grow strong; temptations weak appear; Their joy most perfect, where most sorrows are; And know, that when the Lord of Hosts is armed, With all his judgments, that, he least is harmed, Who, bold through love, self-trust quite from him throws And, runs with confidence to meet his blows. Let no man then be fearful to repair Unto the house of preaching, or of pray’r; Or, any whither else, those works to do, Which he by conscience is obliged to: No, though the Devil in the passage lay, Or strow’d most fearful dangers in the way. For, if in such a case, our death we take, Our death, shall for our best advantage make. Yet, let none think I this opinion carry, That ev’ry Church, will be a sanctuary, To all that come for, sure, if any dare Without devotion in God’s house appear, To them, that place, more peril threatens, than, A chamber thronged with infected men. Some fainted in the Church, as others did Within their houses (where themselves they hid) Yet not so often. For though some did please To blame the Church for spreading this disease, No places were more harmless. None did we Behold more healthy, or to scape more free From this infection, than those persons, whom We saw most often, to God’s worship come. Nor were there any houses more infected Then theirs, who most the house of God neglected. I speak not this by rumor: For, ev’n thither Resorted I, where thronged were together The greatest multitudes: And day by day I sat where all the crowd I could survey. Yet, I nor man, nor child, nor woman saw, To sink, look pale, or from their place withdraw And, doubtless, if such faintings there had been, As many prated of; I some had seen. Which, since I did not see, I wish again, None would at such a time, God’s house refrain, Except in congregations not their own, And were infection feared is, or known: Or in their own assembly, where disorder Committed willfully, the pest may further. Or, when their body’s weakened, or the air Their safety’s may some other ways impair. Excepting to (in times of visitation, When they are marked with marks of separation, As rising, blues, or sores. O, newly from The company of such like persons, come. Or, whensoever they or do•, or may Suppose themselves infectious anyway. These (as the lepers did, by Mose’ Law) From public congregations should withdraw, For, sure, if any such themselves intrude To mix among a healthy multitude, (Though prayers or devotions they pretend, Or whatsoever other pious end) Their foolish practice is unwarrantable; Yea, their condition so uncharitable, That I abhor it: and believe that for So doing, God their prayers doth abhor:</p></blockquote>

rmed, Who, bold through love, self-trust quite from him throws And, runs with confidence to meet his blows. Let no man then be fearful to repair Unto the house of preaching, or of pray’r; Or, any whither else, those works to do, Which he by conscience is obliged to: No, though the Devil in the passage lay, Or strow’d most fearful dangers in the way. For, if in such a case, our death we take, Our death, shall for our best advantage make. Yet, let none think I this opinion carry, That ev’ry Church, will be a sanctuary, To all that come for, sure, if any dare Without devotion in God’s house appear, To them, that place, more peril threatens, than, A chamber thronged with infected men. Some fainted in the Church, as others did Within their houses (where themselves they hid) Yet not so often. For though some did please To blame the Church for spreading this disease, No places were more harmless. None did we Behold more healthy, or to scape more free From this infection, than those persons, whom We saw most often, to God’s worship come. Nor were there any houses more infected Then theirs, who most the house of God neglected. I speak not this by rumor: For, ev’n thither Resorted I, where thronged were together The greatest multitudes: And day by day I sat where all the crowd I could survey. Yet, I nor man, nor child, nor woman saw, To sink, look pale, or from their place withdraw And, doubtless, if such faintings there had been, As many prated of; I some had seen. Which, since I did not see, I wish again, None would at such a time, God’s house refrain, Except in congregations not their own, And were infection feared is, or known: Or in their own assembly, where disorder Committed willfully, the pest may further. Or, when their body’s weakened, or the air Their safety’s may some other ways impair. Excepting to (in times of visitation, When they are marked with marks of separation, As rising, blues, or sores. O, newly from The company of such like persons, come. Or, whensoever they or do•, or may Suppose themselves infectious anyway. These (as the lepers did, by Mose’ Law) From public congregations should withdraw, For, sure, if any such themselves intrude To mix among a healthy multitude, (Though prayers or devotions they pretend, Or whatsoever other pious end) Their foolish practice is unwarrantable; Yea, their condition so uncharitable, That I abhor it: and believe that for So doing, God their prayers doth abhor:”

<blockquote><p>A number of proclamations issued in the relation of the visitation [of the plague in 1665] pertained to the concourse of the people. Under most circumstances the concourse of people was vehemently prohibited in political plague texts, upholding an understanding of material protection against the threat of contagion. However, the persistent belief in the moral dimension of illness manifested in proclamations that gestured to instances when gatherings could be justified, in the interest of providential salvation. On 6 July [1665], measures for designated fast days and the severity of the growing outbreak were proclaimed in a text entitled ‘By the King. A Proclamation for a Generall Fast Throughout the Realm of England’. Fast days during plague had been enacted first during an outbreak in 1563 under Elizabeth I, who, alongside her council and the church, scheduled prayer and fasting, with fasting on Wednesdays… The proclamation [in 1665] requested that citizens not only maintain the request, ‘And that the solemnization of these days may be with such Order and Decency as is requisite’… Meetings in churches continued through the outbreak, though the circumstances changed once many pulpits were left abandoned by their Anglican ministers. The flight of ministers meant nonconformist ministers took up the task of preaching at some of the vacant pulpits. Writing of the height of the epidemic, nonconformist Thomas Vincent described the scene at a church in God’s Terrible Voice in the City: ‘Now there is such a vast concourse of people in the Churches, where these ministers are to be found, that they cannot many times come near the Pulpit doors [in order to enter the pulpit to preach] for the press [of the people]’.</p></blockquote>

<blockquote><p>Though the prospect of a congregation gathering during times of contagion, whether led by the state church or a dissenting minister, is harrowing in and of itself, this did not stop such gatherings taking place. Plague services were one of the few gatherings of the public allowed, with some pulpits occupied by figures filling in for clergy who fled and room made for certain ejected ministers [from 1662] to take up their pulpits once more.</p></blockquote>

</figure><figure class="quote" id="q-e6b08d012f" data-kw="">
<blockquote><p>We have Paul’s general statement that in the churches all things are to be done decently and in order. Accordingly, civil observances, by which bonds, as it were, order and decorum are kept in the assembly of Christians, are by no means to be classed among human traditions, but are rather to be referred to that rule of the apostle, provided they are not believed to be necessary for salvation, or bind consciences by religion, or are related to the worship of God, or lodge piety in these things. But we are stoutly to resist those regulations which under the title of ‘spiritual laws’ are in force to bind consciences as if necessary for the worship of God…</p></blockquote>

<blockquote><p>That the [ecclesiastical] gathering ought to be assembled by order and then by authority of someone elected among them, we do not doubt that it is the office of the magistrate to order and provide for the ecclesiastical state to be governed well and ruled in peace, as well as to increase therein (1 Tim. 2:2).</p></blockquote>

</figure><figure class="quote" id="q-8cf882607e" data-kw="">
<blockquote><p>And first concerning Church meetings, this counsel is to be given [to civil magistrates], that they come not by heaps, or by throngs, neither in, nor go out, and that they flock not by great numbers into one church, where they shall be driven to sit straightly and near together, especially in one city: whereas there are more places fit for this purpose, in the which the divine service, that is, the expounding of the word of God, and administration of the sacraments may be done. For albeit these things may peradventure seem unto some to be but small, and of little importance, yet nothing is to be omitted, which by any means may make for the turning away of the infection. And that which Cicero said, that when as we ought to do for the benefit of men, and do service to the fellowship of mankind, nothing is to be kept close, whatsoever commodity or store we have, the same especially ought to have place at this time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, … (London, 1583), bk. 1, ch. 6, ‘Of Order to be Appointed among the Citizens, and of Leaving of Public Meetings and Assemblies,’ p. 27. Ewich was a German reformer and civil health official.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>In their several presbyteries, classes and synods, provincial and national, they have [ecclesiastical] presidents and scribes chosen from amongst themselves for the more orderly managing of their sessions. And in synods some chief magistrates are present to see order observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-paget.html">Thomas Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Humble Advertisement to the High Court of Parliament’, no page number, near the end, rt. page, in John Paget, A Defence of Church Government Exercised in Presbyterial, Classical and Synodal Assemblies</cite>, … (1641)</span></figcaption>

<blockquote><p>50. Unto the external things of the Church belongs not only the correction of heretics and other troublers of the Church, but also that civil order and way of convocating and calling together synods, which is proper to the Magistrate; for the Magistrate ought by his authority and power both to establish the rights and liberties of synods assembling together at times appointed by the known and received law, and to indict and gather together synods occasionally as often as the necessity of the Church shall require the same; Not that all or any power to consult or determine of ecclesiastic or spiritual matters does flow or spring from the Magistrate as Head of the Church under Christ; but because in those things pertaining to the outward man, the Church needs the Magistrate’s aid and support. 51. So that the Magistrate calls together synods [as teaches WCF 31.2], not as touching those things which are proper to [ecclesiastical] synods; but in respect of the things which are common to synods with other meetings and civil public assemblies, that is, not as they are assemblies in the name of Christ, to treat of matters spiritual, but as they are public assemblies within his territories; for to the end that public conventions may be kept in any territory, the licence of the lord of that place ought to be desired. In synods therefore a respect of order, as well civil as ecclesiastical is to be had; And because of this civil order, outward defense, better accommodation, together with safe access and recess, the consent and commandment of him who is appointed to take care of, and defend human order, does intervene. … He [the magistrate] takes care also for maintaining the ministers and schools, and supplies the temporal necessities of God’s servants, by his command assembles synods, when there is need of them; and summons, calls out, and draws to trial the unwilling, which without the Magistrates strength and authority cannot be done, as has been already said; he makes synods also safe and secure, and in a civil way presides or moderates in them (if it so seem good to him), either by himself or by a substitute commissioner. In all which the power of the magistrate though occupied about spiritual things, is not for all that spiritual but civil.</p></blockquote>

</figure><figure class="quote" id="q-33f20bf472" data-kw="">
<blockquote><p>Nor do the Arminians much honor the magistrate, who, walking in the steps of Erastus, do hold that the magistrate having power of public places, preachers are obliged not to preach in public places if the magistrate forbid them; but they may preach in private places. But: … 2. The Lord has no more given to magistrates power of places, or religious-actions in places, than He has given to them power of truths: Therefore, they [Arminians] must be obliged in conscience, rejecting a vain and sapless distinction, to preach in public places: for as that judicious and learned, [reformed] professor, Jacob Triglandius says, ‘The place is accident all to the worship, and changes not the nature of it;’ (Trigland, de Potest. et Eccelesiastica Dissertatio, Theol., p. 123)… 3. The apostles knew not this distinction, for they not only preached truth (the scribes and pharisees forbidding them), but in public places, and at all occasions, and daily in the Temple, and in every house they ceased not to teach and preach Jesus Christ (Acts 6:2,4; 4:1,20; 5:20-21). The magistrate, being Antichristian, forbids not preaching of saving truths because of the place, be it private or public, but he forbids them because they are saving; and if Jesus Christ has called a man to preach in public in the housetops, the magistrate has no power from God to silence him in public more than in private. The magistrate forbids that any teach false doctrine, not for the place, but because it is injurious and hurtful to human societies that men should be principled in a false religion, and cannot but disturb the public peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 557-8</span></figcaption>

7-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33f20bf472.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/33f20bf472.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=Nor%20do%20the%20Arminians%20much%20honor,cannot%20but%20disturb%20the%20public%20peace&amp;text=Nor%20do%20the%20Arminians%20much%20honor%20the%20magistrate&amp;text=religion%2C%20and%20cannot%20but%20disturb%20the%20public%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-86a7216cbc" data-kw="">
<blockquote><p>But I answer, [1.] the king as king has dominion-civil of places and times, as places and times, but not of places as sacred in use, and of times as sacred and religious: for his power in Church matters being accumulative, not privative [depriving], he cannot take away a house dedicated to God’s service no more than he can take away maintenance allotted by public authority upon hospitals, schools, doctors and pastors. God has here a sort of propriety of houses and goods as men have. Places as sacred-abused are subject to regal power; he may inhibit conventions of heretics. 2. The apostles might preach in the Temple, though civil authority forbid them. 3. Kings are as much lords of places as sacred and public, as they have a dominion of civil places, in respect the king may by coactive [coercive] power hinder that false and heretical doctrine be preached, either in public, or private places, for this he ought to do as a preserver of both Tables [of the Law] and a bearer of the sword for the good of religion; and if they may command pure doctrine to be preached, and sound discipline to be exercised, they may command the same to be done in public places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 430-1</span></figcaption>

<blockquote><p>Throughout August London suffered a grievous destruction of its citizens although a large part of its inhabitants had deserted it. On the 4th Bartholomew and Sturbridge Fairs were cancelled, and the preamble to an Order in [the civil town] Council published on the 5th records ‘the lamentable informations which we daily receive of the great spreading of the contagion of the plague through the Kingdom’. This order requested the Archbishops of Canterbury and York to instruct their bishops to notify the churchwardens [church grounds-keepers] of infected parishes to stop public assemblies and exhort their parishoners to observe the public fast… privately in their own homes.</p></blockquote>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>

</figure><figure class="quote" id="q-0c6eb61e32" data-kw="">
<blockquote><p>Answer 1: Mr. Hooker [a New England Independent puritan] makes all that Christians do as [private] Christians and as Churches, that is, gathering of Churches, hearing, partaking of seals and censures, to be private actings not belonging to the magistrate. Strange it is, that the convening of the ten thousand subjects in the same place (as our Brethren [the Independents] say) belongs nothing to the magistrate; sure it sides with peace or war. … [Answer] 3: I wonder more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another… But if Mr. Hooker mean that private actings of citizens, of members of families, of Christians, that are good and indifferent, do not appertain to the magistrate, who is an adversary to him in this? Though all good actions done in private or public deserve praise, reward and protection from the magistrate… Mr. Hooker [said]: “Commission and just permission are all one: A ruler permits a finder [founder] to set up a school; he needs no commission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, ‘Of the Magistrate’s Power in Convocating Synods’, pp. 487-9</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>…the King has sufficient power to oppose wasters of his kingdom and to require homage of his subjects. Suppose he have not an unlimited power to forbid these of other nations and Churches, and his own, to go to a synod, within or without his nation, for the settling of the Churches in necessary peace and truth, if the Churches must seek liberty and counsel for their souls good, and edification: nor has he any lawful power from God to hinder his own subjects to send commissioners to sound and godly synods for counsel and synodical light, more than Jeroboam could lawfully forbid the people to go and worship at Jerusalem, upon pretense that they might be persuaded to cleave to Rehoboam their lawful prince, and waste his new kingdom: nor hath the prince an unlimited and absolute power to exact such absolute homage of his people; nor such a power over their moving from place: ([Margin note:] The Lord of Life has principally in the First Table laid a law upon our locomotive, and all our actings, to honor and love Him first, and the prince only secondarily and subordinately to God; if God charge us first to go to public meetings to honor Him, the Prince under pretense of peace cannot forbid the people to go up to Jerusalem to worship; we are to obey God rather than man.) for so the [claimed] Church Independent of Jerusalem consisting of ten thousand, if not more, should have no intrinsic power to meet for the public worship of God; but the prince must have a lawful power to hinder their meeting, or then the Church cannot have a lawful power to meet; for the convening of ten thousands, if abused, is as dangerous for wasting of a kingdom in its own way, as the convening of a national synod, is, or may be destructive to peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, ‘Of the Magistrate’s Power in Convocating Synods’, p. 499</span></figcaption>

</figure><figure class="quote" id="q-b7ee77b51c" data-kw="">
<blockquote><p>4. the king’s power is accumulative [Rom. 13:4], in giving to the Church, and aiding and helping; God has given to the king the Ten Commandments, and the Gospel, as a pupil is given to a tutor: The King holds his sword above the Law of God, to ward off the strokes of wicked men who do hurt the Law; but the king’s power is not privative, to take any privilege from the Law and the Church: so his power is as a tutor to keep, not as a father who may both give and take away from his son the inheritance; his power is defensive, not offensive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 19, p. 298</span></figcaption>

</figure><figure class="quote" id="q-bec17fa05f" data-kw="">
<blockquote><p>…but it follows not that they [Churches] have no intrinsic power from Christ to meet themselves, if the prince refuse to convocate them, as Asa, Hezekiah, Josiah did, for the Magistrate ought to protect the independent congregation, and every single professor [of Christ]: but it follows not, therefore, [that] the single congregation has no power-intrinsic to meet for Word and seals, except the prince, who is a persecutor, give him leave… For Christ has given to his Church, and members thereof, power to worship him in private, in public, in Church-assemblies, and has laid above their heads no lawful privative [depriving] power of rulers to hinder his people to worship the Lord God, Exodus 3… The prince has no power under pretense of keeping civil peace to Caesar, to hinder actings of rendering honor to God, contrary to truth and destructive to the Gospel.</p></blockquote>

<blockquote><p>72. Fifthly, they [the Church and magistrate] are distinguished by the effect. The effect of civil power is either proper or by way of redundance; The proper effect is the safety-temporal of the commonwealth, external tranquility, the fruition of civil liberty, and of all things which are necessary to the civil society of men: The effect by way of redundance is the good of the Church, to wit, insofar as by execution of justice and good laws, some impediments that usually hinder and disturb the course of the Gospel, are avoided or taken away. 73. For by how much the more faithfully the Magistrate executes his office in punishing the wicked, and cherishing and encouraging good men, taking away those things which withstand the Gospel, and punishing or driving away the troublers and subverters of the Church; so much the more the orthodox faith and godliness are reverenced and had in estimation, sins are hated and feared: Finally, all the subjects contained (as much as concerns the outward man) within the lists of God’s Law; whence also by consequence it happens by God’s blessing, that the Church is defiled with fewer scandals and does obtain the more freedom and peace.</p></blockquote>

<blockquote><p>…external and vocal preaching, and a visible administration of the sacrament in such an orderly way, as Christ has instituted, is an external ruling of Church members according to the law of Christ as King, an external ordaining of the worship, is an external ordering of the worshippers according to the acts of worship thus ordered, as sense teaches us: but the external ordaining of the worship, to preach, this, not this, to celebrate [the sacrament] in both kinds [bread and wine], by prayer and the words of institution, and not in one kind only [a wafer, as the Papists], is an external ordering of God’s worship: therefore as kings cannot administrate the sacraments, nor preach, so neither can they have the external government of the Church in their hands. … 2… John Reynolds [the English puritan] answers [the fore-stated Popish and Erastian opinion] that, from two offices [of external government and inward, spiritual government] of the head [Christ], which is to give life and influence of motion to the members, and also to guide and moderate the actions external of the body [the Church], we cannot make two heads [the king for the outward and Christ for the inward, as in Anglicanism]; and because the king has some civil government about the Church, we cannot make two heads over the Church, Christ one, and the King another under him. [Reynolds is saying, Rutherford approving, that because the king, on presbyterianism, rightfully has ‘some civil government about the Church’, it does not follow that the king is therefore a head of the Church, under Christ or otherwise. If the king legitimately ruled in sacra, in sacred things, this would be the case; but he does not, and it cannot be the case.] 3. This [Erastian Anglican tenet] is Anabaptistical; for because the visible government of the Church is external, we are not to cut off all necessity of the ministry to feed and rule with ecclesiastical authority, and because the prince is gifted and a Christian, to give all to him, for a calling there must be from God, for the king to govern the Church of Christ by laws, and prescribing external worship therein, for Christ has left, Eph. 4; 1 Cor. 12; 1 Tim. 3; men to be feeders and governors of his Church by office, whose it is to be answerable for souls, Heb. 13:18. 4. It is tyrannical, because [1.] it puts power into the magistrate’s hand to take from the Church, that inbred and intrinsic power of external and visible government over herself and members, which all civil incorporations by instinct of nature have, and the magistrate, as such, not being a member of the Church has [would have] a headship, even being a heathen magistrate, over the redeemed body of Christ. 2. By this reason, the Lord Jesus as King has no pastors in his name to use the laws of his kingdom, by binding and loosing; for discipline being an external thing, (say they) is not a part of Christs kingly power, but the King as Christ’s civil vicar has this power [which Rutherford denies]…</p></blockquote>

al%20preaching%2C%20and%20a,has%20this%20power%20%5Bwhich%20Rutherford%20denies&amp;text=external%20and%20vocal%20preaching%2C%20and%20a%20visible%20administration&amp;text=civil%20vicar%20has%20this%20power%20%5Bwhich%20Rutherford%20denies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>

<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church. 54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

</figure><figure class="quote" id="q-8ddfaddc4a" data-kw="">
<blockquote><p>He that being in health or [is] sick, shall contemn physic, let him be condemned of stubbornness and counted as an heretic: unto whom also afterwards, less benefit and duty is due from others; nay, he shall be counted unworthy [of] the fellowship of citizens. For he has tempted God and with the rebellious Jews required miracles, when as without miracles he might have had experience of the grace of God. Whosoever shall affirm that it is lawful for Christians in the time of the plague, without a lawful cause and consent of the rulers, to leave his city and church, he is worthy [of] the name of a schismatic… And he that shall hold every plague to be as an immediate punishment from God, is to be condemned of ignorance and to be despised as an evil speaker: as one that lays upon God his own rashness and blame of his own reckless negligence.</p></blockquote>

</figure><figure class="quote" id="q-c314e5a7d1" data-kw="">
<blockquote><p>But if that cannot be conveniently had, as in a national Church it may fall out, then the Magistrate as a preserver of peace and truth, may command the sincerer part [of the Church] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15, Asa gathered together a people who entered in covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13; and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole, in which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the [ecclesiastical] synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative [to build up, according to the truth], not privative [to take away], under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God. … …but the king’s power cannot make Church-canons [determinations], for it is a part of the ministerial calling to make canons, and therefore he [the magistrate] cannot annul and dissolve canons: but some greater kingly power is due to the king in the case of the Church’s aberring, than in the case of the Church’s right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews, did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which you must do extraordinarily], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only, (for he that is not with Christ is against him) but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>

y use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which you must do extraordinarily], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only, (for he that is not with Christ is against him) but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.”

<blockquote><p>The king’s influence in Church canons (as we think) is: [1.] as a Christian antecedent, to exhort that the Lord Jesus be served; 2. concomitant, as a member of the Church to give a joint suffrage with the synod; 3. consequent, as a king to add his regal sanction to that which is decreed by the Church according to God’s Word, or otherwise to punish what is done amiss.</p></blockquote>

<blockquote><p>86. What then? Shall it be lawful ordinarily for ministers and elders to do what they list, or shall the governors [elders] in the Churches, glorying in the law, by their transgression dishonor God: God forbid. For first, if they shall trespass in anything against the magistrate or municipal laws, whether by inter-meddling in judging of civil causes, or otherwise disturbing the peace and order of the commonwealth, they are liable to civil trial and judgments, and it is in the power of the magistrate to restrain and punish them.</p></blockquote>

</figure><figure class="quote" id="q-21f77d1305" data-kw="">
<blockquote><p>If it be said, That it seems sufficient for the Magistrate to maintain civil peace, and to restrain civil disturbances [in exclusion to restraining spiritual seducers]: We may look to these considerations in answer to this: … 3. Is it possible to separate growth in delusions and variety of absurd errors, and civil faction and discord? or, in experience have they ever been separated? We see they made men carnal in Corinth, they made them bite and devour one another in Galatia, as, ch. 5 of that epistle to them; yea, provoked to debates, envying, wraths, strifes, back-bitings, whisperings, swellings, tumults, 2 Cor. 12:20, and can such things be with the entertaining of civil peace? For, does not the interruption of civil peace flow from hatred, bitterness, alienation of mind, envy contradictions, and such like? And do not these necessarily wait on debates, and diversities of opinions? For, it is not to be supposed that such differences, proceeding from want of light, can be in men that are altogether mortified and without corruption: Therefore, may it be expected that that corruption will flame out upon such occasions; and that order is observable which the apostle has, 2 Cor. 12, just now cited, where he begins with debates, and proceeds by diverse steps, till it close with tumults: and these who are acquainted with the histories of older and latter times, will acknowledge this to be a truth. 4. There is almost but very little in the foregoing particulars mentioned, but what is necessary for the preserving and restoring of civil peace, or the preventing or censuring of the disturbance thereof, seeing there can be no solid ground whereupon to maintain peace, except the springs of debates and tumults be stopped, and such distempers from which they spring, be either cured and purged away, or restrained. … Or, in the last place, it may be considered, if ever it has done good to the State, wherein it was permitted, or to the magistrates who did permit the same; or, if thereby secret jealousies, heart-burnings, divisions and factions have not been fostered and brought up to such height as has proven dangerous to the body, and has hazarded the eating out of the belly, where it was bred, or the stinging of the bosom that did give it heat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659) | Ch. 14, ‘What may be justly Acknowledged to be within the Reach and Power of the Magistrate in such a case, and so, what is his Duty?’</span></figcaption>

<blockquote><p>Then the true state of the question is not [1.] whether the sword be a means of conversion of men to the true faith [which its not], nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [they’re not], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers [its not], nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty [it can’t]. But whether or not ought the godly and Christian prince [to] restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>

<blockquote><p>…but it cannot follow, that because teaching and publishing of errors in non-fundamentals is consistent with [the persons having] saving grace, that therefore these non-fundamental sins of murder, adultery, tolerating of idolatrous high places, persecuting of faithful prophets, making of a golden calf, and hallowing of it to be adored as the God that brought Israel out of Egypt, are sins not to be tolerated in the truly godly, such as Aaron, David, and Asa, for then should they be tolerated in the wicked also, for the toleration of such in the godly, because they are not fundamental wickednesses inconsistent with saving grace, is as destructive and more because of their extreme scandalousness, to all peace and safety of human societies, and to the duty of the godly magistrate, as these same sins in the wicked, upon the same grounds publishing of all errors non-fundamental, the toleration of the high places, are as inconsistent with peace, destructive and injurious to souls, especially in the godly, as scandalous to other false teachers, as these non-fundamental sins.</p></blockquote>

<blockquote><p>For we are as much obliged to believe non-fundamentals that are clear (as that there were eight persons saved in the ark, and the old world drowned with waters, Sodom burnt with fire), as to believe fundamentals, that there is no name whereby men may be saved, but by the name of Jesus, for the Authority of God speaking in his Word and his command does equally oblige to both; but there is no such necessity so absolute in believing non-fundamentals, as in believing these, without the knowledge whereof, we cannot be saved. But it never follows that errors in non-fundamentals published and taught to the ruin of the souls of many, they having such a strong connection and influence on the knowledge of fundamentals, are to be tolerated since our sinning here does as equally and strongly strike against the authority and express command of God (at least in most things of that kind) as in points fundamental; and therefore the magistrate, who is to look to the honor of God as a Christian, and peace of societies in all, is as much obliged to punish clearly opened, non-fundamental, as fundamental, false doctrines.</p></blockquote>

</figure><figure class="quote" id="q-33bd25eab4" data-kw="">
<blockquote><p>Now toleration lays this ground as a principle: Men are not to be troubled for their conscience, because they believe, hold, publish and teach what they do, right or wrong, according to their conscience, be it erroneous or not erroneous; and their zeal, hope, persuasion, comfort, carries them to undergo the reproaches of heretics, seducers, false prophets, imprisonment, torture, death, burning quick, rather than they would sin against known truth, and offend against a conscience, though erroneous; Yet because the sufferers are not infallible, and it may be a lie, they believe, publish, and suffer, for their hope may be grounded on a lie, their comfort not bottomed on the Scripture, and so false hope and comfort, their rejoicing in sufferings, and undergoing torture and violent death, but fleeting and counterfeit joy, their zeal without knowledge, a bastard zeal, having nothing to do with the Word and Gospel-promises; but in the bottom, as contrary to them as light is to darkness: For what any saint or professor believes and publishes, he is to believe and publish, and die in it, and for it, with a faith that the contrary may be a truth of God, and so to be tolerated and born with: Now the hope of the hypocrite is therefore compared to the spider’s web, to a broken tree, to a blasted olive tree, his joy to a night vision, a dream, the cracking of thorns under a pot, because both hope and joy, and all his comfort is grounded on an erroneous conscience, a lie, an imagination, not on the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London, 1649), pp. 142-3</span></figcaption>

<blockquote><p>…for they teach, that a man may publish that which by consequence destroys the faith of fundamentals, and so subvert the faith of others, which to do is a sin; but because the man follows the indictment [conviction] of his erroneous conscience, it is no sin to the man that so teaches; yea, he may innocently suffer persecution for his conscience, thus erroneous; yea, and die a martyr for it. Therefore, if the following of an erroneous conscience shall make a less sin to be no sin but innocency, it shall make a greater sin, to wit, killing of his son to his heavenly father [as an erroneous sacrifice, modeled off of Gen. 22], no sin, and so he may lawfully do it [though this is murder]. Nor will it suffice to say, to offer a man to God and kill him, is against the light of nature, and [in]vincibly a sin; what then? if the man believe he is commanded to kill him, his erroneous conscience must bind, as the offering of whole burnt offerings to God, to us is a sin, against the light of nature, in regard the law of nature can no more warrant it, than it can warrant Christ to offer up himself to God [Christ needed the positive command from his Father]. But upon the supposition of Libertines, its no murder; nor is it punishable at all, because the father may, yea, and lawfully, ought to worship God according to the indictment of his conscience, whither the conscience be right or bloody and erroneous, and yet he is not punishable for blood-shed, by their way for merely, and simply, without any malignancy or hatred to the child; he believes, he ought to prefer his Maker to his dearest child’s life as well as Abraham, and the conscience does naturally, and as under no Law, simply believe it is the like service, and worship that Abraham would have gratefully performed unto God, if God in reward of that love, had not forbidden him again to kill his Son. And this answer presupposes also, that it is impossible for a father to have such a conscience, as may stimulate, and command to kill his son, and that in the authority, and name of God, as he erroneously, yea, and as he invincibly holds, as Socinians, Familists, Papists, believe purgatory, merits, justification by works, who yet are not to be punished for their conscience, according to Libertines. Again, there is no intrinsic malignancy [in intention] in the act of naticide, or son-sacrificing, but what it has from the Lord’s Law forbidding to kill, now those that killed their sons to Molech, yea, to God, as they thought, strongly, yea, invincibly believed God commanded them, to do Him such bodily service, as is clear from Jer. 7:31; 15:5. And that this is invincible ignorance (I take the word invincible in the Libertines’ sense) Libertines grant, for in our condemning son-sacrificing, they will say we are not infallible. Yea, the understanding, being spiritual, cannot be restrained, says Dr. [Jeremy] Taylor, sect. 13, n. 6, and no man can change his opinion when he will, says he, ibid., n. 7, and so should not be punished for it, and n. 13, there is nothing under God Almighty that has power over the soul of man, so as to command a persuasion. If he be then persuaded, that he ought to kill his son, he ought unpunishably so to do.</p></blockquote>

e such a conscience, as may stimulate, and command to kill his son, and that in the authority, and name of God, as he erroneously, yea, and as he invincibly holds, as Socinians, Familists, Papists, believe purgatory, merits, justification by works, who yet are not to be punished for their conscience, according to Libertines. Again, there is no intrinsic malignancy [in intention] in the act of naticide, or son-sacrificing, but what it has from the Lord’s Law forbidding to kill, now those that killed their sons to Molech, yea, to God, as they thought, strongly, yea, invincibly believed God commanded them, to do Him such bodily service, as is clear from Jer. 7:31; 15:5. And that this is invincible ignorance (I take the word invincible in the Libertines’ sense) Libertines grant, for in our condemning son-sacrificing, they will say we are not infallible. Yea, the understanding, being spiritual, cannot be restrained, says Dr. [Jeremy] Taylor, sect. 13, n. 6, and no man can change his opinion when he will, says he, ibid., n. 7, and so should not be punished for it, and n. 13, there is nothing under God Almighty that has power over the soul of man, so as to command a persuasion. If he be then persuaded, that he ought to kill his son, he ought unpunishably so to do.”

<blockquote><p>…but some greater kingly power is due to the king in the case of the Churches aberring, than in the case of the Churches’ right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which is extraordinary], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only (for he that is not with Christ is against Him), but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>

<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>

<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, … (1681), p. 45</span></figcaption>

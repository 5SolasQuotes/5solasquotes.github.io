</figure><figure class="quote" id="q-f925026ff3" data-kw="">
<blockquote><p>There are certain things which you cannot expect from such a true Christian Church. In the first place, you cannot expect from it any cooperation with non-Christian religion or with a non-Christian program of ethical culture. There are those who tell us that the Bible ought to be put into the public schools, and that the public schools should seek to build character by showing the children that honesty is the best policy and that good Americans do not lie nor steal. With such programs a true Christian Church will have nothing to do. The Bible, it will hold, is made to say the direct opposite of what it means if any hope is held out to mankind from its ethical portions apart from its great redemptive center and core; and character building on the basis of human experience may be character destruction; it is the very antithesis of that view of sin which is at the foundation of all Christian convictions and all Christian life. There is no such thing, a true Christian Church will insist, as a universally valid fund of religious principles upon which particular religions, including the Christian religion, may build; “religion” in that vague sense is not only inadequate but false; and a morality based upon human experience instead of upon the law of God is no true morality. Against such programs of religious education and character building, a true Christian Church will seek from the state liberty for all parents everywhere to bring up their children in accordance with the dictates of their conscience, will bring up its own children in accordance with the Word of God, and will try to persuade all other parents, becoming Christians, to bring up their children in that same Christian way. In the second place, you cannot expect from a true Christian Church any official pronouncements upon the political or social questions of the day, and you cannot expect cooperation with the state in anything involving the use of force. Important are the functions of the police, and members of the Church, either individually or in such special associations as they may choose to form, should aid the police in every lawful way in the exercise of those functions. But the function of the Church in its corporate capacity is of an entirely different kind. Its weapons against evil are spiritual, not carnal; and by becoming a political lobby, through the advocacy of political measures whether good or bad, the Church is turning aside from its proper mission, which is to bring to bear upon human hearts the solemn and imperious, yet also sweet and gracious, appeal of the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Responsibility of the Church in our New Age,” The Presbyterian Guardian 45</cite>, (February, 1976): 5, 13, 14.</span></figcaption>

mportant are the functions of the police, and members of the Church, either individually or in such special associations as they may choose to form, should aid the police in every lawful way in the exercise of those functions. But the function of the Church in its corporate capacity is of an entirely different kind. Its weapons against evil are spiritual, not carnal; and by becoming a political lobby, through the advocacy of political measures whether good or bad, the Church is turning aside from its proper mission, which is to bring to bear upon human hearts the solemn and imperious, yet also sweet and gracious, appeal of the gospel of Christ.”

<blockquote><p>No logical Christian mind can avoid the suspicion that the first principles of the true doctrine touching the relation of the temporal and spiritual powers must have very generally fallen out of the consciousness of Christendom, as he contemplates the singular fact that, after 1800 years of experiment, the whole question seems as unsettled as ever; and that all parts of Chistendom alike are still divided and agitated by antagonistic theories on the subject. In Papal countries, everywhere, he finds the old contest going on as keenly as ever, between the various theories of Ultra-montanism which makes the State a creature and subject of the Church, and of Cis-Montanism which make the Church the creature and subject of the State. He finds the continental Protestantism aroused to new vigor in the 19th century, in the conflict between the various forms of the old Zuinglian, semi-Erastian theories, which ignore the separate and independent existence of the Church, and the new theories of the school of Hegel, that the Church is but an incidental and temporary aid to the state in developing its moral ideal of a religious Commonwealth or theocracy—that, as Strauss hath it, “The Church is but the crutch of the State,” the theories of the school of Stahl and Klieforth that the Church (not the congregation, but the incorporated officers and orders of the church) constitutes a government above the state; or of Schleiermacher, contending for the co-existence of the Church and state. In Great Britain, independent of various semi-Erastian denominations of Dissenters, he finds the Anglican Church agitated by earnest conflict between the theories of the Lords in council and the lawyers, that the Church is merely a head servant of the Crown, incompetent to dismiss even her infidel servants from the priesthood, except at the bidding of the Crown; the Broad Church theories of Arnold, ignoring the separate existence of the Church, and, with Hegel, contemplating the Church as a temporary means employed by the state in the process of developing its ideal of a Christian state; and the theories of the school of Palmer, claiming the independence of the church, and at the same time, support from the revenues of the state. In Scotland, he finds the descendants of the Covenanters divided between the theories of both state support and submission to state dictation by the Church; of support from the state without submission to state dictation, and of neither Support nor dictation by the state to the Church. And even the yearnings after ecclesiastical union between the evangelical bodies whom the secularism of state support and dictation has driven out of the state Church at various eras, are seriously impeded in giving effect to these Christian truths by grave dissension’s on the theoretic question whether the Church may not sell her birthright for the state’s “mess of pottage!” But, what is more remarkable still, he finds the American Churches, whose boast it has been for near 100 years that here at last the Church’s independent existence has been recognized by the civil power, apparently eager to assume the secular yoke again as if tired of their liberty, to engage in the service of Caesar, and shout with the mob “We have no king but Caesar!” And, in consequence of this tendency, they are agitated by conflicts similar to those of the churches under the state yoke, between the theories—First, of what may be called the Virginia, or Scoto–American school, denying any connection or coordinate jurisdiction in spirituals or temporals between the State and the Church; the theories of the New England school claiming the Church as one of the agencies fostered by the State for secular purposes and to develop the Christian state; and the theories of what may be called the Galliio school of entire indifference to the whole question of what the relation of Church and state which so agitates all Christendom.</p></blockquote>

<blockquote><p>Although Christ fulfilled the law for us as to obedience, it cannot be inferred that we are no longer bound to render obedience to God. It certainly follows that we are not bound to obey for the same end and from the same cause (to wit, that we may live by it, from our federal subjection). But this does not hinder our being bound by a natural obligation to yield the same obedience to God, not that we may live but because we live; not that we may acquire a right to life, but that we may enter upon the possession of the acquired right. Just as (though Christ died for us) we do not cease to be still liable to death—not for a punishment, but for salvation.</p></blockquote>

<blockquote><p>Paul supplies the tenth argument in Galatians 4:4–5: “After the fullness of time came, God sent His Son, born from a woman, made subject to the Law, to redeem those who had been subject to the Law, that we might receive adoption.” The apostle teaches that Christians were redeemed from that bondage of the Law through Christ, who became subject to the Law by His voluntary humiliation, who by nature was not placed under the Law. [460b] For He was not subject to the Law for Himself, because, first, He became subject to the law, when He who by nature was free from the law voluntarily made Himself subject to the Law. He was not subject to the Law for Himself, second, because the apostle would not have so greatly preached that subjection, if Christ had been obligated to it for Himself, which would have been common to Him with us. Now what is common to Christ with us, why is it of concern to preach so greatly as something peculiar, singular, and great? Surely Paul alleges that Christ became subject to the law as a singular and great benefit, by which we were redeemed from the bondage of the law. He was not subject to the law for Himself, third, because the end of that subjection brought it about that it was done in our place. For Christ was made under the law for the sake of those to be redeemed. He truly subjected Himself to the law in their place. But indeed for the sake of redeeming us, Christ was made under the law. Therefore, He subjected Himself to the law in our place. This declares a similar example: when many debtors are bound to the same creditor for themselves, if one pays his debt, the others are not redeemed, because the one was held for himself and therefore paid for himself alone. But Christ, paying our debt to the law, has redeemed us. Therefore, Christ was not held to the law for Himself but for us, whom He has redeemed. Ambrose, in the first book On Faith to Gratianus Augustus, in the sixth chapter, in the exposition of this passage, says, “Christ made by woman through the taking up of the flesh, made under the law through the observance of the law. This very quotation is cited in the second volume of councils, in the first action of the Council of Chalcedon, page 81. Theodoretus, in the Epitome of the Divine Decrees, on the chapter on the dispensation or incarnation of the Savior, writes: “For as much as it applies to humanity, since subject to the law He fulfilled the law, He set those free from the curse who had transgressed the Law.” Hence, we argue in this way: The perfect conformity to the law of Him who became subject to the law for us is imputed to us for righteousness. But Christ was made subject to the law for us. Therefore, Christ’s perfect conformity to the law is imputed to us for righteousness…Therefore, Christ even for us became subject to the law and not for Himself.</p></blockquote>

<blockquote><p>In November 2023, Defendant Santa Ana City Council adopted a resolution denying the application of Plaintiff Anchor Stone Christian Church for permission to use its property, located at 2398 Daimler Street, Santa Ana, California (the “Property”), for religious assembly. Following the denial of its application, Anchor Stone commenced this action against Defendants City of Santa Ana and its City Council (jointly, the “City”). Presently before the Court is Anchor Stone’s motion for a preliminary injunction. In support of its Motion, Anchor Stone argues that (1) the City’s zoning rules violate the Equal Terms Provision of the Religious Land Use and Institutionalized Persons Act (“RLUIPA”), 42 U.S.C. §§ 2000cc et seq.; (2) the City’s denial of Anchor Stone’s conditional use permit application violated the Substantial Burden Provision of RLUIPA; and (3) the City’s denial of Anchor Stone’s conditional use permit application violated the Free Exercise Clause of the First Amendment. After reviewing the papers filed in support and in opposition,2 and after carefully considering the argument of counsel at the hearing on the Motion, the Court concludes that Anchor Stone has established that it is likely to succeed on the merits of its claims and that it has satisfied the other requirements for preliminary injunctive relief. Accordingly, Anchor Stone’s instant Motion is GRANTED. The City is preliminarily ENJOINED and RESTRAINED from preventing Anchor Stone from holding services on the Property and from preventing Anchor Stone from undertaking its planned renovations of the Property.</p></blockquote>

<blockquote><p>Next, after a thousand years of repose and silence in the Church, the third was developed (Soteriology) through the labors of Luther and Calvin, proclaiming salvation as by grace through faith, leaving the fourth, Ecclesiology, yet to be developed. Do not the providences of God toward the American Church in freeing her from the civil domination which, by violence or seduction, silenced the martyr-voice of her Scotch mother when she would testify for Christ’s crown and covenant, and in placing the Church here in a position (for the first time, perhaps, since the apostles) to actualize fully and without hindrance her true nature and functions as a spiritual commonwealth—do not all seem to indicate that the time has fully come for the final development of the visible Church as a governmental power on earth, yet a kingdom not of this world, a people not reckoned among the nations?</p></blockquote>

<blockquote><p>It teaches that in a Christian nation, that is, in a nation not without God, government as a servant of God is duty-bound to glorify his name and accordingly ought to (a) remove from administration and legislation anything that impedes the free influence of the gospel on the nation; (b) abstain from all direct meddling with the spiritual formation of the nation, being absolutely incompetent thereto (c) treat all denominations or religious communities, and more over all citizens, regardless of their views about things eternal, on an equal footing of equality; and (d) acknowledge in peoples conscience, provided it does not lack the presumption of respect ability, a limit to its power. Article 4 THREE SYSTEMS Ignoring Religion We have seen what government is: a servant of God. Now we come to the question: what should government do and not do to be found faithful in the service of God? Following the tenor of our Program, we answer: Government has both direct and indirect duties toward God. The direct duties are either of a negative or a positive nature. Negatively, government is bound to allow unrestricted freedom for (1) the gospel’s influence; (2) people’s spiritual formation; (3) the manner in which people choose to worship; and (4) peoples conscience. Positively, government is duty-bound to (1) maintain law and order; (2) honor the oath; and (3) dedicate one day a week to God. We are well aware that these brief indications throw into sharp relief the differences between the kind of state the liberals want to establish and the kind we antirevolutionaries aspire to. This is best seeing if you take the trouble to think for a moment about what the liberals want. Their state is a state without God; it is an atheist state.1 this does not mean that each and every liberal wants to be irreverent and disrespectful toward God. It only means that in their opinion religion belongs to the realm of the inner life and that the state as a political power must avoid as much as possible all contact with this inner life. They feel that the situation will not be ideal until the point is reached where the where in government circles no mention is ever made of God, religion, or church. Whatever traces might remain of that sort would gradually need to be eliminated. Kingship by the grace of God would have to go. So prayer for God’s guidance in the Speech from the Throne. So would a prayer for God’s blessing when tabling legislative bills. Sunday observance would have to go. Every connection with the church would have to go. So with the oath. And so on. This is true of our liberals as well as our conservatives. Not if you look at what they say, but at what their principles prescribe. Those principles leave no room for serving God. At most, as a result of inconsistency or for the sake of party interest or theory of Hobbs, they allow for God almighty to serve as “the invisible police that casts fear into the multitude.”2 The basic error of this political system is the claim that one cannot really know if there is a God, hence that nothing objective can be established in regard to religion, and that this whole feature of the inner life of human beings belongs to the subjective, personal, at most domestic and ecclesiastical domain. Modern subjectivism—the false theory that religious sentiment is a separate capacity which, like musical talent, is stronger in some than others—and in connection with that theory the false notion that we are able to ascertain what the human person thinks of God but not whether he exists or who he is—this way of thinking could not lead with logical necessity to this God-less political system. It is a system that no longer has any room for prayer in the council chambers nor for national days of prayer. It is a system which prescribes that everything that is state must, qua state, ignore the living God. A State Church In opposition to such a system, the antirevolutionary party asserts that religion is not solely subjective but in fact is first of all objective. It contains that the knowledge that there is a God and that we have to do with that living God is firmly established and must be acknowledged, independently of our feelings. It holds that this state, too, as “the moral organization of the people as a whole,” is obliged to reckon with this foundation and fountainhead of all moral life. The party bases this claim not on revelation but on natural theology—on the knowledge of God that can be gathered from what is seen of God in creation, particularly in the human person, and not least in the national organism as well. In this, it consciously follows the tradition of our Reformed theologians, who held fast to this natural theology precisely for the sake of that which falls outside the kingdom of heaven. At the same time, to add one more note, the party was completely vindicated in this view by Max Müller’s recent lecture series on religion.3 This natural knowledge of God, not the knowledge from revelation, has compelling force for every person. Certainty about the first kind of knowledge does not require what the second requires, namely, supernatural illumination. For this reason the non-Confessional government has the absolute indirect legal competence as well as the obligation to take as its official rule of conduct the first (natural) knowledge of God, but not the second (revealed) kind. This would only be possible if there were an extraordinary, supernatural organ that could decide with absolute certainty what the revealed knowledge of God demanded in a given case. Such an organ, however, is lacking. And had to be lacking, otherwise either the state would become spiritual or religion would become profane. Accordingly, any attempt to call such an organ into existence regardless, as was done by Rome, has founded miserably and corrupted state and church alike. Things of a different nature just cannot be mixed. The state is not the kingdom of God, and the kingdom of God cannot be pressed into the confines of political life. We resolutely reject every attempt at reviving a “Christian state” in this sense, just as we resolutely turn against men like Rothe whose theory lacks all boundary lines and has the church flow into the state and then the state into the kingdom of God.4 Such unsound confusion of ideas must not be tolerated. It obscures clear thinking and causes the worn-out minds to sink back into the mysteries of the “unconscious” life and unsteady “feelings.” And that must not be. We have to use our understanding, our thinking, our reason in what we do, and the laws for our thinking do not allow such a chaotic muddle. State and Church Interrelate: Each Rooted In Its Own Principle The state is intended for the present dispensation and has at most preparatory significance for the eternal household of humankind. The kingdom of God, on the other hand, derives its purpose and character from the coming dispensation and at most uses earthly things for the things eternal. This gives rise to two different sets of ideas that increasingly follow their separate ways and therefore ought not to be confused in our minds. Government is directly rooted in the natural life and Sage has no other than a natural knowledge of God. The kingdom of God is a supernatural realm wears supernatural knowledge of God shines undimmed. Thanks to its natural knowledge of God, government knows (1) that there is a God; (2) that this living God governs the fate of everything created, hence also of the state; (3) that this all governing providence desires justice and is therefore an avenger of injustice; and (4) that sin is operative among human beings, from which higher intervention alone can save. Now it is on the basis of this purely natural knowledge of God that the state comes to honor God in its public actions; to invoke God’s holy name in state documents; to respect the oath; to dedicate a day of rest to him; to proclaim national days of prayer during disasters; to practice justice even with the sword; into allow free course to the gospel. Three systems therefore: (1) There is the god-less state of the liberals, who reject both the natural and the revealed knowledge of God and whose motto is “leave God out of it.” (2) There is theocratic state of Roman Catholics and inconsistent Protestants, who base the state qua state directly on both the natural and the revealed knowledge of God and consequently make the state function as the active promoter of the kingdom of God, as for example in the middle ages and still partly in Prussia. And finally (3) there is the political and God honoring state of the Reformed or Puritan nations, who based the state directly on the natural knowledge of God and accordingly have government proceeded actively as a servant of God in the sphere of the natural knowledge of God but passively in the fear of the revealed knowledge of God. An example here is the United States of America, where on the one hand praise, proclaims days of prayer, and honors the seventh day, while on the other hand it conducts itself in a more neutral fashion vis à vis the churches and any country in Europe.5</p></blockquote>

ot+whether+he+exists+or+who+he+is%E2%80%94this+way+of+thinking+could+not+lead+with+logical+necessity+to+this+God-less+political+system.+It+is+a+system+that+no+longer+has+any+room+for+prayer+in+the+council+chambers+nor+for+national+days+of+prayer.+It+is+a+system+which+prescribes+that+everything+that+is+state+must%2C+qua+state%2C+ignore+the+living+God.+A+State+Church+In+opposition+to+such+a+system%2C+the+antirevolutionary+party+asserts+that+religion+is+not+solely+subjective+but+in+fact+is+first+of+all+objective.+It+contains+that+the+knowledge+that+there+is+a+God+and+that+we+have+to+do+with+that+living+God+is+firmly+established+and+must+be+acknowledged%2C+independently+of+our+feelings.+It+holds+that+this+state%2C+too%2C+as+%E2%80%9Cthe+moral+organization+of+the+people+as+a+whole%2C%E2%80%9D+is+obliged+to+reckon+with+this+foundation+and+fountainhead+of+all+moral+life.+The+party+bases+this+claim+not+on+revelation+but+on+natural+theology%E2%80%94on+the+knowledge+of+God+that+can+be+gathered+from+what+is+seen+of+God+in+creation%2C+particularly+in+the+human+person%2C+and+not+least+in+the+national+organism+as+well.+In+this%2C+it+consciously+follows+the+tradition+of+our+Reformed+theologians%2C+who+held+fast+to+this+natural+theology+precisely+for+the+sake+of+that+which+falls+outside+the+kingdom+of+heaven.+At+the+same+time%2C+to+add+one+more+note%2C+the+party+was+completely+vindicated+in+this+view+by+Max+M%C3%BCller%E2%80%99s+recent+lecture+series+on+religion.3+This+natural+knowledge+of+God%2C+not+the+knowledge+from+revelation%2C+has+compelling+force+for+every+person.+Certainty+about+the+first+kind+of+knowledge+does+not+require+what+the+second+requires%2C+namely%2C+supernatural+illumination.+For+this+reason+the+non-Confessional+government+has+the+absolute+indirect+legal+competence+as+well+as+the+obligation+to+take+as+its+official+rule+of+conduct+the+first+%28natural%29+knowledge+of+God%2C+but+not+the+second+%28revealed%29+kind.+This+would+only+be+possible+if+there+were+an+extrao ural+knowledge+of+God%2C+government+knows+%281%29+that+there+is+a+God%3B+%282%29+that+this+living+God+governs+the+fate+of+everything+created%2C+hence+also+of+the+state%3B+%283%29+that+this+all+governing+providence+desires+justice+and+is+therefore+an+avenger+of+injustice%3B+and+%284%29+that+sin+is+operative+among+human+beings%2C+from+which+higher+intervention+alone+can+save.+Now+it+is+on+the+basis+of+this+purely+natural+knowledge+of+God+that+the+state+comes+to+honor+God+in+its+public+actions%3B+to+invoke+God%E2%80%99s+holy+name+in+state+documents%3B+to+respect+the+oath%3B+to+dedicate+a+day+of+rest+to+him%3B+to+proclaim+national+days+of+prayer+during+disasters%3B+to+practice+justice+even+with+the+sword%3B+into+allow+free+course+to+the+gospel.+Three+systems+therefore%3A+%281%29+There+is+the+god-less+state+of+the+liberals%2C+who+reject+both+the+natural+and+the+revealed+knowledge+of+God+and+whose+motto+is+%E2%80%9Cleave+God+out+of+it.%E2%80%9D+%282%29+There+is+theocratic+state+of+Roman+Catholics+and+inconsistent+Protestants%2C+who+base+the+state+qua+state+directly+on+both+the+natural+and+the+revealed+knowledge+of+God+and+consequently+make+the+state+function+as+the+active+promoter+of+the+kingdom+of+God%2C+as+for+example+in+the+middle+ages+and+still+partly+in+Prussia.+And+finally+%283%29+there+is+the+political+and+God+honoring+state+of+the+Reformed+or+Puritan+nations%2C+who+based+the+state+directly+on+the+natural+knowledge+of+God+and+accordingly+have+government+proceeded+actively+as+a+servant+of+God+in+the+sphere+of+the+natural+knowledge+of+God+but+passively+in+the+fear+of+the+revealed+knowledge+of+God.+An+example+here+is+the+United+States+of+America%2C+where+on+the+one+hand+praise%2C+proclaims+days+of+prayer%2C+and+honors+the+seventh+day%2C+while+on+the+other+hand+it+conducts+itself+in+a+more+neutral+fashion+vis+%C3%A0+vis+the+churches+and+any+country+in+Europe.5%E2%80%9D%0A%0A%E2%80%94+Abraham+Kuyper%2C+Our+Program%3A+A+Christian+Political+Manifesto%2C+trans.+and+ed.+Har <blockquote><p>Now it should be noted that the Holy Spirit insults the people of the Law and of works here by calling them “sons of the slave woman.” It is as though He were to say: “Why do you boast about the righteousness of the Law and of works and brag that on its account you are the people and the children of God? If you do not know whence you have your birth, I will tell you. You were born as slaves and of a slave woman. What sort of slaves? Of the Law, sin, death, and eternal damnation. A slave is not an heir but is cast out of the house.” Therefore the pope, with all his regime and whatever other self-righteous people there are, regardless of how saintly they may be in appearance, who trust they will obtain grace and salvation through laws human or divine—all of them are sons of the slave woman who will not inherit with the sons of the free woman but will be cast out of the house. And I am not speaking now about the ungodly monks, who worshiped their belly as god (Phil. 3:19) and committed horrible sins that I would just as soon not mention, but about the best of them, to whom I and many others belonged, who lived holy lives and tried with might and main to appease the wrath of God and to merit the forgiveness of sins and eternal life by the observances of their religious order. These men must now hear the sentence that the sons of the slave woman are to be cast out of the house together with the slave woman, their mother. When they are carefully considered, such sentences provide us with certainty and reassurance regarding the doctrine and the righteousness of faith, in opposition to the doctrine and the righteousness of works. The world embraces and praises the latter, and it despises and condemns the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 457–58.</span></figcaption>

</figure><figure class="quote" id="q-cc95b40e74" data-kw="">
<blockquote><p>A second kind of abrogation of the Law, an outward one, is that the political laws of Moses do not apply to us at all. Therefore we should not restore them to the courthouse or chain ourselves to them in some superstitious way, as some men who were ignorant of this liberty did several years ago. Nevertheless, although the Gospel does not subject us to the civil laws of Moses, it does not completely set us free from obedience to all political laws; but in this bodily life it subjects us to the laws of the state in which we live, and it commands everyone to obey his magistrate and his laws, “not only to avoid God’s wrath but also for the sake of conscience” (1 Peter 2:13–14; Rom. 13:5). Nor would it be a sin if the emperor used some of the civil laws of Moses; in fact, it would be a good idea if he did. Therefore the sophists are in error when they imagine that after Christ the civil laws of Moses are fatal to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 448.</span></figcaption>

<blockquote><p>Objection II. Believers are governed by God’s Spirit, and therefore outward government by magistrates is needless. Answer. In the visible church, hypocrites are mingled with true believers, and they are not governed by God’s Spirit, but by the spirit of the devil. And therefore in respect of them, civil authority is requisite. Again, true believers are but in part governed by the Spirit for the time of this life. And for this cause, civil government is requisite for the ordering of the outward man and for the protection of the church.</p></blockquote>

</figure><figure class="quote" id="q-2a39276255" data-kw="">
<blockquote><p>Therefore just as Isaac has the inheritance from his father solely on the basis of the promise and of his birth, without the Law or works, so we are born as heirs by Sarah, the free woman, that is, by the church. She teaches, cherishes, and carries us in her womb, her bosom, and her arms; she shapes and perfects us to the form of Christ, until we grow into perfect manhood (Eph. 4:13). Thus everything happens through the ministry of the Word. It is the duty of a free woman to go on giving birth to children endlessly, that is, to sons who know that they are justified by faith, not by the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 441–42.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-8a0a191b25" data-kw="">
<blockquote><p>The natural law of God, or the law of nature, is that necessary and unchangeable rule of duty which is founded in the infinitely holy and righteous nature of God, to obey which all men, as the reasonable creatures of God, are and cannot but be indispensably bound.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 9.</span></figcaption>

— John Colquhoun, A Treatise on the Law and Gospel, (Grand Rapids: Reformation Heritage Books), 9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+natural+law+of+God%2C+or+the+law+of+nature%2C+is+that+necessary+and+unchangeable+rule+of+duty+which+is+founded+in+the+infinitely+holy+and+righteous+nature+of+God%2C+to+obey+which+all+men%2C+as+the+reasonable+creatures+of+God%2C+are+and+cannot+but+be+indispensably+bound.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel%2C+%28Grand+Rapids%3A+Reformation+Heritage+Books%29%2C+9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a0a191b25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a0a191b25.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/05/colquhoun-on-natural-law/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-cbb8651e08" data-kw="">
<blockquote><p>In form this crying and sighing is that amid your trial you do not call God a tyrant, an angry judge, or a tormentor, but a Father—even though the sighing may be so faint that it can hardly be felt. By contrast the other crying is very great and is felt very strongly, when in genuine terror of conscience we call God wicked, cruel, an angry tyrant, and a judge. For then it seems that God has forsaken us and that He wants to banish us to hell. That is how the saints often complain the psalms (Ps. 31:22, 12): “I am driven far from Thy sight”; “I have become like a broken vessel.” This is certainly not a sigh that says: “Father”; it is the roar of hatred for God that cries loudly: “Harsh judge, cruel tormentor!” Now it is time to turn your eyes away from the Law, from works, and from your own feelings and conscience, to lay hold of the Gospel, and to depend solely on the promise of God. Then there is emitted a little sigh, which silences and drowns out that violent roaring; and nothing remains in your heart but the sigh that says: “Abba! Father! However much the Law may accuse me, and sin and death may terrify me, nevertheless Thou, O God, dost promise grace, righteousness, and eternal life through Christ.” And so the promise produces the sigh that cries: “Father!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 389.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In form this crying and sighing is that amid your trial you do not call God a tyrant, an angry judge, or a tormentor, but a Father—even though the sighing may be so faint that it can hardly be felt. By contrast the other crying is very great and is felt very strongly, when in genuine terror of conscience we call God wicked, cruel, an angry tyrant, and a judge. For then it seems that God has forsaken us and that He wants to banish us to hell. That is how the saints often complain the psalms (Ps. 31:22, 12): “I am driven far from Thy sight”; “I have become like a broken vessel.” This is certainly not a sigh that says: “Father”; it is the roar of hatred for God that cries loudly: “Harsh judge, cruel tormentor!” Now it is time to turn your eyes away from the Law, from works, and from your own feelings and conscience, to lay hold of the Gospel, and to depend solely on the promise of God. Then there is emitted a little sigh, which silences and drowns out that violent roaring; and nothing remains in your heart but the sigh that says: “Abba! Father! However much the Law may accuse me, and sin and death may terrify me, nevertheless Thou, O God, dost promise grace, righteousness, and eternal life through Christ.” And so the promise produces the sigh that cries: “Father!”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 389.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+form+this+crying+and+sighing+is+that+amid+your+trial+you+do+not+call+God+a+tyrant%2C+an+angry+judge%2C+or+a+tormentor%2C+but+a+Father%E2%80%94even+though+the+sighing+may+be+so+faint+that+it+can+hardly+be+felt.+By+contrast+the+other+crying+is+very+great+and+is+felt+very+strongly%2C+when+in+genuine+terror+of+conscience+we+call+God+wicked%2C+cruel%2C+an+angry+tyrant%2C+and+a+judge.+For+then+it+seems+that+God+has+forsaken+us+and+that+He+wants+to+banish+us+to+hell.+That+is+how+the+saints+often+complain+the+psalms+%28Ps.+31%3A22%2C+12%29%3A+%E2%80%9CI+am+driven+far+from+Thy+sight%E2%80%9D%3B+%E2%80%9CI+have+become+like+a+broken+vessel.%E2%80%9D+This+is+certainly+not+a+sigh+that+says%3A+%E2%80%9CFather%E2%80%9D%3B+it+is+the+roar+of+hatred+for+God+that+cries+loudly%3A+%E2%80%9CHarsh+judge%2C+cruel+tormentor%21%E2%80%9D+Now+it+is+time+to+turn+your+eyes+away+from+the+Law%2C+from+works%2C+and+from+your+own+feelings+and+conscience%2C+to+lay+hold+of+the+Gospel%2C+and+to+depend+solely+on+the+promise+of+God.+Then+there+is+emitted+a+little+sigh%2C+which+silences+and+drowns+out+that+violent+roaring%3B+and+nothing+remains+in+your+heart+but+the+sigh+that+says%3A+%E2%80%9CAbba%21+Father%21+However+much+the+Law+may+accuse+me%2C+and+sin+and+death+may+terrify+me%2C+nevertheless+Thou%2C+O+God%2C+dost+promise+grace%2C+righteousness%2C+and+eternal+life+through+Christ.%E2%80%9D+And+so+the+promise+produces+the+sigh+that+cries%3A+%E2%80%9CFather%21%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%2 <blockquote><p>The same multiplication of relics has prevailed in the case of Anthony. By pretending that he is passionate and mischievous, and inflames those who may have given him offence, they have made him an object of dread; from this dread has arisen a superstitious desire to possess his body, and so have a security against harm. Accordingly, the city of Arles had a keen and tedious litigation on the subject with the monks of St Anthony at Vienne. The result was just that which usually takes place in controversies of this description; that is, the whole matter still remains in darkness. Indeed, had any thing been actually proved on the subject, and the truth been made manifest, it would not have been to the advantage of either party. To these two bodies they have added a knee, which is in the Vivarais, in the possession of the Augustins; besides various members which exist at Bourges, Mascon, Dijon, Chalons, Ovron, and Besançon, and others, which are everywhere hawked about by travelling impostors. Of these the number is not small. See what it is to get a name for doing mischief. But for this, that good saint would still be in his tomb, or, at least, concealed in some corner. I have omitted St Petronilla, Peter’s daughter, whose entire body is in the church dedicated to her father, besides some separate remains in the church of Saint Barbara; nevertheless, another body is in the possession of the people of La Maine, in the monastery of the Dominicans, and is held in the very highest repute, because alleged to cure fever. As there were various saints of the name of Susanna, I cannot say whether they have thought proper to give two bodies to any one of them. There is one body of a Susanna at Rome, in the church which bears her name, and there is another at Toulouse. Helen has not been so highly favoured. The Venetians have the body, but in addition to it, she has not gained any superfluous part, with the exception of another head which exists at Cologne in the church of Grisgon. In this respect St Ursula has the advantage of her. For, first, she has her body in the church of St John the Angel; then she has one head at Cologne, and part of another with the Dominicans of La Maine, as also the Dominicans of Tours, and at Bergers. Of her companions, to whom they give the name of the Eleven Thousand Virgins, whatever may be thought, it must, at least, be admitted, that by feigning them to be so numerous, they have enabled themselves to lie with greater freedom. Beside the bones which are at Cologne, and which would be quite sufficient to load an hundred waggons, there is scarcely a city in Europe which does not possess them as the ornament of one or more of their churches. Were I to take a survey of the common herd of saints, I should get entangled in a forest out of which I should never be able to escape. It will be sufficient, therefore, to adduce some specimens, from which a judgment may be formed in regard to the rest. There are two churches in Poictou which contend for the body of Hilary, viz., the cathedral church dedicated to him, and that of the Monks at Selle. The controversy is at present awaiting the visitation which is to take place. In the interval, the idolaters will be forced to worship two bodies as those of the same individual; whereas true believers, feeling no anxiety whatever about his body, will allow it to rest, be it where it may. The body of St Honoratus is at Arles, and is also in the Island of Lerins near Antiboul. Ægidius has one of his bodies at Toulouse, and another in a town at Aquitaine, which is named after him. William is in a monastery of Aquitaine, which is called St William in the Desert, and also in a town of Holstein, which is called Ecrichum, where also his head exists separately, although he has also another head in the suburb of Tours, among the Williamites. What shall I say of Symphorianus, whose body and bones exist in so many places? Also of Lupus, which is at Auxerre, at Sienna, at Lyons, and which they have also pretended to be at Geneva? What likewise shall I say of Ferreolus, whose whole body is at Uzes in Aquitaine, and also at Brioude in Auvergne? Not to betray their lies so openly, they ought, at least, to enter into an arrangement, as the monks of Treves have done, as to their dispute with those of Lodi about the head of Lambert. They have agreed as to the offerings, by compounding, for a certain sum of money, with this condition, however, that the body possessed by the former shall not be publicly exhibited, lest suspicion might be excited by both being seen in two cities so near each other. Thus it is, as I mentioned before at the outset; they never supposed that any observer would appear who would ever dare to open his lips in exposure of such impudence. But any one may ask, how have these fabricators of relics omitted the many notable things connected with the Old Dispensation, since, without any regard to reason, they have heaped up all that ever came into their mind, and, as it were with a breath, called into existence whatever they pleased? To this question I can give no other answer than that they did not think it worth their while, because they had no prospect of deriving much advantage from such relics; and yet they have not forgotten them entirely, for at Rome they gave out that they have the bones of Abraham, Isaac, and Jacob, in the church of Mary supra Minerva. They also boast that in the church of Joannes Lateranensis they have the ark of the covenant and Aaron’s rod within it. The same rod, however, is at Paris in the Holy Chapel, while some fragment of it also is in St Salvator’s in Spain. I omit the inhabitants of Bourdeaux, who maintain that the rod of St Martial, which is exhibited in the church of Severinus, is the identical rod of Aaron. It would seem that they had wished to perform a new miracle as in rivalship of God; for whereas He, by his power, turned the rod into a serpent, so they have now turned it into three rods. Very probably they have many other toys of the same description, but let it suffice merely to have mentioned this, in order to make it manifest that they have been as honest here as in other matters. Now, I would entreat my readers to remember what I said at the outset, viz., that I have not searchers at hand to examine the sacraria of all the regions which I have here mentioned. Wherefore, what I have said of relics must not be taken as if it were a perfect inventory of all the things which might be discovered. I have mentioned only six German cities, or thereabouts, three, as far as I know, of Spain, fifteen of Italy, and between thirty or forty of France; nor am I even acquainted with all the relics that are in them. Let every one, therefore, consider with himself what a farrago there would be if we saw the multitude of relics existing throughout the world described in order, or only in the regions which are known to us, or in which we live. For it is to be particularly observed, that all the relics of Christ and the Apostles exhibited in Europe exist also in Greece, Asia, and other countries where Christian churches are found. Now, I ask, when the Christians of the Eastern Church say that all these things which we pretend to have are in their possession, what decision can we come to upon the subject? If, in answer to them, we aver that this body was brought thither by merchants—that one by monks—and that other by a bishop—that part of the crown of thorns was sent by the Emperor of Constantinople to the King of France—that another was obtained in war—and so on of each, they will laugh and shake their heads. How will the controversy be decided? In doubtful matters we must trust to conjecture, and, therefore, in this respect, they will always get the better of us. For what they produce in their behalf is much more probable than what we can produce in ours. Those who defend relics have certainly a very difficult knot to loose. To draw to a conclusion, I beseech my readers, in the name of God, to give heed to the truth while it lies plainly before them, and recognise how Divine Providence has wonderfully provided, that those who thus wished to mislead the meanest of the people have been so blind that they never thought of using a cloak for their lies, but moving blindfolded, like the Midianites, have set about slaughtering one another. As we see how they are still warring among themselves, and charging each other with falsehood, every man, who is not obstinately determined against the truth, though he may not yet clearly perceive that the worship of any relics, of whatever kind they be, whether genuine or spurious, is execrable idolatry, yet seeing how clear their falsehood is, will have no desire to kiss them any more, and whatever reverence they may have previously inspired, will cease to have any relish for them. The best thing, indeed, would be, as I mentioned at the outset, if, among us who profess the name of Christ, this heathenish custom were abolished, whether they be relics of Christ or of the saints. In as much as they do degenerate into idols, the pollution and defilement which they occasion ought not on any account to be tolerated in the Church. This we have already demonstrated, both by argument and by the testimony of Scripture. If any one is not satisfied with this, let him look to the manner and practice of the ancient fathers, and conform to their example. Many patriarchs, prophets, kings, and other faithful worshippers, existed under the Old Testament. More ceremonies were then appointed by God than it becomes us to observe in the present day. Nay, even burial itself required more show than it now does, because by its figures it represented the resurrection, which was not so clearly revealed to them as it has been to us. But do we read that the saints were ever dug out of their graves, in order that they might be converted into a kind of puppets for children? Was Abraham, the father of all the faithful, thus carried in state, or was Sarah, a princess in the Church of God, taken out of her coffin? Were they not left in quiet along with the other saints, and was not the body of Moses so concealed, by the express will of God, that it never could be discovered? Did not Satan, as Jude tells us, contend for it with the angels? The Lord then withdrew it from the sight of men, and the devil tried to bring it back. God confessedly took it away, in order that it might not become an occasion of idolatry to the Jewish people; and the devil would have brought it back, that he might make it an occasion of idolatry. But that people, it will perhaps be said, was prone to superstition; and what, pray, are we? Is there not in this respect greater perversity among Christians than there was among the Jews? And what do we find to have been the practice of the ancient Church? The faithful, it is true, always exerted themselves to rescue the bodies of martyrs, and prevent their being torn by wild beasts and ravenous birds, so as to secure for them an honourable burial. This they did in the case of John the Baptist and Stephen. They did it, however, for the purpose of committing them to the earth, that they might there rest till the resurrection—not that they might be brought forward into public view in order that all might prostrate themselves before them. This unhappy pomp of consecrating was never introduced into the Church until all things were subverted, and, as it were, profaned, partly by the stupidity or avarice of some prelates and pastors, and partly by the inability of others to withstand a practice which had already begun to prevail. Nay, even the people themselves courted deception, by giving their mind to mere frivolities rather than to the pure worship of God. Wherefore, if a complete reformation of this corrupt practice is desired, it will be necessary to begin at the very foundation, and abolish a practice which was at first instituted improperly, and against all reason. But if any one is not able at one step to make such an advance towards true understanding, let him at least proceed gradually. And, in the first place, let him open his eyes, and exercise his judgment upon any relics which may be presented to him. No one inclined to make the attempt will find it at all difficult; for among the many transparent lies, such as those to which I have already adverted, where will any relics be found whose genuineness amounts to anything like certainty? Nay, at the very time when this little book was passing through the press, I was informed of a third prepuce, which I had not mentioned, and which is shown at Hildesheim. The number of similar follies is indeed infinite, and a careful inspection would discover more than it is possible to enumerate. Let every one, then, be on his guard, and not allow himself to be led along like an irrational animal, and as if he were incapable of discerning any way or path by which he might be guided safely. I recollect when I was a boy how they were wont to do with the images of our parish. When the feast of Stephen drew near, they adorned them all alike with garlands and necklaces, just decking the murderers who stoned Stephen in the same way as they decked Stephen himself. When the old women saw the murderers thus adorned, they imagined that they were Stephen’s companions. Accordingly, every one was presented with his candle. Nay, the same honour was conferred on the devil who contended with Michael, and so on with the rest. And so completely, are they all mixed up and huddled together, that it is impossible to have the bones of any martyr without running the risk of worshipping the bones of some thief or robber, or, it may be, the bones of a dog, or a horse, or an ass. Nor can the Virgin Mary’s ring, or comb, or girdle, be venerated without the risk of venerating some part of the dress of a strumpet. Let every one, therefore, who is inclined, guard against this risk. Henceforth no man will be able to excuse himself by pretending ignorance. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 334–341. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.</p></blockquote>

risk. Henceforth no man will be able to excuse himself by pretending ignorance. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 334–341. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.”

of+them.+There+is+one+body+of+a+Susanna+at+Rome%2C+in+the+church+which+bears+her+name%2C+and+there+is+another+at+Toulouse.+Helen+has+not+been+so+highly+favoured.+The+Venetians+have+the+body%2C+but+in+addition+to+it%2C+she+has+not+gained+any+superfluous+part%2C+with+the+exception+of+another+head+which+exists+at+Cologne+in+the+church+of+Grisgon.+In+this+respect+St+Ursula+has+the+advantage+of+her.+For%2C+first%2C+she+has+her+body+in+the+church+of+St+John+the+Angel%3B+then+she+has+one+head+at+Cologne%2C+and+part+of+another+with+the+Dominicans+of+La+Maine%2C+as+also+the+Dominicans+of+Tours%2C+and+at+Bergers.+Of+her+companions%2C+to+whom+they+give+the+name+of+the+Eleven+Thousand+Virgins%2C+whatever+may+be+thought%2C+it+must%2C+at+least%2C+be+admitted%2C+that+by+feigning+them+to+be+so+numerous%2C+they+have+enabled+themselves+to+lie+with+greater+freedom.+Beside+the+bones+which+are+at+Cologne%2C+and+which+would+be+quite+sufficient+to+load+an+hundred+waggons%2C+there+is+scarcely+a+city+in+Europe+which+does+not+possess+them+as+the+ornament+of+one+or+more+of+their+churches.+Were+I+to+take+a+survey+of+the+common+herd+of+saints%2C+I+should+get+entangled+in+a+forest+out+of+which+I+should+never+be+able+to+escape.+It+will+be+sufficient%2C+therefore%2C+to+adduce+some+specimens%2C+from+which+a+judgment+may+be+formed+in+regard+to+the+rest.+There+are+two+churches+in+Poictou+which+contend+for+the+body+of+Hilary%2C+viz.%2C+the+cathedral+church+dedicated+to+him%2C+and+that+of+the+Monks+at+Selle.+The+controversy+is+at+present+awaiting+the+visitation+which+is+to+take+place.+In+the+interval%2C+the+idolaters+will+be+forced+to+worship+two+bodies+as+those+of+the+same+individual%3B+whereas+true+believers%2C+feeling+no+anxiety+whatever+about+his+body%2C+will+allow+it+to+rest%2C+be+it+where+it+may.+The+body+of+St+Honoratus+is+at+Arles%2C+and+is+also+in+the+Island+of+Lerins+near+Antiboul.+%C3%86gidius+has+one+of+his+bodies+at+Toulouse%2C+and+another+in+a+town+at+Aquitaine%2C+which+is+named+after+him.+William+is+in+a+monastery+of+Aquitaine%2C+which+is+called+St+William+in+the+Desert%2C+and+also+in+a+town+of+Holstein%2C+which+is+called+Ecrichum%2C+where+also+his+head+exists+separately%2C+although+he+has+also+another+head+in+the+suburb+of+Tours%2C+among+the+Williamites.+What+shall+I+say+of+Symphorianus%2C+whose+body+and+bones+exist+in+so+many+places%3F+Also+of+Lupus%2C+which+is+at+Auxerre%2C+at+Sienna%2C+at+Lyons%2C+and+which+they+have+also+pretended+to+be+at+Geneva%3F+What+likewise+shall+I+say+of+Ferreolus%2C+whose+whole+body+is+at+Uzes+in+Aquitaine%2C+and+also+at+Brioude+in+Auvergne%3F+Not+to+betray+their+lies+so+openly%2C+they+ought%2C+at+least%2C+to+enter+into+an+arrangement%2C+as+the+monks+of+Treves+have+done%2C+as+to+their+dispute+with+those+of+Lodi+about+the+head+of+Lambert.+They+have+agreed+as+to+the+offerings%2C+by+compounding%2C+for+a+certain+sum+of+money%2C+with+this+condition%2C+however%2C+that+the+body+possessed+by+the+former+shall+not+be+publicly+exhibited%2C+lest+suspicion+might+be+excited+by+both+being+seen+in+two+cities+so+near+each+other.+Thus+it+is%2C+as+I+mentioned+before+at+the+outset%3B+they+never+supposed+that+any+observer+would+appear+who+would+ever+dare+to+open+his+lips+in+exposure+of+such+impudence.+But+any+one+may+ask%2C+how+have+these+fabricators+of+relics+omitted+the+many+notable+things+connected+with+the+Old+Dispensation%2C+since%2C+without+any+regard+to+reason%2C+they+have+heaped+up+all+that+ever+came+into+their+mind%2C+and%2C+as+it+were+with+a+breath%2C+called+into+existence+whatever+they+pleased%3F+To+this+question+I+can+give+no+other+answer+than+that+they+did+not+think+it+worth+their+while%2C+because+they+had+no+prospect+of+deriving+much+advantage+from+such+relics%3B+and+yet+they+have+not+forgotten+them+entirely%2C+for+at+Rome+they+gave+out+that+they+have+the+bones+of+Abraham%2C+Isaac%2C+and+Jacob%2C+in+the+church+of+Mary+supra+Minerva.+They+also+boast+that+in+the+church+of+Joannes+Lateranensis+they+have+the+ark+of+the+covenant+and+Aaron%E2%80%99s+rod+within+it.+The+same+rod%2C+however%2C+is+at+Paris+in+the+Holy+Chapel%2C+while+some+fragment+of+it+also+is+in+St+Salvator%E2%80%99s+in+Spain.+I+omit+the+inhabitants+of+Bourdeaux%2C+who+maintain+that+the+rod+of+St+Martial%2C+which+is+exhibited+in+the+church+of+Severinus%2C+is+the+identical+rod+of+Aaron.+It+would+seem+that+they+had+wished+to+perform+a+new+miracle+as+in+rivalship+of+God%3B+for+whereas+He%2C+by+his+power%2C+turned+the+rod+into+a+serpent%2C+so+they+have+now+turned+it+into+three+rods.+Very+probably+they+have+many+other+toys+of+the+same+description%2C+but+let+it+suffice+merely+to+have+mentioned+this%2C+in+order+to+make+it+manifest+that+they+have+been+as+honest+here+as+in+other+matters.+Now%2C+I+would+entreat+my+readers+to+remember+what+I+said+at+the+outset%2C+viz.%2C+that+I+have+not+searchers+at+hand+to+examine+the+sacraria+of+all+the+regions+which+I+have+here+mentioned.+Wherefore%2C+what+I+have+said+of+relics+must+not+be+taken+as+if+it+were+a+perfect+inventory+of+all+the+things+which+might+be+discovered.+I+have+mentioned+only+six+German+cities%2C+or+thereabouts%2C+three%2C+as+far+as+I+know%2C+of+Spain%2C+fifteen+of+Italy%2C+and+between+thirty+or+forty+of+France%3B+nor+am+I+even+acquainted+with+all+the+relics+that+are+in+them.+Let+every+one%2C+therefore%2C+consider+with+himself+what+a+farrago+there+would+be+if+we+saw+the+multitude+of+relics+existing+throughout+the+world+described+in+order%2C+or+only+in+the+regions+which+are+known+to+us%2C+or+in+which+we+live.+For+it+is+to+be+particularly+observed%2C+that+all+the+relics+of+Christ+and+the+Apostles+exhibited+in+Europe+exist+also+in+Greece%2C+Asia%2C+and+other+countries+where+Christian+churches+are+found.+Now%2C+I+ask%2C+when+the+Christians+of+the+Eastern+Church+say+that+all+these+things+which+we+pretend+to+have+are+in+their+possession%2C+what+decision+can+we+come+to+upon+the+subject%3F+If%2C+in+answer+to+them%2C+we+aver+that+this+body+was+brought+thither+by+merchants%E2%80%94that+one+by+monks%E2%80%94and+that+other+by+a+bishop%E2%80%94that+part+of+the+crown+of+thorns+was+sent+by+the+Emperor+of+Constantinople+to+the+King+of+France%E2%80%94that+another+was+obtained+in+war%E2%80%94and+so+on+of+each%2C+they+will+laugh+and+shake+their+heads.+How+will+the+controversy+be+decided%3F+In+doubtful+matters+we+must+trust+to+conjecture%2C+and%2C+therefore%2C+in+this+respect%2C+they+will+always+get+the+better+of+us.+For+what+they+produce+in+their+behalf+is+much+more+probable+than+what+we+can+produce+in+ours.+Those+who+defend+relics+have+certainly+a+very+difficult+knot+to+loose.+To+draw+to+a+conclusion%2C+I+beseech+my+readers%2C+in+the+name+of+God%2C+to+give+heed+to+the+truth+while+it+lies+plainly+before+them%2C+and+recognise+how+Divine+Providence+has+wonderfully+provided%2C+that+those+who+thus+wished+to+mislead+the+meanest+of+the+people+have+been+so+blind+that+they+never+thought+of+using+a+cloak+for+their+lies%2C+but+moving+blindfolded%2C+like+the+Midianites%2C+have+set+about+slaughtering+one+another.+As+we+see+how+they+are+still+warring+among+themselves%2C+and+charging+each+other+with+falsehood%2C+every+man%2C+who+is+not+obstinately+determined+against+the+truth%2C+though+he+may+not+yet+clearly+perceive+that+the+worship+of+any+relics%2C+of+whatever+kind+they+be%2C+whether+genuine+or+spurious%2C+is+execrable+idolatry%2C+yet+seeing+how+clear+their+falsehood+is%2C+will+have+no+desire+to+kiss+them+any+more%2C+and+whatever+reverence+they+may+have+previously+inspired%2C+will+cease+to+have+any+relish+for+them.+The+best+thing%2C+indeed%2C+would+be%2C+as+I+mentioned+at+the+outset%2C+if%2C+among+us+who+profess+the+name+of+Christ%2C+this+heathenish+custom+were+abolished%2C+whether+they+be+relics+of+Christ+or+of+the+saints.+In+as+much+as+they+do+degenerate+into+idols%2C+the+pollution+and+defilement+which+they+occasion+ought+not+on+any+account+to+be+tolerated+in+the+Church.+This+we+have+already+demonstrated%2C+both+by+argument+and+by+the+testimony+of+Scripture.+If+any+one+is+not+satisfied+with+this%2C+let+him+look+to+the+manner+and+practice+of+the+ancient+fathers%2C+and+conform+to+their+example.+Many+patriarchs%2C+prophets%2C+kings%2C+and+other+faithful+worshippers%2C+existed+under+the+Old+Testament.+More+ceremonies+were+then+appointed+by+God+than+it+becomes+us+to+observe+in+the+present+day.+Nay%2C+even+burial+itself+required+more+show+than+it+now+does%2C+because+by+its+figures+it+represented+the+resurrection%2C+which+was+not+so+clearly+revealed+to+them+as+it+has+been+to+us.+But+do+we+read+that+the+saints+were+ever+dug+out+of+their+graves%2C+in+order+that+they+might+be+converted+into+a+kind+of+puppets+for+children%3F+Was+Abraham%2C+the+father+of+all+the+faithful%2C+thus+carried+in+state%2C+or+was+Sarah%2C+a+princess+in+the+Church+of+God%2C+taken+out+of+her+coffin%3F+Were+they+not+left+in+quiet+along+with+the+other+saints%2C+and+was+not+the+body+of+Moses+so+concealed%2C+by+the+express+will+of+God%2C+that+it+never+could+be+discovered%3F+Did+not+Satan%2C+as+Jude+tells+us%2C+contend+for+it+with+the+angels%3F+The+Lord+then+withdrew+it+from+the+sight+of+men%2C+and+the+devil+tried+to+bring+it+back.+God+confessedly+took+it+away%2C+in+order+that+it+might+not+become+an+occasion+of+idolatry+to+the+Jewish+people%3B+and+the+devil+would+have+brought+it+back%2C+that+he+might+make+it+an+occasion+of+idolatry.+But+that+people%2C+it+will+perhaps+be+said%2C+was+prone+to+superstition%3B+and+what%2C+pray%2C+are+we%3F+Is+there+not+in+this+respect+greater+perversity+among+Christians+than+there+was+among+the+Jews%3F+And+what+do+we+find+to+have+been+the+practice+of+the+ancient+Church%3F+The+faithful%2C+it+is+true%2C+always+exerted+themselves+to+rescue+the+bodies+of+martyrs%2C+and+prevent+their+being+torn+by+wild+beasts+and+ravenous+birds%2C+so+as+to+secure+for+them+an+honourable+burial.+This+they+did+in+the+case+of+John+the+Baptist+and+Stephen.+They+did+it%2C+however%2C+for+the+purpose+of+committing+them+to+the+earth%2C+that+they+might+there+rest+till+the+resurrection%E2%80%94not+that+they+might+be+brought+forward+into+public+view+in+order+that+all+might+prostrate+themselves+before+them.+This+unhappy+pomp+of+consecrating+was+never+introduced+into+the+Church+until+all+things+were+subverted%2C+and%2C+as+it+were%2C+profaned%2C+partly+by+the+stupidity+or+avarice+of+some+prelates+and+pastors%2C+and+partly+by+the+inability+of+others+to+withstand+a+practice+which+had+already+begun+to+prevail.+Nay%2C+even+the+people+themselves+courted+deception%2C+by+giving+their+mind+to+mere+frivolities+rather+than+to+the+pure+worship+of+God.+Wherefore%2C+if+a+complete+reformation+of+this+corrupt+practice+is+desired%2C+it+will+be+necessary+to+begin+at+the+very+foundation%2C+and+abolish+a+practice+which+was+at+first+instituted+improperly%2C+and+against+all+reason.+But+if+any+one+is+not+able+at+one+step+to+make+such+an+advance+towards+true+understanding%2C+let+him+at+least+proceed+gradually.+And%2C+in+the+first+place%2C+let+him+open+his+eyes%2C+and+exercise+his+judgment+upon+any+relics+which+may+be+presented+to+him.+No+one+inclined+to+make+the+attempt+will+find+it+at+all+difficult%3B+for+among+the+many+transparent+lies%2C+such+as+those+to+which+I+have+already+adverted%2C+where+will+any+relics+be+found+whose+genuineness+amounts+to+anything+like+certainty%3F+Nay%2C+at+the+very+time+when+this+little+book+was+passing+through+the+press%2C+I+was+informed+of+a+third+prepuce%2C+which+I+had+not+mentioned%2C+and+which+is+shown+at+Hildesheim.+The+number+of+similar+follies+is+indeed+infinite%2C+and+a+careful+inspection+would+discover+more+than+it+is+possible+to+enumerate.+Let+every+one%2C+then%2C+be+on+his+guard%2C+and+not+allow+himself+to+be+led+along+like+an+irrational+animal%2C+and+as+if+he+were+incapable+of+discerning+any+way+or+path+by+which+he+might+be+guided+safely.+I+recollect+when+I+was+a+boy+how+they+were+wont+to+do+with+the+images+of+our+parish.+When+the+feast+of+Stephen+drew+near%2C+they+adorned+them+all+alike+with+garlands+and+necklaces%2C+just+decking+the+murderers+who+stoned+Stephen+in+the+same+way+as+they+decked+Stephen+himself.+When+the+old+women+saw+the+murderers+thus+adorned%2C+they+imagined+that+they+were+Stephen%E2%80%99s+companions.+Accordingly%2C+every+one+was+presented+with+his+candle.+Nay%2C+the+same+honour+was+conferred+on+the+devil+who+contended+with+Michael%2C+and+so+on+with+the+rest.+And+so+completely%2C+are+they+all+mixed+up+and+huddled+together%2C+that+it+is+impossible+to+have+the+bones+of+any+martyr+without+running+the+risk+of+worshipping+the+bones+of+some+thief+or+robber%2C+or%2C+it+may+be%2C+the+bones+of+a+dog%2C+or+a+horse%2C+or+an+ass.+Nor+can+the+Virgin+Mary%E2%80%99s+ring%2C+or+comb%2C+or+girdle%2C+be+venerated+without+the+risk+of+venerating+some+part+of+the+dress+of+a+strumpet.+Let+every+one%2C+therefore%2C+who+is+inclined%2C+guard+against+this+risk.+Henceforth+no+man+will+be+able+to+excuse+himself+by+pretending+ignorance.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+334%E2%80%93341.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+332%E2%80%93334.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+An+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+334%E2%80%9341&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa279dce91a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a279dce91a.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-14/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>It is lawful, but is it wise? Is God’s wisdom simply a form of law? What are the differences between law and wisdom in the Bible, and what is their relationship to each other? These are some of the questions to ponder when reading Scripture. Consider, for example, Psalm 119:97-98, which identifies God’s law making the psalmist wiser than his enemies; or Psalm 111:10 (repeated in Proverbs 9:10) that teaches the fear of the Lord is the beginning of wisdom. Besides the fact that wisdom and law are closely related to each other because God is their source, there are differences between them. Wisdom sayings and admonitions are not law commands per se, although keeping God’s law is surely wise. Mostly, we prefer laws since they tell us what to do. Wisdom, on the other hand, takes more effort, so we tend to shy away from learning how the world works and the reasons, benefits, and purposes of living wisely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Wisdom Versus Law—What’s the Difference?”</cite>, October 14, 2022</span></figcaption>

<blockquote><p>Love means protecting the defenseless. God teaches that life is his gift. He commands us to preserve not only our own lives but also the lives of others, and he has appointed government authorities in part for this purpose by means of just defense (e.g., Prov. 24:11). As I pointed out in my article, military forces established by God’s appointed authorities are legitimate. Nowhere in Scripture does God command soldiers who are Christians to give up being soldiers. Yet, the issue you raise seems to be related more to the question of Christians serving in the military, since Christians are called to love their enemies. First, as I pointed out in the article, nowhere in Scripture does God command soldiers who are Christians to give up being soldiers—in fact, on a few occasions our Lord commends them. If serving in the military is antithetical to being a Christian, surely Christ Jesus would not have commended them. But how can the two be reconciled? How can loving one’s enemies be reconciled with being a soldier with the mission to kill an enemy? It is loving to protect and defend the defenseless, and it is also loving to protect a wicked person from killing others. As far as the command to love one’s enemies, it would be unloving to show favor toward an evil enemy against the defenseless by failing to protect those who do not have the means to protect themselves. Love also means coming to the aid of others. In other words, under the rule to love one’s enemies, would it be loving to permit an enemy to murder a defenseless person? It would not.</p></blockquote>

<blockquote><p>IN WHAT DOES THE POWER OF THE KEYS OF THE KINGDOM OF HEAVEN DIFFER FROM CIVIL POWER? The points of difference are many, and such as are apparent.

1. Ecclesiastical discipline is exercised by the church; civil power by the judge or magistrate.

2. In the state, judgment is passed according to civil and positive laws; in the church, according to the divine law or word of God.

3. The power of the keys committed to the church depends upon the word of God, and the church exercises her power by the word, denouncing the wrath of God upon the impenitent; punishes the obstinate with the word of God alone, yet in such a way that this punishment takes hold even upon the conscience: civil power employs the sword, and compels the refractory to submit to its authority by temporal punishment alone.

4. The church has different steps of admonition, and if the offender is brought to acknowledge his sin and repents of it, it does not proceed to execute punishment in his case; the magistrate punishes the offender even though he repent.

5. The church in the exercise of discipline, looks to the reformation and salvation of the offender; the magistrate to the execution of justice and the public peace.

6. As the church exercises discipline in the case of none except the obstinate and disobedient, so it is bound to reverse its decision, and to remove the punishment, whenever there is sufficient evidence of repentance on the part of the offender. The magistrate when he has once inflicted punishment neither reverses the decision, nor removes the punishment. The thief that repents upon the cross, or in the hour of death, is received by Christ into Paradise; the magistrate proceeds to the execution of the punishment to which he is sentenced, and sends him into exile. So Christian discipline often takes cognizance of things which the state does not notice, as when the church casts out of her communion those who do not repent, and refuses to recognize them as her members, whilst the magistrate, nevertheless, tolerates them; and so, on the contrary, the state may banish those whom the church receives. The magistrate may, for instance, inflict capital punishment upon adulterers, robbers, thieves, &amp;c., and yet the church may receive them, if they give proper evidence of true repentance. The difference, therefore, between ecclesiastical and civil power, is clear and apparent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, G. W. Williard</cite>, 3rd American Edition. Trans. G. W. Williard (Cincinnati: T. P. Bucher, 1851), 450.</span></figcaption>

</figure><figure class="quote" id="q-ad66e8f7d2" data-kw="">
<blockquote><p>IN WHAT DOES THE CHURCH DIFFER FROM THE STATE? The chief differences between the church and the state are the following:

1. The state is a society which is bound by certain civil laws for the maintenance of external propriety and order, according to each table of the Decalogue. The church consists of those who embrace the gospel, and observe the sacraments according to divine appointment, and is governed by the Spirit and word of God, requiring both internal and external obedience.

2. In the church there are always some holy and godly persons, which is not always true of the state.

3. There are many and different states which are distinguished from each other by locality, time and laws; neither can he who is a citizen of one state, be a citizen of another also, or of all others; nor is there any one universal state of which all others are parts. The church, however, has been, is, and ever will be, one through out all periods, and among all nations. It is for this reason called Catholic, having many parts.

4. The head of the church is one, and in heaven, which head is Christ. The different states have many kings and rulers, and these upon earth.

5. The state has magisterial authority and power to make laws, to which it becomes us to yield obedience for conscience sake. The church is restricted and tied down to the word of God, and has no power to make new articles of faith. It may, indeed, establish “rules of order and propriety, but without binding the conscience; and that not with magisterial authority, but with consent.

6. The state is armed with power to inflict punishment upon obstinate offenders, and to preserve it laws with the sword. The church has merely the sword of the word, which consists in the denunciation of the wrath of God against those who are disobedient. One and the same person, as the prophets and priests of old, may sometimes act both in a civil and ecclesiastical capacity. Hence they ought to be carefully distinguished.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IN WHAT DOES THE CHURCH DIFFER FROM THE STATE? The chief differences between the church and the state are the following:

1. The state is a society which is bound by certain civil laws for the maintenance of external propriety and order, according to each table of the Decalogue. The church consists of those who embrace the gospel, and observe the sacraments according to divine appointment, and is governed by the Spirit and word of God, requiring both internal and external obedience.

2. In the church there are always some holy and godly persons, which is not always true of the state.

3. There are many and different states which are distinguished from each other by locality, time and laws; neither can he who is a citizen of one state, be a citizen of another also, or of all others; nor is there any one universal state of which all others are parts. The church, however, has been, is, and ever will be, one through out all periods, and among all nations. It is for this reason called Catholic, having many parts.

4. The head of the church is one, and in heaven, which head is Christ. The different states have many kings and rulers, and these upon earth.

5. The state has magisterial authority and power to make laws, to which it becomes us to yield obedience for conscience sake. The church is restricted and tied down to the word of God, and has no power to make new articles of faith. It may, indeed, establish “rules of order and propriety, but without binding the conscience; and that not with magisterial authority, but with consent.

6. The state is armed with power to inflict punishment upon obstinate offenders, and to preserve it laws with the sword. The church has merely the sword of the word, which consists in the denunciation of the wrath of God against those who are disobedient. One and the same person, as the prophets and priests of old, may sometimes act both in a civil and ecclesiastical capacity. Hence they ought to be carefully distinguished.”

— Zacharias Ursinus, The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, G. W. Williard, 3rd American Edition. Trans. G. W. Williard (Cincinnati: T. P. Bucher ,1851), 291–92 9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIN+WHAT+DOES+THE+CHURCH+DIFFER+FROM+THE+STATE%3F+The+chief+differences+between+the+church+and+the+state+are+the+following%3A+1.+The+state+is+a+society+which+is+bound+by+certain+civil+laws+for+the+maintenance+of+external+propriety+and+order%2C+according+to+each+table+of+the+Decalogue.+The+church+consists+of+those+who+embrace+the+gospel%2C+and+observe+the+sacraments+according+to+divine+appointment%2C+and+is+governed+by+the+Spirit+and+word+of+God%2C+requiring+both+internal+and+external+obedience.+2.+In+the+church+there+are+always+some+holy+and+godly+persons%2C+which+is+not+always+true+of+the+state.+3.+There+are+many+and+different+states+which+are+distinguished+from+each+other+by+locality%2C+time+and+laws%3B+neither+can+he+who+is+a+citizen+of+one+state%2C+be+a+citizen+of+another+also%2C+or+of+all+others%3B+nor+is+there+any+one+universal+state+of+which+all+others+are+parts.+The+church%2C+however%2C+has+been%2C+is%2C+and+ever+will+be%2C+one+through+out+all+periods%2C+and+among+all+nations.+It+is+for+this+reason+called+Catholic%2C+having+many+parts.+4.+The+head+of+the+church+is+one%2C+and+in+heaven%2C+which+head+is+Christ.+The+different+states+have+many+kings+and+rulers%2C+and+these+upon+earth.+5.+The+state+has+magisterial+authority+and+power+to+make+laws%2C+to+which+it+becomes+us+to+yield+obedience+for+conscience+sake.+The+church+is+restricted+and+tied+down+to+the+word+of+God%2C+and+has+no+power+to+make+new+articles+of+faith.+It+may%2C+indeed%2C+establish+%E2%80%9Crules+of+order+and+propriety%2C+but+without+binding+the+conscience%3B+and+that+not+with+magisterial+authority%2C+but+with+consent.+6.+The+state+is+armed+with+power+to+inflict+punishment+upon+obstinate+offenders%2C+and+to+preserve+it+laws+with+the

<blockquote><p>That this Author saith, God commanded those that transgressed his holy Law with an high hand, and presumptuously to be killed, lest they should live and profane his holy things; I defend not: But sure Erastus erreth, who will have all such to be killed by the Magistrate under the New Testament, because they were killed in the Old: Then are we to stone men that gathereth sticks on the Lord’s Day; the child that is stubborn to his Parents, the Virgins, daughters of Ministers that committeth fornication are to be put to death. Why, but then the whole judicial Law of God shall oblige us Christians as Carolosladius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them, so it was mysterious teach of us, how God hated such and such sins, and mysteries of that kind are gone with the other shadows. But we read not (saith Erastus) where Christ hath changed those Laws in the New Testament. It is true, Christ hath not said in particular, I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated until the evening; nor hath he said particularly of every carnal Ordinance and judicial Law, it is abolished. Be we conceive, the whole bulk of the judicial Law, as judicial, and as it concerned the Republick of the Jews only, is abolished, though the moral equity of all those be not abolished; also some punishments were merely symbolical, to teach the detestation of such a vice, as the boaring with an aul the ear of him that loved his Master, and desired still to serve him, and the making of him his perpetual servant. I should think the punishing with death the man that gathered sticks on the Sabbath was such; and in all this, the punishing of a sin against the Moral Law by the Magistrate, is Moral and perpetual; but the punishing of every sin against the Moral Law, tali modo, so and so, with death, which spitting on the face: I much doubt if these punishments in particular, and in their positive determination to the people of the Jews, be moral and perpetual: As he that would marry a captive woman of another Religion, is to cause her first pare her nails, and wash herself, and give her a month, or less time to lament the death of her Parents, which was a Judicial, not a Ceremonial Law; that this should be perpetual, because Christ in particular hath not abolished it, to me seems most unjust; for as Paul saith, He that is Circumcised becomes a debtor to the whole Law, sure to all the Ceremonies of Moses his Law: So I argue, à pari, from the like, He that will keep one judicial Law, because judicial and given by Moses, becometh debtor to keep the whole judicial Law, under pain of God’s eternal wrath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication</cite>, … (London : John Field for Christopher Meredith, 1646), 493–94.</span></figcaption>

<blockquote><p>Judicial laws may be judicial and Mosaical, and so not obligatory to us, according to the degree and quality of punishment, such as in Deuteronomy 13, the destroying the city, and devoting all therein to a curse; we may not do the like in the like degree of punishment, to all that receive and defend idolaters and blasphemers in their city. And yet that some punishment by the sword be inflicted upon such a city, is of perpetual obligation; because the magistrate bears the sword to take vengeance on ill doers, and so on these that are partakers of his ill deeds, who brings another gospel, I John 5:10. . . . . Because the slaying of man, woman, infant, and suckling, ox and sheep, was temporary, and cannot have a perpetually obligatory ground in the law of nature or natural justice obliging us. . . . . No man but sees the punishment of theft is of common moral equity, and obligeth all nations, but the manner or degree of punishment is more positive: as to punish theft by restoring four oxen for the stealing of one ox, doth not so oblige all nations, but some other bodily punishment, as whipping, may be used against thieves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (London: R.I. for Andrew Crook, 1649), 298-99. Quoted in Sherman Isbell, “The Divine Law of Political Israel Expired: General Equity.”</span></figcaption>

<blockquote><p>Quest. IV. Did the Lord by Moses give to the Jews, as a Body Politick, sundry Judicial Laws, which expired together with their state? Yes. Do they oblige any other now, further than the general equity thereof may require. No. Exod. 21. from the first to the last ver. Exod. 22. 1. to verse 29. Gen. 49. 10. 1 Cor. 9. 8, 9, 10. 1 Peter 2. 13. 14. Matth. 5. 17. 38. 39. Well then, do not some err, though otherwise Orthodox, who maintain, that the whole Judicial Law of the Jews is yet alive, and binding all of us, who are Christian Gentiles? Yes. By what reasons are they confuted? (1) Because, the Judicial Law, was delivered by Moses to the Israelites to be observed, as to a Body Politick; Exod. 21 chapter. (2) Because, this Law, in many things, which are of particular right, was accommodated, to the Common-wealth of the Jews, and not to other Nations also; Exod. 22. 3. Exod. 21. 2. Lev. 25. 2, 3. Deut: 24. 1, 2, 3. Deut. 25. 5, 6, 7. (3) Because, in other things, which are not of particular right, it is neither from the Law of Nature, obliging by Reason; neither is it pressed upon Believers under the Gospel, to be observed. (4) Because, Believers are appointed under the Gospel to obey the civil Laws, and commands of those under whose Government they live, providing they be just, and that for Conscience sake. Rom. 13. 1. 1 Peter 2. 13, 14. Titus 3. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error: a Commentary on the Westminster Confession of Faith</cite>, (Edinburgh, 1684), 144–45.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“Quest. IV. Did the Lord by Moses give to the Jews, as a Body Politick, sundry Judicial Laws, which expired together with their state? Yes. Do they oblige any other now, further than the general equity thereof may require. No. Exod. 21. from the first to the last ver. Exod. 22. 1. to verse 29. Gen. 49. 10. 1 Cor. 9. 8, 9, 10. 1 Peter 2. 13. 14. Matth. 5. 17. 38. 39. Well then, do not some err, though otherwise Orthodox, who maintain, that the whole Judicial Law of the Jews is yet alive, and binding all of us, who are Christian Gentiles? Yes. By what reasons are they confuted? (1) Because, the Judicial Law, was delivered by Moses to the Israelites to be observed, as to a Body Politick; Exod. 21 chapter. (2) Because, this Law, in many things, which are of particular right, was accommodated, to the Common-wealth of the Jews, and not to other Nations also; Exod. 22. 3. Exod. 21. 2. Lev. 25. 2, 3. Deut: 24. 1, 2, 3. Deut. 25. 5, 6, 7. (3) Because, in other things, which are not of particular right, it is neither from the Law of Nature, obliging by Reason; neither is it pressed upon Believers under the Gospel, to be observed. (4) Because, Believers are appointed under the Gospel to obey the civil Laws, and commands of those under whose Government they live, providing they be just, and that for Conscience sake. Rom. 13. 1. 1 Peter 2. 13, 14. Titus 3. 1.”

— David Dickson, Truth’s Victory Over Error: a Commentary on the Westminster Confession of Faith, (Edinburgh, 1684), 144–45.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuest.+IV.+Did+the+Lord+by+Moses+give+to+the+Jews%2C+as+a+Body+Politick%2C+sundry+Judicial+Laws%2C+which+expired+together+with+their+state%3F+Yes.+Do+they+oblige+any+other+now%2C+further+than+the+general+equity+thereof+may+require.+No.+Exod.+21.+from+the+first+to+the+last+ver.+Exod.+22.+1.+to+verse+29.+Gen.+49.+10.+1+Cor.+9.+8%2C+9%2C+10.+1+Peter+2.+13.+14.+Matth.+5.+17.+38.+39.+Well+then%2C+do+not+some+err%2C+though+otherwise+Orthodox%2C+who+maintain%2C+that+the+whole+Judicial+Law+of+the+Jews+is+yet+alive%2C+and+binding+all+of+us%2C+who+are+Christian+Gentiles%3F+Yes.+By+what+reasons+are+they+confuted%3F+%281%29+Because%2C+the+Judicial+Law%2C+was+delivered+by+Moses+to+the+Israelites+to+be+observed%2C+as+to+a+Body+Politick%3B+Exod.+21+chapter.+%282%29+Because%2C+this+Law%2C+in+many+things%2C+which+are+of+particular+right%2C+was+accommodated%2C+to+the+Common-wealth+of+the+Jews%2C+and+not+to+other+Nations+also%3B+Exod.+22.+3.+Exod.+21.+2.+Lev.+25.+2%2C+3.+Deut%3A+24.+1%2C+2%2C+3.+Deut.+25.+5%2C+6%2C+7.+%283%29+Because%2C+in+other+things%2C+which+are+not+of+particular+right%2C+it+is+neither+from+the+Law+of+Nature%2C+obliging+by+Reason%3B+neither+is+it+pressed+upon+Believers+under+the+Gospel%2C+to+be+observed.+%284%29+Because%2C+Believers+are+appointed+under+the+Gospel+to+obey+the+civil+Laws%2C+and+commands+of+those+under+whose+Government+they+live%2C+providing+they+be+just%2C+and+that+for+Conscience+sake.+Rom.+13.+1.+1+Peter+2.+13%2C+14.+Titus+3.+1.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+Truth%E2%80%99s+Victory+Over+Error%3A+a+Commentary+on+the+Westminster+Confession+of+Faith%2C+%28Edinburgh%2C+1684%29%2C+144%E2%80%9345.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fabb0085706.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/abb0085706.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/01/dickson-theonomy-is-an-error/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-786cf49f11" data-kw="">
<blockquote><p>But how doth it appear that these or any other Judicial Laws of Moses do at all appertain to us, as rules to guide us in like cases? I shall with him who scrupleth this, to read Piscator his Appendix to his Observations upon the 21, 22, 23. Chapters of Exodus, where he excellently disputeth this question, Whether the Christian Magistrate be bound to observe the Judicial laws of Moses, as well as the Jewish Magistrate was. He answereth by the common distinction, he is obliged to those things in the Judicial law which are unchangeable, and common to all Nations: but not to those things which are mutable, or proper to the Jewish Republic. But then he explaineth this distinction, that by things mutable, and proper to the Jews, he understandeth the emancipation of an Hebrew servant or handmaid in the seventh year, a mans marying his brothers wife and raising up seed to his brother, the forgiving of debts at the Jubilee, marying with one of the same Tribe, and if there be any other like to these; also Ceremonial trespasses, as touching a dead body, etc. But things immutable, and common to all Nations are the laws concerning Moral trespasses, Sins against the Moral law, as murder, adultery, theft, enticing away from God, blasphemy, striking of Parents. Now that the Christian Magistrate is bound to observe these Judicial laws of Moses which appoint the punishments of sins against the Moral law, he proveth by these reasons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty, Appendix</cite>, (London: Christopher Meredith, 1645), 6–7.</span></figcaption>

</figure><figure class="quote" id="q-a1b9e52002" data-kw="">
<blockquote><p>It is true, indeed, a prince should be loath to put out that life that God hath put in, and should beware, to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince hath no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate the punishment, but to say he may let the man go free, he hath no power. But yet they will insist further, and say, Is not this one of the judicial laws that was given to the Jews—then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them—they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know, that natural men, ethnics, who had never the law of the Jews, they executed the murderer.</p></blockquote>

<blockquote><p>THUS MUCH CONCERNING INWARD FREEDOM: NOW CONCERNING OUTWARD FREEDOM. The outward freedom, is that which pertaineth to the outward life. And it is called Christian liberty, because it belongeth to Christians only. And that is two fold, freedom from the laws of Moses, and freedom indifferent things. Freedom from the laws of Moses, is that by which Christians are loosed from the ceremonial, &amp; Judicial laws of Moses, namely, so far forth as they only pertaine to the civil governement under Moses.

</figure><figure class="quote" id="q-12e421b324" data-kw="">
<blockquote><p>What call you the Judicial Law? That wherein God appointed a Form of Politick and Civil Government of the Common-wealth of the Jews: Which therefore is ceased with the Dissolution of that State, for which it was ordained; saving only in the common Equity. Is this Law utterly revoked and abolished by Christ? No. For he came not to overturn any good Government of the Common-wealth; much less that which was appointed by God himself. May not Christian Magistrates then swerve any thing from those Laws of Government, which were set down by Moses? In some Circumstances they may: But in the general Equity and Substance they may not. What Judicial Laws are immutably to be observed now of Christian Magistrates? Those which have Reasons annexed unto them, and especially those wherein God hath appointed Death for the Punishment of hainous Offences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, 242</span></figcaption>

<blockquote><p>II. There are three opinions about its abrogation: the first in defect (of the Anabaptists and Antinomians, who think it is absolutely and simply abrogated as to all things). On this account, whatever reasons are drawn against them from the Old Testament for the right of the magistrate and of war; for the division of inheritances and the like, they are accustomed to resolve with this one answer—that these are judicial and pertain to the Israelite people and the Old Testament, but are now abrogated under the New. The second, in excess, of those who think that law is still in force and should be retained and that Christian states are to be governed like the Jewish (which was the opinion of Carlstadt and Castellio, with whom the Lutheran Brochmann agrees). Both wander from the truth. The former because thus many moral things would be abrogated which are contained in the forensic law. The latter because thus many typical things would have to be observed which are most foreign to the reason of our times. The third, of the orthodox, who, holding a middle ground, relieve the matter by a distinction, both according to what has been abrogated and according to what is still in force.

III. In that law various ends must be distinguished. For inasmuch as it was a distinction of the Jewish state from the Gentiles and a type of the kingdom of Christ, it is simply abrogated because there is no longer any distinction between the Jews and the Gentiles in Christ (Gal. 3:28; Eph. 2:14). As the Jewish state and polity has been destroyed, so there is no need of a type to adumbrate the future kingdom of Christ, since it has already come. But as to the good order (eutaxian) or form of government of the Israelite people, it cannot be said to have been abrogated, unless relatively. Undoubtedly those things are to be accurately distinguished which in the law were of particular right (which peculiarly applied to the Jews in relation to time, place and Jewish nation: such was the law concerning a husband’s brother, the writing of divorcement, the gleaning, etc.) from those which were of common and universal right, founded upon the law of nature common to all (such as the laws concerning trials and the punishment of crimes, widows, orphans, strangers and the like, which are of moral and common right). As to the former, they may well be said to have been abrogated because the Jewish polity having been taken away, whatever had a peculiar relation to it must also necessarily have ceased. But as to the latter, it still remains because it enters into the nature of the moral and perpetual law and was commanded to the Jews not as Jews simply, but as men subject with others to the law of nature. For distinguishing those things which are of common and particular right, a threefold criterion can be employed. (1) That what prevails not only among the Jews, but also among the Gentiles (following the light of right reason) is of common right. Thus the Greeks, Romans and others had their own laws in which are many things agreeing with the divine laws (which even a comparison of the Mosaic and Roman law alone, instituted by various persons, teaches). (2) What is found to be conformed to the precepts of the decalogue and serves to explain and conform it. This is easily gathered, if either the object and the matter of the laws or the causes of sanctioning them are attended to. (3) The things so repeated in the New Testament that their observance is commended to Christians.

IV. In the laws founded upon the common right or the law of nature, the substance of the precept must be distinguished from its circumstances. Some, both as to substance and as to circumstances, are of common right; others, however, are as to substance of common right, but as to circumstances of particular right. The former are perpetual in all parts; the latter, on the other hand, only relatively. Thus in the laws concerning the punishment of crimes, the substance of the punishment is of natural right, but the manner and degree of punishment is of particular right and on that account mutable.

V. Whatever forensic laws are mixed with types are in their own nature changeable and so have been abrogated of right because their causes and foundations are temporary, not perpetual. Such are the laws concerning the right of primogeniture (Dt. 21:17), asylums (Dt. 19:2), the Jubilee, the not sowing of fields with different kinds of seed, the not wearing garments of wool and linen and the like. Although they might have had a political end also, they still (because they were typical) cease to bind on that very account.

VI. The forensic laws accommodated to the genius and reason of the Jewish polity were not only made useless to Christians living under a different polity, but neither can, nor ought to be observed any longer (such as the Levirate law, the law of jealousy, the law of the selling of a son [Ex. 21], the law concerning the rest of fields, dividing the land of Canaan between the tribes and the like). These had a peculiar relation (schesin) to the Israelite people and its government. This having been taken away, they can have no further use.

VII. The polity having been abolished, the laws must necessarily be abolished upon which that polity was founded. They are of positive right and referred simply to the Jewish state; but not forthwith the others founded in natural right and appendages to the decalogue. Therefore, the forensic law as to general determinations, founded upon the moral law, is not abrogated; but as to special determination, which concerned the state of the Jews, is abrogated.

VIII. The forensic law may be viewed either formally, as it was enacted for the Jews (and so is abrogated); or materially, inasmuch as it agrees with the natural law and is founded on it (and thus it still remains).

<div class="actions"><button class="copy" data-copy="“II. There are three opinions about its abrogation: the first in defect (of the Anabaptists and Antinomians, who think it is absolutely and simply abrogated as to all things). On this account, whatever reasons are drawn against them from the Old Testament for the right of the magistrate and of war; for the division of inheritances and the like, they are accustomed to resolve with this one answer—that these are judicial and pertain to the Israelite people and the Old Testament, but are now abrogated under the New. The second, in excess, of those who think that law is still in force and should be retained and that Christian states are to be governed like the Jewish (which was the opinion of Carlstadt and Castellio, with whom the Lutheran Brochmann agrees). Both wander from the truth. The former because thus many moral things would be abrogated which are contained in the forensic law. The latter because thus many typical things would have to be observed which are most foreign to the reason of our times. The third, of the orthodox, who, holding a middle ground, relieve the matter by a distinction, both according to what has been abrogated and according to what is still in force.

III. In that law various ends must be distinguished. For inasmuch as it was a distinction of the Jewish state from the Gentiles and a type of the kingdom of Christ, it is simply abrogated because there is no longer any distinction between the Jews and the Gentiles in Christ (Gal. 3:28; Eph. 2:14). As the Jewish state and polity has been destroyed, so there is no need of a type to adumbrate the future kingdom of Christ, since it has already come. But as to the good order (eutaxian) or form of government of the Israelite people, it cannot be said to have been abrogated, unless relatively. Undoubtedly those things are to be accurately distinguished which in the law were of particular right (which peculiarly applied to the Jews in relation to time, place and Jewish nation: such was the law concerning a husband’s brother, the writing of divorcement, the gleaning, etc.) from those which were of common and universal right, founded upon the law of nature common to all (such as the laws concerning trials and the punishment of crimes, widows, orphans, strangers and the like, which are of moral and common right). As to the former, they may well be said to have been abrogated because the Jewish polity having been taken away, whatever had a peculiar relation to it must also necessarily have ceased. But as to the latter, it still remains because it enters into the nature of the moral and perpetual law and was commanded to the Jews not as Jews simply, but as men subject with others to the law of nature. For distinguishing those things which are of common and particular right, a threefold criterion can be employed. (1) That what prevails not only among the Jews, but also among the Gentiles (following the light of right reason) is of common right. Thus the Greeks, Romans and others had their own laws in which are many things agreeing with the divine laws (which even a comparison of the Mosaic and Roman law alone, instituted by various persons, teaches). (2) What is found to be confo <blockquote><p>To what extent has Christ abrogated the Law, and to what extent is it still in force? The ordinary and correct answer to this question is, that the ceremonial and judicial law, as given by Moses, has been abrogated in as far as it relates to obedience; and that the moral law has also been abrogated as it respects the curse, but not as it respects obedience. That the ceremonial and judicial laws have been so abrogated by the coming of Christ, that they no longer bind any to obedience, and that they have not the appearance and force of laws in respect to the present time, is proven, 1. From the fact that the prophets even declared and foretold this abrogation in the Old Testament. “Christ shall confirm the covenant with many for one week, and in the midst of the week he shall cause the sacrifice and the oblation to cease.” “Thou art a priest forever after the order of Melchisedek. (Dan. 9:27. Ps. 110:4.)

2. Christ and his Apostles, in different places in the New Testament, expressly assert this abrogation. (See Acts 7:8. Heb. 7:11–18; 8:8–13.) Instead of adducing a number of testimonies in confirmation of this point, we shall merely cite the decree passed by the Apostles when assembled in Jerusalem: “For it seemed good to the Holy Ghost and to us to lay upon you no greater burden, than these necessary things,” etc. (Acts 15:28, 29.)

3. When certain causes are once changed, the laws which are based upon these causes are also changed. One cause now of the ceremonial and judicial law was that the form of worship and civil polity which existed among the Jews, from whom the Messiah was to be born, might distinguish them from all other nations until the Messiah would come. Another cause was that they might be types of the Messiah and of his benefits. These causes now since the coming of the Messiah, have been done away with: for the Apostle declares that the middle wall of partition between the Jews and other nations has been broken down: “He is our Peace, who hath made both one, and hath broken down the middle wall of partition between us,” “For in Christ Jesus, neither circumcision availeth any thing, nor uncircumcision, but a new creature. (Eph. 2:14. Gal. 6:15.) It is also every where taught in the New Testament Scriptures that the rites and ceremonies of the old dispensation have been fulfilled in Christ. “The Holy Spirit, this signifying that the way into the holiest of all was not yet made manifest, while the first tabernacle was yet standing.” “The law and the prophets were until John.” “Let no man judge you in meat or in drink,” etc. (Heb. 9:8. Luke 10:16. Col. 2:16.) … Objection 3: The best and most wholesome form of government is always to be retained. The form of government established among the Jews was the best and most wholesome, for the reason that it was instituted by God. Therefore it is to be retained. Answer: There is here a fallacy in taking that to be absolutely true, which is true only in a certain respect. The form of government established among the Jews was the best, not absolutely, but only for that time, that country and nation: for there were many things in it adapted to the state and condition of that nation, country, time, and ceremonial worship, the observance of which would now neither be proper nor profitable, because the causes on account of which those laws were given to the Jews are now changed or removed; as giving a writing or bill of divorcement, marrying the widow of one’s kindred, etc. God did not, for this reason, institute this form of government that all nations and ages might be bound by it; but only that his own people might, by this discipline, be separated for a time from the surrounding nations. If any one should object and say, that if Christians are permitted to observe and conform to the laws of other nations, such as the Greeks or Romans, etc., much more ought we to observe those which were given by Moses, the servant of God; we readily grant the argument, if this observance is rendered without attaching to it the idea of necessity; or if these laws are observed, not because Moses commanded and enjoined them upon the Jewish nation, but because there are good reasons why we should now comply with them; and if these reasons should be changed, to retain the liberty of changing these enactments by public authority.</p></blockquote>

er+cause+was+that+they+might+be+types+of+the+Messiah+and+of+his+benefits.+These+causes+now+since+the+coming+of+the+Messiah%2C+have+been+done+away+with%3A+for+the+Apostle+declares+that+the+middle+wall+of+partition+between+the+Jews+and+other+nations+has+been+broken+down%3A+%E2%80%9CHe+is+our+Peace%2C+who+hath+made+both+one%2C+and+hath+broken+down+the+middle+wall+of+partition+between+us%2C%E2%80%9D+%E2%80%9CFor+in+Christ+Jesus%2C+neither+circumcision+availeth+any+thing%2C+nor+uncircumcision%2C+but+a+new+creature.+%28Eph.+2%3A14.+Gal.+6%3A15.%29+It+is+also+every+where+taught+in+the+New+Testament+Scriptures+that+the+rites+and+ceremonies+of+the+old+dispensation+have+been+fulfilled+in+Christ.+%E2%80%9CThe+Holy+Spirit%2C+this+signifying+that+the+way+into+the+holiest+of+all+was+not+yet+made+manifest%2C+while+the+first+tabernacle+was+yet+standing.%E2%80%9D+%E2%80%9CThe+law+and+the+prophets+were+until+John.%E2%80%9D+%E2%80%9CLet+no+man+judge+you+in+meat+or+in+drink%2C%E2%80%9D+etc.+%28Heb.+9%3A8.+Luke+10%3A16.+Col.+2%3A16.%29+%E2%80%A6+Objection+3%3A+The+best+and+most+wholesome+form+of+government+is+always+to+be+retained.+The+form+of+government+established+among+the+Jews+was+the+best+and+most+wholesome%2C+for+the+reason+that+it+was+instituted+by+God.+Therefore+it+is+to+be+retained.+Answer%3A+There+is+here+a+fallacy+in+taking+that+to+be+absolutely+true%2C+which+is+true+only+in+a+certain+respect.+The+form+of+government+established+among+the+Jews+was+the+best%2C+not+absolutely%2C+but+only+for+that+time%2C+that+country+and+nation%3A+for+there+were+many+things+in+it+adapted+to+the+state+and+condition+of+that+nation%2C+country%2C+time%2C+and+ceremonial+worship%2C+the+observance+of+which+would+now+neither+be+proper+nor+profitable%2C+because+the+causes+on+account+of+which+those+laws+were+given+to+the+Jews+are+now+changed+or+removed%3B+as+giving+a+writing+or+bill+of+divorcement%2C+marrying+the+widow+of+one%E2%80%99s+kindred%2C+etc.+God+did+not%2C+for+this+reason%2C+institute+this+form+ <blockquote><p>I would have preferred to pass over this matter in utter silence if I were not aware that here many dangerously go astray. For there are some who deny that a commonwealth is duly framed which neglects the political system of Moses, and is ruled by the common laws of nations. Let other men consider how perilous and seditious this notion is; it will be enough for me to have proved it false and foolish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.20.14.</span></figcaption>

</figure><figure class="quote" id="q-4c8f9f5b3c" data-kw="">
<blockquote><p>The law in general, is that part of God’s Word, which commands things just, honest, and godly, and being thus conceived, it is threefold: ceremonial, judicial, and moral. The ceremonial law, is that part of God’s Word, which prescribed to the Jews, ceremonies, rites, and orders, to be performed in the worship of God. This law is laid down in the books of Moses, especially in Leviticus. The judicial law, is that part of God’s Word, which prescribed ordinances for the government of the Jews’ commonwealth, and the civil punishment offenders. The ceremonial law concerned the Jews only. The judicial law did indeed principally concern them, but yet so far forth as it tends to the establishing of the moral law, having in it common equity,* it concerns all people, in all times and places. What the moral law is, I will describe in three points: first, it is that part of God’s Word, concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature, in regard whereof, it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection, and outward in speech and action. Thirdly, it binds to the curse and punishment everyone that fails in the least duty thereof, though but once, and that in thought only: ‘Cursed is every one that continueth not in all things that are written in the law to do them’ (Gal. 3:10). The sum of the moral law is propound in the Decalogue or Ten Commandments, which many can repeat, but few do understand. That we may further conceive aright the moral law, we must make a difference between it and the gospel, for the gospel is that part of the Word which promises righteousness and life everlasting to all that believe in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (1:243–44).</span></figcaption>

</figure><figure class="quote" id="q-edad5458d1" data-kw="">
<blockquote><p>But touching other nations and specially Christian Commonwealths in these days, the case is otherwise. Some are of the opinion that the whole judicial law is wholly abolished and some again run to the other extreme, holding that the judicial laws bind Christians as straightly as the Jews but no doubt they are both are wide and the safest course is the keep to the mean between both. Therefore the judicial laws of Moses according to the substance and scope thereof must distinguished in which respect they are of two sorts: Some of them are laws of particular equity and some of common equity. Laws of particular equity and condition of the Jews’ Commonwealth and to the circumstances thereof, time, place, persons, things, [and] actions. Of this kind was the law that the brother should raise up seed of his brother and many such like and none of them bind us because they were framed and tempered to a particular people. Judicials of common equity are such as are made according to the law or instinct of nature common to all men and these in respect of their substance bind the consciences not only of the Jews but also of the Gentiles for they were not given to the Jews as they were Jews, that is, a people received into the covenant above all other nations, brought from Egypt to the Land of Canaan, of whom the Messiah according to the flesh was to come; but they were given to them as they were mortal men subject to the order and laws of nature as other nations are. Again, judicial laws so far as they have in them the general or common equity of the law of nature are moral and therefore binding in conscience as the moral law.</p></blockquote>

<blockquote><p>I. As the ceremonial law was concerned with God, the political was concerned with the neighbor.

II. In those matters on which it is in harmony with the moral law and with ordinary justice, it is binding upon us.

III. In those matters which were peculiar to that law and were prescribed for the promised land or the situation of the Jewish state, it has not more force for us than the laws of foreign commonwealths.</p></blockquote>

<blockquote><p>3. Beside this law, commonly called moral, God was pleased to give to the people of Israel, as a church under age, ceremonial laws, containing several typical ordinances, partly of worship, prefiguring Christ, his graces, actions, sufferings, and benefits; and partly, holding forth divers instructions of moral duties. All which ceremonial laws are now abrogated, under the new testament.

4. To them also, as a body politic, he gave sundry judicial laws, which expired together with the State of that people; not obliging any other now, further than the general equity thereof may require.

5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-confession-of-faith.html">Westminster Confession of Faith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 20.</span></figcaption>

</figure><figure class="quote" id="q-0dfde41248" data-kw="">
<blockquote><p>The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshiped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come [Gal. 4:3–4; cf. ch. 3:23–24], in order that he might fully manifest his wisdom to the nations, and show the truth of those things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted certain formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety, inasmuch as they kept the church of the Jews in service and reverence to God, and yet could be distinguished from piety itself. In like manner, the form of their judicial laws, although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law, had something distinct from that precept of love. Therefore, as ceremonial laws could be abrogated while piety remained safe and unharmed, so too, when these judicial laws were taken away, the perpetual duties and precepts of love could still remain. But if this is true, surely every nation is left free to make such laws as it foresees to be profitable for itself. Yet these must be in conformity to that perpetual rule of love, so that they indeed vary in form but have the same purpose. For I do not think that those barbarous and savage laws such as gave honor to thieves, permitted promiscuous intercourse, and others both more filthy and more absurd, are to be regarded as laws. For they are abhorrent not only to all justice, but also to all humanity and gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.20.15.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f6fcaf3bc6" data-kw="">
<blockquote><p>The use of the judicial, or civil laws, was, That they might contribute to the preservation of the Mosaic polity. That they might be types of the government of the church in the kingdom of Christ, inasmuch as the princes and kings of the Jewish nation were no less, than the priests a type of Christ, the High Priest and King of the Church. These uses, together with the laws themselves, were done away with when the ceremonies of the former dispensation were fulfilled and abrogated by the coming of Christ, and the Mosaic polity overthrown by the Romans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 612.</span></figcaption>

</figure><figure class="quote" id="q-a834883b73" data-kw="">
<blockquote><p>One Instance more of his mis-alledging and perverting of testimonies. In the close he cites a passage of Mr. Case his Sermon August 22. 1645. “He (Christ) is King of Nations and King of Saints. As King of Nations he has a temporal Kingdom and Government over the world, etc. and the rule and regiment of this Kingdom he has committed to Monarchies, etc. Here is Erastianism, (says Mr. Coleman p. 38.) a step higher then ever I or Erastus himself went. And I desire to know of Mr. Gillespie, if he will own this as good divinity.” Yes Sir I own it for very good divinity, for my Reverend Brother Mr. Case, says not that Christ as Mediator is King of Nations, and has a temporal Kingdom in the world, and has committed rule and regiment to Monarchies or other lawful Magistrates, (which is the point that you and Mr. Hussey contend for, being a great Heterodoxy in Divinity) but he says of the Son of God, that he is King of Nations, and has committed Rule to Monarchies, which I own with all my heart. The distinction of the twofold Kingdom of Christ, a universal Kingdom, whereby he reigns over all things as God: and a special economical Kingdom, whereby he is King to the Church only, and rules and governs it, is that which being rightly understood, overturns, overturns, overturns the Erastian principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Male audis or, An answer to Mr. Coleman his Malè dicis: Wherein the repugnancy of his Erastian doctrine to the word of God, to the solemne league and covenant, and to the ordinances of Parliament</cite>, …. (London, 1646), 55.. [Spelling modernized].</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“One Instance more of his mis-alledging and perverting of testimonies. In the close he cites a passage of Mr. Case his Sermon August 22. 1645. “He (Christ) is King of Nations and King of Saints. As King of Nations he has a temporal Kingdom and Government over the world, etc. and the rule and regiment of this Kingdom he has committed to Monarchies, etc. Here is Erastianism, (says Mr. Coleman p. 38.) a step higher then ever I or Erastus himself went. And I desire to know of Mr. Gillespie, if he will own this as good divinity.” Yes Sir I own it for very good divinity, for my Reverend Brother Mr. Case, says not that Christ as Mediator is King of Nations, and has a temporal Kingdom in the world, and has committed rule and regiment to Monarchies or other lawful Magistrates, (which is the point that you and Mr. Hussey contend for, being a great Heterodoxy in Divinity) but he says of the Son of God, that he is King of Nations, and has committed Rule to Monarchies, which I own with all my heart. The distinction of the twofold Kingdom of Christ, a universal Kingdom, whereby he reigns over all things as God: and a special economical Kingdom, whereby he is King to the Church only, and rules and governs it, is that which being rightly understood, overturns, overturns, overturns the Erastian principles.”

ACHEN%3A+No%2C+sir%3B+I+was+not.+I+have+only+read+about+it+in+the+newspapers.+MR.+LOWREY%3A+The+question+I+intended+to+ask+is+about+a+matter+that+has+puzzled+me+somewhat.+It+seems+that+the+resolution+was+passed+unanimously%2C+and+now+I+am+finding+a+great+many+who+are+saying%2C+%E2%80%9CI+am+opposed+to+it%2C+but+I+did+not+vote+against+it.%E2%80%9D+I+think+not+less+than+8+or+10+educators+have+expressed+definitely+to+me+their+opposition+to+it+and+yet+say%2C+%E2%80%9CI+did+not+vote+that+way%E2%80%9D+I+do+not+see+why+the+fight+was+not+made+there+if+there+was+strength+of+opposition.+I+do+not+see+why+some+of+those+men+who+have+said+that+so+definitely+to+me+did+not+make+the+fight.+DR.+MACHEN%3A+It+is+a+very+strange+thing+to+me+that+is+not+done.+A+great+many+men+feel+that+there+is+no+use+in+voting+against+a+thing+unless+you+can+defeat+it.+I+do+not+feel+that+way.+I+think+it+is+a+very+important+thing+to+vote+exactly+in+accordance+with+your+conscience%2C+quite+irrespective+of+the+immediate+success+of+your+vote+in+your+dealing+with+that+measure.+MR.+HOLADAY%3A+Doctor%2C+do+you+feel+that+at+any+time+in+the+past+the+present+Bureau+of+Education+has+directly+or+indirectly+interfered+with+the+operation+of+the+school+with+which+you+are+connected%3F+DR.+MACHEN%3A+No%2C+sir%3B+I+do+not+think+that+there+is+anything+to+be+said+definitely+with+respect+to+theological+school+with+which+I+am+connected.+MR.+HOLADAY%3A+Do+you+know+whether+or+not+the+Bureau+of+Education+has+ever+interfered%2C+directly+or+indirectly%2C+with+the+operation+of+any+private+or+church+school%3F+DR.+MACHEN%3A+I+have+not+the+evidence+before+me.+I+myself+am+inclined+to+think+that+the+classification+of+colleges+which+has+been+proposed+by+it+is+unfortunate%2C+and+I+believe+that+the+vast+enlargement+of+such+activities+by+a+department+of+education+would+be+dangerous%3B+but+I+am+not+in+the+present+hearing+at+all+personally+interested+with+respect+to+my+activities+in+the+institution+with+which+I+am+connected.+With+respect+to+the+future%2C+I+do+feel%2C+sir%2C+that+I+am+contending+for+a+principle+which+is+absolutely+necessary+to+the+principle+of+religious+liberty.+There+are+in+the+sphere+of+education+tendencies+which+are+directly+opposed+to+religious+liberty%2C+such+as+the+effort+to+produce+a+system+of+morality+codes%2C+etc.%2C+in+the+public+schools%3B+and+the+whole+notion+that+the+function+of+the+public+school+is+to+be+enlarged+it+seems+to+me+is+inimical+to+the+principle+of+parental+authority%2C+and+is+very+dangerous.+The+proper+tendency%2C+it+seems+to+me%2C+would+be+to+diminish+rather+than+to+increase+the+function+of+the+public+school%2C+and+to+place+the+responsibility+for+the+moral+and+religious+training+of+children+exactly+where+it+belongs%2C+upon+the+individual+parents.+There+is+a+tendency+there+which+I+think+is+dangerous%3B+and+the+tendency+of+those+who+advocate+this+bill%2C+with+their+desire+that+there+shall+be+a+dignity+given+to+public+education+under+central+control+which+it+does+not+possess%2C+that+its+function+shall+be+enlarged%2C+if+continued%2C+I+think%2C+will+be+inimical+in+the+most+thorough-going+way+to+religious+liberty.+MR.+REED+of+NEW+YORK%3A+Doctor%2C+may+I+ask+you+a+question%3F+Carrying+out+your+principle%2C+if+it+were+left+to+you%2C+would+you+abolish+the+present+Bureau+of+Education+entirely%3F+DR.+MACHEN%3A+I+could+not+say+that+definitely+until+I+examine+in+detail%2C+sir%2C+all+of+the+functions+of+the+present+Bureau+of+Education.+It+is+perfectly+obvious+that+the+Federal+Government+has+some+functions+in+the+sphere+of+education%2C+for+instance+in+the+District+of+Columbia%3B+and+I+should+have+to+inform+myself+more+particularly+before+I+could+answer+that+question.+But+I+do+advocate+the+abolition+of+certain+functions+of+the+present+Bureau+of+Education%2C+its+activities+as+a+general+agency+in+the+guidance+of+the+States+in+their+own+individual+affairs.+I+think+that+there+are+activities+which+would+far+better+be+avoided%3B+but+I+cannot+make+so+sweeping+an+assertion+as+that+I+should+advocate+the+abolition+of+the+Bureau+of+Education+without+examining+all+of+its+functions.+MR.+REED+of+NEW+YORK%3A+I+know+that+you+are+sincere+in+opposing+it+on+principle%2C+not+only+in+education%2C+but+in+other+activities.+For+instance%2C+we+will+take+the+Department+of+Agriculture.+Carrying+out+your+principle%2C+if+you+had+the+right+to+do+it%2C+would+you+be+in+favor+of+eliminating+Federal+aid+in+the+Agricultural+Department.+DR.+MACHEN%3A+I+think+this+is+to+be+said%E2%80%94that+when+you+eliminate+an+agency+which+has+long+been+in+operation+you+are+doing+something+more+serious+than+the+avoidance+of+an+entrance+upon+those+activities%3B+and+I+should+have+to+examine+the+dangers+which+might+result+from+the+sudden+elimination+of+such+activities+in+the+sphere+of+agriculture.+I+do+feel%2C+however%2C+that+there+is+a+difference+between+the+sphere+of+education+and+those+other+spheres.+As+I+say%2C+I+think+that+when+it+comes+to+the+training+of+human+beings%2C+you+have+to+be+a+great+deal+more+careful+than+you+do+in+other+spheres+about+preservation+of+the+right+of+individual+liberty+and+the+principle+of+individual+responsibility%3B+and+I+think+we+ought+to+be+plain+about+this%E2%80%94that+unless+we+preserve+the+principles+of+liberty+in+this+department+there+is+no+use+in+trying+to+preserve+them+anywhere+else.+If+you+give+the+bureaucrats+the+children%2C+you+might+as+well+give+them+everything+else+as+well.+%5BApplause.%5D+So+that+it+does+seem+to+me+we+are+dealing+with+the+most+important+part+of+human+life+when+we+are+dealing+with+education%2C+and+we+are+dealing+with+a+sphere+where+analogies+drawn+from+mechanical+spheres+are+very+dangerous%3B+and+yet+I+am+opposed+in+general+to+the+notion+that+even+in+other+spheres+we+should+develop+the+principle+that+if+someone+else+does+not+do+it%2C+Washington+will+always+step+in+and+do+it.+I+think+that+is+opposed+to+an+economical+conduct+of+life%3B+it+is+working+great+moral+harm+to+our+people+in+many+other+spheres%3B+but+the+exact+limits+of+the+activities+of+the+Federal+Government+constitute+a+question+with+which+I+am+not+now+attempting+to+deal.+I+have+tried+to+observe%2C+in+the+sphere+of+education%2C+the+results+of+the+present+tendency+towardstandardization%2C+and+I+think+those+results+are+lamentable.+I+think+we+are+having+to-+day+a+very+marked+intellectual+as+well+as+moral+decline+through+the+gradual+extension+of+this+principle+of+standardization+in+education.+People+are+ready+to+admit+to+some+extent+that+there+is+a+sort+of+moral+decline%2C+but+what+is+not+always+observed+is+that+there+is+a+terrible+intellectual+decline%2C+and+that+intellectual+decline+comes+through+the+development+of+this+principle+of+unification+and+standardization+to+which+I+object%3B+for+I+think+that+in+the+sphere+of+education+uniformity+always+means+not+something+uniformly+high+but+something+uniformly+low.+MR.+HOLADAY%3A+Doctor%2C+I+understood+you+to+say+that+in+your+opinion+the+public+schools+have+already+gone+too+far+in+moral+teaching.+I+should+like+a+little+further+information+about+your+ideas+on+that+question.+DR.+MACHEN%3A+I+am+not+sufficiently+familiar+with+the+actual+working+out+of+these+proposals+in+detail%3B+but+I+am+opposed+in+general+to+the+morality+codes+which+have+been+proposed+here+in+Washington%2C+for+example%2C+which+represent+morality+as+the+result+of+human+experience%2C+and+so+seem+to+me+to+undermine+the+very+basis+of+morality+and+to+be+producing+moral+decline.+My+position+with+regard+to+moral+and+religious+training+in+its+connection+with+the+State+is+rather+simple.+I+think+it+is+a+very+good+thing+if+the+public+schools+release+children+at+convenient+hours+during+the+week+for+religious+training%2C+but+I+am+absolutely+opposed+to+any+granting+of+school+credit+for+work+done+in+those+hours%2C+to+the+slightest+scrutiny+of+attendance+or+of+the+standards+of+instruction%2C+or+anything+of+the+kind%3B+and+I+hold+that+the+solution+of+our+difficulties+is+in+the+restriction+in+general+of+the+public+schools+to+their+function+of+imparting+knowledge%2C+and+the+gradual+production+in+the+minds+of+our+people+of+the+notion+that+moral+and+religious+training+is+a+responsibility+of+the+parents+and+not+of+the+State.+I+do+not+know%2C+sir%2C+whether+that+answers+your+question.+MR.+HOLADAY%3A+I+think+so.+MR.+ROBISON%3A+Mr.+Chairman%2C+I+should+like+to+ask+the+witness+a+few+questions.+What+is+the+nature+of+your+work+at+Princeton%3F+DR.+MACHEN%3A+I+am+a+professor+in+Princeton+Theological+Seminary%2C+which+is+an+institution+for+the+training+of+ministers.+MR.+ROBISON%3A+I+understand+that%2C+but+what+is+your+particular+work+in+that+institution%3F+DR.+MACHEN%3A+I+am+a+teacher+in+the+New+Testament+department.+MR.+ROBISON%3A+Have+you+ever+had+any+experience+in+teaching+in+the+public+schools%3F+DR.+MACHEN%3A+No%2C+sir.+I+have+had+an+experience+of+the+result+of+such+activities%E2%80%94a+rather+wide+experience.+MR.+ROBISON%3A+Have+you+ever+had+any+experience+in+directing+the+public-school+work+of+any+community+or+State%3F+DR.+MACHEN%3A+No%2C+sir.+MR.+ROBISON%3A+Your+fear+is+that+this+department+of+education+would+have+a+tendency+to+federalize+or+centralize+and+enslave+the+public-school+system+of+the+Nation%3F+DR.+MACHEN%3A+Yes%2C+sir.+MR.+ROBISON%3A+And+then+I+take+it%2C+as+a+logical+result+or+sequence%2C+that+you+are+opposed+to+the+present+Bureau+of+Education+in+so+far+as+it+acts+as+a+fact-finding+organization%2C+or+gives+leadership+and+stimulation%2C+or+undertakes+to+do+so%2C+to+the+public-school+work+of+the+Nation%3F+DR.+MACHEN%3A+I+am+not+entirely+prepared+to+answer+that+question+categorically+MR.+ROBISON%3A+I+mean%2C+outside+the+District+of+Columbia.+DR.+MACHEN%3A+There+are+a+good+many+functions+in+the+sphere+of+education+which+legitimately+belong+to+the+Federal+Government%3B+but+I+am+opposed+to+the+extension+of+an+agency+which+assists+the+States+and+assists+private+individuals%2C+or+a+Federal+agency+even+in+the+spheres+about+which+you+are+speaking.+MR.+ROBISON%3A+So+that+we+may+understand+each+other+and+so+that+we+may+understand+your+testimony%2C+what+spheres+do+you+think+are+properly+occupied+by+the+Federal+Government%2C+or+could+be%2C+so+far+as+its+relations+to+the+public+schools+in+the+States%2C+outside+of+the+District+of+Columbia%2C+are+concerned%3F+DR.+MACHEN%3A+I+am+inclined+to+think+that+it+would+have+been+better+if+it+had+not+entered+on+that+field+at+all.+MR.+ROBISON%3A+No%3B+you+said+you+were+in+favor+of+some+things.+I+want+to+know+what+those+things+are.+DR.+MACHEN%3A+I+mentioned+one%E2%80%94the+District+of+Columbia.+MR.+ROBISON%3A+Outside+of+the+District+make+laws+here+for+the+District+of+Columbia%2C+and+make+the+laws+of+the+Federal+Government.+DR.+MACHEN%3A+I+hate+to+speak+about+a+subject+where+I+have+not+all+of+the+facts+in+hand%2C+and+I+am+not+speaking+in+general+about+detailed+activities+of+the+Federal+Bureau+of+Education.+Until+I+am+asked+about+every+one+of+those+activities+separately+I+should+not+like+to+make+general+statements+about+them.+MR.+ROBISON%3A+But+your+statement+was%2C+if+I+understood+you%2C+that+you+thought+there+were+spheres+in+which+the+Federal+Government+could+and+should+properly+participate+in+public+education+outside+of+the+District+of+Columbia.+My+inquiry+is%2C+What+are+those+spheres%3F+What+should+it+do+properly%3F+DR.+MACHEN%3A+Well%2C+sir%2C+I+do+not+feel+that+I+can+undertake+the+rather+difficult+duty+of+mapping+a+program+for+a+Federal+agency.+I+am+speaking+only+in+opposition+to+something.+I+am+not+speaking+in+favor+of+other+things+or+mapping+out+a+legitimate+program.+MR.+ROBISON%3A+But+I+asked+that+question+because+of+your+statement+that+the+Federal+Government+had+proper+spheres+in+public+education+outside+of+the+District+of+Columbia.+I+am+merely+inquiring+what+are+those+spheres+in+your+mind%3F+DR.+MACHEN%3A+I+do+not+know+that+I+made+that+assertion%2C+sir%E2%80%94that+the+Federal+Government+has+proper+spheres+for+education+outside+of+the+District+of+Columbia.+I+am+not+saying+that+it+has+not%2C+and+I+am+not+saying+that+it+has%2C+sir.+MR.+ROBISON%3A+Then+you+have+not+made+sufficient+investigation+to+know+whether+these+activities+of+the+Bureau+of+Education+have+been+helpful+or+harmful+to+the+public+schools+of+the+Nation%3F+Is+not+that+your+position%3F+DR.+MACHEN%3A+I+think+it+is+quite+possible+that+some+of+those+activities+have+been+helpful%3B+but+I+am+opposed+to+the+increase+of+the+functions+of+this+Federal+agency+because+that+increase+is+distinctly+in+the+interest+of+a+general+aid+carried+on+by+the+Federal+Government+in+the+sphere+of+the+individual+States%2C+and+I+am+sorry+that+such+a+Federal+agency+is+already+in+existence.+I+am+sorry+that+part+of+Federal+activities+has+already+begun.+I+think+it+is+perfectly+proper+for+the+Federal+Government+to+maintain+here+in+Washington+certain+museums+and+certain+agencies+for+education+in+the+National+Capital.+I+think+a+good+many+of+those+activities+may+be+of+benefit+to+the+people+of+the+whole+country%2C+and+I+am+not+attempting+to+draw+the+line+in+any+clear+way.+MR.+ROBISON%3A+Now%2C+if+I+understand+you%2C+if+you+are+sorry+that+there+is+a+Bureau+of+Education+here+in+Washington%2C+then+it+follows+that+your+mind+tells+you+that+it+ought+to+be+abolished%3B+and+then%2C+further%2C+if+you+do+not+know+the+activities+of+the+Bureau+of+Education+here+and+its+relation+to+the+public+schools+and+public+education+of+the+country%2C+how+can+you+say+that+an+enlargement+of+this+bureau+would+be+harmful+or+helpful%3F+DR.+MACHEN%3A+I+am+opposed+to+it%2C+as+I+tried+to+explain%2C+sir%2C+in+principle.+MR.+ROBISON%3A+I+know+you+said+you+are+opposed+to+it.+DR.+MACHEN%3A+I+am+opposed+to+the+principle+of+Federal+aid%2C+and+I+am+opposed+to+the+activities+of+the+Federal+bureau+where+they+involve+the+laying+down+of+standards+of+education%E2%80%94of+certain+standards+for+colleges%2C+for+example.+I+think+that+is+an+unfortunate+thing.+I+think+it+is+very+much+better+to+have+men+who+are+engaged+in+education+examine+methods+of+education%2C+examine+standards%2C+rather+than+to+have+such+agencies+of+research+come+before+the+people+with+the+authority+of+the+Federal+Government%2C+with+the+fear+at+all+times+that+we+shall+have+an+agitation+to+compel+schools+to+maintain+those+standards.+We+have+very+frequently+the+principle+that+the+States+are+to+be+allowed+to+do+this+and+that%3B+but+if+they+do+not+maintain+certain+standards+which+have+been+laid+down+by+Federal+agencies+of+research%2C+they+should+then+be+compelled+to+do+it+by+some+sort+of+an+amendment+to+the+Constitution+or+the+like.+MR.+ROBISON%3A+I+want+you+to+point+out+what+section+of+this+bill+in+your+opinion+would+give+the+Federal+Government+control+or+direction+of+any+public+school+or%2C+for+that+matter%2C+any+private+school+in+any+State+or+community.+DR.+MACHEN%3A+This+provision+at+the+beginning+of+it-that+there+is+established+at+the+seat+of+Government+an+executive+department+to+be+known+as+the+department+of+education.+That+I+think%2C+establishes+an+extent+of+Federal+activity+in+principle+which+will+be+deleterious%2C+which+will+lead+to+a+great+many+activities+in+the+future.+If+you+have+a+Federal+department+of+education+that+has+a+place+in+the+Cabinet%2C+you+have+a+department+which+is+going+to+extend+constantly+its+activities+and+is+going+to+ask+for+more+and+more+funds.+We+have%2C+of+course%2C+an+illustration+of+this+in+the+extremely+radical+bill+which+is+now+in+Congress+which+would+extend+this+principle+of+Federal+aid+to+the+States+and+which+lays+down+the+conditions+upon+which+that+Federal+aid+is+to+be+received.+That+has+always+been+in+connection+with+this+demand+for+this+establishment+of+a+Federal+department+of+education%2C+and+I+think+it+is+in+organic+connection+with+it.+The+very+establishment+of+a+Federal+department+of+education%2C+I+think%2C+is+dangerous%2C+because+it+will+lead+to+such+measures+as+those+which+have+been+proposed+for+a+great+many+years%2C+which+provide+for+Federal+aid+on+a+large+scale.+MR.+ROBISON%3A+Do+you+believe+that+Congress+has+the+power+to+pass+any+law+that+would+give+the+Federal+Government+control+of+the+public+schools+in+any+State%3F+DR.+MACHEN%3A+I+think+the+powers+of+the+Federal+Government+in+this+respect+under+the+Constitution+may+be+doubtful%3B+but+I+think+that+there+are+indirect+ways+of+establishing+this+unification+which+are+very+effective+and+which+are+very+disastrous.+Now%2C+of+course+there+is+another+specific+portion+of+this+bill+which+provides+for+the+activities+to+which+I+object%3A+%E2%80%9CThe+department+of+education+shall+collect+such+statistics+and+facts+as+shall+show+the+condition+and+progress+of+education+in+the+several+States+and+in+foreign+countries%E2%80%94%E2%80%9D+And+so+forth.+And+then+there+is+assistance+in+devising+methods+of+operation.+In+the+revised+form+of+this+bill%2C+Senate+bill+2841%2C+we+have%2C+as+I+say%2C+the+purpose+of+such+activity+explicitly+stated+SENATOR+COPELAND%3A+Where+is+that%3F+DR.+MACHEN%3A+It+is+section+5+of+Senate+bill+2841%3A+%E2%80%9CThe+department+of+education+shall+%2A+%2A+%2A+with+the+consent+of+the+advisory+board+hereafter+mentioned%2C+attempt+developing+a+more+uniform+and+efficient+system+of+public+common-school+education.%E2%80%9D+I+am+opposed+to+a+more+uniform+system+of+public+common-school+education.+That+is+explicit+in+this+revised+form+of+the+bill%2C+and+I+think+it+is+clearly+implicit+in+the+section+to+which+I+have+referred.+MR.+ROBISON%3A+There+is+nothing+compulsory+there%2C+is+there%3F+DR.+MACHEN%3A+There+is+nothing+compulsory+in+form%2C+but+I+think+there+is+an+establishment+of+uniformity+which+has+already+gone+to+disastrous+lengths+in+this+country%2C+and+the+encouragement+of+which+I+think+is+a+very+unfortunate+thing.+The+proper+way+in+which+suggestions+as+to+educational+standards+should+come+before+the+authorities+of+schools+is+without+the+extraneous+authority+of+the+Federal+Government%2C+which%2C+because+of+the+tendency+which+has+been+operative+in+recent+years%2C+is+far+more+than+merely+advisory%3B+it+contains+all+the+time+an+implied+threat%2C+you+see%2C+and+for+that+reason+is+very+unfortunate.+SENATOR+FERRIS%3A+I+should+like+to+ask+one+question.+SENATOR+PHIPPS%3A+Certainly%2C+Senator.+SENATOR+FERRIS%3A+For+my+own+information+I+wish+to+ask+what+you+regard+as+the+basic+element+or+elements+in+moral+conduct.+Perhaps+that+is+a+foolish+question.+DR.+MACHEN%3A+The+basic+elements+in+moral+conduct%3F+SENATOR+FERRIS%3A+Yes%2C+sir.+What+is+the+basis.+I+judge+from+your+remarks+that+experience+received+minor+consideration.+DR.+MACHEN%3A+Yes%2C+sir%E2%80%94Well%2C+I+am+an+adherent+of+a+certain+religious+group.+We+have+our+definite+notion+as+to+the+basis+of+morality%2C+and+it+is+in+my+belief+altogether+a+religious+one.+I+intend+to+proclaim+that+basis+of+morality+is+the+will+of+God+as+revealed+by+God%2C+and+I+am+interested+in+the+right+of+all+others+to+maintain+that+as+the+only+basis+of+morality.+I+belong+to+what+is+often+called+a+very+strict+sect%2C+the+Presbyterian+Church%2C+but+it+is+a+sect+which+has+always+been+devoted+to+the+principles+of+liberty%3B+and+I+am+unlike+a+great+many+of+my+fellow+citizens%E2%80%94tolerance+to+me+means+not+only+tolerance+for+that+with+whichI+am+agreed%2C+but+it+means+also+tolerance+for+that+to+which+I+am+most+violently+opposed.+I+was+thoroughly+opposed%2C+for+example%2C+to+the+Lusk+laws+in+the+State+of+New+York+which+were+intended+to+bring+about+the+closing+of+the+Rand+School+in+the+city+of+New+York.+I+cannot+imagine+anything+more+harmful+than+the+Rand+School%3B+there+is+nothing+to+which+I+am+more+opposed%2C+which+I+think+more+subversive+of+morality%3B+and+yet+I+was+absolutely+opposed+to+any+such+law+as+that.+I+believe+in+liberty%2C+and%2C+therefore%2C+when+I+believe+I+have+a+right+to+proclaim+the+basis+of+morality+which+I+think+is+only+in+the+will+of+God%2C+I+also+claim+the+right+for+other+persons+to+proclaim+whatever+else+they+may+hold+with+regard+to+it.+But+to+proclaim+in+our+public+schools+that+morality+is+only+the+result+of+human+experimentation%E2%80%94%E2%80%9Dthis+is+the+conduct+which+Uncle+Sam+has+found+in+the+course+of+American+history+to+be+right%E2%80%9D%E2%80%94that%2C+I+think%2C+is+subversive+of+morality%3B+and+I+do+not+believe+that+anyone+can+encourage+moral+conduct+in+others+unless+he+has+first+in+his+own+mind+the+notion+of+an+absolute+distinction+and+not+a+merely+relative+distinction+between+right+and+wrong.+I+do+not+know+whether+that+at+all+answers+your+question.+SENATOR+FERRIS%3A+I+am+just+wondering+whether+there+is+any+such+thing+as+moral+conduct+in+the+United+States+Congress+or+among+the+citizens+of+the+United+States+apart+from+a+distinctively+religious+basis.+I+am+just+wondering+whether+the+public+schools+have+any+function+in+the+way+of+teaching+morality+which+is+not+distinctively+religious+in+its+basic+idea.+DR.+MACHEN%3A+I+think+that+the+solution+lies+not+in+a+theoretic+teaching+in+the+public+schools+as+to+the+basis+of+morality%2C+because+I+do+not+think+you+can+keep+that+free+from+religious+questions%3B+but+I+do+hold+that+a+teacher+who+himself+or+herself+is+imbued+with+the+absolute+distinction+between+right+and+wrong+can+maintain+the+moral+standing%2C+the+moral+temper+of+a+public+school.+SENATOR+FERRIS%3A+Is+the+ethical+culturist+ruled+out+from+the+consideration+of+morality+in+his+views+and+conduct%3F+DR.+MACHEN%3A+I+am+not+ruling+out+anybody+at+all%2C+sir%E2%80%94the+ethical+culturist+or+anyone+else.+SENATOR+FERRIS%3A+No%3B+but+if+religion+is+the+basic+element+in+all+morality%2C+then+can+we+have+a+morality+that+is+not+founded+on+a+religious+idea%3F+DR.+MACHEN%3A+I+myself+do+not+believe+that+you+can+have+such+a+morality+permanently%2C+and+that+is+exactly+what+I+am+interested+in+trying+to+get+other+people+to+believe%3B+but+I+am+not+at+all+interested+in+trying+to+proclaim+that+view+of+mine+by+any+measures+that+involve+compulsion%2C+and+I+am+not+interested+in+making+the+public+school+an+agency+for+the+proclamation+of+such+a+view%3B+but+I+am+interested+in+diminishing+rather+than+increasing+the+function+of+the+public+school%2C+in+order+to+leave+room+for+the+opportunity+of+a+propagation+of+the+view+that+I+hold+in+free+conflict+with+all+other+views+which+may+be+held%2C+in+order+that+in+that+way+the+truth+finally+may+prevail.+SENATOR+PHIPPS%3A+Thank+you%2C+Doctor.+%5BApplause.%5D%E2%80%9D%0A%0A%E2%80%94+J.+Gresham+Machen%2C+Testimony+before+the+Senate+Committee+on+Education+and+Labor%2C+and+the+House+Committee+on+Education%2C+February+25%2C+1926%2C+Congress+of+the+United+States%2C+Washington+D.C.+%5BSource%3A+Reformed.Org%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb81055cce0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b81055cce0.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/02/machens-senate-testimony-against-the-proposed-department-of-education-1926/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Therefore it is not wholly without reason that some have raised the question: “which is more to be feared or desired: an evil ruler with good counsel, or a good ruler with evil counsel?” For if the counsel of the ruler is evil and full of flatterers, ambitious, avaricious, thieves, debauchers, and tyrants (which is fairly standard for courts), the ruler will not govern, but those to whom the ruler and his name serve as a mask shall govern in his name. They shall establish their reign and tyranny by using the ruler as a decoy serves the huntsman in their chase, and as idols serve the priests in order to emphasize themselves, and bring themselves greater advantages by their use. And in this way the tyranny which is to be feared in a monarchy will be converted into what generally occurs in an aristocracy when it is perverted and altered into this tyrannical state which the Greeks call oligarchy—that is, the principality of a small number who reign tyrannical and not by true justice, instead of a great number and many people. … and among other dangers, there are customarily two great evils which bring great miseries and which often ruin nations. The first is the elections of the magistrates. The second is the judgment and executions of the things ordained by the laws. For where in elections devolve upon the community, it is very difficult to have governors and magistrates such as are required; and this happens chiefly for two reasons. The first is a desire which every man has of living in his own carnal liberty and fleshly pleasure without being subject to any laws. This desire is the reason why those to whom the elections belong prefer to have governors and magistrates elected according to their mold and devoted to them, under whom they can live in greater licentiousness, without rebuke or correction, than to have someone who fears God and who shall take them in hand and punish the wrongdoers according to every man’s deeds. The other reason is ambition and greed, which are the reasons why many take the offices of the country by intrigue, either for themselves or for their friends and consorts, And for those by whom they have been corrupted. And this is done not out of a desire to maintain God’s owner or the public good or to administer true justice, but is done merely for the honor and earthly profit of those who hoped to receive it and to rain above the others. …One further evil still remains, which is the negligence of judgments and the scorn of good laws and ordinances made for the preservation of the public good. For it often happens that the great alliances and relations which exist in the community prevent the right course of justice, and that the criminals are not brought to justice and punished according to the laws according to their wrongdoing, but to the contrary they are tolerated. The chief cause of this proceeds from the fear of the disfavor that those who govern might acquire of such allies who are joined to them if justice were administered as it ought to be, according to the commandments of God, whose Law so often and so expressly forbids having any respect of persons, and commands that just judgment be meted out. Furthermore, it almost always ordinarily happens that within these popular states certain flatterers (who know how to win the good favor of all) are very popular, and easily obtained all they desire. Four, seeing that the people are devoted to them, they easily condescend and consent to what pleases them. Seeing that there are so many drawbacks to all types of civil government, it is not possible that man could ever have justice and live with each other in a lasting peace and remain united unless they possess an authority and a lord who is greater and more excellent in power, wisdom, and goodness than all others combined. God, the Creator of all, shows us this very clearly both in the order which He has established among men and beasts, as well as in the various natures that he has placed within man by joining together the soul and body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How Should Man Be Governed?” in The Christian and the Magistrate: Roles, Responsibilities, and Jurisdictions</cite>, trans. R. A. Sheats (Monticello, FL: Psalm 78 Ministries, 2015), 14–17.</span></figcaption>

<blockquote><p>For there are some who deny that a commonwealth is daily framed which, neglecting the political system of Moses, is ruled by the common laws of nations. Let other men consider our perilous and seditious this notion is.; it will be enough for me to have proved it false and foolish. We must bear in mind that common division of the whole law of God, administered by Moses, into moral, ceremonial, and judicial laws. And we must consider each of these parts, that we may understand what there is in them that pertains to us, and what does not. In the meantime, let no one be concerned over the small point that ceremonial and judicial laws also pertain to morals. For the ancient writers who taught this division, although they were not ignorant that these two latter parts had some bearing upon morals, still, because these could be changed or abrogated while morals remained untouched, did not call the, moral laws. They applied this name especially to the first part, without which the true holiness of morals cannot stand. The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshipped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come…in order that he might fully manifest his wisdom to the nations, and show the truth of these things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted definite formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety (inasmuch as they kept the church of the Jews in service and reverence to God) and yet could be distinguished from piety itself. In like manner, the form of their judicial laws (although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law) had something distinct from the precept of love.</p></blockquote>

<blockquote><p>On the sixteenth day of January, 1546, the Regent and cardinal arrived after night-fall at Elphingston Tower, in the neighbourhood of Ormiston, with five hundred men, and despatched the Earl of Bothwell to apprehend Wishart, holding themselves in readiness, if need were, to support him by force. As soon as the Reformer became aware of his errand, he cried out to Cockburn and his other friends, “Open the gates), the blessed will of my God be done.” The earl being admitted with some other gentlemen who accompanied him, Wishart addressed him thus: “I praise my God that so honourable a man as you, my lord, receives me this night in the presence of these noblemen, for now I am assured, that for your honour’s sake, you will suffer nothing to be done unto me contrary to the order of law. I am not ignorant that their law is nothing but corruption, and a cloak to shed the blood of the saints; but yet I less fear to die openly, than secretly to be murdered.” …On the morning of the 28th day of February, 1546, the Tribunal of Heresy was constituted with great pomp and solemnity in the cathedral; and George Wishart was brought from the Sea-tower by the Captain of the Castle at the head of a hundred men, armed with jacks, spears, and axes. As he entered the church, he threw his purse to a poor man lying at the door, who asked alms. John Wynram, sub-prior of the Abbey and dean of the Cathedral, opened the proceedings with a sermon, which formed a singular prelude to what followed. He took for his text the parable of the sower, and explained it in a way which must have been much more satisfactory to the Reformer at the bar, than to the prelates and doctors on the tribunal. The good seed, he said, was the Word of God, and the evil seed was heresy. But what was heresy? “Heresy,” said Wynram, “is a false opinion, defended with pertinacity, clearly repugnant to the Word of God;” a definition which entirely ignored the dogmas of the church. Passing to the cause of heresy within that realm, and all other realms, he declared it to be the ignorance of those who had the care of men’s souls; “to whom,” said he, “it necessarily belongeth to have the true understanding of the Word of God, that they may be able to win again the false teachers of heresies with the sword of the spirit, which is the Word of God; and not only to win again, but also to overcome, as saith Paul, ‘a bishop must be faultless, as becometh the minister of God, and such as cleaveth unto the true word of doctrine, that he may be able to exhort with wholesome learning, and to reprove that which they say against him.’ ” If Sir David Lindsay had been in the pulpit, he could not have spoken more plainly what the bishops needed to hear. Once more demanded the preacher, how heresies should be known? and “heresies,” quoth he, “may be known in this manner: As the goldsmith knoweth the fine gold from the imperfect by the touchstone, so likewise may we know heresy by the undoubted touchstone; that is, the true, sincere, and undefiled Word of God.” …His Articles were eighteen in number, and turned chiefly upon the doctrine which he was alleged to have taught respecting the seven sacraments of the Church of Rome. The third article was this, “Thou, false heretic, preachest against the sacraments, saying that there are not seven sacraments;” to which Wishart replied, “My lords, if it be your pleasure, I taught never of the number of the sacraments, whether they were seven or eleven. So many as are instituted by Christ, and are shown to us by the Evangel, I profess openly. Except it be the Word of God I dare affirm nothing.” The fourth ran thus, “Thou, false heretic, hast openly taught that auricular confession is not a blessed sacrament, and thou sayest that we should only confess us to God, and to no priest.” He answered, “My lords, I say that auricular confession, seeing that it hath no promise of the Evangel, cannot therefore be a sacrament. Of the confession to be made to God there are many testimonies in Scripture, as when David saith, ‘I thought that I would acknowledge my iniquity unto the Lord, and He forgave the trespasses of my sins.’ Here confession signifieth the secret acknowledgment of our sins before God. When I exhorted the people on this manner, I reproved no manner of confession. And farther St. James saith, ‘Confess your sins one to another.’ Here the apostle meaneth nothing of auricular confession, but that we should acknowledge and confess ourselves to be sinners before our brethren and before the world, and not to esteem ourselves as the Grey Friars do, thinking themselves already purged.” When he had said these words, the horned bishops and their accomplices cried out, and grinned with their teeth, saying, “See ye not what colours he hath in his speech, that he may beguile us and seduce us to his opinion.” When accused of having preached plainly that there is no purgatory, his reply was equally explicit and characteristic. “My lords, as I have oftentimes said heretofore, without express witness and testimony of Scripture I dare affirm nothing; I have oft and divers times read over the Bible, and yet such a term found I never, nor yet any place of Scripture applicable thereunto; therefore, I was ashamed ever to teach of that thing which I could not find in Scripture.” Then said he to Lauder, his accuser, “If you have any testimony of the Scripture by the which ye may prove any such place, show it now before this auditory.” But Lauder was dumb. At last the bishops grew impatient of his “witty and godly answers.” John Scot, a Grey Friar and a notorious deceiver of the people, who was standing behind Lauder, “hasted him to read the rest of the articles, and not to tarry upon his answers.” “For we may not abide them,” quoth he, “no more than the devil may abide the sign of the cross.” …Immediately after, his room was entered by two executioners; one brought him a coat of linen dyed black, and put it upon him; the other carried some bags full of powder, which he tied to several parts of his body. Thus arrayed for the fire, they brought him forth to an outer room, near the gate of the castle. Meanwhile, the artillery of the block houses was charged and pointed in the direction of the scaffold, and cushions and green-cloths were spread upon the wall-heads, for the cardinal and bishops to sit upon. “When all things were made ready,” says Spottiswoode, “he was led forth, with his hands tied behind his back, and a number of soldiers guarding him, to the place of execution. As he was going forth at the castle-gate, some poor creatures who were lying there, did ask of him some alms for God’s sake, to whom he said, ‘I have not the use of any hands wherewith I should give you alms, but our merciful God, who out of his abundance feedeth all men, vouchsafe to give you the things which are necessary both for your bodies and for your souls.’ ” When he ascended the scaffold, he fell upon his knees, and thrice he said these words, “O thou Saviour of the world, have mercy upon me. Father of heaven, I commend my spirit into thy holy hands.” Then he turned to the people and said these words, “I beseech you, Christian brethren and sisters, that ye be not offended at the word of God, for the affliction and torments which ye see prepared for me, but I exhort you that ye love the word of God your salvation, and suffer patiently and with a comfortable heart, for the Word’s sake. Moreover, I pray you, show my brethren and sisters which have heard me oft before, that they cease not to learn the word of God, which I taught unto them, for no persecutions nor troubles in this world which lasteth not. For the Word’s sake, and the true Evangel which was given to me by the grace of God, I suffer this day not sorrowfully, but with a glad heart and mind. Consider and behold my visage; ye shall not see me change my colour. This grim fire I fear not. I know surely that my soul shall sup with my Saviour this night, for whom I suffer this.” Then he prayed for his accusers, saying, “I beseech the Father of heaven to forgive them that have, of any ignorance, or else of any evil mind, forged lies upon me. I forgive them with all my heart. I beseech Christ to forgive them that have this day ignorantly condemned me to death.” And last of all he said to the people on this manner, “I beseech you, brethren and sisters, to exhort your prelates to the learning of the word of God, that they may be ashamed to do evil, and learn to do good; and if they will not convert themselves from their wicked error, there shall hastily come upon them the wrath of God, which they shall not eschew.” After these words, the martyr gave himself into the hands of the executioner. “Sir, I pray you forgive me,” cried the tormentor, “for I am not guilty of your death;” to whom he answered, kissing his cheek, “Lo! here is a token that I forgive thee; my heart, do thine office.” He carried a chain of iron at his middle, by which he was fastened to a gibbet which rose in the centre of the scaffold. Fire was then put to the pile; the powder-bags exploded, and enveloped him in fierce flames; a cord, which had been placed round his neck, was pulled tightly till he was suffocated, and the body of the lifeless martyr was speedily reduced to ashes. “When the people beheld his great tormenting, they might not withhold from piteous mourning, and complaining of the innocent lamb’s slaughter.” The cardinal and the bishops, unforgiving even in death, caused a proclamation the same night to be made throughout the city, that none should pray for the soul of the heretic, under pain of the heaviest censures of the church.</p></blockquote>

ver+to+teach+of+that+thing+which+I+could+not+find+in+Scripture.%E2%80%9D+Then+said+he+to+Lauder%2C+his+accuser%2C+%E2%80%9CIf+you+have+any+testimony+of+the+Scripture+by+the+which+ye+may+prove+any+such+place%2C+show+it+now+before+this+auditory.%E2%80%9D+But+Lauder+was+dumb.+At+last+the+bishops+grew+impatient+of+his+%E2%80%9Cwitty+and+godly+answers.%E2%80%9D+John+Scot%2C+a+Grey+Friar+and+a+notorious+deceiver+of+the+people%2C+who+was+standing+behind+Lauder%2C+%E2%80%9Chasted+him+to+read+the+rest+of+the+articles%2C+and+not+to+tarry+upon+his+answers.%E2%80%9D+%E2%80%9CFor+we+may+not+abide+them%2C%E2%80%9D+quoth+he%2C+%E2%80%9Cno+more+than+the+devil+may+abide+the+sign+of+the+cross.%E2%80%9D+%E2%80%A6Immediately+after%2C+his+room+was+entered+by+two+executioners%3B+one+brought+him+a+coat+of+linen+dyed+black%2C+and+put+it+upon+him%3B+the+other+carried+some+bags+full+of+powder%2C+which+he+tied+to+several+parts+of+his+body.+Thus+arrayed+for+the+fire%2C+they+brought+him+forth+to+an+outer+room%2C+near+the+gate+of+the+castle.+Meanwhile%2C+the+artillery+of+the+block+houses+was+charged+and+pointed+in+the+direction+of+the+scaffold%2C+and+cushions+and+green-cloths+were+spread+upon+the+wall-heads%2C+for+the+cardinal+and+bishops+to+sit+upon.+%E2%80%9CWhen+all+things+were+made+ready%2C%E2%80%9D+says+Spottiswoode%2C+%E2%80%9Che+was+led+forth%2C+with+his+hands+tied+behind+his+back%2C+and+a+number+of+soldiers+guarding+him%2C+to+the+place+of+execution.+As+he+was+going+forth+at+the+castle-gate%2C+some+poor+creatures+who+were+lying+there%2C+did+ask+of+him+some+alms+for+God%E2%80%99s+sake%2C+to+whom+he+said%2C+%E2%80%98I+have+not+the+use+of+any+hands+wherewith+I+should+give+you+alms%2C+but+our+merciful+God%2C+who+out+of+his+abundance+feedeth+all+men%2C+vouchsafe+to+give+you+the+things+which+are+necessary+both+for+your+bodies+and+for+your+souls.%E2%80%99+%E2%80%9D+When+he+ascended+the+scaffold%2C+he+fell+upon+his+knees%2C+and+thrice+he+said+these+words%2C+%E2%80%9CO+thou+Saviour+of+the+world%2C+have+mercy+upon+me.+Father+of+heaven%2C+I+commend+my+spirit+into+thy+holy+hands.%E2%80%9D+Then+he+turned+to+the+people+and+said+these+words%2C+%E2%80%9CI+beseech+you%2C+Christian+brethren+and+sisters%2C+that+ye+be+not+offended+at+the+word+of+God%2C+for+the+affliction+and+torments+which+ye+see+prepared+for+me%2C+but+I+exhort+you+that+ye+love+the+word+of+God+your+salvation%2C+and+suffer+patiently+and+with+a+comfortable+heart%2C+for+the+Word%E2%80%99s+sake.+Moreover%2C+I+pray+you%2C+show+my+brethren+and+sisters+which+have+heard+me+oft+before%2C+that+they+cease+not+to+learn+the+word+of+God%2C+which+I+taught+unto+them%2C+for+no+persecutions+nor+troubles+in+this+world+which+lasteth+not.+For+the+Word%E2%80%99s+sake%2C+and+the+true+Evangel+which+was+given+to+me+by+the+grace+of+God%2C+I+suffer+this+day+not+sorrowfully%2C+but+with+a+glad+heart+and+mind.+Consider+and+behold+my+visage%3B+ye+shall+not+see+me+change+my+colour.+This+grim+fire+I+fear+not.+I+know+surely+that+my+soul+shall+sup+with+my+Saviour+this+night%2C+for+whom+I+suffer+this.%E2%80%9D+Then+he+prayed+for+his+accusers%2C+saying%2C+%E2%80%9CI+beseech+the+Father+of+heaven+to+forgive+them+that+have%2C+of+any+ignorance%2C+or+else+of+any+evil+mind%2C+forged+lies+upon+me.+I+forgive+them+with+all+my+heart.+I+beseech+Christ+to+forgive+them+that+have+this+day+ignorantly+condemned+me+to+death.%E2%80%9D+And+last+of+all+he+said+to+the+people+on+this+manner%2C+%E2%80%9CI+beseech+you%2C+brethren+and+sisters%2C+to+exhort+your+prelates+to+the+learning+of+the+word+of+God%2C+that+they+may+be+ashamed+to+do+evil%2C+and+learn+to+do+good%3B+and+if+they+will+not+convert+themselves+from+their+wicked+error%2C+there+shall+hastily+come+upon+them+the+wrath+of+God%2C+which+they+shall+not+eschew.%E2%80%9D+After+these+words%2C+the+martyr+gave+himself+into+the+hands+of+the+executioner.+%E2%80%9CSir%2C+I+pray+you+forgive+me%2C%E2%80%9D+cried+the+tormentor%2C+%E2%80%9Cfor+I+am+not+guilty+of+your+death%3B%E2%80%9D+to+whom+he+answered%2C+kissing+his+cheek%2C+%E2%80%9CLo%21+here+is+a+token+that+I+forgive+thee%3B+my+heart%2C+do+thine+office.%E2%80%9D+He+carried+a+chain+of+iron+at+his+middle%2C+by+which+he+was+fastened+to+a+gibbet+which+rose+in+the+centre+of+the+scaffold.+Fire+was+then+put+to+the+pile%3B+the+powder-bags+exploded%2C+and+enveloped+him+in+fierce+flames%3B+a+cord%2C+which+had+been+placed+round+his+neck%2C+was+pulled+tightly+till+he+was+suffocated%2C+and+the+body+of+the+lifeless+martyr+was+speedily+reduced+to+ashes.+%E2%80%9CWhen+the+people+beheld+his+great+tormenting%2C+they+might+not+withhold+from+piteous+mourning%2C+and+complaining+of+the+innocent+lamb%E2%80%99s+slaughter.%E2%80%9D+The+cardinal+and+the+bishops%2C+unforgiving+even+in+death%2C+caused+a+proclamation+the+same+night+to+be+made+throughout+the+city%2C+that+none+should+pray+for+the+soul+of+the+heretic%2C+under+pain+of+the+heaviest+censures+of+the+church.%E2%80%9D%0A%0A%E2%80%94+Peter+Lorimer%2C+The+Scottish+Reformation%3A+A+Historical+Sketch%2C+%28London%3B+Glasgow%3A+Richard+Griffin+and+Company%2C+1860%29%2C+143%2C+145%E2%80%93146%2C+148%E2%80%93149%2C+151%E2%80%93153.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed070a2955.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed070a2955.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/03/the-martyrdom-of-george-wishart-1-march-1546/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>And there were several kinds of laws given them, of which there are principally three mentioned by divines. The moral, or the decalogue, the ceremonial, and the political, or forensic. The people of Israel may doubtless be considered three ways. 1st, As rational creatures, depending upon God, as the supreme reason or cause both in a moral and natural sense. And thus the law of the decalogue was given them; which, as to its substance, is one and the same with the law of nature, and binds men as such.</p></blockquote>

<blockquote><p>If the original law required perfect obedience, could it be abrogated, or even relaxed, otherwise than by God’s authority? If it was not abrogated, but republished, at Sinai, was it relaxed by Christ, when He repeated it, saying, ‘Thou shalt love the Lord thy God with all thine heart, and thou shalt love thy neighbour as thyself,—for on these two commandments hang all the law and the prophets,’ or when He expounded its spiritual meaning in His sermon on the mount? Did He come to abrogate, or relax, that eternal rule of righteousness, of which He said,—‘I am not come to destroy the law and the prophets, but to fulfil,’—‘Heaven and earth shall pass away, but one jot or one tittle shall in no wise pass from the law till all be fulfilled?’ Or did His Apostles exceed their commission when they said, ‘Do we then make void the law through faith? God forbid! yea, we establish the law?’</p></blockquote>

<blockquote><p>Since, therefore, the name of Father is a sacred one, and is transferred to men by the peculiar goodness of God, the dishonoring of parents redounds to the dishonor of God Himself, nor can any one despise his father without being guilty of an offense against God, (sacrilegium.) If any should object that there are many ungodly and wicked fathers whom their children cannot regard with honor without destroying the distinction between good and evil, the reply is easy, that the perpetual law of nature is not subverted by the sins of men; and therefore, however unworthy of honor a father may be, that he still retains, inasmuch as he is a father, his right over his children, provided it does not in anywise derogate from the judgment of God; for it is too absurd to think of absolving under any pretext the sins which are condemned by His Law; nay, it would be a base profanation to misuse the name of father for the covering of sins. In condemning, therefore, the vices of a father, a truly pious son will subscribe to God’s Law; and still, whatsoever he may be, will acknowledge that he is to be honored, as being the father given him by God. Paul is a faithful interpreter of this Commandment, where he bids “children obey their parents.” (&lt;490601&gt; Ephesians 6:1; &lt;510320&gt; Colossians 3:20.) Honor, therefore, comprises subjection; so that he who shakes off the yoke of his father, and does not allow himself to be governed by his authority, is justly said to despise his father; and it will more clearly appear from other passages, that those who are not obedient to their parents are deemed to despise them. Still, the power of a father is so limited as that God, on whom all relationships depend, should have the rule over fathers as well as children; for parents govern their children only under the supreme authority of God. Paul, therefore, does not simply exhort children to obey their parents, but adds the restriction, “in the Lord;” whereby he indicates that, if a father enjoins anything unrighteous, obedience is freely to be denied him. Immoderate strictness, moroseness, and even cruelty must be born, so long as a mortal man, by wickedly demanding what is not lawful, does not endeavor to rob God of His right. In a word, the Law so subjects children to their parents, as that God’s right may remain uninfringed. …The natural sense itself dictates to us that we should obey rulers. If servants obey not their masters, the society of the human race is subverted altogether. It is not, therefore, the least essential part of righteousness that the people should willingly submit themselves to the command of magistrates, and that servants should obey their masters; and, consequently, it would be very absurd if it were omitted in the Law of God. In this commandment, then, as in the others, God by synecdoche embraces, under a specific rule, a general principle, viz., that lawful commands should obtain due reverence from us. But that all things should not be distinctly expressed, first of all brevity itself readily accounts for; and, besides, another reason is to be noticed, i.e. that God designedly used a homely style in addressing a rude people, because He saw its expediency. If He had said generally, that all superiors were to be obeyed, since, pride is natural to all, it would not have been easy to incline the greater part of men to pay submission to a few. Nay, since subjection is naturally disagreeable, many would have kicked against it. God, therefore, propounds a specific kind of subjection, which it would have been gross barbarism to refuse, that thus, their ferocity being gradually subdued, He might accustom men to bear the yoke. Hence the exhortations are derived, that people should “honor the king;” that “every soul should be subject unto the higher powers;” that “servants should obey their masters, even the froward and morose.” (Proverbs 24:21; 1 Peter 2:13; Romans 13:1; Ephesians 6:5; 1 Peter 2:14, 18.) …It is a signal exaltation of magistrates, that God should not only count them in the place of parents, but present them to us dignified by His own name; whence also it clearly appears that they are not to be obeyed only from fear of punishment, “but also for conscience sake,” (Romans 13:5) and to be reverently honored, lest God should be despised in them. If any should object, that it would be wrong to praise the vices of those whom we perceive to abuse their power; the answer is easy, that although judges are to be borne with even if they be not the best, f13 still that the honor with which they are invested, is not a covering for vice. Nor does God command us to applaud their faults, but that the people should rather deplore them in silent sorrow, than raise disturbances in a licentious and seditious spirit, and so subvert political government.</p></blockquote>

<blockquote><p>See only that you pay heed to God’s Word and remain it, like a child in the cradle. If you let go of it for a moment, then you fall out of it. This is the devil’s sole aim, to tear people out of it and to cause them to measure God’s will and work by human reason.</p></blockquote>

<blockquote><p>Sir, we will always humbly reverence your majesty in public; but since we have this occasion to be with your majesty in private, and since you are brought in extreme danger both of your life and crown, and along with you the country and the church of God or like to go to wreck, for not telling you the truth and giving you faithful counsel, we must discharge our duty, or else be traitors both to Christ and you. Therefore, Sir, as diverse times before I have told you so now again I must tell you, there are two kings and two kingdoms in Scotland: there is King James the head of this commonwealth, and there is Christ Jesus the King of the church, whose subject James the sixth is, and of whose kingdom he is not a king, nor a lord, nor a head, but a member. Sir, those whom Christ has called and commanded to watch over his church, have power and authority from him to govern his spiritual kingdom both jointly and severally; the which no Christian king or prince should control and discharge, but fortify and assist; otherwise they are not faithful subjects of Christ and members of his church. We will yield to you your place, and give you all due obedience; but again I say, you are not the head of the church: you cannot give us that eternal life which we seek for even in this world, you cannot deprive us of it.</p></blockquote>

<blockquote><p>The Christian school is to be favored for two reasons. In the first place, it is important for American liberty; in the second place, it is important for the propagation of the Christian religion. These two reasons are not equally important; indeed, the latter includes the former as it includes every other legitimate human interest. But I want to speak of these two reasons in turn. In the first place, then, the Christian school is important for the maintenance of American liberty. We are witnessing in our day a world-wide attack upon the fundamental principles of civil and religious freedom. In some countries, such as Italy, the attack has been blatant and unashamed; Mussolini despises democracy and does not mind saying so. A similar despotism now prevails in Germany; and in Russia freedom is being crushed out by what is perhaps the most complete and systematic tyranny that the world has every seen. …Another line of attack upon liberty has appeared in the advocacy of a Federal department of education. Repeatedly this vicious proposal has been introduced in Congress. It has been consistently favored by that powerful organization, the National Education Association. Now without being familiar with the internal workings of that Association I venture to doubt whether its unfortunate political activities really represent in any adequate way the rank and file of its members or the rank and file of the public-school teachers of this country. When I appeared at a joint hearing before the Senate Committee on Education and Labor and the House Committee on Education in 1926, Mr. Lowrey of the House Committee asked me how it was that the resolution favoring the Federal department of education was passed unanimously by the National Education Association although he had discovered that many members of that Association were saying that they were opposed to it. Neither Mr. Lowrey nor I seemed to be able to give any very good explanation of this fact. At any rate, I desire to pay the warmest possible tribute to many thousands of conscientious men and women who are teachers in the public schools in this country. I do not believe that in the entire government aspect of education these teachers have any really effective representation. …Thoughtful people, even many who are not Christians, have become impressed with the shortcomings of our secularized schools. We have provided technical education, which may make the youth of our country better able to make use of the advances of natural science; but natural science, with its command over the physical world, is not all that there is in human life. There are also the moral interests of mankind; and without cultivation of these moral interests a technically trained man is only given more power to do harm. By this purely secular, non-moral and non-religious, training we produce not a real human being but a horrible Frankenstein, and we are beginning to shrink back from the product of our own hands. The educational experts, in their conduct of their state-controlled schools, are trying to repair this defect and in doing so are seeking the cooperation of Christian people. I want to show you — and I do not think I shall have much difficulty in showing this particular audience — why such cooperation cannot be given. …So I am opposed to the reading of the Bible in public schools. As for any presentation of general principles of what is called “religion,” supposed to be exemplified in various positive religions, including Christianity, it is quite unnecessary for me to say in this company that such presentation is opposed to the Christian religion at its very heart. The relation between the Christian way of salvation and other ways is not a relation between the adequate and the inadequate or between the perfect and the imperfect, but it is a relation between the true and the false. The minute a professing Christian admits that he can find neutral ground with non-Christians in the study of “religion” in general, he has given up the battle, and has really, if he knows what he is doing, made common cause with that syncretism which is today, as it was in the first century of our era, the deadliest enemy of the Christian Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Necessity of the Christian School”</cite>, 1933</span></figcaption>

<blockquote><p>This serves to decry unto us the blind error of many ages before us, wherein it has been thought, and is by Papists at this day, to be a state of perfection, to live as a monk or hermit out of all societies, in some desert place, and there to spend their whole life in contemplation only, and that voluntarily. They magnify this estate so much, that hereby they think to merit eternal life at the hands of God. But these believers did neither voluntarily, nor with opinion of merit, betake themselves to this solitary life, but on necessity. Indeed, this [monastic] kind of life has no warrant in God’s word because every Christian is a member of two Kingdoms; of Christ’s Kingdom of grace and of that particular state where he dwells. By reason of this dual membership, he has has a twofold calling: temporal and spiritual. In both of which he must walk diligently so long as he can doing the duties both of a child of God and of a member of that commonwealth where he lives. Now, when a man goes voluntarily to lead a solitary life, he forsakes his temporal calling altogether and performs the other but negligently because he withdraws himself from many duties of piety, whereby the people might be furthered Godward, which none can do with a good conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses Leading to the Heavenly Canaan or A Commentary Upon Hebrews Chapter 11</cite>, (Cambridge, 1607, 1618), 195.</span></figcaption>

ms-answer-to-monasticism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Christ the King engenders in his elect zeal for reconciling themselves to God: first of all by showing that all men are under sin, and in the kingdom darkness, especially because since all men have the knowledge of God naturally engrafted in them and the work of the law by nature written in their hearts, and by the things created are constrained to know God, but nevertheless do not glorify him, but do sin contrary to the law of nature (Rom. 1) The thing which they witness in their deeds, and their own conscience convinces their thoughts, either accusing or excusing them. Again by encountering all and every of their wickednesses, and in accusing them by the law written, and by the threatenings which are manifest everywhere throughout the whole prophets, many wickednesses also being heaped together as plainly may be seen in the Epistle to the Romans Chapter 3 v. 9-14. And also by showing that this is the unchangeable will of God, whereby he will not only that all men be conformed to the law of nature, but also to the law written, otherwise that he will so long account them for sinners and enemies till they be converted, and through faith be reconciled unto God.</p></blockquote>

</figure><figure class="quote" id="q-4626195077" data-kw="">
<blockquote><p>Therefore, in order that none of us may stumble on that stone, let us first consider that there is a twofold government in man (duplex esse in homine regimen): one aspect is spiritual, whereby the conscience is instructed in piety and in reverencing God; the second is political, whereby man is educated for the duties of humanity and citizenship that must be maintained among men. These are usually called the “spiritual” and the “temporal” jurisdiction (not improper terms) by which is meant that the former sort of government pertains to the life of the soul, while the latter has to do with the concerns of the present life—not only with food and clothing but with laying down laws whereby a man may live his life among other men holily, honorably, and temperately. For the former resides in the inner mind, while the latter regulates only outward behavior. The one we may call the spiritual kingdom, the other, the political kingdom. Now these two, as we have divided them, must always be examined separately; and while one is being considered, we must call away and turn aside the mind from thinking about the other. There are in man, so to speak, two worlds, over which different kings and different laws have authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559 edition), 3.19.15 (Battles edition).</span></figcaption>

</figure><figure class="quote" id="q-232ce6a01f" data-kw="">
<blockquote><p>If men strive, and hurt a woman. This passage at first sight is ambiguous, for if the word death only applies to the pregnant woman, it would not have been a capital crime to put an end to the foetus, which would be a great absurdity; for the fœtus, though enclosed in the womb of its mother, is already a human being, (homo) and it is almost a monstrous crime to rob it of the life which it has not yet begun to enjoy. If it seems more horrible to kill a man in his own house than in a field, because a man’s house is his place of most secure refuge, it ought surely to be deemed more atrocious to destroy a foetus in the womb before it has come to light. On these grounds I am led to conclude, without hesitation, that the words, “if death should follow,” must be applied to the foetus as well as to the mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, on Exodus 21:22</span></figcaption>

<figure class="quote" id="q-69fe63c79b" data-kw="">
<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>

</figure><figure class="quote" id="q-87ad15d57f" data-kw="">
<blockquote><p>I do highly approve the distinction following of things commanded, and things permitted on the Lord’s Day, and the explication of each member; the object of the one, all actions advancing God’s service; the object of the other, such things as are no hindrance thereunto; As in the first place works of necessity; then works of charity; yet the permitting of these, is rightly to be understood; not so as if the works of necessity here mentioned, were in such sort permitted as left to a man’s liberty, whether he will perform them or no. For undoubtedly we are bound as much as lies in our power, to quench a dangerous fire kindled in a town, on the Sabbath day, it being a work of mercy, necessarily required. For if to return a pledge ere the poor pawner of it went to his bed, in case it were his covering, were a work of mercy, how much more to save a man’s house from burning, how much more to save a whole town from being consumed, whereby many might be driven to lie without doors, void of all comfort to the body? So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>

</figure><figure class="quote" id="q-a27b0f61c7" data-kw="">
<blockquote><p>1. That we are to spend the whole time in public and private exercises of God’s worship.

2. Except so much as it be taken up in the works of necessity and mercy. The former directs us to that which is the main work of the Day, the latter to that which is subordinate and occasional. …we are therefore to keep it [the Day] holy, as we are enjoined in the body of the [4th] Command, which we observed, includes in it something positive. 2. The duties of worship to be attended by us on this Day, are either Natural or Instituted…

1. The duties of natural worship, are such as are suited to the nature of man, and flow from the great End he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the End and usefulness of it…

2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment. In the days of the Law there were sacrifices appointed to be offered on these days… But all these are not out of doors under the Gospel, being to give place to a more spiritual worship, which is adapted thereunto. Nevertheless, there are appointments under the Gospel, which are positive, and these are either the way and manner, in which the duties of natural worship are to be attended, in the public assemblies, and the ministration of the Word, and preaching of it, which is also required on the Sabbath; or the dispensation of the sacraments of the Gospel, which we have before taken notice of, as belonging to the Sabbath. …

4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: Nevertheless because this is the principal and direct business of the Day, it is to have a very great regard had to it in all that we do. And here I shall only offer a few general rules: …

2. It is not necessary that all the duties of worship be solemnly attended on every Sabbath. Though there are none that belong to, and are proper for that day, yet there is no obligation lying upon us to go through them all every time the Sabbath recurs; but there is a prudence to be used by the people of God on this account, though still there are some which should be more constantly attended, and others more intermittedly. And here observe, that there are the duties of natural worship, which challenge the first place and more constant attendance, viz. prayer, and the dispensation of the Word of God, and holy meditation: whereas those which are ceremonial may have their particular times to be attended…

3. That the public and private duties of worship, ought so to be ordered, that they may help and not thrust out one the other. The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… the seasons of public worship must be ordered for edification, which naturally requires that all are agreed in it, else there will be no avoiding of confusion. …

5. That whatsoever they do on that Day, ought to be with a suitable regard to the holiness of the time… (2.) There is an exception made of so much time, as is to be taken up, in works of necessity and mercy: i.e. These may and must interrupt the other duties, so far as they do intervene. And for a right understanding of this, let these things be observed:

1. That the Sabbath was appointed for man’s good, and not for his harm. This is a general rule, but may be particularly accommodated with due caution. Our Savior makes use of it, in reflecting upon the unjust censures of the Pharisees cast upon his disciples, for gathering and eating ears of corn on the Sabbath Day, Mk. 2:27, “And He said unto them, The Sabbath was made for man, and not man for the Sabbath.” It was indeed to advance man’s spiritual interest, in giving him opportunity to sequester himself for communion with God in the way of mediate worship, but was never intended to hurt any of his interests in this world.

2. That as there are duties of worship to be performed on our days, so there are duties of righteousness to be done on God’s Day. These duties, though they differ in the next object and end, the one belonging to the First, the other to the Second Table, yet they agree on the ultimate object and end, which is God and his glory; for this as well as that is to be done in obedience to Him; and when they are so done sincerely, we have communion with God in them: The one belongs to our duty to man, but it is in order of serving God, and so they do not necessarily thwart one the other… In like manner there are Second Table duties that may or ought to be done on Holy Time; and are either stated duties of the Day, or are occasionally called for by the circumstances: what these are will be presently considered.

3. In the doing of the duties of the Sabbath, we are to employ our body as well as our soul… Nor can God’s people hold visible communion one with another, without the using of their bodies in it: We are therefore commanded, 1 Cor. 6:20, “Glorify God in your body, and in your spirit, which are God’s. And the reason for it is cogent, viz. Christ has redeemed the whole man; and indeed the body is necessarily the soul’s organ in the working of its imperate [commanded] acts in which all outward worship of God is to be performed by man; and therefore a pretense to a spiritual communion to exclude the other is Enthusiastical.

4. Hence that the body may be fit to discharge these duties aright, there is something to be done for it on that Day. The body has a dependence on means for the maintaining of the vigor and activity of it, whereby it may be fit to attend the service it is appointed to, without tiring, fainting or giving in: and it stands in need of this as well for Sabbath service, as for the business of this life; for we are to do these with our might, as well as the other: whatsoever is requisite for this, must be very proper for the Day…

5. And there are duties which we owe to our neighbor on the Sabbath, as well as at any other time. The duty of loving our neighbor as ourselves is an abiding duty, and uninterrupted: It is not only a Week Day duty, and to be omitted on the Sabbath; though that be to govern us in the right discharge of it: And he may, and very often does, stand in need of our affording it to him, not only for his soul, by counseling and instructing him in the things of God; but also in regard of his bodily and outward concerns, which are not in themselves the acts of worship, but of charity; but yet are not to be omitted, till this Day be over.

6. These duties are usually distributed into the works of necessity and mercy. It is true, the works of mercy here called for, are such as have a moral necessity on them, arising from the physical necessity of the subject, which makes it our duty, if we will not bring guilt of sin upon ourselves, to attend on: And the works of necessity here intended, may in a sense be called the works of mercy, because they succour the subject against that misery which they must otherwise undergo: But we look upon them under this distinct consideration. And then: (1.) Under the head of Necessity we rank two sorts, viz.

1. Such as are of Ordinary necessity or convenience. For we are not to think the Precept is here tied up to things absolutely necessary; as if nothing might be done, but what the creature could not subsist without, but such things as are needful, for the comfortable serving of God. …

2. Such as fall out Extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’ (2.) To quench fires that break forth, which otherwise would lay all waste before them. That is a sudden emergency, and was not to be seen before, and calls for speed and expedition, and the least hindrance will soon make all attempts too late, for miracles are not in this case to be expected. And hence any other thing of like importance, that falls out in the Day, and may not be delayed, comes within this verge. (2.) Under the head of mercy, these things more especially do come; (1.) To visit the sick. That is in itself a duty of Christians, appears in that it is referred to Pure Religion, James 1:27. And the reason of this is, because their necessity calls for it, and it is a work of mercy to do it, and to neglect it when needed is inhumane: and there are cases in which that will stand, Mt. 9:13, “I will have mercy, and not sacrifice.</p></blockquote>

d+for+man%E2%80%99s+good%2C+and+not+for+his+harm.+This+is+a+general+rule%2C+but+may+be+particularly+accommodated+with+due+caution.+Our+Savior+makes+use+of+it%2C+in+reflecting+upon+the+unjust+censures+of+the+Pharisees+cast+upon+his+disciples%2C+for+gathering+and+eating+ears+of+corn+on+the+Sabbath+Day%2C+Mk.+2%3A27%2C+%E2%80%9CAnd+He+said+unto+them%2C+The+Sabbath+was+made+for+man%2C+and+not+man+for+the+Sabbath.%E2%80%9D+It+was+indeed+to+advance+man%E2%80%99s+spiritual+interest%2C+in+giving+him+opportunity+to+sequester+himself+for+communion+with+God+in+the+way+of+mediate+worship%2C+but+was+never+intended+to+hurt+any+of+his+interests+in+this+world.+2.+That+as+there+are+duties+of+worship+to+be+performed+on+our+days%2C+so+there+are+duties+of+righteousness+to+be+done+on+God%E2%80%99s+Day.+These+duties%2C+though+they+differ+in+the+next+object+and+end%2C+the+one+belonging+to+the+First%2C+the+other+to+the+Second+Table%2C+yet+they+agree+on+the+ultimate+object+and+end%2C+which+is+God+and+his+glory%3B+for+this+as+well+as+that+is+to+be+done+in+obedience+to+Him%3B+and+when+they+are+so+done+sincerely%2C+we+have+communion+with+God+in+them%3A+The+one+belongs+to+our+duty+to+man%2C+but+it+is+in+order+of+serving+God%2C+and+so+they+do+not+necessarily+thwart+one+the+other%E2%80%A6+In+like+manner+there+are+Second+Table+duties+that+may+or+ought+to+be+done+on+Holy+Time%3B+and+are+either+stated+duties+of+the+Day%2C+or+are+occasionally+called+for+by+the+circumstances%3A+what+these+are+will+be+presently+considered.+3.+In+the+doing+of+the+duties+of+the+Sabbath%2C+we+are+to+employ+our+body+as+well+as+our+soul%E2%80%A6+Nor+can+God%E2%80%99s+people+hold+visible+communion+one+with+another%2C+without+the+using+of+their+bodies+in+it%3A+We+are+therefore+commanded%2C+1+Cor.+6%3A20%2C+%E2%80%9CGlorify+God+in+your+body%2C+and+in+your+spirit%2C+which+are+God%E2%80%99s.+And+the+reason+for+it+is+cogent%2C+viz.+Christ+has+redeemed+the+whole+man%3B+and+indeed+the+body+is+necessarily+the+soul%E2%80%99s+organ+in+the+working+of+its+imperate+%5Bcommanded%5D+acts+in+which+all+outward+worship+of+God+is+to+be+performed+by+man%3B+and+therefore+a+pretense+to+a+spiritual+communion+to+exclude+the+other+is+Enthusiastical.+4.+Hence+that+the+body+may+be+fit+to+discharge+these+duties+aright%2C+there+is+something+to+be+done+for+it+on+that+Day.+The+body+has+a+dependence+on+means+for+the+maintaining+of+the+vigor+and+activity+of+it%2C+whereby+it+may+be+fit+to+attend+the+service+it+is+appointed+to%2C+without+tiring%2C+fainting+or+giving+in%3A+and+it+stands+in+need+of+this+as+well+for+Sabbath+service%2C+as+for+the+business+of+this+life%3B+for+we+are+to+do+these+with+our+might%2C+as+well+as+the+other%3A+whatsoever+is+requisite+for+this%2C+must+be+very+proper+for+the+Day%E2%80%A6+5.+And+there+are+duties+which+we+owe+to+our+neighbor+on+the+Sabbath%2C+as+well+as+at+any+other+time.+The+duty+of+loving+our+neighbor+as+ourselves+is+an+abiding+duty%2C+and+uninterrupted%3A+It+is+not+only+a+Week+Day+duty%2C+and+to+be+omitted+on+the+Sabbath%3B+though+that+be+to+govern+us+in+the+right+discharge+of+it%3A+And+he+may%2C+and+very+often+does%2C+stand+in+need+of+our+affording+it+to+him%2C+not+only+for+his+soul%2C+by+counseling+and+instructing+him+in+the+things+of+God%3B+but+also+in+regard+of+his+bodily+and+outward+concerns%2C+which+are+not+in+themselves+the+acts+of+worship%2C+but+of+charity%3B+but+yet+are+not+to+be+omitted%2C+till+this+Day+be+over.+6.+These+duties+are+usually+distributed+into+the+works+of+necessity+and+mercy.+It+is+true%2C+the+works+of+mercy+here+called+for%2C+are+such+as+have+a+moral+necessity+on+them%2C+arising+from+the+physical+necessity+of+the+subject%2C+which+makes+it+our+duty%2C+if+we+will+not+bring+guilt+of+sin+upon+ourselves%2C+to+attend+on%3A+And+the+works+of+necessity+here+intended%2C+may+in+a+sense+be+called+the+works+of+mercy%2C+because+they+succour+the+subject+against+that+misery+which+they+must+otherwise+undergo%3A+But+we+look+upon+them+under+this+distinct+consideration.+And+then%3A+%281.%29+Under+the+head+of+Necessity+we+rank+two+sorts%2C+viz.+1.+Such+as+are+of+Ordinary+necessity+or+convenience.+For+we+are+not+to+think+the+Precept+is+here+tied+up+to+things+absolutely+necessary%3B+as+if+nothing+might+be+done%2C+but+what+the+creature+could+not+subsist+without%2C+but+such+things+as+are+needful%2C+for+the+comfortable+serving+of+God.+%E2%80%A6+2.+Such+as+fall+out+Extraordinarily%2C+or+on+special+occasions%2C+which+put+unavoidable+necessity+of+intermitting+the+proper+duties+of+the+Day%3B+and+if+we+do+not+attend+them%2C+we+shall+be+further+exposed.+And+of+this+sort+are%3A+%281.%29+To+fight+or+fly+from+an+invading+enemy%3A+if+not+to+be+aggressors+on+such+a+Day%2C+yet+to+stand+on+their+own+defense%2C+when+assaulted.+The+law+of+self-preservation+calls+for+it%2C+and+the+thing+itself+puts+by+duties+of+worship%2C+and+if+this+were+not+a+duty%2C+but+unlawful%2C+we+should+by+it+become+a+prey+to+them+that+hate+us.+And+as+to+flying%2C+when+oppressed+on+a+Sabbath+by+a+prevailing+foe%2C+against+whom+we+cannot+defend+ourselves%2C+our+Savior+supposes+it+lawful%2C+though+afflictive%2C+in+Mt.+24%3A20%2C+%E2%80%98Pray+that+your+flight+be+not+on+the+Sabbath+Day.%E2%80%99+%282.%29+To+quench+fires+that+break+forth%2C+which+otherwise+would+lay+all+waste+before+them.+That+is+a+sudden+emergency%2C+and+was+not+to+be+seen+before%2C+and+calls+for+speed+and+expedition%2C+and+the+least+hindrance+will+soon+make+all+attempts+too+late%2C+for+miracles+are+not+in+this+case+to+be+expected.+And+hence+any+other+thing+of+like+importance%2C+that+falls+out+in+the+Day%2C+and+may+not+be+delayed%2C+comes+within+this+verge.+%282.%29+Under+the+head+of+mercy%2C+these+things+more+especially+do+come%3B+%281.%29+To+visit+the+sick.+That+is+in+itself+a+duty+of+Christians%2C+appears+in+that+it+is+referred+to+Pure+Religion%2C+James+1%3A27.+And+the+reason+of+this+is%2C+because+their+necessity+calls+for+it%2C+and+it+is+a+work+of+mercy+to+do+it%2C+and+to+neglect+it+when+needed+is+inhumane%3A+and+there+are+cases+in+which+that+will+stand%2C+Mt.+9%3A13%2C+%E2%80%9CI+will+have+mercy%2C+and+not+sacrifice.%E2%80%9D%0A%0A%E2%80%94+Samuel+Willard%2C+A+Complete+Body+of+Divinity%2C+%E2%80%A6+%28Boston%2C+1726%29%2C+Sermon+172%2C+Q.+60%2C+pp.+584-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa27b0f61c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a27b0f61c7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=1.%20That%20we%20are%20to%20spend,will%20have%20mercy%2C%20and%20not%20sacrifice&amp;text=1.%20That%20we%20are%20to%20spend%20the%20whole&amp;text=9%3A13%2C%20%E2%80%9CI%20will%20have%20mercy%2C%20and%20not%20sacrifice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-599b291261" data-kw="">

<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>

<blockquote><p>Direction 13. Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. Truman’s book of Natural and Moral Imptency.</p></blockquote>

<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>

<blockquote><p>…the great rule of Gospel administrations is that all things be done to edification. This is the main end of the ministry itself, in all the duties thereof, that are purely evangelical. For this end was the office of the ministry instituted, for this end are ministerial gifts dispensed, for this end were the sacraments appointed, and all Church assemblies, Church power, and whatever else belongs to Churches; it is all ordained for this end that the Body of Christ may be edified and increased with the increase of God, Eph. 4:7-15; Col. 2:19; Acts 9:31; Rom. 14:15, 19; 1 Cor. 10:23; ch. 14:3-5; 12:26; 2 Cor. 12:19; 1 Tim. 1:4. The full and adaequate rule of all Church-order and duties is that all things be done to edification. It does not hence ensue that whatever men shall judge to conduce to edification, may be used by themselves or imposed on others in the worship of God. Christ Himself, the onely wise and competent Judge in such cases…</p></blockquote>

<blockquote><p>Thesis 12… If any work be done for any worldly gain, profit or livelihood, to acquire and purchase the things of this life by (which is the principal end of week-day labor, Eph. 4:28; 1 Thess. 4:12), this is a servile work, all one with what the commandment calls ‘thy work’. Hence buying, selling, sowing, reaping, which are done for worldly gain, are unlawful on this day, being therefore servile works… [Buying and selling not done for worldly gain would not then be a servile work or prohibited, if this might not be done before or after the Sabbath, per the following section.] hence also such works as are done only for the preservation of the creatures… to keep fire in the iron mills, to sit at stern and guide the ship, and a thousand such like actions (being not done properly for worldly gain) are not unlawful; God Himself not ceasing from works of preservation…</p></blockquote>

<blockquote><p>If the smelter in a foundry takes several days to reach its proper temperature, then it cannot be shut down every Lord’s day without shutting down the whole steel industry. Thus, at least a minimal crew is needed to keep the operation running through Sunday. But the benefits of steel for mankind (e.g., safer cars and buildings, the need for steel for the military) render it a necessity (wooden sailing ships would not have fared well against Japanese destroyers in the battles of the Pacific). Another example would be certain types of shipping. An oil tanker could not reach Japan from a port in Alaska in less than a week and thus would be in transit on the Sabbath (the shipping of oil is a necessity, since energy is needed for large populations to heat buildings and for generating electricity). God does not require people to deforest the countryside or freeze to death in order to keep the Sabbath. Power and electric utilities and telephone companies must maintain service on the Lord’s day. Hospitals, churches, homes, retirement communities and nursing homes need heat and electricity to preserve life and minister to the sick… The percentage of people working on the Lord’s day should be very small compared to those who work on a given week day. The vast majority of economic activities on the Sabbath in America are totally unnecessary and sinful (e.g., shopping malls, sporting events, restaurants, movie complexes, newspapers, retail outlets). Those industries which require sabbath labor should rotate staff…</p></blockquote>

<blockquote><p>The daring attack that is now made by some of the directors of the Edinburgh and Glasgow Railway on the law of God and the peace of our Scottish Sabbath – the blasphemous motion which they mean to propose to the shareholders in February next – and the wicked pamphlets which are now being circulated in thousands, full of all manner of lies and impieties- call loudly for the calm, deliberate testimony of all faithful ministers and private Christians in behalf of God’s holy day. … (1) The keeping open of Reading-Rooms – In this town, and in all the large towns of Scotland, I am told, you may find in the public reading-rooms many of our men of business turning over the newspapers and magazines at all hours of the Lord’s day… (2) The keeping open Public-Houses – Public-houses are the curse of Scotland. I never see a sign, “Licensed to sell spirits,” without thinking that it is a licence to ruin souls. (3) Sunday Trains upon the Railway – A majority of the directors of the Edinburgh and Glasgow Railway have shown their determination, in a manner that has shocked all good men, to open the railway on the Lord’s day.</p></blockquote>

<blockquote><p>The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)”

malink</a><a class="src" href="https://reformedbooksonline.com/what-does-keeping-the-lords-day-entail/#:~:text=The%20Puritan%20doctrine%20generally%20opposed%20the,the%20death%20penalty.%20%28Ibid.%20p.%20122&amp;text=The%20Puritan%20doctrine%20generally%20opposed%20the%20extreme%20strictness&amp;text=which%20incurs%20the%20death%20penalty.%20%28Ibid.%20p.%20122" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-80c55310f7" data-kw="">
<blockquote><p>Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, … (London: Kingstone, 1622), bk. 2, ch. 8, section 5, ‘Of the Spiritual Sanctification, &amp; the Outward Rest’, pp. 132-33</span></figcaption>

<blockquote><p>47. The rest of the day is to be spent in pious activity. Formerly there was an offering peculiar to the sabbath, but the continued or daily offering with its drink offering was not to be omitted, Num. 28:10.

48. Public worship, which is to be celebrated most solemnly, necessarily requires Scripture reading, meditation, prayer, holy discourse, and contemplation of the works of God wherein we may be more open to public worship and worship may become truly effective in us.</p></blockquote>

<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (London: Newman, 1675), 4th Commandment, Sanctification of, pp. 289-90</span></figcaption>

<blockquote><p>§20. For private duties, both personal and domestic, they are either antecedent or consequent to the solemn public worship, as usually for time it is celebrated amongst us. These consisting in the known religious exercises of prayer, reading the Scripture, meditation, family instructions from the advantage of the public ordinances, they are to be recommended unto every one’s conscience, ability, and opportunity, as they shall find strength and assistance for them.</p></blockquote>

<blockquote><p>2. The duties of worship to be attended by us on this Day, are either Natural or Instituted…

1. The duties of natural worship, are such as are suited to the nature of man and flow from the great end he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the end and usefulness of it…

2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity</cite>, … (Boston, 1726), Sermon 172, Q. 60, pp. 584-88</span></figcaption>

<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>

</figure><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>

<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>

<blockquote><p>XLVI. The FOURTH COMMANDMENT. Exod. 20.8, 9, 10, 11. Remember the Sabbath day to keep it holy, &amp;c.

</figure><figure class="quote" id="q-29c455e099" data-kw="">
<blockquote><p>Again, for worldly wealth men can toil and moil all the week long; and yet are they not weary; they think not the whole week long enough neither: But for the heavenly gain, for the spiritual thrift, we have but one day of seven, and we think that too much too: we think the day all too long, the labour all lost, and the whole time cast away, that we employ and spend to this purpose. We say as the same Jews at another time said, When will the new Moon be past; and the Sabbath once over? that we may return again unto our worldly affairs. Yea many among us have not the patience to tarry so long, but spend a great part of the Sabbath, that is God’s Market or Mart-day, for the getting of this spiritual gain, either about their worldly affairs, or their bodily delights.

The Sabbath day, I say, is God’s Market-day. And those that seek to take away the Sabbaths, attempt to put down God’s Markets, and so do the Devil good service, whatsoever their intent be. As frequenting of Markets maketh a rich man; so keeping of Sabbaths maketh a rich Christian. And as we count him a bad husband, that followeth game on the Market day: so may we as well count him a spiritual unthrift, that spendeth the Sabbath in that sort.

But may some say, when we have been at Church, and heard the Sermon and Service, is not Gods Market-day then done?

I answer: If the Sabbath be a day, then is it not so soon done. God’s Market lasteth all day long. Yea, grant the principal, because the public, of it be past: yet as Market-folks returning from Market will be talking of their Markets, as they go by the way, and bee casting up of their penny-worths, when they come home, reckon what they have taken, and what they have laid out, and how much they have gotten: So should we, after we have heard the Word publicly, confer privately of it with others; at least meditate on it by our selves, and be sure to take an account of our selves, how we have profited that day by the Word that hath been spoken unto us, and by other religious exercises that have been used of us. And as the Market-man counteth that but an evil Market-day, that he hath not gained somewhat on more or less: So may we well account it an evil Sabbath to us, whereon we have not profited somewhat, whereon we have not either increased our knowledge, or been bettered in affection; whereon we have not been further either informed in judgement, or reformed in practice, whereon we have added no whit at all to our talent.

To wind up all in a word. If we hold Godliness to be, as the Apostle here saith it is, a matter of Gain, and of great Gain, that which maketh Gain to be Gain, and without which Gain it selfe is no Gain indeed; that it bringeth all good with it to him that hath it; and that it never leaveth him, but abideth with him, and sticketh by him for ever: Oh let us labour then to get of it, and to grow more and more in it; let us endeavour to outgo one another in godliness; let us call our selves to a reckoning how we thrive or pare in it; let us not put it away for such trifles and toys as the world or the Devil shall tender unto us to bereave us of so precious a pearl; especially let us have a care of frequenting God’s Markets, of observing God’s Sabbaths, the principal means of increasing this spiritual wealth in us. So shall it come to pass that we shall have God to be our portion; we shall be heirs of his Kingdom, and coheirs with his Christ; we shall have all the good things both of this life, and the next assured unto us here, and the full fruition of them forever hereafter.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Again, for worldly wealth men can toil and moil all the week long; and yet are they not weary; they think not the whole week long enough neither: But for the heavenly gain, for the spiritual thrift, we have but one day of seven, and we think that too much too: we think the day all too long, the labour all lost, and the whole time cast away, that we employ and spend to this purpose. We say as the same Jews at another time said, When will the new Moon be past; and the Sabbath once over? that we may return again unto our worldly affairs. Yea many among us have not the patience to tarry so long, but spend a great part of the Sabbath, that is God’s Market or Mart-day, for the getting of this spiritual gain, either about their worldly affairs, or their bodily delights.

The Sabbath day, I say, is God’s Market-day. And those that seek to take away the Sabbaths, attempt to put down God’s Markets, and so do the Devil good service, whatsoever their intent be. As frequenting of Markets maketh a rich man; so keeping of Sabbaths maketh a rich Christian. And as we count him a bad husband, that followeth game on the Market day: so may we as well count him a spiritual unthrift, that spendeth the Sabbath in that sort.

But may some say, when we have been at Church, and heard the Sermon and Service, is not Gods Market-day then done?

I answer: If the Sabbath be a day, then is it not so soon done. God’s Market lasteth all day long. Yea, grant the principal, because the public, of it be past: yet as Market-folks returning from Market will be talking of their Markets, as they go by the way, and bee casting up of their penny-worths, when they come home, reckon what they have taken, and what they have laid out, and how much they have gotten: So should we, after we have heard the Word publicly, confer privately of it with others; at least meditate on it by our selves, and be sure to take an account of our selves, how we have profited that day by the Word that hath been spoken unto us, and by other religious exercises that have been used of us. And as the Market-man counteth that but an evil Market-day, that he hath not gained somewhat on more or less: So may we well account it an evil Sabbath to us, whereon we have not profited somewhat, whereon we have not either increased our knowledge, or been bettered in affection; whereon we have not been further either informed in judgement, or reformed in practice, whereon we have added no whit at all to our talent.

To wind up all in a word. If we hold Godliness to be, as the Apostle here saith it is, a matter of Gain, and of great Gain, that which maketh Gain to be Gain, and without which Gain it selfe is no Gain indeed; that it bringeth all good with it to him that hath it; and that it never leaveth him, but abideth with him, and sticketh by him for ever: Oh let us labour then to get of it, and to grow more and more in it; let us endeavour to outgo one another in godliness; let us call our selves to a reckoning how we thrive or pare in it; let us not put it away for such trifles and toys as the world or the Devil shall tender unto us to bereave us of so precious a pearl; especially let us have a care of frequenting God’s Markets, of observing God’s Sabbaths, the principal means of increasing this spiritual wealth in us. So shall it come to pass that we shall have God to be our portion; we shall be heirs of his Kingdom, and coheirs with his Christ; we shall have all the good things both of this life, and the next assured unto us here, and the full fruition of them forever hereafter.”

<blockquote><p>Or for the sins here forbidden:

Say first, hast thou not sometime spent the Lord’s day in idleness, or in worldly business, in vanities, or in sin? Secondly, hast thou not omitted publique duties, or comest in too late, or wentest out too soon? Thirdly, hast thou not on those days sold wares, carried burthens, brought in sheaves, or wrought in the harvest? Fourthly, hast thou not employed thy cattle, or servants, or children, or any other, though thou workest not thy self?

Fifthly, hast thou not profaned the Lord’s day, by needless works, words, or thoughts, about thy calling, or about thy recreation? Sixthly, have not the strict observance of the duties of that day been tedious unto thee, saying in thine heart, When will the day be gone? If in any of these thou hast transgressed, then hast thou broken this Commandment, Remember that thou keep holy the Sabbath day.</p></blockquote>

<blockquote><p>8. Does the fourth commandment require the observance of the seventh day of the week, or Saturday, as the Sabbath? No. It is of course true, as a matter of that the Old Testament Sabbath was on the seventh day of the week, but the fourth commandment does not require this. It commands diligent labour for six days, but does not specify on what day the week is to begin. The fourth commandment requires that the seventh day after six days of labour be observed as the Sabbath, but this does not imply that it must necessarily be on the seventh (or last) day of the week. The requirement of the commandment is met by the Christian practice of working from Monday through Saturday (six days) and then observing the first day of the foIlowing week as the Sabbath.

9. Why was the Old Testament Sabbath the seventh day of the week? The Old Testament Sabbath was the seventh (last) day of the week because of God’s example and ordinance at the time of the creation (Gen. 2:1-3). Apart from providing an appointed day for rest and worship, the Sabbath served as a reminder of God’s work of creation. This truth of creation, of course, implies that all things, including human beings, are absolutely dependent on God for their very existence. It also implies that human beings are morally responsible to God for their lives. Thus the weekly Sabbath, commemorating the creation, was calculated to serve as a continually repeated reminder of man’s dependence on God and his moral accountability to God, which is to say that the Sabbath was calculated to serve as a constant reminder of the very foundations of religion and morality.

10. Why is the Christian Sabbath on the first day of the week? The Christian Sabbath, or the Lord’s Day is on the first day of the week in remembrance of Christ’s resurrection from the dead. Thus it may he said that the Old Testament Sabbath commemorated God’s original creation, while the Christian Sabbath in addition calls attention to God’s new creation, his great work of redemption in Jesus Christ.

11. Who changed the day of the Sabbath from the seventh to the first day of the week? Our Lord Jesus Christ, by the accomplishment of his great redemptive work, brought about the close of the Old Testament dispensation and the opening of the New Testament dispensation of the covenant of grace. The change from the seventh to the first day of the week is a part of this change of dispensation. It has been observed that our Saviour was crucified on the sixth day of the week, and buried on the evening of the sixth day, and remained in the tomb the whole of the seventh day, and arose from the dead on the first day of the week. Thus Christ buried the Old Testament seventh day Sabbath in the tomb with himself; and left it there, and when he arose he brought with him the New Testament Sabbath, which is to he observed on the first day of the week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 323-24.</span></figcaption>

<blockquote><p>Honest recreation: a thing that fitteth us for the service of God, and of every good duty; as Shooting, Music, putting forth of Riddles, and the like: for these the Word of God doth by name speak of. So David, 2. Sam. 1. 18. to teach the children of Judah to handle the Bow, uttered that Lamentation which is there extant of Saul and Jonathan. And himself, by the sweetness of his Music, refreshed the troubled heart of Saul, 1. Sam. 16. 24. Of the other we have an Example in the Riddle put forth by SAMSON, Judges 14. 14. Out of the eater came meat, and out of the strong came sweetness. The contrary whereof is, first, the dulling of our selves by a continual wearying of the mind and body, without intermission.</p></blockquote>

<blockquote><p>This fourth command, which is about the time of more solemn worship, is, explicated 1. generally, vers. 8. Remember, &amp;c. 2. special, vers. 9, 10. that this is the seventh, or one of seven; whereunto is adjoined the duty about keeping this day. This duty consists of two parts, to wit, of rest, and of the Sanctification of that rest: the rest is a ceasing from all our works; and is illustrated from its causes, by a distribution; neither thou, nor thy son, &amp;c. The sanctifying of this rest is consecrating, or holy application of it to God’s worship.

And this sentence is not only proposed, but also confirmed, and that with a double reason; whereof 1. Is taken from a tacit comparison of the greater. God hath promised us six days for our works; and therefore by very good right and reason, he may challenge the seventh to himself, to be consecrated to his worship. [2.] Reason is taken from the exemplar cause, because God by his own example of resting on the seventh day, went before us, as it were to give us a copy to follow. 3, Reason is from the efficient, that is, God’s institution or appointment which consisteth of two parts; sanctifying of it, and blessing it. The sanctifying of it, was the separating of this day from a worldly use to an holy. The blessing of it, was the promise to bless them, that rightly bless this day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXXVIII, pp 229-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-3e878b279c" data-kw="">
<blockquote><p>As altered from the seventh to the first day of the week, the Sabbath should be kept by us, as we are enjoined to do so in the fourth commandment.

That precept requires us to devote one day in seven unto God; by abstaining “even from such worldy employments and recreations, as are lawful on other days, and spending the whole time in the public and private exercises of God’s worship, except so much as it to be taken upon in the works of necessity and mercy.” It is not disputed that the fourth commandment once required this, it is, however, denied that we are now bound to keep the Sabbath, with all the strictness which it enjoins.

To those who advocate a relaxed mode of observing the Sabbath, we reply; the fourth commandment was given by God, – it was once the duty of men to keep the Sabbath as required by that precept, – it is incumbent upon them to do so still – unless it can be shewn that it has been annulled or modified by divine authority. No such inference can be drawn from our spiritual necessities. Are not our hearts as carnal as were those of the Jews?

Are not our employments as secularizing? Had not they many other days, besides Sabbath, that were set apart for public worship, while we have no other? And have not we then as much need as they had, to spend one whole seventh part of our time in the public and private exercises of God’s worship? And are we not under stronger obligations to give a whole seventh of our time unto God, than the Jews were? Our privileges are greater than theirs, and shall our homage, therefore, be less?

The economy under which we live, is more spiritual than theirs, and we will not believe it, until we are expressly told so by God, that our Sabbaths should be less sacred. It is true, that there is no precept in the New Testament, that commands us to keep the Sabbath as strictly as we are required by the fourth commandment; but we must remember, that after a law is once enacted, it continues to bind unless it is repealed, although it be not enacted a second time; and, therefore, unless we can shew that the fourth commandment has been repealed, it is still binding upon us, although no similar law be found in the New Testament.

It is also true, that the Mosaical economy has come to an end, and abolished such things as were commanded only in the judicial or ceremonial law. The fourth commandment, however, has not its place in either of these laws, but in that law which was written by the finger of God upon the tables of stone. This law, the abrogation of the Mosaical economy did not affect; amid all that it swept away, it left every one of its precepts remaining.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 15-16.</span></figcaption>

<blockquote><p>Q. What is the fourth Commandment?

A. Remember, &amp;c.

Q. What is the general meaning of the 4. Commandment?

2 A. The general meaning of the fourth Commandment, is that solemn times of worship, necessary to Religion at God’s own appointment, and chiefly a standing day in the week, free from worldly business to attend on God.

Is it not the solemn times of worship, necessary to Religion, at God’s own appointment, and chiefly, a standing day in the week, of rest from worldly business to attend on God?

Yes.

Or, May men of themselves appoint any days or times, as necessary to Religion?

No.

Or, May we unnecessarily spend God’s Day upon our selves?

No.

Or, Upon any worldly matters?

No.</p></blockquote>

<blockquote><p>Q. Which is the fourth Commandment?

A. Remember the Sabbath day, &amp;c.

Q. What is the general duty here required?

A. That the whole Sabbath or Lord’s day be set apart from all common use, as holy to the Lord, both publicly and privately in the practise of the duties of necessity, holiness, and mercy.

Expos. 11. In this commandment it is enjoined, that we finish all our worldly business in six days, Deu. 5. 13. and that we rise betimes in the morning upon the Sabbath, Mark. 1. 35. compared with ver. 38. 39. Exod. 32. 5, 6. Psal. 92. 2. and prepare our selves for the public congregation, by prayer, meditation, thanksgiving, and examination of our hearts, Eccles. 4. 17. Psal. 93. 5. 2. Tim. 2. 19. going about the works of mercy, and instant necessity with heavenly minds, Matth. 12. 1. &amp;c. Luk. 13. 15.

It is also required that we join with the people of God in the public congregation, hearing the word read and preached, calling upon God’s name, receiving the Sacraments, praising God for his mercies, singing of Psalms, 2. King. 4. 23. Act. 13. 14, 15. 44. and 15. 21. and 16. 13. and 17. 2. and 20. 7. In which exercises we must be all the while attentive, Act. 16. 14. reverent, Esa. 66. 2. &amp; eager to get good, Psa. 42. 1, 2. not departing till the blessing bee pronounced, Ezec. 46. 1, 2. 10. Act. 10. 33. 1. Cor. 14. 16. After the whole day is to be spent with delight, and cheerfulness in religious meditation, reading and conference, and the works of necessity and mercy, Esa. 58. 13. 14. Act. 17. 11. Psal. 1. 2. Luk. 24. 14. 17. 1. Cor. 16. 2.

Q. What is the general sin there forbidden?

A. All neglecting of the duties of that time, or profaning of that day in whole or in part, by needless works, words, or thoughts, about our callings or recreations.

Expos. 12. Here is forbidden idleness or a negligent omission of any duty required, either in whole or in part, for matter or manner: as sleeping out of the Sabbath in the morning, sleight preparing our selves for the public assembly, absence from it, coming late, sleeping there, staring about, going forth before the blessing, misapplying the word. Mat. 20. 6. Act. 20. 9.

13. All profanation of the Sabbath, or any moment of that precious time, with worldly cares, words, or business, is condemned also, Esa. 58. 13. as travailing journeys, Exod. 16. 29. 30. keeping fairs, Neh. 13. 15, 16, 17. labouring in seed-time and harvest, Exod. 34. 21. going on trifling errands, &amp;c. vain recreations, as bowling, shooting, hunting, stool-ball, &amp;c. on this day are unlawful.

Q. Which day is to be set apart as holy to the Lord?

A. It is moral and perpetual to keep one day in seven as holy: from the creation to the resurrection of Christ, the seventh day was instituted: after Christ his resurrection, the first day of the week was ordained, and is to be kept for ever.

14. The work of our redemption is the greatest work that ever was, Joh. 3. 16. and by Christ his resurrection from the dead, a new creation was as it were finished: wherefore seeing that he rose again the first day, it was (as divines agree) meet the Sabbath should be changed to the first day. Act. 20. 7. 1. Cor. 16. 2.</p></blockquote>

<blockquote><p>The fourth commandment is this: Remember that thou keep holy the Sabbath day. Six days shalt thou labour and doe all that thou hast to do. But the seventh day is the Sabbath of the Lord thy God, in it thou shalt doe no manner of work, thou nor thy son, nor thy daughter, thy manservant, nor thy maidservant, the cattle nor the stranger that is within thy gates. For in six days the Lord made heaven and earth, the sea and all that in them is, and rested the seventh day, wherefore the Lord blessed the Sabbath day, and hallowed it.

The sanctification of the Sabbath day is the appointing of an holy day to the public worship of God: or else it is to bestow a day in holy works and exercises. There are four parts of the sanctification of the Sabbath the handling of God’s word, the using of the Sacraments public calling on God by prayer, and the exercising of the works of mercy.

God for two causes would have a certain time appointed for the ministry of the Church.

Now we are not bound to the seventh day: for Christ by his coming hath abolished the ceremonies of Moses.</p></blockquote>

<blockquote><p>God hath made us for mutual society; He hath made us so that continual strain on body or mind without recreation is destructive to our health and usefulness. No enlightened conscience will see any inconsistency between healthful and happy recreation, on the one hand, and glorifying God, on the other. These very recreations, and whatsoever he doeth, the enlarged and free-hearted believer can do — to the glory of God.

Only let this principle really rule, — ‘How may I best and to the utmost degree glorify God?’ — and all narrow, creeping, bondage-ridden questions, and all symptoms of a timid, hampered, unmanly, faltering, unfree walk with God, will disappear. And without a free, holy, cordial, open, ingenuous walk with God, all minute and accurate and verbal and mechanical rules might most mechanically and accurately and minutely be observed, but the soul of man be not any more trained to the exalted dignity of a free companionship and unfettered friendship with Heaven.</p></blockquote>

<blockquote><p>The fourth commandment enjoins the sanctification of the sabbath, which is done both by the pastors and by the flock. The pastors sanctify it by the preaching of sound doctrine — by the due administration of the sacraments — by the offering up of public prayers — by the pure and affectionate visitation of the flock committed to them. The people sanctify it by the attentive hearing of the word by public and private prayer — by reading and meditating on the sacred scriptures — by works of love by mutual exhortations — by ceasing from their ordinary and worldly occupations.

Those works are excepted, which have an immediate reference to the worship and glory of God; also works of charity and mercy, and therefore the Pharisees falsely accused Christ for healing the sick on this day; also works of necessity, imposed on us by Providence, such as preparing food, kindling fire, or defending ourselves against the attack of enemies.. We must observe further, that in this fourth commandment there is something ceremonial and something moral; the ceremonial part is the consecration of the seventh day to God, the moral is the consecration of some part of time to God; for it is a part of divine worship, to worship God in the public assemblies or congregations, which cannot be done, unless the time of meeting be agreed upon by the worshippers.

The Jews, on the sabbath day did not dare to gather the manna, to cut wood, to kindle a fire, to bake, or to seethe, &amp;c. &amp;,c. (Exod. xvi. 29. Numb. xv. 32. Exod. xxxv. 8; xvi. 23;) nay, some of the Pharisees carried their scruples so far, as not to dare even to roast an apple, to peel garlick, or to kill a gnat. Observe also, that the sabbath was a sign of the covenant between God and the Israelites, (Exod. xxxi, 13. Ezek. xx.12,) and that it shadowed forth that twofold rest of believers which they obtain in Christ; viz. their spiritual rest, which consists both in peace of conscience, and ceasing from evil works, and their heavenly rest, in which they shall be free from all their troubles, and from all sin.

Lastly, let it be observed that the [Jewish] sabbath was abolished, with other ceremonies of the law, and in the place of it succeeded the Lord’s day; which the apostles did not expressly command, but which they observed; whose example therefore the church is bound to imitate, although one day is not in itself holier than another. A more suitable day could not have been selected, than the Lord’s day, on which Christ the Redeemer of the world arose from the dead, having completed the work of our redemption; and on which the Holy Spirit was poured out upon the apostles.</p></blockquote>

</figure><figure class="quote" id="q-1602ae4fbd" data-kw="">
<blockquote><p>Remember the Lords-day-Sabbath, the first day of the week, (unto which the seventh-day-Sabbath was translated by the Authority of Christ as appears by the after observation of that day by the Apostles and Apostolical Churches,) to keep it holy. This is the Princess and Queen of all days, This is the Glory of all the week. For, As on this day our blessed Saviour Rose from the dead triumphing victoriously over Death, Grave, Sin, and all our Spiritual Enemies: and thereby assured us of our Spiritual and Corporeal Resurrection by him. As on this day our Saviour vouchsafed many of his apparitions to his Disciples, instructing them and giving them commandments concerning the Kingdom of God. On this day the Holy Ghost was most miraculously poured forth upon the Apostles. On this day the Apostles and primitive Churches held their solemn Assemblies for the public worship of God.

This is the solemn Mart, and Market day for furnishing our Souls with all manner of Spiritual and Heavenly Provisions. This is that Solemn Season and sweet opportunity which Christ hath afforded and ordained for acquainting us with Himself and the Mysteries of his Kingdom, for maintaining our Communion with him in his Ordinances, for edifying and perfecting of us in all Spirituals. And as in the time of the Old Testament, The Sacrifices of the Sabbath-day were to be double to those on the week day: So our Spiritual Sacrifices on the Lords-days are to be twice so much as on any other day of the week; Especially, in Prayer and thanksgiving; in Reading the Scriptures, in Hearing the word preached, in Partaking the Lords Supper, in Catechizing, in Shewing Mercy to the poor, &amp;c. that so the sacred tincture and impressions of this day may remain fresh and lively upon your hearts all the week following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Tree of Life, or, The Natural Man Directed unto Christ (London, 1673), epistolary exhortation.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-82f0725e3b" data-kw="">
<blockquote><p>We must observe the sabbath as holy time; holy, yet not by constitution, not essentially holy, as Christ is holy; nor inherently, as the saints are holy; but holy by institution, by sanction, relatively holy. “The Lord blessed the sabbath-day, and hallowed it;” [Exod. xx. 11;] that is, he set it apart for holy uses: “Keep the sabbath-day to sanctify it.” (Deut. v. 12.) Nothing but holy things must be done in this holy time, – praying, reading, hearing, singing of psalms, &amp;c., (as Psalm xcii., which is both a precept and platform for sabbath sanctification,) meditation, rejoicing in God, and thanksgiving, as you may read at large.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>Evan. In this commandment the Lord forbiddeth idleness or sleeping more on the Lord’s day in the morning, than is of necessity, (Matt 20:6); and he also forbiddeth us to labour in our particular callings, (Exo 16:28-30); and he also forbiddeth us to talk about our worldly affairs and business on that day, (Amos 8:5, Isa 58:13); and he also forbiddeth us to travel any journey about our worldly business on that day, (Matt 24:20); or keep any fairs or markest on that day, (Neh 13:16,17); or to labour in seed time and harvest on that day. In a word, the Lord on that day forbiddeth all worldly works and labours, except works of mercy and instant necessity, which were mentioned before. And thus have I also declared, both what the Lord requires and what he forbids in the fourth commandment.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Evan. In this commandment the Lord forbiddeth idleness or sleeping more on the Lord’s day in the morning, than is of necessity, (Matt 20:6); and he also forbiddeth us to labour in our particular callings, (Exo 16:28-30); and he also forbiddeth us to talk about our worldly affairs and business on that day, (Amos 8:5, Isa 58:13); and he also forbiddeth us to travel any journey about our worldly business on that day, (Matt 24:20); or keep any fairs or markest on that day, (Neh 13:16,17); or to labour in seed time and harvest on that day. In a word, the Lord on that day forbiddeth all worldly works and labours, except works of mercy and instant necessity, which were mentioned before. And thus have I also declared, both what the Lord requires and what he forbids in the fourth commandment.”

— Edward Fisher, The Marrow of Modern Divinity, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 418-19.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvan.+In+this+commandment+the+Lord+forbiddeth+idleness+or+sleeping+more+on+the+Lord%E2%80%99s+day+in+the+morning%2C+than+is+of+necessity%2C+%28Matt+20%3A6%29%3B+and+he+also+forbiddeth+us+to+labour+in+our+particular+callings%2C+%28Exo+16%3A28-30%29%3B+and+he+also+forbiddeth+us+to+talk+about+our+worldly+affairs+and+business+on+that+day%2C+%28Amos+8%3A5%2C+Isa+58%3A13%29%3B+and+he+also+forbiddeth+us+to+travel+any+journey+about+our+worldly+business+on+that+day%2C+%28Matt+24%3A20%29%3B+or+keep+any+fairs+or+markest+on+that+day%2C+%28Neh+13%3A16%2C17%29%3B+or+to+labour+in+seed+time+and+harvest+on+that+day.+In+a+word%2C+the+Lord+on+that+day+forbiddeth+all+worldly+works+and+labours%2C+except+works+of+mercy+and+instant+necessity%2C+which+were+mentioned+before.+And+thus+have+I+also+declared%2C+both+what+the+Lord+requires+and+what+he+forbids+in+the+fourth+commandment.%E2%80%9D%0A%0A%E2%80%94+Edward+Fisher%2C+The+Marrow+of+Modern+Divinity%2C+%281646%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+vii%2C+418-19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1bcd90cc75.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1bcd90cc75.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/11/11/edward-fisher-the-sins-forbidden-in-the-fourth-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Qu. What is the fourth Commandment?

A. Remember that thou keep holy the Sabbath day, &amp;c.

Q. What is the meaning of this Commandment?

A. That we should rest from labour and much more from play on the Lord’s day, that we may draw nigh to God in holy duties.</p></blockquote>
